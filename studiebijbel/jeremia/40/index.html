}},"vertalingen":{"SVnu":{"1":"Het woord dat van de HEERE gebeurd is tot Jeremia, nadat Nebuzaradan, de aanvoerder van de lijfwacht, hem had laten gaan van Rama; toen hij hem had laten halen, terwijl hij met ketenen gebonden was in het midden van alle gevangenen van Jeruzalem en Juda, die naar Babel gevankelijk werden weggevoerd.","2":"Want de aanvoerder van de lijfwacht liet Jeremia halen, en zei tegen hem: De HEERE, uw God, heeft dit kwaad over deze plaats gesproken.","3":"En de HEERE heeft het doen komen, en gedaan zoals Hij gesproken had; want u hebt gezondigd tegen de HEERE, en Zijn stem niet gehoorzaamd; daarom is u deze zaak gebeurd.","4":"Nu dan, zie, ik heb u vandaag losgemaakt van de ketenen die aan uw hand waren; als het goed is in uw ogen om met mij naar Babel te komen, kom dan, en ik zal mijn oog op u stellen; maar als het kwaad is in uw ogen om met mij naar Babel te komen, laat het dan; zie, het hele land is voor uw aangezicht; waarheen het goed en recht in uw ogen is te gaan, ga daar.","5":"En omdat hij nog niet zal terugkeren, keer u dan terug tot Gedalia, de zoon van Ahikam, de zoon van Safan, die de koning van Babel over de steden van Juda aangesteld heeft; en woon bij hem in het midden van het volk; of ga overal waar het in uw ogen recht is te gaan. En de aanvoerder van de lijfwacht gaf hem reiskost en een geschenk, en liet hem gaan.","6":"Zo kwam Jeremia tot Gedalia, de zoon van Ahikam, te Mizpa; en hij woonde bij hem in het midden van het volk, dat in het land overgebleven was.","7":"Toen nu alle aanvoerders van de legers die in het veld waren, zij en hun mannen, hoorden dat de koning van Babel Gedalia, de zoon van Ahikam, over het land aangesteld had, en dat hij aan hem had toevertrouwd de mannen, en de vrouwen, en de kinderen, en de armsten van het land, van hen die niet naar Babel gevankelijk waren weggevoerd,","8":"kwamen zij tot Gedalia te Mizpa, namelijk Ismaël, de zoon van Nethanja, en Johanan en Jonathan, de zonen van Kareah, en Seraja, de zoon van Tanhumeth, en de zonen van Efai, de Netofathiet, en Jezanja, de zoon van een Maachathiet, zij en hun mannen.","9":"En Gedalia, de zoon van Ahikam, de zoon van Safan, zwoer hun en hun mannen, en zei: Wees niet bang om de Chaldeeën te dienen; blijf in het land, en dien de koning van Babel, dan zal het u goed gaan.","10":"En zie, ik woon te Mizpa, om voor de Chaldeeën te staan die tot ons zullen komen; verzamel u dan wijn, en zomervruchten, en olie, en doe ze in uw vaten, en woon in uw steden die u hebt ingenomen.","11":"Toen ook alle Joden die in Moab, en onder de kinderen van Ammon, en in Edom, en die in al die landen waren, hoorden dat de koning van Babel in Juda een overblijfsel gelaten had; en dat hij Gedalia, de zoon van Ahikam, de zoon van Safan, over hen aangesteld had,","12":"keerden alle Joden terug uit alle plaatsen waarheen zij verdreven waren, en kwamen in het land van Juda tot Gedalia te Mizpa; en zij verzamelden zeer veel wijn en zomervruchten.","13":"Doch Johanan, de zoon van Kareah, en alle aanvoerders van de legers die in het veld waren, kwamen tot Gedalia te Mizpa,","14":"en zeiden tegen hem: Weet u wel dat Baälis, de koning van de kinderen van Ammon, Ismaël, de zoon van Nethanja, uitgezonden heeft om u om het leven te brengen? Maar Gedalia, de zoon van Ahikam, geloofde hen niet.","15":"Johanan echter, de zoon van Kareah, sprak in het verborgene tot Gedalia, te Mizpa, en zei: Laat mij toch heengaan, en Ismaël, de zoon van Nethanja, doden, en niemand zal het weten; waarom zou hij u om het leven brengen, en heel Juda, dat tot u vergaderd is, verstrooid worden, en het overblijfsel van Juda verloren gaan?","16":"Maar Gedalia, de zoon van Ahikam, zei tegen Johanan, de zoon van Kareah: Doe deze zaak niet, want u spreekt vals over Ismaël."},"SV":{"1":"Het woord, dat van den HEERE geschied is tot Jeremia, nadat Nebuzaradan, de overste der trawanten, hem had laten gaan van Rama; als hij hem had laten halen, daar hij met ketenen gebonden was in het midden aller gevangenen van Jeruzalem en Juda, die naar Babel gevankelijk werden weggevoerd.","2":"Want de overste der trawanten liet Jeremia halen, en zeide tot hem: De HEERE, uw God, heeft dit kwaad over deze plaats gesproken.","3":"En de HEERE heeft het doen komen, en gedaan, gelijk als Hij gesproken had; want gijlieden hebt gezondigd tegen den HEERE, en Zijner stem niet gehoorzaamd; daarom is ulieden deze zaak geschied.","4":"Nu dan, zie, ik heb u heden losgemaakt van de ketenen, die aan uw hand waren; indien het goed is in uw ogen met mij naar Babel te komen, zo kom, en ik zal mijn oog op u stellen; maar indien het kwaad is in uw ogen met mij naar Babel te komen, zo laat het; zie, het ganse land is voor uw aangezicht, waarhenen het goed en recht in uw ogen is te gaan, ga daar.","5":"En dewijl hij nog niet zal wederkeren, zo keer gij tot Gedalia, den zoon van Ahikam, den zoon van Safan, dien de koning van Babel over de steden van Juda gesteld heeft; en woon bij hem in het midden des volks; of overal, waar het in uw ogen recht is te gaan, ga er henen. En de overste der trawanten gaf hem reiskost en een geschenk, en liet hem gaan.","6":"Alzo kwam Jeremia tot Gedalia, den zoon van Ahikam, te Mizpa; en hij woonde bij hem in het midden des volks, die in het land waren overgelaten.","7":"Toen nu alle oversten der heiren, die in het veld waren, zij en hun mannen, hoorden, dat de koning van Babel Gedalia, den zoon van Ahikam, over het land gesteld had, en dat hij aan hem bevolen had de mannen, en de vrouwen, en de kinderkens, en van de armsten des lands, van degenen, die niet naar Babel gevankelijk waren weggevoerd;","8":"Zo kwamen zij tot Gedalia te Mizpa, namelijk, Ismaël, de zoon van Nethanja, en Johanan en Jonathan, de zonen van Kareah, en Seraja, de zoon van Tanhumeth, en de zonen van Efai, den Netofathiet, en Jezanja, de zoon eens Maachathiets, zij en hun mannen.","9":"En Gedalia, de zoon van Ahikam, den zoon van Safan, zwoer hun en hun mannen, zeggende: Vreest niet van de Chaldeen te dienen; blijft in het land, en dient den koning van Babel, zo zal het u welgaan.","10":"En ziet, ik woon te Mizpa, om te staan voor het aangezicht der Chaldeen, die tot ons zullen komen; gijlieden dan verzamelt wijn, en zomervruchten, en olie, en doet ze in uw vaten, en woont in uw steden, die gij hebt ingenomen.","11":"Als ook al de Joden, die in Moab, en onder de kinderen Ammons, en in Edom, en die in al die landen waren, hoorden, dat de koning van Babel in Juda een overblijfsel gelaten had; en dat hij Gedalia, den zoon van Ahikam, den zoon van Safan, over hen gesteld had;","12":"Zo keerden al de Joden weder uit al de plaatsen, waarhenen zij gedreven waren, en kwamen in het land van Juda tot Gedalia te Mizpa; en zij verzamelden zeer veel wijns en zomervruchten.","13":"Doch Johanan, de zoon van Kareah, en alle oversten der heiren, die in het veld waren, kwamen tot Gedalia te Mizpa;","14":"En zeiden tot hem: Weet gij wel, dat Baälis, de koning der kinderen Ammons, Ismaël, den zoon van Nethanja, uitgezonden heeft, om u aan het leven te slaan? Maar Gedalia, de zoon van Ahikam, geloofde hen niet.","15":"Johanan nochtans, de zoon van Kareah, sprak tot Gedalia, in het verborgene, te Mizpa, zeggende: Laat mij toch henengaan, en Ismaël, den zoon van Nethanja, slaan, en niemand zal het weten; waarom zou hij u aan het leven slaan, en gans Juda, die tot u vergaderd zijn, verstrooid worden, en het overblijfsel van Juda verloren gaan?","16":"Maar Gedalia, de zoon van Ahikam, zeide tot Johanan, den zoon van Kareah: Doe deze zaak niet, want gij spreekt vals van Ismaël."},"KJV":{"1":"The word that came to Jeremiah from the LORD, after that Nebuzaradan the captain of the guard had let him go from Ramah, when he had taken him being bound in chains among all that were carried away captive of Jerusalem and Judah, which were carried away captive unto Babylon.","2":"And the captain of the guard took Jeremiah, and said unto him, The LORD thy God hath pronounced this evil upon this place.","3":"Now the LORD hath brought *it*, and done according as he hath said: because ye have sinned against the LORD, and have not obeyed his voice, therefore this thing","4":"And now, behold, I loose thee this day from the chains which *were* upon thine hand. If it seem good unto thee to come with me into Babylon, come; and I will look well unto thee: but if it seem ill unto thee to come with me into Babylon, forbear: behold, all the land *is* before thee: whither it seemeth good and convenient for thee to go, thither go.","5":"Now while he was not yet gone back, *he said*, Go back also to Gedaliah the son of Ahikam the son of Shaphan, whom the king of Babylon hath made governor over the cities of Judah, and dwell with him among the people: or go wheresoever it seemeth convenient unto thee to go. So the captain of the guard gave him victuals and a reward, and let him go.","6":"Then went Jeremiah unto Gedaliah the son of Ahikam to Mizpah; and dwelt with him among the people that were left in the land.","7":"Now when all the captains of the forces which *were* in the fields, *even* they and their men, heard that the king of Babylon had made Gedaliah the son of Ahikam governor in the land, and had committed unto him men, and women, and children, and of the poor of the land, of them that were not carried away captive to Babylon;","8":"Then they came to Gedaliah to Mizpah, even Ishmael the son of Nethaniah, and Johanan and Jonathan the sons of Kareah, and Seraiah the son of Tanhumeth, and the sons of Ephai the Netophathite, and Jezaniah the son of a Maachathite, they and their men.","9":"And Gedaliah the son of Ahikam the son of Shaphan sware unto them and to their men, saying, Fear not to serve the Chaldeans: dwell in the land, and serve the king of Babylon, and it shall be well","10":"As for me, behold, I will dwell at Mizpah to serve the Chaldeans, which will come unto us: but ye, gather ye wine, and summer fruits, and oil, and put *them* in your vessels, and dwell in your cities that ye have taken.","11":"Likewise when all the Jews that *were* in Moab, and among the Ammonites, and in Edom, and that *were* in all the countries, heard that the king of Babylon had left a remnant of Judah, and that he had set over them Gedaliah the son of Ahikam the son of Shaphan;","12":"Even all the Jews returned out of all places whither they were driven, and came to the land of Judah, to Gedaliah, unto Mizpah, and gathered wine and summer fruits very much.","13":"Moreover Johanan the son of Kareah, and all the captains of the forces that *were* in the fields, came to Gedaliah to Mizpah,","14":"And said unto him, Dost thou certainly know that Baalis the king of the Ammonites hath sent Ishmael the son of Nethaniah to slay thee? But Gedaliah the son of Ahikam believed","15":"Then Johanan the son of Kareah spake to Gedaliah in Mizpah secretly, saying, Let me go, I pray thee, and I will slay Ishmael the son of Nethaniah, and no man shall know *it*: wherefore should he slay thee, that all the Jews which are gathered unto thee should be scattered, and the remnant in Judah perish?","16":"But Gedaliah the son of Ahikam said unto Johanan the son of Kareah, Thou shalt not do this thing: for thou speakest falsely of Ishmael."}},"tsk":{"1":[{"kopje":"nadat","refs":["Jer 39:11-14"]},{"kopje":"Rama","refs":["Jer 31:15","Joz 18:25","1 Sam 7:17"]},{"kopje":"gebonden","refs":["Ps 68:7","Ps 107:16","Hand 12:6","Hand 12:7","Hand 21:13","Hand 28:20","Ef 6:20"]}],"2":[{"kopje":"De HEERE","refs":["Jer 22:8","Jer 22:9","Deut 29:24-28","1 Kon 9:8","1 Kon 9:9","2 Kron 7:20-22","Klaagl 2:15-17"]}],"3":[{"kopje":"want","refs":["Jer 50:7","Neh 9:28","Neh 9:33","Dan 9:11","Dan 9:12","Rom 2:5","Rom 3:19"]}],"5":[{"kopje":"keer u dan terug","refs":["Jer 39:14","Jer 41:2","2 Kon 25:22-24"]},{"kopje":"Ahikam","refs":["Jer 26:24","2 Kon 22:12","2 Kon 22:14","2 Kron 34:20"]},{"kopje":"of ga","refs":["Jer 40:4","Jer 15:11","Ezra 7:6","Ezra 7:27","Neh 1:11","N " data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard</span> had let him <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> from <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span> when he had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> him being <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> in <span class=\"wl wl-kjv\" data-code=\"H246\">chains</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> all that were carried away <span class=\"wl wl-kjv\" data-code=\"H1546\">captive</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> which were carried away <span class=\"wl wl-kjv\" data-code=\"H1540\">captive</span> unto Babylon.","2":"And the <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">pronounced</span> this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon this place.","3":"Now the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it, and <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> according as he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">said:</span> because ye have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and have not <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> therefore this thing","4":"And now, behold, I <span class=\"wl wl-kjv\" data-code=\"H6605\">loose</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from the <span class=\"wl wl-kjv\" data-code=\"H246\">chains</span> which were upon thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span> If it seem <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto thee to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> with me into <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come;</span> and I will look <span class=\"wl wl-kjv\" data-code=\"H7760\">well</span> unto thee: but if it seem <span class=\"wl wl-kjv\" data-code=\"H7489\">ill</span> unto thee to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> with me into <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> <span class=\"wl wl-kjv\" data-code=\"H2308\">forbear:</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">behold,</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee: whither it <span class=\"wl wl-kjv\" data-code=\"H413\">seemeth</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and <span class=\"wl wl-kjv\" data-code=\"H3477\">convenient</span> for thee to <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> thither go.","5":"Now while he was not yet gone <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> he said, Go <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> also to <span class=\"wl wl-kjv\" data-code=\"H1436\">Gedaliah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H296\">Ahikam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan,</span> whom the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-cod \"H4709\">Mizpah</span> <span class=\"wl wl-kjv\" data-code=\"H5643\">secretly,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Let me <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> I pray thee, and I will <span class=\"wl wl-kjv\" data-code=\"H5221\">slay</span> <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5418\">Nethaniah,</span> and no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> it: wherefore should he <span class=\"wl wl-kjv\" data-code=\"H5221\">slay</span> thee, that all the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> which are <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> unto thee should be <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> perish?","16":"But <span class=\"wl wl-kjv\" data-code=\"H1436\">Gedaliah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H296\">Ahikam</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3110\">Johanan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7143\">Kareah,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing:</span> for thou <span class=\"wl wl-kjv\" data-code=\"H1696\">speakest</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">falsely</span> of Ishmael."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;

    if (engels && engels.length) {

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
