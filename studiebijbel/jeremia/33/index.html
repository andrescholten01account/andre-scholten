}},"vertalingen":{"SVnu":{"1":"Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:","2":"Zo zegt de HEERE, Die het doet, de HEERE, Die dat vormt, opdat Hij het bevestigt, HEERE is Zijn Naam;","3":"Roep tot Mij, en Ik zal u antwoorden, en Ik zal u grote en vaste dingen bekendmaken, die u niet weet.","4":"Want zo zegt de HEERE, de God van Israël, van de huizen van deze stad, en van de huizen van de koningen van Juda, die door de wallen en door het zwaard zijn afgebroken:","5":"Er zijn er *wel* gekomen om te strijden tegen de Chaldeeën, maar het is om die te vullen met de dode lichamen van mensen die Ik verslagen heb in Mijn toorn en in Mijn grimmigheid; en omdat Ik Mijn aangezicht van deze stad verborgen heb, vanwege al hun slechtheid.","6":"Zie, Ik zal haar gezondheid en genezing laten opkomen, en Ik zal hen genezen, en Ik zal hun een overvloed van vrede en waarheid openbaren.","7":"En Ik zal de gevangenschap van Juda en de gevangenschap van Israël wenden, en zal ze bouwen als in het begin.","8":"En Ik zal hen reinigen van al hun ongerechtigheid, waarmee zij tegen Mij gezondigd hebben; en Ik zal al hun ongerechtigheden vergeven, waarmee zij tegen Mij gezondigd en waarmee zij tegen Mij overtreden hebben.","9":"En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.","10":"Zo zegt de HEERE: Op deze plaats (waarvan u zegt: Zij is woest, zodat er geen mens en geen dier in is), in de steden van Juda, en op de straten van Jeruzalem, die zo verwoest zijn dat er geen mens, en geen inwoner, en geen dier in is, zal weer gehoord worden,","11":"De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen[1], want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! *de stem* van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.","12":"Zo zegt de HEERE van de heerscharen: Op deze plaats, die zo woest is dat er geen mens, zelfs geen dier in is, alsook in al haar steden, zullen weer woningen zijn van herders, die de kudden laten neerliggen.","13":"In de steden van het gebergte, in de steden van de laagte, en in de steden van het zuiden, en in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, zullen de kudden weer onder de handen van hem die ze telt, doorgaan, zegt de HEERE.","14":"Zie, de dagen komen, spreekt de HEERE, dat Ik het goede woord zal vervullen, dat Ik tot het huis van Israël en over het huis van Juda gesproken heb.","15":"In die dagen, en te dien tijde zal Ik David een SPRUIT van gerechtigheid doen opkomen; en Hij zal recht en gerechtigheid doen op aarde.","16":"In die dagen zal Juda verlost worden, en Jeruzalem zal veilig wonen; en dit is de naam waarmee zij genoemd zal worden: De Heere, ONZE GERECHTIGHEID.","17":"Want zo zegt de HEERE: Aan David zal het nooit ontbreken aan een Man, Die op de troon van het huis van Israël zit.","18":"Ook zal het de Levitische priesters nooit ontbreken aan een Man voor Mijn aangezicht, die brandoffer offert, en spijsoffer aansteekt, en slachtoffer bereidt, alle dagen.","19":"En het woord van de HEERE kwam tot Jeremia, en Hij zei:","20":"Zo zegt de HEERE: Als u Mijn verbond met de dag, en Mijn verbond met de nacht zou kunnen verbreken, zodat er geen dag en nacht meer zijn op hun tijd;","21":"Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.","22":"Zoals het leger van de hemel niet geteld, en het zand van de zee niet gemeten kan worden, zo zal Ik het nageslacht van Mijn knecht David vermenigvuldigen, en de Levieten die Mij dienen.","23":"Verder kwam het woord van de HEERE tot Jeremia, en Hij zei:","24":"Hebt u niet gezien wat dit volk zegt: De twee geslachten die de HEERE verkozen had, die heeft Hij nu verworpen? Ja, zij versmaden Mijn volk, zodat het geen volk meer is voor hun aangezicht.","25":"Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, *als* Ik de ordeningen van de hemel en de aarde niet had vastgesteld;","26":"Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen."},"SV":{"1":"Voorts geschiedde des HEEREN woord ten tweeden male tot Jeremia, als hij nog in het voorhof der bewaring was opgesloten, zeggende:","2":"Zo zegt de HEERE, Die het doet, de HEERE, Die dat formeert, opdat Hij het bevestige, HEERE is Zijn Naam;","3":"Roep tot Mij, en Ik zal u antwoorden, en Ik zal u bekend maken grote en vaste dingen, die gij niet weet.","4":"Want zo zegt de HEERE, de God Israëls, van de huizen dezer stad, en van de huizen der koningen van Juda, die door de wallen en door het zwaard zijn afgebroken:","5":"Er zijn er *wel* ingekomen, om te strijden tegen de Chaldeen, maar het is om die te vullen met dode lichamen van mensen, die Ik verslagen heb in Mijn toorn en in Mijn grimmigheid; en omdat Ik Mijn aangezicht van deze stad verborgen heb, om al hunlieder boosheid.","6":"Zie, Ik zal haar de gezondheid en de genezing doen rijzen, en zal henlieden genezen, en zal hun openbaren overvloed van vrede en waarheid.","7":"En Ik zal de gevangenis van Juda en de gevangenis van Israël wenden, en zal ze bouwen als in het eerste.","8":"En Ik zal hen reinigen van al hun ongerechtigheid, *met* dewelke zij tegen Mij gezondigd hebben; en Ik zal vergeven al hun ongerechtigheden, *met* dewelke zij tegen Mij gezondigd en *met* dewelke zij tegen Mij overtreden hebben.","9":"En het zal Mij zijn tot een vrolijken naam, tot een roem, en tot een sieraad bij alle heidenen der aarde; die al het goede zullen horen, dat Ik hun doe; en zij zullen vrezen en beroerd zijn over al het goede, en over al den vrede, dien Ik hun beschikke.","10":"Alzo zegt de HEERE: In deze plaats (waarvan gij zegt: Zij is woest, dat er geen mens en geen beest in is), in de steden van Juda, en op de straten van Jeruzalem, die *zo* verwoest zijn, dat er geen mens, en geen inwoner, en geen beest in is, zal wederom gehoord worden,","11":"De stem der vrolijkheid en de stem der blijdschap, de stem des bruidegoms en de stem der bruid, de stem dergenen, die zeggen: Looft den HEERE der heirscharen, want de HEERE is goed, want Zijn goedertierenheid is in eeuwigheid! *de* *stem* dergenen, die lof aanbrengen ten huize des HEEREN; want Ik zal de gevangenis des lands wenden, als in het eerste, zegt de HEERE.","12":"Zo zegt de HEERE der heirscharen: In deze plaats, die *zo* woest is, dat er geen mens, zelfs tot het vee toe, in is, mitsgaders in al derzelver steden, zullen wederom woningen zijn van herderen, die de kudden doen legeren.","13":"In de steden van het gebergte, in de steden der laagte, en in de steden van het zuiden, en in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, zullen de kudden wederom onder de handen des tellers doorgaan, zegt de HEERE.","14":"Ziet, de dagen komen, spreekt de HEERE, dat Ik het goede woord verwekken zal, dat Ik tot het huis van Israël en over het huis van Juda gesproken heb.","15":"In die dagen, en te dier tijd zal Ik David een SPRUIT der gerechtigheid doen uitspruiten; en Hij zal recht en gerechtigheid doen op aarde.","16":"In die dagen zal Juda verlost worden, en Jeruzalem zeker wonen; en deze is, die haar roepen zal: De Heere, onze GERECHTIGHEID.","17":"Want zo zegt de HEERE: Aan David zal niet worden afgesneden een Man, Die op den troon van het huis Israëls zitte.","18":"Ook zal den Levietischen priesteren, van voor Mijn aangezicht, niet worden afgesneden een Man, Die brandoffer offere, en spijsoffer aansteke, en slachtoffer bereide al de dagen.","19":"En des HEEREN woord geschiedde tot Jeremia, zeggende:","20":"Alzo zegt de HEERE: Indien gijlieden Mijn verbond van den dag; en Mijn verbond van den nacht kondt vernietigen, zodat dag en nacht niet zijn op hun tijd;","21":"Zo zal ook vernietigd kunnen worden Mijn verbond met Mijn knecht David, dat hij geen zoon hebbe, die op zijn troon regere, en met de Levieten, de priesteren, Mijn dienaren.","22":"Gelijk het heir des hemels niet geteld, en het zand der zee niet gemeten kan worden, alzo zal Ik vermenigvuldigen het zaad van Mijn knecht David, en de Levieten, die Mij dienen.","23":"Voorts geschiedde des HEEREN woord tot Jeremia, zeggende:","24":"Hebt gij niet gezien, wat dit volk spreekt, zeggende: De twee geslachten, die de HEERE verkoren had, die heeft Hij nu verworpen? Ja, zij versmaden Mijn volk, zodat het geen volk meer is voor hun aangezicht.","25":"Zo zegt de HEERE: Indien Mijn verbond niet is van dag en nacht; *indien* Ik de ordeningen des hemels en der aarde niet gesteld heb;","26":"Zo zal Ik ook het zaad van Jakob en van Mijn knecht David verwerpen, dat Ik van zijn zaad niet neme, die daar heerse over het zaad van Abraham, Izak en Jakob; want Ik zal hun gevangenis wenden en Mij hunner ontfermen."},"KJV":{"1":"Moreover the word of the LORD came unto Jeremiah the second time, while he was yet shut up in the court of the prison, saying,","2":"Thus saith the LORD the maker thereof, the LORD that formed it, to establish it; the LORD *is* his name;","3":"Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest","4":"For thus saith the LORD, the God of Israel, concerning the houses of this city, and concerning the houses of the kings of Judah, which are thrown down by the mounts, and by the sword;","5":"They come to fight with the Chaldeans, but *it is* to fill them with the dead bodies of men, whom I have slain in mine anger and in my fury, and for all whose wickedness I have hid my face from this city.","6":"Behold, I will bring it health and cure, and I will cure them, and will reveal unto them the abundance of peace and truth.","7":"And I will cause the captivity of Judah and the captivity of Israel to return, and will build them, as at the first.","8":"And I will cleanse them from all their iniquity, whereby they have sinned against me; and I will pardon all their iniquities, whereby they have sinned, and whereby they have transgressed","9":"And it shall be to me a name of joy, a praise and an honour before all the nations of the earth, which shall hear all the good that I do unto them: and they shall fear and tremble for all the goodness and for all the prosperity that I procure","10":"Thus saith the LORD; Again there shall be heard in this place, which ye say *shall be* desolate without man and without beast, *even* in the cities of Judah, and in the streets of Jerusalem, that are desolate, without man, and without inhabitant, and without beast,","11":"The voice of joy, and the voice of gladness, the voice of the bridegroom, and the voice of the bride, the voice of them that shall say, Praise the LORD of hosts: for the LORD *is* good; for his mercy *endureth* for ever: *and* of them that shall bring the sacrifice of praise into the house of the LORD. For I will cause to return the captivity of the land, as at the first, saith the LORD.","12":"Thus saith the LORD of hosts; Again in this place, which is desolate without man and without beast, and in all the cities thereof, shall be an habitation of shepherds causing *their* flocks to lie down.","13":"In the cities of the mountains, in the cities of the vale, and in the cities of the south, and in the land of Benjamin, and in the places about Jerusalem, and in the cities of Judah, shall the flocks pass again under the hands of him that telleth *them*, saith the LORD.","14":"Behold, the days come, saith the LORD, that I will perform that good thing which I have promised unto the house of Israel and to the house of Judah.","15":"In those days, and at that time, will I cause the Branch of righteousness to grow up unto David; and he shall execute judgment and righteousness in the land.","16":"In those days shall Judah be saved, and Jerusalem shall dwell safely: and this *is the name* wherewith she shall be called, The LORD our righteousness.","17":"For thus saith the LORD; David shall never want a man to sit upon the throne of the house of Israel;","18":"Neither shall the priests the Levites want a man before me to offer burnt offerings, and to kindle meat offerings, and to do sacrifice continually.","19":"And the word of the LORD came unto Jeremiah, saying,","20":"Thus saith the LORD; If ye can break my covenant of the day, and my covenant of the night, and that there should not be day and night in their season;","21":"*Then* may also my covenant be broken with David my servant, that he should not have a son to reign upon his throne; and with the Levites the priests, my ministers.","22":"As the host of heaven cannot be numbered, neither the sand of the sea measured: so will I multiply the seed of David my servant, and the Levites that minister","23":"Moreover the word of the LORD came to Jeremiah, saying,","24":"Considerest thou not what this people have spoken, saying, The two families which the LORD hath chosen, he hath even cast them off? thus they have despised my people, that they should be no more a nation before","25":"Thus saith the LORD; If my covenant *be* not with day and night, *and if* I have not appointed the ordinances of heaven and earth;","26":"Then will I cast away the seed of Jacob, and David my servant, *so* that I will not take *any* of his seed *to be* rulers over the seed of Abraham, Isaac, and Jacob: for I will cause their captivity to return, and have mercy"}},"tsk":{"1":[{"kopje":"hij","refs":["Jer 32:2","Jer 3 v\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of this <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and concerning the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> which are thrown <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> by the <span class=\"wl wl-kjv\" data-code=\"H5550\">mounts,</span> and by the sword;","5":"They <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> but it is to <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> them with the dead <span class=\"wl wl-kjv\" data-code=\"H6297\">bodies</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> whom I have <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> in mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> and in my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury,</span> and for all whose <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> I have <span class=\"wl wl-kjv\" data-code=\"H5641\">hid</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> from this city.","6":"Behold, I will <span class=\"wl wl-kjv\" data-code=\"H5927\">bring</span> it <span class=\"wl wl-kjv\" data-code=\"H724\">health</span> and <span class=\"wl wl-kjv\" data-code=\"H4832\">cure,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7495\">cure</span> them, and will <span class=\"wl wl-kjv\" data-code=\"H1540\">reveal</span> unto them the <span class=\"wl wl-kjv\" data-code=\"H6283\">abundance</span> of <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> and truth.","7":"And I will cause the <span class=\"wl wl-kjv // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
