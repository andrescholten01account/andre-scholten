k u gevankelijk heb laten wegvoeren.", "Ps 90:8": "U stelt onze ongerechtigheden voor U, onze heimelijke zonden in het licht van uw aangezicht.", "Klaagl 1:14": "Nun. Het juk van mijn overtredingen is aangebonden door Zijn hand, zij zijn samengevlochten, zij zijn op mijn hals geklommen; Hij heeft mijn kracht doen vervallen; de Heere heeft mij in hun handen gegeven, ik kan niet opstaan.", "Openb 5:12": "die met een luide stem zeiden: Het Lam, Dat geslacht is, is waard te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging.", "2 Sam 24:16": "Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.", "Ps 145:14": "Samech. De HEERE ondersteunt allen die vallen, en Hij richt op alle gebogenen.", "Ps 17:7": "Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan!", "Openb 3:14": "En schrijf aan de engel van de gemeente van de Laodicensen: Dit zegt de Amen, de trouwe en waarachtige Getuige, het Begin van de schepping van God:", "Luk 22:35": "En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "Ex 31:18": "En Hij gaf aan Mozes, toen Hij met hem op de berg Sinaï geëindigd had te spreken, de twee tafelen van de getuigenis, tafelen van steen, beschreven met de vinger van God.", "Ex 19:4-6": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb. Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn; En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Jes 59:11": "Wij brommen allen als de beren, en wij kirren voortdurend als de duiven; wij wachten op recht, maar er is geen, op heil, maar het is ver van ons.", "Klaagl 4:13": "Mem. Het is vanwege de zonden van haar profeten, en de misdaden van haar priesters, die in haar midden het bloed van de rechtvaardigen vergoten hebben.", "Jes 65:19": "En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.", "Jona 2:9": "Maar ik zal U offeren met de stem van de dankzegging; wat ik beloofd heb, zal ik betalen. Het heil is van de HEERE.", "Ps 78:50": "Hij baande een pad voor Zijn toorn; Hij onttrok hun ziel niet aan de dood; en hun gedierte gaf Hij over aan de pestilentie.", "Jes 62:5": "Want zoals een jongeling een jonkvrouw trouwt, zo zullen uw kinderen u trouwen; en zoals de bruidegom vrolijk is over de bruid, zo zal uw God over u vrolijk zijn.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Zach 3:10": "Op die dag, spreekt de HEERE van de heerscharen, zult u ieder zijn naaste nodigen tot onder de wijnstok en tot onder de vijgenboom.", "Jes 13:6-9": "Huil, want de dag van de HEERE is nabij; hij komt als een verwoesting van de Almachtige. Daarom zullen alle handen slap worden, en het hart van elk mens zal versmelten; en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "2 Kor 7:6": "Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus.", "Jer 28:10": "Toen nam de profeet Hananja het juk van de hals van de profeet Jeremia, en verbrak het.", "Ps 99:8": "O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "Tit 1:16": "Zij belijden dat zij God kennen, maar zij verloochenen Hem met hun werken, omdat zij verfoeilijk zijn en ongehoorzaam, en voor elk goed werk ongeschikt.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Ps 149:4": "Want de HEERE heeft een welgevallen aan Zijn volk; Hij zal de zachtmoedigen versieren met heil.", "Neh 2:10": "Toen Sanballat, de Horoniet, en Tobia, de Ammonitische dienaar, dat hoorden, mishaagde het hun ten zeerste, dat er een mens gekomen was om wat goeds te zoeken voor de kinderen van Israël.", "Ps 25:22": "O God! verlos Israël uit al zijn benauwdheden.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Ps 24:7-10": "Heft uw hoofden op, poorten, en verhef u, eeuwige deuren, opdat de Koning der ere ingaat! Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat!", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Hebr 2:7": "U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen;", "Ps 116:6": "De HEERE bewaart de eenvoudigen; ik was uitgeteerd, maar Hij heeft mij verlost.", "Hand 3:19": "Kom dus tot inkeer en bekeer u, opdat uw zonden uitgewist worden, wanneer de tijden van verkwikking gekomen zijn van het aangezicht van de Heere,", "Ps 37:25": "Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "Ps 37:22": "Want zijn gezegenden zullen de aarde erfelijk bezitten; maar zijn vervloekten zullen uitgeroeid worden.", "1 Kron 22:13": "Dan zult u voorspoedig zijn, als u erop toeziet om te doen de inzettingen en de rechten die de HEERE aan Mozes geboden heeft over Israël. Wees sterk en heb goede moed, wees niet bevreesd, en wees niet verslagen!", "Spr 16:6": "Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze van de HEERE wijkt men af van het kwade.", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "Jes 3:9": "Het gelaat van hun aangezicht getuigt tegen hen, en hun zonden spreken zij vrij uit, net als Sodom; zij verbergen ze niet. Wee hun ziel; want zij doen zichzelf kwaad.", "Jer 51:16": "Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "2 Kron 36:14-17": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem. En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning. Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Mark 11:10": "Gezegend zij het Koninkrijk van onze vader David, dat komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Amos 9:9-15": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen. Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen. Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Jes 57:18": "Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "Openb 1:17-19": "En toen ik Hem zag, viel ik als dood aan Zijn voeten; en Hij legde Zijn rechterhand op mij, en zei tegen mij: Wees niet bang; Ik ben de Eerste en de Laatste; en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood. Schrijf wat u gezien hebt, en wat is, en wat hierna gebeuren zal:", "Ps 90:7": "Want wij vergaan door Uw toorn; en door Uw grimmigheid worden wij verschrikt.", "Ps 126:1": "Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen.", "Jer 3:23": "Waarlijk, tevergeefs verwacht men het van de heuvels en de menigte van bergen; waarlijk, in de HEERE, onze God, is het heil van Israël!", "Ps 89:4": "Ik heb een verbond gemaakt met Mijn uitverkorene; Ik heb Mijn knecht David gezworen:", "Joël 3:1": "Want zie, in die dagen en in die tijd, als Ik de gevangenschap van Juda en Jeruzalem zal wenden,", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "2 Sam 7:24": "En U hebt Uw volk Israël voor Uzelf bevestigd, voor Uzelf tot een volk, tot in eeuwigheid; en U, HEERE, bent hun tot een God geworden.", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Openb 1:11": "die zei: Ik ben de Alfa en de Omega, de Eerste en de Laatste; en wat u ziet, schrijf dat in een boek, en stuur het aan de zeven gemeenten die in Azië zijn, namelijk naar Efeze, en naar Smyrna, en naar Pergamus, en naar Thyatire, en naar Sardis, en naar Filadelfia, en naar Laodicea.", "Ex 16:15": "Toen de Israëlieten het zagen, zeiden zij tegen elkaar: Wat is dit? Want zij wisten niet wat het was. Mozes dan zei tegen hen: Dit is het brood, dat de HEERE u te eten gegeven heeft.", "Jes 54:14": "U zult door gerechtigheid bevestigd worden; wees ver van verdrukking, want u zult niet vrezen; en ver van verschrikking, want zij zal tot u niet naderen.", "Jes 65:23": "Zij zullen niet tevergeefs arbeiden, noch baren voor verstoring; want zij zijn het nageslacht van de gezegenden van de HEERE, en hun nakomelingen met hen.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Micha 4:1": "Maar in het laatste van de dagen zal het gebeuren, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen; en hij zal verheven zijn boven de heuvels, en de volken zullen naar hem toestromen.", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "Ezech 47:12": "Aan de beek nu, aan de oever ervan, zal aan deze en aan de andere kant allerlei voedselgebomente opgroeien, waarvan het blad niet zal afvallen, en de vrucht ervan niet zal vergaan; het zal elke maand nieuwe vruchten voortbrengen, want het water ervan stroomt uit het heiligdom; en de vrucht ervan zal tot voedsel zijn, en het blad ervan tot genezing.", "Ps 59:7": "Tegen de avond keren zij terug, zij tieren als een hond, en gaan rond om de stad.", "Jer 4:28": "Hierom zal de aarde treuren, en de hemel daarboven zwart zijn; omdat Ik het heb gesproken, Ik heb het voorgenomen en het zal Mij niet berouwen, en Ik zal Mij daarvan niet afkeren.", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Nahum 1:13": "Maar nu zal Ik zijn juk van u breken, en zal uw banden verscheuren.", "Jes 31:4": "Want zo heeft de HEERE tegen mij gezegd: Zoals een leeuw, en een jonge leeuw over zijn prooi brult, wanneer ook een volle menigte herders tegen hem samengeroepen wordt, verschrikt hij voor hun stem niet, en vernedert zich niet vanwege hun grote aantal; zo zal de HEERE van de heerscharen neerdalen, om te strijden voor de berg Sion en voor haar heuvel.", "1 Tess 2:13": "Daarom danken wij ook God zonder ophouden, dat u, toen u het Woord van de prediking van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.", "Ezech 38:11": "en zult zeggen: Ik zal optrekken naar dat dorpland, ik zal komen tot hen die in rust zijn, die veilig wonen, die allemaal wonen zonder muur, en geen grendel of deuren hebben.", "Num 32:11": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;", "Zach 2:4": "En hij zei tegen hem: Loop, spreek deze jongeling aan, en zeg: Jeruzalem zal dorpsgewijze bewoond worden, vanwege de veelheid van de mensen en de dieren, die daarin wezen zal.", "Ps 32:6": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken.", "1 Sam 2:2": "Er is niemand heilig, zoals de HEERE; want er is niemand dan U, en er is geen rotssteen, zoals onze God!", "Ex 14:29": "Maar de kinderen van Israël gingen op het droge, in het midden van de zee; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand.", "Ps 104:1-35": "Loof de HEERE, mijn ziel! O HEERE, mijn God! U bent zeer groot, U bent bekleed met majesteit en heerlijkheid. Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn. Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Ps 68:23": "De Heere heeft gezegd: Ik zal terugbrengen uit Basan; Ik zal terugbrengen uit de diepten van de zee;", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "Ps 136:3-26": "Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig. Hem, Die alleen grote wonderen doet; want Zijn goedertierenheid is voor eeuwig. Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Jes 44:1": "Maar hoor nu Mijn knecht Jakob, en Israël, die Ik uitgekozen heb!", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "Job 29:5": "Toen de Almachtige nog met mij was, en mijn jongens rondom mij;", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "Luk 15:4-7": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Jer 28:13": "Ga heen en spreek tot Hananja, en zeg: Zo zegt de HEERE: Houten jukken hebt u verbroken, nu zult u in plaats daarvan ijzeren jukken maken.", "Ps 119:75": "Ik weet, HEERE! dat Uw gerichten de gerechtigheid zijn, en dat U mij uit getrouwheid verdrukt hebt.", "Zach 14:3-21": "En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd. En Zijn voeten zullen op die dag staan op de Olijfberg, die voor Jeruzalem ligt, tegen het oosten; en de Olijfberg zal in tweeën gespleten worden naar het oosten en naar het westen, zodat er een zeer grote vallei zal zijn; en de ene helft van de berg zal wijken naar het noorden, en de helft daarvan naar het zuiden. Dan zult u vluchten door de vallei van Mijn bergen (want deze vallei van de bergen zal reiken tot Azal), en u zult vluchten, zoals u vluchtte voor de aardbeving in de dagen van Uzzia, de koning van Juda; dan zal de HEERE, mijn God, komen, en al de heiligen met U, o Heere!", "Hos 13:4": "Ik ben toch de Heere, uw God, van het land Egypte af; daarom zou u geen God kennen dan Mij alleen, want er is geen Heiland dan Ik.", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Jer 32:6": "Jeremia dan zei: Het woord van de HEERE is tot mij gekomen, en het zei:", "Ps 107:20": "Hij zond Zijn woord uit, en genas hen, en rukte hen uit hun kuilen.", "Jer 1:4": "Het woord van de HEERE dan kwam tot mij, en zei:", "Ezech 37:12": "Daarom, profeteer en zeg tot hen: Zo zegt de Heere HEERE: Zie, Ik zal uw graven openen en zal u uit uw graven laten opkomen, o Mijn volk! En Ik zal u brengen in het land van Israël.", "Ezra 2:2": "Die kwamen met Zerubbabel: Jesua, Nehemia, Seraja, Reelaja, Mordechai, Bilsan, Mizpar, Bigvai, Rehum en Baëna. Dit is het aantal mannen van het volk van Israël.", "Ezech 7:20-22": "En Hij heeft de schoonheid van het sieraad tot overtreffelijkheid gezet; maar zij hebben daarin beelden van hun gruwelen en van hun verfoeiselen gemaakt; daarom heb Ik dat hun tot onreinheid gesteld. En Ik zal het in de hand van de vreemden overgeven ten roof, en aan de goddelozen van de aarde ten buit, en zij zullen het ontheiligen. Ook zal Ik Mijn aangezicht van hen afwenden, en zij zullen Mijn verborgen plaats ontheiligen; want inbrekers zullen daar binnenkomen en die ontheiligen.", "Dan 6:21-23": "Toen hij nu bij de kuil gekomen was, riep hij naar Daniël met droevige stem; de koning antwoordde en zei tegen Daniël: O Daniël, dienaar van de levende God! heeft ook uw God, Die u voortdurend eert, u uit de macht van de leeuwen kunnen verlossen? Toen sprak Daniël tegen de koning: O koning, leef voor eeuwig! Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "Ps 23:3": "Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Ps 118:14": "De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.", "Ezech 38:16": "en u zult optrekken tegen Mijn volk Israël, als een wolk, om het land te bedekken; in het laatste van de dagen zal het gebeuren; dan zal Ik u aanbrengen tegen Mijn land, opdat de heidenen Mij kennen, als Ik aan u, o Gog! voor hun ogen geheiligd zal worden.", "Zach 1:11": "En zij antwoordden de Engel van de HEERE Die tussen de mirten stond, en zeiden: Wij hebben het land doorwandeld, en zie, het hele land zit rustig en is stil.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "1 Kon 11:9": "Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was,", "Job 21:17": "Hoe vaak gebeurt het, dat de lamp van de goddelozen wordt uitgeblust, en hun ondergang over hen komt; dat God hun smarten uitdeelt in Zijn toorn!", "Jes 27:3": "Ik, de HEERE, behoed die, elk ogenblik zal Ik hem bevochtigen; opdat de vijand hem niet bezoekt, zal Ik hem bewaren, nacht en dag.", "Gen 49:11": "Hij bindt zijn jonge ezel aan de wijnstok, en het veulen van zijn ezelin aan de edelste wijnstok; hij wast zijn kleed in de wijn, en zijn mantel in wijndruivenbloed.", "Klaagl 3:22": "Cheth. Het zijn de blijken van goedertierenheid van de HEERE, dat wij niet vernietigd zijn, dat Zijn barmhartigheden geen einde hebben;", "Spr 10:27": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort.", "Zef 3:14-20": "Zing vrolijk, dochter van Sion, juich, Israël; wees blij, en spring op van vreugde met heel uw hart, dochter van Jeruzalem! De HEERE heeft uw oordelen weggenomen, Hij heeft uw vijand weggevaagd; de Koning van Israël, de HEERE, is in uw midden, u zult geen kwaad meer zien. Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.", "Jer 31:40": "En het hele dal van de dode lichamen en van de as, en alle velden tot aan de beek Kidron, tot aan de hoek van de Paardenpoort in het oosten, zal voor de HEERE heilig zijn; er zal niets meer worden uitgerukt, of afgebroken worden, in eeuwigheid.", "Dan 11:30-45": "Want er zullen schepen van Chittim tegen hem komen, daarom zal hij door smart getroffen worden, en hij zal terugkeren, en gram worden tegen het heilige verbond, en hij zal het doen; want bij zijn terugkeer zal hij aandacht geven aan hen die het heilige verbond verlaten. En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen. En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.", "Matt 25:31-34": "En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid. En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt. En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Jona 4:2": "En hij bad tot de HEERE, en zei: Och HEERE! Was dit niet mijn woord, toen ik nog in mijn land was? Daarom kwam ik het voor, door naar Tarsis te vluchten; want ik wist dat U een genadig en barmhartig God bent, geduldig en groot van goedertierenheid, en berouw hebbend over het kwaad.", "Micha 7:2-4": "De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet. Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen. De beste van hen is als een doorn; de oprechtste is scherper dan een doornheg; de dag van uw wachters, uw bezoeking, is gekomen; nu zal hun verwarring zijn.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Jer 17:14": "Genees mij, HEERE! zo zal ik genezen worden, behoud mij, zo zal ik behouden worden; want Gij zijt mijn Lof.", "Deut 6:14": "U zult andere goden niet navolgen, van de goden van de volken, die rondom u zijn.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Rom 9:8": "Dat is: niet de kinderen van het vlees zijn kinderen van God, maar de kinderen van de belofte worden als nageslacht gerekend.", "Jer 27:7": "En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.", "Jer 23:6": "In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.", "Ex 34:32": "En daarna kwamen al de kinderen van Israël dichterbij; en hij gebood hun alles wat de HEERE met hem gesproken had op de berg Sinaï.", "Jer 13:8": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Jes 45:17": "Maar Israël wordt verlost door de HEERE, met een eeuwige verlossing; u zult niet beschaamd worden, ook niet tot schande worden, tot in alle eeuwigheden.", "Zach 10:6": "En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren.", "Zach 8:4-8": "Zo zegt de HEERE van de heerscharen: Er zullen nog oude mannen en oude vrouwen zitten op de straten van Jeruzalem; ieder zal zijn stok in zijn hand hebben vanwege de hoge leeftijd. En de straten van die stad zullen vol worden met jongens en meisjes, spelend op haar straten. Zo zegt de HEERE van de heerscharen: Omdat het wonderlijk is in de ogen van het overblijfsel van dit volk in deze dagen, zou het daarom ook in Mijn ogen wonderlijk zijn? spreekt de HEERE van de heerscharen.", "Luk 22:69": "van nu af aan zal de Zoon des mensen gezeten zijn aan de rechterhand van de kracht van God.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Deut 28:7": "De HEERE zal geven dat uw vijanden, die tegen u opstaan, verslagen worden voor uw ogen; door één weg zullen zij tegen u uittrekken, maar door zeven wegen zullen zij voor u vluchten.", "Joh 3:31": "Wie van boven komt, is boven allen; wie uit de aarde is voortgekomen, die is uit de aarde en spreekt uit de aarde. Wie uit de hemel komt, is boven allen.", "Hebr 7:26": "Want zo'n Hogepriester paste bij ons: heilig, onschuldig, onbesmet, afgescheiden van de zondaars, en hoger geworden dan de hemelen;", "Neh 8:11": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte.", "Jes 2:1-5": "Het woord dat Jesaja, de zoon van Amoz, gezien heeft over Juda en Jeruzalem. En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Luk 19:41-44": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar, en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen. Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Jer 51:9": "Wij hebben Babel gemeesterd, maar zij is niet genezen; verlaat haar dan, en laat ons ieder naar zijn land trekken; want haar oordeel reikt tot aan de hemel, en is verheven tot aan de bovenste wolken.", "Amos 5:16-18": "Daarom, zo zegt de HEERE, de God van de heerscharen, de Heere: Op alle straten zal rouwklacht zijn, en in alle wijken zullen zij zeggen: Och! Och! en zij zullen de landbouwer roepen om te treuren, en rouwklacht zal zijn bij hen die verstand van klagen hebben. Ja, in alle wijngaarden zal rouwklacht zijn; want Ik zal door uw midden trekken, zegt de HEERE. Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht.", "Jes 1:25-27": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen. En Ik zal u uw rechters teruggeven, als in het begin, en uw raadslieden als in het begin; daarna zult u een stad van de gerechtigheid, een trouwe stad, genoemd worden. Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Ps 103:8": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid.", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Neh 13:26": "Heeft Salomo, de koning van Israël, daarin niet gezondigd, hoewel er onder veel heidenvolken geen koning was zoals hij, en hij door zijn God bemind was, en God hem tot koning over heel Israël gesteld had? Ook hem lieten de vreemde vrouwen zondigen.", "Hand 17:28": "Want in Hem leven wij, en bewegen wij ons, en zijn wij; zoals ook enkelen van uw eigen dichters gezegd hebben: Want wij zijn ook Zijn geslacht.", "Ps 68:20": "Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "1 Joh 3:8": "Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "Job 11:19": "En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "Zef 3:20": "In die tijd zal Ik u hierheen brengen, in de tijd namelijk dat Ik u verzamelen zal; zeker zal Ik u stellen tot een naam en tot een lof, onder alle volken van de aarde, als Ik uw gevangenschap voor uw ogen terugbrengen zal, zegt de HEERE.", "Joh 6:31": "Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten.", "Openb 3:7": "En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:", "Neh 8:18": "En de hele gemeente van hen die uit de gevangenschap waren teruggekomen, maakte loofhutten en woonde in die loofhutten; want de kinderen van Israël hadden dat niet meer gedaan sinds de dagen van Jozua, de zoon van Nun, tot op die dag toe; en er was zeer grote blijdschap.", "Jes 51:11": "Zo zullen de vrijgekochte van de HEERE terugkeren, en met gejuich naar Sion komen; en eeuwige blijdschap zal op hun hoofd zijn; vreugde en blijdschap zullen zij aangrijpen, treuring en zuchten zullen wegvluchten.", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Joz 23:16": "Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Jes 14:26": "Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.", "Spr 2:8": "Opdat zij de paden van het recht bewaren; en Hij zal de weg van Zijn gunstgenoten bewaren.", "Richt 3:15": "Toen riepen de kinderen van Israël tot de HEERE, en de HEERE verwekte hun een verlosser, Ehud, de zoon van Gera, een zoon van Jemini, een man die links was. En de kinderen van Israël zonden door zijn hand een geschenk aan Eglon, de koning van de Moabieten.", "Jes 63:8": "Want Hij zei: Zij zijn zeker Mijn volk, kinderen die niet liegen zullen? Zo is Hij hun geworden tot een Heiland.", "Lev 20:24": "En Ik heb u gezegd: U zult hun land in erfelijk bezit nemen, en Ik zal het u geven, opdat u het in erfelijk bezit neemt, een land dat overvloeit van melk en honing; Ik ben de HEERE, uw God, Die u van de volken afgezonderd heb!", "Jer 36:27": "Toen kwam het woord van de HEERE tot Jeremia, nadat de koning de rol en de woorden die Baruch geschreven had uit de mond van Jeremia, verbrand had:", "1 Kron 29:16": "HEERE, onze God, al deze overvloed die wij klaargemaakt hebben om U een huis te bouwen, voor de Naam van Uw heiligheid, dat komt van Uw hand, en het is alles van U.", "Deut 2:7": "Want de HEERE, uw God, heeft u gezegend in al het werk van uw hand; Hij kent uw wandelen door deze zo grote woestijn; deze veertig jaren is de HEERE, uw God, met u geweest; niets heeft u ontbroken.", "Zach 9:11": "U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "Ps 103:4": "Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "1 Tess 5:9": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus.", "Neh 9:27-31": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten. Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered. En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.", "Joh 3:18-20": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God. En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht. Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Lev 26:4-6": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Jes 5:7": "Want de wijngaard van de HEERE van de heerscharen is het huis van Israël, en de mannen van Juda zijn een plant van Zijn welbehagen; en Hij heeft gewacht op recht, maar zie, het is onderdrukking; op gerechtigheid, maar zie, het is geschreeuw.", "Ps 46:10": "Die de oorlogen doet ophouden tot aan het einde van de aarde, de boog verbreekt, en de speer in tweeën slaat, de wagens met vuur verbrandt.", "Hos 4:8": "Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid.", "Openb 19:16": "En Hij heeft op Zijn kleed en op Zijn dij deze Naam geschreven: Koning der koningen, en Heere der heren.", "Joz 9:11": "Daarom spraken tot ons onze oudsten, en al de inwoners van ons land, en zeiden: Neemt reiskost met u in uw handen op de reis, en gaat hun tegemoet, en zegt tegen hen: Wij zijn uw knechten, sluit dan nu een verbond met ons.", "Joh 17:10": "En al het Mijne is van U, en het Uwe is van Mij; en Ik ben in hen verheerlijkt.", "1 Tim 2:6": "Die Zichzelf gegeven heeft tot een rantsoen voor allen, als de getuigenis op zijn tijd;", "Joh 18:36": "Jezus antwoordde: Mijn Koninkrijk is niet van deze wereld. Als Mijn Koninkrijk van deze wereld was, zouden Mijn dienaren gestreden hebben, zodat Ik niet aan de Joden overgeleverd zou zijn; maar nu is Mijn Koninkrijk niet van hier.", "Jer 3:22": "Keer terug, afkerige kinderen! Ik zal uw afkeringen genezen. Zie, hier zijn wij, wij komen tot U, want U bent de HEERE, onze God!", "Jes 55:10": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;", "Jer 32:39": "En Ik zal hun één hart en één weg geven, om Mij te vrezen alle dagen, hun ten goede, alsook hun kinderen na hen.", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Num 17:13": "Al wie ook maar enigszins nadert tot de tabernakel van de HEERE, zal sterven; zullen wij dan allen stervend omkomen?", "Klaagl 2:15": "Samech. Allen die voorbijgaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter van Jeruzalem, en zeggen: Is dit die stad, waarvan men zei, dat zij volkomen was van schoonheid, een vreugde van de hele aarde?", "Ps 116:1-15": "Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen; want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen. De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "1 Kron 22:9": "Zie, de zoon die u geboren zal worden, die zal een man van rust zijn, want Ik zal hem rust geven van al zijn vijanden rondom; want zijn naam zal Salomo zijn, en Ik zal vrede en rust over Israël geven in zijn dagen.", "Hos 2:13-22": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken. En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland. En het zal op die dag gebeuren, spreekt de Heere, dat u Mij zult noemen: Mijn Man; en Mij niet meer zult noemen: Mijn Baäl!", "Ps 130:7": "Israël, hoop op de HEERE; want bij de HEERE is goedertierenheid, en bij Hem is veel verlossing.", "Matt 6:30-33": "Als God nu het gras van het veld, dat er vandaag is en morgen in de oven geworpen wordt, zo kleedt, zal Hij u niet veel meer kleden, kleingelovigen? Wees daarom niet bezorgd en zeg niet: Wat zullen wij eten, of wat zullen wij drinken, of waarmee zullen wij ons kleden? Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt.", "Job 33:18": "Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Gen 2:16": "En de HEERE God gebood de mens en zei: Van elke boom van deze hof mag u vrijelijk eten;", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Jer 9:3-6": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE. Wacht u, ieder voor zijn vriend, en vertrouw niet op enige broeder; want elke broeder doet niet dan bedriegen, en elke vriend gaat om met achterklap. En zij bedriegen, ieder zijn vriend, en spreken de waarheid niet; zij leren hun tong leugen spreken, zij maken zich moe met verkeerd te handelen.", "Jer 3:15": "En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand.", "Ps 31:8": "Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat U mijn ellende hebt aangezien, en mijn ziel in benauwdheden gekend hebt;", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "Hebr 3:11": "Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan!", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "Zach 10:8": "Ik zal hen toefluiten en zal hen verzamelen, want Ik zal hen verlossen; en zij zullen talrijker worden, zoals zij eerder talrijk waren.", "Job 29:19": "Mijn wortel was uitgebreid tot aan het water, en dauw vernachtte op mijn tak.", "Ps 76:8": "U, vreselijk bent U; en wie zal voor Uw aangezicht bestaan, vanaf het moment van uw toorn?", "Neh 8:13": "Toen ging heel het volk weg om te eten en te drinken en delen te sturen en grote blijdschap te bedrijven; want zij hadden de woorden begrepen die men hun bekendgemaakt had.", "Rom 10:12": "Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen.", "Openb 20:4": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar.", "Zach 3:9": "Want zie, aangaande die steen, die Ik gelegd heb voor het aangezicht van Jozua, op die ene steen zullen zeven ogen zijn; zie, Ik zal zijn graveersel graveren, spreekt de HEERE van de heerscharen, en Ik zal de ongerechtigheid van dit land op één dag wegnemen.", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Ezech 34:23": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn.", "Deut 31:3": "De HEERE, uw God, Die zal voor u overtrekken; Die zal deze volken van voor u wegvagen, zodat u hen erfelijk bezit. Jozua zal voor u overtrekken, zoals de HEERE gesproken heeft.", "Job 8:6": "als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "Zach 9:13-17": "Wanneer Ik Mij Juda zal gespannen hebben, en Ik Efraïm de boog zal gevuld hebben; en Ik uw kinderen, o Sion! zal verwekt hebben tegen uw kinderen, o Griekenland! en u gesteld zal hebben als het zwaard van een held. En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden. De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar.", "Deut 28:9": "De HEERE zal u voor Zichzelf tot een heilig volk bevestigen, zoals Hij u gezworen heeft, wanneer u de geboden van de HEERE, uw God, houdt, en in Zijn wegen wandelt.", "Ps 23:5": "U richt de tafel voor mij aan, tegenover mijn tegenstanders; U maakt mijn hoofd vet met olie, mijn beker vloeit over.", "Jes 65:25": "De wolf en het lam zullen samen weiden, en de leeuw zal stro eten als een rund, en stof zal het voedsel van de slang zijn; zij zullen geen kwaad doen, noch verderven op heel Mijn heilige berg, zegt de HEERE.", "Zach 1:14-21": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver. En Ik ben met een zeer grote toorn vertoornd tegen die geruste heidenen; want Ik was een weinig toornig, maar zij hebben tot het kwade meegeholpen. Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Job 33:19": "Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen;", "Rom 8:5": "Want wie naar het vlees zijn, bedenken de dingen van het vlees; maar wie naar de Geest zijn, bedenken de dingen van de Geest.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Job 14:4": "Wie kan een reine geven uit een onreine? Niemand.", "Jes 43:5": "Vrees niet, want Ik ben met u; Ik zal uw nageslacht van de opgang brengen, en Ik zal u verzamelen van de ondergang.", "Ezech 37:26": "En Ik zal een verbond van vrede met hen sluiten, het zal een eeuwig verbond met hen zijn; en Ik zal ze vestigen en zal ze vermenigvuldigen, en Ik zal Mijn heiligdom in het midden van hen zetten tot in eeuwigheid.", "Deut 28:8": "De HEERE zal de zegen gebieden, zodat Hij met u is in uw schuren, en in alles waar u uw hand aan slaat; en Hij zal u zegenen in het land dat de HEERE, uw God, u geven zal.", "1 Kron 29:12": "En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "Ezech 34:11-16": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "2 Sam 22:8": "Toen daverde en beefde de aarde; de fundamenten van de hemel beroerden zich, en daverden, omdat Hij in toorn ontstoken was.", "Jes 26:20": "Ga heen, mijn volk, ga in uw binnenkamers, en sluit uw deuren achter u toe; verberg u voor een klein ogenblik, totdat de gramschap voorbijgaat.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Ezech 20:40": "Want op Mijn heilige berg, op de hoge berg van Israël, spreekt de Heere HEERE, daar zal Mij het hele huis van Israël in het land dienen, zij allen; daar zal Ik welgevallen aan hen hebben, en daar zal Ik uw hefoffers eisen, en de eerstelingen van uw heffingen met al uw geheiligde dingen.", "1 Tim 2:4": "Die wil dat alle mensen zalig worden en tot kennis van de waarheid komen.", "Ps 72:11": "Ja, alle koningen zullen zich voor hem neerbuigen, alle heidenvolken zullen hem dienen.", "Hos 1:11": "En de kinderen van Juda en de kinderen van Israël zullen bijeengebracht worden, en zich één hoofd stellen, en uit het land optrekken; want de dag van Jizreël zal groot zijn.", "Ps 86:15": "Maar Gij, Heere! zijt een barmhartig en genadig God, geduldig, en groot van goedertierenheid en waarheid.", "Mal 3:10-12": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn. En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen. En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Ps 102:14": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.", "Zef 3:7": "Ik zei: Zeker zult u Mij vrezen, u zult de tucht aannemen, opdat haar woning niet uitgeroeid zou worden; alles waarmee Ik haar bezocht heb¹, waarlijk, zij hebben zich vroeg opgemaakt, zij hebben al hun handelingen verdorven.", "Zach 8:4": "Zo zegt de HEERE van de heerscharen: Er zullen nog oude mannen en oude vrouwen zitten op de straten van Jeruzalem; ieder zal zijn stok in zijn hand hebben vanwege de hoge leeftijd.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Deut 11:7": "Want het zijn uw ogen, die al dit grote werk van de HEERE gezien hebben, dat Hij gedaan heeft.", "Ps 19:15": "Laat de redenen van mijn mond, en de overdenking van mijn hart welgevallig zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!", "2 Kron 28:22": "Ja, in de tijd toen men hem benauwde, ging hij nog meer overtreden tegen de HEERE; dit was koning Achaz.", "Ps 104:24-30": "Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom. Deze zee, die groot en wijd van omvang is, daarin is het wemelende gedierte, ontelbaar, kleine dieren met grote. Daar varen de schepen, en de Leviathan, die U gevormd hebt om daarin te spelen.", "Ps 76:9": "U deed een oordeel horen uit de hemel; de aarde vreesde en werd stil,", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "1 Kor 7:23": "U bent duur gekocht, word geen dienstknechten van mensen.", "Ps 147:14": "Die uw grondgebied in vrede stelt; Hij verzadigt u met het beste van de tarwe.", "Job 20:12": "Al is het kwaad zoet in zijn mond, al verbergt hij dat onder zijn tong,", "Job 37:6-24": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui. Dan zegelt Hij de hand van ieder mens toe, opdat elk mens het werk van Hem kent. En het gedierte gaat in de holen, en blijft in zijn schuilplaatsen.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Luk 19:10": "Want de Zoon des mensen is gekomen om te zoeken en zalig te maken wat verloren was.", "Jer 33:7-11": "En Ik zal de gevangenschap van Juda en de gevangenschap van Israël wenden, en zal ze bouwen als in het begin. En Ik zal hen reinigen van al hun ongerechtigheid, waarmee zij tegen Mij gezondigd hebben; en Ik zal al hun ongerechtigheden vergeven, waarmee zij tegen Mij gezondigd en waarmee zij tegen Mij overtreden hebben. En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Ps 100:3": "Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Jes 57:17": "Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart.", "Jer 44:1": "Het woord dat tot Jeremia gebeurde over al de Joden die in Egypteland woonden, die te Migdol woonden, en te Tachpanhes, en te Nof, en in het land Pathros, en hij zei:", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Luk 1:68": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht;", "Ps 118:5": "Uit de benauwdheid heb ik de HEERE aangeroepen; de HEERE heeft mij verhoord en mij in de ruimte gezet.", "Dan 8:23": "Maar op het laatst van hun koninkrijk, wanneer de afvalligen het toppunt bereikt hebben, zal er een koning opstaan, hard van gezicht, en bedreven in het uitleggen van raadsels;", "Rom 1:20-32": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn. Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden; terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "Ex 32:10": "En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken.", "Ps 79:13": "Zo zullen wij, Uw volk en de schapen van Uw weide, U loven in eeuwigheid, van geslacht tot geslacht; wij zullen Uw roem vertellen.", "Fil 2:9-11": "Daarom heeft God Hem ook uitermate verhoogd, en heeft Hem een Naam gegeven, die boven alle naam is; Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn. En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Luk 19:43": "Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "2 Kron 7:18": "Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst.", "Jes 32:15-20": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden. En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Ezech 22:30": "Ik zocht nu onder hen een man die de muur zou kunnen toemuren, en voor Mijn aangezicht in de brest zou kunnen staan voor het land, zodat Ik het niet zou hoeven te verderven; maar Ik vond niemand.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Ps 87:2": "De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob.", "Zach 8:19": "Zo zegt de HEERE van de heerscharen: Het vasten van de vierde, en het vasten van de vijfde, en het vasten van de zevende, en het vasten van de tiende maand, zal voor het huis van Juda tot vreugde, en tot blijdschap, en tot vrolijke hoogtijden wezen; heb dan de waarheid en de vrede lief.", "Jer 50:44": "Zie, zoals een leeuw van de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hen in een ogenblik daaruit doen wegvluchten; en wie daartoe verkoren is, hem zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden? En wie is de herder die voor Mijn aangezicht kan bestaan?", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "Spr 3:11": "Mijn zoon! Verwerp de tucht van de HEERE niet, en word niet verdrietig over Zijn kastijding;", "1 Kron 29:1": "Verder zei koning David tegen de hele gemeente: God heeft mijn zoon Salomo alleen uitgekozen, een jongeman en teder; dit werk daarentegen is groot, want het is geen paleis voor een mens, maar voor God, de HEERE.", "Jer 33:14": "Zie, de dagen komen, spreekt de HEERE, dat Ik het goede woord zal vervullen, dat Ik tot het huis van Israël en over het huis van Juda gesproken heb.", "Gen 49:12": "Hij is roodachtig van ogen door de wijn, en wit van tanden door de melk.", "Ps 36:6": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.", "Deut 13:17": "Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "Ps 48:7": "Beving greep hen daar aan, smart als van een barende vrouw.", "Luk 10:22": "Alle dingen zijn Mij door Mijn Vader overgegeven; en niemand weet wie de Zoon is dan de Vader; en wie de Vader is dan de Zoon, en hij aan wie de Zoon het wil openbaren.", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Deut 27:9": "Vervolgens sprak Mozes, samen met de Levitische priesters, tot heel Israël: Luister toe en hoor, o Israël! Op deze dag bent u het volk van de HEERE, uw God, geworden.", "Jer 5:25-31": "Uw ongerechtigheden wenden die dingen af, en uw zonden houden dat goede van u tegen. Want onder Mijn volk worden goddelozen gevonden; ieder van hen loert, zoals de vogelvanger zich schikt; zij zetten een verderfelijke strik, zij vangen de mensen. Zoals een kooi vol is van vogels, zo zijn hun huizen vol van bedrog; daarom zijn zij groot en rijk geworden.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Ps 72:14": "Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Deut 32:43": "Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Deut 11:12-15": "Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar. En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt.", "Jes 30:9-11": "Want het is een opstandig volk; het zijn leugenachtige kinderen; kinderen die de wet van de HEERE niet willen horen. Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen. Wijkt af van de weg, maakt u van het pad; laat de Heilige van Israël van ons ophouden!", "Ps 89:37": "Zijn zaad zal in eeuwigheid zijn, en zijn troon zal voor Mij zijn als de zon.", "Jes 31:9": "En hij zal van angst voorbijgaan naar zijn rots, en zijn vorsten zullen voor de banier verschrikken, spreekt de HEERE, Die te Sion vuur, en te Jeruzalem een oven heeft.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Deut 18:18": "Een Profeet zal Ik hun doen opstaan uit hun broeders, zoals u; en Ik zal Mijn woorden in Zijn mond leggen, en Hij zal tot hen spreken alles wat Ik Hem gebieden zal.", "Jer 3:12": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.", "Hos 2:22": "En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!", "Jes 26:2": "Doe de poorten open, zodat het rechtvaardige volk daarin gaat, dat de trouw bewaart.", "2 Tim 4:22": "De Heere Jezus Christus zij met uw geest. De genade zij met u. Amen. De tweede brief aan Timotheüs, aangesteld als eerste opziener van de gemeente van Efeze, werd vanuit Rome geschreven, toen Paulus voor de tweede keer voorgeleid werd voor Nero.", "Gen 18:30": "Verder zei hij: Laat de Heere toch niet boos worden, dat ik spreek; misschien zullen daar dertig gevonden worden! En Hij zei: Ik zal het niet doen, als Ik daar dertig zal vinden.", "Matt 27:11": "En Jezus stond voor de stadhouder; en de stadhouder vroeg Hem: Bent U de Koning van de Joden? En Jezus zei tegen hem: U zegt het.", "1 Kon 9:5": "Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "Ps 58:4-6": "De goddelozen zijn vervreemd van de moederschoot af; de leugensprekers dolen van de moederbuik af. Zij hebben vurig gif, gelijk vurig slangengif; zij zijn als een dove adder, die zijn oren toestopt, opdat hij niet hoort naar de stem van de bezweerders, van hem die ervaren is in het uitvoeren van bezweringen.", "Job 39:9": "Die Ik de wildernis tot zijn huis besteld heb, en het ziltige tot zijn woningen.", "Gen 49:1": "Daarna riep Jakob zijn zonen, en hij zei: Verzamel u, en ik zal u vertellen wat u in de laatste dagen zal overkomen.", "Jer 14:8": "O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! Waarom zou U zijn als een vreemdeling in het land, en als een reiziger die slechts inkeert om te overnachten?", "Jona 4:10": "En de HEERE zei: U hebt medelijden met de wonderboom, waarvoor u niet gewerkt hebt en die u niet hebt laten groeien; die in één nacht ontstond, en in één nacht verging.", "Ps 48:10": "O God! wij gedenken Uw weldadigheid, in het midden van Uw tempel.", "Ps 18:45": "Zo gauw als hun oor van mij hoorde, hebben zij mij gehoorzaamd; vreemden hebben zich mij geveinsd onderworpen.", "Gen 17:5-9": "En uw naam zal niet meer Abram genoemd worden; maar uw naam zal Abraham zijn; want Ik heb u tot een vader van een menigte volken gemaakt. En Ik zal u heel erg vruchtbaar maken, en Ik zal u tot volken maken, en koningen zullen uit u voortkomen. En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Deut 33:5": "En Hij was koning in Jeschurun, toen de hoofden van het volk zich verzamelden, samen met de stammen Israëls.", "Lev 20:26": "En u zult Mij heilig zijn, want Ik, de HEERE, ben heilig; en Ik heb u van de volken afgezonderd, opdat u van Mij zou zijn.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Deut 5:33": "In heel de weg die de HEERE, uw God, u gebiedt, zult u gaan; opdat u leeft, en opdat het u goed gaat, en u de dagen verlengt in het land dat u erven zult.", "Ps 118:21": "Ik zal U loven, omdat U mij verhoord hebt, en mij tot heil geweest bent.", "2 Petr 3:2": "Opdat u de woorden gedenkt die van tevoren gesproken zijn door de heilige profeten, en het gebod van ons, de apostelen van de Heere en Zaligmaker;", "Ps 73:4-12": "Want er zijn geen boeien tot hun dood toe, en hun kracht is fris. Zij zijn niet in de moeite zoals andere mensen, en worden niet met andere mensen geplaagd. Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Zach 6:13": "Ja, Hij zal de tempel van de HEERE bouwen, en Hij zal het sieraad dragen, en Hij zal zitten, en heersen op Zijn troon; en Hij zal priester zijn op Zijn troon; en de raad van vrede zal tussen die Beiden zijn.", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Hand 15:10": "Nu dan, waarom verzoekt u God, door een juk op de hals van de discipelen te leggen, dat noch onze vaders, noch wij hebben kunnen dragen?", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Ps 99:7": "Hij sprak tot hen in een wolkkolom; zij hebben Zijn getuigenissen onderhouden, en de inzettingen die Hij hun gegeven had.", "Ps 147:19": "Hij maakt aan Jakob Zijn woorden bekend, aan Israël Zijn inzettingen en Zijn rechten.", "Obadja 1:19": "En zij die uit het zuiden zijn, zullen het gebergte van Ezau erfelijk bezitten, en zij die uit de laagte zijn, zullen de Filistijnen erfelijk bezitten; ja, zij zullen het veld van Efraïm en het veld van Samaria erfelijk bezitten; en Benjamin zal Gilead bezitten.", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "Ps 78:61": "En Hij gaf Zijn sterkte in de gevangenis, en Zijn heerlijkheid in de hand van de tegenstander.", "Jer 32:18": "U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Jes 60:10": "En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Hand 8:21": "U hebt geen deel en geen aandeel in dit woord, want uw hart is niet recht voor God.", "Gen 15:1": "Na deze dingen kwam het woord van de HEERE tot Abram in een visioen, en Hij zei: Vrees niet, Abram! Ik ben u een Schild, uw Loon zeer groot.", "Ezech 16:42": "Zo zal Ik Mijn grimmigheid op u laten rusten, en Mijn ijver zal van u wijken; en Ik zal stil zijn, en niet meer toornig zijn.", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Ex 32:16": "En diezelfde tafelen waren het werk van God; het schrift was ook het schrift van God zelf, in de tafelen gegraveerd.", "Ezech 18:32": "Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "2 Kron 31:10": "En Azarja, de hoofdpriester, van het huis van Zadok, sprak tot hem en zei: Sinds men deze heffing is begonnen tot het huis van de HEERE te brengen, is er te eten geweest en genoeg om verzadigd te worden, ja, tot overvloed toe; want de HEERE heeft Zijn volk gezegend, zodat deze grote hoeveelheid overgebleven is.", "Ezech 20:42": "En u zult weten dat Ik de HEERE ben, wanneer Ik u in het land van Israël gebracht zal hebben, in het land waarover Ik Mijn hand heb opgeheven om het aan uw vaderen te geven.", "Luk 1:68-73": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht; zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Jak 5:11": "Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht, dat de Heere zeer barmhartig is en vol ontferming.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Job 29:20": "Mijn heerlijkheid was nieuw bij mij, en mijn boog vernieuwde zich in mijn hand.", "Jer 50:18-20": "Daarom, zo zegt de HEERE van de heerscharen, de God van Israël: Zie, Ik zal bezoeking doen over de koning van Babel en over zijn land, zoals Ik bezoeking gedaan heb over de koning van Assur. En Ik zal Israël terugbrengen naar zijn woning, en hij zal weiden op de Karmel en op de Basan; en zijn ziel zal op het gebergte van Efraïm en Gilead verzadigd worden. In die dagen en op die tijd, spreekt de HEERE, zal de ongerechtigheid van Israël gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal het vergeven aan hen die Ik zal doen overblijven.", "Jes 27:6": "In de toekomst zal Jakob wortelen schieten, Israël zal bloeien en groeien; en zij zullen de wereld met inkomsten vervullen.", "Ps 48:4": "God is in haar paleizen; Hij is er bekend voor een Hoog Vertrek.", "Ezra 3:10-13": "Toen nu de bouwers de grond van de tempel van de HEERE legden, stelden zij de priesters op, gekleed in hun ambtskleding, met trompetten, en de Levieten, de zonen van Asaf, met cimbalen, om de HEERE te loven, naar de instelling van David, de koning van Israël. En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE. Maar velen van de priesters en de Levieten en hoofden van de families, die oud waren en het eerste huis gezien hadden, weenden met luide stem toen dit huis in hun grondlegging voor hun ogen was; maar velen verhieven de stem met gejuich en met vreugde.", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "Jer 5:10": "Beklim haar muren, en verwoest ze (maar maak er geen einde aan); haal haar tinnen weg, want zij zijn niet van de HEERE.", "Job 23:13": "Maar is Hij tegen iemand, wie zal Hem dan afkeren? Wat Zijn ziel begeert, dat zal Hij doen.", "2 Kor 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting;", "Kol 1:21": "En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend,", "Hos 13:11": "Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Ruth 1:6": "Toen maakte zij zich klaar met haar schoondochters, en keerde terug uit de velden van Moab; want zij had in het land van Moab gehoord dat de HEERE naar Zijn volk had omgezien en hun brood gaf.", "Richt 10:7": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Jer 23:20": "De toorn van de HEERE zal zich niet afwenden, totdat Hij het zal hebben gedaan, en totdat Hij de gedachten van Zijn hart tot stand zal hebben gebracht; in de laatste dagen zult u dat met verstand inzien.", "Ps 146:7-9": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los. De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief. De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Hos 2:20": "En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Hos 5:13": "Toen Efraïm zijn ziekte zag, en Juda zijn gezwel, ging Efraïm naar Assur, en hij stuurde iemand naar koning Jareb; maar die zal u niet kunnen genezen, en zal het gezwel van u niet helen.", "Jer 1:19": "En zij zullen tegen u strijden, maar tegen u niets vermogen; want Ik ben met u, spreekt de HEERE, om u eruit te helpen.", "Ps 133:3": "Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Spr 3:12": "Want de HEERE kastijdt hem die Hij liefheeft, ja, zoals een vader de zoon in wie hij een welbehagen heeft.", "Openb 5:5": "En een van de oudsten zei tegen mij: Huil niet; zie, de Leeuw uit de stam van Juda, de Wortel van David, heeft overwonnen om het boek te openen en zijn zeven zegels te verbreken.", "Ps 89:29": "Ik zal hem Mijn goedertierenheid in eeuwigheid bewaren, en Mijn verbond zal hem vast blijven.", "Jer 25:32": "Zo zegt de HEERE van de heerscharen: Zie, een kwaad gaat er uit van volk tot volk, en een grote storm zal er verwekt worden van de einden van de aarde.", "Jes 51:16": "En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.", "Hand 2:20": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat de grote en luisterrijke dag van de Heere komt.", "Ps 89:34": "Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen.", "Zach 8:5": "En de straten van die stad zullen vol worden met jongens en meisjes, spelend op haar straten.", "Rom 1:16": "Want ik schaam mij niet voor het Evangelie van Christus; want het is een kracht van God tot zaligheid voor ieder die gelooft, eerst de Jood, en ook de Griek.", "Jes 44:21": "Denk aan deze dingen, o Jakob, en Israël! Want u bent Mijn knecht, Ik heb u geformeerd; u bent Mijn knecht, Israël, u zult door Mij niet vergeten worden.", "Tit 2:10": "Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren.", "Ezra 6:3-15": "In het eerste jaar van koning Kores gaf koning Kores dit bevel: Het huis van God te Jeruzalem, dat huis moet gebouwd worden op de plaats waar zij offeranden offeren, en de fundamenten daarvan moeten zwaar zijn; zijn hoogte zestig el, en zijn breedte zestig el; Met drie rijen grote steen, en een rij nieuw hout; en de onkosten moeten uit het huis van de koning gegeven worden. Daarbij moet men ook de gouden en zilveren vaten van het huis van God, die Nebukadnezar uit de tempel die te Jeruzalem was heeft weggevoerd en naar Babel gebracht, teruggeven, zodat zij teruggaan naar de tempel die te Jeruzalem is, ieder naar zijn plaats, en men zal ze brengen naar het huis van God.", "1 Joh 4:9": "Hierin is de liefde van God jegens ons geopenbaard, dat God Zijn eniggeboren Zoon gezonden heeft in de wereld, opdat wij zouden leven door Hem.", "Ezech 16:1-14": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei: Mensenkind, maak Jeruzalem haar gruwelen bekend, en zeg: Zo zegt de Heere HEERE tot Jeruzalem: Uw oorsprong en uw geboorte zijn uit het land van de Kanaänieten; uw vader was een Amoriet en uw moeder een Hethitische.", "Ps 37:33": "Maar de HEERE laat hem niet in zijn hand; en Hij veroordeelt hem niet, als hij geoordeeld wordt.", "Ps 78:5": "Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken;", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "Joh 1:50": "Nathanaël antwoordde en zei tegen Hem: Rabbi! U bent de Zoon van God, U bent de Koning van Israël.", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Ezech 34:16": "Het verlorene zal Ik zoeken, en het weggedrevene zal Ik terugbrengen, en het gebrokene zal Ik verbinden, en het zieke zal Ik sterken; maar het vette en het sterke zal Ik verdelgen, Ik zal ze weiden met oordeel.", "Job 22:5": "Is uw boosheid niet groot, en is er geen einde aan uw ongerechtigheden?", "Deut 26:18": "En de HEERE heeft u heden laten zeggen dat u Hem tot een volk van het eigendom zult zijn, zoals Hij u gesproken heeft, en dat u al Zijn geboden zult houden;", "Ps 59:8": "Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?", "Openb 3:21": "Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.", "Deut 4:4": "U daarentegen, die de HEERE, uw God, aanhing, u bent vandaag allemaal nog in leven.", "Ps 107:17-21": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden; Hun ziel gruwde van alle voedsel, en zij waren tot aan de poorten van de dood gekomen. Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Micha 7:11": "Ten dage dat Hij uw muren zal herbouwen, te dien dage zal het besluit ver heengaan.", "Job 22:28": "Als u een zaak besluit, zal zij voor u bestendig zijn; en op uw wegen zal het licht schijnen.", "Job 1:10": "Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.", "Job 36:16": "Zo zou Hij ook u afgekeerd hebben van de mond van de benauwdheid naar de ruimte, waaronder geen benauwing zou zijn geweest; en het gerecht van uw tafel zou vol vettigheid zijn geweest.", "Openb 5:10": "en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde.", "Job 38:25-27": "Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen? Om te regenen op het land, waar niemand is, op de woestijn, waarin geen mens is; Om het woeste en het verwoeste te verzadigen, en om het uitspruits
