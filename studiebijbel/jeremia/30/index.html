el van de grasscheutjes te doen meer worden.", "Num 25:11": "Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, heeft Mijn grimmigheid van over de kinderen van Israël afgewend, omdat hij Mijn ijver geijverd heeft in hun midden, zodat Ik de kinderen van Israël in Mijn ijver niet vernietigd heb.", "Rom 9:18": "Zo ontfermt Hij Zich dan over wie Hij wil, en Hij verhardt wie Hij wil.", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "Micha 7:18": "Wie is een God gelijk U, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel van Zijn erfenis voorbijgaat? Hij houdt Zijn toorn niet voor eeuwig vast; want Hij heeft lust aan goedertierenheid.", "Ps 130:3": "Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Jer 2:28-30": "Waar zijn dan uw goden, die u zich gemaakt hebt? Laat ze opstaan, of zij u ten tijde van uw kwaad zullen verlossen; want naar het getal van uw steden zijn uw goden, Juda! Waarom twist u tegen Mij? U hebt allen tegen Mij overtreden, spreekt de HEERE. Tevergeefs heb Ik uw kinderen geslagen; zij hebben de tucht niet aangenomen; uw eigen zwaard heeft uw profeten verteerd, als een verdervende leeuw.", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Jes 52:12": "Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.", "Hagg 2:18": "Ik sloeg u met brandkoren, met honingdauw en met hagel, al het werk van uw handen; en u keerde u niet tot Mij, spreekt de HEERE.", "Rom 3:2": "Veel, in alle opzichten; want dit is wel het eerste, dat hun de woorden van God zijn toevertrouwd.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Jes 54:9": "Want dat zal Mij zijn als de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet meer op u toornen, of u bestraffen zal.", "2 Kor 6:16": "Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Ef 2:1-3": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden; waarin u eertijds gewandeld hebt, naar de eeuw van deze wereld, naar de leider van de macht van de lucht, van de geest die nu werkt in de kinderen van de ongehoorzaamheid; onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen;", "Ps 50:5": "Verzamelt Mij Mijn gunstgenoten¹, die Mijn verbond maken met een offer!", "Jes 41:27": "Ik, de Eerste, zeg tegen Sion: Zie, zie ze daar! En tegen Jeruzalem: Ik zal iemand geven die een blijde boodschap brengt.", "Deut 29:9": "Houdt dan de woorden van dit verbond, en doet ze; opdat u verstandig handelt in alles, wat u doen zult.", "Job 23:3-5": "Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen. Ik zou de woorden weten die Hij mij antwoorden zou, en verstaan wat Hij mij zeggen zou.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Job 24:12": "Uit de stad zuchten de mensen, en de ziel van de verwonden schreeuwt uit; toch rekent God het niet aan als ongerijmd.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Hos 5:14": "Want Ik zal voor Efraïm zijn als een felle leeuw, en voor het huis van Juda als een jonge leeuw; Ik, Ik zal verscheuren en heengaan; Ik zal wegvoeren, en er zal geen redder zijn.", "1 Kor 3:9": "Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u.", "Lev 26:28": "Dan zal Ik ook in verhitte woede tegen u in gaan, en Ik zal u ook zevenvoudig over uw zonden tuchtigen.", "1 Joh 2:2": "En Hij is een verzoening voor onze zonden; en niet alleen voor de onze, maar ook voor de zonden van de hele wereld.", "Klaagl 1:2": "Beth. Zij weent steeds 's nachts, en haar tranen lopen over haar kaken; zij heeft geen trooster onder al haar liefhebbers; al haar vrienden hebben trouweloos met haar gehandeld, zij zijn haar tot vijanden geworden.", "Ps 107:1-43": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft. En hen die Hij uit de landen verzameld heeft, van het oosten en van het westen, van het noorden en van de zee.", "Gen 49:20": "Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Ps 145:15": "Ain. Aller ogen wachten op U; en U geeft hun hun voedsel op de juiste tijd.", "Hos 2:7": "Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, dat zij voor de Baäl gebruikt hebben.", "Jer 22:20": "Klim op de Libanon en roep, en verhef uw stem op de Basan; roep ook van de veren; maar al uw minnaars zijn verbroken.", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Ps 34:20-23": "Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem. Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken. Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Hos 2:19": "En Ik zal u aan Mij verloven in geloof; en u zult de Heere kennen.", "Deut 11:9": "En opdat u de dagen verlengt in het land, dat de HEERE aan uw vaderen gezworen heeft, aan hen en aan hun nageslacht te geven; een land, vloeiend van melk en honing.", "Jer 32:41": "En Ik zal Mij over hen verblijden, dat Ik hun goeddoe; en Ik zal hen trouw in dat land planten, met Mijn hele hart en met Mijn hele ziel.", "Klaagl 1:5": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "Lev 25:20-22": "En als u zou zeggen: Wat zullen wij eten in het zevende jaar! Zie, wij zullen niet zaaien, en onze opbrengst niet inzamelen; Dan zal Ik Mijn zegen gebieden over u in het zesde jaar, dat het de opbrengst voor drie jaar zal voortbrengen. Het achtste jaar nu zult u zaaien, en zult van de oude opbrengst eten, tot het negende jaar toe; totdat zijn opbrengst binnengekomen is, zult u het oude eten.", "Gen 28:21": "en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn!", "Mal 1:2": "Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad,", "Openb 17:12-18": "En de tien horens die u gezien hebt, zijn tien koningen, die het koninkrijk nog niet ontvangen hebben, maar die als koningen macht ontvangen voor één uur, samen met het beest. Dezen hebben één en dezelfde gezindheid, en zullen hun kracht en macht aan het beest overgeven. Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Dan 8:25": "En door zijn sluwheid zal hij de bedrieglijkheid doen slagen in zijn hand; en hij zal zich in zijn hart verheffen; en in een tijd van schijnbare rust zal hij velen te gronde richten, en hij zal opstaan tegen de Vorst der vorsten, maar hij zal gebroken worden, zonder mensenhand.", "Luk 1:78": "door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "1 Sam 3:12": "Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien.", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "Ps 135:7": "Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort.", "Num 14:11": "En de HEERE zei tegen Mozes: Hoelang zal dit volk Mij tergen? En hoelang zullen zij niet aan Mij geloven, ondanks alle tekenen die Ik onder hen gedaan heb?", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Jer 4:26": "Ik keek, en zie, het vruchtbare land was een woestijn, en al zijn steden waren afgebroken, vanwege de HEERE, vanwege de gloed van Zijn toorn.", "Num 16:20": "En de HEERE sprak tot Mozes en tot Aäron, en zei:", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Ps 145:8": "Cheth. Genadig en barmhartig is de HEERE, geduldig en groot van goedertierenheid.", "2 Petr 2:7-9": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft; (want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden); dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Job 13:24-28": "Waarom verbergt U Uw aangezicht, en houdt U mij voor Uw vijand? Zult U een heen en weer gedreven blad verbrijzelen, en zult U een droge stoppel vervolgen? Want U schrijft bittere dingen tegen mij, en U doet mij de misdaden van mijn jeugd erven.", "Ps 37:19": "Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Ezech 7:6-12": "Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen! De morgenstond is tot u gekomen, o inwoner van het land, de tijd is gekomen, de dag van de opschudding is nabij, en er is geen weerklank van de bergen. Nu zal Ik binnenkort Mijn grimmigheid over u uitgieten, en Mijn toorn tegen u volbrengen, en u richten naar uw wegen, en zal op u brengen al uw gruwelen.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Ps 52:3-6": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag. Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Hos 11:3": "Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.", "Jer 37:6": "Toen kwam het woord van de HEERE tot de profeet Jeremia, en Hij zei:", "Ps 102:21": "Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Jer 31:8": "Zie, Ik zal ze aanbrengen uit het land van het noorden, en zal hen verzamelen van de einden van de aarde; onder hen zullen blinden en lammen zijn, zwangere vrouwen en barenden samen; met een grote menigte zullen zij hierheen terugkomen.", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Hos 1:7": "Maar over het huis van Juda zal Ik Mij ontfermen, en Ik zal ze verlossen door de Heere, hun God, en Ik zal ze niet verlossen door boog, noch door zwaard, noch door oorlog, door paarden noch door ruiters.", "Richt 2:18": "En wanneer de HEERE hun richters verwekte, zo was de HEERE met de richter, en verloste hen uit de hand van hun vijanden, al de dagen van de richter; want het berouwde de HEERE vanwege hun zuchten om hen die hen drongen en die hen drukten.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "1 Joh 3:10": "Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft,", "Jer 31:12": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn.", "Ps 110:1-4": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Luk 1:50": "En Zijn barmhartigheid is van geslacht tot geslacht over hen die Hem vrezen.", "Ps 89:24": "Maar Ik zal zijn wederpartijders verpletteren voor zijn aangezicht, en die hem haten, zal Ik plagen.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Zach 12:8": "Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "Zach 9:13": "Wanneer Ik Mij Juda zal gespannen hebben, en Ik Efraïm de boog zal gevuld hebben; en Ik uw kinderen, o Sion! zal verwekt hebben tegen uw kinderen, o Griekenland! en u gesteld zal hebben als het zwaard van een held.", "Matt 22:31": "En wat de opstanding van de doden betreft, hebt u niet gelezen wat door God tot u gesproken is, toen Hij zei:", "Klaagl 3:27": "Teth. Het is goed voor een man, dat hij het juk in zijn jeugd draagt.", "Pred 8:11": "Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "Ezech 20:41": "Ik zal een welgevallen aan u hebben om de liefelijke reuk, wanneer Ik u van de volken uitleid, en u zal verzamelen uit de landen waarin u verstrooid bent geweest, en Ik zal in u geheiligd worden voor de ogen van de heidenvolken.", "Job 24:2-24": "Zij verzetten de landpalen; de kudden roven zij, en weiden ze. De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand. Zij doen de behoeftigen wijken van de weg; samen verstoppen zich de ellendigen van het land.", "Spr 2:7": "Hij legt weg voor de oprechten een bestendig bezit; Hij is een schild voor hen die oprecht wandelen;", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "Jer 33:5": "Er zijn er wel gekomen om te strijden tegen de Chaldeeën, maar het is om die te vullen met de dode lichamen van mensen die Ik verslagen heb in Mijn toorn en in Mijn grimmigheid; en omdat Ik Mijn aangezicht van deze stad verborgen heb, vanwege al hun slechtheid.", "Jer 17:4": "Zo zult u aflaten (en dat om uzelf) van uw erfenis, die Ik u gegeven heb, en Ik zal u uw vijanden doen dienen in een land, dat u niet kent; want u hebt een vuur aangestoken in Mijn toorn, tot in eeuwigheid zal het branden.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Job 5:10": "Die de regen geeft op de aarde, en water zendt op de straten;", "Jer 6:23": "Boog en speer zullen zij voeren, het is een wreed volk, en zij zullen niet barmhartig zijn; hun stem zal bruisen als de zee, en op paarden zullen zij rijden; het is toegerust, als een man ten oorlog tegen u, o dochter van Sion!", "Deut 1:10": "De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Ps 76:10": "Toen God opstond ten oordeel, om alle zachtmoedigen van de aarde te verlossen. Sela.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "Ps 145:16": "Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.", "Job 22:25": "Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "2 Tim 4:17": "Maar de Heere heeft mij bijgestaan en heeft mij kracht gegeven; opdat door mij de prediking ten volle bekend zou worden, en alle heidenen die zouden horen. En ik ben uit de muil van de leeuw verlost.", "Klaagl 3:39": "Mem. Wat klaagt dan een levend mens? Ieder klaagt vanwege zijn zonden.", "Jes 53:4": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "Zach 14:11": "En zij zullen daarin wonen, en er zal geen verbanning meer zijn; want Jeruzalem zal zeker wonen.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Ezra 7:25": "En u, Ezra, stel naar de wijsheid van uw God, die in uw hand is, regeerders en rechters aan, die al het volk rechtspreken dat aan de overkant van de rivier is, allen die de wetten van God kennen; en wie ze niet kent, moet u het bekendmaken.", "2 Sam 7:15": "Maar Mijn goedertierenheid zal van hem niet wijken, zoals Ik die weggenomen heb van Saul, die Ik van voor uw aangezicht heb weggenomen.", "Jer 42:18": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Zoals Mijn toorn en Mijn grimmigheid uitgestort is over de inwoners van Jeruzalem, zo zal Mijn grimmigheid over u uitgestort worden, als u in Egypte gekomen zult zijn; en u zult tot een vervloeking zijn, en tot een ontzetting, en tot een vloek, en tot smaad, en u zult deze plaats niet meer zien.", "Jer 5:4": "Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen.", "Job 5:18": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen.", "Jes 1:6": "Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Job 36:11": "Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.", "Ps 68:21": "Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Ezech 16:47": "Toch hebt u niet in hun wegen gewandeld, noch naar hun gruwelen gedaan; het was iets van het geringe, een verdriet; maar u hebt het meer verdorven dan zij, in al uw wegen.", "Deut 11:2": "En u zult heden weten, dat ik niet spreek met uw kinderen, die het niet weten, en de vermaning van de HEERE, uw God, niet gezien hebben. Zijn grootheid, Zijn sterke hand en Zijn uitgestrekte arm;", "Hoogl 3:11": "Ga naar buiten, en aanschouw, dochters van Sion! de koning Salomo, met de kroon, waarmee Zijn moeder Hem kroonde op de dag van Zijn bruiloft, en op de dag van de vreugde van Zijn hart.", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Jer 36:2": "Neem een rol van het boek, en schrijf daarop alle woorden die Ik tot u gesproken heb over Israël, over Juda en over alle volken, vanaf de dag dat Ik tot u gesproken heb, vanaf de dagen van Josia tot op deze dag.", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "Ps 90:17": "En de liefelijkheid van de HEERE, onze God; die zij over ons; en bevestig U het werk van onze handen over ons, ja, het werk van onze handen, bevestig dat.", "Deut 7:22": "En de HEERE, uw God, zal deze volken voor uw aangezicht geleidelijk uitwerpen; u zult hen niet snel mogen vernietigen, omdat anders de wilde dieren van het veld tegen u te veel worden.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "Ps 119:156": "HEERE! Uw barmhartigheden zijn vele; maak mij levend naar Uw rechten.", "Jes 66:5-22": "Hoor het woord van de HEERE, u die voor Zijn woord beeft! Uw broeders, die u haten, die u ver wegsturen, om Mijn Naam, zeggen: Laat de HEERE heerlijk worden! Maar Hij zal verschijnen tot uw vreugde, zij daarentegen zullen beschaamd worden. Er zal een stem van een groot rumoer uit de stad zijn, een stem uit de tempel, de stem van de HEERE, Die Zijn vijanden de verdiensten vergeldt. Voordat zij barensnood had, heeft zij gebaard, voordat haar smart kwam, is zij al van een jongetje bevrijd.", "Ps 132:17": "Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.", "Deut 4:14": "Ook gebood de HEERE mij in diezelfde tijd dat ik u inzettingen en rechten zou leren; opdat u die deed in het land waar u naar toe trekt, om het in bezit te nemen.", "Job 34:6": "Ik moet liegen over mijn recht; mijn pijl is smartelijk zonder overtreding.", "Ps 78:38": "Doch Hij, barmhartig zijnde, verzoende de ongerechtigheid, en verdierf hen niet; maar wendde dikwijls Zijn toorn af, en wekte Zijn hele grimmigheid niet op.", "Jes 33:13-24": "Hoort, u die ver weg bent, wat Ik gedaan heb; en u, die nabij bent, erken Mijn macht! De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen? Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Spr 1:27": "Wanneer uw vrees komt als een verwoesting, en uw verderf aankomt als een wervelwind; wanneer benauwdheid en angst u overkomt;", "Ezra 9:6": "En ik zei: Mijn God, ik ben beschaamd en schaamrood om mijn aangezicht tot U op te heffen, mijn God; want onze ongerechtigheden zijn vermenigvuldigd tot boven ons hoofd, en onze schuld is groot geworden tot aan de hemel.", "Hebr 3:8": "Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "Ps 36:2-5": "De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen. Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is. De woorden van de mond van hem zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.", "Jes 34:16": "Zoek in het boek van de HEERE, en lees; niet één van deze zal ontbreken, de één noch de ander zal men missen; want Mijn mond Zelf heeft het geboden, en Zijn Geest Zelf zal ze samenbrengen.", "1 Tess 4:1-3": "Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt. Want u weet, wat bevelen wij u gegeven hebben door de Heere Jezus. Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij;", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Jes 30:13": "Daarom zal deze misdaad voor u zijn als een vallende scheur, uitwaarts gebogen in een hoge muur, waarvan de breuk snel, in een ogenblik, komen zal.", "Jer 29:1-14": "Verder zijn dit de woorden van de brief die de profeet Jeremia zond van Jeruzalem naar de overige oudsten die gevankelijk waren weggevoerd, alsook naar de priesters, naar de profeten en naar heel het volk dat Nebukadnezar van Jeruzalem gevankelijk had weggevoerd naar Babel. (Nadat koning Jechonia, en de koningin, en de kamerlingen, de vorsten van Juda en Jeruzalem, alsook de timmerlieden en smeden van Jeruzalem waren weggegaan); Door de hand van Elasa, de zoon van Safan, en Gemarja, de zoon van Hilkia, die Zedekia, de koning van Juda, naar Babel zond, naar Nebukadnezar, de koning van Babel, en hij zei:", "Ps 107:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "Ezech 16:52": "Draag u dan ook uw schande, u die voor uw zusters geoordeeld hebt door uw zonden, die u gruwelijker gemaakt hebt dan zij; zij zijn rechtvaardiger dan u; wees u dan ook beschaamd, en draag uw schande, omdat u uw zusters gerechtvaardigd hebt.", "Hand 18:10": "Want Ik ben met u, en niemand zal de hand aan u leggen om u kwaad te doen; want Ik heb veel volk in deze stad.", "Ps 48:15": "Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.", "Tit 1:3": "Namelijk Zijn Woord, door de prediking, die mij toevertrouwd is, naar het bevel van God, onze Zaligmaker;", "Hos 2:17": "En Ik zal op die dag een verbond voor hen sluiten met het wild gedierte van het veld, en met het gevogelte van de hemel, en het kruipend gedierte van de aardbodem; en Ik zal de boog, en het zwaard, en de oorlog van de aarde wegbreken, en Ik zal hen in veiligheid laten neerliggen.", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Jes 45:4": "Om Jakobs, Mijn knechts wil, en Israëls, Mijn uitverkorenen; ja, Ik riep u bij uw naam, Ik noemde u toe, hoewel u Mij niet kende.", "Deut 15:4": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten;", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "Mal 1:3": "en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.", "Hos 14:2-9": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Ps 2:6": "Ik heb Mijn Koning toch gezalfd over Sion, de berg van Mijn heiligheid.", "Ezech 34:31": "U nu, o Mijn schapen, schapen van Mijn weide! U bent mensen; maar Ik ben uw God, spreekt de Heere HEERE.", "Ps 33:15": "Hij vormt hun aller hart; Hij let op al hun werken.", "Dan 2:35": "Toen werden het ijzer, het leem, het koper, het zilver en het goud tegelijk verbrijzeld, en zij werden als kaf van de dorsvloeren in de zomer, en de wind voerde ze weg, zodat er geen plaats meer voor gevonden werd; maar de steen die het beeld verbrijzeld had, werd tot een grote berg, zodat hij de hele aarde vulde.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Ps 25:6": "Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.", "Rom 8:34": "Wie is het die veroordeelt? Christus is het Die gestorven is; ja, meer nog, Die ook opgewekt is, Die ook aan de rechterhand van God is, Die ook voor ons bidt.", "Ps 96:2": "Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag.", "Jer 27:6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "2 Kon 13:23": "Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "1 Kon 8:51-53": "want zij zijn Uw volk en Uw erfdeel, die U uitgevoerd hebt uit Egypteland, uit het midden van de ijzeren oven; opdat Uw ogen open zijn tot de smeking van Uw dienaar, en tot de smeking van Uw volk Israël, om naar hen te horen, in al hun roepen tot U. Want U hebt hen voor Uzelf tot een erfdeel afgezonderd, uit alle volken van de aarde; zoals U gesproken hebt door de dienst van Mozes, Uw dienaar, toen U onze vaderen uit Egypte uitvoerde, Heere HEERE!", "Jer 50:1": "Het woord dat de HEERE gesproken heeft tegen Babel, tegen het land van de Chaldeeën, door de dienst van de profeet Jeremia.", "Ps 34:10": "Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.", "Jes 14:27": "Want de HEERE van de heerscharen heeft het in Zijn raad besloten, wie zal het dan verbreken? en Zijn hand is uitgestrekt, wie zal die dan keren?", "Hand 10:36": "Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen.", "Matt 6:26": "Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven?", "Ps 130:8": "En Hij zal Israël verlossen van al zijn ongerechtigheden.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "2 Kon 13:3": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen.", "Matt 22:7": "Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.", "Jer 23:7": "Daarom, zie, de dagen komen, spreekt de HEERE, dat zij niet meer zullen zeggen: Zo waarachtig als de HEERE leeft, Die de kinderen van Israël uit Egypteland heeft opgevoerd.", "Ezech 5:13": "Zo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen laten rusten, en Mij troosten; en zij zullen weten dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.", "Luk 12:22-31": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "Deut 15:4-6": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten; Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied. Want de HEERE, uw God, zal u zegenen, zoals Hij tot u heeft gesproken; zo zult u aan veel volken lenen, maar u zult niet lenen; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Ps 18:51": "Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.", "Lev 26:4-10": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Ps 53:7": "Och, dat Israëls verlossingen uit Sion kwamen! Als God de gevangenen van Zijn volk zal doen terugkeren, dan zal Jakob zich verheugen, Israël zal verblijd zijn.", "Luk 17:22": "En Hij zei tegen de discipelen: Er zullen dagen komen, waarin u zult verlangen één van de dagen van de Zoon des mensen te zien, en u zult die niet zien.", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Matt 3:17": "En zie, een stem uit de hemelen zei: Deze is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "2 Kor 13:14": "De genade van de Heere Jezus Christus, en de liefde van God, en de gemeenschap van de Heilige Geest, zij met u allen. Amen. De tweede brief aan de Korinthiërs werd door Titus en Lukas geschreven vanuit Filippi, een stad in Macedonië.", "Num 25:4": "En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.", "Spr 12:21": "De rechtvaardigen zal geen leed overkomen; maar de goddelozen zullen met kwaad vervuld worden.", "Jer 33:15": "In die dagen, en te dien tijde zal Ik David een SPRUIT van gerechtigheid doen opkomen; en Hij zal recht en gerechtigheid doen op aarde.", "Rom 8:30-32": "En die Hij van tevoren bestemd heeft, die heeft Hij ook geroepen; en die Hij geroepen heeft, die heeft Hij ook gerechtvaardigd; en die Hij gerechtvaardigd heeft, die heeft Hij ook verheerlijkt. Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn? Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "Ex 6:6": "En Ik zal u tot Mijn volk aannemen, en Ik zal u tot een God zijn; en u zult weten dat Ik de HEERE uw God ben, Die u uitleidt van onder de lasten van de Egyptenaren.", "Jes 1:5": "Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.", "Ezech 3:7": "Maar het huis Israëls wil naar u niet horen, omdat zij naar Mij niet willen horen; want het hele huis Israëls is stijf van voorhoofd, en hard van hart zijn zij.", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "Jes 41:10-15": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid. Zie, zij zullen beschaamd worden en te schande gemaakt, allen die tegen u in woede ontstoken zijn; zij zullen worden als niets, en de mensen die met u twisten, zullen vergaan. U zult hen zoeken, maar zult hen niet vinden, de mensen die met u kijven; zij zullen worden als niets, en de mensen die met u oorlogen, als een nietig ding.", "Jer 10:24": "Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.", "Ps 135:6-12": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden. Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort. Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe.", "Tit 3:4": "Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is,", "Ps 89:38": "Hij zal eeuwig bevestigd worden, als de maan; en de Getuige in de hemel is getrouw. Sela.", "Openb 20:6": "Gelukkig en heilig is hij, die deel heeft in de eerste opstanding; over hen heeft de tweede dood geen macht, maar zij zullen priesters van God en Christus zijn, en zij zullen met Hem als koningen heersen, duizend jaar.", "Jer 40:1": "Het woord dat van de HEERE gebeurd is tot Jeremia, nadat Nebuzaradan, de aanvoerder van de lijfwacht, hem had laten gaan van Rama; toen hij hem had laten halen, terwijl hij met ketenen gebonden was in het midden van alle gevangenen van Jeruzalem en Juda, die naar Babel gevankelijk werden weggevoerd.", "Ex 13:22": "Hij nam de wolkkolom overdag, en de vuurkolom 's nachts, niet weg van voor het aangezicht van het volk.", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Matt 26:64": "Jezus zei tegen hem: U hebt het gezegd. Maar Ik zeg u: van nu af aan zult u de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen op de wolken van de hemel.", "Ezech 18:31": "Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?", "Openb 19:1": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God.", "Hos 5:12": "Daarom zal Ik voor Efraïm zijn als een mot, en voor het huis van Juda als verrotting.", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "Ex 12:13": "En dat bloed zal voor u een teken zijn aan de huizen waarin u zich bevindt; wanneer Ik het bloed zie, zal Ik u voorbijgaan; en er zal geen plaag onder u zijn tot verderf, wanneer Ik Egypteland zal slaan.", "Ps 61:4": "Want U bent mij een Toevlucht geweest, een sterke Toren voor de vijand.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Dan 9:4": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Jer 31:27": "Zie, de dagen komen, spreekt de HEERE, dat Ik het huis van Israël en het huis van Juda bezaaien zal met zaad van mensen en zaad van dieren.", "2 Kon 20:6": "En Ik zal vijftien jaar aan uw dagen toevoegen, en Ik zal u uit de hand van de koning van Assyrië verlossen, alsook deze stad; en Ik zal deze stad beschermen, omwille van Mijzelf en omwille van Mijn dienaar David.", "Jer 32:26": "Toen kwam het woord van de HEERE tot Jeremia:", "Jer 11:15": "Wat heeft Mijn beminde in Mijn huis te doen, terwijl zij die schandelijke daad met velen doet, en het heilige vlees van u geweken is? Wanneer u kwaad doet, dan springt u op van vreugde.", "Ps 33:12": "Gelukkig is het volk wiens God de HEERE is; het volk, dat Hij Zich als erfdeel heeft uitgekozen.", "Zach 12:1-14": "De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert. Zie, Ik zal Jeruzalem stellen tot een drinkschaal der zwijmeling voor alle volken rondom; ja, ook zal zij zijn over Juda, in de belegering tegen Jeruzalem. En het zal op die dag gebeuren, dat Ik Jeruzalem stellen zal tot een zware steen voor alle volken; allen die zich daarmee belasten, zullen zeker doorsneden worden; en al de volken van de aarde zullen zich tegen haar verzamelen.", "2 Petr 2:12-19": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Ps 102:29": "De kinderen van Uw knechten zullen wonen, en hun nageslacht zal voor Uw aangezicht bevestigd worden.", "Klaagl 4:6": "Vau. En de ongerechtigheid van de dochter van mijn volk is groter dan de zonden van Sodom, dat als in een ogenblik omgekeerd werd, zonder dat er handen naar haar uitgestoken werden.", "Rom 3:1": "Wat is dan het voordeel van de Jood? Of wat is het nut van de besnijdenis?", "Num 16:21": "Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren!", "2 Tim 3:16": "Heel de Schrift is door God ingegeven, en is nuttig tot lering, tot weerlegging, tot verbetering, tot onderwijzing die in de rechtvaardigheid is;", "Jer 25:1": "Het woord dat tot Jeremia gebeurd is over het hele volk van Juda, in het vierde jaar van Jojakim, zoon van Josia, koning van Juda (dit was het eerste jaar van Nebukadnezar, koning van Babel);", "Job 30:21": "U bent veranderd in een wrede tegen mij; door de sterkte van Uw hand weerstaat U mij hatelijk.", "2 Kor 9:8-10": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk. Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid. Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "Dan 9:12": "En Hij heeft Zijn woorden bevestigd, die Hij gesproken heeft tegen ons, en tegen onze rechters, die ons berechtten, door over ons een groot kwaad te brengen, dat niet gebeurd is onder de hele hemel, zoals het aan Jeruzalem gebeurd is.", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Job 8:7": "Uw begin zal wel gering zijn geweest, maar uw einde zal zeer toenemen.", "Jer 4:30": "Wat zult u dan doen, u die verwoest bent? Al kleedt u zich met scharlaken, al versiert u zich met gouden sieraad, al schuurt u uw ogen met blanketsel, toch zou u zich tevergeefs opmaken; de minnaars versmaden u, zij zullen uw leven zoeken.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Jer 44:6": "Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat ze tot eenzaamheid en tot verwoesting geworden zijn, zoals het is op deze dag.", "Zach 9:14-16": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden. De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar. En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Ps 107:23-31": "Die met schepen ter zee afvaren, handel drijvend op grote wateren; Die zien de werken van de HEERE, en Zijn wonderwerken in de diepte. Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.", "Jer 28:4": "Ook zal Ik Jechonia, de zoon van Jojakim, koning van Juda, en allen die gevankelijk uit Juda zijn weggevoerd, die in Babel gekomen zijn, naar deze plaats terugbrengen, spreekt de HEERE; want Ik zal het juk van de koning van Babel verbreken.", "1 Joh 1:1-5": "Wat er was van het begin af, wat wij gehoord hebben, wat wij gezien hebben met onze ogen, wat wij aanschouwd hebben, en onze handen getast hebben, van het Woord des levens; (Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.) Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Jes 14:3": "En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Jer 25:38": "Hij heeft, als een jonge leeuw, Zijn hut verlaten; want hun land is geworden tot een verwoesting, vanwege de gloed van de verdrukker, ja, vanwege de gloed van Zijn toorn.", "Jes 27:13": "En het zal op die dag gebeuren, dat er met een grote bazuin geblazen zal worden; dan zullen zij komen die verloren dreigden te gaan in het land van Assur, en de weggejaagden in het land van Egypte; en zij zullen de HEERE aanbidden op de heilige berg te Jeruzalem.", "Lev 18:25": "Zodat het land onrein is, en Ik over hen zijn ongerechtigheid bezoek, en het land zijn inwoners uitspuwt.", "Pred 5:18": "Ook: ieder mens aan wie God rijkdom en bezittingen gegeven heeft, en aan wie Hij de macht geeft om daarvan te eten, en om zijn deel te nemen, en om zich te verheugen in zijn arbeid, dat is een gave van God.", "Luk 12:24-28": "Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard? Wie van u kan door bezorgd te zijn één el aan zijn lengte toevoegen? Als u dan zelfs het kleinste niet kunt, waarom bent u dan bezorgd over de andere dingen?", "Klaagl 2:6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "Hos 2:4": "Want hun moeder hoereert, zij die hen ontvangen heeft, handelt schandelijk; want zij zegt: Ik zal mijn minnaars nagaan, die mij mijn brood en mijn water, mijn wol en mijn vlas, mijn olie en mijn drank geven.", "Jer 6:15": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Ja, zij schamen zich in het minste niet, weten ook niet van schaamrood te maken; daarom zullen zij vallen onder de vallende, ten tijde als Ik hen bezoeken zal, zullen zij struikelen, zegt de HEERE.", "Jes 29:18-24": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien. En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen. Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "Jer 35:12": "Toen kwam het woord van de HEERE tot Jeremia en zei:", "Openb 1:5-7": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed. En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen. Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Ps 78:4-72": "Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Ef 2:4-7": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "1 Kor 7:10": "Maar de getrouwden gebied ik niet, maar de Heere, dat de vrouw niet van de man scheidt.", "Amos 5:10": "Zij haten in de poort hem die bestraft, en verafschuwen hem die oprecht spreekt.", "Ps 64:4-7": "Die hun tong scherpen als een zwaard, een bitter woord richten als hun pijl; Om in verborgen plaatsen de oprechte te schieten; haastig schieten zij naar hem, en vrezen niet. Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Ezech 11:12": "En u zult weten dat Ik de HEERE ben, omdat u in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, maar naar de rechten van de heidenvolken die rondom u zijn, gedaan hebt.", "Deut 8:18": "Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "Ezech 14:23": "Zo zullen zij u vertroosten, wanneer u hun weg en hun handelingen zult zien; en u zult weten dat Ik niet zonder reden heb gedaan al wat Ik in haar gedaan heb, spreekt de Heere HEERE.", "Jer 36:28": "Neem u weer een andere rol, en schrijf daarop al de eerste woorden die op de eerste rol stonden, die Jojakim, de koning van Juda, verbrand heeft.", "Ps 89:5": "Ik zal uw zaad tot in eeuwigheid bevestigen, en uw troon opbouwen van geslacht tot geslacht. Sela.", "Hos 7:3": "Zij verblijden de koning met hun boosheid, en de vorsten met hun leugens.", "1 Kron 17:8": "En Ik ben met u geweest overal waar u heen bent gegaan, en Ik heb al uw vijanden voor u uitgeroeid; en Ik heb u een naam gemaakt, gelijk de naam van de groten die op de aarde zijn.", "Ps 73:14": "Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen.", "Ezech 37:25": "En zij zullen wonen in het land dat Ik Mijn knecht Jakob gegeven heb, waarin uw vaders gewoond hebben; ja, daarin zullen zij wonen, zij en hun kinderen, en hun kindskinderen tot in eeuwigheid, en Mijn Knecht David zal hun Vorst zijn tot in eeuwigheid.", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "Ps 149:2": "Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning.", "Ezech 21:5-7": "En alle vlees zal weten dat Ik, de HEERE, Mijn zwaard uit zijn schede getrokken heb; het zal niet meer terugkeren. Maar u, mensenkind, zucht; zucht voor hun ogen met verbreking van de lenden en met bitterheid. En het zal gebeuren, als zij tegen u zeggen: Waarom zucht u? dat u zult zeggen: Om het gerucht, want het komt! En alle hart zal wegsmelten, en alle handen zullen verslappen, en alle geest zal terugkrimpen, en alle knieën zullen wegvloeien als water; zie, het komt, en het zal gebeuren, spreekt de Heere HEERE.", "Ps 90:16": "Laat Uw werk aan Uw knechten gezien worden, en Uw heerlijkheid over hun kinderen.", "Micha 3:2": "Zij haten het goede, en hebben het kwade lief; zij roven hun huid van hen af, en hun vlees van hun beenderen.", "Jer 2:6": "En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde?", "Matt 21:5-11": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier. En de discipelen gingen op weg en deden zoals Jezus hun opgedragen had, en brachten de ezelin en het veulen, en legden hun kleren erop, en zetten Hem daarop.", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "Gen 49:10": "De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Jer 33:26": "Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "Jes 49:26": "En Ik zal uw verdrukkers spijzen met hun eigen vlees, en van hun eigen bloed zullen zij dronken worden, als van zoete wijn; en alle vlees zal gewaarworden, dat Ik, de HEERE, uw Heiland ben, en uw Verlosser, de Machtige van Jakob.", "Ps 44:2-4": "O God! Wij hebben het met onze oren gehoord, onze vaders hebben het ons verteld: Wat een werk hebt U gedaan in hun dagen, in de dagen van vroeger. U hebt de heidenvolken met Uw hand uit de bezitting verdreven, maar hen geplant; U hebt de volken geplaagd, hen daarentegen doen voortschieten. Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Deut 9:29": "Zij zijn toch Uw volk, en Uw erfdeel, dat U door Uw grote kracht, en door Uw uitgestrekte arm hebt uitgevoerd!", "Joz 23:10": "Eén man onder u zal er duizend opjagen; want het is de HEERE, uw God, Zelf, Die voor u strijdt, zoals Hij tot u gesproken heeft.", "Jer 27:22": "Naar Babel zullen zij gebracht worden, en daar zullen zij zijn, tot de dag toe dat Ik ze zal opzoeken, spreekt de HEERE; dan zal Ik ze weer omhoog brengen, en zal ze terugbrengen naar deze plaats.", "Ex 9:26": "Alleen in het land Gosen, waar de kinderen van Israël waren, daar was geen hagel.", "Jes 37:31": "Want wie ontkomen is, die overgebleven is van het huis van Juda, zal opnieuw naar beneden wortelen, en het zal naar boven vrucht dragen.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Ps 102:20": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Amos 4:7": "Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde.", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "Ex 6:5": "Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "Ex 29:46": "En zij zullen weten, dat Ik de HEERE hun God ben, Die hen uit het land Egypte uitgevoerd heb, opdat Ik in het midden van hen wonen zou; Ik ben de HEERE, hun God.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Jer 33:17": "Want zo zegt de HEERE: Aan David zal het nooit ontbreken aan een Man, Die op de troon van het huis van Israël zit.", "Hos 10:10": "Het is Mijn wens, dat Ik hen zal tuchtigen; en volken zullen tegen hen verzameld worden, wanneer Ik hen bind in hun twee voren.", "Ps 62:8": "In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Rom 9:5": "van wie de vaders zijn, en uit wie Christus is, wat het vlees aangaat, Hij Die God is, boven allen te prijzen tot in eeuwigheid. Amen.", "Ps 105:24": "En Hij deed Zijn volk zeer meer worden, en maakte het machtiger dan zijn tegenstanders.", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Jes 46:11": "Die een roofvogel roept van het oosten, een man van Mijn raad uit een ver land; ja, Ik heb het gesproken, Ik zal het ook doen komen; Ik heb het geformeerd, Ik zal het ook doen.", "Ezech 34:24": "En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken.", "Ps 31:20": "O, hoe groot is Uw goed, dat U weggelegd hebt voor hen die U vrezen; dat U gewrocht hebt voor hen die op U vertrouwen, in de tegenwoordigheid van de mensenkinderen!", "Matt 13:41": "De Zoon des mensen zal Zijn engelen uitzenden, en zij zullen uit Zijn Koninkrijk verzamelen alles wat tot zonde verleidt, en degenen die de ongerechtigheid doen;", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Jes 43:12": "Ik heb verkondigd, en Ik heb verlost, en Ik heb het doen horen, en geen vreemde god was onder u; en u bent Mijn getuigen, spreekt de HEERE, dat Ik God ben.", "Neh 12:43-46": "En zij offerden op die dag grote slachtoffers, en waren vrolijk; want God had hen vrolijk gemaakt met grote vrolijkheid; en ook de vrouwen en de kinderen waren vrolijk; zodat de vrolijkheid van Jeruzalem tot van verre gehoord werd. Ook werden op diezelfde dag mannen aangesteld over de kamers, voor de schatten, voor de hefoffers, voor de eerstelingen en voor de tienden, om daarin uit de akkers van de steden de delen van de wet te verzamelen, voor de priesters en voor de Levieten; want Juda was vrolijk over de priesters en over de Levieten, die daar stonden. En zij namen de wacht van hun God waar, en de wacht van de reiniging, ook de zangers, en de poortwachters, naar het gebod van David en zijn zoon Salomo.", "Micha 4:10": "Lijd smart en doe uw uiterste best om te baren, dochter van Sion, als een barende vrouw; want nu zult u wel uit de stad heen weggaan, en op het veld wonen, en tot in Babel komen, maar daar zult u gered worden; daar zal de HEERE u verlossen uit de hand van uw vijanden.", "Num 15:41": "Ik ben de HEERE, uw God, Die u uit het land Egypte uitgeleid heb, om u tot een God te zijn; Ik ben de HEERE, uw God!", "Ex 34:24": "Wanneer Ik de volken voor uw aangezicht uit hun bezit zal verdrijven, en uw grenzen verruimen, dan zal niemand uw land begeren, terwijl u erheen optrekt, om te verschijnen voor het aangezicht van de HEERE, uw God, driemaal in het jaar.", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Lev 25:18-22": "En doe Mijn inzettingen, en houd Mijn rechten, en doe die; dan zult u zeker wonen in het land. En het land zal zijn vrucht geven, en u zult eten tot verzadiging toe; en u zult zeker daarin wonen. En als u zou zeggen: Wat zullen wij eten in het zevende jaar! Zie, wij zullen niet zaaien, en onze opbrengst niet inzamelen;", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Jer 44:28": "Maar wie van het zwaard ontkomen, zullen uit Egypteland terugkeren in het land van Juda, weinig in aantal; en het hele overblijfsel van Juda, dat in Egypteland gekomen is om daar als vreemdelingen te verblijven, zal weten wiens woord stand zal houden, het Mijne of het hunne.", "Ef 1:5": "Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "Rom 1:7": "Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Deut 4:20": "Maar u heeft de HEERE aangenomen, en uit de ijzeroven, uit Egypte, weggevoerd; opdat u Hem tot een erfvolk zou zijn, zoals het vandaag is.", "Deut 7:6-8": "Want u bent een heilig volk voor de HEERE, uw God; u heeft de HEERE, uw God, uitgekozen om Hem een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn. De HEERE heeft geen liefde tot u opgevat, en u niet uitgekozen, om uw grote aantal boven alle andere volken; want u was het minste van alle volken. Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Job 20:13": "Al spaart hij het en laat het niet los, maar houdt het midden in zijn gehemelte binnen;", "Klaagl 2:5": "He. De Heere is geworden als een vijand; Hij heeft Israël verslonden, Hij heeft al haar paleizen verslonden. Hij heeft haar vestingen verdorven; en Hij heeft bij de dochter van Juda het klagen en kermen vermenigvuldigd.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Jer 36:1": "Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam:", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Rom 8:8": "En zij die in het vlees zijn, kunnen God niet behagen.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "Jes 60:18": "Er zal geen geweld meer gehoord worden in uw land, verwoesting noch verbreking in uw gebied; maar uw muren zult u Heil noemen, en uw poorten Lof.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Openb 7:5": "Uit het geslacht van Juda waren twaalfduizend verzegeld; uit het geslacht van Ruben waren twaalfduizend verzegeld; uit het geslacht van Gad waren twaalfduizend verzegeld;", "Jer 4:4": "Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Micha 7:9": "Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "Deut 29:13": "Opdat Hij u heden voor Zichzelf tot een volk bevestigt, en Hij u tot een God is, zoals Hij tot u gesproken heeft, en zoals Hij uw vaderen, Abraham, Izak en Jakob, gezworen heeft.", "Openb 1:1": "De openbaring van Jezus Christus, die God Hem gegeven heeft, om Zijn dienstknechten te tonen de dingen die spoedig moeten gebeuren; en die Hij door Zijn engel gezonden en aan Zijn dienstknecht Johannes bekendgemaakt heeft;", "Ps 85:13": "Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Spr 27:22": "Al stampte u de dwaas in een vijzel met een stamper, midden tussen het gestoten graan, zijn dwaasheid zou niet van hem wijken.", "Deut 32:47": "Want dat is geen leeg woord voor u; maar het is uw leven; en door ditzelfde woord zult u de dagen verlengen op het land, waar u over de Jordaan naartoe gaat, om dat te erven.", "1 Sam 28:18": "Zoals u naar de stem van de HEERE niet geluisterd hebt, en de gloed van Zijn toorn niet uitgevoerd hebt tegen Amalek; daarom heeft de HEERE u deze zaak aangedaan op deze dag.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Rom 5:8": "Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren.", "Ps 72:3": "De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "2 Kron 7:6": "Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.", "2 Sam 12:24": "Daarna troostte David zijn vrouw Bathseba, en ging naar haar toe, en lag bij haar; en zij baarde een zoon, wiens naam zij Salomo noemde; en de HEERE had hem lief,", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "2 Kor 5:18-21": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft. Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd. Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "Jes 14:1": "Want de HEERE zal Zich over Jakob ontfermen, en Hij zal Israël nog verkiezen, en Hij zal hen in hun land zetten; en de vreemdeling zal zich bij hen voegen, en zij zullen het huis van Jakob aanhangen.", "Jes 32:6": "Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.", "Jer 7:20": "Daarom zegt de Heere HEERE zo: Zie, Mijn toorn en Mijn grimmigheid zal uitgestort worden over deze plaats, over de mensen en over de dieren, en over de bomen van het veld, en over de vrucht van het aardrijk; en het zal branden, en niet uitgeblust worden.", "Ps 32:5": "Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "Dan 9:25": "Weet dan, en versta: van het uitgaan van het woord om te doen terugkeren en om Jeruzalem te bouwen, tot op de Messias, de Vorst, zijn zeven weken, en tweeënzestig weken; de straten en de grachten zullen weer gebouwd worden, maar in benauwdheid van de tijden.", "Jer 3:14-18": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen. En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand. En het zal gebeuren, wanneer u meer geworden en vruchtbaar geworden bent in het land, in die dagen, spreekt de HEERE, dat zij niet meer zullen zeggen: De ark van het verbond van de HEERE, en zij zal ook niet in het hart opkomen; en zij zullen er niet aan denken, en haar niet bezoeken, en zij zal niet opnieuw gemaakt worden.", "Joh 16:21": "Een vrouw heeft droefheid wanneer zij baart, omdat haar tijd gekomen is; maar wanneer zij het kind gebaard heeft, denkt zij niet meer aan de benauwdheid, vanwege de blijdschap dat er een mens ter wereld geboren is.", "Ps 106:23": "Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.", "Luk 21:25": "En er zullen tekenen zijn in de zon, en maan, en sterren, en op de aarde benauwdheid van de volken met radeloosheid, wanneer de zee en de watergolven groot geluid zullen geven;", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Ex 12:17": "Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Ps 78:21": "Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Ex 14:30": "Zo verloste de HEERE Israël op die dag uit de hand van de Egyptenaren; en Israël zag de Egyptenaren dood aan de oever van de zee.", "Spr 3:1": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden.", "Jer 49:19": "Zie, gelijk een leeuw uit de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hem in een ogenblik daaruit doen wegrennen; en wie daartoe uitverkoren is, hem zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden, en wie is die herder die voor Mijn aangezicht bestaan zou?",
