aar eerste kind baart, de stem van de dochter van Sion; zij hijgt, zij spreidt haar handen uit, en zegt: O, wee mij nu, want mijn ziel is moe vanwege de moordenaars!", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Jer 13:10": "Dit boosaardige volk, dat weigert Mijn woorden te horen, dat wandelt naar het goeddunken van zijn hart, en andere goden navolgt om die te dienen en zich voor die neer te buigen; dat zal worden als deze gordel, die nergens meer voor deugt.", "Ps 3:9": "Het heil is van de HEERE; Uw zegen is over Uw volk. Sela.", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Mal 3:16": "Toen spraken zij die de HEERE vrezen, ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor hen die de HEERE vrezen, en voor hen die aan Zijn Naam denken.", "Jer 46:27": "Maar u, Mijn knecht Jakob! Vrees niet, en wees niet ontzet, Israël! Want zie, Ik zal u verlossen uit verre landen, en uw nageslacht uit het land van hun gevangenschap; en Jakob zal wederkomen, en stil en gerust zijn, en niemand zal hem verschrikken.", "Ps 74:2": "Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.", "Ps 72:5": "Zij zullen U vrezen, zolang de zon en maan er zijn, van geslacht tot geslacht.", "Jes 2:4": "En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Ps 85:2": "U bent Uw land gunstig geweest, HEERE! De gevangenschap van Jakob hebt U gekeerd.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Luk 6:36": "Wees dan barmhartig, zoals ook uw Vader barmhartig is.", "Jer 3:5": "Zal Hij voor eeuwig Zijn toorn behouden? Zal Hij die voortdurend bewaren? Zie, u spreekt en doet die slechte dingen, en u zet door zoveel u kunt.", "Jer 8:12": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE.", "Micha 1:9": "Want haar plagen zijn dodelijk; want zij zijn gekomen tot aan Juda; hij is geraakt tot aan de poort van mijn volk, tot aan Jeruzalem.", "Hebr 2:8": "Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;", "Ezra 9:11": "die Gij geboden had door de dienst van Uw knechten, de profeten, en zei: Het land, waar u naartoe gaat om het te erven, is een vuil land, door de vuiligheid van de volken van de landen, om hun gruwelen, waarmee zij het vervuld hebben, van het ene einde tot het andere einde, met hun onreinheid.", "Jes 26:16": "HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.", "Gen 8:22": "Voortaan, al de dagen van de aarde, zullen zaaiing en oogst, en koude en hitte, en zomer en winter, en dag en nacht niet ophouden.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Ps 111:9": "Pe. Hij heeft Zijn volk verlossing gezonden; Tsade. Hij heeft Zijn verbond in eeuwigheid geboden; Koph. Zijn Naam is heilig en ontzagwekkend.", "Jer 32:1": "Het woord dat tot Jeremia gekomen is van de HEERE, in het tiende jaar van Zedekia, koning van Juda; dit jaar was het achttiende jaar van Nebukadnezar.", "Ps 34:23": "De HEERE verlost de ziel van Zijn knechten; en allen die op Hem vertrouwen, zullen niet schuldig verklaard worden.", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Ps 45:4-8": "Gord Uw zwaard aan de heup, o Held! Uw Majesteit en Uw heerlijkheid. En rijd voorspoedig in Uw heerlijkheid, op het woord van de waarheid en rechtvaardige zachtmoedigheid; en Uw rechterhand zal U ontzagwekkende dingen leren. Uw pijlen zijn scherp; volken zullen onder U vallen; zij treffen in het hart van de vijanden van de Koning.", "Ps 135:4": "Want de HEERE heeft Zich Jakob verkoren, Israël tot Zijn eigendom.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "2 Sam 12:13": "Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.", "Ezech 37:27": "En Mijn tabernakel zal bij hen zijn, en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Klaagl 2:3": "Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.", "Ezech 23:22": "Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen.", "Ps 38:2": "O HEERE! Straf mij niet in Uw grote toorn, en straf mij niet in Uw grimmigheid.", "Hebr 8:12": "Want Ik zal hun ongerechtigheden genadig zijn, en aan hun zonden en hun overtredingen zal Ik geenszins meer denken.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Ps 142:5": "Ik keek uit naar rechts, en zie, er was niemand die mij kende, er was geen ontkomen mogelijk voor mij; niemand bekommerde zich om mijn ziel.", "Zef 3:1-5": "Wee de smerige, en de bevlekte, de onderdrukkende stad! Zij hoort niet naar de stem; zij neemt de tucht niet aan; zij vertrouwt niet op de HEERE; tot haar God nadert zij niet. Haar vorsten zijn brullende leeuwen in haar midden; haar rechters zijn avondwolven, die de beenderen niet breken tot aan de morgen.", "2 Kron 7:13": "Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend;", "Dan 6:23": "Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Jes 41:16": "U zult ze wannen, en de wind zal ze wegvoeren, en de stormwind zal ze verstrooien; maar u zult u verheugen in de HEERE; in de Heilige van Israël zult u zich beroemen.", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "2 Kron 28:10": "Daartoe denkt u er nu aan om de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; bent u het zelf niet die schuldig staan? Bij u zijn schulden tegen de HEERE, uw God.", "Jer 16:15": "Maar: Zo waarachtig als de HEERE leeft, Die de kinderen van Israël heeft opgevoerd uit het land van het noorden, en uit al de landen waarheen Hij hen gedreven had! Want Ik zal hen terugbrengen in hun land, dat Ik hun vaderen gegeven heb.", "Ef 1:6-8": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde; In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade, Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;", "Deut 10:18": "Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.", "Jes 60:16": "En u zult de melk van de heidenen zuigen, en u zult de borsten van de koningen zuigen; en u zult weten dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige van Jakob.", "Rom 3:10-18": "zoals geschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt. Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is zelfs niet één."}, "noten": {"1": "D.i. legermachten"}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">Het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3414\">dat</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3414\">tot</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3414\">Jeremia</span> gek =\"L4\" data-code=\"H6213\">heeft</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H6965\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6965\">totdat</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6965\">Hij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6965\">tot</span> stand gebracht heeft <span class=\"wl\" data-l=\"L6\" data-code=\"H4209\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4209\">gedachten</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4209\">van</span> Zijn hart; in <span class=\"wl\" data-l=\"L7\" data-code=\"H319\">het</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H319\">laatste</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H319\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3117\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3117\">dagen</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H995\">zult</span> u <span class=\"wl\" data-l=\"L9\" data-code=\"H995\">daarop</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H995\">letten</span>."}, "koppeling_kjv": {"1": "The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that came to <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> saying,", "2": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">speaketh</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">Write</span> thee all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto thee in a book.", "3": "For, lo, the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I will bring <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and I will cause them to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> to their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and they shall possess", "4": "And these are the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> concerning <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and concerning Judah.", "5": "For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> We have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H2731\">trembling,</span> of <span class=\"wl wl-kjv\" data-code=\"H6343\">fear,</span> and not of peace.", "6": "<span class=\"wl wl-kjv\" data-code=\"H7592\">Ask</span> ye now, and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> whether a <span class=\"wl wl-kjv\" data-code=\"H2145\">man</span> doth travail with <span class=\"wl wl-kjv\" data-code=\"H3205\">child?</span> wherefore do I <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> every <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> with his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> on his <span class=\"wl wl-kjv\" data-code=\"H2504\">loins,</span> as a woman in <span class=\"wl wl-kjv\" data-code=\"H3205\">travail,</span> and all <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> are <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> into paleness?", "7": "<span class=\"wl wl-kjv\" data-code=\"H1945\">Alas!</span> for that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">great,</span> so <span class=\"wl wl-kjv\" data-code=\"H369\">that</span> none is like it: it is even the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H6869\">trouble;</span> but he shall be saved", "8": "For it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> his <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> from off thy <span class=\"wl wl-kjv\" data-code=\"H6677\">neck,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5423\">burst</span> thy <span class=\"wl wl-kjv\" data-code=\"H4147\">bonds,</span> and <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> shall no more serve", "9": "But they shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> their <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> whom I will raise up", "10": "Therefore <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> thou not, O my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> neither be <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed,</span> O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> for, lo, I will <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> thee from <span class=\"wl wl-kjv\" data-code=\"H7350\">afar,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of their <span class=\"wl wl-kjv\" data-code=\"H7628\">captivity;</span> and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and shall be in <span class=\"wl wl-kjv\" data-code=\"H8252\">rest,</span> and be <span class=\"wl wl-kjv\" data-code=\"H7599\">quiet,</span> and none shall make him afraid.", "11": "For I am with thee, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> thee: though I <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a full <span class=\"wl wl-kjv\" data-code=\"H3617\">end</span> of all <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> whither I have <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> thee, yet will I not <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a full <span class=\"wl wl-kjv\" data-code=\"H3617\">end</span> of thee: but I will <span class=\"wl wl-kjv\" data-code=\"H3256\">correct</span> thee in <span class=\"wl wl-kjv\" data-code=\"H4941\">measure,</span> and will not leave thee <span class=\"wl wl-kjv\" data-code=\"H5352\">altogether</span> unpunished.", "12": "For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H7667\">bruise</span> is <span class=\"wl wl-kjv\" data-code=\"H605\">incurable,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4347\">wound</span> is grievous.", "13": "There is none to <span class=\"wl wl-kjv\" data-code=\"H1777\">plead</span> thy <span class=\"wl wl-kjv\" data-code=\"H1779\">cause,</span> that thou mayest be bound <span class=\"wl wl-kjv\" data-code=\"H4205\">up:</span> thou hast no <span class=\"wl wl-kjv\" data-code=\"H8585\">healing</span> medicines.", "14": "All thy <span class=\"wl wl-kjv\" data-code=\"H157\">lovers</span> have <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> thee; they <span class=\"wl wl-kjv\" data-code=\"H1875\">seek</span> thee not; for I have <span class=\"wl wl-kjv\" data-code=\"H5221\">wounded</span> thee with the <span class=\"wl wl-kjv\" data-code=\"H4347\">wound</span> of an <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> with the <span class=\"wl wl-kjv\" data-code=\"H4148\">chastisement</span> of a cruel <span class=\"wl wl-kjv\" data-code=\"H394\">one,</span> for the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of thine <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> because thy <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> were increased.", "15": "Why <span class=\"wl wl-kjv\" data-code=\"H2199\">criest</span> thou for thine <span class=\"wl wl-kjv\" data-code=\"H7667\">affliction?</span> thy <span class=\"wl wl-kjv\" data-code=\"H4341\">sorrow</span> is <span class=\"wl wl-kjv\" data-code=\"H605\">incurable</span> for the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of thine <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity:</span> because thy <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> were <span class=\"wl wl-kjv\" data-code=\"H6105\">increased,</span> I have done", "16": "Therefore all they that <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> thee shall be <span class=\"wl wl-kjv\" data-code=\"H398\">devoured;</span> and all thine <span class=\"wl wl-kjv\" data-code=\"H6862\">adversaries,</span> every one of them, shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> into <span class=\"wl wl-kjv\" data-code=\"H7628\">captivity;</span> and they that <span class=\"wl wl-kjv\" data-code=\"H7601\">spoil</span> thee shall be a <span class=\"wl wl-kjv\" data-code=\"H4933\">spoil,</span> and all that <span class=\"wl wl-kjv\" data-code=\"H962\">prey</span> upon thee will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> for a prey.", "17": "For I will <span class=\"wl wl-kjv\" data-code=\"H5927\">restore</span> <span class=\"wl wl-kjv\" data-code=\"H724\">health</span> unto thee, and I will <span class=\"wl wl-kjv\" data-code=\"H7495\">heal</span> thee of thy <span class=\"wl wl-kjv\" data-code=\"H4347\">wounds,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> because they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> thee an <span class=\"wl wl-kjv\" data-code=\"H5080\">Outcast,</span> saying, This is <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> whom no man seeketh after.", "18": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Behold, I will bring <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> on his <span class=\"wl wl-kjv\" data-code=\"H4908\">dwellingplaces;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1129\">builded</span> upon her own <span class=\"wl wl-kjv\" data-code=\"H8510\">heap,</span> and the <span class=\"wl wl-kjv\" data-code=\"H759\">palace</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">remain</span> after the manner", "19": "And out of them shall <span class=\"wl wl-kjv\" data-code=\"H3318\">proceed</span> <span class=\"wl wl-kjv\" data-code=\"H8426\">thanksgiving</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of them that make <span class=\"wl wl-kjv\" data-code=\"H7832\">merry:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> them, and they shall not be <span class=\"wl wl-kjv\" data-code=\"H4591\">few;</span> I will also <span class=\"wl wl-kjv\" data-code=\"H3513\">glorify</span> them, and they shall not be small.", "20": "Their <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> also shall be as <span class=\"wl wl-kjv\" data-code=\"H6924\">aforetime,</span> and their <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me, and I will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> all that oppress", "21": "And their <span class=\"wl wl-kjv\" data-code=\"H117\">nobles</span> shall be of themselves, and their <span class=\"wl wl-kjv\" data-code=\"H4910\">governor</span> shall <span class=\"wl wl-kjv\" data-code=\"H3318\">proceed</span> from the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of them; and I will cause him to draw <span class=\"wl wl-kjv\" data-code=\"H7126\">near,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5066\">approach</span> unto me: for who is this that <span class=\"wl wl-kjv\" data-code=\"H6148\">engaged</span> his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H5066\">approach</span> unto me? <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "22": "And ye shall be my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and I will be your God.", "23": "Behold, the <span class=\"wl wl-kjv\" data-code=\"H5591\">whirlwind</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> with <span class=\"wl wl-kjv\" data-code=\"H2534\">fury,</span> a <span class=\"wl wl-kjv\" data-code=\"H1641\">continuing</span> <span class=\"wl wl-kjv\" data-code=\"H5591\">whirlwind:</span> it shall fall with <span class=\"wl wl-kjv\" data-code=\"H2342\">pain</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of the wicked.", "24": "The <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall not <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> until he have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> it, and until he have <span class=\"wl wl-kjv\" data-code=\"H6965\">performed</span> the <span class=\"wl wl-kjv\" data-code=\"H4209\">intents</span> of his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart:</span> in the <span class=\"wl wl-kjv\" data-code=\"H319\">latter</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> ye shall consider"}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Matthew Henry-verklaring']],
  ['Geloofsbelijdenissen', ['1689 Baptist Confession', 'Westminster Confession']],
  ['Boeken', ['Institutie — Calvijn', 'A Body of Divinity — Watson']],
  ['Preken', ['Spurgeon']],
  ['Devotionals', ['Spurgeon']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
