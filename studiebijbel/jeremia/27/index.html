,"vertalingen":{"SVnu":{"1":"In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:","2":"Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.","3":"En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.","4":"En beveel hun om tegen hun heren te zeggen: Zo zegt de HEERE van de heerscharen[1], de God van Israël: Zo zult u tegen uw heren zeggen:","5":"Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.","6":"En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.","7":"En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.","8":"En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.","9":"U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen.","10":"Want zij profeteren u leugens, om u ver uit uw land weg te brengen, en dat Ik u wegjaag, en u omkomt.","11":"Maar het volk dat zijn hals onder het juk van de koning van Babel zal brengen, en hem dienen, dat zal Ik in zijn land laten blijven, spreekt de HEERE, en het zal het bebouwen en erin wonen.","12":"Daarna sprak ik tot Zedekia, de koning van Juda, naar al deze woorden, en zei: Breng uw halzen onder het juk van de koning van Babel, en dien hem en zijn volk, dan zult u leven.","13":"Waarom zou u sterven, u en uw volk, door het zwaard, door de honger en door de pest, zoals de HEERE gesproken heeft over het volk dat de koning van Babel niet zal dienen?","14":"Luister dan niet naar de woorden van de profeten die tegen u spreken en zeggen: U zult de koning van Babel niet dienen; want zij profeteren u leugens.","15":"Want Ik heb ze niet gezonden, spreekt de HEERE, en zij profeteren leugens in Mijn Naam; met als gevolg dat Ik u wegjaag, en u omkomt, u en de profeten die u profeteren.","16":"Ook sprak ik tot de priesters, en tot heel dit volk, en zei: Zo zegt de HEERE: Luister niet naar de woorden van uw profeten, die u profeteren en zeggen: Zie, de voorwerpen van het huis van de HEERE zullen nu spoedig uit Babel teruggebracht worden; want zij profeteren u leugens.","17":"Luister niet naar hen, maar dien de koning van Babel, dan zult u leven; waarom zou deze stad een puinhoop worden?","18":"Maar als zij profeten zijn, en als het woord van de HEERE bij hen is, laat hen dan nu bij de HEERE van de heerscharen voorbede doen, opdat de voorwerpen die in het huis van de HEERE, en in het huis van de koning van Juda, en in Jeruzalem zijn overgebleven, niet naar Babel gaan.","19":"Want zo zegt de HEERE van de heerscharen, over de pilaren, en over de zee, en over de onderstellen, en over het overige van de voorwerpen die in deze stad zijn overgebleven,","20":"die Nebukadnezar, de koning van Babel, niet heeft weggenomen, toen hij Jechonia, de zoon van Jojakim, koning van Juda, van Jeruzalem naar Babel gevankelijk wegvoerde, alsook alle edelen van Juda en Jeruzalem;","21":"ja, zo zegt de HEERE van de heerscharen, de God van Israël, over de voorwerpen die in het huis van de HEERE, en in het huis van de koning van Juda, en in Jeruzalem zijn overgebleven:","22":"Naar Babel zullen zij gebracht worden, en daar zullen zij zijn, tot de dag toe dat Ik ze zal opzoeken, spreekt de HEERE; dan zal Ik ze weer omhoog brengen, en zal ze terugbrengen naar deze plaats."},"SV":{"1":"In het begin des koninkrijks van Jojakim, zoon van Josia, koning van Juda, geschiedde dit woord tot Jeremia, van den HEERE, zeggende:","2":"Alzo zeide de HEERE tot mij: Maak u banden en jukken, en doe die aan uw hals.","3":"En zend ze tot den koning van Edom, en tot den koning van Moab, en tot den koning der kinderen Ammons, en tot den koning van Tyrus, en tot den koning van Sidon; door de hand der boden, die te Jeruzalem tot Zedekia, den koning van Juda, komen.","4":"En beveel hun aan hun heren te zeggen: Zo zegt de HEERE der heirscharen, de God Israëls: Zo zult gij tot uw heren zeggen:","5":"Ik heb gemaakt de aarde, den mens en het vee, die op den aardbodem zijn, door Mijn grote kracht, en door Mijn uitgestrekten arm, en Ik geef ze aan welken het recht is in Mijn ogen.","6":"En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, den koning van Babel, Mijn knecht; zelfs ook het gedierte des velds heb Ik hem gegeven, om hem te dienen.","7":"En alle volken zullen hem, en zijn zoon, en zijns zoons zoon dienen, totdat ook de tijd zijns eigenen lands kome; dan zullen zich machtige volken en grote koningen van hem doen dienen.","8":"En het zal geschieden, het volk en het koninkrijk, dat hem, Nebukadnezar, den koning van Babel, niet zal dienen, en dat zijn hals niet zal geven onder het juk des konings van Babel; over datzelve volk zal Ik, spreekt de HEERE, bezoeking doen door het zwaard, en door den honger, en door de pestilentie, totdat Ik ze zal verteerd hebben door zijn hand.","9":"Gijlieden dan, hoort niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, dewelke tot u spreken, zeggende: Gij zult den koning van Babel niet dienen.","10":"Want zij profeteren u valsheid, om u verre uit uw land te brengen, en dat Ik u uitstote, en gij omkomt.","11":"Maar het volk, dat zijn hals zal brengen onder het juk des konings van Babel, en hem dienen, datzelve zal Ik in zijn land laten, spreekt de HEERE, en het zal dat bouwen en daarin wonen.","12":"Daarna sprak ik tot Zedekia, den koning van Juda, naar al deze woorden, zeggende: Brengt uw halzen onder het juk des konings van Babel, en dient hem en zijn volk, zo zult gij leven.","13":"Waarom zoudt gij sterven, gij en uw volk door het zwaard, door den honger en door de pestilentie, gelijk als de HEERE gesproken heeft van het volk, dat den koning van Babel niet zal dienen.","14":"Hoort dan niet naar de woorden der profeten, die tot u spreken, zeggende: Gij zult den koning van Babel niet dienen; want zij profeteren u valsheid.","15":"Want Ik heb ze niet gezonden, spreekt de HEERE, en zij profeteren valselijk in Mijn Naam; opdat Ik u uitstote, en gij omkomt, gij en de profeten, die u profeteren.","16":"Ook sprak ik tot de priesteren, en tot dit ganse volk, zeggende: Zo zegt de HEERE: Hoort niet naar de woorden uwer profeten, die u profeteren, zeggende: Ziet, de vaten van des HEEREN huis zullen nu haast uit Babel wedergebracht worden; want zij profeteren u valsheid.","17":"Hoort niet naar hen, *maar* dient den koning van Babel, zo zult gijlieden leven; waarom zou deze stad *tot* een woestheid worden?","18":"Maar zo zij profeten zijn, en zo des HEEREN woord bij hen is, laat hen nu bij den HEERE der heirscharen voorbidden, opdat de vaten, die in het huis des HEEREN, en in het huis des konings van Juda, en te Jeruzalem zijn overgebleven, niet naar Babel komen.","19":"Want zo zegt de HEERE der heirscharen, van de pilaren, en van de zee, en van de stellingen, en van het overige der vaten, die in deze stad zijn overgebleven.","20":"Die Nebukadnezar, de koning van Babel, niet heeft weggenomen, als hij Jechonia, den zoon van Jojakim, koning van Juda, van Jeruzalem, naar Babel gevankelijk wegvoerde, mitsgaders al de edelen van Juda en Jeruzalem;","21":"Ja, zo zegt de HEERE der heirscharen, de God Israëls, van de vaten, die *in* het huis des HEEREN, en in het huis des konings van Juda, en te Jeruzalem zijn overgebleven:","22":"Naar Babel zullen zij gebracht worden, en aldaar zullen zij zijn, tot den dag toe, dat Ik ze bezoeken zal, spreekt de HEERE; dan zal Ik ze opvoeren, en zal ze wederbrengen tot deze plaats."},"KJV":{"1":"In the beginning of the reign of Jehoiakim the son of Josiah king of Judah came this word unto Jeremiah from the LORD, saying,","2":"Thus saith the LORD to me; Make thee bonds and yokes, and put them upon thy neck,","3":"And send them to the king of Edom, and to the king of Moab, and to the king of the Ammonites, and to the king of Tyrus, and to the king of Zidon, by the hand of the messengers which come to Jerusalem unto Zedekiah king of Judah;","4":"And command them to say unto their masters, Thus saith the LORD of hosts, the God of Israel; Thus shall ye say unto your masters;","5":"I have made the earth, the man and the beast that *are* upon the ground, by my great power and by my outstretched arm, and have given it unto whom it seemed meet","6":"And now have I given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant; and the beasts of the field have I given him also to serve","7":"And all nations shall serve him, and his son, and his son's son, until the very time of his land come: and then many nations and great kings shall serve","8":"And it shall come to pass, *that* the nation and kingdom which will not serve the same Nebuchadnezzar the king of Babylon, and that will not put their neck under the yoke of the king of Babylon, that nation will I punish, saith the LORD, with the sword, and with the famine, and with the pestilence, until I have consumed them by his hand.","9":"Therefore hearken not ye to your prophets, nor to your diviners, nor to your dreamers, nor to your enchanters, nor to your sorcerers, which speak unto you, saying, Ye shall not serve the king of Babylon:","10":"For they prophesy a lie unto you, to remove you far from your land; and that I should drive you out, and ye should perish.","11":"But the nations that bring their neck under the yoke of the king of Babylon, and serve him, those will I let remain still in their own land, saith the LORD; and they shall till it, and dwell","12":"I spake also to Zedekiah king of Judah according to all these words, saying, Bring your necks under the yoke of the king of Babylon, and serve him and his people, and live.","13":"Why will ye die, thou and thy people, by the sword, by the famine, and by the pestilence, as the LORD hath spoken against the nation that will not serve the king of Babylon?","14":"Therefore hearken not unto the words of the prophets that speak unto you, saying, Ye shall not serve the king of Babylon: for they prophesy a lie","15":"For I have not sent them, saith the LORD, yet they prophesy a lie in my name; that I might drive you out, and that ye might perish, ye, and the prophets that prophesy","16":"Also I spake to the priests and to all this people, saying, Thus saith the LORD; Hearken not to the words of your prophets that prophesy unto you, saying, Behold, the vessels of the LORD'S house shall now shortly be brought again from Babylon: for they prophesy a lie","17":"Hearken not unto them; serve the king of Babylon, and live: wherefore should this city be laid waste?","18":"But if they *be* prophets, and if the word of the LORD be with them, let them now make intercession to the LORD of hosts, that the vessels which are left in the house of the LORD, and *in* the house of the king of Judah, and at Jerusalem, go not to Babylon.","19":"For thus saith the LORD of hosts concerning the pillars, and concerning the sea, and concerning the bases, and concerning the residue of the vessels that remain in this city,","20":"Which Nebuchadnezzar king of Babylon took not, when he carried away captive Jeconiah the son of Jehoiakim king of Judah from Jerusalem to Babylon, and all the nobles of Judah and Jerusalem;","21":"Yea, thus saith the LORD of hosts, the God of Israel, concerning the vessels that remain *in* the house of the LORD, and *in* the house of the king of Judah and of Jerusalem;","22":"They shall be carried to Babylon, and there shall they be until the day that I visit them, saith the LORD; then will I bring them up, and restore them to this place."}},"tsk":{"1":[{"kopje":"het begin","refs":["Jer 27:3","Jer 27:12","Jer 27:19","Jer 27:20","Jer 26:1","Jer 28:1"]}],"2":[{"kopje":"Zo zei de HEERE","refs":["Amos 7:1","Amos 7:4"]},{"kopje":"Maak u","refs":["Jer 27:12","Jer 28:10-14"]},{"kopje":"doe die om","refs":["Jer 13:1-11","Jer 18:2-10","Jer 19:1-11","Jer 28:10","1 Kon 11:30","1 Kon 11:31","Jes 20:2-4","Ezech 4:1","Ezech 5:17","Ezech 12:1-28","Ezech 24:3-12"]}],"3":[{"kopje":"Edom","refs":["Jer 25:19-26","Jer 47:1","Jer 49:39","Ezech 25:1","Ezech 28:26","Ezech 29:18","Amos 1:9-15","Amos 2:1-3"]},{"kopje":"de boden","refs":["2 Kron 36:13","Ezech 17:15-21"]}],"4":[{"kopje":"Zo zegt","refs":["Jer 10:10","Jer 10:16","Jer 25:27","Jer 51:19","Ex 5:1"]}],"5":[{"kopje":"gemaakt","refs":["Jer 10:11","Jer 10:12","Jer 32:17","Jer 51:15","Gen 9:6","Ex 20:11","Job 26:5-14","Job 38:4-3","Ps 102:26","Ps 136:5-9","Ps 146:5","Ps 146:6","Ps 148:2-5","Jes 40:21-26","Jes 42:5","Jes 44:24","Jes 45:12","Jes 48:13","Jes 51:13","Joh 1:1-3","Hand 14:15","Hand 17:24","Kol 1:16","Hebr 1:2","Hebr 1:10","Hebr 1:11","Openb 4:11"]},{"kopje":"Ik heb de aarde gemaakt","refs":["Gen 1:29","Gen 1:30","Gen 9:2","Gen 9:3","Deut 2:7","Deut 2:9","Deut 2:19","Deut 5:16","Deut 32:8","Joz 1:2","Joz 1:3","Ezra 1:2","Ps 115:15","Ps 115:16","Ps 135:10-12","Deut 2:21","Deut 4:17","Deut 4:25","Deut 4:32","Deut 4:35"]}],"6":[{"kopje":"Ik heb al deze landen gegeven","refs":["Jer 28:14","Dan 2:37","Dan 2:38","Dan 5:18","Dan 5:19"]},{"kopje":"Mijn","refs":["Jer 24:1","Jer 25:9","Jer 43:10","Jer 51:20-23","Jes 44: ass=\"wl\" data-l=\"L8\" data-code=\"H4725\">naar</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4725\">deze</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4725\">plaats</span>."},"koppeling_kjv":{"1":"In the <span class=\"wl wl-kjv\" data-code=\"H7225\">beginning</span> of the <span class=\"wl wl-kjv\" data-code=\"H4467\">reign</span> of <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> came this <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> unto <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> saying,","2":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to me; <span class=\"wl wl-kjv\" data-code=\"H6213\">Make</span> thee <span class=\"wl wl-kjv\" data-code=\"H4147\">bonds</span> and <span class=\"wl wl-kjv\" data-code=\"H4133\">yokes,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> them upon thy neck,","3":"And <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> them to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">Ammonites,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyrus,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H6721\">Zidon,</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> unto <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Judah;","4":"And <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> them to <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto their <span class=\"wl wl-kjv\" data-code=\"H113\">masters,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Thus shall ye <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto your masters;","5":"I have <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> the <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and the <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> that are <span class=\"wl wl-kjv\" data-code=\"H6440\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> by my <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> and by my <span class=\"wl wl-kjv\" data-code=\"H5186\">outstretched</span> <span class=\"wl wl-kjv\" data-code=\"H2220\">arm,</span> and have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> it unto whom it <span class=\"wl wl-kjv\" data-code=\"H5869\">seemed</span> meet","6":"And now have I <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> all these <span class=\"wl wl-kjv\" data-code=\"H776\">lands</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadnezzar</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> have I <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> him also to serve","7":"And all <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him, and his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> until the very <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of his <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come:</span> and then <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> and <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> shall serve","8":"And it shall come to pass, that the <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> and <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> which will not <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the same <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadnezzar</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and that will not <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> their <span class=\"wl wl-kjv\" data-code=\"H6677\">neck</span> under the <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> that <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> will I <span class=\"wl wl-kjv\" data-code=\"H6485\">punish,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> until I have <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed</span> them by his hand.","9":"Therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> not ye to your <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> nor to your <span class=\"wl wl-kjv\" data-code=\"H7080\">diviners,</span> nor to your <span class=\"wl wl-kjv\" data-code=\"H2472\">dreamers,</span> nor to your <span class=\"wl wl-kjv\" data-code=\"H6049\">enchanters,</span> nor to your <span class=\"wl wl-kjv\" data-code=\"H3786\">sorcerers,</span> which <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> unto you, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye shall not <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Babylon:","10":"For they <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> a <span class=\"wl wl-kjv\" data-code=\"H8267\">lie</span> unto you, to remove you <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from your <span class=\"wl wl-kjv\" data-code=\"H127\">land;</span> and that I should drive you <span class=\"wl wl-kjv\" data-code=\"H5080\">out,</span> and ye should perish.","11":"But the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> their <span class=\"wl wl-kjv\" data-code=\"H6677\">neck</span> under the <s function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);

  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>

</html>
