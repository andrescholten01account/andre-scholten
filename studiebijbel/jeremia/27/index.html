g van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "9": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen.", "10": "Want zij profeteren u leugens, om u ver uit uw land weg te brengen, en dat Ik u wegjaag, en u omkomt.", "11": "Maar het volk dat zijn hals onder het juk van de koning van Babel zal brengen, en hem dienen, dat zal Ik in zijn land laten blijven, spreekt de HEERE, en het zal het bebouwen en erin wonen.", "12": "Daarna sprak ik tot Zedekia, de koning van Juda, naar al deze woorden, en zei: Breng uw halzen onder het juk van de koning van Babel, en dien hem en zijn volk, dan zult u leven.", "13": "Waarom zou u sterven, u en uw volk, door het zwaard, door de honger en door de pest, zoals de HEERE gesproken heeft over het volk dat de koning van Babel niet zal dienen?", "14": "Luister dan niet naar de woorden van de profeten die tegen u spreken en zeggen: U zult de koning van Babel niet dienen; want zij profeteren u leugens.", "15": "Want Ik heb ze niet gezonden, spreekt de HEERE, en zij profeteren leugens in Mijn Naam; met als gevolg dat Ik u wegjaag, en u omkomt, u en de profeten die u profeteren.", "16": "Ook sprak ik tot de priesters, en tot heel dit volk, en zei: Zo zegt de HEERE: Luister niet naar de woorden van uw profeten, die u profeteren en zeggen: Zie, de voorwerpen van het huis van de HEERE zullen nu spoedig uit Babel teruggebracht worden; want zij profeteren u leugens.", "17": "Luister niet naar hen, maar dien de koning van Babel, dan zult u leven; waarom zou deze stad een puinhoop worden?", "18": "Maar als zij profeten zijn, en als het woord van de HEERE bij hen is, laat hen dan nu bij de HEERE van de heerscharen voorbede doen, opdat de voorwerpen die in het huis van de HEERE, en in het huis van de koning van Juda, en in Jeruzalem zijn overgebleven, niet naar Babel gaan.", "19": "Want zo zegt de HEERE van de heerscharen, over de pilaren, en over de zee, en over de onderstellen, en over het overige van de voorwerpen die in deze stad zijn overgebleven,", "20": "die Nebukadnezar, de koning van Babel, niet heeft weggenomen, toen hij Jechonia, de zoon van Jojakim, koning van Juda, van Jeruzalem naar Babel gevankelijk wegvoerde, alsook alle edelen van Juda en Jeruzalem;", "21": "ja, zo zegt de HEERE van de heerscharen, de God van Israël, over de voorwerpen die in het huis van de HEERE, en in het huis van de koning van Juda, en in Jeruzalem zijn overgebleven:", "22": "Naar Babel zullen zij gebracht worden, en daar zullen zij zijn, tot de dag toe dat Ik ze zal opzoeken, spreekt de HEERE; dan zal Ik ze weer omhoog brengen, en zal ze terugbrengen naar deze plaats."}, "SV": {"1": "In het begin des koninkrijks van Jojakim, zoon van Josia, koning van Juda, geschiedde dit woord tot Jeremia, van den HEERE, zeggende:", "2": "Alzo zeide de HEERE tot mij: Maak u banden en jukken, en doe die aan uw hals.", "3": "En zend ze tot den koning van Edom, en tot den koning van Moab, en tot den koning der kinderen Ammons, en tot den koning van Tyrus, en tot den koning van Sidon; door de hand der boden, die te Jeruzalem tot Zedekia, den koning van Juda, komen.", "4": "En beveel hun aan hun heren te zeggen: Zo zegt de HEERE der heirscharen, de God Israëls: Zo zult gij tot uw heren zeggen:", "5": "Ik heb gemaakt de aarde, den mens en het vee, die op den aardbodem zijn, door Mijn grote kracht, en door Mijn uitgestrekten arm, en Ik geef ze aan welken het recht is in Mijn ogen.", "6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, den koning van Babel, Mijn knecht; zelfs ook het gedierte des velds heb Ik hem gegeven, om hem te dienen.", "7": "En alle volken zullen hem, en zijn zoon, en zijns zoons zoon dienen, totdat ook de tijd zijns eigenen lands kome; dan zullen zich machtige volken en grote koningen van hem doen dienen.", "8": "En het zal geschieden, het volk en het koninkrijk, dat hem, Nebukadnezar, den koning van Babel, niet zal dienen, en dat zijn hals niet zal geven onder het juk des konings van Babel; over datzelve volk zal Ik, spreekt de HEERE, bezoeking doen door het zwaard, en door den honger, en door de pestilentie, totdat Ik ze zal verteerd hebben door zijn hand.", "9": "Gijlieden dan, hoort niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, dewelke tot u spreken, zeggende: Gij zult den koning van Babel niet dienen.", "10": "Want zij profeteren u valsheid, om u verre uit uw land te brengen, en dat Ik u uitstote, en gij omkomt.", "11": "Maar het volk, dat zijn hals zal brengen onder het juk des konings van Babel, en hem dienen, datzelve zal Ik in zijn land laten, spreekt de HEERE, en het zal dat bouwen en daarin wonen.", "12": "Daarna sprak ik tot Zedekia, den koning van Juda, naar al deze woorden, zeggende: Brengt uw halzen onder het juk des konings van Babel, en dient hem en zijn volk, zo zult gij leven.", "13": "Waarom zoudt gij sterven, gij en uw volk door het zwaard, door den honger en door de pestilentie, gelijk als de HEERE gesproken heeft van het volk, dat den koning van Babel niet zal dienen.", "14": "Hoort dan niet naar de woorden der profeten, die tot u spreken, zeggende: Gij zult den koning van Babel niet dienen; want zij profeteren u valsheid.", "15": "Want Ik heb ze niet gezonden, spreekt de HEERE, en zij profeteren valselijk in Mijn Naam; opdat Ik u uitstote, en gij omkomt, gij en de profeten, die u profeteren.", "16": "Ook sprak ik tot de priesteren, en tot dit ganse volk, zeggende: Zo zegt de HEERE: Hoort niet naar de woorden uwer profeten, die u profeteren, zeggende: Ziet, de vaten van des HEEREN huis zullen nu haast uit Babel wedergebracht worden; want zij profeteren u valsheid.", "17": "Hoort niet naar hen, *maar* dient den koning van Babel, zo zult gijlieden leven; waarom zou deze stad *tot* een woestheid worden?", "18": "Maar zo zij profeten zijn, en zo des HEEREN woord bij hen is, laat hen nu bij den HEERE der heirscharen voorbidden, opdat de vaten, die in het huis des HEEREN, en in het huis des konings van Juda, en te Jeruzalem zijn overgebleven, niet naar Babel komen.", "19": "Want zo zegt de HEERE der heirscharen, van de pilaren, en van de zee, en van de stellingen, en van het overige der vaten, die in deze stad zijn overgebleven.", "20": "Die Nebukadnezar, de koning van Babel, niet heeft weggenomen, als hij Jechonia, den zoon van Jojakim, koning van Juda, van Jeruzalem, naar Babel gevankelijk wegvoerde, mitsgaders al de edelen van Juda en Jeruzalem;", "21": "Ja, zo zegt de HEERE der heirscharen, de God Israëls, van de vaten, die *in* het huis des HEEREN, en in het huis des konings van Juda, en te Jeruzalem zijn overgebleven:", "22": "Naar Babel zullen zij gebracht worden, en aldaar zullen zij zijn, tot den dag toe, dat Ik ze bezoeken zal, spreekt de HEERE; dan zal Ik ze opvoeren, en zal ze wederbrengen tot deze plaats."}, "KJV": {"1": "In the beginning of the reign of Jehoiakim the son of Josiah king of Judah came this word unto Jeremiah from the LORD, saying,", "2": "Thus saith the LORD to me; Make thee bonds and yokes, and put them upon thy neck,", "3": "And send them to the king of Edom, and to the king of Moab, and to the king of the Ammonites, and to the king of Tyrus, and to the king of Zidon, by the hand of the messengers which come to Jerusalem unto Zedekiah king of Judah;", "4": "And command them to say unto their masters, Thus saith the LORD of hosts, the God of Israel; Thus shall ye say unto your masters;", "5": "I have made the earth, the man and the beast that *are* upon the ground, by my great power and by my outstretched arm, and have given it unto whom it seemed meet", "6": "And now have I given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant; and the beasts of the field have I given him also to serve", "7": "And all nations shall serve him, and his son, and his son's son, until the very time of his land come: and then many nations and great kings shall serve", "8": "And it shall come to pass, *that* the nation and kingdom which will not serve the same Nebuchadnezzar the king of Babylon, and that will not put their neck under the yoke of the king of Babylon, that nation will I punish, saith the LORD, with the sword, and with the famine, and with the pestilence, until I have consumed them by his hand.", "9": "Therefore hearken not ye to your prophets, nor to your diviners, nor to your dreamers, nor to your enchanters, nor to your sorcerers, which speak unto you, saying, Ye shall not serve the king of Babylon:", "10": "For they prophesy a lie unto you, to remove you far from your land; and that I should drive you out, and ye should perish.", "11": "But the nations that bring their neck under the yoke of the king of Babylon, and serve him, those will I let remain still in their own land, saith the LORD; and they shall till it, and dwell", "12": "I spake also to Zedekiah king of Judah according to all these words, saying, Bring your necks under the yoke of the king of Babylon, and serve him and his people, and live.", "13": "Why will ye die, thou and thy people, by the sword, by the famine, and by the pestilence, as the LORD hath spoken against the nation that will not serve the king of Babylon?", "14": "Therefore hearken not unto the words of the prophets that speak unto you, saying, Ye shall not serve the king of Babylon: for they prophesy a lie", "15": "For I have not sent them, saith the LORD, yet they prophesy a lie in my name; that I might drive you out, and that ye might perish, ye, and the prophets that prophesy", "16": "Also I spake to the priests and to all this people, saying, Thus saith the LORD; Hearken not to the words of your prophets that prophesy unto you, saying, Behold, the vessels of the LORD'S house shall now shortly be brought again from Babylon: for they prophesy a lie", "17": "Hearken not unto them; serve the king of Babylon, and live: wherefore should this city be laid waste?", "18": "But if they *be* prophets, and if the word of the LORD be with them, let them now make intercession to the LORD of hosts, that the vessels which are left in the house of the LORD, and *in* the house of the king of Judah, and at Jerusalem, go not to Babylon.", "19": "For thus saith the LORD of hosts concerning the pillars, and concerning the sea, and concerning the bases, and concerning the residue of the vessels that remain in this city,", "20": "Which Nebuchadnezzar king of Babylon took not, when he carried away captive Jeconiah the son of Jehoiakim king of Judah from Jerusalem to Babylon, and all the nobles of Judah and Jerusalem;", "21": "Yea, thus saith the LORD of hosts, the God of Israel, concerning the vessels that remain *in* the house of the LORD, and *in* the house of the king of Judah and of Jerusalem;", "22": "They shall be carried to Babylon, and there shall they be until the day that I visit them, saith the LORD; then will I bring them up, and restore them to this place."}}, "tsk": {"1": [{"kopje": "het begin", "refs": ["Jer 27:3", "Jer 27:12", "Jer 27:19", "Jer 27:20", "Jer 26:1", "Jer 28:1"]}], "2": [{"kopje": "Zo zei de HEERE", "refs": ["Amos 7:1", "Amos 7:4"]}, {"kopje": "Maak u", "refs": ["Jer 27:12", "Jer 28:10-14"]}, {"kopje": "doe die om", "refs": ["Jer 13:1-11", "Jer 18:2-10", "Jer 19:1-11", "Jer 28:10", "1 Kon 11:30", "1 Kon 11:31", "Jes 20:2-4", "Ezech 4:1", "Ezech 5:17", "Ezech 12:1-28", "Ezech 24:3-12"]}], "3": [{"kopje": "Edom", "refs": ["Jer 25:19-26", "Jer 47:1", "Jer 49:39", "Ezech 25:1", "Ezech 28:26", "Ezech 29:18", "Amos 1:9-15", "Amos 2:1-3"]}, {"kopje": "de boden", "refs": ["2 Kron 36:13", "Ezech 17:15-21"]}], "4": [{"kopje": "Zo zegt", "refs": ["Jer 10:10", "Jer 10:16", "Jer 25:27", "Jer 51:19", "Ex 5:1"]  wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!", "Ps 93:1": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Jak 5:16-18": "Belijd elkaar de misdaden, en bid voor elkaar, opdat u gezond wordt; een krachtig gebed van de rechtvaardige vermag veel. Elia was een mens net zo onderhevig aan gevoelens als wij; en hij bad een gebed, dat het niet zou regenen; en het regende niet op de aarde, drie jaar en zes maanden lang. En hij bad opnieuw, en de hemel gaf regen, en de aarde bracht haar vrucht voort.", "Joh 10:5": "Maar een vreemde zullen zij nooit volgen, maar zij zullen van hem wegvluchten; omdat zij de stem van de vreemden niet kennen.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Jer 14:19-21": "Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "Ezech 32:30": "Daar zijn de geweldigen van het noorden, zij allen, en alle Sidoniërs, die met de verslagenen zijn neergedaald, beschaamd vanwege hun schrik die uit hun macht voortkwam, en zij liggen onbesneden bij de verslagenen van het zwaard, en dragen hun schande met hen die in het kuil zijn neergedaald.", "Spr 20:12": "Een horend oor en een ziend oog heeft de HEERE gemaakt, ja, die beide.", "2 Kron 36:20": "En wie overgebleven was van het zwaard, voerde hij weg naar Babel, en zij werden hem en zijn zonen tot knechten, totdat het koninkrijk van Perzië ging regeren;", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Joh 10:10-13": "De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben. Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen. Maar de huurling, die geen herder is, van wie de schapen niet zelf zijn, ziet de wolf komen, en verlaat de schapen, en vlucht; en de wolf grijpt ze, en verstrooit de schapen.", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "2 Kron 1:12": "De wijsheid en de kennis is u gegeven; daartoe zal Ik u rijkdom, en goederen, en eer geven, zoals geen koningen die vóór u geweest zijn, gehad hebben, en na u zal niemand zoiets hebben.", "Deut 7:19": "de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Jes 54:5": "Want uw Maker is uw Man, HEERE van de heerscharen is Zijn Naam; en de Heilige van Israël is uw Verlosser; Hij zal de God van de hele aardbodem genoemd worden.", "Hab 2:7": "Zullen niet onvoorziens opstaan die u zullen bijten, en ontwaken die u zullen doen beven, en zult u hun niet tot buit worden?", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Ezech 12:1-28": "Verder kwam het woord van de HEERE tot mij en Hij zei: Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis. Daarom, mensenkind, maak u gereedschap voor een verhuizing, en vertrek bij dag voor hun ogen; en u zult vertrekken van uw plaats naar een andere plaats voor hun ogen; misschien zullen zij het opmerken, hoewel zij een opstandig huis zijn.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "1 Kor 3:1-4": "En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus. Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet. Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "2 Kron 20:6": "En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Gen 26:5": "omdat Abraham Mijn stem gehoorzaam is geweest, en Mijn bevel heeft onderhouden, Mijn geboden, Mijn inzettingen en Mijn wetten.", "Ps 74:19": "Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Jer 22:25": "En Ik zal u geven in de hand van hen die uw leven zoeken, en in de hand van hen voor wier gezicht u beeft, namelijk in de hand van Nebukadnezar, de koning van Babel, en in de hand van de Chaldeeën.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Luk 1:53": "Hongerigen heeft Hij met goede dingen verzadigd; en rijken heeft Hij met lege handen weggestuurd.", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "Mal 1:14": "Ja, vervloekt is de bedrieger, die een mannetje in zijn kudde heeft, en de Heere een gelofte doet, en offert wat verdorven is! want Ik ben een groot Koning, zegt de HEERE van de heerscharen, en Mijn Naam is ontzagwekkend onder de heidenen.", "Ps 111:6": "Caph. Hij heeft de kracht van Zijn werken aan Zijn volk bekendgemaakt; Lamed. door hun de erve van de heidenen te geven.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Jer 30:4": "En dit zijn de woorden, die de HEERE gesproken heeft van Israël en van Juda.", "Jer 49:39": "Maar het zal gebeuren in het laatste van de dagen, dat Ik Elams gevangenschap wenden zal, spreekt de HEERE.", "Deut 2:19": "En u zult naderen tegenover de kinderen van Ammon; beangstig hen niet, en meng u niet met hen; want Ik zal u van het land van de kinderen van Ammon geen erfenis geven, omdat Ik het aan de kinderen van Lot tot erfenis gegeven heb.", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Gen 9:6": "Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.", "Jona 1:9": "En hij zei tegen hen: Ik ben een Hebreeër; en ik vrees de HEERE, de God van de hemel, Die de zee en het droge gemaakt heeft.", "Ps 116:4": "Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Zach 11:5": "Die hen bezitten doden hen, en houden het niet voor schuld; en ieder van hen die ze verkopen, zegt: Geloofd zij de HEERE, dat ik rijk geworden ben! En niemand van hen die ze weiden, ontziet ze.", "Jes 59:16": "Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Amos 7:1": "De Heere HEERE liet mij dit zien: zie, Hij vormde sprinkhanen, in het begin van het opkomen van het nagras; en zie, het was het nagras, na het maaien van de koning.", "Jer 46:1": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurd is tegen de heidenen.", "Ps 136:5-9": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.", "Ps 8:4": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "Ps 144:5": "Buig Uw hemelen, HEERE, en daal neer; raak de bergen aan, zodat ze roken.", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "Deut 30:15-20": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade. Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven. Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;", "Hos 9:8": "De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.", "Jer 13:20": "Hef uw ogen op, en zie hen die daar uit het noorden komen! Waar is de kudde die u gegeven was, de schapen van uw heerlijkheid?", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Amos 9:6": "Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.", "Gen 1:31": "En God zag al wat Hij gemaakt had, en zie, het was zeer goed. Toen was het avond geweest en het was morgen geweest: de zesde dag.", "Ezra 5:13-15": "Doch in het eerste jaar van Kores, koning van Babel, heeft de koning Kores bevel gegeven dit huis van God te bouwen. Ja, de vaten van het huis van God, die van goud en zilver waren, die Nebukadnezar uit de tempel die te Jeruzalem was, had weggenomen en had gebracht in de tempel van Babel, die heeft de koning Kores gehaald uit de tempel van Babel, en ze zijn gegeven aan iemand wiens naam Sesbazar was, die hij tot landvoogd had gesteld. En hij zei tegen hem: Neem deze vaten, ga ze afvoeren naar de tempel die te Jeruzalem is, en laat het huis van God gebouwd worden op zijn plaats.", "Jer 21:9": "Wie in deze stad blijft, zal sterven door het zwaard, of door de honger, of door de pest; maar wie eruit gaat en overloopt naar de Chaldeeën, die u belegeren, die zal leven, en zijn leven zal hem tot een buit zijn.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Ezech 5:1-4": "En u, mensenkind, neem een scherp mes, een scheermes van de barbiers zult u nemen, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u een weegschaal nemen, en die haren verdelen. Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken. U zult ook een klein aantal daarvan nemen, en in uw slippen binden.", "1 Kor 3:10-16": "Naar de genade van God, die mij gegeven is, heb ik als een wijs bouwmeester het fundament gelegd; en een ander bouwt daarop. Maar ieder ziet toe hoe hij daarop bouwt. Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus. En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;", "Rom 11:36": "Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.", "Neh 9:25": "En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.", "Matt 23:4": "Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Jer 27:9-18": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen. Want zij profeteren u leugens, om u ver uit uw land weg te brengen, en dat Ik u wegjaag, en u omkomt. Maar het volk dat zijn hals onder het juk van de koning van Babel zal brengen, en hem dienen, dat zal Ik in zijn land laten blijven, spreekt de HEERE, en het zal het bebouwen en erin wonen.", "Job 42:9": "Toen gingen Elifaz, de Themaniet, en Bildad, de Suhiet, en Zofar, de Naämathiet, heen, en deden, zoals de HEERE tot hen gesproken had; en de HEERE nam het aangezicht van Job aan.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Jer 51:63": "En het zal gebeuren, als u deze rol geheel gelezen hebt, dat u er een steen aan zult binden, en hem zult werpen in het midden van de Eufraat;", "Spr 8:26-29": "Hij had de aarde nog niet gemaakt, noch de velden, noch het begin van de stofjes van de wereld. Toen Hij de hemelen bereidde, was Ik daar; toen Hij een cirkel over het vlakke van de afgrond beschreef; Toen Hij de opperwolken van boven vestigde; toen Hij de fonteinen van de afgrond vastmaakte;", "Jer 40:9-12": "En Gedalia, de zoon van Ahikam, de zoon van Safan, zwoer hun en hun mannen, en zei: Wees niet bang om de Chaldeeën te dienen; blijf in het land, en dien de koning van Babel, dan zal het u goed gaan. En zie, ik woon te Mizpa, om voor de Chaldeeën te staan die tot ons zullen komen; verzamel u dan wijn, en zomervruchten, en olie, en doe ze in uw vaten, en woon in uw steden die u hebt ingenomen. Toen ook alle Joden die in Moab, en onder de kinderen van Ammon, en in Edom, en die in al die landen waren, hoorden dat de koning van Babel in Juda een overblijfsel gelaten had; en dat hij Gedalia, de zoon van Ahikam, de zoon van Safan, over hen aangesteld had,", "Jes 61:9": "En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Hoogl 2:6": "Zijn linkerhand is onder mijn hoofd, en Zijn rechterhand omhelst mij.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Jer 43:9": "Neem grote stenen in uw hand, en verberg ze in de klei in de ticheloven, die bij de deur van Farao's huis te Tachpanhes is, voor de ogen van de Joodse mannen;", "Ps 147:13": "Want Hij maakt de grendels van uw poorten sterk; Hij zegent uw kinderen binnen in u.", "Ezech 32:11": "Want zo zegt de Heere HEERE: Het zwaard van de koning van Babel zal u overkomen.", "Jer 49:34": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurde tegen Elam, in het begin van het koninkrijk van Zedekia, de koning van Juda, en zei:", "Ps 36:7": "Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.", "Gen 1:1-28": "In het begin schiep God de hemel en de aarde. De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren. En God zei: Laat er licht zijn! En er was licht.", "Jes 40:24": "Ja, zij worden niet geplant, ja, zij worden niet gezaaid, ja, hun afgehouwen stam wortelt niet in de aarde; ook als Hij op hen waait, zullen zij verdorren, en een stormwind zal hen als een stoppel wegnemen.", "Openb 14:8": "En er is een andere engel gevolgd, die zei: Zij is gevallen, zij is gevallen, Babylon, die grote stad, omdat zij uit de wijn van de toorn van haar hoererij alle volken heeft laten drinken.", "Ezech 25:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Ezech 21:19": "U nu, mensenkind, stel u twee wegen voor, waardoor het zwaard van de koning van Babel komt; uit één land zullen zij beide voortkomen; en kies een plaats, kies die aan het hoofd van de weg naar de stad.", "Jer 21:4-10": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Gen 1:1": "In het begin schiep God de hemel en de aarde.", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "Ps 107:25": "Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.", "Micha 4:7": "En Ik zal haar die kreupel was maken tot een overblijfsel, en haar die ver weg verstoten was, tot een machtig volk; en de HEERE zal Koning over hen zijn op de berg Sion, van nu af aan tot in eeuwigheid.", "Jer 51:19": "Jakobs deel is niet gelijk aan hen; want Hij is de Formeerder van alles, en Israël is de stam van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "Jes 14:4-26": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "Ps 77:15": "U bent die God, Die wonderen doet; U hebt Uw sterkte bekendgemaakt onder de volken.", "Ps 136:2": "Loof de God der goden; want Zijn goedertierenheid is voor eeuwig.", "Jes 30:10": "Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "Ps 119:91": "Naar Uw verordeningen blijven zij nog heden staan, want zij allen zijn Uw knechten.", "Mark 10:35-37": "En Jakobus en Johannes, de zonen van Zebedeüs, kwamen naar Hem toe, en zeiden: Meester, wij zouden graag willen dat U voor ons deed wat wij ook zullen vragen. En Hij zei tegen hen: Wat wilt u dat Ik voor u doe? En zij zeiden tegen Hem: Geef ons dat wij mogen zitten, de één aan Uw rechterhand, en de ander aan Uw linkerhand, in Uw heerlijkheid.", "Jer 14:15": "Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden.", "Ps 77:17": "De wateren zagen U, o God! De wateren zagen U, zij beefden; ook waren de afgronden beroerd.", "Ps 13:2-5": "Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen? Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn? Kijk naar mij, verhoor mij, HEERE, mijn God; verlicht mijn ogen, zodat ik niet in de dood ontslaap;", "Jer 38:17": "Jeremia dan zei tegen Zedekia: Zo zegt de HEERE, de God van de heerscharen, de God van Israël: Als u gewillig naar de vorsten van de koning van Babel uitgaat, dan zal uw leven behouden blijven, en deze stad zal niet met vuur verbrand worden; en u zult leven, u en uw huis.", "Amos 1:9-15": "Zo zegt de HEERE: Om drie overtredingen van Tyrus, en om vier zal Ik dat niet afwenden; omdat zij Mijn volk met een volledige wegvoering hebben overgeleverd aan Edom, en niet gedacht hebben aan het verbond van de broeders. Daarom zal Ik een vuur zenden in de muur van Tyrus, dat zal haar paleizen verteren. Zo zegt de HEERE: Om drie overtredingen van Edom, en om vier zal Ik dat niet afwenden; omdat hij zijn broeders met het zwaard heeft vervolgd, en zijn medelijden heeft verdorven; en dat zijn toorn eeuwig verscheurt, en hij zijn woede altijd blijft koesteren.", "Ezech 36:9-11": "Want ziet, Ik ben bij u, en Ik zal u aanzien, en u zult gebouwd en bezaaid worden. En Ik zal mensen op u vermenigvuldigen, het hele huis van Israël, ja, dat geheel; en de steden zullen bewoond, en de eenzame plaatsen bebouwd worden. Ja, Ik zal mensen en beesten op u vermenigvuldigen, en zij zullen vermenigvuldigd worden en vruchtbaar zijn; en Ik zal u doen bewonen, als in uw vorige tijden, ja, Ik zal het beter maken dan in uw beginselen; en u zult weten dat Ik de HEERE ben.", "Deut 4:25": "Wanneer u nu kinderen en kleinkinderen verwekt hebt, en oud geworden bent in het land, en u zich te gronde richt door gesneden beelden te maken, de gelijkenis van iets, en door te doen wat kwaad is in de ogen van de HEERE, uw God, om Hem tot toorn te verwekken;", "Spr 11:11": "Door de zegen van de oprechten wordt een stad verheven; maar door de mond van de goddelozen wordt zij verbroken.", "Ex 9:29": "Toen zei Mozes tegen hem: Zodra ik de stad uitgegaan ben, zal ik mijn handen uitspreiden voor de HEERE; de donder zal ophouden, en de hagel zal niet meer zijn; zodat u weet dat de aarde van de HEERE is!", "Deut 32:11-14": "Zoals een arend zijn nest opwekt, over zijn jongen zweeft, zijn vleugels uitbreidt, ze neemt en ze draagt op zijn vleugels; Zo leidde de HEERE hem alleen, en er was geen vreemde god met hem. Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;", "Ps 82:8": "Sta op, o God! Oordeel het aardrijk, want U bezit alle naties.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Gen 32:11": "Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Matt 24:5": "Want velen zullen komen onder Mijn Naam en zeggen: Ik ben de Christus; en zij zullen velen misleiden.", "Deut 18:10": "Onder u mag niemand gevonden worden die zijn zoon of zijn dochter door het vuur laat gaan, die met waarzeggerij omgaat, een guichelaar, of die op vogelgeschrei let, of een tovenaar,", "Ps 76:13": "Die de geest van de vorsten als druiven afsnijdt; Die de koningen van de aarde vreselijk is.", "Ex 15:18": "De HEERE zal in eeuwigheid en voortdurend regeren!", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "Ps 104:6": "U had haar met de afgrond als een kleed overdekt; de wateren stonden boven de bergen.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "2 Kon 19:16": "HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Joël 1:19": "Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.", "2 Tim 2:17-19": "En hun woord zal voortvreten als de kanker; onder wie zijn Hymeneüs en Filetus; die van de waarheid zijn afgeweken, en zeggen dat de opstanding al gebeurd is, en het geloof van sommigen omverwerpen. Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Matt 5:19": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen.", "Job 12:10": "In Wiens hand de ziel is van alles wat leeft, en de geest van alle vlees van de mens.", "Job 22:18": "Hij had immers hun huizen met goed gevuld; daarom is de raad van de goddelozen ver van mij.", "2 Sam 7:9": "En Ik ben met u geweest, overal waar u gegaan bent, en heb al uw vijanden voor uw aangezicht uitgeroeid; en Ik heb u een grote naam gemaakt, als de naam van de groten die op de aarde zijn.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "2 Kron 4:2-16": "Daartoe maakte hij de gegoten zee; van tien ellen was zij, van de ene rand tot de andere rand, rondom rond, en van vijf ellen in haar hoogte, en een meetsnoer van dertig ellen omving haar rondom. Onder haar nu was de gelijkenis van runderen, die er rondom omheen stonden, tien in een el, die de zee omringden. Twee rijen van deze runderen waren in haar gieting gegoten. Zij stond op twaalf runderen, drie ziende naar het noorden, en drie ziende naar het westen, en drie ziende naar het zuiden, en drie ziende naar het oosten; en de zee was boven op hen; en al hun achterdelen waren naar binnen gekeerd.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Dan 11:41": "En hij zal komen in het land van het sieraad, en veel landen zullen neergeworpen worden; doch deze zullen aan zijn hand ontkomen: Edom en Moab, en de voornaamsten van de kinderen van Ammon.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Deut 4:40": "En u zult Zijn inzettingen en Zijn geboden houden, die ik u vandaag gebied, opdat het u en uw kinderen na u goed gaat, en opdat u de dagen verlengt in het land dat de HEERE, uw God, u geeft, voor altijd.", "Deut 4:34": "Of: of God ooit beproefd heeft te gaan om Zich een volk uit het midden van een ander volk aan te nemen, door beproevingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekte arm, en met grote verschrikkingen; naar alles wat de HEERE, uw God, voor u in Egypte voor uw ogen gedaan heeft?", "Zach 8:12": "Want het zaad zal voorspoedig zijn, de wijnstok zal zijn vrucht geven, en de aarde zal haar opbrengst geven, en de hemel zal zijn dauw geven; en Ik zal het overblijfsel van dit volk dit alles doen erven.", "Jes 28:7": "Maar ook dezen dwalen door de wijn, en zij dolen door de sterke drank; de priester en de profeet dwalen door de sterke drank; zij zijn verslonden door de wijn, zij dolen door sterke drank; zij dwalen in het zien van visioenen; zij waggelen in het rechtspreken.", "Matt 24:4": "En Jezus antwoordde en zei tegen hen: Kijk uit dat niemand u misleidt.", "Jes 47:12-14": "Sta nu met uw bezweringen, en met de veelheid van uw toverijen, waarin u gearbeid hebt van uw jeugd af; misschien kunt u voordeel doen, misschien kunt u zich sterken. U bent moe geworden van de veelheid van uw raadslagen; laat nu opstaan die de hemel waarnemen, die naar de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen die over u komen zullen. Zie, zij zullen zijn als stoppels, het vuur zal ze verbranden, zij zullen zichzelf niet kunnen rukken uit de macht van de vlam; het zal geen kool zijn om bij te warmen, geen vuur om daarvoor bij neer te zitten.", "Ex 23:25": "En u zult de HEERE uw God dienen, dan zal Hij uw brood en uw water zegenen; en Ik zal de ziekten uit uw midden weren.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Jer 25:22": "En alle koningen van Tyrus, en alle koningen van Sidon; en de koningen van de eilanden, die aan de andere kant van de zee zijn.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Joël 2:11": "En de HEERE verheft Zijn stem voor Zijn leger uit; want Zijn leger is zeer groot, want Hij is machtig, Hij die Zijn woord uitvoert; want de dag van de HEERE is groot en zeer vreselijk, en wie zal hem kunnen verdragen?", "Micha 3:5-7": "Zo zegt de HEERE, tegen de profeten, die Mijn volk verleiden; die met hun tanden bijten, en vrede uitroepen; maar tegen hem die niet in hun mond geeft, tegen die heiligen zij een oorlog. Daarom zal het nacht voor u worden vanwege het visioen, en u zal duisternis zijn vanwege de waarzegging; en de zon zal over deze profeten ondergaan; en de dag zal over hen zwart worden. En de zieners zullen beschaamd, en de waarzeggers schaamrood worden; en zij zullen allen samen de bovenlip bewimpelen; want er zal geen antwoord van God zijn.", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Ps 17:6-9": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden. Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan! Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,", "Ps 108:7": "Opdat Uw beminden bevrijd worden; geef heil door Uw rechterhand, en verhoor ons.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Ps 22:30": "Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.", "Job 9:10": "Die grote dingen doet, die men niet doorzoeken kan; en wonderen, die men niet tellen kan.", "Job 34:33": "Zal het van u zijn, hoe Hij iets vergelden zal, omdat u Hem versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.", "Jer 8:10-12": "Daarom zal Ik hun vrouwen aan anderen geven, hun akkers aan andere bezitters; want van de kleinste tot de grootste toe pleegt ieder van hen gierigheid; van de profeet tot de priester toe bedrijft ieder van hen valsheid. En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Terwijl er geen vrede is. Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "1 Tim 1:3-7": "Zoals ik u vermaand heb dat u in Efeze zou blijven, toen ik naar Macedonië reisde, zo vermaan ik het u nog, opdat u sommigen zou bevelen geen andere leer te leren; Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is. Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Jes 62:9": "Maar wie het inzamelen, zullen het eten, en zij zullen de HEERE prijzen; en wie het bijeenbrengen, zullen het drinken in de voorhoven van Mijn heiligdom.", "2 Kon 23:13": "De hoogten ook, die vooraan bij Jeruzalem waren, die aan de rechterhand van de berg Mashith lagen, die Salomo, de koning van Israël, gebouwd had voor Astoreth, het verfoeisel van de Sidoniërs, en voor Kamos, het verfoeisel van de Moabieten, en voor Milchom, de gruwel van de kinderen van Ammon, verontreinigde de koning.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Ezech 25:12-14": "Zo zegt de Heere HEERE: Omdat Edom met louter wraakgierigheid gehandeld heeft tegen het huis van Juda, en zij zich zeer schuldig gemaakt hebben doordat zij zich op hen gewroken hebben: Daarom, zo zegt de Heere HEERE: Ik zal ook Mijn hand uitstrekken tegen Edom, en Ik zal mens en dier uit haar uitroeien; en Ik zal haar tot een woestenij maken, vanaf Teman; en zij zullen tot Dedan toe door het zwaard vallen. En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Openb 2:18": "En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:", "Ezech 17:24": "Zo zullen alle bomen van het veld weten dat Ik, de HEERE, de hoge boom vernederd heb, de nederige boom verheven heb, de groene boom verdroogd heb, en de droge boom bloeiend gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Hab 3:15": "U betrad met Uw paarden de zee; het geweldige water werd een hoop.", "Ps 64:3": "Verberg mij voor de heimelijke afspraken van de boosdoeners, voor het oproer van de werkers van ongerechtigheid.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Jer 19:10": "Dan zult u de kruik verbreken voor de ogen van de mannen, die met u meegegaan zijn;", "Openb 2:20-23": "Maar Ik heb enkele weinige dingen tegen u, dat u de vrouw Izébel toelaat, die zichzelf een profetes noemt, te leren en Mijn dienstknechten te verleiden, zodat zij hoereren en afgodenoffer eten. En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd. Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Ezech 36:28-38": "En u zult wonen in het land dat Ik uw vaderen gegeven heb, en u zult Mij tot een volk zijn, en Ik zal u tot een God zijn. En Ik zal u verlossen van al uw onreinheden; en Ik zal roepen tot het koren, en zal dat vermenigvuldigen, en Ik zal geen honger op u leggen. En Ik zal de vrucht van het geboomte en de opbrengst van het veld vermenigvuldigen, opdat u de smaad van het honger niet meer ontvangt onder de heidenen.", "Ps 145:6": "Vau. En zij zullen vermelden de kracht van Uw ontzagwekkende daden; en Uw grootheid, die zal ik vertellen.", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Hebr 1:10": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen;", "Job 11:17-19": "Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn. En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen; En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "Openb 13:8": "En allen die op de aarde wonen, zullen hem aanbidden, van wie de namen niet zijn geschreven in het boek des levens van het Lam, Dat geslacht is, van de grondlegging van de wereld af.", "Job 31:15": "Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Jes 43:13": "Ook eer de dag was, ben Ik, en er is niemand, die uit Mijn hand redden kan; Ik zal werken, en wie zal het keren?", "Ps 61:2": "O God! hoor mijn geschrei, merk op mijn gebed.", "Jer 23:16": "Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.", "Ezech 13:6-15": "Zij zien nietigheid en leugenachtige voorzegging, zij die zeggen: De HEERE heeft gesproken, terwijl de HEERE hen niet gezonden heeft; en zij geven hoop dat het woord vervuld zal worden. Ziet u niet een nietig gezicht, en spreekt u een leugenachtige voorzegging, als u zegt: De HEERE spreekt, terwijl Ik niet gesproken heb? Daarom zegt de Heere HEERE zo: Omdat u nietigheid spreekt, en leugen ziet; daarom, zie, Ik ben tegen u, spreekt de Heere HEERE.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "Jes 44:6": "Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE van de heerscharen: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.", "Gen 27:37-40": "Toen antwoordde Izak, en zei tegen Ezau: Zie, ik heb hem tot een heer over u gesteld, en al zijn broers heb ik hem tot knechten gegeven; en ik heb hem met koren en most ondersteund; wat zal ik dan nu voor u doen, mijn zoon? En Ezau zei tegen zijn vader: Hebt u maar deze ene zegen, mijn vader? Zegen mij, ook mij, mijn vader! En Ezau verhief zijn stem, en weende. Toen antwoordde zijn vader Izak en zei tegen hem: Zie, de vettigheden van de aarde zullen uw woningen zijn, en van de dauw van de hemel van boven af zult u gezegend zijn.", "Deut 32:13": "Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;", "Joël 3:19": "Egypte zal tot een verwoesting worden, en Edom zal worden tot een woeste wildernis, om het geweld, gedaan aan de kinderen van Juda, in wier land zij onschuldig bloed vergoten hebben.", "Tit 3:10": "Verwerp iemand die een ketter is, na de eerste en tweede vermaning;", "Jer 46:13": "Het woord, dat de HEERE tot de profeet Jeremia sprak, over de aankomst van Nebukadrezar, de koning van Babel, om Egypteland te slaan.", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "Ezech 29:18": "Mensenkind! Nebukadrezar, de koning van Babel, heeft zijn leger een grote dienst laten verrichten tegen Tyrus; alle hoofden zijn kaal geworden, en alle zijden zijn opengeschuurd; en noch hij, noch zijn leger heeft loon gehad vanwege Tyrus, voor de dienst die hij tegen haar verricht heeft.", "Zach 12:1": "De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert.", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Jer 28:3": "In nog twee volle jaren zal Ik naar deze plaats terugbrengen al de voorwerpen van het huis van de HEERE, die Nebukadnezar, de koning van Babel, uit deze plaats heeft weggenomen en naar Babel gebracht.", "Jer 20:6": "En u, Pashur, en alle bewoners van uw huis! U zult in gevangenschap gaan; en u zult in Babel komen, en daar sterven, en daar begraven worden, u en al uw vrienden, aan wie u vals geprofeteerd hebt.", "Hebr 1:2": "Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft;", "2 Kron 18:17-22": "Toen zei de koning van Israël tegen Josafat: Heb ik u niet gezegd: Hij zal over mij niets goeds, maar kwaad profeteren? Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger staande aan Zijn rechterhand en Zijn linkerhand. En de HEERE zei: Wie zal Achab, de koning van Israël, overreden, zodat hij optrekt en valt bij Ramoth in Gilead? Daarna zei Hij: Deze zegt het zo, en die zegt het zo.", "Jes 43:17": "Die wagens en paarden, leger en macht voortbracht; samen zijn zij neergelegen, zij zullen niet weer opstaan, zij zijn uitgeblust, als een vlaswiek zijn zij uitgegaan.", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Amos 9:13": "Zie, de dagen komen, spreekt de HEERE, dat de ploeger de maaier zal bereiken, en de druiventreder de zaadzaaier; en de bergen zullen van zoete wijn druipen, en alle heuvels zullen smelten.", "Jer 27:6-9": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken. En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "1 Kon 2:4": "opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.", "Jes 45:18": "Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, maar heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.", "Ps 119:76": "Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht.", "Jer 27:5-7": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.", "2 Sam 22:13": "Van de glans voor Hem heen werden kolen van het vuur aangestoken.", "Spr 19:27": "Laat af, mijn zoon, om, terwijl u de tucht hoort, af te dwalen van de woorden van de kennis.", "Ezech 33:11": "Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël?", "Ps 64:2": "Hoor, o God, mijn stem in mijn geklaag; behoed mijn leven voor de schrik van de vijand.", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Deut 2:21": "Een groot en talrijk volk, en lang van gestalte, zoals de Enakieten; en de HEERE verdelgde hen voor hun aangezicht, zodat zij hen uit hun bezit verdreven, en in hun plaats woonden;", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Jer 47:1": "Het woord van de HEERE dat gebeurde tot de profeet Jeremia, tegen de Filistijnen; voordat Farao Gaza sloeg.", "Deut 12:28": "Neem het waar, en hoor al deze woorden die ik u gebied, opdat het u, en uw kinderen na u, goed gaat tot in eeuwigheid, als u zult gedaan hebben wat goed en recht is in de ogen van de HEERE, uw God.", "Job 5:24-26": "En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen. Ook zult u bevinden dat uw nageslacht talrijk zal zijn, en uw spruiten als het kruid van de aarde. U zult in ouderdom naar het graf gaan, zoals de korenhoop op zijn tijd wordt opgevoerd.", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "Jer 32:31": "Want tot Mijn toorn en tot Mijn grimmigheid is Mij deze stad geweest, vanaf de dag dat zij haar gebouwd hebben tot op deze dag toe; zodat Ik haar van Mijn aangezicht wegdeed;", "Luk 11:46-52": "Maar Hij zei: Wee ook u, wetgeleerden! want u belast de mensen met lasten die zwaar zijn om te dragen, en zelf raakt u die lasten niet aan met één van uw vingers. Wee u, want u bouwt de graven van de profeten, en uw vaders hebben hen gedood. Zo getuigt u dus dat u instemt met de daden van uw vaderen; want zij hebben hen gedood, en u bouwt hun graven.", "Ps 89:48": "Gedenk wat voor eeuw ik ben; waarom zou Gij alle mensenkinderen tevergeefs geschapen hebben?", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Joz 1:2": "Mijn knecht Mozes is gestorven; maak u nu op, trek deze Jordaan over, u en al dit volk, naar het land dat Ik hun, de kinderen van Israël, geef.", "Jer 25:15-22": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;", "Job 37:1-23": "Ook hierover beeft mijn hart, en springt op uit zijn plaats. Hoort met aandacht naar de beweging van Zijn stem, en het geluid dat uit Zijn mond uitgaat! Dat zendt Hij rechtuit onder de hele hemel, en Zijn licht over de einden der aarde.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "1 Petr 2:12": "En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet.", "Joël 2:18-26": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen. En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen. En Ik zal hem die uit het noorden komt ver van u doen vertrekken, en hem wegdrijven in een dor en woest land, zijn voorkant naar de Oostzee, en zijn achterkant naar de verste zee; en zijn stank zal opgaan, en zijn vuiligheid zal opgaan; want hij heeft grote dingen gedaan.", "Klaagl 5:19-22": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht. Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten? HEERE, bekeer ons tot U, dan zullen wij bekeerd zijn; vernieuw onze dagen als vanouds.", "Ps 79:5": "Hoe lang, HEERE? Zult U eeuwig toornen? Zal Uw ijver als vuur branden?", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Ps 86:1-17": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Jes 33:3": "Van het geluid van het rumoer zullen de volken wegvluchten; van Uw verhoging zullen de heidenvolken verstrooid worden.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Ezech 13:6-9": "Zij zien nietigheid en leugenachtige voorzegging, zij die zeggen: De HEERE heeft gesproken, terwijl de HEERE hen niet gezonden heeft; en zij geven hoop dat het woord vervuld zal worden. Ziet u niet een nietig gezicht, en spreekt u een leugenachtige voorzegging, als u zegt: De HEERE spreekt, terwijl Ik niet gesproken heb? Daarom zegt de Heere HEERE zo: Omdat u nietigheid spreekt, en leugen ziet; daarom, zie, Ik ben tegen u, spreekt de Heere HEERE.", "Matt 23:13": "Maar wee u, Schriftgeleerden en Farizeeën, huichelaars! Want u sluit het Koninkrijk der hemelen voor de mensen, want u gaat er zelf niet in, en degenen die er in willen gaan, laat u niet ingaan.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Jes 48:21": "En: Zij hadden geen dorst, toen Hij hen leidde door de woeste plaatsen; Hij deed hun water uit de rotssteen vloeien; toen Hij de rotssteen kliefde, vloeide het water daarheen.", "Jer 34:2": "Zo zegt de HEERE, de God van Israël: Ga heen en spreek tot Zedekia, de koning van Juda, en zeg tegen hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Ps 144:12-15": "opdat onze zonen zijn als planten, die groot geworden zijn in hun jeugd; onze dochters als hoekstenen, uitgehouwen naar het voorbeeld van een paleis. Dat onze schuren vol zijn, de ene voorraad na de andere opleverend; dat onze kudden bij duizenden jongen werpen, ja, bij tienduizenden op onze velden zich vermenigvuldigen. Dat onze ossen goed beladen zijn; dat er geen inbraak is, geen uitval, geen gejammer op onze straten.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Hos 5:1": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "1 Kor 15:38": "Maar God geeft het een lichaam zoals Hij wil, en aan ieder zaad zijn eigen lichaam.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Zef 2:10": "Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Joz 13:22": "Daarbij hebben de kinderen van Israël met het zwaard gedood Bileam, de zoon van Beor, de waarzegger, naast degenen die door hen verslagen zijn.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Jes 43:28": "Daarom zal Ik de leiders van het heiligdom ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen.", "Job 9:8": "Die alleen de hemelen uitbreidt, en treedt op de hoogten van de zee;", "Zach 11:16": "Want zie, Ik zal een herder verwekken in dit land; wat gereed is om afgesneden te worden, zal hij niet bezoeken; het jonge zal hij niet zoeken, en het verbrokene zal hij niet helen, en het stilstaande zal hij niet dragen; maar het vlees van het vette zal hij eten, en hun klauwen zal hij verscheuren.", "Ps 42:10": "Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?", "Jer 49:1-6": "Tegen de kinderen van Ammon zegt de HEERE zo: Heeft Israël dan geen kinderen? Heeft hij geen erfgenaam? Waarom is dan Malcham erfgenaam van Gad, en waarom woont zijn volk in zijn steden? Daarom, zie, de dagen komen, spreekt de HEERE, dat Ik over Rabba van de kinderen van Ammon een krijgsgeschreeuw zal doen horen, en zij zal tot een woeste hoop worden, en haar onderhorige plaatsen zullen met vuur aangestoken worden; en Israël zal erven van hen die hem geërfd hadden, zegt de HEERE. Huil, o Hesbon! want Ai is verwoest; roep, dochters van Rabba, gord zakken aan, drijf misbaar, en loop heen en weer bij de tuinen; want Malcham zal wandelen in gevangenschap, zijn priesters en zijn vorsten samen.", "Ps 139:13": "Want U bezit mijn nieren; U hebt mij in de buik van mijn moeder bedekt.", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "Gen 1:30": "Maar aan al de dieren van de aarde, en aan al het gevogelte van de hemel, en aan al het kruipende gedierte op de aarde, waarin een levende ziel is, heb Ik al het groene gewas tot voedsel gegeven. En het was zo.", "Ps 104:29": "Verbergt U Uw gezicht, zij worden angstig; neemt U hun adem weg, zij sterven, en zij keren terug tot hun stof.", "Ps 103:19": "De HEERE heeft Zijn troon in de hemelen bevestigd, en Zijn Koninkrijk heerst over alles.", "Ezech 25:1-11": "En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Zet uw gezicht tegen de kinderen van Ammon, en profeteer tegen hen; En zeg tegen de kinderen van Ammon: Hoor het woord van de Heere HEERE: Zo zegt de Heere HEERE: Omdat u gezegd hebt: Ha! over Mijn heiligdom, toen het ontheiligd werd, en over het land van Israël, toen het verwoest werd, en over het huis van Juda, toen zij in gevangenschap gingen;", "Deut 26:8": "En de HEERE voerde ons uit Egypte, door een sterke hand, en door een uitgestrekte arm, en door grote schrik, en door tekenen, en door wonderen.", "Ps 146:5-9": "Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is; Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid. Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Openb 13:12-14": "En het oefent al de macht van het eerste beest uit, in tegenwoordigheid van hem, en het maakt dat de aarde, en zij die daarin wonen, het eerste beest aanbidden, van wie de dodelijke wond genezen was. En het doet grote tekenen, zodat het zelfs vuur uit de hemel laat neerkomen op de aarde, voor de ogen van de mensen. En het verleidt hen die op de aarde wonen, door de tekenen die hem gegeven zijn te doen in de tegenwoordigheid van het beest; en het zegt tegen hen die op de aarde wonen dat zij een beeld moeten maken voor het beest dat de wond van het zwaard had, en weer levend werd.", "2 Kron 25:9": "En Amazia zei tegen de man van God: Maar wat moet men doen met de honderd talenten, die ik aan de troepen van Israël gegeven heb? En de man van God zei: De HEERE heeft meer dan dit, om u te geven.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Jes 13:8-22": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn. Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen. Want de sterren van de hemel en zijn sterrenbeelden zullen hun licht niet laten schijnen; de zon zal verduisterd worden wanneer zij opgaat, en de maan zal haar licht niet laten schijnen.", "Deut 4:17": "De gedaante van enig beest dat op de aarde is; de gedaante van een gevleugelde vogel, die door de hemel vliegt;", "Jes 43:20": "Het gedierte van het veld zal Mij eren, de jakhalzen en de jonge struisvogels; want Ik zal in de woestijn water geven, en rivieren in de wildernis, om Mijn volk, Mijn uitverkorenen te drinken te geven.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met
