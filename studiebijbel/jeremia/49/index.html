,"vertalingen":{"SVnu":{"1":"Tegen de kinderen van Ammon zegt de HEERE zo: Heeft Israël dan geen kinderen? Heeft hij geen erfgenaam? Waarom is dan Malcham erfgenaam van Gad, en *waarom* woont zijn volk in zijn steden?","2":"Daarom, zie, de dagen komen, spreekt de HEERE, dat Ik over Rabba van de kinderen van Ammon een krijgsgeschreeuw zal doen horen, en zij zal tot een woeste hoop worden, en haar onderhorige plaatsen zullen met vuur aangestoken worden; en Israël zal erven van hen die hem geërfd hadden, zegt de HEERE.","3":"Huil, o Hesbon! want Ai is verwoest; roep, dochters van Rabba, gord zakken aan, drijf misbaar, en loop heen en weer bij de tuinen; want Malcham zal wandelen in gevangenschap, zijn priesters en zijn vorsten samen.","4":"Wat beroemt u zich op *uw* dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?","5":"Zie, Ik zal vrees over u brengen, spreekt de Heere, de HEERE van de heerscharen[1], van allen die rondom u zijn, en u zult, ieder voor zich heen, weggedreven worden, en niemand zal hen die omzwerven bijeenbrengen.","6":"Maar daarna zal Ik de gevangenschap van de kinderen van Ammon wenden, spreekt de HEERE.","7":"Tegen Edom zegt de HEERE van de heerscharen zo: Is er dan geen wijsheid meer te Theman? Is de raad vergaan van de verstandigen? Is hun wijsheid onnut geworden?","8":"Vlucht, keer u om, woon in diepe *plaatsen*, inwoners van Dedan! want Ik heb Ezaus verderf over hem gebracht, de tijd waarop Ik hem bezocht heb.","9":"Als er wijnoogsters tot u gekomen waren, zouden zij niet een nalezing hebben overgelaten? Als er dieven bij nacht *gekomen waren*, zouden zij *niet* verwoest hebben zoveel hun genoeg was?","10":"Maar Ik heb Ezau ontbloot, Ik heb zijn verborgen plaatsen ontdekt, zodat hij zich niet zal kunnen verstoppen; zijn nageslacht is verwoest, ook zijn broeders en zijn buren, en hij is er niet *meer*.","11":"Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.","12":"Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.","13":"Want Ik heb bij Mijzelf gezworen, spreekt de HEERE, dat Bozra zal worden tot een ontzetting, tot een smaad, tot een woestheid, en tot een vloek; en al haar steden zullen worden tot eeuwige woestheden.","14":"Ik heb een gerucht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken, *om* *te* *zeggen*: Verzamel u, en kom aan tegen haar, en maak u op ten strijde.","15":"Want zie, Ik heb u klein gemaakt onder de heidenvolken, veracht onder de mensen.","16":"Uw verschrikkelijkheid heeft u bedrogen, *en* de trots van uw hart, u die woont in de kloven van de steenrotsen, die de hoogte van de heuvels vasthoudt! Al zou u uw nest *zo* hoog maken als de arend, toch zal Ik u vandaar neerstoten, spreekt de HEERE.","17":"Zo zal Edom worden tot een ontzetting; ieder die voorbij haar gaat, zal zich ontzetten, en fluiten over al haar plagen.","18":"Zoals de omkering van Sodom en Gomorra en haar buren, zal het zijn, zegt de HEERE; niemand zal daar wonen, en geen mensenkind daarin verblijven.","19":"Zie, gelijk een leeuw uit de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hem in een ogenblik daaruit doen wegrennen; en wie *daartoe* uitverkoren is, *hem* zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden, en wie is die herder die voor Mijn aangezicht bestaan zou?","20":"Daarom, hoor de raadsbesluit van de HEERE, dat Hij over Edom heeft beraadslaagd, en Zijn gedachten, die Hij gedacht heeft over de inwoners van Theman: Zeker, de geringste van de kudde zal hen neertrekken! Zeker, hij zal hun woning boven hen verwoesten!","21":"De aarde heeft gebeefd van het geluid van hun val, *van* het geroep, waarvan het geluid gehoord is bij de Schelfzee.","22":"Zie, hij zal opkomen en snel vliegen, als een arend, en zijn vleugels over Bozra uitspreiden; en het hart van Edoms helden zal op die dag wezen als het hart van een vrouw die in nood is.","23":"Tegen Damaskus. Beschaamd is Hamath en Arpad; omdat zij een slecht gerucht gehoord hebben, zijn zij gesmolten; bij de zee is bekommernis, men kan er niet rusten.","24":"Damaskus is slap geworden, zij heeft zich omgekeerd om te vluchten, en siddering heeft haar aangegrepen; benauwdheid en smarten als van een barende *vrouw* hebben haar bevangen;","25":"Hoe is de beroemde stad niet gelaten, de stad van mijn vrolijkheid!","26":"Daarom zullen haar jongelingen vallen op haar straten; en al *haar* krijgslieden zullen op die dag neergehouwen worden, spreekt de HEERE van de heerscharen.","27":"En Ik zal een vuur aansteken in de muur van Damaskus, en het zal Benhadads paleizen verteren.","28":"Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg, zegt de HEERE zo: Maak u op, trek op tegen Kedar, en verwoest de kinderen van het oosten.","29":"Zij zullen hun tenten en hun kudden nemen, hun gordijnen en al hun gereedschap, en hun kamelen voor zich wegnemen; en zij zullen tegen hen uitroepen: Schrik van rondom!","30":"Vlucht, zwerf vlug heen, woon in diepe *plaatsen*, inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadsbesluit tegen u beraadslaagd, en een gedachte tegen hen gedacht.","31":"Maak u op, trek op tegen het volk dat rust heeft, dat in zekerheid woont, spreekt de HEERE; dat geen deuren noch grendel heeft, *dat* alleen woont.","32":"En hun kamelen zullen ten roof zijn, en de menigte van hun vee zal ten buit zijn; en Ik zal hen verstrooien in alle windrichtingen, *namelijk* hen die aan de hoeken afgekort zijn; en Ik zal hun verderf van alle kanten aanbrengen, spreekt de HEERE.","33":"En Hazor zal worden tot een drakenwoning, een verwoesting tot in eeuwigheid; niemand zal daar wonen, en geen mensenkind daarin verblijven.","34":"Het woord van de HEERE, dat tot de profeet Jeremia gebeurde tegen Elam, in het begin van het koninkrijk van Zedekia, de koning van Juda, en zei:","35":"Zo zegt de HEERE van de heerscharen: Zie, Ik zal Elams boog verbreken, het voornaamste van hun geweld.","36":"En Ik zal de vier winden uit de vier hoeken van de hemel over Elam aanbrengen, en zal hen in al die winden verstrooien; en er zal geen volk zijn waarheen Elams verdrevenen niet zullen komen.","37":"En Ik zal Elam versaagd maken voor het aangezicht van hun vijanden, en voor het aangezicht van hen die hun ziel zoeken, en zal een kwaad over hen brengen, de gloed van Mijn toorn, spreekt de HEERE; en Ik zal het zwaard achter hen zenden, totdat Ik hen verteerd zal hebben.","38":"En Ik zal Mijn troon in Elam stellen; en zal de koning en de vorsten van daar wegvagen, spreekt de HEERE;","39":"Maar het zal gebeuren in het laatste van de dagen, dat Ik Elams gevangenschap wenden zal, spreekt de HEERE."},"SV":{"1":"Tegen de kinderen Ammons zegt de HEERE alzo: Heeft dan Israël geen kinderen? Heeft hij geen erfgenaam? Waarom is dan Malcham erfgenaam van Gad, en *waarom* woont zijn volk in deszelfs steden?","2":"Daarom ziet, de dagen komen, spreekt de HEERE, dat Ik over Rabba der kinderen Ammons een krijgsgeschrei zal doen horen, en zij zal tot een woesten hoop worden, en haar onderhorige plaatsen zullen met vuur aangestoken worden; en Israël zal erven degenen, die hem geërfd hadden, zegt de HEERE.","3":"Huil, o Hesbon! want Ai is verstoord; krijt, gij dochteren van Rabba, gordt zakken aan, drijft misbaar, en loopt om bij de tuinen; want Malcham zal wandelen in gevangenis, zijn priesteren en zijn vorsten te zamen.","4":"Wat roemt gij op *uw* dalen? Uw dal is weggevloten, gij afkerige dochter! die op haar schatten vertrouwt, *zeggende*: Wie zou tegen mij komen?","5":"Ziet, Ik zal vreze over u brengen, spreekt de Heere, de HEERE der heirscharen, van allen, die rondom u zijn, en gijlieden zult, een iegelijk voor zich henen, uitgedreven worden, en niemand zal den omdolende vergaderen.","6":"Maar daarna zal Ik de gevangenis der kinderen Ammons wenden, spreekt de HEERE.","7":"Tegen Edom zegt de HEERE der heirscharen alzo: Is er dan geen wijsheid meer te Theman? Is de raad vergaan van de verstandigen? Is hunlieder wijsheid onnut geworden?","8":"Vliedt, wendt u, woont in diepe *plaatsen*, gij inwoners van Dedan! want Ik heb Ezau’s verderf over hem gebracht, den tijd, *dat* Ik hem bezocht heb.","9":"Zo er wijnlezers tot u gekomen waren, zouden zij niet een nalezing hebben overgelaten? Zo er dieven bij nacht *gekomen* *waren*, zouden zij *niet* verdorven hebben zoveel hun genoeg ware?","10":"Maar Ik heb Ezau ontbloot, Ik heb zijn verborgene plaatsen ontdekt, dat hij zich niet zal kunnen versteken; zijn zaad is verstoord, ook zijn broeders, en zijn naburen, en hij is er niet *meer*.","11":"Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.","12":"Want zo zegt de HEERE: Ziet, degenen, welker oordeel het niet is den beker te drinken, zullen ganselijk drinken; en zoudt gij enigszins onschuldig gehouden worden? Gij zult niet onschuldig worden gehouden, maar gij zult ganselijk drinken.","13":"Want Ik heb bij Mijzelven gezworen, spreekt de HEERE, dat Bozra worden zal tot een ontzetting, tot een smaadheid, tot een woestheid, en tot een vloek; en al haar steden zullen worden tot eeuwige woestheden.","14":"Ik heb een gerucht gehoord van den HEERE, en er is een gezant geschikt onder de heidenen, *om* *te* *zeggen*: Vergadert u, en komt aan tegen haar, en maakt u op ten strijde.","15":"Want zie, Ik heb u klein gemaakt onder de heidenen, veracht onder de mensen.","16":"Uw schrikkelijkheid heeft u bedrogen, *en* de trotsheid uws harten, gij, die woont in de kloven der steenrotsen, die u houdt op de hoogte der heuvelen! Al zoudt gij uw nest *zo* hoog maken als de arend, zo zal Ik u van daar nederstoten, spreekt de HEERE.","17":"Alzo zal Edom worden tot een ontzetting; al wie voorbij haar gaat, zal zich ontzetten, en fluiten over al haar plagen.","18":"Gelijk de omkering van Sodom en Gomorra en haar naburen, zal het zijn, zegt de HEERE; niemand zal daar wonen, en geen mensenkind daarin verkeren.","19":"Ziet, gelijk een leeuw van de verheffing der Jordaan, zal hij opkomen tegen de sterke woning; want Ik zal hem in een ogenblik daaruit doen lopen; en wie *daartoe* verkoren is, *dien* zal Ik tegen haar bestellen; want wie is Mij gelijk, en wie zou Mij dagvaarden, en wie is die herder, die voor Mijn aangezicht bestaan zou?","20":"Daarom hoort des HEEREN raadslag, dien Hij over Edom heeft beraadslaagd, en Zijn gedachten, die Hij gedacht heeft over de inwoners van Theman: Zo de geringsten van de kudde hen niet zullen nedertrekken! Indien hij hunlieder woning niet boven hen zal verwoesten!","21":"De aarde heeft gebeefd van het geluid huns vals, *van* het gekrijt, welks geluid gehoord is bij de Schelfzee.","22":"Ziet, hij zal opkomen en snel vliegen, als een arend, en zijn vleugelen over Bozra uitbreiden; en het hart van Edoms helden zal te dien dage wezen, als het hart ener vrouw, die in nood is.","23":"Tegen Damaskus. Beschaamd is Hamath en Arpad; omdat zij een boos gerucht gehoord hebben, zijn zij gesmolten; bij de zee is bekommernis, men kan er niet rusten.","24":"Damaskus is slap geworden, zij heeft zich gewend, om te vluchten, en siddering heeft haar aangegrepen; benauwdheid en smarten als van een barende *vrouw* hebben haar bevangen;","25":"Hoe is de beroemde stad niet gelaten, de stad Mijner vrolijkheid!","26":"Daarom zullen haar jongelingen vallen op haar straten; en al *haar* krijgslieden zullen te dien dage nedergehouwen worden, spreekt de HEERE der heirscharen.","27":"En Ik zal een vuur aansteken in den muur van Damaskus, en het zal Benhadads paleizen verteren.","28":"Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg, zegt de HEERE alzo: Maakt u op, trekt op tegen Kedar, en verstoort de kinderen van het oosten.","29":"Zij zullen hun tenten en hun kudden nemen, hun gordijnen en al hun gereedschap, en hun kemelen voor zich wegnemen; en zij zullen tegen hen uitroepen: Schrik van rondom!","30":"Vliedt, zwerft fluks henen weg, woont in diepe *plaatsen*, gij inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadslag tegen ulieden beraadslaagd, en een gedachte tegen hen gedacht.","31":"Maakt u op, trekt op tegen het volk, dat rust heeft, dat in zekerheid woont, spreekt de HEERE; dat geen deuren noch grendel heeft, *die* alleen wonen.","32":"En hun kemelen zullen ten roof zijn, en de menigte van hun vee zal ten buit zijn; en Ik zal hen verstrooien in alle winden, *te* *weten* degenen, die aan de hoeken afgekort zijn; en Ik zal hunlieder verderf van al zijn zijden aanbrengen, spreekt de HEERE.","33":"En Hazor zal worden tot een drakenwoning, een verwoesting tot in eeuwigheid; niemand zal daar wonen, en geen mensenkind daarin verkeren.","34":"Het woord des HEEREN, dat tot den profeet Jeremia geschied is tegen Elam, in het begin des koninkrijks van Zedekia, den koning van Juda, zeggende:","35":"Zo zegt de HEERE der heirscharen: Ziet, Ik zal verbreken Elams boog, het voornaamste van hunlieder geweld.","36":"En Ik zal de vier winden uit de vier hoeken des hemels over Elam aanbrengen, en zal hen in al diezelve winden verstrooien; en er zal geen volk zijn, waarhenen Elams verdrevenen niet zullen komen.","37":"En Ik zal Elam versaagd maken voor het aangezicht hunner vijanden, en voor het aangezicht dergenen, die hun ziel zoeken, en zal een kwaad over hen brengen, de hittigheid mijns toorns, spreekt de HEERE; en Ik zal het zwaard achter hen zenden, totdat Ik hen verteerd zal hebben.","38":"En Ik zal Mijn troon in Elam stellen; en zal den koning en de vorsten van daar vernielen, spreekt de HEERE;","39":"Maar het zal geschieden in het laatste der dagen, dat Ik Elams gevangenis wenden zal , spreekt de HEERE."},"KJV":{"1":"Concerning the Ammonites, thus saith the LORD; Hath Israel no sons? hath he no heir? why *then* doth their king inherit Gad, and his people dwell in his cities?","2":"Therefore, behold, the days come, saith the LORD, that I will cause an alarm of war to be heard in Rabbah of the Ammonites; and it shall be a desolate heap, and her daughters shall be burned with fire: then shall Israel be heir unto them that were his heirs, saith the LORD.","3":"Howl, O Heshbon, for Ai is spoiled: cry, ye daughters of Rabbah, gird you with sackcloth; lament, and run to and fro by the hedges; for their king shall go into captivity, *and* his priests and his princes together.","4":"Wherefore gloriest thou in the valleys, thy flowing valley, O backsliding daughter? that trusted in her treasures, *saying*, Who shall come","5":"Behold, I will bring a fear upon thee, saith the Lord GOD of hosts, from all those that be about thee; and ye shall be driven out every man right forth; and none shall gather up him that wandereth.","6":"And afterward I will bring again the captivity of the children of Ammon, saith the LORD.","7":"Concerning Edom, thus saith the LORD of hosts; *Is* wisdom no more in Teman? is counsel perished from the prudent? is their wisdom vanished?","8":"Flee ye, turn back, dwell deep, O inhabitants of Dedan; for I will bring the calamity of Esau upon him, the time *that* I will visit","9":"If grapegatherers come to thee, would they not leave *some* gleaning grapes? if thieves by night, they will destroy till they have enough.","10":"But I have made Esau bare, I have uncovered his secret places, and he shall not be able to hide himself: his seed is spoiled, and his brethren, and his neighbours,","11":"Leave thy fatherless children, I will preserve *them* alive; and let thy widows trust","12":"For thus saith the LORD; Behold, they whose judgment *was* not to drink of the cup have assuredly drunken; and *art* thou he *that* shall altogether go unpunished? thou shalt not go unpunished, but thou shalt surely drink","13":"For I have sworn by myself, saith the LORD, that Bozrah shall become a desolation, a reproach, a waste, and a curse; and all the cities thereof shall be perpetual wastes.","14":"I have heard a rumour from the LORD, and an ambassador is sent unto the heathen, *saying*, Gather ye together, and come against her, and rise up to the battle.","15":"For, lo, I will make thee small among the heathen, *and* despised among men.","16":"Thy terribleness hath deceived thee, *and* the pride of thine heart, O thou that dwellest in the clefts of the rock, that holdest the height of the hill: though thou shouldest make thy nest as high as the eagle, I will bring thee down from thence, saith the LORD.","17":"Also Edom shall be a desolation: every one that goeth by it shall be astonished, and shall hiss at all the plagues","18":"As in the overthrow of Sodom and Gomorrah and the neighbour *cities* thereof, saith the LORD, no man shall abide there, neither shall a son of man dwell","19":"Behold, he shall come up like a lion from the swelling of Jordan against the habitation of the strong: but I will suddenly make him run away from her: and who *is* a chosen *man, that* I may appoint over her? for who *is* like me? and who will appoint me the time? and who *is* that shepherd that will stand before","20":"Therefore hear the counsel of the LORD, that he hath taken against Edom; and his purposes, that he hath purposed against the inhabitants of Teman: Surely the least of the flock shall draw them out: surely he shall make their habitations desolate","21":"The earth is moved at the noise of their fall, at the cry the noise thereof was heard in the Red sea.","22":"Behold, he shall come up and fly as the eagle, and spread his wings over Bozrah: and at that day shall the heart of the mighty men of Edom be as the heart of a woman in her pangs.","23":"Concerning Damascus. Hamath is confounded, and Arpad: for they have heard evil tidings: they are fainthearted; *there is* sorrow on the sea; it cannot be quiet.","24":"Damascus is waxed feeble, *and* turneth herself to flee, and fear hath seized on *her*: anguish and sorrows have taken her, as a woman in travail.","25":"How is the city of praise not left, the city of my joy!","26":"Therefore her young men shall fall in her streets, and all the men of war shall be cut off in that day, saith the LORD of hosts.","27":"And I will kindle a fire in the wall of Damascus, and it shall consume the palaces of Benhadad.","28":"Concerning Kedar, and concerning the kingdoms of Hazor, which Nebuchadrezzar king of Babylon shall smite, thus saith the LORD; Arise ye, go up to Kedar, and spoil the men of the east.","29":"Their tents and their flocks shall they take away: they shall take to themselves their curtains, and all their vessels, and their camels; and they shall cry unto them, Fear *is* on every side.","30":"Flee, get you far off, dwell deep, O ye inhabitants of Hazor, saith the LORD; for Nebuchadrezzar king of Babylon hath taken counsel against you, and hath conceived a purpose","31":"Arise, get you up unto the wealthy nation, that dwelleth without care, saith the LORD, which have neither gates nor bars, *which* dwell alone.","32":"And their camels shall be a booty, and the multitude of their cattle a spoil: and I will scatter into all winds them *that are* in the utmost corners; and I will bring their calamity from all sides thereof, saith the LORD.","33":"And Hazor shall be a dwelling for dragons, *and* a desolation for ever: there shall no man abide there, nor *any* son of man dwell","34":"The word of the LORD that came to Jeremiah the prophet against Elam in the beginning of the reign of Zedekiah king of Judah, saying,","35":"Thus saith the LORD of hosts; Behold, I will break the bow of Elam, the chief of their might.","36":"And upon Elam will I bring the four winds from the four quarters of heaven, and will scatter them toward all those winds; and there shall be no nation whither the outcasts of Elam shall not come.","37":"For I will cause Elam to be dismayed before their enemies, and before them that seek their life: and I will bring evil upon them, *even* my fierce anger, saith the LORD; and I will send the sword after them, till I have consumed","38":"And I will set my throne in Elam, and will destroy from thence the king and the princes, saith the LORD.","39":"But it shall come to pass in the latter days, *that* I will bring again the captivity of Elam, saith the LORD."}},"tsk":{"1":[{"kopje":"Tegen","refs":["Jer 49:7","Jer 49:23","Jer 49:28","Jer 48:1"]},{"kopje":"kinderen van Ammon","refs":["Jer 25:9","Jer 25:21","Jer 27:3","Gen 19:38","Deut 2:19","Deut 23:3","2 Kron 20:1","2 Kron 20:23","Ps 83:8","Ezech 21:28-32","Ezech 25:2-10","Amos 1:13-15","Zef 2:8-11"]},{"kopje":"zijn volk","refs":["Richt 10:7","Richt 10:8","Richt 11:13-15","1 Sam 11:1-3","2 Kon 10:33","2 Kon 24:2","Neh 2:19","Neh 4:7","Neh 13:1","Neh 13:2"]},{"kopje":"steden","refs":["Ps 9:7"]}],"2":[{"kopje":"dat Ik","refs":["Jer 4:19","Ezech 25:4-6","Amos 1:14"]},{"kopje":"Rabba","refs":["Deut 3:11","Joz 13:24","Joz 13:25","Ezech 21:20"]},{"kopje":"haar onderhorige plaatsen","refs":["Num 21:25","2 Sam 11:1","2 Sam 12:27-29","Ps 48:12","Ps 97:8","Ezech 16:46-55"]},{"kopje":"zal Israël","refs":["Jer 49:1","Jes 14:1-3","Obadja 1:19"]}],"3":[{"kopje":"Huil","refs":["Jer 48:20","Jer 51:8","Jes 13:6","Jes 14:31","Jes 15:2","Jes 16:7","Jes 23:1","Jes 23:6","Jak 5:1"]},{"kopje":"gord","refs":["Jer 4:8","Jer 6:26","Jer 48:37","Jes 32:11","Jes 32:12"]},{"kopje":"loop","refs":["Job 30:3-7","Jes 15:2"]},{"kopje":"zijn priesters","refs":["Jer 49:1","1 Kon 11:5","1 Kon 11:33","2 Kon 23:13","Zef 1:5"]},{"kopje":"zal wandelen","refs":["Jer 46:25","Jer 48:7","Amos 1:15"]}],"4":[{"kopje":"beroemt u","refs":["Jer 9:23","Jes 28:1-4","Jes 47:7","Jes 47:8","Openb 18:7"]},{"kopje":"afkerige dochter","refs":["Jer 3:14","Jer 7:24","Hos 4:16"]},{"kopje":"vertrouwt","refs":["Jer 4 l wl-kjv\" data-code=\"H3423\">inherit</span> <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in his cities?","2":"Therefore, behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I will cause an <span class=\"wl wl-kjv\" data-code=\"H8643\">alarm</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> to be <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in <span class=\"wl wl-kjv\" data-code=\"H7237\">Rabbah</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">Ammonites;</span> and it shall be a <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate</span> <span class=\"wl wl-kjv\" data-code=\"H8510\">heap,</span> and her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3341\">burned</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> then shall <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> be <span class=\"wl wl-kjv\" data-code=\"H3423\">heir</span> unto them that were his <span class=\"wl wl-kjv\" data-code=\"H3423\">heirs,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","3":"<span class=\"wl wl-kjv\" data-code=\"H3213\">Howl,</span> O <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon,</span> for <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> is <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled:</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">cry,</span> ye <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H7237\">Rabbah,</span> <span class=\"wl wl-kjv\" data-code=\"H2296\">gird</span> you with <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth;</span> <span class=\"wl wl-kjv\" data-code=\"H5594\">lament,</span> and run to and <span class=\"wl wl-kjv\" data-code=\"H7751\">fro</span> by the <span class=\"wl wl-kjv\" data-code=\"H1448\">hedges;</span> for their <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> into <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> together.","4":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H1984\">gloriest</span> thou in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valleys,</span> thy <span class=\"wl wl-kjv\" data-code=\"H2100\">flowing</span> <span class=\"wl wl-kjv\" data-code=\"H6010\">valley,</span> O <span class=\"wl wl-kjv\" data-code=\"H7728\">backsliding</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter?</span> that <span class=\"wl wl-kjv\" data-code=\"H982\">trusted</span> in her <span class=\"wl wl-kjv\" data-code=\"H214\">treasures,</span> saying, Who shall come","5":"Behold, I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> a <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> upon thee, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> from all those that be <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> thee; and ye shall be driven <span class=\"wl wl-kjv\" data-code=\"H5080\">out</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> right <span class=\"wl wl-kjv\" data-code=\"H6440\">forth;</span> and none shall gather <span class=\"wl wl-kjv\" data-code=\"H6908\">up</span> him that wandereth.","6":"And <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> I will bring <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","7":"Concerning <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> Is <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> no more in <span class=\"wl wl-kjv\" data-code=\"H8487\">Teman?</span> is <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> <span class=\"wl wl-kjv\" data-code=\"H6\">perished</span> from the <span class=\"wl wl-kjv\" data-code=\"H995\">prudent?</span> is their <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> vanished?","8":"<span class=\"wl wl-kjv\" data-code=\"H5127\">Flee</span> ye, turn <span class=\"wl wl-kjv\" data-code=\"H6437\">back,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H6009\">deep,</span> O <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H1719\">Dedan;</span> for I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H343\">calamity</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> upon him, the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that I will visit","9":"If <span class=\"wl wl-kjv\" data-code=\"H1219\">grapegatherers</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to thee, would they not <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> some gleaning <span class=\"wl wl-kjv\" data-code=\"H5955\">grapes?</span> if <span class=\"wl wl-kjv\" data-code=\"H1590\">thieves</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> they will <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> till they have enough.","10":"But I have made <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> <span class=\"wl wl-kjv\" data-code=\"H2834\">bare,</span> I have <span class=\"wl wl-kjv\" data-code=\"H1540\">uncovered</span> his secret <span class=\"wl wl-kjv\" data-code=\"H4565\">places,</span> and he shall not be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H2247\">hide</span> himself: his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> is <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled,</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and his neighbours,","11":"<span class=\"wl wl-kjv\" data-code=\"H5800\">Leave</span> thy fatherless <span class=\"wl wl-kjv\" data-code=\"H3490\">children,</span> I will preserve them <span class=\"wl wl-kjv\" data-code=\"H2421\">alive;</span> and let thy <span class=\"wl wl-kjv\" data-code=\"H490\">widows</span> trust","12":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Behold, they whose <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> was not to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> have <span class=\"wl wl-kjv\" data-code=\"H8354\">assuredly</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drunken;</span> and art thou he that shall <span class=\"wl wl-kjv\" data-code=\"H5352\">altogether</span> go <span class=\"wl wl-kjv\" data-code=\"H5352\">unpunished?</span> thou shalt not go <span class=\"wl wl-kjv\" data-code=\"H5352\">unpunished,</span> but thou shalt <span class=\"wl wl-kjv\" data-code=\"H8354\">surely</span> drink","13":"For I have <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> by myself, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that <span class=\"wl wl-kjv\" data-code=\"H1224\">Bozrah</span> shall become a <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation,</span> a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach,</span> a <span class=\"wl wl-kjv\" data-code=\"H2721\">waste,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7045\">curse;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> wastes.","14":"I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> a <span class=\"wl wl-kjv\" data-code=\"H8052\">rumour</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and an <span class=\"wl wl-kjv\" data-code=\"H6735\">ambassador</span> is <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> saying, Gather ye <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> against her, and rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to the battle.","15":"For, lo, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> among men.","16":"Thy <span class=\"wl wl-kjv\" data-code=\"H8606\">terribleness</span> hath <span class=\"wl wl-kjv\" data-code=\"H5377\">deceived</span> thee, and the <span class=\"wl wl-kjv\" data-code=\"H2087\">pride</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> O thou that <span class=\"wl wl-kjv\" data-code=\"H7931\">dwellest</span> in the <span class=\"wl wl-kjv\" data-code=\"H2288\">clefts</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> that <span class=\"wl wl-kjv\" data-code=\"H8610\">holdest</span> the <span class=\"wl wl-kjv\" data-code=\"H4791\">height</span> of the <span class=\"wl wl-kjv\" data-code=\"H1389\">hill:</span> though thou shouldest make thy <span class=\"wl wl-kjv\" data-code=\"H7064\">nest</span> as <span class=\"wl wl-kjv\" data-code=\"H1361\">high</span> as the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle,</span> I will bring thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from thence, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","17":"Also <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation:</span> every one that <span class=\"wl wl-kjv\" data-code=\"H5674\">goeth</span> by it shall be <span class=\"wl wl-kjv\" data-code=\"H8074\">astonished,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss</span> at all the plagues","18":"As in the <span class=\"wl wl-kjv\" data-code=\"H4114\">overthrow</span> of <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah</span> and the <span class=\"wl wl-kjv\" data-code=\"H7934\">neighbour</span> cities thereof, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> there, neither shall a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> dwell","19":"Behold, he shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> like a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> from the <span class=\"wl wl-kjv\" data-code=\"H1347\">swelling</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> against the <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation</span> of the <span class=\"wl wl-kjv\" data-code=\"H386\">strong:</span> but I will <span class=\"wl wl-kjv\" data-code=\"H7280\">suddenly</span> make him run <span class=\"wl wl-kjv\" data-code=\"H7323\">away</span> from her: and who is a <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> man, that I may <span class=\"wl wl-kjv\" data-code=\"H6485\">appoint</span> over her? for who is like me? and who will appoint me the <span class=\"wl wl-kjv\" data-code=\"H3259\">time?</span> and who is that <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd</span> that will <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> before","20":"Therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H3289\">taken</span> against <span class=\"wl wl-kjv\" data-code=\"H123\">Edom;</span> and his <span class=\"wl wl-kjv\" data-code=\"H4284\">purposes,</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H2803\">purposed</span> against the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H8487\">Teman:</span> Surely the <span class=\"wl wl-kjv\" data-code=\"H6810\">least</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> shall draw them <span class=\"wl wl-kjv\" data-code=\"H5498\">out:</span> surely he shall make their <span class=\"wl wl-kjv\" data-code=\"H5116\">habitations</span> desolate","21":"The <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is <span class=\"wl wl-kjv\" data-code=\"H7493\">moved</span> at the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of their <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> at the <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> thereof was <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> sea.","22":"Behold, he shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H1675\">fly</span> as the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle,</span> and <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> his <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> over <span class=\"wl wl-kjv\" data-code=\"H1224\">Bozrah:</span> and at that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> be as the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> in her pangs.","23":"Concerning <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus.</span> <span class=\"wl wl-kjv\" data-code=\"H2574\">Hamath</span> is <span class=\"wl wl-kjv\" data-code=\"H954\">confounded,</span> and <span class=\"wl wl-kjv\" data-code=\"H774\">Arpad:</span> for they have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H8052\">tidings:</span> they are <span class=\"wl wl-kjv\" data-code=\"H4127\">fainthearted;</span> there is <span class=\"wl wl-kjv\" data-code=\"H1674\">sorrow</span> on the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea;</span> it <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> be quiet.","24":"<span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus</span> is waxed <span class=\"wl wl-kjv\" data-code=\"H7503\">feeble,</span> and <span class=\"wl wl-kjv\" data-code=\"H6437\">turneth</span> herself to <span class=\"wl wl-kjv\" data-code=\"H5127\">flee,</span> and <span class=\"wl wl-kjv\" data-code=\"H7374\">fear</span> hath <span class=\"wl wl-kjv\" data-code=\"H2388\">seized</span> on her: <span class=\"wl wl-kjv\" data-code=\"H6869\">anguish</span> and <span class=\"wl wl-kjv\" data-code=\"H2256\">sorrows</span> have <span class=\"wl wl-kjv\" data-code=\"H270\">taken</span> her, as a woman in travail.","25":"How is the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> not <span class=\"wl wl-kjv\" data-code=\"H5800\">left,</span> the <span class=\"wl wl-kjv\" data-code=\"H7151\">city</span> of my joy!","26":"Therefore her young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in her <span class=\"wl wl-kjv\" data-code=\"H7339\">streets,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H1826\">off</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","27":"And I will <span class=\"wl wl-kjv\" data-code=\"H3341\">kindle</span> a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus,</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H398\">consume</span> the <span class=\"wl wl-kjv\" data-code=\"H759\">palaces</span> of Benhadad.","28":"Concerning <span class=\"wl wl-kjv\" data-code=\"H6938\">Kedar,</span> and concerning the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of <span class=\"wl wl-kjv\" data-code=\"H2674\">Hazor,</span> which <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall <span class=\"wl wl-kjv\" data-code=\"H5221\">smite,</span> thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise</span> ye, go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H6938\">Kedar,</span> and <span class=\"wl wl-kjv\" data-code=\"H7703\">spoil</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">men</span> of the east.","29":"Their <span class=\"wl wl-kjv\" data-code=\"H168\">tents</span> and their <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> shall they take <span class=\"wl wl-kjv\" data-code=\"H3947\">away:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> to themselves their <span class=\"wl wl-kjv\" data-code=\"H3407\">curtains,</span> and all their <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1581\">camels;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7121\">cry</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H4032\">Fear</span> is on every side.","30":"<span class=\"wl wl-kjv\" data-code=\"H5127\">Flee,</span> <span class=\"wl wl-kjv\" data-code=\"H5110\">get</span> you far <span class=\"wl wl-kjv\" data-code=\"H3966\">off,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H6009\">deep,</span> O ye <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H2674\">Hazor,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> hath taken <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> against you, and hath <span class=\"wl wl-kjv\" data-code=\"H2803\">conceived</span> a purpose","31":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> get you <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7961\">wealthy</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth</span> without <span class=\"wl wl-kjv\" data-code=\"H983\">care,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which have neither <span class=\"wl wl-kjv\" data-code=\"H1817\">gates</span> nor <span class=\"wl wl-kjv\" data-code=\"H1280\">bars,</span> which <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> alone.","32":"And their <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H957\">booty,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of their <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> a <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> into all <span class=\"wl wl-kjv\" data-code=\"H7307\">winds</span> them that are in the <span class=\"wl wl-kjv\" data-code=\"H7112\">utmost</span> <span class=\"wl wl-kjv\" data-code=\"H6285\">corners;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> their <span class=\"wl wl-kjv\" data-code=\"H343\">calamity</span> from all <span class=\"wl wl-kjv\" data-code=\"H5676\">sides</span> thereof, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","33":"And <span class=\"wl wl-kjv\" data-code=\"H2674\">Hazor</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H4583\">dwelling</span> for <span class=\"wl wl-kjv\" data-code=\"H8577\">dragons,</span> and a <span class=\"wl wl-kjv\" data-code=\"H8077\">desolation</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> there shall no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> there, nor any <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> dwell","34":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that came to <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> against <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam</span> in the <span class=\"wl wl-kjv\" data-code=\"H7225\">beginning</span> of the <span class=\"wl wl-kjv\" data-code=\"H4438\">reign</span> of <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> saying,","35":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> the <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> of <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam,</span> the <span class=\"wl wl-kjv\" data-code=\"H7225\">chief</span> of their might.","36":"And upon <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam</span> will I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">winds</span> from the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H7098\">quarters</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and will <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> them toward all those <span class=\"wl wl-kjv\" data-code=\"H7307\">winds;</span> and there shall be no <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> whither the <span class=\"wl wl-kjv\" data-code=\"H5080\">outcasts</span> of <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam</span> shall not come.","37":"For I will cause <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam</span> to be <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> their <span class=\"wl wl-kjv\" data-code=\"H5315\">life:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon them, even my <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them, till I have consumed","38":"And I will <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> in <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam,</span> and will <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> from thence the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes u daarin zoudt kunnen bergen; of al het gewas der dalen is zo licht als water vervloten; of de inwoners der valleien zijn als water verlopen. Dal noch berg kan u helpen, wil God zeggen."},{"catchword":"afkerige dochter","tekst":"Zie Amo 1:13 , en Zep 2:8 . Zij waren wel van Lots afkomst, [daarom had hen God ook eertijds verschoond], maar daarna zijn ze zeer bittere vijanden van Gods volk geworden, en als zodanigen scherp gestraft."},{"catchword":"schatten vertrouwt,","tekst":"Anders: verborgen, verholen plaatsen."},{"catchword":"Wie zou tegen mij komen?","tekst":"Dat is, wie zou zo stout of machtig zijn, dat hij mij zou durven aantasten. Vergelijk boven Jer 21:13 ."}],"5":[{"catchword":"die rondom u zijn,","tekst":"Of, van alle plaatsen rondom u."},{"catchword":"voor zich henen,","tekst":"Hebreeuws, voor zijn aangezicht; dat is, voor zich heen, in het wild, waar hij slechts kan heenvluchten."},{"catchword":"vergaderen","tekst":"Dat is, zich zijner ontfermen, dat hij hem op of inneme en herberge."}],"6":[{"catchword":"wenden,","tekst":"Gelijk boven Jer 48:47 , en onder vs.39."}],"7":[{"catchword":"Edom","tekst":"Dat is, nakomelingen van Ezau."},{"catchword":"Is er dan geen wijsheid meer","tekst":"Vergelijk Oba 1:8-9 ."},{"catchword":"Theman?","tekst":"Theman en Dedan waren twee steden der Edomieten, op bergen gelegen, aan het oosteinde van Ezau's gebergte, achter het zuideinde van de Dode Zee, naar uitwijzen van enige kaarten. Theman was Ezau's zoonszoon, uit Elifaz, waarvan deze stad zonder twijfel den naam heeft. Zie Gen 36:10-11 ."},{"catchword":"verstandigen?","tekst":"Anders, [hunne] kinderen."},{"catchword":"onnut geworden?","tekst":"Het Hebreeuwse woord betekent gemeenlijk overtollig, overig en geil worden; en hier voorts onnut, vergeefs, ijdel, of ondienstig worden."}],"8":[{"catchword":"woont in diepe plaatsen,","tekst":"Hebreeuws, verdiept u om te wonen, of met wonen, of blijven. Versta, om u te bergen. Alzo onder vs.30."},{"catchword":"Dedan","tekst":"Zie op vs.7 van een omtrek in Arabië, alzo genoemd. Zie boven, Jer 25:23 , en Gen 25:3 . Het kan zijn dat beide, de stad in Edom en het land in Arabië, een oorsprong hebben, omdat zij niet ver van elkander gelegen waren. Vergelijk boven Jer 25:23 ."},{"catchword":"heb Ezau's","tekst":"Dat is, Ik zal het zekerlijk doen."},{"catchword":"verderf over hem gebracht,","tekst":"Of, ondergang."},{"catchword":"dat Ik hem bezocht heb","tekst":"Dat is, den tijd zijner bezoeking, gelijk God elders spreekt, dat is, zijner straf. Zie Gen 21:1 ."}],"9":[{"catchword":"wijnlezers","tekst":"Of, druivensnijders."},{"catchword":"verdorven hebben","tekst":"Dat is, u ontnomen of gestolen hebben, [vergelijk Oba 1:5 ] , hetwelk gemeenlijk met verderven en verwoesten van huis of goed geschiedt."},{"catchword":"zoveel hun genoeg ware?","tekst":"Hebreeuws, hunlieder genoegzaamheid, latende wat over [wil de Heere zeggen] of niet meer nemende dan zij bekwamelijk konden wegbrengen of mededragen; maar Ik zal anders met hem handelen, hem bloot en kaal makende, dat hij niets overhebbe, gelijk in het volgende verklaard wordt."}],"10":[{"catchword":"hij is er niet meer","tekst":"Sommigen hechten deze woorden aan vs.11, met enige bijvoeging, aldus: Hij is er niet [die zegt]; dan is de zin van het volgende klaar; te weten dat er niemand zal zijn, die zich zijner wezen of weduwen zal ontfermen. Anderen verstaan dat God met de volgende woorden Ezau spottenderwijze aanspreekt, alsof Hij zeide: Gij behoeft niet te denken dat uwe wezen en weduwen bij mij gunst zullen vinden; laat gij hen na, Ik zal mijne oordelen voorts vervolgen over uw zaad en alles wat er van u zou mogen overblijven."}],"12":[{"catchword":"oordeel","tekst":"Dat is, die het zo niet verdiend hebben als gij; te weten de vromen onder mijn eigen volk; vergelijk boven Jer 25:29 , en zie Deu 19:6 ."},{"catchword":"beker te drinken,","tekst":"Mijns toorns."},{"catchword":"ganselijk drinken;","tekst":"Hebreeuws, drinkende drinken; dat is, zullen het niet ontgaan, zij zullen moet gestraft worden."},{"catchword":"enigszins onschuldig gehouden worden?","tekst":"Hebreeuws, onschuldig zijnde, of gehouden wordende, onschuldig worden gehouden; dat is, enigszins ongestraft blijven; zie 1Ki 2:9 , en boven Jer 25:29 ."},{"catchword":"ganselijk drinken","tekst":"Hebreeuws, drinkende drinken."}],"13":[{"catchword":"Bozra","tekst":"De hoofdstad der Edomieten, in de Schriftuur dikwijls vermeld."},{"catchword":"woestheid,","tekst":"Of, eenzaamheid, verwoesting; gelijk boven Jer 25:9 , Jer 25:18 , enz."},{"catchword":"haar steden","tekst":"Plaatsen die onder Bozra behoren."},{"catchword":"eeuwige woestheden","tekst":"Hebreeuws, woestheden der eeuwigheid."}],"14":[{"catchword":"gerucht gehoord","tekst":"Of, rumoer, tijding. Hebreeuws eigenlijk, ene horing gehoord; vergelijk Oba 1:1-3 , enz., van den HEERE; dat is, de Heere heeft mij deze tijding geopenbaard, of, welk gerucht de Heere beschikt heeft, verwekkende den koning van Babel tegen Edom."},{"catchword":"gezant geschikt","tekst":"Dat is, Ik heb het door mijn goddelijke voorzienigheid beschikt dat zij, als op een bijzonder bevel of mijne aanmaning, zullen doen gelijk volgt; vergelijk boven Jer 25:9 , met de aantekening. Of, [gelijk sommigen] de koning van Babel heeft een ambassadeur uitgezonden om de volken tegen Edom op te maken, enz.; hetwelk van God alzo beschikt is."},{"catchword":"haar,","tekst":"Bozra of Edom; gelijk hier doorgaans van deze volken en landen nu in het vrouwelijk, dan in het mannelijk geslacht gesproken wordt; vergelijk boven Jer 48:4 ."}],"15":[{"catchword":"gemaakt onder de heidenen,","tekst":"Hebreeuws, gegeven, gesteld; dat is, Ik heb verordineerd dat gij tot zulken ellendigen en verachten staat zult gebracht worden, dat gij met geen andere volken zult mogen vergeleken worden."}],"16":[{"catchword":"schrikkelijkheid","tekst":"Waarmede gij anderen voor u deedt schrikken, gruwen, beven en schudden, vermits uwen trots en uw vreeslijk bergachtig land, dat niemand dorst genaken."},{"catchword":"bedrogen,","tekst":"Want gij hebt u daarop tevergeefs verlaten."},{"catchword":"steenrotsen,","tekst":"Hebreeuws, steenrots of klip."},{"catchword":"u houdt op de hoogte der heuvelen","tekst":"Hebreeuws, houdt de hoogte des heuvels."}],"17":[{"catchword":"ontzetting;","tekst":"Anders, verwoesting."},{"catchword":"fluiten over al haar plagen","tekst":"Of, sijfelen, schuifelen, pijpen, enz. Zie boven Jer 18:16 ."}],"18":[{"catchword":"omkering van Sodom en Gomórra","tekst":"Vergelijk onder Jer 50:40 ."},{"catchword":"naburen,","tekst":"Adama en Zeboïm, en de omliggende plaatsen, de ganse aangelegen omtrek."},{"catchword":"zal het zijn,","tekst":"Te weten met Edom. Dit andere lid dezer vergelijking is tot aanvulling van den zin ingevoegd, gelijk sommigen ook doen in het begin van vs.19."},{"catchword":"daar wonen,","tekst":"In het land der Edomieten, dat van de Babyloniërs overheerd zijnde, voorts van tijd tot tijd alzo zal worden verwoest, dat het ten laatste gans verwoest en onbewoond zij."}],"19":[{"catchword":"leeuw","tekst":"Die zijn gewoonlijke legerplaats moet verlaten en met grimmigheid al brullende in der haast opklimmen naar het gebergte, wanneer de Jordaan aan alle kanten overloopt en de leeuwen vandaar jaagt. [Zie boven Jer 12:5 , en vergelijk Zec 11:3 ] . Alzo zal de koning van Babel met verstoord gemoed optrekken naar het gebergte der Edomieten. Of, gelijk een leeuw opklimt vermits de opzwelling der Jordaan, [alzo zal hij opkomen] tegen, enz., in denzelfden zin. Vergelijk onder Jer 50:44 , van Cyrus' aankomst tegen Babel. Anders, [want deze plaats wordt verscheidenlijk overgezet en verklaard] gelijk een leeuw zal hij optrekken van de hovaardige of stoute Jordaan tegen, enz.; dat is, Nebukadnezar zal optrekken naar Edom als hij het Joodse land zal hebben overheerd, hetwelk de Edomieten zich niet konden inbeelden, maar waren vrolijk over de ellenden van Juda."},{"catchword":"sterke woning;","tekst":"Of, ruw, hard; dat is, het bergachtige land der Edomieten. Anders: lieflijke woning des sterken; verstaan dat hier gesproken wordt van de stoute aanslagen der Edomieten, die opgeblazener dan de Jordaan waren in het vijandelijk optrekken tegen Gods volk en huis, doch tevergeefs en met een bespottelijke uitkomst."},{"catchword":"hem","tekst":"Edom."},{"catchword":"in een ogenblik","tekst":"Dat is, plotseling, onvoorziens; alzo is het Hebreeuwse woord genomen Pro 12:19 . Anders: wanneer Ik [hem] zal hebben laten rusten; dat is, nadat Edom lang in rust zal hebben gezeten, zal Ik hem, enz."},{"catchword":"daaruit doen lopen;","tekst":"Hebreeuws, uit hen; dat is, uit den omtrek of het land van Idumea. Zie boven vs.14, alzo in de volgende woorden."},{"catchword":"bestellen;","tekst":"Of, last, commissie, bevel geven over hen. Versta, den koning Nubakadnezar, dien God daarom zijnen knecht noemt. Zie boven Jer 25:9 . Anders: wie uitgelezen is, dien, enz.; dat is, het zal mij niet ontbreken aan dienstige instrumenten, die Ik neem vanwaar het mij belieft, om dien stouten Edom te bedwingen en uit te roeien."},{"catchword":"dagvaarden,","tekst":"In recht betrekken, of mij tijd, termijn stellen, dat Ik tegen hem zou moeten pleiten? Of, wie zal mij maat en tijd stellen in mijne werken? Zie Job 9:19 , met de aantekening."},{"catchword":"herder,","tekst":"Dat is, koning, regent, of voorstander. Vergelijk 2Sa 5:2 , en boven Jer 6:3 , en Jer 10:21 , en Jer 12:10 , enz."},{"catchword":"voor Mijn aangezicht bestaan zou?","tekst":"Anders tegen, in enen zin, dat is, wat koning of monarch zou mijn tegenpartij kunnen zijn?"}],"20":[{"catchword":"gedachten,","tekst":"Dat is, voornemen, besluit, dat Hij gemaakt heeft. Vergelijk onder vs.30."},{"catchword":"Theman","tekst":"Zie boven vs.7."},{"catchword":"Zo de","tekst":"Dit zijn twee afgebroken redenen, in het eedzweren gebruikelijk. Zie Deu 1:35 ."},{"catchword":"geringsten van de kudde","tekst":"De minste van Nebukadnezars krijgslieden. Vergelijk boven Jer // Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat

// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');

    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;

}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
