"Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Tegen de kinderen van Ammon zegt de HEERE zo: Heeft Israël dan geen kinderen? Heeft hij geen erfgenaam? Waarom is dan Malcham erfgenaam van Gad, en *waarom* woont zijn volk in zijn steden?", "2": "Daarom, zie, de dagen komen, spreekt de HEERE, dat Ik over Rabba van de kinderen van Ammon een krijgsgeschreeuw zal doen horen, en zij zal tot een woeste hoop worden, en haar onderhorige plaatsen zullen met vuur aangestoken worden; en Israël zal erven van hen die hem geërfd hadden, zegt de HEERE.", "3": "Huil, o Hesbon! want Ai is verwoest; roep, dochters van Rabba, gord zakken aan, drijf misbaar, en loop heen en weer bij de tuinen; want Malcham zal wandelen in gevangenschap, zijn priesters en zijn vorsten samen.", "4": "Wat beroemt u zich op *uw* dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "5": "Zie, Ik zal vrees over u brengen, spreekt de Heere, de HEERE van de heerscharen[1], van allen die rondom u zijn, en u zult, ieder voor zich heen, weggedreven worden, en niemand zal hen die omzwerven bijeenbrengen.", "6": "Maar daarna zal Ik de gevangenschap van de kinderen van Ammon wenden, spreekt de HEERE.", "7": "Tegen Edom zegt de HEERE van de heerscharen zo: Is er dan geen wijsheid meer te Theman? Is de raad vergaan van de verstandigen? Is hun wijsheid onnut geworden?", "8": "Vlucht, keer u om, woon in diepe *plaatsen*, inwoners van Dedan! want Ik heb Ezaus verderf over hem gebracht, de tijd waarop Ik hem bezocht heb.", "9": "Als er wijnoogsters tot u gekomen waren, zouden zij niet een nalezing hebben overgelaten? Als er dieven bij nacht *gekomen waren*, zouden zij *niet* verwoest hebben zoveel hun genoeg was?", "10": "Maar Ik heb Ezau ontbloot, Ik heb zijn verborgen plaatsen ontdekt, zodat hij zich niet zal kunnen verstoppen; zijn nageslacht is verwoest, ook zijn broeders en zijn buren, en hij is er niet *meer*.", "11": "Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.", "12": "Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.", "13": "Want Ik heb bij Mijzelf gezworen, spreekt de HEERE, dat Bozra zal worden tot een ontzetting, tot een smaad, tot een woestheid, en tot een vloek; en al haar steden zullen worden tot eeuwige woestheden.", "14": "Ik heb een gerucht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken, *om* *te* *zeggen*: Verzamel u, en kom aan tegen haar, en maak u op ten strijde.", "15": "Want zie, Ik heb u klein gemaakt onder de heidenvolken, veracht onder de mensen.", "16": "Uw verschrikkelijkheid heeft u bedrogen, *en* de trots van uw hart, u die woont in de kloven van de steenrotsen, die de hoogte van de heuvels vasthoudt! Al zou u uw nest *zo* hoog maken als de arend, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "17": "Zo zal Edom worden tot een ontzetting; ieder die voorbij haar gaat, zal zich ontzetten, en fluiten over al haar plagen.", "18": "Zoals de omkering van Sodom en Gomorra en haar buren, zal het zijn, zegt de HEERE; niemand zal daar wonen, en geen mensenkind daarin verblijven.", "19": "Zie, gelijk een leeuw uit de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hem in een ogenblik daaruit doen wegrennen; en wie *daartoe* uitverkoren is, *hem* zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden, en wie is die herder die voor Mijn aangezicht bestaan zou?", "20": "Daarom, hoor de raadsbesluit van de HEERE, dat Hij over Edom heeft beraadslaagd, en Zijn gedachten, die Hij gedacht heeft over de inwoners van Theman: Zeker, de geringste van de kudde zal hen neertrekken! Zeker, hij zal hun woning boven hen verwoesten!", "21": "De aarde heeft gebeefd van het geluid van hun val, *van* het geroep, waarvan het geluid gehoord is bij de Schelfzee.", "22": "Zie, hij zal opkomen en snel vliegen, als een arend, en zijn vleugels over Bozra uitspreiden; en het hart van Edoms helden zal op die dag wezen als het hart van een vrouw die in nood is.", "23": "Tegen Damaskus. Beschaamd is Hamath en Arpad; omdat zij een slecht gerucht gehoord hebben, zijn zij gesmolten; bij de zee is bekommernis, men kan er niet rusten.", "24": "Damaskus is slap geworden, zij heeft zich omgekeerd om te vluchten, en siddering heeft haar aangegrepen; benauwdheid en smarten als van een barende *vrouw* hebben haar bevangen;", "25": "Hoe is de beroemde stad niet gelaten, de stad van mijn vrolijkheid!", "26": "Daarom zullen haar jongelingen vallen op haar straten; en al *haar* krijgslieden zullen op die dag neergehouwen worden, spreekt de HEERE van de heerscharen.", "27": "En Ik zal een vuur aansteken in de muur van Damaskus, en het zal Benhadads paleizen verteren.", "28": "Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg, zegt de HEERE zo: Maak u op, trek op tegen Kedar, en verwoest de kinderen van het oosten.", "29": "Zij zullen hun tenten en hun kudden nemen, hun gordijnen en al hun gereedschap, en hun kamelen voor zich wegnemen; en zij zullen tegen hen uitroepen: Schrik van rondom!", "30": "Vlucht, zwerf vlug heen, woon in diepe *plaatsen*, inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadsbesluit tegen u beraadslaagd, en een gedachte tegen hen gedacht.", "31": "Maak u op, trek op tegen het volk dat rust heeft, dat in zekerheid woont, spreekt de HEERE; dat geen deuren noch grendel heeft, *dat* alleen woont.", "32": "En hun kamelen zullen ten roof zijn, en de menigte van hun vee zal ten buit zijn; en Ik zal hen verstrooien in alle windrichtingen, *namelijk* hen die aan de hoeken afgekort zijn; en Ik zal hun verderf van alle kanten aanbrengen, spreekt de HEERE.", "33": "En Hazor zal worden tot een drakenwoning, een verwoesting tot in eeuwigheid; niemand zal daar wonen, en geen mensenkind daarin verblijven.", "34": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurde tegen Elam, in het begin van het koninkrijk van Zedekia, de koning van Juda, en zei:", "35": "Zo zegt de HEERE van de heerscharen: Zie, Ik zal Elams boog verbreken, het voornaamste van hun geweld.", "36": "En Ik zal de vier winden uit de vier hoeken van de hemel over Elam aanbrengen, en zal hen in al die winden verstrooien; en er zal geen volk zijn waarheen Elams verdrevenen niet zullen komen.", "37": "En Ik zal Elam versaagd maken voor het aangezicht van hun vijanden, en voor het aangezicht van hen die hun ziel zoeken, en zal een kwaad over hen brengen, de gloed van Mijn toorn, spreekt de HEERE; en Ik zal het zwaard achter hen zenden, totdat Ik hen verteerd zal hebben.", "38": "En Ik zal Mijn troon in Elam stellen; en zal de koning en de vorsten van daar wegvagen, spreekt de HEERE;", "39": "Maar het zal gebeuren in het laatste van de dagen, dat Ik Elams gevangenschap wenden zal, spreekt de HEERE."}, "SV": {"1": "Tegen de kinderen Ammons zegt de HEERE alzo: Heeft dan Israël geen kinderen? Heeft hij geen erfgenaam? Waarom is dan Malcham erfgenaam van Gad, en *waarom* woont zijn volk in deszelfs steden?", "2": "Daarom ziet, de dagen komen, spreekt de HEERE, dat Ik over Rabba der kinderen Ammons een krijgsgeschrei zal doen horen, en zij zal tot een woesten hoop worden, en haar onderhorige plaatsen zullen met vuur aangestoken worden; en Israël zal erven degenen, die hem geërfd hadden, zegt de HEERE.", "3": "Huil, o Hesbon! want Ai is verstoord; krijt, gij dochteren van Rabba, gordt zakken aan, drijft misbaar, en loopt om bij de tuinen; want Malcham zal wandelen in gevangenis, zijn priesteren en zijn vorsten te zamen.", "4": "Wat roemt gij op *uw* dalen? Uw dal is weggevloten, gij afkerige dochter! die op haar schatten vertrouwt, *zeggende*: Wie zou tegen mij komen?", "5": "Ziet, Ik zal vreze over u brengen, spreekt de Heere, de HEERE der heirscharen, van allen, die rondom u zijn, en gijlieden zult, een iegelijk voor zich henen, uitgedreven worden, en niemand zal den omdolende vergaderen.", "6": "Maar daarna zal Ik de gevangenis der kinderen Ammons wenden, spreekt de HEERE.", "7": "Tegen Edom zegt de HEERE der heirscharen alzo: Is er dan geen wijsheid meer te Theman? Is de raad vergaan van de verstandigen? Is hunlieder wijsheid onnut geworden?", "8": "Vliedt, wendt u, woont in diepe *plaatsen*, gij inwoners van Dedan! want Ik heb Ezau’s verderf over hem gebracht, den tijd, *dat* Ik hem bezocht heb.", "9": "Zo er wijnlezers tot u gekomen waren, zouden zij niet een nalezing hebben overgelaten? Zo er dieven bij nacht *gekomen* *waren*, zouden zij *niet* verdorven hebben zoveel hun genoeg ware?", "10": "Maar Ik heb Ezau ontbloot, Ik heb zijn verborgene plaatsen ontdekt, dat hij zich niet zal kunnen versteken; zijn zaad is verstoord, ook zijn broeders, en zijn naburen, en hij is er niet *meer*.", "11": "Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.", "12": "Want zo zegt de HEERE: Ziet, degenen, welker oordeel het niet is den beker te drinken, zullen ganselijk drinken; en zoudt gij enigszins onschuldig gehouden worden? Gij zult niet onschuldig worden gehouden, maar gij zult ganselijk drinken.", "13": "Want Ik heb bij Mijzelven gezworen, spreekt de HEERE, dat Bozra worden zal tot een ontzetting, tot een smaadheid, tot een woestheid, en tot een vloek; en al haar steden zullen worden tot eeuwige woestheden.", "14": "Ik heb een gerucht gehoord van den HEERE, en er is een gezant geschikt onder de heidenen, *om* *te* *zeggen*: Vergadert u, en komt aan tegen haar, en maakt u op ten strijde.", "15": "Want zie, Ik heb u klein gemaakt onder de heidenen, veracht onder de mensen.", "16": "Uw schrikkelijkheid heeft u bedrogen, *en* de trotsheid uws harten, gij, die woont in de kloven der steenrotsen, die u houdt op de hoogte der heuvelen! Al zoudt gij uw nest *zo* hoog maken als de arend, zo zal Ik u van daar nederstoten, spreekt de HEERE.", "17": "Alzo zal Edom worden tot een ontzetting; al wie voorbij haar gaat, zal zich ontzetten, en fluiten over al haar plagen.", "18": "Gelijk de omkering van Sodom en Gomorra en haar naburen, zal het zijn, zegt de HEERE; niemand zal daar wonen, en geen mensenkind daarin verkeren.", "19": "Ziet, gelijk een leeuw van de verheffing der Jordaan, zal hij opkomen tegen de sterke woning; want Ik zal hem in een ogenblik daaruit doen lopen; en wie *daartoe* verkoren is, *dien* zal Ik tegen haar bestellen; want wie is Mij gelijk, en wie zou Mij dagvaarden, en wie is die herder, die voor Mijn aangezicht bestaan zou?", "20": "Daarom hoort des HEEREN raadslag, dien Hij over Edom heeft beraadslaagd, en Zijn gedachten, die Hij gedacht heeft over de inwoners van Theman: Zo de geringsten van de kudde hen niet zullen nedertrekken! Indien hij hunlieder woning niet boven hen zal verwoesten!", "21": "De aarde heeft gebeefd van het geluid huns vals, *van* het gekrijt, welks geluid gehoord is bij de Schelfzee.", "22": "Ziet, hij zal opkomen en snel vliegen, als een arend, en zijn vleugelen over Bozra uitbreiden; en het hart van Edoms helden zal te dien dage wezen, als het hart ener vrouw, die in nood is.", "23": "Tegen Damaskus. Beschaamd is Hamath en Arpad; omdat zij een boos gerucht gehoord hebben, zijn zij gesmolten; bij de zee is bekommernis, men kan er niet rusten.", "24": "Damaskus is slap geworden, zij heeft zich gewend, om te vluchten, en siddering heeft haar aangegrepen; benauwdheid en smarten als van een barende *vrouw* hebben haar bevangen;", "25": "Hoe is de beroemde stad niet gelaten, de stad Mijner vrolijkheid!", "26": "Daarom zullen haar jongelingen vallen op haar straten; en al *haar* krijgslieden zullen te dien dage nedergehouwen worden, spreekt de HEERE der heirscharen.", "27": "En Ik zal een vuur aansteken in den muur van Damaskus, en het zal Benhadads paleizen verteren.", "28": "Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg, zegt de HEERE alzo: Maakt u op, trekt op tegen Kedar, en verstoort de kinderen van het oosten.", "29": "Zij zullen hun tenten en hun kudden nemen, hun gordijnen en al hun gereedschap, en hun kemelen voor zich wegnemen; en zij zullen tegen hen uitroepen: Schrik van rondom!", "30": "Vliedt, zwerft fluks henen weg, woont in diepe *plaatsen*, gij inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadslag tegen ulieden beraadslaagd, en een gedachte tegen hen gedacht.", "31": "Maakt u op, trekt op tegen het volk, dat rust heeft, dat in zekerheid woont, spreekt de HEERE; dat geen deuren noch grendel heeft, *die* alleen wonen.", "32": "En hun kemelen zullen ten roof zijn, en de menigte van hun vee zal ten buit zijn; en Ik zal hen verstrooien in alle winden, *te* *weten* degenen, die aan de hoeken afgekort zijn; en Ik zal hunlieder verderf van al zijn zijden aanbrengen, spreekt de HEERE.", "33": "En Hazor zal worden tot een drakenwoning, een verwoesting tot in eeuwigheid; niemand zal daar wonen, en geen mensenkind daarin verkeren.", "34": "Het woord des HEEREN, dat tot den profeet Jeremia geschied is tegen Elam, in het begin des koninkrijks van Zedekia, den koning van Juda, zeggende:", "35": "Zo zegt de HEERE der heirscharen: Ziet, Ik zal verbreken Elams boog, het voornaamste van hunlieder geweld.", "36": "En Ik zal de vier winden uit de vier hoeken des hemels over Elam aanbrengen, en zal hen in al diezelve winden verstrooien; en er zal geen volk zijn, waarhenen Elams verdrevenen niet zullen komen.", "37": "En Ik zal Elam versaagd maken voor het aangezicht hunner vijanden, en voor het aangezicht dergenen, die hun ziel zoeken, en zal een kwaad over hen brengen, de hittigheid mijns toorns, spreekt de HEERE; en Ik zal het zwaard achter hen zenden, totdat Ik hen verteerd zal hebben.", "38": "En Ik zal Mijn troon in Elam stellen; en zal den koning en de vorsten van daar vernielen, spreekt de HEERE;", "39": "Maar het zal geschieden in het laatste der dagen, dat Ik Elams gevangenis wenden zal , spreekt de HEERE."}, "KJV": {"1": "Concerning the Ammonites, thus saith the LORD; Hath Israel no sons? hath he no heir? why *then* doth their king inherit Gad, and his people dwell in his cities?", "2": "Therefore, behold, the days come, saith the LORD, that I will cause an alarm of war to be heard in Rabbah of the Ammonites; and it shall be a desolate heap, and her daughters shall be burned with fire: then shall Israel be heir unto them that were his heirs, saith the LORD.", "3": "Howl, O Heshbon, for Ai is spoiled: cry, ye daughters of Rabbah, gird you with sackcloth; lament, and run to and fro by the hedges; for their king shall go into captivity, *and* his priests and his princes together.", "4": "Wherefore gloriest thou in the valleys, thy flowing valley, O backsliding daughter? that trusted in her treasures, *saying*, Who shall come", "5": "Behold, I will bring a fear upon thee, saith the Lord GOD of hosts, from all those that be about thee; and ye shall be driven out every man right forth; and none shall gather up him that wandereth.", "6": "And afterward I will bring again the captivity of the children of Ammon, saith the LORD.", "7": "Concerning Edom, thus saith the LORD of hosts; *Is* wisdom no more in Teman? is counsel perished from the prudent? is their wisdom vanished?", "8": "Flee ye, turn back, dwell deep, O inhabitants of Dedan; for I will bring the calamity of Esau upon him, the time *that* I will visit", "9": "If grapegatherers come to thee, would they not leave *some* gleaning grapes? if thieves by night, they will destroy till they have enough.", "10": "But I have made Esau bare, I have uncovered his secret places, and he shall not be able to hide himself: his seed is spoiled, and his brethren, and his neighbours,", "11": "Leave thy fatherless children, I will preserve *them* alive; and let thy widows trust", "12": "For thus saith the LORD; Behold, they whose judgment *was* not to drink of the cup have assuredly drunken; and *art* thou he *that* shall altogether go unpunished? thou shalt not go unpunished, but thou shalt surely drink", "13": "For I have sworn by myself, saith the LORD, that Bozrah shall become a desolation, a reproach, a waste, and a curse; and all the cities thereof shall be perpetual wastes.", "14": "I have heard a rumour from the LORD, and an ambassador is sent unto the heathen, *saying*, Gather ye together, and come against her, and rise up to the battle.", "15": "For, lo, I will make thee small among the heathen, *and* despised among men.", "16": "Thy terribleness hath deceived thee, *and* the pride of thine heart, O thou that dwellest in the clefts of the rock, that holdest the height of the hill: though thou shouldest make thy nest as high as the eagle, I will bring thee down from thence, saith the LORD.", "17": "Also Edom shall be a desolation: every one that goeth by it shall be astonished, and shall hiss at all the plagues", "18": "As in the overthrow of Sodom and Gomorrah and the neighbour *cities* thereof, saith the LORD, no man shall abide there, neither shall a son of man dwell", "19": "Behold, he shall come up like a lion from the swelling of Jordan against the habitation of the strong: but I will suddenly make him run away from her: and who *is* a chosen *man, that* I may appoint over her? for who *is* like me? and who will appoint me the time? and who *is* that shepherd that will stand before", "20": "Therefore hear the counsel of the LORD, that he hath taken against Edom; and his purposes, that he hath purposed against the inhabitants of Teman: Surely the least of the flock shall draw them out: surely he shall make their habitations desolate", "21": "The earth is moved at the noise of their fall, at the cry the noise thereof was heard in the Red sea.", "22": "Behold, he shall come up and fly as the eagle, and spread his wings over Bozrah: and at that day shall the heart of the mighty men of Edom be as the heart of a woman in her pangs.", "23": "Concerning Damascus. Hamath is confounded, and Arpad: for they have heard evil tidings: they are fainthearted; *there is* sorrow on the sea; it cannot be quiet.", "24": "Damascus is waxed feeble, *and* turneth herself to flee, and fear hath seized on *her*: anguish and sorrows have taken her, as a woman in travail.", "25": "How is the city of praise not left, the city of my joy!", "26": "Therefore her young men shall fall in her streets, and all the men of war shall be cut off in that day, saith the LORD of hosts.", "27": "And I will kindle a fire in the wall of Damascus, and it shall consume the palaces of Benhadad.", "28": "Concerning Kedar, and concerning the kingdoms of Hazor, which Nebuchadrezzar king of Babylon shall smite, thus saith the LORD; Arise ye, go up to Kedar, and spoil the men of the east.", "29": "Their tents and their flocks shall they take away: they shall take to themselves their curtains, and all their vessels, and their camels; and they shall cry unto them, Fear *is* on every side.", "30": "Flee, get you far off, dwell deep, O ye inhabitants of Hazor, saith the LORD; for Nebuchadrezzar king of Babylon hath taken counsel against you, and hath conceived a purpose", "31": "Arise, get you up unto the wealthy nation, that dwelleth without care, saith the LORD, which have neither gates nor bars, *which* dwell alone.", "32": "And their camels shall be a booty, and the multitude of their cattle a spoil: and I will scatter into all winds them *that are* in the utmost corners; and I will bring their calamity from all sides thereof, saith the LORD.", "33": "And Hazor shall be a dwelling for dragons, *and* a desolation for ever: there shall no man abide there, nor *any* son of man dwell", "34": "The word of the LORD that came to Jeremiah the prophet against Elam in the beginning of the reign of Zedekiah king of Judah, saying,", "35": "Thus saith the LORD of hosts; Behold, I will break the bow of Elam, the chief of their might.", "36": "And upon Elam will I bring the four winds from the four quarters of heaven, and will scatter them toward all those winds; and there shall be no nation whither the outcasts of Elam shall not come.", "37": "For I will cause Elam to be dismayed before their enemies, and before them that seek their life: and I will bring evil upon them, *even* my fierce anger, saith the LORD; and I will send the sword after them, till I have consumed", "38": "And I will set my throne in Elam, and will destroy from thence the king and the princes, saith the LORD.", "39": "But it shall come to pass in the latter days, *that* I will bring again the captivity of Elam, saith the LORD."}}, "tsk": {"1": [{"kopje": "Tegen", "refs": ["Jer 49:7", "Jer 49:23", "Jer 49:28", "Jer 48:1"]}, {"kopje": "kinderen van Ammon", "refs": ["Jer 25:9", "Jer 25:21", "Jer 27:3", "Gen 19:38", "Deut 2:19", "Deut 23:3", "2 Kron 20:1", "2 Kron 20:23", "Ps 83:8", "Ezech 21:28-32", "Ezech 25:2-10", "Amos 1:13-15", "Zef 2:8-11"]}, {"kopje": "zijn volk", "refs": ["Richt 10:7", "Richt 10:8", "Richt 11:13-15", "1 Sam 11:1-3", "2 Kon 10:33", "2 Kon 24:2", "Neh 2:19", "Neh 4:7", "Neh 13:1", "Neh 13:2"]}, {"kopje": "steden", "refs": ["Ps 9:7"]}], "2": [{"kopje": "dat Ik", "refs": ["Jer 4:19", "Ezech 25:4-6",  [{"label": "(When broken,) of the overthrow of power", "href": "../../torrey/b/?hl=Jer.49.35#i2039", "refs": [{"disp": "1 Sam 2:4", "href": "../../1-samuel/2/#v4", "ref": "1 Sam 2:4", "svLabel": null}, {"disp": "Jer 49:35", "href": "../../jeremia/49/#v35", "ref": "Jer 49:35", "svLabel": null}, {"disp": "Hos 1:5", "href": "../../hosea/1/#v5", "ref": "Hos 1:5", "svLabel": null}, {"disp": "Hos 2:18", "href": "../../hosea/2/#v17", "ref": "Hos 2:17", "svLabel": "SV 17"}], "kinderen": []}]}]}]}}, "extern": {"Klaagl 1:3": "Gimel. Juda is in gevangenschap gegaan vanwege de ellende, en vanwege de veelheid van de dienstbaarheid; zij woont onder de heidenen, zij vindt geen rust; al haar vervolgers achterhalen haar tussen de engten.", "Deut 31:23": "En Hij gebood Jozua, de zoon van Nun, en zei: Wees sterk en heb goede moed, want u zult de kinderen van Israël brengen in het land, dat Ik hun gezworen heb; en Ik zal met u zijn.", "Spr 24:22": "Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?", "Hebr 7:28": "Want de wet stelt tot hogepriesters mensen aan, die zwakheid hebben; maar het woord van de eedzwering, dat na de wet gekomen is, stelt de Zoon aan, Die in eeuwigheid volmaakt gemaakt is.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "Amos 1:7": "Daarom zal Ik een vuur zenden in de muur van Gaza, dat zal haar paleizen verteren.", "Ps 37:40": "En de HEERE zal hen helpen, en zal hen bevrijden; Hij zal hen bevrijden van de goddelozen, en zal hen behouden; want zij vertrouwen op Hem.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Ezech 32:30": "Daar zijn de geweldigen van het noorden, zij allen, en alle Sidoniërs, die met de verslagenen zijn neergedaald, beschaamd vanwege hun schrik die uit hun macht voortkwam, en zij liggen onbesneden bij de verslagenen van het zwaard, en dragen hun schande met hen die in het kuil zijn neergedaald.", "Dan 10:14": "Nu ben Ik gekomen om u te doen begrijpen wat uw volk zal overkomen in het vervolg van de dagen, want het gezicht is nog voor veel dagen.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Ps 49:12": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.", "Ps 138:6": "Want de HEERE is hoog, toch ziet Hij de nederige aan, en de verhevene kent Hij van verre.", "Matt 20:26": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;", "Ezech 33:24-26": "Mensenkind! De inwoners van die verwoeste plaatsen in het land van Israël zeggen: Abraham was maar één man, en bezat dit land erfelijk; maar wij zijn met velen; het land is ons gegeven tot erfelijk bezit. Daarom, zeg tegen hen: Zo zegt de Heere HEERE: U eet vlees met het bloed, en heft uw ogen op naar uw drekgoden, en vergiet bloed; en zou u het land dan erfelijk bezitten? U vertrouwt op uw zwaard; u doet gruwelijke dingen, en ieder van u verontreinigt de vrouw van zijn naaste; en zou u het land dan erfelijk bezitten?", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Spr 23:13": "Onthoud een jongen de tucht niet; als u hem met de roede slaat, zal hij niet sterven.", "Jer 48:14": "Hoe kunt u zeggen: Wij zijn helden en dappere mannen voor de strijd?", "Ps 137:7": "HEERE! Gedenkt aan de kinderen van Edom, aan de dag van Jeruzalem; die zeiden: Maak het met de grond gelijk, maak het met de grond gelijk, tot aan haar fundament toe!", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Ps 78:6": "Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Jes 34:1-17": "Kom dichterbij, heidenvolken, om te horen, en volken, luister goed! Laat de aarde horen, en haar volheid, de wereld en alles wat daaruit voortkomt. Want de toorn van de HEERE is over alle heidenvolken, en grimmigheid over heel hun leger; Hij heeft hen met de ban geslagen, Hij heeft ze ter slachting overgegeven. En hun gesneuvelden zullen weggeworpen worden, en van hun dode lichamen zal hun stank opstijgen; en de bergen zullen smelten van hun bloed.", "Jer 49:23-29": "Tegen Damaskus. Beschaamd is Hamath en Arpad; omdat zij een slecht gerucht gehoord hebben, zijn zij gesmolten; bij de zee is bekommernis, men kan er niet rusten. Damaskus is slap geworden, zij heeft zich omgekeerd om te vluchten, en siddering heeft haar aangegrepen; benauwdheid en smarten als van een barende vrouw hebben haar bevangen; Hoe is de beroemde stad niet gelaten, de stad van mijn vrolijkheid!", "Gen 14:1": "En het gebeurde in de dagen van Amrafel, de koning van Sinear, van Arioch, de koning van Ellasar, van Kedor-laomer, de koning van Elam, en van Tideal, de koning van de volken;", "Hos 13:8": "Ik ontmoette hen als een berin die van haar jongen beroofd is, en scheurde het omhulsel van hun hart open; en Ik verslond hen daar als een leeuw; het wilde dier van het veld verscheurde hen.", "Deut 16:14": "En u zult vrolijk zijn op uw feest, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet, en de vreemdeling, en de wees, en de weduwe, die in uw poorten zijn.", "Jes 10:9": "Is niet Kalno gelijk Karchemis? Is Hamath niet gelijk Arfad? Is niet Samaria gelijk Damaskus?", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Ezech 16:53-55": "Wanneer Ik hun gevangenen terugbreng, namelijk de gevangenen van Sodom en haar dochters, en de gevangenen van Samaria en haar dochters, dan zal Ik ook de gevangenen van uw gevangenschap in hun midden terugbrengen. Opdat u uw schande draagt, en te schande gemaakt wordt, om alles wat u gedaan hebt, wanneer u hen troosten zult. Wanneer uw zusters, Sodom en haar dochters, terugkeren zullen naar hun vorige toestand, alsook Samaria en haar dochters zullen terugkeren naar hun vorige toestand, zult u ook, en uw dochters, terugkeren naar uw vorige toestand.", "Deut 26:13": "En u zult voor het aangezicht van de HEERE, uw God, zeggen: Ik heb het heilige uit het huis weggenomen, en heb het ook aan de Leviet en aan de vreemdeling, aan de wees en aan de weduwe gegeven, naar al Uw geboden die U mij geboden hebt; ik heb niets van Uw geboden overtreden, en niets vergeten.", "Jer 22:25": "En Ik zal u geven in de hand van hen die uw leven zoeken, en in de hand van hen voor wier gezicht u beeft, namelijk in de hand van Nebukadnezar, de koning van Babel, en in de hand van de Chaldeeën.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Rom 1:21-23": "Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden; terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden; en hebben de heerlijkheid van de onvergankelijke God veranderd in de gelijkenis van het beeld van een vergankelijk mens, en van vogels, en van viervoetige en kruipende dieren.", "Dan 11:45": "En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben.", "Obadja 1:12-14": "U had niet moeten kijken naar de dag van uw broeder, de dag van zijn vervreemding; en u had zich niet moeten verblijden over de kinderen van Juda, op de dag van hun ondergang; en u had uw mond niet groot moeten maken, op de dag van de benauwdheid; En u had niet door de poort van Mijn volk moeten gaan, op de dag van hun verderf; en u had ook niet moeten kijken naar zijn kwaad, op de dag van zijn verderf; en u had uw handen niet moeten uitstrekken naar zijn bezit, op de dag van zijn verderf; En u had niet moeten staan op de wegscheiding, om wie van hem ontkomen waren uit te roeien; en u had zijn overgeblevenen niet moeten uitleveren, op de dag van de benauwdheid.", "1 Kor 4:6-8": "En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar. Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had? Al bent u verzadigd, al bent u rijk geworden, zonder ons hebt u geheerst; en och, was het maar zo dat u heerste, opdat ook wij met u heersen mochten!", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Jes 9:7-11": "De Heere heeft een woord gezonden in Jakob, en het is gevallen in Israël. En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden: De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Jer 30:4": "En dit zijn de woorden, die de HEERE gesproken heeft van Israël en van Juda.", "Deut 31:6-8": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten. En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven. De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Deut 2:19": "En u zult naderen tegenover de kinderen van Ammon; beangstig hen niet, en meng u niet met hen; want Ik zal u van het land van de kinderen van Ammon geen erfenis geven, omdat Ik het aan de kinderen van Lot tot erfenis gegeven heb.", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "1 Kor 5:13": "Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Ezech 5:12": "Een derde deel van u zal door de pest sterven, en zal door honger in het midden van u omkomen; en een derde deel zal door het zwaard vallen rondom u; en een derde deel zal Ik naar alle windrichtingen verstrooien, en Ik zal het zwaard achter hen uittrekken.", "Jes 13:17": "Zie, Ik zal de Meden tegen hen opwekken, die het zilver niet zullen achten, en aan het goud zullen zij geen lust hebben.", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Jes 35:3": "Versterkt de slappe handen, en maakt de struikelende knieën vast.", "2 Sam 17:10": "Dan zal zelfs hij, die een dapper man is, wiens hart is als een leeuwenhart, helemaal smelten van angst; want heel Israël weet dat uw vader een held is, en dat het dappere mannen zijn die bij hem zijn.", "Jer 46:1": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurd is tegen de heidenen.", "Kol 3:21": "Vaders, terg uw kinderen niet, opdat zij niet moedeloos worden.", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "Spr 26:16": "De luiaard is wijzer in zijn eigen ogen, dan zeven die met verstand antwoorden.", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "1 Kon 21:1": "Het gebeurde nu na deze dingen: Naboth, een Jizreëliet, had een wijngaard, die te Jizreël was, bij het paleis van Achab, de koning van Samaria.", "Jes 13:4": "Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger.", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "2 Kron 14:15": "En zij sloegen ook de tenten van het vee, en voerden schapen in menigte weg, en kamelen; en kwamen weer naar Jeruzalem.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "Mal 1:4": "Ofschoon Edom zei: Wij zijn arm geworden, maar wij zullen de verwoeste plaatsen weer opbouwen; zo zegt de HEERE van de heerscharen: Zullen zij bouwen, dan zal Ik afbreken; en men zal hen noemen: Gebied van de goddeloosheid, en een volk, op wie de HEERE toornig is tot in eeuwigheid.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Job 22:9": "De weduwen hebt u met lege handen weggezonden, en de armen van de wezen zijn verbrijzeld.", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Jes 8:4-7": "Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur. En de HEERE sprak nog verder tegen mij en zei: Omdat dit volk het water van Siloa veracht, dat zachtjes stroomt, en er vreugde is bij Rezin en de zoon van Remalia,", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Spr 15:21": "De dwaasheid is voor de verstandeloze een blijdschap; maar een man van verstand gaat recht zijn weg.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Jer 2:15": "De jonge leeuwen hebben over hem gebruld, zij hebben hun stem verheven; en zij hebben zijn land verwoest gemaakt; zijn steden zijn verbrand, zodat er niemand in woont.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "1 Kron 5:22": "Want er vielen veel gewonden, omdat de strijd van God was; en zij woonden in hun plaats, totdat zij gevankelijk werden weggevoerd.", "2 Sam 8:9": "Toen nu Thoi, de koning van Hamath, hoorde dat David het hele leger van Hadad-Ezer geslagen had,", "Jer 5:28": "Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Jes 2:11-17": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn. Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt; En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;", "Spr 27:11": "Wees wijs, mijn zoon, en verblijd mijn hart; opdat ik hem die mij smaadt, iets te antwoorden heb.", "Jer 20:4": "Want zo zegt de HEERE: Zie, Ik maak u tot een schrik voor uzelf en voor al uw vrienden; die zullen vallen door het zwaard van hun vijanden, zodat uw ogen het zien; en Ik zal heel Juda geven in de hand van de koning van Babel, die hen naar Babel gevankelijk zal wegvoeren en hen zal doden met het zwaard.", "Jes 7:8": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is.", "Ps 94:6": "De weduwe en de vreemdeling doden zij, en zij vermoorden de wezen.", "Ezech 32:11": "Want zo zegt de Heere HEERE: Het zwaard van de koning van Babel zal u overkomen.", "Jes 32:9": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor.", "Deut 24:17": "U zult het recht van de vreemdeling en van de wees niet buigen, en u zult het kleed van de weduwe niet te pand nemen.", "2 Kon 19:7": "Zie, Ik zal een geest in hem geven, zodat hij een gerucht zal horen en weer naar zijn land zal terugkeren; en Ik zal hem door het zwaard vellen in zijn land.", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "2 Kon 10:33": "Vanaf de Jordaan, tegen de opgang van de zon, het gehele land van Gilead, van de Gadieten, en van de Rubenieten, en van de Manassieten; van Aroër, dat aan de beek van Arnon is, en Gilead, en Basan.", "Amos 1:3-5": "Zo zegt de HEERE: Om drie overtredingen van Damaskus, en om vier zal Ik dat niet afwenden; omdat zij Gilead met ijzeren dorswagens hebben gedorst. Daarom zal Ik een vuur in het huis van Hazaël zenden, dat zal de paleizen van Benhadad verteren. En Ik zal de grendel van Damaskus verbreken, en zal de inwoner uitroeien uit Bikeat-aven, en hem die de scepter houdt, uit Beth-eden; en het volk van Syrië zal als gevangenen worden weggevoerd naar Kir, zegt de HEERE.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Jer 21:4-10": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Ezech 21:19": "U nu, mensenkind, stel u twee wegen voor, waardoor het zwaard van de koning van Babel komt; uit één land zullen zij beide voortkomen; en kies een plaats, kies die aan het hoofd van de weg naar de stad.", "Jes 14:24-27": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan! Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijkt, en zijn last van hun schouder wijkt. Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Jes 14:4-26": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "2 Kron 24:24": "Hoewel het leger van Syrië met weinig mannen kwam, gaf de HEERE toch in hun hand een leger van zeer grote omvang, omdat zij de HEERE, de God van hun vaderen, verlaten hadden; zo voerden zij de oordelen uit tegen Joas.", "Jer 2:10": "Want ga over naar de eilanden van de Chittiërs, en zie toe, en zend naar Kedar, en let er goed op; en zie, of zoiets is gebeurd?", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Jer 51:14": "De HEERE van de heerscharen heeft gezworen bij Zijn ziel: Ofschoon Ik u met mensen als met kevers vervuld heb, toch zullen zij elkaar een vreugdegeroep over u toeroepen!", "Ezech 29:14": "En Ik zal de gevangenschap van de Egyptenaren omkeren, en hen terugbrengen in het land van Pathros, in het land van hun koophandel; en daar zullen zij een nederig koninkrijk zijn.", "Jes 30:10": "Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.", "Deut 28:49": "De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan;", "Jer 51:38": "Zij zullen samen brullen als jonge leeuwen, brullen als leeuwenwelpen.", "Spr 13:2": "Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Ps 36:3": "Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is.", "Jes 63:1": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "Matt 21:41": "Zij zeiden tegen hem: Hij zal die kwaden een kwade dood laten sterven, en de wijngaard verhuren aan andere landbouwers, die hem de vruchten op de juiste tijd zullen geven.", "Job 32:2": "Toen ontstak de toorn van Elihu, de zoon van Baracheël, de Buziet, uit het geslacht van Ram; tegen Job werd zijn toorn ontstoken, omdat hij zichzelf meer rechtvaardigde dan God.", "Jak 1:14": "Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Spr 17:5": "Die de arme bespot, smaadt zijn Maker; die zich verblijdt in het ongeluk van een ander, zal niet onschuldig blijven.", "Ps 73:19": "Hoe worden zij als in een ogenblik tot verwoesting, komen zij aan hun einde, gaan zij te niet van verschrikkingen!", "Deut 20:8": "Daarna zullen de opzichters voortgaan met spreken tot het volk, en zeggen: Wie is de man die vreesachtig en week van hart is? Die ga heen en keert terug naar zijn huis, opdat het hart van zijn broeders niet smelt, zoals zijn hart.", "Rom 11:19-21": "U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden. Het is wel; zij zijn door ongeloof afgebroken, en u staat door het geloof. Wees niet hoogmoedig, maar vrees. Want als God de natuurlijke takken niet gespaard heeft, zie toe, dat Hij ook mogelijk u niet spaart.", "Jes 40:25": "Bij wie dan zult u Mij vergelijken, aan wie zou Ik gelijk zijn? zegt de Heilige.", "Job 28:8": "De jonge hoogmoedige dieren hebben het niet betreden, de felle leeuw is er niet overheen gegaan.", "Hand 27:20": "En toen noch zon noch sterren gedurende vele dagen verschenen, en er geen klein noodweer op ons drukte, werd ons uiteindelijk alle hoop om gered te worden ontnomen.", "Gen 37:25": "Daarna zaten zij neer om brood te eten, en zij hieven hun ogen op en zagen, en zie, een reisgezelschap van Ismaëlieten kwam uit Gilead; en hun kamelen droegen specerijen, balsem en mirre, op weg om dat naar Egypte te brengen.", "Openb 7:1": "En hierna zag ik vier engelen staan op de vier hoeken van de aarde, die de vier winden van de aarde vasthielden, zodat er geen wind zou waaien op de aarde, of op de zee, of tegen enige boom.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Gen 36:11": "En de zonen van Elifaz waren: Teman, Omar, Zefo, en Gaetam, en Kenaz.", "Ps 83:8": "Gebal, en Ammon, en Amalek, Palestina met de inwoners van Tyrus.", "Dan 11:41": "En hij zal komen in het land van het sieraad, en veel landen zullen neergeworpen worden; doch deze zullen aan zijn hand ontkomen: Edom en Moab, en de voornaamsten van de kinderen van Ammon.", "Amos 4:11": "Ik heb sommigen onder u omgekeerd, zoals God Sodom en Gomorra omkeerde, u, die was als een stuk brandhout, dat uit de brand gered is; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Ps 105:25": "Hij keerde hun hart om, zodat zij Zijn volk haatten, dat zij met Zijn knechten listig omgingen.", "Matt 22:12": "En hij zei tegen hem: Vriend! Hoe bent u hier binnengekomen zonder een bruiloftskleed aan te hebben? En hij verstomde.", "Jer 50:25": "De HEERE heeft Zijn schatkamer opengedaan, en de wapens van Zijn gramschap voortgebracht; want dat is een werk van de Heere, de HEERE van de heerscharen, in het land van de Chaldeeën.", "Jes 5:11-14": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft! En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Gen 6:12": "Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.", "Deut 6:20-24": "Wanneer uw zoon u morgen zal vragen: Wat zijn dat voor getuigenissen, en inzettingen, en rechten, die de HEERE, onze God, u geboden heeft? Dan zult u tegen uw zoon zeggen: Wij waren dienstknechten van Farao in Egypte; maar de HEERE heeft ons door een sterke hand uit Egypte uitgeleid. En de HEERE gaf tekenen, en grote en kwade wonderen, in Egypte, aan Farao en aan zijn hele huis, voor onze ogen;", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Richt 18:7-10": "Toen gingen die vijf mannen heen, en kwamen bij Lais; en zij zagen het volk dat daar te midden woonde, levend in zekerheid, naar de gewoonte van de Sidoniërs, rustig en zorgeloos; en er was geen machthebber die iemand om enige zaak schande aandeed in dat land; ook waren zij ver van de Sidoniërs, en hadden met niemand iets te maken. En zij kwamen bij hun broeders te Zora en te Esthaol, en hun broeders zeiden tegen hen: Wat zegt u? En zij zeiden: Maak u op, en laat ons tegen hen optrekken; want wij hebben dat land bekeken, en zie, het is zeer goed; zult u dan stil blijven? Wees niet lui om te gaan, en om erin te trekken, om dat land in erfelijk bezit te nemen;", "2 Kon 23:13": "De hoogten ook, die vooraan bij Jeruzalem waren, die aan de rechterhand van de berg Mashith lagen, die Salomo, de koning van Israël, gebouwd had voor Astoreth, het verfoeisel van de Sidoniërs, en voor Kamos, het verfoeisel van de Moabieten, en voor Milchom, de gruwel van de kinderen van Ammon, verontreinigde de koning.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "Ezech 25:12-14": "Zo zegt de Heere HEERE: Omdat Edom met louter wraakgierigheid gehandeld heeft tegen het huis van Juda, en zij zich zeer schuldig gemaakt hebben doordat zij zich op hen gewroken hebben: Daarom, zo zegt de Heere HEERE: Ik zal ook Mijn hand uitstrekken tegen Edom, en Ik zal mens en dier uit haar uitroeien; en Ik zal haar tot een woestenij maken, vanaf Teman; en zij zullen tot Dedan toe door het zwaard vallen. En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE.", "1 Tim 5:9-12": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is; Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd. Maar wijs de jonge weduwen af; want als zij weelderig zijn geworden tegen Christus, willen zij trouwen;", "Mark 6:11": "En als iemand u niet ontvangt, en niet naar u luistert, schud dan, wanneer u vandaar vertrekt, het stof van uw voeten af, hun tot een getuigenis. Voorwaar, Ik zeg u: Het zal voor Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Spr 18:21": "Dood en leven zijn in de macht van de tong; en ieder die haar liefheeft, zal haar vrucht eten.", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Jes 17:6": "Toch zal er een nalezing in overblijven, zoals bij het afschudden van de olijfboom, twee of drie bezien in de top van de opperste twijg, en vier of vijf aan zijn vruchtbare takken, spreekt de HEERE, de God van Israël.", "Deut 3:11": "Want Og, de koning van Bazan, was als enige van de overgeblevenen van de reuzen overgebleven; zie, zijn bed, een bed van ijzer, staat dat niet in Rabba van de kinderen van Ammon? Negen el is zijn lengte, en vier el zijn breedte, naar de elleboogsmaat van een man.", "Ps 143:2": "En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn.", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "Jer 50:32": "Dan zal de trotse aanstoten en vallen, en er zal niemand zijn die hem opricht; ja, Ik zal een vuur aansteken in zijn steden, dat zal alle plaatsen rondom hem verteren.", "Ps 107:26": "Zij rijzen op naar de hemel; zij dalen neer tot in de afgronden; hun ziel versmelt van angst.", "Ps 18:6": "Banden van het graf omringden mij, strikken van de dood bejegenden mij.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Jes 13:2": "Hef een banier op, op een hoge berg; verhef een stem tot hen; beweeg de hand omhoog, dat zij binnengaan door de deuren van de vorsten.", "1 Kor 8:1": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht.", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Richt 18:28": "En er was niemand die hen bevrijdde; want zij lag ver van Sidon, en zij hadden met niemand iets te maken; en zij lag in het dal dat bij Beth-rechob is. Daarna herbouwden zij de stad, en woonden daarin.", "Gen 15:2": "Toen zei Abram: Heere HEERE, wat zult U mij geven, terwijl ik zonder kinderen heenga en de bezorger van mijn huis deze Damascener Eliëzer is?", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Jes 11:11": "Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee.", "Deut 24:17-22": "U zult het recht van de vreemdeling en van de wees niet buigen, en u zult het kleed van de weduwe niet te pand nemen. Maar u zult gedenken dat u een knecht in Egypte geweest bent, en de HEERE, uw God, heeft u van daar verlost; daarom gebied ik u deze zaak te doen. Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen.", "Spr 17:19": "Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Gen 27:37-40": "Toen antwoordde Izak, en zei tegen Ezau: Zie, ik heb hem tot een heer over u gesteld, en al zijn broers heb ik hem tot knechten gegeven; en ik heb hem met koren en most ondersteund; wat zal ik dan nu voor u doen, mijn zoon? En Ezau zei tegen zijn vader: Hebt u maar deze ene zegen, mijn vader? Zegen mij, ook mij, mijn vader! En Ezau verhief zijn stem, en weende. Toen antwoordde zijn vader Izak en zei tegen hem: Zie, de vettigheden van de aarde zullen uw woningen zijn, en van de dauw van de hemel van boven af zult u gezegend zijn.", "Obadja 1:4": "Al verheft u zich als de arend, en al zet u uw nest tussen de sterren, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Joël 3:19": "Egypte zal tot een verwoesting worden, en Edom zal worden tot een woeste wildernis, om het geweld, gedaan aan de kinderen van Juda, in wier land zij onschuldig bloed vergoten hebben.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Jer 46:13": "Het woord, dat de HEERE tot de profeet Jeremia sprak, over de aankomst van Nebukadrezar, de koning van Babel, om Egypteland te slaan.", "1 Kron 12:15": "Dezelfde mannen zijn het die over de Jordaan gingen in de eerste maand, toen die vol was tot aan al haar oevers; en zij verdreven alle inwoners van de laagten, naar het oosten en naar het westen.", "Ezech 39:25": "Daarom zegt de Heere HEERE zo: Nu zal Ik de gevangenen van Jakob terugbrengen, en Ik zal Mij ontfermen over heel het huis van Israël, en Ik zal ijveren voor Mijn heilige Naam;", "1 Tim 5:5": "Wie nu echt weduwe is, en alleen achtergelaten, die hoopt op God, en blijft in smekingen en gebeden, nacht en dag.", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Spr 29:15": "De roede en de bestraffing geven wijsheid; maar een kind dat aan zichzelf overgelaten wordt, brengt zijn moeder schande.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Joz 10:25": "Toen zei Jozua tot hen: Vrees niet en wees niet ontsteld, wees sterk en heb goede moed; want zo zal de HEERE aan al uw vijanden doen, tegen wie u strijdt.", "Jer 27:6-9": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken. En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "2 Kon 24:2": "En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "1 Kon 11:24": "tegen wie hij ook mannen verzameld had, en hij werd aanvoerder van een bende, toen David hen doodde; en zij trokken naar Damascus, woonden daar en regeerden in Damascus.", "Jer 6:24": "Wij hebben zijn gerucht gehoord, onze handen zijn slap geworden; benauwdheid heeft ons aangegrepen, weedom als van een barende vrouw.", "Hab 3:7": "Ik zag de tenten van Kusan onder de ellende; de gordijnen van het land Midian schudden.", "Joh 5:45": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.", "Job 22:3": "Is het voor de Almachtige nuttig, dat u rechtvaardig bent; of is het winst voor Hem, dat u uw wegen volmaakt maakt?", "Deut 14:28": "Aan het einde van drie jaren zult u alle tienden van uw opbrengst voortbrengen, in datzelfde jaar, en u zult ze wegleggen in uw poorten;", "Hos 7:10": "Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Job 30:3-7": "Die door gebrek en honger eenzaam waren, vluchtend naar dorre plaatsen, in het donkere, woeste en verwoeste land. Die ziltige kruiden plukten bij de struiken, en wiens voedsel de wortel van de jenevers was. Zij werden uit het midden van de mensen weggejaagd; men riep hen na, als achter een dief,", "Job 4:1": "Toen antwoordde Elifaz, de Themaniet, en zei:", "Jes 19:2": "Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk.", "Jer 13:9": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem.", "Ezech 35:7": "En Ik zal het gebergte Seir tot de uiterste verwoesting maken; en Ik zal daaruit uitroeien wie erdoorheen trekt, en wie terugkeert.", "Luk 18:18-23": "En een zekere leider vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God. U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Job 31:16": "Als ik de armen hun begeerte onthouden heb, of de ogen van de weduwe laten versmachten;", "Jak 4:13-15": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Deut 28:65-67": "Daarbij zult u onder die volken geen rust vinden, en uw voetzool zal geen rust hebben; want de HEERE zal u daar een bevend hart geven, en bezwijking van de ogen, en kwelling van de ziel. En uw leven zal voor u onzeker hangen; en u zult nacht en dag angst hebben, en u zult niet zeker zijn van uw leven. Des morgens zult u zeggen: Was het maar avond; en des avonds zult u zeggen: Was het maar morgen; vanwege de schrik van uw hart, waarmee u geschrokken zult zijn, en vanwege wat uw ogen te zien krijgen.", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Zef 3:16": "Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.", "Jes 23:7": "Is dit uw vrolijk huppelende stad? Wier oudheid van oude dagen af is; maar haar eigen voeten zullen haar ver wegdragen, om als vreemdeling te verblijven.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Spr 30:19": "De weg van een arend in de hemel; de weg van een slang op een rotssteen; de weg van een schip in het hart van de zee; en de weg van een man bij een meisje.", "Luk 22:34": "Maar Hij zei: Ik zeg u, Petrus, de haan zal vandaag niet kraaien, voordat u driemaal geloochend zult hebben dat u Mij kent.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Jes 14:1-3": "Want de HEERE zal Zich over Jakob ontfermen, en Hij zal Israël nog verkiezen, en Hij zal hen in hun land zetten; en de vreemdeling zal zich bij hen voegen, en zij zullen het huis van Jakob aanhangen. En de volken zullen hen aannemen, en naar hun plaats brengen; en het huis van Israël zal hen erfelijk bezitten in het land van de HEERE tot knechten en tot dienstmeisjes; en zij zullen gevangen houden wie hen gevangen hielden, en zij zullen heersen over hun onderdrukkers. En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "Jer 34:2": "Zo zegt de HEERE, de God van Israël: Ga heen en spreek tot Zedekia, de koning van Juda, en zeg tegen hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "2 Kron 15:6": "Dat volk tegen volk, en stad tegen stad in stukken gestoten werden; want God had hen met allerlei angst verschrikt.", "Gen 14:15": "En hij verdeelde zich tegen hen 's nachts, hij en zijn knechten, en versloeg hen; en hij achtervolgde hen tot Hoba toe, dat ten noorden van Damaskus ligt.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "Nahum 3:19": "Er is geen genezing voor uw breuk, uw plaag is smartelijk; allen die het gerucht van u horen, zullen de handen over u klappen; want over wie is uw boosheid niet voortdurend gegaan?", "Luk 21:26": "En de mensen zal het hart bezwijken van vrees en verwachting van de dingen die het aardrijk zullen overkomen; want de krachten van de hemelen zullen bewogen worden.", "Matt 6:23": "maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!", "Spr 29:8": "Spotters brengen een stad in vuur en vlam; maar de wijzen keren de toorn af.", "1 Tim 5:3-6": "Eer de weduwen, die echt weduwen zijn. Maar als een weduwe kinderen heeft, of kleinkinderen, moeten die eerst leren om aan hun eigen huis godsvrucht te bewijzen, en hun voorouders wederdienst te doen; want dat is goed en welgevallig voor God. Wie nu echt weduwe is, en alleen achtergelaten, die hoopt op God, en blijft in smekingen en gebeden, nacht en dag.", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "Zef 2:10": "Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Jes 30:7": "Want Egypte zal nutteloos en tevergeefs helpen; daarom heb Ik hierover geroepen: Stilzitten zal hun sterkte zijn.", "Jes 5:15": "Dan zal de gewone man neergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen van de hoogmoedigen zullen vernederd worden.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Luk 18:14": "Ik zeg u: deze ging gerechtvaardigd naar zijn huis, meer dan die ander; want ieder die zichzelf verhoogt, zal vernederd worden, en die zichzelf vernedert, zal verhoogd worden.", "Jes 43:28": "Daarom zal Ik de leiders van het heiligdom ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Jer 49:1-6": "Tegen de kinderen van Ammon zegt de HEERE zo: Heeft Israël dan geen kinderen? Heeft hij geen erfgenaam? Waarom is dan Malcham erfgenaam van Gad, en waarom woont zijn volk in zijn steden? Daarom, zie, de dagen komen, spreekt de HEERE, dat Ik over Rabba van de kinderen van Ammon een krijgsgeschreeuw zal doen horen, en zij zal tot een woeste hoop worden, en haar onderhorige plaatsen zullen met vuur aangestoken worden; en Israël zal erven van hen die hem geërfd hadden, zegt de HEERE. Huil, o Hesbon! want Ai is verwoest; roep, dochters van Rabba, gord zakken aan, drijf misbaar, en loop heen en weer bij de tuinen; want Malcham zal wandelen in gevangenschap, zijn priesters en zijn vorsten samen.", "Jes 1:17": "Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Ezech 25:1-11": "En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Zet uw gezicht tegen de kinderen van Ammon, en profeteer tegen hen; En zeg tegen de kinderen van Ammon: Hoor het woord van de Heere HEERE: Zo zegt de Heere HEERE: Omdat u gezegd hebt: Ha! over Mijn heiligdom, toen het ontheiligd werd, en over het land van Israël, toen het verwoest werd, en over het huis van Juda, toen zij in gevangenschap gingen;", "Jer 50:44-46": "Zie, zoals een leeuw van de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hen in een ogenblik daaruit doen wegvluchten; en wie daartoe verkoren is, hem zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden? En wie is de herder die voor Mijn aangezicht kan bestaan? Daarom, hoor het besluit van de HEERE, dat Hij over Babel heeft beraadslaagd, en Zijn gedachten, die Hij gedacht heeft over het land van de Chaldeeën: Zeker, de geringste van de kudde zal hen wegtrekken! Zeker, hij zal de woning boven hen verwoesten! De aarde is beginnen te beven van het geluid van de inneming van Babel, en het geroep is gehoord onder de volken.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Jer 51:11-64": "Zuivert de pijlen, rust de schilden volkomen toe; de HEERE heeft de geest van de koningen van Medië opgewekt; want Zijn voornemen is tegen Babel, om haar te verderven; want dit is de wraak van de HEERE, de wraak van Zijn tempel. Verhef de banier op de muren van Babel, versterk de wacht, stel wachters op, bereid de hinderlagen; want zoals de HEERE heeft voorgenomen, zo heeft Hij gedaan, wat Hij over de inwoners van Babel gesproken heeft. U, die aan veel water woont, die machtig bent van schatten! Uw einde is gekomen, de maat van uw gierigheid.", "Dan 2:28": "Maar er is een God in de hemel, Die geheimen openbaart, Die de koning Nebukadnezar bekendgemaakt heeft wat er gebeuren zal in het laatste der dagen; uw droom en de visioenen van uw hoofd op uw bed zijn deze:", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Jer 7:24": "Toch hebben zij niet gehoord, noch hun oor geneigd, maar gewandeld in de raadslagen, in het eigen goeddunken van hun slechte hart; en zij zijn achterwaarts gekeerd, en niet voorwaarts.", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "Jes 17:2": "De steden van Aroer zullen verlaten worden; ze zullen er zijn voor de kudden, die daar zullen neerliggen, en niemand zal ze schrik aanjagen.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Spr 16:18": "Hoogmoed komt vóór de ondergang, en hoogheid van geest vóór de val.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Zef 1:7-18": "Zwijg voor het aangezicht van de Heere HEERE; want de dag van de HEERE is nabij; want de HEERE heeft een slachtoffer bereid, Hij heeft Zijn genode geheiligd. En het zal gebeuren in de dag van het slachtoffer van de HEERE, dat Ik bezoeking zal doen over de vorsten, en over de kinderen van de koning, en over allen die zich kleden met vreemde kleding. Ook zal Ik op diezelfde dag bezoeking doen over allen die over de drempel springen; die het huis van hun heren vullen met geweld en bedrog.", "Hoogl 2:14": "Mijn duif, die in de kloven van de steenrotsen bent, in het verborgene van een steile plaats, toon Mij uw gedaante, laat Mij uw stem horen; want uw stem is zoet, en uw gedaante is liefelijk.", "Ezech 35:15": "Zoals u zich verblijd hebt over de erfenis van het huis van Israël, omdat die verwoest is, zo zal Ik aan u doen; het gebergte van Seir, en heel Edom, zal helemaal een verwoesting worden; en zij zullen weten, dat Ik de HEERE ben.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Jer 49:7-22": "Tegen Edom zegt de HEERE van de heerscharen zo: Is er dan geen wijsheid meer te Theman? Is de raad vergaan van de verstandigen? Is hun wijsheid onnut geworden? Vlucht, keer u om, woon in diepe plaatsen, inwoners van Dedan! want Ik heb Ezaus verderf over hem gebracht, de tijd waarop Ik hem bezocht heb. Als er wijnoogsters tot u gekomen waren, zouden zij niet een nalezing hebben overgelaten? Als er dieven bij nacht gekomen waren, zouden zij niet verwoest hebben zoveel hun genoeg was?", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien
