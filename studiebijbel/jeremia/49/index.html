beurt, dat men zelfs overdag of 's nachts geen slaap ziet met zijn ogen;", "Job 21:31": "Wie zal hem in het aangezicht zijn weg voorhouden? Als hij iets doet, wie zal het hem vergelden?", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "1 Kon 11:5": "Want Salomo volgde Astoreth na, de god van de Sidoniërs, en Milchom, het verfoeisel van de Ammonieten.", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Dan 7:4": "Het eerste was als een leeuw, en het had arendsvleugels; ik keek toe, totdat zijn vleugels uitgeplukt werden, en het werd van de aarde opgeheven, en op de voeten gezet, als een mens, en aan hem werd een mensenhart gegeven.", "Jer 51:56": "Want de verstoorder komt over haar, over Babel, en haar helden zullen gevangen worden; hun bogen zijn verbroken; want de HEERE, de God van de vergelding, zal hun zeker betalen.", "1 Kon 15:18-20": "Toen nam Asa al het zilver en goud, dat overgebleven was in de schatten van het huis van de HEERE, en de schatten van het huis van de koning, en gaf ze in de hand van zijn knechten; en de koning Asa zond ze tot Benhadad, de zoon van Tabrimmon, de zoon van Hezion, de koning van Syrië, die te Damaskus woonde, en zei: Er is een verbond tussen mij en u, tussen mijn vader en uw vader; zie, ik zend u een geschenk, zilver en goud; ga heen, maak uw verbond met Baësa, de koning van Israël, teniet, zodat hij van tegen mij aftrekt. En Benhadad luisterde naar de koning Asa, en zond de leiders van de legers die hij had tegen de steden van Israël; en sloeg Ijon, en Dan, en Abel-Beth-Maächa, en het gehele Cinneroth, met het gehele land Nafthali.", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "Jes 47:8": "Nu dan, hoor dit, weelderige! Die zo zeker woont, die in haar hart zegt: Ik ben het, en niemand meer dan ik: ik zal geen weduwe zitten, en de beroving van kinderen niet kennen.", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Joh 9:39-41": "En Jezus zei: Ik ben tot een oordeel in deze wereld gekomen, opdat zij die niet zien, zien mogen, en zij die zien, blind worden. En dit hoorden enkelen van de Farizeeën die bij Hem waren, en zij zeiden tegen Hem: Zijn wij dan ook blind? Jezus zei tegen hen: Als u blind was, zou u geen zonde hebben; maar nu zegt u: Wij zien; daarom blijft uw zonde.", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Jes 48:20": "Ga uit van Babel, vlucht van de Chaldeeën, verkondig met de stem van het gejuich, doe zulks horen, breng het uit tot aan het einde van de aarde, zeg: De HEERE heeft Zijn knecht Jakob verlost!", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Job 9:19": "Als het op kracht aankomt, zie, Hij is sterk; en als het op recht aankomt, wie zal mij dagvaarden?", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Ezech 16:46-55": "Uw grote zuster nu is Samaria, zij en haar dochters, die woont aan uw linkerhand; maar uw zuster, die kleiner is dan u, die tegen uw rechterhand woont, is Sodom en haar dochters. Toch hebt u niet in hun wegen gewandeld, noch naar hun gruwelen gedaan; het was iets van het geringe, een verdriet; maar u hebt het meer verdorven dan zij, in al uw wegen. Zo waar Ik leef, spreekt de Heere HEERE, Sodom, uw zuster, heeft niet gedaan, zij en haar dochters niet, zoals u gedaan hebt, u en uw dochters!", "Job 1:3": "Daartoe had hij zeven duizend schapen, en drie duizend kamelen, en vijfhonderd juk ossen, en vijfhonderd ezelinnen; ook had hij zeer veel dienstvolk; zodat deze man groter was dan al die van het oosten.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Nahum 2:6": "De poorten van de rivieren zullen geopend worden, en het paleis zal wegsmelten.", "Rom 11:25": "Want ik wil niet, broeders, dat u deze verborgenheid onbekend is (opdat u niet wijs bent, bij uzelf), dat de verharding voor een deel over Israël gekomen is, totdat de volheid van de heidenen zal ingegaan zijn.", "Jona 4:11": "En zou Ik dan die grote stad Ninevé niet ontzien? Daarin wonen meer dan honderdtwintigduizend mensen, die geen onderscheid weten te maken tussen hun rechterhand en hun linkerhand; en bovendien nog veel vee?", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Jes 17:1-3": "De last van Damaskus. Zie, Damaskus zal weggenomen worden, zodat het geen stad meer is, maar het zal een vervallen steenhoop zijn. De steden van Aroer zullen verlaten worden; ze zullen er zijn voor de kudden, die daar zullen neerliggen, en niemand zal ze schrik aanjagen. En de vesting zal ophouden in Efraïm, en het koninkrijk in Damaskus, en het overblijfsel van de Syriërs; zij zullen zijn als de heerlijkheid van de kinderen van Israël, spreekt de HEERE van de heerscharen.", "Gen 22:16": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;", "Lev 26:17": "Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand.", "Ezech 28:17": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "2 Kron 12:1-12": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem. Daarom gebeurde het, in het vijfde jaar van koning Rehabeam, dat Sisak, de koning van Egypte, tegen Jeruzalem optrok (want zij hadden tegen de HEERE overtreden), met duizend tweehonderd wagens, en met zestigduizend ruiters; en van het volk dat met hem uit Egypte kwam was geen getal: Libiërs, Sukkieten en Cusjieten.", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Matt 20:27": "en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "1 Kon 11:33": "Omdat zij Mij verlaten hebben, en zich neergebogen hebben voor Astoreth, de god van de Sidoniërs, Kamos, de god van de Moabieten, en Milchom, de god van de kinderen Ammons; en niet in Mijn wegen gewandeld hebben om te doen wat recht is in Mijn ogen, namelijk Mijn inzettingen en Mijn rechten, zoals zijn vader David.", "Spr 21:20": "In de woning van de wijze is een gewenste schat, en olie; maar een dwaas mens verslindt dat.", "Tit 1:6": "Als iemand onberispelijk is, de man van één vrouw, gelovige kinderen heeft, die niet te beschuldigen zijn van overdaad, of ongehoorzaam zijn.", "Jes 13:3": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Jes 17:14": "Ten tijde van de avond, zie, dan is er verschrikking; voordat het morgen is, is hij er niet meer. Dit is het deel van hen die ons beroven, en het lot van hen die ons plunderen.", "Jes 20:5": "En zij zullen verschrikken en beschaamd zijn over de Moren, op wie zij hun hoop hadden gevestigd, en over de Egyptenaars, hun roem.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Ps 89:36": "Ik heb eens gezworen bij Mijn heiligheid: Zeker zal Ik aan David niet liegen!", "Jes 34:2-6": "Want de toorn van de HEERE is over alle heidenvolken, en grimmigheid over heel hun leger; Hij heeft hen met de ban geslagen, Hij heeft ze ter slachting overgegeven. En hun gesneuvelden zullen weggeworpen worden, en van hun dode lichamen zal hun stank opstijgen; en de bergen zullen smelten van hun bloed. En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "Matt 23:10-12": "Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus. Maar de meeste onder u zal uw dienaar zijn. En wie zichzelf verhogen zal, die zal vernederd worden; en wie zichzelf zal vernederen, die zal verhoogd worden.", "Jer 33:23": "Verder kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Jes 14:23": "En Ik zal hen stellen tot een erfbezit van de nachtuilen, en tot waterpoelen; en Ik zal hen met een bezem van het verderf wegvegen, spreekt de HEERE van de heerscharen.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "Jes 13:2-5": "Hef een banier op, op een hoge berg; verhef een stem tot hen; beweeg de hand omhoog, dat zij binnengaan door de deuren van de vorsten. Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Jer 47:6": "O wee, u zwaard van de HEERE! Hoe lang zult u niet stil houden? Vaar in uw schede, rust en wees stil!", "1 Kor 7:8": "Maar ik zeg de ongetrouwden en de weduwen: het is goed voor hen als zij blijven zoals ik.", "Job 9:21": "Ben ik oprecht, dan acht ik toch mijn ziel niet; ik versmaad mijn leven.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "2 Kon 18:21": "Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Jer 48:29": "Wij hebben Moabs hoogmoed gehoord (hij is zeer hoogmoedig), zijn trots, en zijn hoogmoed, en zijn overmoed, en de hoogheid van zijn hart.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Job 11:4-6": "Want u hebt gezegd: Mijn leer is zuiver, en ik ben rein in uw ogen. Maar zeker, och, of God sprak, en Zijn lippen tegen u opende; En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Ezech 38:13": "Scheba, en Dedan, en de kooplieden van Tarsis, en al hun jonge leeuwen zullen tegen u zeggen: Komt u, om buit te buiten? Hebt u uw verzameling verzameld, om roof te roven? Om zilver en goud weg te voeren, om vee en have weg te nemen, om een grote buit te buiten?", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "Job 13:18": "Zie toch, ik heb de zaak ordelijk gesteld; ik weet dat ik rechtvaardig verklaard zal worden.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Jes 37:6": "En Jesaja zei tegen hen: Zo moet u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bang voor de woorden die u gehoord hebt, waarmee de knechten van de koning van Assyrië Mij gelasterd hebben.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Openb 18:2": "En hij riep met kracht, met een grote stem, en zei: Zij is gevallen, zij is gevallen, het grote Babylon, en is een woonplaats van duivels geworden, en een bewaarplaats van alle onreine geesten, en een bewaarplaats van alle onrein en gehaat gevogelte;", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Jer 25:25": "En alle koningen van Zimri, en alle koningen van Elam, en alle koningen van Medië;", "Ps 95:11": "Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Jer 6:3": "Maar er zullen herders tot haar komen met hun kudden; zij zullen tenten rondom tegen haar opslaan; zij zullen ieder zijn ruimte afweiden.", "Ezech 7:24": "Daarom zal Ik de kwaadste van de heidenvolken doen komen, die hun huizen erfelijk zullen bezitten, en Ik zal de hoogmoed van de sterken doen ophouden, en die hen heiligen, zullen ontheiligd worden.", "Jer 12:7": "Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.", "Jer 7:4": "Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze!", "1 Kon 20:34": "En hij zei tegen hem: De steden, die mijn vader van uw vader genomen heeft, zal ik teruggeven, en maak u straten in Damaskus, zoals mijn vader in Samaria gemaakt heeft. En ik, antwoordde Achab, zal u met dit verbond dan laten gaan. Zo sloot hij een verbond met hem, en liet hem gaan.", "Job 4:18-21": "Zie, op Zijn knechten zou Hij niet vertrouwen; ook Zijn engelen heeft Hij van dwaasheid beschuldigd. Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot. Van de morgen tot de avond worden zij vermorzeld; zonder dat men er acht op slaat, vergaan zij voor eeuwig.", "Gen 36:15": "Dit zijn de vorsten onder de zonen van Ezau: de zonen van Elifaz, de eerstgeborene van Ezau, waren: vorst Teman, vorst Omar, vorst Zefo, vorst Kenaz.", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Jes 1:10": "Hoor het woord van de HEERE, leiders van Sodom! Neem de wet van onze God ter oor, volk van Gomorra!", "Jes 21:16": "Want zo heeft de Heere tegen mij gezegd: Nog binnen een jaar, zoals de jaren van een dagloner zijn, zal de heerlijkheid van Kedar ten onder gaan.", "Klaagl 4:21": "Schin. Wees vrolijk, en verblijd u, dochter van Edom, die in het land Uz woont! toch zal de beker ook naar u toe komen, u zult dronken worden, en zich ontbloten.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Sam 13:6": "Toen de mannen van Israël zagen dat zij in nood waren (want het volk was benauwd), verborg het volk zich in de holen, en in de doornstruiken, en in de rotsen, en in de vestingen, en in de putten.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Ezech 29:17-20": "Verder gebeurde het in het zevenentwintigste jaar, in de eerste maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei: Mensenkind! Nebukadrezar, de koning van Babel, heeft zijn leger een grote dienst laten verrichten tegen Tyrus; alle hoofden zijn kaal geworden, en alle zijden zijn opengeschuurd; en noch hij, noch zijn leger heeft loon gehad vanwege Tyrus, voor de dienst die hij tegen haar verricht heeft. Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "Lev 26:33": "Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn.", "Dan 8:8": "En de geitenbok werd uitermate groot; maar toen hij sterk geworden was, brak die grote hoorn af, en er kwamen op zijn plaats vier opvallende hoorns op, naar de vier windstreken van de hemel.", "Jes 26:4": "Vertrouw op de HEERE tot in eeuwigheid; want in de HEERE HEERE is een eeuwige rots.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Amos 9:14": "En Ik zal de gevangenschap van Mijn volk Israël omkeren, en zij zullen de verwoeste steden herbouwen en bewonen, en wijngaarden planten, en daarvan de wijn drinken; en zij zullen tuinen maken, en daarvan de vrucht eten.", "Openb 18:22": "En de stem van citerspelers, en zangers, en fluiters, en bazuinblazers, zal in u niet meer gehoord worden; en geen enkele kunstenaar van welke kunst dan ook zal meer in u gevonden worden; en het geluid van de molen zal in u niet meer gehoord worden.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "1 Kor 14:38": "Maar als iemand onwetend is, laat hij dan onwetend blijven.", "Jer 25:2": "Dat de profeet Jeremia gesproken heeft tot het hele volk van Juda, en tot alle inwoners van Jeruzalem, en hij zei:", "Ex 22:22-24": "U mag geen weduwe of wees kwaad doen. Als u hen op enige manier kwaad doet, en zij roepen dan tot Mij, zal Ik hun geroep zeker verhoren; en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Job 5:12-14": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten. Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt. Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Spr 18:12": "Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Spr 16:19": "Het is beter nederig van geest te zijn met de zachtmoedigen, dan buit te delen met de hoogmoedigen.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Openb 6:15": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen;", "2 Petr 2:6": "en de steden Sodom en Gomorra tot as heeft laten verbranden en met een omkering veroordeeld heeft, en tot een voorbeeld gesteld heeft voor hen die goddeloos zouden leven;", "Ps 147:2": "De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Ezech 23:22-25": "Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen. De zonen van Babel en alle Chaldeeën, Pekod, en Soa, en Koa, en alle zonen van Assur met hen; aantrekkelijke jonge mannen, die allen vorsten en machthebbers zijn, hoofdmannen en vermaarde mannen, die allen te paard rijden. Die zullen tegen u komen met karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.", "Jer 49:28-30": "Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg, zegt de HEERE zo: Maak u op, trek op tegen Kedar, en verwoest de kinderen van het oosten. Zij zullen hun tenten en hun kudden nemen, hun gordijnen en al hun gereedschap, en hun kamelen voor zich wegnemen; en zij zullen tegen hen uitroepen: Schrik van rondom! Vlucht, zwerf vlug heen, woon in diepe plaatsen, inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadsbesluit tegen u beraadslaagd, en een gedachte tegen hen gedacht.", "2 Kron 20:23": "Want de kinderen van Ammon en Moab stonden op tegen de inwoners van het gebergte Seir, om hen met de ban te treffen en te vernietigen; en toen zij een einde gemaakt hadden aan de inwoners van Seir, hielpen zij elkaar in het verderf.", "Zach 9:12": "Keert u weer tot de sterkte, gebondenen, die daar hopen! Ook heden verkondig Ik, dat Ik u dubbel zal wedergeven;", "Joz 2:9": "En zij sprak tot die mannen: Ik weet dat de HEERE u dit land gegeven heeft, en dat de schrik voor u op ons gevallen is, en dat alle inwoners van dit land voor u vergaan zijn van angst.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Ex 21:17": "Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden.", "Jes 13:19": "Zo zal Babel, het sieraad van de koninkrijken, de heerlijkheid, de hovaardigheid van de Chaldeeën, zijn zoals toen God Sodom en Gomorra omgekeerd heeft.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Jer 4:7": "De leeuw is opgekomen uit zijn schuilplaats, en de verwoester van de heidenvolken is opgetrokken, hij is uitgegaan uit zijn plaats, om uw land te maken tot een woestenij; uw steden zullen verwoest worden, zodat er niemand in woont.", "Jes 37:7": "Zie, Ik zal een geest in hem geven, zodat hij een gerucht horen zal en terugkeert naar zijn land; en Ik zal hem door het zwaard vellen in zijn land.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Amos 4:3": "En u zult door de bressen naar buiten gaan, ieder voor zich heen; en u zult wat in het paleis gebracht is, wegwerpen, spreekt de HEERE.", "Gen 25:30": "En Ezau zei tegen Jakob: Laat mij toch slurpen van dat rode, dat rode daar, want ik ben moe; daarom heeft men zijn naam Edom genoemd.", "Deut 9:4-6": "Wanneer de HEERE, uw God, hen nu voor uw aangezicht zal hebben uitgestoten, spreek dan niet in uw hart en zeg: De HEERE heeft mij om mijn gerechtigheid ingebracht, om dit land te erven; want om de goddeloosheid van deze volken verdrijft de HEERE hen voor uw aangezicht uit de bezitting. Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft. Weet dan, dat de HEERE, uw God, u niet om uw gerechtigheid dit goede land geeft om dat te erven; want u bent een hardnekkig volk.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "1 Tess 2:11": "Zoals u weet, hoe wij ieder van u, zoals een vader zijn kinderen, vermaanden en vertroostten,", "Jer 31:1": "In die tijd, spreekt de HEERE, zal Ik voor alle geslachten van Israël tot een God zijn; en zij zullen Mij tot een volk zijn.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Obadja 1:8": "Zal het niet op die dag zijn, spreekt de HEERE, dat Ik de wijzen uit Edom, en het verstand uit het gebergte van Ezau zal doen vergaan?", "Jes 28:1-4": "Wee de hoogmoedige kroon van de dronkaards van Efraïm, wiens heerlijke sieraad een verwelkende bloem is, die daar is op het hoofd van de zeer vruchtbare vallei, van hen die door de wijn geveld zijn. Zie, de Heere heeft een sterke en machtige, er is als een hagelvloed, een verwoestende storm; als een vloed van sterk, overstromend water zal Hij ze met de hand ter aarde neerwerpen. De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "Jes 16:3": "Breng raad, houd gericht, maak uw schaduw als de nacht in het midden van de middag; verberg de verdrevenen, en verraad hem die rondzwerft niet.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Jes 37:13": "Waar is de koning van Hamath, en de koning van Arpad, en de koning van de stad Sefarvaïm, Hena en Ivva?", "2 Kron 25:19": "U zegt: Zie, ik heb de Edomieten geslagen; daarom heeft uw hart u verheven om te roemen; blijf nu in uw huis; waarom zou u zich in het kwaad mengen, zodat u zou vallen, u en Juda met u?", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Jes 14:12-16": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Jer 46:21": "Zelfs haar gehuurden in haar midden zijn als gemeste kalveren; maar die hebben zich ook gewend, zij zijn samen gevlucht, zij hebben niet gestaan; want de dag van hun verderf is over hen gekomen, de tijd van hun bezoeking.", "Joz 1:5-9": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten. Wees sterk en heb goede moed! Want u zult dit volk dat land als erfelijk bezit doen verkrijgen, dat Ik hun vaderen gezworen heb hun te geven. Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Jer 4:31": "Want ik hoor een stem als van een vrouw, die in barensnood is, een benauwdheid als van iemand die haar eerste kind baart, de stem van de dochter van Sion; zij hijgt, zij spreidt haar handen uit, en zegt: O, wee mij nu, want mijn ziel is moe vanwege de moordenaars!", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Amos 1:11": "Zo zegt de HEERE: Om drie overtredingen van Edom, en om vier zal Ik dat niet afwenden; omdat hij zijn broeders met het zwaard heeft vervolgd, en zijn medelijden heeft verdorven; en dat zijn toorn eeuwig verscheurt, en hij zijn woede altijd blijft koesteren.", "Jer 46:27": "Maar u, Mijn knecht Jakob! Vrees niet, en wees niet ontzet, Israël! Want zie, Ik zal u verlossen uit verre landen, en uw nageslacht uit het land van hun gevangenschap; en Jakob zal wederkomen, en stil en gerust zijn, en niemand zal hem verschrikken.", "Jes 15:3": "Op hun wegen hebben zij rouwkleding aangegord; op hun daken en op hun pleinen huilen zij allemaal, terwijl zij afdalen met geween.", "Micha 7:4": "De beste van hen is als een doorn; de oprechtste is scherper dan een doornheg; de dag van uw wachters, uw bezoeking, is gekomen; nu zal hun verwarring zijn.", "Deut 32:46": "Zei hij tegen hen: Zet uw hart op al de woorden, die ik heden onder u betuig, dat u ze uw kinderen gebieden zult, dat zij nauwlettend zullen doen al de woorden van deze wet.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Luk 14:8": "Wanneer u door iemand op een bruiloft genodigd wordt, ga dan niet op de eerste plaats zitten; anders zou misschien iemand die voornamer is dan u door hem genodigd zijn,", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "2 Kron 25:18": "Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Jer 48:41": "Elke stad is gewonnen, en elke vesting is ingenomen; en het hart van Moabs helden zal op die dag zijn als het hart van een vrouw die in barensnood is.", "Dan 4:10-26": "De visioenen van mijn hoofd op mijn bed waren deze: ik zag, en zie, er was een boom in het midden van de aarde, en zijn hoogte was groot. De boom werd groot en sterk; en zijn hoogte reikte aan de hemel, en hij werd gezien tot aan het einde van de hele aarde; Zijn loof was mooi, en zijn vruchten veel, en er was voedsel aan voor allen; onder hem vond het gedierte van het veld schaduw, en de vogels van de hemel woonden in zijn takken, en alle vlees werd daarvan gevoed.", "Rom 2:17-20": "Zie, u wordt een Jood genoemd en rust op de wet, en roemt in God, En u kent Zijn wil, en beoordeelt wat daarvan verschilt, want u bent onderwezen uit de wet; En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn,", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "2 Kon 19:13": "Waar is de koning van Hamath, en de koning van Arpad, en de koning van de stad Sefarvaim, Hena en Ivva?", "Jes 21:17": "En het overgebleven aantal van de schutters, de helden van de Kedarenen, zal minder worden, want de HEERE, de God van Israël, heeft het gesproken.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Zach 11:3": "Er is een stem van het gehuil van de herders, omdat hun heerlijkheid verwoest is; een stem van het gebrul van de jonge leeuwen, omdat de hoogmoed van de Jordaan verwoest is.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Job 35:8": "Uw goddeloosheid zou een man treffen, gelijk u bent, en uw gerechtigheid een mensenkind ten goede komen.", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "Jer 32:1": "Het woord dat tot Jeremia gekomen is van de HEERE, in het tiende jaar van Zedekia, koning van Juda; dit jaar was het achttiende jaar van Nebukadnezar.", "2 Kron 33:11": "Daarom bracht de HEERE over hen de legeroversten van de koning van Assyrië, die Manasse gevangen namen tussen de doornen; en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Job 37:24": "Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan.", "Job 42:10": "En de HEERE wendde de gevangenis van Job, toen hij gebeden had voor zijn vrienden; en de HEERE vermeerderde alles wat Job gehad had tot het dubbele.", "Pred 10:2": "Het hart van de wijze is naar zijn rechterhand, maar het hart van een dwaas naar zijn linkerhand.", "Jer 27:3": "En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Jes 11:14": "Maar zij zullen op de schouder van de Filistijnen vliegen naar het westen, en zij zullen samen die van het oosten beroven; aan Edom en Moab zullen zij hun handen slaan, en de kinderen van Ammon zullen hun gehoorzaam zijn.", "Obadja 1:3": "De trots van uw hart heeft u bedrogen; u die woont in de kloven van de rotsen, in uw hoge woning; die in uw hart zegt: Wie zou mij ter aarde neerstoten?", "Jer 37:10": "Want al zou u het hele leger van de Chaldeeën verslaan, die tegen u strijden, en er zouden van hen alleen gewonde mannen overblijven, dan zouden die zich toch, ieder in zijn tent, opmaken en deze stad met vuur verbranden.", "Luk 17:6": "En de Heere zei: Als u een geloof had als een mosterdzaad, zou u tegen deze moerbeiboom zeggen: Word ontworteld en in de zee geplant, en hij zou u gehoorzaam zijn.", "Luk 12:19": "en ik zal tegen mijn ziel zeggen: Ziel, je hebt veel goederen liggen, voor vele jaren; neem rust, eet, drink, wees vrolijk.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Luk 1:52": "Hij heeft machtigen van de tronen afgezet, en nederigen heeft Hij verhoogd.", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Spr 20:18": "Elke gedachte wordt door raad bevestigd, voer daarom oorlog met wijze raadslagen.", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "Amos 9:3": "En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Luk 1:73": "en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Klaagl 2:16": "Pe. Al uw vijanden sperren hun mond open over u, zij fluiten en knersen met de tanden, zij zeggen: Wij hebben haar verslonden; dit is zeker de dag die wij verwacht hebben, wij hebben hem gevonden, wij hebben hem gezien.", "Jes 56:8": "De Heere HEERE, Die de verdrevenen van Israël bijeenbrengt, spreekt: Ik zal er bij hem nog meer bijeenbrengen, naast hen die al bij hem bijeengebracht zijn.", "Hos 12:3": "Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.", "Ezech 39:6": "En Ik zal een vuur zenden in Magog, en onder hen die veilig op de eilanden wonen; en zij zullen weten dat Ik de HEERE ben.", "Ps 97:8": "Sion heeft het gehoord, en het heeft zich verblijd, en de dochters van Juda hebben zich verheugd vanwege Uw oordelen, o HEERE!", "Pred 8:1": "Wie is als de wijze, en wie weet de uitleg van de dingen? De wijsheid van de mens verlicht zijn gezicht, en de hardheid van zijn gezicht wordt daardoor veranderd.", "Deut 10:18": "Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden."}, "noten": {"1": "D.i. legermachten"}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">Tegen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5983\">Ammon</span> <spa \">heir</span> unto them that were his <span class=\"wl wl-kjv\" data-code=\"H3423\">heirs,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "3": "<span class=\"wl wl-kjv\" data-code=\"H3213\">Howl,</span> O <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon,</span> for <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> is <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled:</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">cry,</span> ye <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H7237\">Rabbah,</span> <span class=\"wl wl-kjv\" data-code=\"H2296\">gird</span> you with <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth;</span> <span class=\"wl wl-kjv\" data-code=\"H5594\">lament,</span> and run to and <span class=\"wl wl-kjv\" data-code=\"H7751\">fro</span> by the <span class=\"wl wl-kjv\" data-code=\"H1448\">hedges;</span> for their <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> into <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> together.", "4": "Wherefore <span class=\"wl wl-kjv\" data-code=\"H1984\">gloriest</span> thou in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valleys,</span> thy <span class=\"wl wl-kjv\" data-code=\"H2100\">flowing</span> <span class=\"wl wl-kjv\" data-code=\"H6010\">valley,</span> O <span class=\"wl wl-kjv\" data-code=\"H7728\">backsliding</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter?</span> that <span class=\"wl wl-kjv\" data-code=\"H982\">trusted</span> in her <span class=\"wl wl-kjv\" data-code=\"H214\">treasures,</span> saying, Who shall come", "5": "Behold, I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> a <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> upon thee, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> from all those that be <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> thee; and ye shall be driven <span class=\"wl wl-kjv\" data-code=\"H5080\">out</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> right <span class=\"wl wl-kjv\" data-code=\"H6440\">forth;</span> and none shall gather <span class=\"wl wl-kjv\" data-code=\"H6908\">up</span> him that wandereth.", "6": "And <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> I will bring <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "7": "Concerning <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> Is <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> no more in <span class=\"wl wl-kjv\" data-code=\"H8487\">Teman?</span> is <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> <span class=\"wl wl-kjv\" data-code=\"H6\">perished</span> from the <span class=\"wl wl-kjv\" data-code=\"H995\">prudent?</span> is their <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> vanished?", "8": "<span class=\"wl wl-kjv\" data-code=\"H5127\">Flee</span> ye, turn <span class=\"wl wl-kjv\" data-code=\"H6437\">back,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H6009\">deep,</span> O <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H1719\">Dedan;</span> for I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H343\">calamity</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> upon him, the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that I will visit", "9": "If <span class=\"wl wl-kjv\" data-code=\"H1219\">grapegatherers</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to thee, would they not <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> some gleaning <span class=\"wl wl-kjv\" data-code=\"H5955\">grapes?</span> if <span class=\"wl wl-kjv\" data-code=\"H1590\">thieves</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> they will <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> till they have enough.", "10": "But I have made <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> <span class=\"wl wl-kjv\" data-code=\"H2834\">bare,</span> I have <span class=\"wl wl-kjv\" data-code=\"H1540\">uncovered</span> his secret <span class=\"wl wl-kjv\" data-code=\"H4565\">places,</span> and he shall not be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H2247\">hide</span> himself: his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> is <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled,</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and his neighbours,", "11": "<span class=\"wl wl-kjv\" data-code=\"H5800\">Leave</span> thy fatherless <span class=\"wl wl-kjv\" data-code=\"H3490\">children,</span> I will preserve them <span class=\"wl wl-kjv\" data-code=\"H2421\">alive;</span> and let thy <span class=\"wl wl-kjv\" data-code=\"H490\">widows</span> trust", "12": "For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Behold, they whose <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> was not to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> have <span class=\"wl wl-kjv\" data-code=\"H8354\">assuredly</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drunken;</span> and art thou he that shall <span class=\"wl wl-kjv\" data-code=\"H5352\">altogether</span> go <span class=\"wl wl-kjv\" data-code=\"H5352\">unpunished?</span> thou shalt not go <span class=\"wl wl-kjv\" data-code=\"H5352\">unpunished,</span> but thou shalt <span class=\"wl wl-kjv\" data-code=\"H8354\">surely</span> drink", "13": "For I have <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> by myself, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that <span class=\"wl wl-kjv\" data-code=\"H1224\">Bozrah</span> shall become a <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation,</span> a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach,</span> a <span class=\"wl wl-kjv\" data-code=\"H2721\">waste,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7045\">curse;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> wastes.", "14": "I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> a <span class=\"wl wl-kjv\" data-code=\"H8052\">rumour</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and an <span class=\"wl wl-kjv\" data-code=\"H6735\">ambassador</span> is <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> saying, Gather ye <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> against her, and rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to the battle.", "15": "For, lo, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> among men.", "16": "Thy <span class=\"wl wl-kjv\" data-code=\"H8606\">terribleness</span> hath <span class=\"wl wl-kjv\" data-code=\"H5377\">deceived</span> thee, and the <span class=\"wl wl-kjv\" data-code=\"H2087\">pride</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> O thou that <span class=\"wl wl-kjv\" data-code=\"H7931\">dwellest</span> in the <span class=\"wl wl-kjv\" data-code=\"H2288\">clefts</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> that <span class=\"wl wl-kjv\" data-code=\"H8610\">holdest</span> the <span class=\"wl wl-kjv\" data-code=\"H4791\">height</span> of the <span class=\"wl wl-kjv\" data-code=\"H1389\">hill:</span> though thou shouldest make thy <span class=\"wl wl-kjv\" data-code=\"H7064\">nest</span> as <span class=\"wl wl-kjv\" data-code=\"H1361\">high</span> as the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle,</span> I will bring thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from thence, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "17": "Also <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation:</span> every one that <span class=\"wl wl-kjv\" data-code=\"H5674\">goeth</span> by it shall be <span class=\"wl wl-kjv\" data-code=\"H8074\">astonished,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss</span> at all the plagues", "18": "As in the <span class=\"wl wl-kjv\" data-code=\"H4114\">overthrow</span> of <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah</span> and the <span class=\"wl wl-kjv\" data-code=\"H7934\">neighbour</span> cities thereof, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> there, neither shall a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> dwell", "19": "Behold, he shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> like a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> from the <span class=\"wl wl-kjv\" data-code=\"H1347\">swelling</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> against the <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation</span> of the <span class=\"wl wl-kjv\" data-code=\"H386\">strong:</span> but I will <span class=\"wl wl-kjv\" data-code=\"H7280\">suddenly</span> make him run <span class=\"wl wl-kjv\" data-code=\"H7323\">away</span> from her: and who is a <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> man, that I may <span class=\"wl wl-kjv\" data-code=\"H6485\">appoint</span> over her? for who is like me? and who will appoint me the <span class=\"wl wl-kjv\" data-code=\"H3259\">time?</span> and who is that <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd</span> that will <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> before", "20": "Therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H3289\">taken</span> against <span class=\"wl wl-kjv\" data-code=\"H123\">Edom;</span> and his <span class=\"wl wl-kjv\" data-code=\"H4284\">purposes,</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H2803\">purposed</span> against the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H8487\">Teman:</span> Surely the <span class=\"wl wl-kjv\" data-code=\"H6810\">least</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> shall draw them <span class=\"wl wl-kjv\" data-code=\"H5498\">out:</span> surely he shall make their <span class=\"wl wl-kjv\" data-code=\"H5116\">habitations</span> desolate", "21": "The <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is <span class=\"wl wl-kjv\" data-code=\"H7493\">moved</span> at the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of their <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> at the <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> thereof was <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> sea.", "22": "Behold, he shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H1675\">fly</span> as the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle,</span> and <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> his <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> over <span class=\"wl wl-kjv\" data-code=\"H1224\">Bozrah:</span> and at that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> be as the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> in her pangs.", "23": "Concerning <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus.</span> <span class=\"wl wl-kjv\" data-code=\"H2574\">Hamath</span> is <span class=\"wl wl-kjv\" data-code=\"H954\">confounded,</span> and <span class=\"wl wl-kjv\" data-code=\"H774\">Arpad:</span> for they have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H8052\">tidings:</span> they are <span class=\"wl wl-kjv\" data-code=\"H4127\">fainthearted;</span> there is <span class=\"wl wl-kjv\" data-code=\"H1674\">sorrow</span> on the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea;</span> it <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> be quiet.", "24": "<span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus</span> is waxed <span class=\"wl wl-kjv\" data-code=\"H7503\">feeble,</span> and <span class=\"wl wl-kjv\" data-code=\"H6437\">turneth</span> herself to <span class=\"wl wl-kjv\" data-code=\"H5127\">flee,</span> and <span class=\"wl wl-kjv\" data-code=\"H7374\">fear</span> hath <span class=\"wl wl-kjv\" data-code=\"H2388\">seized</span> on her: <span class=\"wl wl-kjv\" data-code=\"H6869\">anguish</span> and <span class=\"wl wl-kjv\" data-code=\"H2256\">sorrows</span> have <span class=\"wl wl-kjv\" data-code=\"H270\">taken</span> her, as a woman in travail.", "25": "How is the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> not <span class=\"wl wl-kjv\" data-code=\"H5800\">left,</span> the <span class=\"wl wl-kjv\" data-code=\"H7151\">city</span> of my joy!", "26": "Therefore her young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in her <span class=\"wl wl-kjv\" data-code=\"H7339\">streets,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H1826\">off</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\" 39\">anger,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them, till I have consumed", "38": "And I will <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> in <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam,</span> and will <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> from thence the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "39": "But it shall come to pass in the <span class=\"wl wl-kjv\" data-code=\"H319\">latter</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> that I will bring <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
