alingen":{"SVnu":{"1":"En het woord van de HEERE gebeurde tot mij, en Hij zei:","2":"Ga en roep voor de oren van Jeruzalem, en zeg: Zo zegt de HEERE: Ik gedenk de weldadigheid van uw jeugd, de liefde van uw ondertrouw, toen u Mij nawandelde in de woestijn, in onbezaaid land.","3":"Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.","4":"Hoort het woord van de HEERE, huis van Jakob, en alle geslachten van het huis van Israël!","5":"Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij ver van Mij zijn geweken, en de ijdelheid hebben nagewandeld, en zelf ijdel zijn geworden?","6":"En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde?","7":"En Ik bracht u in een vruchtbaar land, om de vrucht ervan en het goede ervan te eten; maar toen u daarin kwam, verontreinigde u Mijn land, en maakte u Mijn erfenis tot een gruwel.","8":"De priesters zeiden niet: Waar is de HEERE? en die de wet hanteerden, kenden Mij niet; en de herders overtraden tegen Mij; en de profeten profeteerden door Baäl, en wandelden *naar dingen* die geen nut doen.","9":"Daarom zal Ik nog met u twisten, spreekt de HEERE; ja, met uw kindskinderen zal Ik twisten.","10":"Want ga over naar de eilanden van de Chittiërs, en zie toe, en zend *naar* Kedar, en let er goed op; en zie, of zoiets is gebeurd?","11":"Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in *iets* dat geen nut doet.","12":"Ontzet u hierover, hemelen, en wees verschrikt, word zeer woest, spreekt de HEERE.","13":"Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.","14":"Is Israël dan een knecht, of is hij een ingeborene van het huis? Waarom is hij *dan* tot een roof geworden?","15":"De jonge leeuwen hebben over hem gebruld, zij hebben hun stem verheven; en zij hebben zijn land verwoest gemaakt; zijn steden zijn verbrand, zodat er niemand in woont.","16":"Ook hebben de kinderen van Nof en Tachpanhes u de schedel afgeweid.","17":"Doet u dit niet zelf, *doordat* u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?","18":"En nu, wat hebt u te doen met de weg van Egypte, om de wateren van Sihor te drinken? En wat hebt u te doen met de weg van Assur, om de wateren van de rivier te drinken?","19":"Uw boosheid zal u kastijden, en uw afkeringen zullen u straffen; weet dan en zie, dat het kwaad en bitter is, dat u de HEERE, uw God, verlaat, en Mijn vreze niet bij u is, spreekt de Heere, de HEERE van de heerscharen[1].","20":"Toen Ik van oude tijden af uw juk verbroken, *en* uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.","21":"Ik had u toch geplant, een edele wijnstok, een geheel getrouw zaad; hoe bent u Mij dan veranderd *in* verbasterde ranken van een vreemde wijnstok?","22":"Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE.","23":"Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait!","24":"Zij is een woudezelin, gewend aan de woestijn, naar de lust van haar ziel schept zij de wind; wie zou haar ontmoeting kunnen afkeren? Allen die haar zoeken, zullen niet moe worden, in haar maand zullen zij haar vinden.","25":"Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!","26":"Zoals een dief beschaamd wordt, wanneer hij gevonden wordt, zo is het huis van Israël beschaamd; zij, hun koningen, hun vorsten, en hun priesters, en hun profeten;","27":"Die tot een stuk hout zeggen: U bent mijn vader; en tot een steen: U hebt mij verwekt; want zij keren Mij de nek toe, en niet het aangezicht; maar ten tijde van hun kwaad zeggen zij: Sta op en verlos ons.","28":"Waar zijn dan uw goden, die u zich gemaakt hebt? Laat ze opstaan, of zij u ten tijde van uw kwaad zullen verlossen; want *naar* het getal van uw steden zijn uw goden, Juda!","29":"Waarom twist u tegen Mij? U hebt allen tegen Mij overtreden, spreekt de HEERE.","30":"Tevergeefs heb Ik uw kinderen geslagen; zij hebben de tucht niet aangenomen; uw eigen zwaard heeft uw profeten verteerd, als een verdervende leeuw.","31":"Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?","32":"Vergeet ook een jonkvrouw haar versiersel, *of* een bruid haar bindselen? Toch heeft Mijn volk Mij vergeten, dagen zonder getal.","33":"Wat maakt u uw weg goed, terwijl u boelering zoekt? Waarom u ook de boosaardigste *hoeren* uw wegen geleerd hebt.","34":"Ja, het bloed van de zielen van de onschuldige behoeftigen is in uw zomen gevonden; Ik heb dat niet door opgraven gevonden, maar aan dat alles.","35":"Nog zegt u: Zeker, ik ben onschuldig; Zijn toorn is immers[2] van mij afgekeerd. Zie, Ik zal met u rechten, omdat u zegt: Ik heb niet gezondigd.","36":"Wat reist u veel uit, terwijl u uw weg verandert? U zult ook van Egypte beschaamd worden, zoals u van Assur beschaamd bent.","37":"U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen."},"SV":{"1":"En des HEEREN woord geschiedde tot mij, zeggende:","2":"Ga en roep voor de oren van Jeruzalem, zeggende: Zo zegt de HEERE: Ik gedenk der weldadigheid uwer jeugd, der liefde uwer ondertrouw, toen gij Mij nawandeldet in de woestijn, in onbezaaid land.","3":"Israël was den HEERE een heiligheid, de eerstelingen Zijner inkomste; allen, die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.","4":"Hoort des HEEREN woord, gij huis van Jakob, en alle geslachten van het huis Israëls!","5":"Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij verre van Mij geweken zijn, en hebben de ijdelheid nagewandeld, en zij zijn ijdel geworden?","6":"En zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw des doods, in een land, waar niemand doorging, en waar geen mens woonde?","7":"En Ik bracht u in een vruchtbaar land, om de vrucht van hetzelve en het goede er van te eten; maar toen gij daarin kwaamt, verontreinigdet gij Mijn land, en steldet Mijn erfenis tot een gruwel.","8":"De priesters zeiden niet: Waar is de HEERE? en die de wet handelden, kenden Mij niet; en de herders overtraden tegen Mij; en de profeten profeteerden door Baäl, en wandelden *naar* *dingen*, *die* geen nut doen.","9":"Daarom zal Ik nog met ulieden twisten, spreekt de HEERE; ja, met uw kindskinderen zal Ik twisten.","10":"Want, gaat over in de eilanden der Chitteers, en ziet toe, en zendt *naar* Kedar, en merkt er wel op; en ziet, of diesgelijks geschied zij?","11":"Heeft ook een volk de goden veranderd, hoewel dezelve geen goden zijn? Nochtans heeft Mijn volk zijn Eer veranderd in *hetgeen* geen nut doet.","12":"Ontzet u hierover, gij hemelen, en zijt verschrikt, wordt zeer woest, spreekt de HEERE.","13":"Want Mijn volk heeft twee boosheden gedaan; Mij, den Springader des levenden waters, hebben zij verlaten, om zichzelven bakken uit te houwen, gebroken bakken, die geen water houden.","14":"Is dan Israël een knecht, of is hij een ingeborene des huizes? Waarom is hij *dan* ten roof geworden?","15":"De jonge leeuwen hebben over hem gebruld, zij hebben hun stem verheven; en zij hebben zijn land gezet in verwoesting; zijn steden zijn verbrand, dat er niemand in woont.","16":"Ook hebben u de kinderen van Nof en Tachpanhes den schedel afgeweid.","17":"Doet gij dit niet zelven, *doordien* gij den HEERE, uw God, verlaat, ten tijde als Hij u op den weg leidt?","18":"En nu, wat hebt gij te doen met den weg van Egypte, om de wateren van Sihor te drinken? En wat hebt gij te doen met den weg van Assur, om de wateren der rivier te drinken?","19":"Uw boosheid zal u kastijden, en uw afkeringen zullen u straffen; weet dan en ziet, dat het kwaad en bitter is, dat gij den HEERE, uw God, verlaat, en Mijn vreze niet bij u is, spreekt de Heere, de HEERE der heirscharen.","20":"Als Ik van ouds uw juk verbroken, *en* uw banden verscheurd had, zo zeidet gij: Ik zal niet dienen ; maar op allen hogen heuvel en onder allen groenen boom loopt gij om, hoererende.","21":"Ik had u toch geplant, een edelen wijnstok, een geheel getrouw zaad; hoe zijt gij Mij dan veranderd *in* verbasterde ranken van een vreemden wijnstok?","22":"Want, al wiest gij u met salpeter, en naamt u veel zeep, zo is *toch* uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE.","23":"Hoe zegt gij: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken, wat gij gedaan hebt, gij lichte, snelle kemelin, die haar wegen verdraait!","24":"Zij is een woudezelin, gewend in de woestijn, naar den lust harer ziel schept zij den wind, wie zou haar ontmoeting afkeren? Allen, die haar zoeken, zullen niet moede worden, in haar maand zullen zij haar vinden.","25":"Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar gij zegt: Het is buiten hoop; neen, want ik heb de vreemden lief, en die zal ik nawandelen!","26":"Gelijk een dief beschaamd wordt, wanneer hij gevonden wordt, alzo zijn die van het huis Israëls beschaamd; zij, hun koningen, hun vorsten, en hun priesters, en hun profeten;","27":"Die tot een hout zeggen: Gij zijt mijn vader; en tot een steen: Gij hebt mij gegenereerd; want zij keren Mij den nek toe, en niet het aangezicht; maar ten tijde huns kwaads zeggen zij: Sta op en verlos ons.","28":"Waar zijn dan uw goden, die gij u gemaakt hebt? Laat ze opstaan, of zij u ten tijde uws kwaads zullen verlossen; want *naar* het getal uwer steden zijn uw goden, o Juda!","29":"Waarom twist gij tegen Mij? Gij hebt allen tegen Mij overtreden, spreekt de HEERE.","30":"Tevergeefs heb Ik uw kinderen geslagen; zij hebben de tucht niet aangenomen; ulieder zwaard heeft uw profeten verteerd, als een verdervende leeuw.","31":"O geslacht, aanmerkt *toch* gijlieden des HEEREN woord! Ben Ik Israël een woestijn geweest, of een land der uiterste donkerheid? Waarom zegt *dan* Mijn volk: Wij zijn heren, wij zullen niet meer tot U komen?","32":"Vergeet ook een jonkvrouw haar versiersel, *of* een bruid haar bindselen? Nochtans heeft Mijn volk Mij vergeten, dagen zonder getal.","33":"Wat maakt gij uw weg goed, daar gij boelering zoekt? Waarom gij ook de booste *hoeren* uw wegen geleerd hebt.","34":"Ja, het bloed van de zielen der onschuldige nooddruftigen is in uw zomen gevonden; Ik heb dat niet met opgraven gevonden, maar aan alle die.","35":"Nog zegt gij: Zeker, ik ben onschuldig; Zijn toorn is immers van mij afgekeerd. Ziet, Ik zal met u rechten, omdat gij zegt: Ik heb niet gezondigd.","36":"Wat reist gij veel uit, veranderende uw weg? Gij zult ook van Egypte beschaamd worden, gelijk als gij van Assur beschaamd zijt.","37":"Gij zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat gij daarmede niet zult gedijen."},"KJV":{"1":"Moreover the word of the LORD came to me, saying,","2":"Go and cry in the ears of Jerusalem, saying, Thus saith the LORD; I remember thee, the kindness of thy youth, the love of thine espousals, when thou wentest after me in the wilderness, in a land *that was* not sown.","3":"Israel *was* holiness unto the LORD, *and* the firstfruits of his increase: all that devour him shall offend; evil shall come upon them, saith the LORD.","4":"Hear ye the word of the LORD, O house of Jacob, and all the families of the house of Israel:","5":"Thus saith the LORD, What iniquity have your fathers found in me, that they are gone far from me, and have walked after vanity, and are become vain?","6":"Neither said they, Where *is* the LORD that brought us up out of the land of Egypt, that led us through the wilderness, through a land of deserts and of pits, through a land of drought, and of the shadow of death, through a land that no man passed through, and where no man dwelt?","7":"And I brought you into a plentiful country, to eat the fruit thereof and the goodness thereof; but when ye entered, ye defiled my land, and made mine heritage an abomination.","8":"The priests said not, Where *is* the LORD? and they that handle the law knew me not: the pastors also transgressed against me, and the prophets prophesied by Baal, and walked after *things that* do not profit.","9":"Wherefore I will yet plead with you, saith the LORD, and with your children's children will I plead.","10":"For pass over the isles of Chittim, and see; and send unto Kedar, and consider diligently, and see","11":"Hath a nation changed *their* gods, which *are* yet no gods? but my people have changed their glory for *that which* doth not profit.","12":"Be astonished, O ye heavens, at this, and be horribly afraid, be ye very desolate, saith the LORD.","13":"For my people have committed two evils; they have forsaken me the fountain of living waters, *and* hewed them out cisterns, broken cisterns, that can hold no water.","14":"*Is* Israel a servant? *is* he a homeborn *slave*? why is he spoiled?","15":"The young lions roared upon him, *and* yelled, and they made his land waste: his cities are burned without inhabitant.","16":"Also the children of Noph and Tahapanes have broken the crown of thy head.","17":"Hast thou not procured this unto thyself, in that thou hast forsaken the LORD thy God, when he led thee by the way?","18":"And now what hast thou to do in the way of Egypt, to drink the waters of Sihor? or what hast thou to do in the way of Assyria, to drink the waters of the river?","19":"Thine own wickedness shall correct thee, and thy backslidings shall reprove thee: know therefore and see that *it is* an evil *thing* and bitter, that thou hast forsaken the LORD thy God, and that my fear *is* not in thee, saith the Lord GOD of hosts.","20":"For of old time I have broken thy yoke, *and* burst thy bands; and thou saidst, I will not transgress; when upon every high hill and under every green tree thou wanderest, playing the harlot.","21":"Yet I had planted thee a noble vine, wholly a right seed: how then art thou turned into the degenerate plant of a strange vine","22":"For though thou wash thee with nitre, and take thee much soap, *yet* thine iniquity is marked before me, saith the Lord GOD.","23":"How canst thou say, I am not polluted, I have not gone after Baalim? see thy way in the valley, know what thou hast done: *thou art* a swift dromedary traversing her ways;","24":"A wild ass used to the wilderness, *that* snuffeth up the wind at her pleasure; in her occasion who can turn her away? all they that seek her will not weary themselves; in her month they shall find","25":"Withhold thy foot from being unshod, and thy throat from thirst: but thou saidst, There is no hope: no; for I have loved strangers, and after them will I go.","26":"As the thief is ashamed when he is found, so is the house of Israel ashamed; they, their kings, their princes, and their priests, and their prophets,","27":"Saying to a stock, Thou *art* my father; and to a stone, Thou hast brought me forth: for they have turned *their* back unto me, and not *their* face: but in the time of their trouble they will say, Arise, and save","28":"But where *are* thy gods that thou hast made thee? let them arise, if they can save thee in the time of thy trouble: for *according to* the number of thy cities are thy gods, O Judah.","29":"Wherefore will ye plead with me? ye all have transgressed against me, saith the LORD.","30":"In vain have I smitten your children; they received no correction: your own sword hath devoured your prophets, like a destroying lion.","31":"O generation, see ye the word of the LORD. Have I been a wilderness unto Israel? a land of darkness? wherefore say my people, We are lords; we will come","32":"Can a maid forget her ornaments, *or* a bride her attire? yet my people have forgotten me days without number.","33":"Why trimmest thou thy way to seek love? therefore hast thou also taught the wicked ones thy ways.","34":"Also in thy skirts is found the blood of the souls of the poor innocents: I have not found it by secret search,","35":"Yet thou sayest, Because I am innocent, surely his anger shall turn from me. Behold, I will plead with thee, because thou sayest, I have not sinned.","36":"Why gaddest thou about so much to change thy way? thou also shalt be ashamed of Egypt, as thou wast ashamed of Assyria.","37":"Yea, thou shalt go forth from him, and thine hands upon thine head: for the LORD hath rejected thy confidences, and thou shalt not prosper"}},"tsk":{"1":[{"kopje":"het woord","refs":["Jer 1:11","Jer 7:1","Jer 23:28","Ezech 7:1","Hebr 1:1","2 Petr 1:21"]}],"2":[{"kopje":"roep","refs":["Jer 7:2","Jer 11:6","Jer 19:2","Spr 1:20","Spr 8:1-4","Jes 58:1","Hos 8:1","Jona 1:2","Matt 11:15","Luk 12:13"]},{"kopje":"de weldadigheid","refs":["Ex 14:31","Ex 15:1-20","Ezech 16:8","Ezech 16:22","Ezech 16:60","Ezech 23:3","Ezech 23:8","Ezech 23:19","Hos 2:14"]},{"kopje":"uw ondertrouw","refs":["Ex 24:3-8","Hoogl 3:11","Ex 16:8"]},{"kopje":"toen","refs":["Jer 2:6","Deut 2:7","Deut 8:2","Deut 8:15","Deut 8:16","Neh 9:12-21","Jes 63:7-14"]}],"3":[{"kopje":"heiligheid","refs":["Ex 19:5","Ex 19:6","Deut 7:6","Deut 14:2","Deut 26:19","Zach 14:20","Zach 14:21","Ef 1:4","1 Petr nd;</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon them, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","4":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> ye the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> O <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel:","5":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> What <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity</span> have your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in me, that they are gone <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me, and have <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity,</span> and are become vain?","6":"Neither <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> they, Where is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that brought us <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> that <span class=\"wl wl-kjv\" data-code=\"H3212\">led</span> us through the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> through a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H6160\">deserts</span> and of <span class=\"wl wl-kjv\" data-code=\"H7745\">pits,</span> through a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H6723\">drought,</span> and of the shadow of <span class=\"wl wl-kjv\" data-code=\"H6757\">death,</span> through a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">through,</span> and where no <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> dwelt?","7":"And I <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> you into a <span class=\"wl wl-kjv\" data-code=\"H3759\">plentiful</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> thereof and the <span class=\"wl wl-kjv\" data-code=\"H2898\">goodness</span> thereof; but when ye <span class=\"wl wl-kjv\" data-code=\"H935\">entered,</span> ye <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> my <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> mine <span class=\"wl wl-kjv\" data-code=\"H5159\">heritage</span> an abomination.","8":"The <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> not, Where is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span> and they that <span class=\"wl wl-kjv\" data-code=\"H8610\">handle</span> the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> me not: the <span class=\"wl wl-kjv\" data-code=\"H7462\">pastors</span> also <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressed</span> against me, and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> by <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> things that do not profit.","9":"Wherefore I will yet <span class=\"wl wl-kjv\" data-code=\"H7378\">plead</span> with you, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and with your <span class=\"wl wl-kjv\" data-code=\"H1121\">children's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> will I plead.","10":"For pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H339\">isles</span> of <span class=\"wl wl-kjv\" data-code=\"H3794\">Chittim,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see;</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> unto <span class=\"wl wl-kjv\" data-code=\"H6938\">Kedar,</span> and <span class=\"wl wl-kjv\" data-code=\"H995\">consider</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">diligently,</span> and see","11":"Hath a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> <span class=\"wl wl-kjv\" data-code=\"H3235\">changed</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> which are yet no <span class=\"wl wl-kjv\" data-code=\"H430\">gods?</span> but my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> have <span class=\"wl wl-kjv\" data-code=\"H4171\">changed</span> their <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> for that which doth not profit.","12":"Be <span class=\"wl wl-kjv\" data-code=\"H8074\">astonished,</span> O ye <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> at this, and be horribly <span class=\"wl wl-kjv\" data-code=\"H8175\">afraid,</span> be ye <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2717\">desolate,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","13":"For my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> have <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evils;</span> they have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> me the <span class=\"wl wl-kjv\" data-code=\"H4726\">fountain</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> and hewed them <span class=\"wl wl-kjv\" data-code=\"H2672\">out</span> <span class=\"wl wl-kjv\" data-code=\"H877\">cisterns,</span> <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> <span class=\"wl wl-kjv\" data-code=\"H877\">cisterns,</span> that can <span class=\"wl wl-kjv\" data-code=\"H3557\">hold</span> no water.","14":"Is <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> a <span class=\"wl wl-kjv\" data-code=\"H5650\">servant?</span> is he a <span class=\"wl wl-kjv\" data-code=\"H1004\">homeborn</span> slave? <span class=\"wl wl-kjv\" data-code=\"H4069\">why</span> is he spoiled?","15":"The young <span class=\"wl wl-kjv\" data-code=\"H3715\">lions</span> <span class=\"wl wl-kjv\" data-code=\"H7580\">roared</span> upon him, and <span class=\"wl wl-kjv\" data-code=\"H5414\">yelled,</span> and they <span class=\"wl wl-kjv\" data-code=\"H7896\">made</span> his <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H8047\">waste:</span> his <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> are <span class=\"wl wl-kjv\" data-code=\"H3341\">burned</span> without inhabitant.","16":"Also the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5297\">Noph</span> and <span class=\"wl wl-kjv\" data-code=\"H8471\">Tahapanes</span> have <span class=\"wl wl-kjv\" data-code=\"H7462\">broken</span> the crown of thy head.","17":"Hast thou not <span class=\"wl wl-kjv\" data-code=\"H6213\">procured</span> this unto thyself, in that thou hast <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">when</span> he <span class=\"wl wl-kjv\" data-code=\"H3212\">led</span> thee by the way?","18":"And now what hast thou to do in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of <span class=\"wl wl-kjv\" data-code=\"H7883\">Sihor?</span> or what hast thou to do in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of the river?","19":"Thine own <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> shall <span class=\"wl wl-kjv\" data-code=\"H3256\">correct</span> thee, and thy <span class=\"wl wl-kjv\" data-code=\"H4878\">backslidings</span> shall <span class=\"wl wl-kjv\" data-code=\"H3198\">reprove</span> thee: <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> therefore and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> that it is an <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> thing and <span class=\"wl wl-kjv\" data-code=\"H4751\">bitter,</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and that my <span class=\"wl wl-kjv\" data-code=\"H6345\">fear</span> is not in thee, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of hosts.","20":"For of old <span class=\"wl wl-kjv\" data-code=\"H5769\">time</span> I have <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> thy <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke,</span> and <span class=\"wl wl-kjv\" data-code=\"H5423\">burst</span> thy <span class=\"wl wl-kjv\" data-code=\"H4147\">bands;</span> and thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H5674\">transgress;</span> when upon every <span class=\"wl wl-kjv\" data-code=\"H1364\">high</span> <span class=\"wl wl-kjv\" data-code=\"H1389\">hill</span> and under every <span class=\"wl wl-kjv\" data-code=\"H7488\">green</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">tree</span> thou <span class=\"wl wl-kjv\" data-code=\"H6808\">wanderest,</span> playing the harlot.","21":"Yet I had <span class=\"wl wl-kjv\" data-code=\"H5193\">planted</span> thee a noble <span class=\"wl wl-kjv\" data-code=\"H8321\">vine,</span> wholly a <span class=\"wl wl-kjv\" data-code=\"H571\">right</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed:</span> how then art thou <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> into the degenerate <span class=\"wl wl-kjv\" data-code=\"H5494\">plant</span> of a <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> vine","22":"For though thou <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> thee with <span class=\"wl wl-kjv\" data-code=\"H5427\">nitre,</span> and take thee <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H1287\">soap,</span> yet thine <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> is <span class=\"wl wl-kjv\" data-code=\"H3799\">marked</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","23":"How canst thou <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I am not <span class=\"wl wl-kjv\" data-code=\"H2930\">polluted,</span> I have not <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H1168\">Baalim?</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> in the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> what thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done:</span> thou art a <span class=\"wl wl-kjv\" data-code=\"H7031\">swift</span> <span class=\"wl wl-kjv\" data-code=\"H1072\">dromedary</span> <span class=\"wl wl-kjv\" data-code=\"H8308\">traversing</span> her ways;","24":"A wild <span class=\"wl wl-kjv\" data-code=\"H6501\">ass</span> <span class=\"wl wl-kjv\" data-code=\"H3928\">used</span> to the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> that snuffeth <span class=\"wl wl-kjv\" data-code=\"H7602\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> at her <span class=\"wl wl-kjv\" data-code=\"H185\">pleasure;</span> in her <span class=\"wl wl-kjv\" data-code=\"H8385\">occasion</span> who can turn her <span class=\"wl wl-kjv\" data-code=\"H7725\">away?</span> all they that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> her will not <span class=\"wl wl-kjv\" data-code=\"H3286\">weary</span> themselves; in her <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> they shall find","25":"<span class=\"wl wl-kjv\" data-code=\"H4513\">Withhold</span> thy <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> from being <span class=\"wl wl-kjv\" data-code=\"H3182\">unshod,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1627\">throat</span> from <span class=\"wl wl-kjv\" data-code=\"H6773\">thirst:</span> but thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst,</span> There is no <span class=\"wl wl-kjv\" data-code=\"H2976\">hope:</span> no; for I have <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them will I go.","26":"As the <span class=\"wl wl-kjv\" data-code=\"H1590\">thief</span> is <span class=\"wl wl-kjv\" data-code=\"H1322\">ashamed</span> when he is <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> so is the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3001\">ashamed;</span> they, their <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> their <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and their <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and their prophets,","27":"<span class=\"wl wl-kjv\" data-code=\"H559\">Saying</span> to a <span class=\"wl wl-kjv\" data-code=\"H6086\">stock,</span> Thou art my <span class=\"wl wl-kjv\" data-code=\"H1\">father;</span> and to a <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> Thou hast brought me <span class=\"wl wl-kjv\" data-code=\"H3205\">forth:</span> for they have <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> their <span class=\"wl wl-kjv\" data-code=\"H6203\">back</span> unto me, and not their <span class=\"wl wl-kjv\" data-code=\"H6440\">face:</span> but in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of their <span class=\"wl wl-kjv\" data-code=\"H7451\">trouble</span> they will <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> and save","28":"But where are thy <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> thee? let them <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> if they can <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> thee in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7451\">trouble:</span> for according to the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> are thy <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> O Judah.","29":"Wherefore will ye <span class=\"wl wl-kjv\" data-code=\"H7378\">plead</span> with me? ye all have <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressed</span> against me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","30":"In <span class=\"wl wl-kjv\" data-code=\"H7723\">vain</span> have I <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> your <span class=\"wl wl-kjv\" data-code=\"H1121\">children;</span> they <span class=\"wl wl-kjv\" data-code=\"H3947\">received</span> no <span class=\"wl wl-kjv\" data-code=\"H4148\">correction:</span> your own <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> hath <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> your <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> like a <span class=\"wl wl-kjv\" data-code=\"H7843\">destroying</span> lion.","31":"O <span class=\"wl wl-kjv\" data-code=\"H1755\">generation,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> ye the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> Have I been a <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> unto <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3991\">darkness?</span> wherefore <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> We are <span class=\"wl wl-kjv\" data-code=\"H7300\">lords;</span> we will come","32":"Can a <span class=\"wl wl-kjv\" data-code=\"H1330\">maid</span> <span class=\"wl wl-kjv\" data-code=\"H7911\">forget</span> her <span class=\"wl wl-kjv\" data-code=\"H5716\">ornaments,</span> or a <span class=\"wl wl-kjv\" data-code=\"H3618\">bride</span> her <span class=\"wl wl-kjv\" data-code=\"H7196\">attire?</span> yet my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> have <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> me <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> without number.","33":"Why <span class=\"wl wl-kjv\" data-code=\"H3190\">trimmest</span> thou thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> <span class=\"wl wl-kjv\" data-code=\"H160\">love?</span> therefore hast thou also <span class=\"wl wl-kjv\" data-code=\"H3925\">taught</span> the wicked <span class=\"wl wl-kjv\" data-code=\"H7451\">ones</span> thy ways.","34":"Also in thy <span class=\"wl wl-kjv\" data-code=\"H3671\">skirts</span> is <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> of the <span class=\"wl wl-kjv\" data-code=\"H34\">poor</span> <span class=\"wl wl-kjv\" data-code=\"H5355\">innocents:</span> I have not <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> it by secret search,","35":"Yet thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest,</span> Because I am <span class=\"wl wl-kjv\" data-code=\"H5352\">innocent,</span> surely his <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from me. Behold, I will <span class=\"wl wl-kjv\" data-code=\"H8199\">plead</span> with thee, because thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest,</span> I have not sinned.","36":"Why gaddest thou <span class=\"wl wl-kjv\" data-code=\"H235\">about</span> so <span class=\"wl wl-kjv\" data-code=\"H3966\">much</span> to <span class=\"wl wl-kjv\" data-code=\"H8138\">change</span> thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way?</span> thou also shalt be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> as thou wast <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> of Assyria.","37":"Yea, thou shalt go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> from him, and thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> upon thine <span class=\"wl wl-kjv\" data-code=\"H7218\">head:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H3988\">rejected</span> thy <span class=\"wl wl-kjv\" data-code=\"H4009\">confidences,</span> and thou shalt not prosper"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Jeruzalem","tekst":"Dat is, van de inwoners van Jeruzalem, gelijk Jer 1:3 , enz."},{"catchword":"Ik gedenk","tekst":"Hebr. Ik gedenk u, enz.; zie Psa 79:8 ."},{"catchword":"uwer jeugd","tekst":"Dat is, der weldadigheid, of goedertierenheid, die Ik u bewezen heb in uwe jeugd: alzo, der liefde van uwe ondertrouw; dat is, die Ik u bewezen heb als Ik u trouwde, dat is, als Ik u eerst tot mijn volk aannam in Egypte, en daarna mijn verbond met u maakte aan Horeb; verg. Eze 16:8 , Eze 16:22 , en zie, aangaande de manier van spreken, Psa 59:11 , en Psa 106:4 ; Isa 26:11 ; idem onder Jer 51:35 ; Joe 3:19 ; Oba 1:10 ; Jon 2:8 , met de aantekening aldaar, enz."},{"catchword":"onbezaaid","tekst":"Verg. onder vs.6."}],"3":[{"catchword":"heiligheid","tekst":"Van Hem tot Zijn volk geheiligd en van alle andere volken afgezonderd; gelijk de eerstelingen der vruchten Hem geheiligd waren. Zie Exo 19:4-6 ."},{"catchword":"opaten","tekst":"Dat is, zochten op te eten, dat is, te verderven, die Hem leed deden; verg. Neh 6:9 ; Psa 14:4 , en Psa 79:7 ."},{"catchword":"voor schuldig","tekst":"En als zodanigen gestraft; gelijk de volgende woorden verklaren."},{"catchword":"kwaad","tekst":"Te weten, der straf; dat is ellende verderf; gelijk gebleken is aan de Egyptenaars, Amelekieten, de koningen Sihon en Og, Midianieten en Kanaänieten."}],"5":[{"catchword":"ijdelheid","tekst":"Dat is, de afgoden, die niets dan ijdelheid zijn, en afgodendienaars in hunne gedachten verijdelen en in hunne hoop bedriegen; verg. 2Ki 17:15 ; Psa 62:11 , en onder vs.8, 11."}],"6":[{"catchword":"zeiden niet","tekst":"Te weten, bij zichzelven, dat is, dachten niet, alzo vs.8."},{"catchword":"wildernissen","tekst":"Hebr. der wildernis en des kuils, of der groeve; dat is woest en kuilachtig, dat is onslecht, oneffen, ongebaand; sommigen verstaan door den kuil het graf; dat is, zulk een land, waarin, vermits gebrek van alles vs.2, voor de doortrekkenden niet dan de dood en het graf te verwachten was, tenware God het wonderlijk voorzien had."},{"catchword":"schaduw des doods,","tekst":"Zie Psa 23:4 ."}],"7":[{"catchword":"Ik bracht","tekst":"Dit zijn weder Gods woorden."},{"catchword":"vruchtbaar","tekst":"Hebr. Karmel. Zie 2Ki 19:23 ; alzo onder Jer 4:26 , en Jer 48:32 , enz., versta Kanaän."},{"catchword":"erfenis","tekst":"Zie Psa 86:10 ."},{"catchword":"gruwel","tekst":"Bedrijvende daarin allerlei gruwelijke afgoderij, gelijk volgt."}],"8":[{"catchword":"die de wet","tekst":"Als priesters, Levieten, schriftgeleerden, die de wet Gods, of de Heilige Schrift, het volk zouden leren en verklaren; zie Mal 2:6-7 ; Ezr 7:6 ; Neh 8:1 , Neh 8:3 , Neh 8:7-8 , enz."},{"catchword":"kenden","tekst":"Anders: vielen van mij af. Zie 1Ki 8:50 , en 1Ki 12:19 ."},{"catchword":"door Baäl,","tekst":"Dat is, in Baäls naam. Zie Jdg 2:11 ."},{"catchword":"geen nut doen","tekst":"Dat is, de afgoden en menselijke inzettingen, alzo vs.11, die boven vs.5"}],"10":[{"catchword":"Chitteërs,","tekst":"Zie Gen 10:4 , en Num 24:24 ."},{"catchword":"Kedar,","tekst":"Zie Gen 25:13 , onder Jer 49:28 ; Psa 120:5-6 ; Son 1:5 . Men houdt het voor landstreken in woest en steenachtige Arabië; verg Eze 27:21 ."},{"catchword":"wel op;","tekst":"Hebr. zeer."}],"11":[{"catchword":"Eer","tekst":"Dat is, den waren God en godsdienst, in afgoden en afgoderij; zie Psa 106:20 , met de aantekening."}],"12":[{"catchword":"hemelen,","tekst":"Zie Deu 4:26 ."},{"catchword":"zijt verschrikt,","tekst":"Eigenlijk: Laat de haren oprijzen, of zijt bewogen."},{"catchword":"wordt zeer woest,","tekst":"Door intrekking of verlies van het hemelse licht."}],"13":[{"catchword":"Springader","tekst":"Den auteur en oorsprong der ware gelukzaligheid, aller zalige en bestendige hulp, van den heilzamen troost en van het eeuwige leven; vergelijk Joh 4:14 , enz."},{"catchword":"levenden","tekst":"Zie Gen 26:19 , en dergelijk Psa 36:10 ."},{"catchword":"bakken","tekst":"Of, cisternen; vergelijk boven vs.8."}],"14":[{"catchword":"knecht,","tekst":"Dat hij aldus van vijanden gehandeld wordt, alsof hij een knecht en slaaf ware."},{"catchword":"ingeborene","tekst":"Dat is, slaaf, knecht, die ook een zoon des huizes genoemd wordt. Zie Gen 15:3 , en Gen 17:13 ."},{"catchword":"is hij dan","tekst":"God spreekt van de nakende straffen alsof zij bereids zijn volk waren overkomen, vanwege de ongetwijfelde zekerheid van dien. Alzo in het volgende, en elders dikwijls."}],"15":[{"catchword":"leeuwen","tekst":"De vijanden, te weten de Babyloniërs."},{"catchword":"verheven;","tekst":"Hebreeuws, gegeven; dat is, geluid, geschrei gemaakt, gelijk een wild dier doet over den roof."}],"16":[{"catchword":"kinderen van Nof","tekst":"Dat is, de Egyptenaars. Zie van deze beide steden Isa 19:13 , en Isa 30:3-4 ; idem onder, Jer 43:7 ."},{"catchword":"Tachpanhes","tekst":"Zie onder Jer 43:7-8 . Idem, Eze 30:18 , met de aantekening. De woorden zijn in het Hebreeuws wat anders geschreven."},{"catchword":"schedel","tekst":"In plaats dat gij meent van hen geholpen te worden, zullen zij u bederven, inzonderheid in de zuidelijke grenzen gelegen naar Egpypte. Anders: verbroken, verpletterd."}],"17":[{"catchword":"weg leidt?","tekst":"Als Hij u den rechten weg of in zijnen weg leidt door de leringen en vermaningen zijner dienstknechten."}],"18":[{"catchword":"hebt gij","tekst":"Hebreeuws, wat is u, of wat hebt gij; te weten te doen? vergelijk Jdg 11:12 ; 2Sa 16:10 . De zin is: Wat loopt en reist gij dus naar Egypte, of Assyrië, om hulp, alsof Ik u niet helpen kon? vergelijk onder vs.36."},{"catchword":"Sihor","tekst":"Zie Isa 13:3 ; Isa 23:3 ."},{"catchword":"rivier","tekst":"Eufraat."}],"19":[{"catchword":"zal u kastijden,","tekst":"Dat is, gij zult om uwe boosheid gestraft worden. Of, laat uwe boosheid u tuchtigen, enz.; dat is, de vruchten uwer boosheid u onderwijzen en overtuigen dat gij misdaan hebt."},{"catchword":"heirscharen","tekst":"Zie 1Ki 18:15 ."}],"20":[{"catchword":"Als Ik","tekst":"Of, omdat Ik, enz."},{"catchword":"van ouds","tekst":"Of, in voortijden; alzo wordt het Hebreeuwse woord olam [dat anders eeuwigheid, idem, een langen toekomstigen tijd, ook den tijd van des mensen leven betekent] ook dikwijls genomen voor langverleden tijden, zaken vanouds, enz. zie Gen 6:4 ; Deu 32:7 ; Isa 57:11 , en onder Jer 6:16 , en Jer 18:15 , en Jer 28:8 ; Eze 26:20 , enz."},{"catchword":"juk verbroken,","tekst":"Versta, de dienstbaarheid en slavernij in Egypte."},{"catchword":"verscheurd","tekst":"Of, afgetrokken, afgerukt."},{"catchword":"dienen;","tekst":"Te weten de afgoden. Anders: ik zal niet overtreden; vergelijk de beloften, die zij God gedaan hebben Exo 19:8 , en Exo 24:3 ; Jos 24:16 , enz.; maar [wil de Heere zeggen] gij hebt geen woord gehouden; want enz."},{"catchword":"loopt","tekst":"Vergelijk deze betekenis van het Hebreeuwse woord met Isa 51:14 , en Isa 63:1 , en onder Jer 48:12 . Anders: ligt gij, of strekt gij u neder, wentelt gij u."},{"catchword":"hoererende","tekst":"Vergelijk onder vs.23. Dat is, afgoderij bedrijvende. Zie Lev 17:7 , en Deu 12:2-3 , of gij hoert."}],"21":[{"catchword":"getrouw zaad;","tekst":"Hebreeuws, zaad der waarheid, of getrouwheid; dat is een rechten goeden stok, een oprechte plant, die goed zaad, dat is goede vruchten, die het zaad in zich dragen, voortbrengt. Vergelijk Isa 1:21 , en Isa 5:2 . Anders: welks ganse zaad waarheid [zou zijn]; in enen zin."},{"catchword":"verbasterde","tekst":"Hebreeuws eigenlijk, afwijkende, dat is, ontaarde bastaardranken."},{"catchword":"vreemden","tekst":"Of, uitlandsen."}],"22":[{"catchword":"wiest","tekst":"Dat is, al uw huichelachtige uitvluchten, verontschuldigingen, vijgebladeren, waarmede gij uwe boosheid zoekt te bedekken, kunnen u niet helpen."},{"catchword":"salpeter,","tekst":"Hebreeuws, nether; dat is, niter, salpeter, bergzout."},{"catchword":"getekend,","tekst":"Of, gemerkt, dat zij voor mij niet verduisterd kan worden, gelijk het fijne goud zijn merk heeft. Het Hebreeuwse woord wordt alleenlijk hier alzo gevonden, komende van een ander, dat fijn goud betekent en bij de Hebreën ook genomen wordt voor een merk, teken, of vlek, waarbij men iets kan kennen; sommigen zetten het over, glinstert, of blinkt, als goud, idem, gevlekt."}],"23":[{"catchword":"weg","tekst":"Dat is, uw afgodisch wezen en doen."},{"catchword":"dal,","tekst":"Dit kan men in het algemeen verstaan van de dalen, Isa 57:5-6 , of in het bijzonder van het dal Hinnoms, dicht bij Jeruzalem gelegen, waar zij hun gruwelijke afgoderij met den Moloch bedreven. Zie 2Ki 23:10 , en onder Jer 19:2 , enz."},{"catchword":"snelle kemelin,","tekst":"Men meent dat het Hebreeuwse woord bichra betekent een zekere soort van kleine of jonge kemelinnen, die zeer snel waren in het lopen als de postpaarden, en alzo anderen voorliepen, gelijk de eerstgeborenen [waarvan bechor gebruikt wordt] den anderen kinderen voorkwamen. Vergelijk Isa 60:6 . Daarom werd zulk ene kemelin met een Grieks woord dromas, dat is loopster genoemd; het woord dromedaris wordt in onze taal ook gebruikt. Hierbij vergelijkt God Israël, vanwege hun hittige loopsheid in alle afgoderij."},{"catchword":"verdraait","tekst":"Het Hebreeuwse woord wordt alleenlijk hier gevonden, komende van een ander, dat een schoenriem betekent. God wil zeggen dat Israël heen en weder, om en wederom liep in afgoderij, gelijk een schoenriem heen en weder gesnoerd, geslingerd ingewikkeld of verdraaid wordt."}],"24":[{"catchword":"gewend","tekst":"Hebreeuws, geleerd; dat is gewend, geoefend, ervaren, gelijk onder Jer 13:21 , Jer 13:23 , en Jer 31:18 ; Hos 10:11 . De zin is, dat zij zo weinig in hare hittigheid te dwingen of te temmen is als een wilde woudezel. Zie Job 39:8 ."},{"catchword":"schept","tekst":"Of, slokt den wind in. Vergelijk onder Jer 14:6 . Dat is, verkwikt en verlustig zij zich bij alle gelegenheid, [die zij zelve zoekt en najaagt] in haar geestelijke hoererij, zijnde zo beschaamd hittig dat niemand haar weren of afslaan kan. Anders: schept zij den wind naar hare gelegenheid, wie zou haar afkeren?"},{"catchword":"Allen,","tekst":"De afgodendienaars, die met haar willen boeleren, behoeven geen grote moeite te doen, zij is licht te vinden. Vergelijk Eze 16:33-34 , en Eze 23:40 ."},{"catchword":"maand","tekst":"De nieuwe maan, of maanstonden, want zij heeft alle eerbaarheid uitgetrokken. Zie Lev 20:18 . Sommigen verstaan dit van de afgoderij, die zij op alle nieuwe maanden bedreven."}],"25":[{"catchword":"Bedwing","tekst":"Dit zijn Gods woorden, die Israël van haar onbeschaamde hittigheid afroept."},{"catchword":"Het is buiten hoop;","tekst":"Het is vergeefs, het is verloren arbeid, ik wil dat niet doen."},{"catchword":"vreemden lief,","tekst":"Te weten afgoden."}],"26":[{"catchword":"Gelijk een dief","tekst":"Hebreeuws, naar de schaamte van een diEf. Vergelijk onder 48:27."},{"catchword":"gevonden wordt,","tekst":"Dat is, op de daad betrapt en gegrepen wordt."},{"catchword":"zijn die van het huis","tekst":"Of, zullen beschaamd worden. Anders: hebben zij het huis Israëls beschaamd; dat is, zullen zij beschamen, enz., men zal hen beschamen; dat is, zij zullen zekerlijk beschaamd worden."}],"27":[{"catchword":"gegenereerd;","tekst":"Of, gebaard."},{"catchword":"nek toe,","tekst":"Zij zijn afkerig van mij en onwillig, wederstrevig geweest. Zie onder Jer 7:24 , en Jer 32:33 en vergelijk Exo 32:9 ."},{"catchword":"kwaads","tekst":"Der straf, als de gedreigde ellenden hun overkomen. Alzo in vs.28."}],"28":[{"catchword":"Laat ze opstaan,","tekst":"Vergelijk Deu 32:38 ; Jdg 10:14 ."},{"catchword":"naar","tekst":"Dat is, gij hebt zo menige bijzondere afgoden als gij steden hebt. Laat dan eens zien of zij al tezamen u kunnen helpen."}],"29":[{"catchword":"tegen Mij overtreden,","tekst":"Zie boven vs.8."}],"30":[{"catchword":"geslagen;","tekst":"Zie Isa 1:5 ."},{"catchword":"tucht","tekst":"Zie Pro 1:2 ."},{"catchword":"zwaard","tekst":"Zover is het vandaar, dat gij mijne bestraffingen zoudt hebben aangenomen, dat gij daarentegen de profeten, die u van afgoderij afmaanden, als woedende wilde beesten vernield hebt, gelijk geschied is ten tijde van Asa, Joas en Manasse. Zie ook Mat 23:29 , enz.; Luk 11:47 , enz., en Luk 13:34 ."},{"catchword":"verdervende leeuw","tekst":"Of, vernielende. Zie van het Hebreeuwse woord Jdg 20:21 ."}],"31":[{"catchword":"aanmerkt toch","tekst":"Hebreeuws, ziet."},{"catchword":"Ben Ik","tekst":"Heb ik Israël zo kwalijk geleid en behandeld, of zijn zij zo kwalijk bij mij gevaren, gelijk mensen, die in ene wildernis en duistere ongebaande wegen van honger, kommer, verdriet en verbijstering versmachten en verkwijnen? Immers [wil de Heere zeggen] is het tegendeel waarachtig. Zulk vragen loochent sterkelijk."},{"catchword":"uiterste","tekst":"Hebreeuws, donkerheid, of duisternissen des HEEREN. Het woord JAH [naar het meeste gevoelen] tot vergroting of verzwaring der zaak daar bijgevoegd zijnde. Vergelijk Gen 13:10 . Anders: een land dat de [inwoners] nederwerpt, of doet vallen; dat is door gebrek versmachten, omkomen, den zin opeen uitkomende."},{"catchword":"Wij zijn heren,","tekst":"Of, wij heersen; dat is, onze zaken staan wel, wij hebben ons rijk door vreemde hulp en verbonden vastgemaakt, wij hebben U niet meer van doen, behoeven U niet meer te zoeken."}],"32":[{"catchword":"bindselen?","tekst":"Waarmede zij haar sieraad aanbindt. Sommigen houden het voor sieraad van het hoofd, òf den hals, òf de keel."},{"catchword":"Mij vergeten,","tekst":"Die Ik hare eer en enig sieraad ben. Zie 2Sa 1:19 , en boven vs.11."},{"catchword":"dagen zonder getal","tekst":"Een zeer langen tijd."}],"33":[{"catchword":"boelering","tekst":"Hebreeuws eigenlijk, liefde, min. De zin schijnt te wezen: Wat wilt gij uw afgodisch wezen en doen nog verbloemen, daar gij toch anders niet doet dan gelegenheid overal te zoeken om gemeenschap met andere afgodendienaars te mogen krijgen, en met hen afgoderij te bedrijven? Sommigen verstaan dit van hun gestadig lopen en reizen om gunst bij heidense afgodische volken te verkrijgen en verbond met hen te maken, waarvan vs.36. Beide deden zij, en het ene hing aan het andere."},{"catchword":"Waarom","tekst":"Of, waardoor, zodat gij ook, ja gij hebt ook, enz.; dat is, gij zijt een zo snode hoer, dat gij de allerergste uitlandse of heidense tebovengaat, omda gij die nog met uw doen erger maakt dan zij vanzelf zijn."}],"34":[{"catchword":"zielen","tekst":"Dat is, personen; vergelijk Pro 28:17 , met de aantekening."},{"catchword":"zomen","tekst":"Te weten uwer klederen."},{"catchword":"dat niet","tekst":"Te weten bloed. Het Hebreeuwse woord, dat bloed betekent, staat wel in het voorgaande in het enkelvoud, maar is gevoegd bij een woord, dat in het getal van velen staat, alsof men zeide: Het bloed zijn gevonden; dat is de bloeden, gelijk de Schriftuur dikwijls het woord bloeden alzo gebruikt; of men kan het verstaan van veel onschuldig bloed, waarmede zij besmet waren. Zie vs.30. Dit was zo openbaar, dat men lled vanity , and below verse13 self-hewen cisterns, that hold no water ]"}],"9":[{"catchword":null,"tekst":"Therefore l will yet contend with you,saith the LORD: ye with your childrens children will l contend ."}],"10":[{"catchword":null,"tekst":"For passe over into the Isles of the Chittites ,[See Genes25 on verse4, Numb 24 on verse24]and behold, and send (unto) Kedar,[ See Genes 25 on v 13. and below chap 49 .27, Psal 120 ,5,6, Cant 1.5 it is held to be a country in the desert and stony Arabia .Compare Ezech 27.21] and consider it well[Hebr. Greatly] and see if the like has been done."}],"11":[{"catchword":null,"tekst":"Hath also a nation changed (their) Gods, though there are no Gods? Yet my people have changed their glory,(unto that which) doth not profit.[That is ,the true God, and the true Religion, into Idols ,and Idolatry. See Psl 106.20 with the annot.]"}],"12":[{"catchword":null,"tekst":"Be astonished here at, ye hevens,[See Deut 4 on verse 26]be sffrighted,[ Properly let your hairs rise up: or be moved] be very desolate [By withdrawing, or loffe of the heavenly light] saith the LORD ."}],"13":[{"catchword":null,"tekst":"For my people have committed two evils; they have forsaken me, the fountain of living water.[ The authour and original of true happiness, of all blessed and permanent help , of saving comforts , and of eternal life, compare Joh 4.14 & c ( of living water) see Genes 26 on verse 19 and compare Psal 36 on verse10]to hew themselves out cisterns [ Or troughs .Compare above on verse 8] broken cisterns that hold no water."}],"14":[{"catchword":null,"tekst":"Is Israel then a servant?[That is so ill delt withal by enemies, as if so be he a servant and a slave] or is he an inborn of the houses ?[That is , a slave servant, who is also called the son of the house , see Genes 15 on verse 3 . and 17 .13] why is he (then) become a prey?[god speaketh of the approaching judgements ,as if they had already lighted upon his people, because of the undoubted certainty thereof. So in the sequel, and elsewhere often]"}],"15":[{"catchword":null,"tekst":"The young lions[That is , the enemies;To wit; the Babylonians]have roared upon him ,[ see isai 5.29 below chap 4.7]they have lift up [Hebr .given] their voice [That is made a found, cry, as a wild beast doth upon his prey] and they have made his land a desolation , his cities are burnt, [so] that no man dwelleth in them."}],"16":[{"catchword":null,"tekst":"Also the children ofNoph and Tachphans [That is , the Egyptians. See both these Cities,Isa 19.13 and 30.3,4 also below chap 43.7,8 also Ezek 30.18, with the annot. These words are somewhat otherwise written in the Hebrew] have eaten up [Oth. Broken, bruised in pieces]the crown of thy head [ whereas thou thinkest to be holpen by them , they shall spoil thee, especially in the South-boarders lying towards Egypt]"}],"17":[{"catchword":null,"tekst":"Doth thou not do this thyself?( in that) thou forsakest the LORD thy God, in the time when he leadeth thee in the way .[ When he leadeth thee the light way , or, in his way bthe Doctrine and exhortations of his servants]"}],"18":[{"catchword":null,"tekst":"And now,what hast thou tho do [Hebr. What is it to thee, or, what hast thou ;to wit, to do ? Compare Judges 11 on verse 12 . 2 Sam 16 on verse 10] with the way of Egypt,to drink waters of Sihor? [ see Jos 13 on verse 3 ,Isai 23.3] and what hast thou to do with the way of Assur, to drink the waters of the river ? [ Euphrates. The meaning is, To what purpose doest thou thus run and travel into Egypt, or into Aslytria for help, as if l were not able to help thee? Compare below verse36.]"}],"19":[{"catchword":null,"tekst":"Thine (own) wickedness shall chasten thee, [That is,thou shalt be punished of thy wickedness: or let thy wickedness correct thee , that is ,let the friut of thy wickedness instruct and convince thee, that thou hast offended] and thy backsliding shall reprove thee:know then and see , that it is evil and bitter, that igged out of the grou] and shouldst take the much sope, (yet) thine iniquity is signed [or marked] before me , saith the LORD.[so that it cannot be hid or obscured from me ,as fine gold hath its mark.Thae Hebrew is only found so here , being derived from another,which signifieth fine gold and is likewise taken by Hebrews fo a mark.token or spot, whereby a thing may be known and discerned.Some render it,glistereth,or shineth,like gold also spotted .(Though thou shouldest wash thee ,etc) that is all thy hypocritical pretences, execuses,fig-leaves,wherewith thou seekest to cover thy wickedness, cannot help thee]"}],"23":[{"catchword":null,"tekst":"How sayest thou, lam not polluted, l have not walked after the Baals ? See thy way[ that is,thne Idolatrous nature and practice] in the valley ,[ this may be understood of valleys in general, Isa. 57.5,6 or in particular, of the valley of Hinnom that lay near Jerusalem, where they committed their abominable Idolatry with Molech. See 2 Kings 23.10 and bnelow chap 19.2 &c] know what thou hast done, thou light swift she-carmel,[Its conceived, that the Hebrew word Bichra signifieth a certain kind of small, or young she-carmels, that were very swift in running , as post horses are , and so run before others ,as the first born(from whence the word Bechoris used ) came before the other children ,compare Isa 60.6 Therefore such a she-carmel was called by a Greek word Dromas, that is ,she-runner;the word Dromedary is also used in our own language.Hereunto God compareth Israel , by reason of their fiery disposition to run into all manner of Idolatry ] that traverseth he wayes [ the Hebrew word rendered here traverseth, is only found in this place,being derived from another word, which signifieth a shoe-latchet . God doth intimate hereby,that Israel ran up and down,to and fro in Idolatry, as a shoe-latchetis often variously turned and shaken to and fro.]"}],"24":[{"catchword":null,"tekst":"She is wilderness,[Heb. taught, that is,accusto er darknesse) Hebr .obsurity of the LORD. The Hebrew particle I A H, according to the opinion of most expositours, being added thereunto for the exaggeration ar aggravation of the thing. Compare Genes. 13, on v.10. Oth. A land that casteth down, or causeth to fall the inhabitants thereof, that is ,causeth them to faint and perish for want ; the sense being all one] wherfore then say my people , We are LORD&rsquo;s,[or, we bear rule ] we will come no more unto thee?[thatos,our affairs go well , we have strenghtened our Kingdome by foreign aid and covenants,we have now no more need of thee, we need not seek any more unto thee.]"}],"32":[{"catchword":null,"tekst":"Doth also a Virgin forget her ornaments? (or) a bride her bindings?[ wherewith she tieth her attire fast to her head. Some take it to be the attire of the head, or of the nec,or throat ] yet my people have forgotten me [ who am their glory and onely ornaments, see 2 sam.1. On verse 19 see also below, hap.3.21.] dayes without number. [ A very long time]"}],"33":[{"catchword":null,"tekst":"Why doest thou make thy way good, whereas tho seekest dallying[Hebr, properl;y love.The meaning seemeth to be , why wilt thou yet hidethy Idolatrous condition and practise, whereas indeed thou bdoest nothing else then to seek oassion everywhere to get acquintane and society with other Idolaters,and to ommit Idolatry with them. Some understand this of her onstant running and travelling, to get favour among heathenish Idolatrous Nations, and to make covenant with them.Some: whereof,v 36. They did both .and the one depended upon the other] therefore hast thou also taught the most wicked (harlots) thy wayes.[or, whereby, so that thou also, yea, thou hast also,&. That is, thou art sovile an harlot, as thou that surpassest the very worst out-landish or heathenish harlots that be , beause by thy practise thou makest them worse then they are of themselves.]"}],"34":[{"catchword":null,"tekst":"Yea, the blood of the souls[That persons,compare Prov. 28.17 with the annotat.] of innocent needy ones is found in thy skirts: [to wit of thy garments ] I have not found it by digging up, but upon all these , [to wit, skirts of thy garments,(l have not found it et) it, to wit, the blood . The Hebrew known that signifieth blood is indeed in the former words used in the singular number but is joined with a verb of the plural number, as if one should say. The blood are found, that is , the bloods, as the Scripture often useth the word bloods so,or it may be understood of much innoent blood , where with they were defiled. See v30 .This was so manifest, as that it needed not to be found out by any strict search, neithe needed the blood to be digged up , as if it were hid in the earth , but it was publickly to be seen , sticking yet (as we may say) upon the skirts of their garment . (Some take it thus , thou, because the Hebrew verb may be taken in the first person of the masculine gender , and in the second of the faminine )hast not found them (to wit, the innocent poor) digging thorow,(that thou mightest have killed them as guilty night thieves , Exod. 22.2,3.) but (thou hast killed them) for all those things ; to wit, for all thy fore-mentioned Idolatriies, which they reproved. See on verse30.]"}],"35":[{"catchword":null,"tekst":"Yet thou saist,Surely Iam innocent ,Surely this anger,[To wit, the LORD&rsquo;s anger] is turned away from me:[As if they had said , we are sufficiently sure of it, that the LORD is not wroth with us .Oth.let onely his anger turn away from me; that is , l will sufficienly prove that lam innocent, if so be he will but deal kindly with me,and not be sorigorous and severe as do hypocrites do always excuse themselves, and blame God] behold l will plead with thee .[or, submit myself with thee to judgement, as elsewher. See Ezeh.1720and 20.35.Joel3.2,&] beause thou saiest, l have not sinned ."}],"36":[{"catchword":null,"tekst":"Why travellest thou much[ Hebr. Greatly] abrosd, changing thy // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

}
function bijbeluitlegHtml(n) {

        if (kortCw) {

function paneelInhoud(n, tab) {

  }
  if (tab === 'bijbeluitleg') {

  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {

    }

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';

    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;

    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
