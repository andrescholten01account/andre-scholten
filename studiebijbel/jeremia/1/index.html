ot eeuwige verwoestingen. En Ik zal over dat land brengen al Mijn woorden, die Ik daarover gesproken heb; al wat in dit boek geschreven is, wat Jeremia geprofeteerd heeft over al deze volken. Want van hen zullen zich laten dienen, die ook machtige volken en grote koningen zijn; zo zal Ik hun vergelden naar hun doen, en naar het werk van hun handen.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "2 Kon 20:18": "Daarbij zullen zij van uw zonen, die uit u zullen voortkomen, die u zult verwekken, nemen, zodat zij hovelingen zijn in het paleis van de koning van Babel.", "Ezech 1:7": "En hun voeten waren rechte voeten, en hun voetzolen waren gelijk de voetzool van een kalf, en glinsterden als de kleur van glad koper.", "Gen 3:12": "Toen zei Adam: De vrouw die U bij mij gegeven hebt, die heeft mij van die boom gegeven, en ik heb gegeten.", "Gen 18:12-14": "Zo lachte Sara bij zichzelf en zei: Zal ik nog wellust hebben, nu ik oud geworden ben, en mijn heer ook oud is? En de HEERE zei tegen Abraham: Waarom heeft Sara gelachen en gezegd: Zou ik werkelijk nog een kind baren, nu ik oud geworden ben? Zou iets voor de HEERE te wonderlijk zijn? Op de vastgestelde tijd zal Ik bij u terugkomen, omstreeks deze tijd volgend jaar, en Sara zal een zoon hebben!", "Jer 36:32": "Jeremia dan nam een andere rol, en gaf ze aan de schrijver Baruch, de zoon van Nerija; die schreef daarop, uit de mond van Jeremia, alle woorden van het boek dat Jojakim, de koning van Juda, met vuur verbrand had; en er werden nog veel woorden van dezelfde soort aan toegevoegd.", "Lev 21:6": "Zij zullen hun God heilig zijn, en de Naam van hun God zullen zij niet ontheiligen; want zij offeren de vuuroffers van de HEERE, het voedsel van hun God; daarom zullen zij heilig zijn.", "Deut 4:37": "En omdat Hij uw vaderen liefhad, en hun nageslacht na hen verkoren had, zo heeft Hij u voor Zijn aangezicht door Zijn grote kracht uit Egypte weggevoerd;", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Jer 1:17-19": "U dan, omgord uw lendenen, en maak u op, en spreek tot hen alles wat Ik u gebieden zal; wees niet verslagen voor hun aangezicht, opdat Ik u niet versla voor hun aangezicht. Want zie, Ik stel u vandaag tot een vaste stad, en tot een ijzeren pilaar, en tot koperen muren tegen het hele land; tegen de koningen van Juda, tegen haar vorsten, tegen haar priesters, en tegen het volk van het land. En zij zullen tegen u strijden, maar tegen u niets vermogen; want Ik ben met u, spreekt de HEERE, om u eruit te helpen.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Gal 1:15": "Maar toen het God behaagd heeft, Die mij van mijn moeders schoot af afgezonderd heeft, en geroepen door Zijn genade,", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "Hand 17:26": "En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Gen 3:13": "En de HEERE God zei tegen de vrouw: Wat is dit dat u gedaan hebt? En de vrouw zei: De slang heeft mij bedrogen, en ik heb gegeten.", "Ex 3:11": "Toen zei Mozes tegen God: Wie ben ik, dat ik naar Farao zou gaan; en dat ik de kinderen van Israël uit Egypte zou voeren?", "Jer 38:1-3": "Toen Sefatja, de zoon van Matthan, en Gedalia, de zoon van Pashur, en Juchal, de zoon van Selemja, en Pashur, de zoon van Malchia, de woorden hoorden die Jeremia tot al het volk sprak: Zo zegt de HEERE: Wie in deze stad blijft, zal door het zwaard, door de honger of door de pestilentie sterven; maar wie naar de Chaldeeën uitgaat, die zal leven, want hij zal zijn leven als buit hebben, en zal leven. Zo zegt de HEERE: Deze stad zal zeker gegeven worden in de hand van het leger van de koning van Babel, dat zal haar innemen;", "Jer 51:64": "En zult zeggen: Zo zal Babel zinken, en niet meer opkomen, vanwege het kwaad dat Ik over haar zal brengen, en zij zullen moe worden. Tot hiertoe zijn de woorden van Jeremia.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Fil 2:16": "Doordat u vasthoudt aan het woord van het leven, mij tot een roem tegen de dag van Christus, dat ik niet tevergeefs gelopen heb, en ook niet tevergeefs gearbeid heb.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Amos 9:8": "Zie, de ogen van de Heere HEERE zijn tegen dit zondige koninkrijk, zodat Ik het van de aardbodem verdelg; behalve dat Ik het huis van Jakob niet helemaal zal verdelgen, spreekt de HEERE.", "1 Tim 6:14": "dat u dit gebod houdt, onbevlekt en onberispelijk, tot de verschijning van onze Heere Jezus Christus;", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "1 Kor 2:2": "Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd.", "Jer 19:4": "Omdat zij Mij verlaten, en deze plaats vervreemd hebben, en andere goden daarin gerookt hebben die zij niet gekend hebben, zij, noch hun vaders, noch de koningen van Juda; en hebben deze plaats vervuld met bloed van onschuldigen.", "2 Kron 6:6": "Maar Ik heb Jeruzalem verkoren, dat Mijn Naam daar zou zijn; en Ik heb David verkoren, dat hij over Mijn volk Israël zou zijn.", "Hebr 10:14": "Want met één offer heeft Hij voor eeuwig volmaakt gemaakt hen die geheiligd worden.", "2 Kron 26:10": "Hij bouwde ook torens in de woestijn, en hakte veel putten uit, omdat hij veel vee had, zowel in de laagten als in de effent velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van het bewerken van het land.", "Ps 144:3": "O HEERE, wat is de mens, dat U hem kent, het kind van de mens, dat U op hem let?", "Ps 71:6": "Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U.", "Tit 3:2": "Dat zij niemand belasteren, geen ruziezoekers zijn, maar vriendelijk zijn, en alle zachtmoedigheid bewijzen tegenover alle mensen.", "Jer 32:7-9": "Zie, Hanameel, de zoon van Sallum, uw oom, zal naar u toe komen en zeggen: Koop voor uzelf mijn veld dat bij Anathoth is, want u hebt het recht van lossing, om het te kopen. Zo kwam Hanameel, de zoon van mijn oom, naar het woord van de HEERE, tot mij, in het voorhof van de bewaking, en zei tegen mij: Koop toch mijn veld, dat bij Anathoth is, dat in het land van Benjamin is; want u hebt het erfrecht, en u hebt de lossing, koop het voor uzelf. Toen merkte ik dat het woord van de HEERE was. Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Jer 34:3": "En u zult van zijn hand niet ontkomen, maar zeker gegrepen en in zijn hand gegeven worden; en uw ogen zullen de ogen van de koning van Babel zien, en zijn mond zal tot uw mond spreken, en u zult naar Babel komen.", "Rom 7:18": "Want ik weet dat in mij, dat is, in mijn vlees, geen goed woont; want het willen is wel aanwezig bij mij, maar het goede te doen, dat vind ik niet.", "2 Kon 22:1": "Josia was acht jaar oud, toen hij koning werd, en regeerde eenendertig jaar te Jeruzalem; en de naam van zijn moeder was Jedida, een dochter van Adaja, uit Bozkath.", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "2 Kor 4:5": "Want wij prediken niet onszelf, maar Christus Jezus, de Heere; en onszelf als uw dienaars, om Jezus' wil.", "2 Tim 2:20-26": "Maar in een groot huis zijn niet alleen gouden en zilveren voorwerpen, maar ook houten en aarden voorwerpen; en sommige tot eer, maar sommige tot oneer. Als iemand zichzelf dan van deze dingen reinigt, zal hij een voorwerp zijn tot eer, geheiligd en bruikbaar voor de Heere, toebereid tot alle goed werk. Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "1 Tim 4:12-16": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid. Houd aan met het voorlezen, met het vermanen, met het onderwijzen, totdat ik kom. Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap.", "Jes 19:23-25": "Op die dag zal er een gebaande weg zijn van Egypte naar Assyrië, zodat de Assyriërs in Egypte, en de Egyptenaars in Assyrië zullen komen; en de Egyptenaars zullen met de Assyriërs de Heere dienen. Op die dag zal Israël de derde zijn met de Egyptenaren en met de Assyriërs, een zegen in het midden van het land. Want de HEERE van de heerscharen zal hen zegenen en zeggen: Gezegend zij Mijn volk, de Egyptenaars, en de Assyriërs, het werk van Mijn handen, en Israël, Mijn erfdeel!", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Ps 73:22": "Toen was ik redeloos, en wist niets; ik was een groot dier bij U.", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "Tit 3:8": "Dit is een betrouwbaar woord, en ik wil dat u deze dingen met ernst bevestigt, opdat zij die aan God geloven, er zorg voor dragen goede werken voor te staan; deze dingen zijn goed en nuttig voor de mensen.", "Jer 26:12": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Num 23:12": "Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?", "Jer 13:9-27": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem. Dit boosaardige volk, dat weigert Mijn woorden te horen, dat wandelt naar het goeddunken van zijn hart, en andere goden navolgt om die te dienen en zich voor die neer te buigen; dat zal worden als deze gordel, die nergens meer voor deugt. Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Jer 28:1": "Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:", "Jer 51:59": "Het woord dat de profeet Jeremia opdroeg aan Seraja, de zoon van Nerija, de zoon van Machseja, toen hij met Zedekia, de koning van Juda, naar Babel trok, in het vierde jaar van zijn regering; en Seraja was een vreedzame vorst.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Hand 16:4": "En terwijl zij de steden doorreisden, gaven zij hun de verordeningen door die door de apostelen en de oudsten in Jeruzalem waren vastgesteld, om die te onderhouden.", "1 Tim 6:17-21": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten; dat zij goed doen, rijk worden in goede werken, vrijgevig zijn en bereid om te delen; en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Joh 14:8-11": "Filippus zei tegen Hem: Heere, toon ons de Vader, en het is ons genoeg. Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader? Gelooft u niet dat Ik in de Vader ben, en de Vader in Mij is? De woorden die Ik tegen u spreek, spreek Ik niet uit Mijzelf, maar de Vader, Die in Mij blijft, Die doet de werken.", "Matt 7:6": "Geef het heilige niet aan de honden, en gooi uw parels niet voor de zwijnen; anders vertrappen ze die met hun poten, en verscheuren u nadat ze zich hebben omgekeerd.", "Joh 4:35-38": "Zegt u niet: Het zijn nog vier maanden, en dan komt de oogst? Zie, Ik zeg u: Sla uw ogen op en bekijk de velden; want ze zijn al wit om te oogsten. En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait. Want hierin is dat gezegde waar: De één is het die zaait, en de ander die maait.", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "1 Sam 12:7": "En nu, ga hier staan, zodat ik met u in het gericht ga, voor het aangezicht van de HEERE, over al de rechtvaardige daden van de HEERE, die Hij aan u en aan uw vaderen gedaan heeft.", "Hos 8:6": "Want ook dat komt uit Israël; een vakman heeft het gemaakt, en het is geen God, maar het zal in stukken worden gebroken, het kalf van Samaria.", "Joz 11:20": "Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Mark 16:11": "En toen dezen hoorden dat Hij leefde, en door haar gezien was, geloofden zij het niet.", "Jak 1:18": "Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Hand 1:7": "En Hij zei tegen hen: Het komt u niet toe de tijden of gelegenheden te weten die de Vader in Zijn eigen macht gesteld heeft;", "Hand 9:14": "en hij heeft hier macht van de overpriesters om allen te binden die Uw Naam aanroepen.", "Gen 20:2": "Toen Abraham nu van Sara, zijn vrouw, gezegd had: Zij is mijn zuster, stuurde Abimelech, de koning van Gerar, iemand en nam Sara weg.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Deut 30:11-14": "Want dit gebod, dat ik u heden gebied, dat is voor u niet verborgen, en dat is niet ver weg. Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen?", "2 Kon 21:26": "En men begroef hem in zijn graf, in de tuin van Uzza; en zijn zoon Josia werd koning in zijn plaats.", "Jer 52:4-30": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadrezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zij legerden zich tegen haar, en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. In de vierde maand, op de negende van de maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had;", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Jer 31:28": "En het zal gebeuren, zoals Ik over hen gewaakt heb om uit te rukken, en af te breken, en te verstoren, en te verderven, en kwaad aan te doen; zo zal Ik over hen waken om te bouwen en te planten, spreekt de HEERE.", "Jer 34:20-22": "Ja, Ik zal hen overgeven in de hand van hun vijanden, en in de hand van hen die hun ziel zoeken; en hun dode lichamen zullen voor het gevogelte van de hemel en het gedierte van de aarde tot voedsel zijn. Zelfs Zedekia, de koning van Juda, en zijn vorsten, zal Ik overgeven in de hand van hun vijanden, en in de hand van hen die hun ziel zoeken, namelijk in de hand van het leger van de koning van Babel, dat van u nu is opgetrokken. Zie, Ik zal bevel geven, spreekt de HEERE, en zal hen weer naar deze stad terugbrengen, en zij zullen tegen haar strijden, en zullen ze innemen, en zullen ze met vuur verbranden; en Ik zal de steden van Juda stellen tot een verwoesting, zodat er niemand in woont.", "Gen 43:11": "Toen zei Israël, hun vader, tegen hen: Is het nu zo, doe dan dit; neem van het beste fruit van dit land in uw zakken, en breng die man een geschenk mee: een weinig balsem, en een weinig honing, specerijen en mirre, terpentijnnoten en amandelen.", "Jer 43:8": "Toen kwam het woord van de HEERE tot Jeremia te Tachpanhes, en Hij zei:", "Jes 22:1-14": "De last van het dal van het gezicht. Wat is er nu met u, dat u helemaal naar de daken bent geklommen? U, die vol was van groot rumoer, u woelige stad, u, vrolijk huppelende stad, uw gesneuvelden zijn niet gesneuveld door het zwaard, en ook niet gestorven in de strijd. Al uw leiders zijn samen weggevlucht; zij zijn door de schutters gebonden, allen die in u gevonden zijn, zijn samen gebonden, zij zijn van ver gevlucht.", "Jer 32:2": "(Het leger van de koning van Babel belegerde toen Jeruzalem, en de profeet Jeremia zat opgesloten in het voorhof van de bewaking, dat bij het huis van de koning van Juda is.", "Jer 6:1": "Vlucht met opeenpakking, kinderen van Benjamin, uit het midden van Jeruzalem, en waai de bazuin te Thekoa, en hef een vuurteken op te Beth-cherem; want er kijkt een kwaad uit van het noorden, en een grote breuk.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "Deut 17:2-5": "Wanneer in uw midden, in een van uw poorten die de HEERE, uw God, u geeft, een man of vrouw gevonden wordt die doet wat kwaad is in de ogen van de HEERE, uw God, door Zijn verbond te overtreden, Doordat hij heengaat en andere goden dient, en zich voor die buigt, of voor de zon, of voor de maan, of voor het hele leger van de hemel, wat ik niet geboden heb; En het wordt u aangezegd, en u hoort het; dan moet u het goed onderzoeken; en zie, het is de waarheid, de zaak staat vast, zo'n gruwel is in Israël gedaan;", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Jer 14:13": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats.", "2 Tim 1:6-8": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen. Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid. Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Tit 2:15": "Spreek dit, en vermaan, en bestraf met alle ernst. Laat niemand u minachten.", "Jer 42:22": "Zo weet nu zeker, dat u door het zwaard, door de honger en door de pestilentie zult sterven, op de plaats waar u naartoe wilde gaan om daar als vreemdelingen te wonen.", "Richt 6:13": "Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven.", "2 Kor 7:15": "En zijn innerlijke bewegingen zijn des te overvloediger jegens u, wanneer hij denkt aan de gehoorzaamheid van u allen, hoe u hem met vrees en beven hebt ontvangen.", "Ezech 33:6-8": "Wanneer daarentegen de wachter het zwaard ziet komen, en niet op de bazuin blaast, zodat het volk niet gewaarschuwd wordt; en het zwaard komt en neemt iemand van hen weg, dan is die wel om zijn eigen ongerechtigheid weggenomen, maar zijn bloed zal Ik van de hand van de wachter eisen. U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "2 Kor 12:19": "Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw.", "Hebr 5:12-14": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel. Want ieder die nog melk krijgt, is onervaren in het woord van de gerechtigheid; want hij is een kind. Maar voor de volwassenen is er het vaste voedsel, voor hen die door de gewoonte hun zintuigen geoefend hebben, om onderscheid te maken tussen goed en kwaad.", "1 Tim 1:18": "Dit gebod beveel ik u, mijn zoon Timotheüs, dat u naar de profetieën die eerder over u uitgesproken zijn, daarmee de goede strijd strijdt;", "Jes 48:6": "U hebt het gehoord, aanmerkt dat alles; zult u het ook niet verkondigen? Van nu af doe Ik u nieuwe dingen horen, en verborgen dingen, en die u niet geweten hebt.", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "1 Kor 4:21": "Wat wilt u? Zal ik met de roede naar u toe komen, of in liefde en in de geest van zachtmoedigheid?", "Jer 11:9-23": "Verder zei de HEERE tegen mij: Er is een samenzwering gevonden onder de mannen van Juda, en onder de inwoners van Jeruzalem. Zij zijn teruggekeerd tot de ongerechtigheden van hun voorvaders, die Mijn woorden geweigerd hebben te horen; en zij zijn andere goden nagelopen, om die te dienen; het huis van Israël en het huis van Juda hebben Mijn verbond gebroken, dat Ik met hun vaderen gemaakt heb. Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.", "Matt 3:14": "Maar Johannes weigerde Hem sterk, en zei: Ik heb het nodig door U gedoopt te worden, en komt U tot mij?", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Hab 1:6-11": "Want zie, Ik verwek de Chaldeeën, een bitter en snel volk, dat door de breedten van de aarde trekt, om woningen die niet van hem zijn, in erfelijk bezit te nemen. Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit. Want zijn paarden zijn lichter dan de luipaarden, en zij zijn scherper dan de avondwolven, en zijn ruiters verspreiden zich; ja, zijn ruiters zullen van verre komen, zij zullen vliegen als een arend, die zich haast om te eten.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "1 Tim 5:19-22": "Neem tegen een ouderling geen beschuldiging aan, dan alleen op grond van twee of drie getuigen. Bestraf hen die zondigen in aanwezigheid van allen, opdat ook de anderen ontzag mogen hebben. Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "Micha 5:11-13": "En Ik zal de toverijen uit uw hand uitroeien, en u zult geen guichelaars meer hebben. En Ik zal uw gesneden beelden en uw opgerichte beelden uit uw midden uitroeien, zodat u zich niet meer zult neerbuigen voor het werk van uw handen. Verder zal Ik uw bossen uit uw midden uitroeien, en Ik zal uw steden verdelgen.", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "Jer 43:10": "en zeg tegen hen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zie, Ik zal iemand heenzenden, en Nebukadrezar, de koning van Babel, Mijn dienaar, halen, en Ik zal zijn troon zetten boven op deze stenen, die Ik verborgen heb; en hij zal zijn koninklijke tent daarover spannen.", "Num 17:8": "Het gebeurde nu de volgende dag, dat Mozes de tent van de getuigenis inging; en zie, Aärons staf, voor het huis van Levi, bloeide; want hij bracht bloeisel voort, en bloesemde bloesem, en droeg amandelen.", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Jer 11:19": "En ik was als een lam, als een os, die geleid wordt om geslacht te worden; want ik wist niet dat zij plannen tegen mij beraamden, en zeiden: Laten wij de boom met zijn vrucht verderven, en laten wij hem uit het land van de levenden uitroeien, zodat aan zijn naam niet meer gedacht wordt.", "Jer 38:2": "Zo zegt de HEERE: Wie in deze stad blijft, zal door het zwaard, door de honger of door de pestilentie sterven; maar wie naar de Chaldeeën uitgaat, die zal leven, want hij zal zijn leven als buit hebben, en zal leven.", "2 Tim 4:2": "Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs.", "Deut 10:15": "Alleen heeft de HEERE behagen gehad in uw vaderen, om hen lief te hebben, en heeft hun nageslacht na hen, u, uit alle volken uitverkoren, zoals het op deze dag is.", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "2 Tim 4:18": "En de Heere zal mij verlossen van alle slecht werk, en bewaren tot Zijn hemels Koninkrijk; aan Hem zij de heerlijkheid, tot in alle eeuwigheid. Amen.", "Gen 21:12": "Maar God zei tegen Abraham: Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.", "Hand 1:21": "Het is dan nodig dat van de mannen die met ons omgegaan hebben al de tijd waarin de Heere Jezus onder ons in- en uitgegaan is,", "2 Kon 23:26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "2 Kon 21:12-15": "Daarom, zo zegt de HEERE, de God van Israël: Zie, Ik ga een kwaad over Jeruzalem en Juda brengen, zodat ieder die het hoort, beide zijn oren zullen tuiten. En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, alsook het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, zoals men een schotel uitwist; men wist hem uit, en men keert hem om op zijn holle kant. En Ik zal het overblijfsel van Mijn erfdeel verlaten, en zal het in de hand van hun vijanden geven; en zij zullen tot een roof en plundering worden voor al hun vijanden.", "Ex 4:10": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.", "Ps 22:29": "Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen.", "Jes 28:14-22": "Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is! Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen. Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Jes 17:1-3": "De last van Damaskus. Zie, Damaskus zal weggenomen worden, zodat het geen stad meer is, maar het zal een vervallen steenhoop zijn. De steden van Aroer zullen verlaten worden; ze zullen er zijn voor de kudden, die daar zullen neerliggen, en niemand zal ze schrik aanjagen. En de vesting zal ophouden in Efraïm, en het koninkrijk in Damaskus, en het overblijfsel van de Syriërs; zij zullen zijn als de heerlijkheid van de kinderen van Israël, spreekt de HEERE van de heerscharen.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "Nahum 1:15": "Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid.", "Rom 9:7-33": "Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden. Dat is: niet de kinderen van het vlees zijn kinderen van God, maar de kinderen van de belofte worden als nageslacht gerekend. Want dit is het woord van de belofte: Rond deze tijd zal Ik komen, en Sara zal een zoon hebben.", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Jes 48:5": "Daarom heb Ik het u van toen af verkondigd, voordat het kwam, heb Ik het u doen horen; opdat u niet misschien zou zeggen: Mijn afgod heeft die dingen gedaan, of mijn gesneden beeld, of mijn gegoten beeld heeft ze bevolen.", "Matt 21:34": "Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Jer 33:23": "Verder kwam het woord van de HEERE tot Jeremia, en Hij zei:", "2 Kor 7:7": "En niet alleen door zijn komst, maar ook door de vertroosting waarmee hij over u vertroost is geweest, toen hij ons vertelde van uw verlangen, uw kermen, uw ijver voor mij; zodat ik des te meer verblijd ben geweest.", "Dan 2:39": "En na u zal een ander koninkrijk opstaan, lager dan het uwe; daarna een ander, het derde koninkrijk, van koper, dat zal heersen over de hele aarde.", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "2 Kor 3:5": "Niet dat wij uit onszelf bekwaam zijn om iets te bedenken, alsof het uit onszelf komt; maar onze bekwaamheid is uit God;", "2 Kron 36:21": "Opdat het woord van de HEERE vervuld werd, door de mond van Jeremia, totdat het land aan zijn sabbatten een welgevallen had; het rustte al de dagen van de verwoesting, totdat de zeventig jaren vervuld waren.", "Joh 19:10": "Pilatus zei dan tegen Hem: Spreekt U niet tegen mij? Weet U niet dat ik macht heb U te kruisigen, en macht heb U los te laten?", "2 Kon 24:8-16": "Jojachin was achttien jaar oud toen hij koning werd, en regeerde drie maanden in Jeruzalem; en de naam van zijn moeder was Nehusta, een dochter van Elnathan, uit Jeruzalem. En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vader gedaan had. In die tijd trokken de dienaren van Nebukadnezar, de koning van Babel, naar Jeruzalem; en de stad werd belegerd.", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "Matt 28:17": "En toen zij Hem zagen, aanbaden zij Hem; maar sommigen twijfelden.", "Gen 19:30": "En Lot trok weg uit Zoar, en woonde op de berg, en zijn twee dochters met hem; want hij was bang om in Zoar te wonen. En hij woonde in een grot, hij en zijn twee dochters.", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Joh 20:23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "Joh 21:23": "Dit woord ging dan uit onder de broeders, dat deze discipel niet zou sterven. En Jezus had tegen hem niet gezegd dat hij niet zou sterven, maar: Als Ik wil dat hij blijft totdat Ik kom, wat gaat het u aan?", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Ex 3:12": "Hij dan zei: Ik zal zeker met u zijn, en dit zal u een teken zijn dat Ik u gezonden heb: wanneer u dit volk uit Egypte geleid hebt, zult u God dienen op deze berg.", "Tit 3:1": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn;", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Jer 7:8-34": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "2 Kron 1:10": "Geef mij nu wijsheid en kennis, zodat ik voor het aangezicht van dit volk uitga en inga; want wie zou dit Uw grote volk kunnen richten?", "Jes 4:1": "En op die dag zullen zeven vrouwen één man vastgrijpen en zeggen: Ons eigen brood zullen wij eten, en met onze eigen kleren zullen wij bekleed zijn; laat ons alleen naar uw naam genoemd worden, neem onze smaad weg.", "Ezech 12:28": "Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Geen van Mijn woorden zal meer worden uitgesteld; het woord dat Ik gesproken heb, dat zal gebeuren, spreekt de Heere HEERE.", "Luk 12:11": "En wanneer zij u zullen brengen voor de synagogen, en voor de overheden en de machten, wees dan niet bezorgd hoe of wat u ter verantwoording zult zeggen, of wat u zult spreken;", "Jes 2:8": "Ook is hun land vervuld met afgoden; voor het werk van hun handen buigen zij zich neer, voor wat hun vingers gemaakt hebben.", "Matt 22:14": "Want velen zijn geroepen, maar weinigen uitverkoren.", "Jer 50:9": "Want zie, Ik zal een verzameling van grote volken uit het land van het noorden verwekken, en tegen Babel opbrengen; die zullen zich tegen haar opstellen; van daar zal zij ingenomen worden; hun pijlen zullen zijn als die van een kloek held, geen zal met lege handen terugkeren.", "Ezech 12:25": "Want Ik ben de HEERE, Ik zal spreken; het woord dat Ik zal spreken, zal gebeuren, de tijd zal niet meer worden uitgesteld; want in uw dagen, o opstandig huis, zal Ik een woord spreken, en het doen, spreekt de Heere HEERE.", "Deut 28:49-57": "De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan; Een volk, hard van gezicht, dat geen ontzag zal hebben voor de oude, noch genadig zal zijn voor de jonge. En het zal de vrucht van uw vee, en de vrucht van uw land opeten, totdat u verdelgd zult zijn; het zal u geen koren, most of olie, aanwas van uw koeien of kudden van uw kleinvee overlaten, totdat het u vernietigt.", "Ex 4:10-14": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong. En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE? En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Jer 25:2": "Dat de profeet Jeremia gesproken heeft tot het hele volk van Juda, en tot alle inwoners van Jeruzalem, en hij zei:", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Gal 2:9": "en toen Jakobus, en Cefas, en Johannes, die geacht werden pilaren te zijn, de genade die mij gegeven was, erkenden, gaven zij mij en Barnabas de rechterhand van gemeenschap, opdat wij naar de heidenen, en zij naar de besnedenen zouden gaan;", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Hand 3:12": "En Petrus, die dit zag, antwoordde het volk: Israëlieten, wat verbaast u zich hierover, of wat kijkt u zo strak naar ons, alsof wij door onze eigen kracht of vroomheid deze man hebben laten lopen?", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Jes 2:6-22": "Maar U hebt Uw volk, het huis van Jakob, verlaten, want zij zijn vervuld met goddeloosheid, meer dan het oosten, en zij zijn van het guichelaar gelijk de Filistijnen, en aan de kinderen van de vreemden tonen zij hun behagen. En hun land is vervuld met zilver en goud, en aan hun schatten is geen einde; hun land is ook vervuld met paarden, en aan hun wagens is geen einde. Ook is hun land vervuld met afgoden; voor het werk van hun handen buigen zij zich neer, voor wat hun vingers gemaakt hebben.", "Jer 7:9": "Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent,", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Pred 12:5": "Ook wanneer zij bang zullen zijn voor de hoogte, en er verschrikkingen zullen zijn op de weg, en de amandelboom zal bloeien, en de sprinkhaan zichzelf een last zal zijn, en het verlangen zal vergaan; want de mens gaat naar zijn eeuwig huis, en de rouwklagers zullen in de straat rondgaan.", "Jer 10:25": "Stort Uw grimmigheid uit over de heidenen, die U niet kennen, en over de geslachten, die Uw Naam niet aanroepen; want zij hebben Jakob opgegeten, ja, zij hebben hem opgegeten, en hem verteerd, en zijn woning verwoest.", "Tit 2:1": "Maar u, spreek wat past bij de gezonde leer.", "Jes 14:24-28": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan! Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijkt, en zijn last van hun schouder wijkt. Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.", "1 Tim 5:17": "De oudsten die goed leiding geven, moeten dubbele eer waardig geacht worden, vooral wie arbeiden in het Woord en de leer.", "Jer 2:17": "Doet u dit niet zelf, doordat u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Hebr 2:11": "Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen,", "Mal 2:6": "De wet van de waarheid was in zijn mond, en er werd geen onrecht in zijn lippen gevonden; hij wandelde met Mij in vrede en in rechtvaardigheid, en hij bekeerde er velen van ongerechtigheid.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Hand 24:25": "En toen hij sprak over rechtvaardigheid, en zelfbeheersing, en over het komende oordeel, werd Felix zeer bevreesd, en antwoordde: Voor nu kunt u gaan; en wanneer ik een geschikte tijd zal hebben, zal ik u weer bij mij roepen.", "Jak 3:16": "Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Jes 44:26-28": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten. Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen. Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Joh 4:36-38": "En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait. Want hierin is dat gezegde waar: De één is het die zaait, en de ander die maait. Ik heb u uitgezonden om te maaien wat u niet bewerkt hebt; anderen hebben het bewerkt, en u bent tot hun arbeid toegetreden.", "Matt 24:41": "Er zullen twee vrouwen malen bij de molen: de één zal aangenomen worden, en de ander zal achtergelaten worden.", "2 Petr 1:12-16": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt. En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken; Want ik weet dat het afleggen van mijn tent spoedig zal zijn, zoals ook onze Heere Jezus Christus mij heeft geopenbaard.", "Matt 4:18-22": "En Jezus liep langs de zee van Galilea en zag twee broers, namelijk Simon, genaamd Petrus, en Andreas, zijn broer, die een net in de zee wierpen (want zij waren vissers); en Hij zei tegen hen: Volg Mij, en Ik zal u vissers van mensen maken. Zij lieten meteen de netten achter en volgden Hem na.", "Ezech 33:21-29": "En het gebeurde in het twaalfde jaar van onze wegvoering, in de tiende maand, op de vijfde dag van de maand, dat er iemand tot mij kwam die uit Jeruzalem ontkomen was, en hij zei: De stad is ingenomen. Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom. Toen kwam het woord van de HEERE tot mij:", "Ps 78:58-64": "En zij verwekten Hem tot toorn door hun hoogten, en verwekten Hem tot ijver door hun gesneden beelden. God hoorde het en werd verbolgen, en versmaadde Israël zeer. Daarom verliet Hij de tabernakel te Silo, de tent, die Hij tot een woning gesteld had onder de mensen.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Matt 10:27": "Wat Ik u zeg in het duister, zegt dat in het licht; en wat u hoort in het oor, predikt dat op de daken.", "Gen 12:12": "En het zal gebeuren, wanneer de Egyptenaren u zien, dat zij zullen zeggen: Dat is zijn vrouw; en zij zullen mij doden, en u in leven laten.", "Jer 32:1": "Het woord dat tot Jeremia gekomen is van de HEERE, in het tiende jaar van Zedekia, koning van Juda; dit jaar was het achttiende jaar van Nebukadnezar.", "Jer 1:4-19": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Rom 8:28-30": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn. Want die Hij van tevoren gekend heeft, die heeft Hij ook van tevoren bestemd om gelijkvormig te zijn aan het beeld van Zijn Zoon, opdat Hij de Eerstgeborene zou zijn onder veel broeders. En die Hij van tevoren bestemd heeft, die heeft Hij ook geroepen; en die Hij geroepen heeft, die heeft Hij ook gerechtvaardigd; en die Hij gerechtvaardigd heeft, die heeft Hij ook verheerlijkt.", "Jer 37:11-21": "Vervolgens gebeurde het, toen het leger van de Chaldeeën van Jeruzalem was weggetrokken vanwege het leger van Farao, Dat Jeremia uit Jeruzalem wegging om naar het land van Benjamin te gaan, om zich daar te midden van het volk af te zonderen. Toen hij bij de poort van Benjamin was, was daar een wachtmeester, wiens naam Jerija was, de zoon van Selemja, de zoon van Hananja; die greep de profeet Jeremia en zei: U wilt naar de Chaldeeën overlopen!", "Ps 135:4": "Want de HEERE heeft Zich Jakob verkoren, Israël tot Zijn eigendom.", "Ex 33:17": "Toen zei de HEERE tegen Mozes: Ook deze zaak, die u gesproken hebt, zal Ik doen, omdat u genade gevonden hebt in Mijn ogen, en Ik u bij naam ken.", "Joël 2:1-17": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij. Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten. Voor hen verteert een vuur, en achter hen brandt een vlam; het land is voor hen als een lusthof, maar achter hen een woeste wildernis, en ook is er geen ontkomen aan hen.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Rom 2:21-23": "Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u? Die zegt dat men geen overspel zal doen, doet u overspel? Die van de afgoden een afkeer hebt, plundert u het heilige? Die op de wet roemt, oneert u God door de overtreding van de wet?", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "1 Tim 5:7-11": "En beveel dit, opdat zij onberispelijk zijn. Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige. Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Jer 8:1": "In die tijd, spreekt de HEERE, zullen ze de beenderen van de koningen van Juda, en de beenderen van hun vorsten, en de beenderen van de priesters, en de beenderen van de profeten, en de beenderen van de inwoners van Jeruzalem, uit hun graven halen.", "1 Petr 1:13": "Omgord daarom de lenden van uw verstand, wees nuchter, en hoop volkomen op de genade die u gebracht wordt bij de openbaring van Jezus Christus.", "Jer 52:12-30": "Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was; Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "Jer 22:30": "Zo zegt de HEERE: Schrijf deze man op als kinderloos, een man die niet voorspoedig zal zijn in zijn dagen; want niemand van zijn nageslacht zal voorspoedig zijn, zittend op de troon van David, en nog heersend in Juda."}, "noten": {"1": "Vers 17: SV \"gord uw lendenen\" — D.i.: maak u klaar voor actie/inspanning (beeld van het opbinden van lange kleding om vrij te kunnen bewegen)."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">De</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">woorden</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3414\">Jeremia</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H3414\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">zoon</span> <span class=\"wl\" da /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';

}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>

}
function toggle(n) {
  const paneel = document.getElementById('p' + n);

    document.getElementById('v' + openVers).classList.remove('open');

document.addEventListener('click', e => {

  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
