}},"vertalingen":{"SVnu":{"1":"Toen kwamen alle leiders van de legers naar voren: Johanan, de zoon van Kareah, en Jezanja, de zoon van Hosaja, en al het volk, van de kleinste tot de grootste toe;","2":"en zij zeiden tegen de profeet Jeremia: Laat toch onze smeking voor uw aangezicht neervallen, en bid voor ons tot de HEERE, uw God, voor dit hele overblijfsel; want wij zijn nog maar met weinigen over van velen, zoals uw ogen ons zien;","3":"dat de HEERE, uw God, ons de weg bekendmaakt die wij zullen ingaan, en de zaak die wij zullen doen.","4":"En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.","5":"Toen zeiden zij tegen Jeremia: De HEERE zij tussen ons tot een waarachtig en betrouwbaar Getuige: als wij niet handelen naar elk woord waarmee de HEERE, uw God, u naar ons toe zal zenden!","6":"Hetzij goed of kwaad, wij zullen gehoorzaam zijn aan de stem van de HEERE, onze God, tot Wie wij u zenden; opdat het ons goed gaat, wanneer wij gehoorzaam zijn aan de stem van de HEERE, onze God.","7":"En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.","8":"Toen riep hij Johanan, de zoon van Kareah, en alle leiders van de legers die bij hem waren, en al het volk, van de kleinste af tot de grootste toe;","9":"en hij zei tegen hen: Zo zegt de HEERE, de God van Israël, tot Wie u mij gezonden hebt, om uw smeking voor Zijn aangezicht neer te leggen:","10":"Als u in dit land blijft wonen, dan zal Ik u bouwen en niet afbreken, en u planten en niet uitrukken; want Ik heb berouw over het kwaad dat Ik u aangedaan heb.","11":"Vrees niet voor het aangezicht van de koning van Babel, voor wie u vreest; vrees niet voor hem, spreekt de HEERE; want Ik zal met u zijn, om u te behouden en u van zijn hand te redden.","12":"En Ik zal u barmhartigheid geven, dat hij zich over u erbarmt, en u weer in uw land brengt.","13":"Maar als u zult zeggen: Wij zullen in dit land niet blijven; zodat u niet gehoorzaam bent aan de stem van de HEERE, van uw God,","14":"en zegt: Nee, maar wij zullen naar Egypteland gaan, waar wij geen oorlog zullen zien, noch het geluid van de bazuin horen, noch naar brood hongeren, en daar zullen wij blijven;","15":"nu dan, daarom hoor het woord van de HEERE, overblijfsel van Juda! Zo zegt de HEERE van de heerscharen[1], de God van Israël: Als u vastbesloten uw aangezichten stelt om naar Egypte te gaan, en daar naartoe gaat om daar als vreemdelingen te wonen;","16":"dan zal het gebeuren dat het zwaard waar u voor vreest, u daar in Egypteland zal achterhalen; en de honger waar u voor bezorgd bent, zal u daar in Egypte op de hielen zitten, en daar zult u sterven.","17":"Zo zal het zijn met alle mannen die hun aangezichten stellen om naar Egypte te gaan, om daar als vreemdelingen te wonen; zij zullen sterven door het zwaard, door de honger en door de pestilentie; en zij zullen niemand hebben die overblijft of ontkomt aan het kwaad dat Ik over hen zal brengen.","18":"Want zo zegt de HEERE van de heerscharen, de God van Israël: Zoals Mijn toorn en Mijn grimmigheid uitgestort is over de inwoners van Jeruzalem, zo zal Mijn grimmigheid over u uitgestort worden, als u in Egypte gekomen zult zijn; en u zult tot een vervloeking zijn, en tot een ontzetting, en tot een vloek, en tot smaad, en u zult deze plaats niet meer zien.","19":"De HEERE heeft tegen u gesproken, overblijfsel van Juda! Ga niet naar Egypte; weet zeker dat ik heden tegen u getuigd heb.","20":"Zeker, u hebt uzelf misleid; want u hebt mij tot de HEERE, uw God, gezonden, en gezegd: Bid voor ons tot de HEERE, onze God, en maak ons alles bekend wat de HEERE, onze God, zal zeggen, en wij zullen het doen.","21":"Nu heb ik het u heden bekendgemaakt; maar u hebt niet geluisterd naar de stem van de HEERE, van uw God, noch naar al hetgeen waarmee Hij mij tot u gezonden heeft.","22":"Zo weet nu zeker, dat u door het zwaard, door de honger en door de pestilentie zult sterven, op de plaats waar u naartoe wilde gaan om daar als vreemdelingen te wonen."},"SV":{"1":"Toen traden toe alle oversten der heiren, Johanan, de zoon van Kareah, en Jezanja, de zoon van Hosaja, en al het volk, van den kleinste tot den grootste toe;","2":"En zij zeiden tot den profeet Jeremia: Laat toch onze smeking voor uw aangezicht nedervallen, en bid voor ons tot den HEERE, uw God, voor dit ganse overblijfsel; want wij zijn weinigen van velen overgelaten, gelijk als uw ogen ons zien;","3":"Dat ons de HEERE, uw God, bekend make den weg, dien wij zullen ingaan, en de zaak, die wij zullen doen.","4":"En de profeet Jeremia zeide tot hen: Ik heb het gehoord; ziet, ik zal tot den HEERE, uw God, bidden naar uw woorden; en het zal geschieden, het ganse woord, dat de HEERE u zal antwoorden, zal ik u bekend maken, ik zal u niet een woord onthouden.","5":"Toen zeiden zij tot Jeremia: De HEERE zij tussen ons tot een waarachtig en gewis Getuige: indien wij niet naar alle woord, *met* hetwelk u de HEERE, uw God, tot ons zal zenden, alzo zullen doen!","6":"Hetzij dan goed of kwaad, wij zullen der stem des HEEREN, onzes Gods, tot Welken wij u zenden, gehoorzaam zijn; opdat het ons welga, wanneer wij der stem des HEEREN, onzes Gods, zullen gehoorzaam zijn.","7":"En het gebeurde ten einde van tien dagen, dat des HEEREN woord tot Jeremia geschiedde.","8":"Toen riep hij Johanan, den zoon van Kareah, en alle oversten der heiren, die met hem waren, en al het volk, van den kleinste af tot den grootste toe;","9":"En hij zeide tot hen: Zo zegt de HEERE, de God Israëls, tot Welken gij mij gezonden hebt, om uw smeking voor Zijn aangezicht neder te werpen:","10":"Indien gijlieden in dit land zult blijven wonen, zo zal Ik u bouwen en niet afbreken, en u planten en niet uitrukken; want Ik heb berouw over het kwaad, dat Ik u aangedaan heb.","11":"Vreest niet voor het aangezicht des konings van Babel, voor wiens aangezicht gij vreest; vreest niet voor hem, spreekt de HEERE; want Ik zal met u zijn, om u te behouden en u van zijn hand te redden.","12":"En Ik zal ulieden barmhartigheid geven, dat hij zich uwer erbarme, en u weder in uw land brenge.","13":"Maar zo gijlieden zult zeggen: Wij zullen in dit land niet blijven; opdat gij der stem des HEEREN, uws Gods, niet gehoorzaam zijt,","14":"Zeggende: Neen, maar wij zullen gaan in Egypteland, alwaar wij geen krijg zullen zien, noch het geluid der bazuin horen, noch naar brood hongeren, en daar zullen wij blijven;","15":"Nu dan, daarom hoort des HEEREN woord, gij overblijfsel van Juda! Zo zegt de HEERE der heirscharen, de God Israëls: Indien gij ganselijk uw aangezichten zult stellen om in Egypte te gaan, en zult henen ingaan, om aldaar als vreemdelingen te verkeren;","16":"Zo zal het geschieden, dat het zwaard, waar gij voor vreest, u aldaar in Egypteland zal achterhalen; en de honger, waar gij voor zorgt, zal u aldaar *in* Egypte achter aankleven, en gij zult aldaar sterven.","17":"Zo zullen al de mannen zijn, die hun aangezichten stellen, om in Egypte te gaan, om aldaar als vreemdelingen te verkeren; zij zullen sterven door het zwaard, door den honger en door de pestilentie; en zij zullen niemand hebben, die overblijve of ontkome van het kwaad, dat Ik over hen zal brengen.","18":"Want zo zegt de HEERE der heirscharen, de God Israëls: Gelijk als Mijn toorn, en Mijn grimmigheid is uitgestort over de inwoners van Jeruzalem, alzo zal Mijn grimmigheid over ulieden uitgestort worden, als gij in Egypte zult gekomen zijn; en gij zult wezen tot een vervloeking, en tot een ontzetting, en tot een vloek, en tot smaadheid, en zult deze plaats niet meer zien.","19":"De HEERE heeft tegen ulieden gesproken, gij overblijfsel van Juda! Gaat niet in Egypte; weet zekerlijk, dat ik heden tegen u betuigd heb.","20":"Gewisselijk, gij hebt uw zielen verleid; want gij hebt mij tot den HEERE, uw God, gezonden, zeggende: Bid voor ons tot den HEERE, onzen God, en naar alles, wat de HEERE, onze God, zal zeggen, alzo maak het ons bekend, en wij zullen het doen.","21":"Nu heb ik het u heden bekend gemaakt; maar gij hebt niet gehoord naar de stem des HEEREN, uws Gods, noch naar al hetgeen, *met* hetwelk Hij mij tot u gezonden heeft.","22":"Zo weet nu zekerlijk, dat gij door het zwaard, door den honger en door de pestilentie sterven zult, ter plaatse, waar het u gelust heeft henen te gaan, om aldaar als vreemdelingen te verkeren."},"KJV":{"1":"Then all the captains of the forces, and Johanan the son of Kareah, and Jezaniah the son of Hoshaiah, and all the people from the least even unto the greatest, came near,","2":"And said unto Jeremiah the prophet, Let, we beseech thee, our supplication be accepted before thee, and pray for us unto the LORD thy God, *even* for all this remnant; (for we are left *but* a few of many, as thine eyes do behold","3":"That the LORD thy God may shew us the way wherein we may walk, and the thing that we may do.","4":"Then Jeremiah the prophet said unto them, I have heard *you*; behold, I will pray unto the LORD your God according to your words; and it shall come to pass, *that* whatsoever thing the LORD shall answer you, I will declare *it* unto you; I will keep nothing back","5":"Then they said to Jeremiah, The LORD be a true and faithful witness between us, if we do not even according to all things for the which the LORD thy God shall send","6":"Whether *it be* good, or whether *it be* evil, we will obey the voice of the LORD our God, to whom we send thee; that it may be well with us, when we obey the voice of the LORD our God.","7":"And it came to pass after ten days, that the word of the LORD came unto Jeremiah.","8":"Then called he Johanan the son of Kareah, and all the captains of the forces which *were* with him, and all the people from the least even to the greatest,","9":"And said unto them, Thus saith the LORD, the God of Israel, unto whom ye sent me to present your supplication before","10":"If ye will still abide in this land, then will I build you, and not pull *you* down, and I will plant you, and not pluck *you* up: for I repent me of the evil that I have done","11":"Be not afraid of the king of Babylon, of whom ye are afraid; be not afraid of him, saith the LORD: for I *am* with you to save you, and to deliver you from his hand.","12":"And I will shew mercies unto you, that he may have mercy upon you, and cause you to return to your own land.","13":"But if ye say, We will not dwell in this land, neither obey the voice of the LORD your God,","14":"Saying, No; but we will go into the land of Egypt, where we shall see no war, nor hear the sound of the trumpet, nor have hunger of bread; and there will we dwell:","15":"And now therefore hear the word of the LORD, ye remnant of Judah; Thus saith the LORD of hosts, the God of Israel; If ye wholly set your faces to enter into Egypt, and go to sojourn","16":"Then it shall come to pass, *that* the sword, which ye feared, shall overtake you there in the land of Egypt, and the famine, whereof ye were afraid, shall follow close after you there in Egypt; and there ye shall die.","17":"So shall it be with all the men that set their faces to go into Egypt to sojourn there; they shall die by the sword, by the famine, and by the pestilence: and none of them shall remain or escape from the evil that I will bring","18":"For thus saith the LORD of hosts, the God of Israel; As mine anger and my fury hath been poured forth upon the inhabitants of Jerusalem; so shall my fury be poured forth upon you, when ye shall enter into Egypt: and ye shall be an execration, and an astonishment, and a curse, and a reproach; and ye shall see this place","19":"The LORD hath said concerning you, O ye remnant of Judah; Go ye not into Egypt: know certainly that I have admonished you this day.","20":"For ye dissembled in your hearts, when ye sent me unto the LORD your God, saying, Pray for us unto the LORD our God; and according unto all that the LORD our God shall say, so declare unto us, and we will do","21":"And *now* I have this day declared *it* to you; but ye have not obeyed the voice of the LORD your God, nor any *thing* for the which he hath sent","22":"Now therefore know certainly that ye shall die by the sword, by the famine, and by the pestilence, in the place whither ye desire to go *and* to sojourn."}},"tsk":{"1":[{"kopje":"alle","refs":["Jer 42:8","Jer 40:8","Jer 40:13","Jer 41:11","Jer 41:16","Jer 43:4","Jer 43:5"]},{"kopje":"Jezanja","refs":["2 Kon 25:23","Ezech 8:11","Ezech 11:1"]},{"kopje":"van","refs":["Jer 42:8","Jer 5:4","Jer 5:5","Jer 6:13","Jer 8:10","Jer 44:12","Hand 8:10"]},{"kopje":"kwamen","refs":["Jer 42:20","Jes 29:13","Jes 48:1","Jes 58:1","Jes 58:2","Ezech 14:3","Ezech 14:4","Ezech 20:1-3","Ezech 33:31","Matt 15:8"]}],"2":[{"kopje":"voor uw aangezicht neervallen","refs":["Jer 36:7","Jer 37:20"]},{"kopje":"en bid","refs":["Jer 17:15","Jer 17:16","Jer 21:2","Jer 37:3","Ex 8:28","Ex 9:28","1 Sam 7:8","1 Sam 12:19","1 Sam 12:23","1 Kon 13:6","Jes 1:15","Jes 37:4","Hand 8:24","Jak 5:16"]},{"kopje":"over","refs":["Lev 26:22","Deut 4:27","Deut 28:62","Jes 1:9","Klaagl 1:1","Ezech 5:3","Ezech 5:4","Ezech 12:16","Zach 13:8","Zach 13:9","Matt 24:22"]}],"4":[{"kopje":"ik zal ... bidden","refs":["Ex 8:29","1 Sam 12:23","Rom 10:1"]},{"kopje":"dat","refs":["Jer 23:28","1 Kon 22:14-16","2 Kron 18:13-15","Ezech 2:7"]},{"kopje":"ik zal ... onthouden","refs":["1 Sam 3:17","1 Sam 3:18","Ps 40:11","Hand 20:20","Hand 20:27"]}],"5":[{"kopje":"De HEERE zij","refs":["Jer 5:2","Gen 31:50","Ex 20:7","Richt 11:10","1 Sam 12:5","1 Sam 20:42","Micha 1:2","Mal 2:14","Mal 3:5","Rom 1:9","Openb 1:5","Openb 3:14"]},{"kopje":"als wij","refs":["Ex 20:19","Deut 5:27-29"]}],"6":[{"kopje":"Hetzij goed","refs":["Rom 7:7","Rom 7:13","Rom 8:7"]},{"kopje":"dat het","refs":["Jer 7:23","Deut 5:29","Deut 5:33","Deut 6:2","Deut 6:3","Ps 81:14-17","Ps 128:2","Jes 3:10"]}],"8":[{"kopje":"Johanan","refs":["Jer pan class=\"wl wl-kjv\" data-code=\"H7235\">many,</span> as thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> do behold","3":"That the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> may <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> us the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> wherein we may <span class=\"wl wl-kjv\" data-code=\"H3212\">walk,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> that we may do.","4":"Then <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> you; behold, I will <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> according to your <span class=\"wl wl-kjv\" data-code=\"H1697\">words;</span> and it shall come to pass, that whatsoever <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> you, I will <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> it unto you; I will <span class=\"wl wl-kjv\" data-code=\"H4513\">keep</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">nothing</span> back","5":"Then they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be a <span class=\"wl wl-kjv\" data-code=\"H571\">true</span> and <span class=\"wl wl-kjv\" data-code=\"H539\">faithful</span> <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> between us, if we <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> not even according to all <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> for the which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall send","6":"Whether it be <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> or whether it be <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> we will <span class=\"wl wl-kjv\" data-code=\"H8085\">obey</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to whom <span class=\"wl wl-kjv\" data-code=\"H580\">we</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> thee; that it may be <span class=\"wl wl-kjv\" data-code=\"H3190\">well</span> with us, when we <span class=\"wl wl-kjv\" data-code=\"H8085\">obey</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our God.","7":"And it came to pass <span class=\"wl wl-kjv\" data-code=\"H7093\">after</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto Jeremiah.","8":"Then <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> he <span class=\"wl wl-kjv\" data-code=\"H3110\">Johanan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7143\">Kareah,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H2428\">forces</span> which were with him, and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> from the <span class=\"wl wl-kjv\" data-code=\"H6996\">least</span> even to the greatest,","9":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> unto whom ye <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me to <span class=\"wl wl-kjv\" data-code=\"H5307\">present</span> your <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication</span> before","10":"If ye will <span class=\"wl wl-kjv\" data-code=\"H7725\">still</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> in this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> then will I <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> you, and not pull you <span class=\"wl wl-kjv\" data-code=\"H2040\">down,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> you, and not pluck you <span class=\"wl wl-kjv\" data-code=\"H5428\">up:</span> for I <span class=\"wl wl-kjv\" data-code=\"H5162\">repent</span> me of the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that I have done","11":"Be not <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> of <span class=\"wl wl-kjv\" data-code=\"H6440\">whom</span> ye are <span class=\"wl wl-kjv\" data-code=\"H3373\">afraid;</span> be not <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> of him, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for I am with you to <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> you, and to <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> you from his hand.","12":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H7356\">mercies</span> unto you, that he may have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> upon you, and cause you to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to your own land.","13":"But if ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> We will not <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> neither <span class=\"wl wl-kjv\" data-code=\"H8085\">obey</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God,","14":"<span class=\"wl wl-kjv\" data-code=\"H559\">Saying,</span> No; but we will <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> where we shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> no <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> nor <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> nor have <span class=\"wl wl-kjv\" data-code=\"H7456\">hunger</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread;</span> and there will we dwell:","15":"And now therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> ye <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
