n de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Jer 42:6": "Hetzij goed of kwaad, wij zullen gehoorzaam zijn aan de stem van de HEERE, onze God, tot Wie wij u zenden; opdat het ons goed gaat, wanneer wij gehoorzaam zijn aan de stem van de HEERE, onze God.", "Jer 43:8": "Toen kwam het woord van de HEERE tot Jeremia te Tachpanhes, en Hij zei:", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "1 Sam 17:1": "En de Filistijnen verzamelden hun leger ten strijde, en verzamelden zich te Socho, dat in Juda ligt; en zij legerden zich tussen Socho en Azeka, aan het einde van Dammim.", "Jer 32:2": "(Het leger van de koning van Babel belegerde toen Jeruzalem, en de profeet Jeremia zat opgesloten in het voorhof van de bewaking, dat bij het huis van de koning van Juda is.", "Ezech 20:39": "En u, o huis van Israël, zo zegt de Heere HEERE: Gaat heen, dient ieder zijn drekgoden, ook hierna, omdat u naar Mij niet wilt horen; maar ontheiligt niet meer Mijn heilige Naam, met uw giften en met uw drekgoden.", "Dan 6:13-16": "Toen kwamen zij dichterbij, en spraken voor de koning over het gebod van de koning: Hebt u niet een gebod ondertekend, dat ieder mens die in dertig dagen iets zou verzoeken van enige god of mens, behalve van u, o koning, in de kuil van de leeuwen geworpen zou worden? De koning antwoordde en zei: Dat is een vaste zaak, naar de wet van de Meden en Perzen, die niet herroepen mag worden. Toen antwoordden zij, en zeiden voor de koning: Daniël, een van de gevankelijk weggevoerden uit Juda, heeft, o koning, geen acht op u geslagen, noch op het gebod dat u ondertekend hebt; maar hij bidt drie keer per dag zijn gebed. Toen de koning dit hoorde, was hij zeer bedroefd bij zichzelf, en hij zette zijn hart op Daniël om hem te verlossen; ja, tot aan zonsondergang toe deed hij moeite om hem te redden.", "Deut 5:14": "maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw os, noch uw ezel, noch enig van uw vee, noch de vreemdeling die in uw poorten is; opdat uw dienstknecht en uw dienstmaagd rusten, net als u.", "Ps 137:9": "Gelukkig zal hij zijn, die uw kinderen grijpt, en tegen de steenrots verpletteren zal.", "2 Kon 24:2": "En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten.", "Jer 52:7-9": "Toen werd de stad doorgebroken, en al de krijgslieden vluchtten, en trokken 's nachts uit de stad, door de weg van de poort tussen de twee muren, die bij de hof van de koning waren (de Chaldeeën nu waren tegen de stad rondom), en zij gingen door de weg van het vlakke veld. Doch het leger van de Chaldeeën joeg de koning na, en zij achterhaalden Zedekia in de vlakke velden van Jericho; en zijn hele leger werd van bij hem verstrooid. Zij grepen dan de koning, en voerden hem op naar de koning van Babel in Ribla, in het land van Hamath; die sprak oordelen tegen hem uit.", "2 Kon 18:13": "Maar in het veertiende jaar van koning Hizkia kwam Sanherib, de koning van Assyrië, op tegen alle vaste steden van Juda, en nam ze in.", "2 Kon 9:34-37": "Toen hij nu binnengekomen was, en gegeten en gedronken had, zei hij: Kijk nu naar die vervloekte, en begraaf haar; want zij is een koningsdochter. En zij gingen haar begraven; maar zij vonden niets van haar dan de schedel, en de voeten, en de palmen van haar handen. Toen kwamen zij terug, en vertelden het hem, en hij zei: Dit is het woord van de HEERE, dat Hij gesproken heeft door de dienst van Zijn knecht Elia, de Thisbiet, en zei: Op het stuk land van Jizreël zullen de honden het vlees van Izebel eten.", "2 Kon 24:15": "Zo voerde hij Jojachin weg naar Babel, alsook de moeder van de koning, en de vrouwen van de koning, en zijn hovelingen; daartoe bracht hij de machtigen van het land gevangen van Jeruzalem naar Babel;", "Jer 27:5-7": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.", "2 Kron 23:3": "En heel de gemeente sloot een verbond in het huis van God, met de koning; en hij zei tegen hen: Zie, de zoon van de koning zal koning zijn, zoals de HEERE over de zonen van David gesproken heeft.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Ezech 29:5": "En Ik zal u in de woestijn achterlaten, u en alle vis van uw rivieren; op het open veld zult u vallen; u zult niet verzameld noch bijeengebracht worden; aan de dieren van de aarde en aan de vogels van de hemel heb Ik u tot voedsel gegeven.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "1 Tim 6:1": "Alle dienstknechten die onder het juk zijn, moeten hun eigen heren alle eer waardig achten, opdat de Naam van God en de leer niet gelasterd wordt.", "2 Kron 23:11": "Toen brachten zij de zoon van de koning naar buiten, en zetten hem de kroon op, en gaven hem de getuigenis, en zij maakten hem koning; en Jojada en zijn zonen zalfden hem, en zeiden: Leve de koning!", "Joz 15:35": "Jarmuth, en Adullam, Socho en Azeka,", "Ex 24:8": "Toen nam Mozes dat bloed, en sprengde het op het volk; en hij zei: Zie, dit is het bloed van het verbond, dat de HEERE met u gemaakt heeft over al die woorden.", "Jes 64:10": "Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting.", "2 Kron 36:12-17": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE. Daarbij werd hij ook afvallig tegen koning Nebukadnezar, die hem bij God had beëdigd; en hij verhardde zijn nek, en verstokte zijn hart, zodat hij zich niet bekeerde tot de HEERE, de God van Israël. Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "1 Sam 10:25": "Samuël nu sprak tot het volk het recht van het koninkrijk, en schreef het in een boek, en legde het voor het aangezicht van de HEERE. Toen liet Samuël heel het volk gaan, ieder naar zijn huis.", "Jer 34:1-7": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei: Zo zegt de HEERE, de God van Israël: Ga heen en spreek tot Zedekia, de koning van Juda, en zeg tegen hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal ze met vuur verbranden. En u zult van zijn hand niet ontkomen, maar zeker gegrepen en in zijn hand gegeven worden; en uw ogen zullen de ogen van de koning van Babel zien, en zijn mond zal tot uw mond spreken, en u zult naar Babel komen.", "Jer 19:7": "Want Ik zal de raad van Juda en Jeruzalem in deze plaats verijdelen, en zal hen voor het aangezicht van hun vijanden doen vallen door het zwaard, en door de hand van hen die hun ziel zoeken; en Ik zal hun dode lichamen aan het gevogelte van de hemel en het gedierte van de aarde tot voedsel geven.", "Mal 1:6": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam?", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Jer 7:10": "en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Jer 39:2": "In het elfde jaar van Zedekia, in de vierde maand, op de negende dag van de maand, werd de stad doorgebroken.", "Deut 17:2": "Wanneer in uw midden, in een van uw poorten die de HEERE, uw God, u geeft, een man of vrouw gevonden wordt die doet wat kwaad is in de ogen van de HEERE, uw God, door Zijn verbond te overtreden,", "Jer 34:8-17": "Het woord dat tot Jeremia gebeurde van de HEERE, nadat koning Zedekia een verbond gemaakt had met heel het volk dat te Jeruzalem was, om vrijheid voor hen uit te roepen. Dat ieder zijn knecht, en ieder zijn slavin, die een Hebreeër of een Hebreeuwse is, zou laten vrijgaan; zodat niemand zich van hen, van een Jood, zijn broeder, zou laten dienen. Nu hoorden alle vorsten en heel het volk die het verbond waren ingegaan, dat zij, ieder zijn knecht en ieder zijn slavin, zouden laten vrijgaan, zodat zij zich niet meer van hen zouden laten dienen; zij hoorden dan, en lieten hen gaan.", "2 Kron 11:9": "En Adoraim, en Lachis, en Azeka,", "Kol 3:22-25": "Dienstknechten, wees in alles gehoorzaam aan uw heren naar het vlees, niet met ogendiensten als mensenbehagers, maar met eenvoud van hart, terwijl u God vreest. En alles wat u doet, doe dat van harte, als voor de Heere en niet voor de mensen; want u weet dat u van de Heere de vergelding van de erfenis zult ontvangen; want u dient de Heere Christus.", "Jer 21:10": "Want Ik heb Mijn gezicht tegen deze stad gesteld ten kwade en niet ten goede, spreekt de HEERE; zij zal gegeven worden in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "Rom 7:14-17": "Want wij weten dat de wet geestelijk is, maar ik ben vleselijk, verkocht onder de zonde. Want wat ik doe, dat begrijp ik niet; want wat ik wil, dat doe ik niet, maar wat ik haat, dat doe ik. En als ik doe wat ik niet wil, dan stem ik ermee in dat de wet goed is.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Deut 24:18": "Maar u zult gedenken dat u een knecht in Egypte geweest bent, en de HEERE, uw God, heeft u van daar verlost; daarom gebied ik u deze zaak te doen.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Jer 22:2": "En zeg: Hoor het woord van de HEERE, koning van Juda, u die zit op de troon van David, u, en uw dienaren, en uw volk, die door deze poorten binnengaan!", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "Gen 15:18": "Op dezelfde dag maakte de HEERE een verbond met Abram, en Hij zei: Aan uw nageslacht heb Ik dit land gegeven, van de rivier van Egypte af, tot aan die grote rivier, de rivier de Eufraat:", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Jer 34:15-17": "U nu was heden weer teruggekeerd, en had gedaan wat recht is in Mijn ogen, vrijheid uitroepend, ieder voor zijn naaste; en u had een verbond gemaakt voor Mijn aangezicht, in het huis dat naar Mijn Naam genoemd is. Maar u bent weer omgekeerd, en hebt Mijn Naam ontheiligd, en laten terugkomen, ieder zijn knecht, en ieder zijn slavin, die u had laten vrijgaan naar hun eigen wens; en u hebt hen weer onder gebracht, om voor u te zijn tot knechten en tot slavinnen. Daarom zegt de HEERE zo: U hebt naar Mij niet gehoord, om vrijheid uit te roepen, ieder voor zijn broeder, en ieder voor zijn naaste; zie, zo roep Ik tegen u uit, spreekt de HEERE, een vrijheid ten zwaard, ter pest, en ten honger, en zal u overgeven ter opschudding aan alle koninkrijken van de aarde.", "Deut 28:52": "En het zal u benauwen in al uw poorten, totdat uw hoge en versterkte muren neervallen, waarop u vertrouwde in uw hele land; ja, het zal u benauwen in al uw poorten, in uw hele land, dat de HEERE, uw God, u gegeven heeft.", "Jer 44:22": "Zodat de HEERE het niet meer kon verdragen, vanwege de slechtheid van uw handelingen, vanwege de gruwelen die u deed; daarom is uw land geworden tot een woestheid, en tot ontzetting, en tot een vloek, zodat er niemand in woont, zoals het is op deze dag;", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "1 Kor 6:8": "Maar u doet ongelijk aan, en u brengt schade toe, en dat aan de broeders.", "Dan 2:38": "En overal waar mensenkinderen wonen, heeft Hij de dieren van het veld en de vogels van de hemel in uw hand gegeven; en Hij heeft u aangesteld als heerser over hen allen; u bent dat gouden hoofd.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "Joz 12:11": "De koning van Jarmuth, één; de koning van Lachis, één;", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Dan 9:6": "En wij hebben niet geluisterd naar Uw dienstknechten, de profeten, die in Uw Naam spraken tot onze koningen, onze vorsten en onze vaders, en tot heel het volk van het land.", "Luk 17:7-9": "En wie van u die een dienstknecht heeft die ploegt of de dieren hoedt, zal tegen hem zeggen, als hij van de akker komt: Kom meteen aan tafel? Maar zal hij niet tegen hem zeggen: Maak klaar wat ik vanavond zal eten, omgord u en dien mij, totdat ik gegeten en gedronken heb; en daarna kunt u eten en drinken? Dankt hij die dienstknecht ervoor dat hij gedaan heeft wat hem bevolen was? Ik denk het niet.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Jer 3:11": "Toen zei de HEERE tegen mij: Het afgekeerde Israël heeft zichzelf rechtvaardiger getoond dan de trouweloze Juda.", "Joz 24:21-25": "Toen zei het volk tegen Jozua: Nee, want wij zullen de HEERE dienen. Jozua nu zei tegen het volk: U bent getuigen tegen uzelf, dat u de HEERE gekozen hebt om Hem te dienen. En zij zeiden: Wij zijn getuigen. En nu, doe de vreemde goden weg die in uw midden zijn, en neig uw hart tot de HEERE, de God van Israël.", "Jer 49:37": "En Ik zal Elam versaagd maken voor het aangezicht van hun vijanden, en voor het aangezicht van hen die hun ziel zoeken, en zal een kwaad over hen brengen, de gloed van Mijn toorn, spreekt de HEERE; en Ik zal het zwaard achter hen zenden, totdat Ik hen verteerd zal hebben.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Openb 10:7": "maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.", "Spr 13:17": "Een goddeloze bode zal in het kwaad vallen; maar een trouwe gezant is medicijn.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Jer 32:6": "Jeremia dan zei: Het woord van de HEERE is tot mij gekomen, en het zei:", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "1 Kron 28:12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "Jer 1:4": "Het woord van de HEERE dan kwam tot mij, en zei:", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Amos 2:5": "Daarom zal Ik een vuur in Juda zenden, dat zal Jeruzalems paleizen verteren.", "Neh 11:30": "Zanoah, Adullam en haar dorpen, Lachis en haar akkers, Azeka en haar onderhorige plaatsen; en zij legerden zich van Berseba af tot aan het dal Hinnom.", "Neh 10:29": "hielden zich aan hun broeders, hun voortreffelijken, en kwamen onder de vloek en de eed, dat zij zouden wandelen in de wet van God, die gegeven is door de hand van de knecht van God, Mozes; en dat zij zouden houden, en dat zij zouden doen al de geboden van de HEERE, onze Heere, en Zijn rechten en Zijn inzettingen;", "Spr 19:10": "De weelde past een dwaas niet; hoeveel te minder past het een knecht om te heersen over vorsten!", "Rom 7:24": "Ik, ellendig mens, wie zal mij verlossen uit het lichaam van deze dood?", "Jer 11:8-10": "Maar zij hebben niet gehoord, en ook hun oor niet geneigd, maar hebben gewandeld, ieder naar het goeddunken van hun boze hart; daarom heb Ik over hen gebracht al de woorden van dit verbond, dat Ik geboden had te doen, maar zij hebben het niet gedaan. Verder zei de HEERE tegen mij: Er is een samenzwering gevonden onder de mannen van Juda, en onder de inwoners van Jeruzalem. Zij zijn teruggekeerd tot de ongerechtigheden van hun voorvaders, die Mijn woorden geweigerd hebben te horen; en zij zijn andere goden nagelopen, om die te dienen; het huis van Israël en het huis van Juda hebben Mijn verbond gebroken, dat Ik met hun vaderen gemaakt heb.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Jer 1:15": "Want zie, Ik roep alle geslachten van de koninkrijken van het noorden, spreekt de HEERE; en zij zullen komen, en ieder zal zijn troon zetten voor de deur van de poorten van Jeruzalem, en tegen al haar muren rondom, en tegen alle steden van Juda.", "Jes 24:12": "Verwoesting is in de stad overgebleven, en met gekraak wordt de poort in stukken verbroken.", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "Jer 34:12-22": "Daarom kwam het woord van de HEERE tot Jeremia, van de HEERE, en Hij zei: Zo zegt de HEERE, de God van Israël: Ik heb een verbond gemaakt met uw vaderen, op de dag dat Ik hen uit Egypteland, uit het diensthuis, uitvoerde, en Hij zei: Aan het einde van zeven jaren zult u laten gaan, ieder zijn broeder, een Hebreeër, die u verkocht is, en u zes jaren gediend heeft; u zult hem dan van u laten vrijgaan; maar uw vaders hoorden niet naar Mij, en neigden hun oor niet.", "2 Kron 16:14": "En zij begroeven hem in zijn graf, dat hij voor zich gegraven had in de stad van David, en legden hem op het bed, dat hij gevuld had met specerijen, en dat van verschillende soorten, toebereid naar apothekerskunst; en zij brandden over hem een heel grote branding.", "Jer 30:8": "Want het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik zijn juk van uw hals verbreek, en uw banden verscheuren zal; en vreemden zullen zich niet meer door hem laten dienen.", "Mark 6:20": "want Herodes was bang voor Johannes, wetend dat hij een rechtvaardig en heilig man was, en hij beschermde hem; en wanneer hij hem hoorde, deed hij veel dingen, en hij luisterde graag naar hem.", "Micha 1:13": "Span de snelle dieren aan de wagen, u inwoners van Lachis! (Deze is van de dochter van Sion het beginsel van de zonde) want in u zijn Israëls overtredingen gevonden.", "Jes 48:20": "Ga uit van Babel, vlucht van de Chaldeeën, verkondig met de stem van het gejuich, doe zulks horen, breng het uit tot aan het einde van de aarde, zeg: De HEERE heeft Zijn knecht Jakob verlost!", "Dan 2:19": "Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.", "Jer 27:7": "En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.", "Ezech 33:13": "Als Ik tegen de rechtvaardige zeg dat hij zeker zal leven, en hij op zijn gerechtigheid vertrouwt en onrecht doet, dan zal aan al zijn gerechtigheden niet meer gedacht worden, maar in zijn onrecht, dat hij doet, daarin zal hij sterven.", "2 Kon 19:8": "Zo kwam Rabsake terug en trof de koning van Assyrië aan, strijdend tegen Libna; want hij had gehoord dat hij uit Lachis vertrokken was.", "Ex 24:3": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.", "Lev 26:35": "Al de dagen van de verwoesting zal het rusten, omdat het niet rustte in uw sabbatten, toen u daarin woonde.", "2 Kron 15:1": "Toen kwam de Geest van God op Azaria, de zoon van Oded.", "Jer 13:8": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Jer 50:1": "Het woord dat de HEERE gesproken heeft tegen Babel, tegen het land van de Chaldeeën, door de dienst van de profeet Jeremia.", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Jer 22:18": "Daarom zegt de HEERE zo van Jojakim, zoon van Josia, koning van Juda: Zij zullen hem niet beklagen: Och, mijn broeder! of, och, zuster! Zij zullen hem niet beklagen: Och, heer! of, och, zijn majesteit!", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Jes 46:1": "Bel is gekromd, Nebo wordt neergebogen, hun afgoden zijn geworden voor de dieren en voor de beesten; uw opgeladen pakken zijn een last voor de vermoeide beesten.", "2 Kon 22:20": "Daarom zie, Ik zal u verzamelen bij uw vaderen, en u zult in vrede in uw graf verzameld worden, en uw ogen zullen al het kwaad niet zien dat Ik over deze plaats brengen zal. En zij brachten de koning het antwoord terug.", "Gen 14:13": "Toen kwam er iemand die ontkomen was, en bracht dat over aan Abram, de Hebreeër, die woonde bij de eikenbossen van Mamre, de Amoriet, broeder van Eskol, en broeder van Aner, die Abrams bondgenoten waren.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "1 Sam 17:46": "Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft.", "Matt 15:8": "Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij;", "Matt 22:7": "Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.", "Jer 39:1": "In het negende jaar van Zedekia, koning van Juda, in de tiende maand, kwam Nebukadrezar, de koning van Babel, en al zijn leger, tegen Jeruzalem, en zij belegerden haar.", "Matt 18:28-34": "Maar deze dienstknecht ging naar buiten en vond een van zijn mededienstknechten, die hem honderd penningen schuldig was; hij greep hem vast en greep hem bij de keel, en zei: Betaal mij wat u schuldig bent. Zijn mededienstknecht viel toen aan zijn voeten neer en smeekte hem: Heb geduld met mij, en ik zal u alles betalen. Maar hij wilde niet, maar ging weg en wierp hem in de gevangenis, totdat hij de schuld zou betaald hebben.", "Joz 10:11": "Het gebeurde nu, toen zij voor het aangezicht van Israël vluchtten, terwijl ze in de afdaling van Beth-horon waren, dat de HEERE grote stenen op hen wierp van de hemel, tot Azeka toe, zodat zij stierven; er waren er meer die van de hagelstenen stierven, dan die de kinderen van Israël met het zwaard doodden.", "Neh 5:1-13": "Maar het geroep van het volk en van hun vrouwen was groot, tegen hun broeders, de Joden. Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven. Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "2 Kon 24:12": "Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem gevangen in het achtste jaar van zijn regering.", "2 Kon 14:3": "En hij deed wat recht was in de ogen van de HEERE, maar niet zoals zijn vader David; hij deed naar alles wat zijn vader Joas gedaan had.", "1 Sam 10:24": "Toen zei Samuël tegen heel het volk: Ziet u wie de HEERE gekozen heeft? Want er is niemand zoals hij onder heel het volk. Toen juichte heel het volk, en zij zeiden: Leve de koning!", "Amos 2:6": "Zo zegt de HEERE: Om drie overtredingen van Israël, en om vier zal Ik dat niet afwenden; omdat zij de rechtvaardige voor geld verkopen, en de arme om een paar schoenen.", "Jer 11:18": "De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.", "Ezech 11:24": "Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.", "Ex 19:8": "Toen antwoordde al het volk gezamenlijk en zei: Al wat de HEERE gesproken heeft, zullen wij doen! En Mozes bracht de woorden van het volk terug naar de HEERE.", "Joël 3:3": "En zij hebben het lot geworpen over Mijn volk, en een jongetje gegeven voor een hoer, en een meisje verkocht voor wijn, om die te drinken.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Gal 3:15": "Broeders, ik spreek naar de mens: zelfs bij het verbond van een mens, dat bevestigd is, doet niemand het teniet, en niemand voegt er iets aan toe.", "Jes 13:3": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid.", "Luk 12:35-48": "Laat uw middel omgord zijn, en de lampen brandend. En wees zelf gelijk aan mensen die op hun heer wachten, wanneer hij terugkomt van de bruiloft, zodat zij, als hij komt en klopt, hem meteen kunnen opendoen. Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Jer 33:23": "Verder kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Jer 3:6": "Verder zei de HEERE tegen mij, in de dagen van koning Josia: Hebt u gezien wat het afgekeerde Israël gedaan heeft? Zij ging op elke hoge berg en onder elke groene boom, en hoereerde daar.", "Jes 46:2": "Samen zijn zij neergebogen, zij zijn gekromd, zij hebben de last niet kunnen redden, maar zijzelf zijn in de gevangenis gegaan.", "Job 31:13": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij;", "Jer 47:6": "O wee, u zwaard van de HEERE! Hoe lang zult u niet stil houden? Vaar in uw schede, rust en wees stil!", "Zef 3:3": "Haar vorsten zijn brullende leeuwen in haar midden; haar rechters zijn avondwolven, die de beenderen niet breken tot aan de morgen.", "Joz 23:16": "Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Matt 10:24": "De discipel staat niet boven de meester, en de dienstknecht niet boven zijn heer.", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Deut 28:64": "En de HEERE zal u verstrooien onder alle volken, van het ene einde van de aarde tot het andere einde van de aarde; en daar zult u andere goden dienen die u niet gekend hebt, noch uw vaderen, hout en steen.", "Ex 13:3": "Verder zei Mozes tegen het volk: Denk aan deze dag, waarop u uit Egypte, uit het diensthuis, gegaan bent; want de HEERE heeft u door een sterke hand van hier uitgevoerd; daarom mag het gedesemde niet gegeten worden.", "Ezech 3:20": "Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "1 Sam 19:20": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.", "Amos 9:1": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.", "2 Kron 27:4": "Daartoe bouwde hij steden op het gebergte van Juda; en in de wouden bouwde hij burchten en torens.", "Jer 46:13-26": "Het woord, dat de HEERE tot de profeet Jeremia sprak, over de aankomst van Nebukadrezar, de koning van Babel, om Egypteland te slaan. Verkondigt in Egypte, en doet het horen te Migdol; doet het ook horen te Nof en Tachpanhes; zegt: Stelt u op, en maakt u gereed, want het zwaard heeft verslonden, wat rondom u is. Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef.", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Joz 10:3": "Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "Jer 25:14": "Want van hen zullen zich laten dienen, die ook machtige volken en grote koningen zijn; zo zal Ik hun vergelden naar hun doen, en naar het werk van hun handen.", "2 Kron 23:16": "En Jojada sloot een verbond tussen zichzelf, en tussen heel het volk, en tussen de koning, dat zij het volk van de HEERE zouden zijn.", "Jer 40:1": "Het woord dat van de HEERE gebeurd is tot Jeremia, nadat Nebuzaradan, de aanvoerder van de lijfwacht, hem had laten gaan van Rama; toen hij hem had laten halen, terwijl hij met ketenen gebonden was in het midden van alle gevangenen van Jeruzalem en Juda, die naar Babel gevankelijk werden weggevoerd.", "Ex 2:6": "Toen zij het opendeed, zag zij het kind; en zie, het jongetje huilde; en zij werd door medelijden bewogen, en zei: Dit is een van de kinderen van de Hebreeën!", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "1 Tim 6:2": "En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen.", "Ezech 8:1": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Ezech 12:13": "Ik zal ook Mijn net over hem uitspreiden, zodat hij in Mijn jachtnet gegrepen wordt; en Ik zal hem brengen naar Babylonië, het land van de Chaldeeën; ook zal hij dat niet zien, hoewel hij daar zal sterven.", "2 Kon 17:14": "Zo luisterden zij niet, maar verhardden hun nek, zoals de nek van hun vaderen geweest was, die in de HEERE, hun God, niet geloofd hadden.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "2 Kon 12:2": "En Joas deed wat recht was in de ogen van de HEERE, al zijn dagen, waarin de priester Jojada hem onderwees.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "Ezech 11:4": "Daarom, profeteer tegen hen; profeteer, o mensenkind!", "Zef 3:4": "Haar profeten zijn lichtvaardig, geheel trouweloze mannen; haar priesters verontreinigen het heilige, zij doen de wet geweld aan.", "2 Kron 34:28": "Zie, Ik zal u verzamelen tot uw vaderen, en u zult in vrede in uw graf verzameld worden, en uw ogen zullen al dat onheil niet zien, dat Ik over deze plaats en over haar inwoners brengen zal. En zij brachten de koning dit antwoord terug.", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Ezech 2:1": "En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.", "Jer 27:1-11": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia: Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals. En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Zach 7:14": "Maar Ik heb hen weggestormd onder alle heidenvolken die zij niet kenden; en het land werd achter hen verwoest, zodat niemand er doorheen trok of terugkeerde; want zij maakten het begerenswaardige land tot een verwoesting.", "Jer 42:12": "En Ik zal u barmhartigheid geven, dat hij zich over u erbarmt, en u weer in uw land brengt.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ezech 3:22": "En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.", "Ezech 17:13-19": "Daartoe heeft hij van het koninklijke zaad genomen, en daarmee een verbond gemaakt, en heeft hem tot een eed gebracht, en de machtigen van het land heeft hij weggenomen; opdat het koninkrijk nederig zou zijn, zich niet verheffend, en dat het, zijn verbond houdend, kon bestaan. Maar hij kwam tegen hem in opstand, door zijn boden naar Egypte te zenden, opdat men hem paarden en veel volk bezorgen zou; zal hij gedijen? Zal hij ontkomen, die zulke dingen doet? Ja, zal hij het verbond breken en ontkomen?", "Job 19:16": "Ik riep mijn knecht, en hij antwoordde niet; ik smeekte met mijn mond tot hem.", "Jer 32:26": "Toen kwam het woord van de HEERE tot Jeremia:", "Jer 24:10": "En Ik zal onder hen zenden het zwaard, de honger en de pest, totdat zij verteerd zullen zijn uit het land, dat Ik hun en hun vaderen gegeven had.", "Ezech 17:16": "Zo waarachtig als Ik leef, spreekt de Heere HEERE, hij zal sterven in de plaats van de koning die hem koning gemaakt heeft, wiens eed hij veracht heeft, en wiens verbond hij gebroken heeft — bij hem, midden in Babel!", "Ezech 20:4": "Zou u hun recht geven, zou u hun recht geven, o mensenkind? Maak hun de gruwelen van hun vaderen bekend;", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Ezra 1:1-4": "In het eerste jaar nu van Kores, koning van Perzië, opdat het woord van de HEERE, uit de mond van Jeremia, volbracht werd, wekte de HEERE de geest van Kores, koning van Perzië, op, zodat hij een boodschap liet doorgeven door heel zijn koninkrijk, zelfs ook op schrift, en zei: Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij opgedragen Hem een huis te bouwen te Jeruzalem, dat in Juda is. Wie is er onder u van al Zijn volk? Zijn God zij met hem, en hij trekt op naar Jeruzalem, dat in Juda is, en hij bouwt het huis van de HEERE, de God van Israël; Hij is de God, Die te Jeruzalem woont.", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "Jer 3:10": "En zelfs bij dit alles heeft haar trouweloze zuster Juda zich niet met haar hele hart tot Mij bekeerd, maar slechts in schijn, spreekt de HEERE.", "Ezech 33:28": "Want Ik zal het land tot een verwoesting en een schrik maken, en aan de trots van zijn kracht zal een einde komen; en de bergen van Israël zullen woest zijn, zodat niemand er meer doorheen trekt.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Jer 34:8-21": "Het woord dat tot Jeremia gebeurde van de HEERE, nadat koning Zedekia een verbond gemaakt had met heel het volk dat te Jeruzalem was, om vrijheid voor hen uit te roepen. Dat ieder zijn knecht, en ieder zijn slavin, die een Hebreeër of een Hebreeuwse is, zou laten vrijgaan; zodat niemand zich van hen, van een Jood, zijn broeder, zou laten dienen. Nu hoorden alle vorsten en heel het volk die het verbond waren ingegaan, dat zij, ieder zijn knecht en ieder zijn slavin, zouden laten vrijgaan, zodat zij zich niet meer van hen zouden laten dienen; zij hoorden dan, en lieten hen gaan.", "Jer 37:1-4": "Zedekia, de zoon van Josia, werd koning in plaats van Chonja, de zoon van Jojakim; hem had Nebukadrezar, de koning van Babel, koning gemaakt in het land van Juda. Maar hij hoorde niet, hij niet, en zijn knechten niet, en het volk van het land niet, naar de woorden van de HEERE, die Hij sprak door de dienst van de profeet Jeremia. Toch stuurde koning Zedekia Juchal, de zoon van Selemja, en de priester Sefanja, de zoon van Maaseja, naar de profeet Jeremia, om te zeggen: Bid toch voor ons tot de HEERE, onze God!", "Dan 9:12": "En Hij heeft Zijn woorden bevestigd, die Hij gesproken heeft tegen ons, en tegen onze rechters, die ons berechtten, door over ons een groot kwaad te brengen, dat niet gebeurd is onder de hele hemel, zoals het aan Jeruzalem gebeurd is.", "Micha 7:13": "Maar dit land zal worden tot een verwoesting, vanwege zijn inwoners, vanwege de vrucht van hun handelingen.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Jer 4:30": "Wat zult u dan doen, u die verwoest bent? Al kleedt u zich met scharlaken, al versiert u zich met gouden sieraad, al schuurt u uw ogen met blanketsel, toch zou u zich tevergeefs opmaken; de minnaars versmaden u, zij zullen uw leven zoeken.", "Ezech 29:17-20": "Verder gebeurde het in het zevenentwintigste jaar, in de eerste maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei: Mensenkind! Nebukadrezar, de koning van Babel, heeft zijn leger een grote dienst laten verrichten tegen Tyrus; alle hoofden zijn kaal geworden, en alle zijden zijn opengeschuurd; en noch hij, noch zijn leger heeft loon gehad vanwege Tyrus, voor de dienst die hij tegen haar verricht heeft. Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "Openb 22:6": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.", "Jer 15:2": "En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap!", "Jer 32:4": "En Zedekia, de koning van Juda, zal aan de hand van de Chaldeeën niet ontkomen; maar hij zal zeker gegeven worden in de hand van de koning van Babel, en zijn mond zal tot diens mond spreken, en zijn ogen zullen diens ogen zien;", "Luk 1:70": "zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Ex 6:28": "Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.", "Klaagl 5:8": "Knechten heersen over ons; er is niemand die ons uit hun hand rukt.", "Jer 29:2": "(Nadat koning Jechonia, en de koningin, en de kamerlingen, de vorsten van Juda en Jeruzalem, alsook de timmerlieden en smeden van Jeruzalem waren weggegaan);", "Jer 25:12-14": "Maar het zal gebeuren, als de zeventig jaren vervuld zijn, dan zal Ik over de koning van Babel, en over dat volk, spreekt de HEERE, hun ongerechtigheid bezoeken, alsook over het land van de Chaldeeën, en zal dat stellen tot eeuwige verwoestingen. En Ik zal over dat land brengen al Mijn woorden, die Ik daarover gesproken heb; al wat in dit boek geschreven is, wat Jeremia geprofeteerd heeft over al deze volken. Want van hen zullen zich laten dienen, die ook machtige volken en grote koningen zijn; zo zal Ik hun vergelden naar hun doen, en naar het werk van hun handen.", "Jes 10:5-7": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Spr 27:27": "Daarbij zult u genoeg geitenmelk hebben tot uw voedsel, tot voedsel van uw huis, en levensonderhoud van uw dienstmeisjes.", "2 Kon 23:3": "De koning nu stond bij de pilaar, en sloot een verbond voor het aangezicht van de HEERE, om de HEERE na te wandelen, en Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen met heel zijn hart en met heel zijn ziel te houden, om de woorden van dit verbond te bevestigen, die in dit boek geschreven zijn. En heel het volk stond in dit verbond.", "Jer 24:9": "En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben;", "Zach 1:12": "Toen antwoordde de Engel van de HEERE, en zei: HEERE van de heerscharen! Hoelang zult U Zich niet ontfermen over Jeruzalem en over de steden van Juda, op wie U toornig geweest bent, deze zeventig jaren?", "Jer 38:7": "Toen Ebed-Melech, de Moorman, een van de kamerlingen die toen in het huis van de koning was, hoorde dat zij Jeremia in de kuil gedaan hadden (de koning zat toen in de poort van Benjamin);", "Jer 25:2": "Dat de profeet Jeremia gesproken heeft tot het hele volk van Juda, en tot alle inwoners van Jeruzalem, en hij zei:", "Jer 35:12": "Toen kwam het woord van de HEERE tot Jeremia en zei:", "1 Sam 3:1": "En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.", "Ezech 21:25": "En u, o onheilige, goddeloze vorst van Israël, wiens dag komen zal, in de tijd van de uiterste ongerechtigheid;", "Spr 29:21": "Als men zijn knecht van jongs af aan verwend behandelt, zal hij uiteindelijk als een zoon willen zijn.", "Ex 24:7": "En hij nam het boek van het verbond, en hij las het voor de oren van het volk; en zij zeiden: Al wat de HEERE gesproken heeft, zullen wij doen en gehoorzamen.", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Jer 34:3-5": "En u zult van zijn hand niet ontkomen, maar zeker gegrepen en in zijn hand gegeven worden; en uw ogen zullen de ogen van de koning van Babel zien, en zijn mond zal tot uw mond spreken, en u zult naar Babel komen. Maar hoor het woord van de HEERE, o Zedekia, koning van Juda! Zo zegt de HEERE van u: U zult door het zwaard niet sterven. U zult sterven in vrede, en zoals bij de brandingen van uw vaderen, de vorige koningen die vóór u geweest zijn, zo zullen zij ook voor u branden, en u beklagen en zeggen: Ach heer! Want Ik heb het woord gesproken, spreekt de HEERE.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "Deut 1:5": "Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Jer 52:11": "En hij verblindde de ogen van Zedekia, en hij bond hem met twee koperen ketenen; zo bracht de koning van Babel hem naar Babel, en stelde hem in de gevangenis, tot de dag van zijn dood toe.", "Dan 7:16": "Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.", "1 Sam 4:9": "Wees sterk, en gedraag u als mannen, Filistijnen, zodat u de Hebreeën niet gaat dienen, zoals zij u gediend hebben; wees dus mannen, en strijd.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Deut 29:1": "Dit zijn de woorden van het verbond, dat de HEERE Mozes geboden heeft te maken met de kinderen van Israël, in het land van Moab, naast het verbond, dat Hij met hen gemaakt had aan Horeb.", "Jer 49:28-30": "Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg, zegt de HEERE zo: Maak u op, trek op tegen Kedar, en verwoest de kinderen van het oosten. Zij zullen hun tenten en hun kudden nemen, hun gordijnen en al hun gereedschap, en hun kamelen voor zich wegnemen; en zij zullen tegen hen uitroepen: Schrik van rondom! Vlucht, zwerf vlug heen, woon in diepe plaatsen, inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadsbesluit tegen u beraadslaagd, en een gedachte tegen hen gedacht.", "Jer 44:2-6": "Zo zegt de HEERE van de heerscharen, de God van Israël: U hebt al het kwaad gezien dat Ik gebracht heb over Jeruzalem en over alle steden van Juda; en zie, ze zijn een woestheid tot op deze dag, en niemand woont daarin; Vanwege hun slechtheid, die zij gedaan hebben om Mij te tergen, terwijl zij gingen om te roken en andere goden te dienen, die zij niet kenden, zij, u, noch uw vaders. En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opstaand en zendend, om te zeggen: Doe toch deze gruwelijke zaak niet, die Ik haat.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Dan 4:1": "Koning Nebukadnezar aan alle volken, natiën en talen, die op de hele aardbodem wonen: uw vrede moet vermenigvuldigd worden!", "Ezech 17:16-19": "Zo waarachtig als Ik leef, spreekt de Heere HEERE, hij zal sterven in de plaats van de koning die hem koning gemaakt heeft, wiens eed hij veracht heeft, en wiens verbond hij gebroken heeft — bij hem, midden in Babel! Ook zal farao, met een groot leger en een grote menigte van het krijgsvolk, niets voor hem uitrichten in de oorlog, wanneer men een wal zal opwerpen, en wanneer men vestingen zal bouwen, om veel mensenlevens uit te roeien. Want hij heeft de eed veracht, door het verbond te breken, terwijl hij, zie, zijn hand gegeven had; omdat hij al deze dingen gedaan heeft, zal hij niet ontkomen.", "Hos 8:1": "De bazuin aan uw mond; hij komt als een arend tegen het huis van de Heere; omdat zij Mijn verbond hebben overtreden, en tegen Mijn wet in opstand zijn gekomen.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "Jer 25:1-3": "Het woord dat tot Jeremia gebeurd is over het hele volk van Juda, in het vierde jaar van Jojakim, zoon van Josia, koning van Juda (dit was het eerste jaar van Nebukadnezar, koning van Babel); Dat de profeet Jeremia gesproken heeft tot het hele volk van Juda, en tot alle inwoners van Jeruzalem, en hij zei: Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Lev 25:10": "En u zult dat vijftigste jaar heiligen, en vrijheid uitroepen in het land, voor al zijn inwoners; het zal u een jubeljaar zijn; en u zult terugkeren, ieder tot zijn bezittingen, en u zult terugkeren, ieder tot zijn geslacht.", "Deut 15:15": "En u zult gedenken dat u een dienstknecht in Egypteland geweest bent, en dat de HEERE, uw God, u verlost heeft; daarom gebied ik u vandaag dit.", "Neh 5:8": "En ik zei tegen hen: Wij hebben onze broeders, de Joden, die aan de heidenen verkocht waren, naar ons vermogen teruggekocht; en zouden u ook uw broeders verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij en vonden geen antwoord.", "Ezech 22:27-31": "Haar vorsten zijn in haar midden als wolven die een prooi roven, om bloed te vergieten en om zielen te verderven, opdat zij gierigheid zouden plegen. Haar profeten nu pleisteren hen met loze kalk; zij zien ijdelheid en voorzeggen hun leugen, en zeggen: Zo zegt de Heere HEERE! terwijl de HEERE niet gesproken heeft. Het volk van het land pleegt enkel verdrukking en bedrijft enkel roverij, ook onderdrukken zij de ellendige en de arme, en de vreemdeling verdrukken zij zonder recht.", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "Deut 5:3": "Met onze vaderen heeft de HEERE dit verbond niet gemaakt, maar met ons, wij die hier vandaag allemaal levend zijn.", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "Joz 7:11": "Israël heeft gezondigd; en zij hebben ook Mijn verbond, dat Ik hun geboden had, overtreden; en ook hebben zij van het verbannene genomen, en ook gestolen, en ook gelogen, en hebben het ook onder hun eigen spullen gelegd.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "Dan 2:21-38": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben. Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem. Ik dank U en ik loof U, o God van mijn vaderen! Omdat U mij wijsheid en kracht gegeven hebt, en mij nu bekendgemaakt hebt wat wij van U gevraagd hebben, want U hebt ons de zaak van de koning bekendgemaakt.", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Ezra 10:3-44": "Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet. Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het. Toen stond Ezra op en liet de leiders van de priesters, de Levieten en heel Israël zweren dat zij zouden doen naar dit woord; en zij zwoeren.", "1 Kron 28:19": "Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.", "Jer 42:4": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "Joël 3:2": "dan zal Ik alle heidenvolken verzamelen, en zal hen afvoeren naar het dal van Josafat; en Ik zal daar met hen richten, vanwege Mijn volk en Mijn erfdeel Israël, dat zij onder de heidenvolken hebben verstrooid, en Mijn land hebben verdeeld.", "2 Kron 15:12-15": "En zij sloten een verbond, dat zij de HEERE, de God van hun vaderen, zouden zoeken met hun hele hart en met hun hele ziel. En ieder die de HEERE, de God van Israël, niet zou zoeken, zou gedood worden, van klein tot groot, en van man tot vrouw toe. En zij zwoeren de HEERE met luide stem en met gejuich, en ook met trompetten en met bazuinen.", "Jer 16:4": "Zij zullen pijnlijke doden sterven, zij zullen niet beklaagd en niet begraven worden, zij zullen tot mest op de aardbodem zijn, en zij zullen door het zwaard en door de honger verteerd worden, en hun dode lichamen zullen voedsel zijn voor de vogels van de hemel en voor de dieren van de aarde.", "Joz 9:7": "Toen zeiden de mannen van Israël tegen de Hevieten: Misschien woont u wel te midden van ons, hoe zullen wij dan een verbond met u maken?", "Jer 11:7": "Want Ik heb uw vaderen ernstig betuigd, op de dag dat Ik hen uit Egypteland opvoerde, tot op deze dag, vroeg opstaand en betuigend, en Ik zei: Hoor naar Mijn stem!", "Deut 5:31": "Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.", "Lev 25:39-46": "Evenzo, wanneer uw broeder bij u verarmd zal zijn, en zich aan u verkocht zal hebben, dan zult u hem niet laten dienen als een slaaf; Als een dagloner, als een bijwoner zal hij bij u zijn; tot het jubeljaar zal hij bij u dienen. Dan zal hij van u weggaan, hij en zijn kinderen met hem, en hij zal terugkeren tot zijn geslacht, en tot de bezitting van zijn vaderen terugkeren.", "Jer 7:11": "Is dan dit huis, dat naar Mijn Naam genoemd is, in uw ogen een schuilplaats van rovers? Zie, Ik heb het ook gezien, spreekt de HEERE.", "1 Kon 21:23": "Verder sprak de HEERE ook over Izebel: De honden zullen Izebel eten, bij de voorwal van Jizreël.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Pred 7:21": "Geef ook uw hart niet aan alle woorden die men spreekt, opdat u niet hoort dat uw knecht u vervloekt.", "Dan 5:25-29": "Dit nu is het schrift dat daar getekend is: MENE, MENE, TEKEL, UPHARSIN. Dit is de uitleg van deze woorden: MENE; God heeft uw koninkrijk geteld, en Hij heeft het beëindigd. TEKEL; u bent op een weegschaal gewogen, en u bent te licht bevonden.", "Joz 10:10": "En de HEERE bracht hen in verwarring voor het aangezicht van Israël; en hij sloeg hen met een grote slag te Gibeon, en vervolgde hen op de weg waar men naar Beth-horon opgaat, en sloeg hen tot Azeka en tot Makkeda toe.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "Spr 12:9": "Beter is hij die zich gering acht en een knecht heeft, dan hij die zichzelf eert en gebrek heeft aan het brood.", "Jer 24:1": "De HEERE liet mij zien, en zie, er waren twee vijgenkorven gezet voor de tempel van de HEERE; nadat Nebukadnezar, de koning van Babel, Jechonia, de zoon van Jojakim, de koning van Juda, gevankelijk had weggevoerd, alsook de vorsten van Juda, en de timmerlieden, en de smeden van Jeruzalem, en hen naar Babel had gebracht.", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "Jer 21:1": "Het woord dat van de HEERE gekomen is tot Jeremia, toen koning Zedekia Pashur, de zoon van Malchia, en Zefanja, de zoon van Maaseja, de priester, naar hem toe zond, met de woorden:", "2 Kron 15:12": "En zij sloten een verbond, dat zij de HEERE, de God van hun vaderen, zouden zoeken met hun hele hart en met hun hele ziel.", "Hos 12:1": "Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.", "Jer 31:32": "Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE;", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Klaagl 4:20": "Resch. De adem van onze neus, de gezalfde van de HEERE, is gevangen in hun kuilen; van wie wij zeiden: Wij zullen onder zijn schaduw leven onder de heidenen!", "Spr 25:13": "Een trouwe gezant is voor hen die hem zenden, als de koelte van sneeuw op de dag van de oogst; want hij verkwikt de ziel van zijn heer.", "2 Kron 21:20": "Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "Gen 15:17": "En het gebeurde, toen de zon onderging en het duister werd, en zie, daar was een rokende oven en een vurige fakkel, die tussen die stukken doorging.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "1 Sam 8:8": "Naar de werken die zij gedaan hebben, vanaf de dag dat Ik hen uit Egypte geleid heb, tot op deze dag toe, en Mij hebben verlaten en andere goden gediend; zo doen zij u ook.", "Jes 37:26": "Hebt u niet gehoord dat Ik dit lang tevoren gedaan heb, en dat Ik het van de oude dagen af gevormd heb? Nu heb Ik dat laten gebeuren, dat u de vaste steden zou verwoesten tot puinhopen.", "Jer 15:4": "En Ik zal hen overgeven tot een schrikbeeld voor alle koninkrijken van de aarde, vanwege Manasse, zoon van Jehizkia, koning van Juda, om wat hij in Jeruzalem gedaan heeft.", "Deut 19:19": "dan zult u hem doen zoals hij van plan was zijn broeder te doen; zo zult u het kwaad uit uw midden wegdoen;", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Zef 1:9": "Ook zal Ik op diezelfde dag bezoeking doen over allen die over de drempel springen; die het huis van hun heren vullen met geweld en bedrog.", "Jer 44:1": "Het woord dat tot Jeremia gebeurde over al de Joden die in Egypteland woonden, die te Migdol woonden, en te Tachpanhes, en te Nof, en in het land Pathros, en hij zei:", "Richt 6:8": "dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid;", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "2 Kron 29:10": "Nu is het mijn hartsverlangen om een verbond te sluiten met de HEERE, de God van Israël, opdat de hitte van Zijn toorn van ons afkeert.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "Joz 22:34": "En de kinderen van Ruben en de kinderen van Gad noemden dat altaar: Getuige, want het zij een getuige tussen ons, dat de HEERE God is.", "2 Kron 15:15": "En heel Juda was verblijd over deze eed; want zij hadden met hun hele hart gezworen, en met hun hele wil Hem gezocht; en Hij werd door hen gevonden, en de HEERE gaf hun rust van rondom.", "Jes 45:1-3": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "Jer 37:17": "Stuurde koning Zedekia iemand en liet hem halen; en de koning ondervroeg hem in zijn huis, in het geheim, en zei: Is er een woord van de HEERE? En Jeremia zei: Er is er een; en hij zei: U zult in de hand van de koning van Babel gegeven worden.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "1 Kon 21:25": "Doch er was niemand geweest zoals Achab, die zichzelf verkocht had om te doen wat kwaad is in de ogen van de HEERE, omdat Izebel, zijn vrouw, hem ophitste.", "Jer 11:12": "Dan zullen de steden van Juda en de inwoners van Jeruzalem heengaan, en roepen tot de goden aan wie zij wierook gebracht hebben; maar die zullen hen zeker niet kunnen verlossen ten tijde van hun kwaad.", "Jes 50:1": "Zo zegt de HEERE: Waar is de scheidbrief van uw moeder, waarmee Ik haar weggezonden heb? Of wie is er van Mijn schuldeisers, aan wie Ik u verkocht heb? Zie, om uw ongerechtigheden bent u verkocht, en om uw overtredingen is uw moeder weggezonden.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "Jes 58:6": "Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt?", "Jer 21:7": "En daarna, spreekt de HEERE, zal Ik Zedekia, de koning van Juda, en zijn dienaren, en het volk, en hen die in deze stad zijn overgebleven van de pest, van het zwaard en van de honger, geven in de hand van Nebukadnezar, de koning van Babel, en in de hand van hun vijanden, en in de hand van hen die hun leven zoeken; en hij zal ze slaan met de scherpte van het zwaard; hij zal ze niet sparen, niet ontzien, en zich niet ontfermen.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Dan 4:10-26": "De visioenen van mijn hoofd op mijn bed waren deze: ik zag, en zie, er was een boom in het midden van de aarde, en zijn hoogte was groot. De boom werd groot en sterk; en zijn hoogte reikte aan de hemel, en hij werd gezien tot aan het einde van de hele aarde; Zijn loof was mooi, en zijn vruchten veel, en er was voedsel aan voor allen; onder hem vond het gedierte van het veld schaduw, en de vogels van de hemel woonden in zijn takken, en alle vlees werd daarvan gevoed.", "Ezech 18:24": "Maar als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en handelt naar al de gruwelen die de goddeloze doet, zou die leven? Al zijn gerechtigheden, die hij gedaan heeft, zullen niet aangerekend worden; door zijn overtreding, waardoor hij overtreden heeft, en door zijn zonde, die hij gezondigd heeft, daardoor zal hij sterven.", "2 Kon 25:5": "Doch het leger van de Chaldeeën jaagde de koning na, en zij achterhaalden hem in de vlakke velden van Jericho, en heel zijn leger raakte van bij hem verstrooid.", "Jer 29:18": "En Ik zal hen achtervolgen met het zwaard, met de honger en met de pest; en Ik zal hen overgeven aan een verschrikking, in al de koninkrijken van de aarde, tot een vloek, en tot een schrik, en tot een aanfluiting, en tot een smaad, onder al de volken waarheen Ik hen zal hebben verdreven;", "1 Kor 4:2": "En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt.", "2 Kron 11:5-10": "Rehabeam nu woonde in Jeruzalem; en hij bouwde steden tot vestingen in Juda. Hij bouwde Bethlehem, en Etham, en Thekoa, En Beth-zur, en Socho, en Adullam,", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "2 Kon 18:14": "Toen zond Hizkia, de koning van Juda, tot de koning van Assyrië, naar Lachis, en zei: Ik heb gezondigd, keer af van mij; wat u mij oplegt, zal ik dragen. Toen legde de koning van Assyrië Hizkia, de koning van Juda, driehonderd talenten van het zilver en dertig talenten van het goud op.", "Jer 42:5": "Toen zeiden zij tegen Jeremia: De HEERE zij tussen ons tot een waarachtig en betrouwbaar Getuige: als wij niet handelen naar elk woord waarmee de HEERE, uw God, u naar ons toe zal zenden!", "Jer 32:1": "Het woord dat tot Jeremia gekomen is van de HEERE, in het tiende jaar van Zedekia, koning van Juda; dit jaar was het achttiende jaar van Nebukadnezar.", "Jer 28:14": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Ik heb een ijzeren juk gedaan aan de hals van al deze volken, om Nebukadnezar, de koning van Babel, te dienen, en zij zullen hem dienen; ja, Ik heb hem ook het gedierte van het veld gegeven.", "Jer 52:13": "Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "2 Kon 24:3": "Zeker gebeurde dit op bevel van de HEERE tegen Juda, dat Hij hen van Zijn aangezicht wegdeed, om de zonden van Manasse, naar alles wat hij gedaan had;", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Jer 26:16": "Toen zeiden de vorsten en al het volk tot de priesters en tot de profeten: Deze man verdient de dood niet, want hij heeft tot ons gesproken in de Naam van de HEERE, onze God.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Jer 36:1": "Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam:", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Matt 8:9": "Want ik ben ook een mens onder het gezag van anderen, en heb soldaten onder mij; en ik zeg tegen deze: Ga! en hij gaat; en tegen de ander: Kom! en hij komt; en tegen mijn dienstknecht: Doe dit! en hij doet het.", "Jer 11:21": "Daarom, zo zegt de HEERE van de mannen van Anathoth, die uw leven zoeken, en zeggen: Profeteer niet in de Naam van de HEERE, opdat u niet door onze handen sterft.", "Deut 29:12": "Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "2 Kron 36:17": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch d
