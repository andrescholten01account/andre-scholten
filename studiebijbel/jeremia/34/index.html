}},"vertalingen":{"SVnu":{"1":"Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:","2":"Zo zegt de HEERE, de God van Israël: Ga heen en spreek tot Zedekia, de koning van Juda, en zeg tegen hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal ze met vuur verbranden.","3":"En u zult van zijn hand niet ontkomen, maar zeker gegrepen en in zijn hand gegeven worden; en uw ogen zullen de ogen van de koning van Babel zien, en zijn mond zal tot uw mond spreken, en u zult naar Babel komen.","4":"Maar hoor het woord van de HEERE, o Zedekia, koning van Juda! Zo zegt de HEERE van u: U zult door het zwaard niet sterven.","5":"U zult sterven in vrede, en zoals bij de brandingen van uw vaderen, de vorige koningen die vóór u geweest zijn, zo zullen zij ook voor u branden, en u beklagen en zeggen: Ach heer! Want Ik heb het woord gesproken, spreekt de HEERE.","6":"En de profeet Jeremia sprak al deze woorden tot Zedekia, de koning van Juda, te Jeruzalem.","7":"Toen het leger van de koning van Babel streed tegen Jeruzalem, en tegen alle overgebleven steden van Juda, tegen Lachis en tegen Azeka; want deze, *zijnde* vaste steden, waren overgebleven onder de steden van Juda.","8":"Het woord dat tot Jeremia gebeurde van de HEERE, nadat koning Zedekia een verbond gemaakt had met heel het volk dat te Jeruzalem was, om vrijheid voor hen uit te roepen.","9":"Dat ieder zijn knecht, en ieder zijn slavin, die een Hebreeër of een Hebreeuwse is, zou laten vrijgaan; zodat niemand zich van hen, van een Jood, zijn broeder, zou laten dienen.","10":"Nu hoorden alle vorsten en heel het volk die het verbond waren ingegaan, dat zij, ieder zijn knecht en ieder zijn slavin, zouden laten vrijgaan, zodat zij zich niet meer van hen zouden laten dienen; zij hoorden dan, en lieten hen gaan.","11":"Maar zij keerden daarna weer terug, en deden de knechten en slavinnen terugkomen die zij hadden laten vrijgaan, en zij brachten hen weer onder als knechten en als slavinnen.","12":"Daarom kwam het woord van de HEERE tot Jeremia, van de HEERE, en Hij zei:","13":"Zo zegt de HEERE, de God van Israël: Ik heb een verbond gemaakt met uw vaderen, op de dag dat Ik hen uit Egypteland, uit het diensthuis, uitvoerde, en Hij zei:","14":"Aan het einde van zeven jaren zult u laten gaan, ieder zijn broeder, een Hebreeër, die u verkocht is, en u zes jaren gediend heeft; u zult hem dan van u laten vrijgaan; maar uw vaders hoorden niet naar Mij, en neigden hun oor niet.","15":"U nu was heden weer teruggekeerd, en had gedaan wat recht is in Mijn ogen, vrijheid uitroepend, ieder voor zijn naaste; en u had een verbond gemaakt voor Mijn aangezicht, in het huis dat naar Mijn Naam genoemd is.","16":"Maar u bent weer omgekeerd, en hebt Mijn Naam ontheiligd, en laten terugkomen, ieder zijn knecht, en ieder zijn slavin, die u had laten vrijgaan naar hun eigen wens; en u hebt hen weer onder gebracht, om voor u te zijn tot knechten en tot slavinnen.","17":"Daarom zegt de HEERE zo: U hebt naar Mij niet gehoord, om vrijheid uit te roepen, ieder voor zijn broeder, en ieder voor zijn naaste; zie, zo roep Ik tegen u uit, spreekt de HEERE, een vrijheid ten zwaard, ter pest, en ten honger, en zal u overgeven ter opschudding aan alle koninkrijken van de aarde.","18":"En Ik zal de mannen overgeven die Mijn verbond hebben overtreden, die de woorden van het verbond niet bevestigd hebben, dat zij voor Mijn aangezicht gemaakt hadden, *met* het kalf, dat zij in tweeën hadden gehouwen, en waren tussen zijn stukken doorgegaan:","19":"De vorsten van Juda, en de vorsten van Jeruzalem, de kamerlingen, en de priesters, en heel het volk van het land, die door de stukken van het kalf zijn doorgegaan.","20":"Ja, Ik zal hen overgeven in de hand van hun vijanden, en in de hand van hen die hun ziel zoeken; en hun dode lichamen zullen voor het gevogelte van de hemel en het gedierte van de aarde tot voedsel zijn.","21":"Zelfs Zedekia, de koning van Juda, en zijn vorsten, zal Ik overgeven in de hand van hun vijanden, en in de hand van hen die hun ziel zoeken, namelijk in de hand van het leger van de koning van Babel, dat van u *nu* is opgetrokken.","22":"Zie, Ik zal bevel geven, spreekt de HEERE, en zal hen weer naar deze stad terugbrengen, en zij zullen tegen haar strijden, en zullen ze innemen, en zullen ze met vuur verbranden; en Ik zal de steden van Juda stellen *tot* een verwoesting, zodat er niemand in woont."},"SV":{"1":"Het woord, dat tot Jeremia geschied is van den HEERE (als Nebukadnezar, koning van Babel, en zijn ganse heir, en alle koninkrijken der aarde, die *onder* de heerschappij zijner hand waren, en al de volken tegen Jeruzalem streden, en tegen al haar steden), zeggende:","2":"Zo zegt de HEERE, de God Israëls: Ga henen en spreek tot Zedekia, den koning van Juda, en zeg tot hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand des konings van Babel, en hij zal ze met vuur verbranden.","3":"En gij zult van zijn hand niet ontkomen, maar zekerlijk gegrepen, en in zijn hand gegeven worden; en uw ogen zullen de ogen des konings van Babel zien, en zijn mond zal tot uw mond spreken, en gij zult te Babel komen.","4":"Maar hoor des HEEREN woord, o Zedekia, koning van Juda! zo zegt de HEERE van u: Gij zult door het zwaard niet sterven.","5":"Gij zult sterven in vrede, en naar de brandingen van uw vaderen, de vorige koningen, die voor u geweest zijn, alzo zullen zij over u branden, en u beklagen, *zeggende*: Och heer! want Ik heb het woord gesproken, spreekt de HEERE.","6":"En de profeet Jeremia sprak al deze woorden tot Zedekia, den koning van Juda, te Jeruzalem.","7":"Als het heir des konings van Babel streed tegen Jeruzalem, en tegen al de overgeblevene steden van Juda, tegen Lachis en tegen Azeka; want deze, *zijnde* vaste steden, waren overgebleven onder de steden van Juda.","8":"Het woord, dat tot Jeremia geschied is van den HEERE, nadat de koning Zedekia een verbond gemaakt had met het ganse volk, dat te Jeruzalem was, om vrijheid voor hen uit te roepen.","9":"Dat een iegelijk zijn knecht, en een iegelijk zijn maagd, zijnde een Hebreër of een Hebreïnne, zou laten vrijgaan; zodat niemand zich van hen, van een Jood, zijn broeder, zou doen dienen.","10":"Nu hoorden al de vorsten en al het volk, die het verbond hadden ingegaan, dat zij, een iegelijk zijn knecht, en een iegelijk zijn maagd zouden laten vrijgaan, zodat zij zich niet meer van hen zouden doen dienen; zij hoorden dan, en lieten hen gaan;","11":"Maar zij keerden daarna wederom, en deden de knechten en maagden wederkomen, die zij hadden laten vrijgaan, en zij brachten hen ten onder tot knechten en tot maagden.","12":"Daarom geschiedde des HEEREN woord tot Jeremia, van den HEERE, zeggende:","13":"Zo zegt de HEERE, de God Israëls: Ik heb een verbond gemaakt met uw vaderen, ten dage, als Ik hen uit Egypteland, uit het diensthuis uitvoerde, zeggende:","14":"Ten einde van zeven jaren zult gij laten gaan, een iegelijk zijn broeder, een Hebreër, die u zal verkocht zijn, en u zes jaren gediend heeft; gij zult hem dan van u laten vrijgaan; maar uw vaders hoorden niet naar Mij, en neigden hun oor niet.","15":"Gijlieden nu waart heden wedergekeerd, en hadt gedaan, dat recht is in Mijn ogen, vrijheid uitroepende, een iegelijk voor zijn naaste; en gij hadt een verbond gemaakt voor Mijn aangezicht, in het huis, dat naar Mijn Naam genoemd is.","16":"Maar gij zijt weder omgekeerd, en hebt Mijn Naam ontheiligd, en doen wederkomen, een iegelijk zijn knecht, en een iegelijk zijn maagd, die gij hadt laten vrijgaan naar hun lust; en gij hebt hen ten ondergebracht, om ulieden te wezen tot knechten en tot maagden.","17":"Daarom zegt de HEERE alzo: Gijlieden hebt naar Mij niet gehoord, om vrijheid uit te roepen, een iegelijk voor zijn broeder, en een iegelijk voor zijn naaste; ziet, zo roep Ik uit tegen ulieden, spreekt de HEERE, een vrijheid ten zwaarde, ter pestilentie, en ten honger, en zal u overgeven ter beroering allen koninkrijken der aarde.","18":"En Ik zal de mannen overgeven, die Mijn verbond hebben overtreden, die niet bevestigd hebben de woorden des verbonds, dat zij voor Mijn aangezicht gemaakt hadden, *met* het kalf, dat zij in tweeën hadden gehouwen, en waren tussen zijn stukken doorgegaan:","19":"De vorsten van Juda, en de vorsten van Jeruzalem, de kamerlingen, en de priesteren, en al het volk des lands, die door de stukken des kalfs zijn doorgegaan.","20":"Ja, Ik zal hen overgeven in de hand hunner vijanden, en in de hand dergenen, die hun ziel zoeken; en hun dode lichamen zullen het gevogelte des hemels en het gedierte der aarde tot spijze zijn.","21":"Zelfs Zedekia, den koning van Juda, en zijn vorsten, zal Ik overgeven in de hand hunner vijanden, en in de hand dergenen, die hun ziel zoeken, te weten, in de hand van het heir des konings van Babel, die van ulieden *nu* zijn opgetogen.","22":"Ziet, Ik zal bevel geven, spreekt de HEERE, en zal hen weder tot deze stad brengen, en zij zullen tegen haar strijden, en zullen ze innemen, en zullen ze met vuur verbranden; en Ik zal de steden van Juda stellen *tot* een verwoesting, dat er niemand in wone."},"KJV":{"1":"The word which came unto Jeremiah from the LORD, when Nebuchadnezzar king of Babylon, and all his army, and all the kingdoms of the earth of his dominion, and all the people, fought against Jerusalem, and against all the cities thereof, saying,","2":"Thus saith the LORD, the God of Israel; Go and speak to Zedekiah king of Judah, and tell him, Thus saith the LORD; Behold, I will give this city into the hand of the king of Babylon, and he shall burn it with fire:","3":"And thou shalt not escape out of his hand, but shalt surely be taken, and delivered into his hand; and thine eyes shall behold the eyes of the king of Babylon, and he shall speak with thee mouth to mouth, and thou shalt go to Babylon.","4":"Yet hear the word of the LORD, O Zedekiah king of Judah; Thus saith the LORD of thee, Thou shalt not die by the sword:","5":"*But* thou shalt die in peace: and with the burnings of thy fathers, the former kings which were before thee, so shall they burn *odours* for thee; and they will lament thee, *saying*, Ah lord! for I have pronounced the word, saith the LORD.","6":"Then Jeremiah the prophet spake all these words unto Zedekiah king of Judah in Jerusalem,","7":"When the king of Babylon's army fought against Jerusalem, and against all the cities of Judah that were left, against Lachish, and against Azekah: for these defenced cities remained of the cities of Judah.","8":"*This is* the word that came unto Jeremiah from the LORD, after that the king Zedekiah had made a covenant with all the people which *were* at Jerusalem, to proclaim liberty","9":"That every man should let his manservant, and every man his maidservant, *being* an Hebrew or an Hebrewess, go free; that none should serve himself of them, *to wit*, of a Jew his brother.","10":"Now when all the princes, and all the people, which had entered into the covenant, heard that every one should let his manservant, and every one his maidservant, go free, that none should serve themselves of them any more, then they obeyed, and let *them* go.","11":"But afterward they turned, and caused the servants and the handmaids, whom they had let go free, to return, and brought them into subjection for servants and for handmaids.","12":"Therefore the word of the LORD came to Jeremiah from the LORD, saying,","13":"Thus saith the LORD, the God of Israel; I made a covenant with your fathers in the day that I brought them forth out of the land of Egypt, out of the house of bondmen, saying,","14":"At the end of seven years let ye go every man his brother an Hebrew, which hath been sold unto thee; and when he hath served thee six years, thou shalt let him go free from thee: but your fathers hearkened not unto me, neither inclined their ear.","15":"And ye were now turned, and had done right in my sight, in proclaiming liberty every man to his neighbour; and ye had made a covenant before me in the house which is called by my name:","16":"But ye turned and polluted my name, and caused every man his servant, and every man his handmaid, whom ye had set at liberty at their pleasure, to return, and brought them into subjection, to be unto you for servants and for handmaids.","17":"Therefore thus saith the LORD; Ye have not hearkened unto me, in proclaiming liberty, every one to his brother, and every man to his neighbour: behold, I proclaim a liberty for you, saith the LORD, to the sword, to the pestilence, and to the famine; and I will make you to be removed into all the kingdoms of the earth.","18":"And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts","19":"The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;","20":"I will even give them into the hand of their enemies, and into the hand of them that seek their life: and their dead bodies shall be for meat unto the fowls of the heaven, and to the beasts of the earth.","21":"And Zedekiah king of Judah and his princes will I give into the hand of their enemies, and into the hand of them that seek their life, and into the hand of the king of Babylon's army, which are gone up","22":"Behold, I will command, saith the LORD, and cause them to return to this city; and they shall fight against it, and take it, and burn it with fire: and I will make the cities of Judah a desolation without an inhabitant."}},"tsk":{"1":[{"kopje":"Het woord","refs":["Jer 34:1-7","Jer 34:8-22"]},{"kopje":"toen","refs":["Jer 34:7","Jer 32:2","Jer 39:1-3","Jer 52:4-11","2 Kon 2 ss=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> when <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadnezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H2428\">army,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> of his <span class=\"wl wl-kjv\" data-code=\"H3027\">dominion,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and against all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> thereof, saying,","2":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> to <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> it with fire:","3":"And thou shalt not escape <span class=\"wl wl-kjv\" data-code=\"H4422\">out</span> of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> but shalt <span class=\"wl wl-kjv\" data-code=\"H8610\">surely</span> be <span class=\"wl wl-kjv\" data-code=\"H8610\">taken,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> with thee <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> to <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to Babylon.","4":"Yet <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> O <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of thee, Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> by the sword:","5":"But thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace:</span> and with the <span class=\"wl wl-kjv\" data-code=\"H4955\">burnings</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> which were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, so shall they <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> odours for thee; and they will <span class=\"wl wl-kjv\" data-code=\"H5594\">lament</span> thee, saying, <span class=\"wl wl-kjv\" data-code=\"H1945\">Ah</span> <span class=\"wl wl-kjv\" data-code=\"H113\">lord!</span> for I have <span class=\"wl wl-kjv\" data-code=\"H1696\">pronounced</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","6":"Then <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> unto <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> in Jerusalem,","7":"When the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon's</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and against all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> that were <span class=\"wl wl-kjv\" data-code=\"H3498\">left,</span> against <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> and against <span class=\"wl wl-kjv\" data-code=\"H5825\">Azekah:</span> for these <span class=\"wl wl-kjv\" data-code=\"H4013\">defenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of Judah.","8":"This is the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that came unto <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> had <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> which were at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> to <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaim</span> liberty","9":"That every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> should let his <span class=\"wl wl-kjv\" data-code=\"H5650\">manservant,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H8198\">maidservant,</span> being an <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrew</span> or an <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrewess,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> <span class=\"wl wl-kjv\" data-code=\"H2670\">free;</span> that none should <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> himself of them, to wit, of a <span class=\"wl wl-kjv\" data-code=\"H3064\">Jew</span> his brother.","10":"Now when all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> which had <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> should let his <span class=\"wl wl-kjv\" data-code=\"H5650\">manservant,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> his <span class=\"wl wl-kjv\" data-code=\"H8198\">maidservant,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> <span class=\"wl wl-kjv\" data-code=\"H2670\">free,</span> that none should <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> themselves of them any more, then they <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed,</span> and let them go.","11":"But <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> they <span class=\"wl wl-kjv\" data-code=\"H7725\">turned,</span> and caused the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> and the <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaids,</span> whom they had let <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> <span class=\"wl wl-kjv\" data-code=\"H2670\">free,</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and brought them into <span class=\"wl wl-kjv\" data-code=\"H3533\">subjection</span> for <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> and for handmaids.","12":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came to <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> saying,","13":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> I <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that I brought them <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H5650\">bondmen,</span> saying,","14":"At the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> let ye <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> an <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrew,</span> which hath been <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> unto thee; and when he hath <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> thee <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> thou shalt let him <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> <span class=\"wl wl-kjv\" data-code=\"H2670\">free</span> from thee: but your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not unto me, neither <span class=\"wl wl-kjv\" data-code=\"H5186\">inclined</span> their ear.","15":"And ye were <span class=\"wl wl-kjv\" data-code=\"H3117\">now</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">turned,</span> and had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in my <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> in <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaiming</span> <span class=\"wl wl-kjv\" data-code=\"H1865\">liberty</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

  if (!k) return;

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
