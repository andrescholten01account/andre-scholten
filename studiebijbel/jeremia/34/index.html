e meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand.", "Openb 16:6": "Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard.", "Jer 32:30": "Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Gen 15:10": "En hij bracht Hem deze alle, en hij deelde ze middendoor, en hij legde ieders deel tegenover het andere; maar het gevogelte deelde hij niet.", "Ezech 17:14-18": "opdat het koninkrijk nederig zou zijn, zich niet verheffend, en dat het, zijn verbond houdend, kon bestaan. Maar hij kwam tegen hem in opstand, door zijn boden naar Egypte te zenden, opdat men hem paarden en veel volk bezorgen zou; zal hij gedijen? Zal hij ontkomen, die zulke dingen doet? Ja, zal hij het verbond breken en ontkomen? Zo waarachtig als Ik leef, spreekt de Heere HEERE, hij zal sterven in de plaats van de koning die hem koning gemaakt heeft, wiens eed hij veracht heeft, en wiens verbond hij gebroken heeft — bij hem, midden in Babel!", "2 Kron 28:10": "Daartoe denkt u er nu aan om de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; bent u het zelf niet die schuldig staan? Bij u zijn schulden tegen de HEERE, uw God.", "2 Kon 25:7": "En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia's ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Jer 34:8-16": "Het woord dat tot Jeremia gebeurde van de HEERE, nadat koning Zedekia een verbond gemaakt had met heel het volk dat te Jeruzalem was, om vrijheid voor hen uit te roepen. Dat ieder zijn knecht, en ieder zijn slavin, die een Hebreeër of een Hebreeuwse is, zou laten vrijgaan; zodat niemand zich van hen, van een Jood, zijn broeder, zou laten dienen. Nu hoorden alle vorsten en heel het volk die het verbond waren ingegaan, dat zij, ieder zijn knecht en ieder zijn slavin, zouden laten vrijgaan, zodat zij zich niet meer van hen zouden laten dienen; zij hoorden dan, en lieten hen gaan.", "Jer 39:8": "En de Chaldeeën verbrandden het huis van de koning en de huizen van het volk met vuur; en zij braken de muren van Jeruzalem af.", "Jer 26:10": "Toen nu de vorsten van Juda deze woorden hoorden, gingen zij op uit het huis van de koning naar het huis van de HEERE; en zij zetten zich bij de deur van de nieuwe poort van de HEERE.", "1 Kor 7:21-24": "Bent u als dienstknecht geroepen, laat u dat niet bekommeren; maar als u ook vrij kunt worden, gebruik dat dan liever. Want wie in de Heere geroepen is als dienstknecht, is een vrijgelatene van de Heere; net zo ook, wie vrij zijnde geroepen is, is een dienstknecht van Christus. U bent duur gekocht, word geen dienstknechten van mensen.", "1 Kon 14:11": "Wie van Jerobeam in de stad sterft, zullen de honden opeten; en wie in het veld sterft, zullen de vogels van de hemel opeten; want de HEERE heeft het gesproken.", "Jer 36:21": "Toen zond de koning Jehudi om de rol te halen; en hij haalde ze uit de kamer van Elisama, de schrijver; en Jehudi las ze voor de oren van de koning, en voor de oren van al de vorsten die bij de koning stonden."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">Het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3414\">dat</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3414\">tot</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3414\">Jeremia</span> gebeurde van <span class=\"wl\" data-l=\"L3\" data-code=\"H5019\">de</span> <span class=\"wl\" data-l=\"L3\" " data-code=\"H894\">Babylon,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> it with fire:", "3": "And thou shalt not escape <span class=\"wl wl-kjv\" data-code=\"H4422\">out</span> of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> but shalt <span class=\"wl wl-kjv\" data-code=\"H8610\">surely</span> be <span class=\"wl wl-kjv\" data-code=\"H8610\">taken,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> with thee <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> to <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to Babylon.", "4": "Yet <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> O <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of thee, Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> by the sword:", "5": "But thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace:</span> and with the <span class=\"wl wl-kjv\" data-code=\"H4955\">burnings</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> which were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, so shall they <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> odours for thee; and they will <span class=\"wl wl-kjv\" data-code=\"H5594\">lament</span> thee, saying, <span class=\"wl wl-kjv\" data-code=\"H1945\">Ah</span> <span class=\"wl wl-kjv\" data-code=\"H113\">lord!</span> for I have <span class=\"wl wl-kjv\" data-code=\"H1696\">pronounced</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "6": "Then <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> unto <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> in Jerusalem,", "7": "When the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon's</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and against all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> that were <span class=\"wl wl-kjv\" data-code=\"H3498\">left,</span> against <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> and against <span class=\"wl wl-kjv\" data-code=\"H5825\">Azekah:</span> for these <span class=\"wl wl-kjv\" data-code=\"H4013\">defenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of Judah.", "8": "This is the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that came unto <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> had <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> which were at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> to <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaim</span> liberty", "9": "That every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> should let his <span class=\"wl wl-kjv\" data-code=\"H5650\">manservant,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H8198\">maidservant,</span> being an <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrew</span> or an <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrewess,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> <span class=\"wl wl-kjv\" data-code=\"H2670\">free;</span> that none should <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> himself of them, to wit, of a <span class=\"wl wl-kjv\" data-code=\"H3064\">Jew</span> his brother.", "10": "Now when all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> which had <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hea =\"H3548\">priests,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> between the <span class=\"wl wl-kjv\" data-code=\"H1335\">parts</span> of the calf;", "20": "I will even <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> their <span class=\"wl wl-kjv\" data-code=\"H5315\">life:</span> and their dead <span class=\"wl wl-kjv\" data-code=\"H5038\">bodies</span> shall be for <span class=\"wl wl-kjv\" data-code=\"H3978\">meat</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> of the earth.", "21": "And <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> their <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon's</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army,</span> which are gone up", "22": "Behold, I will <span class=\"wl wl-kjv\" data-code=\"H6680\">command,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and cause them to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to this <span class=\"wl wl-kjv\" data-code=\"H5892\">city;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against it, and <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> it, and <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> it with <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> a <span class=\"wl wl-kjv\" data-code=\"H8077\">desolation</span> without an inhabitant."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
