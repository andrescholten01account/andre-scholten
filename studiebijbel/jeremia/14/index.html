}},"vertalingen":{"SVnu":{"1":"Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte.","2":"Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op.","3":"En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.","4":"Omdat het aardrijk gescheurd is, doordat er geen regen op de aarde is; de akkerlieden zijn beschaamd, zij bedekken hun hoofd.","5":"Want ook de hinden in het veld werpen jongen, en verlaten die, omdat er geen jong gras is.","6":"En de wilde ezels staan op de hoge plaatsen, zij scheppen de wind als de jakhalzen; hun ogen bezwijken, omdat er geen kruid is.","7":"Hoewel onze ongerechtigheden tegen ons getuigen, o HEERE, doe *het* om Uw Naams wil; want onze afdwalingen zijn talrijk, wij hebben tegen U gezondigd.","8":"O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! Waarom zou U zijn als een vreemdeling in het land, en als een reiziger die slechts inkeert om te overnachten?","9":"Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.","10":"Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken[1].","11":"Verder zei de HEERE tegen mij: Bid niet voor dit volk ten goede.","12":"Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.","13":"Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats.","14":"En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart.","15":"Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden.","16":"En het volk, tot wie zij profeteren, zal op de straten van Jeruzalem weggeworpen zijn vanwege de honger en het zwaard; en er zal niemand zijn die hen kan begraven, hen, hun vrouwen, en hun zonen, en hun dochters; zo zal Ik hun slechtheid over hen uitstorten.","17":"Daarom zult u dit woord tegen hen zeggen: Mijn ogen zullen van tranen neerdalen, nacht en dag, en niet ophouden; want de jonkvrouw, de dochter van Mijn volk, is gebroken met een grote breuk, een plaag die zeer smartelijk is.","18":"Als ik uitga naar het veld, zie ik daar de verslagenen van het zwaard, en als ik in de stad kom, zie ik daar de zieken van honger! Ja, zowel de profeten als de priesters trekken rond in het land, en weten geen raad.","19":"Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking.","20":"HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd.","21":"Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.","22":"Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen."},"SV":{"1":"Het woord des HEEREN, dat tot Jeremia geschied is, over de zaken der grote droogte.","2":"Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed ter aarde toe, en Jeruzalems geschrei klimt op.","3":"En hun voortreffelijken zenden hun kleinen naar water; zij komen tot de grachten, zij vinden geen water, zij komen *met* hun vaten ledig weder; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.","4":"Omdat het aardrijk gescheurd is, dewijl er geen regen op de aarde is; de akkerlieden zijn beschaamd, zij bedekken hun hoofd.","5":"Want ook de hinden in het veld werpen jongen, en verlaten *die*, omdat er geen jong gras is.","6":"En de woudezels staan op de hoge plaatsen, zij scheppen den wind gelijk de draken; hun ogen versmachten, omdat er geen kruid is.","7":"Hoewel onze ongerechtigheden tegen ons getuigen, o HEERE! doe *het* om Uws Naams wil; want onze afkeringen zijn menigvuldig, wij hebben tegen U gezondigd.","8":"O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! waarom zoudt Gij zijn als een vreemdeling in het land, en als een reiziger, *die* *slechts* inkeert om te vernachten?","9":"Waarom zoudt Gij zijn als een versaagd man, als een held, *die* niet kan verlossen? Gij zijt toch in het midden van ons, o HEERE! en wij zijn naar Uw Naam genoemd, verlaat ons niet.","10":"Alzo zegt de HEERE van dit volk: Zij hebben zo liefgehad te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij hunner ongerechtigheden gedenken, en hun zonden bezoeken.","11":"Wijders zeide de HEERE tot mij: Bid niet voor dit volk ten goede.","12":"Ofschoon zij vasten, Ik zal naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, Ik zal aan hen geen welgevallen hebben; maar door het zwaard, en door den honger, en door de pestilentie zal Ik hen verteren.","13":"Toen zeide ik: Ach, Heere HEERE! zie, die profeten zeggen hun: Gij zult geen zwaard zien, en gij zult geen honger hebben; maar Ik zal u een gewissen vrede geven in deze plaats.","14":"En de HEERE zeide tot mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, noch hun bevel gegeven, noch tot hen gesproken; zij profeteren ulieden een vals gezicht, en waarzegging, en nietigheid, en bedriegerij huns harten.","15":"Daarom zegt de HEERE alzo: Aangaande de profeten, die in Mijn Naam profeteren, daar Ik hen niet gezonden heb, en zij *dan* *nog* zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelve profeten zullen door het zwaard en door den honger verteerd worden.","16":"En het volk, tot hetwelk zij profeteren, zullen op de straten van Jeruzalem weggeworpen zijn vanwege den honger en het zwaard; en er zal niemand zijn, die hen begrave, hen, hun vrouwen, en hun zonen, en hun dochteren; alzo zal Ik hun boosheid over hen uitstorten.","17":"Daarom zult gij dit woord tot hen zeggen: Mijn ogen zullen van tranen nederdalen nacht en dag, en niet ophouden; want de jonkvrouw der dochter Mijns volks is gebroken *met* een grote breuk, een plage, die zeer smartelijk is.","18":"Zo ik uitga in het veld, ziet daar de verslagenen van het zwaard, en zo ik in de stad kome, ziet daar de kranken van honger! Ja, zowel de profeten als de priesters lopen om in het land, en weten niet.","19":"Hebt Gij dan Juda ganselijk verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt Gij ons geslagen, dat er geen genezing voor ons is? Men wacht naar vrede, maar daar is niets goeds, en naar tijd van genezing, maar ziet, daar is verschrikking.","20":"HEERE! wij kennen onze goddeloosheid, *en* onzer vaderen ongerechtigheid, want wij hebben tegen U gezondigd.","21":"Versmaad *ons* niet, om Uws Naams wil; werp den troon Uwer heerlijkheid niet neder; gedenk, vernietig niet Uw verbond met ons.","22":"Zijn er onder de ijdelheden der heidenen, die doen regenen, of kan de hemel druppelen geven? Zijt Gij die niet, o HEERE, onze God? Daarom zullen wij op U wachten, want Gij doet al die dingen."},"KJV":{"1":"The word of the LORD that came to Jeremiah concerning the dearth.","2":"Judah mourneth, and the gates thereof languish; they are black unto the ground; and the cry of Jerusalem is gone up.","3":"And their nobles have sent their little ones to the waters: they came to the pits, *and* found no water; they returned with their vessels empty; they were ashamed and confounded, and covered their heads.","4":"Because the ground is chapt, for there was no rain in the earth, the plowmen were ashamed, they covered their heads.","5":"Yea, the hind also calved in the field, and forsook *it*, because there was no grass.","6":"And the wild asses did stand in the high places, they snuffed up the wind like dragons; their eyes did fail, because *there was* no grass.","7":"O LORD, though our iniquities testify against us, do thou *it* for thy name's sake: for our backslidings are many; we have sinned","8":"O the hope of Israel, the saviour thereof in time of trouble, why shouldest thou be as a stranger in the land, and as a wayfaring man *that* turneth aside to tarry for a night?","9":"Why shouldest thou be as a man astonied, as a mighty man *that* cannot save? yet thou, O LORD, *art* in the midst of us, and we are called by thy name; leave","10":"Thus saith the LORD unto this people, Thus have they loved to wander, they have not refrained their feet, therefore the LORD doth not accept them; he will now remember their iniquity, and visit their sins.","11":"Then said the LORD unto me, Pray not for this people for *their* good.","12":"When they fast, I will not hear their cry; and when they offer burnt offering and an oblation, I will not accept them: but I will consume them by the sword, and by the famine, and by the pestilence.","13":"Then said I, Ah, Lord GOD! behold, the prophets say unto them, Ye shall not see the sword, neither shall ye have famine; but I will give you assured peace in this place.","14":"Then the LORD said unto me, The prophets prophesy lies in my name: I sent them not, neither have I commanded them, neither spake unto them: they prophesy unto you a false vision and divination, and a thing of nought, and the deceit of their heart.","15":"Therefore thus saith the LORD concerning the prophets that prophesy in my name, and I sent them not, yet they say, Sword and famine shall not be in this land; By sword and famine shall those prophets be consumed.","16":"And the people to whom they prophesy shall be cast out in the streets of Jerusalem because of the famine and the sword; and they shall have none to bury them, them, their wives, nor their sons, nor their daughters: for I will pour their wickedness","17":"Therefore thou shalt say this word unto them; Let mine eyes run down with tears night and day, and let them not cease: for the virgin daughter of my people is broken with a great breach, with a very grievous blow.","18":"If I go forth into the field, then behold the slain with the sword! and if I enter into the city, then behold them that are sick with famine! yea, both the prophet and the priest go about into a land that they know","19":"Hast thou utterly rejected Judah? hath thy soul lothed Zion? why hast thou smitten us, and *there is* no healing for us? we looked for peace, and *there is* no good; and for the time of healing, and behold trouble!","20":"We acknowledge, O LORD, our wickedness, *and* the iniquity of our fathers: for we have sinned","21":"Do not abhor *us*, for thy name's sake, do not disgrace the throne of thy glory: remember, break not thy covenant","22":"Are there *any* among the vanities of the Gentiles that can cause rain? or can the heavens give showers? *art* not thou he, O LORD our God? therefore we will wait upon thee: for thou hast made"}},"tsk":{"1":[{"kopje":"de grote droogte","refs":["Jer 17:8"]}],"2":[{"kopje":"treurt","refs":["Jer 4:28","Jer 12:4","Jes 3:26","Hos 4:3","Joël 1:10"]},{"kopje":"haar poorten","refs":["Jes 24:4","Jes 24:7","Jes 33:9"]},{"kopje":"zij"  wl-kjv\" data-code=\"H7725\">returned</span> with their <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> <span class=\"wl wl-kjv\" data-code=\"H7387\">empty;</span> they were <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> and <span class=\"wl wl-kjv\" data-code=\"H3637\">confounded,</span> and <span class=\"wl wl-kjv\" data-code=\"H2645\">covered</span> their heads.","4":"Because the <span class=\"wl wl-kjv\" data-code=\"H127\">ground</span> is <span class=\"wl wl-kjv\" data-code=\"H2865\">chapt,</span> for there was no <span class=\"wl wl-kjv\" data-code=\"H1653\">rain</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> the <span class=\"wl wl-kjv\" data-code=\"H406\">plowmen</span> were <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed,</span> they <span class=\"wl wl-kjv\" data-code=\"H2645\">covered</span> their heads.","5":"Yea, the <span class=\"wl wl-kjv\" data-code=\"H365\">hind</span> also <span class=\"wl wl-kjv\" data-code=\"H3205\">calved</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and <span class=\"wl wl-kjv\" data-code=\"H5800\">forsook</span> it, because there was no grass.","6":"And the wild <span class=\"wl wl-kjv\" data-code=\"H6501\">asses</span> did <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> in the high <span class=\"wl wl-kjv\" data-code=\"H8205\">places,</span> they snuffed <span class=\"wl wl-kjv\" data-code=\"H7602\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> like <span class=\"wl wl-kjv\" data-code=\"H8577\">dragons;</span> their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> did <span class=\"wl wl-kjv\" data-code=\"H3615\">fail,</span> because there was no grass.","7":"O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> though our <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">testify</span> against us, <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> thou it for thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name's</span> sake: for our <span class=\"wl wl-kjv\" data-code=\"H4878\">backslidings</span> are <span class=\"wl wl-kjv\" data-code=\"H7231\">many;</span> we have sinned","8":"O the <span class=\"wl wl-kjv\" data-code=\"H4723\">hope</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> the <span class=\"wl wl-kjv\" data-code=\"H3467\">saviour</span> thereof in <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H6869\">trouble,</span> why shouldest thou be as a <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and as a wayfaring <span class=\"wl wl-kjv\" data-code=\"H732\">man</span> that turneth <span class=\"wl wl-kjv\" data-code=\"H5186\">aside</span> to tarry for a night?","9":"Why shouldest thou be as a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H1724\">astonied,</span> as a mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">save?</span> yet thou, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> art in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of us, and we are <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> by thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name;</span> leave","10":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Thus have they <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> to <span class=\"wl wl-kjv\" data-code=\"H5128\">wander,</span> they have not <span class=\"wl wl-kjv\" data-code=\"H2820\">refrained</span> their <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> doth not <span class=\"wl wl-kjv\" data-code=\"H7521\">accept</span> them; he will now <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> their sins.","11":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H6419\">Pray</span> not for this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> for their good.","12":"When they <span class=\"wl wl-kjv\" data-code=\"H6684\">fast,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> their <span class=\"wl wl-kjv\" data-code=\"H7440\">cry;</span> and when they <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> and an <span class=\"wl wl-kjv\" data-code=\"H4503\">oblation,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H7521\">accept</span> them: but I will <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> them by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and by the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> and by the pestilence.","13":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I, <span class=\"wl wl-kjv\" data-code=\"H162\">Ah,</span> <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD!</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Ye shall not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> neither shall ye have <span class=\"wl wl-kjv\" data-code=\"H7 st":"O Gij enige ware God, in wien alleen uwe kerk hare hoop stelt, en van wien zij in hare noden behoort en pleegt hulp te verwachten en te ontvangen. Alzo onder Jer 17:13 , en Jer 50:7 . Vergelijk onder vs.22."},{"catchword":"vreemdeling","tekst":"Dat is, U houden alsof Gij niet meer bewogen waart over onzen staat als een vreemde, of iemand, die maar door het land passeert enz., daar Gij immers onder ons uw vaste woning hebt genomen, gelijk volgt."},{"catchword":"reiziger,","tekst":"Of, reizende [man], wandelaar."}],"9":[{"catchword":"versaagd man,","tekst":"Of, verbaasd, die geen raad weet. Anders: afgemat. Het Hebreeuwse woord wordt alleenlijk hier gevonden."},{"catchword":"naar Uw Naam","tekst":"Gelijk boven Jer 7:10 ."}],"10":[{"catchword":"van dit volk","tekst":"Dit is Gods antwoord op de voorbede van Jeremia."},{"catchword":"zwerven,","tekst":"Nu naar vreemde heidense volken, dan naar allerlei afgoden, om hulp te zoeken. Zie boven Jer 2:36 , enz."},{"catchword":"nu zal Hij","tekst":"Dat is, al haast zal Hij hen straffen. Zie Hos 10:3 ."},{"catchword":"gedenken,","tekst":"Zie Gen 8:1 , en vergelijk Hos 8:13 , en Hos 9:9 ."},{"catchword":"bezoeken","tekst":"Dat is, straffen. Zie Gen 21:1 ."}],"11":[{"catchword":"ten goede","tekst":"Tot hun best, dat Ik hen langer zou verschonen; versta dit ten aanzien van de onbekeerlijken, waardoor God het ganse volk wil vertonen hoezeer Hij op hen vertoornd was, om de bekeerlijken te bewegen tot boetvaardigheid."}],"13":[{"catchword":"profeten","tekst":"Versta, valse profeten, gelijk volgt. Zie boven Jer 5:31 , en Jer 6:13 ."},{"catchword":"zwaard zien,","tekst":"Dat is, geen geweld noch overlast van krijg of oorlog ondervinden, of zulks zal u niet overkomen. Zie Job 7:7 , en onder Jer 42:14 ."},{"catchword":"honger hebben;","tekst":"Dat is, hongersnood."},{"catchword":"Ik zal u","tekst":"Alsof God zelf dit gesproken had."},{"catchword":"gewissen vrede","tekst":"Hebreeuws, vrede der waarheid, gewisheid, trouw; dat is, een ongetwijfelden, gewissen, vasten vrede, dat is, zekeren welstand."}],"14":[{"catchword":"vals gezicht,","tekst":"Hebreeuws, gezicht der valsheid, of der leugen."},{"catchword":"waarzegging,","tekst":"Zie Deu 18:10 ; Eze 13:2-3 , Eze 13:7-9 , met de aantekening."},{"catchword":"nietigheid,","tekst":"Van het Hebreeuwse woord elil, dat een nietig ding, of nietigheid betekent, worden de afgoden ook genoemd elilim. Zie Lev 19:4 ."}],"16":[{"catchword":"boosheid","tekst":"Of, hun kwaad; dat is, de straf hunner boosheid; gelijk boven Jer 11:12 , beide in enen zin."},{"catchword":"uitstorten","tekst":"Vergelijk boven Jer 10:25 ."}],"17":[{"catchword":"nederdalen","tekst":"Gelijk boven Jer 9:18 ."},{"catchword":"jonkvrouw","tekst":"Dat is, mijn volk, of mijne landslieden. Of, [gelijk sommigen] de staat mijns volks, dat hij, naar den stijl der vrouw, vanwege hare schoonheid, tederheid en aangenaamheid, ten aanzien van den staat, die hun van God gegeven was; of [gelijk sommigen] omdat zij nog nooit ganselijk overwonnen en verwoest waren. Zie 2Ki 19:21 . Anders: de jonkvrouw, de dochter van mijn volk."},{"catchword":"breuk,","tekst":"Zie boven Jer 4:6 ."},{"catchword":"plage, die zeer smartelijk is","tekst":"Of wonde, die zeer pijnlijk, weedoende, zerig, en voorts gevaarlijk is; alzo boven Jer 10:19 , onder Jer 30:12 ; Nah 3:19 ."}],"18":[{"catchword":"kranken","tekst":"Hebreeuws, krankheden. Zie Job 24:20 ."},{"catchword":"zowel de profeten","tekst":"Hebreeuws, ook de profeet, ook de priester."},{"catchword":"weten niet","tekst":"Dat is, weten geen raad, weten niet wat zij zullen doen of laten, dien het betaamde dit kwaad te verbeteren. Anders: want beiden, profeten en priesters, drijven kramerij tegen het land, en zij [het volk] merken het niet; te weten dat zij hen met valse profetieën uitputten en bedriegen. Vergelijk boven Jer 5:31 ."}],"19":[{"catchword":"ganselijk verworpen?","tekst":"Hebreeuws, verwerpende, verworpen?"},{"catchword":"genezing","tekst":"Of, medicijn, remedie."}],"21":[{"catchword":"werp den","tekst":"Of, kleinacht niet, laat niet vervallen, of verwelken, onteer niet."},{"catchword":"troon","tekst":"Uwen tempel, Jeruzalem, Juda, waar Gij uwe zitplaats genomen en uwe eer geopenbaard hebt; of, men kan hierdoor verstaan de ark des verbonds, gelijk Psa 63:3 , en Psa 78:61 ."},{"catchword":"gedenk,","tekst":"Te weten van uw verbond."},{"catchword":"vernietig","tekst":"Of, maak niet krachteloos, breek niet, het verbond dat Gij met ons gemaakt hebt."}],"22":[{"catchword":"ijdelheden","tekst":"Dat is, kunnen de afgoden regen geven? Zie 1Ki 16:13 , en 2Ki 17:15 . Hij wil zeggen: Geenszins. Zie Gen 18:17 ."},{"catchword":"druppelen","tekst":"Of, regenschuren."},{"catchword":"geven?","tekst":"Te weten van zichzelven?"},{"catchword":"die niet,","tekst":"Dat is, het is immers ontwijfelbaar waar, dat Gij die zijt, die zulks alleen doet. Zie Gen 13:9 ."},{"catchword":"U wachten,","tekst":"Dat Gij ons den nodigen regen geeft, want Gij zijt onze verwachting [boven vs.8], gelijk in alle andere noden, alzo ook in deze droogte, waarvan boven in het begin van het hfdst. gesproken is."},{"catchword":"doet al die dingen","tekst":"Of, Gij hebt al die dingen gemaakt; regen en droogte, enz. komen van U."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The word of the LORD, that came to Jeremia, concerning the matters of the great drought, restraints, cutting off, hinderances, with&acirc;&euro;&ldquo;holdings; to wit, of rain dew, (see above chap 3.3) whence drought and dearth must needs follow, so as that the Hebrew word, is likewise taken for it. Compare below chap. 17.8. and see the signification of the original word, Gen 11:6. Job 44:2, &c.]"}],"2":[{"catchword":null,"tekst":"Juda [That is the people, or the land of Juda, He speaketh here of Judah as of a woman] mourneth, and her gates [That is, Cities, and consequently, the inhabitants, or the Judges, and the people that were wont to meet together in the gates. See Genes.22 on vers.17.] are weakened, [Or, languish, are growth faint] they are clothed in black unto the ground: [Or, lie on the ground in black, for a token of mourning. see Job 5. on vers. 11 and Psal 3.5 on verse.14.] and the cry of Jerusalem goeth up. [Increaseth, waxeth greater and greater;by reason of the great misery, that is seen everywhere in the Land; in regard of drought and want both among great and small, as followeth]"}],"3":[{"catchword":null,"tekst":"And their excellent ones [Or, illustrious, glorious ones, &c. See Psal 8. on vers.2.] send their little ones [That is, servants] to the water: they come to the pits [Or, ponds] they finde no water, they return with their vessels empty; they are ashamed: yea blush and cover their head, [Or, wrap their head about, in token of shame and mourning See 2 Sam 15. on vers. 30. so in the next verse]"}],"4":[{"catchword":null,"tekst":"Because the ground in chapt [Or, hurst, split] seeing there is no rain on the earth: the husbandmen are ashamed, they cover their head ."}],"5":[{"catchword":null,"tekst":"For also the hindes cast (their) young ones in the field, [Hebr, the hinde bringeth forth &c] for sake (them) because there is no young grasse."}],"6":[{"catchword":null,"tekst":"And the wild Asses stand upon the high places, they draw in the winde [As above chap. 2. 24. refreshing themselves therewith, in stead of moist-grasse, or water] like the Dragons: [Which draw in and put forth their breath strongly, as some do write of them] their eyes fail, because there is no herb."}],"7":[{"catchword":null,"tekst":"Though [Or, seeing, surely] our iniquities testify against us, [Compare Isa 59.12. Hos. 5.5. and 7. 10.] O LORD , do (it) for thy Names sake: [As if the Prophet should say, if our sins stand in thy way, that thou canst not shew mercy to us, then take and find cause in thine own self, and do it for thy precious Names sake, that thine unsearchable mercy and long suffering may extolled by the godly, and that thy Name may not be blasphemed by the enemies. This is the Prophet intercession for the people] for our backslidings are manifold, [Or, great] we have sinned against thee."}],"8":[{"catchword":null,"tekst":"O the expectation of Israel, [Thou onely true God, in whom alone thy Church petteth her hope and trust, and from whom she ought and wont to look for help in her necessities. So below chap. 17.13 and 50.7. Compare below verse. 22] the deliverer thereof in time of trouble! why shouldest thou be as stranger in the land? as traveller, [Or, way faring man walker] (that onely) turneth in to overnight?[That is, why shouldest thou demean thyself, as if thou wert no more moved at our condition, then a stranger, or one that passeth thorow the Land, etc whereas thou hast taken up thy constant dwelling amongst us, as followeth]"}],"9":[{"catchword":null,"tekst":"Why shouldest thou be us man astonied? [Or, amazed, that is void of counsel, and knoweth not what to do. Oth, wearied. The Hebrew word is onely found here] as a Champion, that cannot deliver? yet thou art in the midst of us, O LORD, and we are called by thy Name, [As above chap. 7.10.] leave us not."}],"10":[{"catchword":null,"tekst":"Thus saith the LORD, concerning this people [ Here followeth Gods answer to intercession] Thus have they loved to wander [ Sometimes to strange heathenish nations, and sometimes to all manner of Idols, to seek help of them, See above chapter 2. 36, etc.] they have not refrained their feet: therefore thhe LORD hath not pleasure in them, he will now remember [ See Genes. 8. on vers.1. and compare Hos. 8.13. and 9.9.] their iniquity, [That is, he will soon punish them. See Hos. 10. on vers.3.] and visit [That is, punish. See Genes. 21 on vers1.] their sins."}],"11":[{"catchword":null,"tekst":"Moreover, the LORD saith unto me: Pray not for this people for good.[For their good, that is should spare them any longer. Understand this of those that were incorrigible, whereby God will shew unto all the people, how greatly he was displeased with them, to move them that were corrigible to repentance]"}],"12":[{"catchword":null,"tekst":"Though they fast, I will not hearken to their cry. [compare Prov 1.28. Isa 1.15. above chap. 11.11. Ezech 8.18. Mic 3:4.] though they offer burnt &acirc;&euro;&ldquo; offering and meat offering, I will not accept them; Compare above chap 6. 20. and 7.21,22.] but I will consume them by the sword, and by the famine, and by the pestilence."}],"13":[{"catchword":null,"tekst":"Then said I; Ah Lord LORD, behold, those Prophets [Meaning false prophets, as followeth. See above chap. 5.31 and 6.23.] say unto them , ye shall not see the sword, [That is, ye shall not have experience of the voilence, and cruelty of war, or, it shall not come upon you. See Job 9. on vers. 7. and below chap. 42.14.] neither shall ye have famine; but I will give you [As if God himself had spoken this] assured peace, [Hebr. peace of truth, assurance, faithfulness; that is, undoubted, assured, firm peace; that is, sure prosperity] in this place."}],"14":[{"catchword":null,"tekst":"And the LORD said unto me; These Prophets prophesie false in my Name;I have sent them, nor given them command, nor spoken to them. [Compare below chap. 23. 21. and 27.15. and 29. 8,9] they prophesie unto you a false vision,[Hebr.vision of falshood] and divination, [See Deut.18. 10. Ezech 13.2,3,7,89. with the annotat] and a thing of nought , or , nothing, are the Idols also called Elilim. See Levit 19. on vers.4.]"}],"15":[{"catchword":null,"tekst":"Therefore thus saith the LORD; concerning the Prophhets, that prophesie in my Name, whereas I sent them not, and (yet) they say, There shall be no sword nor famine in this land : those very Prophets shall be consumed by the sword, and by the famine."}],"16":[{"catchword":null,"tekst":"And the people, to whom they prophesie, shall be cast away in the street of Jerusalem, because of the famine and the sword; and there shall be none to bury them, them, their wive // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
