 tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken. Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Job 31:7": "Als mijn gang uit de weg geweken is, en mijn hart mijn ogen nagevolgd is, en aan mijn handen iets aankleeft;", "Gal 5:14": "Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.", "Ps 119:172-174": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid. Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen. O HEERE! ik verlang naar Uw heil, en Uw wet is al mijn vermaking.", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Spr 15:27": "Wie hebzucht najaagt, brengt zijn huis in beroering; maar wie geschenken haat, zal leven.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Spr 31:5": "opdat hij niet drinkt en het vastgestelde vergeet, en de rechtszaak van alle verdrukten verandert.", "Deut 30:16": "Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Zach 1:4": "Wees niet als uw vaderen, tot wie de vorige profeten riepen en zeiden: Zo zegt de HEERE van de heerscharen: Bekeer u toch van uw slechte wegen en uw slechte daden; maar zij hoorden niet, en zij luisterden niet naar Mij, spreekt de HEERE.", "Spr 10:1": "De spreuken van Salomo. Een wijze zoon verblijdt de vader; maar een dwaze zoon is het verdriet van zijn moeder.", "Gen 1:30": "Maar aan al de dieren van de aarde, en aan al het gevogelte van de hemel, en aan al het kruipende gedierte op de aarde, waarin een levende ziel is, heb Ik al het groene gewas tot voedsel gegeven. En het was zo.", "Jes 1:17": "Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Spr 22:9": "Wie goed van oog is, zal gezegend worden; want hij heeft van zijn brood aan de arme gegeven.", "Ezech 11:7-12": "Daarom, zo zegt de Heere HEERE: Uw gedoden, die u in het midden daarvan neergelegd hebt, die zijn het vlees, en deze stad is de pot; maar u zal Ik uit het midden daarvan doen weggaan. U hebt het zwaard gevreesd; en het zwaard zal Ik over u brengen, spreekt de Heere HEERE. Ook zal Ik u uit het midden daarvan doen weggaan, en Ik zal u overgeven in de hand van vreemden; en Ik zal recht onder u doen.", "Deut 15:5": "Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied.", "Jer 12:16": "En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "Ex 24:3": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.", "Spr 22:21": "om u de zekerheid van de woorden van de waarheid bekend te maken, opdat u de woorden van de waarheid kunt beantwoorden aan hen die u zenden?", "Jer 2:26": "Zoals een dief beschaamd wordt, wanneer hij gevonden wordt, zo is het huis van Israël beschaamd; zij, hun koningen, hun vorsten, en hun priesters, en hun profeten;", "1 Kon 10:9": "Geloofd zij de HEERE, uw God, Die behagen in u heeft gehad, om u op de troon van Israël te zetten! Omdat de HEERE Israël in eeuwigheid liefheeft, daarom heeft Hij u tot koning gesteld, om recht en gerechtigheid te doen.", "Ezech 19:3": "Zij trok een van haar welpen groot; het werd een jonge leeuw, die leerde roof te roven, hij at mensen op.", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "Luk 18:20": "U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Neh 5:1-13": "Maar het geroep van het volk en van hun vrouwen was groot, tegen hun broeders, de Joden. Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven. Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "Jes 43:20": "Het gedierte van het veld zal Mij eren, de jakhalzen en de jonge struisvogels; want Ik zal in de woestijn water geven, en rivieren in de wildernis, om Mijn volk, Mijn uitverkorenen te drinken te geven.", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "Jer 7:14": "daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb.", "Jer 25:8-38": "Daarom, zo zegt de HEERE van de heerscharen: Omdat u Mijn woorden niet hebt gehoord; Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden. En Ik zal van hen doen vergaan de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid, het geluid van de molens en het licht van de lamp.", "Ps 105:14-45": "Liet Hij geen mens toe hen te onderdrukken; ook bestrafte Hij koningen om hunnentwil, en zei: Raak Mijn gezalfden niet aan, en doe Mijn profeten geen kwaad. Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "Deut 31:19": "En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël.", "Joh 3:21": "Maar wie de waarheid doet, komt tot het licht, opdat van zijn werken openbaar wordt dat zij in God gedaan zijn.", "2 Kron 3:5": "Het grote huis nu overdekte hij met dennenhout; daarna overtrok hij dat met goed goud; en hij bracht daarop palmen en ketenwerk aan.", "Ezech 19:4": "Dit hoorden de volken van hem, hij werd gegrepen in hun kuil; en zij brachten hem met haken naar Egypteland.", "Jes 30:1-7": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen; Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte. Want de sterkte van Farao zal u tot schaamte zijn, en die toevlucht onder de schaduw van Egypte tot schande.", "2 Kron 19:3": "Toch zijn er goede dingen bij u gevonden; want u hebt de bossen uit het land weggedaan, en uw hart erop gericht om God te zoeken.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Mark 7:9": "En Hij zei tegen hen: U doet inderdaad het gebod van God volledig teniet, opdat u uw overleveringen zou onderhouden.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Ezech 20:21": "Maar die kinderen waren ook opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.", "Deut 4:6": "Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "1 Kon 12:6-15": "En koning Rehabeam hield raad met de oudsten, die voor het aangezicht van zijn vader Salomo gestaan hadden toen hij nog leefde, en zei: Hoe raadt u mij, dat men dit volk antwoorden zal? En zij spraken tegen hem en zeiden: Als u vandaag een knecht van dit volk wilt zijn, en hen dient, en hun antwoordt, en tot hen goede woorden spreekt, dan zullen zij voor altijd uw knechten zijn. Maar hij liet de raad van de oudsten varen, die zij hem gegeven hadden; en hij hield raad met de jongemannen, die met hem opgegroeid waren, die voor zijn aangezicht stonden.", "Deut 17:19": "En het moet bij hem blijven, en hij moet daarin lezen al de dagen van zijn leven; opdat hij de HEERE, zijn God, leert vrezen, om al de woorden van deze wet en deze inzettingen te bewaren en te doen;", "Ps 107:19": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Jer 11:8": "Maar zij hebben niet gehoord, en ook hun oor niet geneigd, maar hebben gewandeld, ieder naar het goeddunken van hun boze hart; daarom heb Ik over hen gebracht al de woorden van dit verbond, dat Ik geboden had te doen, maar zij hebben het niet gedaan.", "Neh 5:19": "Gedenk mij, mijn God, ten goede, alles wat ik voor dit volk gedaan heb.", "Jer 50:19": "En Ik zal Israël terugbrengen naar zijn woning, en hij zal weiden op de Karmel en op de Basan; en zijn ziel zal op het gebergte van Efraïm en Gilead verzadigd worden.", "Jes 30:23-26": "Dan zal Hij uw zaad, waarmee u het land bezaaid hebt, regen geven, en brood van de opbrengst van het land, en dat zal vet en overvloedig zijn; uw vee zal op die dag in een wijde landouwe weiden. En de ossen, en ezelveulens, die het land bewerken, zullen zuiver voeder eten, dat verschud is met de werpschoffel en met de wan. En er zullen op elke hoge berg, en op elke hoge heuvel, beekjes en watervlieten zijn, op de dag van de grote slachting, wanneer de torens vallen zullen.", "2 Kron 6:28-31": "Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren of honigdauw, sprinkhanen en kevers zullen zijn, als iemand van zijn vijanden hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; Elk gebed, elke smeking, die van enig mens, of van al Uw volk Israël gebeuren zal, wanneer zij ieder zijn plaag en zijn smart erkennen, en ieder zijn handen in dit huis uitbreiden zal; Hoor U dan uit de hemel, de vaste plaats van Uw woning, en vergeef, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van de kinderen der mensen;", "Ps 147:8": "Die de hemel met wolken bedekt, Die voor de aarde regen klaarmaakt; Die het gras op de bergen laat opkomen;", "Jes 13:3-5": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger. Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "Joh 17:17": "Heilig hen in Uw waarheid; Uw woord is de waarheid.", "Matt 13:33": "Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "Ex 23:6": "U zult het recht van uw arme niet buigen in zijn geschil.", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "1 Kon 8:35": "Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij op deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Neh 9:27-37": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten. Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered. En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.", "Ef 6:17": "En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.", "Luk 7:14": "En Hij kwam erbij en raakte de baar aan; (de dragers stonden toen stil) en Hij zei: Jongeman, Ik zeg u: sta op!", "Ezech 22:29": "Het volk van het land pleegt enkel verdrukking en bedrijft enkel roverij, ook onderdrukken zij de ellendige en de arme, en de vreemdeling verdrukken zij zonder recht.", "Job 29:7-17": "Toen ik uitging naar de poort door de stad, toen ik mijn stoel op de straat liet klaarzetten. De jongens zagen mij en verstopten zich, en de stokouden stonden op en bleven staan. De leiders hielden hun woorden in, en legden de hand op hun mond.", "Deut 22:7": "U zult de moeder zeker laten gaan; maar de jongen mag u voor uzelf nemen; opdat het u goed gaat, en u de dagen verlengt.", "Job 22:24": "Dan zult u het goud op het stof leggen, en het goud van Ofir bij de rotssteen van de beken;", "Spr 30:6": "Voeg niets toe aan Zijn woorden, opdat Hij u niet bestraft, en u leugenachtig wordt bevonden.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Jer 8:19": "Zie, de stem van het geschrei van de dochter van mijn volk klinkt uit een zeer ver land: Is de HEERE dan niet in Sion, is haar Koning niet bij haar? Waarom hebben zij Mij vertoornd met hun gesneden beelden, met de nietige afgoden van de vreemden?", "Ps 82:5": "Zij weten niet, en verstaan niet; zij wandelen steeds in duisternis; daardoor wankelen alle fundamenten van de aarde.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Lev 19:16-18": "U zult niet rondgaan als een kwaadspreker onder uw volken; u zult niet opstaan tegen het bloed van uw naaste; Ik ben de HEERE! U zult uw broeder in uw hart niet haten; u zult uw naaste zeker berispen, en zult de zonde in hem niet laten voortbestaan. U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "Matt 23:35-38": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar. Voorwaar, Ik zeg u: Al deze dingen zullen komen over dit geslacht. Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Zach 11:1": "Doe uw deuren open, o Libanon! Opdat het vuur uw ceders verteert.", "Jer 1:11-16": "Verder kwam het woord van de HEERE tot mij, en zei: Wat ziet u, Jeremia? En ik zei: Ik zie een amandelroede. En de HEERE zei tegen mij: U hebt goed gezien; want Ik zal wakker zijn over Mijn woord, om dat te doen. En het woord van de HEERE kwam voor de tweede keer tot mij, en zei: Wat ziet u? En ik zei: Ik zie een ziedende pot, waarvan het voorste deel tegen het noorden gekeerd is.", "Ezech 33:28": "Want Ik zal het land tot een verwoesting en een schrik maken, en aan de trots van zijn kracht zal een einde komen; en de bergen van Israël zullen woest zijn, zodat niemand er meer doorheen trekt.", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Spr 14:20": "De arme wordt zelfs door zijn vriend gehaat; maar de liefhebbers van de rijke zijn met velen.", "Micha 6:12": "Omdat haar rijke lieden vol zijn van geweld, en haar inwoners leugen spreken, en hun tong bedrieglijk is in hun mond,", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Ex 23:26": "Er zal geen vrouw zijn die een miskraam heeft, of onvruchtbaar is, in uw land; Ik zal het getal van uw dagen vervullen.", "Mark 7:13": "Zo maakt u Gods woord krachteloos door uw overlevering, die u heeft ingesteld; en vele dergelijke dingen doet u.", "2 Kron 34:2": "En hij deed wat recht was in de ogen van de HEERE, en wandelde in de wegen van zijn vader David, en week niet af naar rechts of naar links.", "Jer 20:5": "Ook zal Ik al het bezit van deze stad geven, en al haar opbrengst, en al haar kostbaarheden, en alle schatten van de koningen van Juda, Ik zal ze geven in de hand van hun vijanden, die zullen ze roven, ze meenemen en ze naar Babel brengen.", "Deut 21:1-9": "Wanneer in het land, dat de HEERE, uw God, u geven zal om dat te erven, iemand gevonden wordt die gedood is, liggend in het veld, zonder dat bekend is wie hem gedood heeft; Dan zullen uw oudsten en uw rechters uitgaan, en zij zullen meten naar de steden die rondom de gedode liggen. De stad nu die het dichtst bij de gedode ligt, daar zullen de oudsten van die stad een jonge koe nemen waarmee niet gewerkt is, die aan het juk niet getrokken heeft.", "Ps 12:6": "Om de verwoesting van de ellendigen, om het kermen van de behoeftigen, zal Ik nu opstaan, zegt de HEERE; Ik zal in veiligheid zetten wie ernaar snakt.", "Spr 15:25": "Het huis van de hoogmoedigen zal de HEERE afbreken; maar het gebied van de weduwe zal Hij vastzetten.", "Luk 7:35": "Doch de wijsheid is in het gelijk gesteld door al haar kinderen.", "Jer 5:15": "Zie, Ik zal over u een volk van verre brengen, o huis van Israël! spreekt de HEERE; het is een sterk volk, het is een zeer oud volk, een volk waarvan u de taal niet zult kennen, en niet zult horen wat het spreken zal.", "1 Joh 2:15-17": "Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem. Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld. En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Matt 7:24": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft;", "Spr 6:17": "hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten;", "Matt 6:1-4": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is. Wanneer u dan aalmoes doet, laat het dan niet voor u uittrompetten, zoals de geveinsden doen in de synagogen en op de straten, opdat zij door de mensen geëerd worden. Voorwaar, Ik zeg u: zij hebben hun loon al ontvangen. Maar als u aalmoes doet, laat uw linkerhand dan niet weten wat uw rechterhand doet;", "Luk 6:47": "Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt.", "1 Kor 13:6": "Zij verblijdt zich niet in de ongerechtigheid, maar zij verblijdt zich in de waarheid;", "Spr 29:21": "Als men zijn knecht van jongs af aan verwend behandelt, zal hij uiteindelijk als een zoon willen zijn.", "Luk 24:45": "Toen opende Hij hun verstand, zodat zij de Schriften begrepen.", "Matt 15:3": "Maar Hij antwoordde en zei tegen hen: Waarom overtreedt u ook het gebod van God, door uw overlevering?", "Gal 1:12": "Want ik heb het ook niet van een mens ontvangen, ook niet geleerd, maar door de openbaring van Jezus Christus.", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Jes 10:34": "En Hij zal met ijzer de verwarde struiken van het woud omhouwen; en de Libanon zal vallen door de Heerlijke.", "Deut 29:5": "En Ik heb u veertig jaren doen wandelen in de woestijn; uw kleren zijn u niet versleten, en uw schoen is niet versleten aan uw voet.", "Jer 4:20": "Ondergang op ondergang wordt uitgeroepen; want het hele land is verwoest; haastig zijn mijn tenten verwoest, mijn gordijnen in een ogenblik!", "Hand 7:34-36": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden. Deze Mozes, die zij verloochend hadden door te zeggen: Wie heeft u tot leider en rechter gesteld? — deze heeft God tot leider en verlosser gezonden, door de hand van de engel die hem verschenen was in de doornstruik. Deze heeft hen uitgeleid, en deed wonderen en tekenen in het land van Egypte, en in de Rode Zee, en in de woestijn, veertig jaar lang.", "Ps 147:15": "Hij zendt Zijn bevel over de aarde; Zijn woord loopt zeer snel.", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "Joh 6:63": "De Geest is het Die levend maakt; het vlees heeft geen nut. De woorden die Ik tot u spreek, zijn geest en zijn leven.", "1 Kon 8:33": "Wanneer Uw volk Israël verslagen wordt voor het aangezicht van de vijand, omdat zij tegen U gezondigd zullen hebben, en zich tot U bekeren, en Uw Naam belijden, en tot U in dit huis bidden en smeken zullen;", "Spr 19:26": "Wie zijn vader verwoest, of zijn moeder verjaagt, is een zoon die beschaamd maakt, en schande aandoet.", "Hos 14:4": "Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Jer 8:10": "Daarom zal Ik hun vrouwen aan anderen geven, hun akkers aan andere bezitters; want van de kleinste tot de grootste toe pleegt ieder van hen gierigheid; van de profeet tot de priester toe bedrijft ieder van hen valsheid.", "Spr 13:7": "Er is iemand die zichzelf rijk maakt, en toch niets heeft, en iemand die zichzelf arm maakt, en toch veel goed heeft.", "Ps 68:11": "Uw kudde woonde daarin; U bereidde het door Uw goedheid voor de ellendige, o God!", "Neh 5:8": "En ik zei tegen hen: Wij hebben onze broeders, de Joden, die aan de heidenen verkocht waren, naar ons vermogen teruggekocht; en zouden u ook uw broeders verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij en vonden geen antwoord.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "1 Joh 3:12": "Niet zoals Kaïn, die uit de boze was en zijn broeder doodsloeg; en waarom sloeg hij hem dood? Omdat zijn werken slecht waren, en die van zijn broeder rechtvaardig.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Ezech 14:1-14": "Daarna kwamen er tot mij mannen uit de oudsten van Israël, en zij gingen voor mijn aangezicht zitten. Toen kwam het woord van de HEERE tot mij en Hij zei: Mensenkind, deze mannen hebben hun drekgoden in hun hart opgezet, en hebben de aanstoot van hun ongerechtigheid recht voor hun aangezicht gezet; zou Ik dan werkelijk door hen geraadpleegd worden?", "Jes 65:3": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Jer 22:13-19": "Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft! Die zegt: Ik zal mij een zeer hoog huis bouwen, en ruime bovenzalen; en hij houwt er zich vensters in uit, en het is bedekt met ceder, en aangestreken met menie. Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Rom 2:13": "(Want de hoorders van de wet zijn niet rechtvaardig voor God, maar de daders van de wet zullen gerechtvaardigd worden;", "Job 31:28": "Dat ware ook een misdaad bij de rechter; want ik zou de God van boven verzaakt hebben.", "Klaagl 3:34-36": "Lamed. Dat men al de gevangenen van de aarde onder Zijn voeten verbrijzelt; Lamed. Dat men het recht van een man buigt voor het aangezicht van de Allerhoogste; Lamed. Dat men een mens verongelijkt in zijn rechtszaak; zou de Heere dat niet zien?", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "Ezech 35:6": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE; Ik zal u voorzeker tot bloed bestemmen, en het bloed zal u achtervolgen; omdat u het bloed niet hebt gehaat, zal het bloed u ook achtervolgen.", "2 Kon 24:1-6": "In zijn dagen trok Nebukadnezar, de koning van Babel, op, en Jojakim werd zijn dienaar, drie jaar lang; daarna keerde hij zich om en kwam in opstand tegen hem. En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten. Zeker gebeurde dit op bevel van de HEERE tegen Juda, dat Hij hen van Zijn aangezicht wegdeed, om de zonden van Manasse, naar alles wat hij gedaan had;", "Lev 25:18": "En doe Mijn inzettingen, en houd Mijn rechten, en doe die; dan zult u zeker wonen in het land.", "Jer 44:16": "Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen.", "Matt 18:5": "En wie zo'n kind ontvangt in Mijn Naam, die ontvangt Mij.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Dan 10:21": "Doch Ik zal u bekendmaken wat opgetekend is in het geschrift van de waarheid; en er is niemand die zich met Mij sterk maakt tegen dezen, dan uw vorst Michaël.", "1 Petr 3:9-12": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven. Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Jer 18:8-10": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen. Ook zal Ik in een ogenblik spreken over een volk en over een koninkrijk, dat Ik het zal bouwen en planten; Maar als het doet wat kwaad is in Mijn ogen, dat het naar Mijn stem niet luistert, dan zal Ik berouw hebben over het goede waarmee Ik gezegd had hen te zullen weldoen.", "Deut 5:21": "En u zult niet begeren de vrouw van uw naaste; en u zult zich niet laten gelusten naar het huis van uw naaste, zijn akker, noch zijn dienstknecht, noch zijn dienstmaagd, zijn os, noch zijn ezel, noch iets dat van uw naaste is.", "Deut 9:24": "Opstandig bent u geweest tegen de HEERE, vanaf de dag dat ik u gekend heb.", "Ps 81:12": "Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.", "Jes 48:4": "Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;", "2 Kon 9:10": "Ook zullen de honden Izebel eten op het stuk land van Jizreël, en er zal niemand zijn die haar kan begraven. Toen deed hij de deur open en vluchtte.", "Spr 25:13": "Een trouwe gezant is voor hen die hem zenden, als de koelte van sneeuw op de dag van de oogst; want hij verkwikt de ziel van zijn heer.", "Ef 5:3": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "Jer 21:13": "Zie, Ik zál tegen u, inwoonster van het dal, rots van het plein! spreekt de HEERE; u, die zegt: Wie zou tegen ons afkomen, of wie zou komen in onze woningen?", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Job 29:15": "Voor de blinden was ik ogen, en voor de kreupelen was ik voeten.", "2 Tess 2:15": "Welnu dan, broeders, staat vast en houdt vast aan de overleveringen, die u geleerd zijn, hetzij door ons woord, hetzij door onze brief.", "Hos 12:12-15": "Zeker is Gilead ongerechtigheid, zij zijn enkel ijdelheid; te Gilgal offeren zij ossen, ja, hun altaren zijn als steenhopen op de voren van de velden. Jakob vluchtte toch naar het veld van Syrië, en Israël diende om een vrouw, en hoedde de kudde om een vrouw. Maar de Heere voerde Israël op uit Egypte door een profeet, en door een profeet werd hij behoed.", "1 Kron 17:7": "Nu dan, zo zult u zeggen tegen Mijn knecht, tegen David: Zo zegt de HEERE van de heerscharen: Ik heb u van de schaapskooi genomen, van achter de schapen vandaan, opdat u een voorganger over Mijn volk Israël zou zijn;", "Jes 1:29-31": "Want zij zullen beschaamd worden om de eiken, die u begeerd hebt, en u zult schaamrood worden, om de hoven, die u verkozen hebt. Want u zult zijn als een eik, waarvan de bladeren afvallen, en als een hof, die geen water heeft. En de sterke zal worden tot grof vlas, en zijn werkmeester tot een vonk, en zij zullen beide samen branden, en er zal geen uitblusser zijn.", "Jer 22:17-19": "Maar uw ogen en uw hart zijn nergens op gericht dan op uw hebzucht, en op onschuldig bloed, om dat te vergieten, en op verdrukking en geweld, om die te doen. Daarom zegt de HEERE zo van Jojakim, zoon van Josia, koning van Juda: Zij zullen hem niet beklagen: Och, mijn broeder! of, och, zuster! Zij zullen hem niet beklagen: Och, heer! of, och, zijn majesteit! Met een ezelsbegrafenis zal hij begraven worden; men zal hem slepen en wegwerpen, ver weg van de poorten van Jeruzalem.", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Deut 6:25": "En het zal ons gerechtigheid zijn, als wij ernaar streven al deze geboden te doen, voor het aangezicht van de HEERE, onze God, zoals Hij ons geboden heeft.", "Spr 17:26": "Het is niet goed, de rechtvaardige te straffen, laat staan dat men vorsten zou slaan om wat recht is.", "Gen 15:3": "Verder zei Abram: Zie, mij hebt U geen nageslacht gegeven, en zie, de zoon van mijn huis zal mijn erfgenaam zijn!", "Luk 10:7": "En blijf in dat huis, etend en drinkend wat zij u geven; want de arbeider is zijn loon waard. Ga niet van het ene huis naar het andere.", "2 Petr 2:14": "zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Lev 25:19": "En het land zal zijn vrucht geven, en u zult eten tot verzadiging toe; en u zult zeker daarin wonen.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Matt 10:42": "En wie een van deze kleinen slechts een beker koud water te drinken geeft, in de naam van een discipel, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "Ps 68:10": "U hebt zeer milde regen doen druipen, o God! En U hebt Uw erfenis gesterkt, toen zij moe geworden was.", "Jer 48:28": "Verlaat de steden, en woont in de rots, u inwoners van Moab! En word als een duif, die in de doorgangen van de ingang van een hol nestelt.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Matt 5:5": "Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Hos 13:1-4": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven. En nu gaan zij voort met zondigen, en hebben zich van hun zilver een gegoten beeld gemaakt, afgoden naar hun eigen inzicht, die allemaal het werk van smeden zijn; waarvan zij toch zeggen: De mensen die offeren, zullen de kalveren kussen. Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "2 Kron 36:1-4": "Toen nam het volk van het land Joahaz, de zoon van Josia, en zij maakten hem koning in de plaats van zijn vader, te Jeruzalem. Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem. Want de koning van Egypte zette hem af te Jeruzalem, en hij legde het land een boete op van honderd talenten zilver en een talent goud.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Joh 17:8": "Want de woorden die U Mij gegeven hebt, heb Ik hun gegeven, en zij hebben ze ontvangen, en zij hebben werkelijk erkend dat Ik van U ben uitgegaan, en hebben geloofd dat U Mij gezonden hebt.", "Joh 9:41": "Jezus zei tegen hen: Als u blind was, zou u geen zonde hebben; maar nu zegt u: Wij zien; daarom blijft uw zonde.", "Deut 30:1": "Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft;", "Deut 25:1-4": "Wanneer er tussen mannen twist is, en zij naar het gerecht gaan zodat men hen recht spreekt, dan zal men de rechtvaardige rechtvaardig verklaren, en de onrechtvaardige veroordelen. En het zal gebeuren, als de onrechtvaardige slagen verdiend heeft, dat de rechter hem zal laten neervallen, en hem in zijn tegenwoordigheid laten slaan, naar het aantal dat past bij zijn onrechtvaardigheid. Met veertig slagen zal hij hem laten slaan, hij zal er niet meer bij doen; anders zou hij, als hij méér dan dat aantal slagen zou laten geven, uw broeder voor uw ogen verachtelijk maken.", "Pred 4:13": "Beter is een arme en wijze jongeman, dan een oude en dwaze koning, die niet meer weet zich te laten vermanen.", "Spr 1:21": "Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad;", "Ex 24:3-5": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen. Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël. En hij zond de jongelingen van de kinderen Israëls, die brandoffers offerden, en de HEERE dankoffers offerden, van jonge ossen.", "Ps 56:5": "In God zal ik Zijn woord prijzen; ik vertrouw op God, ik zal niet vrezen; wat zou vlees mij doen?", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "1 Tess 5:20": "Veracht de profetieën niet.", "Spr 28:10": "Wie de oprechten doet dwalen op een kwade weg, zal zelf in zijn eigen kuil vallen; maar de vromen zullen het goede beërven.", "Jer 39:8": "En de Chaldeeën verbrandden het huis van de koning en de huizen van het volk met vuur; en zij braken de muren van Jeruzalem af.", "Deut 27:24": "Vervloekt is hij die zijn naaste in het verborgene doodslaat! En heel het volk zal zeggen: Amen.", "2 Petr 2:3": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Hab 2:9-11": "Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad. U hebt schande beraamd voor uw huis; door veel volken uit te roeien hebt u tegen uw eigen ziel gezondigd. Want de steen uit de muur roept, en de balk uit het hout antwoordt hem.", "Ps 104:10-19": "Die de bronnen laat stromen door de dalen, zodat zij tussen de bergen door lopen. Zij drenken al het gedierte van het veld; de wilde ezels lessen er hun dorst mee. Daarbij woont het gevogelte van de hemel, een geluid latend horen van tussen de takken.", "Dan 12:9": "En Hij zei: Ga heen, Daniël! want deze woorden zijn toegesloten en verzegeld tot de tijd van het einde.", "Hoogl 1:17": "De balken van onze huizen zijn ceders, onze galerijen zijn cipressen.", "Jer 50:20-23": "In die dagen en op die tijd, spreekt de HEERE, zal de ongerechtigheid van Israël gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal het vergeven aan hen die Ik zal doen overblijven. Tegen het land Merathaïm, trek tegen haar op, en tegen de inwoners van Pekod; verwoest en verban wie na hen komen, spreekt de HEERE, en doe naar alles wat Ik u geboden heb. Er is een krijgsgeschreeuw in het land, en een grote breuk.", "1 Tim 4:6": "Als u deze dingen aan de broeders voorhoudt, zult u een goede dienaar van Jezus Christus zijn, gevoed door de woorden van het geloof en van de goede leer, die u gevolgd hebt.", "Matt 21:33": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland.", "Ps 94:20": "Zou de troon van het onrecht zich met U verbinden, die moeite verzint bij wet?", "2 Kon 23:25": "En voor hem was er geen koning zijns gelijke, die zich tot de HEERE, met heel zijn hart, en met heel zijn ziel, en met heel zijn kracht, naar heel de wet van Mozes, bekeerd had; en na hem stond zijns gelijke niet op.", "Jer 8:9": "De wijzen zijn beschaamd, verschrikt en gevangen; zie, zij hebben het woord van de HEERE verworpen; wat wijsheid zouden zij dan hebben?", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "1 Tim 1:9": "En als hij dit weet, dat de wet niet gemaakt is voor de rechtvaardige, maar voor de onrechtvaardigen en de weerspannigen, de goddelozen en de zondaars, de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers,", "Ps 136:5-25": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Jer 16:12": "En u erger gedaan hebt dan uw vaders; want zie, u wandelt, ieder naar het goeddunken van zijn slechte hart, om naar Mij niet te horen.", "Spr 29:14": "Een koning die de armen in trouw recht doet, diens troon zal voor eeuwig bevestigd worden.", "Luk 16:17": "En het is lichter dat de hemel en de aarde voorbijgaan, dan dat één tittel van de wet valt.", "Luk 23:28-31": "En Jezus keerde Zich naar hen toe en zei: Dochters van Jeruzalem, weent niet over Mij, maar weent over uzelf, en over uw kinderen. Want zie, er komen dagen waarin men zal zeggen: Zalig zijn de onvruchtbaren, en de buiken die niet gebaard hebben, en de borsten die niet gezoogd hebben. Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Luk 16:1-13": "En Hij zei ook tegen Zijn discipelen: Er was een zeker rijk mens, die een rentmeester had; en deze werd bij hem beschuldigd, dat hij zijn goederen verkwistte. En hij riep hem en zei tegen hem: Hoe hoor ik dit van u? Geef rekenschap van uw rentmeesterschap; want u zult niet meer rentmeester kunnen zijn. En de rentmeester zei bij zichzelf: Wat zal ik doen, omdat mijn heer dit rentmeesterschap van mij afneemt? Graven kan ik niet; te bedelen schaam ik mij.", "Spr 29:12": "Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.", "Jer 26:22-24": "Maar de koning Jojakim zond mannen naar Egypte, Elnathan, de zoon van Achbor, en andere mannen met hem, naar Egypte; Die voerden Uria uit Egypte, en brachten hem tot de koning Jojakim, en hij sloeg hem met het zwaard, en hij wierp zijn dode lichaam in de graven van de kinderen van het volk. Maar de hand van Ahikam, de zoon van Safan, was met Jeremia, zodat men hem niet overgaf in de hand van het volk, om hem te doden.", "Spr 22:27": "Als u niets hebt om te betalen, waarom zou men uw bed van onder u wegnemen?", "Jer 14:1-16": "Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte. Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Jes 59:7": "Hun voeten lopen naar het kwade, en zij haasten zich om onschuldig bloed te vergieten; hun gedachten zijn gedachten van ongerechtigheid, verwoesting en verderf is op hun wegen.", "Job 34:19": "Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "2 Kron 9:8": "Geloofd zij de HEERE, uw God, Die behagen in u gehad heeft, om u op Zijn troon te zetten, tot een koning voor de HEERE, uw God; omdat uw God Israël liefheeft, om het voor eeuwig op te richten, daarom heeft Hij u tot koning over hen gesteld, om recht en gerechtigheid te doen.", "Gal 1:11": "Maar ik maak u bekend, broeders, dat het Evangelie dat door mij verkondigd is, niet naar de mens is.", "Deut 17:6": "Op het woord van twee getuigen, of drie getuigen, zal hij gedood worden die de dood verdient; op het woord van één enkele getuige zal hij niet gedood worden.", "Deut 7:13-24": "en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten; en de HEERE zal alle ziekte van u afweren, en Hij zal u geen van de kwade ziekten van de Egyptenaren, die u kent, opleggen, maar zal ze leggen op allen die u haten.", "Pred 3:13": "Ja ook, dat ieder mens eet en drinkt, en het goede geniet van al zijn arbeid, dit is een gave van God.", "Joh 6:26": "Jezus antwoordde hun en zei: Voorwaar, voorwaar, Ik zeg u: u zoekt Mij niet omdat u tekenen gezien hebt, maar omdat u van de broden gegeten hebt en verzadigd bent.", "Gen 16:6-9": "En Abram zei tegen Sarai: Zie, uw dienstmaagd is in uw hand; doe met haar wat goed is in uw ogen. En Sarai vernederde haar, en zij vluchtte van haar aangezicht. En de Engel van de HEERE vond haar bij een waterbron in de woestijn, bij de bron op de weg naar Sur. En hij zei: Hagar, dienstmaagd van Sarai, waar komt u vandaan, en waar zult u heengaan? En zij zei: Ik vlucht van het aangezicht van mijn meesteres Sarai!", "Jes 25:4": "Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.", "Hab 2:9": "Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad.", "1 Kor 7:6": "Maar dit zeg ik als toegeving, niet als bevel.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "2 Kron 28:23": "Want hij offerde aan de goden van Damascus, die hem geslagen hadden, en zei: Omdat de goden van de koningen van Syrië hen helpen, zal ik hun offeren, opdat zij mij ook helpen; maar zij waren hem tot zijn val, alsook aan heel Israël.", "1 Tim 5:9": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "Jer 21:4-7": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Amos 5:5": "Maar zoek Beth-el niet, en kom niet naar Gilgal, en trek niet over naar Ber-seba; want Gilgal zal zeker in gevangenschap weggevoerd worden, en Beth-el zal tot niets worden.", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "Luk 14:29": "Anders zou het kunnen gebeuren dat, als hij het fundament gelegd heeft en het niet kan afmaken, iedereen die het ziet hem begint te bespotten,", "Dan 11:30": "Want er zullen schepen van Chittim tegen hem komen, daarom zal hij door smart getroffen worden, en hij zal terugkeren, en gram worden tegen het heilige verbond, en hij zal het doen; want bij zijn terugkeer zal hij aandacht geven aan hen die het heilige verbond verlaten.", "Jer 29:17": "Zo zegt de HEERE van de heerscharen: Ziet, Ik zal het zwaard, de honger en de pest onder hen zenden; en Ik zal hen maken als de afschuwelijke vijgen, die vanwege hun slechtheid niet gegeten kunnen worden.", "Amos 4:7-12": "Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Ik heb u geslagen met brandkoren en met honingdauw; de veelheid van uw hoven, en uw wijngaarden, en uw vijgenbomen, en uw olijfbomen at de rups op; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Ps 119:148": "Mijn ogen komen de nachtwaken voor, om Uw rede te betrachten.", "1 Kor 11:2": "En ik prijs u, broeders, dat u in alles aan mij denkt, en de inzettingen behoudt, zoals ik die u overgegeven heb.", "Deut 13:18": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, om al Zijn geboden te houden, die ik u heden gebied, om te doen wat recht is in de ogen van de HEERE, uw God.", "Jer 7:34": "En Ik zal uit de steden van Juda en uit de straten van Jeruzalem doen ophouden de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid; want het land zal tot een verwoesting worden.", "2 Kron 35:25": "En Jeremia maakte een klaaglied over Josia; evenzo spraken alle zangers en zangeressen in hun klaagliederen van Josia, tot op deze dag; want zij gaven ze tot een inzetting in Israël; en zie, zij zijn geschreven in de klaagliederen.", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Jes 1:1-24": "Het visioen van Jesaja, de zoon van Amoz, dat hij zag over Juda en Jeruzalem, in de dagen van Uzzia, Jotham, Achaz en Hizkia, de koningen van Juda. Hoor, hemelen! en neem het ter oor, aarde! Want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd, maar zij hebben tegen Mij overtreden. Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Jer 2:37": "U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen.", "Job 5:6-11": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde; Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen. Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Deut 1:16": "En ik gebood in die tijd uw rechters, en zei: Hoor de geschillen tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling.", "Job 12:23": "Hij vermenigvuldigt de volken, en verdelgt ze; Hij breidt de volken uit, en leidt ze.", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "1 Kron 3:15": "De zonen van Josia nu waren deze: de eerstgeborene Johanan, de tweede Jojakim, de derde Zedekia, de vierde Sallum.", "Hebr 10:24": "en laten wij op elkaar letten, om elkaar aan te sporen tot liefde en goede werken;", "Zach 8:17": "En denk niet, de een over de ander, kwaad in uw hart; en heb een valse eed niet lief; want al deze dingen zijn wat Ik haat, spreekt de HEERE.", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "Ef 6:1-3": "U kinderen, wees uw ouders gehoorzaam in de Heere; want dat is recht. Eer uw vader en moeder (dat is het eerste gebod met een belofte), opdat het u goed gaat, en u lang leeft op de aarde.", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "1 Joh 2:12": "Ik schrijf u, kinderen, want de zonden zijn u vergeven omwille van Zijn Naam.", "Ps 106:34-42": "Zij hebben die volken niet verdelgd, die de HEERE hun gezegd had; maar zij vermengden zich met de heidenen, en leerden daarvan de werken. En zij dienden hun afgoden, en die werden hun tot een strik.", "Deut 16:11": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is, en de vreemdeling, en de wees, en de weduwe die in uw midden zijn; in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen.", "Lev 19:15": "U zult geen onrecht doen in het gericht; u zult het aangezicht van de geringe niet aannemen, noch het aangezicht van de grote voortrekken; in gerechtigheid zult u uw naaste rechtspreken.", "Spr 24:23": "Ook deze spreuken zijn van de wijzen. Het aanzien van personen in het gericht kennen, is niet goed.", "Ps 128:2-6": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel. Zie, zo zal die man zeker gezegend worden, die de HEERE vreest.", "1 Tess 4:11": "En dat u zich beijvert om stil te zijn, en uw eigen zaken te doen, en te werken met uw eigen handen, zoals wij u bevolen hebben;", "Hos 2:21": "En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.", "Jak 5:5": "U hebt lekker geleefd op de aarde, en wellust nagejaagd; u hebt uw harten gevoed als op een dag van slachting.", "Matt 1:12": "En na de Babylonische wegvoering verwekte Jechonia Sealthiël, en Sealthiël verwekte Zerubbabel;", "Matt 6:25": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding?", "Hab 1:16": "Daarom offert hij aan zijn sleepnet, en brandt reukwerk aan zijn net; want daardoor is zijn deel vet geworden, en zijn voedsel smoutig.", "Jak 1:2-4": "Acht het voor grote vreugde, mijn broeders, wanneer u in allerlei verzoekingen valt; Wetend dat de beproeving van uw geloof volharding werkt. Doch de volharding moet een volmaakt werk hebben, opdat u volmaakt bent en geheel oprecht, in geen ding gebrekkig.", "Gen 9:1-3": "En God zegende Noach en zijn zonen, en Hij zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde! En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven. Alles wat zich beweegt, dat leeft, zal u tot voedsel zijn; Ik heb het u allemaal gegeven, zoals het groene kruid.", "Ps 72:12": "Want hij zal de behoeftige redden, die daar roept, alsook de ellendige, en die geen helper heeft.", "Jer 30:23": "Ziet, een storm van de HEERE, een grimmigheid is uitgegaan, een aanhoudende storm; hij zal neerkomen op het hoofd van de goddelozen.", "Jer 30:6": "Vraagt toch en kijkt, of een man een kind baart? Waarom zie Ik dan van ieder man de handen op zijn heupen, als van een barende vrouw, en alle gezichten veranderd in bleekheid?", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "2 Kron 21:19": "Dit gebeurde van jaar tot jaar, zodat, toen de tijd van het einde van de twee jaren aanbrak, zijn ingewanden door de ziekte naar buiten kwamen, en hij stierf aan zware ziekten; en zijn volk maakte voor hem geen vuur, zoals het vuur voor zijn voorouders.", "Gen 9:5": "En zeker, Ik zal uw bloed, het bloed van uw zielen, opeisen; van de hand van elk dier zal Ik het opeisen; ook van de hand van de mens, van de hand van ieders broeder zal Ik de ziel van de mens opeisen.", "Joh 15:6": "Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "Rom 4:23": "Nu is het niet alleen om zijnentwil geschreven, dat het hem toegerekend is;", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "Ps 78:52-55": "En Hij voerde Zijn volk als schapen, en leidde hen, als een kudde, door de woestijn. Ja, Hij leidde hen zeker, zodat zij niet vreesden; want de zee had hun vijanden overdekt. En Hij bracht hen tot het gebied van Zijn heiligheid, tot deze berg, die Zijn rechterhand verkregen heeft.", "Spr 18:23": "De arme spreekt smekingen; maar de rijke antwoordt harde dingen.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Zef 3:5": "De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Job 31:22": "Mijn schouder valt van het schouderbeen, en mijn arm breekt van zijn pijp af!", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Jes 14:24": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan!", "Job 27:13-23": "Dit is het deel van de goddeloze mens bij God, en de erve van de tirannen, die zij van de Almachtige ontvangen zullen. Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden. Zijn overgeblevenen zullen in de dood begraven worden, en zijn weduwen zullen niet wenen.", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "Hos 4:1": "Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is;", "Deut 25:5-10": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen. En het zal gebeuren, dat de eerstgeborene die zij baart, de naam van zijn overleden broer zal dragen; opdat zijn naam niet uitgewist wordt uit Israël. Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Spr 29:19": "Een knecht zal door woorden niet getuchtigd worden; al begrijpt hij het, toch zal hij niet gehoorzamen.", "Jer 14:2": "Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Spr 21:13": "Wie zijn oor stopt voor het geschrei van de arme, die zal ook roepen, en niet verhoord worden.", "2 Sam 12:1": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Ps 37:21": "Lamed. De goddeloze leent en geeft niet terug; maar de rechtvaardige ontfermt zich, en geeft.", "2 Sam 5:21": "En zij lieten hun afgoden daar achter; en David en zijn mannen namen ze mee.", "2 Kron 25:15": "Toen ontstak de toorn van de HEERE tegen Amazia; en Hij zond tot hem een profeet, die tegen hem zei: Waarom hebt u de goden van dat volk gezocht, die hun eigen volk niet gered hebben uit uw hand?", "Job 24:9": "Zij rukken het weesje van de borst, en wat de arme toebehoort, nemen zij te pand.", "Hebr 6:12": "opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Ps 127:1-5": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs. Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap. Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Jer 17:20": "En zeg tegen hen: Hoort het woord van de HEERE, u koningen van Juda, en heel Juda, en alle inwoners van Jeruzalem, die door deze poorten ingaan!", "Ps 128:1": "Een lied Hammaaloth. Gelukkig is ieder die de HEERE vreest, die in Zijn wegen wandelt.", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!", "Joh 8:54": "Jezus antwoordde: Als Ik Mijzelf eer, is Mijn eer niets; Mijn Vader is het, Die Mij eert, van Wie u zegt dat Hij uw God is.", "Ef 3:3-5": "Dat Hij mij door openbaring deze verborgenheid heeft bekendgemaakt (zoals ik met weinig woorden eerder geschreven heb; waaraan u, als u dit leest, mijn inzicht in deze verborgenheid van Christus kunt bemerken), die in andere eeuwen aan de kinderen van de mensen niet bekendgemaakt is, zoals zij nu geopenbaard is aan Zijn heilige apostelen en profeten, door de Geest;", "Spr 11:10": "Een stad springt op van vreugde over het welvaren van de rechtvaardigen; en als de goddelozen vergaan, is er gejuich.", "Ps 119:151-153": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid. Van oudsher heb ik geweten van Uw getuigenissen, dat U ze in eeuwigheid gegrond hebt. Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Mal 2:17": "U vermoeit de HEERE met uw woorden; nog zegt u: Waarmee vermoeien wij Hem? Daarmee, dat u zegt: Ieder die kwaad doet, is goed in de ogen van de HEERE, en Hij heeft behagen in zulke mensen; of: waar is de God van het oordeel?", "Matt 4:4": "Maar Hij antwoordde en zei: Er is geschreven: De mens zal niet van brood alleen leven, maar van elk woord dat uit de mond van God komt.", "Amos 8:7": "De HEERE heeft gezworen bij de heerlijkheid van Jakob: Zeker zal Ik al hun werken voor altijd niet vergeten!", "Jak 1:22-27": "En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag.", "Job 29:12-17": "Want ik bevrijdde de ellendige die riep, en de wees die geen helper had. De zegen van hem die verloren dreigde te gaan, kwam op mij; en het hart van de weduwe deed ik vrolijk zingen. Ik bekleedde mij met gerechtigheid, en zij bekleedde mij; mijn oordeel was als een mantel en vorstelijke hoed.", "Ps 119:92": "Indien Uw wet niet was geweest al mijn vermaking, was ik in mijn druk al lang vergaan.", "Rom 9:4": "die Israëlieten zijn, van wie de aanneming tot kinderen is, en de heerlijkheid, en de verbonden, en de wetgeving, en de dienst van God, en de beloften;", "Rom 4:4": "Nu wordt hem die werkt het loon niet toegerekend naar genade, maar naar schuld.", "Hagg 1:4": "Is het voor u wel de tijd om te wonen in uw gewelfde huizen, terwijl dit huis woest zal zijn?", "Jer 5:30": "Een verschrikkelijke en afschuwelijke zaak gebeurt er in het land.", "Jes 1:15-20": "En als u uw handen uitspreidt, verberg Ik Mijn ogen voor u; ook wanneer u het gebed vermenigvuldigt, hoor Ik niet; want uw handen zijn vol bloed. Was u, reinig u, doe de boosheid van uw handelingen van voor Mijn ogen weg, houd op met kwaad te doen. Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.", "Spr 15:6": "In het huis van de rechtvaardige is een grote schat; maar in de inkomst van de goddeloze is opschudding.", "Jes 32:9-14": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Zach 7:9-11": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander; en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads. Maar zij weigerden op te letten, en trokken hun schouder terug, en zij verzwaarden hun oren, zodat zij niet hoorden.", "Lev 19:35": "U zult geen onrecht doen in het gericht, met de el, met het gewicht, of met de maat.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Hebr 3:18": "En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Ps 113:6-9": "Die zeer laag ziet, in de hemel en op de aarde. Die de arme uit het stof opricht, en de behoeftige uit de vuilnis verhoogt; Om hem te doen zitten bij de vorsten, bij de vorsten van Zijn volk.", "Openb 22:18": "Want ik betuig aan ieder die de woorden van de profetie van dit boek hoort: Als iemand iets aan deze dingen toevoegt, zal God hem de plagen toevoegen die in dit boek geschreven zijn.", "Hos 11:2": "Maar net zoals zij hen riepen, zo gingen zij van hun aangezicht weg; zij offerden aan de Baäls, en brandden reukwerk voor de gesneden beelden.", "Ps 93:5": "Uw getuigenissen zijn heel betrouwbaar; de heiligheid sierlijk Uw huis, HEERE! tot in lengte van dagen.", "Micha 2:10": "Maak u dan op en ga heen; want dit land zal de rust niet zijn; omdat het verontreinigd is, zal het u verderven, en dat met een hevige verderving.", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Hebr 8:9": "Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere.", "Matt 1:11": "en Josia verwekte Jechonia en zijn broers, ten tijde van de Babylonische wegvoering.", "Joh 10:35": "Als de wet hen goden genoemd heeft, tot wie het woord van God gekomen is, en de Schrift niet gebroken kan worden,", "Deut 29:19-21": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "1 Kron 3:16": "De kinderen van Jojakim nu waren: Jechonia zijn zoon, Zedekia zijn zoon.", "Jer 38:16": "Toen zwoer de koning Zedekia in het geheim aan Jeremia: Zo waarachtig als de HEERE leeft, Die ons dit leven gemaakt heeft: Ik zal u niet doden, en ik zal u niet overgeven in de hand van deze mannen die u naar het leven staan!", "1 Joh 2:7": "Broeders! Ik schrijf u geen nieuw gebod, maar een oud gebod, dat u vanaf het begin gehad hebt; dit oude gebod is het woord, dat u vanaf het begin gehoord hebt.", "Rom 1:29": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid;", "Deut 30:2": "En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel.", "Ps 147:9": "Die het vee zijn voer geeft; aan de jonge raven, als zij roepen.", "2 Kron 33:10": "De HEERE sprak wel tot Manasse en tot zijn volk; maar zij letten daar niet op.", "Luk 10:13": "Wee u, Chorazin, wee u, Bethsaïda, want als in Tyrus en Sidon de krachten waren gebeurd die in u gebeurd zijn, zouden zij zich allang, in zak en as zittend, bekeerd hebben.", "Ex 13:9": "En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft.", "Spr 23:10": "Verzet de oude grenspalen niet; en kom niet op de akkers van de wezen;", "Hos 4:12-19": "Mijn volk vraagt zijn hout om raad, en zijn stok zal het hem bekendmaken; want de geest van de hoererijen verleidt hen, zodat zij van onder hun God weghoereren. Op de toppen van de bergen offeren zij, en op de heuvels branden zij reukwerk, onder een eik, en populier, en iepenboom, omdat de schaduw daarvan goed is; daarom hoereren uw dochters, en uw bruiden plegen overspel. Ik zal over uw dochters geen straf² brengen, omdat zij hoereren, en over uw bruiden, omdat zij overspel plegen; want zij zelf zonderen zich af met de hoeren, en offeren met de snoodste hoeren; het volk dan, dat geen verstand heeft, zal ten onder gaan.", "Lev 26:3-45": "Als u in Mijn inzettingen wandelt, en Mijn geboden houdt, en die doet; Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen.", "Ps 68:6": "Hij is een Vader van de wezen, en een Rechter van de weduwen; God, in de woonplaats van Zijn heiligheid.", "Zach 14:1-3": "Zie, de dag komt, de HEERE, dat uw roof zal uitgedeeld worden in het midden van u, o Jeruzalem! Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden. En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd.", "Jes 10:1": "Wee hun die onrechtvaardige regels bepalen, en de schrijvers die moeite voorschrijven;", "Mark 13:31": "De hemel en de aarde zullen voorbijgaan; maar Mijn woorden zullen geenszins voorbijgaan.", "1 Tess 1:5": "Want ons Evangelie is bij u niet alleen met woorden gekomen, maar ook met kracht, en met de Heilige Geest, en met veel zekerheid; zoals u weet wat voor mensen wij bij u geweest zijn, ter wille van u.", "Deut 24:14": "U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.", "Jer 14:14-18": "En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart. Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden. En het volk, tot wie zij profeteren, zal op de straten van Jeruzalem weggeworpen zijn vanwege de honger en het zwaard; en er zal niemand zijn die hen kan begraven, hen, hun vrouwen, en hun zonen, en hun dochters; zo zal Ik hun slechtheid over hen uitstorten.", "Job 39:8": "Wie heeft de woudezel vrij heengezonden, en wie heeft de banden van de wilde ezel gelost?", "Deut 16:19": "U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen.", "Jer 12:10": "Veel herders hebben Mijn wijngaard verdorven, zij hebben Mijn akker vertrapt; zij hebben Mijn gewenste akker gesteld tot een woeste wildernis.", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Jer 48:8": "Want de verwoester zal komen over elke stad, zodat niet één stad zal ontkomen; en het dal zal vergaan, en het effen veld verdelgd worden; want de HEERE heeft het gezegd.", "Hos 4:1-3": "Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is; Maar vloeken en liegen, en doodslaan, en stelen, en overspel plegen; zij breken door, en bloedschuld raakt aan bloedschuld. Daarom zal het land treuren, en ieder die daarin woont, kwijnen weg, met de dieren van het veld, en met de vogels van de hemel; ja, ook de vissen van de zee zullen weggeraapt worden.", "1 Kron 29:14": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.", "Ps 119:127-131": "Daarom heb ik Uw geboden lief, meer dan goud, ja, meer dan het fijnste goud. Daarom heb ik al Uw bevelen, van alles, voor recht gehouden; maar elk vals pad heb ik gehaat. Pe. Uw getuigenissen zijn wonderbaar, daarom bewaart ze mijn ziel.", "1 Kron 28:8": "Welnu, voor de ogen van heel Israël, de gemeente van de HEERE, en voor de oren van onze God: houd en zoek al de geboden van de HEERE, uw God; opdat u dit goede land erfelijk bezit, en het na u nalaat als erfenis aan uw kinderen tot in eeuwigheid.", "Jes 27:11": "Als haar takken verdord zijn, zullen ze afgebroken worden, en de vrouwen zullen komen en ze aansteken; want het is een volk zonder enig verstand; daarom zal Hij, Die het gemaakt heeft, Zich niet over hen ontfermen, en Die het geformeerd heeft, zal hun geen genade bewijzen.", "Ezech 8:5-18": "En Hij zei tegen mij: Mensenkind, hef nu uw ogen op naar de weg van het noorden; en ik hief mijn ogen op naar de weg van het noorden, en zie, tegen het noorden aan de poort van het altaar was dit beeld van de ijver, in de ingang. En Hij zei tegen mij: Mensenkind, ziet u wel wat zij doen, de grote gruwelen die het huis van Israël hier doet, zodat Ik ver van Mijn heiligdom wegga? Maar u zult nog meer grote gruwelen zien. Zo bracht Hij mij tot de deur van het voorhof. Toen zag ik, en zie, er was een gat in de wand.", "Luk 22:35": "En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.", "Jes 57:3-13": "Maar kom
