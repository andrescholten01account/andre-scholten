et het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;", "Spr 30:10": "Belaster een knecht niet bij zijn heer, opdat hij u niet vloekt, en u schuldig wordt.", "Deut 24:7": "Wanneer iemand gevonden wordt die een mens steelt uit zijn broeders, uit de kinderen van Israël, en met hem handelt als koopwaar, en hem verkoopt; dan zal die dief sterven, en u zult het kwaad uit uw midden wegdoen.", "Ex 22:21": "U mag de vreemdeling geen onrecht aandoen, en hem ook niet onderdrukken; want u bent zelf vreemdeling geweest in het land Egypte.", "Ps 27:10": "Want mijn vader en mijn moeder hebben mij verlaten, maar de HEERE zal mij aannemen.", "Jes 58:6-14": "Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt? Is het niet dit, dat u de hongerige uw brood meedeelt, en de armen, verdrevenen, in huis brengt? Als u een naakte ziet, dat u hem dekt, en dat u zich voor uw eigen vlees niet verbergt? Dan zal uw licht voortbreken als de dageraad, en uw genezing zal snel uitspruiten; en uw gerechtigheid zal voor uw aangezicht heengaan, en de heerlijkheid van de HEERE zal uw achterhoede zijn.", "Tit 2:6": "Vermaan de jonge mannen eveneens dat zij matig zijn.", "Ps 12:7": "De woorden van de HEERE zijn reine woorden, zilver, gelouterd in een aarden smeltkroes, gezuiverd zevenmaal.", "Klaagl 1:2": "Beth. Zij weent steeds 's nachts, en haar tranen lopen over haar kaken; zij heeft geen trooster onder al haar liefhebbers; al haar vrienden hebben trouweloos met haar gehandeld, zij zijn haar tot vijanden geworden.", "Kol 3:5": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is.", "Ps 107:1-43": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft. En hen die Hij uit de landen verzameld heeft, van het oosten en van het westen, van het noorden en van de zee.", "Gen 49:20": "Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Luk 16:20": "En er was een zekere bedelaar, met de naam Lazarus, die voor zijn poort lag, vol zweren;", "Mark 13:1-13": "En toen Hij de tempel uitging, zei een van Zijn discipelen tegen Hem: Meester, kijk, wat voor stenen, en wat voor gebouwen! En Jezus antwoordde en zei tegen hem: Ziet u deze grote gebouwen? Er zal niet één steen op de andere steen gelaten worden, die niet afgebroken zal worden. En toen Hij op de Olijfberg zat, tegenover de tempel, vroegen Petrus, en Jakobus, en Johannes, en Andreas Hem apart:", "Spr 13:1": "Een wijze zoon hoort de tucht van de vader; maar een spotter hoort de bestraffing niet.", "Ps 1:2": "Maar zijn vreugde is in de wet van de HEERE, en hij overdenkt Zijn wet dag en nacht.", "Ps 86:4": "Verheug de ziel van uw knecht; want tot U, Heere! verhef ik mijn ziel.", "Jes 10:12": "Want het zal gebeuren, als de Heere een einde zal gemaakt hebben van al Zijn werk op de berg Sion en te Jeruzalem, dan zal Ik thuis zoeken de vrucht van de grootsheid van het hart van de koning van Assyrië, en de pracht van de hoogheid van zijn ogen.", "Gen 4:7": "Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.", "Jes 6:11": "Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "Ps 145:15": "Ain. Aller ogen wachten op U; en U geeft hun hun voedsel op de juiste tijd.", "Job 30:25": "Weende ik niet over hem die harde dagen had? Was mijn ziel niet beangst over de nooddruftige?", "Hos 2:7": "Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, dat zij voor de Baäl gebruikt hebben.", "Ps 106:6-48": "Wij hebben gezondigd, alsook onze vaderen, wij hebben verkeerd gedaan; wij hebben goddeloos gehandeld. Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee. Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "Jer 7:23": "Maar deze zaak heb Ik hun geboden, en Ik zei: Hoor naar Mijn stem, dan zal Ik u tot een God zijn, en u zult Mij tot een volk zijn; en wandel in heel de weg die Ik u gebieden zal, opdat het u goed gaat.", "Ps 9:13": "Want Hij zoekt de bloedstortingen, Hij gedenkt daarvan; Hij vergeet het geroep van de ellendigen niet.", "2 Kron 35:12-18": "En zij namen het brandoffer daar af, opdat zij het naar de verdelingen van de vaderlijke huizen, aan het volk geven mochten, om de HEERE te offeren, zoals geschreven is in het boek van Mozes; en zo ook met de runderen. En zij kookten het pascha bij het vuur, naar het recht; maar de andere heilige dingen kookten zij in potten, en in ketels, en in pannen; en zij deelden het haastig onder heel het volk. Daarna bereidden zij ook voor zichzelf en voor de priesters; want de priesters, de zonen van Aäron, waren tot aan de nacht bezig met het offeren van de brandoffers en het vet; daarom bereidden de Levieten voor zichzelf, en voor de priesters, de zonen van Aäron.", "Matt 24:13": "Maar wie zal volharden tot het einde, die zal behouden worden.", "Ex 21:27": "En als hij een tand van zijn dienstknecht, of een tand van zijn dienstmeisje uitslaat, zal hij hem vrijlaten voor zijn tand.", "2 Kon 22:16": "Zo zegt de HEERE: Zie, Ik zal onheil brengen over deze plaats, en over haar inwoners, namelijk alle woorden van het boek dat de koning van Juda gelezen heeft.", "Zach 7:4-14": "Toen kwam het woord van de HEERE van de heerscharen tot mij: Spreek tot heel het volk van dit land, en tot de priesters: Toen u vastte en rouwklaagde, in de vijfde en in de zevende maand, namelijk nu zeventig jaren, hebt u dan voor Mij, voor Mij, werkelijk gevast? Of als u at, en als u dronk, was dat niet voor uzelf, u die daar at, en u die daar dronk?", "Gen 28:21": "en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn!", "Spr 20:14": "Het is slecht, het is slecht! zal de koper zeggen; maar als hij weggegaan is, dan zal hij zich beroemen.", "Joh 17:6": "Ik heb Uw Naam geopenbaard aan de mensen die U Mij uit de wereld gegeven hebt. Zij waren van U, en U hebt Mij hen gegeven; en zij hebben Uw woord bewaard.", "2 Sam 24:12": "Ga heen, en spreek tot David: Zo zegt de HEERE: Drie dingen leg Ik u voor; kies u er een van uit, opdat Ik dat u doe.", "Deut 6:6-9": "En deze woorden, die ik u heden gebied, zullen in uw hart zijn. En u zult ze uw kinderen inscherpen, en daarover spreken, als u in uw huis zit, en als u onderweg bent, en als u neerligt, en als u opstaat. Ook zult u ze als een teken op uw hand binden, en zij zullen u tot voorhoofdsbanden zijn tussen uw ogen.", "Hab 2:5-9": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken. Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk! Zullen niet onvoorziens opstaan die u zullen bijten, en ontwaken die u zullen doen beven, en zult u hun niet tot buit worden?", "Ex 34:21": "Zes dagen zult u werken, maar op de zevende dag zult u rusten; in de ploegtijd en in de oogst zult u rusten.", "1 Tim 2:10": "maar (wat past bij vrouwen die de godsvrucht belijden) door goede werken.", "Ezech 33:27": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!", "Ezech 23:22-35": "Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen. De zonen van Babel en alle Chaldeeën, Pekod, en Soa, en Koa, en alle zonen van Assur met hen; aantrekkelijke jonge mannen, die allen vorsten en machthebbers zijn, hoofdmannen en vermaarde mannen, die allen te paard rijden. Die zullen tegen u komen met karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "Openb 2:25-28": "Maar wat u hebt, houd dat vast, totdat Ik zal komen. En wie overwint, en Mijn werken tot het einde toe bewaart, hem zal Ik macht geven over de heidenen; En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Pred 9:16": "Toen zei ik: Wijsheid is beter dan kracht, hoewel de wijsheid van de arme veracht wordt, en zijn woorden niet gehoord worden.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Ps 19:8-12": "De wet van de HEERE is volmaakt, en zet de ziel om; de getuigenis van de HEERE is betrouwbaar, en geeft de eenvoudigen wijsheid. De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen. De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Jer 9:16": "En Ik zal hen verstrooien onder de heidenen, die zij niet gekend hebben, zij noch hun vaders; en Ik zal het zwaard achter hen zenden, totdat Ik hen verteerd zal hebben.", "Ps 119:76-78": "Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht. Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking. Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Spr 26:6": "Hij snijdt zichzelf de voeten af, en drinkt geweld, wie boodschappen laat overbrengen door de hand van een dwaas.", "Amos 5:16": "Daarom, zo zegt de HEERE, de God van de heerscharen, de Heere: Op alle straten zal rouwklacht zijn, en in alle wijken zullen zij zeggen: Och! Och! en zij zullen de landbouwer roepen om te treuren, en rouwklacht zal zijn bij hen die verstand van klagen hebben.", "Spr 23:15-35": "Mijn zoon! als uw hart wijs is, zal mijn hart zich verblijden, ja, ik zelf. En mijn nieren zullen opspringen van vreugde, als uw lippen spreken wat recht is. Laat uw hart niet jaloers zijn op de zondaars; maar wees de hele dag in de vreze van de HEERE.", "Jer 12:11": "Men heeft het gesteld tot een woestenij, verwoest zijnde treurt het tot Mij; het hele land is verwoest, omdat er niemand is die het ter harte neemt.", "Deut 25:13-16": "U zult geen twee soorten gewichten in uw zak hebben, een groot en een klein. U zult in uw huis geen twee soorten efa hebben, een grote en een kleine. U zult een volkomen en eerlijk gewicht hebben; u zult een volkomen en eerlijke efa hebben; opdat uw dagen verlengd worden in het land, dat de HEERE, uw God, u geven zal.", "Ps 37:19": "Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Luk 14:16-24": "Maar Hij zei tegen hem: Een zeker mens bereidde een groot avondmaal, en nodigde er velen voor uit. En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd.", "Jer 15:7": "En Ik zal hen wannen met een wan, in de poorten van het land; Ik heb Mijn volk van kinderen beroofd en te gronde gericht; zij zijn van hun wegen niet teruggekeerd.", "Mark 7:7": "Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen;", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Hos 11:3": "Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Spr 28:11": "Een rijk man is wijs in zijn eigen ogen; maar de arme, die verstandig is, doorziet hem.", "1 Kor 10:11": "En al deze dingen zijn hun overkomen tot voorbeelden; en ze zijn beschreven tot waarschuwing voor ons, over wie het einde van de eeuwen gekomen is.", "Jer 23:28": "De profeet, bij wie een droom is, vertelt de droom; en bij wie Mijn woord is, spreekt Mijn woord waarachtig; wat heeft het stro met het koren te maken? spreekt de HEERE.", "Matt 23:38": "Zie, uw huis wordt aan u woest gelaten.", "Mark 12:44": "Want zij allen hebben van hun overvloed daarin geworpen; maar deze heeft van haar armoede, alles wat zij had, daarin geworpen, haar hele levensonderhoud.", "2 Kon 22:17": "Omdat zij Mij verlaten hebben, en voor andere goden reukwerk gebrand hebben, om Mij tot toorn te verwekken met al het werk van hun handen, zal Mijn grimmigheid ontstoken worden tegen deze plaats, en niet uitgeblust worden.", "Spr 25:5": "Doe de goddeloze weg van het aangezicht van de koning, en zijn troon zal door gerechtigheid bevestigd worden.", "Kol 1:23": "als u maar blijft in het geloof, gefundeerd en vast, en niet wordt weggebracht van de hoop van het Evangelie dat u gehoord hebt, dat gepredikt is onder alle schepselen die onder de hemel zijn; waarvan ik, Paulus, een dienaar geworden ben;", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Spr 30:8": "Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is;", "Job 16:17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "Spr 15:5": "Een dwaas zal de tucht van zijn vader versmaden; maar wie de bestraffing ter harte neemt, zal kloekzinnig handelen.", "2 Tim 2:20": "Maar in een groot huis zijn niet alleen gouden en zilveren voorwerpen, maar ook houten en aarden voorwerpen; en sommige tot eer, maar sommige tot oneer.", "1 Petr 2:2": "En verlang als pasgeboren kinderen naar de zuivere melk van het Woord, opdat u daardoor mag groeien;", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Ps 119:54": "Uw inzettingen zijn mij gezangen geweest, ter plaatse van mijn vreemdelingschap.", "Klaagl 3:27": "Teth. Het is goed voor een man, dat hij het juk in zijn jeugd draagt.", "Pred 8:11": "Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.", "Jer 17:27": "Maar als u naar Mij niet zult horen, om de sabbatdag te heiligen, en om geen last te dragen als u op de sabbatdag door de poorten van Jeruzalem ingaat; zo zal Ik een vuur in haar poorten aansteken, dat de paleizen van Jeruzalem zal verteren, en niet uitgeblust worden.", "Ex 23:6-8": "U zult het recht van uw arme niet buigen in zijn geschil. Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen. Ook zult u geen geschenk aannemen; want het geschenk verblindt de zienden, en het verdraait de zaak van de rechtvaardigen.", "2 Kron 7:17-22": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst. Maar als u zich afkeert, en Mijn inzettingen en Mijn geboden, die Ik voor uw aangezicht gegeven heb, verlaat, en heengaat, en andere goden dient, en u voor die neerbuigt;", "1 Kon 20:42": "En hij zei tegen hem: Zo zegt de HEERE: Omdat u de man, die Ik verbannen had, uit uw hand hebt laten gaan, zal uw leven in de plaats van zijn leven zijn, en uw volk in de plaats van zijn volk.", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "Job 21:7-15": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.", "Job 31:15-22": "Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?) Als ik de armen hun begeerte onthouden heb, of de ogen van de weduwe laten versmachten; En mijn bete alleen gegeten heb, zodat de wees daarvan niet gegeten heeft;", "Ezech 22:13": "Zie dan, Ik heb Mijn hand geslagen om uw gierigheid die u bedreven hebt, en om uw bloed dat in uw midden geweest is.", "Luk 16:10": "Wie getrouw is in het minste, die is ook in het grote getrouw; en wie in het minste onrechtvaardig is, die is ook in het grote onrechtvaardig.", "Ps 5:7": "U zult de leugensprekers verdoen; van de man van het bloed en van het bedrog heeft de HEERE een gruwel.", "Klaagl 3:35": "Lamed. Dat men het recht van een man buigt voor het aangezicht van de Allerhoogste;", "Spr 17:25": "Een dwaze zoon is een verdriet voor zijn vader, en bittere droefheid voor haar die hem gebaard heeft.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Pred 5:19": "Want hij zal niet veel denken aan de dagen van zijn leven, omdat God hem antwoord geeft in de blijdschap van zijn hart.", "Ezech 3:10": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren.", "1 Joh 2:14": "Ik heb u geschreven, vaders, want u hebt Hem gekend, Die er vanaf het begin is. Ik heb u geschreven, jongemannen, want u bent sterk, en het Woord van God blijft in u, en u hebt de boze overwonnen.", "Spr 1:11": "Als zij zeggen: Ga met ons, laat ons loeren op bloed, ons verstoppen tegen de onschuldige, zonder oorzaak;", "Deut 1:10": "De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel.", "Luk 4:22": "En zij gaven Hem allen getuigenis, en verwonderden zich over de aangename woorden die uit Zijn mond kwamen; en zeiden: Is dit niet de zoon van Jozef?", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "Hos 4:2": "Maar vloeken en liegen, en doodslaan, en stelen, en overspel plegen; zij breken door, en bloedschuld raakt aan bloedschuld.", "Ps 145:16": "Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.", "2 Kron 10:8": "Maar hij liet de raad van de oudsten los, die zij hem gegeven hadden; en hij hield raad met de jongemannen die met hem opgegroeid waren, die voor hem stonden.", "Luk 13:35": "Zie, uw huis wordt aan u woest achtergelaten. En voorwaar, Ik zeg u, dat u Mij niet zult zien, totdat de tijd zal zijn gekomen dat u zult zeggen: Gezegend is Hij Die komt in de Naam van de Heere!", "Jes 7:17-25": "Maar de HEERE zal over u, en over uw volk, en over het huis van uw vader, dagen doen komen, wat voor dagen niet gekomen zijn vanaf de dag dat Efraïm van Juda is afgeweken, door de koning van Assyrië. Want het zal op die dag gebeuren, dat de HEERE zal fluiten naar de vliegen, die aan het einde van de rivieren van Egypte zijn, en naar de bijen die in het land van Assyrië zijn. En zij zullen komen, en zij zullen allemaal neerstrijken in de woeste dalen, en in de kloven van de rotsen, en op alle doornhagen, en op alle geprezen plaatsen.", "Job 22:25": "Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "Rom 4:24": "Maar ook om onzentwil, aan wie het zal toegerekend worden, namelijk aan hen die geloven in Hem, Die Jezus, onze Heere, uit de doden opgewekt heeft;", "Ezech 14:14": "Ofschoon deze drie mannen, Noach, Daniël en Job, in het midden daarvan zouden zijn, zouden zij door hun gerechtigheid alleen hun eigen ziel bevrijden, spreekt de Heere HEERE.", "Num 35:31": "En u zult geen losgeld nemen voor het leven van de doodslager, die schuldig is te sterven; want hij zal zeker gedood worden.", "Ezra 7:25": "En u, Ezra, stel naar de wijsheid van uw God, die in uw hand is, regeerders en rechters aan, die al het volk rechtspreken dat aan de overkant van de rivier is, allen die de wetten van God kennen; en wie ze niet kent, moet u het bekendmaken.", "2 Kron 36:4": "En de koning van Egypte maakte zijn broer Eljakim koning over Juda en Jeruzalem, en veranderde zijn naam in Jojakim; maar zijn broer Joahaz nam Necho mee, en bracht hem naar Egypte.", "1 Tim 6:1": "Alle dienstknechten die onder het juk zijn, moeten hun eigen heren alle eer waardig achten, opdat de Naam van God en de leer niet gelasterd wordt.", "Amos 6:1-6": "Wee de geruste mensen in Sion, en degenen die zeker zijn op de berg van Samaria! Zij zijn de voornaamste van de eerstelingen der volken, en tot hen komen die van het huis van Israël. Ga over naar Kalne, en zie toe; en ga vandaar naar Hamath, de grote stad, en trek af naar Gath van de Filistijnen; zijn zij beter dan deze koninkrijken, of is hun gebied groter dan uw gebied? U, die de kwade dag ver weg zet, en de zetel van het geweld dichtbij brengt.", "Pred 3:16": "Verder heb ik ook gezien onder de zon, op de plaats van het gericht, daar was goddeloosheid; en op de plaats van de gerechtigheid, daar was goddeloosheid.", "Pred 3:17": "Ik zei in mijn hart: God zal de rechtvaardige en de goddeloze oordelen; want daar is de tijd voor alle voornemen, en over alle werk.", "Hebr 12:2": "Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God.", "Spr 11:24": "Er is er een die uitstrooit, aan wie nog meer toegevoegd wordt; en een die meer inhoudt dan recht is, maar het leidt tot gebrek.", "Lev 26:3-43": "Als u in Mijn inzettingen wandelt, en Mijn geboden houdt, en die doet; Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen.", "Jer 52:31-34": "Het gebeurde daarna, in het zevenendertigste jaar van de gevankelijke wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de vijfentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het eerste jaar van zijn koninkrijk, het hoofd van Jojachin, de koning van Juda, verhief, en hem uit de gevangenis liet uitgaan. En hij sprak vriendelijk met hem, en stelde zijn stoel boven de stoel van de koningen die bij hem in Babel waren. En hij veranderde de kleren van zijn gevangenschap; en hij at voortdurend brood voor zijn aangezicht, al de dagen van zijn leven.", "1 Kron 28:7": "En Ik zal zijn koninkrijk bevestigen tot in eeuwigheid, als hij standvastig is om Mijn geboden en Mijn rechten te doen, zoals op deze dag.", "Matt 24:14-42": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen. Wanneer u dan de gruwel van de verwoesting zal zien, waarvan gesproken is door Daniël de profeet, staande op de heilige plaats (die het leest, laat hij daarop letten!), laat dan wie in Judea zijn, vluchten naar de bergen;", "Jer 3:7-10": "En Ik zei, nadat zij dit alles gedaan had: Bekeer u tot Mij; maar zij bekeerde zich niet. Dit zag haar trouweloze zuster Juda. En Ik zag, toen Ik vanwege alles waarin het afgekeerde Israël overspel had gepleegd, haar had weggestuurd en haar een scheidbrief had gegeven, dat de trouweloze Juda, haar zuster, niet vreesde, maar wegging en zelf ook hoereerde. Ja, het gebeurde, vanwege het gerucht van haar hoererij, dat zij het land ontheiligde; want zij bedreef overspel met steen en met hout.", "Job 36:11": "Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.", "Ef 4:28": "Wie gestolen heeft, moet niet meer stelen, maar moet liever arbeiden, terwijl hij met de handen doet wat goed is, opdat hij kan delen met hem die het nodig heeft.", "Jer 26:18": "Micha, de Morastiet, heeft in de dagen van Hizkia, koning van Juda, geprofeteerd, en tot al het volk van Juda gesproken, en gezegd: Zo zegt de HEERE van de heerscharen: Sion zal als een akker geploegd worden, en Jeruzalem tot steenhopen worden, en de berg van dit huis tot hoogten van het woud.", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Jes 27:10": "Want de versterkte stad zal eenzaam zijn, de woonplaats zal verstoten en verlaten worden, als een woestijn; daar zullen de kalveren weiden, en daar zullen ze neerliggen, en zullen haar takken opeten.", "Matt 16:24-27": "Toen zei Jezus tegen Zijn discipelen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen, en zijn kruis opnemen, en Mij volgen. Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen om Mijnentwil, die zal het vinden. Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Matt 19:16-22": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb? En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden. Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Luk 11:28": "Maar Hij zei: Ja, gelukkiger zijn zij die het Woord van God horen, en het bewaren.", "Ps 90:17": "En de liefelijkheid van de HEERE, onze God; die zij over ons; en bevestig U het werk van onze handen over ons, ja, het werk van onze handen, bevestig dat.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "2 Kon 23:31": "Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem; en de naam van zijn moeder was Hamutal, de dochter van Jeremia, van Libna.", "Pred 5:9": "Wie het geld liefheeft, wordt van het geld niet verzadigd; en wie de overvloed liefheeft, wordt van het inkomen niet verzadigd. Ook dit is nietigheid.", "Hebr 7:21": "maar Deze met eedzwering, door Hem die tot Hem gezegd heeft: De Heere heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid naar de ordening van Melchizedek);", "Deut 4:14": "Ook gebood de HEERE mij in diezelfde tijd dat ik u inzettingen en rechten zou leren; opdat u die deed in het land waar u naar toe trekt, om het in bezit te nemen.", "Job 24:2-11": "Zij verzetten de landpalen; de kudden roven zij, en weiden ze. De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand. Zij doen de behoeftigen wijken van de weg; samen verstoppen zich de ellendigen van het land.", "Ezech 33:31": "En zij komen tot u, zoals het volk gewoon is te komen, en zitten voor uw aangezicht als Mijn volk, en horen uw woorden, maar zij doen ze niet; want zij spreken lieve woorden met hun mond, maar hun hart gaat hun hebzucht na.", "Luk 20:47": "die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.", "Luk 17:7-9": "En wie van u die een dienstknecht heeft die ploegt of de dieren hoedt, zal tegen hem zeggen, als hij van de akker komt: Kom meteen aan tafel? Maar zal hij niet tegen hem zeggen: Maak klaar wat ik vanavond zal eten, omgord u en dien mij, totdat ik gegeten en gedronken heb; en daarna kunt u eten en drinken? Dankt hij die dienstknecht ervoor dat hij gedaan heeft wat hem bevolen was? Ik denk het niet.", "Hebr 3:8": "Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "Jes 34:16": "Zoek in het boek van de HEERE, en lees; niet één van deze zal ontbreken, de één noch de ander zal men missen; want Mijn mond Zelf heeft het geboden, en Zijn Geest Zelf zal ze samenbrengen.", "Jer 2:8": "De priesters zeiden niet: Waar is de HEERE? en die de wet hanteerden, kenden Mij niet; en de herders overtraden tegen Mij; en de profeten profeteerden door Baäl, en wandelden naar dingen die geen nut doen.", "Jer 22:1-4": "Zo zegt de HEERE: Ga naar het huis van de koning van Juda, en spreek daar dit woord. En zeg: Hoor het woord van de HEERE, koning van Juda, u die zit op de troon van David, u, en uw dienaren, en uw volk, die door deze poorten binnengaan! Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "Zach 7:7": "Zijn dit niet de woorden die de HEERE uitriep door de dienst van de vorige profeten, toen Jeruzalem bewoond en welvarend was, en haar steden rondom haar; en toen het zuiden en de laagte bewoond waren?", "Spr 14:31": "Wie de arme verdrukt, smaadt zijn Maker; maar wie zich over de behoeftige ontfermt, eert Hem.", "1 Sam 15:23": "Want weerspannigheid is een zonde als toverij, en weerstreven is afgoderij en beeldendienst. Omdat u het woord van de HEERE verworpen hebt, zo heeft Hij u verworpen, dat u geen koning meer zult zijn.", "Ps 82:2-4": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela. Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme. Verlos de arme en de behoeftige, ruk hem uit de hand van de goddelozen.", "Jer 15:19-21": "Daarom zegt de HEERE zo: Als u zult terugkeren, zal Ik u laten terugkeren; u zult voor Mijn aangezicht staan; en als u het kostbare van het waardeloze scheidt, zult u als Mijn mond zijn; laat hen naar u terugkeren, maar u zult niet naar hen terugkeren. Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE. Ja, Ik zal u redden uit de hand van de bozen, en Ik zal u verlossen uit de greep van de tirannen.", "Jer 49:30-33": "Vlucht, zwerf vlug heen, woon in diepe plaatsen, inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadsbesluit tegen u beraadslaagd, en een gedachte tegen hen gedacht. Maak u op, trek op tegen het volk dat rust heeft, dat in zekerheid woont, spreekt de HEERE; dat geen deuren noch grendel heeft, dat alleen woont. En hun kamelen zullen ten roof zijn, en de menigte van hun vee zal ten buit zijn; en Ik zal hen verstrooien in alle windrichtingen, namelijk hen die aan de hoeken afgekort zijn; en Ik zal hun verderf van alle kanten aanbrengen, spreekt de HEERE.", "Spr 13:17": "Een goddeloze bode zal in het kwaad vallen; maar een trouwe gezant is medicijn.", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Jer 23:29": "Is Mijn woord niet zo, als een vuur? spreekt de HEERE, en als een hamer, die een steenrots verbrijzelt?", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Mark 10:17-22": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Mark 7:21": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden,", "Lev 23:26-29": "Verder sprak de HEERE tot Mozes en zei: Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren. En op diezelfde dag zult u geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht van de HEERE, uw God.", "Job 9:2": "Waarlijk, ik weet dat het zo is; want hoe zou de mens rechtvaardig zijn bij God?", "Luk 11:41": "Geef liever als aalmoes wat erin is; en zie, dan is alles voor u rein.", "Jer 25:4": "Ook heeft de HEERE tot u gezonden al Zijn dienstknechten, de profeten, vroeg opstaand en zendend (maar u hebt niet gehoord, noch uw oor geneigd om te horen);", "Ps 40:9": "Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Deut 15:4": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten;", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "Jer 29:20": "U dan, hoort het woord van de HEERE, u allen die gevankelijk zijt weggevoerd, die Ik van Jeruzalem naar Babel heb weggezonden!", "Ps 33:15": "Hij vormt hun aller hart; Hij let op al hun werken.", "2 Kon 23:30-34": "En zijn knechten voerden hem dood op een wagen van Megiddo, en brachten hem naar Jeruzalem, en begroeven hem in zijn graf; en het volk van het land nam Joahaz, de zoon van Josia, en zalfde hem, en maakte hem koning in de plaats van zijn vader. Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem; en de naam van zijn moeder was Hamutal, de dochter van Jeremia, van Libna. En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vaderen gedaan hadden.", "Matt 10:10": "Ook geen reistas voor onderweg, geen twee stel kleren, geen schoenen, geen staf; want de arbeider is zijn voedsel waard.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Micha 2:3": "Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Jer 27:6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Pred 4:2": "Daarom prees ik de doden, die al gestorven waren, boven de levenden, die tot nu toe levend zijn.", "Joz 8:33": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.", "Matt 26:11": "Want de armen hebt u altijd bij u, maar Mij hebt u niet altijd.", "Deut 11:26-28": "Zie, ik stel u heden voor: zegen en vloek: De zegen, wanneer u zult horen naar de geboden van de HEERE, uw God, die ik u heden gebied; Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Hebr 6:17": "waarbij God, omdat Hij aan de erfgenamen van de belofte overvloediger de onveranderlijkheid van Zijn raad wilde tonen, er een eed tussen heeft gebracht;", "Hebr 11:26": "en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "Jes 10:2": "om de armen van het recht af te wenden, en om het recht van de ellendigen van Mijn volk te roven, opdat de weduwen hun buit worden, en opdat zij de wezen mogen plunderen!", "Ps 34:10": "Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.", "Rom 15:4": "Want al wat vroeger geschreven is, dat is tot onze lering geschreven, opdat wij, door lijdzaamheid en vertroosting van de Schriften, hoop zouden hebben.", "Matt 6:26": "Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven?", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Matt 22:7": "Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.", "Job 24:3": "De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand.", "1 Joh 5:13": "Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Job 29:13": "De zegen van hem die verloren dreigde te gaan, kwam op mij; en het hart van de weduwe deed ik vrolijk zingen.", "Hos 14:9": "Efraïm! wat heb Ik meer met de afgoden te doen? Ik heb hem verhoord, en zal op hem zien; Ik zal hem zijn als een denneboom die groent; uw vrucht is uit Mij gevonden.", "Joh 12:6": "En dit zei hij niet omdat hij bezorgd was om de armen, maar omdat hij een dief was, en de beurs had, en droeg wat erin gedaan werd.", "Deut 15:4-6": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten; Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied. Want de HEERE, uw God, zal u zegenen, zoals Hij tot u heeft gesproken; zo zult u aan veel volken lenen, maar u zult niet lenen; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Openb 22:12": "En zie, Ik kom haastig, en Mijn loon is met Mij, om ieder te vergelden zoals zijn werk zal zijn.", "Matt 10:32": "Ieder dan die Mij belijden zal voor de mensen, die zal Ik ook belijden voor Mijn Vader, Die in de hemelen is.", "1 Petr 5:2": "Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed;", "Ps 119:37": "Wend mijn ogen af, dat zij geen ijdelheid zien; maak mij levend door Uw wegen.", "Ps 49:18": "want hij zal bij zijn sterven niets meenemen, zijn eer zal hem niet achterna dalen.", "Ps 119:109": "Mijn ziel is voortdurend in mijn hand; nochtans vergeet ik Uw wet niet.", "Deut 11:18-21": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen; En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat; En schrijf ze op de posten van uw huis, en aan uw poorten;", "Amos 5:12": "Want Ik weet dat uw overtredingen talrijk, en uw zonden machtig veel zijn; zij benauwen de rechtvaardige, nemen steekpenningen aan, en verdringen de behoeftigen in de poort.", "Deut 3:25": "Laat mij toch oversteken, en dat goede land bezien, dat aan de overkant van de Jordaan is, dat goede gebergte, en de Libanon!", "Spr 1:15": "Mijn zoon! wandel niet met hen op de weg; weer uw voet van hun pad.", "Amos 4:1": "Hoor dit woord, koeien van Basan, u die op de berg van Samaria bent, die de armen verdrukt, die de behoeftigen verplettert; u die tegen uw heren zegt: Breng aan, opdat wij drinken.", "Hebr 6:13": "Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren,", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Ezech 14:20": "Ofschoon Noach, Daniël en Job in het midden daarvan waren, zo waarachtig als Ik leef, spreekt de Heere HEERE, als zij een zoon of een dochter zouden willen bevrijden, zouden zij alleen hun eigen ziel door hun gerechtigheid bevrijden.", "Matt 10:24": "De discipel staat niet boven de meester, en de dienstknecht niet boven zijn heer.", "Jak 4:2": "U begeert, en hebt niet; u benijdt en jaagt naar dingen, en kunt ze niet krijgen; u vecht en voert strijd, maar u hebt niet, omdat u niet bidt.", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "Ps 135:6-12": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden. Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort. Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe.", "Jer 15:6": "U hebt Mij verlaten, spreekt de HEERE; u bent achterwaarts gegaan; daarom zal Ik Mijn hand tegen u uitstrekken en u vernietigen; Ik ben het van het berouwen moe geworden.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "2 Kon 24:4": "Als ook om het onschuldige bloed dat hij vergoten had, zodat hij Jeruzalem met onschuldig bloed vervuld had; daarom wilde de HEERE niet vergeven.", "Jes 59:15": "Ja, de waarheid ontbreekt, en wie van het boze wijkt, wordt tot een prooi; en de HEERE zag het, en het was kwaad in Zijn ogen, dat er geen recht was.", "1 Kon 4:20-23": "Juda nu en Israël waren met velen, als het zand dat aan de zee in menigte is; zij aten, en dronken, en waren blij. En Salomo heerste over al de koninkrijken, van de rivier tot het land van de Filistijnen, en tot aan het gebied van Egypte; die brachten geschenken, en dienden Salomo al de dagen van zijn leven. Het voedsel nu van Salomo was voor één dag: dertig kor meelbloem, en zestig kor meel;", "Hebr 10:36": "Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Lev 24:22": "Eén recht zult u hebben; zo zal het gelden voor de vreemdeling als voor de geboren Israëliet; want Ik ben de HEERE, uw God!", "1 Tess 4:6": "Dat niemand zijn broeder tekortdoet, of hem bedriegt in zijn zaken; want de Heere is een wreker over dit alles, zoals wij u ook van tevoren gezegd en betuigd hebben.", "Jer 17:20-27": "En zeg tegen hen: Hoort het woord van de HEERE, u koningen van Juda, en heel Juda, en alle inwoners van Jeruzalem, die door deze poorten ingaan! Zo zegt de HEERE: Wacht u voor uw zielen, en draag geen last op de sabbatdag, en breng die niet in door de poorten van Jeruzalem. Ook zult u geen last uitvoeren uit uw huizen op de sabbatdag, en geen enkel werk doen; maar u zult de sabbatdag heiligen, zoals Ik uw vaderen geboden heb.", "Spr 6:16": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "1 Tim 6:2": "En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen.", "1 Tim 5:16": "Als een gelovige man of gelovige vrouw weduwen heeft, moet die haar voldoende hulp geven, en moet de gemeente niet belast worden, opdat zij hun die echt weduwen zijn voldoende hulp kan geven.", "Spr 20:10": "Tweeërlei weegsteen, tweeërlei efa is de HEERE een gruwel, ja, die beide.", "Jer 34:20": "Ja, Ik zal hen overgeven in de hand van hun vijanden, en in de hand van hen die hun ziel zoeken; en hun dode lichamen zullen voor het gevogelte van de hemel en het gedierte van de aarde tot voedsel zijn.", "Matt 2:17": "Toen is vervuld wat gesproken is door de profeet Jeremia:", "Job 19:16": "Ik riep mijn knecht, en hij antwoordde niet; ik smeekte met mijn mond tot hem.", "2 Kron 7:22": "En men zal zeggen: Omdat zij de HEERE, de God van hun vaderen, verlaten hebben, Die hen uit Egypteland uitgevoerd had, en zich aan andere goden gehouden hebben, en zich voor die neergebogen, en hen gediend hebben; daarom heeft Hij al dat kwaad over hen gebracht.", "Ps 33:12": "Gelukkig is het volk wiens God de HEERE is; het volk, dat Hij Zich als erfdeel heeft uitgekozen.", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "2 Kron 36:4-8": "En de koning van Egypte maakte zijn broer Eljakim koning over Juda en Jeruzalem, en veranderde zijn naam in Jojakim; maar zijn broer Joahaz nam Necho mee, en bracht hem naar Egypte. Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en hij deed wat slecht was in de ogen van de HEERE, zijn God. Nebukadnezar, de koning van Babel, trok tegen hem op, en bond hem met twee koperen ketenen, om hem naar Babel te voeren.", "Jes 65:12": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb.", "Rom 3:1": "Wat is dan het voordeel van de Jood? Of wat is het nut van de besnijdenis?", "2 Tim 3:16": "Heel de Schrift is door God ingegeven, en is nuttig tot lering, tot weerlegging, tot verbetering, tot onderwijzing die in de rechtvaardigheid is;", "2 Kor 9:8-10": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk. Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid. Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "Jer 49:16": "Uw verschrikkelijkheid heeft u bedrogen, en de trots van uw hart, u die woont in de kloven van de steenrotsen, die de hoogte van de heuvels vasthoudt! Al zou u uw nest zo hoog maken als de arend, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Job 8:7": "Uw begin zal wel gering zijn geweest, maar uw einde zal zeer toenemen.", "Jer 4:30": "Wat zult u dan doen, u die verwoest bent? Al kleedt u zich met scharlaken, al versiert u zich met gouden sieraad, al schuurt u uw ogen met blanketsel, toch zou u zich tevergeefs opmaken; de minnaars versmaden u, zij zullen uw leven zoeken.", "Ps 119:33": "He. HEERE! leer mij de weg van Uw inzettingen, en ik zal hem houden tot het einde toe.", "Pred 5:12": "Er is een kwaad dat ziekte veroorzaakt, dat ik heb gezien onder de zon: rijkdom die door zijn bezitters bewaard wordt tot hun eigen kwaad.", "Ezech 34:7": "Daarom, u herders! Hoor het woord van de HEERE!", "Jer 28:4": "Ook zal Ik Jechonia, de zoon van Jojakim, koning van Juda, en allen die gevankelijk uit Juda zijn weggevoerd, die in Babel gekomen zijn, naar deze plaats terugbrengen, spreekt de HEERE; want Ik zal het juk van de koning van Babel verbreken.", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "Pred 5:18": "Ook: ieder mens aan wie God rijkdom en bezittingen gegeven heeft, en aan wie Hij de macht geeft om daarvan te eten, en om zijn deel te nemen, en om zich te verheugen in zijn arbeid, dat is een gave van God.", "Luk 12:24-28": "Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard? Wie van u kan door bezorgd te zijn één el aan zijn lengte toevoegen? Als u dan zelfs het kleinste niet kunt, waarom bent u dan bezorgd over de andere dingen?", "Pred 4:17": "Let op uw voet, als u naar het huis van God gaat, en wees liever bereid om te horen, dan om het offer van dwazen te geven; want zij weten niet dat zij kwaad doen.", "Spr 27:27": "Daarbij zult u genoeg geitenmelk hebben tot uw voedsel, tot voedsel van uw huis, en levensonderhoud van uw dienstmeisjes.", "Openb 9:20": "En de overige mensen, die niet gedood zijn door deze plagen, hebben zich niet bekeerd van de werken van hun handen, om de duivelen niet meer te aanbidden; en de gouden, en zilveren, en koperen, en stenen, en houten afgoden, die noch kunnen zien, noch horen, noch lopen;", "Matt 5:22": "Maar Ik zeg u: ieder die zonder reden toornig is op zijn broeder, die zal strafbaar zijn voor het gericht; en wie tegen zijn broeder zegt: Raka! die zal strafbaar zijn voor de grote raad; maar wie zegt: Dwaas! die zal strafbaar zijn voor het helse vuur.", "2 Kon 24:6-8": "En Jojakim ontsliep met zijn vaderen; en zijn zoon Jojachin werd koning in zijn plaats. De koning van Egypte trok voortaan niet meer uit zijn land; want de koning van Babel had, van de rivier van Egypte af tot aan de rivier de Eufraat, alles ingenomen wat van de koning van Egypte was. Jojachin was achttien jaar oud toen hij koning werd, en regeerde drie maanden in Jeruzalem; en de naam van zijn moeder was Nehusta, een dochter van Elnathan, uit Jeruzalem.", "Ps 119:41": "Vau. En dat mij Uw blijken van goedertierenheid overkomen, o HEERE! Uw heil, naar Uw toezegging;", "Ps 119:103-105": "Hoe zoet zijn Uw redenen voor mijn gehemelte geweest, meer dan honing voor mijn mond! Uit Uw bevelen krijg ik verstand, daarom haat ik alle leugenpaden. Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad.", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "1 Kor 7:10": "Maar de getrouwden gebied ik niet, maar de Heere, dat de vrouw niet van de man scheidt.", "Jer 7:22-28": "Want Ik heb met uw vaderen, op de dag dat Ik hen uit het land Egypte uitleidde, niet gesproken, noch hun geboden gegeven over zaken van brandoffer of slachtoffer. Maar deze zaak heb Ik hun geboden, en Ik zei: Hoor naar Mijn stem, dan zal Ik u tot een God zijn, en u zult Mij tot een volk zijn; en wandel in heel de weg die Ik u gebieden zal, opdat het u goed gaat. Toch hebben zij niet gehoord, noch hun oor geneigd, maar gewandeld in de raadslagen, in het eigen goeddunken van hun slechte hart; en zij zijn achterwaarts gekeerd, en niet voorwaarts.", "Jer 21:11": "En aangaande het huis van de koning van Juda: hoor het woord van de HEERE.", "Jer 44:17": "Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.", "Deut 8:18": "Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "2 Kron 34:22": "Toen ging Hilkia, en zij die de koning had aangewezen, naar de profetes Hulda, de vrouw van Sallum, de zoon van Tokhath, de zoon van Hasra, de bewaarder van de kleding. Zij woonde te Jeruzalem, in het tweede stadsdeel; en zij spraken daarover met haar.", "Ezech 9:1-7": "Daarna riep Hij voor mijn oren met luide stem en zei: Laat de opzieners van de stad naderen, ieder met zijn verdervend wapen in zijn hand. En zie, zes mannen kwamen van de weg van de Hoge poort, die naar het noorden gekeerd is, ieder met zijn verpletterend wapen in zijn hand; en één man in hun midden was met linnen bekleed, en een schrijversinktkoker had hij aan zijn heup; en zij kwamen binnen en gingen bij het koperen altaar staan. En de heerlijkheid van de God van Israël verhief zich van de cherub waarop Hij was, naar de drempel van het huis; en Hij riep tot de man die met linnen bekleed was, die de schrijversinktkoker aan zijn heup had.", "1 Kron 17:8": "En Ik ben met u geweest overal waar u heen bent gegaan, en Ik heb al uw vijanden voor u uitgeroeid; en Ik heb u een naam gemaakt, gelijk de naam van de groten die op de aarde zijn.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Matt 5:23": "Als u dan uw gave op het altaar offert, en u daar herinnert dat uw broeder iets tegen u heeft,", "Ex 23:4": "Wanneer u de os van uw vijand, of zijn dwalende ezel, tegenkomt, zult u hem zeker naar hem terugbrengen.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "1 Sam 30:4": "Toen verhieven David en het volk dat bij hem was hun stem, en huilden, tot er geen kracht meer in hen was om te huilen.", "Jer 17:1-4": "De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren; Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels. Ik zal Mijn berg met het veld, uw vermogen en al uw schatten ten roof geven, alsook uw hoogten, om de zonde in al uw landpalen.", "Hos 2:5": "Daarom, zie, Ik zal uw weg met doornen omtuinen, en Ik zal een omheiningsmuur maken, zodat zij haar paden niet zal vinden.", "Spr 20:29": "Het sieraad van de jongelingen is hun kracht, en de heerlijkheid van de ouden is de grijsheid.", "2 Kor 8:10": "En ik geef in dezen mijn mening; want dit is nuttig voor u, u die niet alleen het doen, maar ook het willen al een jaar geleden begonnen bent.", "Ps 44:2-4": "O God! Wij hebben het met onze oren gehoord, onze vaders hebben het ons verteld: Wat een werk hebt U gedaan in hun dagen, in de dagen van vroeger. U hebt de heidenvolken met Uw hand uit de bezitting verdreven, maar hen geplant; U hebt de volken geplaagd, hen daarentegen doen voortschieten. Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Ps 82:3": "Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme.", "Jer 19:3": "En zeg: Hoort het woord van de HEERE, koningen van Juda en inwoners van Jeruzalem! Zo zegt de HEERE van de heerscharen, de God van Israël: Ziet, Ik zal een kwaad brengen over deze plaats, waarvan een ieder die het hoort, zijn oren zullen klinken;", "Deut 16:18-20": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel. U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen. Gerechtigheid, gerechtigheid zult u najagen; opdat u leeft, en het land erfelijk bezit dat de HEERE, uw God, u geven zal.", "Matt 20:1-16": "Want het Koninkrijk der hemelen is gelijk aan een heer des huizes, die 's morgens vroeg uitging om arbeiders te huren voor zijn wijngaard. En toen hij met de arbeiders overeengekomen was voor een penning per dag, stuurde hij hen naar zijn wijngaard. En hij ging uit, omtrent het derde uur, en zag anderen werkloos staan op de markt.", "Joh 16:3": "En deze dingen zullen zij u doen, omdat zij de Vader niet gekend hebben, en Mij ook niet.", "Deut 26:12": "Wanneer u klaar bent met het vertienen van alle tienden van uw inkomen, in het derde jaar, het jaar van de tienden; dan zult u aan de Leviet, aan de vreemdeling, aan de wees en aan de weduwe geven, opdat zij in uw poorten eten en verzadigd worden.", "Ps 119:167": "Mijn ziel onderhoudt Uw getuigenissen, en ik heb ze zeer lief.", "Jer 22:20-26": "Klim op de Libanon en roep, en verhef uw stem op de Basan; roep ook van de veren; maar al uw minnaars zijn verbroken. Ik sprak u aan in uw grote voorspoed, maar u zei: Ik zal niet horen. Dit is uw weg vanaf uw jeugd, dat u naar Mijn stem niet hebt geluisterd. De wind zal al uw herders weiden, en uw minnaars zullen in gevangenschap gaan; dan zult u zeker beschaamd worden en te schande gemaakt worden, vanwege al uw slechtheid.", "Klaagl 4:9": "Teth. De gevallenen door het zwaard hebben het beter dan de gevallenen door de honger; want die kwijnen weg, als doorstoken, omdat er geen vruchten van de velden zijn.", "Micha 3:10": "Zij bouwen Sion met bloed, en Jeruzalem met onrecht.", "1 Tim 6:5-11": "verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen. Maar de godsvrucht is, samen met tevredenheid, een grote winst. Want wij hebben niets in de wereld meegebracht, het is duidelijk dat wij er ook niets uit kunnen meedragen.", "2 Kron 35:24": "En zijn knechten namen hem weg van de wagen, en voerden hem op de tweede wagen, die hij had, en brachten hem naar Jeruzalem; en hij stierf, en werd begraven in de graven van zijn vaderen; en heel Juda en Jeruzalem bedreven rouw over Josia.", "1 Tim 6:3": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "2 Kron 35:8": "Ook gaven zijn vorsten tot een vrijwillig offer voor het volk, voor de priesters, en voor de Levieten; Hilkia, en Zacharia, en Jehiel, de leiders van het huis van God, gaven de priesters tot paasoffers, tweeduizend en zeshonderd klein vee, en driehonderd runderen.", "Deut 27:19": "Vervloekt is hij die het recht van de vreemdeling, van de wees en van de weduwe buigt! En heel het volk zal zeggen: Amen.", "Luk 3:14": "En ook de soldaten vroegen hem: En wij, wat zullen wij doen? En hij zei tegen hen: Doe niemand geweld aan, en pers niemand af door bedrog, en wees tevreden met uw soldij.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "Spr 1:1-33": "De spreuken van Salomo, de zoon van David, de koning van Israël, Om wijsheid en tucht te weten; om te verstaan redenen van het verstand; Om aan te nemen onderwijs van goed verstand, gerechtigheid, en recht, en wat recht is;", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Pred 7:21": "Geef ook uw hart niet aan alle woorden die men spreekt, opdat u niet hoort dat uw knecht u vervloekt.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "Mal 2:11-13": "Juda handelt trouweloos, en er wordt een gruwel gedaan in Israël en in Jeruzalem; want Juda ontheiligt de heiligheid van de HEERE, die Hij liefheeft; want hij heeft de dochter van een vreemde god getrouwd. De HEERE zal de man die dit doet, uitroeien uit de tenten van Jakob, hem die waakt en hem die antwoordt, en die de HEERE van de heerscharen een spijsoffer brengt. Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen.", "Spr 12:9": "Beter is hij die zich gering acht en een knecht heeft, dan hij die zichzelf eert en gebrek heeft aan het brood.", "Spr 3:1-35": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden. Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen. Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Jer 10:17-22": "Raap uw koopwaar weg uit het land, u inwoonster van de vesting! Want zo zegt de HEERE: Ziet, Ik zal de inwoners van het land op deze keer wegslingeren, en zal hen benauwen, opdat zij het vinden. O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Ex 12:30": "En Farao stond 's nachts op, hij en al zijn dienaren, en alle Egyptenaren; en er was een groot geschreeuw in Egypte; want er was geen huis waarin niet een dode was.", "Ps 106:25": "Maar zij morden in hun tenten; naar de stem van de HEERE luisterden zij niet.", "Ps 62:11": "Vertrouw niet op onderdrukking, en word niet ijdel door roverij; als het vermogen overvloedig toeneemt, zet er het hart niet op.", "Spr 31:1-3": "De woorden van koning Lemuël, de last, waarmee zijn moeder hem onderwees. Wat, o mijn zoon, en wat, o zoon van mijn buik? Ja, wat, o zoon van mijn geloften? Geef aan de vrouwen uw vermogen niet, en uw wegen niet aan hen die koningen te gronde richten.", "Spr 23:5": "Zult u uw ogen laten vliegen op iets wat er niet is? Want het maakt zich zeker vleugels, als een arend, die naar de hemel vliegt.", "2 Kron 21:20": "Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.", "Ps 119:35": "Doe mij treden op het pad van Uw geboden, want daarin heb ik lust.", "Ezech 3:1-11": "Daarna zei Hij tot mij: Mensenkind, eet, wat u vinden zult; eet deze rol, en ga, spreek tot het huis Israëls. Toen opende ik mijn mond, en Hij gaf mij die rol te eten. En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.", "Jes 54:16": "Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.", "Spr 1:12": "Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "Matt 27:4": "en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.", "Micha 4:10": "Lijd smart en doe uw uiterste best om te baren, dochter van Sion, als een barende vrouw; want nu zult u wel uit de stad heen weggaan, en op het veld wonen, en tot in Babel komen, maar daar zult u gered worden; daar zal de HEERE u verlossen uit de hand van uw vijanden.", "Ps 119:113": "Samech. Ik haat de kwade ranken, maar heb Uw wet lief.", "Ex 34:24": "Wanneer Ik de volken voor uw aangezicht uit hun bezit zal verdrijven, en uw grenzen verruimen, dan zal niemand uw land begeren, terwijl u erheen optrekt, om te verschijnen voor het aangezicht van de HEERE, uw God, driemaal in het jaar.", "Luk 18:25": "Want het is gemakkelijker dat een kameel door het oog van een naald gaat, dan dat een rijke het Koninkrijk van God ingaat.", "Gal 1:9": "Zoals wij al eerder gezegd hebben, zeg ik het nu ook weer: als iemand u een evangelie verkondigt naast wat u ontvangen hebt, laat hij vervloekt zijn.", "Deut 22:1-4": "U zult de os of het kleinvee van uw broeder niet zien afdwalen en u daarvoor verbergen; u zult ze zeker naar uw broeder terugbrengen. En als uw broeder niet dicht bij u woont, of u hem niet kent, zo zult u ze binnen in uw huis verzamelen, dat ze bij u blijven totdat uw broeder ze zoekt, en u ze hem teruggeeft. Zo zult u ook doen met zijn ezel, en zo zult u doen met zijn kleding, ja, zo zult u doen met alles wat uw broeder verloren heeft en wat u gevonden hebt; u mag u niet verbergen.", "Spr 31:4": "Het komt koningen niet toe, o Lemuël! Het komt koningen niet toe wijn te drinken, en prinsen niet, om sterke drank te begeren;", "Spr 21:29": "Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.", "Lev 25:18-22": "En doe Mijn inzettingen, en houd Mijn rechten, en doe die; dan zult u zeker wonen in het land. En het land zal zijn vrucht geven, en u zult eten tot verzadiging toe; en u zult zeker daarin wonen. En als u zou zeggen: Wat zullen wij eten in het zevende jaar! Zie, wij zullen niet zaaien, en onze opbrengst niet inzamelen;", "Micha 2:2": "En zij begeren akkers en roven ze, en huizen, en nemen ze weg; zo doen zij de man en zijn huis geweld aan, ja, ieder en zijn erfenis.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "Jer 2:27": "Die tot een stuk hout zeggen: U bent mijn vader; en tot een steen: U hebt mij verwekt; want zij keren Mij de nek toe, en niet het aangezicht; maar ten tijde van hun kwaad zeggen zij: Sta op en verlos ons.", "Jer 11:5": "Opdat Ik de eed bevestig, die Ik uw vaderen gezworen heb, hun een land te geven vloeiende van melk en honing, zoals het is op deze dag. Toen antwoordde ik en zei: Amen, o HEERE!", "1 Kor 4:2": "En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt.", "Gen 50:10": "Toen zij nu bij het plein van het doornbos kwamen, dat aan de overzijde van de Jordaan is, hielden zij daar een grote en zeer zware rouwklacht; en hij maakte voor zijn vader een rouw van zeven dagen.", "Nahum 3:1": "Wee de bloedstad, die helemaal vol leugen en verscheuring is! De roof houdt niet op.", "Hos 8:5-14": "Uw kalf, Samaria! heeft u verstoten; Mijn toorn is tegen hen ontstoken; hoe lang zullen zij de reinheid niet verdragen? Want ook dat komt uit Israël; een vakman heeft het gemaakt, en het is geen God, maar het zal in stukken worden gebroken, het kalf van Samaria. Want zij hebben wind gezaaid, en zullen een wervelwind maaien; het zal geen staand koren hebben, de opbrengst zal geen meel opleveren; en als het toch iets opleverde, zullen vreemden het verslinden.", "Matt 19:23": "En Jezus zei tegen Zijn discipelen: Voorwaar, Ik zeg u, dat een rijke moeilijk in het Koninkrijk der hemelen zal ingaan.", "Jer 26:22": "Maar de koning Jojakim zond mannen naar Egypte, Elnathan, de zoon van Achbor, en andere mannen met hem, naar Egypte;", "Jer 2:25": "Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!", "Jak 3:13": "Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Jer 7:7": "dan zal Ik u in deze plaats, in het land dat Ik uw vaderen gegeven heb, laten wonen van eeuw tot eeuw.", "Spr 20:17": "Het brood van de leugen is de mens zoet; maar daarna zal zijn mond vol worden van zandsteentjes.", "Ps 128:2": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan.", "Joh 8:31": "Jezus zei dan tegen de Joden die in Hem geloofden: Als u in Mijn woord blijft, bent u werkelijk Mijn discipelen;", "Ps 82:4": "Verlos de arme en de behoeftige, ruk hem uit de hand van de goddelozen.", "Ef 5:3-5": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt, ook geen oneerbaarheid, geen zot geklap of grappenmakerij, wat niet betaamt; maar veelmeer dankzegging. Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Joh 8:32": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken.", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Deut 27:25": "Vervloekt is hij die geschenken aanneemt om een ziel, het bloed van een onschuldige, te doden! En heel het volk zal zeggen: Amen.", "1 Tim 6:9": "Maar zij die rijk willen worden, vallen in verzoeking en in een valstrik, en in veel dwaze en schadelijke begeerten, die de mensen doen wegzinken in verderf en ondergang.", "2 Kron 36:8": "Het overige nu van de geschiedenis van Jojakim, en zijn gruwelen die hij deed, en wat er tegen hem gevonden werd, zie, dat is geschreven in het boek van de koningen van Israël en Juda; en Jojachin, zijn zoon, werd koning in zijn plaats.", "2 Kron 36:17": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand.", "Ex 21:26": "Wanneer ook iemand het oog van zijn dienstknecht, of het oog van zijn dienstmeisje slaat en het beschadigt, zal hij hem vrij laten gaan voor zijn oog.", "Ex 18:20": "en maak hun de instellingen en de wetten duidelijk, en maak hun de weg bekend waarin zij moeten gaan, en het werk dat zij moeten doen.", "Hos 7:14": "Zij roepen ook niet tot Mij met hun hart, wanneer zij huilen op hun bedden; om koren en most verzamelen zij zich, maar zij weerstreven Mij.", "Ezech 3:26": "En Ik zal uw tong aan uw gehemelte doen kleven, zodat u stom worden zult, en hun niet zult zijn tot een bestraffende man; want zij zijn een opstandig huis.", "1 Kor 7:21-24": "Bent u als dienstknecht geroepen, laat u dat niet bekommeren; maar als u ook vrij kunt worden, gebruik dat dan liever. Want wie in de Heere geroepen is als dienstknecht, is een vrijgelatene van de Heere; net zo ook, wie vrij zijnde geroepen is, is een dienstknecht van Christus. U bent duur gekocht, word geen dienstknechten van mensen.", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd.", "Mal 1:10": "Wie is er ook onder u, die de deuren voor niets toesluit? En u steekt het vuur niet aan op Mijn altaar voor niets. Ik heb geen behagen in u, zegt de HEERE van de heerscharen, en het spijsoffer is Mij van uw hand niet aangenaam.", "Luk 16:21": "En hij verlangde verzadigd te worden van de kruimels die van de tafel van de rijke vielen; maar ook de honden kwamen en likten zijn zweren.", "Num 35:30": "Ieder die iemand doodslaat, moet men op grond van de verklaring van getuigen doden; maar één enkele getuige mag niet tegen iemand getuigen, zodat hij sterft.", "Jer 3:21": "Er is een stem gehoord op de hoge plaatsen, geween en smekingen van de kinderen van Israël, omdat zij hun weg verdraaid hebben, en de HEERE, hun God, vergeten hebben.", "Mark 4:19": "en de zorgen van deze wereld, en de verleiding van de rijkdom, en de begeerten naar de andere dingen komen binnen en verstikken het Woord, en het wordt onvruchtbaar.", "Ps 85:13": "Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.", "Micha 1:1-9": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem. Hoort, u volken allemaal! Merk op, u aarde, alsook van die volheid! De Heere HEERE nu zal tot een getuige zijn tegen u, de Heere uit de tempel van Zijn heiligheid. Want ziet, de HEERE gaat uit van Zijn plaats, en Hij zal neerdalen en treden op de hoogten van de aarde.", "Deut 32:47": "Want dat is geen leeg woord voor u; maar het is uw leven; en door ditzelfde woord zult u de dagen verlengen op het land, waar u over de Jordaan naartoe gaat, om dat te erven.", "Spr 20:8": "Een koning, die op de troon van het gericht zit, verstrooit alle kwaad met zijn ogen.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Matt 27:25": "En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "Matt 25:42": "Want Ik ben hongerig geweest, en u hebt Mij niet te eten gegeven; Ik ben dorstig geweest, en u hebt Mij niet te drinken gegeven;", "1 Sam 15:16-23": "Toen zei Samuël tegen Saul: Houd op, dan zal ik u vertellen wat de HEERE vannacht tot mij gesproken heeft. Hij dan zei tegen hem: Spreek. En Samuël zei: Is het niet zo, toen u klein was in uw eigen ogen, dat u het hoofd van de stammen van Israël geworden bent, en dat de HEERE u tot koning over Israël gezalfd heeft? En de HEERE heeft u op weg gezonden, en gezegd: Ga heen en verban de zondaars, de Amalekieten, en strijd tegen hen, totdat u hen vernietigt.", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Deut 1:17": "U zult in het gericht niemand voortrekken; u zult de kleine, evenals de grote, horen; u zult voor niemands aangezicht bang zijn; want het gericht is van God; maar de zaak die voor u te zwaar zal zijn, zult u naar mij laten komen, en ik zal die horen.", "Ps 119:12": "HEERE! U bent gezegend; leer mij Uw inzettingen.", "Hos 4:18": "Hun drank is verzuurd; zij doen niets dan hoereren; hun leiders (het is een schande!) hebben het woord lief: Geef.", "Ps 148:12": "Jongemannen en ook meisjes; oude mensen met de jongeren!", "Joz 7:21": "Want ik zag onder de buit een mooi, sierlijk Babylonisch overkleed, en tweehonderd sikkelen van het zilver, en een gouden staaf, met een gewicht van vijftig sikkelen; en ik kreeg er lust naar, en ik nam ze; en zie, ze zijn verborgen in de aarde, midden in mijn tent, en het zilver daaronder.", "Jer 8:4-22": "Zeg verder tegen hen: Zo zegt de HEERE: Zal men vallen, en niet weer opstaan? Zal men afkeren, en niet terugkeren? Waarom keert dit volk van Jeruzalem dan af, met een altijddurende afkering? Zij houden vast aan bedrog, zij weigeren terug te keren. Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd.", "Jer 23:1": "Wee de herders, die de schapen van Mijn weide ombrengen en verstrooien! spreekt de HEERE.", "Gen 4:9-12": "En de HEERE zei tegen Kaïn: Waar is Abel, uw broeder? En hij zei: Ik weet het niet; ben ik de hoeder van mijn broeder? En Hij zei: Wat hebt u gedaan? Daar is een stem van het bloed van uw broeder, die tot Mij roept vanuit de aardbodem. En nu bent u vervloekt, verbannen van de aardbodem, die zijn mond heeft opengedaan om het bloed van uw broeder uit uw hand te ontvangen.", "Spr 23:4": "Vermoei u niet om rijk te worden; zie af van uw eigen vernuft.", "Jes 28:14": "Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is!", "Job 20:15": "Hij heeft rijkdom ingeslikt, maar zal het weer uitspugen; God zal het uit zijn buik verdrijven.", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Ps 103:6": "De HEERE doet gerechtigheid en recht aan allen die onderdrukt worden.", "1 Tess 1:8": "Want vanuit u heeft het Woord van de Heere weerklonken, niet alleen in Macedonië en Achaje; maar ook op elke plaats is uw geloof, dat u op God hebt, bekend geworden, zodat wij het niet nodig hebben daar iets over te zeggen.", "Jer 7:2": "Sta in de poort van het huis van de HEERE, en roep daar dit woord uit, en zeg: Hoor het woord van de HEERE, heel Juda! U die door deze poorten ingaat om de HEERE te aanbidden.", "Spr 3:1": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Jer 18:13-15": "Daarom, zo zegt de HEERE: Vraag nu onder de heidenvolken; wie heeft zoiets gehoord? De jonkvrouw Israël
