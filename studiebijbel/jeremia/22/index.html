olharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "Hebr 6:5": "en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw,", "Luk 6:35": "Maar heb uw vijanden lief, en doe goed, en leen, zonder iets terug te hopen; en uw loon zal groot zijn, en u zult kinderen van de Allerhoogste zijn; want Hij is goedertieren over de ondankbaren en de bozen.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Jer 49:11": "Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.", "Joh 8:55": "En u kent Hem niet, maar Ik ken Hem; en als Ik zeg dat Ik Hem niet ken, zal Ik u gelijk zijn, dat is een leugenaar; maar Ik ken Hem, en bewaar Zijn woord.", "Deut 29:25": "Dan zal men zeggen: Omdat zij het verbond van de HEERE, de God van hun vaderen, verlaten hebben, dat Hij met hen gemaakt had, toen Hij hen uit Egypteland uitleidde;", "Ex 18:21": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien.", "Deut 31:9-13": "En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël. En Mozes gebood hun: Aan het einde van elke zeven jaar, op de vastgestelde tijd van het jaar van de vrijlating, op het feest van de loofhutten, wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen;", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Openb 2:5": "Bedenk dan waarvan u uitgevallen bent, en bekeer u, en doe de eerste werken; en zo niet, Ik zal u haastig bij komen, en zal uw kandelaar van zijn plaats wegnemen, als u zich niet bekeert.", "Ps 50:17": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit.", "Ezech 23:3-39": "Deze hoereerden in Egypte; in hun jeugd hoereerden zij. Daar werden hun borsten gedrukt, en daar werden de tepels van hun maagdelijkheid betast. Hun namen nu waren: Ohola, de grootste, en Oholiba, haar zuster; en zij werden de Mijne, en baarden zonen en dochters. Dit waren hun namen: Samaria is Ohola, en Jeruzalem Oholiba. Ohola nu hoereerde, terwijl zij van Mij was; en zij werd verliefd op haar minnaars, op de Assyriërs, die dichtbij waren,", "Deut 11:13-16": "En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt. En Ik zal gras geven op uw veld voor uw dieren; en u zult eten en verzadigd worden.", "Kol 3:17": "En alles wat u doet, met woorden of met werken, doe dat alles in de Naam van de Heere Jezus, terwijl u God en de Vader dankt door Hem.", "Matt 24:39": "en zij merkten het niet, totdat de zondvloed kwam en hen allen wegnam; zo zal ook de komst van de Zoon des mensen zijn.", "Jer 4:31": "Want ik hoor een stem als van een vrouw, die in barensnood is, een benauwdheid als van iemand die haar eerste kind baart, de stem van de dochter van Sion; zij hijgt, zij spreidt haar handen uit, en zegt: O, wee mij nu, want mijn ziel is moe vanwege de moordenaars!", "Matt 5:17": "Denk niet dat Ik gekomen ben om de wet of de profeten af te schaffen; Ik ben niet gekomen om die af te schaffen, maar om te vervullen.", "Ezech 20:28": "Toen Ik hen in het land had gebracht, waarover Ik Mijn hand had opgeheven om het hun te geven, zagen zij naar elke hoge heuvel en elke dichtbeboste boom, en offerden daar hun offers, en zij brachten daar hun tergende offergaven, en daar zetten zij hun liefelijke reuk neer, en daar goten zij hun drankoffers uit.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Jer 7:3-7": "Zo zegt de HEERE van de heerscharen, de God van Israël: Maak uw wegen en uw handelingen goed, dan zal Ik u laten wonen in deze plaats. Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze! Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Deut 19:19": "dan zult u hem doen zoals hij van plan was zijn broeder te doen; zo zult u het kwaad uit uw midden wegdoen;", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "Luk 6:24": "Maar wee u, rijken, want u hebt uw troost al gehad.", "1 Tim 6:19": "en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Dan 9:13": "Zoals geschreven is in de wet van Mozes, zo is al dat kwaad over ons gekomen; en wij smeekten het aangezicht van de HEERE, onze God, niet, door ons af te keren van onze ongerechtigheden en verstandig acht te geven op Uw waarheid.", "Luk 24:32": "En zij zeiden tegen elkaar: Was ons hart niet brandend in ons, toen Hij onderweg tot ons sprak, en toen Hij ons de Schriften opende?", "Ezech 33:21-29": "En het gebeurde in het twaalfde jaar van onze wegvoering, in de tiende maand, op de vijfde dag van de maand, dat er iemand tot mij kwam die uit Jeruzalem ontkomen was, en hij zei: De stad is ingenomen. Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom. Toen kwam het woord van de HEERE tot mij:", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Ps 78:58-64": "En zij verwekten Hem tot toorn door hun hoogten, en verwekten Hem tot ijver door hun gesneden beelden. God hoorde het en werd verbolgen, en versmaadde Israël zeer. Daarom verliet Hij de tabernakel te Silo, de tent, die Hij tot een woning gesteld had onder de mensen.", "Ezech 34:2-10": "Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet. De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Joh 2:22": "Daarom, toen Hij opgestaan was uit de doden, herinnerden Zijn discipelen zich dat Hij dit tegen hen had gezegd, en zij geloofden de Schrift en het woord dat Jezus gesproken had.", "Gen 8:22": "Voortaan, al de dagen van de aarde, zullen zaaiing en oogst, en koude en hitte, en zomer en winter, en dag en nacht niet ophouden.", "Jes 32:9-11": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Hebr 11:24-26": "Door het geloof heeft Mozes, toen hij groot geworden was, geweigerd een zoon van de dochter van Farao genoemd te worden; en verkoos hij liever met het volk van God slecht behandeld te worden, dan voor een tijd van de genietingen van de zonde te hebben; en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "Ex 21:21": "Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.", "Matt 12:42": "De koningin van het zuiden zal opstaan in het oordeel met dit geslacht, en zal het veroordelen; want zij is gekomen van het einde van de aarde, om de wijsheid van Salomo te horen; en zie, meer dan Salomo is hier!", "Ezech 20:43": "Daar zult u dan denken aan uw wegen, en aan al uw handelingen waarmee u zich verontreinigd hebt, en u zult van uzelf een afkeer hebben over al uw slechte daden die u gedaan hebt.", "Ps 26:9": "Raap mijn ziel niet weg met de zondaars, en mijn leven niet met de mannen van het bloed;", "Jer 26:16": "Toen zeiden de vorsten en al het volk tot de priesters en tot de profeten: Deze man verdient de dood niet, want hij heeft tot ons gesproken in de Naam van de HEERE, onze God.", "Jer 30:5": "Want zo zegt de HEERE: Wij horen een stem van verschrikking; er is angst en geen vrede.", "Joël 2:1-17": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij. Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten. Voor hen verteert een vuur, en achter hen brandt een vlam; het land is voor hen als een lusthof, maar achter hen een woeste wildernis, en ook is er geen ontkomen aan hen.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Ezech 23:22": "Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen.", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Ps 119:45-52": "En ik zal wandelen in de ruimte, omdat ik Uw bevelen gezocht heb. Ook zal ik voor koningen spreken van Uw getuigenissen, en mij niet schamen. En ik zal mij vermaken in Uw geboden, die ik liefheb.", "Klaagl 3:36": "Lamed. Dat men een mens verongelijkt in zijn rechtszaak; zou de Heere dat niet zien?", "Ezech 22:9": "Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in uw midden gedaan.", "Jer 5:31": "De profeten profeteren vals, en de priesters heersen door hun eigen hand; en Mijn volk heeft het graag zo; maar wat zult u aan het einde daarvan doen?", "Ps 94:3": "Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?", "Jer 17:24-27": "Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet; Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid. En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Jer 8:1": "In die tijd, spreekt de HEERE, zullen ze de beenderen van de koningen van Juda, en de beenderen van hun vorsten, en de beenderen van de priesters, en de beenderen van de profeten, en de beenderen van de inwoners van Jeruzalem, uit hun graven halen.", "Deut 4:8": "En welk groot volk is er, dat zulke rechtvaardige inzettingen en rechten heeft als deze hele wet, die ik vandaag voor u leg?", "Luk 1:73": "en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven", "Spr 24:27": "Regel uw werk daarbuiten, en maak het voor u gereed op de akker, en bouw daarna uw huis.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Amos 5:17": "Ja, in alle wijngaarden zal rouwklacht zijn; want Ik zal door uw midden trekken, zegt de HEERE.", "Hebr 2:1-3": "Daarom moeten wij ons des te meer houden aan wat wij gehoord hebben, opdat wij het niet op enig moment laten wegglijden. Want als het woord, dat door de engelen g s people.", "5": "But if ye will not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> I <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> by myself, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that this <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall become a desolation.", "6": "For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> Thou art <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> unto me, and the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon:</span> yet surely I will <span class=\"wl wl-kjv\" data-code=\"H7896\">make</span> thee a <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> which are not <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited.</span>", "7": "And I will <span class=\"wl wl-kjv\" data-code=\"H6942\">prepare</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyers</span> against thee, every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> with his <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons:</span> and they shall cut <span class=\"wl wl-kjv\" data-code=\"H3772\">down</span> thy <span class=\"wl wl-kjv\" data-code=\"H4005\">choice</span> <span class=\"wl wl-kjv\" data-code=\"H730\">cedars,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">cast</span> them into the fire.", "8": "And <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> by this <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> Wherefore hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> thus unto this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> city?", "9": "Then they shall <span class=\"wl wl-kjv\" data-code=\"H559\">answer,</span> Because they have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and served", "10": "<span class=\"wl wl-kjv\" data-code=\"H1058\">Weep</span> ye not for the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> neither <span class=\"wl wl-kjv\" data-code=\"H5110\">bemoan</span> him: but <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">sore</span> for him that goeth <span class=\"wl wl-kjv\" data-code=\"H1980\">away:</span> for he shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> no more, nor <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> his <span class=\"wl wl-kjv\" data-code=\"H4138\">native</span> country.", "11": "For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H413\">touching</span> <span class=\"wl wl-kjv\" data-code=\"H7967\">Shallum</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> which <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> instead of <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> which went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of this <span class=\"wl wl-kjv\" data-code=\"H4725\">place;</span> He shall not return", "12": "But he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> whither they have led him <span class=\"wl wl-kjv\" data-code=\"H1540\">captive,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> this land", "13": "<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> unto him that <span class=\"wl wl-kjv\" data-code=\"H1129\">buildeth</span> his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3808\">by</span> <span class=\"wl wl-kjv\" data-code=\"H6664\">unrighteousness,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5944\">chambers</span> by <span class=\"wl wl-kjv\" data-code=\"H4941\">wrong;</span> that useth his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">service</span> without <span class=\"wl wl-kjv\" data-code=\"H2600\">wages,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> him not for his work;", "14": "That <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> I will <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> me a <span class=\"wl wl-kjv\" data-code=\"H4060\">wide</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> and <span class=\"wl wl-kjv\" data-code=\"H7304\">large</span> <span class=\"wl wl-kjv\" data-code=\"H5944\">chambers,</span> and cutteth him <span class=\"wl wl-kjv\" data-code=\"H7167\">out</span> <span class=\"wl wl-kjv\" data-code=\"H2474\">windows;</span> and it is <span class=\"wl wl-kjv\" data-code=\"H5603\">cieled</span> with <span class=\"wl wl-kjv\" data-code=\"H730\">cedar,</span> and <span class=\"wl wl-kjv\" data-code=\"H4886\">painted</span> with vermilion.", "15": "Shalt thou <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> because thou <span class=\"wl wl-kjv\" data-code=\"H8474\">closest</span> thyself in <span class=\"wl wl-kjv\" data-code=\"H730\">cedar?</span> did not thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> and <span class=\"wl wl-kjv\" data-code=\"H6666\">justice,</span> and then it was well", "16": "He <span class=\"wl wl-kjv\" data-code=\"H1777\">judged</span> the <span class=\"wl wl-kjv\" data-code=\"H1779\">cause</span> of the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> and <span class=\"wl wl-kjv\" data-code=\"H34\">needy;</span> then it was <span class=\"wl wl-kjv\" data-code=\"H2896\">well</span> with him: was not this to <span class=\"wl wl-kjv\" data-code=\"H1847\">know</span> me? <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "17": "But thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> and thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> are not but for thy <span class=\"wl wl-kjv\" data-code=\"H1215\">covetousness,</span> and for to <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and for <span class=\"wl wl-kjv\" data-code=\"H6233\">oppression,</span> and for <span class=\"wl wl-kjv\" data-code=\"H4835\">violence,</span> to do", "18": "Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> concerning <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> They shall not <span class=\"wl wl-kjv\" data-code=\"H5594\">lament</span> for him, saying, <span class=\"wl wl-kjv\" data-code=\"H1945\">Ah</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brother!</span> or, <span class=\"wl wl-kjv\" data-code=\"H1945\">Ah</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister!</span> they shall not <span class=\"wl wl-kjv\" data-code=\"H5594\">lament</span> for him, saying, <span class=\"wl wl-kjv\" data-code=\"H1945\">Ah</span> <span class=\"wl wl-kjv\" data-code=\"H113\">lord!</span> or, <span class=\"wl wl-kjv\" data-code=\"H1945\">Ah</span> his glory!", "19": "He shall be <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> with the <span class=\"wl wl-kjv\" data-code=\"H6900\">burial</span> of an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> <span class=\"wl wl-kjv\" data-code=\"H5498\">drawn</span> and cast <span class=\"wl wl-kjv\" data-code=\"H7993\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H1973\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of Jerusalem.", "20": "Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> and <span class=\"wl wl-kjv\" data-code=\"H6817\">cry;</span> and lift <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> in <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan,</span> and <span class=\"wl wl-kjv\" data-code=\"H6817\">cry</span> from the <span class=\"wl wl-kjv\" data-code=\"H5676\">passages:</span> for all thy <span class=\"wl wl-kjv\" data-code=\"H157\">lovers</span> are destroyed.", "21": "I <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto thee in thy <span class=\"wl wl-kjv\" data-code=\"H7962\">prosperity;</span> but thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear.</span> This hath been thy <span class=\"wl wl-kjv\" data-code=\"H1870\">manner</span> from thy <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyedst</span> not my voice.", "22": "The <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> shall eat <span class=\"wl wl-kjv\" data-code=\"H7462\">up</span> all thy <span class=\"wl wl-kjv\" data-code=\"H7462\">pastors,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H157\">lovers</span> shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> into <span class=\"wl wl-kjv\" data-code=\"H7628\">captivity:</span> surely then shalt thou be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> and <span class=\"wl wl-kjv\" data-code=\"H3637\">confounded</span> for all thy wickedness.", "23": "O <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> that makest thy <span class=\"wl wl-kjv\" data-code=\"H7077\">nest</span> in the <span class=\"wl wl-kjv\" data-code=\"H730\">cedars,</span> how <span class=\"wl wl-kjv\" data-code=\"H2603\">gracious</span> shalt thou be when <span class=\"wl wl-kjv\" data-code=\"H2256\">pangs</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon thee, the <span class=\"wl wl-kjv\" data-code=\"H2427\">pain</span> as of a woman in travail!", "24": "As I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> though <span class=\"wl wl-kjv\" data-code=\"H3659\">Coniah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> were the <span class=\"wl wl-kjv\" data-code=\"H2368\">signet</span> upon my <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> yet would I pluck", "25": "And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them whose <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> thou <span class=\"wl wl-kjv\" data-code=\"H3016\">fearest,</span> even into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the Chaldeans.", "26": "And I will cast thee <span class=\"wl wl-kjv\" data-code=\"H2904\">out,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> that <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> thee, into <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> where ye were not <span class=\"wl wl-kjv\" data-code=\"H3205\">born;</span> and there shall ye die.", "27": "But to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> whereunto they <span class=\"wl wl-kjv\" data-code=\"H5375\">desire</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> thither shall they not return.", "28": "Is this <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3659\">Coniah</span> a <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> <span class=\"wl wl-kjv\" data-code=\"H5310\">broken</span> <span class=\"wl wl-kjv\" data-code=\"H6089\">idol?</span> is he a <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> wherein is no <span class=\"wl wl-kjv\" data-code=\"H2656\">pleasure?</span> wherefore are they cast <span class=\"wl wl-kjv\" data-code=\"H7993\">out,</span> he and his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and are <span class=\"wl wl-kjv\" data-code=\"H2904\">cast</span> into a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which they know", "29": "O <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the LORD.", "30": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">Write</span> ye this <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6185\">childless,</span> a <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> that shall not <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> in his <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> for no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H4910\">ruling</span> any more in Judah."}};

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
