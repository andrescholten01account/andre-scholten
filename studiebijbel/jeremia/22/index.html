,"vertalingen":{"SVnu":{"1":"Zo zegt de HEERE: Ga naar het huis van de koning van Juda, en spreek daar dit woord.","2":"En zeg: Hoor het woord van de HEERE, koning van Juda, u die zit op de troon van David, u, en uw dienaren, en uw volk, die door deze poorten binnengaan!","3":"Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.","4":"Want als u deze zaak ernstig zult doen, dan zullen door de poorten van dit huis koningen binnengaan, zittend op de troon van David, rijdend op wagens en op paarden, hij, en zijn dienaren, en zijn volk.","5":"Als u daarentegen deze woorden niet zult horen, dan heb Ik bij Mijzelf gezworen, spreekt de HEERE, dat dit huis tot een woestenij worden zal.","6":"Want zo zegt de HEERE van het huis van de koning van Juda: U bent voor Mij een Gilead, een top van de Libanon; *maar* als Ik u niet maak *tot* een woestijn *en* onbewoonde steden!","7":"Want Ik zal verwoesters tegen u heiligen, ieder met zijn wapen; die zullen uw uitgelezen ceders omhakken, en in het vuur werpen.","8":"Dan zullen veel heidenvolken langs deze stad gaan, en zullen zeggen, ieder tegen zijn naaste: Waarom heeft de HEERE zo gedaan aan deze grote stad?","9":"En zij zullen zeggen: Omdat zij het verbond van de HEERE, hun God, hebben verlaten, en zich voor andere goden hebben neergebogen, en die gediend.","10":"Ween niet over de dode, en beklaag hem niet; ween vrij over hem die weggegaan is, want hij zal nooit meer terugkomen om het land van zijn geboorte te zien.","11":"Want zo zegt de HEERE van Sallum, de zoon van Josia, koning van Juda, die in de plaats van zijn vader Josia regeerde, die uit deze plaats is weggegaan: Hij zal daar nooit meer terugkomen.","12":"Maar op de plaats waarheen zij hem gevangen hebben weggevoerd, zal hij sterven, en dit land zal hij niet meer zien.","13":"Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft!","14":"Die zegt: Ik zal mij een zeer hoog huis bouwen, en ruime bovenzalen; en hij houwt er zich vensters in uit, en het is bedekt met ceder, en aangestreken met menie.","15":"Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, *en* ging het hem toen niet goed?","16":"Hij heeft de rechtszaak van de ellendige en behoeftige berecht, toen ging het *hem* goed; is dat niet Mij kennen? spreekt de HEERE.","17":"Maar uw ogen en uw hart zijn nergens op gericht dan op uw hebzucht, en op onschuldig bloed, om dat te vergieten, en op verdrukking en geweld, om *die* te doen.","18":"Daarom zegt de HEERE zo van Jojakim, zoon van Josia, koning van Juda: Zij zullen hem niet beklagen: Och, mijn broeder! of, och, zuster! Zij zullen hem niet beklagen: Och, heer! of, och, zijn majesteit!","19":"Met een ezelsbegrafenis zal hij begraven worden; men zal hem slepen en wegwerpen, ver weg van de poorten van Jeruzalem.","20":"Klim op de Libanon en roep, en verhef uw stem op de Basan; roep ook van de veren; maar al uw minnaars zijn verbroken.","21":"Ik sprak u aan in uw grote voorspoed, *maar* u zei: Ik zal niet horen. Dit is uw weg vanaf uw jeugd, dat u naar Mijn stem niet hebt geluisterd.","22":"De wind zal al uw herders weiden, en uw minnaars zullen in gevangenschap gaan; dan zult u zeker beschaamd worden en te schande gemaakt worden, vanwege al uw slechtheid.","23":"O u, die nu op de Libanon woont, *en* in de ceders nestelt! hoe genadig* zult u zijn, als de smarten u zullen overkomen, de pijn als van een barende vrouw!","24":"*Zo waarachtig als* Ik leef, spreekt de HEERE, al was Chonia, de zoon van Jojakim, de koning van Juda, een zegelring aan Mijn rechterhand, toch zal Ik u vandaar wegrukken.","25":"En Ik zal u geven in de hand van hen die uw leven zoeken, en in de hand van hen voor wier gezicht u beeft, namelijk in de hand van Nebukadnezar, de koning van Babel, en in de hand van de Chaldeeën.","26":"En Ik zal u, en uw moeder, die u gebaard heeft, wegwerpen in een ander land, waarin u niet geboren bent, en daar zult u sterven.","27":"En naar het land waar zij met heel hun ziel naar verlangen om daar terug te komen, daarheen zullen zij niet terugkomen.","28":"Is dan deze man Chonia een veracht, verbrijzeld afgodsbeeld? Of is hij een vat waaraan men geen lust heeft? Waarom zijn hij en zijn nageslacht weggeworpen, ja, weggeworpen in een land dat zij niet kennen?","29":"O land, land, land! hoor het woord van de HEERE!","30":"Zo zegt de HEERE: Schrijf deze man op als kinderloos, een man die niet voorspoedig zal zijn in zijn dagen; want niemand van zijn nageslacht zal voorspoedig zijn, zittend op de troon van David, en nog heersend in Juda."},"SV":{"1":"Alzo zegt de HEERE: Ga af *in* het huis des konings van Juda, en spreek aldaar dit woord.","2":"En zeg: Hoor het woord des HEEREN, gij koning van Juda, gij, die zit op Davids troon, gij, en uw knechten, en uw volk, die door deze poorten ingaan!","3":"Zo zegt de HEERE: Doet recht en gerechtigheid, en redt den beroofde uit de hand des verdrukkers; en onderdrukt den vreemdeling niet, den wees noch de weduwe; doet geen geweld en vergiet geen onschuldig bloed in deze plaats.","4":"Want indien gijlieden deze zaak ernstiglijk zult doen, zo zullen door de poorten van dit huis koningen ingaan, zittende den David op zijn troon, rijdende op wagens en op paarden, hij, en zijn knechten, en zijn volk.","5":"Indien gij daarentegen deze woorden niet zult horen, zo heb Ik bij Mij gezworen, spreekt de HEERE, dat dit huis tot een woestheid worden zal.","6":"Want zo zegt de HEERE van het huis des konings van Juda: Gij zijt Mij een Gilead, een hoogte van Libanon; *maar* zo Ik u niet zette *als* een woestijn *en* onbewoonde steden!","7":"Want Ik zal verdervers tegen u heiligen, elk met zijn gereedschap; die zullen uw uitgelezen cederen omhouwen, en in het vuur werpen.","8":"Dan zullen veel heidenen voorbij deze stad gaan, en zullen zeggen, een ieder tot zijn naaste: Waarom heeft de HEERE alzo gedaan aan deze grote stad?","9":"En zij zullen zeggen: Omdat zij het verbond des HEEREN, huns Gods, hebben verlaten, en hebben zich voor andere goden nedergebogen, en die gediend.","10":"Weent niet over den dode, en beklaagt hem niet; weent vrij over dien, die weggegaan is, want hij zal nimmermeer wederkomen, dat hij het land zijner geboorte zie.","11":"Want zo zegt de HEERE van Sallum, den zoon van Josia, koning van Juda, die in de plaats van zijn vader Josia regeerde, die uit deze plaats is uitgegaan: Hij zal daar nimmermeer wederkomen.","12":"Maar in de plaats, waarhenen zij hem gevankelijk hebben weggevoerd, zal hij sterven, en dit land zal hij niet meer zien.","13":"Wee dien, die zijn huis bouwt met ongerechtigheid, en zijn opperzalen met onrecht; die zijns naasten dienst om niet gebruikt, en geeft hen zijn arbeidsloon niet!","14":"Die daar zegt: Ik zal mij een zeer hoog huis bouwen, en doorluchtige opperzalen; en hij houwt zich vensteren uit, en het is bedekt met ceder, en aangestreken met menie.","15":"Zoudt gij regeren, omdat gij u mengt met den ceder? Heeft niet uw vader gegeten en gedronken, en recht en gerechtigheid gedaan, *en* het ging hem toen wel?","16":"Hij heeft de rechtzaak des ellendigen en nooddruftigen gericht, toen ging het *hem* wel; is dat niet Mij te kennen? spreekt de HEERE.","17":"Maar uw ogen en uw hart zijn niet dan op uw gierigheid, en op onschuldig bloed, om dat te vergieten, en op verdrukking en overlast, om *die* te doen.","18":"Daarom zegt de HEERE alzo van Jojakim, zoon van Josia, koning van Juda: Zij zullen hem niet beklagen: Och mijn broeder! of, och zuster! Zij zullen hem niet beklagen: Och, heer! of, och zijn majesteit!","19":"Met een ezelsbegrafenis zal hij begraven worden; men zal *hem* slepen en daarhenen werpen, verre weg van de poorten van Jeruzalem.","20":"Klim op den Libanon en roep, en verhef uw stem op den Basan; roep ook van de veren; maar al uw liefhebbers zijn verbroken.","21":"Ik sprak u aan in uw groten voorspoed, *maar* gij zeidet: Ik zal niet horen. Dit is uw weg van uw jeugd af, dat gij Mijner stem niet hebt gehoorzaamd.","22":"De wind zal al uw herders weiden, en uw liefhebbers zullen in de gevangenis gaan; dan zult gij zekerlijk beschaamd en te schande worden, vanwege al uw boosheid.","23":"O gij, die nu op den Libanon woont, *en* in de cederen nestelt! hoe begenadigd zult gij zijn, als u de smarten zullen aankomen, het wee als ener barende *vrouw*!","24":"*Zo* *waarachtig* *als* Ik leef, spreekt de HEERE, ofschoon Chonia, de zoon van Jojakim, den koning van Juda, een zegelring ware aan Mijn rechterhand, zo zal Ik u toch van daar wegrukken.","25":"En Ik zal u geven in de hand dergenen, die uw ziel zoeken, en in de hand dergenen, voor welker aangezicht gij schrikt, namelijk in de hand van Nebukadnezar, den koning van Babel, en in de hand der Chaldeen.","26":"En Ik zal u, en uw moeder, die u gebaard heeft, uitwerpen in een ander land, waarin gijlieden niet geboren zijt, en daar zult gij sterven.","27":"En in het land, naar hetwelk hun ziel verlangt om daar weder te komen, daarhenen zullen zij niet wederkomen.","28":"Is dan deze man Chonia een veracht, verstrooid, afgodisch beeld? Of is hij een vat, waaraan men geen lust heeft? Waarom zijn hij en zijn zaad uitgeworpen, ja, weggeworpen in een land, dat zij niet kennen?","29":"O land, land, land! hoor des HEEREN woord!","30":"Zo zegt de HEERE: Schrijft dezen zelfden man kinderloos, een man, *die* niet voorspoedig zal zijn in zijn dagen; want er zal niemand van zijn zaad voorspoedig zijn, zittende op den troon Davids, en heersende meer in Juda."},"KJV":{"1":"Thus saith the LORD; Go down to the house of the king of Judah, and speak there this word,","2":"And say, Hear the word of the LORD, O king of Judah, that sittest upon the throne of David, thou, and thy servants, and thy people that enter in by these gates:","3":"Thus saith the LORD; Execute ye judgment and righteousness, and deliver the spoiled out of the hand of the oppressor: and do no wrong, do no violence to the stranger, the fatherless, nor the widow, neither shed innocent blood in this place.","4":"For if ye do this thing indeed, then shall there enter in by the gates of this house kings sitting upon the throne of David, riding in chariots and on horses, he, and his servants, and his people.","5":"But if ye will not hear these words, I swear by myself, saith the LORD, that this house shall become a desolation.","6":"For thus saith the LORD unto the king's house of Judah; Thou *art* Gilead unto me, *and* the head of Lebanon: *yet* surely I will make thee a wilderness, *and* cities *which* are not inhabited.","7":"And I will prepare destroyers against thee, every one with his weapons: and they shall cut down thy choice cedars, and cast *them* into the fire.","8":"And many nations shall pass by this city, and they shall say every man to his neighbour, Wherefore hath the LORD done thus unto this great city?","9":"Then they shall answer, Because they have forsaken the covenant of the LORD their God, and worshipped other gods, and served","10":"Weep ye not for the dead, neither bemoan him: *but* weep sore for him that goeth away: for he shall return no more, nor see his native country.","11":"For thus saith the LORD touching Shallum the son of Josiah king of Judah, which reigned instead of Josiah his father, which went forth out of this place; He shall not return","12":"But he shall die in the place whither they have led him captive, and shall see this land","13":"Woe unto him that buildeth his house by unrighteousness, and his chambers by wrong; *that* useth his neighbour's service without wages, and giveth him not for his work;","14":"That saith, I will build me a wide house and large chambers, and cutteth him out windows; and *it is* cieled with cedar, and painted with vermilion.","15":"Shalt thou reign, because thou closest *thyself* in cedar? did not thy father eat and drink, and do judgment and justice, *and* then *it was* well","16":"He judged the cause of the poor and needy; then *it was* well *with him: was* not this to know me? saith the LORD.","17":"But thine eyes and thine heart *are* not but for thy covetousness, and for to shed innocent blood, and for oppression, and for violence, to do","18":"Therefore thus saith the LORD concerning Jehoiakim the son of Josiah king of Judah; They shall not lament for him, *saying*, Ah my brother! or, Ah sister! they shall not lament for him, *saying*, Ah lord! or, Ah his glory!","19":"He shall be buried with the burial of an ass, drawn and cast forth beyond the gates of Jerusalem.","20":"Go up to Lebanon, and cry; and lift up thy voice in Bashan, and cry from the passages: for all thy lovers are destroyed.","21":"I spake unto thee in thy prosperity; *but* thou saidst, I will not hear. This *hath been* thy manner from thy youth, that thou obeyedst not my voice.","22":"The wind shall eat up all thy pastors, and thy lovers shall go into captivity: surely then shalt thou be ashamed and confounded for all thy wickedness.","23":"O inhabitant of Lebanon, that makest thy nest in the cedars, how gracious shalt thou be when pangs come upon thee, the pain as of a woman in travail!","24":"*As* I live, saith the LORD, though Coniah the son of Jehoiakim king of Judah were the signet upon my right hand, yet would I pluck","25":"And I will give thee into the hand of them that seek thy life, and into the hand *of them* whose face thou fearest, even into the hand of Nebuchadrezzar king of Babylon, and into the hand of the Chaldeans.","26":"And I will cast thee out, and thy mother that bare thee, into another country, where ye were not born; and there shall ye die.","27":"But to the land whereunto they desire to return, thither shall they not return.","28":"*Is* this man Coniah a despised broke jv\" data-code=\"H1497\">spoiled</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6216\">oppressor:</span> and do no <span class=\"wl wl-kjv\" data-code=\"H3238\">wrong,</span> do no <span class=\"wl wl-kjv\" data-code=\"H2554\">violence</span> to the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger,</span> the <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless,</span> nor the <span class=\"wl wl-kjv\" data-code=\"H490\">widow,</span> neither <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> in this place.","4":"For if ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">indeed,</span> then shall there enter <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of this <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">riding</span> in <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> and on <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> he, and his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and his people.","5":"But if ye will not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> I <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> by myself, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that this <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall become a desolation.","6":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> Thou art <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> unto me, and the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon:</span> yet surely I will <span class=\"wl wl-kjv\" data-code=\"H7896\">make</span> thee a <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> which are not <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited.</span>","7":"And I will <span class=\"wl wl-kjv\" data-code=\"H6942\">prepare</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyers</span> against thee, every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> with his <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons:</span> and they shall cut <span class=\"wl wl-kjv\" data-code=\"H3772\">down</span> thy <span class=\"wl wl-kjv\" data-code=\"H4005\">choice</span> <span class=\"wl wl-kjv\" data-code=\"H730\">cedars,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">cast</span> them into the fire.","8":"And <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> by this <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> Wherefore hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> thus unto this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> city?","9":"Then they shall <span class=\"wl wl-kjv\" data-code=\"H559\">answer,</span> Because they have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and served","10":"<span class=\"wl wl-kjv\" data-code=\"H1058\">Weep</span> ye not for the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> neither <span class=\"wl wl-kjv\" data-code=\"H5110\">bemoan</span> him: but <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">sore</span> for him that goeth <span class=\"wl wl-kjv\" data-code=\"H1980\">away:</span> for he shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> no more, nor <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> his <span class=\"wl wl-kjv\" data-code=\"H4138\">native</span> country.","11":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H413\">touching</span> <span class=\"wl wl-kjv\" data-code=\"H7967\">Shallum</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> which <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> instead of <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> which went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of this <span class=\"wl wl-kjv\" data-code=\"H4725\">place;</span> He shall not return","12":"But he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> whither they have led him <span class=\"wl wl-kjv\" data-code=\"H1540\">captive,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> this land","13":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> unto him that <span class=\"wl wl-kjv\" data-code=\"H1129\">buildeth</span> his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3808\">by</span> <span class=\"wl wl-kjv\" data-code=\"H6664\">unrighteousness,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5944\">chambers</span> by <span class=\"wl wl-kjv\" data-code=\"H4941\">wrong;</span> that useth his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">service</span> without <span class=\"wl wl-kjv\" data-code=\"H2600\">wages,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> him not for his work;","14":"That <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> I will <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> me a <span class=\"wl wl-kjv\" data-code=\"H4060\">wide</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> and <span class=\"wl wl-kjv\" data-code=\"H7304\">large</span> <span class=\"wl wl-kjv\" data-code=\"H5944\">chambers,</span> and cutteth him <span class=\"wl wl-kjv\" data-code=\"H7167\">out</span> <span class=\"wl wl-kjv\" data-code=\"H2474\">windows;</span> and it is <span class=\"wl wl-kjv\" data-code=\"H5603\">cieled</span> with <span class=\"wl wl-kjv\" data-code=\"H730\">cedar,</span> and <span class=\"wl wl-kjv\" data-code=\"H4886\">painted</span> with vermilion.","15":"Shalt thou <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> because thou <span class=\"wl wl-kjv\" data-code=\"H8474\">closest</span> thyself in <span class=\"wl wl-kjv\" data-code=\"H730\">cedar?</span> did not thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> and <span class=\"wl wl-kjv\" data-code=\"H6666\">justice,</span> and then it was well","16":"He <span class=\"wl wl-kjv\" data-code=\"H1777\">judged</span> the <span class=\"wl wl-kjv\" data-code=\"H1779\">cause</span> of the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> and <span class=\"wl wl-kjv\" data-code=\"H34\">needy;</span> then it was <span class=\"wl wl-kjv\" data-code=\"H2896\">well</span> with him: was not this to <span class=\"wl wl-kjv\" data-code=\"H1847\">know</span> me? <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","17":"But thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> and thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> are not but for thy <span class=\"wl wl-kjv\" data-code=\"H1215\">covetousness,</span> and for to <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and for <span class=\"wl wl-kjv\" data-code=\"H6233\">oppression,</span> and for <span class=\"wl wl-kjv\" data-code=\"H4835\">violence,</span> to do","18":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> concerning <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> They shall not <span class=\"wl wl-kjv\" data-code=\"H5594\">lament</span> for him, saying, <span class=\"wl wl-kjv\" data-code=\"H1945\">Ah</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brother!</span> or, <span class=\"wl wl-kjv\" data-code=\"H1945\">Ah</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister!</span> they shall not <span class=\"wl wl-kjv\" data-code=\"H5594\">lament</span> for him, saying, <span class=\"wl wl-kjv\" data-code=\"H1945\">Ah</span> <span class=\"wl wl-kjv\" data-code=\"H113\">lord!</span> or, <span class=\"wl wl-kjv\" data-code=\"H1945\">Ah</span> his glory!","19":"He shall be <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> with the <span class=\"wl wl-kjv\" data-code=\"H6900\">burial</span> of an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> <span class=\"wl wl-kjv\" data-code=\"H5498\">drawn</span> and cast <span class=\"wl wl-kjv\" data-code=\"H7993\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H1973\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of Jerusalem.","20":"Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> and <span class=\"wl wl-kjv\" data-code=\"H6817\">cry;</span> and lift <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> in <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan,</span> and <span class=\"wl wl-kjv\" data-code=\"H6817\">cry</span> from the <span class=\"wl wl-kjv\" data-code=\"H5676\">passages:</span> for all thy <span class=\"wl wl-kjv\" data-code=\"H157\">lovers</span> are destroyed.","21":"I <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto thee in thy <span class=\"wl wl-kjv\" data-code=\"H7962\">prosperity;</span> but thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear.</span> This hath been thy <span class=\"wl wl-kjv\" data-code=\"H1870\">manner</span> from thy <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyedst</span> not my voice.","22":"The <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> shall eat <span class=\"wl wl-kjv\" data-code=\"H7462\">up</span> all thy <span class=\"wl wl-kjv\" data-code=\"H7462\">pastors,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H157\">lovers</span> shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> into <span class=\"wl wl-kjv\" data-code=\"H7628\">captivity:</span> surely then shalt thou be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> and <span class=\"wl wl-kjv\" data-code=\"H3637\">confounded</span> for all thy wickedness.","23":"O <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> that makest thy <span class=\"wl wl-kjv\" data-code=\"H7077\">nest</span> in the <span class=\"wl wl-kjv\" data-code=\"H730\">cedars,</span> how <span class=\"wl wl-kjv\" data-code=\"H2603\">gracious</span> shalt thou be when <span class=\"wl wl-kjv\" data-code=\"H2256\">pangs</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon thee, the <span class=\"wl wl-kjv\" data-code=\"H2427\">pain</span> as of a woman in travail!","24":"As I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> though <span class=\"wl wl-kjv\" data-code=\"H3659\">Coniah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> were the <span class=\"wl wl-kjv\" data-code=\"H2368\">signet</span> upon my <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> yet would I pluck","25":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them whose <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> thou <span class=\"wl wl-kjv\" data-code=\"H3016\">fearest,</span> even into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the Chaldeans.","26":"And I will cast thee <span class=\"wl wl-kjv\" data-code=\"H2904\">out,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> that <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> thee, into <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> where ye were not <span class=\"wl wl-kjv\" data-code=\"H3205\">born;</span> and there shall ye die.","27":"But to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> whereunto they <span class=\"wl wl-kjv\" data-code=\"H5375\">desire</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> thither shall they not return.","28":"Is this <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3659\">Coniah</span> a <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> <span c estorven is. Dit duiden sommigen op den koning Jojachin, die daarna gevankelijk gegaan is naar Babel, en aldaar gestorven, 2Ki 24:15 , en 2Ki 25:29 , alsook Zedekia, 2Ki 25:7 , en zetten het over: de weggaande, of die weggaan zal; doch men heeft te letten op de volgende woorden."}],"11":[{"catchword":"Sallum,","tekst":"Deze is [naar sommiger gevoelen] Joahaz, ook genoemd Jehoahaz, en Johanan, zoon van Josia. Zie 2Ki 23:31 ; 2Ch 36:1-2 ; vergelijk 2Ki 15:13 , en 2Ki 23:31 ; 1Ch 3:15 wordt ook een vierde zoon van Josia met dezen naam genoemd."}],"13":[{"catchword":"Wee dien,","tekst":"Of, hei, o gij, die, enz. dit, alsook het volgende, ziet op den koning Jojakim [zie onder vs.18], die beschuldigd wordt van pracht, overdaad, onrechtvaardigheid, gierigheid en tirannie."},{"catchword":"met ongerechtigheid,","tekst":"Hebreeuws, met niet gerechtigheid; dat is, met gene gerechtigheid, of zonder gerechtigheid."},{"catchword":"met onrecht;","tekst":"Hebreeuws, met niet recht."},{"catchword":"zijns naasten","tekst":"Of, zich dient van zijnen naaste, gebruikende zijnen arbeid, of hem dwingt te dienen; vergelijk onder Jer 25:14 , en Jer 27:7 , en Jer 30:8 , en Jer 34:9 ."},{"catchword":"arbeidsloon","tekst":"Hebreeuws eigenlijk, werk, of arbeid; dat is, arbeidsloon, gelijk Num 22:7 , waarzegging, of voorzeggingen, voor, loon der waarzeggingen; zie wijders Lev 19:13 ; Isa 49:4 ; Eze 29:20 ."}],"14":[{"catchword":"zeer hoog","tekst":"Hebreeuws, een huis der maten; dat is, zonderling of bovenmate hoog of groot; vergelijk Num 13:32 ."},{"catchword":"doorluchtige","tekst":"Waarin men lucht kan scheppen, of waar de wind kan doorwaaien, dat is, wijd, luchtig."},{"catchword":"en hij houwt","tekst":"Anders: die mijne vensters voor zich daar uitscheurt, en dat met ceder beschoten is, en bemaalt het met menie, enz. Verstaande dat Jojakim uit Gods huis heeft laten uitbreken, tot gebruik van zijn gebouw, wat hem beliefde, latende het daarna met allerlei verwen zo overstrijken, dat men het ni ","tekst":"Dat is, nu aldus praalt met gebouwen van cederen, die gij van den Libanon haalt. Dit schijnt voornamelijk te zien op des konings huis, waarvan in het volgende."},{"catchword":"hoe begenadigd","tekst":"Alsof de Heere zeide: U zal gans gene genade noch gunst wedervaren van de Babyloniërs, maar het tegendeel, gelijk volgt. Anders: hoe gunstrijk, of aangenaam zult gij zijn? of hoe zult gij smeken?"}],"24":[{"catchword":"Chónia,","tekst":"Hebreeuws, Chonjahu; ook genoemd Jechonia, 1Ch 3:16 , en Jojachin, 2Ki 24:6 , 2Ki 24:8 ."},{"catchword":"zegelring","tekst":"Dat is, nog zo lief en aangenaam jongeling, met verscheiden weldaden van mij versierd en gekroond, en van Davids zaad, dies zij meenden dat de opvolging ongetwijfeld zou zijn, en dat zij van Babel geen nood hadden; zie gelijke manier van spreken Son 8:6 ; Hag 2:24 ."},{"catchword":"u","tekst":"Hier spreekt God Chonia zelf aan."},{"catchword":"Van daar wegrukken","tekst":"Dit kan men verstaan van de rechterhand, of van Jeruzalem, uit het koninklijke hof en uit Joden, vermits zijne wegvoering naar Babel, gelijk volgt."}],"25":[{"catchword":"ziel zoeken,","tekst":"U naar het leven staan, gelijk dikwijls."}],"27":[{"catchword":"hun ziel","tekst":"Hebreeuws, zij hunne ziel opheffen; dat is, begeerte, lust, verlangen naar hebben. Zie Deu 24:15 ; Psa 24:4 ; alzo onder Jer 44:14 ."}],"28":[{"catchword":"Is dan deze man","tekst":"Dit wordt vragenderwijze, als in des volks naam, voorgesteld, waarop Gods antwoord volgt. Het blijkt dat men veel van hem gehouden heeft vanwege zijne bevalligheid."},{"catchword":"afgodisch beeld?","tekst":"Of, beeld, dat veracht is en in stukken behoort geslagen te worden, alzo dat de stukken verstrooid worden. Van het Hebreeuwse woord, betekenende een afgod of afgodisch beeld, zie 1Sa 31:9 ; 2Sa 5:21 ."},{"catchword":"vat,","tekst":"Of, waar niets behagelijks in is; vergelijk onder Jer 48:38 ; Hos 8:8 ."},{"catchword":"zijn zaad","tekst":"Dat is, kinderen, die hij zou mogen krijgen, // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
