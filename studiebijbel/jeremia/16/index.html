}},"vertalingen":{"SVnu":{"1":"En het woord van de HEERE kwam tot mij, en Hij zei:","2":"U zult zich geen vrouw nemen, en u zult geen zonen of dochters hebben in deze plaats.","3":"Want zo zegt de HEERE van de zonen en van de dochters, die in deze plaats geboren worden; en van hun moeders, die hen baren, en van hun vaders, die hen verwekken in dit land:","4":"Zij zullen pijnlijke doden sterven, zij zullen niet beklaagd en niet begraven worden, zij zullen tot mest op de aardbodem zijn, en zij zullen door het zwaard en door de honger verteerd worden, en hun dode lichamen zullen voedsel zijn voor de vogels van de hemel en voor de dieren van de aarde.","5":"Want zo zegt de HEERE: Ga niet in het huis van hem die een rouwmaaltijd houdt, en ga niet heen om te rouwklagen, en heb geen medelijden met hen; want Ik heb van dit volk (spreekt de HEERE) Mijn vrede weggenomen, en Mijn goedertierenheid en barmhartigheden;","6":"Zodat groten en kleinen in dit land zullen sterven, zij zullen niet begraven worden; en men zal hen niet beklagen, noch zichzelf insnijden, noch zich kaal maken om hen.","7":"Ook zal men hun niets uitdelen bij de rouw, om iemand te troosten over een dode; noch hun te drinken geven uit de troostbeker, vanwege iemands vader of moeder.","8":"Ga ook niet in een huis van het maaltijd, om bij hen te zitten, om te eten en te drinken.","9":"Want zo zegt de HEERE van de heerscharen*, de God van Israël: Zie, Ik zal van deze plaats, voor uw ogen en in uw dagen, doen ophouden de stem van de vreugde en de stem van de blijdschap, de stem van de bruidegom en de stem van de bruid.","10":"En het zal gebeuren, als u dit volk al deze woorden aanzegt, en zij tegen u zeggen: Waarom spreekt de HEERE al dit grote kwaad over ons, en wat is onze misdaad, en wat is onze zonde, die wij tegen de HEERE, onze God, gezondigd hebben?","11":"Dat u tegen hen zult zeggen: Omdat uw vaders Mij verlaten hebben, spreekt de HEERE, en andere goden nagewandeld hebben, en die gediend hebben, en zich voor die neergebogen hebben; maar Mij verlaten hebben, en Mijn wet niet gehouden hebben;","12":"En u erger gedaan hebt dan uw vaders; want zie, u wandelt, ieder naar het goeddunken van zijn slechte hart, om naar Mij niet te horen.","13":"Daarom zal Ik u uit dit land werpen, in een land, dat u niet gekend hebt, u noch uw vaders; en daar zult u andere goden dienen, dag en nacht, omdat Ik u geen genade zal geven.","14":"Daarom, zie, de dagen komen, spreekt de HEERE, dat er niet meer gezegd zal worden: *Zo waarachtig als* de HEERE leeft, Die de kinderen van Israël uit Egypteland heeft opgevoerd!","15":"Maar: *Zo waarachtig als* de HEERE leeft, Die de kinderen van Israël heeft opgevoerd uit het land van het noorden, en uit al de landen waarheen Hij hen gedreven had! Want Ik zal hen terugbrengen in hun land, dat Ik hun vaderen gegeven heb.","16":"Zie, Ik zal zenden tot veel vissers, spreekt de HEERE, die zullen hen vissen; en daarna zal Ik zenden tot veel jagers, die zullen hen jagen, van elke berg, en van elke heuvel, ja, uit de kloven van de steenrotsen.","17":"Want Mijn ogen zijn op al hun wegen; zij zijn voor Mijn aangezicht niet verborgen, en hun ongerechtigheid is niet verhuld voor Mijn ogen.","18":"Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.","19":"O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.","20":"Zal een mens zich goden maken? Zij zijn toch geen goden.","21":"Daarom, zie, Ik zal hun bekendmaken op dit moment; Ik zal hun Mijn hand en Mijn macht bekendmaken; en zij zullen weten, dat Mijn Naam is HEERE."},"SV":{"1":"En des HEEREN woord geschiedde tot mij, zeggende:","2":"Gij zult u geen vrouw nemen, en gij zult geen zonen noch dochteren hebben in deze plaats.","3":"Want zo zegt de HEERE van de zonen en van de dochteren, die in deze plaats geboren worden; daartoe van hun moeders, die ze baren, en van hun vaders, die ze gewinnen in dit land:","4":"Zij zullen pijnlijke doden sterven, zij zullen niet beklaagd noch begraven worden, zij zullen tot mest op den aardbodem zijn, en zij zullen door het zwaard en door den honger verteerd worden, en hun dode lichamen zullen het gevogelte des hemels en het gedierte der aarde tot spijze zijn.","5":"Want zo zegt de HEERE: Ga niet in het huis desgenen, die een rouwmaaltijd houdt, en ga niet henen om te rouwklagen, en heb geen medelijden met hen; want Ik heb van dit volk ( spreekt de HEERE) weggenomen Mijn vrede, goedertierenheid en barmhartigheden;","6":"Zodat groten en kleinen in dit land zullen sterven, zij zullen niet begraven worden; en men zal hen niet beklagen, noch zichzelven insnijden, noch kaal maken om hunnentwil.","7":"Ook zal men hun niets uitdelen over den rouw, om iemand te troosten over een dode; noch hun te drinken geven uit den troostbeker, over iemands vader of over iemands moeder.","8":"Ga ook niet in een huis des maaltijds, om bij hen te zitten, om te eten en te drinken.","9":"Want zo zegt de HEERE der heirscharen, de God Israëls: Ziet, Ik zal van deze plaats, voor ulieder ogen en in ulieder dagen, doen ophouden de stem der vreugde en de stem der blijdschap, de stem des bruidegoms en de stem der bruid.","10":"En het zal geschieden, als gij dit volk al deze woorden zult aanzeggen, en zij tot u zeggen: Waarom spreekt de HEERE al dit grote kwaad over ons, en welke is onze misdaad, en welke is onze zonde, die wij tegen den HEERE, onzen God, gezondigd hebben?","11":"Dat gij tot hen zult zeggen: Omdat uw vaders Mij verlaten hebben, spreekt de HEERE, en hebben andere goden nagewandeld, en die gediend, en zich voor die nedergebogen; maar Mij verlaten, en Mijn wet niet gehouden hebben;","12":"En gijlieden erger gedaan hebt dan uw vaderen; want ziet, gijlieden wandelt, een iegelijk naar het goeddunken van zijn boos hart, om naar Mij niet te horen.","13":"Daarom zal Ik ulieden uit dit land werpen, in een land, dat gij niet gekend hebt, gij noch uw vaders; en aldaar zult gij andere goden dienen, dag en nacht, omdat Ik u geen genade zal geven.","14":"Daarom, ziet, de dagen komen, spreekt de HEERE, dat er niet meer zal gezegd worden: *Zo* *waarachtig* *als* de HEERE leeft, Die de kinderen Israëls uit Egypteland heeft opgevoerd!","15":"Maar: *Zo* *waarachtig* *als* de HEERE leeft, Die de kinderen Israëls heeft opgevoerd uit het land van het noorden, en uit al de landen waarhenen Hij hen gedreven had! want Ik zal hen wederbrengen in hun land, dat Ik hun vaderen gegeven heb.","16":"Ziet, Ik zal zenden tot veel vissers, spreekt de HEERE, die zullen hen vissen; en daarna zal Ik zenden tot veel jagers, die zullen hen jagen, van op allen berg, en van op allen heuvel, ja, uit de kloven der steenrotsen.","17":"Want Mijn ogen zijn op al hun wegen; zij zijn voor Mijn aangezicht niet verborgen, noch hun ongerechtigheid verholen van voor Mijn ogen.","18":"Dies zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen hunner verfoeiselen en hunner gruwelen vervuld.","19":"O HEERE! Gij zijt mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage der benauwdheid; tot U zullen de heidenen komen van de einden der aarde, en zeggen: Immers hebben onze vaders leugen erfelijk bezeten, *en* ijdelheid, waarin toch niets was, dat nut deed.","20":"Zal een mens zich goden maken? Zij zijn toch geen goden.","21":"Daarom, ziet, Ik zal hun bekend maken op ditmaal; Ik zal hun bekend maken Mijn hand en Mijn macht; en zij zullen weten, dat Mijn Naam is HEERE."},"KJV":{"1":"The word of the LORD came also unto me, saying,","2":"Thou shalt not take thee a wife, neither shalt thou have sons or daughters in this place.","3":"For thus saith the LORD concerning the sons and concerning the daughters that are born in this place, and concerning their mothers that bare them, and concerning their fathers that begat them in this land;","4":"They shall die of grievous deaths; they shall not be lamented; neither shall they be buried; *but* they shall be as dung upon the face of the earth: and they shall be consumed by the sword, and by famine; and their carcases shall be meat for the fowls of heaven, and for the beasts of the earth.","5":"For thus saith the LORD, Enter not into the house of mourning, neither go to lament nor bemoan them: for I have taken away my peace from this people, saith the LORD, *even* lovingkindness and mercies.","6":"Both the great and the small shall die in this land: they shall not be buried, neither shall *men* lament for them, nor cut themselves, nor make themselves bald","7":"Neither shall *men* tear *themselves* for them in mourning, to comfort them for the dead; neither shall *men* give them the cup of consolation to drink for their father or for their mother.","8":"Thou shalt not also go into the house of feasting, to sit with them to eat and to drink.","9":"For thus saith the LORD of hosts, the God of Israel; Behold, I will cause to cease out of this place in your eyes, and in your days, the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride.","10":"And it shall come to pass, when thou shalt shew this people all these words, and they shall say unto thee, Wherefore hath the LORD pronounced all this great evil against us? or what *is* our iniquity? or what *is* our sin that we have committed against the LORD our God?","11":"Then shalt thou say unto them, Because your fathers have forsaken me, saith the LORD, and have walked after other gods, and have served them, and have worshipped them, and have forsaken me, and have not kept my law;","12":"And ye have done worse than your fathers; for, behold, ye walk every one after the imagination of his evil heart, that they may not hearken","13":"Therefore will I cast you out of this land into a land that ye know not, *neither* ye nor your fathers; and there shall ye serve other gods day and night; where I will not shew you favour.","14":"Therefore, behold, the days come, saith the LORD, that it shall no more be said, The LORD liveth, that brought up the children of Israel out of the land of Egypt;","15":"But, The LORD liveth, that brought up the children of Israel from the land of the north, and from all the lands whither he had driven them: and I will bring them again into their land that I gave unto their fathers.","16":"Behold, I will send for many fishers, saith the LORD, and they shall fish them; and after will I send for many hunters, and they shall hunt them from every mountain, and from every hill, and out of the holes of the rocks.","17":"For mine eyes *are* upon all their ways: they are not hid from my face, neither is their iniquity hid from mine eyes.","18":"And first I will recompense their iniquity and their sin double; because they have defiled my land, they have filled mine inheritance with the carcases of their detestable and abominable things.","19":"O LORD, my strength, and my fortress, and my refuge in the day of affliction, the Gentiles shall come unto thee from the ends of the earth, and shall say, Surely our fathers have inherited lies, vanity, and *things* wherein *there is* no profit.","20":"Shall a man make gods unto himself, and they *are* no gods?","21":"Therefore, behold, I will this once cause them to know, I will cause them to know mine hand and my might; and they shall know that my name *is* The LORD."}},"tsk":{"1":[{"kopje":"Het woord","refs":["Jer 1:2","Jer 1:4","Jer 2:1"]}],"3":[{"kopje":"zo zegt de HEERE","refs":["Jer 16:5","Jer 16:9"]}],"4":[{"kopje":"die","refs":["Jer 14:16","Jer 15:2","Jer 15:3","Ps 78:64"]},{"kopje":"niet beklaagd","refs":["Jer 16:5-7","Jer 22:18","Jer 25:33","Amos 6:9","Amos 6:1 class=\"wl\" data-l=\"L3\" data-code=\"H1369\">en</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3045\">zij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3045\">zullen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3045\">weten</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H8034\">dat</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8034\">Mijn</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8034\">Naam</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8034\">is</span> HEERE."},"koppeling_kjv":{"1":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came also unto me, saying,","2":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee a <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> neither shalt thou have <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> or <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> in this place.","3":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and concerning the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> that are <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> in this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and concerning their <span class=\"wl wl-kjv\" data-code=\"H517\">mothers</span> that <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> them, and concerning their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> that <span class=\"wl wl-kjv\" data-code=\"H3209\">begat</span> them in this land;","4":"They shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> of <span class=\"wl wl-kjv\" data-code=\"H8463\">grievous</span> <span class=\"wl wl-kjv\" data-code=\"H4463\">deaths;</span> they shall not be <span class=\"wl wl-kjv\" data-code=\"H5594\">lamented;</span> neither shall they be <span class=\"wl wl-kjv\" data-code=\"H6912\">buried;</span> but they shall be as <span class=\"wl wl-kjv\" data-code=\"H1828\">dung</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth:</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and by <span class=\"wl wl-kjv\" data-code=\"H7458\">famine;</span> and their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcases</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3978\">meat</span> for the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> of the earth.","5":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Enter</span> not into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H4798\">mourning,</span> neither <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H5594\">lament</span> nor <span class=\"wl wl-kjv\" data-code=\"H5110\">bemoan</span> them: for I have taken <span class=\"wl wl-kjv\" data-code=\"H622\">away</span> my <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> from this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> even <span class=\"wl wl-kjv\" data-code=\"H2617\">lovingkindness</span> and mercies.","6":"Both the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and the <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> shall <span class=\"wl wl-kj ce</span> of <span class=\"wl wl-kjv\" data-code=\"H8342\">mirth,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness,</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H2860\">bridegroom,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the bride.","10":"And it shall come to pass, when thou shalt <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto thee, Wherefore hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">pronounced</span> all this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> against us? or what is our <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity?</span> or what is our <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> that we have <span class=\"wl wl-kjv\" data-code=\"H2398\">committed</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our God?","11":"Then shalt thou <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Because your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and have <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and have <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> the /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
