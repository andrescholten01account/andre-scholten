el, die zij voor die gelegenheid gemaakt hadden; en naast hem stonden Mattithja, Sema, Anaja, Uria, Hilkia en Maaseja, aan zijn rechterhand; en aan zijn linkerhand Pedaja, Misael, Malchia, Hasum, Hasbaddana, Zacharja en Mesullam.", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Jer 38:14": "Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.", "Job 29:17": "En ik verbrak de baktanden van de verkeerde, en wierp de roof uit zijn tanden.", "Luk 18:3-5": "En er was een zekere weduwe in dezelfde stad, en zij kwam naar hem toe en zei: Doe mij recht tegenover mijn tegenpartij. En hij wilde dat een lange tijd niet; maar daarna zei hij bij zichzelf: Hoewel ik God niet vrees en geen mens ontzie, toch, omdat deze weduwe het mij zo moeilijk maakt, zal ik haar recht doen, zodat ze niet uiteindelijk komt en mij uitput.", "Spr 25:2": "Het is de eer van God om een zaak te verbergen; maar de eer van koningen om een zaak te doorgronden.", "Spr 1:21": "Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad;", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Jer 27:2-6": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals. En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda. En beveel hun om tegen hun heren te zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zo zult u tegen uw heren zeggen:", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Matt 22:9": "Ga daarom naar de kruispunten van de wegen, en roep zovelen als u er zult vinden, naar de bruiloft.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Hebr 5:9": "En nadat Hij volmaakt gemaakt was, is Hij voor allen die Hem gehoorzaam zijn een oorzaak van eeuwige zaligheid geworden;", "Jes 30:2": "Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Jer 39:8": "En de Chaldeeën verbrandden het huis van de koning en de huizen van het volk met vuur; en zij braken de muren van Jeruzalem af.", "Deut 9:14": "Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is.", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "Ezech 9:6": "Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren.", "Ezech 14:17": "Of als Ik het zwaard breng over datzelfde land, en zeg: Zwaard! ga door dat land, zodat Ik daaruit mensen en beesten uitroei;", "Matt 21:33": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "1 Sam 28:6": "En Saul vroeg de HEERE, maar de HEERE antwoordde hem niet; niet door dromen, niet door de Urim, niet door de profeten.", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "Spr 29:14": "Een koning die de armen in trouw recht doet, diens troon zal voor eeuwig bevestigd worden.", "Luk 23:28-31": "En Jezus keerde Zich naar hen toe en zei: Dochters van Jeruzalem, weent niet over Mij, maar weent over uzelf, en over uw kinderen. Want zie, er komen dagen waarin men zal zeggen: Zalig zijn de onvruchtbaren, en de buiken die niet gebaard hebben, en de borsten die niet gezoogd hebben. Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Spr 29:12": "Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.", "Jer 37:7": "Zo zegt de HEERE, de God van Israël: Zo zult u zeggen tegen de koning van Juda, die u naar Mij gestuurd heeft om Mij te raadplegen: Zie, het leger van Farao, dat u ter hulp is uitgetrokken, zal terugkeren naar zijn land, naar Egypte;", "Jer 52:18": "Ook namen zij de potten, en de schoffels, en de gaffels, en de sprenkelschalen, en de rookschalen, en al de koperen vaten waarmee men de dienst deed.", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Matt 22:10": "En diezelfde dienstknechten gingen de wegen op en brachten allen bijeen die zij vonden, zowel slechten als goeden; en de bruiloft werd vervuld met gasten die aanzaten.", "Ezech 30:10": "Zo zegt de Heere HEERE: Ja, Ik zal de menigte van Egypte doen ophouden, door de hand van Nebukadrezar, de koning van Babel.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Klaagl 4:11": "Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "2 Kron 9:8": "Geloofd zij de HEERE, uw God, Die behagen in u gehad heeft, om u op Zijn troon te zetten, tot een koning voor de HEERE, uw God; omdat uw God Israël liefheeft, om het voor eeuwig op te richten, daarom heeft Hij u tot koning over hen gesteld, om recht en gerechtigheid te doen.", "Jes 36:6": "Zie, u vertrouwt op die gebroken rietstaf, op Egypte; als iemand daarop leunt, zal hij in zijn hand gaan en die doorboren; zo is farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Deut 28:50": "Een volk, hard van gezicht, dat geen ontzag zal hebben voor de oude, noch genadig zal zijn voor de jonge.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "Klaagl 4:17": "Ain. Nog steeds bezweken onze ogen, terwijl ze uitkeken naar onze nutteloze hulp; wij tuurden met gespannen aandacht naar een volk dat niet kon verlossen.", "Jer 6:29": "De blaasbalg is verbrand, het lood is door het vuur verteerd; tevergeefs heeft de smelter zo vlijtig gesmolten, omdat de bozen niet afgetrokken zijn.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Jer 21:4-7": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "Jes 1:1-24": "Het visioen van Jesaja, de zoon van Amoz, dat hij zag over Juda en Jeruzalem, in de dagen van Uzzia, Jotham, Achaz en Hizkia, de koningen van Juda. Hoor, hemelen! en neem het ter oor, aarde! Want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd, maar zij hebben tegen Mij overtreden. Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Jer 2:37": "U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen.", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Deut 1:16": "En ik gebood in die tijd uw rechters, en zei: Hoor de geschillen tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling.", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "1 Kron 3:15": "De zonen van Josia nu waren deze: de eerstgeborene Johanan, de tweede Jojakim, de derde Zedekia, de vierde Sallum.", "Jer 34:17": "Daarom zegt de HEERE zo: U hebt naar Mij niet gehoord, om vrijheid uit te roepen, ieder voor zijn broeder, en ieder voor zijn naaste; zie, zo roep Ik tegen u uit, spreekt de HEERE, een vrijheid ten zwaard, ter pest, en ten honger, en zal u overgeven ter opschudding aan alle koninkrijken van de aarde.", "2 Sam 5:6": "En de koning trok met zijn mannen naar Jeruzalem, tegen de Jebusieten, die in dat land woonden. En zij zeiden tegen David: U zult hier niet binnenkomen, maar de blinden en kreupelen zullen u wegjagen; dat wil zeggen: David zal hier niet binnenkomen.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "Hos 9:12": "Ofschoon zij hun kinderen mochten grootbrengen, Ik zal hen er toch van beroven, zodat er geen mens over zal blijven; want ook, wee hun, wanneer Ik van hen zal zijn weggegaan!", "Lev 19:15": "U zult geen onrecht doen in het gericht; u zult het aangezicht van de geringe niet aannemen, noch het aangezicht van de grote voortrekken; in gerechtigheid zult u uw naaste rechtspreken.", "Ps 87:4": "Ik zal Rahab en Babel vermelden, onder hen die Mij kennen; zie, de Filistijn en de Tyriër, met de Moor, deze is daar geboren.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Deut 9:18-20": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken. Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment. Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "2 Kor 6:1": "En wij, als medearbeiders, bidden u ook dat u de genade van God niet tevergeefs mag hebben ontvangen.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Zef 3:5": "De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "Luk 1:69": "en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Job 27:13-23": "Dit is het deel van de goddeloze mens bij God, en de erve van de tirannen, die zij van de Almachtige ontvangen zullen. Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden. Zijn overgeblevenen zullen in de dood begraven worden, en zijn weduwen zullen niet wenen.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Jer 22:15-17": "Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed? Hij heeft de rechtszaak van de ellendige en behoeftige berecht, toen ging het hem goed; is dat niet Mij kennen? spreekt de HEERE. Maar uw ogen en uw hart zijn nergens op gericht dan op uw hebzucht, en op onschuldig bloed, om dat te vergieten, en op verdrukking en geweld, om die te doen.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Joh 13:37": "Petrus zei tegen Hem: Heere, waarom kan ik U nu niet volgen? Ik zal mijn leven voor U geven.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Dan 9:2": "in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Jes 21:1-10": "De last die rust op de woestijn aan de zee. Zoals wervelwinden in het zuiden voorbijtrekken, zo komt het uit de woestijn, uit een schrikwekkend land. Een hard visioen is mij bekendgemaakt: die trouweloze handelt trouweloos, en die verwoester verwoest; trek op, o Elam! beleger het, o Media! Ik heb al haar gezucht doen ophouden. Daarom zijn mijn lendenen vol grote pijn, weeën hebben mij aangegrepen, zoals de weeën van een barende vrouw; ik krom mij van wat ik hoor, ik word ontsteld van wat ik zie.", "Matt 26:33-35": "Doch Petrus antwoordde en zei tegen Hem: Al werden zij ook allen aan U geërgerd, ik zal nooit geërgerd worden. Jezus zei tegen hem: Voorwaar, Ik zeg u dat u in deze zelfde nacht, voordat de haan gekraaid zal hebben, Mij driemaal zult verloochenen. Petrus zei tegen Hem: Al moest ik ook met U sterven, ik zal U geenszins verloochenen! Hetzelfde zeiden ook alle discipelen.", "Amos 6:1": "Wee de geruste mensen in Sion, en degenen die zeker zijn op de berg van Samaria! Zij zijn de voornaamste van de eerstelingen der volken, en tot hen komen die van het huis van Israël.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Deut 4:23": "Wacht u ervoor dat u het verbond van de HEERE, uw God, dat Hij met u gesloten heeft, vergeet, zodat u een gesneden beeld zou maken, de gelijkenis van iets dat de HEERE, uw God, u verboden heeft.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "Joh 12:32": "En Ik, wanneer Ik van de aarde verhoogd zal zijn, zal allen tot Mij trekken.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Jer 45:5": "En zou u voor uzelf grote dingen zoeken? Zoek ze niet; want zie, Ik breng een kwaad over alle vlees, spreekt de HEERE; maar Ik zal u uw leven tot een buit geven, in alle plaatsen waarheen u zult heentrekken.", "Ezra 2:38": "De kinderen van Pashur, duizend tweehonderdzevenenveertig.", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Mark 14:29-31": "En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen. En Jezus zei tegen hem: Voorwaar, Ik zeg u, dat u heden, in deze nacht, voordat de haan tweemaal gekraaid zal hebben, Mij driemaal zult verloochenen. Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.", "Ezech 29:18-20": "Mensenkind! Nebukadrezar, de koning van Babel, heeft zijn leger een grote dienst laten verrichten tegen Tyrus; alle hoofden zijn kaal geworden, en alle zijden zijn opengeschuurd; en noch hij, noch zijn leger heeft loon gehad vanwege Tyrus, voor de dienst die hij tegen haar verricht heeft. Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger. Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Jes 32:9-14": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "Zach 7:9-11": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander; en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads. Maar zij weigerden op te letten, en trokken hun schouder terug, en zij verzwaarden hun oren, zodat zij niet hoorden.", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "2 Kon 25:5-7": "Doch het leger van de Chaldeeën jaagde de koning na, en zij achterhaalden hem in de vlakke velden van Jericho, en heel zijn leger raakte van bij hem verstrooid. Zij dan grepen de koning, en voerden hem op naar de koning van Babel, naar Ribla; en zij spraken een oordeel tegen hem. En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia's ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Micha 2:10": "Maak u dan op en ga heen; want dit land zal de rust niet zijn; omdat het verontreinigd is, zal het u verderven, en dat met een hevige verderving.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "Joh 11:51": "En dit zei hij niet uit zichzelf; maar omdat hij dat jaar hogepriester was, profeteerde hij dat Jezus zou sterven voor het volk;", "2 Kon 22:13": "Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Jer 19:6": "Daarom, ziet, de dagen komen, spreekt de HEERE, dat deze plaats niet meer het Tofeth genoemd zal worden, of dal van de zoon van Hinnom, maar Moorddal.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Jer 25:15-17": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Zach 14:1-3": "Zie, de dag komt, de HEERE, dat uw roof zal uitgedeeld worden in het midden van u, o Jeruzalem! Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden. En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd.", "Deut 24:14": "U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.", "1 Kor 3:21": "Niemand roemt dan op mensen; want alles is van u.", "Jer 14:14-18": "En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart. Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden. En het volk, tot wie zij profeteren, zal op de straten van Jeruzalem weggeworpen zijn vanwege de honger en het zwaard; en er zal niemand zijn die hen kan begraven, hen, hun vrouwen, en hun zonen, en hun dochters; zo zal Ik hun slechtheid over hen uitstorten.", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "Kol 1:20-23": "en dat Hij, door Hem vrede gemaakt te hebben door het bloed van Zijn kruis, door Hem, zeg ik, alle dingen met Zichzelf verzoenen zou, hetzij de dingen die op de aarde, hetzij de dingen die in de hemelen zijn. En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend, in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "1 Joh 2:25": "En dit is de belofte, die Hij ons beloofd heeft, namelijk het eeuwige leven.", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Joz 7:1": "Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.", "Jes 27:11": "Als haar takken verdord zijn, zullen ze afgebroken worden, en de vrouwen zullen komen en ze aansteken; want het is een volk zonder enig verstand; daarom zal Hij, Die het gemaakt heeft, Zich niet over hen ontfermen, en Die het geformeerd heeft, zal hun geen genade bewijzen.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Jes 51:5": "Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.", "Zach 2:7-9": "Hoi, Sion! ontkom, u die woont bij de dochter van Babel! Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan. Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Gen 12:1": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "Mark 16:15": "En Hij zei tegen hen: Ga heen in de hele wereld, predik het Evangelie aan alle schepselen.", "Ps 78:50": "Hij baande een pad voor Zijn toorn; Hij onttrok hun ziel niet aan de dood; en hun gedierte gaf Hij over aan de pestilentie.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Jes 10:4": "Zou niet ieder zich buigen onder de gevangenen, en vallen onder de gedoden? Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Jer 21:1-14": "Het woord dat van de HEERE gekomen is tot Jeremia, toen koning Zedekia Pashur, de zoon van Malchia, en Zefanja, de zoon van Maaseja, de priester, naar hem toe zond, met de woorden: Vraag toch de HEERE voor ons, want Nebukadnezar, de koning van Babel, strijdt tegen ons; misschien zal de HEERE met ons doen naar al Zijn wonderen, zodat hij van ons optrekt. Toen zei Jeremia tegen hen: Zo zult u tegen Zedekia zeggen:", "Deut 16:18": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Jes 10:19": "En de overgebleven bomen van zijn woud zullen weinig in getal zijn, ja, een jongen zou ze kunnen opschrijven.", "Ezech 13:11": "Zeg tegen hen die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en u, grote hagelstenen, zult vallen, en een grote stormwind zal hem splijten.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Jer 48:11": "Moab is van zijn jeugd af aan rustig geweest, en hij heeft op zijn droesem stilgelegen, en is van vat in vat niet overgegoten, en heeft niet in gevangenschap gewandeld; daarom is zijn smaak in hem gebleven, en zijn geur niet veranderd.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Jer 38:21-23": "Maar als u weigert uit te gaan, dan is dit het woord dat de HEERE mij heeft laten zien; Zie, al de vrouwen die in het huis van de koning van Juda zijn overgebleven, zullen naar buiten gebracht worden tot de vorsten van de koning van Babel; en die zullen zeggen: Uw vredegenoten hebben u aangezet, en hebben de overhand op u gekregen; uw voeten zijn in de modder gezonken; zij zijn achteruit gekeerd! Zij zullen dan al uw vrouwen en al uw zonen naar de Chaldeeën uitvoeren; ook zult u zelf uit hun hand niet ontkomen; maar u zult door de hand van de koning van Babel gegrepen worden, en u zult deze stad met vuur verbranden.", "Ps 72:1-4": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning. Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht. De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.", "Joh 11:52": "en niet alleen voor dat volk, maar ook opdat Hij de kinderen van God die verstrooid waren, tot één zou samenbrengen.", "2 Kon 24:18": "Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, uit Libna.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "Hab 1:5-11": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt. Want zie, Ik verwek de Chaldeeën, een bitter en snel volk, dat door de breedten van de aarde trekt, om woningen die niet van hem zijn, in erfelijk bezit te nemen. Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Jes 57:18": "Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "Luk 2:32": "een licht tot verlichting van de heidenen, en tot heerlijkheid van Uw volk Israël.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Jer 3:23": "Waarlijk, tevergeefs verwacht men het van de heuvels en de menigte van bergen; waarlijk, in de HEERE, onze God, is het heil van Israël!", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Jes 47:6": "Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; toch bewees u hun geen barmhartigheid, ja, zelfs over de oude maakte u uw juk zeer zwaar.", "Ps 136:12": "Met een sterke hand, en met een uitgestrekte arm; want Zijn goedertierenheid is voor eeuwig.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Ps 137:9": "Gelukkig zal hij zijn, die uw kinderen grijpt, en tegen de steenrots verpletteren zal.", "Jer 37:1": "Zedekia, de zoon van Josia, werd koning in plaats van Chonja, de zoon van Jojakim; hem had Nebukadrezar, de koning van Babel, koning gemaakt in het land van Juda.", "Rom 1:14": "Aan Grieken en barbaren, aan wijzen en onwijzen ben ik een schuldenaar.", "Joh 10:16": "Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Jer 39:2": "In het elfde jaar van Zedekia, in de vierde maand, op de negende dag van de maand, werd de stad doorgebroken.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Num 32:11": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;", "Ef 2:8": "Want uit genade bent u zalig geworden door het geloof; en dat niet uit u, het is Gods gave;", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "Jer 2:18": "En nu, wat hebt u te doen met de weg van Egypte, om de wateren van Sihor te drinken? En wat hebt u te doen met de weg van Assur, om de wateren van de rivier te drinken?", "Ezech 7:9": "En Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal u geven naar uw wegen, en uw gruwelen zullen in het midden van u zijn; en u zult weten dat Ik de HEERE ben, Die slaat.", "Lev 17:10": "En ieder uit het huis van Israël, en uit de vreemdelingen, die in hun midden als vreemdelingen verkeren, die enig bloed zal gegeten hebben, tegen diens ziel, die dat bloed zal gegeten hebben, zal Ik Mijn aangezicht keren, en zal die uit het midden van haar volk uitroeien.", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Spr 18:11": "Het bezit van de rijke is de stad van zijn sterkte, en als een hoge muur in zijn eigen inbeelding.", "Rom 5:2": "Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God.", "Amos 9:4": "En al gingen zij in gevangenschap voor het aangezicht van hun vijanden, dan zal Ik vandaar het zwaard gebieden, dat het hen doodt; en Ik zal Mijn oog tegen hen richten ten kwade, en niet ten goede.", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Zach 7:9": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander;", "Jes 52:15": "zo zal Hij veel heidenvolken besprenkelen; ja, koningen zullen hun mond over Hem dichthouden; want aan wie het niet verkondigd was, die zullen het zien, en wie het niet gehoord hebben, die zullen het begrijpen.", "Deut 5:15": "Want u zult gedenken dat u een dienstknecht in Egypteland geweest bent, en dat de HEERE, uw God, u vandaar heeft uitgeleid door een sterke hand en een uitgestrekte arm; daarom heeft de HEERE, uw God, u geboden dat u de sabbatdag houden zult.", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "1 Kon 11:9": "Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was,", "Jer 48:7": "Want om uw vertrouwen op uw werken, en op uw schatten, zult u ook ingenomen worden; en Kamos zal weggaan in gevangenschap, zijn priesters en zijn vorsten samen.", "2 Kron 19:6": "En hij zei tegen de rechters: Kijk uit wat u doet, want u spreekt geen recht voor de mens, maar voor de HEERE; en Hij is bij u in de rechtszaak.", "Jer 18:15-17": "Toch heeft Mijn volk Mij vergeten, zij branden reukwerk voor de ijdelheid; want zij hebben hen doen struikelen op hun wegen, op de oude paden, om te wandelen in stegen van een weg die niet opgehoogd is; Om hun land te maken tot een verschrikking, tot eeuwige aanfluitingen; ieder die daar voorbijgaat, zal ontzet zijn, en met zijn hoofd schudden. Als een oostenwind zal Ik hen verstrooien voor het aangezicht van de vijand; Ik zal hun de nek en niet het aangezicht laten zien, op de dag van hun verderf.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "Jer 27:13": "Waarom zou u sterven, u en uw volk, door het zwaard, door de honger en door de pest, zoals de HEERE gesproken heeft over het volk dat de koning van Babel niet zal dienen?", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Deut 6:14": "U zult andere goden niet navolgen, van de goden van de volken, die rondom u zijn.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Ef 2:3-5": "onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen; Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden),", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Jes 45:17": "Maar Israël wordt verlost door de HEERE, met een eeuwige verlossing; u zult niet beschaamd worden, ook niet tot schande worden, tot in alle eeuwigheden.", "Jer 5:17": "En het zal uw oogst en uw brood opeten, dat uw zonen en uw dochters zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgenboom opeten; uw vaste steden, waarop u vertrouwt, zal het arm maken door het zwaard.", "Jes 10:18": "Ook zal Hij verteren de heerlijkheid van zijn woud en van zijn vruchtbare veld; van de ziel af, tot het vlees toe; en hij zal zijn, zoals wanneer een vaandeldrager versmelt.", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "2 Kon 20:17": "Zie, de dagen komen dat alles wat in uw huis is, en wat uw vaderen tot op deze dag opgeslagen hebben, naar Babel weggevoerd zal worden; er zal niets overblijven, zegt de HEERE.", "Ezech 14:19": "Of als Ik de pest in datzelfde land zend, en Mijn grimmigheid daarover met bloed uitgiet, om daaruit mensen en beesten uit te roeien;", "Jer 32:1-3": "Het woord dat tot Jeremia gekomen is van de HEERE, in het tiende jaar van Zedekia, koning van Juda; dit jaar was het achttiende jaar van Nebukadnezar. (Het leger van de koning van Babel belegerde toen Jeruzalem, en de profeet Jeremia zat opgesloten in het voorhof van de bewaking, dat bij het huis van de koning van Juda is. Want Zedekia, de koning van Juda, had hem opgesloten en gezegd: Waarom profeteert u en zegt u: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal haar innemen;", "Ps 103:8": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid.", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Ezech 22:13-22": "Zie dan, Ik heb Mijn hand geslagen om uw gierigheid die u bedreven hebt, en om uw bloed dat in uw midden geweest is. Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen. En Ik zal u verstrooien onder de heidenvolken, en u verspreiden in de landen, en uw onreinheid uit u wegnemen.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Amos 6:13": "U, die blij bent over een nietig ding; u, die zegt: Hebben wij niet door onze eigen kracht hoorns voor onszelf verkregen?", "Jes 30:1-17": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen; Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte. Want de sterkte van Farao zal u tot schaamte zijn, en die toevlucht onder de schaduw van Egypte tot schande.", "Jer 3:6": "Verder zei de HEERE tegen mij, in de dagen van koning Josia: Hebt u gezien wat het afgekeerde Israël gedaan heeft? Zij ging op elke hoge berg en onder elke groene boom, en hoereerde daar.", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Deut 19:18": "En de rechters zullen zorgvuldig onderzoek doen; en zie, de getuige is een valse getuige, hij heeft een valse verklaring afgelegd tegen zijn broeder;", "Joz 23:16": "Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Ps 74:21": "Laat de verdrukte niet beschaamd terugkeren; laat de ellendige en de arme Uw Naam prijzen.", "Amos 6:1-7": "Wee de geruste mensen in Sion, en degenen die zeker zijn op de berg van Samaria! Zij zijn de voornaamste van de eerstelingen der volken, en tot hen komen die van het huis van Israël. Ga over naar Kalne, en zie toe; en ga vandaar naar Hamath, de grote stad, en trek af naar Gath van de Filistijnen; zijn zij beter dan deze koninkrijken, of is hun gebied groter dan uw gebied? U, die de kwade dag ver weg zet, en de zetel van het geweld dichtbij brengt.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "Rom 13:4": "Want zij is Gods dienares, u ten goede. Maar als u kwaad doet, vrees dan; want zij draagt het zwaard niet zonder reden; want zij is Gods dienares, een wreekster tot straf voor hem die kwaad doet.", "Ezech 20:34": "Want Ik zal u uit de volken leiden, en u verzamelen uit de landen waarin u verstrooid bent, door een sterke hand, en door een uitgestrekte arm, en door een uitgegoten grimmigheid.", "Jer 37:3": "Toch stuurde koning Zedekia Juchal, de zoon van Selemja, en de priester Sefanja, de zoon van Maaseja, naar de profeet Jeremia, om te zeggen: Bid toch voor ons tot de HEERE, onze God!", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "Jer 46:13-26": "Het woord, dat de HEERE tot de profeet Jeremia sprak, over de aankomst van Nebukadrezar, de koning van Babel, om Egypteland te slaan. Verkondigt in Egypte, en doet het horen te Migdol; doet het ook horen te Nof en Tachpanhes; zegt: Stelt u op, en maakt u gereed, want het zwaard heeft verslonden, wat rondom u is. Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef.", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Spr 30:14": "Een geslacht wiens tanden zwaarden zijn, en wiens baktanden messen zijn, om de ellendigen van de aarde en de behoeftigen onder de mensen te verslinden.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Jes 1:31": "En de sterke zal worden tot grof vlas, en zijn werkmeester tot een vonk, en zij zullen beide samen branden, en er zal geen uitblusser zijn.", "Jer 39:3": "En alle vorsten van de koning van Babel trokken naar binnen, en hielden halt bij de middelste poort: namelijk Nergal-Sarezer, Samgar-Nebu, Sarsechim, Rab-Saris, Nergal-Sarezer, Rab-Mag, en al de overige vorsten van de koning van Babel.", "Jer 51:25": "Zie, Ik heb het tegen u, verdervende berg! spreekt de HEERE, u, die de hele aarde verderft, en Ik zal Mijn hand tegen u uitstrekken, en u van de rotsen afwentelen, en zal u stellen tot een berg van brand.", "Jer 4:5-31": "Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden! Werp de banier op naar Sion, vlucht met spoed, blijf niet staan! Want Ik breng een kwaad aan van het noorden, en een grote ondergang. De leeuw is opgekomen uit zijn schuilplaats, en de verwoester van de heidenvolken is opgetrokken, hij is uitgegaan uit zijn plaats, om uw land te maken tot een woestenij; uw steden zullen verwoest worden, zodat er niemand in woont.", "2 Kon 23:27": "En de HEERE zei: Ik zal Juda ook van Mijn aangezicht wegdoen, zoals Ik Israël weggedaan heb; en Ik zal deze stad Jeruzalem verwerpen, die Ik verkoren heb, en het huis waarvan Ik gezegd heb: Mijn Naam zal daar zijn.", "Matt 25:5": "Toen de bruidegom uitbleef, werden zij allemaal slaperig, en vielen in slaap.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "Ps 119:134": "Verlos mij van de overlast van de mens, en ik zal Uw bevelen onderhouden.", "Jer 24:8-10": "En zoals de slechte vijgen, die vanwege de slechtheid niet gegeten kunnen worden (want zo zegt de HEERE), zo zal Ik Zedekia, de koning van Juda, maken, alsook zijn vorsten, en het overblijfsel van Jeruzalem, die in dit land zijn overgebleven, en die in het land Egypte wonen; En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben; En Ik zal onder hen zenden het zwaard, de honger en de pest, totdat zij verteerd zullen zijn uit het land, dat Ik hun en hun vaderen gegeven had.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Hand 11:18": "En toen zij dit hoorden, waren zij tevreden, en verheerlijkten God, en zeiden: Zo heeft God dan ook aan de heidenen de bekering gegeven tot leven!", "Jer 2:13": "Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Hebr 3:11": "Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan!", "1 Tess 5:8-10": "Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid. Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Ps 76:8": "U, vreselijk bent U; en wie zal voor Uw aangezicht bestaan, vanaf het moment van uw toorn?", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Ezra 10:21": "En van de kinderen van Harim: Maaseja, en Elia, en Semaja, en Jehiel, en Uzia,", "Jer 49:5": "Zie, Ik zal vrees over u brengen, spreekt de Heere, de HEERE van de heerscharen, van allen die rondom u zijn, en u zult, ieder voor zich heen, weggedreven worden, en niemand zal hen die omzwerven bijeenbrengen.", "Ef 1:10": "Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is;", "Rom 10:8-13": "Maar wat zegt zij? Dicht bij u is het Woord, in uw mond en in uw hart. Dit is het Woord van het geloof, dat wij prediken; namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden. Want met het hart gelooft men tot rechtvaardigheid, en met de mond belijdt men tot zaligheid.", "2 Kron 20:1-30": "Het gebeurde nu hierna, dat de kinderen van Moab, en de kinderen van Ammon, en met hen anderen naast de Ammonieten, tegen Josafat kwamen om te strijden. Toen kwamen er mensen die Josafat berichtten en zeiden: Er komt een grote menigte tegen u aan van de overkant van de zee, uit Syrië; en zie, zij zijn in Hazezon-Thamar, dat is Engedi. Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda.", "Jer 22:1-3": "Zo zegt de HEERE: Ga naar het huis van de koning van Juda, en spreek daar dit woord. En zeg: Hoor het woord van de HEERE, koning van Juda, u die zit op de troon van David, u, en uw dienaren, en uw volk, die door deze poorten binnengaan! Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "Joh 5:40": "En u wilt niet tot Mij komen, opdat u het leven zou hebben.", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "Joz 1:7": "Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "Luk 5:32": "Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Jer 25:1-3": "Het woord dat tot Jeremia gebeurd is over het hele volk van Juda, in het vierde jaar van Jojakim, zoon van Josia, koning van Juda (dit was het eerste jaar van Nebukadnezar, koning van Babel); Dat de profeet Jeremia gesproken heeft tot het hele volk van Juda, en tot alle inwoners van Jeruzalem, en hij zei: Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Ps 49:7": "Aangaande hen die op hun bezit vertrouwen, en op de overvloed van hun rijkdom roemen;", "2 Sam 22:8": "Toen daverde en beefde de aarde; de fundamenten van de hemel beroerden zich, en daverden, omdat Hij in toorn ontstoken was.", "Rom 11:1-36": "Ik zeg dan: Heeft God Zijn volk verstoten? Dat zij verre. Want ik ben ook een Israëliet, uit het zaad van Abraham, van de stam Benjamin. God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt: Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven.", "Dan 2:21-38": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben. Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem. Ik dank U en ik loof U, o God van mijn vaderen! Omdat U mij wijsheid en kracht gegeven hebt, en mij nu bekendgemaakt hebt wat wij van U gevraagd hebben, want U hebt ons de zaak van de koning bekendgemaakt.", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "1 Petr 1:9": "en zo het einddoel van uw geloof bereikt, namelijk de zaligheid van de zielen.", "Jes 51:4": "Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken.", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Gal 2:16": "maar omdat wij weten dat de mens niet gerechtvaardigd wordt uit de werken van de wet, maar door het geloof van Jezus Christus, hebben ook wij in Christus Jezus geloofd, opdat wij gerechtvaardigd zouden worden uit het geloof van Christus, en niet uit de werken van de wet; omdat uit de werken van de wet geen vlees zal worden gerechtvaardigd.", "Jer 6:14": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Doch daar is geen vrede.", "Jer 44:27": "Zie, Ik zal over hen waken ten kwade en niet ten goede; en alle mannen van Juda die in Egypteland zijn, zullen door het zwaard en door de honger verteerd worden, totdat zij ten einde zijn.", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Jer 22:3": "Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "Jer 17:5": "Zo zegt de HEERE: Vervloekt is de man die op een mens vertrouwt, en vlees tot zijn arm stelt, en wiens hart van de HEERE afwijkt!", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Jer 49:28-33": "Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg, zegt de HEERE zo: Maak u op, trek op tegen Kedar, en verwoest de kinderen van het oosten. Zij zullen hun tenten en hun kudden nemen, hun gordijnen en al hun gereedschap, en hun kamelen voor zich wegnemen; en zij zullen tegen hen uitroepen: Schrik van rondom! Vlucht, zwerf vlug heen, woon in diepe plaatsen, inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadsbesluit tegen u beraadslaagd, en een gedachte tegen hen gedacht.", "Amos 8:4-6": "Hoor dit, u die de nooddruftige opslokt! en die de ellendigen van het land wil vernielen; En zegt: Wanneer is de nieuwe maan voorbij, zodat wij koren mogen verkopen? en de sabbat, zodat wij graan mogen aanbieden? terwijl u de efa verkleint en de sikkel vergroot, en verkeerd handelt met bedrieglijke weegschalen; Zodat wij de armen voor geld mogen kopen, en de nooddruftige om een paar schoenen; en dan zullen wij het kaf van het koren verkopen.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Jer 24:1": "De HEERE liet mij zien, en zie, er waren twee vijgenkorven gezet voor de tempel van de HEERE; nadat Nebukadnezar, de koning van Babel, Jechonia, de zoon van Jojakim, de koning van Juda, gevankelijk had weggevoerd, alsook de vorsten van Juda, en de timmerlieden, en de smeden van Jeruzalem, en hen naar Babel had gebracht.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Luk 19:10": "Want de Zoon des mensen is gekomen om te zoeken en zalig te maken wat verloren was.", "Jes 57:17": "Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart.", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "Klaagl 2:4": "Daleth. Hij heeft Zijn boog gespannen als een vijand; Hij heeft Zich met Zijn rechterhand gesteld als een tegenstander, dat Hij doodde al de begeerlijke dingen van de ogen; Hij heeft Zijn grimmigheid in de tent van de dochter van Sion uitgestort als een vuur.", "Deut 11:26": "Zie, ik stel u heden voor: zegen en vloek:", "Joz 11:23": "Zo nam Jozua heel dat land in, naar alles wat de HEERE tot Mozes gesproken had; en Jozua gaf het aan Israël als erfdeel, naar hun afdelingen, naar hun stammen. En het land rustte van de oorlog.", "Ex 32:10": "En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken.", "Jes 58:6": "Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt?", "Luk 19:43": "Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Jer 38:3": "Zo zegt de HEERE: Deze stad zal zeker gegeven worden in de hand van het leger van de koning van Babel, dat zal haar innemen;", "Jer 28:14": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Ik heb een ijzeren juk gedaan aan de hals van al deze volken, om Nebukadnezar, de koning van Babel, te dienen, en zij zullen hem dienen; ja, Ik heb hem ook het gedierte van het veld gegeven.", "Jer 52:13": "Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur.", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "1 Kon 22:3-8": "Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen. Daarna zei hij tegen Josafat: Zult u met mij optrekken naar de strijd bij Ramoth in Gilead? En Josafat zei tegen de koning van Israël: Ik zal zijn zoals u bent, mijn volk zoals uw volk, mijn paarden zoals uw paarden. Verder zei Josafat tegen de koning van Israël: Vraag toch vandaag naar het woord van de HEERE.", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Luk 22:33": "En hij zei tegen Hem: Heere, ik ben bereid, met U ook in de gevangenis en in de dood te gaan.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Ex 13:20": "Zo braken zij op uit Sukkoth; en zij sloegen hun kamp op in Etham, aan de rand van de woestijn.", "Gal 1:4": "Die Zichzelf gegeven heeft voor onze zonden, opdat Hij ons zou trekken uit deze tegenwoordige boze wereld, naar de wil van onze God en Vader;", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Matt 24:2": "En Jezus zei tegen hen: Ziet u niet al deze dingen? Voorwaar, Ik zeg u: hier zal geen steen op de andere steen gelaten worden, die niet zal worden afgebroken.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Ps 104:35": "De zondaars zullen van de aarde weggevaagd worden, en de goddelozen zullen niet meer zijn. Loof de HEERE, mijn ziel! Hallelujah!", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "Jer 29:25": "Zo spreekt de HEERE van de heerscharen, de God van Israël: Omdat u brieven in uw naam gezonden hebt aan heel het volk dat te Jeruzalem is, en aan Zefanja, de zoon van Maaseja, de priester, en aan alle priesters, en zei:", "Jer 3:12": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.", "Luk 21:24": "En zij zullen vallen door de scherpte van het zwaard, en gevankelijk weggevoerd worden onder alle volken; en Jeruzalem zal door de heidenen vertrapt worden, totdat de tijden van de heidenen vervuld zullen zijn.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "Neh 10:3": "Pashur, Amarja, Malchia,", "Ps 20:9": "Zij hebben zich gekromd, en zijn gevallen; maar wij zijn op
