gestaan en staande gebleven.", "Openb 1:7": "Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Ps 106:18": "En een vuur brandde onder hun groep, een vlam stak de goddelozen in brand.", "Jer 32:5": "En hij zal Zedekia naar Babel voeren, en daar zal hij zijn, totdat Ik hem bezoek, spreekt de HEERE; ofschoon u tegen de Chaldeeën strijdt, u zult toch geen geluk hebben.)", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "Jes 53:1": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard?", "Luk 12:5": "Maar Ik zal u tonen voor wie u bang moet zijn: wees bang voor Hem, Die, nadat Hij gedood heeft, ook macht heeft om in de hel te werpen; ja, Ik zeg u, wees bang voor Hem!", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "Deut 24:16": "De vaders zullen niet gedood worden voor de kinderen, en de kinderen zullen niet gedood worden voor de vaders; ieder zal om zijn eigen zonde gedood worden.", "Rom 4:1-25": "Wat zullen wij dan zeggen, dat Abraham, onze vader, verkregen heeft naar het vlees? Want als Abraham uit de werken gerechtvaardigd is, dan heeft hij roem, maar niet bij God. Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.", "Jes 25:7": "En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Matt 23:33": "Slangen, addergebroed! Hoe zou u de helse verdoemenis ontvluchten?", "Openb 18:5": "Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Jer 12:4": "Hoe lang zal het land treuren, en het gewas van het hele veld verdorren? Vanwege de boosheid van hen die daarin wonen, vergaan de dieren en het gevogelte; omdat zij zeggen: Hij ziet ons einde niet.", "Jer 22:7": "Want Ik zal verwoesters tegen u heiligen, ieder met zijn wapen; die zullen uw uitgelezen ceders omhakken, en in het vuur werpen.", "Ps 89:22": "met wie Mijn hand vast blijven zal; ook zal hem Mijn arm versterken.", "Jes 56:12": "Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Gen 6:13": "Daarom zei God tegen Noach: Het einde van alle vlees is voor Mijn aangezicht gekomen; want de aarde is door hen vervuld met geweld; en zie, Ik zal hen met de aarde verderven.", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "Klaagl 5:6": "Wij hebben de Egyptenaar de hand gegeven, en de Assyriër, om met brood verzadigd te worden.", "Ps 91:8": "Alleen zult u het met uw ogen aanschouwen; en u zult de vergelding van de goddelozen zien.", "Hand 15:11": "Maar wij geloven door de genade van de Heere Jezus Christus zalig te worden, op dezelfde wijze als ook zij.", "Luk 2:31": "die U bereid hebt voor het aangezicht van alle volken:", "Ezech 18:32": "Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Lev 26:16-39": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten. Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand. En als u Mij ook na deze dingen niet zult horen, zal Ik nog daaraan toedoen, om u zevenvoudig over uw zonden te tuchtigen.", "Ps 119:119": "U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "Zach 1:6": "Nochtans Mijn woorden en Mijn inzettingen, die Ik Mijn knechten, de profeten, geboden had, hebben die uw vaders niet getroffen? Zodat zij terugkerend zeiden: Zoals de HEERE van de heerscharen Zich voorgenomen had ons te doen, naar onze wegen en naar onze daden, zo heeft Hij met ons gedaan.", "Hos 13:11": "Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.", "Jer 7:8": "Zie, u vertrouwt op valse woorden, die geen nut doen.", "Richt 10:7": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten.", "Jer 9:11": "En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Jer 23:20": "De toorn van de HEERE zal zich niet afwenden, totdat Hij het zal hebben gedaan, en totdat Hij de gedachten van Zijn hart tot stand zal hebben gebracht; in de laatste dagen zult u dat met verstand inzien.", "Jer 42:11": "Vrees niet voor het aangezicht van de koning van Babel, voor wie u vreest; vrees niet voor hem, spreekt de HEERE; want Ik zal met u zijn, om u te behouden en u van zijn hand te redden.", "Hos 5:13": "Toen Efraïm zijn ziekte zag, en Juda zijn gezwel, ging Efraïm naar Assur, en hij stuurde iemand naar koning Jareb; maar die zal u niet kunnen genezen, en zal het gezwel van u niet helen.", "Jes 29:18": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien.", "Hos 12:2": "Efraïm weidt zich met wind, en jaagt de oostenwind na; de hele dag vermenigvuldigt hij leugen en verwoesting; en zij maken een verbond met Assur, en de olie wordt naar Egypte gevoerd.", "Pred 7:17": "Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd?", "Jer 38:23": "Zij zullen dan al uw vrouwen en al uw zonen naar de Chaldeeën uitvoeren; ook zult u zelf uit hun hand niet ontkomen; maar u zult door de hand van de koning van Babel gegrepen worden, en u zult deze stad met vuur verbranden.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "2 Kor 5:17": "Dus als iemand in Christus is, is hij een nieuw schepsel; het oude is voorbijgegaan, zie, het is alles nieuw geworden.", "Rom 1:16": "Want ik schaam mij niet voor het Evangelie van Christus; want het is een kracht van God tot zaligheid voor ieder die gelooft, eerst de Jood, en ook de Griek.", "Jes 1:20": "Maar als u weigert, en opstandig bent, zult u door het zwaard gegeten worden; want de mond van de HEERE heeft het gesproken.", "1 Joh 4:9": "Hierin is de liefde van God jegens ons geopenbaard, dat God Zijn eniggeboren Zoon gezonden heeft in de wereld, opdat wij zouden leven door Hem.", "Jer 8:11": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Terwijl er geen vrede is.", "1 Sam 28:15": "En Samuel zei tegen Saul: Waarom hebt u mij onrustig gemaakt, door mij te laten opkomen? Toen zei Saul: Ik ben erg beangstigd, want de Filistijnen strijden tegen mij, en God is van mij geweken, en antwoordt mij niet meer, niet door de dienst van de profeten, niet door dromen; daarom heb ik u geroepen, zodat u mij te kennen geeft wat ik doen zal.", "Hand 2:39": "Want voor u is de belofte, en voor uw kinderen, en voor allen die ver weg zijn, zoveel als de Heere, onze God, ertoe roepen zal.", "Ezech 11:21": "Maar van hen wier hart het hart van hun verfoeiselen en hun gruwelen navolgt, zal Ik de weg daarvan op hun hoofd geven, spreekt de Heere HEERE.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "2 Kon 3:11-14": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot. En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom. Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.", "Deut 7:10": "En Hij vergeldt ieder van hen die Hem haten, in zijn aangezicht, om hem te verderven; Hij zal het voor wie Hem haat niet uitstellen, in zijn aangezicht zal Hij het hem vergelden.", "Spr 12:7": "De goddelozen worden omgekeerd, zodat zij niet meer zijn; maar het huis van de rechtvaardigen zal bestaan.", "Ps 105:5-45": "Gedenkt Zijn wonderen, die Hij gedaan heeft, Zijn wondertekenen, en de oordelen van Zijn mond. U, nakomelingen van Abraham, Zijn knecht, u, kinderen van Jakob, Zijn uitverkorene! Hij is de HEERE, onze God; Zijn oordelen zijn over de gehele aarde.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Joz 10:1": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren;", "Ezech 26:7-12": "Want zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, de koning der koningen, van het noorden tegen Tyrus brengen, met paarden en met wagens, en met ruiters, en een leger, en veel volk. Hij zal uw dochters op het veld met het zwaard doden, en hij zal versterkingen tegen u maken, en een wal tegen u opwerpen, en schilden tegen u opheffen. En hij zal muurbrekers tegen uw muren stellen, en uw torens met zijn zwaarden afbreken.", "Jer 44:11": "Daarom, zo zegt de HEERE van de heerscharen, de God van Israël: Zie, Ik zal Mijn aangezicht tegen u stellen ten kwade, en om heel Juda uit te roeien.", "Num 25:11": "Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, heeft Mijn grimmigheid van over de kinderen van Israël afgewend, omdat hij Mijn ijver geijverd heeft in hun midden, zodat Ik de kinderen van Israël in Mijn ijver niet vernietigd heb.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "Ps 64:8": "Maar God zal hen haastig met een pijl schieten; hun plagen zijn er.", "Jer 5:14": "Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "Jer 50:31": "Zie, Ik wil tegen u, u trotse! spreekt de Heere, de HEERE van de heerscharen; want uw dag is gekomen, de tijd dat Ik u bezoeken zal.", "2 Kron 6:32": "Ook aangaande de vreemdeling, die niet van Uw volk Israël is, maar uit een ver land komt vanwege Uw grote Naam, en Uw sterke hand, en de kracht van Uw uitgestrekte arm; als hij komt, en bidden zal in dit huis;", "Hand 13:39": "En dat ieder die gelooft, door Hem gerechtvaardigd wordt van alles waarvan u niet gerechtvaardigd kon worden door de wet van Mozes.", "Luk 13:34": "Jeruzalem, Jeruzalem! U die de profeten doodt en stenigt hen die naar u toe gezonden zijn, hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens onder haar vleugels verzamelt; en u hebt niet gewild?", "Jer 37:8-10": "En de Chaldeeën zullen terugkeren en tegen deze stad strijden; en zij zullen haar innemen en met vuur verbranden. Zo zegt de HEERE: Bedrieg uzelf niet door te zeggen: De Chaldeeën zullen zeker van ons wegtrekken; want zij zullen niet wegtrekken. Want al zou u het hele leger van de Chaldeeën verslaan, die tegen u strijden, en er zouden van hen alleen gewonde mannen overblijven, dan zouden die zich toch, ieder in zijn tent, opmaken en deze stad met vuur verbranden.", "Openb 20:10": "En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.", "Gen 6:7": "En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "Matt 11:28-30": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven. Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen. Want Mijn juk is zacht, en Mijn last is licht.", "Jer 38:17-23": "Jeremia dan zei tegen Zedekia: Zo zegt de HEERE, de God van de heerscharen, de God van Israël: Als u gewillig naar de vorsten van de koning van Babel uitgaat, dan zal uw leven behouden blijven, en deze stad zal niet met vuur verbrand worden; en u zult leven, u en uw huis. Maar als u naar de vorsten van de koning van Babel niet uitgaat, dan zal deze stad gegeven worden in de hand van de Chaldeeën, en zij zullen haar met vuur verbranden; ook zult u zelf uit hun hand niet ontkomen. En de koning Zedekia zei tegen Jeremia: Ik ben bang voor de Joden die naar de Chaldeeën zijn overgelopen, dat zij mij misschien in hun hand overgeven, en zij de spot met mij drijven.", "2 Sam 5:7": "Maar David nam de burcht Sion in; dat is de stad van David.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Deut 17:16-20": "Maar hij mag voor zichzelf de paarden niet vermeerderen, en het volk niet laten terugkeren naar Egypte om paarden te vermeerderen; want de HEERE heeft tegen u gezegd: U mag voortaan niet meer terugkeren langs deze weg. Ook mag hij voor zichzelf de vrouwen niet vermeerderen, opdat zijn hart niet afwijkt; hij mag voor zichzelf ook geen zilver en goud in overvloed vermeerderen. Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;", "Lev 26:28": "Dan zal Ik ook in verhitte woede tegen u in gaan, en Ik zal u ook zevenvoudig over uw zonden tuchtigen.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Luk 1:51": "Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.", "Luk 13:24": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;", "Mark 13:1-13": "En toen Hij de tempel uitging, zei een van Zijn discipelen tegen Hem: Meester, kijk, wat voor stenen, en wat voor gebouwen! En Jezus antwoordde en zei tegen hem: Ziet u deze grote gebouwen? Er zal niet één steen op de andere steen gelaten worden, die niet afgebroken zal worden. En toen Hij op de Olijfberg zat, tegenover de tempel, vroegen Petrus, en Jakobus, en Johannes, en Andreas Hem apart:", "Luk 17:1": "En Hij zei tegen de discipelen: Het kan niet anders, dan dat er ergernissen komen; maar wee hem, door wie ze komen.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Ps 50:22": "Verstaat dit toch, u die God vergeet! opdat Ik niet verscheur en niemand redt.", "Jes 10:12": "Want het zal gebeuren, als de Heere een einde zal gemaakt hebben van al Zijn werk op de berg Sion en te Jeruzalem, dan zal Ik thuis zoeken de vrucht van de grootsheid van het hart van de koning van Assyrië, en de pracht van de hoogheid van zijn ogen.", "Gen 4:7": "Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.", "Jes 6:11": "Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "Job 27:8-23": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "Jer 34:19-22": "De vorsten van Juda, en de vorsten van Jeruzalem, de kamerlingen, en de priesters, en heel het volk van het land, die door de stukken van het kalf zijn doorgegaan. Ja, Ik zal hen overgeven in de hand van hun vijanden, en in de hand van hen die hun ziel zoeken; en hun dode lichamen zullen voor het gevogelte van de hemel en het gedierte van de aarde tot voedsel zijn. Zelfs Zedekia, de koning van Juda, en zijn vorsten, zal Ik overgeven in de hand van hun vijanden, en in de hand van hen die hun ziel zoeken, namelijk in de hand van het leger van de koning van Babel, dat van u nu is opgetrokken.", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "2 Kon 22:16": "Zo zegt de HEERE: Zie, Ik zal onheil brengen over deze plaats, en over haar inwoners, namelijk alle woorden van het boek dat de koning van Juda gelezen heeft.", "Jer 42:4-6": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden. Toen zeiden zij tegen Jeremia: De HEERE zij tussen ons tot een waarachtig en betrouwbaar Getuige: als wij niet handelen naar elk woord waarmee de HEERE, uw God, u naar ons toe zal zenden! Hetzij goed of kwaad, wij zullen gehoorzaam zijn aan de stem van de HEERE, onze God, tot Wie wij u zenden; opdat het ons goed gaat, wanneer wij gehoorzaam zijn aan de stem van de HEERE, onze God.", "Jer 26:6": "Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek voor alle volken van de aarde.", "Matt 5:19-30": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen. Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan. U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "Joh 13:38": "Jezus antwoordde hem: Zult u uw leven voor Mij geven? Voorwaar, voorwaar, Ik zeg u: De haan zal niet kraaien, totdat u Mij driemaal verloochend zult hebben.", "Jer 52:8-11": "Doch het leger van de Chaldeeën joeg de koning na, en zij achterhaalden Zedekia in de vlakke velden van Jericho; en zijn hele leger werd van bij hem verstrooid. Zij grepen dan de koning, en voerden hem op naar de koning van Babel in Ribla, in het land van Hamath; die sprak oordelen tegen hem uit. En de koning van Babel slachtte de zonen van Zedekia voor zijn ogen; en hij slachtte ook al de vorsten van Juda te Ribla.", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "Ex 32:33-35": "Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen. Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken! Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.", "Ezech 33:27": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!", "Ezech 23:22-35": "Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen. De zonen van Babel en alle Chaldeeën, Pekod, en Soa, en Koa, en alle zonen van Assur met hen; aantrekkelijke jonge mannen, die allen vorsten en machthebbers zijn, hoofdmannen en vermaarde mannen, die allen te paard rijden. Die zullen tegen u komen met karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "Zef 1:3": "Ik zal wegvagen mensen en dieren; Ik zal wegvagen de vogels van de hemel, en de vissen van de zee, en de struikelblokken met de goddelozen; ja, Ik zal de mensen van dit land uitroeien, spreekt de HEERE.", "Jes 2:22": "Laat u dan af van de mens, wiens adem in zijn neus is, want waarin is hij te achten?", "Num 14:11": "En de HEERE zei tegen Mozes: Hoelang zal dit volk Mij tergen? En hoelang zullen zij niet aan Mij geloven, ondanks alle tekenen die Ik onder hen gedaan heb?", "Jer 4:26": "Ik keek, en zie, het vruchtbare land was een woestijn, en al zijn steden waren afgebroken, vanwege de HEERE, vanwege de gloed van Zijn toorn.", "Num 16:20": "En de HEERE sprak tot Mozes en tot Aäron, en zei:", "Ef 5:14": "Daarom zegt Hij: Ontwaak, u die slaapt, en sta op uit de doden; en Christus zal over u lichten.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Jer 8:12-14": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE. Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan de wijnstok, en geen vijgen aan de vijgenboom, ja, het blad is afgevallen; en de geboden die Ik hun gegeven heb, die overtreden zij. Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "Jer 21:3-10": "Toen zei Jeremia tegen hen: Zo zult u tegen Zedekia zeggen: Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Jer 32:17": "Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.", "Gal 6:7": "Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "Luk 14:16-24": "Maar Hij zei tegen hem: Een zeker mens bereidde een groot avondmaal, en nodigde er velen voor uit. En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd.", "Ef 2:14": "Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft,", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "Spr 28:3": "Een arme man, die de geringen verdrukt, is een wegvagende regen, zodat er geen brood is.", "Rom 12:16": "Wees eensgezind onder elkaar. Streef niet naar de hoge dingen, maar voeg u naar het nederige. Wees niet wijs bij uzelf.", "Jer 52:3-6": "Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel. En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadrezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zij legerden zich tegen haar, en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "1 Sam 7:10-12": "En het gebeurde, terwijl Samuël dat brandoffer offerde, dat de Filistijnen naderden ten strijde tegen Israël; en de HEERE donderde die dag met een grote donder over de Filistijnen, en Hij bracht hen in verwarring, zodat zij verslagen werden voor het aangezicht van Israël. En de mannen van Israël trokken uit vanuit Mizpa, en vervolgden de Filistijnen, en zij sloegen hen tot onder Beth-kar. Samuël nam toen een steen, en zette die tussen Mizpa en Sen, en noemde hem Eben-haezer; en hij zei: Tot hiertoe heeft de HEERE ons geholpen.", "Kol 3:11": "waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "2 Kon 22:17": "Omdat zij Mij verlaten hebben, en voor andere goden reukwerk gebrand hebben, om Mij tot toorn te verwekken met al het werk van hun handen, zal Mijn grimmigheid ontstoken worden tegen deze plaats, en niet uitgeblust worden.", "Spr 25:5": "Doe de goddeloze weg van het aangezicht van de koning, en zijn troon zal door gerechtigheid bevestigd worden.", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Hand 13:26": "Mannen broeders, kinderen van het geslacht van Abraham, en zij die onder u God vrezen, tot u is het woord van deze zaligheid gezonden.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "Jer 17:27": "Maar als u naar Mij niet zult horen, om de sabbatdag te heiligen, en om geen last te dragen als u op de sabbatdag door de poorten van Jeruzalem ingaat; zo zal Ik een vuur in haar poorten aansteken, dat de paleizen van Jeruzalem zal verteren, en niet uitgeblust worden.", "Ezra 10:18": "En er werden gevonden van de zonen van de priesters die vreemde vrouwen bij zich hadden laten wonen: van de zonen van Jesua, de zoon van Jozadak, en zijn broers, Maaseja, en Eliëzer, en Jarib, en Gedalja.", "Zach 14:8": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn.", "1 Sam 12:25": "Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.", "Joh 7:37": "En op de laatste dag, zijnde de grote dag van het feest, stond Jezus en riep: Als iemand dorst heeft, laat hij tot Mij komen en drinken.", "Ezech 15:7": "Want Ik zal Mijn aangezicht tegen hen zetten; als zij van het ene vuur uitgaan, zal het andere vuur hen verteren; en u zult weten, dat Ik de HEERE ben, als Ik Mijn aangezicht tegen hen gesteld zal hebben.", "Ps 33:17": "Het paard schiet tekort voor de overwinning, en bevrijdt niet door zijn grote sterkte.", "Jer 33:5": "Er zijn er wel gekomen om te strijden tegen de Chaldeeën, maar het is om die te vullen met de dode lichamen van mensen die Ik verslagen heb in Mijn toorn en in Mijn grimmigheid; en omdat Ik Mijn aangezicht van deze stad verborgen heb, vanwege al hun slechtheid.", "Jer 17:4": "Zo zult u aflaten (en dat om uzelf) van uw erfenis, die Ik u gegeven heb, en Ik zal u uw vijanden doen dienen in een land, dat u niet kent; want u hebt een vuur aangestoken in Mijn toorn, tot in eeuwigheid zal het branden.", "Joh 3:15": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Jer 36:29": "En tegen Jojakim, de koning van Juda, zult u zeggen: Zo zegt de HEERE: U hebt deze rol verbrand, en gezegd: Waarom hebt u daarop geschreven: De koning van Babel zal zeker komen, en dit land verderven, en maken dat mens en dier daarin ophouden te bestaan?", "Hos 5:9": "Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Jes 30:15": "Want zo zegt de Heere HEERE, de Heilige van Israël: Door terugkering en rust zou u behouden worden, in stilte en in vertrouwen zou uw sterkte zijn; maar u hebt niet gewild.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Luk 13:35": "Zie, uw huis wordt aan u woest achtergelaten. En voorwaar, Ik zeg u, dat u Mij niet zult zien, totdat de tijd zal zijn gekomen dat u zult zeggen: Gezegend is Hij Die komt in de Naam van de Heere!", "Jes 7:17-25": "Maar de HEERE zal over u, en over uw volk, en over het huis van uw vader, dagen doen komen, wat voor dagen niet gekomen zijn vanaf de dag dat Efraïm van Juda is afgeweken, door de koning van Assyrië. Want het zal op die dag gebeuren, dat de HEERE zal fluiten naar de vliegen, die aan het einde van de rivieren van Egypte zijn, en naar de bijen die in het land van Assyrië zijn. En zij zullen komen, en zij zullen allemaal neerstrijken in de woeste dalen, en in de kloven van de rotsen, en op alle doornhagen, en op alle geprezen plaatsen.", "2 Kon 25:1": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom.", "Ex 15:27": "Toen kwamen zij bij Elim, en daar waren twaalf waterbronnen, en zeventig palmbomen; en zij legerden zich daar aan de wateren.", "Ezech 9:10": "Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Ezra 7:25": "En u, Ezra, stel naar de wijsheid van uw God, die in uw hand is, regeerders en rechters aan, die al het volk rechtspreken dat aan de overkant van de rivier is, allen die de wetten van God kennen; en wie ze niet kent, moet u het bekendmaken.", "Jer 42:18": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Zoals Mijn toorn en Mijn grimmigheid uitgestort is over de inwoners van Jeruzalem, zo zal Mijn grimmigheid over u uitgestort worden, als u in Egypte gekomen zult zijn; en u zult tot een vervloeking zijn, en tot een ontzetting, en tot een vloek, en tot smaad, en u zult deze plaats niet meer zien.", "Matt 24:14-42": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen. Wanneer u dan de gruwel van de verwoesting zal zien, waarvan gesproken is door Daniël de profeet, staande op de heilige plaats (die het leest, laat hij daarop letten!), laat dan wie in Judea zijn, vluchten naar de bergen;", "Hos 7:9-16": "Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid over hem verspreid, en hij merkt het niet. Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles. Want Efraïm is als een domme duif, zonder verstand; zij roepen Egypte aan, zij gaan heen tot Assur.", "2 Kron 36:10-13": "En bij de terugkeer van het jaar zond koning Nebukadnezar heen, en liet hem naar Babel halen, met de kostbare voorwerpen van het huis van de HEERE; en hij maakte zijn broer Zedekia koning over Juda en Jeruzalem. Eenentwintig jaar was Zedekia oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem. En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Deut 11:2": "En u zult heden weten, dat ik niet spreek met uw kinderen, die het niet weten, en de vermaning van de HEERE, uw God, niet gezien hebben. Zijn grootheid, Zijn sterke hand en Zijn uitgestrekte arm;", "Jes 27:10": "Want de versterkte stad zal eenzaam zijn, de woonplaats zal verstoten en verlaten worden, als een woestijn; daar zullen de kalveren weiden, en daar zullen ze neerliggen, en zullen haar takken opeten.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "Rom 15:16": "opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest.", "Joh 15:5": "Ik ben de Wijnstok, en u de ranken; die in Mij blijft, en Ik in hem, die draagt veel vrucht; want zonder Mij kunt u niets doen.", "Jer 32:28-31": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen. En de Chaldeeën, die tegen deze stad strijden, zullen erin komen, en deze stad met vuur aansteken, en zullen haar verbranden, met de huizen op wier daken zij voor Baäl gerookt en aan andere goden drankoffers geofferd hebben, om Mij te vertoornen. Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE.", "Jer 21:1-3": "Het woord dat van de HEERE gekomen is tot Jeremia, toen koning Zedekia Pashur, de zoon van Malchia, en Zefanja, de zoon van Maaseja, de priester, naar hem toe zond, met de woorden: Vraag toch de HEERE voor ons, want Nebukadnezar, de koning van Babel, strijdt tegen ons; misschien zal de HEERE met ons doen naar al Zijn wonderen, zodat hij van ons optrekt. Toen zei Jeremia tegen hen: Zo zult u tegen Zedekia zeggen:", "Ps 78:38": "Doch Hij, barmhartig zijnde, verzoende de ongerechtigheid, en verdierf hen niet; maar wendde dikwijls Zijn toorn af, en wekte Zijn hele grimmigheid niet op.", "Job 18:5-21": "Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren. Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden. De stappen van zijn kracht zullen beperkt worden, en zijn eigen plan zal hem neerwerpen.", "Matt 18:35": "Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.", "Ef 3:6": "namelijk dat de heidenen medeerfgenamen zijn, en van hetzelfde lichaam, en mededeelgenoten van Zijn belofte in Christus, door het Evangelie;", "Spr 14:31": "Wie de arme verdrukt, smaadt zijn Maker; maar wie zich over de behoeftige ontfermt, eert Hem.", "Ps 82:2-4": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela. Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme. Verlos de arme en de behoeftige, ruk hem uit de hand van de goddelozen.", "Ps 125:2": "Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid.", "Jer 49:30-33": "Vlucht, zwerf vlug heen, woon in diepe plaatsen, inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadsbesluit tegen u beraadslaagd, en een gedachte tegen hen gedacht. Maak u op, trek op tegen het volk dat rust heeft, dat in zekerheid woont, spreekt de HEERE; dat geen deuren noch grendel heeft, dat alleen woont. En hun kamelen zullen ten roof zijn, en de menigte van hun vee zal ten buit zijn; en Ik zal hen verstrooien in alle windrichtingen, namelijk hen die aan de hoeken afgekort zijn; en Ik zal hun verderf van alle kanten aanbrengen, spreekt de HEERE.", "Matt 21:31": "Wie van deze twee heeft de wil van de vader gedaan? Zij zeiden tegen Hem: De eerste. Jezus zei tegen hen: Voorwaar, Ik zeg u, dat de tollenaars en de hoeren u voorgaan in het Koninkrijk van God.", "Jes 24:17": "De angst, en de kuil, en de strik over u, o inwoners van het land!", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Jes 32:1-4": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht. En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land. En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.", "Pred 8:12": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.", "Matt 25:30": "En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Luk 19:26": "Want ik zeg u dat ieder die heeft, gegeven zal worden; maar van hem die niet heeft, zal ook wat hij heeft afgenomen worden.", "Jer 2:23": "Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait!", "Zef 2:15": "Dit is de stad, die opspringt van vreugde, die zorgeloos woont, die in haar hart zegt: Ik ben het, en buiten mij is er niemand meer; hoe is zij geworden tot woestheid, een rustplaats voor het gedierte! Ieder die daar voorbij trekt, zal haar aanfluiten, hij zal zijn hand bewegen.", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Ef 2:17": "En toen Hij kwam, heeft Hij door het Evangelie vrede verkondigd aan u, die ver weg was, en aan hen die nabij waren.", "Mark 9:43-48": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur; Waar hun worm niet sterft, en het vuur niet uitgeblust wordt. En als uw voet u doet struikelen, hak hem af; het is beter voor u kreupel het leven in te gaan, dan met twee voeten in de hel geworpen te worden, in het onblusbare vuur;", "Ezech 29:7": "Toen zij u bij uw hand grepen, werd u gebroken, en spleet u al hun zijden; en toen zij op u leunden, werd u verbroken, en liet u al hun lenden stilstaan.", "Ezech 24:8-14": "Opdat Ik de grimmigheid doe opgaan om wraak te oefenen, heb Ik haar bloed op een gladde rots gelegd, opdat het niet bedekt wordt. Daarom, zo zegt de Heere HEERE: Wee de bloedstad! Ik zal ook de brandstapel groot maken! Draag veel hout aan, steek het vuur aan, verteer het vlees, en kruid het met specerijen, en laat de beenderen verbranden.", "Micha 2:3": "Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Ps 119:118": "U vertreedt allen, die van Uw inzettingen afdwalen, want hun bedrog is leugen.", "Job 21:7-33": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.", "Jer 2:22": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE.", "Jes 46:1": "Bel is gekromd, Nebo wordt neergebogen, hun afgoden zijn geworden voor de dieren en voor de beesten; uw opgeladen pakken zijn een last voor de vermoeide beesten.", "2 Kon 13:3": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen.", "Deut 29:19": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst.", "Matt 22:7": "Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.", "Jer 49:12": "Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.", "Ezech 5:13": "Zo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen laten rusten, en Mij troosten; en zij zullen weten dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.", "Luk 24:47": "En in Zijn Naam moesten bekering en vergeving van de zonden gepredikt worden onder alle volken, te beginnen bij Jeruzalem.", "1 Tim 2:3-6": "Want dat is goed en aangenaam voor God, onze Zaligmaker; Die wil dat alle mensen zalig worden en tot kennis van de waarheid komen. Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Amos 5:12": "Want Ik weet dat uw overtredingen talrijk, en uw zonden machtig veel zijn; zij benauwen de rechtvaardige, nemen steekpenningen aan, en verdringen de behoeftigen in de poort.", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "Jes 46:2": "Samen zijn zij neergebogen, zij zijn gekromd, zij hebben de last niet kunnen redden, maar zijzelf zijn in de gevangenis gegaan.", "Num 25:4": "En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Spr 22:22": "Beroof de arme niet, omdat hij arm is; en verbrijzel de ellendige niet in de poort.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Ps 121:1-8": "Een lied Hammaaloth¹. Ik hef mijn ogen op naar de bergen, vanwaar mijn hulp komen zal. Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft. Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "2 Tim 2:10": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid.", "Ezech 20:46-48": "Mensenkind, richt uw aangezicht naar de weg van het zuiden, en druppel tegen het zuiden; en profeteer tegen het woud van het veld in het zuiden. En zeg tegen het zuiderwoud: Hoor het woord van de HEERE: Zo zegt de Heere HEERE: Zie, Ik zal een vuur in u aansteken, dat in u elke groene boom en elke dorre boom zal verteren; de vlammende vlam zal niet uitgeblust worden, maar daardoor zullen alle aangezichten verbrand worden, van het zuiden tot het noorden toe. En alle vlees zal zien dat Ik, de HEERE, dat heb aangestoken; het zal niet uitgeblust worden.", "Jes 24:18": "En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Ezech 5:4": "En nog zult u daarvan nemen, en dat werpen in het midden van het vuur, en zult ze verbranden met vuur; daaruit zal een vuur voortkomen tegen het hele huis van Israël.", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Lev 24:22": "Eén recht zult u hebben; zo zal het gelden voor de vreemdeling als voor de geboren Israëliet; want Ik ben de HEERE, uw God!", "Jes 63:12": "Die de arm van Zijn heerlijkheid heeft laten gaan aan de rechterhand van Mozes; Die de wateren voor hun aangezicht kliefde, opdat Hij Zich een eeuwige Naam maakte?", "Neh 7:41": "De kinderen van Pashur, duizendtweehonderdzevenenveertig;", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Pred 10:16": "Wee u, land, waarvan de koning een kind is, en waarvan de vorsten al in de morgenstond eten!", "Ps 106:8": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "Jer 27:1-11": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia: Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals. En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Jer 42:12": "En Ik zal u barmhartigheid geven, dat hij zich over u erbarmt, en u weer in uw land brengt.", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "Ezech 20:33": "Zo waarachtig als Ik leef, spreekt de Heere HEERE: Voorzeker zal Ik met een sterke hand, en een uitgestrekte arm, en met een uitgegoten grimmigheid over u regeren!", "Spr 14:16": "De wijze vreest, en wijkt van het kwade; maar de dwaas is opvliegend en zorgeloos.", "Kol 1:26": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen;", "Joh 1:7": "Deze kwam tot een getuigenis, om van het Licht te getuigen, opdat zij allen door hem geloven zouden.", "Num 16:21": "Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren!", "Jer 49:16": "Uw verschrikkelijkheid heeft u bedrogen, en de trots van uw hart, u die woont in de kloven van de steenrotsen, die de hoogte van de heuvels vasthoudt! Al zou u uw nest zo hoog maken als de arend, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Jer 44:6": "Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat ze tot eenzaamheid en tot verwoesting geworden zijn, zoals het is op deze dag.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "Jer 25:38": "Hij heeft, als een jonge leeuw, Zijn hut verlaten; want hun land is geworden tot een verwoesting, vanwege de gloed van de verdrukker, ja, vanwege de gloed van Zijn toorn.", "Ps 20:8": "Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Ps 44:7": "Want ik vertrouw niet op mijn boog, en mijn zwaard zal mij niet verlossen.", "Klaagl 2:6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "Rom 10:4": "Want het einde van de wet is Christus, tot rechtvaardigheid voor ieder die gelooft.", "Job 15:28-30": "En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden. Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde. Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.", "Job 29:18": "En ik zei: Ik zal in mijn nest de geest geven, en ik zal de dagen vermenigvuldigen als het zand.", "Spr 3:33": "De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "Ezech 17:20": "En Ik zal Mijn net over hem uitspreiden, zodat hij gegrepen zal worden in Mijn jachtnet; en Ik zal hem naar Babel laten brengen, en zal daar met hem in het gericht gaan over zijn overtreding, waarmee hij tegen Mij overtreden heeft.", "Rom 2:3": "En denkt u dit, o mens, die hen oordeelt die zulke dingen doen, en dat zelf ook doet, dat u het oordeel van God zult ontvluchten?", "2 Kon 25:2": "Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Ef 3:9": "en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus;", "Spr 31:8": "Open uw mond voor de stomme, voor de rechtszaak van allen die dreigen om te komen.", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "Jer 17:1-4": "De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren; Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels. Ik zal Mijn berg met het veld, uw vermogen en al uw schatten ten roof geven, alsook uw hoogten, om de zonde in al uw landpalen.", "Hand 13:17": "De God van dit volk Israël heeft onze vaderen uitverkoren, en het volk verhoogd, toen zij als vreemdelingen in het land Egypte woonden, en heeft hen met een sterke arm daaruit geleid.", "Ps 94:23": "En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.", "Deut 9:29": "Zij zijn toch Uw volk, en Uw erfdeel, dat U door Uw grote kracht, en door Uw uitgestrekte arm hebt uitgevoerd!", "Deut 16:18-20": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel. U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen. Gerechtigheid, gerechtigheid zult u najagen; opdat u leeft, en het land erfelijk bezit dat de HEERE, uw God, u geven zal.", "Jes 59:2": "Maar uw ongerechtigheden brengen een scheiding tussen u en uw God, en uw zonden verbergen Zijn aangezicht voor u, zodat Hij niet hoort.", "1 Sam 17:45-50": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Ex 6:5": "Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "Jes 47:7": "En u zei: Ik zal koningin zijn in eeuwigheid; tot nog toe hebt u deze dingen niet in uw hart genomen, u hebt aan het einde daarvan niet gedacht.", "Dan 5:25-29": "Dit nu is het schrift dat daar getekend is: MENE, MENE, TEKEL, UPHARSIN. Dit is de uitleg van deze woorden: MENE; God heeft uw koninkrijk geteld, en Hij heeft het beëindigd. TEKEL; u bent op een weegschaal gewogen, en u bent te licht bevonden.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Jer 10:17-22": "Raap uw koopwaar weg uit het land, u inwoonster van de vesting! Want zo zegt de HEERE: Ziet, Ik zal de inwoners van het land op deze keer wegslingeren, en zal hen benauwen, opdat zij het vinden. O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Ps 62:11": "Vertrouw niet op onderdrukking, en word niet ijdel door roverij; als het vermogen overvloedig toeneemt, zet er het hart niet op.", "Rom 6:16": "Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Ex 13:8": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Jer 11:22": "Daarom, zo zegt de HEERE van de heerscharen¹: Zie, Ik zal met een bezoeking over hen komen: de jongemannen zullen door het zwaard sterven, hun zonen en hun dochters zullen van honger sterven.", "Hos 13:3": "Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "Hos 4:9": "Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.", "Neh 11:12": "En hun broeders, die het werk in het huis deden, waren achthonderdtweeëntwintig. En Adaja, de zoon van Jeroham, de zoon van Pelalja, de zoon van Amzi, de zoon van Zacharja, de zoon van Pashur, de zoon van Malchia;", "Matt 1:21": "en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden.", "Ps 36:13": "Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.", "Job 36:17": "Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Klaagl 2:5": "He. De Heere is geworden als een vijand; Hij heeft Israël verslonden, Hij heeft al haar paleizen verslonden. Hij heeft haar vestingen verdorven; en Hij heeft bij de dochter van Juda het klagen en kermen vermenigvuldigd.", "Rom 3:28-30": "Wij stellen dan vast, dat de mens door het geloof gerechtvaardigd wordt, zonder de werken van de wet. Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen; omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.", "Ps 82:4": "Verlos de arme en de behoeftige, ruk hem uit de hand van de goddelozen.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Jes 49:11": "En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "2 Kron 36:17": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Ex 18:20": "en maak hun de instellingen en de wetten duidelijk, en maak hun de weg bekend waarin zij moeten gaan, en het werk dat zij moeten doen.", "Jes 3:1-8": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water; De held en de krijgsman, de rechter en de profeet, en de waarzegger, en de oude; De leider van vijftig, en de aanzienlijke, en de raadsman, en de wijze onder de werkmeesters, en hem die welbespraakt is.", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "Jer 4:4": "Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "1 Sam 28:18": "Zoals u naar de stem van de HEERE niet geluisterd hebt, en de gloed van Zijn toorn niet uitgevoerd hebt tegen Amalek; daarom heeft de HEERE u deze zaak aangedaan op deze dag.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Luk 12:4": "En Ik zeg u, Mijn vrienden: wees niet bang voor hen die het lichaam doden, en daarna niets meer kunnen doen.", "Matt 12:34": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.", "Jes 16:3-5": "Breng raad, houd gericht, maak uw schaduw als de nacht in het midden van de middag; verberg de verdrevenen, en verraad hem die rondzwerft niet. Laat mijn verdrevenen bij u wonen, o Moab! Wees u hun een schuilplaats voor het aangezicht van de verwoester; want de onderdrukker heeft een einde, de verwoesting is opgehouden, de vertreders zijn van de aarde verdwenen. Want er zal een troon bevestigd worden in goedertierenheid, en daarop zal iemand betrouwbaar zitten in de tent van David, iemand die oordeelt en het recht zoekt, en vaardig is tot gerechtigheid.", "1 Kon 14:3": "En neem in uw hand tien broden, en koeken, en een kruik honing, en ga naar hem toe; hij zal u vertellen wat er met deze jongen gebeuren zal.", "Ps 77:16": "U hebt Uw volk door Uw arm verlost; de kinderen van Jakob en van Jozef. Sela.", "Hos 2:8-12": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "Lev 26:25": "Want Ik zal een zwaard over u brengen, dat de wraak van het verbond wreken zal, zodat u in uw steden verzameld wordt; dan zal Ik de pest in uw midden zenden, en u zult in de hand van de vijand overgegeven worden.", "Deut 1:17": "U zult in het gericht niemand voortrekken; u zult de kleine, evenals de grote, horen; u zult voor niemands aangezicht bang zijn; want het gericht is van God; maar de zaak die voor u te zwaar zal zijn, zult u naar mij laten komen, en ik zal die horen.", "1 Sam 14:6-14": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen. Toen zei zijn wapendrager tegen hem: Doe alles wat in uw hart is; ga uw gang, zie, ik ben met u, naar uw hart. Jonathan nu zei: Zie, wij zullen naar die mannen oversteken, en wij zullen ons aan hen laten zien.", "Jer 7:20": "Daarom zegt de Heere HEERE zo: Zie, Mijn toorn en Mijn grimmigheid zal uitgestort worden over deze plaats, over de mensen en over de dieren, en over de bomen van het veld, en over de vrucht van het aardrijk; en het zal branden, en niet uitgeblust worden.", "Jer 38:1": "Toen Sefatja, de zoon van Matthan, en Gedalia, de zoon van Pashur, en Juchal, de zoon van Selemja, en Pashur, de zoon van Malchia, de woorden hoorden die Jeremia tot al het volk sprak:", "2 Kron 32:21": "En de HEERE zond een engel, die alle strijdbare helden, en vorsten, en aanvoerders in het leger van de koning van Assyrië vernietigde. Zo keerde hij met schaamte van het aangezicht terug naar zijn land; en toen hij in het huis van zijn god was gegaan, velden zij hem daar met het zwaard, zij die uit zijn eigen lijf voortgekomen waren.", "Ps 106:23": "Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.", "Spr 23:4": "Vermoei u niet om rijk te worden; zie af van uw eigen vernuft.", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Ps 78:21": "Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Deut 29:18": "Dat onder u niet iemand is, man of vrouw, of gezin, of stam, die zijn hart heden afwendt van de HEERE, onze God, om de goden van deze volken te gaan dienen; dat onder u niet een wortel is, die gal en alsem draagt;", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Hand 11:17": "Als God hun dan dezelfde gave gegeven heeft als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik dan, dat ik God zou kunnen tegenhouden?", "1 Kon 8:42": "(want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis;", "2 Kon 17:36": "Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Openb 16:19": "En de grote stad werd in drie delen gescheurd, en de steden van de heidenvolken vielen; en aan het grote Babylon werd gedacht voor God, om haar de drinkbeker te geven van de wijn van de toorn van Zijn gramschap.", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Luk 18:9-14": "En Hij vertelde ook aan sommigen, die op zichzelf vertrouwden dat zij rechtvaardig waren en de anderen niets waard achtten, deze gelijkenis: Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "Jes 7:2": "Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind.", "2 Kron 36:17-20": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand. En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel. En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Ps 44:2-5": "O God! Wij hebben het met onze oren gehoord, onze vaders hebben het ons verteld: Wat een werk hebt U gedaan in hun dagen, in de dagen van vroeger. U hebt de heidenvolken met Uw hand uit de bezitting verdreven, maar hen geplant; U hebt de volken geplaagd, hen daarentegen doen voortschieten. Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Ezech 20:48": "En alle vlees zal zien dat Ik, de HEERE, dat heb aangestoken; het zal niet uitgeblust worden.", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Deut 25:1": "Wanneer er tussen mannen twist is, en zij naar het gerecht gaan zodat men hen recht spreekt, dan zal men de rechtvaardige rechtvaardig verklaren, en de onrechtvaardige veroordelen.", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Jes 37:24": "Door middel van uw dienaren hebt u de Heere gehoond, en gezegd: Met de menigte van mijn wagens heb ik de hoogte van de bergen beklommen, de zijden van Libanon; en ik zal zijn hoge cederbomen en zijn beste dennenbomen omhakken; en ik zal komen tot zijn verste hoogte, in het woud van zijn mooie veld.", "Jes 57:13": "Wanneer u zult roepen, laat dan degenen die door u verzameld zijn, u redden; maar de wind zal hen allemaal wegvoeren, de leegte zal hen wegnemen. Maar wie op Mij vertrouwt, die zal het land erven, en Mijn heilige berg in bezit krijgen.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Jer 42:13-22": "Maar als u zult zeggen: Wij zullen in dit land niet blijven; zodat u niet gehoorzaam bent aan de stem van de HEERE, van uw God, en zegt: Nee, maar wij zullen naar Egypteland gaan, waar wij geen oorlog zullen zien, noch het geluid van de bazuin horen, noch naar brood hongeren, en daar zullen wij blijven; nu dan, daarom hoor het woord van de HEERE, overblijfsel van Juda! Zo zegt de HEERE van de heerscharen, de God van Israël: Als u vastbesloten uw aangezichten stelt om naar Egypte te gaan, en daar naartoe gaat om daar als vreemdelingen te wonen;", "Jer 9:25": "Zie, de dagen komen, spreekt de HEERE, dat Ik straf zal doen over alle besnedenen, samen met degenen die de voorhuid hebben;", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "1 Tim 1:15": "Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "1 Petr 2:14": "Hetzij aan de stadhouders, als aan hen die door hem gezonden worden, tot straf van de kwaaddoeners, maar tot lof van hen die goeddoen.", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Ps 91:16": "Ik zal hem met lengte van dagen verzadigen, en Ik zal hem Mijn heil doen zien.", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Ezech 13:10": "Daarom, ja, daarom dat zij Mijn volk verleiden, en zeggen: Vrede, terwijl er geen vrede is; en dat de een een lemen wand bouwt, en zie, de anderen die pleisteren met loze kalk.", "Spr 31:9": "Open uw mond; oordeel rechtvaardig, en doe de verdrukte en de arme recht.", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Jer 25:9": "Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden.", "Joh 4:22": "U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.", "Ezech 14:19-21": "Of als Ik de pest in datzelfde land zend, en Mijn grimmigheid daarover met bloed uitgiet, om daaruit mensen en beesten uit te roeien; Ofsc
