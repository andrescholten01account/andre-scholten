,"vertalingen":{"SVnu":{"1":"Het woord dat van de HEERE gekomen is tot Jeremia, toen koning Zedekia Pashur, de zoon van Malchia, en Zefanja, de zoon van Maaseja, de priester, naar hem toe zond, met de woorden:","2":"Vraag toch de HEERE voor ons, want Nebukadnezar, de koning van Babel, strijdt tegen ons; misschien zal de HEERE met ons doen naar al Zijn wonderen, zodat hij van ons optrekt.","3":"Toen zei Jeremia tegen hen: Zo zult u tegen Zedekia zeggen:","4":"Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad.","5":"En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid.","6":"En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.","7":"En daarna, spreekt de HEERE, zal Ik Zedekia, de koning van Juda, en zijn dienaren, en het volk, en hen die in deze stad zijn overgebleven van de pest, van het zwaard en van de honger, geven in de hand van Nebukadnezar, de koning van Babel, en in de hand van hun vijanden, en in de hand van hen die hun leven zoeken; en hij zal ze slaan met de scherpte van het zwaard; hij zal ze niet sparen, niet ontzien, en zich niet ontfermen.","8":"En tegen dit volk zult u zeggen: Zo zegt de HEERE: Zie, Ik stel voor uw gezicht de weg van het leven en de weg van de dood.","9":"Wie in deze stad blijft, zal sterven door het zwaard, of door de honger, of door de pest; maar wie eruit gaat en overloopt naar de Chaldeeën, die u belegeren, die zal leven, en zijn leven zal hem tot een buit zijn.","10":"Want Ik heb Mijn gezicht tegen deze stad gesteld ten kwade en niet ten goede, spreekt de HEERE; zij zal gegeven worden in de hand van de koning van Babel, en hij zal ze met vuur verbranden.","11":"En aangaande het huis van de koning van Juda: hoor het woord van de HEERE.","12":"O huis van David! zo zegt de HEERE: Spreek 's morgens recht, en bevrijd de beroofde uit de hand van de verdrukker; anders zal Mijn gramschap uitvaren als een vuur, en branden, zodat niemand het blussen kan, vanwege de slechtheid van uw daden.","13":"Zie, Ik zál tegen u, inwoonster van het dal, rots van het plein! spreekt de HEERE; u, die zegt: Wie zou tegen ons afkomen, of wie zou komen in onze woningen?","14":"En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is."},"SV":{"1":"Het woord, dat van den HEERE geschied is tot Jeremia, als koning Zedekia tot hem zond Pashur, den zoon van Malchia, en Zefanja, den zoon van Maaseja, den priester, zeggende:","2":"Vraag toch den HEERE voor ons, want Nebukadnezar, de koning van Babel, strijdt tegen ons; misschien zal de HEERE met ons doen naar al Zijn wonderen, dat hij van ons optrekke.","3":"Toen zeide Jeremia tot hen: Zo zult gijlieden tot Zedekia zeggen:","4":"Zo zegt de HEERE, de God Israëls: Ziet, Ik zal de krijgswapenen omwenden, die in ulieder hand zijn, met dewelke gij strijdt tegen den koning van Babel en tegen de Chaldeen, die u belegeren, van buiten aan den muur; en Ik zal ze verzamelen in het midden van deze stad.","5":"En Ik Zelf zal tegen ulieden strijden, met een uitgestrekte hand en met een sterken arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid.","6":"En Ik zal de inwoners dezer stad slaan, zowel de mensen als de beesten; door een grote pestilentie zullen zij sterven.","7":"En daarna, spreekt de HEERE, zal Ik Zedekia, den koning van Juda, en zijn knechten, en het volk, en die in deze stad overgebleven zijn van de pestilentie, van het zwaard en van den honger, geven in de hand van Nebukadnezar, den koning van Babel, en in de hand hunner vijanden, en in de hand dergenen, die hun ziel zoeken; en hij zal ze slaan met de scherpte des zwaards; hij zal ze niet sparen, noch verschonen, noch zich ontfermen.","8":"En tot dit volk zult gij zeggen: Zo zegt de HEERE: Ziet, Ik stel voor ulieder aangezicht den weg des levens en den weg des doods.","9":"Die in deze stad blijft, zal sterven door het zwaard, of door den honger, of door de pestilentie; maar die er uitgaat en valt tot de Chaldeen, die ulieden belegeren, die zal leven , en zijn ziel zal hem tot een buit zijn.","10":"Want Ik heb Mijn aangezicht tegen deze stad gesteld ten kwade en niet ten goede, spreekt de HEERE; zij zal gegeven worden in de hand des konings van Babel, en hij zal ze met vuur verbranden.","11":"En aangaande het huis des konings van Juda, hoort des HEEREN woord.","12":"O huis Davids! zo zegt de HEERE: Richt des morgens recht, en verlost den beroofde uit den hand des verdrukkers; opdat Mijn gramschap niet uitvare als een vuur, en brande, dat niemand blussen kunne, vanwege de boosheid uwer handelingen.","13":"Ziet, Ik *wil* aan u, gij inwoneres des dals, gij rots van het plein! spreekt de HEERE; gijlieden, die zegt: Wie zou tegen ons afkomen, of wie zou komen in onze woningen?","14":"En Ik zal over ulieden bezoeking doen naar de vrucht uwer handelingen, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat zal verteren al wat rondom haar is."},"KJV":{"1":"The word which came unto Jeremiah from the LORD, when king Zedekiah sent unto him Pashur the son of Melchiah, and Zephaniah the son of Maaseiah the priest, saying,","2":"Enquire, I pray thee, of the LORD for us; for Nebuchadrezzar king of Babylon maketh war against us; if so be that the LORD will deal with us according to all his wondrous works, that he may go up","3":"Then said Jeremiah unto them, Thus shall ye say to Zedekiah:","4":"Thus saith the LORD God of Israel; Behold, I will turn back the weapons of war that *are* in your hands, wherewith ye fight against the king of Babylon, and *against* the Chaldeans, which besiege you without the walls, and I will assemble them into the midst of this city.","5":"And I myself will fight against you with an outstretched hand and with a strong arm, even in anger, and in fury, and in great wrath.","6":"And I will smite the inhabitants of this city, both man and beast: they shall die of a great pestilence.","7":"And afterward, saith the LORD, I will deliver Zedekiah king of Judah, and his servants, and the people, and such as are left in this city from the pestilence, from the sword, and from the famine, into the hand of Nebuchadrezzar king of Babylon, and into the hand of their enemies, and into the hand of those that seek their life: and he shall smite them with the edge of the sword; he shall not spare them, neither have pity, nor have mercy.","8":"And unto this people thou shalt say, Thus saith the LORD; Behold, I set before you the way of life, and the way of death.","9":"He that abideth in this city shall die by the sword, and by the famine, and by the pestilence: but he that goeth out, and falleth to the Chaldeans that besiege you, he shall live, and his life shall be unto him for a prey.","10":"For I have set my face against this city for evil, and not for good, saith the LORD: it shall be given into the hand of the king of Babylon, and he shall burn it with fire.","11":"And touching the house of the king of Judah, *say*, Hear ye the word of the LORD;","12":"O house of David, thus saith the LORD; Execute judgment in the morning, and deliver *him that is* spoiled out of the hand of the oppressor, lest my fury go out like fire, and burn that none can quench *it*, because of the evil of your doings.","13":"Behold, I *am* against thee, O inhabitant of the valley, *and* rock of the plain, saith the LORD; which say, Who shall come down against us? or who shall enter into our habitations?","14":"But I will punish you according to the fruit of your doings, saith the LORD: and I will kindle a fire in the forest thereof, and it shall devour all things round about"}},"tsk":{"1":[{"ko o 4:19 ; 2Sa 4:8 ."},{"catchword":"hij zal ze slaan","tekst":"De koning van Babel."},{"catchword":"met de scherpte","tekst":"Hebreeuws, aan den mond des zwaards."}],"9":[{"catchword":"valt tot de Chaldeën,","tekst":"Dat is, die zich gewilliglijk tot hem begeeft."},{"catchword":"ziel","tekst":"Dat is, leven of persoon, dat is, zijne behoudenis zal hij hebben als tot een buit, die men met gevaar van den vijand haalt, of die iemand onvoorziens in handen valt en waarover men zich verheugt; alzo onder Jer 38:2 , en Jer 45:5 ."}],"10":[{"catchword":"gesteld","tekst":"Zie Lev 17:10 ."},{"catchword":"kwade","tekst":"Tot hunne straf en verderf."},{"catchword":"goede,","tekst":"Om hun wel te doen, of te zegenen."}],"12":[{"catchword":"verdrukkers;","tekst":"Die hem met list of geweld verdrukt."}],"13":[{"catchword":"wil","tekst":"Of, Ik [ben] tegen u, of zal tegen u zijn; dat is, uwe tegenpartij zijn, Ik zal mij tegen u kanten; alzo onder Jer 23:30-32 ; Eze 13:8 , en Eze 21:3 , Eze 29:3 , enz. Elders wordt deze manier van spreken ook in het goede of ten beste genomen, zie Eze 36:9 ."},{"catchword":"gij inwoneres","tekst":"Versta, de stad Jeruzalem, waarvan het onderste deel in de laagte lag, het bovenste op den berg Zion, waar Davids stad en slot was."},{"catchword":"van het plein","tekst":"Alwaar de tempel op het plein van den berg Moria stond; of, voor welke rots buiten een effen veld ligt, gelijk enigen dit verstaan."}],"14":[{"catchword":"over ulieden","tekst":"Dat is, Ik zal u straffen, zie Gen 21:1 ."},{"catchword":"naar de vrucht","tekst":"Gelijk boven Jer 17:10 ."},{"catchword":"vuur aansteken","tekst":"Zie 2Ch 36:19 , en onder Jer 52:13 ."},{"catchword":"haar woud,","tekst":"Jeruzalem, waarvan in vs.13. Door het woud kan men verstaan de schone gebouwen der stad, die getimmerd waren van hout, dat uit het woud van den Libanon gehouwen was. Vergelijk onder Jer 22:7 , Jer 22:23 ; of de ganse stad, met het land, zijnde vol volk, als een woud vol bomen. Vergelijk Eze 20:46 , met de aantekening aldaar."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The word which came unto Jeremiah from the Lord when king Zedekiah sent him Pashur the son of Malchia [of the prosperity of Malchia upon whose family the fifth Lot in the division of the priest in David time fell 1Ch 24:9as upon the family of Maasejah of whom is spoken in the words following four and twentieth lot fell 1 Chronicles 24.18] and Zephania the son of Maseja the priest saying;"}],"2":[{"catchword":null,"tekst":"Enquire I pray thee of the Lord for us for Nebuchadnezzar [so below verse 7 and often by this prophet otherwise called Nebuchadnezzar] the king of Babel fighteth against us it may be the Lord will do with us according to all his wonders [as he hath hereto fore done so often for the protection and deliverance of his people] that he may march up from us [that Nebuchadnezzar may break up and leave the siege]"}],"3":[{"catchword":null,"tekst":"Then said Jeremiah unto them thus shall ye say unto Zedekiah:"}],"4":[{"catchword":null,"tekst":"Thus saith the Lord the God of Israel ; behold I will turn back the weapons of war [Heb. Instruments or furniture of war ]that are in your hand [that they shall be unprofitable yea hurtful for ye though ye think to defend yourselves by them and to beat back the Chaldeans as followeth ] wherewith ye fight against the King of Babel and against the Chaldeans that besiege ye without the wall and I will assemble them into the midst of the city [I will let the Babylonians or the Chaldeans come in or I will let them in or cause the city see of the Hebrew word rendered here assembling Judges 19 on verse 15.]"}],"5":[{"catchword":null,"tekst":"And I myself will fight against you with an outstretched hand and with a strong arm yea with anger and with wrath and with great indignation."}],"6":[{"catchword":null,"tekst":"And smite the inhabitants of this city both men and beasts [Heb. And the man and the beast] they shall die by great pestilence."}],"7":[{"catchword":null,"tekst":"And afterwards saith the Lord I will deliver Zedekiah the king of Judah and his servant and the people and those that are left from the city in pestilence from the sword and from the famine into the hand of Nebuchadnezzar the king of Babel and into the hand of the enemies and into the hand of that seek of their soul [that is that hunt after their life see exodus 4 on verse 19 and 2Sa 4:8] and he [the king of Babel] shall smite them with the edge of the sword ] he shall not spare them neither have pity nor have mercy."}],"8":[{"catchword":null,"tekst":"And unto this people thou shalt say thus saith the Lord behold I set before your face the way of life and the way of death."}],"9":[{"catchword":null,"tekst":"He that abideth in this city shall die by the sword or by famine nor by the pestilence but he that goeth out of it and falleth into the Chaldean [that is he that willingly surrendeth himself to them ]that besiege ye he shall live and his soul [that is life or person ] shall be unto him for a prey [that is he shall have his preservation for a prey which is fetched with hazards and danger of the enemies or falleth unaware into a mans hand for which he rejoiceth so below chapter 38.2 and 45.5]"}],"10":[{"catchword":null,"tekst":"For I have set my face against this city [see Leviticus 17 on verse 10] for evil [for the punishment and destruction] and not for good [to do well unto them or to bless them] saith the Lord it shall be delivered into the hand of the king of Babel and he shall burn it with fire."}],"11":[{"catchword":null,"tekst":"And concerning the house and king of Judah hear the word of the Lord"}],"12":[{"catchword":null,"tekst":"O house of David thus saith the Lord judge judgment in the morning and deliver the spoilt out of the hand of the oppressor [that opposeth him by craft and violence ]left my wrath go forth like fire and burn that none can quench it because of the wickedness of your dealings."}],"13":[{"catchword":null,"tekst":"Behold I will be upon thee [or I am against thee that is be thine adversary I will oppose myself against thee so below chapter 23.30,31,32 Ezech .13.8,23 & 29.3 elsewhere this phrase is also taken in good sense or for good see Ezech 36.9] thou inhabitants of the valley [meaning the city of Jerusalem whereof the lowermost part lay in the low ground and the uppermost on the mount Zion where David city and tower was ] thou rock of the plain [where the temple stood on the plain of mount Morija or which the rock lay outwardly before a plain field as some understand this ]saith the Lord ye that say ye should come against us ? Or who should enter into your inhabitations."}],"14":[{"catchword":null,"tekst":"And I will visit ye [that is I will punish ye see Genesis 21 on verse 1] according to the fruit of [above chapter 17.10] saith the Lord and I will kindle a fire in the forest thereof [ to wit of Jerusalem whereof in the former verse by the forest may be understood the fair buildings of the city that were built with wood that was hewn out of the forest of Libanon compare below chapter 22.7,23or the whole city of the country being full of people as a forest is full of trees compare Ezech 20.46 with the annotate there ] which shall consume all that is round about it [see 2Ch 36:19 below chapter 52.13.]"}]}}};

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);

  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
