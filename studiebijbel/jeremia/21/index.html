van het zwaard; hij zal ze niet sparen, niet ontzien, en zich niet ontfermen.", "8": "En tegen dit volk zult u zeggen: Zo zegt de HEERE: Zie, Ik stel voor uw gezicht de weg van het leven en de weg van de dood.", "9": "Wie in deze stad blijft, zal sterven door het zwaard, of door de honger, of door de pest; maar wie eruit gaat en overloopt naar de Chaldeeën, die u belegeren, die zal leven, en zijn leven zal hem tot een buit zijn.", "10": "Want Ik heb Mijn gezicht tegen deze stad gesteld ten kwade en niet ten goede, spreekt de HEERE; zij zal gegeven worden in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "11": "En aangaande het huis van de koning van Juda: hoor het woord van de HEERE.", "12": "O huis van David! zo zegt de HEERE: Spreek 's morgens recht, en bevrijd de beroofde uit de hand van de verdrukker; anders zal Mijn gramschap uitvaren als een vuur, en branden, zodat niemand het blussen kan, vanwege de slechtheid van uw daden.", "13": "Zie, Ik zál tegen u, inwoonster van het dal, rots van het plein! spreekt de HEERE; u, die zegt: Wie zou tegen ons afkomen, of wie zou komen in onze woningen?", "14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is."}, "SV": {"1": "Het woord, dat van den HEERE geschied is tot Jeremia, als koning Zedekia tot hem zond Pashur, den zoon van Malchia, en Zefanja, den zoon van Maaseja, den priester, zeggende:", "2": "Vraag toch den HEERE voor ons, want Nebukadnezar, de koning van Babel, strijdt tegen ons; misschien zal de HEERE met ons doen naar al Zijn wonderen, dat hij van ons optrekke.", "3": "Toen zeide Jeremia tot hen: Zo zult gijlieden tot Zedekia zeggen:", "4": "Zo zegt de HEERE, de God Israëls: Ziet, Ik zal de krijgswapenen omwenden, die in ulieder hand zijn, met dewelke gij strijdt tegen den koning van Babel en tegen de Chaldeen, die u belegeren, van buiten aan den muur; en Ik zal ze verzamelen in het midden van deze stad.", "5": "En Ik Zelf zal tegen ulieden strijden, met een uitgestrekte hand en met een sterken arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid.", "6": "En Ik zal de inwoners dezer stad slaan, zowel de mensen als de beesten; door een grote pestilentie zullen zij sterven.", "7": "En daarna, spreekt de HEERE, zal Ik Zedekia, den koning van Juda, en zijn knechten, en het volk, en die in deze stad overgebleven zijn van de pestilentie, van het zwaard en van den honger, geven in de hand van Nebukadnezar, den koning van Babel, en in de hand hunner vijanden, en in de hand dergenen, die hun ziel zoeken; en hij zal ze slaan met de scherpte des zwaards; hij zal ze niet sparen, noch verschonen, noch zich ontfermen.", "8": "En tot dit volk zult gij zeggen: Zo zegt de HEERE: Ziet, Ik stel voor ulieder aangezicht den weg des levens en den weg des doods.", "9": "Die in deze stad blijft, zal sterven door het zwaard, of door den honger, of door de pestilentie; maar die er uitgaat en valt tot de Chaldeen, die ulieden belegeren, die zal leven , en zijn ziel zal hem tot een buit zijn.", "10": "Want Ik heb Mijn aangezicht tegen deze stad gesteld ten kwade en niet ten goede, spreekt de HEERE; zij zal gegeven worden in de hand des konings van Babel, en hij zal ze met vuur verbranden.", "11": "En aangaande het huis des konings van Juda, hoort des HEEREN woord.", "12": "O huis Davids! zo zegt de HEERE: Richt des morgens recht, en verlost den beroofde uit den hand des verdrukkers; opdat Mijn gramschap niet uitvare als een vuur, en brande, dat niemand blussen kunne, vanwege de boosheid uwer handelingen.", "13": "Ziet, Ik *wil* aan u, gij inwoneres des dals, gij rots van het plein! spreekt de HEERE; gijlieden, die zegt: Wie zou tegen ons afkomen, of wie zou komen in onze woningen?", "14": "En Ik zal over ulieden bezoeking doen naar de vrucht uwer handelingen, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat zal verteren al wat rondom haar is."}, "KJV": {"1": "The word which came unto Jeremiah from the LORD, when king Zedekiah sent unto him Pashur the son of Melchiah, and Zephaniah the son of Maaseiah the priest, saying,", "2": "Enquire, I pray thee, of the LORD for us; for Nebuchadrezzar king of Babylon maketh war against us; if so be that the LORD will deal with us according to all his wondrous works, that he may go up", "3": "Then said Jeremiah unto them, Thus shall ye say to Zedekiah:", "4": "Thus saith the LORD God of Israel; Behold, I will turn back the weapons of war that *are* in your hands, wherewith ye fight against the king of Babylon, and *against* the Chaldeans, which besiege you without the walls, and I will assemble them into the midst of this city.", "5": "And I myself will fight against you with an outstretched hand and with a strong arm, even in anger, and in fury, and in great wrath.", "6": "And I will smite the inhabitants of this city, both man and beast: they shall die of a great pestilence.", "7": "And afterward, saith the LORD, I will deliver Zedekiah king of Judah, and his servants, and the people, and such as are left in this city from the pestilence, from the sword, and from the famine, into the hand of Nebuchadrezzar king of Babylon, and into the hand of their enemies, and into the hand of those that seek their life: and he shall smite them with the edge of the sword; he shall not spare them, neither have pity, nor have mercy.", "8": "And unto this people thou shalt say, Thus saith the LORD; Behold, I set before you the way of life, and the way of death.", "9": "He that abideth in this city shall die by the sword, and by the famine, and by the pestilence: but he that goeth out, and falleth to the Chaldeans that besiege you, he shall live, and his life shall be unto him for a prey.", "10": "For I have set my face against this city for evil, and not for good, saith the LORD: it shall be given into the hand of the king of Babylon, and he shall burn it with fire.", "11": "And touching the house of the king of Judah, *say*, Hear ye the word of the LORD;", "12": "O house of David, thus saith the LORD; Execute judgment in the morning, and deliver *him that is* spoiled out of the hand of the oppressor, lest my fury go out like fire, and burn that none can quench *it*, because of the evil of your doings.", "13": "Behold, I *am* against thee, O inhabitant of the valley, *and* rock of the plain, saith the LORD; which say, Who shall come down against us? or who shall enter into our habitations?", "14": "But I will punish you according to the fruit of your doings, saith the LORD: and I will kindle a fire in the forest thereof, and it shall devour all things round about"}}, "tsk": {"1": [{"kopje": "Het woord", "refs": ["Jer 39:1", "Jer 21:1-14", "Jer 21:34", "Jer 21:32"]}, {"kopje": "toen", "refs": ["Jer 32:1-3", "Jer 37:1", "Jer 52:1-3", "2 Kon 24:17", "2 Kon 24:18", "1 Kron 3:15", "2 Kron 36:10-13"]}, {"kopje": "Pashur", "refs": ["Jer 38:1", "1 Kron 9:12", "Neh 11:12"]}, {"kopje": "Zefanja", "refs": ["Jer 29:25", "Jer 37:3", "Jer 52:24", "2 Kon 25:18-21"]}], "2": [{"kopje": "Vraag", "refs": ["Jer 37:3", "Jer 37:7", "Jer 38:14-27", "Jer 42:4-6", "Richt 20:27", "1 Sam 10:22", "1 Sam 28:6", "1 Sam 28:15", "1 Kon 14:2", "1 Kon 14:3", "1 Kon 22:3-8", "2 Kon 1:3", "2 Kon 3:11-14", "2 Kon 22:13", "2 Kon 22:14", "Ezech 14:3-7", "Ezech 20:1-3"]}, {"kopje": "voor", "refs": ["Jer 32:24", "Jer 39:1", "Jer 39:2", "Jer 52:3-6", "2 Kon 25:1", "2 Kon 25:2"]}, {"kopje": "naar", "refs": ["Ex 14:1", "Ex 15:27", "Joz 10:1", "Joz 11:23", "Richt 4:1", "Richt 5:31", "1 Sam 7:10-12", "1 Sam 14:6-14", "1 Sam 17:45-50", "2 Kron 14:9-13", "2 Kron 20:1-30", "2 Kron 32:21", "Ps 44:2-5", "Ps 46:9-12", "Ps 48:5-9", "Ps 105:5-45", "Ps 136:1-26", "Jes 59:1", "Jes 59:2"]}], "4": [{"kopje": "Zie", "refs": ["Jer 32:5", "Jer 33:5", "Jer 37:8-10", "Jer 38:2", "Jer 38:3", "Jer 38:17", "Jer 38:18", "Jer 52:18", "Jes 10:4", "Hos 9:12"]}, {"kopje": "en Ik", "refs": ["Jer 39:3", "J : null}, {"disp": "Openb 22:19", "href": "../../openbaring/22/#v19", "ref": "Openb 22:19", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Forests", "href": "../../torrey/f/#t-forests", "kinderen": [{"label": "Illustrative", "href": "../../torrey/f/?hl=Jer.21.14#i7054", "refs": [], "kinderen": [{"label": "(Destroyed by fire,) of destruction of the wicked", "href": "../../torrey/f/?hl=Jer.21.14#i7057", "refs": [{"disp": "Jes 9:18", "href": "../../jesaja/9/#v17", "ref": "Jes 9:17", "svLabel": "SV 17"}, {"disp": "Jes 10:17", "href": "../../jesaja/10/#v17", "ref": "Jes 10:17", "svLabel": null}, {"disp": "Jes 10:18", "href": "../../jesaja/10/#v18", "ref": "Jes 10:18", "svLabel": null}, {"disp": "Jer 21:14", "href": "../../jeremia/21/#v14", "ref": "Jer 21:14", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Punishment Of The Wicked, The", "href": "../../torrey/p/#t-punishment-of-the-wicked-the", "kinderen": [{"label": "On Account Of Their", "href": "../../torrey/p/?hl=Jer.21.14#i16771", "refs": [], "kinderen": [{"label": "Evil ways and doings", "href": "../../torrey/p/?hl=Jer.21.14#i16777", "refs": [{"disp": "Jer 21:14", "href": "../../jeremia/21/#v14", "ref": "Jer 21:14", "svLabel": null}, {"disp": "Hos 4:9", "href": "../../hosea/4/#v9", "ref": "Hos 4:9", "svLabel": null}, {"disp": "Hos 12:2", "href": "../../hosea/12/#v3", "ref": "Hos 12:3", "svLabel": "SV 3"}], "kinderen": []}]}]}]}}, "extern": {"Ezech 33:29": "Dan zullen zij weten dat Ik de HEERE ben, wanneer Ik het land tot een verwoesting en een schrik gemaakt heb, om al hun gruwelen die zij gedaan hebben.", "Ef 2:15": "doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Spr 24:22": "Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?", "Jer 51:45": "Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Luk 7:47": "Daarom zeg Ik u: haar zonden, die vele waren, zijn haar vergeven; want zij heeft veel liefgehad; maar aan wie weinig vergeven wordt, die heeft weinig lief.", "Jes 6:9-13": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op. Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest. Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "Spr 25:6": "Praal niet voor het aangezicht van de koning, en sta niet op de plaats van de groten;", "Ex 23:7": "Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen.", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Deut 7:19": "de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.", "Jer 38:18": "Maar als u naar de vorsten van de koning van Babel niet uitgaat, dan zal deze stad gegeven worden in de hand van de Chaldeeën, en zij zullen haar met vuur verbranden; ook zult u zelf uit hun hand niet ontkomen.", "Jer 52:24-27": "Ook nam de leider van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders. En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en zeven mannen uit degenen die het aangezicht van de koning zagen, die in de stad gevonden werden, alsook de leider van de schrijvers van het leger, die het volk van het land voor de oorlog opschreef, en zestig mannen van het volk van het land, die in het midden van de stad gevonden werden. Toen Nebuzaradan, de leider van de lijfwacht, dezen genomen had, bracht hij hen naar de koning van Babel in Ribla.", "Hand 16:17": "Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen.", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Hand 15:7-9": "En toen daarover een grote twist ontstond, stond Petrus op en zei tegen hen: Mannen broeders, u weet dat God van lang geleden onder ons mij uitgekozen heeft, dat de heidenen door mijn mond het woord van het Evangelie zouden horen, en geloven. En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons; en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Fil 3:7-11": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Dan 9:27": "En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Jer 22:25": "En Ik zal u geven in de hand van hen die uw leven zoeken, en in de hand van hen voor wier gezicht u beeft, namelijk in de hand van Nebukadnezar, de koning van Babel, en in de hand van de Chaldeeën.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Jes 22:1": "De last van het dal van het gezicht. Wat is er nu met u, dat u helemaal naar de daken bent geklommen?", "Jes 9:11": "De Syriërs van voren, en de Filistijnen van achteren, zodat zij Israël opeten met volle mond. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "1 Kon 8:41-43": "Zelfs ook aangaande de vreemdeling, die niet van Uw volk Israël zal zijn, maar uit ver land komt om Uw Naam wil; (want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis; hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Klaagl 2:1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "1 Kor 5:13": "Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Ezech 5:12": "Een derde deel van u zal door de pest sterven, en zal door honger in het midden van u omkomen; en een derde deel zal door het zwaard vallen rondom u; en een derde deel zal Ik naar alle windrichtingen verstrooien, en Ik zal het zwaard achter hen uittrekken.", "Jes 13:17": "Zie, Ik zal de Meden tegen hen opwekken, die het zilver niet zullen achten, en aan het goud zullen zij geen lust hebben.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Jer 30:24": "De gloed van de toorn van de HEERE zal zich niet afwenden, totdat Hij het gedaan heeft, en totdat Hij tot stand gebracht heeft de gedachten van Zijn hart; in het laatste van de dagen zult u daarop letten.", "Jes 59:16": "Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem.", "Amos 5:4": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef.", "Luk 19:44": "en zij zullen u tot de grond toe neerwerpen, en uw kinderen in u; en zij zullen in u geen steen op de andere steen laten liggen, omdat u de tijd waarin u bezocht werd niet hebt herkend.", "Jes 13:18": "Maar hun bogen zullen de jongemannen verpletteren, en zij zullen zich niet ontfermen over de vrucht van de buik; hun oog zal de kinderen niet ontzien.", "Jes 9:20": "Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Spr 9:1-6": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "2 Kron 14:9-13": "En Zerah, de Moor, trok tegen hen op, met een leger van duizend maal duizend, en driehonderd wagens; en hij kwam tot Maresa toe. Toen trok Asa tegen hem uit; en zij stelden de slagorde op in het dal Zefatha bij Maresa. En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Luk 21:5-25": "En toen sommigen spraken over de tempel, dat hij met mooie stenen en geschenken versierd was, zei Hij: Wat deze dingen aangaat, die u aanschouwt: er zullen dagen komen waarin geen steen op de andere steen gelaten zal worden, die niet zal worden afgebroken. En zij vroegen Hem: Meester, wanneer zullen deze dingen dan gebeuren, en wat is het teken wanneer deze dingen zullen gebeuren?", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Jes 13:4": "Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger.", "Jer 34:22": "Zie, Ik zal bevel geven, spreekt de HEERE, en zal hen weer naar deze stad terugbrengen, en zij zullen tegen haar strijden, en zullen ze innemen, en zullen ze met vuur verbranden; en Ik zal de steden van Juda stellen tot een verwoesting, zodat er niemand in woont.", "2 Kon 24:17": "En de koning van Babel maakte Mattanja, diens oom, koning in zijn plaats, en veranderde zijn naam in Zedekia.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "Jer 23:30-32": "Daarom, zie, Ik wil tegen de profeten, spreekt de HEERE, die Mijn woorden stelen, ieder van zijn naaste; Zie, Ik wil tegen de profeten, spreekt de HEERE, die hun tong gebruiken, en spreken: Hij heeft het gesproken; Zie, Ik wil tegen hen die valse dromen profeteren, spreekt de HEERE, en ze vertellen, en Mijn volk verleiden met hun leugens en met hun lichtvaardigheid; terwijl Ik hen niet gezonden heb, en hun niets bevolen heb, en zij dit volk in het geheel geen nut doen, spreekt de HEERE.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Luk 5:31": "En Jezus antwoordde en zei tegen hen: Wie gezond zijn, hebben geen dokter nodig, maar wie ziek zijn.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "Jer 22:24-30": "Zo waarachtig als Ik leef, spreekt de HEERE, al was Chonia, de zoon van Jojakim, de koning van Juda, een zegelring aan Mijn rechterhand, toch zal Ik u vandaar wegrukken. En Ik zal u geven in de hand van hen die uw leven zoeken, en in de hand van hen voor wier gezicht u beeft, namelijk in de hand van Nebukadnezar, de koning van Babel, en in de hand van de Chaldeeën. En Ik zal u, en uw moeder, die u gebaard heeft, wegwerpen in een ander land, waarin u niet geboren bent, en daar zult u sterven.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Jer 15:1-14": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan. En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap! Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Hoogl 2:6": "Zijn linkerhand is onder mijn hoofd, en Zijn rechterhand omhelst mij.", "Jer 5:28": "Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "Rom 2:26": "Als dan de voorhuid de rechten van de wet bewaart, zal zijn voorhuid dan niet tot een besnijdenis gerekend worden?", "Ezech 32:11": "Want zo zegt de Heere HEERE: Het zwaard van de koning van Babel zal u overkomen.", "Jer 49:34": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurde tegen Elam, in het begin van het koninkrijk van Zedekia, de koning van Juda, en zei:", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "Ps 78:49": "Hij zond onder hen de gloed van Zijn toorn, verbolgenheid, en verstoordheid, en benauwdheid, met uitzending van boden van veel kwaad.", "Spr 8:1-5": "Roept de Wijsheid niet, en verheft de Verstandigheid niet Haar stem? Op de top van de hoge plaatsen, aan de weg, ter plaatse waar paden samenkomen, staat Zij; Aan de zijde van de poorten, voor aan de stad, aan de ingang van de deuren roept Zij overluid:", "Ezech 21:19": "U nu, mensenkind, stel u twee wegen voor, waardoor het zwaard van de koning van Babel komt; uit één land zullen zij beide voortkomen; en kies een plaats, kies die aan het hoofd van de weg naar de stad.", "Jer 21:4-10": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Pred 7:7": "Voorwaar, de onderdrukking zou wel een wijze dol maken; en het geschenk verdoemt het hart.", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Matt 23:2-4": "en zei: De Schriftgeleerden en de Farizeeën zitten op de stoel van Mozes; daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet. Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Jes 14:4-26": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Gal 3:1-28": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd. Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof? Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Jes 30:10": "Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Jer 12:3": "Maar U, HEERE, kent mij, U ziet mij, en proeft mijn hart, dat het met U is. Ruk hen uit als schapen ter slachting, en heilig hen tot de dag van de doding.", "Spr 13:2": "Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 36:3": "Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is.", "Deut 23:16": "Hij zal bij u blijven, in uw midden, op de plaats die hij zal kiezen, in een van uw poorten, waar het goed voor hem is; u zult hem niet verdrukken.", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "Jer 38:17": "Jeremia dan zei tegen Zedekia: Zo zegt de HEERE, de God van de heerscharen, de God van Israël: Als u gewillig naar de vorsten van de koning van Babel uitgaat, dan zal uw leven behouden blijven, en deze stad zal niet met vuur verbrand worden; en u zult leven, u en uw huis.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "Jer 9:9-26": "Zou Ik hen om deze dingen niet straffen? spreekt de HEERE; zou Mijn ziel zich niet wreken aan zo'n volk, als dit is? Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan! En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "Matt 21:41": "Zij zeiden tegen hem: Hij zal die kwaden een kwade dood laten sterven, en de wijngaard verhuren aan andere landbouwers, die hem de vruchten op de juiste tijd zullen geven.", "Jak 1:14": "Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Ps 148:11": "Koningen van de aarde, en alle volken, vorsten, en alle rechters van de aarde!", "Spr 25:15": "Een leider wordt door geduld overreed; en een zachte tong breekt het gebeente.", "Ex 23:3": "Ook zult u de arme niet voortrekken in zijn geschil.", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Micha 4:8-10": "En u, Schaapstoren, u Ofel van de dochter van Sion! Tot u zal komen, ja, daar zal komen de vorige heerschappij, het koninkrijk van de dochters van Jeruzalem. Nu, waarom zou u zo luid roepen? Is er geen koning onder u? Is uw Raadgever vergaan, dat smart u heeft aangegrepen, als van een barende vrouw? Lijd smart en doe uw uiterste best om te baren, dochter van Sion, als een barende vrouw; want nu zult u wel uit de stad heen weggaan, en op het veld wonen, en tot in Babel komen, maar daar zult u gered worden; daar zal de HEERE u verlossen uit de hand van uw vijanden.", "Jer 26:9": "Waarom hebt u in de Naam van de HEERE geprofeteerd, en gezegd: Dit huis zal worden als Silo, en deze stad zal woest worden, zodat er niemand meer woont? En het hele volk werd verzameld tegen Jeremia, in het huis van de HEERE.", "Ps 106:29": "En zij hebben de Heere tot toorn verwekt met hun daden, zodat de plaag een inbreuk onder hen deed.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Deut 4:34": "Of: of God ooit beproefd heeft te gaan om Zich een volk uit het midden van een ander volk aan te nemen, door beproevingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekte arm, en met grote verschrikkingen; naar alles wat de HEERE, uw God, voor u in Egypte voor uw ogen gedaan heeft?", "Jer 38:14-27": "Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij. En Jeremia zei tegen Zedekia: Als ik het u verklaar, zult u mij dan niet zeker doden? En als ik u raad geef, zult u toch niet naar mij luisteren. Toen zwoer de koning Zedekia in het geheim aan Jeremia: Zo waarachtig als de HEERE leeft, Die ons dit leven gemaakt heeft: Ik zal u niet doden, en ik zal u niet overgeven in de hand van deze mannen die u naar het leven staan!", "Jes 5:11-14": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft! En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Micha 2:1-3": "Wee hun die onrecht bedenken en kwaad beramen op hun slaapplaatsen; in het licht van de morgen doen zij het, omdat het in de macht van hun hand is. En zij begeren akkers en roven ze, en huizen, en nemen ze weg; zo doen zij de man en zijn huis geweld aan, ja, ieder en zijn erfenis. Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Richt 20:27": "En de kinderen van Israël vroegen de HEERE, want daar was de ark van het verbond van God in die dagen.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Gen 6:12": "Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Ex 9:15": "Want nu heb Ik Mijn hand uitgestrekt, om u en uw volk met de pest te slaan, zodat u van de aarde verdelgd zou worden.", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Hand 4:12": "En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.", "Jer 19:15": "Zo zegt de HEERE van de heerscharen, de God van Israël: Ziet, Ik zal over deze stad, en over al haar steden, al het kwaad brengen, dat Ik over haar gesproken heb; omdat zij hun nek verhard hebben, om Mijn woorden niet te horen.", "Ezech 16:37-41": "daarom, zie, Ik zal al uw minnaars verzamelen, met wie u vermengd bent geweest, en allen die u liefgehad hebt, met allen die u gehaat hebt; en Ik zal hen van rondom tegen u verzamelen, en Ik zal voor hen uw naaktheid ontdekken, zodat zij uw hele naaktheid zullen zien. Daarbij zal Ik u berechten naar de rechten van overspeelsters en bloedvergietsters; en Ik zal u overgeven aan het bloed van de grimmigheid en van het ijver. En Ik zal u in hun hand overgeven, en zij zullen uw verhoging afbreken, en uw hoge plaatsen omverwerpen, en u uw kleren uittrekken, en uw sierlijke juwelen nemen, en u naakt en bloot achterlaten.", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Jes 7:13": "Toen zei hij: Hoor toch, u, huis van David! Is het u te weinig, dat u de mensen moe maakt, dat u ook mijn God moe maakt?", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Amos 2:4": "Zo zegt de HEERE: Om drie overtredingen van Juda, en om vier zal Ik dat niet afwenden; omdat zij de wet van de HEERE verworpen, en Zijn inzettingen niet bewaard hebben; en hun leugens hen verleid hebben, die hun vaders hebben nagevolgd.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Ezech 12:16": "Toch zal Ik van hen weinige mensen laten overblijven van het zwaard, van de honger en van de pest; opdat zij al hun gruwelen vertellen onder de heidenvolken, waarheen zij komen zullen, en zij zullen weten dat Ik de HEERE ben.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Obadja 1:4": "Al verheft u zich als de arend, en al zet u uw nest tussen de sterren, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Jer 46:13": "Het woord, dat de HEERE tot de profeet Jeremia sprak, over de aankomst van Nebukadrezar, de koning van Babel, om Egypteland te slaan.", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Hab 2:5-11": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken. Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk! Zullen niet onvoorziens opstaan die u zullen bijten, en ontwaken die u zullen doen beven, en zult u hun niet tot buit worden?", "Jes 8:14-22": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem. En velen onder hen zullen struikelen, en vallen, en verbroken worden, en zullen verstrikt en gevangen worden. Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Ex 23:9": "U zult ook de vreemdeling niet onderdrukken; want u kent het gemoed van de vreemdeling, omdat u vreemdelingen geweest bent in het land Egypte.", "Jer 27:6-9": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken. En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "Ezech 12:12-16": "En de vorst, die in hun midden is, zal het gereedschap op de schouder dragen in het donker, en hij zal uitgaan; zij zullen door de wand graven, om hem daardoor naar buiten te brengen; hij zal zijn gezicht bedekken, zodat hij met het oog de aarde niet ziet. Ik zal ook Mijn net over hem uitspreiden, zodat hij in Mijn jachtnet gegrepen wordt; en Ik zal hem brengen naar Babylonië, het land van de Chaldeeën; ook zal hij dat niet zien, hoewel hij daar zal sterven. En allen die rondom hem zijn tot zijn hulp, en al zijn troepen zal Ik naar alle windrichtingen verstrooien; en Ik zal het zwaard achter hen trekken.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Richt 5:31": "Zo moeten omkomen al Uw vijanden, o HEERE! Die Hem daarentegen liefhebben, moeten zijn, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren.", "Num 32:13": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij liet hen ronddwalen in de woestijn, veertig jaar lang, totdat heel het geslacht verteerd was dat gedaan had wat kwaad was in de ogen van de HEERE.", "Jes 29:1-10": "Wee Ariël, Ariël! De stad waarin David gelegerd heeft; doe jaar bij jaar; laat ze feestoffers slachten. Toch zal Ik Ariël in het nauw brengen, en er zal treuring en droefheid zijn, en die stad zal Mij gelijk Ariël zijn. Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.", "Joh 5:45": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Ef 2:9": "niet uit de werken, opdat niemand roemt.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Ezech 20:47": "En zeg tegen het zuiderwoud: Hoor het woord van de HEERE: Zo zegt de Heere HEERE: Zie, Ik zal een vuur in u aansteken, dat in u elke groene boom en elke dorre boom zal verteren; de vlammende vlam zal niet uitgeblust worden, maar daardoor zullen alle aangezichten verbrand worden, van het zuiden tot het noorden toe.", "Matt 24:14": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Jak 4:13-15": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "Jer 33:12": "Zo zegt de HEERE van de heerscharen: Op deze plaats, die zo woest is dat er geen mens, zelfs geen dier in is, alsook in al haar steden, zullen weer woningen zijn van herders, die de kudden laten neerliggen.", "Jes 24:1-6": "Zie, de HEERE maakt het land leeg, en Hij maakt het woest; en Hij keert de gestalte ervan om, en Hij verstrooit zijn inwoners. En zoals het met het volk zal gaan, zo zal het met de priester zijn; zoals met de knecht, zo met zijn heer; zoals met de dienstmaagd, zo met haar vrouw; zoals met de koper, zo met de verkoper; zoals met de lener, zo met de ontlener; zoals met de woekeraar, zo met hem van wie hij woeker ontvangt. Dat land zal helemaal leeg gemaakt worden, en het zal helemaal beroofd worden; want de HEERE heeft dit woord gesproken.", "Spr 29:4": "Een koning houdt het land staande door recht; maar wie tot geschenken geneigd is, verstoort het.", "Luk 22:34": "Maar Hij zei: Ik zeg u, Petrus, de haan zal vandaag niet kraaien, voordat u driemaal geloochend zult hebben dat u Mij kent.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "Jer 34:2": "Zo zegt de HEERE, de God van Israël: Ga heen en spreek tot Zedekia, de koning van Juda, en zeg tegen hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "Jes 2:5": "Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "2 Kon 1:3": "Maar de Engel van de HEERE sprak tot Elia, de Thisbiet: Maak u op, ga de boden van de koning van Samaria tegemoet, en spreek tot hen: Is het omdat er geen God in Israël is, dat u heengaat om Baäl-Zebub, de god van Ekron, te vragen?", "Openb 15:1": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd.", "1 Sam 10:22": "Toen vroegen zij verder aan de HEERE, of die man nog daarheen komen zou. De HEERE dan zei: Zie, hij heeft zich tussen de bagage verstopt.", "Amos 2:5": "Daarom zal Ik een vuur in Juda zenden, dat zal Jeruzalems paleizen verteren.", "Jes 31:1-3": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken. Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken. Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "Jes 30:7": "Want Egypte zal nutteloos en tevergeefs helpen; daarom heb Ik hierover geroepen: Stilzitten zal hun sterkte zijn.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Jes 1:17": "Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Ezech 11:7-12": "Daarom, zo zegt de Heere HEERE: Uw gedoden, die u in het midden daarvan neergelegd hebt, die zijn het vlees, en deze stad is de pot; maar u zal Ik uit het midden daarvan doen weggaan. U hebt het zwaard gevreesd; en het zwaard zal Ik over u brengen, spreekt de Heere HEERE. Ook zal Ik u uit het midden daarvan doen weggaan, en Ik zal u overgeven in de hand van vreemden; en Ik zal recht onder u doen.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Deut 26:8": "En de HEERE voerde ons uit Egypte, door een sterke hand, en door een uitgestrekte arm, en door grote schrik, en door tekenen, en door wonderen.", "Num 11:10": "Toen hoorde Mozes het volk wenen door hun huisgezinnen, ieder aan de deur van zijn tent; en de toorn van de HEERE ontstak zeer; ook was dat kwaad in de ogen van Mozes.", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Jes 63:10": "Maar zij zijn opstandig geworden, en zij hebben Zijn Heilige Geest smarten aangedaan; daarom is Hij hun in een vijand veranderd, Hij Zelf heeft tegen hen gestreden.", "Jes 55:1-3": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Luk 22:66": "En toen het dag geworden was, kwamen de oudsten van het volk samen, en de overpriesters en Schriftgeleerden, en brachten Hem in hun raad,", "Hebr 4:1-10": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Jer 39:1": "In het negende jaar van Zedekia, koning van Juda, in de tiende maand, kwam Nebukadrezar, de koning van Babel, en al zijn leger, tegen Jeruzalem, en zij belegerden haar.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Jer 25:8-38": "Daarom, zo zegt de HEERE van de heerscharen: Omdat u Mijn woorden niet hebt gehoord; Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden. En Ik zal van hen doen vergaan de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid, het geluid van de molens en het licht van de lamp.", "Luk 15:4-32": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Neh 8:8": "Jesua, Bani, Serebja, Jamin, Akkub, Sabbethai, Hodia, Maaseja, Kelita, Azaria, Jozabad, Hanan, Pelaja, en de Levieten onderwezen het volk in de wet. En het volk bleef op zijn plaats staan.", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Ezech 22:18-22": "Mensenkind, zij die van het huis van Israël zijn, zijn Mij tot schuim geworden; zij zijn allemaal koper, of tin, of ijzer, of lood, in het midden van de oven; zilverschuim zijn zij geworden. Daarom, zo zegt de Heere HEERE: Omdat u allen tot schuim geworden bent, zie, daarom zal Ik u in het midden van Jeruzalem verzamelen. Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Ex 22:24": "en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Deut 23:15": "U zult een knecht die van zijn heer tot u ontkomen is, niet aan zijn heer overleveren.", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "Ps 68:19-21": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God! Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela. Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Ex 23:6": "U zult het recht van uw arme niet buigen in zijn geschil.", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Openb 15:7": "En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.", "Ezech 22:29": "Het volk van het land pleegt enkel verdrukking en bedrijft enkel roverij, ook onderdrukken zij de ellendige en de arme, en de vreemdeling verdrukken zij zonder recht.", "1 Kron 16:35": "En zegt: Verlos ons, o God van ons heil, en verzamel ons, en red ons van de heidenen, opdat wij Uw heilige Naam loven, en opdat wij ons in Uw lof roemen.", "1 Kron 9:12": "En Adaja, de zoon van Jeroham, de zoon van Pashur, de zoon van Malchija; en Massi, de zoon van Adiël, de zoon van Jahzera, de zoon van Mesullam, de zoon van Mesillemith, de zoon van Immer.", "Ps 30:7": "Ik zei wel in mijn voorspoed: Ik zal nooit wankelen.", "Jer 23:17": "Zij zeggen steeds tegen hen die Mij lasteren: De HEERE heeft het gesproken, u zult vrede hebben; en tegen ieder die naar het goeddunken van zijn eigen hart wandelt, zeggen zij: U zal geen kwaad overkomen.", "Jer 12:5": "Als u loopt met de voetgangers, zo maken zij u moe; hoe zult u zich dan meten met de paarden? Als u alleen vertrouwt in een land van vrede, hoe zult u het dan maken in de verheffing van de Jordaan?", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Matt 23:35-38": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar. Voorwaar, Ik zeg u: Al deze dingen zullen komen over dit geslacht. Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Zach 11:1": "Doe uw deuren open, o Libanon! Opdat het vuur uw ceders verteert.", "Jer 1:11-16": "Verder kwam het woord van de HEERE tot mij, en zei: Wat ziet u, Jeremia? En ik zei: Ik zie een amandelroede. En de HEERE zei tegen mij: U hebt goed gezien; want Ik zal wakker zijn over Mijn woord, om dat te doen. En het woord van de HEERE kwam voor de tweede keer tot mij, en zei: Wat ziet u? En ik zei: Ik zie een ziedende pot, waarvan het voorste deel tegen het noorden gekeerd is.", "Kol 1:27": "aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "Rom 1:5": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam;", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Jer 20:5": "Ook zal Ik al het bezit van deze stad geven, en al haar opbrengst, en al haar kostbaarheden, en alle schatten van de koningen van Juda, Ik zal ze geven in de hand van hun vijanden, die zullen ze roven, ze meenemen en ze naar Babel brengen.", "Jer 25:12-14": "Maar het zal gebeuren, als de zeventig jaren vervuld zijn, dan zal Ik over de koning van Babel, en over dat volk, spreekt de HEERE, hun ongerechtigheid bezoeken, alsook over het land van de Chaldeeën, en zal dat stellen tot eeuwige verwoestingen. En Ik zal over dat land brengen al Mijn woorden, die Ik daarover gesproken heb; al wat in dit boek geschreven is, wat Jeremia geprofeteerd heeft over al deze volken. Want van hen zullen zich laten dienen, die ook machtige volken en grote koningen zijn; zo zal Ik hun vergelden naar hun doen, en naar het werk van hun handen.", "Ps 12:6": "Om de verwoesting van de ellendigen, om het kermen van de behoeftigen, zal Ik nu opstaan, zegt de HEERE; Ik zal in veiligheid zetten wie ernaar snakt.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Ezech 21:25": "En u, o onheilige, goddeloze vorst van Israël, wiens dag komen zal, in de tijd van de uiterste ongerechtigheid;", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Jes 30:5": "Hij zal hen allen beschaamd maken door een volk dat hun geen nut kan doen, noch tot hulp, noch tot voordeel, maar tot schande en ook tot smaad zijn zal.", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Ezra 10:22": "En van de kinderen van Pashur: Eljoenai, Maaseja, Ismaël, Nethaneel, Jozabad en Elasa.", "Openb 14:11": "En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Matt 27:1": "Toen het morgen geworden was, hebben alle overpriesters en de oudsten van het volk samen een besluit genomen tegen Jezus, om Hem te doden.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Ex 18:13": "Doch het gebeurde de volgende dag, dat Mozes ging zitten om het volk te oordelen, en het volk stond bij Mozes, van de morgen tot de avond.", "Jer 52:24": "Ook nam de leider van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Hos 14:4": "Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Mark 10:24": "En de discipelen waren verbaasd over deze woorden van Hem. Maar Jezus antwoordde weer en zei tegen hen: Kinderen, hoe moeilijk is het voor hen die op rijkdom vertrouwen, om het Koninkrijk van God binnen te gaan!", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Hand 28:28": "Laat het u dan bekend zijn dat de zaligheid van God naar de heidenen gezonden is, en die zullen horen.", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Ezech 21:19-32": "U nu, mensenkind, stel u twee wegen voor, waardoor het zwaard van de koning van Babel komt; uit één land zullen zij beide voortkomen; en kies een plaats, kies die aan het hoofd van de weg naar de stad. U zult een weg voorstellen, waardoor het zwaard zal binnenkomen tegen Rabba van de kinderen van Ammon, of tegen Juda, tot de versterkte stad Jeruzalem. Want de koning van Babel zal staan bij de wegsplitsing, aan het hoofd van de twee wegen, om waarzeggerij te gebruiken; hij zal zijn pijlen slijpen; hij zal de terafim raadplegen, hij zal de lever bekijken.", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Ps 49:8": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Jer 39:4-7": "En het gebeurde, toen Zedekia, de koning van Juda, en al de krijgslieden hen zagen, dat zij vluchtten, en 's nachts uit de stad trokken, via de weg van de tuin van de koning, door de poort tussen de twee muren; en hij trok uit via de weg van het vlakke veld. Maar het leger van de Chaldeeën jaagde hen achterna; en zij achterhaalden Zedekia in de vlakke velden van Jericho, en vingen hem, en brachten hem naar boven tot Nebukadrezar, de koning van Babel, naar Ribla, in het land van Hamath; die sprak oordelen tegen hem uit. En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "Ezech 25:14-17": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE. Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "1 Kon 14:2": "En Jerobeam zei tegen zijn vrouw: Sta nu op, en verkleed u, zodat men niet merkt dat u Jerobeams vrouw bent, en ga naar Silo. Zie, daar is de profeet Ahia, die tegen mij gezegd heeft dat ik koning zou zijn over dit volk.", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Ezech 17:21": "Daartoe zullen al zijn vluchtelingen met al zijn troepen door het zwaard vallen, en de overgeblevenen zullen naar alle windrichtingen verstrooid worden; en u zult weten dat Ik, de HEERE, dit gesproken heb.", "Num 16:45": "Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.", "Ef 1:9": "Ons bekendgemaakt hebbend het geheimenis van Zijn wil, naar Zijn welbehagen, dat Hij voorgenomen had in Zichzelf.", "Spr 1:31": "Zo zullen zij eten van de vrucht van hun weg, en zich verzadigen met hun eigen plannen.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Ps 108:13": "Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Hand 5:21": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen.", "2 Sam 22:9": "Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daardoor aangestoken.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Ezech 8:18": "Daarom zal Ik ook handelen in grimmigheid, Mijn oog zal niet ontzien, en Ik zal niet sparen; al roepen zij voor Mijn oren met luide stem, toch zal Ik hen niet horen.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Rom 5:1": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus;", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Luk 13:30": "En zie, er zijn laatsten die de eersten zullen zijn, en er zijn eersten die de laatsten zullen zijn.", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "Jer 37:17": "Stuurde koning Zedekia iemand en liet hem halen; en de koning ondervroeg hem in zijn huis, in het geheim, en zei: Is er een woord van de HEERE? En Jeremia zei: Er is er een; en hij zei: U zult in de hand van de koning van Babel gegeven worden.", "Deut 6:15": "Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.", "Hand 20:21": "Terwijl ik zowel Joden als Grieken heb betuigd de bekering tot God en het geloof in onze Heere Jezus Christus.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Neh 8:5": "En Ezra, de schriftgeleerde, stond op een hoge houten sto
