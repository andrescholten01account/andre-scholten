,"vertalingen":{"SVnu":{"1":"Het woord dat tot Jeremia gebeurde over al de Joden die in Egypteland woonden, die te Migdol woonden, en te Tachpanhes, en te Nof, en in het land Pathros, en hij zei:","2":"Zo zegt de HEERE van de heerscharen, de God van Israël: U hebt al het kwaad gezien dat Ik gebracht heb over Jeruzalem en over alle steden van Juda; en zie, ze zijn een woestheid tot op deze dag, en niemand woont daarin;","3":"Vanwege hun slechtheid, die zij gedaan hebben om Mij te tergen, terwijl zij gingen om te roken *en* andere goden te dienen, die zij niet kenden, zij, u, noch uw vaders.","4":"En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opstaand en zendend, om te zeggen: Doe toch deze gruwelijke zaak niet, die Ik haat.","5":"Maar zij hebben niet gehoord, noch hun oor geneigd, om zich van hun slechtheid te bekeren, zodat zij aan andere goden geen wierook meer zouden branden.","6":"Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat ze tot eenzaamheid *en* tot verwoesting geworden zijn, zoals het is op deze dag.","7":"En nu, zo zegt de HEERE, de God van de heerscharen, de God van Israël: Waarom doet u *zulk* een groot kwaad tegen uw zielen, dat u de man en de vrouw, het kind en de zuigeling uit het midden van Juda uitroeit, zodat u zichzelf geen overblijfsel overlaat?","8":"U tergt Mij door de werken van uw handen, terwijl u wierook brandt voor andere goden in het land van Egypte, waar u gekomen bent om daar als vreemdeling te verblijven; zodat u uzelf uitroeit, en zodat u wordt tot een vloek, en tot een smaad onder alle volken van de aarde?","9":"Bent u de slechtheden van uw vaderen vergeten, en de slechtheden van de koningen van Juda, en de slechtheden van hun vrouwen, en uw slechtheden, en de slechtheden van uw vrouwen, die zij gedaan hebben in het land van Juda en in de straten van Jeruzalem?","10":"Zij zijn tot op deze dag *nog* niet verbrijzeld *van* *hart*, en zij hebben niet gevreesd, noch gewandeld in Mijn wet en in Mijn inzettingen, die Ik voor uw aangezicht en voor het aangezicht van uw vaderen gegeven heb.","11":"Daarom, zo zegt de HEERE van de heerscharen, de God van Israël: Zie, Ik zal Mijn aangezicht tegen u stellen ten kwade, en om heel Juda uit te roeien.","12":"En Ik zal het overblijfsel van Juda wegnemen, die hun aangezichten gesteld hebben om in Egypteland te gaan, om daar als vreemdelingen te verblijven; en zij zullen allen in Egypteland verteerd worden; door het zwaard zullen zij vallen, door de honger zullen zij verteerd worden, van de kleinste tot de grootste toe; door het zwaard en door de honger zullen zij sterven; en zij zullen worden tot een vervloeking, tot een ontzetting en tot een vloek, en tot een smaad.","13":"Want Ik zal straf brengen over hen die in Egypteland wonen, zoals Ik straf gebracht heb over Jeruzalem, door het zwaard, door de honger en door de pest;","14":"Zodat het overblijfsel van Juda, dat in Egypteland gekomen is om daar als vreemdelingen te verblijven, niemand zal hebben die ontkomt of overblijft; namelijk om terug te keren in het land van Juda, waarnaar hun ziel verlangt terug te keren, om daar te wonen; maar zij zullen er niet terugkeren, behalve wie ontkomen zullen.","15":"Toen antwoordden aan Jeremia al de mannen die wisten dat hun vrouwen aan andere goden wierook brandden, en al de vrouwen die daar stonden, een grote menigte, alsook al het volk dat in Egypteland, in Pathros, woonde, en zij zeiden:","16":"Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen.","17":"Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.","18":"Maar vanaf het moment dat wij opgehouden zijn wierook te branden voor de koningin van de hemel, en haar drankoffers te offeren, hebben wij van alles gebrek gehad, en zijn wij door het zwaard en door de honger verteerd.","19":"Ook wanneer wij voor de koningin van de hemel wierook branden en haar drankoffers offeren, maken wij haar gebeelde koeken om haar af te beelden, en offeren wij haar drankoffers, zonder onze mannen?","20":"Toen sprak Jeremia tot al het volk, tot de mannen en tot de vrouwen, en tot al het volk dat hem zo geantwoord had, en hij zei:","21":"Het roken dat u in de steden van Juda en in de straten van Jeruzalem gerookt hebt, u en uw vaderen, uw koningen en uw vorsten, en het volk van het land, heeft de HEERE daar niet aan gedacht, en is dat *niet* in Zijn hart opgekomen?","22":"Zodat de HEERE het niet meer kon verdragen, vanwege de slechtheid van uw handelingen, vanwege de gruwelen die u deed; daarom is uw land geworden tot een woestheid, en tot ontzetting, en tot een vloek, zodat er niemand in woont, zoals het is op deze dag;","23":"Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.","24":"Vervolgens zei Jeremia tot al het volk, en tot al de vrouwen: Hoor het woord van de HEERE, heel Juda, dat in Egypteland is!","25":"Zo spreekt de HEERE van de heerscharen, de God van Israël: *Wat betreft* u en uw vrouwen, zij hebben toch met uw mond gesproken, en u hebt het met uw handen vervuld, en gezegd: Wij zullen onze geloften, die wij beloofd hebben, zeker houden, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren; *welnu*, zij hebben uw geloften volkomen bevestigd en uw geloften volkomen gehouden.","26":"Daarom hoor het woord van de HEERE, heel Juda, dat in Egypteland woont! Zie, Ik zweer bij Mijn grote Naam, zegt de HEERE, dat Mijn Naam met de mond van geen enkele man van Juda in heel Egypteland meer genoemd zal worden, die zegt: *Zo* *waarachtig* *als* de Heere HEERE leeft!","27":"Zie, Ik zal over hen waken ten kwade en niet ten goede; en alle mannen van Juda die in Egypteland zijn, zullen door het zwaard en door de honger verteerd worden, totdat zij ten einde zijn.","28":"Maar wie van het zwaard ontkomen, zullen uit Egypteland terugkeren in het land van Juda, weinig in aantal; en het hele overblijfsel van Juda, dat in Egypteland gekomen is om daar als vreemdelingen te verblijven, zal weten wiens woord stand zal houden, het Mijne of het hunne.","29":"En dit zal u het teken zijn, spreekt de HEERE, dat Ik in deze plaats over u straf zal brengen; opdat u weet dat Mijn woorden zeker over u stand zullen houden, ten kwade;","30":"Zo zegt de HEERE: Zie, Ik zal farao Hofra, de koning van Egypte, geven in de hand van zijn vijanden, en in de hand van hen die zijn ziel zoeken, zoals Ik Zedekia, de koning van Juda, gegeven heb in de hand van Nebukadrezar, de koning van Babel, zijn vijand, die ook zijn ziel zocht."},"SV":{"1":"Het woord, dat tot Jeremia geschiedde aan al de Joden, die in Egypteland woonden, die te Migdol woonden, en te Tachpanhes, en te Nof, en in het land Pathros, zeggende:","2":"Alzo zegt de HEERE der heirscharen, de God Israëls: Gij hebt gezien al het kwaad, dat Ik gebracht heb over Jeruzalem en over alle steden van Juda; en ziet, zij zijn een woestheid te deze dage, en niemand woont daarin;","3":"Vanwege hun boosheid, die zij gedaan hebben, om Mij te tergen, gaande om te roken *en* andere goden te dienen, die zij niet kenden, zij, gij, noch uw vaders.","4":"En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg op zijnde en zendende, om te zeggen: Doet toch deze gruwelijke zaak niet, die Ik haat.","5":"Maar zij hebben niet gehoord, noch hun oor geneigd, om zich van hun boosheid te bekeren, dat zij anderen goden niet roken.","6":"Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat zij tot eenzaamheid *en* tot verwoesting geworden zijn, gelijk het is te dezen dage.","7":"En nu, zo zegt de HEERE, de God der heirscharen, de God Israëls: Waarom doet gij *zulk* een groot kwaad tegen uw zielen, opdat gij u den man en de vrouw, het kind en den zuigeling uit het midden van Juda uitroeit, opdat gij u geen overblijfsel overlaat?","8":"Tergende Mij door de werken uwer handen, rokende anderen goden in het land van Egypte, alwaar gij gekomen zijt, om daar als vreemdeling te verkeren; opdat gij uzelven uitroeit, en opdat gij wordt tot een vloek, en tot een smaadheid onder alle volken der aarde?","9":"Hebt gij vergeten de boosheden uwer vaderen, en de boosheden der koningen van Juda, en de boosheden hunner vrouwen, en uw boosheden, en de boosheden uwer vrouwen, die zij gedaan hebben in het land van Juda en in de straten van Jeruzalem?","10":"Zij zijn tot op dezen dag *nog* niet verbrijzeld *van* *hart*, en zij hebben niet gevreesd, noch gewandeld in Mijn wet en in Mijn inzettingen, die Ik voor ulieder aangezicht en voor het aangezicht uwer vaderen gegeven heb.","11":"Daarom, zo zegt de HEERE der heirscharen, de God Israëls: Ziet, Ik zal Mijn aangezicht tegen ulieden stellen ten kwade, en om gans Juda uit te roeien.","12":"En Ik zal het overblijfsel van Juda wegnemen, die hun aangezichten gesteld hebben, om in Egypteland te gaan, om aldaar als vreemdelingen te verkeren; en zij zullen allen in Egypteland verteerd worden; door het zwaard zullen zij vallen, door den honger zullen zij verteerd worden, van den kleinste tot den grootste toe; door het zwaard en door den honger zullen zij sterven; en zij zullen worden tot een vervloeking, tot een ontzetting en tot een vloek, en tot een smaadheid.","13":"Want Ik zal bezoeking doen over degenen, die in Egypteland wonen, gelijk als Ik bezoeking gedaan heb over Jeruzalem, door het zwaard, door den honger en door de pestilentie;","14":"Zodat het overblijfsel van Juda, die in Egypteland gekomen zijn, om aldaar als vreemdelingen te verkeren, geen zal hebben, die ontkome, of overblijve; te weten om weder te keren in het land van Juda, waarnaar hun ziel verlangt weder te keren, om aldaar te wonen; maar zij zullen er niet wederkeren, behalve die ontkomen zullen.","15":"Toen antwoordden aan Jeremia al de mannen, die wisten, dat hun vrouwen anderen goden rookten, en al de vrouwen, die daar stonden, zijnde een grote hoop, mitsgaders al het volk, die in Egypteland, in Pathros, woonde, zeggende:","16":"Aangaande het woord, dat gij tot ons in des HEEREN Naam gesproken hebt, wij zullen naar u niet horen.","17":"Maar wij zullen ganselijk doen al hetgeen uit onzen mond is uitgegaan, rokende aan Melecheth des hemels, en haar drankofferen offerende, gelijk als wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.","18":"Maar van toen af, dat wij opgehouden hebben aan Melecheth des hemels te roken, en haar drankofferen te offeren, hebben wij van alles gebrek gehad, en zijn door het zwaard en door den honger verteerd.","19":"Ook wanneer wij aan Melecheth des hemels roken en haar drankofferen offeren, maken wij haar gebeelde koeken, om haar af te beelden, en offeren wij haar drankofferen, zonder onze mannen?","20":"Toen sprak Jeremia tot al het volk, tot de mannen en tot de vrouwen, en tot al het volk, die hem zulks geantwoord hadden, zeggende:","21":"Het roken, dat gijlieden in de steden van Juda en in de straten van Jeruzalem gerookt hebt, gij en uw vaderen, uw koningen en uw vorsten, en het volk des lands, heeft de HEERE daaraan niet gedacht, en is het *niet* in Zijn hart opgekomen?","22":"Zodat het de HEERE niet meer kon verdragen, vanwege de boosheid uwer handelingen, vanwege de gruwelen, die gij deedt; daarom is uw land geworden tot een woestheid, en tot ontzetting, en tot een vloek, dat er niemand in woont, gelijk het is te dezen dage;","23":"Vanwege dat gij gerookt hebt, en dat gij tegen den HEERE gezondigd hebt, en des HEEREN stem niet gehoorzaam zijt geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad wedervaren, gelijk het is te dezen dage.","24":"Voorts zeide Jeremia tot al het volk, en tot al de vrouwen: Hoort des HEEREN woord, gij gans Juda, die in Egypteland zijt!","25":"Zo spreekt de HEERE der heirscharen, de God Israëls, zeggende: *Aangaande* u en uw vrouwen, zij hebben toch met uw mond gesproken, en gij hebt het met uw handen vervuld, zeggende: Wij zullen onze geloften, die wij beloofd hebben, ganselijk houden, rokende aan Melecheth des hemels, en haar drankofferen offerende; *nu*, zij hebben uw geloften volkomenlijk bevestigd en uw geloften volkomenlijk gehouden.","26":"Daarom hoort des HEEREN woord, gij gans Juda, die in Egypteland woont! Ziet, Ik zweer bij Mijn groten Naam, zegt de HEERE, zo Mijn Naam met den mond van enig man van Juda in gans Egypteland meer zal genoemd worden, die zegge: *Zo* *waarachtig* *als* de Heere HEERE leeft!","27":"Ziet, Ik zal over hen waken ten kwade en niet ten goede; en alle mannen van Juda, die in Egypteland zijn, zullen door het zwaard en door den honger verteerd worden, totdat zij ten einde zijn.","28":"Maar die van het zwaard ontkomen, zullen uit Egypteland wederkeren in het land van Juda, weinig in getal; en het ganse overblijfsel van Juda, die in Egypteland gekomen zijn, om aldaar als vreemdelingen te verkeren, zullen weten, wiens woord bestaan zal, het Mijn of het hunne.","29":"En dit zal ulieden het teken zijn, spreekt de HEERE, dat Ik in deze plaats over u bezoeking zal doen; opdat gij weet, dat Mijn woorden zekerlijk over u bestaan zullen ten kwade;","30":"Alzo zegt de HEERE: Ziet, Ik zal Farao Hofra, den koning van Egypte, geven in de hand zijner vijanden, en in de hand dergenen, die zijn ziel zoeken, gelijk als Ik Zedekia, den koning van Juda, gegeven heb in de hand van Nebukadrezar, den koning van Babel, zijn vijand, en die zijn ziel zocht."},"KJV":{"1":"The word that came to Jeremiah concerning all the Jews which dwell in the land of Egypt, which dwell at Migdol, and at Tahpanhes, and at Noph, and in the country of Pathros, saying,","2":"Thus saith the LORD of hosts, the God of Israel; Ye have seen all the evil that I have brought upon Jerusalem, and upon all the cities of Judah; and, behold, this day they *are* a desolation, and no man dwelleth","3":"Because of their wickedness which they have committed to provoke me to anger, in that they went to burn incense, *and* to serve other gods, whom they knew not, *neither* they, ye, nor your fathers.","4":"Howbeit I sent unto you all my servants the prophets, rising early and sending *them*, saying, Oh, do not this abominable thing that I hate.","5":"But they hearkened not, nor inclined their ear to turn from their wickedness, to burn no incense unto other gods.","6":"Wherefore my fury and mine anger was poured forth, and was kindled in the cities of Judah and in the streets of Jerusalem; and they are wasted *and* desolate, as at this day.","7":"Therefore now thus saith the LORD, the God of hosts, the God of Israel; Wherefore commit ye *this* great evil against your souls, to cut off from you man and woman, child and suckling, out of Judah, to leave you none to remain;","8":"In that ye provoke me unto wrath with the works of your hands, burning incense unto other gods in the land of Egypt, whither ye be gone to dwell, that ye might cut yourselves off, and that ye might be a curse and a reproach among all the nations of the earth?","9":"Have ye forgotten the wickedness of your fathers, and the wickedness of the kings of Judah, and the wickedness of their wives, and your own wickedness, and the wickedness of your wives, which they have committed in the land of Judah, and in the streets of Jerusalem?","10":"They are not humbled *even* unto this day, neither have they feared, nor walked in my law, nor in my statutes, that I set before you and before your fathers.","11":"Therefore thus saith the LORD of hosts, the God of Israel; Behold, I will set my face against you for evil, and to cut off all Judah.","12":"And I will take the remnant of Judah, that have set their faces to go into the land of Egypt to sojourn there, and they shall all be consumed, *and* fall in the land of Egypt; they shall *even* be consumed by the sword *and* by the famine: they shall die, from the least even unto the greatest, by the sword and by the famine: and they shall be an execration, *and* an astonishment, and a curse, and a reproach.","13":"For I will punish them that dwell in the land of Egypt, as I have punished Jerusalem, by the sword, by the famine, and by the pestilence:","14":"So that none of the remnant of Judah, which are gone into the land of Egypt to sojourn there, shall escape or remain, that they should return into the land of Judah, to the which they have a desire to return to dwell there: for none shall return but such as shall escape.","15":"Then all the men which knew that their wives had burned incense unto other gods, and all the women that stood by, a great multitude, even all the people that dwelt in the land of Egypt, in Pathros, answered Jeremiah, saying,","16":"*As for* the word that thou hast spoken unto us in the name of the LORD, we will not hearken","17":"But we will certainly do whatsoever thing goeth forth out of our own mouth, to burn incense unto the queen of heaven, and to pour out drink offerings unto her, as we have done, we, and our fathers, our kings, and our princes, in the cities of Judah, and in the streets of Jerusalem: for *then* had we plenty of victuals, and were well, and saw no evil.","18":"But since we left off to burn incense to the queen of heaven, and to pour out drink offerings unto her, we have wanted all *things*, and have been consumed by the sword and by the famine.","19":"And when we burned incense to the queen of heaven, and poured out drink offerings unto her, did we make her cakes to worship her, and pour out drink offerings unto her, without our men?","20":"Then Jeremiah said unto all the people, to the men, and to the women, and to all the people which had given him *that* answer, saying,","21":"The incense that ye burned in the cities of Judah, and in the streets of Jerusalem, ye, and your fathers, your kings, and your princes, and the people of the land, did not the LORD remember them, and came it *not* into his mind?","22":"So that the LORD could no longer bear, because of the evil of your doings, *and* because of the abominations which ye have committed; therefore is your land a desolation, and an astonishment, and a curse, without an inhabitant, as at this day.","23":"Because ye have burned incense, and because ye have sinned against the LORD, and have not obeyed the voice of the LORD, nor walked in his law, nor in his statutes, nor in his testimonies; therefore this evil is happened unto you, as at this day.","24":"Moreover Jeremiah said unto all the people, and to all the women, Hear the word of the LORD, all Judah that *are* in the land of Egypt:","25":"Thus saith the LORD of hosts, the God of Israel, saying; Ye and your wives have both spoken with your mouths, and fulfilled with your hand, saying, We will surely perform our vows that we have vowed, to burn incense to the queen of heaven, and to pour out drink offerings unto her: ye will surely accomplish your vows, and surely perform your vows.","26":"Therefore hear ye the word of the LORD, all Judah that dwell in the land of Egypt; Behold, I have sworn by my great name, saith the LORD, that my name shall no more be named in the mouth of any man of Judah in all the land of Egypt, saying, The Lord GOD liveth.","27":"Behold, I will watch over them for evil, and not for good: and all the men of Judah that *are* in the land of Egypt shall 624\">Pathros,</span> saying,","2":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Ye have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> all the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that I have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> upon <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and upon all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> and, behold, this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they are a <span class=\"wl wl-kjv\" data-code=\"H2723\">desolation,</span> and no man dwelleth","3":"<span class=\"wl wl-kjv\" data-code=\"H6440\">Because</span> of their <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> which they have <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> to provoke me to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger,</span> in that they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense,</span> and to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> whom they <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not, neither they, ye, nor your fathers.","4":"Howbeit I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto you all my <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> rising <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sending</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Oh, <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> not this <span class=\"wl wl-kjv\" data-code=\"H8441\">abominable</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> that I hate.","5":"But they <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not, nor <span class=\"wl wl-kjv\" data-code=\"H5186\">inclined</span> their <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from their <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness,</span> to burn no <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> gods.","6":"Wherefore my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> and mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was poured <span class=\"wl wl-kjv\" data-code=\"H5413\">forth,</span> and was <span class=\"wl wl-kjv\" data-code=\"H1197\">kindled</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> and they are <span class=\"wl wl-kjv\" data-code=\"H2723\">wasted</span> and <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate,</span> as at this day.","7":"Therefore now thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Wherefore <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> ye this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> against your <span class=\"wl wl-kjv\" data-code=\"H5315\">souls,</span> to cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from you <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> <span class=\"wl wl-kjv\" data-code=\"H5768\">child</span> and <span class=\"wl wl-kjv\" data-code=\"H3243\">suckling,</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> to <span class=\"wl wl-kjv\" data-code=\"H3498\">leave</span> you none to remain;","8":"In that ye provoke me unto <span class=\"wl wl-kjv\" data-code=\"H3707\">wrath</span> with the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> of your <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> burning <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> whither ye be <span class=\"wl wl-kjv\" data-code=\"H935\">gone</span> to <span class=\"wl wl-kjv\" data-code=\"H1481\">dwell,</span> that ye might cut yourselves <span class=\"wl wl-kjv\" data-code=\"H3772\">off,</span> and that ye might be a <span class=\"wl wl-kjv\" data-code=\"H7045\">curse</span> and a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> among all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> of the earth?","9":"Have ye <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of their <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and your own <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of your <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> which they have <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> of Jerusalem?","10":"They are not <span class=\"wl wl-kjv\" data-code=\"H1792\">humbled</span> even unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> neither have they <span class=\"wl wl-kjv\" data-code=\"H3372\">feared,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in my <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> nor in my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> that I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> your fathers.","11":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> against you for <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and to cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> all Judah.","12":"And I will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> that have <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> to <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn</span> there, and they shall all be <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> they shall even be <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> and by the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> from the <span class=\"wl wl-kjv\" data-code=\"H6996\">least</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H1419\">greatest,</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> and by the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine:</span> and they shall be an <span class=\"wl wl-kjv\" data-code=\"H423\">execration,</span> and an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7045\">curse,</span> and a reproach.","13":"For I will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> them that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> as I have <span class=\"wl wl-kjv\" data-code=\"H6485\">punished</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> by the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> and by the pestilence:","14":"So that none of the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> which are <span class=\"wl wl-kjv\" data-code=\"H935\">gone</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> to <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn</span> there, shall <span class=\"wl wl-kjv\" data-code=\"H6412\">escape</span> or <span class=\"wl wl-kjv\" data-code=\"H8300\">remain,</span> that they should <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> to the which they <span class=\"wl wl-kjv\" data-code=\"H5375\">have</span> a <span class=\"wl wl-kjv\" data-code=\"H5315\">desire</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> there: for none shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> but such as shall escape.","15":"Then all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> which <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> that their <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> had burned <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> that stood <span class=\"wl wl-kjv\" data-code=\"H5975\">by,</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6951\">multitude,</span> even all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> in <span class=\"wl wl-kjv\" data-code=\"H6624\">Pathros,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah,</span> saying,","16":"As for the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto us in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> we will not hearken","17":"But we will <span class=\"wl wl-kjv\" data-code=\"H6213\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> whatsoever <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of our own <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4446\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and to pour <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings</span> unto her, as we have <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> we, and our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> our <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> and our <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> for then had we <span class=\"wl wl-kjv\" data-code=\"H7646\">plenty</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">victuals,</span> and were <span class=\"wl wl-kjv\" data-code=\"H2896\">well,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> no evil.","18":"But since we left <span class=\"wl wl-kjv\" data-code=\"H2308\">off</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> to the <span class=\"wl wl-kjv\" data-code=\"H4446\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and to pour <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings</span> unto her, we have <span class=\"wl wl-kjv\" data-code=\"H2637\">wanted</span> all things, and have been <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> and by the famine.","19":"And when we burned <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> to the <span class=\"wl wl-kjv\" data-code=\"H4446\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and poured <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings</span> unto her, did we <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> her <span class=\"wl wl-kjv\" data-code=\"H3561\">cakes</span> to <span class=\"wl wl-kjv\" data-code=\"H6087\">worship</span> her, and pour <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H1107\">without</span> our men?","20":"Then <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> to the <span class=\"wl wl-kjv\" data-code=\"H1397\">men,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> which had given him that <span class=\"wl wl-kjv\" data-code=\"H1697\">answer,</span> saying,","21":"The <span class=\"wl wl-kjv\" data-code=\"H7002\">incense</span> that ye <span class=\"wl wl-kjv\" data-code=\"H6999\">burned</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> ye, and your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> your <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> and your <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> did not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5927\">came</span> it not into his mind?","22":"So that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> no longer <span class=\"wl wl-kjv\" data-code=\"H5375\">bear,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H7455\">evil</span> of your <span class=\"wl wl-kjv\" data-code=\"H4611\">doings,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> which ye have <span class=\"wl wl-kjv\" data-code=\"H6213\">committed;</span> therefore is your <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> a <span class=\"wl wl-kjv\" data-code=\"H2723\">desolation,</span> and an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7045\">curse,</span> without an <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant,</span> as at this day.","23":"<span class=\"wl wl-kjv\" data-code=\"H6440\">Because</span> ye have burned <span class=\"wl wl-kjv\" data-code=\"H6999\">incense,</span> and because ye have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and have not <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in his <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> nor in his <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> nor in his <span class=\"wl wl-kjv\" data-code=\"H5715\">testimonies;</span> therefore this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> is <span class=\"wl wl-kjv\" data-code=\"H7122\">happened</span> unto you, as at this day.","24":"Moreover <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> that are in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt:","25":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying;</span> Ye and your <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> have both <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> with your <span class=\"wl wl-kjv\" data-code=\"H6310\">mouths,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled</span> with your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> We will <span class=\"wl wl-kjv\" data-code=\"H6213\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">perform</span> our <span class=\"wl wl-kjv\" data-code=\"H5088\">vows</span> that we have <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed,</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> to the <span class=\"wl wl-kjv\" data-code=\"H4446\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and to pour <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings</span> unto her: ye will <span class=\"wl wl-kjv\" data-code=\"H6965\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">accomplish</span> your <span class=\"wl wl-kjv\" data-code=\"H5088\">vows,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">perform</span> your vows.","26":"Therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> ye the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> Behold, I have <span class= function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const popupCache = {};

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {

  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
