"Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Het woord dat tot Jeremia gebeurde over al de Joden die in Egypteland woonden, die te Migdol woonden, en te Tachpanhes, en te Nof, en in het land Pathros, en hij zei:", "2": "Zo zegt de HEERE van de heerscharen, de God van Israël: U hebt al het kwaad gezien dat Ik gebracht heb over Jeruzalem en over alle steden van Juda; en zie, ze zijn een woestheid tot op deze dag, en niemand woont daarin;", "3": "Vanwege hun slechtheid, die zij gedaan hebben om Mij te tergen, terwijl zij gingen om te roken *en* andere goden te dienen, die zij niet kenden, zij, u, noch uw vaders.", "4": "En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opstaand en zendend, om te zeggen: Doe toch deze gruwelijke zaak niet, die Ik haat.", "5": "Maar zij hebben niet gehoord, noch hun oor geneigd, om zich van hun slechtheid te bekeren, zodat zij aan andere goden geen wierook meer zouden branden.", "6": "Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat ze tot eenzaamheid *en* tot verwoesting geworden zijn, zoals het is op deze dag.", "7": "En nu, zo zegt de HEERE, de God van de heerscharen, de God van Israël: Waarom doet u *zulk* een groot kwaad tegen uw zielen, dat u de man en de vrouw, het kind en de zuigeling uit het midden van Juda uitroeit, zodat u zichzelf geen overblijfsel overlaat?", "8": "U tergt Mij door de werken van uw handen, terwijl u wierook brandt voor andere goden in het land van Egypte, waar u gekomen bent om daar als vreemdeling te verblijven; zodat u uzelf uitroeit, en zodat u wordt tot een vloek, en tot een smaad onder alle volken van de aarde?", "9": "Bent u de slechtheden van uw vaderen vergeten, en de slechtheden van de koningen van Juda, en de slechtheden van hun vrouwen, en uw slechtheden, en de slechtheden van uw vrouwen, die zij gedaan hebben in het land van Juda en in de straten van Jeruzalem?", "10": "Zij zijn tot op deze dag *nog* niet verbrijzeld *van* *hart*, en zij hebben niet gevreesd, noch gewandeld in Mijn wet en in Mijn inzettingen, die Ik voor uw aangezicht en voor het aangezicht van uw vaderen gegeven heb.", "11": "Daarom, zo zegt de HEERE van de heerscharen, de God van Israël: Zie, Ik zal Mijn aangezicht tegen u stellen ten kwade, en om heel Juda uit te roeien.", "12": "En Ik zal het overblijfsel van Juda wegnemen, die hun aangezichten gesteld hebben om in Egypteland te gaan, om daar als vreemdelingen te verblijven; en zij zullen allen in Egypteland verteerd worden; door het zwaard zullen zij vallen, door de honger zullen zij verteerd worden, van de kleinste tot de grootste toe; door het zwaard en door de honger zullen zij sterven; en zij zullen worden tot een vervloeking, tot een ontzetting en tot een vloek, en tot een smaad.", "13": "Want Ik zal straf brengen over hen die in Egypteland wonen, zoals Ik straf gebracht heb over Jeruzalem, door het zwaard, door de honger en door de pest;", "14": "Zodat het overblijfsel van Juda, dat in Egypteland gekomen is om daar als vreemdelingen te verblijven, niemand zal hebben die ontkomt of overblijft; namelijk om terug te keren in het land van Juda, waarnaar hun ziel verlangt terug te keren, om daar te wonen; maar zij zullen er niet terugkeren, behalve wie ontkomen zullen.", "15": "Toen antwoordden aan Jeremia al de mannen die wisten dat hun vrouwen aan andere goden wierook brandden, en al de vrouwen die daar stonden, een grote menigte, alsook al het volk dat in Egypteland, in Pathros, woonde, en zij zeiden:", "16": "Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen.", "17": "Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.", "18": "Maar vanaf het moment dat wij opgehouden zijn wierook te branden voor de koningin van de hemel, en haar drankoffers te offeren, hebben wij van alles gebrek gehad, en zijn wij door het zwaard en door de honger verteerd.", "19": "Ook wanneer wij voor de koningin van de hemel wierook branden en haar drankoffers offeren, maken wij haar gebeelde koeken om haar af te beelden, en offeren wij haar drankoffers, zonder onze mannen?", "20": "Toen sprak Jeremia tot al het volk, tot de mannen en tot de vrouwen, en tot al het volk dat hem zo geantwoord had, en hij zei:", "21": "Het roken dat u in de steden van Juda en in de straten van Jeruzalem gerookt hebt, u en uw vaderen, uw koningen en uw vorsten, en het volk van het land, heeft de HEERE daar niet aan gedacht, en is dat *niet* in Zijn hart opgekomen?", "22": "Zodat de HEERE het niet meer kon verdragen, vanwege de slechtheid van uw handelingen, vanwege de gruwelen die u deed; daarom is uw land geworden tot een woestheid, en tot ontzetting, en tot een vloek, zodat er niemand in woont, zoals het is op deze dag;", "23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "24": "Vervolgens zei Jeremia tot al het volk, en tot al de vrouwen: Hoor het woord van de HEERE, heel Juda, dat in Egypteland is!", "25": "Zo spreekt de HEERE van de heerscharen, de God van Israël: *Wat betreft* u en uw vrouwen, zij hebben toch met uw mond gesproken, en u hebt het met uw handen vervuld, en gezegd: Wij zullen onze geloften, die wij beloofd hebben, zeker houden, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren; *welnu*, zij hebben uw geloften volkomen bevestigd en uw geloften volkomen gehouden.", "26": "Daarom hoor het woord van de HEERE, heel Juda, dat in Egypteland woont! Zie, Ik zweer bij Mijn grote Naam, zegt de HEERE, dat Mijn Naam met de mond van geen enkele man van Juda in heel Egypteland meer genoemd zal worden, die zegt: *Zo* *waarachtig* *als* de Heere HEERE leeft!", "27": "Zie, Ik zal over hen waken ten kwade en niet ten goede; en alle mannen van Juda die in Egypteland zijn, zullen door het zwaard en door de honger verteerd worden, totdat zij ten einde zijn.", "28": "Maar wie van het zwaard ontkomen, zullen uit Egypteland terugkeren in het land van Juda, weinig in aantal; en het hele overblijfsel van Juda, dat in Egypteland gekomen is om daar als vreemdelingen te verblijven, zal weten wiens woord stand zal houden, het Mijne of het hunne.", "29": "En dit zal u het teken zijn, spreekt de HEERE, dat Ik in deze plaats over u straf zal brengen; opdat u weet dat Mijn woorden zeker over u stand zullen houden, ten kwade;", "30": "Zo zegt de HEERE: Zie, Ik zal farao Hofra, de koning van Egypte, geven in de hand van zijn vijanden, en in de hand van hen die zijn ziel zoeken, zoals Ik Zedekia, de koning van Juda, gegeven heb in de hand van Nebukadrezar, de koning van Babel, zijn vijand, die ook zijn ziel zocht."}, "SV": {"1": "Het woord, dat tot Jeremia geschiedde aan al de Joden, die in Egypteland woonden, die te Migdol woonden, en te Tachpanhes, en te Nof, en in het land Pathros, zeggende:", "2": "Alzo zegt de HEERE der heirscharen, de God Israëls: Gij hebt gezien al het kwaad, dat Ik gebracht heb over Jeruzalem en over alle steden van Juda; en ziet, zij zijn een woestheid te deze dage, en niemand woont daarin;", "3": "Vanwege hun boosheid, die zij gedaan hebben, om Mij te tergen, gaande om te roken *en* andere goden te dienen, die zij niet kenden, zij, gij, noch uw vaders.", "4": "En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg op zijnde en zendende, om te zeggen: Doet toch deze gruwelijke zaak niet, die Ik haat.", "5": "Maar zij hebben niet gehoord, noch hun oor geneigd, om zich van hun boosheid te bekeren, dat zij anderen goden niet roken.", "6": "Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat zij tot eenzaamheid *en* tot verwoesting geworden zijn, gelijk het is te dezen dage.", "7": "En nu, zo zegt de HEERE, de God der heirscharen, de God Israëls: Waarom doet gij *zulk* een groot kwaad tegen uw zielen, opdat gij u den man en de vrouw, het kind en den zuigeling uit het midden van Juda uitroeit, opdat gij u geen overblijfsel overlaat?", "8": "Tergende Mij door de werken uwer handen, rokende anderen goden in het land van Egypte, alwaar gij gekomen zijt, om daar als vreemdeling te verkeren; opdat gij uzelven uitroeit, en opdat gij wordt tot een vloek, en tot een smaadheid onder alle volken der aarde?", "9": "Hebt gij vergeten de boosheden uwer vaderen, en de boosheden der koningen van Juda, en de boosheden hunner vrouwen, en uw boosheden, en de boosheden uwer vrouwen, die zij gedaan hebben in het land van Juda en in de straten van Jeruzalem?", "10": "Zij zijn tot op dezen dag *nog* niet verbrijzeld *van* *hart*, en zij hebben niet gevreesd, noch gewandeld in Mijn wet en in Mijn inzettingen, die Ik voor ulieder aangezicht en voor het aangezicht uwer vaderen gegeven heb.", "11": "Daarom, zo zegt de HEERE der heirscharen, de God Israëls: Ziet, Ik zal Mijn aangezicht tegen ulieden stellen ten kwade, en om gans Juda uit te roeien.", "12": "En Ik zal het overblijfsel van Juda wegnemen, die hun aangezichten gesteld hebben, om in Egypteland te gaan, om aldaar als vreemdelingen te verkeren; en zij zullen allen in Egypteland verteerd worden; door het zwaard zullen zij vallen, door den honger zullen zij verteerd worden, van den kleinste tot den grootste toe; door het zwaard en door den honger zullen zij sterven; en zij zullen worden tot een vervloeking, tot een ontzetting en tot een vloek, en tot een smaadheid.", "13": "Want Ik zal bezoeking doen over degenen, die in Egypteland wonen, gelijk als Ik bezoeking gedaan heb over Jeruzalem, door het zwaard, door den honger en door de pestilentie;", "14": "Zodat het overblijfsel van Juda, die in Egypteland gekomen zijn, om aldaar als vreemdelingen te verkeren, geen zal hebben, die ontkome, of overblijve; te weten om weder te keren in het land van Juda, waarnaar hun ziel verlangt weder te keren, om aldaar te wonen; maar zij zullen er niet wederkeren, behalve die ontkomen zullen.", "15": "Toen antwoordden aan Jeremia al de mannen, die wisten, dat hun vrouwen anderen goden rookten, en al de vrouwen, die daar stonden, zijnde een grote hoop, mitsgaders al het volk, die in Egypteland, in Pathros, woonde, zeggende:", "16": "Aangaande het woord, dat gij tot ons in des HEEREN Naam gesproken hebt, wij zullen naar u niet horen.", "17": "Maar wij zullen ganselijk doen al hetgeen uit onzen mond is uitgegaan, rokende aan Melecheth des hemels, en haar drankofferen offerende, gelijk als wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.", "18": "Maar van toen af, dat wij opgehouden hebben aan Melecheth des hemels te roken, en haar drankofferen te offeren, hebben wij van alles gebrek gehad, en zijn door het zwaard en door den honger verteerd.", "19": "Ook wanneer wij aan Melecheth des hemels roken en haar drankofferen offeren, maken wij haar gebeelde koeken, om haar af te beelden, en offeren wij haar drankofferen, zonder onze mannen?", "20": "Toen sprak Jeremia tot al het volk, tot de mannen en tot de vrouwen, en tot al het volk, die hem zulks geantwoord hadden, zeggende:", "21": "Het roken, dat gijlieden in de steden van Juda en in de straten van Jeruzalem gerookt hebt, gij en uw vaderen, uw koningen en uw vorsten, en het volk des lands, heeft de HEERE daaraan niet gedacht, en is het *niet* in Zijn hart opgekomen?", "22": "Zodat het de HEERE niet meer kon verdragen, vanwege de boosheid uwer handelingen, vanwege de gruwelen, die gij deedt; daarom is uw land geworden tot een woestheid, en tot ontzetting, en tot een vloek, dat er niemand in woont, gelijk het is te dezen dage;", "23": "Vanwege dat gij gerookt hebt, en dat gij tegen den HEERE gezondigd hebt, en des HEEREN stem niet gehoorzaam zijt geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad wedervaren, gelijk het is te dezen dage.", "24": "Voorts zeide Jeremia tot al het volk, en tot al de vrouwen: Hoort des HEEREN woord, gij gans Juda, die in Egypteland zijt!", "25": "Zo spreekt de HEERE der heirscharen, de God Israëls, zeggende: *Aangaande* u en uw vrouwen, zij hebben toch met uw mond gesproken, en gij hebt het met uw handen vervuld, zeggende: Wij zullen onze geloften, die wij beloofd hebben, ganselijk houden, rokende aan Melecheth des hemels, en haar drankofferen offerende; *nu*, zij hebben uw geloften volkomenlijk bevestigd en uw geloften volkomenlijk gehouden.", "26": "Daarom hoort des HEEREN woord, gij gans Juda, die in Egypteland woont! Ziet, Ik zweer bij Mijn groten Naam, zegt de HEERE, zo Mijn Naam met den mond van enig man van Juda in gans Egypteland meer zal genoemd worden, die zegge: *Zo* *waarachtig* *als* de Heere HEERE leeft!", "27": "Ziet, Ik zal over hen waken ten kwade en niet ten goede; en alle mannen van Juda, die in Egypteland zijn, zullen door het zwaard en door den honger verteerd worden, totdat zij ten einde zijn.", "28": "Maar die van het zwaard ontkomen, zullen uit Egypteland wederkeren in het land van Juda, weinig in getal; en het ganse overblijfsel van Juda, die in Egypteland gekomen zijn, om aldaar als vreemdelingen te verkeren, zullen weten, wiens woord bestaan zal, het Mijn of het hunne.", "29": "En dit zal ulieden het teken zijn, spreekt de HEERE, dat Ik in deze plaats over u bezoeking zal doen; opdat gij weet, dat Mijn woorden zekerlijk over u bestaan zullen ten kwade;", "30": "Alzo zegt de HEERE: Ziet, Ik zal Farao Hofra, den koning van Egypte, geven in de hand zijner vijanden, en in de hand dergenen, die zijn ziel zoeken, gelijk als Ik Zedekia, den koning van Juda, gegeven heb in de hand van Nebukadrezar, den koning van Babel, zijn vijand, en die zijn ziel zocht."}, "KJV": {"1": "The word that came to Jeremiah concerning all the Jews which dwell in the land of Egypt, which dwell at Migdol, and at Tahpanhes, and at Noph, and in the country of Pathros, saying,", "2": "Thus saith the LORD of hosts, the God of Israel; Ye have seen all the evil that I have brought upon Jerusalem, and upon all the cities of Judah; and, behold, this day they *are* a desolation, and no man dwelleth", "3": "Because of their wickedness which they have committed to provoke me to anger, in that they went to burn incense, *and* to serve other gods, whom they knew not, *neither* they, ye, nor your fathers.", "4": "Howbeit I sent unto you all my servants the prophets, rising early and sending *them*, saying, Oh, do not this abominable thing that I hate.", "5": "But they hearkened not, nor inclined their ear to turn from their wickedness, to burn no incense unto other gods.", "6": "Wherefore my fury and mine anger was poured forth, and was kindled in the cities of Judah and in the streets of Jerusalem; and they are wasted *and* desolate, as at this day.", "7": "Therefore now thus saith the LORD, the God of hosts, the God of Israel; Wherefore commit ye *this* great evil against your souls, to cut off from you man and woman, child and suckling, out of Judah, to leave you none to remain;", "8": "In that ye provoke me unto wrath with the works of your hands, burning incense unto other gods in the land of Egypt, whither ye be gone to dwell, that ye might cut yourselves off, and that ye might be a curse and a reproach among all the nations of the earth?", "9": "Have ye forgotten the wickedness of your fathers, and the wickedness of the kings of Judah, and the wickedness of their wives, and your own wickedness, and the wickedness of your wives, which they have committed in the land of Judah, and in the streets of Jerusalem?", "10": "They are not humbled *even* unto this day, neither have they feared, nor walked in my law, nor in my statutes, that I set before you and before your fathers.", "11": "Therefore thus saith the LORD of hosts, the God of Israel; Behold, I will set my face against you for evil, and to cut off all Judah.", "12": "And I will take the remnant of Judah, that have set their faces to go into the land of Egypt to sojourn there, and they shall all be consumed, *and* fall in the land of Egypt; they shall *even* be consumed by the sword *and* by the famine: they shall die, from the least even unto the greatest, by the sword and by the famine: and they shall be an execration, *and* an astonishment, and a curse, and a reproach.", "13": "For I will punish them that dwell in the land of Egypt, as I have punished Jerusalem, by the sword, by the famine, and by the pestilence:", "14": "So that none of the remnant of Judah, which are gone into the land of Egypt to sojourn there, shall escape or remain, that they should return into the land of Judah, to the which they have a desire to return to dwell there: for none shall return but such as shall escape.", "15": "Then all the men which knew that their wives had burned incense unto other gods, and all the women that stood by, a great multitude, even all the people that dwelt in the land of Egypt, in Pathros, answered Jeremiah, saying,", "16": "*As for* the word that thou hast spoken unto us in the name of the LORD, we will not hearken", "17": "But we will certainly do whatsoever thing goeth forth out of our own mouth, to burn incense unto the queen of heaven, and to pour out drink offerings unto her, as we have done, we, and our fathers, our kings, and our princes, in the cities of Judah, and in the streets of Jerusalem: for *then* had we plenty of victuals, and were well, and saw no evil.", "18": "But since we left off to burn incense to the queen of heaven, and to pour out drink offerings unto her, we have wanted all *things*, and have been consumed by the sword and by the famine.", "19": "And when we burned incense to the queen of heaven, and poured out drink offerings unto her, did we make her cakes to worship her, and pour out drink offerings unto her, without our men?", "20": "Then Jeremiah said unto all the people, to the men, and to the women, and to all the people which had given him *that* answer, saying,", "21": "The incense that ye burned in the cities of Judah, and in the streets of Jerusalem, ye, and your fathers, your kings, and your princes, and the people of the land, did not the LORD remember them, and came it *not* into his mind?", "22": "So that the LORD could no longer bear, because of the evil of your doings, *and* because of the abominations which ye have committed; therefore is your land a desolation, and an astonishment, and a curse, without an inhabitant, as at this day.", "23": "Because ye have burned incense, and because ye have sinned against the LORD, and have not obeyed the voice of the LORD, nor walked in his law, nor in his statutes, nor in his testimonies; therefore this evil is happened unto you, as at this day.", "24": "Moreover Jeremiah said unto all the people, and to all the women, Hear the word of the LORD, all Judah that *are* in the land of Egypt:", "25": "Thus saith the LORD of hosts, the God of Israel, saying; Ye and your wives have both spoken with your mouths, and fulfilled with your hand, saying, We will surely perform our vows that we have vowed, to burn incense to the queen of heaven, and to pour out drink offerings unto her: ye will surely accomplish your vows, and surely perform your vows.", "26": "Therefore hear ye the word of the LORD, all Judah that dwell in the land of Egypt; Behold, I have sworn by my great name, saith the LORD, that my name shall no more be named in the mouth of any man of Judah in all the land of Egypt, saying, The Lord GOD liveth.", "27": "Behold, I will watch over them for evil, and not for good: and all the men of Judah that *are* in the land of Egypt shall be consumed by the sword and by the famine, until there be an end", "28": "Yet a small number that escape the sword shall return out of the land of Egypt into the land of Judah, and all the remnant of Judah, that are gone into the land of Egypt to sojourn there, shall know whose words shall stand,", "29": "And this *shall be* a sign unto you, saith the LORD, that I will punish you in this place, that ye may know that my words shall surely stand against you for evil:", "30": "Thus saith the LORD; Behold, I will give Pharaohhophra king of Egypt into the hand of his enemies, and into the hand of them that seek his life; as I gave Zedekiah king of Judah into the hand of Nebuchadrezzar king of Babylon, his enemy, and that sought his life."}}, "tsk": {"1": [{"kopje": "over", "refs": ["Jer 42:15-18", "Jer 43:5-7"]}, {"kopje": "Migdol", "refs": ["Jer 46:14", "Ex 14:2", "Ezech 29:10"]}, {"kopje": "Tachpanhes", "refs": ["Jer 43:7", "Ezech 30:18"]}, {"kopje": "Nof", "refs": ["Jer 2:16", "Jer 46:14", "Jer 46:19", "Jes 19:13", "Ezech 30:16"]}, {"kopje": "Pathros", "refs": ["Gen 10:14", "Jes 11:11", "Ezech 29:14", "Ezech 30:14"]}], "2": [{"kopje": "U hebt", "refs": ["Jer 39:1-8", "E f": "../../nave/e/?hl=Jer.44.30#i5881", "refs": [], "kinderen": [{"label": "Prophecies against", "href": "../../nave/e/?hl=Jer.44.30#i5883", "refs": [{"disp": "Gen 15:13", "href": "../../genesis/15/#v13", "ref": "Gen 15:13", "svLabel": null}, {"disp": "Gen 15:14", "href": "../../genesis/15/#v14", "ref": "Gen 15:14", "svLabel": null}, {"disp": "Jes 20:2-6", "href": "../../jesaja/20/#v2", "ref": "Jes 20:2-6", "svLabel": null}, {"disp": "Jes 45:14", "href": "../../jesaja/45/#v14", "ref": "Jes 45:14", "svLabel": null}, {"disp": "Jer 9:25", "href": "../../jeremia/9/#v25", "ref": "Jer 9:25", "svLabel": null}, {"disp": "Jer 9:26", "href": "../../jeremia/9/#v26", "ref": "Jer 9:26", "svLabel": null}, {"disp": "Jer 43:8-13", "href": "../../jeremia/43/#v8", "ref": "Jer 43:8-13", "svLabel": null}, {"disp": "Jer 44:30", "href": "../../jeremia/44/#v30", "ref": "Jer 44:30", "svLabel": null}, {"disp": "Hos 8:13", "href": "../../hosea/8/#v13", "ref": "Hos 8:13", "svLabel": null}, {"disp": "Joël 3:11", "href": "../../joel/3/#v11", "ref": "Joël 3:11", "svLabel": null}, {"disp": "Zach 10:11", "href": "../../zacharia/10/#v11", "ref": "Zach 10:11", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Pharaoh", "href": "../../nave/p/#t-pharaoh", "kinderen": [{"label": "9. Pharaoh-hophra", "href": "../../nave/p/?hl=Jer.44.30#i15628", "refs": [], "kinderen": [{"label": "Prophecies concerning", "href": "../../nave/p/?hl=Jer.44.30#i15629", "refs": [{"disp": "Jer 44:30", "href": "../../jeremia/44/#v30", "ref": "Jer 44:30", "svLabel": null}, {"disp": "Jer 46:25", "href": "../../jeremia/46/#v25", "ref": "Jer 46:25", "svLabel": null}, {"disp": "Jer 46:26", "href": "../../jeremia/46/#v26", "ref": "Jer 46:26", "svLabel": null}, {"disp": "Ezech 30:21-26", "href": "../../ezechiel/30/#v21", "ref": "Ezech 30:21-26", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Gen 6:5-7": "En de HEERE zag dat de slechtheid van de mens groot was op de aarde, en dat elk bedenksel van de gedachten van zijn hart alle dagen alleen maar slecht was. Toen had de HEERE er berouw van, dat Hij de mens op de aarde gemaakt had, en het smartte Hem aan Zijn hart. En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "Jer 4:4": "Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden.", "Job 24:13": "Zij horen bij hen die zich verzetten tegen het licht; zij kennen Zijn wegen niet, en zij blijven niet op Zijn paden.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Deut 29:26": "En zij heengegaan zijn, en andere goden gediend hebben en zich daarvoor gebogen hebben; goden, die zij niet gekend hadden, en die hun niets had toebedeeld;", "Matt 24:15": "Wanneer u dan de gruwel van de verwoesting zal zien, waarvan gesproken is door Daniël de profeet, staande op de heilige plaats (die het leest, laat hij daarop letten!),", "Spr 24:22": "Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?", "Job 15:25-27": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan. Hij loopt tegen Hem aan met de hals, met zijn dikke, hoog verheven schilden; Omdat hij zijn aangezicht met zijn vet bedekt heeft, en rimpels gemaakt heeft rond de weekdarmen;", "Klaagl 1:1": "Aleph. Hoe zit die stad zo eenzaam, die vol volk was; zij is als een weduwe geworden, zij, die groot was onder de heidenen, een vorstin onder de landschappen, is cijnsbaar geworden.", "Ps 104:35": "De zondaars zullen van de aarde weggevaagd worden, en de goddelozen zullen niet meer zijn. Loof de HEERE, mijn ziel! Hallelujah!", "Jer 1:16": "En Ik zal Mijn oordelen tegen hen uitspreken over al hun slechtheid; dat zij Mij verlaten hebben, en voor andere goden reukwerk verbrand hebben, en zich gebogen hebben voor de werken van hun handen.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "Jer 34:12": "Daarom kwam het woord van de HEERE tot Jeremia, van de HEERE, en Hij zei:", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "Dan 12:1": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "1 Sam 28:18": "Zoals u naar de stem van de HEERE niet geluisterd hebt, en de gloed van Zijn toorn niet uitgevoerd hebt tegen Amalek; daarom heeft de HEERE u deze zaak aangedaan op deze dag.", "Jer 51:45": "Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Judas 1:13": "Wilde golven van de zee, die hun eigen schande opschuimen; dwalende sterren, aan wie de zwartste duisternis voor eeuwig bewaard wordt.", "Jer 29:22": "En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;", "Matt 27:25": "En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen.", "Jer 3:12": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.", "Ezech 21:24": "Daarom zegt de Heere HEERE zo: Omdat u uw ongerechtigheid laat gedenken, doordat uw overtredingen ontdekt worden, zodat uw zonden gezien worden in al uw handelingen; omdat aan u gedacht wordt, zult u met de hand gegrepen worden.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Luk 12:4": "En Ik zeg u, Mijn vrienden: wees niet bang voor hen die het lichaam doden, en daarna niets meer kunnen doen.", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Matt 12:34": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.", "Jes 26:2": "Doe de poorten open, zodat het rechtvaardige volk daarin gaat, dat de trouw bewaart.", "Zef 1:4": "En Ik zal Mijn hand uitstrekken tegen Juda, en tegen alle inwoners van Jeruzalem; en Ik zal uit deze plaats uitroeien het overblijfsel van Baäl, en de naam van de afgodspriesters met de priesters;", "Jes 27:12": "En het zal op die dag gebeuren, dat de HEERE zal dorsen, van de stroom van de rivier af tot aan de rivier van Egypte; maar u zult opgeraapt worden, één voor één, o kinderen van Israël!", "Amos 6:10": "En de naaste bloedverwant zal ieder van hen opnemen, degene die hem verbrandt, om de beenderen uit het huis naar buiten te brengen, en zal zeggen tegen hem die binnen in het huis is: Is er nog iemand bij u? En hij zal zeggen: Niemand. Dan zal hij zeggen: Zwijg! Want wij mogen de Naam van de HEERE niet noemen.", "Hos 2:8-12": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "Ezech 30:14": "En Ik zal Pathros verwoesten, en een vuur aansteken in Zoan; en Ik zal gerichten voltrekken in No.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "Jer 51:22": "En door u zal Ik in stukken slaan de man en de vrouw; en door u zal Ik in stukken slaan de oude en de jonge; en door u zal Ik in stukken slaan de jongeling en de jonkvrouw.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Ps 58:4-6": "De goddelozen zijn vervreemd van de moederschoot af; de leugensprekers dolen van de moederbuik af. Zij hebben vurig gif, gelijk vurig slangengif; zij zijn als een dove adder, die zijn oren toestopt, opdat hij niet hoort naar de stem van de bezweerders, van hem die ervaren is in het uitvoeren van bezweringen.", "Jer 16:12": "En u erger gedaan hebt dan uw vaders; want zie, u wandelt, ieder naar het goeddunken van zijn slechte hart, om naar Mij niet te horen.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Dan 5:22": "En u, Belsazar, zijn zoon! U hebt uw hart niet vernederd, hoewel u dit alles goed geweten hebt.", "Jer 40:12": "keerden alle Joden terug uit alle plaatsen waarheen zij verdreven waren, en kwamen in het land van Juda tot Gedalia te Mizpa; en zij verzamelden zeer veel wijn en zomervruchten.", "Jer 7:13": "En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt;", "Klaagl 1:8": "Cheth. Jeruzalem heeft zwaar gezondigd, daarom is zij als een afgezonderde vrouw geworden; allen, die haar eerden, achten haar onwaard, omdat zij haar naaktheid gezien hebben; zij zucht ook, en zij is achterwaarts gekeerd.", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "1 Kon 9:7": "Dan zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken.", "Ps 32:9": "Wees niet als een paard, als een muilezel, dat geen verstand heeft, wiens muil men breidelt met toom en gebit, zodat het niet naar u toe komt.", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Jer 44:17-19": "Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad. Maar vanaf het moment dat wij opgehouden zijn wierook te branden voor de koningin van de hemel, en haar drankoffers te offeren, hebben wij van alles gebrek gehad, en zijn wij door het zwaard en door de honger verteerd. Ook wanneer wij voor de koningin van de hemel wierook branden en haar drankoffers offeren, maken wij haar gebeelde koeken om haar af te beelden, en offeren wij haar drankoffers, zonder onze mannen?", "Jer 14:1-16": "Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte. Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Jer 8:4-22": "Zeg verder tegen hen: Zo zegt de HEERE: Zal men vallen, en niet weer opstaan? Zal men afkeren, en niet terugkeren? Waarom keert dit volk van Jeruzalem dan af, met een altijddurende afkering? Zij houden vast aan bedrog, zij weigeren terug te keren. Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd.", "Jer 7:20": "Daarom zegt de Heere HEERE zo: Zie, Mijn toorn en Mijn grimmigheid zal uitgestort worden over deze plaats, over de mensen en over de dieren, en over de bomen van het veld, en over de vrucht van het aardrijk; en het zal branden, en niet uitgeblust worden.", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Dan 9:8": "O Heere! bij ons is de schaamte van het gezicht, bij onze koningen, bij onze vorsten, en bij onze vaders, omdat wij tegen U gezondigd hebben.", "2 Kon 23:5": "Daartoe schafte hij de afgodspriesters af, die de koningen van Juda aangesteld hadden, opdat men zou roken op de hoogten, in de steden van Juda, en rondom Jeruzalem, alsook hen die voor Baäl, de zon, en de maan, en de andere planeten, en heel het leger van de hemel rookten.", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Ps 106:18": "En een vuur brandde onder hun groep, een vlam stak de goddelozen in brand.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Jer 32:31-33": "Want tot Mijn toorn en tot Mijn grimmigheid is Mij deze stad geweest, vanaf de dag dat zij haar gebouwd hebben tot op deze dag toe; zodat Ik haar van Mijn aangezicht wegdeed; Vanwege al de boosheid van de kinderen van Israël en van de kinderen van Juda, die zij gedaan hebben om Mij te vertoornen, zij, hun koningen, hun vorsten, hun priesters en hun profeten, en de mannen van Juda, en de inwoners van Jeruzalem; Die Mij de nek toegekeerd hebben en niet het aangezicht; hoewel Ik hen leerde, vroeg opstaand en lerend, evenwel luisterden zij niet, om tucht aan te nemen;", "Klaagl 4:11": "Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Jer 32:29-32": "En de Chaldeeën, die tegen deze stad strijden, zullen erin komen, en deze stad met vuur aansteken, en zullen haar verbranden, met de huizen op wier daken zij voor Baäl gerookt en aan andere goden drankoffers geofferd hebben, om Mij te vertoornen. Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE. Want tot Mijn toorn en tot Mijn grimmigheid is Mij deze stad geweest, vanaf de dag dat zij haar gebouwd hebben tot op deze dag toe; zodat Ik haar van Mijn aangezicht wegdeed;", "Ezech 32:1-32": "Het gebeurde ook in het twaalfde jaar, in de twaalfde maand op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei: Mensenkind! Hef een klaaglied op over Farao, de koning van Egypte, en zeg tegen hem: U was als een jonge leeuw onder de heidenvolken, en u was als een zeedraak in de zeeën; u kwam voort in uw rivieren, u beroerde het water met uw voeten, en u vermodderde hun rivieren. Zo zegt de Heere HEERE: Ik zal daarom Mijn net over u uitspreiden door een vergadering van veel volken; die zullen u optrekken in Mijn garen.", "Luk 12:5": "Maar Ik zal u tonen voor wie u bang moet zijn: wees bang voor Hem, Die, nadat Hij gedood heeft, ook macht heeft om in de hel te werpen; ja, Ik zeg u, wees bang voor Hem!", "Ezech 7:6": "Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Jer 3:14-18": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen. En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand. En het zal gebeuren, wanneer u meer geworden en vruchtbaar geworden bent in het land, in die dagen, spreekt de HEERE, dat zij niet meer zullen zeggen: De ark van het verbond van de HEERE, en zij zal ook niet in het hart opkomen; en zij zullen er niet aan denken, en haar niet bezoeken, en zij zal niet opnieuw gemaakt worden.", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Ps 106:23": "Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "Jes 28:14": "Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is!", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "Jer 18:12": "Doch zij zeggen: Het is buiten hoop; maar wij zullen naar onze eigen gedachten wandelen, en wij zullen doen, ieder, wat zijn boze hart goeddunkt.", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Jes 64:11": "Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Dan 9:5": "Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten.", "Ps 78:21": "Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Jer 26:5": "Door te horen naar de woorden van Mijn knechten, de profeten, die Ik tot u zend, ja, vroeg opstaand en zendend; maar u niet gehoord hebt;", "Ezech 20:32": "Daarom, wat in uw geest is opgekomen, zal geenszins gebeuren, namelijk dat u zegt: Wij zullen zijn als de heidenvolken en als de geslachten van de landen, dienend hout en steen.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Num 14:21-23": "Maar zeker, zo waarachtig als Ik leef, zal de hele aarde met de heerlijkheid van de HEERE vervuld worden! Want al de mannen die Mijn heerlijkheid gezien hebben, en Mijn tekenen, die Ik in Egypte en in de woestijn gedaan heb, en Mij nu tien keer beproefd hebben, en niet gehoorzaam zijn geweest aan Mijn stem; zij zullen het land dat Ik hun vaderen gezworen heb, zeker niet zien. Ja, niemand van hen die Mij getergd hebben, zal dat zien!", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Jer 19:13": "En de huizen van Jeruzalem en de huizen van de koningen van Juda zullen, evenals alle plaatsen van Tofeth, onrein worden, met al de huizen, op wier daken zij aan heel het leger van de hemel gerookt en aan vreemde goden drankoffers geofferd hebben.", "Amos 7:16": "Nu dan, hoor het woord van de HEERE: U zegt: U zult niet profeteren tegen Israël, en niets uitspreken tegen het huis van Izak.", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Jer 29:19": "Omdat zij naar Mijn woorden niet geluisterd hebben, spreekt de HEERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.", "Matt 23:33": "Slangen, addergebroed! Hoe zou u de helse verdoemenis ontvluchten?", "Openb 18:5": "Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "Jes 30:18-26": "En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten. Want het volk zal in Sion wonen, te Jeruzalem; u zult helemaal niet wenen; zeker zal Hij u genadig zijn op de stem van uw geroep; zodra Hij het horen zal, zal Hij u antwoorden. De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Jes 28:12": "tot wie Hij gezegd heeft: Dit is de rust, geef de moede rust, en dit is de verkwikking; toch hebben zij niet willen horen.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "2 Kron 33:19": "En zijn gebed, en hoe God Zich door hem heeft laten verbidden, ook al zijn zonde, en zijn overtreding, en de plaatsen waarop hij hoogten gebouwd, en offerbossen en gesneden beelden opgesteld heeft, voordat hij vernederd werd, zie, dat is beschreven in de woorden van de zieners.", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "Luk 19:14": "Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Hebr 6:18": "opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Jer 7:34": "En Ik zal uit de steden van Juda en uit de straten van Jeruzalem doen ophouden de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid; want het land zal tot een verwoesting worden.", "Ezech 14:8": "En Ik zal Mijn aangezicht tegen die man zetten, en zal hem stellen tot een teken en tot een spreekwoord, en zal hem uitroeien uit het midden van Mijn volk; en u zult weten dat Ik de HEERE ben.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Openb 16:19": "En de grote stad werd in drie delen gescheurd, en de steden van de heidenvolken vielen; en aan het grote Babylon werd gedacht voor God, om haar de drinkbeker te geven van de wijn van de toorn van Zijn gramschap.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Jer 33:19": "En het woord van de HEERE kwam tot Jeremia, en Hij zei:", "Gen 6:13": "Daarom zei God tegen Noach: Het einde van alle vlees is voor Mijn aangezicht gekomen; want de aarde is door hen vervuld met geweld; en zie, Ik zal hen met de aarde verderven.", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Rom 1:26": "Daarom heeft God hen overgegeven aan oneerlijke driften; want ook hun vrouwen hebben het natuurlijke gebruik veranderd in het gebruik tegen de natuur;", "Ps 91:8": "Alleen zult u het met uw ogen aanschouwen; en u zult de vergelding van de goddelozen zien.", "Jer 35:15": "En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opgestaan en gezonden, om te zeggen: Bekeer u toch, ieder van zijn boze weg, en maak uw daden goed, en volg andere goden niet na om hen te dienen, dan zult u in het land blijven dat Ik u en uw vaderen gegeven heb; maar u hebt uw oor niet geneigd, en naar Mij niet geluisterd.", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "Ezech 18:32": "Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Jes 37:32": "Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.", "Zach 7:11": "Maar zij weigerden op te letten, en trokken hun schouder terug, en zij verzwaarden hun oren, zodat zij niet hoorden.", "1 Sam 15:3": "Ga nu heen, en sla Amalek, en verban alles wat hij heeft, en verschoon hem niet; maar dood van de man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kamelen tot de ezels toe.", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Job 33:14": "Maar God spreekt eens of tweemaal; doch men let daar niet op.", "Jer 30:4": "En dit zijn de woorden, die de HEERE gesproken heeft van Israël en van Juda.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Klaagl 2:1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "Lev 26:16-39": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten. Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand. En als u Mij ook na deze dingen niet zult horen, zal Ik nog daaraan toedoen, om u zevenvoudig over uw zonden te tuchtigen.", "Jer 43:9-13": "Neem grote stenen in uw hand, en verberg ze in de klei in de ticheloven, die bij de deur van Farao's huis te Tachpanhes is, voor de ogen van de Joodse mannen; en zeg tegen hen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zie, Ik zal iemand heenzenden, en Nebukadrezar, de koning van Babel, Mijn dienaar, halen, en Ik zal zijn troon zetten boven op deze stenen, die Ik verborgen heb; en hij zal zijn koninklijke tent daarover spannen. En hij zal komen en Egypteland verslaan: wie voor de dood is, ten dode; en wie voor de gevangenschap is, ter gevangenschap; en wie voor het zwaard is, ten zwaard.", "Ps 119:119": "U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Ezech 21:23": "Dit zal in hun ogen als een nutteloze waarzeggerij zijn, omdat zij met eden beëdigd zijn onder hen; maar hij zal aan de ongerechtigheid denken, opdat zij gegrepen worden.", "2 Petr 3:7-9": "Maar de hemelen die er nu zijn, en de aarde, zijn door datzelfde woord als een schat weggelegd, en worden voor het vuur bewaard tegen de dag van het oordeel en van het verderf van de goddeloze mensen. Maar dit ene mag u niet onbekend zijn, geliefden, dat één dag bij de Heere is als duizend jaar, en duizend jaar als één dag. De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "Jer 43:7": "en zij trokken naar Egypteland, want zij waren aan de stem van de HEERE niet gehoorzaam; en zij kwamen tot Tachpanhes.", "Luk 23:40": "Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent?", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "Ezech 16:60-63": "Toch zal Ik denken aan Mijn verbond met u, in de dagen van uw jeugd, en Ik zal met u een eeuwig verbond oprichten. Dan zult u aan uw wegen denken en beschaamd zijn, wanneer u uw zusters, die groter zijn dan u, samen met hen die kleiner zijn dan u, aannemen zult; want Ik zal ze u geven tot dochters, maar niet op grond van uw verbond. Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben;", "1 Kor 5:13": "Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Jer 30:24": "De gloed van de toorn van de HEERE zal zich niet afwenden, totdat Hij het gedaan heeft, en totdat Hij tot stand gebracht heeft de gedachten van Zijn hart; in het laatste van de dagen zult u daarop letten.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Jes 66:4": "Ik zal ook hun loon kiezen naar hun handelingen, en hun angsten zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet luisterden, maar deden wat kwaad is in Mijn ogen, en kozen wat Ik niet wilde.", "Micha 2:12": "Zeker zal Ik u, o Jakob, geheel verzamelen; zeker zal Ik het overblijfsel van Israël bijeenbrengen; Ik zal het samen bijeenzetten als schapen van Bozra; als een kudde in het midden van haar kooi zullen zij dreunen van de mensenmenigte.", "Joël 3:11": "Verzamel u en kom aan, alle volken van rondom, en verzamel u! (O HEERE, laat Uw helden daarheen neerdalen!)", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Luk 21:20": "Maar wanneer u zult zien dat Jeruzalem door legers omsingeld wordt, weet dan, dat haar verwoesting nabij gekomen is.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Jes 3:8": "Want Jeruzalem is gestruikeld, en Juda is gevallen, omdat hun tong en hun daden tegen de HEERE zijn, om de ogen van Zijn heerlijkheid te verbitteren.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "Jer 39:1-8": "In het negende jaar van Zedekia, koning van Juda, in de tiende maand, kwam Nebukadrezar, de koning van Babel, en al zijn leger, tegen Jeruzalem, en zij belegerden haar. In het elfde jaar van Zedekia, in de vierde maand, op de negende dag van de maand, werd de stad doorgebroken. En alle vorsten van de koning van Babel trokken naar binnen, en hielden halt bij de middelste poort: namelijk Nergal-Sarezer, Samgar-Nebu, Sarsechim, Rab-Saris, Nergal-Sarezer, Rab-Mag, en al de overige vorsten van de koning van Babel.", "Jer 26:4": "Zeg dan tot hen: Zo zegt de HEERE: Als u naar Mij niet zult horen, om te wandelen in Mijn wet, die Ik voor uw aangezicht gegeven heb;", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Jer 46:1": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurd is tegen de heidenen.", "Num 30:2": "Wanneer een man de HEERE een gelofte belooft, of een eed zweert, om zijn ziel met een verbintenis te verbinden, zal hij zijn woord niet schenden; hij zal doen naar alles wat uit zijn mond gegaan is.", "Jer 38:4": "Toen zeiden de vorsten tegen de koning: Laat toch deze man gedood worden; want zo maakt hij de handen van de krijgslieden die in deze stad zijn overgebleven, en de handen van het hele volk slap, doordat hij zulke woorden tot hen spreekt; want deze man zoekt niet de vrede van dit volk, maar het kwaad.", "Jes 9:20": "Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ps 73:9-15": "Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde. Daarom keert Zijn volk zich hierheen, als hun water uit een volle beker wordt uitgedrukt, Zodat zij zeggen: Hoe zou God het weten, en zou er kennis zijn bij de Allerhoogste?", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Zach 1:6": "Nochtans Mijn woorden en Mijn inzettingen, die Ik Mijn knechten, de profeten, geboden had, hebben die uw vaders niet getroffen? Zodat zij terugkerend zeiden: Zoals de HEERE van de heerscharen Zich voorgenomen had ons te doen, naar onze wegen en naar onze daden, zo heeft Hij met ons gedaan.", "Hos 13:11": "Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Jer 23:3": "En Ik zal het overblijfsel van Mijn schapen Zelf verzamelen uit al de landen, waarheen Ik ze verdreven heb; en Ik zal ze terugbrengen tot hun kooien, en zij zullen vruchtbaar zijn, en zich vermenigvuldigen.", "Jer 9:25": "Zie, de dagen komen, spreekt de HEERE, dat Ik straf zal doen over alle besnedenen, samen met degenen die de voorhuid hebben;", "Jer 39:5-7": "Maar het leger van de Chaldeeën jaagde hen achterna; en zij achterhaalden Zedekia in de vlakke velden van Jericho, en vingen hem, en brachten hem naar boven tot Nebukadrezar, de koning van Babel, naar Ribla, in het land van Hamath; die sprak oordelen tegen hem uit. En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda. En hij verblindde de ogen van Zedekia, en bond hem met twee koperen ketenen, om hem naar Babel te voeren.", "Deut 9:18-20": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken. Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment. Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Micha 2:13": "De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits.", "Richt 10:7": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten.", "Jer 34:22": "Zie, Ik zal bevel geven, spreekt de HEERE, en zal hen weer naar deze stad terugbrengen, en zij zullen tegen haar strijden, en zullen ze innemen, en zullen ze met vuur verbranden; en Ik zal de steden van Juda stellen tot een verwoesting, zodat er niemand in woont.", "Jer 9:11": "En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "Matt 12:44": "Dan zegt hij: Ik zal teruggaan naar mijn huis, waar ik vandaan gekomen ben; en als hij komt, vindt hij het leeg, schoongeveegd en versierd.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Jer 42:17": "Zo zal het zijn met alle mannen die hun aangezichten stellen om naar Egypte te gaan, om daar als vreemdelingen te wonen; zij zullen sterven door het zwaard, door de honger en door de pestilentie; en zij zullen niemand hebben die overblijft of ontkomt aan het kwaad dat Ik over hen zal brengen.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Spr 5:22": "De goddeloze zullen zijn eigen ongerechtigheden vangen, en met de banden van zijn zonden zal hij vastgehouden worden.", "Jer 23:20": "De toorn van de HEERE zal zich niet afwenden, totdat Hij het zal hebben gedaan, en totdat Hij de gedachten van Zijn hart tot stand zal hebben gebracht; in de laatste dagen zult u dat met verstand inzien.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Joz 22:17-20": "Is de ongerechtigheid van Peor ons te weinig, waarvan wij niet gereinigd zijn tot op deze dag, hoewel de plaag in de vergadering van de HEERE geweest is? Nu u zich vandaag afkeert van achter de HEERE, zal het gebeuren, als u vandaag opstandig bent tegen de HEERE, dat Hij Zich morgen zeer zal vertoornen tegen de hele gemeente van Israël. Maar toch, als het land van uw bezitting onrein is, komt dan over naar het land van de bezitting van de HEERE, waar de tabernakel van de HEERE woont, en neemt bezit in het midden van ons; maar wees niet opstandig tegen de HEERE, en wees ook niet opstandig tegen ons, door voor u een altaar te bouwen, naast het altaar van de HEERE, onze God.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Pred 7:17": "Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd?", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Ezech 6:12": "Wie ver weg is, zal door de pest sterven, en wie dichtbij is, zal door het zwaard vallen; maar wie overgebleven en belegerd is, zal door honger sterven; zo zal Ik Mijn grimmigheid tegen hen volbrengen.", "Mal 3:13-15": "Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar u zegt: Wat hebben wij tegen U gesproken? U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen? En nu, wij achten de hoogmoedigen gelukzalig; ook wie goddeloosheid doen, worden gebouwd; ook verzoeken zij de HEERE, en ontkomen.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Jer 1:10": "Zie, Ik stel u op deze dag over de volken en over de koninkrijken, om uit te rukken, en af te breken, en te verderven, en te verstoren; ook om te bouwen en te planten.", "Luk 21:21": "Laten dan zij die in Judea zijn, vluchten naar de bergen; en zij die in het midden ervan zijn, daaruit trekken; en zij die op de velden zijn, daar niet in komen.", "Jer 32:36-44": "En nu, daarom zegt de HEERE, de God van Israël, zo over deze stad, waarvan u zegt: Zij is gegeven in de hand van de koning van Babel, door het zwaard, en door de honger, en door de pest; Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen. Ja, zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Ps 51:19": "De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Jer 5:1-5": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn. En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals. HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Num 14:29": "Uw dode lichamen zullen in deze woestijn vallen; en al uw getelden, naar uw hele aantal, van twintig jaar oud en daarboven, u die tegen Mij gemord hebt.", "1 Sam 22:19": "Hij sloeg ook Nob, de stad van deze priesters, met de scherpte van het zwaard, zowel de mannen als de vrouwen, zowel de kinderen als de zuigelingen, zelfs de ossen en ezels en de schapen sloeg hij met de scherpte van het zwaard.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "Ezech 20:13": "Maar het huis van Israël werd opstandig tegen Mij in de woestijn; zij wandelden niet in Mijn inzettingen, en verwierpen Mijn rechten, die, als een mens ze doet, hij daardoor zal leven; en zij ontheiligden Mijn sabbatten zeer, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten in de woestijn, om hen te verdelgen.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "Jer 44:15-19": "Toen antwoordden aan Jeremia al de mannen die wisten dat hun vrouwen aan andere goden wierook brandden, en al de vrouwen die daar stonden, een grote menigte, alsook al het volk dat in Egypteland, in Pathros, woonde, en zij zeiden: Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen. Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.", "1 Petr 5:6": "Verneder u dan onder de krachtige hand van God, opdat Hij u verhoogt op Zijn tijd.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Jer 34:21": "Zelfs Zedekia, de koning van Juda, en zijn vorsten, zal Ik overgeven in de hand van hun vijanden, en in de hand van hen die hun ziel zoeken, namelijk in de hand van het leger van de koning van Babel, dat van u nu is opgetrokken.", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Mal 3:4": "Dan zal het spijsoffer van Juda en Jeruzalem de HEERE zoet zijn, zoals in de oude dagen, en zoals in de vorige jaren.", "Ezech 11:21": "Maar van hen wier hart het hart van hun verfoeiselen en hun gruwelen navolgt, zal Ik de weg daarvan op hun hoofd geven, spreekt de Heere HEERE.", "Deut 32:17": "Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Gen 3:11": "En Hij zei: Wie heeft u verteld dat u naakt bent? Hebt u van die boom gegeten, waarvan Ik u geboden had daarvan niet te eten?", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Hos 11:7": "Want Mijn volk blijft hangen aan de afkering van Mij; zij roepen het wel tot de Allerhoogste, maar niet één verhoogt Hem.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Jer 26:4-6": "Zeg dan tot hen: Zo zegt de HEERE: Als u naar Mij niet zult horen, om te wandelen in Mijn wet, die Ik voor uw aangezicht gegeven heb; Door te horen naar de woorden van Mijn knechten, de profeten, die Ik tot u zend, ja, vroeg opstaand en zendend; maar u niet gehoord hebt; Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek voor alle volken van de aarde.", "Deut 7:10": "En Hij vergeldt ieder van hen die Hem haten, in zijn aangezicht, om hem te verderven; Hij zal het voor wie Hem haat niet uitstellen, in zijn aangezicht zal Hij het hem vergelden.", "Jes 26:12-19": "HEERE, U zult ons vrede geven, want U hebt ook al onze zaken voor ons volbracht. HEERE, onze God, andere heren, behalve U, hebben over ons geheerst; maar door U alleen gedenken wij Uw Naam. Zij die dood zijn, zullen niet opnieuw leven, overledenen zullen niet opstaan; daarom hebt U hen bezocht en hebt U hen verdelgd, en U hebt al hun gedachtenis doen vergaan.", "Jer 11:17": "Want de HEERE van de heerscharen¹, Die u geplant heeft, heeft een kwaad over u uitgesproken; vanwege de boosheid van het huis van Israël en van het huis van Juda, die zij onder elkaar bedrijven, om Mij te vertoornen, door Baäl te beroken.", "Jer 46:14": "Verkondigt in Egypte, en doet het horen te Migdol; doet het ook horen te Nof en Tachpanhes; zegt: Stelt u op, en maakt u gereed, want het zwaard heeft verslonden, wat rondom u is.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Ex 9:30": "Toch, wat u en uw dienaren betreft, weet ik dat u nog niet zult vrezen voor het aangezicht van de HEERE God.", "Spr 12:7": "De goddelozen worden omgekeerd, zodat zij niet meer zijn; maar het huis van de rechtvaardigen zal bestaan.", "Jer 49:34": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurde tegen Elam, in het begin van het koninkrijk van Zedekia, de koning van Juda, en zei:", "Mark 13:14-16": "Wanneer u dan de gruwel van de verwoesting zult zien, waarvan door de profeet Daniël gesproken is, staande waar het niet behoort (wie dit leest, laat hij daarop letten!), laten dan zij die in Judea zijn, vluchten naar de bergen. En wie op het dak is, moet niet naar beneden gaan in het huis, en niet naar binnen gaan, om iets uit zijn huis weg te halen. En wie op de akker is, moet niet teruggaan om zijn kleed te halen.", "Jer 25:6": "En loop andere goden niet achterna, om die te dienen, en u voor die neer te buigen; en verwek Mijn toorn niet door het werk van uw handen, opdat Ik u geen kwaad doe.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Hab 2:10": "U hebt schande beraamd voor uw huis; door veel volken uit te roeien hebt u tegen uw eigen ziel gezondigd.", "Ezech 36:1-38": "En u, mensenkind! Profeteer tot de bergen van Israël, en zeg: Bergen van Israël! Hoort het woord van de HEERE. Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden! Daarom profeteer en zeg: Zo zegt de Heere HEERE: Daarom, omdat men u van rondom verwoest en opgeslokt heeft, opdat u voor het overblijfsel van de heidenen ten erve zou zijn, en u gebracht bent op de klapachtige lip en in opspraak van het volk;", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God
