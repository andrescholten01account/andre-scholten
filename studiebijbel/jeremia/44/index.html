: "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Ps 94:23": "En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "2 Sam 22:8": "Toen daverde en beefde de aarde; de fundamenten van de hemel beroerden zich, en daverden, omdat Hij in toorn ontstoken was.", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Jer 19:3": "En zeg: Hoort het woord van de HEERE, koningen van Juda en inwoners van Jeruzalem! Zo zegt de HEERE van de heerscharen, de God van Israël: Ziet, Ik zal een kwaad brengen over deze plaats, waarvan een ieder die het hoort, zijn oren zullen klinken;", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Jes 37:31": "Want wie ontkomen is, die overgebleven is van het huis van Juda, zal opnieuw naar beneden wortelen, en het zal naar boven vrucht dragen.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Ezech 20:40": "Want op Mijn heilige berg, op de hoge berg van Israël, spreekt de Heere HEERE, daar zal Mij het hele huis van Israël in het land dienen, zij allen; daar zal Ik welgevallen aan hen hebben, en daar zal Ik uw hefoffers eisen, en de eerstelingen van uw heffingen met al uw geheiligde dingen.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Job 21:14": "Toch zeggen zij tegen God: Ga weg van ons, want in de kennis van Uw wegen hebben wij geen behagen.", "Deut 7:4": "Want zij zouden uw zonen van Mij doen afwijken, zodat zij andere goden zouden dienen; en de toorn van de HEERE zou tegen u ontsteken, en u snel verdelgen.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Lev 20:6": "Wanneer er iemand is, die zich tot de waarzeggers en tot de duivelskunstenaars keert, om hen achterna te hoereren, zal Ik Mijn aangezicht tegen die ziel richten, en zal hem uit het midden van zijn volk uitroeien.", "Mark 6:26": "En de koning werd zeer bedroefd, maar toch, vanwege de eden en degenen die mee aanzaten, wilde hij haar dat niet weigeren.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "Num 30:12": "Maar als haar man die dingen helemaal teniet doet, op de dag dat hij het hoort, dan blijft niets gelden van alles wat uit haar lippen gegaan is, van haar gelofte, en van de verbintenis van haar ziel; haar man heeft ze teniet gedaan, en de HEERE zal het haar vergeven.", "Ezech 25:14-17": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE. Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "Ezra 9:7-15": "Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag. En nu is er, als een klein ogenblik, een genade gebeurd van de HEERE, onze God, om ons een ontkoming over te laten, en ons een nagel te geven in Zijn heilige plaats, om onze ogen te verlichten, o onze God, en om ons een weinig leven te geven in onze dienstbaarheid. Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Ex 16:3": "En de Israëlieten zeiden tegen hen: Was ons maar in Egypte gestorven door de hand van de HEERE, toen wij bij de vleespotten zaten, toen wij tot verzadiging brood aten! Want u hebt ons naar deze woestijn gebracht, om deze hele gemeente door honger te laten sterven.", "Micha 5:2": "Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël.", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Rom 11:5": "Zo is er dan ook in deze tegenwoordige tijd een overblijfsel geworden, naar de verkiezing van de genade.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Ps 107:12": "Daarom heeft Hij hun hart door zwarigheid vernederd; zij zijn gestruikeld, en er was geen helper.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Openb 2:5": "Bedenk dan waarvan u uitgevallen bent, en bekeer u, en doe de eerste werken; en zo niet, Ik zal u haastig bij komen, en zal uw kandelaar van zijn plaats wegnemen, als u zich niet bekeert.", "Ps 81:12": "Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.", "Ps 50:17": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit.", "Ps 106:25": "Maar zij morden in hun tenten; naar de stem van de HEERE luisterden zij niet.", "Jes 48:4": "Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Rom 6:16": "Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?", "Num 16:45": "Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Matt 24:39": "en zij merkten het niet, totdat de zondvloed kwam en hen allen wegnam; zo zal ook de komst van de Zoon des mensen zijn.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Jer 6:19": "Hoor toe, aarde! Zie, Ik zal een kwaad brengen over dit volk, de vrucht van hun gedachten; want zij letten niet op Mijn woorden, en Mijn wet verwerpen zij.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "1 Kon 21:29": "Hebt u gezien dat Achab zich vernedert voor Mijn aangezicht? Omdat hij zich vernedert voor Mijn aangezicht, zal Ik dat kwaad in zijn dagen niet brengen; in de dagen van zijn zoon zal Ik dat kwaad over zijn huis brengen.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Jes 46:11": "Die een roofvogel roept van het oosten, een man van Mijn raad uit een ver land; ja, Ik heb het gesproken, Ik zal het ook doen komen; Ik heb het geformeerd, Ik zal het ook doen.", "Ezech 3:1-11": "Daarna zei Hij tot mij: Mensenkind, eet, wat u vinden zult; eet deze rol, en ga, spreek tot het huis Israëls. Toen opende ik mijn mond, en Hij gaf mij die rol te eten. En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.", "Ezech 20:28": "Toen Ik hen in het land had gebracht, waarover Ik Mijn hand had opgeheven om het hun te geven, zagen zij naar elke hoge heuvel en elke dichtbeboste boom, en offerden daar hun offers, en zij brachten daar hun tergende offergaven, en daar zetten zij hun liefelijke reuk neer, en daar goten zij hun drankoffers uit.", "2 Sam 22:9": "Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daardoor aangestoken.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Hos 13:3": "Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "Klaagl 5:18": "Om de berg Sion, die verwoest is, waar de vossen op lopen.", "Ezech 8:18": "Daarom zal Ik ook handelen in grimmigheid, Mijn oog zal niet ontzien, en Ik zal niet sparen; al roepen zij voor Mijn oren met luide stem, toch zal Ik hen niet horen.", "Ezech 30:26": "En Ik zal de Egyptenaars verstrooien onder de heidenvolken, en zal hen verspreiden in de landen; zo zullen zij weten dat Ik de HEERE ben.", "Jes 57:17": "Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart.", "Matt 27:4": "en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Jer 9:26": "Over Egypte, en over Juda, en over Edom, en over de kinderen van Ammon, en over Moab, en over allen die aan de hoeken kortgeknipt zijn, die in de woestijn wonen; want alle heidenen hebben de voorhuid, maar het hele huis van Israël heeft de voorhuid van het hart.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Jer 22:26": "En Ik zal u, en uw moeder, die u gebaard heeft, wegwerpen in een ander land, waarin u niet geboren bent, en daar zult u sterven.", "Gen 3:6": "En de vrouw zag dat die boom goed was om van te eten, en dat hij een lust was voor de ogen, ja, een boom die begerenswaardig was om er verstandig van te worden; en zij nam van zijn vrucht en at; en zij gaf ook aan haar man, die bij haar was, en hij at.", "Ps 79:8": "Denk ons de vorige misdaden niet aan; haast U, laat Uw barmhartigheden ons tegemoetkomen; want wij zijn zeer zwak geworden.", "Dan 9:13": "Zoals geschreven is in de wet van Mozes, zo is al dat kwaad over ons gekomen; en wij smeekten het aangezicht van de HEERE, onze God, niet, door ons af te keren van onze ongerechtigheden en verstandig acht te geven op Uw waarheid.", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "Klaagl 3:37": "Mem. Wie zegt iets, en het gebeurt, als de Heere het niet beveelt?", "Ezech 30:16": "En Ik zal een vuur in Egypte aansteken; Sin zal zeer grote pijn hebben, en No zal gespleten worden, en Nof zal dagelijks zeer bang zijn.", "1 Kon 17:18": "En zij zei tegen Elia: Wat heb ik met u te doen, man van God? Bent u bij mij binnengekomen om mijn ongerechtigheid in gedachtenis te brengen, en om mijn zoon te doden?", "Jer 8:12": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE.", "1 Kon 21:25": "Doch er was niemand geweest zoals Achab, die zichzelf verkocht had om te doen wat kwaad is in de ogen van de HEERE, omdat Izebel, zijn vrouw, hem ophitste.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Jer 11:13": "Want naar het getal van uw steden zijn uw goden geweest, o Juda! en naar het getal van de straten van Jeruzalem hebt u altaren gesteld voor die schaamte, altaren om Baäl te beroken.", "Deut 6:15": "Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.", "Ex 32:10": "En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken.", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Deut 11:26": "Zie, ik stel u heden voor: zegen en vloek:", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Spr 21:29": "Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.", "Jer 11:12": "Dan zullen de steden van Juda en de inwoners van Jeruzalem heengaan, en roepen tot de goden aan wie zij wierook gebracht hebben; maar die zullen hen zeker niet kunnen verlossen ten tijde van hun kwaad.", "Deut 7:3": "U zult zich ook niet met hen verzwageren; uw dochters zult u niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "2 Kor 3:16": "Maar zodra men zich tot de Heere bekeert, wordt het deksel weggenomen.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "1 Kon 9:8": "En aangaande dit huis, dat verheven zal geweest zijn, ieder die eraan voorbijgaat zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE zo gedaan aan dit land en aan dit huis?", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Jer 44:7-28": "En nu, zo zegt de HEERE, de God van de heerscharen, de God van Israël: Waarom doet u zulk een groot kwaad tegen uw zielen, dat u de man en de vrouw, het kind en de zuigeling uit het midden van Juda uitroeit, zodat u zichzelf geen overblijfsel overlaat? U tergt Mij door de werken van uw handen, terwijl u wierook brandt voor andere goden in het land van Egypte, waar u gekomen bent om daar als vreemdeling te verblijven; zodat u uzelf uitroeit, en zodat u wordt tot een vloek, en tot een smaad onder alle volken van de aarde? Bent u de slechtheden van uw vaderen vergeten, en de slechtheden van de koningen van Juda, en de slechtheden van hun vrouwen, en uw slechtheden, en de slechtheden van uw vrouwen, die zij gedaan hebben in het land van Juda en in de straten van Jeruzalem?", "Jer 48:35": "En Ik zal in Moab doen ophouden, spreekt de HEERE, hem die op de hoogte offert, en die aan zijn goden reukwerk brandt.", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Jer 29:18": "En Ik zal hen achtervolgen met het zwaard, met de honger en met de pest; en Ik zal hen overgeven aan een verschrikking, in al de koninkrijken van de aarde, tot een vloek, en tot een schrik, en tot een aanfluiting, en tot een smaad, onder al de volken waarheen Ik hen zal hebben verdreven;", "Jes 32:9-11": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Ps 36:13": "Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.", "Jes 32:15-20": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden. En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Num 14:28": "Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de HEERE, zoals u in Mijn oren gesproken hebt, zo zal Ik u doen!", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "Jer 32:1": "Het woord dat tot Jeremia gekomen is van de HEERE, in het tiende jaar van Zedekia, koning van Juda; dit jaar was het achttiende jaar van Nebukadnezar.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Matt 24:35": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.", "Job 36:17": "Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Dan 3:15": "Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?", "Matt 12:42": "De koningin van het zuiden zal opstaan in het oordeel met dit geslacht, en zal het veroordelen; want zij is gekomen van het einde van de aarde, om de wijsheid van Salomo te horen; en zie, meer dan Salomo is hier!", "Dan 5:20-22": "Maar toen zijn hart zich verhief, en zijn geest verstijfd werd tot hoogmoed, werd hij van de troon van zijn koninkrijk afgestoten, en men nam de eer van hem weg. En hij werd van de mensenkinderen verstoten, en zijn hart werd gelijk gemaakt aan de dieren, en zijn woning was bij de woudezels; men gaf hem gras te eten zoals de ossen; en zijn lichaam werd nat gemaakt door de dauw van de hemel, totdat hij erkende dat God, de Allerhoogste, Heerser is over de koninkrijken van de mensen, en daarover stelt wie Hij wil. En u, Belsazar, zijn zoon! U hebt uw hart niet vernederd, hoewel u dit alles goed geweten hebt.", "Jer 2:25": "Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "2 Petr 2:1": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen;", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Jer 36:1": "Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam:", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Klaagl 2:3": "Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Gen 10:14": "En de Pathrusieten, en de Casluchieten, van waar de Filistijnen uitgekomen zijn, en de Caftorieten.", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Jer 6:10": "Tot wie zal ik spreken en betuigen, dat zij het horen? Ziet, hun oor is onbesneden, zodat zij niet kunnen toeluisteren; ziet, het woord van de HEERE is hun tot een smaad, zij hebben er geen lust in.", "Ezech 16:19": "En Mijn brood, dat Ik u gaf, meelbloem en olie, en honing, waarmee Ik u voedde, dat hebt u ook voor hun gezichten gezet tot een liefelijke geur; zo is het gebeurd, spreekt de Heere HEERE.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "Num 11:6": "Maar nu is onze ziel dor, er is helemaal niets, behalve dit manna voor onze ogen!", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Richt 21:11": "Doch dit is de zaak die u doen zult: al wat mannelijk is, en alle vrouwen die gemeenschap met een man gehad hebben, zult u met de ban slaan.", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "Jer 7:18": "De kinderen rapen hout, en de vaders steken het vuur aan, en de vrouwen kneden het deeg, om koeken te maken voor de koningin van de hemel, en drankoffers te offeren aan andere goden, om Mij verdriet aan te doen.", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Klaagl 2:16": "Pe. Al uw vijanden sperren hun mond open over u, zij fluiten en knersen met de tanden, zij zeggen: Wij hebben haar verslonden; dit is zeker de dag die wij verwacht hebben, wij hebben hem gevonden, wij hebben hem gezien.", "Hos 12:3": "Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "Ezech 3:26": "En Ik zal uw tong aan uw gehemelte doen kleven, zodat u stom worden zult, en hun niet zult zijn tot een bestraffende man; want zij zijn een opstandig huis.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Ezech 29:10": "Daarom, zie, Ik zál u en uw rivieren; en Ik zal Egypteland stellen tot woeste, verlaten eenzaamheden, van de toren van Syene af tot aan de grens van Morenland.", "Deut 9:14": "Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is.", "Lev 26:32": "Ja, Ik zal dat land verwoesten; zodat uw vijanden, die daarin zullen wonen, zich daarover ontzetten zullen.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden."}, "noten": {"1": "Vers 2: HEERE van de heerscharen — D.i. legermachten.", "2": "Vers 13, 29: SV: bezoeking doen — hertaald als \"straf brengen\" naar de bedoe <span class=\"wl wl-kjv\" data-code=\"H4024\">Migdol,</span> and at <span class=\"wl wl-kjv\" data-code=\"H8471\">Tahpanhes,</span> and at <span class=\"wl wl-kjv\" data-code=\"H5297\">Noph,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> of <span class=\"wl wl-kjv\" data-code=\"H6624\">Pathros,</span> saying,", "2": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Ye have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> all the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that I have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> upon <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and upon all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> and, behold, this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they are a <span class=\"wl wl-kjv\" data-code=\"H2723\">desolation,</span> and no man dwelleth", "3": "<span class=\"wl wl-kjv\" data-code=\"H6440\">Because</span> of their <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> which they have <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> to provoke me to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger,</span> in that they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense,</span> and to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> whom they <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not, neither they, ye, nor your fathers.", "4": "Howbeit I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto you all my <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> rising <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sending</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Oh, <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> not this <span class=\"wl wl-kjv\" data-code=\"H8441\">abominable</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> that I hate.", "5": "But they <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not, nor <span class=\"wl wl-kjv\" data-code=\"H5186\">inclined</span> their <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from their <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness,</span> to burn no <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> gods.", "6": "Wherefore my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> and mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was poured <span class=\"wl wl-kjv\" data-code=\"H5413\">forth,</span> and was <span class=\"wl wl-kjv\" data-code=\"H1197\">kindled</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> and they are <span class=\"wl wl-kjv\" data-code=\"H2723\">wasted</span> and <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate,</span> as at this day.", "7": "Therefore now thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Wherefore <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> ye this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> against your <span class=\"wl wl-kjv\" data-code=\"H5315\">souls,</span> to cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from you <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> <span class=\"wl wl-kjv\" data-code=\"H5768\">child</span> and <span class=\"wl wl-kjv\" data-code=\"H3243\">suckling,</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> to <span class=\"wl wl-kjv\" data-code=\"H3498\">leave</span> you none to remain;", "8": "In that ye provoke me unto <span class=\"wl wl-kjv\" data-code=\"H3707\">wrath</span> with the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> of your <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> burning <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> whither ye be <span class=\"wl wl-kjv\" data-code=\"H935\">gone</span> to <span class=\"wl wl-kjv\" data-code=\"H1481\">dwell,</span> that ye might cut yourselves <span class=\"wl wl-kjv\" data-code=\"H3772\">off,</span> and that ye might be a <span class=\"wl wl-kjv\" data-code=\"H7045\">curse</span> and a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> among all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> of the earth?", "9": "Have ye <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of their <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and your own <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of your <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> which they have <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> of Jerusalem?", "10": "They are not <span class=\"wl wl-kjv\" data-code=\"H1792\">humbled</span> even unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> neither have they <span class=\"wl wl-kjv\" data-code=\"H3372\">feared,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in my <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> nor in my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> that I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> your fathers.", "11": "Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> against you for <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and to cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> all Judah.", "12": "And I will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> that have <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> to <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn</span> there, and they shall all be <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> they shall even be <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> and by the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> from the <span class=\"wl wl-kjv\" data-code=\"H6996\">least</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H1419\">greatest,</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> and by the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine:</span> and they shall be an <span class=\"wl wl-kjv\" data-code=\"H423\">execration,</span> and an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7045\">curse,</span> and a reproach.", "13": "For I will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> them that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> as I have <span class=\"wl wl-kjv\" data-code=\"H6485\">punished</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> by the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> and by the pestilence:", "14": "So that none of the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> which are <span class=\"wl wl-kjv\" data-code=\"H935\">gone</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> to <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn</span> there, shall <span class=\"wl wl-kjv\" data-code=\"H6412\">escape</span> or <span class=\"wl wl-kjv\" data-code=\"H8300\">remain,</span> that they should <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> to the which they <span class=\"wl wl-kjv\" data-code=\"H5375\">have</span> a <span class=\"wl wl-kjv\" data-code=\"H5315\">desire</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> there: for none shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> but such as shall escape.", "15": "Then all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> which <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> that their <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> had burned <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> that stood <span class=\"wl wl-kjv\" data-code=\"H5975\">by,</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6951\">multitude,</span> even all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> in <span class=\"wl wl-kjv\" data-code=\"H6624\">Pathros,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah,</span> saying,", "16": "As for the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto us in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> we will not hearken", "17": "But we will <span class=\"wl wl-kjv\" data-code=\"H6213\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> whatsoever <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of our own <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4446\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and to pour <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings</span> unto her, as we have <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> we, and our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> our <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> and our <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> for then had we <span class=\"wl wl-kjv\" data-code=\"H7646\">plenty</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">victuals,</span> and were <span class=\"wl wl-kjv\" data-code=\"H2896\">well,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> no evil.", "18": "But since we left <span class=\"wl wl-kjv\" data-code=\"H2308\">off</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> to the <span class=\"wl wl-kjv\" data-code=\"H4446\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and to pour <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings</span> unto her, we have <span class=\"wl wl-kjv\" data-code=\"H2637\">wanted</span> all things, and have been <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> and by the famine.", "19": "And when we burned <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> to the <span class=\"wl wl-kjv\" data-code=\"H4446\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and poured <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings</span> unto her, did we <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> her <span class=\"wl wl-kjv\" data-code=\"H3561\">cakes</span> to <span class=\"wl wl-kjv\" data-code=\"H6087\">worship</span> her, and pour <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H1107\">without</span> our men?", "20": "Then <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> to the <span class=\"wl wl-kjv\" data-code=\"H1397\">men,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> which had given him that <span class=\"wl wl-kjv\" data-code=\"H1697\">answer,</span> saying,", "21": "The <span class=\"wl wl-kjv\" data-code=\"H7002\">incense</span> that ye <span class=\"wl wl-kjv\" data-code=\"H6999\">burned</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> ye, and your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> your <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> and your <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> did not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5927\">came</span> it not into his mind?", "22": "So that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> no longer <span class=\"wl wl-kjv\" data-code=\"H5375\">bear,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H7455\">evil</span> of your <span class=\"wl wl-kjv\" data-code=\"H4611\">doings,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> which ye have <span class=\"wl wl-kjv\" data-code=\"H6213\">committed;</span> therefore is your <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> a <span class=\"wl wl-kjv\" data-code=\"H2723\">desolation,</span> and an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7045\">curse,</span> without an <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant,</span> as at this day.", "23": "<span class=\"wl wl-kjv\" data-code=\"H6440\">Because</span> ye have burned <span class=\"wl wl-kjv\" data-code=\"H6999\">incense,</span> and because ye have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and have not <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in his <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> nor in his <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> nor in his <span class=\"wl wl-kjv\" data-code=\"H5715\">testimonies;</span> therefore this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> is <span class=\"wl wl-kjv\" data-code=\"H7122\">happened</span> unto you, as at this day.", "24": "Moreover <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> that are in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt:", "25": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying;</span> Ye and your <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> have both <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> with your <span class=\"wl wl-kjv\" data-code=\"H6310\">mouths,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled</span> with your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> We will <span class=\"wl wl-kjv\" data-code=\"H6213\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">perform</span> our <span class=\"wl wl-kjv\" data-code=\"H5088\">vows</span> that we have <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed,</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> to the <span class=\"wl wl-kjv\" data-code=\"H4446\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and to pour <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings</span> unto her: ye will <span class=\"wl wl-kjv\" data-code=\"H6965\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">accomplish</span> your <span class=\"wl wl-kjv\" data-code=\"H5088\">vows,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">perform</span> your vows.", "26": "Therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> ye the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> Behold, I have <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> by my <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> shall no more be <span class=\"wl wl-kjv\" data-code=\"H7121\">named</span> in the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> in all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> liveth.", "27": "Behold, I will <span class=\"wl wl-kjv\" data-code=\"H8245\">watch</span> over them for <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and not for <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> that are in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> and by the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> until there be an end", "28": "Yet a <span class=\"wl wl-kjv\" data-code=\"H4962\">small</span> <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> that <span class=\"wl wl-kjv\" data-code=\"H6412\">escape</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> shall return <span class=\"wl wl-kjv\" data-code=\"H7725\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> that are <span class=\"wl wl-kjv\" data-code=\"H935\">gone</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> to <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn</span> there, shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> whose <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> shall stand,", "29": "And this shall be a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> unto you, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> you in this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that my <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> shall <span class=\"wl wl-kjv\" data-code=\"H6965\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">stand</span> against you for evil:", "30": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H6548\">Pharaohhophra</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">life;</span> as I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> his <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> and that <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> his life."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
