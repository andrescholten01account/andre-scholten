}},"vertalingen":{"SVnu":{"1":"Het woord dat tot Jeremia gekomen is van de HEERE, in het tiende jaar van Zedekia, koning van Juda; dit jaar was het achttiende jaar van Nebukadnezar.","2":"(Het leger van de koning van Babel belegerde toen Jeruzalem, en de profeet Jeremia zat opgesloten in het voorhof van de bewaking, dat bij het huis van de koning van Juda is.","3":"Want Zedekia, de koning van Juda, had hem opgesloten en gezegd: Waarom profeteert u en zegt u: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal haar innemen;","4":"En Zedekia, de koning van Juda, zal aan de hand van de Chaldeeën niet ontkomen; maar hij zal zeker gegeven worden in de hand van de koning van Babel, en zijn mond zal tot diens mond spreken, en zijn ogen zullen diens ogen zien;","5":"En hij zal Zedekia naar Babel voeren, en daar zal hij zijn, totdat Ik hem bezoek[1], spreekt de HEERE; ofschoon u tegen de Chaldeeën strijdt, u zult *toch* geen geluk hebben.)","6":"Jeremia dan zei: Het woord van de HEERE is tot mij gekomen, en het zei:","7":"Zie, Hanameel, de zoon van Sallum, uw oom, zal naar u toe komen en zeggen: Koop voor uzelf mijn veld dat bij Anathoth is, want u hebt het recht van lossing, om het te kopen.","8":"Zo kwam Hanameel, de zoon van mijn oom, naar het woord van de HEERE, tot mij, in het voorhof van de bewaking, en zei tegen mij: Koop toch mijn veld, dat bij Anathoth is, dat in het land van Benjamin is; want u hebt het erfrecht, en u hebt de lossing, koop *het* voor uzelf. Toen merkte ik dat het woord van de HEERE was.","9":"Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.","10":"En ik ondertekende de brief en verzegelde *hem*, en liet *het* door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had.","11":"En ik nam de koopbrief, die verzegeld was *volgens* het gebod en de bepalingen, en de open *brief*;","12":"En ik gaf de koopbrief aan Baruch, de zoon van Nerija, de zoon van Machseja, voor de ogen van Hanameel, de zoon van mijn oom, en voor de ogen van de getuigen die de koopbrief hadden ondertekend; voor de ogen van alle Joden die in het voorhof van de bewaking zaten.","13":"En ik beval Baruch voor hun ogen:","14":"Zo zegt de HEERE van de heerscharen[2], de God van Israël: Neem deze brieven, deze koopbrief, zowel de verzegelde als deze open brief, en doe ze in een aarden vat, opdat zij lange tijd bewaard blijven.","15":"Want zo zegt de HEERE van de heerscharen, de God van Israël: Er zullen weer huizen, en velden, en wijngaarden in dit land gekocht worden.","16":"Vervolgens, nadat ik de koopbrief aan Baruch, de zoon van Nerija, gegeven had, bad ik tot de HEERE:","17":"Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.","18":"U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!","19":"Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.","20":"U, Die tekenen en wonderen gesteld hebt in het land Egypte, tot op deze dag, zowel in Israël als onder *andere* mensen, en U hebt Uzelf een Naam gemaakt, zoals *dat* op deze dag *nog blijkt*!","21":"En U hebt Uw volk Israël uit het land Egypte uitgeleid, door tekenen en door wonderen, en door een sterke hand, en door een uitgestrekte arm, en door grote verschrikking.","22":"En U hebt hun dit land gegeven, dat U hun vaderen gezworen had hun te zullen geven, een land dat overvloeit van melk en honing;","23":"Zij zijn er ook ingekomen en hebben het in erfelijk bezit genomen, maar hebben Uw stem niet gehoorzaamd, en naar Uw wet niet gewandeld; zij hebben niets gedaan van alles wat U hun geboden had te doen; daarom hebt U hun al dit kwaad doen overkomen.","24":"Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet *het*.","25":"Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat *het* door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.","26":"Toen kwam het woord van de HEERE tot Jeremia:","27":"Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?","28":"Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.","29":"En de Chaldeeën, die tegen deze stad strijden, zullen erin komen, en deze stad met vuur aansteken, en zullen haar verbranden, met de huizen op wier daken zij voor Baäl gerookt en aan andere goden drankoffers geofferd hebben, om Mij te vertoornen.","30":"Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE.","31":"Want tot Mijn toorn en tot Mijn grimmigheid is Mij deze stad geweest, vanaf de dag dat zij haar gebouwd hebben tot op deze dag toe; zodat Ik haar van Mijn aangezicht wegdeed;","32":"Vanwege al de boosheid van de kinderen van Israël en van de kinderen van Juda, die zij gedaan hebben om Mij te vertoornen, zij, hun koningen, hun vorsten, hun priesters en hun profeten, en de mannen van Juda, en de inwoners van Jeruzalem;","33":"Die Mij de nek toegekeerd hebben en niet het aangezicht; hoewel Ik hen leerde, vroeg opstaand en lerend, evenwel luisterden zij niet, om tucht aan te nemen;","34":"Maar zij hebben hun afschuwelijke afgoden gezet in het huis dat naar Mijn Naam genoemd is, om dat te verontreinigen.","35":"En zij hebben de hoogten van Baäl gebouwd, die in het dal van de zoon van Hinnom zijn, om hun zonen en hun dochters voor de Molech door *het* *vuur* te laten gaan; wat Ik hun niet geboden heb, en wat niet in Mijn hart is opgekomen, dat zij deze gruwel zouden doen; om Juda te laten zondigen.","36":"En nu, daarom zegt de HEERE, de God van Israël, zo over deze stad, waarvan u zegt: Zij is gegeven in de hand van de koning van Babel, door het zwaard, en door de honger, en door de pest;","37":"Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.","38":"Ja, zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.","39":"En Ik zal hun één hart en één weg geven, om Mij te vrezen alle dagen, hun ten goede, alsook hun kinderen na hen.","40":"En Ik zal een eeuwig verbond met hen sluiten, dat Ik Mij van achter hen niet zal afkeren, opdat Ik hun goeddoe; en Ik zal Mijn vrees in hun hart geven, zodat zij niet van Mij afwijken.","41":"En Ik zal Mij over hen verblijden, dat Ik hun goeddoe; en Ik zal hen trouw in dat land planten, met Mijn hele hart en met Mijn hele ziel.","42":"Want zo zegt de HEERE: Zoals Ik over dit volk al dit grote kwaad gebracht heb, zo zal Ik over hen al het goede brengen dat Ik over hen spreek.","43":"En er zullen velden gekocht worden in dit land, waarvan u zegt: Het is woest, zodat er geen mens of dier in is; het is in de hand van de Chaldeeën gegeven.","44":"Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE."},"SV":{"1":"Het woord, dat tot Jeremia geschied is van den HEERE, in het tiende jaar van Zedekia, koning van Juda; dit jaar was het achttiende jaar van Nebukadnezar.","2":"(Het heir nu des konings van Babel belegerde toen Jeruzalem, en de profeet Jeremia was besloten in het voorhof der bewaring, dat in het huis des konings van Juda is.","3":"Want Zedekia, de koning van Juda, had hem besloten, zeggende: Waarom profeteert gij, zeggende: Zo zegt de HEERE: Ziet, Ik geef deze stad in de hand des konings van Babel, en hij zal ze innemen;","4":"En Zedekia, de koning van Juda, zal van de hand der Chaldeen niet ontkomen; maar hij zal zekerlijk gegeven worden in de hand des konings van Babel, en zijn mond zal tot deszelfs mond spreken, en zijn ogen zullen deszelfs ogen zien;","5":"En hij zal Zedekia naar Babel voeren, en aldaar zal hij zijn, totdat Ik hem bezoek, spreekt de HEERE; ofschoon gijlieden tegen de Chaldeen strijdt, gij zult *toch* geen geluk hebben.)","6":"Jeremia dan zeide: Des HEEREN woord is tot mij geschied, zeggende:","7":"Zie, Hanameel, de zoon van Sallum, uw oom, zal tot u komen, zeggende: Koop u mijn veld, dat bij Anathoth is, want gij hebt het recht van lossing, om te kopen.","8":"Alzo kwam Hanameel, mijns ooms zoon, naar des HEEREN woord, tot mij, in het voorhof der bewaring, en zeide tot mij: Koop toch mijn veld, hetwelk is bij Anathoth, dat in het land van Benjamin is; want gij hebt het erfrecht, en gij hebt de lossing, koop *het* voor u. Toen merkte ik, dat het des HEEREN woord was.","9":"Dies kocht ik van Hanameel, mijns ooms zoon, het veld, dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkelen.","10":"En ik onderschreef den brief en verzegelde *dien*, en deed *het* getuigen betuigen, als ik het geld op de weegschaal gewogen had.","11":"En ik nam den koopbrief, die verzegeld was *naar* het gebod en de inzettingen, en den open *brief*;","12":"En ik gaf den koopbrief aan Baruch, den zoon van Nerija, den zoon van Machseja, voor de ogen van Hanameel, mijns ooms *zoon*, en voor de ogen der getuigen die den koopbrief hadden onderschreven; voor de ogen van al de Joden, die in het voorhof der bewaring zaten.","13":"En ik beval Baruch voor hun ogen, zeggende:","14":"Zo zegt de HEERE der heirscharen, de God Israëls: Neem deze brieven, dezen koopbrief, zo den verzegelden als dezen open brief, en doe ze in een aarden vat, opdat zij vele dagen mogen bestaan.","15":"Want zo zegt de HEERE der heirscharen, de God Israëls: Er zullen nog huizen, en velden, en wijngaarden in dit land gekocht worden.","16":"Voorts, nadat ik den koopbrief aan Baruch, den zoon van Nerija, gegeven had, bad ik tot den HEERE, zeggende:","17":"Ach, Heere HEERE! Zie, Gij hebt de hemelen en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekten arm; geen ding is U te wonderlijk.","18":"Gij, Die goedertierenheid doet aan duizenden, en de ongerechtigheid der vaderen vergeldt in den schoot hunner kinderen na hen; Gij grote, Gij geweldige God, Wiens Naam is HEERE der heirscharen!","19":"Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen der mensenkinderen, om een iegelijk te geven naar zijn wegen, en naar de vrucht zijner handelingen.","20":"Gij, Die tekenen en wonderen gesteld hebt in Egypteland, tot op dezen dag, zo in Israël, als onder *andere* mensen, en hebt U een Naam gemaakt, als Hij is te dezen dage!","21":"En hebt Uw volk Israël uit Egypteland uitgevoerd, door tekenen en door wonderen, en door een sterke hand, en door een uitgestrekten arm, en door grote verschrikking.","22":"En hebt hun dit land gegeven, dat Gij hun vaderen gezworen hadt hun te zullen geven, een land vloeiende van melk en honig;","23":"Zij zijn er ook ingekomen en hebben het erfelijk bezeten, maar hebben Uwer stem niet gehoorzaamd, en in Uw wet niet gewandeld; zij hebben niets gedaan van alles, wat Gij hun geboden hadt te doen; dies hebt Gij hun al dit kwaad doen bejegenen.","24":"Zie, de wallen! zij zijn gekomen aan de stad, om die in te nemen, en de stad is gegeven in de hand der Chaldeen, die tegen haar strijden; vanwege het zwaard en den honger en de pestilentie; en wat Gij gesproken hebt, is geschied, en zie, Gij ziet *het*.","25":"Evenwel hebt Gij tot mij gezegd, Heere HEERE! koop u dat veld voor geld, en doe *het* getuigen betuigen; daar de stad in der Chaldeen hand gegeven is.","26":"Toen geschiedde des HEEREN woord tot Jeremia, zeggende:","27":"Zie, Ik ben de HEERE, de God van alle vlees; zou Mij enig ding te wonderlijk zijn?","28":"Daarom zegt de HEERE alzo: Zie, Ik geef deze stad in de hand der Chaldeen, en in de hand van Nebukadnezar, den koning van Babel, en hij zal ze innemen.","29":"En de Chaldeen, die tegen deze stad strijden, zullen er inkomen, en deze stad met vuur aansteken, en zullen ze verbranden, met de huizen, op welker daken zij aan Baäl gerookt, en anderen goden drankofferen geofferd hebben, om Mij te vertoornen.","30":"Want de kinderen Israëls en de kinderen van Juda hebben van hun jeugd aan alleenlijk gedaan, dat kwaad was in Mijn ogen; want de kinderen Israëls hebben Mij door het werk hunner handen alleenlijk vertoornd, spreekt de HEERE.","31":"Want tot Mijn toorn en tot Mijn grimmigheid is Mij deze stad geweest, van den dag af, dat zij haar gebouwd hebben, tot op dezen dag toe; opdat Ik haar van Mijn aangezicht wegdeed;","32":"Om al de boosheid der kinderen Israëls en der kinderen van Juda, die zij gedaan hebben om Mij te vertoornen, zij, hun koningen, hun vorsten, hun priesteren, en hun profeten, en de mannen van Juda, en de inwoners van Jeruzalem;","33":"Die Mij den nek hebben toegekeerd en niet het aangezicht; hoewel Ik hen leerde, vroeg op zijnde en lerende, evenwel hoorden zij niet, om tucht aan te nemen;","34":"Maar zij hebben hun verfoeiselen gesteld in het huis, dat naar Mijn Naam genoemd is, om dat te verontreinigen.","35":"En zij hebben de hoogten van Baäl gebouwd, die in het dal des zoons van Hinnom zijn, om hun zonen en hun dochteren den Molech door *het* *vuur* te laten gaan; hetwelk Ik hun niet heb geboden, noch in Mijn hart is opgekomen, dat zij dezen gruwel zouden doen; opdat zij Juda mochten doen zondigen.","36":"En nu, daarom zegt de HEERE, de God Israëls, alzo van deze stad, waar gij van zegt: Zij is gegeven in de hand des konings van Babel, door het zwaard, en door den honger, en door de pestilentie;","37":"Ziet, Ik zal hen vergaderen uit al de landen, waarhenen Ik hen zal verdreven hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen tot deze plaats wederbrengen, en zal hen zeker doen wonen.","38":"Ja, zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.","39":"En Ik zal hun enerlei hart en enerlei weg geven, om Mij te vrezen al de dagen, hun ten goede, mitsgaders hun kinderen na hen.","40":"En Ik zal een eeuwig verbond met hen maken, dat Ik van achter hen niet zal afkeren, opdat Ik hun weldoe; en Ik zal Mijn vreze in hun hart geven, dat zij niet van Mij afwijken.","41":"En Ik zal Mij over hen verblijden, dat Ik hun weldoe; en Ik zal hen getrouwelijk in dat land planten, met Mijn ganse hart en met Mijn ganse ziel.","42":"Want zo zegt de HEERE: Gelijk als Ik over dit volk gebracht heb al dit grote kwaad, alzo zal Ik over hen brengen al het goede, dat Ik over hen spreke.","43":"En er zullen velden gekocht worden in dit land, waarvan gij zegt: Het is woest, dat er geen mens noch beest in is; het is in der Chaldeen hand gegeven.","44":"Velden zal men voor geld kopen, en de brieven onderschrijven, en verzegelen, en getuigen doen betuigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden der laagte, en in de steden van het zuiden; want Ik zal hun gevangenis wenden, spreekt de HEERE."},"KJV":{"1":"The word that came to Jeremiah from the LORD in the tenth year of Zedekiah king of Judah, which *was* the eighteenth year of Nebuchadrezzar.","2":"For then the king of Babylon's army besieged Jerusalem: and Jeremiah the prophet was shut up in the court of the prison, which *was* in the king of Judah's house.","3":"For Zedekiah king of Judah had shut him up, saying, Wherefore dost thou prophesy, and say, Thus saith the LORD, Behold, I will give this city into the hand of the king of Babylon, and he shall take","4":"And Zedekiah king of Judah shall not escape out of the hand of the Chaldeans, but shall surely be delivered into the hand of the king of Babylon, and shall speak with him mouth to mouth, and his eyes shall behold his eyes;","5":"And he shall lead Zedekiah to Babylon, and there shall he be until I visit him, saith the LORD: though ye fight with the Chaldeans, ye shall not prosper.","6":"And Jeremiah said, The word of the LORD came unto me, saying,","7":"Behold, Hanameel the son of Shallum thine uncle shall come unto thee, saying, Buy thee my field that *is* in Anathoth: for the right of redemption *is* thine to buy","8":"So Hanameel mine uncle's son came to me in the court of the prison according to the word of the LORD, and said unto me, Buy my field, I pray thee, that *is* in Anathoth, which *is* in the country of Benjamin: for the right of inheritance *is* thine, and the redemption *is* thine; buy *it* for thyself. Then I knew that this *was* the word of the LORD.","9":"And I bought the field of Hanameel my uncle's son, that *was* in Anathoth, and weighed him the money, *even* seventeen shekels of silver.","10":"And I subscribed the evidence, and sealed *it*, and took witnesses, and weighed *him* the money in the balances.","11":"So I took the evidence of the purchase, *both* that which was sealed *according* to the law and custom, and that which was open:","12":"And I gave the evidence of the purchase unto Baruch the son of Neriah, the son of Maaseiah, in the sight of Hanameel mine uncle's *son*, and in the presence of the witnesses that subscribed the book of the purchase, before all the Jews that sat in the court of the prison.","13":"And I charged Baruch before them, saying,","14":"Thus saith the LORD of hosts, the God of Israel; Take these evidences, this evidence of the purchase, both which is sealed, and this evidence which is open; and put them in an earthen vessel, that they may continue many days.","15":"For thus saith the LORD of hosts, the God of Israel; Houses and fields and vineyards shall be possessed again in this land.","16":"Now when I had delivered the evidence of the purchase unto Baruch the son of Neriah, I prayed unto the LORD, saying,","17":"Ah Lord GOD! behold, thou hast made the heaven and the earth by thy great power and stretched out arm, *and* there is nothing too hard","18":"Thou shewest lovingkindness unto thousands, and recompensest the iniquity of the fathers into the bosom of their children after them: the Great, the Mighty God, the LORD of hosts, *is* his name,","19":"Great in counsel, and mighty in work: for thine eyes *are* open upon all the ways of the sons of men: to give every one according to his ways, and according to the fruit of his doings:","20":"Which hast set signs and wonders in the land of Egypt, *even* unto this day, and in Israel, and among *other* men; and hast made thee a name, as at this day;","21":"And hast brought forth thy people Israel out of the land of Egypt with signs, and with wonders, and with a strong hand, and with a stretched out arm, and with great terror;","22":"And hast given them this land, which thou didst swear to their fathers to give them, a land flowing with milk and honey;","23":"And they came in, and possessed it; but they obeyed not thy voice, neither walked in thy law; they have done nothing of all that thou commandedst them to do: therefore thou hast caused all this evil to come","24":"Behold the mounts, they are come unto the city to take it; and the city is given into the hand of the Chaldeans, that fight against it, because of the sword, and of the famine, and of the pestilence: and what thou hast spoken is come to pass; and, behold, thou seest","25":"And thou hast said unto me, O Lord GOD, Buy thee the field for money, and take witnesses; for the city is given into the hand of the Chaldeans.","26":"Then came the word of the LORD unto Jeremiah, saying,","27":"Behold, I *am* the LORD, the God of all flesh: is there any thing too hard","28":"Therefore thus saith the LORD; Behold, I will give this city into the hand of the Chaldeans, and into the hand of Nebuchadrezzar king of Babylon, and he shall take","29":"And the Chaldeans, that fight against this city, shall come and set fire on this city, and burn it with the houses, upon whose roofs they have offered incense unto Baal, and poured out drink offerings unto other gods, to provoke me to anger.","30":"For the children of Israel and the children of Judah have only done evil before me from their youth: for the children of Israel have only provoked me to anger with the work of their hands, saith the LORD.","31":"For this city hath been to me *as* a provocation of mine anger and of my fury from the day that they built it even unto this day; that I should remove it from before my face,","32":"Because of all the evil of the children of Israel and of the children of Judah, which they have done to provoke me to anger, they, their kings, their princes, their priests, and their prophets, and the men of Judah, and the inhabitants of Jerusalem.","33":"And they have turned unto me the back, and not the face: though I taught them, rising up early and teaching *them*, yet they have not hearkened to receive instruction.","34":"But they set their abominations in the house, which is called by my name, to defile","35":"And they built the high places of Baal, which *are* in the valley of the son of Hinnom, to cause their sons and their daughters to pass through *the fire* unto Molech; which I commanded them not, neither came it into my mind, that they should do this abomination, to cause Judah to sin.","36":"And now therefore thus saith the LORD, the God of Israel, concerning this city, whereof ye say, It shall be delivered into the hand of the king of Babylon by the sword, and by the famine, and by the pestilence;","37":"Behold, I will gather them out of all countries, whither I have driven them in mine anger, and in my fury, and in great wrath; and I will bring them again unto this place, and I will cause them to dwell safely:","38":"And they shall be my people, and I will be their God:","39":"And I will give them one heart, and one way, that they may fear me for ever, for the good of them, and of their children after","40":"And I will make an everlasting covenant with them, that I will not turn away from them, to do them good; but I will put my fear in their hearts, that they shall not depart","41":"Yea, I will rejoice over them to do them good, and I will plant them in this land assuredly with my whole heart and with my whole soul.","42":"For thus saith the LORD; Like as I have brought all this great evil upon this people, so will I bring upon them all the good that I have promised","43":"And fields shall be bought in this land, whereof ye say, *It is* desolate without man or beast; it is given into the hand of the Chaldeans.","44":"Men shall buy fields for money, and subscribe evidences, and seal *them*, and take witnesses in the land of Benjamin, and in the places about Jerusalem, and in the cities of Judah, and in the cities of the mountains, and in the cities of the valley, and in the cities of the south: for I will cause their captivity to return, saith the LORD."}},"tsk":{"1":[{"kopje":"in het","refs":["Jer 39:1","Jer 39:2","Jer 52:4","Jer 52:5","2 Kon 25:1","2 Kon 25:2","2 Kron 36:11"]},{"kopje":"het achttiende","refs":["Jer 25:1"]}],"2":[{"kopje":"Toen","refs":["2 Kon 25:18"]},{"kopje":"Jeremia","refs":["Jer 32:3","Jer 32:8","Jer 33:1","Jer 36:5","Jer 37:21","Jer 38:6","Jer 39:13-15","Matt 5:12"]},{"kopje":"in het","refs":["Neh 3:25"]}],"3":[{"kopje":"Zedekia","refs":["Jer 2:30","Jer 5:3","2 Kon 6:31","2 Kon 6:32","2 Kron 28:22"]},{"kopje":"Waarom","refs":["Jer 26:8","Jer de=\"H3063\">Judah</span> shall not <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> but shall <span class=\"wl wl-kjv\" data-code=\"H5414\">surely</span> be <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> with him <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> to <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> his eyes;","5":"And he shall <span class=\"wl wl-kjv\" data-code=\"H3212\">lead</span> <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> to <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and there shall he be until I <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> him, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> though ye <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> ye shall not prosper.","6":"And <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","7":"Behold, <span class=\"wl wl-kjv\" data-code=\"H2601\">Hanameel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7967\">Shallum</span> thine <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7069\">Buy</span> thee my <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> that is in <span class=\"wl wl-kjv\" data-code=\"H6068\">Anathoth:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4941\">right</span> of <span class=\"wl wl-kjv\" data-code=\"H1353\">redemption</span> is thine to buy","8":"So <span class=\"wl wl-kjv\" data-code=\"H2601\">Hanameel</span> mine <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to me in the <span class=\"wl wl-kjv\" data-code=\"H2691\">court</span> of the <span class=\"wl wl-kjv\" data-code=\"H4307\">prison</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H7069\">Buy</span> my <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> I pray thee, that is in <span class=\"wl wl-kjv\" data-code=\"H6068\">Anathoth,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4941\">right</span> of <span class=\"wl wl-kjv\" data-code=\"H3425\">inheritance</span> is thine, and the <span class=\"wl wl-kjv\" data-code=\"H1353\">redemption</span> is thine; <span class=\"wl wl-kjv\" data-code=\"H7069\">buy</span> it for thyself. Then I <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> that this was the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the LORD.","9":"And I <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H2601\">Hanameel</span> my <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> that was in <span class=\"wl wl-kjv\" data-code=\"H6068\">Anathoth,</span> and <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> him the <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> even <span class=\"wl wl-kjv\" data-code=\"H7651\">seventeen</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of silver.","10":"And I <span class=\"wl wl-kjv\" data-code=\"H3789\">subscribed</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">evidence,</span> and <span class=\"wl wl-kjv\" data-code=\"H2856\">sealed</span> it, and <span class=\"wl wl-kjv\" data-code=\"H5749\">took</span> <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses,</span> and <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> him the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> in the balances.","11":"So I <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">evidence</span> of the <span class=\"wl wl-kjv\" data-code=\"H4736\">purchase,</span> both that which was <span class=\"wl wl-kjv\" data-code=\"H2856\">sealed</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4687\">law</span> and <span class=\"wl wl-kjv\" data-code=\"H2706\">custom,</span> and that which was open:","12":"And I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">evidence</span> of the <span class=\"wl wl-kjv\" data-code=\"H4736\">purchase</span> unto <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5374\">Neriah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4271\">Maaseiah,</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of <span class=\"wl wl-kjv\" data-code=\"H2601\">Hanameel</span> mine <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle's</span> son, and in the <span class=\"wl wl-kjv\" data-code=\"H5869\">presence</span> of the <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses</span> that <span class=\"wl wl-kjv\" data-code=\"H3789\">subscribed</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H4736\">purchase,</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">before</span> all the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in the <span class=\"wl wl-kjv\" data-code=\"H2691\">court</span> of the prison.","13":"And I <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">before</span> them, saying,","14":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> these <span class=\"wl wl-kjv\" data-code=\"H5612\">evidences,</span> this <span class=\"wl wl-kjv\" data-code=\"H5612\">evidence</span> of the <span class=\"wl wl-kjv\" data-code=\"H4736\">purchase,</span> both which is <span class=\"wl wl-kjv\" data-code=\"H2856\">sealed,</span> and this <span class=\"wl wl-kjv\" data-code=\"H5612\">evidence</span> which is <span class=\"wl wl-kjv\" data-code=\"H1540\">open;</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> them in an <span class=\"wl wl-kjv\" data-code=\"H2789\">earthen</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H5975\">continue</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> days.","15":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">Houses</span> and <span class=\"wl wl-kjv\" data-code=\"H7704\">fields</span> and <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards</span> shall be possessed <span class=\"wl wl-kjv\" data-code=\"H7069\">again</span> in this land.","16":"Now <span class=\"wl wl-kjv\" data-code=\"H310\">when</span> I had <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">evidence</span> of the <span class=\"wl wl-kjv\" data-code=\"H4736\">purchase</span> unto <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5374\">Neriah,</span> I <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> saying,","17":"<span class=\"wl wl-kjv\" data-code=\"H162\">Ah</span> <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD!</span> behold, thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> by thy <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> and stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> <span class=\"wl wl-kjv\" data-code=\"H2220\">arm,</span> and there is <span class=\"wl wl-kjv\" data-code=\"H1697\">nothing</span> too hard","18":"Thou <span class=\"wl wl-kjv\" data-code=\"H6213\">shewest</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">lovingkindness</span> unto <span class=\"wl wl-kjv\" data-code=\"H505\">thousands,</span> and <span class=\"wl wl-kjv\" data-code=\"H7999\">recompensest</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> into the <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom</span> of their <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them: the <span class=\"wl wl-kjv\" data-code=\"H1419\">Great,</span> the <span class=\"wl wl-kjv\" data-code=\"H1368\">Mighty</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> is his name,","19":"<span class=\"wl wl-kjv\" data-code=\"H1419\">Great</span> in <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel,</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">mighty</span> in <span class=\"wl wl-kjv\" data-code=\"H5950\">work:</span> for thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> are <span class=\"wl wl-kjv\" data-code=\"H6491\">open</span> upon all the <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men:</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> according to his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and according to the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of his doings:","20":"Which hast <span class=\"wl wl-kjv\" data-cod eft niets anders gedaan dan dat diende om mijn toorn en grimmigheid te verwekken, daarover zijn zij [gelijk men zegt] altijd uit geweest, daarop hebben zij toegelegd. Anders: in mijnen toorn; dat is, Ik ben op hen vertoornd geweest, enz."}],"32":[{"catchword":"mannen van Juda,","tekst":"Hebreeuws, man; gelijk boven Jer 4:3 ."}],"33":[{"catchword":"nek hebben toegekeerd","tekst":"Zie boven Jer 2:27 ."},{"catchword":"vroeg op zijnde","tekst":"Zie boven Jer 7:13 ."},{"catchword":"tucht aan te nemen;","tekst":"Zie Pro 1:2 , enz."}],"34":[{"catchword":"verfoeiselen gesteld","tekst":"Zie boven Jer 4:1 ."},{"catchword":"huis,","tekst":"Den tempel."},{"catchword":"dat naar Mijn Naam genoemd is,","tekst":"Gelijk boven Jer 7:31 ."}],"35":[{"catchword":"En zij hebben","tekst":"Zie boven Jer 7:10 , met de aantekening."},{"catchword":"Molech","tekst":"Dat is, ten dienste en ter ere van dezen afgod. Zie Lev 18:21 ."},{"catchword":"in Mijn hart is opgekomen,","tekst":"Zie boven Jer 7:31 ."}],"36":[{"catchword":"gegeven in de hand des konings van Babel,","tekst":"Gelijk boven vs.24."}],"37":[{"catchword":"vergaderen uit al de landen,","tekst":"Te weten mijn volk."},{"catchword":"zeker doen wonen","tekst":"Hebreeuws, in zekerheid, of in vertrouwen; dat is gerust, zeker en veilig, gelijk elders dikwijls."}],"38":[{"catchword":"volk zijn,","tekst":"Gelijk boven Jer 30:22 , en Jer 31:1 , Jer 31:33 ."}],"39":[{"catchword":"enerlei hart","tekst":"Ik zal door mijn Geest alzo in de harten van mijne uitverkorenen werken, dat zij door een geloof en een godsdienst in liefde aan elkander zullen verbonden en verenigd zijn."},{"catchword":"weg geven,","tekst":"Dat is, enerlei godsdienst of religie, enerlei manier of wijze van geloof en leven, zie Isa 30:21 , en Isa 35:8 ; boven Jer 6:16 ; Mat 22:16 ; Act 9:2 , en Act 18:25-26 , enz."},{"catchword":"goede,","tekst":"Dat is, tot hun best, heil en zaligheid."}],"40":[{"catchword":"maken,","tekst":"Gelijk boven Jer 31:31 , enz."},{"catchword":"van achter hen","tekst":"Dat is, dat Ik hen nimmermeer zal verlaten, maar zal geduriglijk bij hen wonen en hen volgen met mijne weldadigheid; zie boven Jer 31:33 , en vergelijk wijders Rom 8:30 ; 1Pe 1:5 , 1Pe 1:9 ; 1Jo 2:19-20 , 1Jo 2:27 , en 1Jo 3:9 , en 1Jo 5:18 ."}],"41":[{"catchword":"Mij over hen verblijden,","tekst":"Vergelijk Deu 30:9 ."},{"catchword":"getrouwelijk in dat land planten,","tekst":"Hebreeuws, in, of met getrouwheid, of waarheid."}],"42":[{"catchword":"kwaad,","tekst":"Te weten der straf; dat is, ellende, ongeluk, tegenspoed."},{"catchword":"spreke","tekst":"Dat is, hun beloof, of beloofd heb."}],"43":[{"catchword":"velden gekocht worden","tekst":"Hebreeuws, een veld zal, enz.; dat is, velden, gelijk in vs.44."},{"catchword":"zegt","tekst":"Dat is, alsdan zult gij zeggen, als het zal verwoest zijn; alzo onder Jer 33:10 ."},{"catchword":"gegeven","tekst":"Gelijk boven vs.24."}],"44":[{"catchword":"zal men voor geld kopen,","tekst":"Hebreeuws, zullen zij, enz. gelijk dikwijls."},{"catchword":"onderschrijven,","tekst":"Zie boven vs.10, 12."},{"catchword":"Benjamin,","tekst":"Vergelijk boven Jer 17:26 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The word came to Jeremiah from the Lord [which is related in the seventh verse following] in the tenth year of Zedekiah king of Judah this year was the eighteenth year of Nebuchadnezzar."}],"2":[{"catchword":null,"tekst":"Now the King of Babel army besieged then Jerusalem and the prophet Jeremiah was shut up in court in custody [so below verse 8.12 and 33.1 this was the easier freer larger prison than garrison house was see Below chapter 37.15,18,20,21] which is the king of Judah&acirc;&euro;&trade;s house."}],"3":[{"catchword":null,"tekst":"Zedekiah king of Judah has shut him up saying wherefore dost thou prophesy saying thus saith the Lord behold I will give this city into the hand of Babel and he shall take it."}],"4":[{"catchword":null,"tekst":"And Zedekiah king of Judah shall not escape out of the hand of chaldeans [Babylonians] but he shall surely be delivered [Hebrew being delivered be delivered ] into the hand of king of Babel and his mouth shall speak to his mouth [that is they shall speak with one another mouth to mouth as we use to say compare below chapter 34.3,4 and see the accomplishment chapter 39.5c and 52.9] and his eyes shall behold his eyes."}],"5":[{"catchword":null,"tekst":"And he shall carry Zedekiah to Babel and he be [that is continue as above chapter 27.22 ]until I visit him saith the Lord [that is shew mercy on him that is he perish by the sword but die in peace and be honorable buried so chapter 34.4,5 and Genesis 21 on verse 1] thou you fight against the Chaldeans yet you shall not prosper."}],"6":[{"catchword":null,"tekst":"Jeremiah then saith and the word of the Lord then came unto me saying:"}],"7":[{"catchword":null,"tekst":"Behold Hananeel the son of Salome their uncle will come unto thee saying buy thee my field [of the field of the Levites see numbers 35 on verse 2] that is the Anathoth for thou hast the right of redemption [see Ruth 2 on verse 20] to buy it understand with all Gods command to Jeremiah to buy that the field at that time of him as the sequel sheweth.]"}],"8":[{"catchword":null,"tekst":"So Hananeel mine uncles son came to me in court of the ward according to the word of the Lord and saith unto me buy my field I pray thee that is by the Anathoth which is in the land of Benjamin for thou hast the right of inheritance and thou hast the right of redemption buy it for thyself then I perceived that it was the word of the Lord [ that is that was done according to the word of the Lord.]"}],"9":[{"catchword":null,"tekst":"Therefore I bought the field of Hananeel mine uncles and sons which is by Anathoth and I weight unto them the money[ see Genesis 23 on verse 16] seventh silvers shekels [Heb have seven shekels and ten of silver of the silver shekels see Genesis 20 on verse 16.]"}],"10":[{"catchword":null,"tekst":"And I subscribed the letter [to wit the bond or bill of sale and purchase as followeth Heb properly I wrote in a letter that is subscribed signed it as appeareth verse 12] and sealed it and caused witness to it [to wit by subscribing or setting their hands to it as verse 12 so below verse 25.44 for which we use to say to make witnesses [when I had weighed the money in the balance."}],"11":[{"catchword":null,"tekst":"And I took the letter of the purchase which was sealed and according to the command and statutes and the open letter [as verse 14 whereby some understand a copy or draught transcript of the letter of the purchase others understand it a patent of retification or public decree magistrate to the confirmation of this bargain and sale in all singular and its circumstance others understand it of a letter which tend to give notice to everyone of the bargain and sale that was made .]"}],"12":[{"catchword":null,"tekst":"And I gave the letter of purchase to Baruch [the scribe and minister of prophet Jeremiah see below chapter 36.4,5c.] the son of Nereja the son of Maseejah before the eyes of Hananeel mine uncles son [ this word is here inserted from verse 7,8,9 others my cousins because the Hebrew word Dod is sometimes also taken more largely even for a dear and very loving friend as appeareth from Solomon&acirc;&euro;&trade;s songs and before the eyes of the witnesses which hath subscribed to the letter of the purchases [as above verse 10] before the eyes of all the Jews that sate [or dwelt] in the court of the ward."}],"13":[{"catchword":null,"tekst":"And I charged Baruch before their eyes [that is in their presence as above often.]"}],"14":[{"catchword":null,"tekst":"Thus saith the Lord of hosts the God of Israel take these letters this letter of purchase both the sealed letter and this open letter see on verse 11] and put them in an earthen vessel that they may abide many days [that is that they may last a long time .]"}],"15":[{"catchword":null,"tekst":"For thus saith the Lord of hosts the God of Israel there shall yet[or again ] houses and fields and vineyard be bought in this land [hence appeared what God intended by his strange translation at the time of Jerusalem siege to wit to assure his people that the Babylonian captivity should have an end and that they should come again into their own country and posses it see below verse 43.44]"}],"16":[{"catchword":null,"tekst":"Moreover after that I have delivered the letter of purchase unto Baruch the son of Nerija I paid unto the Lord saying:"}],"17":[{"catchword":null,"tekst":"Ah Lord behold thou hast made the heavens and the earth by thy great power and by thine outstretched arm [as Exo 6:5c.] nothing is too wonderful for thee[to wit to do so below verse 27 Heb. Properly more wonderful than thou shouldest not be able to do it when thou doest promise it nothing is impossible unto thee compare Genesis 18 on verse 17 with the annotate Luk 1:37 and Mat 17:26. This hath respect to the deliverance out of the Babylonians captivity which with men seemed to be a think impossible. Compare Ezech. 37.3.11,12, &c.]"}],"18":[{"catchword":null,"tekst":"Thou that shewest loving kindness unto thousands, [Compare Exo 34:7.] and recompensest the iniquity of the fathers into the bosom of their Children, [See Psalm 79. on vers.12. to wit, of such children, that are partakers of the sins of their fathers, and do follow their foot-steps. See Exod 20.5,6.] after them: thou great, thou mighty God, whose name is the LORD of bosts. [as above chap.31.35. See I Kings 18.on vers.15.]"}],"19":[{"catchword":null,"tekst":"Great in counsel, and mighty in deed: [Compare Isa.28,29.] for thine eyes [this signifieth sometimes Gods special care for his people, as I Kings 8.on vers.29. Psalm 32.on vers.8. sometimes Gods providence and reward upon all that happeneth or cometh to pass in the world; as here. Compare Prov. 5.21 and 25.3. also 2 Chron.16. on vers.19.] upon all the wayes [see Genes.6. on vers.12.] of the children of men, to give every one according to his waies and according to the fruit of his dealings.) [see above chap.17. on ver.10.]"}],"20":[{"catchword":null,"tekst":"Thou that hast set tokens and wonders in the land of Egypt, unto this day, [The remembrance whereof continueth unto this day] both in Israel, and amongst (other) men; [Hebr.man; that is, men: as often] and hast made thee a name, as it is at this day."}],"21":[{"catchword":null,"tekst":"And hast brought forth thy people Israel out of the land of Egypt, by tokens, and by wonders, and by a strong hand, and by an out-strecthed arm, and by great terror. [See Exo 6:6. 2 Sam.7.23. I Chron.17.21.]"}],"22":[{"catchword":null,"tekst":"And hast given them this land, which thou didst swear to their fathers to give them; a land flowing with milk and honey. [See Exod.3. on vers.8.]"}],"23":[{"catchword":null,"tekst":"They also came in, and possessed it hereditarily, but obeyed not thy voice, neither walked i thy law; they ave done nothing of all, that thou hadst commanded them to do: [Hebr.all that thou, &c. they have not done; that is, they have done nothing of that which thou hadst commaned them. See I Kings 11. on ver.34.] Therefore thou hadst caused all this evil [of punishment] to meet them."}],"24":[{"catchword":null,"tekst":"Behold the walls [Mounts, trenches, and other works raised by thy enemy, buswarks, fortresses, without the City. See 2 Sam.20. on vers.15. Some understand other warlike instruments, set up, and serving to break and batter down walls and great strong buildings, or out of and from them to annoy and hurt the enemy with all manner of offenssive weapons. Compare below chap. 33.4.] they are come unto the City to take it, and the City is given [so vers.25,36,43. That is, it is as good (as we say) as given, it shall be affuredly given: affaires stand so within the City, as that a man may palpably perceive, that thy word is true in every particular and consequently shall be performed, as followeth] into the band of the Chaldeans that fight against it; because of the sword, and the famine, and the pestilence: and what thou hast spoken, is come to pass, and behold, thou seest (it.)"}],"25":[{"catchword":null,"tekst":"Nevertheless thou hast said unto me, Lord LORD; Buy thee the field for money and cause witnesses to witness (it: ) whereas the City is given into the hand of the Chaldeans! [As if he had said, This is a strange and wonderful thing to mans apprehension.]"}],"26":[{"catchword":null,"tekst":"Then came the word of the LORD unto Jeremia, saying;"}],"27":[{"catchword":null,"tekst":"Behold, I am the LORD, the God of all flesh; [See Genes.6. on vers.2. and Numb.16. on ver.22.] should any thing be to wonderful for me? [see above on vers.17.]"}],"28":[{"catchword":null,"tekst":"Therefore thus saith the LORD: Behold, I give this City into the hand of the Chaldeans, and unto the hand of Nebucadnezar the King of Babel; and he shall take it."}],"29":[{"catchword":null,"tekst":"And the Chaldeans that fight against this City; shall come into it, and set this City on fire, and shall burn it, with the houses, upon whose roofs they have burnt incense unto Baal, and offered drink offerings [As above chap.7.18.] unto other Gods, to anger me. [or, to provoke me. So in the sequel.]"}],"30":[{"catchword":null,"tekst":"For the Children of Israel, and the children of Juda have onely done [That is, done nothing else, but &c.] that which was evil in mine eyes from their youths [see above chap.2. on vers.2.] for the children of Israel have onely provoked me to anger, by the work of their hands, saith the LORD."}],"31":[{"catchword":null,"tekst":"For this City hath been unto me for mine anger, and for my fury, [That is, it hath done nothing else, but that which served to provoke mine anger and fury, that hath been all their practise, all their study. Oth. in mine anger: that is, I was angry with them, &c.] from the day that they built it, unto this day: that I should remove it from my face:"}],"32":[{"catchword":null,"tekst":"For all the wickedness of the children of Israel, and of the children of Juda, which they have committed to provoke me to anger: they, their Kings, their Princes, their Priests, and their Prophets, and the men [Hebr.man, as above chap 4.3.] of Juda, and the inhabitants of Jerusalem:"}],"33":[{"catchword":null,"tekst":"Which have turned the neck unto me, [See above chap.2.27.] and not the face: though I taught them, being up early and teaching, [see above chap.7. on vers.13. and vers.25. and chap.25.3. and 26.5. and 29.19.] nevertheless they hearkned not, to receive disciplines [see Prov.1. on vers.2. &c.]"}],"34":[{"catchword":null,"tekst":"But they set their abominations [See above chap.4. on vers.1.] in the house [the Temple] which is called by my name, [as above chap.7.10.] to defile it."}],"35":[{"catchword":null,"tekst":"And they built the high places of Baal, [See above chap.7.31. with tha annotate.] which are in the valley of the son of Hinnom, to cause their sons and their daughters to pass thorow (the fire) unto Molech; [that is, to the service and honour of this Idol. See Levit. 18.on vers.21.] which I commanded them not, neither came (it ) up into mine heart, [see above chap.7.31.] that they should do this abomination, that they might cause Juda to sin."}],"36":[{"catchword":null,"tekst":"And now therefore, thus saith the God of Israel, concerning, this City, whereof ye say; It is given [As above vers.24.] into the hand of the King of Babel, by the sword, and by the famine, and by the estilence."}],"37":[{"catchword":null,"tekst":"Behold I will gather them [To wit, my people] out of all countries, whithe I shall have driven them in mine anger, and in wrath, and in great indignation: [Compare above chap.23.3. and 29.14. and 31.10.] and I will bring them again into this place, and will cause them to dwell safely. [Hebr. in safety, or, in confidence; that is, quietly, safely, and securely, as elsewhere (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;

bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat

// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
