},"vertalingen":{"SVnu":{"1":"Hoort het woord dat de HEERE tot u spreekt, o huis van Israël!","2":"Zo zegt de HEERE: Leert de weg van de heidenen niet, en schrikt niet van de tekenen van de hemel, omdat de heidenen daarvan schrikken.","3":"Want de inzettingen van de volken zijn ijdelheid; want het is hout, dat men uit het woud gehouwen heeft, een werk van de handen van de werkmeester met de bijl.","4":"Men pronkt het op met zilver en met goud; zij hechten het met spijkers en met hamers, opdat het niet waggelt.","5":"Zij zijn gelijk een palmboom van dicht werk, maar kunnen niet spreken; zij moeten gedragen worden, want zij kunnen niet gaan; vreest niet voor hen, want zij kunnen geen kwaad doen, ook is er geen goeddoen bij hen.","6":"Omdat niemand U gelijk is, o HEERE! zo bent U groot, en groot is Uw Naam in macht.","7":"Wie zou U niet vrezen, Koning van de heidenen? Want het komt U toe; omdat toch onder alle wijzen van de heidenen, en in hun hele koninkrijk, niemand U gelijk is.","8":"In één ding zijn zij toch redeloos en dwaas: een stuk hout is een onderwijs van de ijdelheden.","9":"Uitgerekt zilver wordt van Tarsis gebracht, en goud van Ufaz, *tot* *een* werk van de werkmeester en van de handen van de goudsmid; hemelsblauw en purper is hun kleding, een werk van de wijzen zijn zij allemaal samen.","10":"Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.","11":"(Zo zult u tegen hen zeggen: De goden, die de hemel en de aarde niet gemaakt hebben, zullen vergaan van de aarde, en van onder deze hemel.)","12":"Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid heeft door Zijn verstand.","13":"Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.","14":"Ieder mens is redeloos geworden, zodat hij geen kennis heeft, iedere goudsmid is beschaamd van het gesneden beeld; want zijn gegoten beeld is leugen; en er is geen geest in hen.","15":"Ijdelheid zijn zij, een werk van verleidingen; ten tijde van hun bezoeking zullen zij vergaan.","16":"Jakobs deel is niet gelijk die, want Hij is de Formeerder van alles, en Israël is de roede van Zijn erfenis; HEERE van de heerscharen[1] is Zijn Naam.","17":"Raap uw koopwaar weg uit het land, u inwoonster van de vesting!","18":"Want zo zegt de HEERE: Ziet, Ik zal de inwoners van het land op deze keer wegslingeren, en zal hen benauwen, opdat zij het vinden.","19":"O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!","20":"Mijn tent is verstoord, en al mijn touwen zijn verscheurd; mijn kinderen zijn van mij uitgegaan, en zij zijn er niet; er is niemand meer, die mijn tent uitspant, en mijn gordijnen opricht.","21":"Want de herders zijn redeloos geworden, en hebben de HEERE niet gezocht; daarom hebben zij niet verstandig gehandeld, en hun hele kudde is verstrooid.","22":"Ziet, er komt een stem van het gerucht, en een groot beven uit het land van het noorden; dat men de steden van Juda zal stellen tot een verwoesting, een woning van de draken.","23":"Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.","24":"Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.","25":"Stort Uw grimmigheid uit over de heidenen, die U niet kennen, en over de geslachten, die Uw Naam niet aanroepen; want zij hebben Jakob opgegeten, ja, zij hebben hem opgegeten, en hem verteerd, en zijn woning verwoest."},"SV":{"1":"Hoort het woord, dat de HEERE tot ulieden spreekt, o huis Israëls!","2":"Zo zegt de HEERE: Leert den weg der heidenen niet, en ontzet u niet voor de tekenen des hemels, dewijl zich de heidenen voor dezelve ontzetten.","3":"Want de inzettingen der volken zijn ijdelheid; want het is hout, dat men uit het woud gehouwen heeft, een werk van des werkmeesters handen met de bijl.","4":"Men pronkt het op met zilver en met goud; zij hechten ze met nagelen en met hameren, opdat het niet waggele.","5":"Zij zijn gelijk een palmboom van dicht werk, maar kunnen niet spreken; zij moeten gedragen worden, want zij kunnen niet gaan; vreest niet voor hen, want zij kunnen geen kwaad doen, ook is er geen goeddoen bij hen.","6":"Omdat niemand U gelijk is, o HEERE! zo zijt Gij groot, en groot is Uw Naam in mogendheid.","7":"Wie zou U niet vrezen, Gij Koning der heidenen? Want het komt U toe; omdat toch onder alle wijzen der heidenen, en in hun ganse koninkrijk, niemand U gelijk is.","8":"In een ding zijn zij toch onvernuftig en zot: een hout is een onderwijs der ijdelheden.","9":"Uitgerekt zilver wordt van Tarsis gebracht, en goud van Ufaz, *tot* *een* werk des werkmeesters en van de handen des goudsmids; hemelsblauw en purper is hun kleding, een werk der wijzen zijn zij al te zamen.","10":"Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwig Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.","11":"( Aldus zult gijlieden tot hen zeggen: De goden, die den hemel en de aarde niet gemaakt hebben, zullen vergaan van de aarde, en van onder dezen hemel.)","12":"Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en den hemel uitgebreid door Zijn verstand.","13":"Als Hij Zijn stem geeft, zo is er een gedruis van wateren in den hemel, en Hij doet de dampen opklimmen van het einde der aarde; Hij maakt de bliksemen met den regen, en doet den wind voortkomen uit Zijn schatkameren.","14":"Een ieder mens is onvernuftig geworden, zodat hij geen wetenschap heeft, een ieder goudsmid is beschaamd van het gesneden beeld; want zijn gegoten beeld is leugen; en er is geen geest in hen.","15":"Ijdelheid zijn zij, een werk van verleidingen; ten tijde hunner bezoeking zullen zij vergaan.","16":"Jakobs deel is niet gelijk die, want Hij is de Formeerder van alles, en Israël is de roede Zijner erfenis; HEERE der heirscharen is Zijn Naam.","17":"Raap uw kramerij weg uit het land, gij inwoneres der vesting!","18":"Want zo zegt de HEERE: Ziet, Ik zal de inwoners des lands op ditmaal wegslingeren, en zal ze benauwen, opdat zij het vinden.","19":"O, wee mij over mijn breuk! mijn plage is smartelijk; en ik had gezegd: Dit is immers een krankheid, die ik wel dragen zal!","20":"Mijn tent is verstoord, en al mijn zelen zijn verscheurd; mijn kinderen zijn van mij uitgegaan, en zij zijn er niet; er is niemand meer, die mijn tent uitspant, en mijn gordijnen opricht.","21":"Want de herders zijn onvernuftig geworden, en hebben den HEERE niet gezocht; daarom hebben zij niet verstandiglijk gehandeld, en hun ganse weide is verstrooid.","22":"Ziet, er komt een stem des geruchts, en een groot beven uit het land van het noorden; dat men de steden van Juda zal stellen tot een verwoesting, een woning der draken.","23":"Ik weet, o HEERE! dat bij den mens zijn weg niet is; het is niet bij een man, die wandelt, dat hij zijn gang richte.","24":"Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat Gij mij niet te niet maakt.","25":"Stort Uw grimmigheid uit over de heidenen, die U niet kennen, en over de geslachten, die Uw Naam niet aanroepen; want zij hebben Jakob opgegeten, ja, zij hebben hem opgegeten, en hem verteerd, en zijn woning verwoest."},"KJV":{"1":"Hear ye the word which the LORD speaketh unto you, O house of Israel:","2":"Thus saith the LORD, Learn not the way of the heathen, and be not dismayed at the signs of heaven; for the heathen are dismayed at them.","3":"For the customs of the people *are* vain: for *one* cutteth a tree out of the forest, the work of the hands of the workman, with the axe.","4":"They deck it with silver and with gold; they fasten it with nails and with hammers, that it move","5":"They *are* upright as the palm tree, but speak not: they must needs be borne, because they cannot go. Be not afraid of them; for they cannot do evil, neither also *is it* in them to do good.","6":"Forasmuch as *there is* none like unto thee, O LORD; thou *art* great, and thy name *is* great in might.","7":"Who would not fear thee, O King of nations? for to thee doth it appertain: forasmuch as among all the wise *men* of the nations, and in all their kingdoms,","8":"But they are altogether brutish and foolish: the stock *is* a doctrine of vanities.","9":"Silver spread into plates is brought from Tarshish, and gold from Uphaz, the work of the workman, and of the hands of the founder: blue and purple *is* their clothing: they *are* all the work of cunning","10":"But the LORD *is* the true God, he *is* the living God, and an everlasting king: at his wrath the earth shall tremble, and the nations shall not be able to abide his indignation.","11":"Thus shall ye say unto them, The gods that have not made the heavens and the earth, *even* they shall perish from the earth, and from under these heavens.","12":"He hath made the earth by his power, he hath established the world by his wisdom, and hath stretched out the heavens by his discretion.","13":"When he uttereth his voice, *there is* a multitude of waters in the heavens, and he causeth the vapours to ascend from the ends of the earth; he maketh lightnings with rain, and bringeth forth the wind out of his treasures.","14":"Every man is brutish in *his* knowledge: every founder is confounded by the graven image: for his molten image *is* falsehood, and *there is* no breath","15":"They *are* vanity, *and* the work of errors: in the time of their visitation they shall perish.","16":"The portion of Jacob *is* not like them: for he *is* the former of all *things*; and Israel *is* the rod of his inheritance: The LORD of hosts *is* his name.","17":"Gather up thy wares out of the land, O inhabitant of the fortress.","18":"For thus saith the LORD, Behold, I will sling out the inhabitants of the land at this once, and will distress them, that they may find","19":"Woe is me for my hurt! my wound is grievous: but I said, Truly this *is* a grief, and I must bear","20":"My tabernacle is spoiled, and all my cords are broken: my children are gone forth of me, and they *are* not: *there is* none to stretch forth my tent any more, and to set up my curtains.","21":"For the pastors are become brutish, and have not sought the LORD: therefore they shall not prosper, and all their flocks shall be scattered.","22":"Behold, the noise of the bruit is come, and a great commotion out of the north country, to make the cities of Judah desolate, *and* a den of dragons.","23":"O LORD, I know that the way of man *is* not in himself: *it is* not in man that walketh to direct his steps.","24":"O LORD, correct me, but with judgment; not in thine anger, lest thou bring me to nothing.","25":"Pour out thy fury upon the heathen that know thee not, and upon the families that call not on thy name: for they have eaten up Jacob, and devoured him, and consumed him, and have made his habitation desolate."}},"tsk":{"2":[{"kopje":"Leert","refs":["Lev 18:3","Lev 20:23","Deut 12:30","Deut 12:31","Ezech 20:32"]},{"kopje":"schrikken","refs":["Jes 47:12-14","Luk 21:25-28"]}],"3":[{"kopje":"inzettingen","refs":["Jer 10:8","Jer 2:5","Lev 18:30","1 Kon 18:26-28","Matt 6:7","Rom 1:21","1 Petr 1:18"]},{"kopje":"men","refs":["Jes 40:19-31","Jes 44:9-20","Jes 45:20","Hos 8:4-6","Hab 2:18","Hab 2:19"]}],"4":[{"kopje":"pronkt","refs":["Ps 115:4","Ps 135:15","Jes 40:19","Jes 40:20"]},{"kopje":"hechten","refs":["Jes 41:6","Jes 44:12","Jes 46:7"]}],"5":[{"kopje":"spreken","refs":["Ps 115:5-8","Ps 135:16-18","Hab 2:19","1 Kor 12:2","Openb 13:14","Openb 13:15"]},{"kopje":"gedragen worden","refs":["Jes 46:1","Jes 46:7"]},{"kopje":"kwaad doen","refs":["Jes 41:23","Jes 41:24","Jes 44:9","Jes 44:10","Jes 45:20","1 Kor 8:4"]}],"6":[{"kopje" s=\"wl\" data-l=\"L8\" data-code=\"H3290\">Jakob</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H398\">opgegeten</span>, <span class=\"wl\" data-l=\"L9\" data-code=\"H398\">ja</span>, <span class=\"wl\" data-l=\"L9\" data-code=\"H398\">zij</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H398\">hebben</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H398\">hem</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H398\">opgegeten</span>, <span class=\"wl\" data-l=\"L10\" data-code=\"H3615\">en</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3615\">hem</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3615\">verteerd</span>, <span class=\"wl\" data-l=\"L11\" data-code=\"H5116\">en</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5116\">zijn</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5116\">woning</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H8074\">verwoest</span>."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> ye the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaketh</span> unto you, O <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel:","2":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H3925\">Learn</span> not the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and be not <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed</span> at the <span class=\"wl wl-kjv\" data-code=\"H226\">signs</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> for the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> are <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed</span> at them.","3":"For the <span class=\"wl wl-kjv\" data-code=\"H2708\">customs</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are <span class=\"wl wl-kjv\" data-code=\"H1892\">vain:</span> for one <span class=\"wl wl-kjv\" data-code=\"H3772\">cutteth</span> a <span class=\"wl wl-kjv\" data-code=\"H6086\">tree</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3293\">forest,</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of the <span class=\"wl wl-kjv\" data-code=\"H2796\">workman,</span> with the axe.","4":"They <span class=\"wl wl-kjv\" data-code=\"H3302\">deck</span> it with <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and with <span class=\"wl wl-kjv\" data-code=\"H2091\">gold;</span> they <span class=\"wl wl-kjv\" data-code=\"H2388\">fasten</span> it with <span class=\"wl wl-kjv\" data-code=\"H4548\">nails</span> and with <span class=\"wl wl-kjv\" data-code=\"H4717\">hammers,</span> that it move","5":"They are <span class=\"wl wl-kjv\" data-code=\"H4749\">upright</span> as the palm <span class=\"wl wl-kjv\" data-code=\"H8560\">tree,</span> but <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> not: they must <span class=\"wl wl-kjv\" data-code=\"H5375\">needs</span> be <span class=\"wl wl-kjv\" data-code=\"H5375\">borne,</span> because they cannot <span class=\"wl wl-kjv\" data-code=\"H6805\">go.</span> Be not <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> of them; for they cannot do <span class=\"wl wl-kjv\" data-code=\"H7489\">evil,</span> neither also is it in them to do good.","6":"Forasmuch as there is none like unto thee, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> thou art <span class=\"wl wl-kjv\" data-code=\"H1419\">great,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> in might.","7":"Who would not <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> of <span class=\"wl wl-kjv\" data-code=\"H1471\">nations?</span> for to thee doth it <span class=\"wl wl-kjv\" data-code=\"H2969\">appertain:</span> forasmuch as among all the <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> men of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and in all their kingdoms,","8":"But they are <span class=\"wl wl-kjv\" data-code=\"H259\">altogether</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">brutish</span> and <span class=\"wl wl-kjv\" data-code=\"H3688\">foolish:</span> the <span class=\"wl wl-kjv\" data-code=\"H6086\">stock</span> is a <span class=\"wl wl-kjv\" data-code=\"H4148\">doctrine</span> of vanities.","9":"<span class=\"wl wl-kjv\" data-code=\"H3701\">Silver</span> spread into <span class=\"wl wl-kjv\" data-code=\"H7554\">plates</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> from <span class=\"wl wl-kjv\" data-code=\"H8659\">Tarshish,</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> from <span class=\"wl wl-kjv\" data-code=\"H210\">Uphaz,</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of the <span class=\"wl wl-kjv\" data-code=\"H2796\">workman,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of the <span class=\"wl wl-kjv\" data-code=\"H6884\">founder:</span> <span class=\"wl wl-kjv\" data-code=\"H8504\">blue</span> and <span class=\"wl wl-kjv\" data-code=\"H713\">purple</span> is their <span class=\"wl wl-kjv\" data-code=\"H3830\">clothing:</span> they are all the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of cunning","10":"But the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is the <span class=\"wl wl-kjv\" data-code=\"H571\">true</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> he is the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> at his <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall <span class=\"wl wl-kjv\" data-code=\"H7493\">tremble,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall not be able to <span class=\"wl wl-kjv\" data-code=\"H3557\">abide</span> his indignation.","11":"<span class=\"wl wl-kjv\" data-code=\"H1836\">Thus</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H560\">say</span> unto them, The <span class=\"wl wl-kjv\" data-code=\"H426\">gods</span> that have <span class=\"wl wl-kjv\" data-code=\"H3809\">not</span> <span class=\"wl wl-kjv\" data-code=\"H5648\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H8065\">heavens</span> and the <span class=\"wl wl-kjv\" data-code=\"H778\">earth,</span> even they shall <span class=\"wl wl-kjv\" data-code=\"H7\">perish</span> from the <span class=\"wl wl-kjv\" data-code=\"H772\">earth,</span> and from <span class=\"wl wl-kjv\" data-code=\"H8460\">under</span> <span class=\"wl wl-kjv\" data-code=\"H429\">these</span> heavens.","12":"He hath <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> by his <span class=\"wl wl-kjv\" data-code=\"H3581\">power,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> by his <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and hath stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> by his discretion.","13":"When he <span class=\"wl wl-kjv\" data-code=\"H5414\">uttereth</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> there is a <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> in the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> and he causeth the <span class=\"wl wl-kjv\" data-code=\"H5387\">vapours</span> to <span class=\"wl wl-kjv\" data-code=\"H5927\">ascend</span> from the <span class=\"wl wl-kjv\" data-code=\"H7097\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> he <span class=\"wl wl-kjv\" data-code=\"H6213\">maketh</span> <span class=\"wl wl-kjv\" data-code=\"H1300\">lightnings</span> with <span class=\"wl wl-kjv\" data-code=\"H4306\">rain,</span> and bringeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> out of his treasures.","14":"Every <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> is <span class=\"wl wl-kjv\" data-code=\"H1197\">brutish</span> in his <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge:</span> every <span class=\"wl wl-kjv\" data-code=\"H6884\">founder</span> is <span class=\"wl wl-kjv\" data-code=\"H3001\">confounded</span> by the graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image:</span> for his molten <span class=\"wl wl-kjv\" data-code=\"H5262\">image</span> is <span class=\"wl wl-kjv\" data-code=\"H8267\">falsehood,</span> and there is no breath","15":"They are <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H8595\">errors:</span> in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of their <span class=\"wl wl-kjv\" data-code=\"H6486\">visitation</span> they shall perish.","16":"The <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> is not like them: for he is the <span class=\"wl wl-kjv\" data-code=\"H3335\">former</span> of all things; and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is the <span class=\"wl wl-kjv\" data-code=\"H7626\">rod</span> of his <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance:</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> is his name.","17":"Gather <span class=\"wl wl-kjv\" data-code=\"H622\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H3666\">wares</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> O <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of the fortress.","18":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H7049\">sling</span> out the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> at this <span class=\"wl wl-kjv\" data-code=\"H6471\">once,</span> and will <span class=\"wl wl-kjv\" data-code=\"H6887\">distress</span> them, that they may find","19":"<span class=\"wl wl-kjv\" data-code=\"H188\">Woe</span> is me for my <span class=\"wl wl-kjv\" data-code=\"H7667\">hurt!</span> my <span class=\"wl wl-kjv\" data-code=\"H4347\">wound</span> is <span class=\"wl wl-kjv\" data-code=\"H2470\">grievous:</span> but I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H389\">Truly</span> this is a <span class=\"wl wl-kjv\" data-code=\"H2483\">grief,</span> and I must bear","20":"My <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> is <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled,</span> and all my <span class=\"wl wl-kjv\" data-code=\"H4340\">cords</span> are <span class=\"wl wl-kjv\" data-code=\"H5423\">broken:</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> are gone <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> of me, and they are not: the const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
