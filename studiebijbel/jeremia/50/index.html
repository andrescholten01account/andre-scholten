,"vertalingen":{"SVnu":{"1":"Het woord dat de HEERE gesproken heeft tegen Babel, tegen het land van de Chaldeeën, door de dienst van de profeet Jeremia.","2":"Verkondig het onder de heidenvolken, en laat het horen, en steek een banier op, laat het horen, verberg het niet; zeg: Babel is ingenomen, Bel is beschaamd, Merodach is verpletterd, haar afgoden zijn beschaamd, haar drekgoden[1] zijn verpletterd!","3":"Want een volk komt tegen haar op vanuit het noorden; dat zal haar land tot een verwoesting maken, zodat er geen inwoner in zal zijn; van de mensen tot de dieren toe zijn zij weggezworven, doorgegaan!","4":"In die dagen en op die tijd, spreekt de HEERE, zullen de kinderen van Israël komen, zij en de kinderen van Juda samen; wandelend en wenend zullen zij heengaan, en de HEERE, hun God, zoeken.","5":"Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, *met* een eeuwig verbond, *dat* niet zal worden vergeten.","6":"Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen naar de bergen gevoerd, zij gingen van berg tot heuvel, zij vergaten hun rustplaats.","7":"Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, *in* de woning van de gerechtigheid, ja, *tegen* de HEERE, de Verwachting van hun vaderen.","8":"Vlucht weg uit het midden van Babel, en trek uit het land van de Chaldeeën, en wees als de bokken vooraan de kudde.","9":"Want zie, Ik zal een verzameling van grote volken uit het land van het noorden verwekken, en tegen Babel opbrengen; die zullen zich tegen haar opstellen; van daar zal zij ingenomen worden; hun pijlen zullen zijn als die van een kloek held, geen zal met lege handen terugkeren.","10":"En Chaldea zal ten roof zijn; allen die het beroven, zullen verzadigd worden, spreekt de HEERE.","11":"Omdat u zich verblijd hebt, omdat u van vreugde hebt opgesprongen, u plunderaars van Mijn erfenis! Omdat u geil geworden bent als een vaars op grasland, *en* hebt gebriest als de sterke *paarden*;","12":"Zo is uw moeder zeer beschaamd; die u gebaard heeft, is schaamrood geworden; zie, zij is geworden de achterste van de heidenvolken, een woestijn, dorheid en wildernis.","13":"Vanwege de verbolgenheid van de HEERE zal zij niet bewoond worden, maar zij zal helemaal een verwoesting worden; iedereen die Babel voorbijgaat, zal zich ontzetten, en fluiten over al haar plagen.","14":"Stel u op tegen Babel rondom, u allen die de boog spant! Schiet in haar, en spaar de pijlen niet; want zij heeft tegen de HEERE gezondigd.","15":"Juich over haar rondom, zij heeft haar hand gegeven; haar fundamenten zijn gevallen, haar muren zijn afgebroken; want dat is de wraak van de HEERE, wreek u aan haar, doe haar zoals zij gedaan heeft!","16":"Roei uit van Babel de zaaier, en hem die de sikkel hanteert in de oogsttijd; laat hen vanwege het verdrukkende zwaard zich keren, ieder tot zijn volk, en vlieden, ieder naar zijn land.","17":"Israël is een verjaagd lam, *dat* de leeuwen weggejaagd hebben; de eerste die hem heeft opgegeten, was de koning van Assur, en deze, de laatste, Nebukadrezar, de koning van Babel, heeft hem de beenderen verbrijzeld.","18":"Daarom, zo zegt de HEERE van de heerscharen, de God van Israël: Zie, Ik zal bezoeking doen over de koning van Babel en over zijn land, zoals Ik bezoeking gedaan heb over de koning van Assur.","19":"En Ik zal Israël terugbrengen naar zijn woning, en hij zal weiden *op* de Karmel en *op* de Basan; en zijn ziel zal op het gebergte van Efraïm en Gilead verzadigd worden.","20":"In die dagen en op die tijd, spreekt de HEERE, zal de ongerechtigheid van Israël gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal het vergeven aan hen die Ik zal doen overblijven.","21":"Tegen het land Merathaïm, trek tegen haar op, en tegen de inwoners van Pekod; verwoest en verban wie na hen komen, spreekt de HEERE, en doe naar alles wat Ik u geboden heb.","22":"Er is een krijgsgeschreeuw in het land, en een grote breuk.","23":"Hoe is de hamer van de hele aarde *zo* afgehouwen en verbroken! Hoe is Babel geworden tot een ontzetting onder de heidenvolken.","24":"Ik heb u een strik gesteld, en daardoor bent u ook gevangen, o Babel! Zonder dat u het wist; u bent gevonden, en ook gegrepen, omdat u zich tegen de HEERE in *strijd* gemengd hebt.","25":"De HEERE heeft Zijn schatkamer opengedaan, en de wapens van Zijn gramschap voortgebracht; want dat is een werk van de Heere, de HEERE van de heerscharen, in het land van de Chaldeeën.","26":"Kom tegen haar aan van het uiterste, open haar schuren, vertreed haar als korenhopen, en verban haar; laat haar geen overblijfsel hebben.","27":"Doodt met het zwaard al haar bullen, laat ze afgaan ter slachting; wee over hen, want hun dag is gekomen, de tijd van hun bezoeking!","28":"Er is een stem van hen die gevlucht en ontkomen zijn uit het land van Babel, om in Sion te verkondigen de wraak van de HEERE, onze God, de wraak van Zijn tempel.","29":"Laat *u* horen tegen Babel, u schutters! U allen die de boog spant! Leger u tegen haar rondom, laat niemand van hen ontkomen; vergeld haar naar haar werk, doe haar naar alles wat zij gedaan heeft; want zij heeft trots gehandeld tegen de HEERE, tegen de Heilige van Israël.","30":"Daarom zullen haar jongelingen vallen op haar straten, en al haar krijgslieden zullen op die dag uitgeroeid worden, spreekt de HEERE.","31":"Zie, Ik *wil* tegen u, u trotse! spreekt de Heere, de HEERE van de heerscharen; want uw dag is gekomen, de tijd dat Ik u bezoeken zal.","32":"Dan zal de trotse aanstoten en vallen, en er zal niemand zijn die hem opricht; ja, Ik zal een vuur aansteken in zijn steden, dat zal alle plaatsen rondom hem verteren.","33":"Zo zegt de HEERE van de heerscharen: De kinderen van Israël en de kinderen van Juda zijn samen verdrukt geweest; en allen die hen gevangen hadden, hebben hen vastgehouden; zij hebben geweigerd hen los te laten.","34":"*Maar* hun Verlosser is sterk, HEERE van de heerscharen is Zijn Naam; Hij zal hun geschil zeker beslechten, opdat Hij het land tot rust brengt, maar de inwoners van Babel verontrust.","35":"Het zwaard zal zijn over de Chaldeeën, spreekt de HEERE; en over de inwoners van Babel, en over haar vorsten, en over haar wijzen.","36":"Het zwaard zal zijn over de leugenaars, zodat zij dwaas worden; het zwaard zal zijn over haar helden, zodat zij versagen;","37":"Het zwaard zal zijn over zijn paarden en over zijn wagens, en over de hele gemengde menigte die in hun midden is, zodat zij worden als vrouwen; het zwaard zal zijn over haar schatten, zodat zij geplunderd worden.","38":"Droogte zal zijn over haar water, zodat het uitdroogt; want het is een land van gesneden beelden, en zij razen naar de schrikwekkende *afgoden*.","39":"Daarom zullen de wilde dieren van de woestijnen met de wilde dieren van de eilanden daar wonen; ook zullen de jonge struisen daar wonen; en men zal er geen verblijf meer hebben in eeuwigheid, en zij zal niet bewoond worden van geslacht tot geslacht.","40":"Zoals God Sodom en Gomorra en haar naburen heeft omgekeerd, spreekt de HEERE, *zo* zal niemand daar wonen, en geen mensenkind in haar verblijven.","41":"Zie, daar komt een volk uit het noorden; en een grote natie, en machtige koningen zullen worden opgewekt van de uithoeken van de aarde.","42":"Boog en spies zullen zij voeren; wreed zijn zij, en zullen niet barmhartig zijn; hun stem zal bruisen als de zee, en op paarden zullen zij rijden; het is opgesteld als een man ten oorlog, tegen u, o dochter van Babel!","43":"De koning van Babel heeft hun gerucht gehoord, en zijn handen zijn slap geworden; benauwdheid heeft hem aangegrepen, weeën als van een barende *vrouw*.","44":"Zie, zoals een leeuw van de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hen in een ogenblik daaruit doen wegvluchten; en wie *daartoe* verkoren is, *hem* zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden? En wie is de herder die voor Mijn aangezicht kan bestaan?","45":"Daarom, hoor het besluit van de HEERE, dat Hij over Babel heeft beraadslaagd, en Zijn gedachten, die Hij gedacht heeft over het land van de Chaldeeën: Zeker, de geringste van de kudde zal hen wegtrekken! Zeker, hij zal de woning boven hen verwoesten!","46":"De aarde is beginnen te beven van het geluid van de inneming van Babel, en het geroep is gehoord onder de volken."},"SV":{"1":"Het woord, dat de HEERE gesproken heeft tegen Babel, tegen het land der Chaldeen, door den dienst van den profeet Jeremia.","2":"Verkondigt onder de heidenen, en doet horen, en werpt een banier op, laat horen, verbergt het niet; zegt: Babel is ingenomen, Bel is beschaamd, Merodach is verpletterd, haar afgoden zijn beschaamd, haar drekgoden zijn verpletterd!","3":"Want een volk komt tegen haar op van het noorden; dat zal haar land zetten in verwoesting, dat er geen inwoner in zal zijn; van de mensen aan tot de beesten toe zijn zij weggezworven, doorgegaan!","4":"In dezelve dagen en ter zelver tijd, spreekt de HEERE, zullen de kinderen Israëls komen, zij en de kinderen van Juda te zamen; wandelende en wenende zullen zij henengaan, en den HEERE, hun God, zoeken.","5":"Zij zullen naar Sion vragen; op den weg herwaarts zullen hun aangezichten zijn; zij zullen komen en den HEERE toegevoegd worden, *met* een eeuwig verbond, *dat* niet zal worden vergeten.","6":"Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen gevoerd *naar* de bergen, zij gingen van berg tot heuvel, zij vergaten hun legering.","7":"Allen, die hen vonden, aten hen op, en hun wederpartijders zeiden: Wij zullen geen schuld hebben; daarom dat zij gezondigd hebben tegen den HEERE, *in* de woning der gerechtigheid, ja, *tegen* den HEERE, de Verwachting hunner vaderen.","8":"Vliedt weg uit het midden van Babel, en gaat uit der Chaldeen land; en weest als de bokken voor de kudde henen.","9":"Want ziet, Ik zal een verzameling van grote volken uit het land van het noorden verwekken, en tegen Babel opbrengen; die zullen zich tegen haar rusten; van daar zal zij ingenomen worden; hun pijlen zullen zijn als eens kloeken helds , geen zal ledig wederkeren.","10":"En Chaldea zal ten roof zijn; allen, die het beroven, zullen verzadigd worden, spreekt de HEERE.","11":"Omdat gij u verblijd hebt, omdat gij van vreugde hebt opgesprongen, gij plunderaars Mijner erfenis! omdat gij geil geworden zijt als een grazige vaars, *en* hebt gebriest als de sterke *paarden*;","12":"Zo is uw moeder zeer beschaamd; die u gebaard heeft, is schaamrood geworden; ziet, zij is geworden de achterste der heidenen, een woestijn, dorheid en wildernis.","13":"Vanwege de verbolgenheid des HEEREN zal zij niet bewoond worden, maar zij zal geheel een verwoesting worden; al wie aan Babel voorbijgaat, zal zich ontzetten, en fluiten over al haar plagen.","14":"Rust u tegen Babel rondom, gij allen, die den boog spant! schiet in haar, en spaart de pijlen niet; want zij heeft tegen den HEERE gezondigd.","15":"Juicht over haar rondom, zij heeft haar hand gegeven; haar fondamenten zijn gevallen, haar muren zijn afgebroken; want dat is des HEEREN wraak, wreekt u aan haar, doet haar, gelijk als zij gedaan heeft!","16":"Roeit uit van Babel den zaaier, en dien, die de sikkel handelt in den oogsttijd; laat hen vanwege het verdrukkende zwaard, zich keren, een iegelijk tot zijn volk, en vlieden, een iegelijk naar zijn land.","17":"Israël is een verbijsterd lam, *dat* de leeuwen verjaagd hebben; de eerste, *die* hem heeft opgegeten, was de koning van Assur, en deze de laatste, Nebukadrezar, de koning van Babel, heeft hem de beenderen verbrijzeld.","18":"Daarom, zo zegt de HEERE der heirscharen, de God Israëls: Ziet, Ik zal bezoeking doen over den koning van Babel en over zijn land, gelijk als Ik bezoeking gedaan heb over den koning van Assur.","19":"En Ik zal Israël weder tot zijn woning brengen, en hij zal weiden *op* den Karmel en *op* den Basan; en zijn ziel zal op het gebergte van Efraïm en Gilead verzadigd worden.","20":"In die dagen en te dier tijd, spreekt de HEERE, zal Israëls ongerechtigheid gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal ze dengenen vergeven, die Ik zal doen overblijven.","21":"Tegen het land Merathaim, trek tegen hetzelve op, en tegen de inwoners van Pekod; verwoest en verban achter hen, spreekt de HEERE, en doe naar alles, wat Ik u geboden heb.","22":"Er is een krijgsgeschrei in het land, en een grote breuk.","23":"Hoe is de hamer der ganse aarde *zo* afgehouwen en verbroken! Hoe is Babel geworden tot een ontzetting onder de heidenen.","24":"Ik heb u een strik gesteld, dies zijt gij ook gevangen, o Babel! dat gij het niet wist; gij zijt gevonden, en ook gegrepen, omdat gij u tegen den HEERE *in* *strijd* gemengd hebt.","25":"De HEERE heeft Zijn schatkamer opengedaan, en de instrumenten Zijner gramschap voortgebracht; want dat is een werk van den Heere, den HEERE der heirscharen, in het land der Chaldeen.","26":"Komt aan tegen haar van het uiterste, opent haar schuren, vertreedt haar als korenhopen, en verbant ze; laat ze geen overblijfsel hebben.","27":"Doodt met het zwaard al haar varren, laat ze afgaan ter slachting; wee over hen, want hun dag is gekomen, de tijd hunner bezoeking!","28":"Er is een stem der gevluchten en ontkomenen uit het land van Babel, om in Sion te verkondigen de wraak des HEEREN, onzes Gods, de wraak Zijns tempels.","29":"Laat *u* horen tegen Babel, gij schutters! gij allen, die den boog spant! legert u tegen haar rondom, laat niemand van hen ontkomen; vergeldt haar naar haar werk, doet haar naar alles, wat zij gedaan heeft; want zij heeft trotselijk gehandeld tegen den HEERE, tegen den Heilige Israëls.","30":"Daarom zullen haar jongelingen vallen op haar straten, en al haar krijgslieden te dien dage uitgeroeid worden, spreekt de HEERE.","31":"Ziet, Ik *wil* aan u, gij trotse! spreekt de Heere, de HEERE der heirscharen; want uw dag is gekomen, de tijd, dat Ik u bezoeken zal.","32":"Dan zal de trotse aanstoten en vallen, en er zal niemand zijn, die hem opricht; ja, Ik zal een vuur aansteken in zijn steden, dat zal alle plaatsen rondom hem verteren.","33":"Zo zegt de HEERE der heirscharen: De kinderen Israëls en de kinderen van Juda zijn te zamen verdrukt geweest; en allen, die hen gevangen hadden, hebben hen vast gehouden; zij hebben hen geweigerd los te laten.","34":"*Maar* hun Verlosser is sterk, HEERE der heirscharen is Zijn Naam; Hij zal hun twist zekerlijk twisten, opdat Hij het land in rust brenge, maar de inwoners van Babel beroere.","35":"Het zwaard zal zijn over de Chaldeen, spreekt de HEERE; en over de inwoners van Babel, en over haar vorsten, en over haar wijzen.","36":"Het zwaard zal zijn over de leugenaars, dat zij zot worden; het zwaard zal zijn over haar helden, dat zij versagen;","37":"Het zwaard zal zijn over zijn paarden en over zijn wagenen, en over den gansen gemengden hoop, die in het midden van hen is, dat zij tot wijven worden; het zwaard zal zijn over haar schatten, dat zij geplunderd worden.","38":"Droogte zal zijn over haar wateren, dat zij uitdrogen; want het is een land van gesneden beelden, en zij razen naar de schrikkelijke *afgoden*.","39":"Daarom zo zullen de wilde dieren der woestijnen met de wilde dieren der eilanden *daarin* wonen; ook zullen de jonge struisen daarin wonen; en men zal er geen verblijf meer hebben in eeuwigheid, en zij zal niet bewoond worden van geslacht tot geslacht.","40":"Gelijk God Sodom en Gomorra en haar naburen heeft omgekeerd, spreekt de HEERE, *alzo* zal niemand aldaar wonen, en geen mensenkind in haar verkeren.","41":"Ziet, daar komt een volk uit het noorden; en een grote natie, en geweldige koningen zullen van de zijden der aarde opgewekt worden.","42":"Boog en spies zullen zij voeren; wreed zijn zij, en zullen niet barmhartig zijn; hun stem zal bruisen als de zee, en op paarden zullen zij rijden; het is toegerust als een man ten oorlog, tegen u, o dochter van Babel!","43":"De koning van Babel heeft hunlieder gerucht gehoord, en zijn handen zijn slap geworden; benauwdheid heeft hem aangegrepen, weedom als van een barende *vrouw*.","44":"Ziet, gelijk een leeuw van de verheffing der Jordaan, zal hij opkomen tegen de sterke woning; want Ik zal hen in een ogenblik daaruit doen lopen ; en wie *daartoe* verkoren is, *dien* zal Ik tegen haar bestellen; want wie is Mij gelijk, en wie zou Mij dagvaarden? En wie is de herder, die voor Mijn aangezicht bestaan zou?","45":"Daarom hoort den raadslag des HEEREN, dien Hij over Babel heeft beraadslaagd, en Zijn gedachten, die Hij gedacht heeft over het land der Chaldeen: Zo de geringsten van de kudde hen niet zullen nedertrekken! Zo hij de woning boven hen niet zal verwoesten!","46":"De aarde is bevende geworden van het geluid der inneming van Babel, en het gekrijt is gehoord onder de volken."},"KJV":{"1":"The word that the LORD spake against Babylon *and* against the land of the Chaldeans by Jeremiah the prophet.","2":"Declare ye among the nations, and publish, and set up a standard; publish, *and* conceal not: say, Babylon is taken, Bel is confounded, Merodach is broken in pieces; her idols are confounded, her images are broken in pieces.","3":"For out of the north there cometh up a nation against her, which shall make her land desolate, and none shall dwell therein: they shall remove, they shall depart, both man and beast.","4":"In those days, and in that time, saith the LORD, the children of Israel shall come, they and the children of Judah together, going and weeping: they shall go, and seek the LORD their God.","5":"They shall ask the way to Zion with their faces thitherward, *saying*, Come, and let us join ourselves to the LORD in a perpetual covenant *that* shall not be forgotten.","6":"My people hath been lost sheep: their shepherds have caused them to go astray, they have turned them away *on* the mountains: they have gone from mountain to hill, they have forgotten their restingplace.","7":"All that found them have devoured them: and their adversaries said, We offend not, because they have sinned against the LORD, the habitation of justice, even the LORD, the hope of their fathers.","8":"Remove out of the midst of Babylon, and go forth out of the land of the Chaldeans, and be as the he goats before the flocks.","9":"For, lo, I will raise and cause to come up against Babylon an assembly of great nations from the north country: and they shall set themselves in array against her; from thence she shall be taken: their arrows *shall be* as of a mighty expert man; none shall return in vain.","10":"And Chaldea shall be a spoil: all that spoil her shall be satisfied, saith the LORD.","11":"Because ye were glad, because ye rejoiced, O ye destroyers of mine heritage, because ye are grown fat as the heifer at grass, and bellow as bulls;","12":"Your mother shall be sore confounded; she that bare you shall be ashamed: behold, the hindermost of the nations *shall be* a wilderness, a dry land, and a desert.","13":"Because of the wrath of the LORD it shall not be inhabited, but it shall be wholly desolate: every one that goeth by Babylon shall be astonished, and hiss at all her plagues.","14":"Put yourselves in array against Babylon round about: all ye that bend the bow, shoot at her, spare no arrows: for she hath sinned against the LORD.","15":"Shout against her round about: she hath given her hand: her foundations are fallen, her walls are thrown down: for it *is* the vengeance of the LORD: take vengeance upon her; as she hath done, do","16":"Cut off the sower from Babylon, and him that handleth the sickle in the time of harvest: for fear of the oppressing sword they shall turn every one to his people, and they shall flee every one to his own land.","17":"Israel *is* a scattered sheep; the lions have driven *him* away: first the king of Assyria hath devoured him; and last this Nebuchadrezzar king of Babylon hath broken his bones.","18":"Therefore thus saith the LORD of hosts, the God of Israel; Behold, I will punish the king of Babylon and his land, as I have punished the king of Assyria.","19":"And I will bring Israel again to his habitation, and he shall feed on Carmel and Bashan, and his soul shall be satisfied upon mount Ephraim and Gilead.","20":"In those days, and in that time, saith the LORD, the iniquity of Israel shall be sought for, and *there shall be* none; and the sins of Judah, and they shall not be found: for I will pardon them whom I reserve.","21":"Go up against the land of Merathaim, *even* against it, and against the inhabitants of Pekod: waste and utterly destroy after them, saith the LORD, and do according to all that I have commanded","22":"A sound of battle *is* in the land, and of great destruction.","23":"How is the hammer of the whole earth cut asunder and broken! how is Babylon become a desolation among the nations!","24":"I have laid a snare for thee, and thou art also taken, O Babylon, and thou wast not aware: thou art found, and also caught, because thou hast striven against the LORD.","25":"The LORD hath opened his armoury, and hath brought forth the weapons of his indignation: for this *is* the work of the Lord GOD of hosts in the land of the Chaldeans.","26":"Come against her from the utmost border, open her storehouses: cast her up as heaps, and destroy her utterly: let nothing of her be left.","27":"Slay all her bullocks; let them go down to the slaughter: woe unto them! for their day is come, the time of their visitation.","28":"The voice of them that flee and escape out of the land of Babylon, to declare in Zion the vengeance of the LORD our God, the vengeance of his temple.","29":"Call together the archers against Babylon: all ye that bend the bow, camp against it round about; let none thereof escape: recompense her according to her work; according to all that she hath done, do unto her: for she hath been proud against the LORD, against the Holy One of Israel.","30":"Therefore shall her young men fall in the streets, and all her men of war shall be cut off in that day, saith the LORD.","31":"Behold, I *am* against thee, *O thou* most proud, saith the Lord GOD of hosts: for thy day is come, the time *that* I will visit","32":"And the most proud shall stumble and fall, and none shall raise him up: and I will kindle a fire in his cities, and it shall devour all round about","33":"Thus saith the LORD of hosts; The children of Israel and the children of Judah *were* oppressed together: and all that took them captives held them fast; they refused to let them go.","34":"Their Redeemer *is* strong; the LORD of hosts *is* his name: he shall throughly plead their cause, that he may give rest to the land, and disquiet the inhabitants of Babylon.","35":"A sword *is* upon the Chaldeans, saith the LORD, and upon the inhabitants of Babylon, and upon her princes, and upon her wise","36":"A sword *is* upon the liars; and they shall dote: a sword *is* upon her mighty men; and they shall be dismayed.","37":"A sword *is* upon their horses, and upon their chariots, and upon all the mingled people that *are* in the midst of her; and they shall become as women: a sword *is* upon her treasures; and they shall be robbed.","38":"A drought *is* upon her waters; and they shall be dried up: for it *is* the land of graven images, and they are mad upon *their* idols.","39":"Therefore the wild beasts of the desert with the wild beasts of the islands shall dwell *there*, and the owls shall dwell therein: and it shall be no more inhabited for ever; neither shall it be dwelt in from generation to generation.","40":"As God overthrew Sodom and Gomorrah and the neighbour *cities* thereof, saith the LORD; *so* shall no man abide there, neither shall any son of man dwell","41":"Behold, a people shall come from the north, and a great nation, and many kings shall be raised up from the coasts of the earth.","42":"They shall hold the bow and the lance: they *are* cruel, and will not shew mercy: their voice shall roar like the sea, and they shall ride upon horses, *every one* put in array, like a man to the battle, against thee, O daughter of Babylon.","43":"The king of Babylon hath heard the report of them, and his hands waxed feeble: anguish took hold of him, *and* pangs as of a woman in travail.","44":"Behold, he shall come up like a lion from the swelling of Jordan unto the habitation of the strong: but I will make them suddenly run away from her: and who *is* a chosen *man, that* I may appoint over her? for who *is* like me? and who will appoint me the time? and who *is* that shepherd that will stand before","45":"Therefore hear ye the counsel of the LORD, that he hath taken against Babylon; and his purposes, that he hath purposed against the land of the Chaldeans: Surely the least of the flock shall draw them out: surely he shall make *their* habitation desolate","46":"At the noise of the taking of Babylon the earth is moved, and the cry is heard among the nations."}},"tsk":{"1":[{"kopje":"tegen Babel","refs":["Jer 25:26","Jer 25:27","Jer 27:7","Jer 51:1-14","Ps 137:8","Ps 137:9","Jes 13:1-3","Jes 14:4","Jes 21:1-10","Jes 47:1-15","Hab 2:5-20","Openb 18:1-24"]},{"kopje":"het land","refs":["Gen 11:31","Job 1:17","Jes 23:13","Hand 7:4"]},{"kopje":"Jeremia","refs":["2 Sam 23:2","2 Petr 1:21"]}],"2":[{"kopje":"Verkondig","refs":["Jer 6:18","Jer 31:10","Jer 46:14","Ps 64:10","Ps 96:3","Jes 12:4","Jes 48:6","Jes 66:18","Jes 66:19","Openb 14:6-8"]},{"kopje":"steek een banier op","refs":["Jes 13:2"]},{"kopje":"Babel","refs":["Jer 51:8","Jes 21:9","Openb 14:8","Openb 18:2"]},{"kopje":"Bel","refs":["Jer 51:44","Jes 46:1"]},{"kopje":"Merodach","refs":["Jer 52:31","Jes 39:1"]},{"kopje":"haar afgoden","refs":["Jer 50:46","Jer 43:12","Jer 43:13","Jes 37:19","Zef 2:11","Jes 21:9","Jes 46:1 ehoord</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1471\">onder</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1471\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1471\">volken</span>."},"koppeling_kjv":{"1":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> against <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> and against the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> the prophet.","2":"<span class=\"wl wl-kjv\" data-code=\"H5046\">Declare</span> ye among the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">publish,</span> and set <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H5251\">standard;</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">publish,</span> and <span class=\"wl wl-kjv\" data-code=\"H3582\">conceal</span> not: <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> is <span class=\"wl wl-kjv\" data-code=\"H3920\">taken,</span> <span class=\"wl wl-kjv\" data-code=\"H1078\">Bel</span> is <span class=\"wl wl-kjv\" data-code=\"H3001\">confounded,</span> <span class=\"wl wl-kjv\" data-code=\"H4781\">Merodach</span> is broken in <span class=\"wl wl-kjv\" data-code=\"H2865\">pieces;</span> her <span class=\"wl wl-kjv\" data-code=\"H6091\">idols</span> are <span class=\"wl wl-kjv\" data-code=\"H3001\">confounded,</span> her <span class=\"wl wl-kjv\" data-code=\"H1544\">images</span> are broken in pieces.","3":"For out of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> there cometh <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> against her, which shall <span class=\"wl wl-kjv\" data-code=\"H7896\">make</span> her <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H8047\">desolate,</span> and none shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein: they shall <span class=\"wl wl-kjv\" data-code=\"H5110\">remove,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H1980\">depart,</span> both <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and beast.","4":"In those <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> and in that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> they and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">going</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">weeping:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> and <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their God.","5":"They shall <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> with their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> <span class=\"wl wl-kjv\" data-code=\"H2008\">thitherward,</span> saying, <span class=\"wl wl-kjv\" data-code=\"H935\">Come,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H3867\">join</span> ourselves to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in a <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> that shall not be forgotten.","6":"My <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> hath been <span class=\"wl wl-kjv\" data-code=\"H6\">lost</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep:</span> their <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds</span> have caused them to go <span class=\"wl wl-kjv\" data-code=\"H8582\">astray,</span> they have turned them <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> on the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains:</span> they have <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> from <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> to <span class=\"wl wl-kjv\" data-code=\"H1389\">hill,</span> they have <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> their restingplace.","7":"All that <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> them have <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> them: and their <span class=\"wl wl-kjv\" data-code=\"H6862\">adversaries</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We <span class=\"wl wl-kjv\" data-code=\"H816\">offend</span> not, because they have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation</span> of <span class=\"wl wl-kjv\" data-code=\"H6664\">justice,</span> even the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H4723\">hope</span> of their fathers.","8":"<span class=\"wl wl-kjv\" data-code=\"H5110\">Remove</span> out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> and be as the he <span class=\"wl wl-kjv\" data-code=\"H6260\">goats</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the flocks.","9":"For, lo, I will <span class=\"wl wl-kjv\" data-code=\"H5782\">raise</span> and cause to come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> an <span class=\"wl wl-kjv\" data-code=\"H6951\">assembly</span> of <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> from the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country:</span> and they shall set themselves in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> against her; from thence she shall be <span class=\"wl wl-kjv\" data-code=\"H3920\">taken:</span> their <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> shall be as of a <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> expert <span class=\"wl wl-kjv\" data-code=\"H7919\">man;</span> none shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> in vain.","10":"And <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldea</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil:</span> all that <span class=\"wl wl-kjv\" data-code=\"H7997\">spoil</span> her shall be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","11":"Because ye were <span class=\"wl wl-kjv\" data-code=\"H8055\">glad,</span> because ye <span class=\"wl wl-kjv\" data-code=\"H5937\">rejoiced,</span> O ye <span class=\"wl wl-kjv\" data-code=\"H8154\">destroyers</span> of mine <span class=\"wl wl-kjv\" data-code=\"H5159\">heritage,</span> because ye are grown <span class=\"wl wl-kjv\" data-code=\"H6335\">fat</span> as the <span class=\"wl wl-kjv\" data-code=\"H5697\">heifer</span> at <span class=\"wl wl-kjv\" data-code=\"H1877\">grass,</span> and <span class=\"wl wl-kjv\" data-code=\"H6670\">bellow</span> as bulls;","12":"Your <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H954\">confounded;</span> she that <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> you shall be <span class=\"wl wl-kjv\" data-code=\"H2659\">ashamed:</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H319\">hindermost</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> a dry <span class=\"wl wl-kjv\" data-code=\"H6723\">land,</span> and a desert.","13":"Because of the <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> it shall not be <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited,</span> but it shall be wholly <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate:</span> every one that <span class=\"wl wl-kjv\" data-code=\"H5674\">goeth</span> by <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8074\">astonished,</span> and <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss</span> at all her plagues.","14":"Put yourselves in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> against <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about:</span> all ye that <span class=\"wl wl-kjv\" data-code=\"H1869\">bend</span> the <span class=\"wl wl-kjv\" data-code=\"H7198\">bow,</span> <span class=\"wl wl-kjv\" data-code=\"H3034\">shoot</span> at her, <span class=\"wl wl-kjv\" data-code=\"H2550\">spare</span> no <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows:</span> for she hath <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the LORD.","15":"<span class=\"wl wl-kjv\" data-code=\"H7321\">Shout</span> against her round <span class=\"wl wl-kjv\" data-code=\"H5439\">about:</span> she hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> her <span class=\"wl wl-kjv\" data-code=\"H803\">foundations</span> are <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen,</span> her <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> are thrown <span class=\"wl wl-kjv\" data-code=\"H2040\">down:</span> for it is the <span class=\"wl wl-kjv\" data-code=\"H5360\">vengeance</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> take <span class=\"wl wl-kjv\" data-code=\"H5358\">vengeance</span> upon her; as she hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> do","16":"Cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H2232\">sower</span> from <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and him that <span class=\"wl wl-kjv\" data-code=\"H8610\">handleth</span> the <span class=\"wl wl-kjv\" data-code=\"H4038\">sickle</span> in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest:</span> for <span class=\"wl wl-kjv\" data-code=\"H6440\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H3238\">oppressing</span> <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> they shall <span class=\"wl wl-kjv\" data-code=\"H6437\">turn</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to his own land.","17":"<span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is a <span class=\"wl wl-kjv\" data-code=\"H6340\">scattered</span> <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep;</span> the <span class=\"wl wl-kjv\" data-code=\"H738\">lions</span> have driven him <span class=\"wl wl-kjv\" data-code=\"H5080\">away:</span> <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> hath <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> him; and <span class=\"wl wl-kjv\" data-code=\"H314\">last</span> this <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> hath broken his bones.","18":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> and his <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> as I have <span class=\"wl wl-kjv\" data-code=\"H6485\">punished</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Assyria.","19":"And I will <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to his <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> on <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel</span> and <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied</span> upon <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> and Gilead.","20":"In those <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> and in that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall be sought <span class=\"wl wl-kjv\" data-code=\"H1245\">for,</span> and there shall be none; and the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and they shall not be <span class=\"wl wl-kjv\" data-code=\"H4672\">found:</span> for I will <span class=\"wl wl-kjv\" data-code=\"H5545\">pardon</span> them whom I reserve.","21":"Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4850\">Merathaim,</span> even against it, and against the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H6489\">Pekod:</span> <span class=\"wl wl-kjv\" data-code=\"H2717\">waste</span> and utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroy</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to all that I have commanded","22":"A <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> is in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and of <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> destruction.","23":"How is the <span class=\"wl wl-kjv\" data-code=\"H6360\">hammer</span> of the whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> cut <span class=\"wl wl-kjv\" data-code=\"H1438\">asunder</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">broken!</span> how is <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> become a <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation</span> among the nations!","24":"I have laid a <span class=\"wl wl-kjv\" data-code=\"H3369\">snare</span> for thee, and thou art also <span class=\"wl wl-kjv\" data-code=\"H3920\">taken,</span> O <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and thou wast not <span class=\"wl wl-kjv\" data-code=\"H3045\">aware:</span> thou art <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> and also <span class=\"wl wl-kjv\" data-code=\"H8610\">caught,</span> because thou hast <span class=\"wl wl-kjv\" data-code=\"H1624\">striven</span> against the LORD.","25":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> his <span class=\"wl wl-kjv\" data-code=\"H214\">armoury,</span> and hath brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons</span> of his <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation:</span> for this is the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> of the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the Chaldeans.","26":"<span class=\"wl wl-kjv\" data-code=\"H935\">Come</span> against her from the utmost <span class=\"wl wl-kjv\" data-code=\"H7093\">border,</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> her <span class=\"wl wl-kjv\" data-code=\"H3965\">storehouses:</span> cast her <span class=\"wl wl-kjv\" data-code=\"H5549\">up</span> as <span class=\"wl wl-kjv\" data-code=\"H6194\">heaps,</span> and destroy her <span class=\"wl wl-kjv\" data-code=\"H2763\">utterly:</span> let nothing of her be left.","27":"<span class=\"wl wl-kjv\" data-code=\"H2717\">Slay</span> all her <span class=\"wl wl-kjv\" data-code=\"H6499\">bullocks;</span> let them go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H2874\">slaughter:</span> <span class=\"wl wl-kjv\" data-code=\"H1945\">woe</span> unto them! for their <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of their visitation.","28":"The <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of them that <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> and escape <span class=\"wl wl-kjv\" data-code=\"H6405\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> to <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> the <span class=\"wl wl-kjv\" data-code=\"H5360\">vengeance</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> the <span class=\"wl wl-kjv\" data-code=\"H5360\">vengeance</span> of his temple.","29":"Call <span class=\"wl wl-kjv\" data-code=\"H8085\">together</span> the <span class=\"wl wl-kjv\" data-code=\"H7228\">archers</span> against <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon:</span> all ye that <span class=\"wl wl-kjv\" data-code=\"H1869\">bend</span> the <span class=\"wl wl-kjv\" data-code=\"H7198\">bow,</span> <span class=\"wl wl-kjv\" data-code=\"H2583\">camp</span> against it round <span class=\"wl wl-kjv\" data-code=\"H5439\">about;</span> let none thereof <span class=\"wl wl-kjv\" data-code=\"H6413\">escape:</span> <span class=\"wl wl-kjv\" data-code=\"H7999\">recompense</span> her according to her <span class=\"wl wl-kjv\" data-code=\"H6467\">work;</span> according to all that she hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto her: for she hath been <span class=\"wl wl-kjv\" data-code=\"H2102\">proud</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> against the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of Israel.","30":"Therefore shall her young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">streets,</span> and all her <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H1826\">off</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","31":"Behold, I am against thee, O thou most <span class=\"wl wl-kjv\" data-code=\"H2087\">proud,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts:</span> for thy <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that I will visit","32":"And the most <span class=\"wl wl-kjv\" data-code=\"H2087\">proud</span> shall <span class=\"wl wl-kjv\" data-code=\"H3782\">stumble</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> and none shall raise him <span class=\"wl wl-kjv\" data-code=\"H6965\">up:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3341\">kindle</span> a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in his <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> all round about","33":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> The <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> were <span class=\"wl wl-kjv\" data-code=\"H6231\">oppressed</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together:</span> and all that took them <span class=\"wl wl-kjv\" data-code=\"H7617\">captives</span> held them <span class=\"wl wl-kjv\" data-code=\"H2388\">fast;</span> they <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to let them go.","34":"Their <span class=\"wl wl-kjv\" data-code=\"H1350\">Redeemer</span> is <span class=\"wl wl-kjv\" data-code=\"H2389\">strong;</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> is his <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7378\">throughly</span> <span class=\"wl wl-kjv\" data-code=\"H7378\">plead</span> their <span class=\"wl wl-kjv\" data-code=\"H7379\">cause,</span> that he may give <span class=\"wl wl-kjv\" data-code=\"H7280\">rest</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H7264\">disquiet</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of Babylon.","35":"A <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> is upon the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and upon her <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and upon her wise","36":"A <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> is upon the <span class=\"wl wl-kjv\" data-code=\"H907\">liars;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H2973\">dote:</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> is upon her mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men;</span> and they shall be dismayed.","37":"A <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> is upon their <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> and upon their <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and upon all the mingled <span class=\"wl wl-kjv\" data-code=\"H6153\">people</span> that are in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of her; and they shall become as <span class=\"wl wl-kjv\" data-code=\"H802\">women:</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> is upon her <span class=\"wl wl-kjv\" data-code=\"H214\">treasures;</span> and they shall be robbed.","38":"A <span class=\"wl wl-kjv\" data-code=\"H2721\">drought</span> is upon her <span class=\"wl wl-kjv\" data-code=\"H4325\">waters;</span> and they shall be dried <span class=\"wl wl-kjv\" data-code=\"H3001\">up:</span> for it is the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images,</span> and they are <span class=\"wl wl-kjv\" data-code=\"H1984\">mad</span> upon their idols.","39":"Therefore the wild beasts of the <span class=\"wl wl-kjv\" data-code=\"H6728\">desert</span> with the wild beasts of the <span class=\"wl wl-kjv\" data-code=\"H338\">islands</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> there, and the <span class=\"wl wl-kjv\" data-code=\"H1323\">owls</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein: and it shall be no more <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited</span> for <span class=\"wl wl-kjv\" data-code=\"H5331\">ever;</span> neither shall it be <span class=\"wl wl-kjv\" data-code=\"H7931\">dwelt</span> in from <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> to generation.","40":"As <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H4114\">overthrew</span> <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah</span> and the <span class=\"wl wl-kjv\" data-code=\"H7934\">neighbour</span> cities thereof, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> so shall no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> there, neither shall any <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> dwell","41":"Behold, a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> from the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> shall be raised <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> from the <span class=\"wl wl-kjv\" data-code=\"H3411\">coasts</span> of the earth.","42":"They shall <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> the <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> and the <span class=\"wl wl-kjv\" data-code=\"H3591\">lance:</span> they are <span class=\"wl wl-kjv\" data-code=\"H394\">cruel,</span> and will not shew <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy:</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> shall <span class=\"wl wl-kjv\" data-code=\"H1993\">roar</span> like the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7392\">ride</span> upon <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> every one put in <span class=\"wl wl-kjv\" data-code=\"H6186\">array,</span> like a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> against thee, O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of Babylon.","43":"The <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> hath <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H8088\">report</span> of them, and his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> waxed <span class=\"wl wl-kjv\" data-code=\"H7503\">feeble:</span> <span class=\"wl wl-kjv\" data-code=\"H6869\">anguish</span> took <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> of him, and <span class=\"wl wl-kjv\" data-code=\"H2427\">pangs</span> as of a woman in travail.","44":"Behold, he shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> like a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> from the <span class=\"wl wl-kjv\" data-code=\"H1347\">swelling</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation</span> of the <span class=\"wl wl-kjv\" data-code=\"H386\">strong:</span> but I will <span class=\"wl wl-kjv\" data-code=\"H7323\">make</span> them <span class=\"wl wl-kjv\" data-code=\"H7280\">suddenly</span> run <span class=\"wl wl-kjv\" data-code=\"H7323\">away</span> from her: and who is a <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> man, that I may <span class=\"wl wl-kjv\" data-code=\"H6485\">appoint</span> over her? for who is like me? and who will appoint me the <span class=\"wl wl-kjv\" data-code=\"H3259\">time?</span> and who is that <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd</span> that will <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> before","45":"Therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> ye the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H3289\">taken</span> against <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon;</span> and his <span class=\"wl wl-kjv\" data-code=\"H4284\">purposes,</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H2803\">purposed</span> against the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans:</span> Surely the <span class=\"wl wl-kjv\" data-code=\"H6810\">least</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> shall draw them <span class=\"wl wl-kjv\" data-code=\"H5498\">out:</span> surely he shall make their <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation</span> desolate","46":"At the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H8610\">taking</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is <span class=\"wl wl-kjv\" data-code=\"H7493\">moved,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> is <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> among the nations."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dienst van den profeet Jeremia","tekst":"Hebreeuws, hand."}],"2":[{"catchword":"werpt een banier op,","tekst":"Om elkeen tot opmerking te verwekken, en inzonderheid Gods volk, als door een teken of sein bijeen te roepen, en hun deze vreemde en anderszins ongelofelijke profetie van Babels gewissen val en ondergang, mitsgaders de verlossing van Gods volk, tot zijne eer en aller gelovigen troost, bekend te maken. De manier van spreken is genomen van krijgszaken."},{"catchword":"is ingenomen,","tekst":"Dat is, zal zo zekerlijk worden ingenomen, alsof het alrede geschied ware. Alzo in het volgende."},{"catchword":"Bel is beschaamd,","tekst":"De voornaamste afgod der Babyloniërs; zie Isa 46:1 , en onder Jer 51:44 ."},{"catchword":"Meródach is verpletterd,","tekst":"Dit schijnt ook een naam van een afgod geweest te zijn, hoewel er ook koningen van Babel vermeld worden, die dien naam gevoerd hebben [zie Isa 39:1 ] , vermoedelijk ter ere van dezen afgod, gelijk de kinderen Israëls den naam Gods, Ia en El, veel in hunne namen gebruikt hebben, alzo deden de Babyloniërs ook met den naam dezer afgoden, Bel en Nebo of Nebu, enz."},{"catchword":"haar","tekst":"Van de stad Babel."},{"catchword":"afgoden zijn beschaamd,","tekst":"Zie van het Hebreeuwse woord 1Sa 31:9 , en 2Sa 5:21 ."},{"catchword":"drekgoden zijn verpletterd","tekst":"Zie Lev 26:30 ."}],"3":[{"catchword":"noorden;","tekst":"Versta de Perzen en Meden, welke noordwaarts van Chaldea gelegen waren, door welken dit oordeel Gods over Babylonië begonnen, en voorts van tijd tot tijd vervolgd zou worden tot de eindelijke en gehele verwoesting toe."},{"catchword":"mensen aan tot de beesten toe","tekst":"Hebreeuws, van den mens tot het beest toe. Manier van spreken, die de uiterste verwoesting betekent; zie boven Jer 4:25 , en Jer 9:10 ."},{"catchword":"weggezworven,","tekst":"Gelijk boven Jer 9:10 ."}],"4":[{"catchword":"Israëls komen,","tekst":"Voorzoveel als deze belofte de uiterlijke verlossing uit de gevangenschap van Babel mag aangaan, kan men dit verstaan van degenen, die van de tien stammen in het land overgebleven zijnde, daarna met die van Juda en Benjamin gevankelijk zijn weggevoerd naar Babel, en met hen uit de gevangenschap zouden wederkeren. Zie 1Ch 9:3 , en Neh 11:3 . Aangaande het geestelijke, dat in dezen het voornaamste is, zie boven Jer 3:18 , met de aantekening."},{"catchword":"wenende zullen zij henengaan,","tekst":"Vanwege hunne onwaardigheid en Gods onverdiende grote genade."}],"5":[{"catchword":"aangezichten zijn;","tekst":"Dat is, zij zullen zonder omzien, of recht toe recht aan, [gelijk men zegt] naar Zion trekken; waar hun hart is, derwaarts zullen zij haasten."},{"catchword":"zij zullen komen","tekst":"Anders, [zeggende]: Komt, laat ons ons voegen tot den Heere, of vervoegt u tot den Heere."},{"catchword":"met een eeuwig verbond,","tekst":"Of, het eeuwig verbond zal niet vergeten worden. Hebreeuws, verbond der eeuwigheid; zie boven Jer 31:31-33 ."}],"6":[{"catchword":"herders","tekst":"Kerkelijke en politieke regeerders."},{"catchword":"legering","tekst":"Gelijk de kudden hare rustplaatsen plegen te hebben, waar zij nederliggen. De zin is dat Gods volk van geestelijke en lichamelijke welvaart en rust beroofd was, gelijk in het volgende verklaard wordt."}],"7":[{"catchword":"aten hen op,","tekst":"Vergelijk Deu 7:16 , en Psa 14:4 , alzo onder Jer 51:34 ."},{"catchword":"woning der gerechtigheid,","tekst":"Namelijk in Judea en bijzonderlijk Jeruzalem, waar God en zijn volk wonen, en waar God de ware gerechtigheid geopenbaard had. Zie boven Jer 31:23 ."},{"catchword":"ja,","tekst":"Of, daar, hoewel, de HEERE de verwachting hunner vaderen geweest is; dat is, diegene, op welke hunne voorvaders gehoopt hebben [zie boven Jer 14:8 ] , welker voetstappen zij nu niet gevolgd hebben, daarom met recht van hen gestraft en van ons ook geplaagd zijn, willen zij zeggen, spottenderwijze."}],"8":[{"catchword":"bokken","tekst":"Kloekmoedig en onversaagd daarheen trekkende, gelijk de bokken voor de schapen vooraan treden."},{"catchword":"voor de kudde henen","tekst":"Hebreeuws, voor het aangezicht der kudde."}],"9":[{"catchword":"rusten;","tekst":"Of, in orde stellen. Alzo vs.14."},{"catchword":"hun pijlen","tekst":"Der voorzegde verzameling."},{"catchword":"kloeken helds,","tekst":"Of, ervaren. Anders: van een held, die van kinderen berooft; dat is, die zelfs de jongelingen of jonge manschap nedervelt."},{"catchword":"ledig wederkeren","tekst":"Geen van hunne pijlen zal vergeefs geschoten worden; vergelijk 2Sa 1:22 , of, [die], [te weten, held] niet ledig wederkeert, zonder nederlaag des vijands."}],"10":[{"catchword":"verzadigd worden,","tekst":"Van roof en buit volop hebben."}],"11":[{"catchword":"gij plunderaars","tekst":"Of, plunderende, of als gij plundert."},{"catchword":"erfenis","tekst":"Van het land Kanaän en van mijn volk."},{"catchword":"geil geworden zijt","tekst":"Of, gegroeid zijn, aan het lichaam toegenomen zijt, als een jonge vaars, die in jong teder gras gaat weiden."},{"catchword":"paarden ;","tekst":"Gelijk boven Jer 47:3 ."}],"12":[{"catchword":"moeder zeer beschaamd;","tekst":"Babylon, de hoofdstad van Chaldea."},{"catchword":"achterste der heidenen,","tekst":"Dat is, de snoodste, veilste, slechtste onder alle natiën. Hebreeuws, het achterste."}],"13":[{"catchword":"fluiten over al haar plagen","tekst":"Of, schuifelen. Zie boven Jer 18:16 ."}],"14":[{"catchword":"spant","tekst":"Hebreeuws, treedt."},{"catchword":"in haar,","tekst":"Of, op, tegen."},{"catchword":"pijlen niet;","tekst":"Hebreeuws, pijl."}],"15":[{"catchword":"hand gegeven;","tekst":"Dat is, zich den Perzen en Meden onderworpen. Zie 2Ch 30:8 , met de aantekening."},{"catchword":"doet haar,","tekst":"Gelijk onder vs.29."}],"16":[{"catchword":"zaaier,","tekst":"Zelfs de landlieden, die meest weerloos zijn en nochtans zeer nodig in het land."},{"catchword":"de sikkel handelt","tekst":"Dat is, den maaier."},{"catchword":"laat hen vanwege","tekst":"Of, zij zullen zich keren, vlieden, enz.; te weten, die uit andere landen gekomen waren, om aldaar [als in een zeer rijk land] te verkeren, of die zij in dienstbaarheid getrokken hadden, of hun te hulp mochten gekomen zijn."},{"catchword":"verdrukkende zwaard,","tekst":"Vergelijk boven Jer 25:38 , en Jer 46:16 , met de aantekening."}],"17":[{"catchword":"opgegeten,","tekst":"Gelijk boven vs.7."},{"catchword":"Assur,","tekst":"Dat is, Assyrië, te weten Pul, Tiglath-Pileser en Salmanassar. Zie 2Ki 15:19-20 , 2Ki 15:29 , en 2Ki 16:7 , en 2Ki 17:3 , enz."},{"catchword":"beenderen verbrijzeld","tekst":"Hebreeuws alsof men zeide: Heeft hem gebeenderd; dat is ten uiterste verdorven en machteloos gemaakt."}],"18":[{"catchword":"bezoeking doen","tekst":"Met straffen; zie Gen 21:1 ."}],"19":[{"catchword":"weder tot zijn woning brengen,","tekst":"Dit kan men enigszins duiden op het lichamelijke, maar ziet voornamelijk op de geestelijke verzameling tot Gods kerk door den Messias, gelijk boven dikwijls."},{"catchword":"Karmel . . . Basan","tekst":"Beide in zeer vette en vruchtbare landouwen gelegen, en daarvan vermaard. Van Basan, zie Deu 32:14 , en Psa 22:13 . Van Karmel, zie 1Ki 18:19 , en een ander Karmel, 1Sa 25:2 , enz., alwaar Nabal zijne schapen had, zelfs wordt het woord Karmel ook in het algemeen gebruikt tot betekenis van een vruchtbare landouw. Zie boven Jer 2:7 ."}],"20":[{"catchword":"gezocht worden,","tekst":"De Heere wil zeggen dat Hij volkomenlijk met zijn volk zal verzoend zijn door den Messias Jezus Christus. Vergelijk boven Jer 31:34 , en Jer 33:8 , enz."},{"catchword":"overblijven","tekst":"Vergelijk Isa 10:22 ; Rom 9:27-29 ."}],"21":[{"catchword":"Tegen het land","tekst":"Gods bevel aan den koning Cyrus, van zijn optocht tegen Babel. Vergelijk Isa 45:1 , enz."},{"catchword":"Meratháïm,","tekst":"Dit vertalen velen: land der rebellieën, of rebellen, te weten der Babyloniërs, die wederspannig en bitter tegen God en zijn volk geweest waren. Zie vs.24, 29, of de twee rebellen, te weten Assyriërs en Babyloniërs. Anderen houden het voor een eigennaam van zeker land in Assyrië, waar een zeker volk, Mardi genoemd, gewoond heeft, en verstaande dat God hier den koning Cyrus last en bevel geeft, dat hij door Merathaïm en Pekod zal optrekken, en al wat achter deze landen gelegen was verwoesten."},{"catchword":"Pekod;","tekst":"Zie Eze 23:23 , waar aan dit landschap ook gedacht wordt."},{"catchword":"verban achter hen,","tekst":"Zie Deu 2:34 , alzo onder vs.26."}],"22":[{"catchword":"breuk","tekst":"Zie boven Jer 4:6 ."}],"23":[{"catchword":"Hoe is","tekst":"Eene vraag, die uit verwondering voortkomt, gelijk onder Jer 51:41 ."},{"catchword":"hamer der ganse aarde","tekst":"De Babyloniër, door wien God zijne oordelen over vele volken had uitgevoerd, die Hij door hem, als met een hamer, geslagen en verpletterd heeft. Vergelijk onder Jer 51:20 , en boven Jer 25:9 ; Isa 41:7 ."},{"catchword":"ontzetting onder de heidenen","tekst":"Of, verwoesting."}],"24":[{"catchword":"Ik heb u een strik gesteld,","tekst":"Dit is Gods antwoord op de voorgaande vraag, die voortkwam uit verwondering over ene zaak, die den mensen onmogelijk scheen te zijn."},{"catchword":"gevangen, o Babel","tekst":"Als een groot wild."},{"catchword":"dat gij het niet wist;","tekst":"Dit is onvoorziens, zonder dat gij het dacht of verwachttet, want Cyrus, de rivier de Eufraat afgeleid hebbende over het droge, is onvoorziens in de stad gevallen, bij nacht. Vergelijk onder vs.38; Dan 5:30 ."},{"catchword":"gevonden,","tekst":"Dat is, betrapt, achterhaald; vergelijk boven Jer 2:26 ."},{"catchword":"in strijd gemengd hebt","tekst":"Dat is, tegen God gestreden hebt, wiens volk gij geplaagd hebt. De manier van spreken wordt alzo vol gevonden Deu 2:9 , Deu 2:24 , enz."}],"25":[{"catchword":"schatkamer opengedaan,","tekst":"Dat is, wapenhuis."},{"catchword":"instrumenten Zijner gramschap","tekst":"Dat is, wapenen, die Hij gebruiken zal tot uitvoering van zijn rechtvaardig en verschrikkelijk oordeel over Babel; alzo Isa 13:5 ; vergelijk Psa 7:13-14 , enz."},{"catchword":"werk van den HEERE,","tekst":"Gelijk boven Jer 48:10 ."}],"26":[{"catchword":"haar","tekst":"Namelijk Babel, of tegen het, te weten land der Chaldeën, alzo in het volgende."},{"catchword":"uiterste,","tekst":"Der aarde, of des lands, alzo dat gij van het einde af begint. Anders: van dat, of tegen dat [hun] einde voorhanden is, of vanwege het einde. Men kan dit ook vergelijken met onder Jer 51:31 ."},{"catchword":"vertreedt haar als korenhopen,","tekst":"Gelijk de dorsende ossen het koren treden; vergelijk Isa 21:10 , en onder Jer 51:33 . Anders: werpt hen op als hopen; dat is, maakt grote hopen der verslagenen; of werpt alles overhoop, maakt ze tot enkel opgeworpen hopen."},{"catchword":"verbant ze;","tekst":"Gelijk boven vs.21."}],"27":[{"catchword":"Doodt met het zwaard","tekst":"In het Hebreeuws is een woord, alsof men zeide: zwaardt; dat is, slaat, doodt met het zwaard."},{"catchword":"varren,","tekst":"Dat is, rijke, geweldige, stoute pochers. Vergelijk Psa 22:13 , en Psa 68:31 , enz."},{"catchword":"afgaan ter slachting;","tekst":"Gelijk boven Jer 48:15 ."},{"catchword":"dag is gekomen,","tekst":"Dat is, de tijd hunner straf, hun van God verordineerd; zie Psa 37:13 , alzo vs.31."}],"28":[{"catchword":"gevluchten en ontkomenen","tekst":"Der Joden, die vandaar zouden ontkomen om Gods wonderwerk te boodschappen."},{"catchword":"tempels","tekst":"Die God aan de Chaldeën geoefend heeft, omdat zij den tempel verstoord en verbrand hadden; 2Ki 25:9 , alzo onder Jer 51:11 ."}],"29":[{"catchword":"schutters","tekst":"Alzo wordt het Hebreeuwse woord ook genomen Gen 49:23 ; Job 16:13 ; zie ook Psa 18:15 ."},{"catchword":"spant","tekst":"Hebreeuws, treedt."},{"catchword":"laat niemand van hen ontkomen;","tekst":"Hebreeuws, hun is, of zij hebben gene ontkoming."},{"catchword":"doet haar naar alles,","tekst":"Gelijk boven vs.15."},{"catchword":"Heilige Israëls","tekst":"Zie Psa 71:22 ."}],"31":[{"catchword":"aan u,","tekst":"Zie boven Jer 21:13 ."},{"catchword":"trotse","tekst":"Hebreeuws, trotsheid, hovaardij, hoogmoed. Zie van zulk een gebruik der Hebreeuwse spraak Job 35:13 , de zin is: Die zo trots is, dat hij de trotsheid zelve is of genoemd mag worden; alzo in vs.32."},{"catchword":"dag is gekomen,","tekst":"Gelijk boven vs.27."}],"34":[{"catchword":"zekerlijk twisten,","tekst":"Hebreeuws, twistende twisten; zie Psa 35:1 , alzo onder Jer 51:36 ."},{"catchword":"land in rust brenge,","tekst":"Het Joodse land, of zijne kerk, voornamelijk, en voorts andere landen, die van Babel zijn geplaagd."}],"36":[{"catchword":"leugenaars,","tekst":"Of, leugendichters. Versta, waarzeggers, sterrenkijkers, waar Chaldea vol van was; alzo Isa 44:25 ."}],"37":[{"catchword":"zijn paarden en over zijn wagenen,","tekst":"Het vrouwelijke geslacht [hier merendeels gebruikt] wordt hier twee malen veranderd in het mannelijke; men kan dit duiden op den koning of zijn volk."},{"catchword":"gemengden hoop,","tekst":"Krijgslieden en ander gemeen volk uit allerlei natiën bestaande."},{"catchword":"wijven worden;","tekst":"Moedeloos en weerloos. Alzo onder Jer 51:30 . Vergelijk Isa 19:16 ; Nah 3:13 , enz."}],"38":[{"catchword":"Droogte zal zijn over haar wateren,","tekst":"Vergelijk boven de aantekening vs.24."},{"catchword":"van gesneden beelden,","tekst":"Vol van afgoderij, die zij met de gesneden beelden bedrijven."},{"catchword":"razen naar","tekst":"Als dolle, onzinnige mensen. Zie van het Hebreeuwse woord Psa 5:6 ."},{"catchword":"schrikkelijke afgoden","tekst":"Hebree // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}
