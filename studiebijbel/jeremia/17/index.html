,"vertalingen":{"SVnu":{"1":"De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren;","2":"Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels.","3":"Ik zal Mijn berg met het veld, uw vermogen *en* al uw schatten ten roof geven, alsook uw hoogten, om de zonde in al uw landpalen.","4":"Zo zult u aflaten (en dat om uzelf) van uw erfenis, die Ik u gegeven heb, en Ik zal u uw vijanden doen dienen in een land, dat u niet kent; want u hebt een vuur aangestoken in Mijn toorn, tot in eeuwigheid zal het branden.","5":"Zo zegt de HEERE: Vervloekt is de man die op een mens vertrouwt, en vlees *tot* zijn arm stelt, en wiens hart van de HEERE afwijkt!","6":"Want hij zal zijn als de heide in de wildernis, die het niet merkt wanneer het goede komt; maar blijft *in* dorre plaatsen in de woestijn, *in* zout en onbewoond land.","7":"Gezegend *daarentegen* is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!","8":"Want hij zal zijn als een boom die aan het water geplant is, en zijn wortels uitschiet aan een rivier, en merkt het niet wanneer er hitte komt, maar zijn loof blijft groen; en in een jaar van droogte zorgt hij niet, en houdt niet op vrucht te dragen.","9":"Arglistig is het hart, meer dan enig ding, ja, dodelijk is het; wie zal het kennen?","10":"Ik, de HEERE, doorgrond het hart, *en* proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.","11":"*Zoals* een veldhoen *eieren* verzamelt, maar ze niet uitbroedt, *zo* is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.","12":"Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.","13":"O HEERE, Israëls Verwachting! Allen die U verlaten, zullen beschaamd worden; en die van Mij afwijken, zullen in de aarde geschreven worden; want zij verlaten de HEERE, de Springader van het levende water.","14":"Genees mij, HEERE! zo zal ik genezen worden, behoud mij, zo zal ik behouden worden; want Gij zijt mijn Lof.","15":"Zie, zij zeggen tegen mij: Waar is het woord van de HEERE? Laat het nu komen!","16":"Ik heb toch niet aangedrongen, meer dan een herder achter U *betaamde*; ook heb ik de dodelijke dag niet begeerd, Gij weet *het*; wat uit mijn lippen is gegaan, is voor Uw aangezicht geweest.","17":"Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.","18":"Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.","19":"Zo heeft de HEERE tegen mij gezegd: Ga heen en sta in de poort van de kinderen van het volk, waardoor de koningen van Juda ingaan, en waardoor zij uitgaan, ja, in alle poorten van Jeruzalem;","20":"En zeg tegen hen: Hoort het woord van de HEERE, u koningen van Juda, en heel Juda, en alle inwoners van Jeruzalem, die door deze poorten ingaan!","21":"Zo zegt de HEERE: Wacht u voor uw zielen, en draag geen last op de sabbatdag, en breng die niet in door de poorten van Jeruzalem.","22":"Ook zult u geen last uitvoeren uit uw huizen op de sabbatdag, en geen enkel werk doen; maar u zult de sabbatdag heiligen, zoals Ik uw vaderen geboden heb.","23":"Maar zij hebben niet gehoord, en hun oor niet geneigd; maar zij hebben hun nek verhard, om niet te horen, en om de tucht niet aan te nemen.","24":"Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet;","25":"Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid.","26":"En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.","27":"Maar als u naar Mij niet zult horen, om de sabbatdag te heiligen, en om geen last te dragen als u op de sabbatdag door de poorten van Jeruzalem ingaat; zo zal Ik een vuur in haar poorten aansteken, dat de paleizen van Jeruzalem zal verteren, en niet uitgeblust worden."},"SV":{"1":"De zonde van Juda is geschreven met een ijzeren griffie, met de punt eens diamants; gegraven in de tafel van hunlieder hart, en aan de hoornen uwer altaren;","2":"Gelijk hun kinderen hunner altaren gedenken, en hunner bossen, bij het groen geboomte, op de hoge heuvelen.","3":"Ik zal Mijn berg met het veld, uw vermogen *en* al uw schatten ten roof geven, *mitsgaders* uw hoogten, om de zonde in al uw landpalen.","4":"Alzo zult gij aflaten (en dat om u zelven) van uw erfenis, die Ik u gegeven heb, en Ik zal u uw vijanden doen dienen in een land, dat gij niet kent; want gijlieden hebt een vuur aangestoken in Mijn toorn, tot in eeuwigheid zal het branden.","5":"Zo zegt de HEERE: Vervloekt is de man, die op een mens vertrouwt, en vlees *tot* zijn arm stelt, en wiens hart van den HEERE afwijkt!","6":"Want hij zal zijn als de heide in de wildernis, die het niet gevoelt, wanneer het goede komt; maar blijft *in* dorre plaatsen in de woestijn, *in* zout en onbewoond land.","7":"Gezegend *daarentegen* is de man, die op den HEERE vertrouwt, en wiens vertrouwen de HEERE is!","8":"Want hij zal zijn als een boom, die aan het water geplant is, en zijn wortelen uitschiet aan een rivier, en gevoelt het niet, wanneer er een hitte komt, maar zijn loof blijft groen; en in een jaar van droogte zorgt hij niet, en houdt niet op van vrucht te dragen.","9":"Arglistig is het hart, meer dan enig ding, ja, dodelijk is het, wie zal het kennen?","10":"Ik, de HEERE, doorgrond het hart, *en* proef de nieren; en dat, om een iegelijk te geven naar zijn wegen, naar de vrucht zijner handelingen.","11":"*Gelijk* een veldhoen *eieren* vergadert, maar broedt ze niet uit, *alzo* is hij, die rijkdom vergadert, doch niet met recht; in de helft zijner dagen zal hij dien moeten verlaten, en in zijn laatste een dwaas zijn.","12":"Een troon der heerlijkheid, een hoogheid van het eerste aan, is de plaats onzes heiligdoms.","13":"O HEERE, Israëls Verwachting! allen, die U verlaten, zullen beschaamd worden; en die van mij afwijken , zullen in de aarde geschreven worden; want zij verlaten den HEERE, den Springader des levenden waters.","14":"Genees mij, HEERE! zo zal ik genezen worden, behoud mij, zo zal ik behouden worden; want Gij zijt mijn Lof.","15":"Ziet, zij zeggen tot mij: Waar is het woord des HEEREN? Laat het nu komen!","16":"Ik heb toch niet aangedrongen, meer dan een herder achter U *betaamde*; ook heb ik den dodelijken dag niet begeerd, Gij weet *het*; wat uit mijn lippen is gegaan, is voor Uw aangezicht geweest.","17":"Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage des kwaads.","18":"Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen den dag des kwaads, en verbreek hen met een dubbele verbreking.","19":"Alzo heeft de HEERE tot mij gezegd: Ga henen en sta in de poort van de kinderen des volks, door dewelke de koningen van Juda ingaan, en door dewelke zij uitgaan, ja, in alle poorten van Jeruzalem;","20":"En zeg tot hen: Hoort des HEEREN woord, gij koningen van Juda, en gans Juda, en alle inwoners van Jeruzalem, die door deze poorten ingaat!","21":"Zo zegt de HEERE: Wacht u op uw zielen, en draagt geen last op den sabbatdag, noch brengt in door de poorten van Jeruzalem.","22":"Ook zult gijlieden geen last uitvoeren uit uw huizen op den sabbatdag, noch enig werk doen; maar gij zult den sabbatdag heiligen, gelijk als Ik uw vaderen geboden heb.","23":"Maar zij hebben niet gehoord, noch hun oor geneigd; maar zij hebben hun nek verhard, om niet te horen, en om de tucht niet aan te nemen.","24":"Het zal dan geschieden, indien gij vlijtiglijk naar Mij zult horen, spreekt de HEERE, dat gij geen last door de poorten dezer stad op den sabbatdag inbrengt, en gij den sabbatdag heiligt, dat gij geen werk daarop doet;","25":"Zo zullen door de poorten dezer stad ingaan koningen en vorsten, zittende op den troon van David, rijdende op wagenen en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid.","26":"En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, aanbrengende brandoffer, en slachtoffer, en spijsoffer, en wierook, en aanbrengende lofoffer, ten huize des HEEREN.","27":"Maar indien gij naar Mij niet zult horen, om den sabbatdag te heiligen, en om geen last te dragen als gij op den sabbatdag door de poorten van Jeruzalem ingaat; zo zal Ik een vuur in haar poorten aansteken, dat de paleizen van Jeruzalem zal verteren, en niet worden uitgeblust."},"KJV":{"1":"The sin of Judah *is* written with a pen of iron, *and* with the point of a diamond: *it is* graven upon the table of their heart, and upon the horns of your altars;","2":"Whilst their children remember their altars and their groves by the green trees upon the high hills.","3":"O my mountain in the field, I will give thy substance *and* all thy treasures to the spoil, *and* thy high places for sin, throughout all thy borders.","4":"And thou, even thyself, shalt discontinue from thine heritage that I gave thee; and I will cause thee to serve thine enemies in the land which thou knowest not: for ye have kindled a fire in mine anger, *which* shall burn for ever.","5":"Thus saith the LORD; Cursed *be* the man that trusteth in man, and maketh flesh his arm, and whose heart departeth from the LORD.","6":"For he shall be like the heath in the desert, and shall not see when good cometh; but shall inhabit the parched places in the wilderness, *in* a salt land and not inhabited.","7":"Blessed *is* the man that trusteth in the LORD, and whose hope the LORD","8":"For he shall be as a tree planted by the waters, and *that* spreadeth out her roots by the river, and shall not see when heat cometh, but her leaf shall be green; and shall not be careful in the year of drought, neither shall cease from yielding fruit.","9":"The heart *is* deceitful above all *things*, and desperately wicked: who can know","10":"I the LORD search the heart, *I* try the reins, even to give every man according to his ways, *and* according to the fruit of his doings.","11":"*As* the partridge sitteth *on eggs*, and hatcheth *them* not; *so* he that getteth riches, and not by right, shall leave them in the midst of his days, and at his end shall be a fool.","12":"A glorious high throne from the beginning *is* the place of our sanctuary.","13":"O LORD, the hope of Israel, all that forsake thee shall be ashamed, *and* they that depart from me shall be written in the earth, because they have forsaken the LORD, the fountain of living waters.","14":"Heal me, O LORD, and I shall be healed; save me, and I shall be saved: for thou *art* my praise.","15":"Behold, they say unto me, Where *is* the word of the LORD? let it come","16":"As for me, I have not hastened from *being* a pastor to follow thee: neither have I desired the woeful day; thou knowest: that which came out of my lips was *right* before thee.","17":"Be not a terror unto me: thou *art* my hope in the day of evil.","18":"Let them be confounded that persecute me, but let not me be confounded: let them be dismayed, but let not me be dismayed: bring upon them the day of evil, and destroy them with double destruction.","19":"Thus said the LORD unto me; Go and stand in the gate of the children of the people, whereby the kings of Judah come in, and by the which they go out, and in all the gates of Jerusalem;","20":"And say unto them, Hear ye the word of the LORD, ye kings of Judah, and all Judah, and all the inhabitants of Jerusalem, that enter in by these gates:","21":"Thus saith the LORD; Take heed to yourselves, and bear no burden on the sabbath day, nor bring *it* in by the gates of Jerusalem;","22":"Neither carry forth a burden out of your houses on the sabbath day, neither do ye any work, but hallow ye the sabbath day, as I commanded your fathers.","23":"But they obeyed not, neither inclined their ear, but made their neck stiff, that they might not hear, nor receive instruction.","24":"And it shall come to pass, if ye diligently hearken unto me, saith the LORD, to bring in no burden through the gates of this city on the sabbath day, but hallow the sabbath day, to do no work","25":"Then shall there enter into the gates of this city kings and princes sitting upon the throne of David, riding in chariots and on horses, they, and their princes, the men of Judah, and the inhabitants of Jerusalem: and this city shall remain for ever.","26":"And they shall come from the cities of Judah, and from the places about Jerusalem, and from the land of Benjamin, and from the plain, and from the mountains, and from the south, bringing burnt offerings, and sacrifices, and meat offerings, and incense, and bringing sacrifices of praise, unto the house of the LORD.","27":"But if ye will not hearken unto me to hallow the sabbath day, and not to bear a burden, even entering in at the gates of Jerusalem on the sabbath day; then will I kindle a fire in the gates thereof, and it shall devour the palaces of Jerusalem, and it shall not be quenched."}},"tsk":{"1":[{"kopje":"geschreven","refs":["Job 19:23","Job 19:24"]},{"kopje":"gegraven","refs": e=\"H3389\">Jerusalem</span> on the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> then will I <span class=\"wl wl-kjv\" data-code=\"H3341\">kindle</span> a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> thereof, and it shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> the <span class=\"wl wl-kjv\" data-code=\"H759\">palaces</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and it shall not be quenched."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"geschreven","tekst":"Met deze gelijkenis wil God zeggen dat zij gans innerlijk en vertwijfeld boos, hardnekkig en onbekeerlijk waren; vergelijk boven Jer 13:23 ."},{"catchword":"ijzeren griffie,","tekst":"Hebreeuws, griffie des ijzers."},{"catchword":"punt","tekst":"Hebreeuws, nagel."},{"catchword":"diamants;","tekst":"Anders: duurachtigen, en vervolgens, zeer harden steen, of zeer hard ijzer, omdat sommigen menen dat het Hebreeuwse woord schamir komt van bewaren; vergelijk Eze 3:9 ."},{"catchword":"tafel","tekst":"Vergelijk deze manier van spreken met Pro 3:3 , met de aantekening."},{"catchword":"uwer","tekst":"O gij Joden; gelijk zulke veranderingen van personen en ingevoegde aanspraken bij de profeten zeer gebruikelijk zijn."},{"catchword":"altaren;","tekst":"Die gij den afgoden sticht, en welker hoornen gij met het onrein bloed uwer afgodische offeranden in het openbaar besprengt, waarop het woord hoornen kan geduid worden."}],"2":[{"catchword":"Gelijk hun kinderen","tekst":"De voorzegde boosheid der ouders blijkt aan de kinderen, wien zij de afgoderij zo ingeplant hebben, dat zij bij alle gelegenheid, waar zij bij een schonen groenen boom of op een schonen heuvel komen, niets anders in den mond hebben dan de afgoderij, die de ouders op zulke plaatsen bedrijven, en dat zij niets minder willen doen; vergelijk boven Jer 7:18 . Anders: [zij gedenken] hunner altaren, enz. gelijk zij hunner kinderen gedenken; dat is, zij beminnen de afgoderij als hun eigen kinderen; zo zijn zij daarop verzot."},{"catchword":"bossen,","tekst":"Of, bosgoden."}],"3":[{"catchword":"berg","tekst":"Namelijk Zion, of mijn gebergte; te weten van Juda, mitsgaders het effen veld. Anders, [omdat het Hebreeuwse woord beide kan betekenen]: O gij bergloper, of gij die in het gebergte woont, in het veld zal Ik u vermogen, enz.; dat is, gij die u op uw bergachtig land verlatende, geen nood meent te hebben, of gij die dagelijks op het gebergte omzwerft en omloopt om uwe afgoderij te bedrijven [hetwelk met het voorgaande en volgende ook zeer wel overeenkomt], Ik zal al uw rijkdom den vijand ten roof geven, die alles zo licht zal roven en met gemak wegvoeren, alsof het op het effen veld te doen ware. Zie onder Jer 20:5 , enz."},{"catchword":"mitsgaders","tekst":"Of, [te weten] uwer hoogten, daar gij al uw vermogen aan uwe afgoden hebt aangewend, en waar uwe zonde voornamelijk in bestaat. Vergelijk Hos 10:8 . Sommigen menen dat deze woorden in het Hebreeuws [gelijk wel somtijds geschiedt] omgezet zijn, en zetten het over: om de zonde uwer hoogten, uit vergelijking van boven Jer 15:13 ."},{"catchword":"in al uw","tekst":"Vergelijk boven Jer 15:13 ."}],"4":[{"catchword":"aflaten","tekst":"Dat is, den landbouw van Kanaän moeten onderlaten het land zal zijn sabbat of rust hebben. Vergelijk Exo 23:10-11 , en Lev 26:33-35 ."},{"catchword":"om u zelven","tekst":"Dat is, door uw eigen schuld."},{"catchword":"erfenis,","tekst":"Te weten, dit land Kanaän."},{"catchword":"gijlieden","tekst":"Gij hebt mijn zwaren toorn, en daardoor deze plaag veroorzaakt. Vergelijk boven Jer 15:14 ."},{"catchword":"eeuwigheid","tekst":"Ten aanzien der onboetvaardigen, die het vuur van mijn toorn zullen gevoelen in alle eeuwigheid; anders, een langen tijd, te weten zeventig jaren, gelijk het woord eeuwigheid somtijds genomen wordt; zie Gen 13:15 ; Deu 15:17 , enz."}],"5":[{"catchword":"mens vertrouwt,","tekst":"Gelijk de afvallige Joden op Egypte en op hun eigen rijkdom vertrouwden. Zie Isa 31:1 ; onder vs.11."},{"catchword":"vlees","tekst":"Dat is, een broos, katijvig mens. Zie Psa 56:5 ."},{"catchword":"arm stelt,","tekst":"Dat is, sterkte, hulp, bescherming. Zie 2Ch 32:8 ."}],"6":[{"catchword":"heide","tekst":"Of, een tamarisboom, of struik, die somtijds in geheel dorre of droge plaatsen gevonden wordt, waar geen ander geboomte wast, gelijk de kruidbeschrijvers betuigen. Anders: [een boom] die gans ontbloot is; gelijk het Hebreeuwse woord naar zijn eigenlijke betekenis genomen wordt; Psa 102:18 ."},{"catchword":"gevoelt,","tekst":"Hebreeuws, ziet; dat is gevoelt, verneemt. Sommigen verstaan dit en de volgende w oorden van den goddeloze zelf, die het goede niet zal zien, maar enz., de zin opeen uitkomende, vergelijk Psa 68:7 ."},{"catchword":"goede komt;","tekst":"Dat is, goed weder, regen, tijdige warmte, enz."},{"catchword":"blijft","tekst":"Hebreeuws, woont; dat is blijft altijd staan."},{"catchword":"dorre plaatsen","tekst":"Hebreeuws eigenlijk, verbrande, aangestokene; dat is zeer dorre, droge."},{"catchword":"zout","tekst":"Dat is, onvruchtbare. Zie Deu 29:23 , en Psa 107:34 . Hebreeuws, in een land der zoutigheid."},{"catchword":"onbewoond land","tekst":"Hebreeuws, en [alwaar] gij niet zult, of zoudt wonen; of, [dat] niet bewoond zal worden, of bewoond wordt, of niet bewoonbaar is; gelijk het Hebreeuwse woord [dat anderszins zitten, wonen, blijven betekent] alzo somtijds genomen is als het van plaatsen gebruikt wordt; zie onder Jer 50:39 ; Isa 13:20 ; Eze 29:11 , enz."}],"8":[{"catchword":"gevoelt het niet,","tekst":"Hebreeuws, ziet, gelijk in het voorgaande Isa 17:6 , dat is, hij lijdt daarvan geen schade, verdroogt daarom niet."},{"catchword":"blijft groen;","tekst":"Hebreeuws, is. Zie Psa 37:18 ."},{"catchword":"droogte","tekst":"Zie van het Hebreeuwse woord boven Jer 14:1 ."},{"catchword":"zorgt hij niet,","tekst":"Bij gelijkenis gesproken, gelijk tevoren, ziet niet; dat is, gevoelt niet."},{"catchword":"houdt niet op","tekst":"Hebreeuws, wijkt niet."},{"catchword":"dragen","tekst":"Hebreeuws, maken; zie boven Jer 12:2 ."}],"9":[{"catchword":"Arglistig","tekst":"Of, tukachtig, bedriegelijk, achterhoudend, genegen tot overtreding. Het Hebreeuwse woord akob is hetzelfde, waarvan de patriarch Jakob zijnen naam gekregen heeft, omdat hij zijnen broeder in de geboorte bij den hiel had; maar dat het ook de betekenis heeft van list, lage, bedrog, tukken, ondertreding, enz., blijkt niet alleen hier, maar ook boven Jer 9:4 ; Gen 27:36 ; Jos 8:13 ; 2Ki 10:19 ."},{"catchword":"hart,","tekst":"Van den mens na den val, zolang het door den geest der wedergeboorte niet is vernieuwd; en zo boos van harte waren de huichelaars en afvallige Joden, die van God afweken en op Hem niet vertrouwden, hoewel zij het niet wilden weten, maar zichzelven in hunne boosheid liefkoosden en de bestraffing der profeten verachtten, waarover God verklaart hun richter te zullen zijn, in vs.10."},{"catchword":"enig ding,","tekst":"Of, bovenal."},{"catchword":"dodelijk","tekst":"Ten dode strekkende, waar de dood aan vast is, ongeneeslijk, vertwijfeld boos. Van het Hebreeuws woord heeft de mens den naam van Enos, betekenende zijn sterflijken of ellendigen staat, in welken hij door de zonde gevallen is."}],"10":[{"catchword":"Ik, de HEERE,","tekst":"Of, Ik ben HEERE, [als zijnde een antwoord op de voorgaande vraag] die het hart doorgrondt, die de nieren proeft."},{"catchword":"proef de nieren;","tekst":"Zie Psa 7:10 ."},{"catchword":"en dat,","tekst":"Alzo wordt de Hebreeuwse letter vau ook gebruikt voor en dat, of zelfs, boven Jer 15:12 ; Eze 17:9 ; Joe 2:12 ; Amo 3:11 ; Mic 2:10 ; idem Jos 9:27 ; Jdg 7:22 , enz."},{"catchword":"wegen,","tekst":"Dat is, voornemen, handel en wandel. Zie Gen 6:12 ."},{"catchword":"naar de vrucht","tekst":"Dat is, naardat zijne werken, handelingen of zijne daden vereisen. Alzo onder Jer 21:14 , en Jer 32:19 ; vergelijk Pro 1:31 , en boven Jer 6:19 ."}],"11":[{"catchword":"broedt ze niet uit,","tekst":"Hebreeuws, baart niet; omdat het veldhoen gevangen wordt, of omdat het mannetje de eieren, die het wijfje verbergt, vindende, dezelve breekt, vertreedt, of door hittigheid in stukken wrijft, gelijk de natuurbeschrijvers betuigen, zulks dat vele van de eieren dikwijls verloren gaan. Anders: gelijk een veldhoen [eieren] vergadert, die het niet gelegd heeft, enz. Versta, vreemde eieren van andere vogels; waarom de voortkomende jongen deze vreemde moeders zouden verlaten."},{"catchword":"vergadert,","tekst":"Hebreeuws, maakt."},{"catchword":"niet met recht;","tekst":"Dat is, met onrecht."},{"catchword":"helft zijner dagen","tekst":"Vergelijk Psa 55:24 ."},{"catchword":"dien moeten verlaten,","tekst":"Rijkdom."},{"catchword":"laatste","tekst":"Dat is, einde, op het laatst, ten laatste."},{"catchword":"zijn","tekst":"Dat is, daarvoor bekend en gehouden worden, gelijk Joh 15:8 ; 2Ti 2:21 , enz."}],"12":[{"catchword":"heerlijkheid,","tekst":"Waar God zijne eer, genade en macht ten beste zijner kerk altoos geopenbaard heeft, en dienvolgens de ondankbaarheid der verachters, die zich op andere hulp verlaten, zwaarlijk zal straffen, gelijk volgt."},{"catchword":"van het eerste aan,","tekst":"Dat is, van den beginne der stichting."},{"catchword":"heiligdoms","tekst":"Dat is, van den tempel."}],"13":[{"catchword":"Israëls","tekst":"Wiens hulp Israël in noden verwacht; gelijk boven Jer 14:9 ; zie aldaar."},{"catchword":"van mij afwijken,","tekst":"Dat is, die afwijken van mij als uw profeet, die in uw naam profeteert. Hebreeuws, mijne afwijkenden, of afvalligen; vergelijk onder Jer 18:19 . Anders: die afwijken; te weten van U."},{"catchword":"aarde","tekst":"De Heere Christus zegt Luk 10:20 dat zijner discipelen namen in de hemelen geschreven zijn; daartegen wordt hier gezegd dat de afvalligen in de aarde zullen geschreven worden; dat is, alhoewel zij op aarde onder Gods en het zaad van Abraham naar het vlees, en voorts in het algemeen uiterlijk in Gods kerk gerekend worden, en daaronder somtijd den meester spelen, dat zij nochtans tot het getal der uitverkorenen niet behoren en in den hemel gene plaats zullen hebben maar onder die zullen gerekend worden, welker deel alleen op aarde is, vergelijk Psa 69:29 ; en dat hunne gedachtenis onder Gods volk op aarde zal vergaan, gelijk hetgeen geschreven is in de aarde zeer lichtelijk vergaat."},{"catchword":"Springader","tekst":"Zie Jer 2:13 ."}],"14":[{"catchword":"Genees mij,","tekst":"De profeet, zich ontzettende over de algemene en gruwelijke boosheid van zijn volk, waarmede hij te doen had, en overdenkende zijn tegenwoordige en toekomende gevaren, mitsgaders zijne gebreken en zwakheid, waarvan boven Jer 15:18 , enz. bidt God dat Hij hem oprichte, versterke en beware naar ziel en lichaam."},{"catchword":"mijn Lof","tekst":"Dat is, dien ik alleen prijs en roem, als mijnen Heiland. Vergelijk Deu 10:21 ."}],"15":[{"catchword":"zeggen tot mij","tekst":"Spottende met uwe dreigementen en uwe lankmoedigheid in het uitstellen der straf. Vergelijk Isa 5:19 ; Eze 12:22-23 , Eze 12:25 , Eze 12:27-28 ; 2Pe 3:4 ."}],"16":[{"catchword":"aangedrongen,","tekst":"Alsof de profeet zeide: Zij spreken tot mij niets anders dan of ik er op aandreef, haastte, en daarnaar wenste, dat hun het verderf mocht overkomen, daar Gij, Heere, toch weet dat ik mij niet anders gedragen, noch haastiger gesteld heb dan een profeet toestaat, die U navolgt, alleenlijk hun aanzeggende wat Gij mij hebt belast. Dit komt met het voorgaande en volgende zeer wel overeen. Anders: Ik heb toch niet aangehouden, dat ik geen herder achter U zou zijn; dat is, ik heb mij niet weigerachtig gesteld om U te volgen. Zie boven Jer 1:4 , enz."},{"catchword":"herder","tekst":"Dat is, meer dan betaamde een profeet, weidende en regerende uw volk met uw woord."},{"catchword":"dodelijken","tekst":"Dat is, den tijd huns verderfs niet gewenst, of daarnaar verlangd, zie onder Jer 18:20 , of, geen lust gehad van mijzelven, om hun hunnen ondergang te profeteren, het zijn uwe woorden, enz. Het Hebreeuwse woord is hetzelfde, dat vs.9 van des mensen hart gebruikt is."},{"catchword":"wat uit mijn lippen","tekst":"Hebreeuws, de uitgang mijner lippen."},{"catchword":"aangezicht","tekst":"Dat is, ik heb oprecht als in uwe tegenwoordigheid gesproken, mij verzekerende, dat ik er af noch toedeed, waarvan Gij getuige zijt."}],"17":[{"catchword":"verschrikking;","tekst":"Of, verslagenheid. Anders: verwoesting, verbreking, verstoring; dat Gij mij zoudt nederslaan, gelijk Gij mij gedreigd hebt, indien ik uwe beroeping zou weigeren te volgen; boven Jer 1:17 ."},{"catchword":"kwaads","tekst":"Dat is, der ellende, alsook in vs.18."}],"18":[{"catchword":"dag des kwaads,","tekst":"Zie Psa 37:13 ."},{"catchword":"dubbele verbreking","tekst":"Dat is, volkomene. Vergelijk boven Jer 16:18 ."}],"19":[{"catchword":"kinderen","tekst":"Dit ziet op ene van de voornaamste poorten der stad, waar het meeste volk bijeenkwam, omdat de koningen door dezelve gewoon waren in en uit te trekken."}],"21":[{"catchword":"op uw zielen,","tekst":"Dat is, zo lief als u uwer zielen zaligheid is. Of, wacht uzelven, of neemt acht op uwe personen, let op uzelven. Vergelijk Deu 4:15 ; Jos 23:11 ."}],"22":[{"catchword":"heiligen,","tekst":"Zie Exo 20:8 ."}],"23":[{"catchword":"gehoord,","tekst":"Dat is, gehoorzaamd."},{"catchword":"nek verhard,","tekst":"Gelijk boven Jer 7:26 ."},{"catchword":"om niet te horen,","tekst":"Gelijk boven Jer 16:12 ."},{"catchword":"tucht","tekst":"Zie Pro 1:2 , en Pro 7:22 ."}],"24":[{"catchword":"vlijtiglijk","tekst":"Hebreeuws, horende zult horen."}],"25":[{"catchword":"mannen van Juda","tekst":"Of, een iegelijk. Hebreeuws, man, gelijk boven Jer 4:3 ."},{"catchword":"bewoond worden","tekst":"Of, zal blijven in eeuwigheid. Vergelijk boven Jer 7:3 , Jer 7:7 , enz."}],"27":[{"catchword":"vuur","tekst":"Den oorlog der Babyloniërs, waardoor Jeruzalem en gans Juda zal verwoest worden. Vergelijk boven vs.4."},{"catchword":"haar poorten","tekst":"Van Jeruzalem."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The sin of Juda is written with an iron gaver, [Hebr.graver of iron] with the point [Hebr. Nail] of a diamond: [Oth.durable,and conquently very hard stone, or very hard iron. Because some are of opinion; that the Hebrew word schamir cometh from keeping. Compare Ezech.3.9.] graven in the table of their heart, [Compare this phase with prov.3.3. With the annotat.] and on the horns of your [O ye Jews; as such changings of persons, and in such speeches, are very usual with the Prophets] Altars. [Which ye set up unto idols, and whose horns ye sprinkle in publick with the unclean blood of your idolatrous offerings, whereunto the word, hons, mat be applied . By this comparison God will shew, that they were most inwardly and desparately wicked, obstinate and impenitent. Compare above chap.13.23.]"}],"2":[{"catchword":null,"tekst":"As their children remember their altars, and their groves, [or grove-gods] by the green-trees, upon the high hills. [compare above chap.2.20. The aforesaid wickednesse of the parents appeareth in their children, into whom they so implanted idolatry, that upon all occassions when they come neer to any fair green, or upon any high mountain, they have nothing else in their mouths, but Idolatry, which their parents commit in such places, and therefore they will do no lesse. Compare above chap.7.18. Oth.(they remember) their altars, &c. As they remember their children:`That is, they love Idolatry, as they love their own children; so do they dote on them.]"}],"3":[{"catchword":null,"tekst":"I will give my mountains [Namely Zion] with the field, thy substance, and all thy treasures to the spoil; [Or, my mountains; to wit, of Juda, together with the plain field. Oth. (because the Hebrew word may signify both) O thou mountain runner, or, thou that dwellest in the mountains , I will prevail against thee in the field,&c . that is, thou that reliest upon thy mountaineous land, and thinkest thyself to be in no danger: or, thou that daily wanderest and runnest to and from upon the mountains, to commit thine Idolatry, (which also very well agreeth with the fore-going, and with the following words) I will give all thy riches for a prey unto thine enemies, who shall spoil and carry away all as`easily, as if so be it were done upon the plain even field. See below chap.20.5,&c.](together with) high places, for sin, [Or,(to wit) thy high places, where thou hast bestowed all thy substance upom thy Idols, and wherein thy sin principally consisteth. Compare. Hos 10:8. Some conceive that these words are transposed in the hebrew, (as it is sometimes) and render it, for the sin of thy high places, by comparing above chap.15.13] in all thy borders.[compare above chap.15.31.]"}],"4":[{"catchword":null,"tekst":"So shall thou cease, [That is, be fain to omit the tillage of Canaan, the land shall enjoy her Sabath or rest. Compare Exo 23:10,11. and Levit.26.33,34,35.] (and that for thyself) [That is, by thine own fault] from thine heritage, [To wit, this land of Canaan] that I gave thee, and I will cause thee to serve thine enemies, in a land, which thou knowest not: [See Deut. 28.18. above chap.16.13.] for ye have kindled a fire in mine anger, [ye have procured my heavy, wrath, and consequently this plague. Compare above chap.15.14.] it shall burn forever. [In respect of the impenitent, which shall feel the fire of my wrath, unto all eternity: otherwise, a long time, to wit, seventy yeers, as the word eternity, or, ever, is sometimes taken. See Genes.13. On v.15. Deut.15. On vers.17, etc.]"}],"5":[{"catchword":null,"tekst":"Thus saith the LORD, cursed in the man, that trusteth in a man, [As the backsliding Jews trusteth in Egypt, in their own riches. See Isai.31.1. And below vers.11.] and maketh flesh [That is, a frail, miserable man. See Psal.26. On vers. 5.] his arm, [That is,strenght, help, defence. See 2 chron.32. On vers.8.] and whose heart departeth from the LORD."}],"6":[{"catchword":null,"tekst":"For he shall be like the heath in the wildernesses [Or, a Tamarisk-tree, or, shrub, which is sometimes found in most drie and barren places, where no other trees grow,as the herbarists testify. Oth.a tree that is made quite bare, or, necked, as the Hebrew word in its proper signification is taken, Psal.102.18] that feeleth [Hebr.seeth; that is, feeleth, peceiveth] it not when good [That is, good weather,rain,seasonable warmth, etc.] cometh:[some understand these and the following words of the wicked man himself, who shall not see good but, etc. The sense being but all one. Compare Psal.61.7.] but abideth,[Hebr dwelleth [That is, abideth, or continueth alwayes] (in) dry[Hebr. Properly perched, kindled; thhat is, very dry, withered] places in the wildernesse, (in) a Salt Land, [That is, barren land. See Psal.107.34 and Deut.29.23. Hebr. In a land of saltnesse] and un-inhabited. [Hebr.and (where) thou shalt not, or, shouldest not dwell: or, (which) shall not be inhabited, or, is inhabited, or is inhabitable, as the Hebrew word (which otherwise signifieth, sitting, dwelling, abiding,) is soometimes so taken, when it is used of places. See below chap.50.39. And Isai.13.20. Ezech 29.11,etc.]"}],"7":[{"catchword":null,"tekst":"Blessed (on the contrary) is the man, that trusteth in the LORD: [Compare Psal.2.12. And 34.9. prov. 16.20. and Isai..30.18.] and whose confidence the LORD is."}],"8":[{"catchword":null,"tekst":"For he shall be as a tree planted by the water, [Compare Psal.1.3] and spreadeth out her roots by a river, and feeleth [Hebr. Seeth,as in former verse.]not when heat cometh,[That is, it suffereth no damage by it, withereth not because of it] but her leaf continueth [Hebr. Is] green, [see psal 37. on vers.18] and in a yeer of drought[See of the Hebrew word rendered drought, above chap.14 on vers.1.] it careth not, [It is spoken by way of comparison, as before, seeth not; that is, feeleth not] and ceaseth not [Hebr. Departeth not] from bearing [Hebr.making. See above chap.12. On vers.2.] fruit."}],"9":[{"catchword":null,"tekst":"The heart is crafty [Or,fraudulent, deceitful,keeping back, prone to supplanting. The Hebrew word akob is the same, from whence the Patriarch Jacob had his name,because in his birth he took his brother by the heel: but that it also hath the signification of craft, lying in wait, deceit, fraud, supplanting,&c. Appeareth not onely here, but also above chap.9.4. Genes. 27.36. Jos.8.13. 2 Kings 10.19] more then anything,[Or, above all things] yea it is deadly: [Tending to death, whereunto death cleaveth, incurable, desparately wicked. From the Hebrew word man here hath the name of Enosch, signifying his mortal or miserable condition, into which is fallen by sin. By the heart here, is meant the heart of man since the fall, until it be renewed by the spirit of regeneration. And so wicked in heart were the hypocritical and back-sliding Jews, that departed from God and trusted not in him, although they would be not known to be such, but soothed and flattered themselves in their wickednesse, and despised the proof of the Prophets, for which God declareth that he will be their judge, in the next verse] who shall know it?"}],"10":[{"catchword":null,"tekst":"I the LORD search the heart,(and) try the veins:[see Psal.7.10 1Sam.16.10. Or, I the LORD,(it being as an answer to the former question)that searcheth the heart, that trieth the veins] and that, [So is the Hebrew letter vau also used for, and that, or, even, above chap.15.13. Ezech. 17.9. Joel 2.12. Amos 4.10. Micha 2.10. Also Jos.9.27. Judg.7.22, &c.] to give every man according tot his wayes,[That is, purposes, practices and conversion. See Genes.6 on vers.12.]according to the fruit of his dealings. [That is, according as his works, dealings, or his doings do require. So below chap.21.14. And 32.19. compare Prov.1. On vers.31 and above chap.6.19.]"}],"11":[{"catchword":null,"tekst":"(As) a patridge gathereth (egges,) but hatcheth them not , [Hebr. Bringeth not forth: because the patridge is taken, or, because, the male finding the egges, which the female hideth, breaketh them, treadeth them under foot, or through fiercenesse breaketh them in pieces, as the Naturalists do testify, so that many of the egges do often perish: Oth, as a patridge do gathereth (egges,) which had not laid,&c. meaning the strange egges of other fowl:for which cause the young ones when they are hatch forsake these strange dams] (so) is he that gathereth [Hebr.maketh] riches but not by right: [That is, unjustly] he shall be constrained to leave them [To wit, the riches] in the half of his dayes, [compare Psal.55 on vers.24] and his last [That is, end, at last] be a fool. [that is, be esteemed , and counted a fool, as Job 15:8.2 Tim.2.21,&c.]"}],"12":[{"catchword":null,"tekst":"A throne of glory,[Where God always manifested his honour,grace and power for the good of his Church,and consequently will severely punish the unthankfulnese of despisers, that rely upon other help, as followeth] an highness from the first, [That is, from the beginning of the building] is the place of our Sanctuary. [That is, of the Temple]"}],"13":[{"catchword":null,"tekst":"O LORD, the expectation of Israel [Whose help Israel expecteth in troubles: as above chap. 14.8 See there.] all that forsake thee shall be ashamed,[Compare Psal.73.25. Isai. 1.28.] and they that depart from me as thy Prophet, that prophesie in thy Name. Hebr. My departers,or,revolters. Compare below chap.18.19. Oth. They that depart,to wit,from thee] shall be written in the earth; [Our Saviou Christ saith,Luk 10:20. that the names of his disciples are written in the Heavens : on th contrary it is said here, that backsliders shall be written in the earth, That is, though they be counted here pon earth among the people of God, and the s // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';

      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
