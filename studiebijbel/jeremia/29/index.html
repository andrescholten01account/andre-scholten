,"vertalingen":{"SVnu":{"1":"Verder zijn dit de woorden van de brief die de profeet Jeremia zond van Jeruzalem naar de overige oudsten die gevankelijk waren weggevoerd, alsook naar de priesters, naar de profeten en naar heel het volk dat Nebukadnezar van Jeruzalem gevankelijk had weggevoerd naar Babel.","2":"(Nadat koning Jechonia, en de koningin, en de kamerlingen, de vorsten van Juda en Jeruzalem, alsook de timmerlieden en smeden van Jeruzalem waren weggegaan);","3":"Door de hand van Elasa, de zoon van Safan, en Gemarja, de zoon van Hilkia, die Zedekia, de koning van Juda, naar Babel zond, naar Nebukadnezar, de koning van Babel, en hij zei:","4":"Zo zegt de HEERE van de heerscharen[1], de God van Israël, tegen allen die gevankelijk zijn weggevoerd, die Ik gevankelijk heb laten wegvoeren van Jeruzalem naar Babel:","5":"Bouwt huizen en woont *daarin*, en plant tuinen en eet de vrucht daarvan;","6":"Neemt vrouwen, en verwekt zonen en dochters, en neemt vrouwen voor uw zonen, en geeft uw dochters aan mannen, zodat zij zonen en dochters baren; en wordt daar talrijker, en wordt niet minder.","7":"En zoekt de vrede van de stad waarheen Ik u gevankelijk heb laten wegvoeren, en bidt voor haar tot de HEERE; want in haar vrede zult u vrede hebben.","8":"Want zo zegt de HEERE van de heerscharen, de God van Israël: Laat uw profeten en uw waarzeggers, die in uw midden zijn, u niet bedriegen, en luistert niet naar uw dromers, die u laat dromen.","9":"Want zij profeteren u leugenachtig in Mijn Naam; Ik heb hen niet gezonden, spreekt de HEERE.","10":"Want zo zegt de HEERE: Zeker, als er zeventig jaren te Babel vervuld zullen zijn, zal Ik u bezoeken, en Ik zal Mijn goede woord over u waarmaken, door u terug te brengen naar deze plaats.","11":"Want Ik weet de gedachten die Ik over u koester, spreekt de HEERE, gedachten van vrede en niet van kwaad, om u het einde en de verwachting te geven.","12":"Dan zult u Mij aanroepen, en heengaan, en tot Mij bidden; en Ik zal naar u horen.","13":"En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.","14":"En Ik zal door u gevonden worden, spreekt de HEERE, en Ik zal uw gevangenschap wenden, en u verzamelen uit al de volken en uit al de plaatsen waarheen Ik u gedreven heb, spreekt de HEERE; en Ik zal u terugbrengen naar de plaats vanwaar Ik u gevankelijk heb laten wegvoeren.","15":"Omdat u zegt: de HEERE heeft ons profeten in Babel doen opstaan;","16":"Daarom zegt de HEERE zo van de koning die op Davids troon zit, en van heel het volk dat in deze stad woont, namelijk uw broeders, die met u niet zijn weggegaan in de gevangenschap;","17":"Zo zegt de HEERE van de heerscharen: Ziet, Ik zal het zwaard, de honger en de pest onder hen zenden; en Ik zal hen maken als de afschuwelijke vijgen, die vanwege hun slechtheid niet gegeten kunnen worden.","18":"En Ik zal hen achtervolgen met het zwaard, met de honger en met de pest; en Ik zal hen overgeven aan een verschrikking, in al de koninkrijken van de aarde, tot een vloek, en tot een schrik, en tot een aanfluiting, en tot een smaad, onder al de volken waarheen Ik hen zal hebben verdreven;","19":"Omdat zij naar Mijn woorden niet geluisterd hebben, spreekt de HEERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.","20":"U dan, hoort het woord van de HEERE, u allen die gevankelijk zijt weggevoerd, die Ik van Jeruzalem naar Babel heb weggezonden!","21":"Zo zegt de HEERE van de heerscharen, de God van Israël, over Achab, zoon van Kolaja, en over Zedekia, zoon van Maaseja, die u in Mijn Naam leugenachtig profeteren: Ziet, Ik zal hen geven in de hand van Nebukadnezar, de koning van Babel, en hij zal hen voor uw ogen doden.","22":"En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;","23":"Omdat zij een dwaasheid deden in Israël, en overspel bedreven met de vrouwen van hun naasten, en het woord leugenachtig spraken in Mijn Naam, wat Ik hun niet geboden had; en Ik ben Degene Die het weet, en een getuige *daarvan*, spreekt de HEERE.","24":"Tot Semaja nu, de Nechlamiet, zult u spreken en zeggen:","25":"Zo spreekt de HEERE van de heerscharen, de God van Israël: Omdat u brieven in uw naam gezonden hebt aan heel het volk dat te Jeruzalem is, en aan Zefanja, de zoon van Maaseja, de priester, en aan alle priesters, en zei:","26":"De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn *in* het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.","27":"Nu dan, waarom hebt u Jeremia, de Anathothiet, niet bestraft, die zich bij u voor een profeet uitgeeft?","28":"Want daarom heeft hij naar ons in Babel gezonden en gezegd: Het zal lang duren; bouwt huizen en woont *daarin*, en plant tuinen en eet de vrucht daarvan.","29":"Zefanja nu, de priester, had deze brief voorgelezen voor de oren van de profeet Jeremia.","30":"Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:","31":"Zend heen naar allen die gevankelijk weggevoerd zijn, en zeg: Zo zegt de HEERE van Semaja, de Nechlamiet: Omdat Semaja u geprofeteerd heeft, terwijl Ik hem niet gezonden heb, en gemaakt heeft dat u op een leugen vertrouwt;","32":"Daarom zegt de HEERE zo: Ziet, Ik zal bezoeking doen over Semaja, de Nechlamiet, en over zijn nageslacht; hij zal niemand hebben die in het midden van dit volk woont, en zal het goede niet zien dat Ik Mijn volk doen zal, spreekt de HEERE; want hij heeft een afval gesproken tegen de HEERE."},"SV":{"1":"Voorts zijn dit de woorden des briefs, dien de profeet Jeremia zond van Jeruzalem tot de overige oudsten, die gevankelijk waren weggevoerd, mitsgaders tot de priesteren, en tot de profeten, en tot het ganse volk, dat Nebukadnezar van Jeruzalem gevankelijk had weggevoerd naar Babel.","2":"( Nadat de koning Jechonia, en de koningin, en de kamerlingen, de vorsten van Juda en Jeruzalem, mitsgaders de timmerlieden en smeden van Jeruzalem waren uitgegaan);","3":"Door de hand van Elasa, den zoon van Safan, en Gemarja, den zoon van Hilkia, die Zedekia, de koning van Juda, naar Babel zond, tot Nebukadnezar, den koning van Babel, zeggende:","4":"Zo zegt de HEERE der heirscharen, de God Israëls, tot allen, die gevankelijk zijn weggevoerd, die Ik gevankelijk heb doen wegvoeren van Jeruzalem naar Babel:","5":"Bouwt huizen en woont *daarin*, en plant hoven en eet de vrucht daarvan;","6":"Neemt vrouwen, en gewint zonen en dochteren, en neemt vrouwen voor uw zonen, en geeft uw dochteren aan mannen, dat zij zonen en dochteren baren; en wordt aldaar vermenigvuldigd, en wordt niet verminderd.","7":"En zoekt den vrede der stad, waarhenen Ik u gevankelijk heb doen wegvoeren, en bidt voor haar tot den HEERE; want in haar vrede zult gij vrede hebben.","8":"Want zo zegt de HEERE der heirscharen, de God Israëls: Laat uw profeten en uw waarzeggers, die in het midden van u zijn, u niet bedriegen, en hoort niet naar uw dromers, die gij doet dromen.","9":"Want zij profeteren u valselijk in Mijn Naam; Ik heb hen niet gezonden, spreekt de HEERE.","10":"Want zo zegt de HEERE: Zekerlijk, als zeventig jaren te Babel zullen vervuld zijn, zal Ik ulieden bezoeken, en Ik zal Mijn goed woord over u verwekken, u wederbrengende tot deze plaats.","11":"Want Ik weet de gedachten, die Ik over u denk, spreekt de HEERE, gedachten des vredes, en niet des kwaads, dat Ik u geve het einde en de verwachting.","12":"Dan zult gij Mij aanroepen, en henengaan, en tot Mij bidden; en Ik zal naar u horen.","13":"En gij zult Mij zoeken en vinden, wanneer gij naar Mij zult vragen met uw ganse hart.","14":"En Ik zal van ulieden gevonden worden, spreekt de HEERE, en Ik zal uw gevangenis wenden, en u vergaderen uit al de volken, en uit al de plaatsen, waarhenen Ik u gedreven heb, spreekt de HEERE; en Ik zal u wederbrengen tot de plaats, van waar Ik u gevankelijk heb doen wegvoeren.","15":"Omdat gij zegt: de HEERE heeft ons profeten naar Babel verwekt;","16":"Daarom zegt de HEERE alzo van den koning, die op Davids troon zit, en van al het volk, dat in deze stad woont, *te* *weten*, uw broederen, die met u niet zijn uitgegaan in de gevangenis;","17":"Alzo zegt de HEERE der heirscharen: Ziet, Ik zal het zwaard, den honger en de pestilentie onder hen zenden; en Ik zal ze maken als de afschuwelijke vijgen, die vanwege de boosheid niet kunnen gegeten worden.","18":"En Ik zal ze achterna jagen met het zwaard, met den honger en met de pestilentie; en Ik zal ze overgeven tot een beroering, allen koninkrijken der aarde, tot een vloek, en tot een schrik, en tot een aanfluiting, en tot een smaadheid, onder al de volken, waar Ik ze henengedreven zal hebben;","19":"Omdat zij naar Mijn woorden niet gehoord hebben, spreekt de HEERE, als Ik Mijn knechten, de profeten, tot hen zond, vroeg op zijnde en zendende; maar gijlieden hebt niet gehoord, spreekt de HEERE.","20":"Gij dan, hoort des HEEREN woord, gij allen, die gevankelijk zijt weggevoerd, die Ik van Jeruzalem naar Babel heb weggezonden!","21":"Zo zegt de HEERE der heirscharen, de God Israëls, van Achab, zoon van Kolaja, en van Zedekia, zoon van Maaseja, die ulieden in Mijn Naam valselijk profeteren: Ziet, Ik zal hen geven in de hand van Nebukadnezar, den koning van Babel, en hij zal ze voor uw ogen slaan.","22":"En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda, die in Babel zijn, dat men zegge: De HEERE stelle u als Zedekia, en als Achab, die de koning van Babel aan het vuur braadde;","23":"Omdat zij een dwaasheid deden in Israël, en overspel bedreven met de vrouwen hunner naasten, en spraken het woord valselijk in Mijn Naam, dat Ik hun niet geboden had; en Ik ben Degene, Die het weet, en een getuige *daarvan*, spreekt de HEERE.","24":"Tot Semaja nu, den Nechlamiet, zult gij spreken, zeggende:","25":"Zo spreekt de HEERE der heirscharen, de God Israëls, zeggende: Omdat gij brieven in uw naam gezonden hebt tot al het volk, dat te Jeruzalem is, en tot Zefanja, den zoon van Maaseja, den priester, en tot al de priesteren, zeggende:","26":"De HEERE heeft u tot priester gesteld, in plaats van den priester Jojada, dat gij opzieners zoudt zijn *in* des HEEREN huis over allen man, die onzinnig is, en zich voor een profeet uitgeeft, dat gij dien stelt in de gevangenis en in den stok.","27":"Nu dan, waarom hebt gij Jeremia, den Anathothiet, niet gescholden, die zich bij ulieden voor een profeet uitgeeft?","28":"Want daarom heeft hij tot ons *naar* Babel gezonden, zeggende: Het zal lang duren; bouwt huizen, en woont *daarin*, en plant hoven, en eet de vrucht daarvan.","29":"Zefanja nu, de priester, had dezen brief gelezen voor de oren van den profeet Jeremia.","30":"Daarom geschiedde des HEEREN woord tot Jeremia, zeggende:","31":"Zend henen tot allen, die gevankelijk weggevoerd zijn, zeggende: Zo zegt de HEERE van Semaja, den Nechlamiet: Omdat Semaja ulieden geprofeteerd heeft, daar Ik hem niet gezonden heb, en heeft gemaakt, dat gij op leugen vertrouwt;","32":"Daarom zegt de HEERE alzo: Ziet, Ik zal bezoeking doen over Semaja, den Nechlamiet, en over zijn zaad; hij zal niemand hebben, die in het midden dezes volks wone, en zal het goede niet zien, dat Ik Mijn volke doen zal, spreekt de HEERE; want hij heeft een afval gesproken tegen den HEERE."},"KJV":{"1":"Now these *are* the words of the letter that Jeremiah the prophet sent from Jerusalem unto the residue of the elders which were carried away captives, and to the priests, and to the prophets, and to all the people whom Nebuchadnezzar had carried away captive from Jerusalem to Babylon;","2":"(After that Jeconiah the king, and the queen, and the eunuchs, the princes of Judah and Jerusalem, and the carpenters, and the smiths, were departed from Jerusalem;)","3":"By the hand of Elasah the son of Shaphan, and Gemariah the son of Hilkiah, (whom Zedekiah king of Judah sent unto Babylon to Nebuchadnezzar king of Babylon) saying,","4":"Thus saith the LORD of hosts, the God of Israel, unto all that are carried away captives, whom I have caused to be carried away from Jerusalem unto Babylon;","5":"Build ye houses, and dwell *in them*; and plant gardens, and eat the fruit","6":"Take ye wives, and beget sons and daughters; and take wives for your sons, and give your daughters to husbands, that they may bear sons and daughters; that ye may be increased there, and not diminished.","7":"And seek the peace of the city whither I have caused you to be carried away captives, and pray unto the LORD for it: for in the peace thereof shall ye have peace.","8":"For thus saith the LORD of hosts, the God of Israel; Let not your prophets and your diviners, that *be* in the midst of you, deceive you, neither hearken to your dreams which ye cause to be dreamed.","9":"For they prophesy falsely unto you in my name: I have not sent them, saith the LORD.","10":"For thus saith the LORD, That after seventy years be accomplished at Babylon I will visit you, and perform my good word toward you, in causing you to return to this place.","11":"For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.","12":"Then shall ye call upon me, and ye shall go and pray unto me, and I will hearken","13":"And ye shall seek me, and find *me*, when ye shall search for me with all your heart.","14":"And I will be found of you, saith the LORD: and I will turn away your captivity, and I will gather you from all the nations, and from all the places whither I have driven you, saith the LORD; and I will bring you again into the place whence I caused you to be carried away captive.","15":"Because ye have said, The LORD hath raised us up prophets in Babylon;","16":"*Know* that thus saith the LORD of the king that sitteth upon the throne of David, and of all the people that dwelleth in this city, *and* of your brethren that are not gone forth with you into captivity;","17":"Thus saith the LORD of hosts; Behold, I will send upon them the sword, the famine, and the pestilence, and will make them like vile figs, that cannot be eaten, they are so evil.","18":"And I will persecute them with the sword, with the famine, and with the pestilence, and will deliver them to be removed to all the kingdoms of the earth, to be a curse, and an astonishment, and an hissing, and a reproach, among all the nations whither I have driven","19":"Because they have not hearkened to my words, saith the LORD, which I sent unto them by my servants the prophets, rising up early and sending *them*; but ye would not hear, saith the LORD.","20":"Hear ye therefore the word of the LORD, all ye of the captivity, whom I have sent from Jerusalem to Babylon:","21":"Thus saith the LORD of hosts, the God of Israel, of Ahab the son of Kolaiah, and of Zedekiah the son of Maaseiah, which prophesy a lie unto you in my name; Behold, I will deliver them into the hand of Nebuchadrezzar king of Babylon; and he shall slay them before your eyes;","22":"And of them shall be taken up a curse by all the captivity of Judah which *are* in Babylon, saying, The LORD make thee like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire;","23":"Because they have committed villany in Israel, and have committed adultery with their neighbours' wives, and have spoken lying words in my name, which I have not commanded them; even I know, and *am* a witness, saith the LORD.","24":"*Thus* shalt thou also speak to Shemaiah the Nehelamite, saying,","25":"Thus speaketh the LORD of hosts, the God of Israel, saying, Because thou hast sent letters in thy name unto all the people that *are* at Jerusalem, and to Zephaniah the son of Maaseiah the priest, and to all the priests, saying,","26":"The LORD hath made thee priest in the stead of Jehoiada the priest, that ye should be officers in the house of the LORD, for every man *that is* mad, and maketh himself a prophet, that thou shouldest put him in prison, and in the stocks.","27":"Now therefore why hast thou not reproved Jeremiah of Anathoth, which maketh himself a prophet","28":"For therefore he sent unto us *in* Babylon, saying, This *captivity is* long: build ye houses, and dwell *in them*; and plant gardens, and eat the fruit","29":"And Zephaniah the priest read this letter in the ears of Jeremiah the prophet.","30":"Then came the word of the LORD unto Jeremiah, saying,","31":"Send to all them of the captivity, saying, Thus saith the LORD concerning Shemaiah the Nehelamite; Because that Shemaiah hath prophesied unto you, and I sent him not, and he caused you to trust in a lie:","32":"Therefore thus saith the LORD; Behold, I will punish Shemaiah the Nehelamite, and his seed: he shall not have a man to dwell among this people; neither shall he behold the good that I will do for my people, saith the LORD; because he hath taught rebellion against the LORD."}},"tsk":{"1":[{"kopje":"van de brief","refs":["Jer 29:25-29","2 Kron 30:1-6","Est 9:20","Hand 15:23","2 Kor 7:8","Gal 6:11","Hebr 13:22","Openb 2:1","Openb 3:22"]},{"kopje":"de oudsten","refs":["Jer 24:1-7","Jer 28:4"]}],"2":[{"kopje":"Jechonia","refs":["Jer 22:24-28","Jer 27:20","Jer 28:4","2 Kon 24:12-16","2 Kron 36:9","2 Kron 36:10"]},{"kopje":"kamerlingen","refs":["2 Kon 9:32","2 Kon 20:18","Dan 1:3-21"]}],"3":[{"kopje":"Safan","refs":["Jer 26:24","Jer 39:14","2 Kon 22:8","Ezech 8:11"]},{"kopje":"Gemarja","refs":["Jer 36:25","2 Kon 22:12","2 Kron 34:20"]}],"4":[{"kopje":"die Ik","refs":["Jer 24:5","Jes 5:5","Jes 10:5","Jes 10:6","Jes 45:7","Jes 59:1","Jes 59:2","Amos 3:6"]}],"6":[{"kopje":"Neemt","refs":["Jer 16:2-4","Gen 1:27","Gen 1:28","Gen 9:7","1 Tim 5:14"]},{"kopje":"neemt vrouwen","refs":["Gen 21:21","Gen 24:3","Gen 24:4","Gen 24:51","Gen 24:60","Gen 28:1-4","Gen 29:19","Gen 34:4","Richt 1:12-14","Richt 12:9" these are the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H5612\">letter</span> that <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3499\">residue</span> of the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> which were carried away <span class=\"wl wl-kjv\" data-code=\"H1473\">captives,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> whom <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadnezzar</span> had carried away <span class=\"wl wl-kjv\" data-code=\"H1540\">captive</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to Babylon;","2":"<span class=\"wl wl-kjv\" data-code=\"H310\">(After</span> that <span class=\"wl wl-kjv\" data-code=\"H3204\">Jeconiah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1377\">queen,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5631\">eunuchs,</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2796\">carpenters,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4525\">smiths,</span> were <span class=\"wl wl-kjv\" data-code=\"H3318\">departed</span> from Jerusalem;)","3":"By the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H501\">Elasah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan,</span> and <span class=\"wl wl-kjv\" data-code=\"H1587\">Gemariah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah,</span> (whom <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> to <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadnezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon)</span> saying,","4":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> unto all that are carried away <span class=\"wl wl-kjv\" data-code=\"H1473\">captives,</span> whom I have caused to be carried <span class=\"wl wl-kjv\" data-code=\"H1540\">away</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> unto Babylon;","5":"<span class=\"wl wl-kjv\" data-code=\"H1129\">Build</span> ye <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in them; and <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> <span class=\"wl wl-kjv\" data-code=\"H1593\">gardens,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the fruit","6":"<span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> ye <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">beget</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters;</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> for your <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> your <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> to <span class=\"wl wl-kjv\" data-code=\"H582\">husbands,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H3205\">bear</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and <span class=\"wl wl-kjv\" data-code=\"H1121\">daughters;</span> that ye may be <span class=\"wl wl-kjv\" data-code=\"H7235\">increased</span> there, and not diminished.","7":"And <span class=\"wl wl-kjv\" data-code=\"H1875\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> whither I have caused you to be carried away <span class=\"wl wl-kjv\" data-code=\"H1540\">captives,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for it: for in the <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> thereof shall ye have peace.","8":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Let not your <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> and your <span class=\"wl wl-kjv\" data-code=\"H7080\">diviners,</span> that be in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of you, <span class=\"wl wl-kjv\" data-code=\"H5377\">deceive</span> you, neither <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> to your <span class=\"wl wl-kjv\" data-code=\"H2472\">dreams</span> which ye cause to be dreamed.","9":"For they <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">falsely</span> unto you in my <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> I have not <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> them, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","10":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> That <span class=\"wl wl-kjv\" data-code=\"H6310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> be <span class=\"wl wl-kjv\" data-code=\"H4390\">accomplished</span> at <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> I will <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> you, and <span class=\"wl wl-kjv\" data-code=\"H6965\">perform</span> my <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> toward you, in causing you to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to this place.","11":"For I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts</span> that I <span class=\"wl wl-kjv\" data-code=\"H2803\">think</span> toward you, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts</span> of <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> and not of <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you an <span class=\"wl wl-kjv\" data-code=\"H8615\">expected</span> end.","12":"Then shall ye <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> upon me, and ye shall <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> unto me, and I will hearken","13":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> me, and <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> me, when ye shall <span class=\"wl wl-kjv\" data-code=\"H1875\">search</span> for me with all your heart.","14":"And I will be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> of you, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and I will turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> your <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> you from all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and from all the <span class=\"wl wl-kjv\" data-code=\"H4725\">places</span> whither I have <span class=\"wl wl-kjv\" data-code=\"H5080\">driven</span> you, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and I will bring you <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> into the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> whence I caused you to be carried away captive.","15":"Because ye have <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath raised us <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> in Babylon;","16":"Know that thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and of all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth</span> in this <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and of your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> that are not gone <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> with you into captivity;","17":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> upon them the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> them like <span class=\"wl wl-kjv\" data-code=\"H8182\">vile</span> <span class=\"wl wl-kjv\" data-code=\"H8384\">figs,</span> that cannot be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten,</span> they are so evil.","18":"And I will <span class=\"wl wl-kjv\" data-code=\"H7291\">persecute</span> <span class=\"wl wl-kjv\" data-code=\"H310\">them</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> with the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> them to be <span class=\"wl wl-kjv\" data-code=\"H2189\">removed</span> to all the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> to be a <span class=\"wl wl-kjv\" data-code=\"H423\">curse,</span> and an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment,</span> and an <span class=\"wl wl-kjv\" data-code=\"H8322\">hissing,</span> and a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach,</span> among all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> whither I have driven","19":"Because they have not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> to my <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto them by my <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> rising up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sending</span> them; but ye would not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","20":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> ye therefore the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> all ye of the <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity,</span> whom I have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to Babylon:","21":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6964\">Kolaiah,</span> and of <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4641\">Maaseiah,</span> which <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> a <span class=\"wl wl-kjv\" data-code=\"H8267\">lie</span> unto you in my <span class=\"wl wl-kjv\" data-code=\"H8034\">name;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5221\">slay</span> them before your eyes;","22":"And of them shall be taken <span class=\"wl wl-kjv\" data-code=\"H3947\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H7045\">curse</span> by all the <span class=\"wl wl-kjv\" data-code=\"H1546\">captivity</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> which are in <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thee like <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> and like <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> whom the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> <span class=\"wl wl-kjv\" data-code=\"H7033\">roasted</span> in the fire;","23":"Because they have <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> <span class=\"wl wl-kjv\" data-code=\"H5039\">villany</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and have <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery</span> with their <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbours'</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in my <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> which I have not <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them; even I <span class=\"wl wl-kjv\" data-code=\"H3045\">know,</span> and am a <span class=\"wl wl-kjv\" data-code=\"H5707\">witness,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","24":"Thus shalt thou also <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> to <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5161\">Nehelamite,</span> saying,","25":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">speaketh</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Because thou hast <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> in thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that are at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and to <span class=\"wl wl-kjv\" data-code=\"H6846\">Zephaniah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4641\">Maaseiah</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> saying,","26":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thee <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> in the stead of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> that ye should be <span class=\"wl wl-kjv\" data-code=\"H6496\">officers</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> for every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that is <span class=\"wl wl-kjv\" data-code=\"H7696\">mad,</span> and maketh himself a <span class=\"wl wl-kjv\" data-code=\"H5012\">prophet,</span> that thou shouldest <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> him in <span class=\"wl wl-kjv\" data-code=\"H4115\">prison,</span> and in the stocks.","27":"Now therefore why hast thou not <span class=\"wl wl-kjv\" data-code=\"H1605\">reproved</span> <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> of <span class=\"wl wl-kjv\" data-code=\"H6069\">Anathoth,</span> which maketh himself a prophet","28":"For therefore he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto us in <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H1931\">This</span> captivity is <span class=\"wl wl-kjv\" data-code=\"H752\">long:</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> ye <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in them; and <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> <span class=\"wl wl-kjv\" data-code=\"H1593\">gardens,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the fruit","29":"And <span class=\"wl wl-kjv\" data-code=\ // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

function kopieerVers(n) {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {

    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];

    } else {

    return label + refChips(nd.refs) + kids;
  };

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);

  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
