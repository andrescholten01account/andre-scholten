en zij aan hem over. Tobia dan stuurde brieven om mij bang te maken.", "2 Kron 29:8": "Daarom is er een grote toorn van de HEERE over Juda en Jeruzalem geweest; en Hij heeft hen overgegeven aan opschudding, verwoesting en aanfluiting, zoals u ziet met uw eigen ogen.", "Deut 13:1-5": "Wanneer een profeet, of iemand die dromen droomt, in uw midden opstaat, en u een teken of wonder geeft; en dat teken of dat wonder komt uit, waarover hij tot u gesproken had, en zei: Laat ons andere goden, die u niet gekend hebt, navolgen en hen dienen; dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Ps 42:2-5": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God! Mijn ziel dorst naar God, naar de levende God; wanneer zal ik binnengaan en voor het aangezicht van God verschijnen? Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "Jer 7:13-15": "En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt; daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb. En Ik zal u van Mijn aangezicht wegwerpen, zoals Ik al uw broeders, het hele nageslacht van Efraïm, weggeworpen heb.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "2 Sam 7:15": "Maar Mijn goedertierenheid zal van hem niet wijken, zoals Ik die weggenomen heb van Saul, die Ik van voor uw aangezicht heb weggenomen.", "Jes 10:25": "want nog een klein weinig, dan zal de gramschap volbracht worden, en Mijn toorn tot hun vernieling.", "Jer 42:18": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Zoals Mijn toorn en Mijn grimmigheid uitgestort is over de inwoners van Jeruzalem, zo zal Mijn grimmigheid over u uitgestort worden, als u in Egypte gekomen zult zijn; en u zult tot een vervloeking zijn, en tot een ontzetting, en tot een vloek, en tot smaad, en u zult deze plaats niet meer zien.", "Jes 65:16": "Zodat wie zich zal zegenen op aarde, zich zal zegenen in de God van de waarheid; en wie zal zweren op aarde, zal zweren bij de God van de waarheid, omdat de vorige benauwdheden vergeten zullen zijn, en omdat zij voor Mijn ogen verborgen zijn.", "Jer 3:7-10": "En Ik zei, nadat zij dit alles gedaan had: Bekeer u tot Mij; maar zij bekeerde zich niet. Dit zag haar trouweloze zuster Juda. En Ik zag, toen Ik vanwege alles waarin het afgekeerde Israël overspel had gepleegd, haar had weggestuurd en haar een scheidbrief had gegeven, dat de trouweloze Juda, haar zuster, niet vreesde, maar wegging en zelf ook hoereerde. Ja, het gebeurde, vanwege het gerucht van haar hoererij, dat zij het land ontheiligde; want zij bedreef overspel met steen en met hout.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Ps 119:156": "HEERE! Uw barmhartigheden zijn vele; maak mij levend naar Uw rechten.", "Ps 55:18": "'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.", "Jes 66:5-22": "Hoor het woord van de HEERE, u die voor Zijn woord beeft! Uw broeders, die u haten, die u ver wegsturen, om Mijn Naam, zeggen: Laat de HEERE heerlijk worden! Maar Hij zal verschijnen tot uw vreugde, zij daarentegen zullen beschaamd worden. Er zal een stem van een groot rumoer uit de stad zijn, een stem uit de tempel, de stem van de HEERE, Die Zijn vijanden de verdiensten vergeldt. Voordat zij barensnood had, heeft zij gebaard, voordat haar smart kwam, is zij al van een jongetje bevrijd.", "Gen 20:7": "Geef dan nu de vrouw van deze man terug, want hij is een profeet, en hij zal voor u bidden, zodat u blijft leven; maar als u haar niet teruggeeft, weet dan dat u zeker sterven zult, u en al wat van u is!", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Ex 32:9-14": "Verder zei de HEERE tegen Mozes: Ik heb dit volk gezien, en zie, het is een hardnekkig volk! En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken. Doch Mozes smeekte de HEERE zijn God, en zei: O HEERE, waarom zou Uw toorn ontsteken tegen Uw volk, dat Gij met grote kracht en met een sterke hand uit Egypteland hebt uitgevoerd?", "Jes 33:13-24": "Hoort, u die ver weg bent, wat Ik gedaan heb; en u, die nabij bent, erken Mijn macht! De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen? Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Hebr 3:8": "Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Rom 8:26": "En evenzo komt ook de Geest onze zwakheden te hulp; want wij weten niet wat wij bidden moeten zoals het behoort, maar de Geest Zelf bidt voor ons met onuitsprekelijke zuchten.", "1 Sam 15:23": "Want weerspannigheid is een zonde als toverij, en weerstreven is afgoderij en beeldendienst. Omdat u het woord van de HEERE verworpen hebt, zo heeft Hij u verworpen, dat u geen koning meer zult zijn.", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Jer 29:1-14": "Verder zijn dit de woorden van de brief die de profeet Jeremia zond van Jeruzalem naar de overige oudsten die gevankelijk waren weggevoerd, alsook naar de priesters, naar de profeten en naar heel het volk dat Nebukadnezar van Jeruzalem gevankelijk had weggevoerd naar Babel. (Nadat koning Jechonia, en de koningin, en de kamerlingen, de vorsten van Juda en Jeruzalem, alsook de timmerlieden en smeden van Jeruzalem waren weggegaan); Door de hand van Elasa, de zoon van Safan, en Gemarja, de zoon van Hilkia, die Zedekia, de koning van Juda, naar Babel zond, naar Nebukadnezar, de koning van Babel, en hij zei:", "Ps 119:10": "Ik zoek U met mijn hele hart, laat mij van Uw geboden niet afdwalen.", "Ps 107:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Ezra 7:1": "Na deze geschiedenissen, in het koninkrijk van Arthahsasta, koning van Perzië: Ezra, de zoon van Seraja, de zoon van Azarja, de zoon van Hilkia,", "Ezech 13:23": "Daarom zult u niet meer nietigheid zien, en geen waarzegging meer gebruiken; maar Ik zal Mijn volk uit uw hand redden, en u zult weten dat Ik de HEERE ben.", "Openb 2:1": "Schrijf aan de engel van de gemeente van Efeze: Dit zegt Hij, Die de zeven sterren in Zijn rechterhand houdt, Die in het midden van de zeven gouden kandelaren wandelt:", "2 Kor 11:33": "En ik werd door een venster in een mand over de muur neergelaten, en ontkwam aan zijn handen.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Ps 25:10": "Caph. Alle paden van de HEERE zijn goedertierenheid en waarheid, voor hun die Zijn verbond en Zijn getuigenissen bewaren.", "Lev 23:26-29": "Verder sprak de HEERE tot Mozes en zei: Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren. En op diezelfde dag zult u geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht van de HEERE, uw God.", "Job 9:2": "Waarlijk, ik weet dat het zo is; want hoe zou de mens rechtvaardig zijn bij God?", "Hos 2:17": "En Ik zal op die dag een verbond voor hen sluiten met het wild gedierte van het veld, en met het gevogelte van de hemel, en het kruipend gedierte van de aardbodem; en Ik zal de boog, en het zwaard, en de oorlog van de aarde wegbreken, en Ik zal hen in veiligheid laten neerliggen.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Ps 63:2": "O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water.", "Jer 25:4": "Ook heeft de HEERE tot u gezonden al Zijn dienstknechten, de profeten, vroeg opstaand en zendend (maar u hebt niet gehoord, noch uw oor geneigd om te horen);", "Ps 40:9": "Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "Hos 14:2-9": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Ps 37:4": "En verlustig u in de HEERE, zo zal Hij u geven de verlangens van uw hart.", "2 Kon 12:13": "Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.", "2 Kon 16:18": "Daarbij haalde hij het overdekte gedeelte van de sabbat, dat zij in het huis gebouwd hadden, en de buitenste ingang van de koning weg van het huis van de HEERE, vanwege de koning van Assyrië.", "Ps 25:6": "Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.", "1 Petr 2:5": "Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus.", "2 Kon 13:23": "Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.", "Ezech 37:28": "En de heidenvolken zullen weten dat Ik de HEERE ben, Die Israël heilig maakt, als Mijn heiligdom in het midden van hen zal zijn tot in eeuwigheid.", "Jer 50:1": "Het woord dat de HEERE gesproken heeft tegen Babel, tegen het land van de Chaldeeën, door de dienst van de profeet Jeremia.", "Ps 130:8": "En Hij zal Israël verlossen van al zijn ongerechtigheden.", "Matt 17:24-27": "En toen zij in Kapernaüm gekomen waren, kwamen zij die de tempelbelasting inden naar Petrus toe en zeiden: Betaalt uw Meester de tempelbelasting niet? Hij zei: Ja. En toen hij het huis binnenkwam, sprak Jezus hem voor en zei: Wat denkt u, Simon? Van wie innen de koningen van de aarde tol of belasting: van hun eigen zonen, of van vreemden? Petrus zei tegen Hem: Van vreemden. Jezus zei tegen hem: Dan zijn de zonen dus vrij.", "Jer 24:1-3": "De HEERE liet mij zien, en zie, er waren twee vijgenkorven gezet voor de tempel van de HEERE; nadat Nebukadnezar, de koning van Babel, Jechonia, de zoon van Jojakim, de koning van Juda, gevankelijk had weggevoerd, alsook de vorsten van Juda, en de timmerlieden, en de smeden van Jeruzalem, en hen naar Babel had gebracht. In de ene korf waren zeer goede vijgen, zoals de eerste rijpe vijgen zijn; maar in de andere korf waren zeer slechte vijgen, die vanwege de slechtheid niet gegeten konden worden. En de HEERE zei tegen mij: Wat ziet u, Jeremia? En ik zei: Vijgen; de goede vijgen zijn zeer goed, en de slechte zeer slecht, die vanwege de slechtheid niet gegeten kunnen worden.", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Ps 18:51": "Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Jer 11:18": "De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.", "2 Petr 2:10-19": "maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren; terwijl de engelen, die in sterkte en kracht groter zijn, geen lasterlijk oordeel tegen hen uitspreken voor de Heere. Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden;", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Ps 63:9": "Mijn ziel kleeft U achteraan; Uw rechterhand ondersteunt mij.", "Ezra 7:23": "Alles wat naar het bevel van de God van de hemel is, dat dat vlijtig gedaan wordt, voor het huis van de God van de hemel; want waartoe zou er grote toorn zijn over het koninkrijk van de koning en zijn kinderen?", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "Jes 1:5": "Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "Gen 24:4": "maar dat u naar mijn land en naar mijn familie zult gaan, en voor mijn zoon Izak een vrouw zult nemen.", "Joh 4:10": "Jezus antwoordde en zei tegen haar: Als u de gave van God kende, en Wie Hij is, Die tegen u zegt: Geef Mij te drinken, dan zou u van Hem hebben gevraagd, en Hij zou u levend water gegeven hebben.", "Jer 15:6": "U hebt Mij verlaten, spreekt de HEERE; u bent achterwaarts gegaan; daarom zal Ik Mijn hand tegen u uitstrekken en u vernietigen; Ik ben het van het berouwen moe geworden.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Ezech 39:24": "Naar hun onreinheid en naar hun overtredingen heb Ik met hen gehandeld, en Ik heb Mijn aangezicht voor hen verborgen.", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Jer 40:1": "Het woord dat van de HEERE gebeurd is tot Jeremia, nadat Nebuzaradan, de aanvoerder van de lijfwacht, hem had laten gaan van Rama; toen hij hem had laten halen, terwijl hij met ketenen gebonden was in het midden van alle gevangenen van Jeruzalem en Juda, die naar Babel gevankelijk werden weggevoerd.", "Amos 5:14": "Zoek het goede, en niet het kwade, opdat u leeft; en zo zal de HEERE, de God van de heerscharen¹, met u zijn, zoals u zegt.", "Jer 51:10": "De HEERE heeft onze gerechtigheden hervoor gebracht; kom en laat ons in Sion het werk van de HEERE, onze God, vertellen!", "Jer 25:11": "En dit hele land zal worden tot een woestheid, tot een ontzetting; en deze volken zullen de koning van Babel dienen zeventig jaren.", "Ezech 18:31": "Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?", "Ps 116:19": "in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Ezech 8:1": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Zef 3:4": "Haar profeten zijn lichtvaardig, geheel trouweloze mannen; haar priesters verontreinigen het heilige, zij doen de wet geweld aan.", "Dan 9:4": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Jer 30:10": "Gij dan, vrees niet, o Mijn knecht Jakob! spreekt de HEERE, wees niet ontzet, Israël! Want zie, Ik zal u uit verre landen verlossen, en uw nageslacht uit het land van hun gevangenschap; en Jakob zal terugkomen, en stil en gerust zijn, en er zal niemand zijn die hem verschrikt.", "Zach 7:14": "Maar Ik heb hen weggestormd onder alle heidenvolken die zij niet kenden; en het land werd achter hen verwoest, zodat niemand er doorheen trok of terugkeerde; want zij maakten het begerenswaardige land tot een verwoesting.", "Jer 35:2": "Ga naar het huis van de Rechabieten, en spreek met hen, en breng hen in het huis van de HEERE, in een van de kamers, en geef hun wijn te drinken.", "Jer 32:26": "Toen kwam het woord van de HEERE tot Jeremia:", "Zach 12:1-14": "De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert. Zie, Ik zal Jeruzalem stellen tot een drinkschaal der zwijmeling voor alle volken rondom; ja, ook zal zij zijn over Juda, in de belegering tegen Jeruzalem. En het zal op die dag gebeuren, dat Ik Jeruzalem stellen zal tot een zware steen voor alle volken; allen die zich daarmee belasten, zullen zeker doorsneden worden; en al de volken van de aarde zullen zich tegen haar verzamelen.", "Ps 33:11": "Maar de raad van de HEERE bestaat in eeuwigheid, de gedachten van Zijn hart van geslacht tot geslacht.", "2 Kon 19:9": "Toen hij nu hoorde zeggen over Tirhaka, de koning van Cusch: Zie, hij is uitgetrokken om tegen u te strijden, stuurde hij opnieuw boden naar Hizkia, en zei:", "Jes 65:12": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb.", "Jer 3:10": "En zelfs bij dit alles heeft haar trouweloze zuster Juda zich niet met haar hele hart tot Mij bekeerd, maar slechts in schijn, spreekt de HEERE.", "Jer 25:1": "Het woord dat tot Jeremia gebeurd is over het hele volk van Juda, in het vierde jaar van Jojakim, zoon van Josia, koning van Juda (dit was het eerste jaar van Nebukadnezar, koning van Babel);", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Pred 8:2-4": "Ik zeg: let op de mond van de koning; maar houd rekening met de eed van God. Haast u niet om van zijn aangezicht weg te gaan; blijf niet staan bij een kwade zaak; want al wat hem lust, doet hij. Waar het woord van de koning is, daar is macht; en wie zal tegen hem zeggen: Wat doet u?", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Openb 22:6": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.", "Jer 28:4": "Ook zal Ik Jechonia, de zoon van Jojakim, koning van Juda, en allen die gevankelijk uit Juda zijn weggevoerd, die in Babel gekomen zijn, naar deze plaats terugbrengen, spreekt de HEERE; want Ik zal het juk van de koning van Babel verbreken.", "Jer 15:2": "En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap!", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "Jes 27:13": "En het zal op die dag gebeuren, dat er met een grote bazuin geblazen zal worden; dan zullen zij komen die verloren dreigden te gaan in het land van Assur, en de weggejaagden in het land van Egypte; en zij zullen de HEERE aanbidden op de heilige berg te Jeruzalem.", "Ex 6:28": "Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.", "Zach 7:5": "Spreek tot heel het volk van dit land, en tot de priesters: Toen u vastte en rouwklaagde, in de vijfde en in de zevende maand, namelijk nu zeventig jaren, hebt u dan voor Mij, voor Mij, werkelijk gevast?", "Luk 11:9-13": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden. En welke vader onder u zal, als de zoon hem om brood vraagt, hem een steen geven? Of ook, als hij om een vis vraagt, zal hij hem in plaats van een vis een slang geven?", "2 Kon 11:18": "Daarna ging al het volk van het land naar het huis van Baäl en brak dat af; zijn altaren en zijn beelden verbraken zij helemaal; en Mattan, de priester van Baäl, sloegen zij dood voor de altaren. De priester stelde toen ambtsdragers aan over het huis van de HEERE.", "Openb 9:20": "En de overige mensen, die niet gedood zijn door deze plagen, hebben zich niet bekeerd van de werken van hun handen, om de duivelen niet meer te aanbidden; en de gouden, en zilveren, en koperen, en stenen, en houten afgoden, die noch kunnen zien, noch horen, noch lopen;", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Jes 29:18-24": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien. En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen. Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "Jer 35:12": "Toen kwam het woord van de HEERE tot Jeremia en zei:", "Ps 78:4-72": "Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Ef 2:4-7": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "Ezra 10:8": "En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.", "Ps 83:17": "Maak hun gezicht vol schande, opdat zij, o HEERE, Uw Naam zoeken.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Jer 43:3": "Maar Baruch, de zoon van Nerija, hitst u tegen ons op, opdat hij ons overgeeft in de hand van de Chaldeeën, zodat zij ons doden en ons gevankelijk naar Babel wegvoeren.", "Jer 44:17": "Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.", "Dan 7:16": "Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.", "2 Kron 34:22": "Toen ging Hilkia, en zij die de koning had aangewezen, naar de profetes Hulda, de vrouw van Sallum, de zoon van Tokhath, de zoon van Hasra, de bewaarder van de kleding. Zij woonde te Jeruzalem, in het tweede stadsdeel; en zij spraken daarover met haar.", "Joh 8:4": "En zij zetten haar in het midden, en zeiden tegen Hem: Meester, deze vrouw is op heterdaad betrapt, terwijl zij overspel pleegde.", "Ezech 14:23": "Zo zullen zij u vertroosten, wanneer u hun weg en hun handelingen zult zien; en u zult weten dat Ik niet zonder reden heb gedaan al wat Ik in haar gedaan heb, spreekt de Heere HEERE.", "Hebr 13:18": "Bid voor ons; want wij vertrouwen dat wij een goed geweten hebben, omdat wij in alles eerlijk willen wandelen.", "Hand 17:27": "Opdat zij de Heere zouden zoeken, of zij Hem misschien konden tasten en vinden; hoewel Hij niet ver is van ieder van ons.", "2 Kron 32:17": "Ook schreef hij brieven, om de HEERE, de God van Israël, te honen en om tegen Hem te spreken, en zei: Zoals de goden van de volken van de landen hun volk niet gered hebben uit mijn hand, zo zal de God van Jehizkia Zijn volk niet redden uit mijn hand.", "Job 22:27": "U zult ernstig tot Hem bidden, en Hij zal u verhoren; en u zult uw geloften betalen.", "Ezech 13:7": "Ziet u niet een nietig gezicht, en spreekt u een leugenachtige voorzegging, als u zegt: De HEERE spreekt, terwijl Ik niet gesproken heb?", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Ezech 11:16-20": "Daarom, zeg: Zo zegt de Heere HEERE: Hoewel Ik hen ver onder de heidenvolken weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, zal Ik hun toch een korte tijd tot een heiligdom zijn, in de landen waar zij naartoe gekomen zijn. Daarom, zeg: Zo zegt de Heere HEERE: Ja, Ik zal u verzamelen uit de volken, en Ik zal u bijeenbrengen uit de landen waarin u verstrooid bent, en Ik zal u het land van Israël geven. En zij zullen daarheen komen, en al de verfoeiselen daarvan en al de gruwelen daarvan van daar wegdoen.", "Jer 35:19": "Daarom, zo zegt de HEERE van de heerscharen, de God van Israël: Er zal Jonadab, de zoon van Rechab, geen man worden afgesneden, die voor Mijn aangezicht staat, al de dagen.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "Lev 26:44": "En hierboven is dit ook: als zij in het land van hun vijanden zullen zijn, zal Ik hen niet verwerpen, en ook niet van hen walgen, om een einde aan hen te maken en Mijn verbond met hen te vernietigen; want Ik ben de HEERE, hun God!", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "Jer 33:26": "Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "Rom 11:29": "Want de genadegiften en de roeping van God zijn onberouwelijk.", "Jer 27:22": "Naar Babel zullen zij gebracht worden, en daar zullen zij zijn, tot de dag toe dat Ik ze zal opzoeken, spreekt de HEERE; dan zal Ik ze weer omhoog brengen, en zal ze terugbrengen naar deze plaats.", "Zef 2:2": "Voordat het besluit vrucht draagt (zoals kaf gaat de dag voorbij), voordat de gloed van de toorn van de HEERE over u komt; voordat de dag van de toorn van de HEERE over u komt.", "Jes 37:31": "Want wie ontkomen is, die overgebleven is van het huis van Juda, zal opnieuw naar beneden wortelen, en het zal naar boven vrucht dragen.", "Jes 59:2": "Maar uw ongerechtigheden brengen een scheiding tussen u en uw God, en uw zonden verbergen Zijn aangezicht voor u, zodat Hij niet hoort.", "Ps 63:2-9": "O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water. Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien; Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.", "Deut 28:24": "De HEERE, uw God, zal stof en poeder tot regen van uw land geven; vanuit de hemel zal het op u neerdalen, totdat u verdelgd wordt.", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "Deut 5:31": "Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.", "Joël 2:19": "En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen.", "Lev 20:14": "En wanneer een man een vrouw en haar moeder neemt, is het een schandelijke daad; men zal hem, en hen, met vuur verbranden, zodat er geen schandelijke daad in uw midden is.", "Jer 23:25-32": "Ik heb gehoord wat de profeten zeggen, die in Mijn Naam leugen profeteren, en zeggen: Ik heb gedroomd, ik heb gedroomd. Hoe lang? Is er dan een droom in het hart van de profeten, die de leugen profeteren? Ja, het zijn profeten van de bedriegerij van hun eigen hart. Die daar denken om Mijn volk Mijn Naam te doen vergeten, door hun dromen, die zij, ieder aan zijn naaste, vertellen; net zoals hun vaders Mijn Naam vergeten hebben door Baäl.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "Ps 106:25": "Maar zij morden in hun tenten; naar de stem van de HEERE luisterden zij niet.", "Mark 6:17": "Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had.", "Ezech 39:29": "En Ik zal Mijn aangezicht niet meer voor hen verbergen, wanneer Ik Mijn Geest over het huis van Israël zal hebben uitgegoten, spreekt de Heere HEERE.", "Gen 9:15": "dan zal Ik Mijn verbond gedenken, dat er is tussen Mij en tussen u, en tussen alle levende ziel van alle vlees; en het water zal niet meer worden tot een vloed, om alle vlees te verderven.", "Jes 46:11": "Die een roofvogel roept van het oosten, een man van Mijn raad uit een ver land; ja, Ik heb het gesproken, Ik zal het ook doen komen; Ik heb het geformeerd, Ik zal het ook doen.", "2 Kon 22:8": "Toen zei de hogepriester Hilkia tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE; en Hilkia gaf dat boek aan Safan, die het las.", "Ezech 3:1-11": "Daarna zei Hij tot mij: Mensenkind, eet, wat u vinden zult; eet deze rol, en ga, spreek tot het huis Israëls. Toen opende ik mijn mond, en Hij gaf mij die rol te eten. En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.", "Jer 15:4": "En Ik zal hen overgeven tot een schrikbeeld voor alle koninkrijken van de aarde, vanwege Manasse, zoon van Jehizkia, koning van Juda, om wat hij in Jeruzalem gedaan heeft.", "Matt 27:4": "en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.", "Job 12:4": "Ik ben degene die zijn vriend een spot is, maar die tot God roept, Die hem verhoort; de rechtvaardige en oprechte is een spot.", "Micha 4:10": "Lijd smart en doe uw uiterste best om te baren, dochter van Sion, als een barende vrouw; want nu zult u wel uit de stad heen weggaan, en op het veld wonen, en tot in Babel komen, maar daar zult u gered worden; daar zal de HEERE u verlossen uit de hand van uw vijanden.", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Spr 21:29": "Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.", "1 Kon 9:8": "En aangaande dit huis, dat verheven zal geweest zijn, ieder die eraan voorbijgaat zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE zo gedaan aan dit land en aan dit huis?", "Num 16:46-50": "En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen. En Aäron nam het, zoals Mozes gesproken had, en liep midden in de gemeente, en zie, de plaag was al begonnen onder het volk; en hij legde reukwerk daarin, en deed verzoening over het volk. En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Jer 44:28": "Maar wie van het zwaard ontkomen, zullen uit Egypteland terugkeren in het land van Juda, weinig in aantal; en het hele overblijfsel van Juda, dat in Egypteland gekomen is om daar als vreemdelingen te verblijven, zal weten wiens woord stand zal houden, het Mijne of het hunne.", "Ps 105:4": "Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.", "2 Kron 15:13": "En ieder die de HEERE, de God van Israël, niet zou zoeken, zou gedood worden, van klein tot groot, en van man tot vrouw toe.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Matt 24:35": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "Ezech 22:9-11": "Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in uw midden gedaan. Men heeft de schaamte van de vader in u ontdekt; wie onrein was door afzondering, hebben zij in u verkracht. Daarbij heeft de een gruwel gedaan met de vrouw van zijn naaste, en een ander heeft de vrouw van zijn zoon met schandelijkheid verontreinigd; nog een ander heeft in u zijn zuster, de dochter van zijn vader, verkracht.", "Jer 31:36": "Als deze ordeningen van voor Mijn aangezicht zullen wijken, spreekt de HEERE, dan zal ook het nageslacht van Israël ophouden een volk te zijn voor Mijn aangezicht, alle dagen.", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Jer 2:25": "Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "1 Kor 5:1-13": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft. En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden? Want ik, hoewel met het lichaam afwezig, maar aanwezig met de geest, heb al besloten, alsof ik aanwezig was, over hem die dit zo gedaan heeft:", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Jer 36:1": "Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam:", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Ps 44:12": "U geeft ons over als schapen ten voedsel, en U verstrooit ons onder de heidenvolken.", "2 Kron 34:15": "En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Spr 21:19": "Het is beter te wonen in een woest land, dan bij een zeer kijfachtige en toornige vrouw.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "2 Kon 11:19": "En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.", "Jer 23:24": "Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Jes 3:1-8": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water; De held en de krijgsman, de rechter en de profeet, en de waarzegger, en de oude; De leider van vijftig, en de aanzienlijke, en de raadsman, en de wijze onder de werkmeesters, en hem die welbespraakt is.", "2 Kon 19:14": "Toen Hizkia de brieven uit de hand van de boden ontvangen had en die gelezen had, ging hij op naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.", "Ezech 3:26": "En Ik zal uw tong aan uw gehemelte doen kleven, zodat u stom worden zult, en hun niet zult zijn tot een bestraffende man; want zij zijn een opstandig huis.", "1 Kor 7:1-40": "Wat betreft de dingen waarover u mij geschreven hebt: het is goed voor een mens geen vrouw aan te raken. Maar om de hoererijen te vermijden zal ieder man zijn eigen vrouw hebben, en iedere vrouw zal haar eigen man hebben. De man zal aan de vrouw geven wat hij haar schuldig is aan genegenheid; en net zo ook de vrouw aan de man.", "2 Kon 24:10-16": "In die tijd trokken de dienaren van Nebukadnezar, de koning van Babel, naar Jeruzalem; en de stad werd belegerd. Zelfs kwam Nebukadnezar, de koning van Babel, tegen de stad, terwijl zijn dienaren die belegerden. Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem gevangen in het achtste jaar van zijn regering.", "Openb 7:5": "Uit het geslacht van Juda waren twaalfduizend verzegeld; uit het geslacht van Ruben waren twaalfduizend verzegeld; uit het geslacht van Gad waren twaalfduizend verzegeld;", "Spr 20:3": "Het is eer voor een man, om van twist af te blijven; maar iedere dwaas zal zich erin mengen.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Matt 27:25": "En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen.", "Rom 12:18": "Als het mogelijk is, houd voor zover het van u afhangt vrede met alle mensen.", "2 Kron 7:6": "Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Richt 14:2": "Zo ging hij naar boven en vertelde het zijn vader en zijn moeder, en zei: Ik heb een vrouw gezien te Thimnath, uit de dochters van de Filistijnen; nu dan, neem die voor mij tot vrouw.", "Jer 28:16": "Daarom, zo zegt de HEERE: Zie, Ik zal u wegwerpen van de aardbodem; dit jaar zult u sterven, omdat u een afval gesproken hebt tegen de HEERE.", "Ps 14:2": "De HEERE heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht.", "Jer 8:4-22": "Zeg verder tegen hen: Zo zegt de HEERE: Zal men vallen, en niet weer opstaan? Zal men afkeren, en niet terugkeren? Waarom keert dit volk van Jeruzalem dan af, met een altijddurende afkering? Zij houden vast aan bedrog, zij weigeren terug te keren. Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd.", "Ps 32:5": "Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.", "Zach 9:9-17": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen. En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde. U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "1 Kron 21:12": "Of drie jaren honger, of drie maanden verteerd te worden voor het aangezicht van uw tegenstanders, en dat het zwaard van uw vijanden u achterhaalt; of drie dagen het zwaard van de HEERE, dat is, de pestilentie in het land, en een verdervende engel van de HEERE in al de gebieden van Israël? Zo bezie nu goed, wat antwoord ik Hem zal teruggeven, Die mij gezonden heeft.", "Jer 29:1-7": "Verder zijn dit de woorden van de brief die de profeet Jeremia zond van Jeruzalem naar de overige oudsten die gevankelijk waren weggevoerd, alsook naar de priesters, naar de profeten en naar heel het volk dat Nebukadnezar van Jeruzalem gevankelijk had weggevoerd naar Babel. (Nadat koning Jechonia, en de koningin, en de kamerlingen, de vorsten van Juda en Jeruzalem, alsook de timmerlieden en smeden van Jeruzalem waren weggegaan); Door de hand van Elasa, de zoon van Safan, en Gemarja, de zoon van Hilkia, die Zedekia, de koning van Juda, naar Babel zond, naar Nebukadnezar, de koning van Babel, en hij zei:", "Matt 7:7-11": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden. Of welk mens is er onder u die, als zijn zoon hem om brood zou vragen, hem een steen zal geven?", "Jer 3:14-18": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen. En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand. En het zal gebeuren, wanneer u meer geworden en vruchtbaar geworden bent in het land, in die dagen, spreekt de HEERE, dat zij niet meer zullen zeggen: De ark van het verbond van de HEERE, en zij zal ook niet in het hart opkomen; en zij zullen er niet aan denken, en haar niet bezoeken, en zij zal niet opnieuw gemaakt worden.", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Jes 55:8-12": "Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE. Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten. Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Ps 50:14": "Offert God dank, en betaalt de Allerhoogste uw geloften.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "2 Kron 36:14": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.", "Ezech 16:6": "Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Jer 33:19": "En het woord van de HEERE kwam tot Jeremia, en Hij zei:", "Gen 2:23": "Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "Joh 8:53": "Bent U meer dan onze vader Abraham, die gestorven is? En de profeten zijn gestorven; wie maakt U Uzelf?", "Jer 23:23": "Ben Ik een God van dichtbij, spreekt de HEERE, en niet een God van ver?", "Jes 37:32": "Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.", "Matt 22:17-21": "Zeg ons dan: wat denkt U? Is het geoorloofd de keizer belasting te betalen of niet? Maar Jezus doorzag hun boosheid, en zei: Huichelaars, waarom stelt u Mij op de proef? Toon Mij de belastingmunt. En zij brachten Hem een penning.", "2 Tim 3:8": "Zoals Jannes en Jambres Mozes tegenstonden, zo staan ook dezen de waarheid tegen; mensen, verdorven van verstand, verwerpelijk wat het geloof betreft.", "Rom 11:2": "God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt:", "Job 9:33": "Er is geen scheidsman tussen ons, die zijn hand op ons beiden leggen mocht.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Zach 13:3-6": "En het zal gebeuren, wanneer iemand nog profeteert, dat zijn vader en zijn moeder, die hem verwekt hebben, tegen hem zullen zeggen: U zult niet leven, omdat u leugens gesproken hebt in de Naam van de HEERE; en zijn vader en zijn moeder, die hem verwekt hebben, zullen hem doorsteken, wanneer hij profeteert. En het zal op die dag gebeuren, dat die profeten beschaamd zullen worden, ieder vanwege zijn visioen, wanneer hij profeteert; en zij zullen geen haren mantel aandoen om te liegen. Maar hij zal zeggen: Ik ben geen profeet, ik ben een man die het land bewerkt; want een mens heeft mij daartoe aangesteld om het vee te hoeden, van mijn jeugd af.", "Joh 4:24": "God is een Geest, en wie Hem aanbidden, moeten Hem aanbidden in geest en waarheid.", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Jer 32:37-44": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen. Ja, zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn. En Ik zal hun één hart en één weg geven, om Mij te vrezen alle dagen, hun ten goede, alsook hun kinderen na hen.", "Ezech 16:60-63": "Toch zal Ik denken aan Mijn verbond met u, in de dagen van uw jeugd, en Ik zal met u een eeuwig verbond oprichten. Dan zult u aan uw wegen denken en beschaamd zijn, wanneer u uw zusters, die groter zijn dan u, samen met hen die kleiner zijn dan u, aannemen zult; want Ik zal ze u geven tot dochters, maar niet op grond van uw verbond. Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben;", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Jer 2:9": "Daarom zal Ik nog met u twisten, spreekt de HEERE; ja, met uw kindskinderen zal Ik twisten.", "1 Kor 16:22": "Als iemand de Heere Jezus Christus niet liefheeft, laat die een vervloeking zijn; Maran-atha!", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Jer 33:7-26": "En Ik zal de gevangenschap van Juda en de gevangenschap van Israël wenden, en zal ze bouwen als in het begin. En Ik zal hen reinigen van al hun ongerechtigheid, waarmee zij tegen Mij gezondigd hebben; en Ik zal al hun ongerechtigheden vergeven, waarmee zij tegen Mij gezondigd en waarmee zij tegen Mij overtreden hebben. En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Jes 66:4": "Ik zal ook hun loon kiezen naar hun handelingen, en hun angsten zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet luisterden, maar deden wat kwaad is in Mijn ogen, en kozen wat Ik niet wilde.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Jer 17:26": "En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Job 1:5": "Het gebeurde dan, als de dagen van de maaltijden voorbij waren, dat Job hen liet halen en hen heiligde en 's morgens vroeg opstond en brandoffers offerde naar hun aller getal; want Job zei: Misschien hebben mijn kinderen gezondigd, en God in hun hart vervloekt. Zo deed Job al die dagen.", "Joz 7:25": "En Jozua zei: Hoe hebt u ons in het ongeluk gestort? De HEERE zal u op deze dag in het ongeluk storten! En heel Israël stenigde hem met stenen, en zij verbrandden hen met vuur, en overwierpen hen met stenen.", "Klaagl 2:14": "Nun. Uw profeten hebben u ijdelheid en ongerijmdheid gezien, en zij hebben u uw ongerechtigheid niet geopenbaard, om uw gevangenschap af te wenden, maar zij hebben voor u gezien ijdele lasten en uitstotingen.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Jes 6:7": "En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Ps 105:16": "Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Rom 13:5-7": "Daarom is het nodig onderworpen te zijn, niet alleen om de straf, maar ook om het geweten. Want daarom betaalt u ook belasting; want zij zijn dienaars van God, die daar voortdurend mee bezig zijn. Geef dan ieder wat u schuldig bent: belasting, aan wie u belasting schuldig bent; tol, aan wie u tol schuldig bent; ontzag, aan wie u ontzag schuldig bent; eer, aan wie u eer schuldig bent.", "Jer 32:3-5": "Want Zedekia, de koning van Juda, had hem opgesloten en gezegd: Waarom profeteert u en zegt u: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal haar innemen; En Zedekia, de koning van Juda, zal aan de hand van de Chaldeeën niet ontkomen; maar hij zal zeker gegeven worden in de hand van de koning van Babel, en zijn mond zal tot diens mond spreken, en zijn ogen zullen diens ogen zien; En hij zal Zedekia naar Babel voeren, en daar zal hij zijn, totdat Ik hem bezoek, spreekt de HEERE; ofschoon u tegen de Chaldeeën strijdt, u zult toch geen geluk hebben.)", "Ps 57:11": "Want Uw goedertierenheid is groot tot aan de hemelen, en Uw waarheid tot aan de hoogste wolken.", "1 Kron 9:11": "En Azarja, de zoon van Hilkija, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, leider van het huis van God;", "Jer 29:24-32": "Tot Semaja nu, de Nechlamiet, zult u spreken en zeggen: Zo spreekt de HEERE van de heerscharen, de God van Israël: Omdat u brieven in uw naam gezonden hebt aan heel het volk dat te Jeruzalem is, en aan Zefanja, de zoon van Maaseja, de priester, en aan alle priesters, en zei: De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.", "Ezech 39:1-29": "Verder, mensenkind! Profeteer tegen Gog en zeg: Zo zegt de Heere HEERE: Zie, Ik zál u, o Gog, hoofdvorst van Mesech en Tubal! En Ik zal u omkeren, en een zesde deel van u overlaten, en Ik zal u optrekken uit de zijden van het noorden, en Ik zal u brengen op de bergen van Israël. Maar Ik zal uw boog uit uw linkerhand slaan, en Ik zal uw pijlen uit uw rechterhand doen vallen.", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "Jer 27:9": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen.", "Jer 42:3": "dat de HEERE, uw God, ons de weg bekendmaakt die wij zullen ingaan, en de zaak die wij zullen doen.", "Ps 143:5": "Ik denk aan de dagen van vroeger; ik overleg al Uw daden; ik spreek bij mijzelf over de werken van Uw handen.", "Dan 3:21": "Toen werden die mannen gebonden in hun mantels, hun broeken, hun hoeden, en hun andere kleren, en zij wierpen hen in het midden van de brandende vuuroven.", "1 Kron 17:27": "Nu dan, het heeft U behaagd het huis van Uw knecht te zegenen, zodat het in eeuwigheid voor Uw aangezicht zal zijn; want U, HEERE, hebt het gezegend, en het zal gezegend zijn in eeuwigheid.", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Spr 21:9": "Het is beter te wonen op een hoek van het dak, dan met een kijfachtige vrouw, en dat in een huis van gezelschap.", "Jer 26:4-6": "Zeg dan tot hen: Zo zegt de HEERE: Als u naar Mij niet zult horen, om te wandelen in Mijn wet, die Ik voor uw aangezicht gegeven heb; Door te horen naar de woorden van Mijn knechten, de profeten, die Ik tot u zend, ja, vroeg opstaand en zendend; maar u niet gehoord hebt; Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek voor alle volken van de aarde.", "Dan 5:4-29": "Zij dronken de wijn, en prezen de gouden, zilveren, koperen, ijzeren, houten en stenen goden. Op datzelfde moment kwamen er vingers van een mensenhand tevoorschijn, die schreven tegenover de kandelaar, op de kalk van de wand van het koninklijk paleis, en de koning zag het deel van de hand die daar schreef. Toen veranderde de gezichtskleur van de koning, en zijn gedachten verschrikten hem; en de banden van zijn heupen werden los, en zijn knieën stootten tegen elkaar aan.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Jer 5:1": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn.", "Micha 7:14-20": "Weid Ú dan Uw volk met Uw staf, de kudde van Uw erfenis, die alleen woont, in het woud, midden in een vruchtbaar land; laat ze weiden in Basan en Gilead, als in de dagen van ouds. Ik zal haar wonderen laten zien, als in de dagen toen u uit Egypteland trok. De heidenen zullen het zien, en beschaamd zijn, vanwege al hun macht; zij zullen de hand op de mond leggen; hun oren zullen doof worden.", "Ezech 16:41": "Zij zullen ook uw huizen met vuur verbranden, en oordelen tegen u uitvoeren voor de ogen van veel vrouwen; en Ik zal u doen ophouden een hoer te zijn, en u zult ook geen hoerenloon meer geven.", "Jer 25:9": "Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden.", "Jer 26:7": "En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.", "Deut 9:20": "Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Num 5:11-29": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tot hen: Wanneer de vrouw van iemand afgeweken zal zijn, en door overtreding tegen hem overtreden zal hebben, Doordat een man gemeenschap met haar gehad heeft, en het voor de ogen van haar man verborgen zal zijn, en zij zich verheeld zal hebben, terwijl zij toch onrein geworden is; en er geen getuige tegen haar is, en zij niet op heterdaad betrapt is;", "Rom 7:1-3": "Weet u niet, broeders! (want ik spreek tot hen die de wet kennen) dat de wet heerst over de mens, zo lang als hij leeft? Want een vrouw die onder de man staat, is aan de levende man verbonden door de wet; maar als de man gestorven is, dan is zij vrijgemaakt van de wet van de man. Daarom dan, als zij bij een andere man gaat wonen terwijl de man leeft, zal zij een overspeelster genoemd worden; maar als de man gestorven is, dan is zij vrij van de wet, zodat zij geen overspeelster is als zij bij een andere man gaat wonen.", "Gen 24:51": "Zie, Rebekka staat voor u; neem haar en ga heen; laat zij de vrouw worden van de zoon van uw heer, zoals de HEERE gesproken heeft!", "Zach 13:3": "En het zal gebeuren, wanneer iemand nog profeteert, dat zijn vader en zijn moeder, die hem verwekt hebben, tegen hem zullen zeggen: U zult niet leven, omdat u leugens gesproken hebt in de Naam van de HEERE; en zijn vader en zijn moeder, die hem verwekt hebben, zullen hem doorsteken, wanneer hij profeteert.", "2 Kon 25:9": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.", "Jes 51:6": "Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "Jer 28:15": "En de profeet Jeremia zei tegen de profeet Hananja: Hoor nu, Hananja! De HEERE heeft u niet gezonden, maar u hebt gemaakt dat dit volk op leugen vertrouwt.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "2 Kon 20:18": "Daarbij zullen zij van uw zonen, die uit u zullen voortkomen, die u zult verwekken, nemen, zodat zij hovelingen zijn in het paleis van de koning van Babel.", "Amos 7:3": "Toen kreeg de HEERE berouw hierover; het zal niet gebeuren, zei de HEERE.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Ps 103:3": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Jer 15:1": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan.", "Ezech 1:2": "Op de vijfde dag van die maand (dit was het vijfde jaar van de wegvoering van koning Jojachin),", "2 Kron 36:21-23": "Opdat het woord van de HEERE vervuld werd, door de mond van Jeremia, totdat het land aan zijn sabbatten een welgevallen had; het rustte al de dagen van de verwoesting, totdat de zeventig jaren vervuld waren. Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei: Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op.", "Jes 49:13-23": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen. Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Jer 30:3": "Want zie, de dagen komen, spreekt de HEERE, dat Ik de gevangenschap van Mijn volk, Israël en Juda, wenden zal, zegt de HEERE; en Ik zal hen terugbrengen in het land, dat Ik hun vaderen gegeven heb, en zij zullen het erfelijk bezitten.", "2 Kon 25:18-21": "Ook nam de aanvoerder van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders. En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en vijf mannen van hen die het aangezicht van de koning zagen, die in de stad gevonden werden, alsook de hoofdschrijver van het leger, die het volk van het land opriep voor de oorlog, en zestig mannen van het volk van het land, die in de stad gevonden werden. Toen Nebuzaradan, de aanvoerder van de lijfwacht, dezen genomen had, bracht hij hen naar de koning van Babel, naar Ribla.", "2 Kon 10:1-7": "Achab had zeventig zonen te Samaria; en Jehu schreef brieven, die hij zond naar Samaria, tot de leiders van Jizreël, de oudsten, en tot de voedsterheren van Achab, en zei: Zo gauw deze brief tot u komt - omdat de zonen van uw heer bij u zijn, ook de wagens en de paarden bij u zijn, alsook een vaste stad, en wapens - zo kijkt naar de beste en meest geschikte van de zonen van uw heer, zet hem op de troon van zijn vader; en strijdt voor het huis van uw heer.", "Joz 7:24": "Toen nam Jozua, en heel Israël met hem, Achan, de zoon van Zerah, en het zilver, en het sierlijke overkleed, en de gouden staaf, en zijn zonen, en zijn dochters, en zijn ossen, en zijn ezels, en zijn vee, en zijn tent, en alles wat hij had; en zij brachten ze naar het dal Achor.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "2 Sam 24:14": "Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.", "Gen 21:21": "En hij woonde in de woestijn Paran; en zijn moeder nam voor hem een vrouw uit Egypteland.", "Neh 9:17-20": "En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten. Zelfs, toen zij zich een gegoten kalf gemaakt hadden, en gezegd hadden: Dit is uw God, Die u uit Egypte heeft opgevoerd; en grote lasteringen gedaan hadden; Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Hebr 13:22": "Maar ik vraag u, broeders, verdraag het woord van deze vermaning; want ik heb u in het kort geschreven.", "Jer 14:14": "En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart.", "Rom 15:8": "En ik zeg dat Jezus Christus een dienaar van de besnijdenis geworden is, vanwege de waarheid van God, opdat Hij de beloften aan de vaderen zou bevestigen;", "Ex 32:14": "Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.", "Ps 55:17": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.", "Matt 24:24": "Want er zullen valse christussen en valse profeten opstaan, en zij zullen grote tekenen en wonderen doen, zodat zij, als het mogelijk was, ook de uitverkorenen zouden misleiden.", "Ezech 22:28": "Haar profeten nu pleisteren hen met loze kalk; zij zien ijdelheid en voorzeggen hun leugen, en zeggen: Zo zegt de Heere HEERE! terwijl de HEERE niet gesproken heeft.", "Ezech 33:8": "Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Jer 7:13-34": "En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt; daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb. En Ik zal u van Mijn aangezicht wegwerpen, zoals Ik al uw broeders, het hele nageslacht van Efraïm, weggeworpen heb.", "Ps 123:2": "Zie, zoals de ogen van de knechten zijn op de hand van hun heren, zoals de ogen van de dienstmaagd zijn op de hand van haar meesteres, zo zijn onze ogen op de HEERE, onze God, totdat Hij ons genadig is.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Spr 2:3": "Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid;", "1 Kon 8:24": "Die Uw dienaar, mijn vader David, gehouden hebt wat U tot hem gesproken had; want met Uw mond hebt U gesproken, en met Uw hand vervuld, zoals het op deze dag is.", "Ps 39:13": "Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.", "Ps 146:8": "De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "Neh 12:41": "En de priesters, Eljakim, Maaseja, Minjamin, Michaja, Eljoenei, Zacharja, Hananja, met trompetten;", "Ezech 34:11-31": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Deut 28:25": "De HEERE zal geven dat u verslagen wordt voor uw vijanden; door één weg zult u tegen hem uittrekken, en door zeven wegen zult u voor hem vluchten; en u zult heen en weer gedreven worden onder alle koninkrijken van de aarde.", "Ps 126:4": "O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.", "Ps 78:8": "En dat zij niet zouden worden zoals hun vaders, een opstandig en weerspannig geslacht; een geslacht dat zijn hart niet richtte, en waarvan de geest niet trouw was met God.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Deut 9:18": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Zach 10:5-12": "En zij zullen zijn als de helden, die in het slijk van de straten treden in de strijd, en zij zullen strijden; want de HEERE zal met hen zijn, en zij zullen hen beschamen die op paarden rijden. En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren. En zij zullen zijn als een held van Efraïm, en hun hart zal zich verblijden als door de wijn; en hun kinderen zullen het zien en zich verblijden, hun hart zal zich verheugen in de HEERE.", "P
