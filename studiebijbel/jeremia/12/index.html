  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .kolomkop { display:none; }

}},"vertalingen":{"SVnu":{"1":"Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?","2":"U hebt hen geplant, zij zijn ook ingeworteld, zij groeien, ook dragen zij vrucht; U bent wel nabij in hun mond, maar ver van hun nieren.","3":"Maar U, HEERE, kent mij, U ziet mij, en proeft mijn hart, dat het met U is. Ruk hen uit als schapen ter slachting, en heilig hen tot de dag van de doding.","4":"Hoe lang zal het land treuren, en het gewas van het hele veld verdorren? Vanwege de boosheid van hen die daarin wonen, vergaan de dieren en het gevogelte; omdat zij zeggen: Hij ziet ons einde niet.","5":"Als u loopt met de voetgangers, zo maken zij u moe; hoe zult u zich dan meten met de paarden? Als u alleen vertrouwt in een land van vrede, hoe zult u het dan maken in de verheffing van de Jordaan?","6":"Want ook uw broeders en het huis van uw vader, ook díe handelen trouweloos tegen u; ook díe roepen u met volle stem achterna; geloof hen niet, wanneer zij vriendelijk tot u spreken.","7":"Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.","8":"Mijn erfenis is Mij geworden als een leeuw in het woud; zij heeft haar stem tegen Mij verheven, daarom heb Ik haar gehaat.","9":"Mijn erfenis is Mij een gesprenkelde vogel; de vogels zijn rondom tegen haar; kom, verzamel, al jullie dieren van het veld, kom om te eten!","10":"Veel herders hebben Mijn wijngaard verdorven, zij hebben Mijn akker vertrapt; zij hebben Mijn gewenste akker gesteld tot een woeste wildernis.","11":"Men heeft het gesteld tot een woestenij, verwoest zijnde treurt het tot Mij; het hele land is verwoest, omdat er niemand is die het ter harte neemt.","12":"Op alle hoge plaatsen in de woestijn zijn verstoorders gekomen; want het zwaard van de HEERE verteert van het ene einde van het land tot aan het andere einde van het land; er is geen vrede voor enig vlees.","13":"Zij hebben tarwe gezaaid, maar doornen gemaaid; zij hebben zich gepijnigd, maar niet gevorderd; word zo beschaamd vanwege uw inkomsten, vanwege de gloed van de toorn van de HEERE.","14":"Zo zegt de HEERE: Aangaande al Mijn boosaardige naburen, die Mijn erfenis aanroeren, die Ik aan Mijn volk Israël erfelijk gegeven heb; zie, Ik zal hen uit hun land uitrukken, maar het huis van Juda zal Ik uit hun midden uitrukken.","15":"En het zal gebeuren, nadat Ik hen zal hebben uitgerukt, dat Ik zal terugkeren, en Mij over hen zal ontfermen; en Ik zal hen terugbrengen, ieder tot zijn erfenis, en ieder tot zijn land.","16":"En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.","17":"Maar als zij niet zullen horen, dan zal Ik dat volk geheel en al uitrukken en verdelgen, spreekt de HEERE."},"SV":{"1":"Gij zoudt rechtvaardig zijn, o HEERE! wanneer ik tegen U zou twisten; ik zal nochtans *van* *Uw* oordelen met U spreken; waarom is der goddelozen weg voorspoedig, *waarom* hebben zij rust, allen, die trouwelooslijk trouweloosheid bedrijven?","2":"Gij hebt ze geplant, zij zijn ook ingeworteld, zij gaan voort, ook dragen zij vrucht; Gij zijt *wel* nabij in hun mond, maar verre van hun nieren.","3":"Maar Gij, o HEERE! kent mij, Gij ziet mij, en proeft mijn hart, *dat* *het* met U is. Ruk ze uit als schapen ter slachting, en heilig ze tot den dag der doding.","4":"Hoe lang zal het land treuren, en het kruid des gansen velds verdorren? Vanwege de boosheid dergenen, die daarin wonen, vergaan de beesten en het gevogelte; dewijl zij zeggen: Hij ziet ons einde niet.","5":"Als gij loopt met de voetgangers, zo maken zij u moede; hoe zult gij u dan mengen met de paarden? Zo gij *alleenlijk* vertrouwt in een land van vrede, hoe zult gij het dan maken in de verheffing van de Jordaan?","6":"Want ook uw broeders en uws vaders huis, ook diezelve handelen trouwelooslijk tegen u; ook diezelve roepen u met volle *stem* achterna; geloof hen niet, wanneer zij vriendelijk tot u spreken.","7":"Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde Mijner ziel in de hand harer vijanden gegeven.","8":"Mijn erfenis is Mij geworden als een leeuw in het woud; zij heeft haar stem tegen Mij verheven, daarom heb Ik haar gehaat.","9":"Mijn erfenis is Mij een gesprenkelde vogel; de vogelen zijn rondom tegen haar; komt aan, verzamelt, al gij gedierte des velds, komt om te eten!","10":"Veel herders hebben Mijn wijngaard verdorven, zij hebben Mijn akker vertreden; zij hebben Mijn gewensten akker gesteld tot een woeste wildernis.","11":"Men heeft hem gesteld tot een woestheid, verwoest zijnde treurt hij tot Mij; het ganse land is verwoest, omdat er niemand is, die het ter harte neemt.","12":"Op alle hoge plaatsen in de woestijn zijn verstoorders gekomen; want het zwaard des HEEREN verteert van het *ene* einde des lands tot aan het *andere* einde des lands; er is geen vrede voor enig vlees.","13":"Zij hebben tarwe gezaaid, maar doornen gemaaid; zij hebben zich gepijnigd, *maar* niet gevorderd; wordt alzo beschaamd vanwege ulieder inkomsten, vanwege de hittigheid van den toorn des HEEREN.","14":"Alzo zegt de HEERE: Aangaande al Mijn boze naburen, die Mijn erfenis aanroeren, dewelke Ik Mijn volke Israël erfelijk gegeven heb; ziet, Ik zal hen uit hun land uitrukken, maar het huis van Juda zal Ik uit hunlieder midden uitrukken.","15":"En het zal geschieden, nadat Ik hen zal uitgerukt hebben, zo zal Ik wederkeren, en Mij hunner ontfermen; en Ik zal hen wederbrengen, een iegelijk tot zijn erfenis, en een iegelijk tot zijn land.","16":"En het zal geschieden, indien zij de wegen Mijns volks vlijtiglijk zullen leren, zwerende bij Mijn Naam: *Zo* *waarachtig* *als* de HEERE leeft! gelijk als zij Mijn volk geleerd hebben te zweren bij Baäl, zo zullen zij in het midden Mijns volks gebouwd worden.","17":"Maar indien zij niet zullen horen, zo zal Ik diezelve natie ten enenmale uitrukken en verdoen, spreekt de HEERE."},"KJV":{"1":"Righteous *art* thou, O LORD, when I plead with thee: yet let me talk with thee of *thy* judgments: Wherefore doth the way of the wicked prosper? *wherefore* are all they happy that deal very treacherously?","2":"Thou hast planted them, yea, they have taken root: they grow, yea, they bring forth fruit: thou *art* near in their mouth, and far from their reins.","3":"But thou, O LORD, knowest me: thou hast seen me, and tried mine heart toward thee: pull them out like sheep for the slaughter, and prepare them for the day of slaughter.","4":"How long shall the land mourn, and the herbs of every field wither, for the wickedness of them that dwell therein? the beasts are consumed, and the birds; because they said, He shall not see our last end.","5":"If thou hast run with the footmen, and they have wearied thee, then how canst thou contend with horses? and *if* in the land of peace, *wherein* thou trustedst, *they wearied thee*, then how wilt thou do in the swelling of Jordan?","6":"For even thy brethren, and the house of thy father, even they have dealt treacherously with thee; yea, they have called a multitude after thee: believe them not, though they speak fair words","7":"I have forsaken mine house, I have left mine heritage; I have given the dearly beloved of my soul into the hand of her enemies.","8":"Mine heritage is unto me as a lion in the forest; it crieth out against me: therefore have I hated","9":"Mine heritage *is* unto me *as* a speckled bird, the birds round about *are* against her; come ye, assemble all the beasts of the field, come to devour.","10":"Many pastors have destroyed my vineyard, they have trodden my portion under foot, they have made my pleasant portion a desolate wilderness.","11":"They have made it desolate, *and being* desolate it mourneth unto me; the whole land is made desolate, because no man layeth *it* to heart.","12":"The spoilers are come upon all high places through the wilderness: for the sword of the LORD shall devour from the *one* end of the land even to the *other* end of the land: no flesh shall have peace.","13":"They have sown wheat, but shall reap thorns: they have put themselves to pain, *but* shall not profit: and they shall be ashamed of your revenues because of the fierce anger of the LORD.","14":"Thus saith the LORD against all mine evil neighbours, that touch the inheritance which I have caused my people Israel to inherit; Behold, I will pluck them out of their land, and pluck out the house of Judah from among","15":"And it shall come to pass, after that I have plucked them out I will return, and have compassion on them, and will bring them again, every man to his heritage, and every man to his land.","16":"And it shall come to pass, if they will diligently learn the ways of my people, to swear by my name, The LORD liveth; as they taught my people to swear by Baal; then shall they be built in the midst of my people.","17":"But if they will not obey, I will utterly pluck up and destroy that nation, saith the LORD."}},"tsk":{"1":[{"kopje":"rechtvaardig","refs":["Jer 11:20","Gen 18:25","Deut 32:4","Ps 51:6","Ps 119:75","Ps 119:137","Ps 145:17","Dan 9:7","Hab 1:13-17","Zef 3:5","Rom 3:5","Rom 3:6"]},{"kopje":"spreken","refs":["Job 13:3","Jes 41:21"]},{"kopje":"waarom","refs":["Jer 5:28","Job 12:6","Job 21:7-15","Ps 37:1","Ps 37:35","Ps 73:3-28","Ps 92:8","Ps 94:3","Ps 94:4","Spr 1:32","Hab 1:4","Mal 3:15"]},{"kopje":"bedrijven","refs":["Jer 12:6","Jer 5:11","Jes 48:8","Hos 6:7"]}],"2":[{"kopje":"hebt","refs":["Jer 11:17","Jer 45:4","Ezech 17:5-10","Ezech 19:10-13"]},{"kopje":"nabij","refs":["Jes 29:13","Ezech 33:31","Matt 15:8","Mark 7:6","Tit 1:16"]}],"3":[{"kopje":"kent","refs":["Jer 11:20","2 Kon 20:3","1 Kron 29:17","Job 23:10","Ps 17:3"," a-code=\"H3820\">heart</span> toward thee: pull them <span class=\"wl wl-kjv\" data-code=\"H5423\">out</span> like <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> for the <span class=\"wl wl-kjv\" data-code=\"H2878\">slaughter,</span> and <span class=\"wl wl-kjv\" data-code=\"H6942\">prepare</span> them for the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of slaughter.","4":"How long shall the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H56\">mourn,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6212\">herbs</span> of every <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> <span class=\"wl wl-kjv\" data-code=\"H3001\">wither,</span> for the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of them that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein? the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> are <span class=\"wl wl-kjv\" data-code=\"H5595\">consumed,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5775\">birds;</span> because they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He shall not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> our last end.","5":"If thou hast <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> with the <span class=\"wl wl-kjv\" data-code=\"H7273\">footmen,</span> and they have <span class=\"wl wl-kjv\" data-code=\"H3811\">wearied</span> thee, then how canst thou <span class=\"wl wl-kjv\" data-code=\"H8474\">contend</span> with <span class=\"wl wl-kjv\" data-code=\"H5483\">horses?</span> and if in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> wherein thou <span class=\"wl wl-kjv\" data-code=\"H982\">trustedst,</span> they wearied thee, then how wilt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> in the <span class=\"wl wl-kjv\" data-code=\"H1347\">swelling</span> of Jordan?","6":"For even thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> even they have dealt <span class=\"wl wl-kjv\" data-code=\"H898\">treacherously</span> with thee; yea, they have <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> a <span class=\"wl wl-kjv\" data-code=\"H4392\">multitude</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> thee: <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> them not, though they <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> fair words","7":"I have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5203\">left</span> mine <span class=\"wl wl-kjv\" data-code=\"H5159\">heritage;</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> the dearly <span class=\"wl wl-kjv\" data-code=\"H3033\">beloved</span> of my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> into the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of her enemies.","8":"Mine <span class=\"wl wl-kjv\" data-code=\"H5159\">heritage</span> is unto me as a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> in the <span class=\"wl wl-kjv\" data-code=\"H3293\">forest;</span> it crieth <span class=\"wl wl-kjv\" data-code=\"H5414\">out</span> against me: therefore have I hated","9":"Mine <span class=\"wl wl-kjv\" data-code=\"H5159\">heritage</span> is unto me as a <span class=\"wl wl-kjv\" data-code=\"H6641\">speckled</span> <span class=\"wl wl-kjv\" data-code=\"H5861\">bird,</span> the <span class=\"wl wl-kjv\" data-code=\"H5861\">birds</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> are against her; <span class=\"wl wl-kjv\" data-code=\"H3212\">come</span> ye, <span class=\"wl wl-kjv\" data-code=\"H622\">assemble</span> all the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> <span class=\"wl wl-kjv\" data-code=\"H857\">come</span> to devour.","10":"<span class=\"wl wl-kjv\" data-code=\"H7227\">Many</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">pastors</span> have <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> my <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> they have <span class=\"wl wl-kjv\" data-code=\"H947\">trodden</span> my <span class=\"wl wl-kjv\" data-code=\"H2513\">portion</span> under <span class=\"wl wl-kjv\" data-code=\"H947\">foot,</span> they have <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> my <span class=\"wl wl-kjv\" data-code=\"H2532\">pleasant</span> <span class=\"wl wl-kjv\" data-code=\"H2513\">portion</span> a <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate</span> wilderness.","11":"They have <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> it <span class=\"wl wl-kjv\" data-code=\"H8076\">desolate,</span> and being <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate</span> it <span class=\"wl wl-kjv\" data-code=\"H56\">mourneth</span> unto me; the whole <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is made <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate,</span> because no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">layeth</span> it to heart.","12":"The <span class=\"wl wl-kjv\" data-code=\"H7703\">spoilers</span> are <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon all high <span class=\"wl wl-kjv\" data-code=\"H8205\">places</span> through the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness:</span> for the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> from the (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
