 en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven.", "Job 20:5": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik?", "Fil 1:15": "Sommigen prediken Christus wel uit afgunst en twist, maar sommigen ook uit goedwilligheid.", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Jer 11:8": "Maar zij hebben niet gehoord, en ook hun oor niet geneigd, maar hebben gewandeld, ieder naar het goeddunken van hun boze hart; daarom heb Ik over hen gebracht al de woorden van dit verbond, dat Ik geboden had te doen, maar zij hebben het niet gedaan.", "Ezech 39:28": "dan zullen zij weten dat Ik, de HEERE, hun God ben, omdat Ik hen gevankelijk heb laten wegvoeren onder de heidenen, maar hen weer verzameld heb in hun land, en daar niemand van hen meer heb overgelaten.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Ps 94:1": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend!", "Zach 11:4": "Zo zegt de HEERE, mijn God: Weid deze slachtschapen.", "Hagg 2:17": "Voordat die dingen gebeurden, kwam iemand bij de korenhoop van twintig maten, en er waren er maar tien; kwam iemand bij de wijnbak om vijftig maten uit de pers te putten, en er waren er maar twintig.", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "Job 17:8": "De oprechten zullen hierover verbaasd zijn, en de onschuldige zal zich tegen de huichelaar opmaken;", "Spr 12:20": "Bedrog is in het hart van hen die kwaad smeden; maar zij die vrede raden, hebben blijdschap.", "Job 34:10-12": "Daarom, u, lieden van verstand, hoor naar mij: Ver zij God van goddeloosheid, en de Almachtige van onrecht! Want naar het werk van de mens vergeldt Hij hem, en naar ieders weg doet Hij het hem vinden. Ook waarlijk, God handelt niet goddeloos, en de Almachtige verkeert het recht niet.", "Jer 6:8": "Laat u tuchtigen, Jeruzalem! Opdat Mijn ziel niet van u afgetrokken wordt, opdat Ik u niet stel tot een woestheid, tot een onbewoond land.", "Spr 26:19": "zo is een man die zijn naaste bedriegt, en zegt: Maakte ik geen grapje?", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "Jer 48:26": "Maak hem dronken, omdat hij zich groot gemaakt heeft tegen de HEERE; zo zal Moab met de handen klappen in zijn uitspuwsel, en hij zelf zal ook tot bespotting zijn.", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Micha 5:2": "Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël.", "Ps 11:7": "Want de HEERE is rechtvaardig, Hij heeft gerechtigheden lief; Zijn aangezicht aanschouwt de oprechte.", "Ps 30:7": "Ik zei wel in mijn voorspoed: Ik zal nooit wankelen.", "Hab 1:3": "Waarom laat U mij ongerechtigheid zien, en aanschouwt U de kwelling? Want verwoesting en geweld is tegen mij, en er is twist, en men neemt gekijf op.", "Jer 23:17": "Zij zeggen steeds tegen hen die Mij lasteren: De HEERE heeft het gesproken, u zult vrede hebben; en tegen ieder die naar het goeddunken van zijn eigen hart wandelt, zeggen zij: U zal geen kwaad overkomen.", "2 Sam 16:10-12": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd. Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Ps 82:5": "Zij weten niet, en verstaan niet; zij wandelen steeds in duisternis; daardoor wankelen alle fundamenten van de aarde.", "Ps 101:7": "Wie bedrog pleegt, zal binnen mijn huis niet blijven; die leugens spreekt, zal voor mijn ogen niet bevestigd worden.", "Jes 40:9-11": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God! Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht. Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Dan 12:10": "Velen zullen gereinigd, wit gemaakt en gelouterd worden; maar de goddelozen zullen goddeloos handelen, en geen van de goddelozen zal het begrijpen, maar de verstandigen zullen het begrijpen.", "Zef 1:5": "En hen die zich neerbuigen op de daken voor het leger van de hemel, en hen die zich neerbuigend zweren bij de HEERE, en zweren bij Malcham;", "Micha 6:12": "Omdat haar rijke lieden vol zijn van geweld, en haar inwoners leugen spreken, en hun tong bedrieglijk is in hun mond,", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Ezech 39:27": "Wanneer Ik hen zal hebben teruggebracht uit de volken, en hen zal hebben verzameld uit de landen van hun vijanden, en Ik aan hen geheiligd zal zijn voor de ogen van veel heidenen;", "Ps 83:14-18": "Mijn God! Maak hen als een wervelwind, als stoppels voor de wind. Zoals het vuur een woud verbrandt, en zoals de vlam de bergen in brand steekt; vervolg hen zo met Uw onweer, en verschrik hen met Uw storm.", "Lev 26:31-39": "En Ik zal uw steden een woestijn maken, en uw heiligdommen verwoesten; en Ik zal uw liefelijke geur niet ruiken. Ja, Ik zal dat land verwoesten; zodat uw vijanden, die daarin zullen wonen, zich daarover ontzetten zullen. Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn.", "Jer 51:4": "Zodat de verslagenen liggen in het land van de Chaldeeën, en de doorstokenen op haar straten.", "Gen 37:4-11": "Toen zijn broeders zagen dat hun vader hem boven al zijn broers liefhad, haatten zij hem, en konden hem niet vredelijk toespreken. Ook droomde Jozef een droom, die hij aan zijn broers vertelde; daarom haatten zij hem nog meer. En hij zei tegen hen: Hoor toch deze droom, die ik gedroomd heb.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 92:7": "Een redeloos man weet er niet van, en een dwaas begrijpt dit niet;", "Fil 1:16": "Dezen verkondigen Christus wel uit eigenbelang, niet zuiver, en menen aan mijn banden verdrukking toe te brengen;", "Ezech 28:7-10": "Daarom zie, Ik zal vreemden over u brengen, de meest tirannieke van de heidenvolken; die zullen hun zwaarden trekken tegen de schoonheid van uw wijsheid, en zullen uw glans ontheiligen. Naar de groeve zullen zij u doen neerdalen; en u zult sterven de dood van een verslagene, in het hart van de zeeën. Zult u dan nog, voor het aangezicht van hem die u doodslaat, zeggen: Ik ben God? terwijl u een mens bent en geen God, in de hand van hem die u verslaat?", "Luk 7:35": "Doch de wijsheid is in het gelijk gesteld door al haar kinderen.", "Jes 58:2-5": "Hoewel zij Mij dagelijks zoeken en een lust hebben aan de kennis van Mijn wegen, als een volk dat gerechtigheid doet en het recht van zijn God niet verlaat, vragen zij Mij naar de rechten van de gerechtigheid; zij hebben een lust om tot God te naderen; En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid. Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "Jer 50:12": "Zo is uw moeder zeer beschaamd; die u gebaard heeft, is schaamrood geworden; zie, zij is geworden de achterste van de heidenvolken, een woestijn, dorheid en wildernis.", "Rom 3:22": "namelijk de gerechtigheid van God door het geloof van Jezus Christus, tot allen, en over allen die geloven; want er is geen onderscheid.", "Luk 18:12": "Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Jes 30:5": "Hij zal hen allen beschaamd maken door een volk dat hun geen nut kan doen, noch tot hulp, noch tot voordeel, maar tot schande en ook tot smaad zijn zal.", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "Lev 19:16": "U zult niet rondgaan als een kwaadspreker onder uw volken; u zult niet opstaan tegen het bloed van uw naaste; Ik ben de HEERE!", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "Ezech 34:1-31": "En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Hos 14:4": "Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Mark 10:24": "En de discipelen waren verbaasd over deze woorden van Hem. Maar Jezus antwoordde weer en zei tegen hen: Kinderen, hoe moeilijk is het voor hen die op rijkdom vertrouwen, om het Koninkrijk van God binnen te gaan!", "Jer 8:10": "Daarom zal Ik hun vrouwen aan anderen geven, hun akkers aan andere bezitters; want van de kleinste tot de grootste toe pleegt ieder van hen gierigheid; van de profeet tot de priester toe bedrijft ieder van hen valsheid.", "Jes 52:1-12": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen. Schud u uit het stof, sta op, ga zitten, o Jeruzalem! Maak u los van de banden van uw hals, u gevangen dochter van Sion! Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Spr 11:9": "De huichelaar verderft zijn naaste door de mond; maar door kennis worden de rechtvaardigen bevrijd.", "Ezech 22:18": "Mensenkind, zij die van het huis van Israël zijn, zijn Mij tot schuim geworden; zij zijn allemaal koper, of tin, of ijzer, of lood, in het midden van de oven; zilverschuim zijn zij geworden.", "Jes 59:4": "Er is niemand die om gerechtigheid roept, en niemand die zich voor de waarheid in het gericht begeeft; zij vertrouwen op ijdelheid en spreken leugen; met moeite zijn zij zwanger, en zij baren ongerechtigheid.", "Ps 42:9": "Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "1 Petr 3:16": "en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Deut 32:9-12": "Want het deel van de HEERE is Zijn volk, Jakob is het snoer van Zijn erfenis. Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel. Zoals een arend zijn nest opwekt, over zijn jongen zweeft, zijn vleugels uitbreidt, ze neemt en ze draagt op zijn vleugels;", "Hab 3:17": "Alhoewel de vijgenboom niet bloeien zal, en er geen vrucht aan de wijnstok zal zijn, dat het werk van de olijfboom liegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn;", "Matt 10:21": "En de ene broer zal de andere broer overleveren tot de dood, en de vader het kind, en de kinderen zullen opstaan tegen de ouders, en hen doden.", "Jes 65:3": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Jer 50:7": "Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, in de woning van de gerechtigheid, ja, tegen de HEERE, de Verwachting van hun vaderen.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Ezech 7:20": "En Hij heeft de schoonheid van het sieraad tot overtreffelijkheid gezet; maar zij hebben daarin beelden van hun gruwelen en van hun verfoeiselen gemaakt; daarom heb Ik dat hun tot onreinheid gesteld.", "Ps 49:8": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "1 Tim 3:14": "Deze dingen schrijf ik u, in de hoop spoedig bij u te komen;", "Jer 44:16": "Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen.", "Jes 1:8": "En de dochter van Sion is overgebleven als een hutje in de wijngaard, als een nachthutje in de komkommerhof, als een belegerde stad.", "Ps 101:5": "Wie zijn naaste in het heimelijke belastert, die zal ik verdelgen; die hoogmoedig van ogen is, en trots van hart, die zal ik niet verdragen.", "Spr 21:2": "Elke weg van een mens is recht in zijn eigen ogen; maar de HEERE weegt de harten.", "Hos 9:1-17": "Verblijd u niet, Israël, tot uitbundige vreugde toe, zoals de volken; want u hoereert van uw God af; u hebt hoerenloon lief, op alle dorsvloeren van het koren. De dorsvloer en de wijnkuip zullen hen niet voeden, en de most zal hen bedriegen. Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.", "Ezra 9:15": "O HEERE, God van Israël! U bent rechtvaardig; want wij zijn overgelaten ter ontkoming, zoals het is op deze dag. Zie, wij zijn voor Uw aangezicht in onze schuld; want er is niemand die voor Uw aangezicht zou kunnen bestaan, om hiervan.", "Jer 18:8-10": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen. Ook zal Ik in een ogenblik spreken over een volk en over een koninkrijk, dat Ik het zal bouwen en planten; Maar als het doet wat kwaad is in Mijn ogen, dat het naar Mijn stem niet luistert, dan zal Ik berouw hebben over het goede waarmee Ik gezegd had hen te zullen weldoen.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Ps 81:12": "Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.", "Jes 60:1-6": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Jes 48:4": "Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;", "Jer 31:32": "Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE;", "Zach 8:10": "Want vóór die dagen kwam het loon van de mens tot niets, en het loon van het vee was er niet; en de uitgaande en de inkomende hadden geen vrede vanwege de vijand, want Ik zond alle mensen, ieder tegen zijn naaste.", "Job 33:13": "Waarom hebt u tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Ps 36:4": "De woorden van de mond van hem zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.", "Ps 108:13": "Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Jer 21:13": "Zie, Ik zál tegen u, inwoonster van het dal, rots van het plein! spreekt de HEERE; u, die zegt: Wie zou tegen ons afkomen, of wie zou komen in onze woningen?", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Jer 31:3": "De HEERE is mij verschenen van lang geleden! Ja, Ik heb u liefgehad met een eeuwige liefde; daarom heb Ik u getrokken met goedertierenheid.", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "Jer 13:11": "Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Openb 19:18": "Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Jes 50:1": "Zo zegt de HEERE: Waar is de scheidbrief van uw moeder, waarmee Ik haar weggezonden heb? Of wie is er van Mijn schuldeisers, aan wie Ik u verkocht heb? Zie, om uw ongerechtigheden bent u verkocht, en om uw overtredingen is uw moeder weggezonden.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Ef 1:23": "Welke Zijn lichaam is, en de vervulling van Hem die alles in allen vervult.", "2 Kor 3:16": "Maar zodra men zich tot de Heere bekeert, wordt het deksel weggenomen.", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "Kol 2:4": "En dit zeg ik, opdat niemand u misleidt met overredende woorden, die een schijn van waarheid hebben.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Ps 111:3": "He. Zijn doen is majesteit en heerlijkheid; Vau. en Zijn gerechtigheid bestaat in eeuwigheid.", "Ps 58:4": "De goddelozen zijn vervreemd van de moederschoot af; de leugensprekers dolen van de moederbuik af.", "Ps 69:3": "Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Rom 3:5": "Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)", "Matt 25:44-46": "Dan zullen ook zij Hem antwoorden: Heere, wanneer hebben wij U hongerig gezien, of dorstig, of een vreemdeling, of naakt, of ziek, of in de gevangenis, en hebben U niet gediend? Dan zal Hij hun antwoorden: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze minsten niet gedaan hebt, hebt u het Mij ook niet gedaan. En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Ps 87:1-6": "Een psalm, een lied voor de kinderen van Korach. Zijn grondslag is op de bergen van heiligheid. De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob. Zeer heerlijke dingen worden van u gesproken, o stad van God! Sela.", "Joh 9:41": "Jezus zei tegen hen: Als u blind was, zou u geen zonde hebben; maar nu zegt u: Wij zien; daarom blijft uw zonde.", "Jer 15:15": "O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.", "Ps 73:1": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Jes 62:3": "En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Kol 2:18": "Laat dan niemand u de prijs ontnemen door het eigenzinnig verlangen naar nederigheid en verering van engelen, terwijl hij zich verdiept in dingen die hij niet gezien heeft, zonder reden opgeblazen door het denken van zijn vlees;", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "2 Kon 18:12": "Omdat zij de stem van de HEERE, hun God, niet gehoorzaam waren geweest, maar Zijn verbond overtreden hadden; en al wat Mozes, de knecht van de HEERE, geboden had, dat hadden zij niet gehoord, noch gedaan.", "Jes 30:2": "Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.", "Rom 10:3": "Want omdat zij de rechtvaardigheid van God niet kennen en hun eigen gerechtigheid proberen op te richten, hebben zij zich aan de rechtvaardigheid van God niet onderworpen.", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Job 27:7": "Mijn vijand zij als de goddeloze, en die zich tegen mij opmaakt, als de verkeerde.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "Jes 7:23": "Ook zal het op diezelfde dag gebeuren, dat iedere plaats waar duizend wijnstokken waren, elk duizend zilverstukken waard, met doorns en distels bedekt zal zijn;", "Ps 2:8-12": "Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting. U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat. Nu dan, koningen, handelt verstandig; laat u onderwijzen, rechters van de aarde!", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Ezech 14:17": "Of als Ik het zwaard breng over datzelfde land, en zeg: Zwaard! ga door dat land, zodat Ik daaruit mensen en beesten uitroei;", "Jes 30:25": "En er zullen op elke hoge berg, en op elke hoge heuvel, beekjes en watervlieten zijn, op de dag van de grote slachting, wanneer de torens vallen zullen.", "Ps 73:16": "Toch heb ik erover nagedacht om dit te mogen begrijpen; maar het was moeite in mijn ogen;", "Hebr 12:4": "U hebt nog niet tot bloedens toe tegenstand geboden, terwijl u streed tegen de zonde;", "Spr 15:8": "Het offer van de goddelozen is de HEERE een gruwel; maar het gebed van de oprechten is Zijn welgevallen.", "Matt 25:41-45": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is. Want Ik ben hongerig geweest, en u hebt Mij niet te eten gegeven; Ik ben dorstig geweest, en u hebt Mij niet te drinken gegeven; Ik was een vreemdeling; en u hebt Mij geen onderkomen gegeven; naakt, en u hebt Mij niet gekleed; ziek, en in de gevangenis, en u hebt Mij niet bezocht.", "Klaagl 1:1": "Aleph. Hoe zit die stad zo eenzaam, die vol volk was; zij is als een weduwe geworden, zij, die groot was onder de heidenen, een vorstin onder de landschappen, is cijnsbaar geworden.", "2 Kron 29:6": "Want onze vaders hebben overtreden, en gedaan wat kwaad was in de ogen van de HEERE, onze God, en hebben Hem verlaten, en zij hebben hun gezicht van de tabernakel van de HEERE afgewend, en hebben Hem de rug toegekeerd.", "Jes 44:22": "Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.", "Jer 30:22": "En u zult Mij tot een volk zijn, en Ik zal u tot een God zijn.", "Ps 59:16": "Laat hen zelfs omzwerven om eten; en laat hen vernachten, ook al zijn zij niet verzadigd.", "Ps 31:22": "Geloofd zij de HEERE, want Hij heeft Zijn goedertierenheid aan mij wonderlijk gemaakt, mij voerende als in een vaste stad.", "Ezech 35:1-15": "Verder kwam het woord van de HEERE tot mij en Hij zei: Mensenkind! Richt uw gezicht tegen het gebergte Seir, en profeteer ertegen, En zeg ertegen: Zo zegt de Heere HEERE: Zie, Ik heb het tegen u, o gebergte Seir! En Ik zal Mijn hand tegen u uitstrekken, en zal u maken tot een verwoesting en een verlatenheid.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Jer 14:13-16": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats. En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart. Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden.", "1 Tim 1:9": "En als hij dit weet, dat de wet niet gemaakt is voor de rechtvaardige, maar voor de onrechtvaardigen en de weerspannigen, de goddelozen en de zondaars, de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers,", "Jes 34:6": "Het zwaard van de HEERE is vol bloed, het is vet geworden van vet, van het bloed van de lammeren en de bokken, van het vet van de nieren van de rammen; want de HEERE heeft een offer in Bozra, en een grote slachting in het land van de Edomieten.", "Ps 48:11": "Zoals Uw Naam is, o God! zo is Uw roem tot aan de einden van de aarde; Uw rechterhand is vol van gerechtigheid.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Luk 21:14": "Neem dan in uw harten voor, om van tevoren niet te overdenken hoe u zich verantwoorden zult;", "Pred 8:12-17": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen. Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God. Er is nog een vluchtigheid, die op aarde gebeurt: dat er rechtvaardigen zijn, die overkomt wat de goddelozen toekomt, en er zijn goddelozen, die overkomt wat de rechtvaardigen toekomt. Ik zeg, dat dit ook vluchtigheid is.", "Jer 16:12": "En u erger gedaan hebt dan uw vaders; want zie, u wandelt, ieder naar het goeddunken van zijn slechte hart, om naar Mij niet te horen.", "Job 31:5": "Als ik met ijdelheid omgegaan heb, en mijn voet gesneld heeft tot bedriegerij;", "Jer 2:21": "Ik had u toch geplant, een edele wijnstok, een geheel getrouw zaad; hoe bent u Mij dan veranderd in verbasterde ranken van een vreemde wijnstok?", "Jes 60:19-21": "De zon zal voor u niet meer zijn tot een licht overdag, en tot een glans zal de maan u niet lichten; maar de HEERE zal u tot een eeuwig licht zijn, en uw God tot uw sierlijkheid. Uw zon zal niet meer ondergaan, en uw maan zal haar licht niet intrekken; want de HEERE zal u tot een eeuwig licht zijn, en de dagen van uw treuren zullen een einde nemen. En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.", "Ps 109:29": "Laat mijn tegenstanders met schande bekleed worden, en laat hen zich met hun schande bedekken, als met een mantel.", "Jer 12:14-17": "Zo zegt de HEERE: Aangaande al Mijn boosaardige naburen, die Mijn erfenis aanroeren, die Ik aan Mijn volk Israël erfelijk gegeven heb; zie, Ik zal hen uit hun land uitrukken, maar het huis van Juda zal Ik uit hun midden uitrukken. En het zal gebeuren, nadat Ik hen zal hebben uitgerukt, dat Ik zal terugkeren, en Mij over hen zal ontfermen; en Ik zal hen terugbrengen, ieder tot zijn erfenis, en ieder tot zijn land. En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "Ps 69:29": "Laat hen uitgedelgd worden uit het boek van het leven, en met de rechtvaardigen niet aangeschreven worden.", "Ps 110:2": "De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Jer 14:1-16": "Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte. Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Hos 8:14": "Want Israël heeft zijn Maker vergeten en tempels gebouwd, en Juda heeft versterkte steden vermenigvuldigd; maar Ik zal een vuur zenden in zijn steden, dat zal hun paleizen verteren.", "Job 34:19": "Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Hos 8:3": "Israël heeft het goede verstoten; de vijand zal hem vervolgen.", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "Jes 62:4": "Tegen u zal niet meer gezegd worden: Wie verlaten is; en tegen uw land zal niet meer gezegd worden: Het verwoeste; maar u zult genoemd worden: Mijn lust is aan haar! en uw land: Het getrouwde; want de HEERE heeft een lust aan u, en uw land zal getrouwd worden.", "Jes 36:6": "Zie, u vertrouwt op die gebroken rietstaf, op Egypte; als iemand daarop leunt, zal hij in zijn hand gaan en die doorboren; zo is farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Deut 28:10": "En alle volken van de aarde zullen zien dat de Naam van de HEERE over u uitgeroepen is, en zij zullen voor u vrezen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Joh 16:27": "Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Joh 6:26": "Jezus antwoordde hun en zei: Voorwaar, voorwaar, Ik zeg u: u zoekt Mij niet omdat u tekenen gezien hebt, maar omdat u van de broden gegeten hebt en verzadigd bent.", "Pred 3:15": "Wat geweest is, dat is nu, en wat wezen zal, dat is al geweest; en God zoekt het weggedrevene op.", "Ps 34:14": "Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog.", "Jes 5:1-8": "Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel. En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht. Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.", "Klaagl 4:17": "Ain. Nog steeds bezweken onze ogen, terwijl ze uitkeken naar onze nutteloze hulp; wij tuurden met gespannen aandacht naar een volk dat niet kon verlossen.", "Lev 22:33": "Die u uit het land Egypte heb uitgevoerd, opdat Ik u tot een God zou zijn; Ik ben de HEERE!", "Joël 1:10-17": "Het veld is verwoest, het land treurt; want het koren is verwoest, de most is verdroogd, de olie is uitgeput. De akkerlieden zijn beschaamd, de wijngaardeniers huilen, om de tarwe en om de gerst, want de oogst van het veld is vergaan. De wijnstok is verdord, de vijgenboom is uitgeput; de granaatappelboom, ook de palmboom en appelboom; alle bomen van het veld zijn verdord; ja, de vrolijkheid is verdord van de mensenkinderen.", "Mal 2:13": "Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen.", "Zach 1:14": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Spr 12:17": "Wie waarheid voortbrengt, maakt gerechtigheid bekend; maar een getuige van leugens maakt bedrog bekend.", "Jes 56:9": "Alle dieren van het veld, kom om te eten, ja, alle dieren in het woud!", "Jes 30:18-26": "En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten. Want het volk zal in Sion wonen, te Jeruzalem; u zult helemaal niet wenen; zeker zal Hij u genadig zijn op de stem van uw geroep; zodra Hij het horen zal, zal Hij u antwoorden. De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;", "Rom 3:4-6": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt. Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.) Dat zij verre, anders hoe zal God de wereld oordelen?", "Matt 6:2": "Wanneer u dan aalmoes doet, laat het dan niet voor u uittrompetten, zoals de geveinsden doen in de synagogen en op de straten, opdat zij door de mensen geëerd worden. Voorwaar, Ik zeg u: zij hebben hun loon al ontvangen.", "Rom 8:32": "Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "Hab 1:13-17": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij? En waarom zou U de mensen maken als de vissen van de zee, als het kruipend gedierte, dat geen heerser heeft? Hij trekt ze allen met de vishaak op, hij vergadert ze in zijn sleepnet, en hij verzamelt ze in zijn net; daarom verblijdt hij zich en verheugt hij zich.", "Hebr 3:16-18": "Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn. Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn? En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Ps 15:2": "Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt;", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Dan 9:14": "Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.", "Jer 2:37": "U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen.", "Jes 2:6": "Maar U hebt Uw volk, het huis van Jakob, verlaten, want zij zijn vervuld met goddeloosheid, meer dan het oosten, en zij zijn van het guichelaar gelijk de Filistijnen, en aan de kinderen van de vreemden tonen zij hun behagen.", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Rom 3:21": "Maar nu is de gerechtigheid van God geopenbaard, zonder de wet, met getuigenis van de wet en de profeten:", "Ps 116:5": "De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Openb 19:16-21": "En Hij heeft op Zijn kleed en op Zijn dij deze Naam geschreven: Koning der koningen, en Heere der heren. En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.", "Jer 34:17": "Daarom zegt de HEERE zo: U hebt naar Mij niet gehoord, om vrijheid uit te roepen, ieder voor zijn broeder, en ieder voor zijn naaste; zie, zo roep Ik tegen u uit, spreekt de HEERE, een vrijheid ten zwaard, ter pest, en ten honger, en zal u overgeven ter opschudding aan alle koninkrijken van de aarde.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Job 13:16": "Ook zal Hij mij tot heil zijn; maar een huichelaar zal voor Zijn aangezicht niet komen.", "Luk 6:39": "En Hij vertelde hun een gelijkenis: Kan een blinde soms een blinde leiden? Zullen zij niet beiden in de kuil vallen?", "Pred 7:15": "Dit alles heb ik gezien in de dagen van mijn vluchtige leven; er is een rechtvaardige die in zijn gerechtigheid omkomt; daarentegen is er een goddeloze die in zijn slechtheid zijn dagen verlengt.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Micha 2:12": "Zeker zal Ik u, o Jakob, geheel verzamelen; zeker zal Ik het overblijfsel van Israël bijeenbrengen; Ik zal het samen bijeenzetten als schapen van Bozra; als een kudde in het midden van haar kooi zullen zij dreunen van de mensenmenigte.", "Zach 7:6": "Of als u at, en als u dronk, was dat niet voor uzelf, u die daar at, en u die daar dronk?", "Ps 35:4": "Laat hen beschaamd worden en te schande, die mijn ziel zoeken; laat hen achterwaarts gedreven worden en schaamrood, die kwaad tegen mij bedenken.", "Jer 23:3": "En Ik zal het overblijfsel van Mijn schapen Zelf verzamelen uit al de landen, waarheen Ik ze verdreven heb; en Ik zal ze terugbrengen tot hun kooien, en zij zullen vruchtbaar zijn, en zich vermenigvuldigen.", "Jes 49:13-17": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen. Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Ps 78:65": "Toen ontwaakte de Heere, als iemand die slaapt, als een held, die juicht van de wijn.", "Jak 5:5": "U hebt lekker geleefd op de aarde, en wellust nagejaagd; u hebt uw harten gevoed als op een dag van slachting.", "Ps 126:2": "Toen was onze mond vol lachen, en onze tong vol gejuich; toen zei men onder de heidenvolken: De HEERE heeft grote dingen aan hen gedaan.", "Jer 47:7": "Hoe zou u stil houden? De HEERE heeft toch aan het zwaard bevel gegeven; tegen Askelon en tegen de zeehaven, daar heeft Hij het besteld.", "Rom 2:5-16": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken: Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Joh 17:26": "En Ik heb hun Uw Naam bekendgemaakt, en zal Hem bekendmaken; opdat de liefde waarmee U Mij liefgehad hebt, in hen is, en Ik in hen.", "Joh 15:6": "Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "Jer 2:5": "Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij ver van Mij zijn geweken, en de ijdelheid hebben nagewandeld, en zelf ijdel zijn geworden?", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Ps 25:3": "Gimel. Ja, allen die U verwachten, zullen niet beschaamd worden; zij zullen beschaamd worden, die trouweloos handelen zonder oorzaak.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Spr 14:5": "Een waarachtig getuige zal niet liegen; maar een vals getuige waait leugens uit.", "Jer 32:36-44": "En nu, daarom zegt de HEERE, de God van Israël, zo over deze stad, waarvan u zegt: Zij is gegeven in de hand van de koning van Babel, door het zwaard, en door de honger, en door de pest; Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen. Ja, zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Zef 3:5": "De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Jes 3:13": "De HEERE stelt Zich op om te pleiten, en Hij staat om de volken te richten.", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Ef 4:14": "Opdat wij niet meer kinderen zouden zijn, die heen en weer bewogen en meegevoerd worden met elke wind van leer, door het bedrog van de mensen, door arglistigheid, om listig tot dwaling te brengen;", "Hos 4:1": "Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is;", "Joz 3:15": "En toen zij die de ark droegen, tot aan de Jordaan gekomen waren, en de voeten van de priesters die de ark droegen, ondergedompeld werden in de rand van het water (de Jordaan was namelijk vol tot al haar oevers, al de dagen van de oogst);", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Mal 3:4": "Dan zal het spijsoffer van Juda en Jeruzalem de HEERE zoet zijn, zoals in de oude dagen, en zoals in de vorige jaren.", "Mal 2:1-3": "En nu, priesters, dit gebod wordt tot u gezonden. Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt. Zie, Ik zal het zaad voor u verderven; en Ik zal drek op uw gezichten strooien, de drek van uw feesten, zodat men u daarmee wegnemen zal.", "Jer 14:2": "Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op.", "Jer 9:6": "Uw woning is in het midden van bedrog; door bedrog weigeren zij Mij te kennen, spreekt de HEERE.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Jes 66:3-5": "Wie een os slacht, slaat een man; wie een lam offert, breekt een hond de hals; wie spijsoffer offert, is als die zwijnenbloed offert; wie wierook brandt tot een gedenkoffer, is als die een afgod zegent. Dezen kiezen ook hun eigen wegen, en hun ziel heeft plezier in hun verfoeisels. Ik zal ook hun loon kiezen naar hun handelingen, en hun angsten zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet luisterden, maar deden wat kwaad is in Mijn ogen, en kozen wat Ik niet wilde. Hoor het woord van de HEERE, u die voor Zijn woord beeft! Uw broeders, die u haten, die u ver wegsturen, om Mijn Naam, zeggen: Laat de HEERE heerlijk worden! Maar Hij zal verschijnen tot uw vreugde, zij daarentegen zullen beschaamd worden.", "Jes 26:12-19": "HEERE, U zult ons vrede geven, want U hebt ook al onze zaken voor ons volbracht. HEERE, onze God, andere heren, behalve U, hebben over ons geheerst; maar door U alleen gedenken wij Uw Naam. Zij die dood zijn, zullen niet opnieuw leven, overledenen zullen niet opstaan; daarom hebt U hen bezocht en hebt U hen verdelgd, en U hebt al hun gedachtenis doen vergaan.", "Joh 13:37": "Petrus zei tegen Hem: Heere, waarom kan ik U nu niet volgen? Ik zal mijn leven voor U geven.", "Jes 9:17-20": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook. Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien. Als hij ter rechterhand snijdt, zal hij toch hongeren, en als hij ter linkerhand eet, zal hij toch niet verzadigd worden; ieder zal het vlees van zijn eigen arm eten;", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Ps 143:1": "Een psalm van David. O HEERE, hoor mijn gebed, neig de oren tot mijn smekingen; verhoor mij naar Uw waarheid, naar Uw gerechtigheid.", "Jer 50:36": "Het zwaard zal zijn over de leugenaars, zodat zij dwaas worden; het zwaard zal zijn over haar helden, zodat zij versagen;", "Jes 52:2": "Schud u uit het stof, sta op, ga zitten, o Jeruzalem! Maak u los van de banden van uw hals, u gevangen dochter van Sion!", "1 Sam 24:13": "De HEERE zal rechtspreken tussen mij en tussen u, en de HEERE zal mij op u wreken; maar mijn hand zal niet tegen u zijn.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Hebr 6:12": "opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.", "Ps 119:40": "Zie, ik heb een begeerte tot Uw bevelen; maak mij levend door Uw gerechtigheid.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Joh 21:17": "Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Matt 26:33-35": "Doch Petrus antwoordde en zei tegen Hem: Al werden zij ook allen aan U geërgerd, ik zal nooit geërgerd worden. Jezus zei tegen hem: Voorwaar, Ik zeg u dat u in deze zelfde nacht, voordat de haan gekraaid zal hebben, Mij driemaal zult verloochenen. Petrus zei tegen Hem: Al moest ik ook met U sterven, ik zal U geenszins verloochenen! Hetzelfde zeiden ook alle discipelen.", "Ps 81:14": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld!", "Ps 44:22": "Zou God dat niet onderzoeken? Want Hij kent de verborgenheden van het hart.", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!", "Ps 35:8": "De verwoesting overkomt hem, zodat hij het niet weet, en zijn net, dat hij verborgen heeft, vangt hemzelf; hij valt daarin met verwoesting.", "Jer 12:10-13": "Veel herders hebben Mijn wijngaard verdorven, zij hebben Mijn akker vertrapt; zij hebben Mijn gewenste akker gesteld tot een woeste wildernis. Men heeft het gesteld tot een woestenij, verwoest zijnde treurt het tot Mij; het hele land is verwoest, omdat er niemand is die het ter harte neemt. Op alle hoge plaatsen in de woestijn zijn verstoorders gekomen; want het zwaard van de HEERE verteert van het ene einde van het land tot aan het andere einde van het land; er is geen vrede voor enig vlees.", "Amos 1:2-15": "En hij zei: De HEERE zal brullen uit Sion, en Zijn stem verheffen uit Jeruzalem; en de woningen van de herders zullen treuren, en de top van Karmel zal verdorren. Zo zegt de HEERE: Om drie overtredingen van Damaskus, en om vier zal Ik dat niet afwenden; omdat zij Gilead met ijzeren dorswagens hebben gedorst. Daarom zal Ik een vuur in het huis van Hazaël zenden, dat zal de paleizen van Benhadad verteren.", "Matt 6:16": "En wanneer u vast, toon dan geen droevig gezicht, zoals de geveinsden; want zij mismaken hun gezicht, opdat zij door de mensen gezien worden als zij vasten. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Mal 2:17": "U vermoeit de HEERE met uw woorden; nog zegt u: Waarmee vermoeien wij Hem? Daarmee, dat u zegt: Ieder die kwaad doet, is goed in de ogen van de HEERE, en Hij heeft behagen in zulke mensen; of: waar is de God van het oordeel?", "Ps 15:4": "In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Joz 23:7": "Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet;", "Ezech 33:7-19": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Amos 8:7": "De HEERE heeft gezworen bij de heerlijkheid van Jakob: Zeker zal Ik al hun werken voor altijd niet vergeten!", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Jes 5:1-7": "Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel. En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht. Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.", "Zach 10:6-12": "En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren. En zij zullen zijn als een held van Efraïm, en hun hart zal zich verblijden als door de wijn; en hun kinderen zullen het zien en zich verblijden, hun hart zal zich verheugen in de HEERE. Ik zal hen toefluiten en zal hen verzamelen, want Ik zal hen verlossen; en zij zullen talrijker worden, zoals zij eerder talrijk waren.", "Ezech 5:1-17": "En u, mensenkind, neem een scherp mes, een scheermes van de barbiers zult u nemen, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u een weegschaal nemen, en die haren verdelen. Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken. U zult ook een klein aantal daarvan nemen, en in uw slippen binden.", "Ps 50:2": "Uit Sion, de volkomenheid van de schoonheid, verschijnt God blinkend.", "Jes 43:25": "Ik, Ik ben het, Die uw overtredingen uitwis, om Mijnentwil, en Ik denk aan uw zonden niet.", "Mark 14:29-31": "En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen. En Jezus zei tegen hem: Voorwaar, Ik zeg u, dat u heden, in deze nacht, voordat de haan tweemaal gekraaid zal hebben, Mij driemaal zult verloochenen. Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.", "Hebr 10:31": "Vreselijk is het te vallen in de handen van de levende God.", "Ps 106:14": "Maar zij werden belust met begeerte in de woestijn, en zij verzochten God in de wildernis.", "Jes 23:18": "En haar koophandel en haar hoerenloon zullen de HEERE heilig zijn, het zal niet als schat verzameld worden, en ook niet weggesloten; maar haar koophandel zal er zijn voor hen die voor het aangezicht van de HEERE wonen, opdat zij tot verzadiging eten, en opdat zij duurzame kleding hebben.", "Deut 28:38": "U zult veel zaad naar de akker uitbrengen, maar u zult weinig inzamelen; want de sprinkhaan zal het opeten.", "Ezech 17:5-10": "Hij nam ook van het zaad van het land, en legde het in een zaadakker; hij nam het, hij zette het bij veel water met grote zorgvuldigheid. En het sproot uit, en werd een welig uitlopende wijnstok, doch nederig van stam, terwijl hij met zijn takken naar hem toe keek, omdat zijn wortels onder hem waren. Zo werd hij tot een wijnstok, die ranken voortbracht en scheuten uitwierp. Nog was er een grote arend, groot van vleugels en overvloedig van veren; en zie, deze wijnstok voegde zijn wortels naar hem toe, en wierp zijn takken naar hem uit, opdat hij hem bevochtigen zou vanuit de bedden van zijn planting.", "Matt 7:22": "Velen zullen op die dag tegen Mij zeggen: Heere, Heere! Hebben wij niet in Uw Naam geprofeteerd, en in Uw Naam demonen uitgeworpen, en in Uw Naam veel krachten gedaan?", "Jer 5:30": "Een verschrikkelijke en afschuwelijke zaak gebeurt er in het land.", "Deut 33:3": "Zeker bemint Hij de volken! Al Zijn heiligen zijn in Uw hand; zij zullen in het midden tussen Uw voeten gezet worden; ieder zal ontvangen van Uw woorden.", "Jer 48:15": "Moab is verwoest, en uit zijn steden opgetrokken, en de keur van zijn jongemannen is ter slachting afgegaan, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.", "Deut 3:20": "Totdat de HEERE uw broeders rust geeft, zoals u, zodat ook zij het land in bezit nemen dat de HEERE, uw God, hun geven zal aan de overkant van de Jordaan; dan zult u terugkeren, ieder naar zijn erfdeel, dat ik u gegeven heb.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Dan 11:4": "En zodra hij zal staan, zal zijn rijk gebroken en naar de vier windrichtingen van de hemel verdeeld worden, maar niet aan zijn nakomelingen, ook niet met de heerschappij waarmee hij heerste; want zijn rijk zal uitgerukt worden, en dat voor anderen dan deze.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Joh 3:10": "Jezus antwoordde en zei tegen hem: Bent u een leraar van Israël, en weet u deze dingen niet?", "Zach 1:15": "En Ik ben met een zeer grote toorn vertoornd tegen die geruste heidenen; want Ik was een weinig toornig, maar zij hebben tot het kwade meegeholpen.", "Lev 11:45": "Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben.", "Openb 10:5": "En de engel die ik zag staan op de zee en op de aarde, hief zijn hand op naar de hemel.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Hos 11:2": "Maar net zoals zij hen riepen, zo gingen zij van hun aangezicht weg; zij offerden aan de Baäls, en brandden reukwerk voor de gesneden beelden.", "Openb 2:15": "Zo hebt u ook mensen die de leer van de Nikolaieten vasthouden; wat Ik haat.", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Amos 3:6": "Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Ps 44:23": "Maar om Uwentwil worden wij de hele dag gedood; wij worden geacht als slachtschapen.", "Jes 61:4-9": "En zij zullen de oude, verwoeste plaatsen bouwen, de vorige verstoringen weer oprichten, en de verwoeste steden vernieuwen, die verstoord waren van geslacht op geslacht. En vreemdelingen zullen klaarstaan en uw kudden weiden; en buitenlanders zullen uw akkerlieden en uw wijngaardeniers zijn. Maar u zult priesters van de HEERE heten, men zal u dienaren van onze God noemen; u zult het vermogen van de heidenvolken eten, en op hun heerlijkheid zult u zich beroemen.", "Deut 29:19-21": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Ps 143:12": "En roei mijn vijanden uit, om Uw goedertierenheid, en breng hen om, allen die mijn ziel beangstigen; want ik ben Uw knecht.", "Hebr 12:3": "Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Luk 10:13": "Wee u, Chorazin, wee u, Bethsaïda, want als in Tyrus en Sidon de krachten waren gebeurd die in u gebeurd zijn, zouden zij zich allang, in zak en as zittend, bekeerd hebben.", "Rom 3:26": "tot een betoning van Zijn gerechtigheid in deze tegenwoordige tijd; opdat Hij rechtvaardig is, en rechtvaardigend degene die uit het geloof van Jezus is.", "Ps 89:17": "Zij zullen zich de hele dag verheugen in Uw Naam, en door Uw gerechtigheid verhoogd worden.", "Spr 7:10-21": "En zie, een vrouw ontmoette hem in hoerenversiersel, en met het hart op haar hoede; Deze was druk en opstandig, haar voeten bleven in haar huis niet; Nu buiten, dan op de straten zijnde, en bij alle hoeken loerend;", "1 Kor 3:21": "Niemand roemt dan op mensen; want alles is van u.", "Ps 1:6": "Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Jer 22:21": "Ik sprak u aan in uw grote voorspoed, maar u zei: Ik zal niet horen. Dit is uw weg vanaf uw jeugd, dat u naar Mijn stem niet hebt geluisterd.", "Jer 36:26": "Daarop gebood de koning aan Jerahmeel, de zoon van Hammelech, en Zeraja, de zoon van Azriël, en Selemja, de zoon van Abdeël, om de schrijver Baruch en de profeet Jeremia te vangen. Maar de HEERE had hen verborgen.", "Pred 9:11": "Ik keerde mij om en zag onder de zon dat de wedloop niet is voor de snellen, en de strijd niet voor de helden, en ook het brood niet voor de wijzen, en ook de rijkdom niet voor de verstandigen, en ook de gunst niet voor de kundigen; maar dat tijd en toeval hen allen treft.", "Ps 78:10": "Zij hielden Gods verbond niet, en weigerden te wandelen in Zijn wet.", "Ps 44:10-17": "Maar nu hebt U ons verstoten en te schande gemaakt, omdat U met onze legers niet uittrekt. U doet ons achterwaarts keren van de tegenstander; en onze haters beroven ons voor zichzelf. U geeft ons over als schapen ten voedsel, en U verstrooit ons onder de heidenvolken.", "Ezech 18:29": "Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Ef 1:3-6": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus. Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde; Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil.", "Richt 2:14": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij gaf hen in de hand van rovers, die hen beroofden; en Hij verkocht hen in de hand van hun vijanden rondom; en zij konden niet meer standhouden voor het aangezicht van hun vijanden.", "Jer 14:7": "Hoewel onze ongerechtigheden tegen ons getuigen, o HEERE, doe het om Uw Naams wil; want onze afdwalingen zijn talrijk, wij hebben tegen U gezondigd.", "1 Kron 28:8": "Welnu, voor de ogen van heel Israël, de gemeente van de HEERE, en voor de oren van onze God: houd en zoek al de geboden van de HEERE, uw God; opdat u dit goede land erfelijk bezit, en het na u nalaat als erfenis aan uw kinderen tot in eeuwigheid.", "Ps 90:8": "U stelt onze ongerechtigheden voor U, onze heimelijke zonden in het licht van uw aangezicht.", "Gal 6:3": "Want als iemand denkt iets te zijn, terwijl hij niets is, bedriegt hij zichzelf in zijn gemoed.", "Ps 50:16": "Maar tegen de goddeloze zegt God: Wat hebt u Mijn inzettingen te vertellen, en neemt u Mijn verbond in uw mond?", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Ps 96:10": "Zegt onder de heidenen: De HEERE regeert; ook zal de wereld vaststaan, zij zal niet wankelen; Hij zal de volken oordelen in alle rechtvaardigheid.", "Hos 7:15": "Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.", "Ps 10:3": "Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Ex 19:4-6": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb. Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn; En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Ezech 33:4": "En iemand het geluid van de bazuin hoort, wel hoort, maar zich niet laat waarschuwen, en het zwaard komt en neemt hem weg, dan is zijn bloed op zijn eigen hoofd.", "Jer 10:21": "Want de herders zijn redeloos geworden, en hebben de HEERE niet gezocht; daarom hebben zij niet verstandig gehandeld, en hun hele kudde is verstrooid.", "Klaagl 4:13": "Mem. Het is vanwege de zonden van haar profeten, en de misdaden van haar priesters, die in haar midden het bloed van de rechtvaardigen vergoten hebben.", "Jes 65:19": "En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Job 3:1-10": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Jes 62:5": "Want zoals een jongeling een jonkvrouw trouwt, zo zullen uw kinderen u trouwen; en zoals de bruidegom vrolijk is over de bruid, zo zal uw God over u vrolijk zijn.", "Ps 73:2-5": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Matt 5:33-37": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden. Maar Ik zeg u: zweer helemaal niet, noch bij de hemel, omdat hij de troon van God is; noch bij de aarde, omdat zij de voetbank van Zijn voeten is; noch bij Jeruzalem, omdat zij de stad van de grote Koning is;", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Luk 13:6-9": "En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit? En hij antwoordde en zei tegen hem: Heer, laat hem ook dit jaar nog staan, totdat ik om hem heen gegraven en mest gelegd zal hebben;", "Ps 99:8": "O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "Tit 1:16": "Zij belijden dat zij God kennen, maar zij verloochenen Hem met hun werken, omdat zij verfoeilijk zijn en ongehoorzaam, en voor elk goed werk ongeschikt.", "Ps 139:1": "Een psalm van David, voor de koorleider. HEERE! U doorgrondt en kent mij.", "Spr 17:4": "De boosdoener let op de onrechtvaardige lip; een leugenaar neigt het oor tot de verkeerde tong.", "Jer 17:23": "Maar zij hebben niet gehoord, en hun oor niet geneigd; maar zij hebben hun nek verhard, om niet te horen, en om de tucht niet aan te nemen.", "Ezech 13:11": "Zeg tegen hen die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en u, grote hagelstenen, zult vallen, en een grote stormwind zal hem splijten.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Jer 48:11": "Moab is van zijn jeugd af aan rustig geweest, en hij heeft op zijn droesem stilgelegen, en is van vat in vat niet overgegoten, en heeft niet in gevangenschap gewandeld; daarom is zijn smaak in hem gebleven, en zijn geur niet veranderd.", "Job 34:30": "Opdat de huichelachtige mens niet meer regeert, en geen strikken van het volk zijn.", "Ps 19:10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Ps 59:12": "Dood hen niet, opdat mijn volk het niet vergeet; laat hen omzwerven door Uw macht, en werp hen neer, o Heere, ons Schild!", "Num 22:6-11": "En nu, kom toch, vervloek voor mij dit volk, want het is machtiger dan ik; misschien kan ik het dan verslaan, of uit het land verdrijven; want ik weet dat wie u zegent, gezegend is, en wie u vervloekt, vervloekt is. Toen gingen de oudsten van Moab en de oudsten van Midian, met het loon voor de waarzeggerij in hun hand; zo kwamen zij bij Bileam, en spraken tot hem de woorden van Balak. Hij zei toen tegen hen: Overnacht hier deze nacht, dan zal ik u een antwoord terugbrengen, zoals de HEERE tot mij zal gesproken hebben. Toen bleven de vorsten van Moab bij Bileam.", "Jes 24:4": "Het land treurt, het verwelkt; het aardrijk kwijnt weg, het verwelkt; de hoogsten van het volk van het land kwijnen weg.", "Matt 26:42": "Opnieuw, voor de tweede keer, ging Hij heen en bad, en zei: Mijn Vader! Als deze drinkbeker niet aan Mij voorbij kan gaan zonder dat Ik hem drink, laat Uw wil dan gebeuren!", "Ps 28:3": "Trek mij niet weg met de goddelozen, en met de werkers van de ongerechtigheid, die van vrede spreken met hun naasten, maar kwaad is er in hun hart.", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "1 Kron 22:13": "Dan zult u voorspoedig zijn, als u erop toeziet om te doen de inzettingen en de rechten die de HEERE aan Mozes geboden heeft over Israël. Wees sterk en heb goede moed, wees niet bevreesd, en wees niet verslagen!", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "Job 20:22": "Als zijn overvloed op zijn hoogtepunt is, zal het hem benauwd worden; alle hand van de ellendigen zal over hem komen.", "Amos 9:9-15": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen. Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen. Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Jer 4:25": "Ik keek, en zie, er was geen mens; en alle vogels van de hemel waren weggevlogen.", "Jer 3:23": "Waarlijk, tevergeefs verwacht men het van de heuvels en de menigte van bergen; waarlijk, in de HEERE, onze God, is het heil van Israël!", "Ps 126:1": "Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen.", "Pred 9:2": "Alles overkomt iedereen op dezelfde manier: eenzelfde lot treft de rechtvaardige en de goddeloze, de goede en de reine, als de onreine; zowel hem die offert, als hem die niet offert; zoals de goede, zo ook de zondaar, hij die zweert, evenals hij die de eed vreest.", "2 Sam 7:24": "En U hebt Uw volk Israël voor Uzelf bevestigd, voor Uzelf tot een volk, tot in eeuwigheid; en U, HEERE, bent hun tot een God geworden.", "Jes 66:8": "Wie heeft ooit zoiets gehoord? Wie heeft dergelijke dingen gezien? Zou een land geboren kunnen worden op één dag? Zou een volk geboren kunnen worden in één keer? Maar Sion heeft weeën gekregen, en zij heeft haar zonen gebaar
