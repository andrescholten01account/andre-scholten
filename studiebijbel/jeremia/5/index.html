alingen":{"SVnu":{"1":"Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn.","2":"En al zeggen zij: *Zo waarachtig als* de HEERE leeft! toch zweren zij vals.","3":"HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.","4":"Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen.","5":"Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, *en* de banden verscheurd.","6":"Daarom heeft een leeuw uit het woud hen verslagen, een wolf uit de wildernis zal hen verwoesten; een luipaard houdt de wacht bij hun steden; ieder die daaruit gaat, zal verscheurd worden; want hun overtredingen zijn talrijk geworden, hun afdwalingen zijn machtig veel geworden.","7":"Hoe zou Ik u om deze dingen vergeven? Uw kinderen hebben Mij verlaten, en zweren bij hen die geen God zijn; toen Ik hen verzadigd had, bedreven zij overspel, en verzamelden zich in troepen in het hoerenhuis.","8":"Als goed gevoede hengsten zijn zij vroeg op; zij hunkeren, ieder naar de vrouw van zijn naaste.","9":"Zou Ik hierom geen straf brengen? spreekt de HEERE. Of zou Mijn ziel zich niet wreken aan zo'n volk als dit is?","10":"Beklim haar muren, en verwoest ze (maar maak er geen einde aan); haal haar tinnen weg, want zij zijn niet van de HEERE.","11":"Want het huis van Israël en het huis van Juda hebben helemaal trouweloos tegen Mij gehandeld, spreekt de HEERE.","12":"Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien.","13":"Ja, die profeten zullen tot wind worden, want het woord is niet bij hen; hun zelf zal zo gebeuren.","14":"Daarom zegt de HEERE, de God van de heerscharen[1], zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk *tot* hout, en het zal hen verteren.","15":"Zie, Ik zal over u een volk van verre brengen, o huis van Israël! spreekt de HEERE; het is een sterk volk, het is een zeer oud volk, een volk waarvan u de taal niet zult kennen, en niet zult horen wat het spreken zal.","16":"Zijn pijlkoker is als een open graf; zij zijn allemaal helden.","17":"En het zal uw oogst en uw brood opeten, *dat* uw zonen en uw dochters zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgenboom opeten; uw vaste steden, waarop u vertrouwt, zal het arm maken door het zwaard.","18":"Toch zal Ik ook in die dagen, spreekt de HEERE, geen einde met u maken.","19":"En het zal gebeuren, wanneer u zult zeggen: Waarom heeft de HEERE, onze God, ons dit alles gedaan? dat u tegen hen zeggen zult: Zoals u Mij hebt verlaten, en vreemde goden in uw land gediend hebt, zo zult u de vreemden dienen, in een land dat het uwe niet is.","20":"Verkondig dit in het huis van Jakob, en laat het horen in Juda, en zeg:","21":"Hoor nu dit, dwaas en harteloos volk! die ogen hebben, maar niet zien, die oren hebben, maar niet horen.","22":"Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.","23":"Maar dit volk heeft een afvallig en opstandig hart; zij zijn afgevallen en weggegaan;","24":"En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; *Die* voor ons de weken, de vastgestelde tijden van de oogst, bewaart.","25":"Uw ongerechtigheden wenden die dingen af, en uw zonden houden dat goede van u tegen.","26":"Want onder Mijn volk worden goddelozen gevonden; ieder van hen loert, zoals de vogelvanger zich schikt; zij zetten een verderfelijke strik, zij vangen de mensen.","27":"Zoals een kooi vol is van vogels, zo zijn hun huizen vol van bedrog; daarom zijn zij groot en rijk geworden.","28":"Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, *zelfs* de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.","29":"Zou Ik hierom geen straf brengen? spreekt de HEERE; zou Mijn ziel zich niet wreken aan zo'n volk als dit is?","30":"Een verschrikkelijke en afschuwelijke zaak gebeurt er in het land.","31":"De profeten profeteren vals, en de priesters heersen door hun eigen hand; en Mijn volk heeft het graag zo; maar wat zult u aan het einde daarvan doen?"},"SV":{"1":"Gaat om door de wijken van Jeruzalem, en ziet nu toe, en verneemt, en zoekt op haar straten, of gij iemand vindt, of er een is, die recht doet, die waarheid zoekt, zo zal Ik haar genadig zijn.","2":"En of zij al zeggen: *Zo* *waarachtig* *als* de HEERE leeft! zo zweren zij toch valselijk.","3":"O HEERE! *zien* Uw ogen niet naar waarheid? Gij hebt hen geslagen, maar zij hebben geen pijn gevoeld; Gij hebt hen verteerd, *maar* zij hebben geweigerd de tucht aan te nemen; zij hebben hun aangezichten harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.","4":"Doch ik zeide: Zekerlijk, deze zijn arm; zij handelen zottelijk, omdat zij den weg des HEEREN, het recht hun Gods niet weten.","5":"Ik zal gaan tot de groten, en met hen spreken, want die weten den weg des HEEREN, het recht huns Gods; maar zij hadden te zamen het juk verbroken, *en* de banden verscheurd.","6":"Daarom heeft hen een leeuw uit het woud verslagen, een wolf der wildernissen zal hen verwoesten; een luipaard waakt tegen hun steden; al wie uit dezelve uitgaat, zal verscheurd worden; want hun overtredingen zijn vermenigvuldigd, hun afkeringen zijn machtig veel geworden.","7":"Hoe zou Ik over zulks u vergeven? Uw kinderen verlaten Mij, en zweren bij hen, die geen God zijn; als Ik hen verzadigd heb, zo bedrijven zij overspel, en verzamelen bij hopen in het hoerenhuis.","8":"*Als* welgevoederde hengsten zijn zij vroeg op; zij hunkeren een iegelijk naar zijns naasten huisvrouw.","9":"Zou Ik over die dingen geen bezoeking doen? spreekt de HEERE. Of zou Mijn ziel zich niet wreken aan zulk een volk, als dit is?","10":"Beklimt haar muren, en verderft ze (doch maakt geen voleinding); doet haar spitsen weg, want zij zijn des HEEREN niet.","11":"Want het huis van Israël en het huis van Juda hebben gans trouwelooslijk tegen Mij gehandeld, spreekt de HEERE.","12":"Zij verloochenen den HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen noch zwaard noch honger zien.","13":"Ja, die profeten zullen tot wind worden, want het woord is niet bij hen; hun zelven zal zo geschieden.","14":"Daarom zegt de HEERE, de God der heirscharen, alzo, omdat gijlieden dit woord spreekt: Ziet, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk *tot* hout, en het zal hen verteren.","15":"Ziet, Ik zal over ulieden een volk van verre brengen, o huis Israëls! spreekt de HEERE; het is een sterk volk, het is een zeer oud volk, een volk, welks spraak gij niet zult kennen, en niet horen, wat het spreken zal.","16":"Zijn pijlkoker is als een open graf; zij zijn altemaal helden.","17":"En het zal uw oogst en uw brood opeten, *dat* uw zonen en uw dochteren zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgeboom opeten; uw vaste steden, op dewelke gij vertrouwt, zal het arm maken, door het zwaard.","18":"Nochtans zal Ik ook in die dagen, spreekt de HEERE, geen voleinding met ulieden maken.","19":"En het zal geschieden, wanneer gij zult zeggen: Waarom heeft ons de HEERE, onze God, al deze dingen gedaan? dat gij tot hen zeggen zult: Gelijk als gijlieden Mij hebt verlaten, en vreemde goden in uw land gediend, alzo zult gij de uitlandse dienen, in een land, dat het uwe niet is.","20":"Verkondigt dit in het huis van Jakob, en laat het horen in Juda, zeggende:","21":"Hoort nu dit, gij dwaas en harteloos volk! die ogen hebben, maar zien niet, die oren hebben, maar horen niet.","22":"Zult gijlieden Mij niet vrezen? spreekt de HEERE; zult gij voor Mijn aangezicht niet beven? Die der zee het zand tot een paal gesteld heb, met een eeuwige inzetting, dat zij daarover niet zal gaan; ofschoon haar golven zich bewegen, zo zullen zij toch niet vermogen, ofschoon zij bruisen, zo zullen zij toch daarover niet gaan.","23":"Maar dit volk heeft een afvallig en wederspannig hart; zij zijn afgevallen en heengegaan;","24":"En zij zeggen niet in hun hart: Laat ons nu den HEERE, onzen God, vrezen, Die den regen geeft, zo vroegen regen als spaden regen, op Zijn tijd; *Die* ons de weken, de gezette tijden van den oogst, bewaart.","25":"Uw ongerechtigheden wenden die dingen af, en uw zonden weren dat goede van ulieden.","26":"Want onder Mijn volk worden goddelozen gevonden; een ieder van hen loert, gelijk zich de vogelvangers schikken; zij zetten een verderfelijken strik, zij vangen de mensen.","27":"Gelijk een kouw vol is van gevogelte, alzo zijn hun huizen vol van bedrog; daarom zijn zij groot en rijk geworden.","28":"Zij zijn vet, zij zijn glad, zelfs de daden der bozen gaan zij te boven; de rechtzaak richten zij niet, *zelfs* de rechtzaak des wezen, nochtans zijn zij voorspoedig; ook oordelen zij het recht der nooddruftigen niet.","29":"Zou Ik over die dingen geen bezoeking doen? spreekt de HEERE; zou Mijn ziel zich niet wreken aan zulk een volk als dit is?","30":"Een schrikkelijke en afschuwelijke zaak geschiedt er in het land.","31":"De profeten profeteren valselijk, en de priesters heersen door hun handen; en Mijn volk heeft het gaarne alzo; maar wat zult gij ten einde van dien maken?"},"KJV":{"1":"Run ye to and fro through the streets of Jerusalem, and see now, and know, and seek in the broad places thereof, if ye can find a man, if there be *any* that executeth judgment, that seeketh the truth; and I will pardon","2":"And though they say, The LORD liveth; surely they swear falsely.","3":"O LORD, *are* not thine eyes upon the truth? thou hast stricken them, but they have not grieved; thou hast consumed them, *but* they have refused to receive correction: they have made their faces harder than a rock; they have refused to return.","4":"Therefore I said, Surely these *are* poor; they are foolish: for they know not the way of the LORD, *nor* the judgment of their God.","5":"I will get me unto the great men, and will speak unto them; for they have known the way of the LORD, *and* the judgment of their God: but these have altogether broken the yoke, *and* burst the bonds.","6":"Wherefore a lion out of the forest shall slay them, *and* a wolf of the evenings shall spoil them, a leopard shall watch over their cities: every one that goeth out thence shall be torn in pieces: because their transgressions are many, *and* their backslidings are increased.","7":"How shall I pardon thee for this? thy children have forsaken me, and sworn by *them that are* no gods: when I had fed them to the full, they then committed adultery, and assembled themselves by troops in the harlots' houses.","8":"They were *as* fed horses in the morning: every one neighed after his neighbour's wife.","9":"Shall I not visit for these *things*? saith the LORD: and shall not my soul be avenged on such a nation","10":"Go ye up upon her walls, and destroy; but make not a full end: take away her battlements; for they *are* not the LORD'S.","11":"For the house of Israel and the house of Judah have dealt very treacherously against me, saith the LORD.","12":"They have belied the LORD, and said, *It is* not he; neither shall evil come upon us; neither shall we see sword nor famine:","13":"And the prophets shall become wind, and the word *is* not in them: thus shall it be done","14":"Wherefore thus saith the LORD God of hosts, Because ye speak this word, behold, I will make my words in thy mouth fire, and this people wood, and it shall devour","15":"Lo, I will bring a nation upon you from far, O house of Israel, saith the LORD: it *is* a mighty nation, it *is* an ancient nation, a nation whose language thou knowest not, neither understandest what they say.","16":"Their quiver *is* as an open sepulchre, they *are* all mighty men.","17":"And they shall eat up thine harvest, and thy bread, *which* thy sons and thy daughters should eat: they shall eat up thy flocks and thine herds: they shall eat up thy vines and thy fig trees: they shall impoverish thy fenced cities, wherein thou trustedst, with the sword.","18":"Nevertheless in those days, saith the LORD, I will not make a full end","19":"And it shall come to pass, when ye shall say, Wherefore doeth the LORD our God all these *things* unto us? then shalt thou answer them, Like as ye have forsaken me, and served strange gods in your land, so shall ye serve strangers in a land","20":"Declare this in the house of Jacob, and publish it in Judah, saying,","21":"Hear now this, O foolish people, and without understanding; which have eyes, and see not; which have ears, and hear","22":"Fear ye not me? saith the LORD: will ye not tremble at my presence, which have placed the sand *for* the bound of the sea by a perpetual decree, that it cannot pass it: and though the waves thereof toss themselves, yet can they not prevail; though they roar, yet can they not pass over","23":"But this people hath a revolting and a rebellious heart; they are revolted and gone.","24":"Neither say they in their heart, Let us now fear the LORD our God, that giveth rain, both the former and the latter, in his season: he reserveth unto us the appointed weeks of the harvest.","25":"Your iniquities have turn n class=\"wl wl-kjv\" data-code=\"H5221\">stricken</span> them, but they have not <span class=\"wl wl-kjv\" data-code=\"H2342\">grieved;</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> them, but they have <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> <span class=\"wl wl-kjv\" data-code=\"H4148\">correction:</span> they have made their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">harder</span> than a <span class=\"wl wl-kjv\" data-code=\"H5553\">rock;</span> they have <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to return.","4":"Therefore I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Surely these are <span class=\"wl wl-kjv\" data-code=\"H1800\">poor;</span> they are <span class=\"wl wl-kjv\" data-code=\"H2973\">foolish:</span> for they <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> nor the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> of their God.","5":"I will <span class=\"wl wl-kjv\" data-code=\"H3212\">get</span> me unto the great <span class=\"wl wl-kjv\" data-code=\"H1419\">men,</span> and will <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto them; for they have <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> of their <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> but these have <span class=\"wl wl-kjv\" data-code=\"H3162\">altogether</span> <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> the <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke,</span> and <span class=\"wl wl-kjv\" data-code=\"H5423\">burst</span> the bonds.","6":"Wherefore a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3293\">forest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5221\">slay</span> them, and a <span class=\"wl wl-kjv\" data-code=\"H2061\">wolf</span> of the <span class=\"wl wl-kjv\" data-code=\"H6160\">evenings</span> shall <span class=\"wl wl-kjv\" data-code=\"H7703\">spoil</span> them, a <span class=\"wl wl-kjv\" data-code=\"H5246\">leopard</span> shall <span class=\"wl wl-kjv\" data-code=\"H8245\">watch</span> over their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities:</span> every one that goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> thence <span class=\"wl wl-kjv\" data-code=\"H2007\">shall</span> be torn in <span class=\"wl wl-kjv\" data-code=\"H2963\">pieces:</span> because their <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions</span> are <span class=\"wl wl-kjv\" data-code=\"H7231\">many,</span> and their <span class=\"wl wl-kjv\" data-code=\"H4878\">backslidings</span> are increased.","7":"<span class=\"wl wl-kjv\" data-code=\"H335\">How</span> shall I <span class=\"wl wl-kjv\" data-code=\"H5545\">pardon</span> thee for <span class=\"wl wl-kjv\" data-code=\"H2063\">this?</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> me, and <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> by them that are <span class=\"wl wl-kjv\" data-code=\"H3808\">no</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods:</span> when I had fed them to the <span class=\"wl wl-kjv\" data-code=\"H7650\">full,</span> they then committed <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery,</span> and assembled themselves by <span class=\"wl wl-kjv\" data-code=\"H1413\">troops</span> in the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlots'</span> houses.","8":"They were as <span class=\"wl wl-kjv\" data-code=\"H2109\">fed</span> <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> in the <span class=\"wl wl-kjv\" data-code=\"H7904\">morning:</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6670\">neighed</span> after his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> wife.","9":"Shall I not <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> for these things? <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and shall not my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> be <span class=\"wl wl-kjv\" data-code=\"H5358\">avenged</span> on such a nation","10":"Go ye <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> upon her <span class=\"wl wl-kjv\" data-code=\"H8284\">walls,</span> and <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy;</span> but <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> not a full <span class=\"wl wl-kjv\" data-code=\"H3617\">end:</span> take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> her <span class=\"wl wl-kjv\" data-code=\"H5189\">battlements;</span> for they are not the LORD'S.","11":"For the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> have dealt <span class=\"wl wl-kjv\" data-code=\"H898\">very</span> <span class=\"wl wl-kjv\" data-code=\"H898\">treacherously</span> against me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","12":"They have <span class=\"wl wl-kjv\" data-code=\"H3584\">belied</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is not he; neither shall <span class=\"wl wl // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
