chtszaak van alle verdrukten verandert.", "Jer 25:4": "Ook heeft de HEERE tot u gezonden al Zijn dienstknechten, de profeten, vroeg opstaand en zendend (maar u hebt niet gehoord, noch uw oor geneigd om te horen);", "Zach 7:12-14": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen. Daarom is het gebeurd, zoals Hij geroepen had en zij niet gehoord hebben, dat zij ook riepen, maar Ik niet hoorde, zegt de HEERE van de heerscharen; Maar Ik heb hen weggestormd onder alle heidenvolken die zij niet kenden; en het land werd achter hen verwoest, zodat niemand er doorheen trok of terugkeerde; want zij maakten het begerenswaardige land tot een verwoesting.", "Rom 10:21": "Maar tegen Israël zegt Hij: De hele dag heb Ik Mijn handen uitgestrekt naar een ongehoorzaam en tegensprekend volk.", "Zach 1:4": "Wees niet als uw vaderen, tot wie de vorige profeten riepen en zeiden: Zo zegt de HEERE van de heerscharen: Bekeer u toch van uw slechte wegen en uw slechte daden; maar zij hoorden niet, en zij luisterden niet naar Mij, spreekt de HEERE.", "1 Petr 2:11": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel;", "Jer 32:33": "Die Mij de nek toegekeerd hebben en niet het aangezicht; hoewel Ik hen leerde, vroeg opstaand en lerend, evenwel luisterden zij niet, om tucht aan te nemen;", "Jer 6:17": "Ik heb ook wachters over u gesteld, en gezegd: Luistert naar het geluid van de bazuin; maar zij zeggen: Wij zullen niet luisteren.", "2 Kon 12:13": "Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.", "2 Kon 16:18": "Daarbij haalde hij het overdekte gedeelte van de sabbat, dat zij in het huis gebouwd hadden, en de buitenste ingang van de koning weg van het huis van de HEERE, vanwege de koning van Assyrië.", "Num 6:4": "Al de dagen van zijn Nazireeërschap zal hij niets eten van wat van de wijnstok van de wijn gemaakt is, van de kernen af tot de basten toe.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Jak 4:7": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten.", "Jer 51:51": "U zou kunnen zeggen: Wij zijn beschaamd geworden, want wij hebben smaad gehoord, schaamte heeft ons gezicht bedekt; omdat vreemden over de heiligdommen van het huis van de HEERE gekomen zijn;", "Ps 107:11": "Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.", "Mal 2:2": "Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Jer 35:14-17": "De woorden van Jonadab, de zoon van Rechab, die hij zijn kinderen geboden heeft, dat zij geen wijn zouden drinken, zijn bevestigd; want zij hebben niet gedronken tot op deze dag, maar het gebod van hun vader gehoord; en Ik heb tot u gesproken, vroeg opgestaan en gesproken, maar u hebt naar Mij niet geluisterd. En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opgestaan en gezonden, om te zeggen: Bekeer u toch, ieder van zijn boze weg, en maak uw daden goed, en volg andere goden niet na om hen te dienen, dan zult u in het land blijven dat Ik u en uw vaderen gegeven heb; maar u hebt uw oor niet geneigd, en naar Mij niet geluisterd. Omdat de kinderen van Jonadab, de zoon van Rechab, het gebod van hun vader, dat hij hun geboden heeft, bevestigd hebben, maar dit volk naar Mij niet luistert;", "Jer 13:8": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Jer 50:1": "Het woord dat de HEERE gesproken heeft tegen Babel, tegen het land van de Chaldeeën, door de dienst van de profeet Jeremia.", "1 Kon 6:10": "Hij bouwde ook de kamers tegen het hele huis, vijf ellen hoog; en hij voegde ze vast aan dat huis met cederhout.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Jer 6:8-10": "Laat u tuchtigen, Jeruzalem! Opdat Mijn ziel niet van u afgetrokken wordt, opdat Ik u niet stel tot een woestheid, tot een onbewoond land. Zo zegt de HEERE van de heerscharen: Zij zullen Israëls overblijfsel vlijtig nalezen, gelijk een wijnstok; breng uw hand weer, gelijk een wijnlezer, aan de korven. Tot wie zal ik spreken en betuigen, dat zij het horen? Ziet, hun oor is onbesneden, zodat zij niet kunnen toeluisteren; ziet, het woord van de HEERE is hun tot een smaad, zij hebben er geen lust in.", "Jer 7:24": "Toch hebben zij niet gehoord, noch hun oor geneigd, maar gewandeld in de raadslagen, in het eigen goeddunken van hun slechte hart; en zij zijn achterwaarts gekeerd, en niet voorwaarts.", "2 Kron 29:15": "En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.", "1 Kon 13:26": "Toen de profeet die hem van de weg had laten terugkeren, dit hoorde, zei hij: Het is de man van God, die opstandig is geweest tegen de mond van de HEERE; daarom heeft de HEERE hem aan de leeuw overgegeven, die hem verscheurd en gedood heeft, naar het woord van de HEERE dat Hij tot hem gesproken had.", "Openb 2:16": "Bekeer u; en zo niet, Ik zal u haastig bij komen, en zal tegen hen strijd voeren met het zwaard van Mijn mond.", "Hebr 12:17": "Want u weet dat hij ook daarna, toen hij de zegening wilde erven, verworpen werd; want hij vond geen gelegenheid tot berouw, hoewel hij het met tranen zocht.", "Jer 15:19": "Daarom zegt de HEERE zo: Als u zult terugkeren, zal Ik u laten terugkeren; u zult voor Mijn aangezicht staan; en als u het kostbare van het waardeloze scheidt, zult u als Mijn mond zijn; laat hen naar u terugkeren, maar u zult niet naar hen terugkeren.", "Hebr 11:9-13": "Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte. Want hij verwachtte de stad die fundamenten heeft, waarvan God de Ontwerper en Bouwer is. Door het geloof heeft ook Sara zelf kracht ontvangen om, ook toen de tijd van haar ouderdom voorbij was, zwanger te worden en te baren; omdat zij Hem trouw achtte, Die het beloofd had.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Neh 9:26": "Maar zij zijn opstandig geworden, en hebben tegen U gerebelleerd, en Uw wet achter hun rug geworpen, en Uw profeten gedood die tegen hen getuigden, om hen te doen terugkeren tot U; zo hebben zij grote lasteringen gedaan.", "Spr 2:10-12": "Als de wijsheid in uw hart gekomen zal zijn, en de wetenschap voor uw ziel liefelijk zal zijn; Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden; Om u te redden van de kwade weg, van de man die verkeerdheden spreekt;", "2 Kron 3:9": "En het gewicht van de spijkers was tot vijftig sikkels goud; en hij overtrok de bovenzalen met goud.", "Ps 52:3": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag.", "Jer 9:12": "Wie is de wijze man, die dit begrijpt? En tot wie heeft de mond van de HEERE gesproken, dat hij het verkondigt, waarom het land vergaat en afgebrand is als een woestijn, zodat er niemand doorgaat?", "Jer 33:23": "Verder kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Deut 32:16-42": "Zij hebben Hem tot ijver verwekt door vreemde goden; door gruwelen hebben zij Hem tot toorn verwekt. Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben. De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Ezech 44:21": "Ook zal geen priester wijn drinken, als zij in het binnenste voorhof naar binnen gaan.", "Mark 13:22": "Want er zullen valse christussen, en valse profeten opstaan, en zij zullen tekenen en wonderen doen, om te misleiden, indien het mogelijk zou zijn, ook de uitverkorenen.", "Pred 9:7": "Ga dan heen, eet uw brood met vreugde, en drink uw wijn met een vrolijk hart; want God heeft al een behagen in uw werken.", "Ezech 20:21": "Maar die kinderen waren ook opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Zach 1:3": "Daarom zeg tegen hen: Zo zegt de HEERE van de heerscharen: Keer terug tot Mij, spreekt de HEERE van de heerscharen, zo zal Ik weer tot u terugkeren, zegt de HEERE van de heerscharen.", "Jer 35:5-7": "En ik zette de kinderen van het huis van de Rechabieten koppen vol wijn en bekers voor, en ik zei tegen hen: Drink wijn. Maar zij zeiden: Wij zullen geen wijn drinken; want Jonadab, de zoon van Rechab, onze vader, heeft ons geboden en gezegd: U zult geen wijn drinken, u, noch uw kinderen, tot in eeuwigheid. Ook zult u geen huis bouwen, geen zaad zaaien, geen wijngaard planten, noch hebben; maar u zult in tenten wonen al uw dagen, opdat u veel dagen leeft in het land waar u als vreemdeling verblijft.", "Pred 7:26": "En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden.", "Luk 22:31": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe;", "Hos 4:17": "Efraïm is met de afgoden verbonden; laat hem begaan.", "Joz 23:16": "Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Jer 11:8": "Maar zij hebben niet gehoord, en ook hun oor niet geneigd, maar hebben gewandeld, ieder naar het goeddunken van hun boze hart; daarom heb Ik over hen gebracht al de woorden van dit verbond, dat Ik geboden had te doen, maar zij hebben het niet gedaan.", "Spr 8:10": "Neem Mijn tucht aan, en niet zilver, en wetenschap, meer dan het uitgelezen uitgegraven goud.", "Openb 12:11": "En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "1 Kron 23:4": "Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters;", "Jer 15:6": "U hebt Mij verlaten, spreekt de HEERE; u bent achterwaarts gegaan; daarom zal Ik Mijn hand tegen u uitstrekken en u vernietigen; Ik ben het van het berouwen moe geworden.", "2 Kon 7:2": "Maar een hoofdman, op wiens hand de koning leunde, antwoordde de man Gods, en zei: Zie, al zou de HEERE vensters in de hemel maken, zou die zaak dan kunnen gebeuren? En hij zei: Zie, u zult het met uw ogen zien, maar daarvan niet eten.", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "Amos 2:12": "Maar u hebt aan de nazireeërs wijn te drinken gegeven, en u hebt de profeten geboden en gezegd: U zult niet profeteren.", "1 Kor 7:26-31": "Ik houd het er dan voor dat dit goed is vanwege de aanstaande nood, dat het, zeg ik, voor de mens goed is om zo te zijn. Bent u aan een vrouw verbonden, zoek geen ontbinding; bent u ongebonden van een vrouw, zoek geen vrouw. Maar als u toch trouwt, zondigt u niet; en als een maagd trouwt, zondigt zij niet. Toch zullen zulke mensen verdrukking hebben in het vlees; en ik spaar u daarvoor.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Jer 7:27": "Ook zult u al deze woorden tot hen spreken, maar zij zullen naar u niet horen; u zult wel tot hen roepen, maar zij zullen u niet antwoorden.", "Ezech 44:4": "Daarna bracht hij mij de weg van de noorderpoort, voor het huis; en ik zag, en zie, de heerlijkheid van de HEERE had het huis van de HEERE vervuld; toen viel ik op mijn aangezicht.", "Luk 8:13": "En zij die op de rots bezaaid worden, zijn zij die, wanneer zij het gehoord hebben, het Woord met vreugde ontvangen; en dezen hebben geen wortel: zij geloven maar voor een tijd, en in de tijd van verzoeking wijken zij af.", "Jer 40:1": "Het woord dat van de HEERE gebeurd is tot Jeremia, nadat Nebuzaradan, de aanvoerder van de lijfwacht, hem had laten gaan van Rama; toen hij hem had laten halen, terwijl hij met ketenen gebonden was in het midden van alle gevangenen van Jeruzalem en Juda, die naar Babel gevankelijk werden weggevoerd.", "Ps 116:19": "in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "Openb 9:21": "En hebben zich ook niet bekeerd van hun doodslagen, noch van hun toverijen, noch van hun hoererij, noch van hun dieverijen.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Spr 23:20": "Wees niet onder de wijnzuipers, ook niet onder de vleesvreters;", "Matt 24:38": "Want zoals zij waren in de dagen voor de zondvloed, etend en drinkend, terwijl zij trouwden en ten huwelijk gaven, tot de dag toe waarop Noach in de ark ging;", "Gen 3:1-13": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof? En de vrouw zei tegen de slang: Van de vrucht van de bomen in de hof mogen wij eten; Maar van de vrucht van de boom die in het midden van de hof staat, heeft God gezegd: U zult daarvan niet eten, en u zult die ook niet aanraken, anders sterft u.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Ps 82:5": "Zij weten niet, en verstaan niet; zij wandelen steeds in duisternis; daardoor wankelen alle fundamenten van de aarde.", "Jer 32:26": "Toen kwam het woord van de HEERE tot Jeremia:", "Ef 6:3": "opdat het u goed gaat, en u lang leeft op de aarde.", "Gen 20:6": "En God zei tegen hem in de droom: Ik heb ook geweten dat u dit in oprechtheid van uw hart gedaan hebt, en Ik heb u ook belet om tegen Mij te zondigen; daarom heb Ik u niet toegelaten haar aan te raken.", "2 Kon 7:17": "De koning nu had de hoofdman, op wiens hand hij leunde, aangesteld over die poort; en het volk vertrapte hem in de poort, zodat hij stierf, zoals de man Gods gesproken had, die het sprak toen de koning naar hem toe was gekomen.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "Jes 65:12": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb.", "2 Kon 6:10": "Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Jer 25:1": "Het woord dat tot Jeremia gebeurd is over het hele volk van Juda, in het vierde jaar van Jojakim, zoon van Josia, koning van Juda (dit was het eerste jaar van Nebukadnezar, koning van Babel);", "Spr 1:10-17": "Mijn zoon! als de zondaars u aanlokken, stem er niet mee in; Als zij zeggen: Ga met ons, laat ons loeren op bloed, ons verstoppen tegen de onschuldige, zonder oorzaak; Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Spr 4:15": "Verwerp die, ga er niet doorheen; wijk ervan af, en ga voorbij.", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "Jer 5:21-24": "Hoor nu dit, dwaas en harteloos volk! die ogen hebben, maar niet zien, die oren hebben, maar niet horen. Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan. Maar dit volk heeft een afvallig en opstandig hart; zij zijn afgevallen en weggegaan;", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "2 Kon 12:16": "Het geld van het schuldoffer en het geld van de zondoffers werd niet naar het huis van de HEERE gebracht; het was voor de priesters.", "1 Kon 3:1": "En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.", "Gen 25:27": "Toen deze jongens groot werden, werd Ezau een man die de jacht verstond, een man van het veld; maar Jakob werd een oprecht man, die in tenten woonde.", "Luk 7:35": "Doch de wijsheid is in het gelijk gesteld door al haar kinderen.", "Jes 28:1": "Wee de hoogmoedige kroon van de dronkaards van Efraïm, wiens heerlijke sieraad een verwelkende bloem is, die daar is op het hoofd van de zeer vruchtbare vallei, van hen die door de wijn geveld zijn.", "2 Kon 11:18": "Daarna ging al het volk van het land naar het huis van Baäl en brak dat af; zijn altaren en zijn beelden verbraken zij helemaal; en Mattan, de priester van Baäl, sloegen zij dood voor de altaren. De priester stelde toen ambtsdragers aan over het huis van de HEERE.", "Jes 28:3": "De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "Openb 9:20": "En de overige mensen, die niet gedood zijn door deze plagen, hebben zich niet bekeerd van de werken van hun handen, om de duivelen niet meer te aanbidden; en de gouden, en zilveren, en koperen, en stenen, en houten afgoden, die noch kunnen zien, noch horen, noch lopen;", "Rom 8:35-39": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Jer 25:2": "Dat de profeet Jeremia gesproken heeft tot het hele volk van Juda, en tot alle inwoners van Jeruzalem, en hij zei:", "1 Kron 16:19": "Toen u weinige mensen in aantal waren; ja, weinigen en vreemdelingen daarin.", "Jes 46:12": "Hoor naar Mij, u die hardnekkig van hart bent, u, die ver van de gerechtigheid zijt!", "Matt 11:16-24": "Maar waarbij zal Ik dit geslacht vergelijken? Het is gelijk aan de kinderen, die op de markten zitten, en hun vrienden toeroepen, En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend. Want Johannes is gekomen, niet etend, niet drinkend, en zij zeggen: Hij heeft de duivel.", "2 Sam 12:20": "Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "2 Kron 25:7-9": "Maar er kwam een man van God tot hem, en hij zei: O koning! Laat het leger van Israël niet met u meegaan; want de HEERE is niet met Israël, met al de kinderen van Efraïm. Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen. En Amazia zei tegen de man van God: Maar wat moet men doen met de honderd talenten, die ik aan de troepen van Israël gegeven heb? En de man van God zei: De HEERE heeft meer dan dit, om u te geven.", "Ezech 18:30-32": "Daarom zal Ik u richten, o huis van Israël, ieder naar zijn wegen, spreekt de Heere HEERE. Keer terug, en bekeer u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een struikelblok worden. Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël? Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Jer 33:18": "Ook zal het de Levitische priesters nooit ontbreken aan een Man voor Mijn aangezicht, die brandoffer offert, en spijsoffer aansteekt, en slachtoffer bereidt, alle dagen.", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.", "2 Kron 33:15": "En hij nam de vreemde goden en die gelijkenis weg uit het huis van de HEERE, alsook alle altaren die hij gebouwd had op de berg van het huis van de HEERE, en te Jeruzalem; en hij wierp ze buiten de stad.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Luk 10:16": "Wie naar u luistert, luistert naar Mij; en wie u verwerpt, verwerpt Mij; en wie Mij verwerpt, verwerpt Hem die Mij gezonden heeft.", "2 Kron 26:21": "Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.", "Jer 29:26": "De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.", "Spr 9:15-17": "om te roepen naar hen die op de weg voorbijgaan, die hun paden recht maken: Wie is eenvoudig? Hij keert zich hierheen; en tegen wie geen verstand heeft, zegt zij: Het gestolen water is zoet, en het verborgen brood is heerlijk.", "Jes 2:2": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "1 Kon 7:40": "Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:", "Tit 2:3": "De oude vrouwen eveneens, dat zij zich gedragen zoals bij heiligheid past, geen lasteraarsters zijn, zich niet overgeven aan veel wijn, maar leraressen zijn van het goede;", "Jer 44:17": "Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.", "Spr 23:31": "Zie niet naar de wijn, als hij zich rood vertoont, als hij in de beker zijn kleur geeft, als hij vlot naar binnen glijdt;", "Jer 52:24": "Ook nam de leider van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "Deut 8:18": "Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "2 Kon 11:15": "Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "Mark 10:21-25": "En Jezus keek hem aan en had hem lief, en zei tegen hem: Eén ding ontbreekt u; ga heen, verkoop alles wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom, neem het kruis op, en volg Mij. Maar hij werd bedroefd over dat woord, en ging treurig weg; want hij had veel bezittingen. En Jezus keek rond, en zei tegen Zijn discipelen: Hoe moeilijk zullen zij die rijkdom hebben in het Koninkrijk van God binnengaan!", "Jes 48:8": "Ook hebt u ze niet gehoord, ook hebt u ze niet geweten, ook van toen af is uw oor niet geopend geweest; want Ik heb geweten, dat u volledig trouweloos zou handelen, en dat u van de buik af een overtreder genoemd bent.", "1 Kon 10:5": "en het voedsel van zijn tafel, en het zitten van zijn knechten, en het staan van zijn dienaren, en hun kleding, en zijn schenkers, en zijn opgang waarlangs hij naar boven ging in het huis van de HEERE, toen was er in haar geen geest meer.", "Gal 5:17": "Want het vlees begeert tegen de Geest, en de Geest tegen het vlees; en die staan tegenover elkaar, zodat u niet doet wat u zou willen.", "2 Kon 23:17": "Verder zei hij: Wat is dat voor een grafteken, dat ik zie? En de mannen van de stad zeiden tegen hem: Het is het graf van de man van God, die uit Juda kwam, en deze dingen, die u tegen dit altaar van Beth-el gedaan hebt, uitgeroepen heeft.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "Hebr 12:25": "Zie erop toe dat u Hem, Die spreekt, niet verwerpt; want als dezen niet ontkomen zijn, die hem verwierpen die op aarde Goddelijke antwoorden gaf, hoeveel te meer zullen wij niet ontkomen, als wij ons afkeren van Hem Die van de hemelen is;", "Mark 4:17": "En zij hebben geen wortel in zichzelf, maar houden het voor een tijd vol; daarna, wanneer er verdrukking of vervolging komt omwille van het Woord, worden zij meteen afvallig.", "Jes 46:13": "Ik breng Mijn gerechtigheid nabij, zij zal niet ver weg zijn, en Mijn heil zal niet uitblijven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid.", "Jes 28:9-12": "Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn? Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig. Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "1 Kron 21:1": "Toen stond de satan op tegen Israël, en hij porde David aan, dat hij Israël telde.", "Jer 22:13-19": "Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft! Die zegt: Ik zal mij een zeer hoog huis bouwen, en ruime bovenzalen; en hij houwt er zich vensters in uit, en het is bedekt met ceder, en aangestreken met menie. Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "2 Kon 11:3": "En hij was met haar verborgen in het huis van de HEERE, zes jaar; en Athalia regeerde over het land.", "Jer 35:5-10": "En ik zette de kinderen van het huis van de Rechabieten koppen vol wijn en bekers voor, en ik zei tegen hen: Drink wijn. Maar zij zeiden: Wij zullen geen wijn drinken; want Jonadab, de zoon van Rechab, onze vader, heeft ons geboden en gezegd: U zult geen wijn drinken, u, noch uw kinderen, tot in eeuwigheid. Ook zult u geen huis bouwen, geen zaad zaaien, geen wijngaard planten, noch hebben; maar u zult in tenten wonen al uw dagen, opdat u veel dagen leeft in het land waar u als vreemdeling verblijft.", "Jer 35:16-19": "Omdat de kinderen van Jonadab, de zoon van Rechab, het gebod van hun vader, dat hij hun geboden heeft, bevestigd hebben, maar dit volk naar Mij niet luistert; Daarom, zo zegt de HEERE, de God van de heerscharen, de God van Israël: Zie, Ik zal over Juda en over alle inwoners van Jeruzalem al het kwaad brengen dat Ik tegen hen gesproken heb; omdat Ik tot hen gesproken heb, maar zij niet geluisterd hebben, en Ik tot hen geroepen heb, maar zij niet geantwoord hebben. Tot het huis van de Rechabieten nu zei Jeremia: Zo zegt de HEERE van de heerscharen, de God van Israël: Omdat u het gebod van uw vader Jonadab gehoorzaam bent geweest, en al zijn geboden bewaard hebt, en gedaan hebt naar alles wat hij u geboden heeft;", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "Ex 34:12-16": "Wacht u ervoor dat u toch geen verbond maakt met de inwoner van het land, waarin u komen zult; dat hij misschien niet tot een valstrik wordt in uw midden. Maar hun altaren zult u omverwerpen, en hun opgerichte beelden zult u verbreken, en hun gewijde palen zult u afhouwen. (Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!)", "2 Kon 24:1-6": "In zijn dagen trok Nebukadnezar, de koning van Babel, op, en Jojakim werd zijn dienaar, drie jaar lang; daarna keerde hij zich om en kwam in opstand tegen hem. En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten. Zeker gebeurde dit op bevel van de HEERE tegen Juda, dat Hij hen van Zijn aangezicht wegdeed, om de zonden van Manasse, naar alles wat hij gedaan had;", "Jer 44:16": "Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen.", "Deut 31:20": "Want Ik zal dit volk brengen in het land, dat Ik hun vaderen gezworen heb, vloeiend van melk en honing, en het zal eten, en verzadigd, en vet worden; dan zal het zich wenden tot andere goden, en hen dienen, en zij zullen Mij tergen, en Mijn verbond vernietigen.", "2 Kon 10:23": "En Jehu kwam met Jonadab, de zoon van Rechab, in het huis van Baäl; en hij zei tot de dienaren van Baäl: Onderzoekt, en kijkt goed toe, dat hier misschien niemand bij u is van de dienaren van de HEERE, maar alleen van de dienaren van Baäl.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "Jer 17:20-23": "En zeg tegen hen: Hoort het woord van de HEERE, u koningen van Juda, en heel Juda, en alle inwoners van Jeruzalem, die door deze poorten ingaan! Zo zegt de HEERE: Wacht u voor uw zielen, en draag geen last op de sabbatdag, en breng die niet in door de poorten van Jeruzalem. Ook zult u geen last uitvoeren uit uw huizen op de sabbatdag, en geen enkel werk doen; maar u zult de sabbatdag heiligen, zoals Ik uw vaderen geboden heb.", "Jer 11:7": "Want Ik heb uw vaderen ernstig betuigd, op de dag dat Ik hen uit Egypteland opvoerde, tot op deze dag, vroeg opstaand en betuigend, en Ik zei: Hoor naar Mijn stem!", "1 Kron 23:28": "Omdat hun standplaats was aan de hand van de zonen van Aäron in de dienst van het huis van de HEERE, over de voorhoven, en over de kamers, en over de reiniging van alle heilige dingen, en het werk van de dienst van het huis van God;", "Jer 33:17": "Want zo zegt de HEERE: Aan David zal het nooit ontbreken aan een Man, Die op de troon van het huis van Israël zit.", "Ps 107:12": "Daarom heeft Hij hun hart door zwarigheid vernederd; zij zijn gestruikeld, en er was geen helper.", "Openb 2:5": "Bedenk dan waarvan u uitgevallen bent, en bekeer u, en doe de eerste werken; en zo niet, Ik zal u haastig bij komen, en zal uw kandelaar van zijn plaats wegnemen, als u zich niet bekeert.", "Ps 81:12": "Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.", "Ps 50:17": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit.", "Ps 106:25": "Maar zij morden in hun tenten; naar de stem van de HEERE luisterden zij niet.", "2 Kron 32:31": "Maar toch, toen de gezanten van de vorsten van Babel bij hem waren, die tot hem gezonden waren om te vragen naar het wonderteken dat in het land gebeurd was, verliet God hem, om hem te beproeven, om te weten alles wat er in zijn hart was.", "Jes 48:4": "Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;", "Hand 26:20": "Maar heb eerst aan hen die te Damaskus waren, en te Jeruzalem, en in het gehele land Judea, en aan de heidenen verkondigd dat zij zich zouden bekeren en zich tot God bekeren, en werken zouden doen die de bekering waardig zijn.", "Matt 24:39": "en zij merkten het niet, totdat de zondvloed kwam en hen allen wegnam; zo zal ook de komst van de Zoon des mensen zijn.", "Jer 6:19": "Hoor toe, aarde! Zie, Ik zal een kwaad brengen over dit volk, de vrucht van hun gedachten; want zij letten niet op Mijn woorden, en Mijn wet verwerpen zij.", "Ezech 3:1-11": "Daarna zei Hij tot mij: Mensenkind, eet, wat u vinden zult; eet deze rol, en ga, spreek tot het huis Israëls. Toen opende ik mijn mond, en Hij gaf mij die rol te eten. En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.", "2 Kon 25:18": "Ook nam de aanvoerder van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders.", "Neh 8:15-17": "En zij vonden in de wet geschreven, dat de HEERE door de hand van Mozes geboden had, dat de kinderen van Israël in loofhutten zouden wonen op het feest in de zevende maand; en dat zij het bekend zouden maken en een boodschap zouden laten doorgaan door al hun steden en in Jeruzalem, en zeggen: Ga het gebergte in, en haal takken van olijfbomen, en takken van andere olieachtige bomen, en takken van mirtebomen, en takken van palmbomen, en takken van andere dichtbebladerde bomen, om loofhutten te maken, zoals er geschreven staat. Zo ging het volk erop uit en haalde ze, en zij maakten voor zichzelf loofhutten, ieder op zijn dak, en in hun binnenplaatsen, en in de voorhoven van het huis van God, en op het plein van de Waterpoort, en op het plein van de Efraïmpoort.", "Matt 26:41": "Waakt en bidt, opdat u niet in verzoeking komt; de geest is wel gewillig, maar het vlees is zwak.", "Jer 15:4": "En Ik zal hen overgeven tot een schrikbeeld voor alle koninkrijken van de aarde, vanwege Manasse, zoon van Jehizkia, koning van Juda, om wat hij in Jeruzalem gedaan heeft.", "1 Kon 12:22": "Doch het woord van God kwam tot Semaja, de man van God, en zei:", "Jer 44:1": "Het woord dat tot Jeremia gebeurde over al de Joden die in Egypteland woonden, die te Migdol woonden, en te Tachpanhes, en te Nof, en in het land Pathros, en hij zei:", "Matt 27:4": "en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.", "Dan 9:13": "Zoals geschreven is in de wet van Mozes, zo is al dat kwaad over ons gekomen; en wij smeekten het aangezicht van de HEERE, onze God, niet, door ons af te keren van onze ongerechtigheden en verstandig acht te geven op Uw waarheid.", "Deut 29:19-28": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Hebr 2:18": "Want doordat Hij Zelf, beproefd zijnde, geleden heeft, kan Hij hun die beproefd worden, te hulp komen.", "Spr 23:29-32": "Bij wie is wee? bij wie ach en wee? bij wie geruzie? bij wie geklaag? bij wie wonden zonder oorzaak? bij wie roodheid van de ogen? Bij hen die bij de wijn blijven hangen; bij hen die komen om gemengde drank op te zoeken. Zie niet naar de wijn, als hij zich rood vertoont, als hij in de beker zijn kleur geeft, als hij vlot naar binnen glijdt;", "1 Kon 17:18": "En zij zei tegen Elia: Wat heb ik met u te doen, man van God? Bent u bij mij binnengekomen om mijn ongerechtigheid in gedachtenis te brengen, en om mijn zoon te doden?", "Spr 31:4": "Het komt koningen niet toe, o Lemuël! Het komt koningen niet toe wijn te drinken, en prinsen niet, om sterke drank te begeren;", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Jes 24:9": "Zij zullen geen wijn drinken met gezang; de sterke drank zal bitter zijn voor hen die hem drinken.", "Spr 21:29": "Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.", "1 Kron 9:27": "En zij bleven overnachten rondom het huis van God; want op hen was de wacht, en zij waren over de opening, en dat elke morgen.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "1 Sam 2:27": "En er kwam een man van God naar Eli, en zei tegen hem: Zo zegt de HEERE: Heb Ik Mij klaar geopenbaard aan het huis van uw vader, toen zij in Egypte waren, in het huis van Farao?", "Matt 18:6-9": "Maar wie een van deze kleinen die in Mij geloven, doet struikelen, voor hem zou het beter zijn dat een molensteen aan zijn hals gehangen werd en dat hij in de diepte van de zee verzonken werd. Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden.", "Jes 32:9-11": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Ezech 40:7-13": "En elk kamertje was één riet de lengte en één riet de breedte; en tussen de kamertjes was vijf ellen; en de drempel van de poort, bij het voorhuis van de poort aan de binnenkant, was één riet. Ook mat hij het voorhuis van de poort aan de binnenkant: één riet. Toen mat hij het andere voorhuis van de poort: acht ellen, en de posten ervan: twee ellen; en het voorhuis van de poort was aan de binnenkant.", "Jer 38:14": "Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Mark 14:38": "Waak en bid, opdat u niet in verzoeking komt; de geest is wel gewillig, maar het vlees is zwak.", "Jer 32:1": "Het woord dat tot Jeremia gekomen is van de HEERE, in het tiende jaar van Zedekia, koning van Juda; dit jaar was het achttiende jaar van Nebukadnezar.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Lev 10:8-10": "En de HEERE sprak tegen Aäron: Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties; En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "Deut 5:16": "Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.", "Matt 12:42": "De koningin van het zuiden zal opstaan in het oordeel met dit geslacht, en zal het veroordelen; want zij is gekomen van het einde van de aarde, om de wijsheid van Salomo te horen; en zie, meer dan Salomo is hier!", "Judas 1:24": "Aan Hem nu, Die machtig is u voor struikelen te bewaren, en onstraffelijk te stellen voor Zijn heerlijkheid, in vreugde,", "Jer 2:25": "Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Lev 23:43": "opdat uw geslachten weten, dat Ik de kinderen van Israël in loofhutten heb doen wonen, toen Ik hen uit het land Egypte uitgeleid heb; Ik ben de HEERE, uw God!", "Jer 36:1": "Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam:", "Rom 14:15": "Maar als uw broeder om het voedsel bedroefd wordt, dan wandelt u niet meer naar liefde. Breng hem niet ten verderve met uw voedsel, voor wie Christus gestorven is.", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "2 Kron 34:15": "En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.", "Jer 6:10": "Tot wie zal ik spreken en betuigen, dat zij het horen? Ziet, hun oor is onbesneden, zodat zij niet kunnen toeluisteren; ziet, het woord van de HEERE is hun tot een smaad, zij hebben er geen lust in.", "2 Kon 20:8": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?", "1 Petr 4:12": "Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam;", "1 Tim 6:9": "Maar zij die rijk willen worden, vallen in verzoeking en in een valstrik, en in veel dwaze en schadelijke begeerten, die de mensen doen wegzinken in verderf en ondergang.", "2 Kon 11:19": "En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.", "Spr 28:10": "Wie de oprechten doet dwalen op een kwade weg, zal zelf in zijn eigen kuil vallen; maar de vromen zullen het goede beërven.", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "Ezech 3:26": "En Ik zal uw tong aan uw gehemelte doen kleven, zodat u stom worden zult, en hun niet zult zijn tot een bestraffende man; want zij zijn een opstandig huis.", "Jer 26:10": "Toen nu de vorsten van Juda deze woorden hoorden, gingen zij op uit het huis van de koning naar het huis van de HEERE; en zij zetten zich bij de deur van de nieuwe poort van de HEERE.", "Jer 5:3": "HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren."}, "noten": {"1": "Jer. 35:13,17,19: SV: HEERE der heirscharen. D.i.: legermachten."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">Het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3414\">dat</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3414\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3117\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3117\">HE pan> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2262\">Habaziniah,</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and the whole <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the Rechabites;", "4": "And I <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> into the <span class=\"wl wl-kjv\" data-code=\"H3957\">chamber</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2605\">Hanan,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3012\">Igdaliah,</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which was <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H3957\">chamber</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> which was <span class=\"wl wl-kjv\" data-code=\"H4605\">above</span> the <span class=\"wl wl-kjv\" data-code=\"H3957\">chamber</span> of <span class=\"wl wl-kjv\" data-code=\"H4641\">Maaseiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7967\">Shallum,</span> the <span class=\"wl wl-kjv\" data-code=\"H8104\">keeper</span> of the door:", "5": "And I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H7397\">Rechabites</span> <span class=\"wl wl-kjv\" data-code=\"H1375\">pots</span> <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and <span class=\"wl wl-kjv\" data-code=\"H3563\">cups,</span> and I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H8354\">Drink</span> ye wine.", "6": "But they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We will <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> no <span class=\"wl wl-kjv\" data-code=\"H3196\">wine:</span> for <span class=\"wl wl-kjv\" data-code=\"H3122\">Jonadab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7394\">Rechab</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> us, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye shall <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> no <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> neither ye, nor your <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> ever:", "7": "Neither shall ye <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> nor <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> nor have any: but all your <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H168\">tents;</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H2421\">live</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> where ye be strangers.", "8": "Thus have we <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H3082\">Jonadab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7394\">Rechab</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> in all that he hath <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> us, to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> no <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> all our <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> we, our <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> our <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> nor our daughters;", "9": "Nor to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> for us to dwell <span class=\"wl wl-kjv\" data-code=\"H3427\">in:</span> neither have we <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> nor seed:", "10": "But we have dwelt <span class=\"wl wl-kjv\" data-code=\"H3427\">in</span> <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and have <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> according to all that <span class=\"wl wl-kjv\" data-code=\"H3122\">Jonadab</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> commanded", "11": "But it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> that we <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Come,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> for <span class=\"wl wl-kjv\" data-code=\"H6440\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> and for <span class=\"wl wl-kjv\" data-code=\"H6440\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> of the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians:</span> so we <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> at Jerusalem.", "12": "Then came the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah,</span> saying,", "13": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> Will ye not <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> <span class=\"wl wl-kjv\" data-code=\"H4148\">instruction</span> to <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> to my <span class=\"wl wl-kjv\" data-code=\"H1697\">words?</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "14": "The <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H3082\">Jonadab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7394\">Rechab,</span> that he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> not to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> are <span class=\"wl wl-kjv\" data-code=\"H6965\">performed;</span> for unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> none, but <span class=\"wl wl-kjv\" data-code=\"H8085\">obey</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment:</span> notwithstanding I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto you, rising <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking;</span> but ye hearkened", "15": "I have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> also unto you all my <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> rising up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sending</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> ye now every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> from his <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H3190\">amend</span> your <span class=\"wl wl-kjv\" data-code=\"H4611\">doings,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> not <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> them, and ye shall dwell <span class=\"wl wl-kjv\" data-code=\"H3427\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to you and to your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers:</span> but ye have not <span class=\"wl wl-kjv\" data-code=\"H5186\">inclined</span> your <span class=\"wl wl-kjv\" data-code=\"H241\">ear,</span> nor hearkened", "16": "Because the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3082\">Jonadab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7394\">Rechab</span> have <span class=\"wl wl-kjv\" data-code=\"H6965\">performed</span> the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> which he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them; but this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> hath not hearkened", "17": "Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and upon all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> all the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that I have <span class=\"wl wl-kjv\" data-code=\"H1696\">pronounced</span> against them: because I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto them, but they have not <span class=\"wl wl-kjv\" data-code=\"H8085\">heard;</span> and I have <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto them, but they have not answered.", "18": "And <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H7397\">Rechabites,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Because ye have <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of <span class=\"wl wl-kjv\" data-code=\"H3082\">Jonadab</span> your <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> all his <span class=\"wl wl-kjv\" data-code=\"H4687\">precepts,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> according unto all that he hath commanded", "19": "Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> <span class=\"wl wl-kjv\" data-code=\"H3122\">Jonadab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7394\">Rechab</span> shall not <span class=\"wl wl-kjv\" data-code=\"H3772\">want</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me for ever."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
