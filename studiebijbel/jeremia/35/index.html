}},"vertalingen":{"SVnu":{"1":"Het woord dat van de HEERE tot Jeremia gebeurd is, in de dagen van Jojakim, de zoon van Josia, de koning van Juda, en zei:","2":"Ga naar het huis van de Rechabieten, en spreek met hen, en breng hen in het huis van de HEERE, in een van de kamers, en geef hun wijn te drinken.","3":"Toen nam ik Jaazanja, de zoon van Jeremia, de zoon van Habazzinja, alsook zijn broers, en al zijn zonen, en het hele huis van de Rechabieten;","4":"En bracht hen in het huis van de HEERE, in de kamer van de zonen van Hanan, de zoon van Jigdalia, de man Gods; die is bij de kamer van de leiders, die daar is boven de kamer van Maaseja, de zoon van Sallum, de dorpelbewaarder.","5":"En ik zette de kinderen van het huis van de Rechabieten koppen vol wijn en bekers voor, en ik zei tegen hen: Drink wijn.","6":"Maar zij zeiden: Wij zullen geen wijn drinken; want Jonadab, de zoon van Rechab, onze vader, heeft ons geboden en gezegd: U zult geen wijn drinken, u, noch uw kinderen, tot in eeuwigheid.","7":"Ook zult u geen huis bouwen, geen zaad zaaien, geen wijngaard planten, noch hebben; maar u zult in tenten wonen al uw dagen, opdat u veel dagen leeft in het land waar u als vreemdeling verblijft.","8":"Zo hebben wij naar de stem van Jonadab, de zoon van Rechab, onze vader, geluisterd in alles wat hij ons geboden heeft; zodat wij geen wijn drinken al onze dagen, wij, onze vrouwen, onze zonen, en onze dochters;","9":"En dat wij geen huizen bouwen om erin te wonen; ook hebben wij geen wijngaard, geen veld, geen zaad;","10":"En wij hebben in tenten gewoond; zo hebben wij gehoord en gedaan naar alles wat onze vader Jonadab ons geboden heeft.","11":"Maar het is gebeurd, toen Nebukadrezar, de koning van Babel, naar dit land optrok, dat wij zeiden: Kom, laat ons naar Jeruzalem trekken vanwege het leger van de Chaldeeën, en vanwege het leger van de Syriërs; zo zijn wij in Jeruzalem gebleven.","12":"Toen kwam het woord van de HEERE tot Jeremia en zei:","13":"Zo zegt de HEERE van de heerscharen, de God van Israël: Ga heen en zeg tegen de mannen van Juda en tegen de inwoners van Jeruzalem: Zult u geen tucht aannemen, zodat u naar Mijn woorden luistert? spreekt de HEERE.","14":"De woorden van Jonadab, de zoon van Rechab, die hij zijn kinderen geboden heeft, dat zij geen wijn zouden drinken, zijn bevestigd; want zij hebben niet gedronken tot op deze dag, maar het gebod van hun vader gehoord; en Ik heb tot u gesproken, vroeg opgestaan en gesproken, maar u hebt naar Mij niet geluisterd.","15":"En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opgestaan en gezonden, om te zeggen: Bekeer u toch, ieder van zijn boze weg, en maak uw daden goed, en volg andere goden niet na om hen te dienen, dan zult u in het land blijven dat Ik u en uw vaderen gegeven heb; maar u hebt uw oor niet geneigd, en naar Mij niet geluisterd.","16":"Omdat de kinderen van Jonadab, de zoon van Rechab, het gebod van hun vader, dat hij hun geboden heeft, bevestigd hebben, maar dit volk naar Mij niet luistert;","17":"Daarom, zo zegt de HEERE, de God van de heerscharen, de God van Israël: Zie, Ik zal over Juda en over alle inwoners van Jeruzalem al het kwaad brengen dat Ik tegen hen gesproken heb; omdat Ik tot hen gesproken heb, maar zij niet geluisterd hebben, en Ik tot hen geroepen heb, maar zij niet geantwoord hebben.","18":"Tot het huis van de Rechabieten nu zei Jeremia: Zo zegt de HEERE van de heerscharen, de God van Israël: Omdat u het gebod van uw vader Jonadab gehoorzaam bent geweest, en al zijn geboden bewaard hebt, en gedaan hebt naar alles wat hij u geboden heeft;","19":"Daarom, zo zegt de HEERE van de heerscharen, de God van Israël: Er zal Jonadab, de zoon van Rechab, geen man worden afgesneden, die voor Mijn aangezicht staat, al de dagen."},"SV":{"1":"Het woord, dat tot Jeremia geschied is van den HEERE, in de dagen van Jojakim, den zoon van Josia, den koning van Juda, zeggende:","2":"Ga henen tot der Rechabieten huis, en spreek met hen, en breng hen in des HEEREN huis, in een der kameren, en geef hun wijn te drinken.","3":"Toen nam ik Jaazanja, den zoon van Jeremia, den zoon van Habazzinja, mitsgaders zijn broederen, en al zijn zonen, en het ganse huis der Rechabieten;","4":"En bracht hen in des HEEREN huis, in de kamer der zonen van Hanan, den zoon van Jigdalia, den man Gods; welke is bij de kamer der oversten, die daar is boven de kamer van Maaseja, den zoon van Sallum, den dorpelbewaarder.","5":"En ik zette den kinderen van het huis der Rechabieten koppen vol wijn en bekers voor; en ik zeide tot hen: Drinkt wijn.","6":"Maar zij zeiden: Wij zullen geen wijn drinken; want Jonadab, de zoon van Rechab, onze vader, heeft ons geboden, zeggende: Gijlieden zult geen wijn drinken, gij, noch uw kinderen, tot in eeuwigheid.","7":"Ook zult gijlieden geen huis bouwen, noch zaad zaaien, noch wijngaard planten, noch hebben; maar gij zult in tenten wonen al uw dagen; opdat gij veel dagen leeft in het land, alwaar gij als vreemdeling verkeert.","8":"Zo hebben wij der stemme van Jonadab, den zoon van Rechab, onzen vader, gehoorzaamd in alles, wat hij ons geboden heeft; zodat wij geen wijn drinken al onze dagen, wij, onze vrouwen, onze zonen, en onze dochteren;","9":"En dat wij geen huizen bouwen tot onze woning; ook hebben wij geen wijngaard, noch veld, noch zaad;","10":"En wij hebben in tenten gewoond; alzo hebben wij gehoord en gedaan naar alles, wat ons onze vader Jonadab geboden heeft.","11":"Maar het is geschied, als Nebukadrezar, de koning van Babel, naar dit land optoog, dat wij zeiden: Komt, en laat ons naar Jeruzalem trekken vanwege het heir der Chaldeen, en vanwege het heir der Syriërs; alzo zijn wij te Jeruzalem gebleven.","12":"Toen geschiedde des HEEREN woord tot Jeremia, zeggende:","13":"Zo zegt de HEERE der heirscharen, de God Israëls: Ga henen en zeg tot de mannen van Juda en tot de inwoners van Jeruzalem: Zult gijlieden geen tucht aannemen, dat gij hoort naar Mijn woorden? spreekt de HEERE.","14":"De woorden van Jonadab, den zoon van Rechab, die hij zijn kinderen geboden heeft, dat zij geen wijn zouden drinken, zijn bevestigd; want zij hebben geen gedronken tot op dezen dag, maar het gebod huns vaders gehoord; en Ik heb tot ulieden gesproken, vroeg op zijnde en sprekende, maar gij hebt naar Mij niet gehoord.","15":"En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg op zijnde en zendende, om te zeggen: Bekeert u toch, een iegelijk van zijn bozen weg, en maakt uw handelingen goed, en wandelt andere goden niet na, om hen te dienen, zo zult gij in het land blijven, dat Ik u en uw vaderen gegeven heb; maar gij hebt uw oor niet geneigd, en naar Mij niet gehoord.","16":"Dewijl *dan* de kinderen van Jonadab, den zoon van Rechab, het gebod huns vaders, dat hij hun geboden heeft, bevestigd hebben, maar dit volk naar Mij niet hoort;","17":"Daarom alzo zegt de HEERE, de God der heirscharen, de God Israëls: Ziet, Ik zal over Juda en over alle inwoners van Jeruzalem brengen al het kwaad, dat Ik tegen hen gesproken heb; omdat Ik tot hen gesproken heb, maar zij niet gehoord hebben, en Ik tot hen geroepen heb, maar zij niet hebben geantwoord.","18":"Tot het huis nu der Rechabieten zeide Jeremia: Zo zegt de HEERE der heirscharen, de God Israëls: Omdat gijlieden het gebod van uw vader Jonadab zijt gehoorzaam geweest, en hebt al zijn geboden bewaard, en gedaan naar alles, wat hij ulieden geboden heeft;","19":"Daarom alzo zegt de HEERE der heirscharen, de God Israëls: Er zal Jonadab, den zoon van Rechab, niet worden afgesneden een man, die voor Mijn aangezicht sta, al de dagen."},"KJV":{"1":"The word which came unto Jeremiah from the LORD in the days of Jehoiakim the son of Josiah king of Judah, saying,","2":"Go unto the house of the Rechabites, and speak unto them, and bring them into the house of the LORD, into one of the chambers, and give them wine to drink.","3":"Then I took Jaazaniah the son of Jeremiah, the son of Habaziniah, and his brethren, and all his sons, and the whole house of the Rechabites;","4":"And I brought them into the house of the LORD, into the chamber of the sons of Hanan, the son of Igdaliah, a man of God, which *was* by the chamber of the princes, which *was* above the chamber of Maaseiah the son of Shallum, the keeper of the door:","5":"And I set before the sons of the house of the Rechabites pots full of wine, and cups, and I said unto them, Drink ye wine.","6":"But they said, We will drink no wine: for Jonadab the son of Rechab our father commanded us, saying, Ye shall drink no wine, *neither ye*, nor your sons for ever:","7":"Neither shall ye build house, nor sow seed, nor plant vineyard, nor have *any*: but all your days ye shall dwell in tents; that ye may live many days in the land where ye *be* strangers.","8":"Thus have we obeyed the voice of Jonadab the son of Rechab our father in all that he hath charged us, to drink no wine all our days, we, our wives, our sons, nor our daughters;","9":"Nor to build houses for us to dwell in: neither have we vineyard, nor field, nor seed:","10":"But we have dwelt in tents, and have obeyed, and done according to all that Jonadab our father commanded","11":"But it came to pass, when Nebuchadrezzar king of Babylon came up into the land, that we said, Come, and let us go to Jerusalem for fear of the army of the Chaldeans, and for fear of the army of the Syrians: so we dwell at Jerusalem.","12":"Then came the word of the LORD unto Jeremiah, saying,","13":"Thus saith the LORD of hosts, the God of Israel; Go and tell the men of Judah and the inhabitants of Jerusalem, Will ye not receive instruction to hearken to my words? saith the LORD.","14":"The words of Jonadab the son of Rechab, that he commanded his sons not to drink wine, are performed; for unto this day they drink none, but obey their father's commandment: notwithstanding I have spoken unto you, rising early and speaking; but ye hearkened","15":"I have sent also unto you all my servants the prophets, rising up early and sending *them*, saying, Return ye now every man from his evil way, and amend your doings, and go not after other gods to serve them, and ye shall dwell in the land which I have given to you and to your fathers: but ye have not inclined your ear, nor hearkened","16":"Because the sons of Jonadab the son of Rechab have performed the commandment of their father, which he commanded them; but this people hath not hearkened","17":"Therefore thus saith the LORD God of hosts, the God of Israel; Behold, I will bring upon Judah and upon all the inhabitants of Jerusalem all the evil that I have pronounced against them: because I have spoken unto them, but they have not heard; and I have called unto them, but they have not answered.","18":"And Jeremiah said unto the house of the Rechabites, Thus saith the LORD of hosts, the God of Israel; Because ye have obeyed the commandment of Jonadab your father, and kept all his precepts, and done according unto all that he hath commanded","19":"Therefore thus saith the LORD of hosts, the God of Israel; Jonadab the son of Rechab shall not want a man to stand before me for ever."}},"tsk":{"1":[{"kopje":"in de","refs":["Jer 1:3","Jer 22:13-19","Jer 25:1","Jer 26:1","Jer 36:1","Jer 36:9","Jer 36:29","Jer 46:2","2 Kon 23:35","2 Kon 24:1-6","2 Kron 36:5-8","Dan 1:1"]}],"2":[{"kopje":"het huis","refs":["Jer 35:8","2 Kon 10:15","2 Kon 10:16","1 Kron 2:55"]},{"kopje":"in een","refs":["Jer 35:4","1 Kon 6:5","1 Kon 6:6","1 Kon 6:10","1 Kron 9:26","1 Kron 23:28","2 Kron 3:9","2 Kron 31:11","Ezra 8:29","Neh 13:5","Neh 13:8","Neh 13:9","Ezech 40:7-13","Ezech 40:16","Ezech 41:5-11","Ezech 42:4-13"]}],"4":[{"kopje":"in de kamer","refs":["Jer 36:10-12"]},{"kopje":"de man","refs":["Deut 33:1","Joz 14:6","1 Sam 2:27","1 Sam 9:6-8","1 Kon 12:22","1 Kon 13:1","1 Kon 13:26","1 Kon 17:18","1 Kon 17:24","1 Kon 20:28","2 Kon 1:9","2 Kon 1:11-13","2 Kon 5:14","2 Kon 5:20","2 Kon 6:10","2 Kon 7:2","2 Kon 7:17","2 Kon 8:2-8","2 Kon 23:16","2 Kon 23:17","2 Kron 8:14","2 Kro // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
