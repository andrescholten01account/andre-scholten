 wijn drinken al onze dagen, wij, onze vrouwen, onze zonen, en onze dochters;", "9": "En dat wij geen huizen bouwen om erin te wonen; ook hebben wij geen wijngaard, geen veld, geen zaad;", "10": "En wij hebben in tenten gewoond; zo hebben wij gehoord en gedaan naar alles wat onze vader Jonadab ons geboden heeft.", "11": "Maar het is gebeurd, toen Nebukadrezar, de koning van Babel, naar dit land optrok, dat wij zeiden: Kom, laat ons naar Jeruzalem trekken vanwege het leger van de Chaldeeën, en vanwege het leger van de Syriërs; zo zijn wij in Jeruzalem gebleven.", "12": "Toen kwam het woord van de HEERE tot Jeremia en zei:", "13": "Zo zegt de HEERE van de heerscharen, de God van Israël: Ga heen en zeg tegen de mannen van Juda en tegen de inwoners van Jeruzalem: Zult u geen tucht aannemen, zodat u naar Mijn woorden luistert? spreekt de HEERE.", "14": "De woorden van Jonadab, de zoon van Rechab, die hij zijn kinderen geboden heeft, dat zij geen wijn zouden drinken, zijn bevestigd; want zij hebben niet gedronken tot op deze dag, maar het gebod van hun vader gehoord; en Ik heb tot u gesproken, vroeg opgestaan en gesproken, maar u hebt naar Mij niet geluisterd.", "15": "En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opgestaan en gezonden, om te zeggen: Bekeer u toch, ieder van zijn boze weg, en maak uw daden goed, en volg andere goden niet na om hen te dienen, dan zult u in het land blijven dat Ik u en uw vaderen gegeven heb; maar u hebt uw oor niet geneigd, en naar Mij niet geluisterd.", "16": "Omdat de kinderen van Jonadab, de zoon van Rechab, het gebod van hun vader, dat hij hun geboden heeft, bevestigd hebben, maar dit volk naar Mij niet luistert;", "17": "Daarom, zo zegt de HEERE, de God van de heerscharen, de God van Israël: Zie, Ik zal over Juda en over alle inwoners van Jeruzalem al het kwaad brengen dat Ik tegen hen gesproken heb; omdat Ik tot hen gesproken heb, maar zij niet geluisterd hebben, en Ik tot hen geroepen heb, maar zij niet geantwoord hebben.", "18": "Tot het huis van de Rechabieten nu zei Jeremia: Zo zegt de HEERE van de heerscharen, de God van Israël: Omdat u het gebod van uw vader Jonadab gehoorzaam bent geweest, en al zijn geboden bewaard hebt, en gedaan hebt naar alles wat hij u geboden heeft;", "19": "Daarom, zo zegt de HEERE van de heerscharen, de God van Israël: Er zal Jonadab, de zoon van Rechab, geen man worden afgesneden, die voor Mijn aangezicht staat, al de dagen."}, "SV": {"1": "Het woord, dat tot Jeremia geschied is van den HEERE, in de dagen van Jojakim, den zoon van Josia, den koning van Juda, zeggende:", "2": "Ga henen tot der Rechabieten huis, en spreek met hen, en breng hen in des HEEREN huis, in een der kameren, en geef hun wijn te drinken.", "3": "Toen nam ik Jaazanja, den zoon van Jeremia, den zoon van Habazzinja, mitsgaders zijn broederen, en al zijn zonen, en het ganse huis der Rechabieten;", "4": "En bracht hen in des HEEREN huis, in de kamer der zonen van Hanan, den zoon van Jigdalia, den man Gods; welke is bij de kamer der oversten, die daar is boven de kamer van Maaseja, den zoon van Sallum, den dorpelbewaarder.", "5": "En ik zette den kinderen van het huis der Rechabieten koppen vol wijn en bekers voor; en ik zeide tot hen: Drinkt wijn.", "6": "Maar zij zeiden: Wij zullen geen wijn drinken; want Jonadab, de zoon van Rechab, onze vader, heeft ons geboden, zeggende: Gijlieden zult geen wijn drinken, gij, noch uw kinderen, tot in eeuwigheid.", "7": "Ook zult gijlieden geen huis bouwen, noch zaad zaaien, noch wijngaard planten, noch hebben; maar gij zult in tenten wonen al uw dagen; opdat gij veel dagen leeft in het land, alwaar gij als vreemdeling verkeert.", "8": "Zo hebben wij der stemme van Jonadab, den zoon van Rechab, onzen vader, gehoorzaamd in alles, wat hij ons geboden heeft; zodat wij geen wijn drinken al onze dagen, wij, onze vrouwen, onze zonen, en onze dochteren;", "9": "En dat wij geen huizen bouwen tot onze woning; ook hebben wij geen wijngaard, noch veld, noch zaad;", "10": "En wij hebben in tenten gewoond; alzo hebben wij gehoord en gedaan naar alles, wat ons onze vader Jonadab geboden heeft.", "11": "Maar het is geschied, als Nebukadrezar, de koning van Babel, naar dit land optoog, dat wij zeiden: Komt, en laat ons naar Jeruzalem trekken vanwege het heir der Chaldeen, en vanwege het heir der Syriërs; alzo zijn wij te Jeruzalem gebleven.", "12": "Toen geschiedde des HEEREN woord tot Jeremia, zeggende:", "13": "Zo zegt de HEERE der heirscharen, de God Israëls: Ga henen en zeg tot de mannen van Juda en tot de inwoners van Jeruzalem: Zult gijlieden geen tucht aannemen, dat gij hoort naar Mijn woorden? spreekt de HEERE.", "14": "De woorden van Jonadab, den zoon van Rechab, die hij zijn kinderen geboden heeft, dat zij geen wijn zouden drinken, zijn bevestigd; want zij hebben geen gedronken tot op dezen dag, maar het gebod huns vaders gehoord; en Ik heb tot ulieden gesproken, vroeg op zijnde en sprekende, maar gij hebt naar Mij niet gehoord.", "15": "En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg op zijnde en zendende, om te zeggen: Bekeert u toch, een iegelijk van zijn bozen weg, en maakt uw handelingen goed, en wandelt andere goden niet na, om hen te dienen, zo zult gij in het land blijven, dat Ik u en uw vaderen gegeven heb; maar gij hebt uw oor niet geneigd, en naar Mij niet gehoord.", "16": "Dewijl *dan* de kinderen van Jonadab, den zoon van Rechab, het gebod huns vaders, dat hij hun geboden heeft, bevestigd hebben, maar dit volk naar Mij niet hoort;", "17": "Daarom alzo zegt de HEERE, de God der heirscharen, de God Israëls: Ziet, Ik zal over Juda en over alle inwoners van Jeruzalem brengen al het kwaad, dat Ik tegen hen gesproken heb; omdat Ik tot hen gesproken heb, maar zij niet gehoord hebben, en Ik tot hen geroepen heb, maar zij niet hebben geantwoord.", "18": "Tot het huis nu der Rechabieten zeide Jeremia: Zo zegt de HEERE der heirscharen, de God Israëls: Omdat gijlieden het gebod van uw vader Jonadab zijt gehoorzaam geweest, en hebt al zijn geboden bewaard, en gedaan naar alles, wat hij ulieden geboden heeft;", "19": "Daarom alzo zegt de HEERE der heirscharen, de God Israëls: Er zal Jonadab, den zoon van Rechab, niet worden afgesneden een man, die voor Mijn aangezicht sta, al de dagen."}, "KJV": {"1": "The word which came unto Jeremiah from the LORD in the days of Jehoiakim the son of Josiah king of Judah, saying,", "2": "Go unto the house of the Rechabites, and speak unto them, and bring them into the house of the LORD, into one of the chambers, and give them wine to drink.", "3": "Then I took Jaazaniah the son of Jeremiah, the son of Habaziniah, and his brethren, and all his sons, and the whole house of the Rechabites;", "4": "And I brought them into the house of the LORD, into the chamber of the sons of Hanan, the son of Igdaliah, a man of God, which *was* by the chamber of the princes, which *was* above the chamber of Maaseiah the son of Shallum, the keeper of the door:", "5": "And I set before the sons of the house of the Rechabites pots full of wine, and cups, and I said unto them, Drink ye wine.", "6": "But they said, We will drink no wine: for Jonadab the son of Rechab our father commanded us, saying, Ye shall drink no wine, *neither ye*, nor your sons for ever:", "7": "Neither shall ye build house, nor sow seed, nor plant vineyard, nor have *any*: but all your days ye shall dwell in tents; that ye may live many days in the land where ye *be* strangers.", "8": "Thus have we obeyed the voice of Jonadab the son of Rechab our father in all that he hath charged us, to drink no wine all our days, we, our wives, our sons, nor our daughters;", "9": "Nor to build houses for us to dwell in: neither have we vineyard, nor field, nor seed:", "10": "But we have dwelt in tents, and have obeyed, and done according to all that Jonadab our father commanded", "11": "But it came to pass, when Nebuchadrezzar king of Babylon came up into the land, that we said, Come, and let us go to Jerusalem for fear of the army of the Chaldeans, and for fear of the army of the Syrians: so we dwell at Jerusalem.", "12": "Then came the word of the LORD unto Jeremiah, saying,", "13": "Thus saith the LORD of hosts, the God of Israel; Go and tell the men of Judah and the inhabitants of Jerusalem, Will ye not receive instruction to hearken to my words? saith the LORD.", "14": "The words of Jonadab the son of Rechab, that he commanded his sons not to drink wine, are performed; for unto this day they drink none, but obey their father's commandment: notwithstanding I have spoken unto you, rising early and speaking; but ye hearkened", "15": "I have sent also unto you all my servants the prophets, rising up early and sending *them*, saying, Return ye now every man from his evil way, and amend your doings, and go not after other gods to serve them, and ye shall dwell in the land which I have given to you and to your fathers: but ye have not inclined your ear, nor hearkened", "16": "Because the sons of Jonadab the son of Rechab have performed the commandment of their father, which he commanded them; but this people hath not hearkened", "17": "Therefore thus saith the LORD God of hosts, the God of Israel; Behold, I will bring upon Judah and upon all the inhabitants of Jerusalem all the evil that I have pronounced against them: because I have spoken unto them, but they have not heard; and I have called unto them, but they have not answered.", "18": "And Jeremiah said unto the house of the Rechabites, Thus saith the LORD of hosts, the God of Israel; Because ye have obeyed the commandment of Jonadab your father, and kept all his precepts, and done according unto all that he hath commanded", "19": "Therefore thus saith the LORD of hosts, the God of Israel; Jonadab the son of Rechab shall not want a man to stand before me for ever."}}, "tsk": {"1": [{"kopje": "in de", "refs": ["Jer 1:3", "Jer 22:13-19", "Jer 25:1", "Jer 26:1", "Jer 36:1", "Jer 36:9", "Jer 36:29", n de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "Job 24:13": "Zij horen bij hen die zich verzetten tegen het licht; zij kennen Zijn wegen niet, en zij blijven niet op Zijn paden.", "Hebr 12:4": "U hebt nog niet tot bloedens toe tegenstand geboden, terwijl u streed tegen de zonde;", "Jer 34:12": "Daarom kwam het woord van de HEERE tot Jeremia, van de HEERE, en Hij zei:", "Matt 27:25": "En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Luk 4:1-13": "En Jezus, vol van de Heilige Geest, keerde terug van de Jordaan, en werd door de Geest geleid in de woestijn; En werd veertig dagen beproefd door de duivel; en at helemaal niets in die dagen, en toen ze voorbij waren, kreeg Hij ten laatste honger. En de duivel zei tegen Hem: Als U Gods Zoon bent, zeg tegen deze steen dat hij brood wordt.", "2 Kron 8:16": "Zo werd al het werk van Salomo klaargemaakt, tot de dag van de grondlegging van het huis van de HEERE, en tot het voltooien ervan, zodat het huis van de HEERE volmaakt werd.", "1 Petr 1:7": "opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Ps 58:4-6": "De goddelozen zijn vervreemd van de moederschoot af; de leugensprekers dolen van de moederbuik af. Zij hebben vurig gif, gelijk vurig slangengif; zij zijn als een dove adder, die zijn oren toestopt, opdat hij niet hoort naar de stem van de bezweerders, van hem die ervaren is in het uitvoeren van bezweringen.", "Jer 16:12": "En u erger gedaan hebt dan uw vaders; want zie, u wandelt, ieder naar het goeddunken van zijn slechte hart, om naar Mij niet te horen.", "Ps 119:165": "Die Uw wet beminnen, hebben grote vrede, en zij hebben geen aanstoot.", "Joz 14:6": "Toen naderden de kinderen van Juda tot Jozua, te Gilgal, en Kaleb, de zoon van Jefunne, de Keneziet, zei tegen hem: U weet het woord dat de HEERE tot Mozes, de man van God, gesproken heeft te Kades-Barnea, vanwege mij, en vanwege u.", "Jer 19:7-13": "Want Ik zal de raad van Juda en Jeruzalem in deze plaats verijdelen, en zal hen voor het aangezicht van hun vijanden doen vallen door het zwaard, en door de hand van hen die hun ziel zoeken; en Ik zal hun dode lichamen aan het gevogelte van de hemel en het gedierte van de aarde tot voedsel geven. En Ik zal deze stad zetten tot een ontzetting en tot een aanfluiting; ieder die haar voorbijgaat, zal zich ontzetten en fluiten over al haar plagen. En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Jer 7:13": "En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt;", "Lev 10:9": "Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties;", "Jer 22:4": "Want als u deze zaak ernstig zult doen, dan zullen door de poorten van dit huis koningen binnengaan, zittend op de troon van David, rijdend op wagens en op paarden, hij, en zijn dienaren, en zijn volk.", "Jer 35:2-10": "Ga naar het huis van de Rechabieten, en spreek met hen, en breng hen in het huis van de HEERE, in een van de kamers, en geef hun wijn te drinken. Toen nam ik Jaazanja, de zoon van Jeremia, de zoon van Habazzinja, alsook zijn broers, en al zijn zonen, en het hele huis van de Rechabieten; En bracht hen in het huis van de HEERE, in de kamer van de zonen van Hanan, de zoon van Jigdalia, de man Gods; die is bij de kamer van de leiders, die daar is boven de kamer van Maaseja, de zoon van Sallum, de dorpelbewaarder.", "Ps 32:9": "Wees niet als een paard, als een muilezel, dat geen verstand heeft, wiens muil men breidelt met toom en gebit, zodat het niet naar u toe komt.", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Jer 14:1-16": "Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte. Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Jer 8:4-22": "Zeg verder tegen hen: Zo zegt de HEERE: Zal men vallen, en niet weer opstaan? Zal men afkeren, en niet terugkeren? Waarom keert dit volk van Jeruzalem dan af, met een altijddurende afkering? Zij houden vast aan bedrog, zij weigeren terug te keren. Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd.", "Jer 7:26": "Toch hebben zij naar Mij niet gehoord, noch hun oor geneigd; maar zij hebben hun nek verhard, zij hebben het erger gemaakt dan hun vaders.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Jer 1:3": "Ook kwam het tot hem in de dagen van Jojakim, zoon van Josia, koning van Juda, totdat het elfde jaar van Zedekia, zoon van Josia, koning van Juda, voleindigd werd; totdat Jeruzalem gevankelijk werd weggevoerd in de vijfde maand.", "Jer 36:5": "En Jeremia gebood Baruch: Ik word tegengehouden, ik zal niet in het huis van de HEERE kunnen gaan.", "Jer 36:10-12": "Zo las Baruch in dat boek de woorden van Jeremia in het huis van de HEERE, in de kamer van Gemarja, de zoon van Safan, de schrijver, in het bovenste voorhof, bij de deur van de nieuwe poort van het huis van de HEERE, voor de oren van het hele volk. Toen Michaja, de zoon van Gemarja, de zoon van Safan, al de woorden van de HEERE uit dat boek gehoord had, ging hij naar het huis van de koning, naar de kamer van de schrijver; en zie, daar zaten al de vorsten: Elisama, de schrijver, en Delaja, de zoon van Semaja, en Elnathan, de zoon van Achbor, en Gemarja, de zoon van Safan, en Zedekia, de zoon van Hananja, en al de vorsten.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "2 Petr 2:18": "Want zij spreken zeer opgeblazen, holle woorden, en verleiden door de begeerten van het vlees en door losbandigheid hen die net ontkomen waren aan degenen die in dwaling wandelen;", "Jer 18:12": "Doch zij zeggen: Het is buiten hoop; maar wij zullen naar onze eigen gedachten wandelen, en wij zullen doen, ieder, wat zijn boze hart goeddunkt.", "Deut 7:25": "De gesneden beelden van hun goden zult u met vuur verbranden; het zilver en goud dat daaraan is, zult u niet begeren, en ook niet voor uzelf nemen, opdat u daardoor niet verstrikt wordt; want dat is voor de HEERE, uw God, een afschuwelijke gruwel.", "Ef 4:27": "En geef de duivel geen plaats.", "Neh 13:8": "En het mishaagde mij zeer; zo wierp ik al het huisraad van Tobia buiten, uit de kamer.", "2 Kron 36:14": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.", "Jer 26:5": "Door te horen naar de woorden van Mijn knechten, de profeten, die Ik tot u zend, ja, vroeg opstaand en zendend; maar u niet gehoord hebt;", "Ef 6:11": "Doe de hele wapenrusting van God aan, opdat u kunt staan tegen de listige omleidingen van de duivel.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Hos 14:2-5": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "2 Kor 2:11": "opdat de satan geen voordeel over ons krijgt; want zijn gedachten zijn ons niet onbekend.", "Jer 29:19": "Omdat zij naar Mijn woorden niet geluisterd hebben, spreekt de HEERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "Matt 26:31": "Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Luk 22:40": "En toen Hij op die plaats gekomen was, zei Hij tegen hen: Bid, dat u niet in verzoeking komt.", "Jes 28:12": "tot wie Hij gezegd heeft: Dit is de rust, geef de moede rust, en dit is de verkwikking; toch hebben zij niet willen horen.", "Spr 6:27": "Zal iemand vuur in zijn boezem nemen, zonder dat zijn kleren verbranden?", "2 Kron 36:5-8": "Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en hij deed wat slecht was in de ogen van de HEERE, zijn God. Nebukadnezar, de koning van Babel, trok tegen hem op, en bond hem met twee koperen ketenen, om hem naar Babel te voeren. Nebukadnezar bracht ook een deel van de voorwerpen van het huis van de HEERE naar Babel, en zette ze in zijn tempel te Babel.", "Luk 21:36": "Waak dan te allen tijde, en bid, dat u waardig geacht mag worden om al deze dingen die gebeuren zullen te ontvluchten, en te staan voor de Zoon des mensen.", "Jer 20:1": "Toen Pashur, de zoon van Immer, de priester (deze was aangesteld als voorganger in het huis van de HEERE), Jeremia hoorde deze woorden profeteren,", "1 Kon 20:28": "En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben.", "Jer 33:19": "En het woord van de HEERE kwam tot Jeremia, en Hij zei:", "2 Kon 5:14": "Toen daalde hij af, en doopte zich zeven keer onder in de Jordaan, naar het woord van de man van God; en zijn vlees kwam weer terug, zoals het vlees van een klein kind; en hij werd rein.", "2 Kon 12:9": "Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "1 Kon 6:6": "De onderste kamer was vijf ellen breed, en de middelste zes ellen breed, en de derde zeven ellen breed; want hij had aan het huis rondom aan de buitenkant inkortingen gemaakt, zodat de balken niet in de wanden van het huis bevestigd hoefden te worden.", "Rom 6:12-14": "Laat dan de zonde niet heersen in uw sterfelijk lichaam, om haar te gehoorzamen in de begeerten daarvan. En stel uw leden niet tot wapens van de ongerechtigheid ter beschikking aan de zonde; maar stel uzelf ter beschikking aan God, als mensen die uit de doden levend geworden zijn, en stel uw leden tot wapens van de gerechtigheid ter beschikking aan God. Want de zonde zal over u niet heersen; want u bent niet onder de wet, maar onder de genade.", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Job 33:14": "Maar God spreekt eens of tweemaal; doch men let daar niet op.", "Jer 30:4": "En dit zijn de woorden, die de HEERE gesproken heeft van Israël en van Juda.", "Lev 23:42": "Zeven dagen zult u in de loofhutten wonen; alle geboren Israëlieten zullen in loofhutten wonen;", "2 Kon 11:4": "In het zevende jaar zond Jojada, en nam de leiders van honderd met de hoofdmannen en met de lijfwacht, en hij bracht hen bij zich, in het huis van de HEERE; en hij sloot een verbond met hen en beëdigde hen in het huis van de HEERE, en hij toonde hun de zoon van de koning.", "Jes 5:11": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft!", "1 Kon 6:37": "In het vierde jaar werd de grond van het huis van de HEERE gelegd, in de maand Ziv;", "Ef 5:18": "En word niet dronken van wijn, waarin overdaad is, maar word vervuld met de Geest,", "Richt 13:13": "En de Engel van de HEERE zei tegen Manoach: Van alles wat Ik tegen de vrouw gezegd heb, moet zij zich weerhouden.", "Ef 6:1-3": "U kinderen, wees uw ouders gehoorzaam in de Heere; want dat is recht. Eer uw vader en moeder (dat is het eerste gebod met een belofte), opdat het u goed gaat, en u lang leeft op de aarde.", "Jes 66:4": "Ik zal ook hun loon kiezen naar hun handelingen, en hun angsten zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet luisterden, maar deden wat kwaad is in Mijn ogen, en kozen wat Ik niet wilde.", "Ef 6:13-17": "Daarom, neem de hele wapenrusting van God aan, opdat u kunt weerstaan in de boze dag, en na alles verricht te hebben, staande blijven. Sta dan, met uw lenden omgord met de waarheid, en aangedaan met het borstwapen van de gerechtigheid; en de voeten geschoeid met bereidheid van het Evangelie van de vrede;", "Luk 21:20": "Maar wanneer u zult zien dat Jeruzalem door legers omsingeld wordt, weet dan, dat haar verwoesting nabij gekomen is.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Jer 17:26": "En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Deut 8:17": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven.", "Jer 26:4": "Zeg dan tot hen: Zo zegt de HEERE: Als u naar Mij niet zult horen, om te wandelen in Mijn wet, die Ik voor uw aangezicht gegeven heb;", "Jer 46:1": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurd is tegen de heidenen.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Spr 13:13": "Die het woord veracht, die zal verdorven worden; maar wie het gebod vreest, hem zal het vergolden worden.", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "Jer 17:24": "Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet;", "Matt 12:45": "Dan gaat hij weg en neemt zeven andere geesten met zich mee, slechter dan hijzelf, en zij gaan naar binnen en wonen daar; en het laatste van die mens wordt erger dan het eerste. Zo zal het ook met dit slechte geslacht gaan.", "Ezech 42:4-13": "En voor de kamers was een wandelpad van tien el de breedte; naar binnen toe, en een weg van één el; en de deuren daarvan waren tegen het noorden. De bovenste kamers nu waren nauwer (omdat de galerijen meer wegnamen dan die), dan de onderste en dan de middelste van het gebouw. Want ze waren wel van drie rijen, maar hadden geen pilaren zoals de pilaren van de voorhoven; daarom waren ze smaller dan de onderste en dan de middelste, van de grond af.", "Ps 105:12": "Toen zij weinig mensen in getal waren, ja, weinig en vreemdelingen daarin;", "Matt 12:44": "Dan zegt hij: Ik zal teruggaan naar mijn huis, waar ik vandaan gekomen ben; en als hij komt, vindt hij het leeg, schoongeveegd en versierd.", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "Deut 31:21": "En het zal gebeuren, wanneer veel kwaad en benauwdheden hen zullen treffen, dan zal dit lied voor hun aangezicht antwoorden tot getuige; want het zal uit de mond van hun nageslacht niet vergeten worden; omdat Ik hun gedachten ken, die het nu al maakt, voordat Ik het breng in het land dat Ik gezworen heb.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Jak 1:2-4": "Acht het voor grote vreugde, mijn broeders, wanneer u in allerlei verzoekingen valt; Wetend dat de beproeving van uw geloof volharding werkt. Doch de volharding moet een volmaakt werk hebben, opdat u volmaakt bent en geheel oprecht, in geen ding gebrekkig.", "Matt 13:22": "En die in de doornen bezaaid is, dit is degene die het woord hoort; en de zorgen van deze wereld en de verleiding van de rijkdom verstikken het woord, en het wordt onvruchtbaar.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Spr 19:20": "Hoor raad, en neem tucht aan, opdat u in uw laatste jaren wijs bent.", "Richt 13:7": "Maar Hij zei tegen mij: Zie, u zult zwanger worden en een zoon baren; drink dus nu geen wijn of sterke drank, en eet niets van het onreine; want dat jongetje zal een Nazireeër van God zijn, vanaf de moederschoot tot de dag van zijn dood.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Jer 26:13": "Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft.", "Jer 44:4": "En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opstaand en zendend, om te zeggen: Doe toch deze gruwelijke zaak niet, die Ik haat.", "Jer 35:6-14": "Maar zij zeiden: Wij zullen geen wijn drinken; want Jonadab, de zoon van Rechab, onze vader, heeft ons geboden en gezegd: U zult geen wijn drinken, u, noch uw kinderen, tot in eeuwigheid. Ook zult u geen huis bouwen, geen zaad zaaien, geen wijngaard planten, noch hebben; maar u zult in tenten wonen al uw dagen, opdat u veel dagen leeft in het land waar u als vreemdeling verblijft. Zo hebben wij naar de stem van Jonadab, de zoon van Rechab, onze vader, geluisterd in alles wat hij ons geboden heeft; zodat wij geen wijn drinken al onze dagen, wij, onze vrouwen, onze zonen, en onze dochters;", "Luk 21:21": "Laten dan zij die in Judea zijn, vluchten naar de bergen; en zij die in het midden ervan zijn, daaruit trekken; en zij die op de velden zijn, daar niet in komen.", "Ezech 41:5-11": "En hij mat de wand van het huis, zes ellen; en de breedte van elke zijkamer, vier ellen, rondom het huis, rondom heen. De zijkamers nu waren zijkamer boven zijkamer, drie, en dat dertig maal, en zij kwamen in de wand die aan het huis was, tot die zijkamers rondom heen, zodat zij vastgehouden konden worden; want zij werden niet vastgehouden in de wand van het huis. En het was voor de zijkamers opwaarts naar boven al wijder, en liep rondom; want het huis was omsingeld opwaarts naar boven, rondom het huis heen; daarom was de breedte van het huis naar boven; en zo ging het onderste op naar het bovenste, door het middelste.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "1 Sam 1:24": "Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.", "Spr 6:28": "Zal iemand over kolen lopen, zonder dat zijn voeten verbranden?", "Luk 22:32": "maar Ik heb voor u gebeden, dat uw geloof niet ophoudt; en u, als u eens bekeerd bent, versterk dan uw broeders.", "Neh 13:9": "Vervolgens gaf ik bevel, en zij reinigden de kamers; en ik bracht daar de vaten van het huis van God weer in, met het spijsoffer en de wierook.", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Luk 22:46": "En Hij zei tegen hen: Waarom slaapt u? Sta op en bid, opdat u niet in verzoeking komt.", "1 Joh 4:4": "Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is.", "Ezech 20:13": "Maar het huis van Israël werd opstandig tegen Mij in de woestijn; zij wandelden niet in Mijn inzettingen, en verwierpen Mijn rechten, die, als een mens ze doet, hij daardoor zal leven; en zij ontheiligden Mijn sabbatten zeer, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten in de woestijn, om hen te verdelgen.", "Jer 28:5": "Toen zei de profeet Jeremia tegen de profeet Hananja, voor de ogen van de priesters en voor de ogen van het hele volk, dat in het huis van de HEERE stond;", "2 Petr 3:17": "U dan, geliefden, omdat u dit van tevoren weet, wees op uw hoede, dat u niet mede weggesleept wordt door de dwaling van de verdorven mensen, en afvalt van uw eigen standvastigheid;", "Luk 11:4": "En vergeef ons onze zonden; want ook wij vergeven ieder die ons schuldig is. En leid ons niet in verzoeking, maar verlos ons van de boze.", "Spr 7:7-23": "En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling; Die voorbijging op de straat, naast haar hoek, en hij trad op de weg naar haar huis. In de schemering, in de avond van de dag, in de zwarte nacht en de donkerheid;", "Jer 3:14": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.", "Spr 1:20-33": "De opperste Wijsheid roept overluid daarbuiten; Zij verheft Haar stem op de straten. Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad; U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Hos 11:7": "Want Mijn volk blijft hangen aan de afkering van Mij; zij roepen het wel tot de Allerhoogste, maar niet één verhoogt Hem.", "Jer 26:4-6": "Zeg dan tot hen: Zo zegt de HEERE: Als u naar Mij niet zult horen, om te wandelen in Mijn wet, die Ik voor uw aangezicht gegeven heb; Door te horen naar de woorden van Mijn knechten, de profeten, die Ik tot u zend, ja, vroeg opstaand en zendend; maar u niet gehoord hebt; Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek voor alle volken van de aarde.", "Gen 36:7": "Want hun bezit was te veel om samen te wonen; en het land van hun vreemdelingschap kon hen niet dragen vanwege hun vee.", "2 Kor 11:3": "Doch ik vrees dat, zoals de slang Eva door haar arglistigheid bedrogen heeft, zo ook uw gedachten op enigerlei wijze bedorven worden, om af te wijken van de eenvoudigheid die in Christus is.", "Jer 26:7": "En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.", "1 Kon 13:1": "En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken.", "Jer 49:34": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurde tegen Elam, in het begin van het koninkrijk van Zedekia, de koning van Juda, en zei:", "Jer 25:6": "En loop andere goden niet achterna, om die te dienen, en u voor die neer te buigen; en verwek Mijn toorn niet door het werk van uw handen, opdat Ik u geen kwaad doe.", "1 Sam 1:7": "En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet.", "2 Kon 25:9": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Ezech 3:19": "Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd.", "Jer 44:10": "Zij zijn tot op deze dag nog niet verbrijzeld van hart, en zij hebben niet gevreesd, noch gewandeld in Mijn wet en in Mijn inzettingen, die Ik voor uw aangezicht en voor het aangezicht van uw vaderen gegeven heb.", "Jer 21:4-10": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Ezech 43:8": "Als zij hun drempel stelden aan Mijn drempel, en hun post naast Mijn post, zodat er maar een wand tussen Mij en tussen hen was, en verontreinigden Mijn heilige Naam met hun gruwelen die zij deden; daarom heb Ik ze verteerd in Mijn toorn.", "1 Kon 6:5": "En rondom aan de wand van het huis bouwde hij kamers, aan de wanden van het huis rondom, zowel van de tempel als van het binnenste heiligdom¹. Zo maakte hij zijkamers rondom.", "Mal 2:17": "U vermoeit de HEERE met uw woorden; nog zegt u: Waarmee vermoeien wij Hem? Daarmee, dat u zegt: Ieder die kwaad doet, is goed in de ogen van de HEERE, en Hij heeft behagen in zulke mensen; of: waar is de God van het oordeel?", "Luk 13:5": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Dan 1:2": "En de Heere gaf Jojakim, de koning van Juda, in zijn hand, alsook een deel van de voorwerpen van het huis van God; en hij bracht ze naar het land Sinear, naar het huis van zijn god; en de voorwerpen bracht hij naar het schathuis van zijn god.", "Ezech 33:5": "Hij hoorde het geluid van de bazuin, maar liet zich niet waarschuwen, zijn bloed is op hem; maar wie zich laat waarschuwen, behoudt zijn leven.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "2 Kon 1:11-13": "En hij zond weer naar hem een andere leider over vijftig met zijn vijftigtal. Deze antwoordde en sprak tot hem: Man van God! Zo zegt de koning: Kom snel naar beneden. En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal. En weer zond hij een leider over het derde vijftigtal met zijn vijftigtal. Zo ging de derde leider over vijftig omhoog, en kwam en boog zich op zijn knieën voor Elia, en smeekte hem, en sprak tot hem: Man van God, laat toch mijn leven en het leven van deze vijftig van uw knechten kostbaar zijn in uw ogen!", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Mark 4:15": "En dezen zijn zij die langs de weg bezaaid worden, waarin het Woord gezaaid wordt; en wanneer zij het gehoord hebben, komt de satan meteen, en neemt het Woord weg, dat in hun hart gezaaid was.", "1 Kron 22:14": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.", "1 Sam 9:6-8": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen. Toen zei Saul tegen zijn knecht: Maar zie, als wij gaan, wat zullen we die man dan brengen? Want het brood is op uit onze zakken, en wij hebben geen geschenk om de man van God te brengen; wat hebben wij? En de knecht antwoordde Saul verder en zei: Zie, ik heb bij me het vierde deel van een zilveren sikkel; dat zal ik de man van God geven, opdat hij ons onze weg wijst.", "Luk 13:34": "Jeruzalem, Jeruzalem! U die de profeten doodt en stenigt hen die naar u toe gezonden zijn, hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens onder haar vleugels verzamelt; en u hebt niet gewild?", "Matt 4:1-11": "Toen werd Jezus door de Geest weggeleid naar de woestijn, om beproefd te worden door de duivel. En toen Hij veertig dagen en veertig nachten gevast had, kreeg Hij ten laatste honger. En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "Jer 44:5": "Maar zij hebben niet gehoord, noch hun oor geneigd, om zich van hun slechtheid te bekeren, zodat zij aan andere goden geen wierook meer zouden branden.", "Spr 1:24-31": "Omdat Ik geroepen heb, en u geweigerd hebt; Mijn hand uitgestrekt heb, en er niemand was die opmerkte; En u al Mijn raad verworpen hebt, en Mijn bestraffing niet gewild hebt; Zo zal Ik ook in uw verderf lachen; Ik zal spotten, wanneer uw vrees komt.", "2 Kon 23:2": "En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Jes 65:15": "En u zult uw naam voor Mijn uitverkorenen tot een vervloeking laten; en de Heere HEERE zal u doden, maar Zijn knechten zal Hij met een andere naam noemen;", "Richt 13:4": "Wacht u toch nu, en drink geen wijn of sterke drank, en eet niets van het onreine.", "Jer 36:9": "Want het gebeurde in het vijfde jaar van Jojakim, de zoon van Josia, de koning van Juda, in de negende maand, dat zij een vasten voor het aangezicht van de HEERE uitriepen, voor het hele volk in Jeruzalem, alsook voor het hele volk dat uit de steden van Juda naar Jeruzalem kwam.", "1 Kor 8:9-13": "Maar kijk uit, dat deze macht van u niet op de een of andere manier een aanstoot wordt voor hen die zwak zijn. Want als iemand u, die de kennis hebt, ziet aanzitten in de tempel van de afgod, zal het geweten van hem, die zwak is, dan niet gesterkt worden om te eten de dingen die aan de afgoden geofferd zijn? En zal de broeder, die zwak is, door uw kennis verloren gaan, om wie Christus gestorven is?", "1 Kron 9:18": "Ook tot nu toe, aan de poort van de koning oostwaarts, waren dezen de poortwachters onder de legers van de kinderen van Levi.", "Rom 14:21": "Het is goed geen vlees te eten, en geen wijn te drinken, en niets waaraan uw broeder zich stoot, of geërgerd wordt, of waarin hij zwak is.", "Jer 35:12-17": "Toen kwam het woord van de HEERE tot Jeremia en zei: Zo zegt de HEERE van de heerscharen, de God van Israël: Ga heen en zeg tegen de mannen van Juda en tegen de inwoners van Jeruzalem: Zult u geen tucht aannemen, zodat u naar Mijn woorden luistert? spreekt de HEERE. De woorden van Jonadab, de zoon van Rechab, die hij zijn kinderen geboden heeft, dat zij geen wijn zouden drinken, zijn bevestigd; want zij hebben niet gedronken tot op deze dag, maar het gebod van hun vader gehoord; en Ik heb tot u gesproken, vroeg opgestaan en gesproken, maar u hebt naar Mij niet geluisterd.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Rom 12:21": "Word niet door het kwade overwonnen, maar overwin het kwade door het goede.", "Gal 4:14": "en mijn beproeving¹, die in mijn vlees gebeurde, hebt u niet veracht, en ook niet verafschuwd; maar u nam mij aan als een engel van God, ja, als Christus Jezus.", "Jer 7:13-34": "En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt; daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb. En Ik zal u van Mijn aangezicht wegwerpen, zoals Ik al uw broeders, het hele nageslacht van Efraïm, weggeworpen heb.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Openb 12:10": "En ik hoorde een grote stem, die zei in de hemel: Nu is de zaligheid, en de kracht, en het koninkrijk van onze God gekomen; en de macht van Zijn Christus; want de aanklager van onze broeders, die hen aanklaagde voor onze God dag en nacht, is neergeworpen.", "Joz 6:24": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "Matt 13:15": "Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Hos 5:4": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet.", "1 Kor 10:28-32": "Maar als iemand tegen u zegt: Dit is afgodenoffer; eet het dan niet, omwille van hem die het u heeft laten weten, en omwille van het geweten. Want de aarde is van de Heere, en al wat zij bevat. Ik bedoel niet uw eigen geweten, maar dat van de ander; want waarom zou mijn vrijheid beoordeeld worden door het geweten van een ander? En als ik door genade deel heb aan het voedsel, waarom word ik dan belasterd over iets waarvoor ik dank?", "1 Kron 26:12": "Uit dezen waren de verdelingen van de poortwachters onder de hoofden van de mannen, met wachtdiensten tegenover hun broers, om te dienen in het huis van de HEERE.", "Hos 11:2": "Maar net zoals zij hen riepen, zo gingen zij van hun aangezicht weg; zij offerden aan de Baäls, en brandden reukwerk voor de gesneden beelden.", "Lev 26:14-46": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen; En als u Mijn inzettingen smadelijk verwerpt, en als uw ziel van Mijn rechten walgt, zodat u niet al Mijn geboden doet, om Mijn verbond te vernietigen; Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten.", "Ps 81:13": "Daarom heb Ik hen overgegeven aan het goeddunken van hun hart, zodat zij wandelden in hun eigen raadslagen.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Luk 13:1-3": "En er waren in diezelfde tijd enigen aanwezig, die Hem vertelden van de Galileeërs, van wie Pilatus het bloed met hun offers gemengd had. En Jezus antwoordde en zei tegen hen: Denkt u dat deze Galileeërs meer zondaars zijn geweest dan alle andere Galileeërs, omdat zij zulke dingen hebben geleden? Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Ps 78:8": "En dat zij niet zouden worden zoals hun vaders, een opstandig en weerspannig geslacht; een geslacht dat zijn hart niet richtte, en waarvan de geest niet trouw was met God.", "Rom 14:13": "Laten wij elkaar dan niet meer oordelen; maar oordeelt dit liever, namelijk dat u de broeder geen aanstoot of ergernis geeft.", "Deut 29:19-21": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "1 Kon 17:24": "Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.", "Hebr 12:3": "Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Rom 7:5": "Want toen wij in het vlees waren, werkten de hartstochten van de zonden, die door de wet geprikkeld worden, in onze leden, om vruchten te dragen voor de dood.", "Matt 5:19": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen.", "Zach 7:4-14": "Toen kwam het woord van de HEERE van de heerscharen tot mij: Spreek tot heel het volk van dit land, en tot de priesters: Toen u vastte en rouwklaagde, in de vijfde en in de zevende maand, namelijk nu zeventig jaren, hebt u dan voor Mij, voor Mij, werkelijk gevast? Of als u at, en als u dronk, was dat niet voor uzelf, u die daar at, en u die daar dronk?", "Jer 13:27": "Uw overspelen en uw hunkeringen, de schandelijkheid van uw hoererij, op heuvels, in het veld; Ik heb uw gruwelen gezien; wee u, Jeruzalem! Zult u niet rein worden? Hoe lang nog hierna?", "1 Petr 1:6": "Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,", "Hand 7:51": "U hardnekkigen en onbesnedenen van hart en oren, u weerstaat altijd de Heilige Geest; zoals uw vaders deden, zo doet u ook.", "Jes 1:16-19": "Was u, reinig u, doe de boosheid van uw handelingen van voor Mijn ogen weg, houd op met kwaad te doen. Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe. Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Jes 37:14": "Toen Hizkia de brieven uit de hand van de boden ontvangen had, en die gelezen had, ging hij naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.", "Luk 10:13": "Wee u, Chorazin, wee u, Bethsaïda, want als in Tyrus en Sidon de krachten waren gebeurd die in u gebeurd zijn, zouden zij zich allang, in zak en as zittend, bekeerd hebben.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "2 Kron 31:11": "Toen zei Hizkia dat men kamers aan het huis van de HEERE gereed zou maken; en zij maakten ze gereed.", "Jer 17:25": "Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid.", "1 Joh 2:26": "Dit heb ik u geschreven over hen, die u verleiden.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "2 Kon 23:11": "En hij schafte de paarden af, die de koningen van Juda voor de zon gesteld hadden, bij de ingang van het huis van de HEERE, tot de kamer van Nathan-melech, de hoveling, die in Parvarim was; en de wagens van de zon verbrandde hij met vuur.", "Mark 13:14": "Wanneer u dan de gruwel van de verwoesting zult zien, waarvan door de profeet Daniël gesproken is, staande waar het niet behoort (wie dit leest, laat hij daarop letten!), laten dan zij die in Judea zijn, vluchten naar de bergen.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "Jes 28:7": "Maar ook dezen dwalen door de wijn, en zij dolen door de sterke drank; de priester en de profeet dwalen door de sterke drank; zij zijn verslonden door de wijn, zij dolen door sterke drank; zij dwalen in het zien van visioenen; zij waggelen in het rechtspreken.", "Spr 5:6-21": "Opdat u het pad van het leven niet zoudt overwegen, zijn haar gangen onvast, zodat u het niet merkt. Nu dan, kinderen! Hoor naar mij, en wijk niet van de woorden van mijn mond. Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "Deut 33:1": "Dit nu is de zegen, waarmee Mozes, de man Gods, de kinderen Israëls gezegend heeft, voor zijn dood.", "Jer 7:3-5": "Zo zegt de HEERE van de heerscharen, de God van Israël: Maak uw wegen en uw handelingen goed, dan zal Ik u laten wonen in deze plaats. Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze! Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Jer 22:21": "Ik sprak u aan in uw grote voorspoed, maar u zei: Ik zal niet horen. Dit is uw weg vanaf uw jeugd, dat u naar Mijn stem niet hebt geluisterd.", "Hos 4:11": "Hoererij, en wijn, en jonge wijn neemt het hart weg.", "2 Kor 11:15": "Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "Spr 21:17": "Wie blijdschap liefheeft, die zal gebrek lijden; wie wijn en olie liefheeft, zal niet rijk worden.", "1 Tess 4:8": "Wie dan dit verwerpt, verwerpt geen mens, maar God, Die ook Zijn Heilige Geest in ons heeft gegeven.", "Matt 24:48-51": "Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg, en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Ezech 38:17": "Zo zegt de Heere HEERE: Bent u die, over wie Ik in vroegere dagen gesproken heb, door de dienst van Mijn knechten, de profeten van Israël, die in die dagen geprofeteerd hebben, jarenlang, dat Ik u tegen hen zou aanbrengen?", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "2 Kor 11:14": "En het is geen wonder, want de satan zelf verandert zich in een engel van het licht.", "Jer 15:3": "Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.", "Jer 12:11": "Men heeft het gesteld tot een woestenij, verwoest zijnde treurt het tot Mij; het hele land is verwoest, omdat er niemand is die het ter harte neemt.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Luk 22:3": "En de satan voer in Judas, die bijgenaamd was Iskariot, die uit het getal van de twaalf was.", "Ps 7:14": "En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Jer 15:7": "En Ik zal hen wannen met een wan, in de poorten van het land; Ik heb Mijn volk van kinderen beroofd en te gronde gericht; zij zijn van hun wegen niet teruggekeerd.", "Jer 8:14": "Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Hos 7:15": "Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.", "1 Kon 8:63": "En Salomo offerde als dankoffer, dat hij de HEERE offerde, tweeëntwintigduizend runderen, en honderdtwintigduizend schapen. Zo hebben zij het huis van de HEERE ingewijd, de koning en al de kinderen van Israël.", "2 Kon 23:16": "En toen Josia zich omkeerde, zag hij de graven die daar op de berg waren, en hij zond boden, en nam de beenderen uit de graven, en verbrandde ze op dat altaar, en verontreinigde dat; naar het woord van de HEERE, dat de man van God had uitgeroepen, die deze woorden uitriep.", "Joz 23:15": "En het zal gebeuren, zoals al die goede dingen over u gekomen zijn, die de HEERE, uw God, tot u gesproken heeft, zo zal de HEERE over u laten komen al die kwade dingen, totdat Hij u verdelgt van dit goede land, dat de HEERE, uw God, u gegeven heeft.", "2 Kron 29:5": "En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom.", "Jer 37:6": "Toen kwam het woord van de HEERE tot de profeet Jeremia, en Hij zei:", "Ps 10:3": "Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE.", "2 Kon 10:16": "En hij zei: Ga met mij, en zie mijn ijver aan voor de HEERE. Zo lieten zij hem rijden op zijn wagen.", "Ezech 33:4": "En iemand het geluid van de bazuin hoort, wel hoort, maar zich niet laat waarschuwen, en het zwaard komt en neemt hem weg, dan is zijn bloed op zijn eigen hoofd.", "Jer 19:15": "Zo zegt de HEERE van de heerscharen, de God van Israël: Ziet, Ik zal over deze stad, en over al haar steden, al het kwaad brengen, dat Ik over haar gesproken heb; omdat zij hun nek verhard hebben, om Mijn woorden niet te horen.", "Jer 20:2": "sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.", "Jes 42:22-25": "Maar nu is het een beroofd en geplunderd volk; zij zijn allen verstrikt in de holen, en verstopt in de gevangenissen; zij zijn tot een roof geworden, en er is niemand die ze redt; tot een plundering, en niemand zegt: Geef ze terug. Wie onder u neemt dit ter harte? Wie merkt op en hoort, wat hierna zijn zal? Wie heeft Jakob tot een plundering overgegeven, en Israël aan de rovers? Is het niet de HEERE, Hij, tegen Wie wij gezondigd hebben? Want zij wilden niet wandelen in Zijn wegen, en zij luisterden niet naar Zijn wet.", "1 Kron 2:55": "En de huisgezinnen van de schrijvers, die te Jabes woonden, de Tirathieten, de Simeathieten, de Suchathieten; dezen zijn de Kenieten, die gekomen zijn van Hammath, de vader van het huis van Rechab.", "Matt 23:38": "Zie, uw huis wordt aan u woest gelaten.", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Jer 28:1": "Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:", "Spr 13:14": "De leer van de wijze is een springader van het leven, om af te wijken van de strikken van de dood.", "Jer 17:23": "Maar zij hebben niet gehoord, en hun oor niet geneigd; maar zij hebben hun nek verhard, om niet te horen, en om de tucht niet aan te nemen.", "Mark 13:21": "En dan, als iemand tegen u zal zeggen: Zie, hier is de Christus; of: Zie, Hij is daar; geloof het niet.", "Lev 26:21-24": "En als u tegen Mij in blijft ingaan, en Mij niet wilt horen, zal Ik over u, naar uw zonden, zevenvoudig slagen toedoen. Want Ik zal onder u zenden het gedierte van het veld, dat u van uw kinderen zal beroven, en uw vee zal uitroeien, en u zal verminderen; en uw wegen zullen woest worden. Als u door deze dingen nog niet getuchtigd bent, maar tegen Mij in blijft ingaan;", "1 Tess 3:5": "Daarom heb ik ook, omdat ik het verlangen niet langer kon verdragen, hem gezonden om uw geloof te leren kennen; of de verzoeker u misschien niet had verzocht, en onze arbeid tevergeefs zou zijn.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Ezech 33:9": "Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "Jer 35:6-8": "Maar zij zeiden: Wij zullen geen wijn drinken; want Jonadab, de zoon van Rechab, onze vader, heeft ons geboden en gezegd: U zult geen wijn drinken, u, noch uw kinderen, tot in eeuwigheid. Ook zult u geen huis bouwen, geen zaad zaaien, geen wijngaard planten, noch hebben; maar u zult in tenten wonen al uw dagen, opdat u veel dagen leeft in het land waar u als vreemdeling verblijft. Zo hebben wij naar de stem van Jonadab, de zoon van Rechab, onze vader, geluisterd in alles wat hij ons geboden heeft; zodat wij geen wijn drinken al onze dagen, wij, onze vrouwen, onze zonen, en onze dochters;", "Pred 8:11": "Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.", "Dan 1:1": "In het derde jaar van het koningschap van Jojakim, de koning van Juda, kwam Nebukadnezar, de koning van Babel, naar Jeruzalem, en belegerde het.", "2 Kon 10:15": "En van daar weggegaan zijnde, vond hij Jonadab, de zoon van Rechab, hem tegemoet; die hem groette; en hij zei tot hem: Is uw hart oprecht, zoals mijn hart met uw hart is? En Jonadab zei: Het is zo, ja, het is zo; geef mij uw hand. En hij gaf zijn hand, en hij liet hem bij zich op de wagen klimmen.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Jer 35:6-10": "Maar zij zeiden: Wij zullen geen wijn drinken; want Jonadab, de zoon van Rechab, onze vader, heeft ons geboden en gezegd: U zult geen wijn drinken, u, noch uw kinderen, tot in eeuwigheid. Ook zult u geen huis bouwen, geen zaad zaaien, geen wijngaard planten, noch hebben; maar u zult in tenten wonen al uw dagen, opdat u veel dagen leeft in het land waar u als vreemdeling verblijft. Zo hebben wij naar de stem van Jonadab, de zoon van Rechab, onze vader, geluisterd in alles wat hij ons geboden heeft; zodat wij geen wijn drinken al onze dagen, wij, onze vrouwen, onze zonen, en onze dochters;", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Spr 20:1": "De wijn is een spotter, de sterke drank is woelachtig; al wie daarin dwaalt, zal niet wijs zijn.", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Num 6:3": "Van wijn en sterke drank zal hij zich afzonderen; wijnazijn en azijn van sterke drank zal hij niet drinken, ook geen vocht van druiven zal hij drinken, en geen verse of gedroogde druiven eten.", "Ex 23:19": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.", "Jak 1:12-16": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben. Niemand moet, als hij verzocht wordt, zeggen: Ik word door God verzocht; want God kan niet verzocht worden met het kwade, en Hij Zelf verzoekt niemand. Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "Jer 18:11": "Nu dan, spreek nu tot de mannen van Juda en tot de inwoners van Jeruzalem, en zeg: Zo zegt de HEERE: Zie, Ik formeer een kwaad tegen u, en denk tegen u een gedachte; bekeer u dan nu, ieder van zijn boze weg, en maak uw wegen en uw daden goed.", "Ezra 8:29": "Waak en bewaar het, totdat u het opweegt, in tegenwoordigheid van de leiders van de priesters en Levieten, en van de vorsten van de vaderen van Israël, te Jeruzalem, in de kamers van het huis van de HEERE.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Deut 13:3": "dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Jer 36:29": "En tegen Jojakim, de koning van Juda, zult u zeggen: Zo zegt de HEERE: U hebt deze rol verbrand, en gezegd: Waarom hebt u daarop geschreven: De koning van Babel zal zeker komen, en dit land verderven, en maken dat mens en dier daarin ophouden te bestaan?", "Jer 30:1": "Het woord dat tot Jeremia gekomen is van de HEERE; Hij zei:", "Ex 34:26": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.", "Jer 43:8": "Toen kwam het woord van de HEERE tot Jeremia te Tachpanhes, en Hij zei:", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Neh 13:5": "En hij had hem een grote kamer gemaakt, waar zij tevoren het spijsoffer, de wierook en de vaten heenleidden, en de tienden van koren, van most en van olie, die bevolen waren voor de Levieten, en de zangers, en de poortwachters, alsook het hefoffer van de priesters.", "Spr 23:32": "Aan zijn einde zal hij bijten als een slang, en steken als een adder.", "Luk 13:35": "Zie, uw huis wordt aan u woest achtergelaten. En voorwaar, Ik zeg u, dat u Mij niet zult zien, totdat de tijd zal zijn gekomen dat u zult zeggen: Gezegend is Hij Die komt in de Naam van de Heere!", "2 Kon 8:2-8": "En de vrouw had zich klaargemaakt en had gedaan naar het woord van de man Gods; zij was met haar huisgezin weggegaan, en had als vreemdeling gewoond in het land van de Filistijnen, zeven jaar lang. En het gebeurde na het einde van de zeven jaar, dat de vrouw uit het land van de Filistijnen terugkeerde; en zij ging naar de koning om te smeken voor haar huis en voor haar akker. De koning nu sprak met Gehazi, de knecht van de man Gods, en zei: Vertel mij toch al de grote dingen die Elisa gedaan heeft.", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "2 Kon 5:20": "Gehazi nu, de knecht van Elisa, de man van God, zei: Zie, mijn heer heeft Naäman, deze Syriër, ontzien, doordat hij niet uit zijn hand heeft aangenomen wat hij gebracht had; maar zo waarachtig als de HEERE leeft, ik zal hem achterna lopen, en zal iets van hem aannemen!", "1 Tim 5:15": "Want sommigen hebben zich al afgewend, achter de satan aan.", "2 Kon 24:2": "En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten.", "Spr 19:27": "Laat af, mijn zoon, om, terwijl u de tucht hoort, af te dwalen van de woorden van de kennis.", "Jer 3:7-10": "En Ik zei, nadat zij dit alles gedaan had: Bekeer u tot Mij; maar zij bekeerde zich niet. Dit zag haar trouweloze zuster Juda. En Ik zag, toen Ik vanwege alles waarin het afgekeerde Israël overspel had gepleegd, haar had weggestuurd en haar een scheidbrief had gegeven, dat de trouweloze Juda, haar zuster, niet vreesde, maar wegging en zelf ook hoereerde. Ja, het gebeurde, vanwege het gerucht van haar hoererij, dat zij het land ontheiligde; want zij bedreef overspel met steen en met hout.", "Jer 7:5-7": "Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste; de vreemdeling, de wees en de weduwe niet zult verdrukken, en geen onschuldig bloed in deze plaats zult vergieten, en andere goden niet zult nawandelen, u zelf tot kwaad; dan zal Ik u in deze plaats, in het land dat Ik uw vaderen gegeven heb, laten wonen van eeuw tot eeuw.", "Jer 25:5": "En Hij zei: Bekeer u toch, ieder van zijn boze weg, en van de boosheid van uw daden, en woon in het land, dat de HEERE u en uw vaderen gegeven heeft, van eeuw tot in eeuw;", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Jes 30:9": "Want het is een opstandig volk; het zijn leugenachtige kinderen; kinderen die de wet van de HEERE niet willen horen.", "Jer 4:5-7": "Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden! Werp de banier op naar Sion, vlucht met spoed, blijf niet staan! Want Ik breng een kwaad aan van het noorden, en een grote ondergang. De leeuw is opgekomen uit zijn schuilplaats, en de verwoester van de heidenvolken is opgetrokken, hij is uitgegaan uit zijn plaats, om uw land te maken tot een woestenij; uw steden zullen verwoest worden, zodat er niemand in woont.", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Ps 95:8": "Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn;", "1 Kron 9:19": "En Sallum, de zoon van Kore, de zoon van Ebjasaf, de zoon van Korah, en zijn broeders van het huis van zijn vader, de Korahieten, waren over het werk van de dienst, wachters van de dorpels van de tabernakel; zoals hun vaders in het leger van de HEERE geweest waren bewaarders van de ingang;", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "Richt 13:14": "Zij mag niets eten van wat van de wijnstok voortkomt; en wijn en sterke drank mag zij niet drinken, en ook niets van het onreine eten; alles wat Ik haar geboden heb, moet zij houden.", "Luk 8:14": "En wat tussen de dorens valt, dat zijn zij die gehoord hebben, en gaandeweg verstikt worden door de zorgen en rijkdom en genietingen van het leven, en geen rijpe vrucht voortbrengen.", "Est 1:8": "En het drinken gebeurde volgens de regel, dat niemand dwong; want zo had de koning het vast bevolen aan alle leiders van zijn huis, dat zij zouden doen naar de wil van ieder.", "Joh 16:1": "Deze dingen heb Ik tot u gesproken, opdat u niet geërgerd wordt.", "Spr 4:14": "Kom niet op het pad van de goddelozen, en betreed niet de weg van de bozen.", "2 Kon 1:9": "En hij zond naar hem een leider over vijftig met zijn vijftigtal. En toen hij naar hem opklom (want zie, hij zat op de top van een berg), sprak hij tot hem: Man van God! De koning zegt: Kom naar beneden.", "Ef 6:2": "Eer uw vader en moeder (dat is het eerste gebod met een belofte),", "Hebr 3:8": "Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "Spr 12:26": "De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.", "Openb 12:17": "En de draak werd toornig op de vrouw, en ging heen om oorlog te voeren tegen de overigen van haar nageslacht, die de geboden van God bewaren, en de getuigenis van Jezus Christus hebben.", "1 Sam 15:23": "Want weerspannigheid is een zonde als toverij, en weerstreven is afgoderij en beeldendienst. Omdat u het woord van de HEERE verworpen hebt, zo heeft Hij u verworpen, dat u geen koning meer zult zijn.", "1 Kron 9:26": "Want in dat ambt waren vier leidende poortwachters, die Levieten waren; en zij waren over de kamers en over de schatten van het huis van God.", "Spr 16:29": "Een man van geweld verlokt zijn naaste, en hij leidt hem op een weg die niet goed is.", "2 Kor 2:9": "Want daarom heb ik ook geschreven, opdat ik uw betrouwbaarheid zou leren kennen, of u in alles gehoorzaam bent.", "Jes 42:23": "Wie onder u neemt dit ter harte? Wie merkt op en hoort, wat hierna zijn zal?", "Jer 32:6": "Jeremia dan zei: Het woord van de HEERE is tot mij gekomen, en het zei:", "2 Kon 23:7": "Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.", "Jer 1:4": "Het woord van de HEERE dan kwam tot mij, en zei:", "1 Kor 7:5": "Onttrek u niet aan elkaar, tenzij met wederzijdse instemming voor een tijd, opdat u zich aan vasten en bidden kunt wijden; en kom weer bijeen, opdat de satan u niet verzoekt, omdat u zich niet kunt onthouden.", "Gen 6:17": "Want Ik, zie, Ik breng een watervloed over de aarde, om alle vlees waarin een geest van het leven is, van onder de hemel te verderven; alles wat op de aarde is, zal de geest geven.", "2 Kron 32:30": "Deze Jehizkia dichtte ook de bovenste waterloop van Gihon, en leidde die recht naar beneden naar het westen van de stad van David; want Jehizkia had voorspoed in al zijn werk.", "Mark 3:5": "En nadat Hij hen met toorn had aangekeken, bedroefd over de verharding van hun hart, zei Hij tegen de man: Strek uw hand uit. En hij strekte hem uit; en zijn hand werd hersteld, gezond als de andere.", "Jer 46:2": "Tegen Egypte; tegen het leger van Farao Necho, koning van Egypte, dat aan de rivier Frath, bij Karchemis was, dat Nebukadrezar, de koning van Babel, sloeg, in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda.", "Spr 2:16": "Om u te redden van de vreemde vrouw, van de onbekende, die met haar woorden vleit;", "Spr 14:27": "De vreze van de HEERE is een bron van leven, om af te wijken van de strikken van de dood.", "Num 6:2-5": "Spreek tot de kinderen van Israël, en zeg tot hen: Wanneer een man of een vrouw zich afgescheiden zal hebben, door de gelofte van een Nazireeër te beloven, om zich voor de HEERE af te zonderen; Van wijn en sterke drank zal hij zich afzonderen; wijnazijn en azijn van sterke drank zal hij niet drinken, ook geen vocht van druiven zal hij drinken, en geen verse of gedroogde druiven eten. Al de dagen van zijn Nazireeërschap zal hij niets eten van wat van de wijnstok van de wijn gemaakt is, van de kernen af tot de basten toe.", "Lev 23:26-29": "Verder sprak de HEERE tot Mozes en zei: Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren. En op diezelfde dag zult u geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht van de HEERE, uw God.", "Job 9:2": "Waarlijk, ik weet dat het zo is; want hoe zou de mens rechtvaardig zijn bij God?", "Jes 5:22": "Wee hun die helden zijn om wijn te drinken, en die dappere mannen zijn om sterke drank te mengen!", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Ezech 40:16": "En er waren smalle vensters bij de kamertjes en bij hun posten, naar binnen toe, in de poort, rondom; en zo ook bij de voorhuizen; de vensters waren rondom naar binnen toe, en bij de posten waren palmbomen.", "Jer 35:7-9": "Ook zult u geen huis bouwen, geen zaad zaaien, geen wijngaard planten, noch hebben; maar u zult in tenten wonen al uw dagen, opdat u veel dagen leeft in het land waar u als vreemdeling verblijft. Zo hebben wij naar de stem van Jonadab, de zoon van Rechab, onze vader, geluisterd in alles wat hij ons geboden heeft; zodat wij geen wijn drinken al onze dagen, wij, onze vrouwen, onze zonen, en onze dochters; En dat wij geen huizen bouwen om erin te wonen; ook hebben wij geen wijngaard, geen veld, geen zaad;", "Hagg 1:2": "Zo spreekt de HEERE van de heerscharen: Dit volk zegt: De tijd is niet gekomen, de tijd dat het huis van de HEERE gebouwd moet worden.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Jer 2:24": "Zij is een woudezelin, gewend aan de woestijn, naar de lust van haar ziel schept zij de wind; wie zou haar ontmoeting kunnen afkeren? Allen die haar zoeken, zullen niet moe worden, in haar maand zullen zij haar vinden.", "Spr 31:5": "opdat hij niet drinkt en het vastgestelde vergeet, en de re
