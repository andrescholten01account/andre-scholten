,"vertalingen":{"SVnu":{"1":"Wee de herders, die de schapen van Mijn weide ombrengen en verstrooien! spreekt de HEERE.","2":"Daarom zegt de HEERE, de God van Israël, zo van de herders, die Mijn volk weiden: U hebt Mijn schapen verstrooid, en hebt ze verdreven, en hebt niet naar hen omgezien; zie, Ik zal over u de boosheid van uw handelingen bezoeken, spreekt de HEERE.","3":"En Ik zal het overblijfsel van Mijn schapen Zelf verzamelen uit al de landen, waarheen Ik ze verdreven heb; en Ik zal ze terugbrengen tot hun kooien, en zij zullen vruchtbaar zijn, en zich vermenigvuldigen.","4":"En Ik zal herders over hen doen opstaan, die ze weiden zullen; en zij zullen niet meer vrezen, noch verschrikt worden, noch gemist worden, spreekt de HEERE.","5":"Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.","6":"In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.","7":"Daarom, zie, de dagen komen, spreekt de HEERE, dat zij niet meer zullen zeggen: *Zo waarachtig als* de HEERE leeft, Die de kinderen van Israël uit Egypteland heeft opgevoerd.","8":"Maar: *Zo waarachtig als* de HEERE leeft, Die het nageslacht van het huis van Israël heeft opgevoerd, en Die het heeft aangebracht uit het land van het noorden, en uit al de landen waarheen Ik ze gedreven had! Want zij zullen wonen in hun land.","9":"Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.","10":"Want het land is vol overspelers, want het land treurt vanwege de vloek, de weiden van de woestijn verdorren, omdat hun loop slecht is, en hun macht niet recht.","11":"Want zowel profeten als priesters zijn huichelaars; zelfs in Mijn huis vind Ik hun boosheid, spreekt de HEERE.","12":"Daarom zal hun weg voor hen zijn als zeer gladde plaatsen in de duisternis; zij zullen voortgedreven worden en daarin vallen; want Ik zal een kwaad over hen brengen in het jaar van hun bezoeking, spreekt de HEERE.","13":"Ik heb wel dwaasheid gezien in de profeten van Samaria; zij profeteerden door Baäl, en verleidden Mijn volk Israël.","14":"Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra.","15":"Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land.","16":"Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.","17":"Zij zeggen steeds tegen hen die Mij lasteren: De HEERE heeft het gesproken, u zult vrede hebben; en tegen ieder die naar het goeddunken van zijn eigen hart wandelt, zeggen zij: U zal geen kwaad overkomen.","18":"Want wie heeft in de raad van de HEERE gestaan, en Zijn woord gezien of gehoord? Wie heeft Zijn woord opgemerkt en gehoord?","19":"Zie, een onweer van de HEERE, een grimmigheid is uitgegaan, ja, een pijnlijk onweer, het zal blijven op het hoofd van de goddelozen.","20":"De toorn van de HEERE zal zich niet afwenden, totdat Hij het zal hebben gedaan, en totdat Hij de gedachten van Zijn hart tot stand zal hebben gebracht; in de laatste dagen zult u dat met verstand inzien.","21":"Ik heb die profeten niet gezonden, toch hebben zij gelopen; Ik heb tot hen niet gesproken, toch hebben zij geprofeteerd.","22":"Maar als zij in Mijn raad hadden gestaan, dan zouden zij Mijn volk Mijn woorden hebben laten horen, en zouden hen hebben afgekeerd van hun boze weg, en van de boosheid van hun handelingen.","23":"Ben Ik een God van dichtbij, spreekt de HEERE, en niet een God van ver?","24":"Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE.","25":"Ik heb gehoord wat de profeten zeggen, die in Mijn Naam leugen profeteren, en zeggen: Ik heb gedroomd, ik heb gedroomd.","26":"Hoe lang? Is er dan *een droom* in het hart van de profeten, die de leugen profeteren? Ja, het zijn profeten van de bedriegerij van hun eigen hart.","27":"Die daar denken om Mijn volk Mijn Naam te doen vergeten, door hun dromen, die zij, ieder aan zijn naaste, vertellen; net zoals hun vaders Mijn Naam vergeten hebben door Baäl.","28":"De profeet, bij wie een droom is, vertelt de droom; en bij wie Mijn woord is, spreekt Mijn woord waarachtig; wat heeft het stro met het koren te maken? spreekt de HEERE.","29":"Is Mijn woord niet zo, als een vuur? spreekt de HEERE, en als een hamer, die een steenrots verbrijzelt?","30":"Daarom, zie, Ik *wil* tegen de profeten, spreekt de HEERE, die Mijn woorden stelen, ieder van zijn naaste;","31":"Zie, Ik *wil* tegen de profeten, spreekt de HEERE, die hun tong gebruiken, en spreken: Hij heeft *het* gesproken;","32":"Zie, Ik *wil* tegen hen die valse dromen profeteren, spreekt de HEERE, en ze vertellen, en Mijn volk verleiden met hun leugens en met hun lichtvaardigheid; terwijl Ik hen niet gezonden heb, en hun niets bevolen heb, en zij dit volk in het geheel geen nut doen, spreekt de HEERE.","33":"Wanneer dan dit volk, of een profeet, of priester u zal vragen: Wat is de last van de HEERE? Dan zult u tegen hen zeggen: Wat last? Dat Ik u verlaten zal, spreekt de HEERE.","34":"En aangaande de profeet, of de priester, of het volk, dat zal zeggen: De last van de HEERE; dat Ik bezoeking zal doen over die man en over zijn huis.","35":"Zo zult u zeggen, ieder tegen zijn naaste, en ieder tegen zijn broeder: Wat heeft de HEERE geantwoord, en wat heeft de HEERE gesproken?","36":"Maar de last van de HEERE zult u niet meer noemen; want ieders eigen woord zal hem een last zijn, omdat u de woorden verkeert van de levende God, de HEERE van de heerscharen, onze God.","37":"Zo zult u zeggen tegen de profeet: Wat heeft de HEERE u geantwoord en wat heeft de HEERE gesproken?","38":"Maar omdat u zegt: De last van de HEERE; daarom, zo zegt de HEERE: Omdat u dit woord zegt: De last van de HEERE, terwijl Ik tot u gezonden heb en zei: U zult niet zeggen: De last van de HEERE;","39":"Daarom, zie, Ik zal u ook helemaal vergeten, en u, alsook de stad die Ik u en uw vaderen gegeven heb, van Mijn aangezicht wegdoen.","40":"En Ik zal u eeuwige smaad aandoen, en eeuwige schande, die niet zal worden vergeten."},"SV":{"1":"Wee den herderen, die de schapen Mijner weide ombrengen en verstrooien! spreekt de HEERE.","2":"Daarom zegt de HEERE, de God Israëls, alzo van de herderen, die Mijn volk weiden: Gijlieden hebt Mijn schapen verstrooid, en hebt ze verdreven, en hebt ze niet bezocht; ziet, Ik zal over u bezoeken de boosheid uwer handelingen, spreekt de HEERE.","3":"En Ik zal het overblijfsel Mijner schapen Zelf vergaderen uit al de landen, waarhenen Ik ze verdreven heb; en Ik zal ze wederbrengen tot hun kooien, en zij zullen vruchtbaar zijn, en vermenigvuldigen.","4":"En Ik zal herderen over hen verwekken, die ze weiden zullen; en zij zullen niet meer vrezen, noch verschrikt worden, noch gemist worden, spreekt de HEERE.","5":"Ziet, de dagen komen, spreekt de HEERE, dat Ik aan David een rechtvaardige Spruit zal verwekken; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.","6":"In Zijn dagen zal Juda verlost worden, en Israël zeker wonen; en dit zal Zijn naam zijn, waarmede men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.","7":"Daarom, ziet, de dagen komen, spreekt de HEERE, dat zij niet meer zullen zeggen: *Zo* *waarachtig* *als* de HEERE leeft, Die de kinderen Israëls uit Egypteland heeft opgevoerd.","8":"Maar: *Zo* *waarachtig* *als* de HEERE leeft, Die het zaad van het huis Israëls heeft opgevoerd, en Die het aangebracht heeft uit het land van het noorden, en uit al de landen, waarheen Ik ze gedreven had! want zij zullen wonen in hun land.","9":"Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen bewegen zich; ik ben als een dronken man, en als een man, dien de wijn te boven gaat; vanwege den HEERE, en vanwege de woorden Zijner heiligheid.","10":"Want het land is vol overspelers, want het land treurt vanwege den vloek, de weiden der woestijn verdorren, omdat hun loop boos is, en hun macht niet recht.","11":"Want beiden profeten en priesters zijn huichelaars; zelfs in Mijn huis vind Ik hun boosheid, spreekt de HEERE.","12":"Daarom zal hun weg hun zijn als zeer gladde plaatsen in de donkerheid; zij zullen aangedreven worden en daarin vallen; want Ik zal een kwaad over hen brengen *in* het jaar hunner bezoeking, spreekt de HEERE.","13":"Ik heb wel ongerijmdheid gezien in de profeten van Samaria, *die* door Baäl, profeteerden, en Mijn volk Israël verleidden.","14":"Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij bedrijven overspel, en gaan om met valsheid, en sterken de handen der boosdoeners, opdat zij zich niet bekeren, een iegelijk van zijn boosheid; zij allen zijn Mij als Sodom, en haar inwoners als Gomorra.","15":"Daarom zegt de HEERE der heirscharen van deze profeten alzo: Ziet, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van Jeruzalems profeten is de huichelarij uitgegaan in het ganse land.","16":"Zo zegt de HEERE der heirscharen: Hoort niet naar de woorden der profeten, die u profeteren; zij maken u ijdel; zij spreken het gezicht huns harten, niet uit des HEEREN mond.","17":"Zij zeggen steeds tot degenen, die Mij lasteren: De HEERE heeft het gesproken, gijlieden zult vrede hebben; en *tot* al wie naar zijns harten goeddunken wandelt, zeggen zij: Ulieden zal geen kwaad overkomen.","18":"Want wie heeft in des HEEREN raad gestaan, en Zijn woord gezien of gehoord? Wie heeft Zijn woord aangemerkt en gehoord?","19":"Ziet, een onweder des HEEREN, een grimmigheid is uitgegaan, ja, een pijnlijk onweder, het zal blijven op der goddelozen hoofd.","20":"Des HEEREN toorn zal zich niet afwenden, totdat Hij zal hebben gedaan, en totdat Hij zal hebben daargesteld de gedachten Zijns harten; in het laatste der dagen zult gij *met* verstand daarop letten.","21":"Ik heb die profeten niet gezonden, nochtans hebben zij gelopen; Ik heb tot hen niet gesproken, nochtans hebben zij geprofeteerd.","22":"Maar zo zij in Mijn raad hadden gestaan, zo zouden zij Mijn volk Mijn woorden hebben doen horen, en zouden hen afgekeerd hebben van hun bozen weg, en van de boosheid hunner handelingen.","23":"Ben Ik een God van nabij, spreekt de HEERE, en niet een God van verre?","24":"Zou zich iemand in verborgene plaatsen kunnen verbergen, dat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet den hemel en de aarde? spreekt de HEERE.","25":"Ik heb gehoord, wat de profeten zeggen, die in Mijn Naam leugen profeteren, zeggende: Ik heb gedroomd, ik heb gedroomd.","26":"Hoe lang? Is er dan *een* *droom* in het hart der profeten, die de leugen profeteren? Ja, het zijn profeten van huns harten bedriegerij.","27":"Die daar denken om Mijn volk Mijn Naam te doen vergeten, door hun dromen, die zij, een ieder zijn naaste, vertellen; gelijk als hun vaders Mijn Naam vergeten hebben door Baäl.","28":"De profeet, bij welken een droom is, die vertelle den droom; en bij welken Mijn woord is, die spreke Mijn woord waarachtiglijk; wat heeft het stro met het koren te doen? spreekt de HEERE.","29":"Is Mijn woord niet alzo, als een vuur? spreekt de HEERE, en als een hamer, *die* een steenrots te morzel slaat?","30":"Daarom, ziet, Ik *wil* aan de profeten, spreekt de HEERE, die Mijn woorden stelen, een ieder van zijn naaste;","31":"Ziet, Ik *wil* aan de profeten, spreekt de HEERE, die hun tong nemen, en spreken: Hij heeft *het* gesproken;","32":"Ziet, Ik *wil* aan degenen, die valse dromen profeteren, spreekt de HEERE, en vertellen die, en verleiden Mijn volk met hun leugenen en met hun lichtvaardigheid; daar Ik hen niet gezonden, en hun niets bevolen heb, en zij dit volk gans geen nut doen, spreekt de HEERE.","33":"Wanneer dan dit volk, of een profeet, of priester u vragen zal, zeggende: Wat is des HEEREN last? Zo zult gij tot hen zeggen: Wat last? Dat Ik ulieden verlaten zal, spreekt de HEERE.","34":"En aangaande den profeet, of den priester, of het volk, dat zeggen zal: Des HEEREN last; dat Ik bezoeking zal doen over dien man en over zijn huis.","35":"Aldus zult gijlieden zeggen, een iegelijk tot zijn naaste, en een iegelijk tot zijn broeder: Wat heeft de HEERE geantwoord, en wat heeft de HEERE gesproken?","36":"Maar des HEEREN last zult gij niet meer gedenken; want een iegelijk zal zijn eigen woord een last zijn, dewijl gij verkeert de woorden van den levenden God, den HEERE der heirscharen, onzen God.","37":"Aldus zult gij zeggen tot den profeet: Wat heeft u de HEERE geantwoord en wat heeft de HEERE gesproken?","38":"Maar dewijl gij zegt: Des HEEREN last; daarom, zo zegt de HEERE: Omdat gij dit woord zegt: Des HEEREN last, daar Ik tot u gezonden heb, zeggende: Gij zult niet zeggen: Des HEEREN last;","39":"Daarom, ziet, Ik zal u ook ganselijk vergeten, en u, mitsgaders de stad, die Ik u en uw vaderen gegeven heb, van Mijn aangezicht laten varen.","40":"En Ik zal u eeuwige smaadheid aandoen, en eeuwige schande, die niet zal worden vergeten."},"KJV":{"1":"Woe be unto the pastors that destroy and scatter the sheep of my pasture! saith the LORD.","2":"Therefore thus saith the LORD God of Israel against the pastors that feed my people; Ye have scattered my flock, and driven them away, and have not visited them: behold, I will visit upon you the evil of your doings, saith the LORD.","3":"And I will gather the remnant of my flock out of all countries whither I have driven them, and will bring them again to their folds; and they shall be fruitful and increase.","4":"And I will set up shepherds over them which shall feed them: and they shall fear no more, nor be dismayed, neither shall they be lacking, saith the LORD.","5":"Behold, the days come, saith the LORD, that I will raise unto David a righteous Branch, and a King shall reign and prosper, and shall execute judgment and justice in the earth.","6":"In his days Judah shall be saved, and Israel shall dwell safely: and this *is* his name whereby he shall be called, THE LORD OUR RIGHTEOUSNESS.","7":"Therefore, behold, the days come, saith the LORD, that they shall no more say, The LORD liveth, which brought up the children of Israel out of the land of Egypt;","8":"But, The LORD liveth, which brought up and which led the seed of the house of Israel out of the north country, and from all countries whither I had driven them; and they shall dwell in their own land.","9":"Mine heart within me is broken because of the prophets; all my bones shake; I am like a drunken man, and like a man whom wine hath overcome, because of the LORD, and because of the words of his holiness.","10":"For the land is full of adulterers; for because of swearing the land mourneth; the pleasant places of the wilderness are dried up, and their course is evil, and their force","11":"For both prophet and priest are profane; yea, in my house have I found their wickedness, saith the LORD.","12":"Wherefore their way shall be unto them as slippery *ways* in the darkness: they shall be driven on, and fall therein: for I will bring evil upon them, *even* the year of their visitation, saith the LORD.","13":"And I have seen folly in the prophets of Samaria; they prophesied in Baal, and caused my people Israel to err.","14":"I have seen also in the prophets of Jerusalem an horrible thing: they commit adultery, and walk in lies: they strengthen also the hands of evildoers, that none doth return from his wickedness: they are all of them unto me as Sodom, and the inhabitants thereof as Gomorrah.","15":"Therefore thus saith the LORD of hosts concerning the prophets; Behold, I will feed them with wormwood, and make them drink the water of gall: for from the prophets of Jerusalem is profaneness gone forth into all the land.","16":"Thus saith the LORD of hosts, Hearken not unto the words of the prophets that prophesy unto you: they make you vain: they speak a vision of their own heart, *and* not out of the mouth of the LORD.","17":"They say still unto them that despise me, The LORD hath said, Ye shall have peace; and they say unto every one that walketh after the imagination of his own heart, No evil shall come","18":"For who hath stood in the counsel of the LORD, and hath perceived and heard his word? who hath marked his word, and heard","19":"Behold, a whirlwind of the LORD is gone forth in fury, even a grievous whirlwind: it shall fall grievously upon the head of the wicked.","20":"The anger of the LORD shall not return, until he have executed, and till he have performed the thoughts of his heart: in the latter days ye shall consider it perfectly.","21":"I have not sent these prophets, yet they ran: I have not spoken to them, yet they prophesied.","22":"But if they had stood in my counsel, and had caused my people to hear my words, then they should have turned them from their evil way, and from the evil of their doings.","23":"*Am* I a God at hand, saith the LORD, and not a God afar off?","24":"Can any hide himself in secret places that I shall not see him? saith the LORD. Do not I fill heaven and earth? saith the LORD.","25":"I have heard what the prophets said, that prophesy lies in my name, saying, I have dreamed, I have dreamed.","26":"How long shall *this* be in the heart of the prophets that prophesy lies? yea, *they are* prophets of the deceit of their own heart;","27":"Which think to cause my people to forget my name by their dreams which they tell every man to his neighbour, as their fathers have forgotten my name for Baal.","28":"The prophet that hath a dream, let him tell a dream; and he that hath my word, let him speak my word faithfully. What *is* the chaff to the wheat? saith the LORD.","29":"*Is* not my word like as a fire? saith the LORD; and like a hammer *that* breaketh the rock in pieces?","30":"Therefore, behold, I *am* against the prophets, saith the LORD, that steal my words every one from his neighbour.","31":"Behold, I *am* against the prophets, saith the LORD, that use their tongues, and say, He saith.","32":"Behold, I *am* against them that prophesy false dreams, saith the LORD, and do tell them, and cause my people to err by their lies, and by their lightness; yet I sent them not, nor commanded them: therefore they shall not profit this people at all, saith the LORD.","33":"And when this people, or the prophet, or a priest, shall ask thee, saying, What *is* the burden of the LORD? thou shalt then say unto them, What burden? I will even forsake you, saith the LORD.","34":"And *as for* the prophet, and the priest, and the people, that shall say, The burden of the LORD, I will even punish that man and his house.","35":"Thus shall ye say every one to his neighbour, and every one to his brother, What hath the LORD answered? and, What hath the LORD spoken?","36":"And the burden of the LORD shall ye mention no more: for every man's word shall be his burden; for ye have perverted the words of the living God, of the LORD of hosts our God.","37":"Thus shalt thou say to the prophet, What hath the LORD answered thee? and, What hath the LORD spoken?","38":"But since ye say, The burden of the LORD; therefore thus saith the LORD; Because ye say this word, The burden of the LORD, and I have sent unto you, saying, Ye shall not say, The burden of the LORD;","39":"Therefore, behold, I, even I, will utterly forget you, and I will forsake you, and the city that I gave y wl-kjv\" data-code=\"H3478\">Israel</span> against the <span class=\"wl wl-kjv\" data-code=\"H7462\">pastors</span> that <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> Ye have <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> my <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> and driven them <span class=\"wl wl-kjv\" data-code=\"H5080\">away,</span> and have not <span class=\"wl wl-kjv\" data-code=\"H6485\">visited</span> them: behold, I will <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> upon you the <span class=\"wl wl-kjv\" data-code=\"H7455\">evil</span> of your <span class=\"wl wl-kjv\" data-code=\"H4611\">doings,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","3":"And I will <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of my <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> out of all <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> whither I have <span class=\"wl wl-kjv\" data-code=\"H5080\">driven</span> them, and will bring them <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to their <span class=\"wl wl-kjv\" data-code=\"H5116\">folds;</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H6509\">fruitful</span> and increase.","4":"And I will set <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds</span> over them which shall <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> them: and they shall <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> no more, nor be <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed,</span> neither shall they be <span class=\"wl wl-kjv\" data-code=\"H6485\">lacking,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","5":"Behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H6965\">raise</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> a <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H6780\">Branch,</span> and a <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> shall <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> and <span class=\"wl wl-kjv\" data-code=\"H7919\">prosper,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> and <span class=\"wl wl-kjv\" data-code=\"H6666\">justice</span> in the earth.","6":"In his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3467\">saved,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H983\">safely:</span> and this is his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> whereby he shall be <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> THE LORD OUR RIGHTEOUSNESS.","7":"Therefore, behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that they shall no more <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> which brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt;","8":"But, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> which brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and which <span class=\"wl wl-kjv\" data-code=\"H935\">led</span> the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> and from all <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> whither I had <span class=\"wl wl-kjv\" data-code=\"H5080\">driven</span> them; and they shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in their own land.","9":"Mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">within</span> me is <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> because of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets;</span> all my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> <span class=\"wl wl-kjv\" data-code=\"H7363\">shake;</span> I am like a <span class=\"wl wl-kjv\" data-code=\"H7910\">drunken</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and like a <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> whom <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> hath <span class=\"wl wl-kjv\" data-code=\"H5674\">overcome,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and because of the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of his holiness.","10":"For the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H5003\">adulterers;</span> for <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of <span class=\"wl wl-kjv\" data-code=\"H423\">swearing</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H56\">mourneth;</span> the pleasant <span class=\"wl wl-kjv\" data-code=\"H4999\">places</span> of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> are dried <span class=\"wl wl-kjv\" data-code=\"H3001\">up,</span> and their <span class=\"wl wl-kjv\" data-code=\"H4794\">course</span> is <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and their force","11":"For both <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> and <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> are <span class=\"wl wl-kjv\" data-code=\"H2610\">profane;</span> yea, in my <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> have I <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> their <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","12":"Wherefore their <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> shall be unto them as <span class=\"wl wl-kjv\" data-code=\"H2519\">slippery</span> ways in the <span class=\"wl wl-kjv\" data-code=\"H653\">darkness:</span> they shall be driven <span class=\"wl wl-kjv\" data-code=\"H1760\">on,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> therein: for I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon them, even the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of their <span class=\"wl wl-kjv\" data-code=\"H6486\">visitation,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","13":"And I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H8604\">folly</span> in the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria;</span> they <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> in <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> and caused my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to err.","14":"I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> also in the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> an horrible <span class=\"wl wl-kjv\" data-code=\"H8186\">thing:</span> they commit <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> in <span class=\"wl wl-kjv\" data-code=\"H8267\">lies:</span> they <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthen</span> also the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"H7489\">evildoers,</span> that <span class=\"wl wl-kjv\" data-code=\"H376\">none</span> doth <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> from his <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness:</span> they are all of them unto me as <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> thereof as Gomorrah.","15":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H398\">feed</span> them with <span class=\"wl wl-kjv\" data-code=\"H3939\">wormwood,</span> and make them <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of <span class=\"wl wl-kjv\" data-code=\"H7219\">gall:</span> for from the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> is <span class=\"wl wl-kjv\" data-code=\"H2613\">profaneness</span> gone <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into all the land.","16":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hearken</span> not unto the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> that <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> unto you: they make you <span class=\"wl wl-kjv\" data-code=\"H1891\">vain:</span> they <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> a <span class=\"wl wl-kjv\" data-code=\"H2377\">vision</span> of their own <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> and not out of the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the LORD.","17":"They <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> <span class=\"wl wl-kjv\" data-code=\"H559\">still</span> unto them that <span class=\"wl wl-kjv\" data-code=\"H5006\">despise</span> me, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">said,</span> Ye shall have <span class=\"wl wl-kjv\" data-code=\"H7965\">peace;</span> and they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto every one that <span class=\"wl wl-kjv\" data-code=\"H1980\">walketh</span> after the <span class=\"wl wl-kjv\" data-code=\"H8307\">imagination</span> of his own <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> No <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> shall come","18":"For who hath <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H5475\">counsel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H7200\">perceived</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">word?</span> who hath <span class=\"wl wl-kjv\" data-code=\"H7181\">marked</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">word,</span> and heard","19":"Behold, a <span class=\"wl wl-kjv\" data-code=\"H5591\">whirlwind</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is gone <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> in <span class=\"wl wl-kjv\" data-code=\"H2534\">fury,</span> even a <span class=\"wl wl-kjv\" data-code=\"H2342\">grievous</span> <span class=\"wl wl-kjv\" data-code=\"H5591\">whirlwind:</span> it shall fall <span class=\"wl wl-kjv\" data-code=\"H2342\">grievously</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of the wicked.","20":"The <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall not <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> until he have <span class=\"wl wl-kjv\" data-code=\"H6213\">executed,</span> and till he have <span class=\"wl wl-kjv\" data-code=\"H6965\">performed</span> the <span class=\"wl wl-kjv\" data-code=\"H4209\">thoughts</span> of his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart:</span> in the <span class=\"wl wl-kjv\" data-code=\"H319\">latter</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H995\">consider</span> it perfectly.","21":"I have not <span c 7\">false</span> <span class=\"wl wl-kjv\" data-code=\"H2472\">dreams,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and do <span class=\"wl wl-kjv\" data-code=\"H5608\">tell</span> them, and cause my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to <span class=\"wl wl-kjv\" data-code=\"H8582\">err</span> by their <span class=\"wl wl-kjv\" data-code=\"H8267\">lies,</span> and by their <span class=\"wl wl-kjv\" data-code=\"H6350\">lightness;</span> yet I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> them not, nor <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them: therefore they shall not <span class=\"wl wl-kjv\" data-code=\"H3276\">profit</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> at <span class=\"wl wl-kjv\" data-code=\"H3276\">all,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","33":"And when this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> or the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> or a <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> shall <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> What is the <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span> thou shalt then <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, What <span class=\"wl wl-kjv\" data-code=\"H4853\">burden?</span> I will even <span class=\"wl wl-kjv\" data-code=\"H5203\">forsake</span> you, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","34":"And as for the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that shall <span class // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
