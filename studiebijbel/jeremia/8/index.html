an mij, opdat ik spreek, en laat over mij komen wat het ook zij.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "Hos 2:11": "En Ik zal haar wijnstok en haar vijgenboom verwoesten, waarvan zij zegt: Deze zijn mij een hoerenloon, dat mijn minnaars mij gegeven hebben; maar Ik zal ze tot een woud maken, en het wild gedierte van het veld zal ze opeten.", "Jer 6:10": "Tot wie zal ik spreken en betuigen, dat zij het horen? Ziet, hun oor is onbesneden, zodat zij niet kunnen toeluisteren; ziet, het woord van de HEERE is hun tot een smaad, zij hebben er geen lust in.", "Luk 12:15-21": "En Hij zei tegen hen: Kijk uit en wees op uw hoede voor hebzucht; want het leven van iemand hangt niet af van de overvloed van zijn bezittingen. En Hij vertelde hun een gelijkenis: Het land van een rijke man had veel opgebracht; en hij overlegde bij zichzelf en zei: Wat zal ik doen, want ik heb geen plaats waar ik mijn vruchten kan verzamelen.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Pred 7:16-25": "Wees niet al te rechtvaardig, en houd uzelf ook niet al te wijs; waarom zou u verwoesting over u brengen? Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd? Het is goed dat u daaraan vasthoudt, en trek ook uw hand van dit niet af; want wie God vreest, die ontgaat dat allemaal.", "1 Joh 2:11": "Maar wie zijn broeder haat, is in de duisternis, en wandelt in de duisternis, en weet niet, waar hij heengaat; want de duisternis heeft zijn ogen verblind.", "Jer 32:30": "Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE.", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "Ps 119:133": "Maak mijn voetstappen vast in Uw Woord, en laat geen ongerechtigheid over mij heersen.", "Neh 9:16-37": "Maar zij en onze vaders hebben trots gehandeld, en zij hebben hun nek verhard, en niet geluisterd naar Uw geboden; En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten. Zelfs, toen zij zich een gegoten kalf gemaakt hadden, en gezegd hadden: Dit is uw God, Die u uit Egypte heeft opgevoerd; en grote lasteringen gedaan hadden;", "2 Kor 10:18": "Want niet wie zichzelf prijst, die is beproefd, maar wie de Heere prijst.", "1 Tess 4:5": "Niet in kwade hartstocht van begeerte, zoals ook de heidenen, die God niet kennen.", "Spr 13:18": "Armoede en schande is voor hem die de tucht verwerpt; maar die de bestraffing ter harte neemt, zal geëerd worden.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Jer 5:3": "HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Pred 1:2-8": "Vluchtigheid der vluchtigheden, zegt de prediker; vluchtigheid der vluchtigheden, het is al vluchtig. Wat voordeel heeft de mens van al zijn arbeid, die hij verricht onder de zon? Het ene geslacht gaat, en het andere geslacht komt; maar de aarde blijft staan in eeuwigheid.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Jer 4:14-18": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten? Want een stem verkondigt vanaf Dan, en laat ellende horen vanaf het gebergte van Efraïm. Vermeld het aan de volken, zie, laat het horen tegen Jeruzalem; er komen bewakers uit een ver land; en zij verheffen hun stem tegen de steden van Juda.", "Jer 36:30": "Daarom zegt de HEERE zo van Jojakim, de koning van Juda: Hij zal niemand hebben die op de troon van David zit; en zijn dode lichaam zal weggeworpen worden, overdag in de hitte, en 's nachts in de vorst.", "Job 24:13": "Zij horen bij hen die zich verzetten tegen het licht; zij kennen Zijn wegen niet, en zij blijven niet op Zijn paden.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Jes 30:9-11": "Want het is een opstandig volk; het zijn leugenachtige kinderen; kinderen die de wet van de HEERE niet willen horen. Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen. Wijkt af van de weg, maakt u van het pad; laat de Heilige van Israël van ons ophouden!", "Ps 104:35": "De zondaars zullen van de aarde weggevaagd worden, en de goddelozen zullen niet meer zijn. Loof de HEERE, mijn ziel! Hallelujah!", "Jer 5:1-17": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn. En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals. HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Joh 3:9-12": "Nicodemus antwoordde en zei tegen Hem: Hoe kunnen deze dingen gebeuren? Jezus antwoordde en zei tegen hem: Bent u een leraar van Israël, en weet u deze dingen niet? Voorwaar, voorwaar, Ik zeg u: Wij spreken wat Wij weten, en getuigen wat Wij gezien hebben; en u neemt Ons getuigenis niet aan.", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "Jes 5:28": "Hun pijlen zullen scherp zijn, en al hun bogen gespannen; de hoeven van hun paarden zullen als een rots geacht worden, en hun wielen als een wervelwind.", "Job 3:1-26": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Jer 17:1-6": "De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren; Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels. Ik zal Mijn berg met het veld, uw vermogen en al uw schatten ten roof geven, alsook uw hoogten, om de zonde in al uw landpalen.", "Jer 2:34": "Ja, het bloed van de zielen van de onschuldige behoeftigen is in uw zomen gevonden; Ik heb dat niet door opgraven gevonden, maar aan dat alles.", "Zef 1:4": "En Ik zal Mijn hand uitstrekken tegen Juda, en tegen alle inwoners van Jeruzalem; en Ik zal uit deze plaats uitroeien het overblijfsel van Baäl, en de naam van de afgodspriesters met de priesters;", "Hand 3:17": "En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.", "Amos 6:10": "En de naaste bloedverwant zal ieder van hen opnemen, degene die hem verbrandt, om de beenderen uit het huis naar buiten te brengen, en zal zeggen tegen hem die binnen in het huis is: Is er nog iemand bij u? En hij zal zeggen: Niemand. Dan zal hij zeggen: Zwijg! Want wij mogen de Naam van de HEERE niet noemen.", "Matt 21:33-46": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland. Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen. En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde.", "Ps 58:4-6": "De goddelozen zijn vervreemd van de moederschoot af; de leugensprekers dolen van de moederbuik af. Zij hebben vurig gif, gelijk vurig slangengif; zij zijn als een dove adder, die zijn oren toestopt, opdat hij niet hoort naar de stem van de bezweerders, van hem die ervaren is in het uitvoeren van bezweringen.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Klaagl 3:8": "Gimel. Ook wanneer ik roep en schreeuw, sluit Hij Zijn oren voor mijn gebed.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Kol 2:8": "Kijk uit dat niemand u als een roof meesleept door de filosofie en loze verleiding, naar de overlevering van de mensen, naar de eerste beginselen van de wereld, en niet naar Christus;", "1 Joh 1:5": "En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.", "Job 32:1": "Toen hielden de drie mannen op Job te antwoorden, omdat hij in zijn eigen ogen rechtvaardig was.", "Jer 40:12": "keerden alle Joden terug uit alle plaatsen waarheen zij verdreven waren, en kwamen in het land van Juda tot Gedalia te Mizpa; en zij verzamelden zeer veel wijn en zomervruchten.", "Jer 3:1-11": "Men zegt: Als een man zijn vrouw verlaat, en zij gaat van hem weg en wordt de vrouw van een andere man, zal hij dan nog naar haar terugkeren? Zou dat land niet ernstig ontheiligd worden? U hebt met veel minnaars gehoereerd, en toch zou u weer naar Mij terugkeren, spreekt de HEERE. Sla uw ogen op naar de hoge plaatsen, en zie toe: waar bent u niet beslapen? U hebt voor hen gezeten langs de wegen, als een Arabier in de woestijn; zo hebt u het land ontheiligd met uw hoererijen en met uw slechtheid. Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "Ps 32:9": "Wees niet als een paard, als een muilezel, dat geen verstand heeft, wiens muil men breidelt met toom en gebit, zodat het niet naar u toe komt.", "Ps 20:9": "Zij hebben zich gekromd, en zijn gevallen; maar wij zijn opgestaan en staande gebleven.", "Jer 44:17-19": "Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad. Maar vanaf het moment dat wij opgehouden zijn wierook te branden voor de koningin van de hemel, en haar drankoffers te offeren, hebben wij van alles gebrek gehad, en zijn wij door het zwaard en door de honger verteerd. Ook wanneer wij voor de koningin van de hemel wierook branden en haar drankoffers offeren, maken wij haar gebeelde koeken om haar af te beelden, en offeren wij haar drankoffers, zonder onze mannen?", "Jes 28:13": "Zo zal het woord van de HEERE voor hen zijn: gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig; opdat zij heengaan, en achterwaarts vallen, en gebroken, en verstrikt en gevangen worden.", "Jer 14:8": "O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! Waarom zou U zijn als een vreemdeling in het land, en als een reiziger die slechts inkeert om te overnachten?", "Openb 2:25": "Maar wat u hebt, houd dat vast, totdat Ik zal komen.", "Jer 4:19-31": "O mijn binnenste, mijn binnenste! ik heb weeën, o wanden van mijn hart! Mijn hart maakt getier in mij, ik kan niet zwijgen; want u, mijn ziel! hoort het geluid van de bazuin en het krijgsgeschreeuw. Ondergang op ondergang wordt uitgeroepen; want het hele land is verwoest; haastig zijn mijn tenten verwoest, mijn gordijnen in een ogenblik! Hoe lang zal ik de banier zien, het geluid van de bazuin horen?", "2 Tim 2:14-18": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders. Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt. Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen.", "Ps 106:18": "En een vuur brandde onder hun groep, een vlam stak de goddelozen in brand.", "Ezech 6:4": "Daarbij zullen uw altaren verwoest worden, en uw zonnebeelden verbroken worden; en Ik zal uw gesneuvelden neervellen voor het aangezicht van uw drekgoden.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Jes 53:1": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard?", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "Luk 12:5": "Maar Ik zal u tonen voor wie u bang moet zijn: wees bang voor Hem, Die, nadat Hij gedood heeft, ook macht heeft om in de hel te werpen; ja, Ik zeg u, wees bang voor Hem!", "1 Kor 15:3": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften;", "Jes 38:17": "Zie, in vrede is mij de bitterheid bitter geweest; maar Gij hebt mijn ziel liefdevol omhelsd, zodat zij niet in de groeve van de vertering kwam; want Gij hebt al mijn zonden achter Uw rug geworpen.", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "Ps 118:21": "Ik zal U loven, omdat U mij verhoord hebt, en mij tot heil geweest bent.", "Ezech 13:1-23": "En het woord van de HEERE gebeurde tot mij, en zei: Mensenkind, profeteer tegen de profeten van Israël, die profeteren, en zeg tegen hen die uit hun eigen hart profeteren: Hoor het woord van de HEERE. Zo zegt de Heere HEERE: Wee over die dwaze profeten, die hun eigen geest nawandelen, en wat zij niet gezien hebben!", "Amos 3:14": "Dat Ik, op de dag dat Ik Israëls overtredingen over hem bezoeken zal, ook bezoeking zal doen over de altaren van Beth-el; en de hoorns van het altaar zullen worden afgehouwen, en op de aarde vallen.", "Ps 85:9": "Ik zal horen wat God, de HEERE, spreken zal; want Hij zal tot Zijn volk en tot Zijn gunstgenoten van vrede spreken; maar laat hen niet weer tot dwaasheid terugkeren.", "1 Joh 4:1-3": "Geliefden, geloof niet elke geest, maar beproef de geesten, of zij uit God zijn; want veel valse profeten zijn uitgegaan in de wereld. Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God; en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "2 Petr 3:2": "Opdat u de woorden gedenkt die van tevoren gesproken zijn door de heilige profeten, en het gebod van ons, de apostelen van de Heere en Zaligmaker;", "Ps 119:72": "De wet van Uw mond is mij beter, dan duizenden van goud of zilver.", "Ps 73:4-12": "Want er zijn geen boeien tot hun dood toe, en hun kracht is fris. Zij zijn niet in de moeite zoals andere mensen, en worden niet met andere mensen geplaagd. Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Rom 16:26": "maar nu geopenbaard is, en door de profetische Schriften, naar het bevel van de eeuwige God, tot gehoorzaamheid aan het geloof, onder alle heidenen bekendgemaakt is;", "Jer 8:5-22": "Waarom keert dit volk van Jeruzalem dan af, met een altijddurende afkering? Zij houden vast aan bedrog, zij weigeren terug te keren. Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd. Zelfs een ooievaar aan de hemel kent zijn vaste tijden, en een tortelduif, en kraanvogel, en zwaluw, nemen de tijd van hun aankomst waar; maar Mijn volk kent het recht van de HEERE niet.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Ps 147:19": "Hij maakt aan Jakob Zijn woorden bekend, aan Israël Zijn inzettingen en Zijn rechten.", "Jer 19:13": "En de huizen van Jeruzalem en de huizen van de koningen van Juda zullen, evenals alle plaatsen van Tofeth, onrein worden, met al de huizen, op wier daken zij aan heel het leger van de hemel gerookt en aan vreemde goden drankoffers geofferd hebben.", "Matt 23:33": "Slangen, addergebroed! Hoe zou u de helse verdoemenis ontvluchten?", "Openb 18:5": "Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.", "Jer 13:25": "Dit zal uw lot zijn, het deel dat u van Mij is toegemeten, spreekt de HEERE; u, die Mij hebt vergeten, en op leugen vertrouwt.", "1 Kor 2:15": "Maar de geestelijke mens beoordeelt wel alle dingen, maar hijzelf wordt door niemand beoordeeld.", "Jes 28:12": "tot wie Hij gezegd heeft: Dit is de rust, geef de moede rust, en dit is de verkwikking; toch hebben zij niet willen horen.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Jer 23:21": "Ik heb die profeten niet gezonden, toch hebben zij gelopen; Ik heb tot hen niet gesproken, toch hebben zij geprofeteerd.", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Hebr 11:3": "Door het geloof begrijpen wij dat de wereld door het woord van God gemaakt is, zodat de dingen die men ziet niet ontstaan zijn uit dingen die zichtbaar zijn.", "Nahum 1:4": "Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg.", "Matt 10:14": "En als iemand u niet ontvangt, en uw woorden niet hoort, schudt dan bij het verlaten van dat huis of die stad het stof van uw voeten af.", "Spr 30:9": "Opdat ik, als ik verzadigd ben, U dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.", "Richt 20:1": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "Jes 56:12": "Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "Ps 19:8": "De wet van de HEERE is volmaakt, en zet de ziel om; de getuigenis van de HEERE is betrouwbaar, en geeft de eenvoudigen wijsheid.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Gen 6:13": "Daarom zei God tegen Noach: Het einde van alle vlees is voor Mijn aangezicht gekomen; want de aarde is door hen vervuld met geweld; en zie, Ik zal hen met de aarde verderven.", "Hand 8:21": "U hebt geen deel en geen aandeel in dit woord, want uw hart is niet recht voor God.", "Jes 40:21": "Weet u het niet? Hoort u het niet? Is het u van het begin af aan niet bekendgemaakt? Hebt u niet gelet op de grondvesten van de aarde?", "Ps 91:8": "Alleen zult u het met uw ogen aanschouwen; en u zult de vergelding van de goddelozen zien.", "Spr 17:6": "De kroon van de ouderen zijn de kleinkinderen, en het sieraad van de kinderen zijn hun vaders.", "Rom 2:19-25": "En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn, Een onderrichter van de onwijzen, en een leermeester van de onwetenden, terwijl u de vorm van de kennis en van de waarheid in de wet hebt. Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u?", "Ps 38:5": "Want mijn ongerechtigheden gaan over mijn hoofd; als een zware last zijn zij mij te zwaar geworden.", "Luk 7:36-50": "En een van de Farizeeën vroeg Hem of Hij met hem wilde eten; en Hij ging het huis van de Farizeeër binnen, en ging aanliggen. En zie, een vrouw in de stad, die een zondares was, kwam er, toen zij te weten kwam dat Hij in het huis van de Farizeeër aan tafel aanlag, met een albasten fles met zalf, en ging huilend achter Zijn voeten staan, en begon Zijn voeten nat te maken met tranen, en droogde ze af met het haar van haar hoofd, en kuste Zijn voeten, en zalfde ze met de zalf.", "Jer 32:36": "En nu, daarom zegt de HEERE, de God van Israël, zo over deze stad, waarvan u zegt: Zij is gegeven in de hand van de koning van Babel, door het zwaard, en door de honger, en door de pest;", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Zach 7:11": "Maar zij weigerden op te letten, en trokken hun schouder terug, en zij verzwaarden hun oren, zodat zij niet hoorden.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Job 33:14": "Maar God spreekt eens of tweemaal; doch men let daar niet op.", "Lev 26:16-39": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten. Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand. En als u Mij ook na deze dingen niet zult horen, zal Ik nog daaraan toedoen, om u zevenvoudig over uw zonden te tuchtigen.", "Ezech 44:10": "Maar de Levieten die ver van Mij weggegaan zijn, toen Israël ging dolen, die van Mij zijn afgedwaald, hun drekgoden  achterna, zullen wel hun ongerechtigheid dragen;", "Ps 119:119": "U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Jes 11:8": "En een zuigeling zal zich vermaken bij het hol van een adder; en een gespeend kind zal zijn hand uitsteken naar de kuil van de basilisk.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "Micha 2:11": "Als er iemand is die met wind omgaat en vals liegt, en zegt: Ik zal u profeteren van wijn en van sterke drank! dan is dat een profeet voor dit volk.", "Jer 49:7": "Tegen Edom zegt de HEERE van de heerscharen zo: Is er dan geen wijsheid meer te Theman? Is de raad vergaan van de verstandigen? Is hun wijsheid onnut geworden?", "Hos 4:14": "Ik zal over uw dochters geen straf² brengen, omdat zij hoereren, en over uw bruiden, omdat zij overspel plegen; want zij zelf zonderen zich af met de hoeren, en offeren met de snoodste hoeren; het volk dan, dat geen verstand heeft, zal ten onder gaan.", "Deut 4:10": "Denk aan de dag dat u voor de HEERE, uw God, bij Horeb stond, toen de HEERE tegen mij zei: Verzamel dit volk voor Mij, en Ik zal hun Mijn woorden laten horen, die zij zullen leren, om Mij te vrezen al de dagen dat zij op de aardbodem leven, en zij zullen ze hun kinderen leren;", "Jer 3:3": "Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Ps 146:10": "De HEERE zal in eeuwigheid regeren; uw God, o Sion! is van geslacht tot geslacht. Halleluja!", "Jes 8:19": "Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?", "Job 21:27-29": "Zie, ik ken uw gedachten, en de boze plannen, waarmee u tegen mij geweld doet. Want u zult zeggen: Waar is het huis van de vorst, en waar is de tent van de woningen der goddelozen? Hebt u niet gevraagd aan de voorbijgaande op de weg, en kent u hun tekenen niet?", "Hebr 10:7": "Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Matt 24:26": "Als zij dan tegen u zullen zeggen: Kijk, hij is in de woestijn, ga er niet heen; Kijk, hij is in de binnenkamers, geloof het niet.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "1 Petr 2:3": "Als u tenminste geproefd hebt dat de Heere goedertieren is.", "Jes 56:10-12": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief. En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders die niets kunnen begrijpen; zij keren zich allemaal naar hun eigen weg, ieder naar zijn eigen winst, elk uit zijn eigen hoek. Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "Spr 13:13": "Die het woord veracht, die zal verdorven worden; maar wie het gebod vreest, hem zal het vergolden worden.", "Kol 1:21": "En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend,", "Jer 7:8": "Zie, u vertrouwt op valse woorden, die geen nut doen.", "Hos 6:5": "Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen als het licht.", "Pred 12:10": "De prediker zocht aangename woorden te vinden, en wat er geschreven is, is recht: woorden van de waarheid.", "Matt 12:44": "Dan zegt hij: Ik zal teruggaan naar mijn huis, waar ik vandaan gekomen ben; en als hij komt, vindt hij het leeg, schoongeveegd en versierd.", "Luk 11:52": "Wee u, wetgeleerden, want u hebt de sleutel van de kennis weggenomen; u zelf bent niet naar binnen gegaan, en hen die naar binnen gingen, hebt u tegengehouden.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Jer 32:32": "Vanwege al de boosheid van de kinderen van Israël en van de kinderen van Juda, die zij gedaan hebben om Mij te vertoornen, zij, hun koningen, hun vorsten, hun priesters en hun profeten, en de mannen van Juda, en de inwoners van Jeruzalem;", "Klaagl 3:28": "Jod. Hij zit eenzaam, en zwijgt stil, omdat Hij het hem opgelegd heeft.", "Hos 5:13": "Toen Efraïm zijn ziekte zag, en Juda zijn gezwel, ging Efraïm naar Assur, en hij stuurde iemand naar koning Jareb; maar die zal u niet kunnen genezen, en zal het gezwel van u niet helen.", "Ps 133:3": "Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Jer 15:9": "Zij die zeven kinderen baarde, is zwak geworden; zij heeft haar ziel uitgeblazen, haar zon is ondergegaan, toen het nog dag was; zij is beschaamd en te schande geworden; en hun overblijfsel zal Ik aan het zwaard overgeven, voor het aangezicht van hun vijanden, spreekt de HEERE.", "Hos 12:2": "Efraïm weidt zich met wind, en jaagt de oostenwind na; de hele dag vermenigvuldigt hij leugen en verwoesting; en zij maken een verbond met Assur, en de olie wordt naar Egypte gevoerd.", "Pred 7:17": "Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd?", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Jes 59:9-11": "Daarom is het recht ver van ons, en de gerechtigheid bereikt ons niet; wij wachten op het licht, maar zie, er is duisternis, op een grote glans, maar wij wandelen in het donker. Wij tasten naar de wand, zoals de blinden, en zoals wie geen ogen hebben, tasten wij; wij struikelen op de middag als in de schemering, wij zijn op woeste plaatsen als de doden. Wij brommen allen als de beren, en wij kirren voortdurend als de duiven; wij wachten op recht, maar er is geen, op heil, maar het is ver van ons.", "Job 31:25": "Als ik blijde ben geweest, omdat mijn vermogen groot was, en omdat mijn hand geweldig veel verkregen had;", "Rom 1:16": "Want ik schaam mij niet voor het Evangelie van Christus; want het is een kracht van God tot zaligheid voor ieder die gelooft, eerst de Jood, en ook de Griek.", "Jer 9:2": "Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop.", "Jes 1:23": "Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet.", "Deut 18:20-22": "Maar de profeet die hoogmoedig handelt door een woord te spreken in Mijn Naam, dat Ik hem niet geboden heb te spreken, of die zal spreken in de naam van andere goden, die profeet zal sterven. Als u dan in uw hart zou zeggen: Hoe zullen wij het woord kennen dat de HEERE niet gesproken heeft? Wanneer die profeet in de Naam van de HEERE gesproken heeft, en dat woord gebeurt niet en komt niet uit, dan is dat het woord dat de HEERE niet gesproken heeft; door trots heeft die profeet dat gesproken; u hoeft niet bevreesd voor hem te zijn.", "Tit 2:10": "Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren.", "Spr 21:25": "De begeerte van de luiaard zal hem doden, want zijn handen weigeren te werken.", "Jes 1:20": "Maar als u weigert, en opstandig bent, zult u door het zwaard gegeten worden; want de mond van de HEERE heeft het gesproken.", "1 Joh 4:9": "Hierin is de liefde van God jegens ons geopenbaard, dat God Zijn eniggeboren Zoon gezonden heeft in de wereld, opdat wij zouden leven door Hem.", "2 Sam 22:31": "Gods weg is volmaakt; het woord van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Job 22:22": "Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart.", "Ezech 11:21": "Maar van hen wier hart het hart van hun verfoeiselen en hun gruwelen navolgt, zal Ik de weg daarvan op hun hoofd geven, spreekt de Heere HEERE.", "1 Kon 12:31": "Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren.", "Hos 11:7": "Want Mijn volk blijft hangen aan de afkering van Mij; zij roepen het wel tot de Allerhoogste, maar niet één verhoogt Hem.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Deut 7:10": "En Hij vergeldt ieder van hen die Hem haten, in zijn aangezicht, om hem te verderven; Hij zal het voor wie Hem haat niet uitstellen, in zijn aangezicht zal Hij het hem vergelden.", "Job 5:12": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.", "Tit 1:11": "hun moet men de mond snoeren, want zij brengen hele huizen in verwarring, en leren wat niet behoort, om het schandelijke gewin.", "Job 22:5": "Is uw boosheid niet groot, en is er geen einde aan uw ongerechtigheden?", "Ezech 2:3-8": "En Hij zei tegen mij: Mensenkind! Ik zend u tot de kinderen van Israël, tot de rebellerende volken, die tegen Mij gerebelleerd hebben; zij en hun vaderen hebben tegen Mij overtreden tot op deze huidige dag. En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE! En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Ps 59:8": "Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?", "Jes 64:6": "Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind.", "Spr 12:7": "De goddelozen worden omgekeerd, zodat zij niet meer zijn; maar het huis van de rechtvaardigen zal bestaan.", "Jes 5:13": "Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Jes 42:18-20": "Hoort, u doven! En kijkt toe, u blinden, om te zien. Wie is er blind als Mijn knecht, en doof, zoals Mijn bode, die Ik zend? Wie is blind, zoals de volmaakte, en blind, zoals de knecht van de HEERE? U ziet wel veel dingen, maar u bewaart ze niet; en al doet hij de oren open, toch hoort hij niet.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Mark 5:26": "en veel geleden had van vele artsen, en al wat zij had daaraan ten koste gelegd had, en geen baat gevonden had, maar met wie het juist erger geworden was;", "Jes 13:5": "Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "Ezech 3:19": "Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd.", "Jes 47:11": "Daarom zal er over u een kwaad komen, u zult de dageraad daarvan niet weten; en een verderf zal er op u vallen, dat u niet zult kunnen verzoenen; want er zal snel een onstuimige verwoesting over u komen, zodat u het niet weten zult.", "Ps 119:30": "Ik heb gekozen de weg van de waarheid, Uw rechten heb ik mij voorgesteld.", "Jer 44:10": "Zij zijn tot op deze dag nog niet verbrijzeld van hart, en zij hebben niet gevreesd, noch gewandeld in Mijn wet en in Mijn inzettingen, die Ik voor uw aangezicht en voor het aangezicht van uw vaderen gegeven heb.", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden.", "Pred 5:10": "Waar het goed zich vermeerdert, daar vermeerderen ook zij die het opeten; wat nut hebben dan de bezitters ervan, behalve het aanzien ervan met hun ogen?", "1 Tim 3:3": "niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Jer 9:15": "Daarom zegt de HEERE van de heerscharen, de God van Israël, zo: Zie, Ik zal dit volk voeden met alsem, en Ik zal hen laten drinken met gallewater;", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "Pred 10:3": "En ook wanneer de dwaas op de weg wandelt, ontbreekt hem zijn verstand, en hij zegt tegen ieder dat hij dwaas is.", "Luk 13:5": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Ps 64:8": "Maar God zal hen haastig met een pijl schieten; hun plagen zijn er.", "Hagg 2:18": "Ik sloeg u met brandkoren, met honingdauw en met hagel, al het werk van uw handen; en u keerde u niet tot Mij, spreekt de HEERE.", "Ezech 33:5": "Hij hoorde het geluid van de bazuin, maar liet zich niet waarschuwen, zijn bloed is op hem; maar wie zich laat waarschuwen, behoudt zijn leven.", "Rom 3:2": "Veel, in alle opzichten; want dit is wel het eerste, dat hun de woorden van God zijn toevertrouwd.", "Jer 5:14": "Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "Openb 9:5": "En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft.", "Matt 21:32": "Want Johannes is naar u toe gekomen op de weg van gerechtigheid, en u hebt hem niet geloofd; maar de tollenaars en de hoeren hebben hem geloofd; en u, terwijl u dat zag, hebt daarna geen berouw gehad om hem alsnog te geloven.", "Jes 3:12": "De drijvers van Mijn volk zijn kinderen, en vrouwen heersen over hen. O Mijn volk! die u leiden, verleiden u, en de weg van uw paden slokken zij in.", "Ef 2:1-3": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden; waarin u eertijds gewandeld hebt, naar de eeuw van deze wereld, naar de leider van de macht van de lucht, van de geest die nu werkt in de kinderen van de ongehoorzaamheid; onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen;", "Ps 122:6": "Bid om de vrede van Jeruzalem; het moet goed gaan met hen die u liefhebben.", "Luk 13:34": "Jeruzalem, Jeruzalem! U die de profeten doodt en stenigt hen die naar u toe gezonden zijn, hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens onder haar vleugels verzamelt; en u hebt niet gewild?", "1 Joh 2:9": "Wie zegt, dat hij in het licht is, en zijn broeder haat, die is tot nu toe in de duisternis.", "Openb 20:10": "En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.", "Gen 6:7": "En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "Joh 17:20": "En Ik bid niet alleen voor dezen, maar ook voor hen die door hun woord in Mij geloven zullen.", "Job 12:2": "Trouwens, omdat u het volk bent, zal de wijsheid met u sterven!", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Ps 38:19": "Want ik maak U mijn ongerechtigheid bekend, ik ben bekommerd vanwege mijn zonde.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Ps 12:7": "De woorden van de HEERE zijn reine woorden, zilver, gelouterd in een aarden smeltkroes, gezuiverd zevenmaal.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Kol 3:5": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is.", "Luk 13:24": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;", "Luk 17:1": "En Hij zei tegen de discipelen: Het kan niet anders, dan dat er ergernissen komen; maar wee hem, door wie ze komen.", "Ps 1:2": "Maar zijn vreugde is in de wet van de HEERE, en hij overdenkt Zijn wet dag en nacht.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Ps 50:22": "Verstaat dit toch, u die God vergeet! opdat Ik niet verscheur en niemand redt.", "Gen 4:7": "Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.", "Jes 6:11": "Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "Hos 2:7": "Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, dat zij voor de Baäl gebruikt hebben.", "1 Kor 8:2": "En als iemand meent iets te weten, die heeft nog niets gekend, zoals men behoort te kennen.", "Ezech 22:26": "Haar priesters doen Mijn wet geweld aan, en zij ontheiligen Mijn heilige dingen; tussen het heilige en het onheilige maken zij geen onderscheid, en het verschil tussen het onreine en het reine geven zij niet te kennen; daarbij verbergen zij hun ogen voor Mijn sabbatten; ja, Ik word in hun midden ontheiligd.", "Luk 21:8": "En Hij zei: Kijkt uit, dat u niet verleid wordt; want velen zullen komen onder Mijn Naam, en zeggen: Ik ben de Christus; en de tijd is nabij gekomen. Ga hen dan niet na.", "Job 27:8-23": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "Ps 40:13": "Want kwaden, tot zonder getal toe, hebben mij omgeven; mijn ongerechtigheden hebben mij aangegrepen, zodat ik niet heb kunnen zien; ze zijn menigvuldiger dan de haren van mijn hoofd, en mijn hart heeft mij verlaten.", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Jer 3:1-25": "Men zegt: Als een man zijn vrouw verlaat, en zij gaat van hem weg en wordt de vrouw van een andere man, zal hij dan nog naar haar terugkeren? Zou dat land niet ernstig ontheiligd worden? U hebt met veel minnaars gehoereerd, en toch zou u weer naar Mij terugkeren, spreekt de HEERE. Sla uw ogen op naar de hoge plaatsen, en zie toe: waar bent u niet beslapen? U hebt voor hen gezeten langs de wegen, als een Arabier in de woestijn; zo hebt u het land ontheiligd met uw hoererijen en met uw slechtheid. Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.", "Openb 2:14": "Maar Ik heb enkele weinige dingen tegen u, dat u daar mensen hebt die de leer van Balaäm vasthouden, die Balak leerde de kinderen van Israël een aanstoot voor te werpen, opdat zij afgodenoffer zouden eten en hoereren.", "Zach 7:4-14": "Toen kwam het woord van de HEERE van de heerscharen tot mij: Spreek tot heel het volk van dit land, en tot de priesters: Toen u vastte en rouwklaagde, in de vijfde en in de zevende maand, namelijk nu zeventig jaren, hebt u dan voor Mij, voor Mij, werkelijk gevast? Of als u at, en als u dronk, was dat niet voor uzelf, u die daar at, en u die daar dronk?", "Openb 6:14-17": "En de hemel is weggeweken, als een boek, dat opgerold wordt; en alle bergen en eilanden zijn bewogen uit hun plaatsen. En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "Matt 5:19-30": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen. Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan. U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "Joh 13:38": "Jezus antwoordde hem: Zult u uw leven voor Mij geven? Voorwaar, voorwaar, Ik zeg u: De haan zal niet kraaien, totdat u Mij driemaal verloochend zult hebben.", "Deut 6:6-9": "En deze woorden, die ik u heden gebied, zullen in uw hart zijn. En u zult ze uw kinderen inscherpen, en daarover spreken, als u in uw huis zit, en als u onderweg bent, en als u neerligt, en als u opstaat. Ook zult u ze als een teken op uw hand binden, en zij zullen u tot voorhoofdsbanden zijn tussen uw ogen.", "Hab 2:5-9": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken. Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk! Zullen niet onvoorziens opstaan die u zullen bijten, en ontwaken die u zullen doen beven, en zult u hun niet tot buit worden?", "Jer 50:6": "Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen naar de bergen gevoerd, zij gingen van berg tot heuvel, zij vergaten hun rustplaats.", "Ex 32:33-35": "Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen. Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken! Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.", "Matt 7:15": "Maar wacht u voor de valse profeten, die in schaapskleren naar u toe komen, maar van binnen zijn het roofzuchtige wolven.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "Ezech 33:27": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!", "1 Joh 2:18": "Kinderen, het is het laatste uur; en zoals u gehoord hebt, dat de antichrist komt, zo zijn er nu ook al veel antichristen gekomen; waaraan wij weten, dat het het laatste uur is.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "Jes 2:22": "Laat u dan af van de mens, wiens adem in zijn neus is, want waarin is hij te achten?", "1 Kor 10:26": "want de aarde is van de Heere, en al wat zij bevat.", "Job 39:22-28": "Zult u het paard sterkte geven? Kunt u zijn hals met donder bekleden? Zult u het beroeren als een sprinkhaan? De pracht van zijn gesnuif is een verschrikking. Het graaft in de grond, en het is vrolijk in zijn kracht; en trekt uit, de geharnaste tegemoet.", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Jer 17:8": "Want hij zal zijn als een boom die aan het water geplant is, en zijn wortels uitschiet aan een rivier, en merkt het niet wanneer er hitte komt, maar zijn loof blijft groen; en in een jaar van droogte zorgt hij niet, en houdt niet op vrucht te dragen.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Ps 19:8-12": "De wet van de HEERE is volmaakt, en zet de ziel om; de getuigenis van de HEERE is betrouwbaar, en geeft de eenvoudigen wijsheid. De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen. De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Ps 119:76-78": "Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht. Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking. Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Jer 8:12-14": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE. Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan de wijnstok, en geen vijgen aan de vijgenboom, ja, het blad is afgevallen; en de geboden die Ik hun gegeven heb, die overtreden zij. Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "Jes 44:20": "Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?", "Jer 12:11": "Men heeft het gesteld tot een woestenij, verwoest zijnde treurt het tot Mij; het hele land is verwoest, omdat er niemand is die het ter harte neemt.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Mark 9:19": "En Hij antwoordde hem en zei: O ongelovig geslacht, hoelang zal Ik nog bij u zijn? Hoelang zal Ik u nog verdragen? Breng hem bij Mij.", "Gal 6:7": "Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "Luk 14:16-24": "Maar Hij zei tegen hem: Een zeker mens bereidde een groot avondmaal, en nodigde er velen voor uit. En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd.", "Jer 15:7": "En Ik zal hen wannen met een wan, in de poorten van het land; Ik heb Mijn volk van kinderen beroofd en te gronde gericht; zij zijn van hun wegen niet teruggekeerd.", "Gal 5:10": "Ik vertrouw van u in de Heere, dat u niet anders zult denken; maar wie u in verwarring brengt, zal het oordeel dragen, wie hij ook is.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Mark 7:7": "Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen;", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Ps 52:3-6": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag. Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela.", "Joël 1:7": "Het heeft mijn wijnstok gesteld tot een verwoesting, en mijn vijgenboom tot schuim; het heeft hem helemaal ontbloot en neergeworpen, zijn ranken zijn wit geworden.", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Spr 28:11": "Een rijk man is wijs in zijn eigen ogen; maar de arme, die verstandig is, doorziet hem.", "Rom 12:16": "Wees eensgezind onder elkaar. Streef niet naar de hoge dingen, maar voeg u naar het nederige. Wees niet wijs bij uzelf.", "Ps 73:13-17": "Zeker heb ik tevergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen. Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen. Als ik zou zeggen: Ik zal ook zo spreken; zie, dan zou ik trouweloos zijn tegenover het geslacht van Uw kinderen.", "1 Kor 10:11": "En al deze dingen zijn hun overkomen tot voorbeelden; en ze zijn beschreven tot waarschuwing voor ons, over wie het einde van de eeuwen gekomen is.", "Jer 23:28": "De profeet, bij wie een droom is, vertelt de droom; en bij wie Mijn woord is, spreekt Mijn woord waarachtig; wat heeft het stro met het koren te maken? spreekt de HEERE.", "Hos 1:7": "Maar over het huis van Juda zal Ik Mij ontfermen, en Ik zal ze verlossen door de Heere, hun God, en Ik zal ze niet verlossen door boog, noch door zwaard, noch door oorlog, door paarden noch door ruiters.", "Spr 27:21": "De smeltkroes is voor het zilver, en de oven voor het goud; zo wordt een man beproefd naar zijn lof.", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "1 Joh 3:10": "Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft,", "Job 31:27": "En mijn hart verlokt is geweest in het verborgen, dat mijn hand mijn mond gekust heeft;", "Matt 23:38": "Zie, uw huis wordt aan u woest gelaten.", "Joh 8:43": "Waarom begrijpt u Mijn spraak niet? Het is omdat u Mijn woord niet kunt horen.", "Mark 4:40": "En Hij zei tegen hen: Waarom bent u zo angstig? Hoe kan het dat u geen geloof hebt?", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Spr 30:8": "Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is;", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Mark 13:21": "En dan, als iemand tegen u zal zeggen: Zie, hier is de Christus; of: Zie, Hij is daar; geloof het niet.", "Dan 10:12": "Toen zei Hij tegen mij: Wees niet bang, Daniël! Want vanaf de eerste dag dat u uw hart erop richtte om te begrijpen en om uzelf te verootmoedigen voor het aangezicht van uw God, zijn uw woorden gehoord, en om uw woorden ben Ik gekomen.", "Job 16:17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "Job 11:2": "Zou de veelheid van woorden niet beantwoord worden, en zou een klapachtig man gelijk hebben?", "1 Tim 4:7": "Maar wijs de ongoddelijke en oudwijfse verzinsels af; oefen uzelf in plaats daarvan in godvruchtigheid.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "1 Petr 2:2": "En verlang als pasgeboren kinderen naar de zuivere melk van het Woord, opdat u daardoor mag groeien;", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "Ps 119:54": "Uw inzettingen zijn mij gezangen geweest, ter plaatse van mijn vreemdelingschap.", "Klaagl 3:27": "Teth. Het is goed voor een man, dat hij het juk in zijn jeugd draagt.", "Pred 8:11": "Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.", "Matt 17:17": "Jezus antwoordde en zei: O ongelovig en verkeerd geslacht, hoe lang zal Ik nog bij u zijn, hoe lang zal Ik u nog verdragen? Breng hem hier bij Mij.", "Ezech 22:13": "Zie dan, Ik heb Mijn hand geslagen om uw gierigheid die u bedreven hebt, en om uw bloed dat in uw midden geweest is.", "1 Sam 12:25": "Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.", "Job 24:2-24": "Zij verzetten de landpalen; de kudden roven zij, en weiden ze. De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand. Zij doen de behoeftigen wijken van de weg; samen verstoppen zich de ellendigen van het land.", "Ps 33:17": "Het paard schiet tekort voor de overwinning, en bevrijdt niet door zijn grote sterkte.", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "1 Kor 10:28": "Maar als iemand tegen u zegt: Dit is afgodenoffer; eet het dan niet, omwille van hem die het u heeft laten weten, en omwille van het geweten. Want de aarde is van de Heere, en al wat zij bevat.", "Ps 85:2-14": "U bent Uw land gunstig geweest, HEERE! De gevangenschap van Jakob hebt U gekeerd. De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela. U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Matt 7:24-27": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft; En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond. En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "Joh 3:15": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ezech 3:10": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren.", "1 Joh 2:14": "Ik heb u geschreven, vaders, want u hebt Hem gekend, Die er vanaf het begin is. Ik heb u geschreven, jongemannen, want u bent sterk, en het Woord van God blijft in u, en u hebt de boze overwonnen.", "Ps 51:9-19": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw. Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt. Verberg Uw aangezicht van mijn zonden, en delg al mijn ongerechtigheden uit.", "Jer 6:23": "Boog en speer zullen zij voeren, het is een wreed volk, en zij zullen niet barmhartig zijn; hun stem zal bruisen als de zee, en op paarden zullen zij rijden; het is toegerust, als een man ten oorlog tegen u, o dochter van Sion!", "Hos 5:9": "Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.", "Luk 4:22": "En zij gaven Hem allen getuigenis, en verwonderden zich over de aangename woorden die uit Zijn mond kwamen; en zeiden: Is dit niet de zoon van Jozef?", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Ps 76:10": "Toen God opstond ten oordeel, om alle zachtmoedigen van de aarde te verlossen. Sela.", "Jes 30:15": "Want zo zegt de Heere HEERE, de Heilige van Israël: Door terugkering en rust zou u behouden worden, in stilte en in vertrouwen zou uw sterkte zijn; maar u hebt niet gewild.", "Openb 9:6": "En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "2 Kron 29:8": "Daarom is er een grote toorn van de HEERE over Juda en Jeruzalem geweest; en Hij heeft hen overgegeven aan opschudding, verwoesting en aanfluiting, zoals u ziet met uw eigen ogen.", "Deut 13:1-5": "Wanneer een profeet, of iemand die dromen droomt, in uw midden opstaat, en u een teken of wonder geeft; en dat teken of dat wonder komt uit, waarover hij tot u gesproken had, en zei: Laat ons andere goden, die u niet gekend hebt, navolgen en hen dienen; dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Ezech 22:25-31": "De samenzwering van haar profeten heerst in haar midden als een brullende leeuw die een prooi rooft; zij eten de zielen op, de schat en het kostbare nemen zij weg; haar weduwen vermenigvuldigen zij in haar midden. Haar priesters doen Mijn wet geweld aan, en zij ontheiligen Mijn heilige dingen; tussen het heilige en het onheilige maken zij geen onderscheid, en het verschil tussen het onreine en het reine geven zij niet te kennen; daarbij verbergen zij hun ogen voor Mijn sabbatten; ja, Ik word in hun midden ontheiligd. Haar vorsten zijn in haar midden als wolven die een prooi roven, om bloed te vergieten en om zielen te verderven, opdat zij gierigheid zouden plegen.", "Rom 4:24": "Maar ook om onzentwil, aan wie het zal toegerekend worden, namelijk aan hen die geloven in Hem, Die Jezus, onze Heere, uit de doden opgewekt heeft;", "Ezech 13:10-16": "Daarom, ja, daarom dat zij Mijn volk verleiden, en zeggen: Vrede, terwijl er geen vrede is; en dat de een een lemen wand bouwt, en zie, de anderen die pleisteren met loze kalk. Zeg tegen hen die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en u, grote hagelstenen, zult vallen, en een grote stormwind zal hem splijten. Zie, als die wand gevallen zal zijn, zal er dan niet tegen u gezegd worden: Waar is de pleistering waarmee u gepleisterd hebt?", "Ezech 9:10": "Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.", "2 Kron 29:34": "Doch van de priesters waren er te weinig, en zij konden niet van al de brandoffers de huid aftrekken; daarom hielpen hun broeders, de Levieten, hen, totdat het werk beëindigd was, en totdat de andere priesters zich geheiligd hadden; want de Levieten waren oprechter van hart om zich te heiligen, dan de priesters.", "1 Kron 21:17": "En David zei tegen God: Ben ik het niet, die gezegd heb, dat men het volk tellen zou? Ja, ik zelf ben het, die gezondigd en zeer kwalijk gehandeld heb; maar deze schapen, wat hebben die gedaan? O HEERE, mijn God, laat toch Uw hand tegen mij zijn, en tegen het huis van mijn vader, maar niet tegen Uw volk ter plaag.", "Jer 5:4": "Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen.", "Spr 11:24": "Er is er een die uitstrooit, aan wie nog meer toegevoegd wordt; en een die meer inhoudt dan recht is, maar het leidt tot gebrek.", "Jer 23:25": "Ik heb gehoord wat de profeten zeggen, die in Mijn Naam leugen profeteren, en zeggen: Ik heb gedroomd, ik heb gedroomd.", "Jer 3:7-10": "En Ik zei, nadat zij dit alles gedaan had: Bekeer u tot Mij; maar zij bekeerde zich niet. Dit zag haar trouweloze zuster Juda. En Ik zag, toen Ik vanwege alles waarin het afgekeerde Israël overspel had gepleegd, haar had weggestuurd en haar een scheidbrief had gegeven, dat de trouweloze Juda, haar zuster, niet vreesde, maar wegging en zelf ook hoereerde. Ja, het gebeurde, vanwege het gerucht van haar hoererij, dat zij het land ontheiligde; want zij bedreef overspel met steen en met hout.", "Jes 1:6": "Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Ps 68:21": "Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Joh 8:57": "De Joden zeiden dan tegen Hem: U bent nog geen vijftig jaar, en hebt U Abraham gezien?", "Hos 7:9-16": "Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid over hem verspreid, en hij merkt het niet. Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles. Want Efraïm is als een domme duif, zonder verstand; zij roepen Egypte aan, zij gaan heen tot Assur.", "Ezech 16:47": "Toch hebt u niet in hun wegen gewandeld, noch naar hun gruwelen gedaan; het was iets van het geringe, een verdriet; maar u hebt het meer verdorven dan zij, in al uw wegen.", "Num 21:7": "Daarom kwam het volk tot Mozes, en zij zeiden: Wij hebben gezondigd, omdat wij tegen de HEERE en tegen u gesproken hebben; bid tot de HEERE, dat Hij deze slangen van ons wegneemt. Toen bad Mozes voor het volk.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "2 Tim 3:6-9": "Want tot hen behoren zij die de huizen binnensluipen en de vrouwtjes gevangen nemen die met zonden beladen zijn en door allerlei begeerten gedreven worden, vrouwtjes die altijd leren, en nooit tot kennis van de waarheid kunnen komen. Zoals Jannes en Jambres Mozes tegenstonden, zo staan ook dezen de waarheid tegen; mensen, verdorven van verstand, verwerpelijk wat het geloof betreft.", "Matt 19:16-22": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb? En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden. Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Luk 11:28": "Maar Hij zei: Ja, gelukkiger zijn zij die het Woord van God horen, en het bewaren.", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "Pred 5:9": "Wie het geld liefheeft, wordt van het geld niet verzadigd; en wie de overvloed liefheeft, wordt van het inkomen niet verzadigd. Ook dit is nietigheid.", "Jes 9:13-15": "Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag. (De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.) Want de leiders van dit volk zijn verleiders, en die door hen geleid worden, worden ingeslokt.", "Jer 10:20": "Mijn tent is verstoord, en al mijn touwen zijn verscheurd; mijn kinderen zijn van mij uitgegaan, en zij zijn er niet; er is niemand meer, die mijn tent uitspant, en mijn gordijnen opricht.", "Deut 4:14": "Ook gebood de HEERE mij in diezelfde tijd dat ik u inzettingen en rechten zou leren; opdat u die deed in het land waar u naar toe trekt, om het in bezit te nemen.", "Jer 4:15": "Want een stem verkondigt vanaf Dan, en laat ellende horen vanaf het gebergte van Efraïm.", "Spr 1:7": "De vrees van de HEERE is het beginsel van de wetenschap; de dwazen verachten wijsheid en tucht.", "Jes 24:2": "En zoals het met het volk zal gaan, zo zal het met de priester zijn; zoals met de knecht, zo met zijn heer; zoals met de dienstmaagd, zo met haar vrouw; zoals met de koper, zo met de verkoper; zoals met de lener, zo met de ontlener; zoals met de woekeraar, zo met hem van wie hij woeker ontvangt.", "Job 18:5-21": "Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren. Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden. De stappen van zijn kracht zullen beperkt worden, en zijn eigen plan zal hem neerwerpen.", "Ezech 33:31": "En zij komen tot u, zoals het volk gewoon is te komen, en zitten voor uw aangezicht als Mijn volk, en horen uw woorden, maar zij doen ze niet; want zij spreken lieve woorden met hun mond, maar hun hart gaat hun hebzucht na.", "Matt 18:35": "Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.", "Deut 28:39-42": "Wijngaarden zult u planten en bewerken, maar u zult geen wijn drinken, noch iets vergaren; want de worm zal het opeten. Olijfbomen zult u hebben binnen al uw grondgebied, maar u zult u met olie niet zalven; want uw olijfboom zal zijn vrucht afwerpen. Zonen en dochters zult u verwekken, maar zij zullen niet voor u zijn; want zij zullen in gevangenschap gaan.", "Ps 36:2-5": "De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen. Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is. De woorden van de mond van hem zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.", "Hebr 3:8": "Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "Ezra 9:6": "En ik zei: Mijn God, ik ben beschaamd en schaamrood om mijn aangezicht tot U op te heffen, mijn God; want onze ongerechtigheden zijn vermenigvuldigd tot boven ons hoofd, en onze schuld is groot geworden tot aan de hemel.", "Jes 34:16": "Zoek in het boek van de HEERE, en lees; niet één van deze zal ontbreken, de één noch de ander zal men missen; want Mijn mond Zelf heeft het geboden, en Zijn Geest Zelf zal ze samenbrengen.", "Jer 2:8": "De priesters zeiden niet: Waar is de HEERE? en die de wet hanteerden, kenden Mij niet; en de herders overtraden tegen Mij; en de profeten profeteerden door Baäl, en wandelden naar dingen die geen nut doen.", "1 Kor 15:9": "Want ik ben de minste van de apostelen, die niet waardig ben een apostel genoemd te worden, omdat ik de Gemeente van God vervolgd heb.", "Hos 14:1": "Samaria zal woest worden, want zij is opstandig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderen zullen verpletterd, en hun zwangere vrouwen zullen opengesneden worden.", "Zach 7:7": "Zijn dit niet de woorden die de HEERE uitriep door de dienst van de vorige profeten, toen Jeruzalem bewoond en welvarend was, en haar steden rondom haar; en toen het zuiden en de laagte bewoond waren?", "1 Sam 15:23": "Want weerspannigheid is een zonde als toverij, en weerstreven is afgoderij en beeldendienst. Omdat u het woord van de HEERE verworpen hebt, zo heeft Hij u verworpen, dat u geen koning meer zult zijn.", "Amos 1:13": "Zo zegt de HEERE: Om drie overtredingen van de kinderen van Ammon, en om vier zal Ik dat niet afwenden; omdat zij de zwangere vrouwen van Gilead hebben opengesneden, om hun grondgebied te vergroten.", "Jes 33:9": "Het land treurt, het kwijnt weg; de Libanon schaamt zich, hij verwelkt; Saron is geworden als een woestijn; zo zijn Basan en Karmel geschud.", "Jes 24:17": "De angst, en de kuil, en de strik over u, o inwoners van het land!", "Openb 2:1": "Schrijf aan de engel van de gemeente van Efeze: Dit zegt Hij, Die de zeven sterren in Zijn rechterhand houdt, Die in het midden van de zeven gouden kandelaren wandelt:", "Jer 23:29": "Is Mijn woord niet zo, als een vuur? spreekt de HEERE, en als een hamer, die een steenrots verbrijzelt?", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Pred 8:12": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.", "Jer 3:1": "Men zegt: Als een man zijn vrouw verlaat, en zij gaat van hem weg en wordt de vrouw van een andere man, zal hij dan nog naar haar terugkeren? Zou dat land niet ernstig ontheiligd worden? U hebt met veel minnaars gehoereerd, en toch zou u weer naar Mij terugkeren, spreekt de HEERE.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Matt 25:30": "En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.", "Mark 10:17-22": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "2 Kor 3:15": "Maar tot op de huidige dag, telkens als Mozes gelezen wordt, ligt er een deksel op hun hart.", "Luk 19:26": "Want ik zeg u dat ieder die heeft, gegeven zal worden; maar van hem die niet heeft, zal ook wat hij heeft afgenomen worden.", "Nahum 3:3": "De ruiter steekt omhoog, zo het vlammende zwaard, als de bliksemende speer, en er zal een veelheid van verslagenen zijn, en een zware menigte dode lichamen; ja, er zal geen einde zijn aan de lichamen, men zal over hun lichamen struikelen;", "Deut 32:28": "Want zij zijn een volk, dat door raadslagen verloren gaat, en er is geen verstand in hen.", "Lev 23:26-29": "Verder sprak de HEERE tot Mozes en zei: Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren. En op diezelfde dag zult u geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht van de HEERE, uw God.", "Job 9:2": "Waarlijk, ik weet dat het zo is; want hoe zou de mens rechtvaardig zijn bij God?", "Jer 2:23": "Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait!", "Tit 1:3": "Namelijk Zijn Woord, door de prediking, die mij toevertrouwd is, naar het bevel van God, onze Zaligmaker;", "Zef 2:15": "Dit is de stad, die opspringt van vreugde, die zorgeloos woont, die in haar hart zegt: Ik ben het, en buiten mij is er niemand meer; hoe is zij geworden tot woestheid, een rustplaats voor het gedierte! Ieder die daar voorbij trekt, zal haar aanfluiten, hij zal zijn hand bewegen.", "Jer 2:24": "Zij is een woudezelin, gewend aan de woestijn, naar de lust van haar ziel schept zij de wind; wie zou haar ontmoeting kunnen afkeren? Allen die haar zoeken, zullen niet moe worden, in haar maand zullen zij haar vinden.", "Jer 25:4": "Ook heeft de HEERE tot u gezonden al Zijn dienstknechten, de profeten, vroeg opstaand en zendend (maar u hebt niet gehoord, noch uw oor geneigd om te horen);", "Ps 40:9": "Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Matt 13:39": "En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen.", "Spr 10:5": "Wie in de zomer verzamelt, is een verstandig zoon; maar wie in de oogst vast slaapt, is een zoon die beschaamd maakt.", "Ps 83:11": "die verdelgd zijn bij Endor; zij zijn geworden tot mest voor de aarde.", "Ezech 29:7": "Toen zij u bij uw hand grepen, werd u gebroken, en spleet u al hun zijden; en toen zij op u leunden, werd u verbroken, en liet u al hun lenden stilstaan.", "Micha 2:3": "Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Ps 96:2": "Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag.", "Ps 119:118": "U vertreedt allen, die van Uw inzettingen afdwalen, want hun bedrog is leugen.", "Luk 8:43": "En een vrouw die twaalf jaar lang bloedvloeiingen gehad had, en die al haar middelen van bestaan aan artsen had uitgegeven, maar door niemand genezen had kunnen worden,", "Jes 10:2": "om de armen van het recht af te wenden, en om het recht van de ellendigen van Mijn volk te roven, opdat de weduwen hun buit worden, en opdat zij de wezen mogen plunderen!", "Jes 28:24-29": "Ploegt de ploeger de hele dag om te zaaien? Opent en egt hij zijn land
