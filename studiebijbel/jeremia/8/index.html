<style>

    --bg-soft: #f2ead8; --border: var(--lightgray); --tekst: var(--darkgray);

  * { box-sizing: border-box; }
  body { font-family: var(--bodyFont); background: var(--bg); color: var(--tekst); margin: 0; line-height: 1.7; }

  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #f0e2bd; } 100% { background: var(--bg-soft); } }
  .vnr { color: #b3a184; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }
  #notenlijst { margin: 1.5rem 0 0 2.4rem; font-family: "Lora"; font-size: .82rem; color: #666; border-top: 1px solid var(--border); padding-top: .8rem; }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  .paneel.open { display: block; }
  .ntabs { display: flex; gap: .4rem; margin-bottom: .8rem; }

  .ntab.leeg { opacity: .4; cursor: default; }

rtalingen":{"SVnu":{"1":"In die tijd, spreekt de HEERE, zullen ze de beenderen van de koningen van Juda, en de beenderen van hun vorsten, en de beenderen van de priesters, en de beenderen van de profeten, en de beenderen van de inwoners van Jeruzalem, uit hun graven halen.","2":"En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn.","3":"En de dood zal boven het leven verkozen worden, door heel het overblijfsel van hen die overgebleven zijn uit dit boze geslacht, in al de plaatsen van de overgeblevenen, waarheen Ik hen verdreven zal hebben, spreekt de HEERE van de heerscharen[1].","4":"Zeg verder tegen hen: Zo zegt de HEERE: Zal men vallen, en niet weer opstaan? Zal men afkeren, en niet terugkeren?","5":"Waarom keert dit volk van Jeruzalem dan af, met een altijddurende afkering? Zij houden vast aan bedrog, zij weigeren terug te keren.","6":"Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd.","7":"Zelfs een ooievaar aan de hemel kent zijn vaste tijden, en een tortelduif, en kraanvogel, en zwaluw, nemen de tijd van hun aankomst waar; maar Mijn volk kent het recht van de HEERE niet.","8":"Hoe zegt u dan: Wij zijn wijs en de wet van de HEERE is bij ons! Zie, waarlijk, tevergeefs werkt de valse pen van de schriftgeleerden.","9":"De wijzen zijn beschaamd, verschrikt en gevangen; zie, zij hebben het woord van de HEERE verworpen; wat wijsheid zouden zij dan hebben?","10":"Daarom zal Ik hun vrouwen aan anderen geven, hun akkers aan andere bezitters; want van de kleinste tot de grootste toe pleegt ieder van hen gierigheid; van de profeet tot de priester toe bedrijft ieder van hen valsheid.","11":"En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Terwijl er geen vrede is.","12":"Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE.","13":"Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan de wijnstok, en geen vijgen aan de vijgenboom, ja, het blad is afgevallen; en de geboden die Ik hun gegeven heb, die overtreden zij.","14":"Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.","15":"Men wacht op vrede, maar er is niets goeds, op een tijd van genezing, maar zie, er is verschrikking.","16":"Vanuit Dan wordt het gesnuif van zijn paarden gehoord; het hele land beeft van het geluid van het gebries van zijn sterke dieren; en zij komen daarheen om het land op te eten en al wat het bevat, de stad en wie daarin wonen.","17":"Want zie, Ik zend slangen, basilisken onder u, waartegen geen bezwering helpt; die zullen u bijten, spreekt de HEERE.","18":"Mijn verkwikking is in droefenis; mijn hart is flauw in mij.","19":"Zie, de stem van het geschrei van de dochter van mijn volk klinkt uit een zeer ver land: Is de HEERE dan niet in Sion, is haar Koning niet bij haar? Waarom hebben zij Mij vertoornd met hun gesneden beelden, met de nietige afgoden van de vreemden?","20":"De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost.","21":"Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen.","22":"Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?"},"SV":{"1":"Ter zelfder tijd, spreekt de HEERE, zullen zij de beenderen der koningen van Juda, en de beenderen hunner vorsten, en de beenderen der priesteren, en de beenderen der profeten, en de beenderen der inwoners van Jeruzalem, uit hun graven uithalen.","2":"En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het ganse heir des hemels, die zij liefgehad, en die zij gediend, en die zij nagewandeld, en die zij gezocht hebben, en voor dewelke zij zich nedergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op den aardbodem zullen zij zijn.","3":"En de dood zal voor het leven verkoren worden, bij het ganse overblijfsel der overgeblevenen uit dit boze geslacht, in al de plaatsen der overgeblevenen, waar Ik hen henengedreven zal hebben, spreekt de HEERE der heirscharen.","4":"Zeg wijders tot hen: Zo zegt de HEERE: Zal men vallen, en niet weder opstaan? Zal men afkeren, en niet wederkeren?","5":"Waarom keert *dan* dit volk te Jeruzalem af *met* een altoosdurende afkering? Zij houden vast aan bedrog, zij weigeren weder te keren.","6":"Ik heb geluisterd en toegehoord, zij spreken dat niet recht is, er is niemand, die berouw heeft over zijn boosheid, zeggende: Wat heb ik gedaan? Een ieder keert zich om in zijn loop, gelijk een onbesuisd paard in den strijd.","7":"Zelfs een ooievaar aan den hemel weet zijn gezette tijden, en een tortelduif, en kraan, en zwaluw, nemen den tijd hunner aankomst waar; maar Mijn volk weet het recht des HEEREN niet.","8":"Hoe zegt gij dan: Wij zijn wijs en de wet des HEEREN is bij ons! Ziet, waarlijk tevergeefs werkt de valse pen der schriftgeleerden.","9":"De wijzen zijn beschaamd, verschrikt en gevangen; ziet, zij hebben des HEEREN woord verworpen, wat wijsheid zouden zij dan hebben?","10":"Daarom zal Ik hun vrouwen aan anderen geven, hun akkers aan *andere* bezitters; want van den kleinste aan tot den grootste toe pleegt een ieder van hen gierigheid; van den profeet aan tot den priester toe bedrijft een ieder van hen valsheid.","11":"En zij genezen de breuk van de dochter Mijns volks op het lichtste, zeggende: Vrede, vrede! doch daar is geen vrede.","12":"Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Ja, zij schamen zich in het minste niet, en weten niet schaamrood te worden; daarom zullen zij vallen onder de vallenden; ten tijde hunner bezoeking zullen zij struikelen, zegt de HEERE.","13":"Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan den wijnstok, en geen vijgen aan den vijgeboom, ja, het blad is afgevallen; en *de* *geboden*, *die* Ik hun gegeven heb, die overtreden zij.","14":"Waarom blijven wij zitten? Verzamelt u, en laat ons ingaan in de vaste steden, en aldaar stilzwijgen; immers heeft ons de HEERE, onze God, doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen den HEERE gezondigd hebben.","15":"Men wacht naar vrede, maar er is niets goeds, naar tijd van genezing, maar ziet, er is verschrikking.","16":"Van Dan af wordt het gesnuif zijner paarden gehoord; het ganse land beeft van het geluid der briesingen zijner sterken; en zij komen daarhenen, dat zij het land opeten en diens volheid, de stad en die daarin wonen.","17":"Want ziet, Ik zend slangen, basilisken onder ulieden, tegen dewelke geen bezwering is; die zullen u bijten, spreekt de HEERE.","18":"Mijn verkwikking is in droefenis; mijn hart is flauw in mij.","19":"Ziet, de stem van het geschrei der dochteren mijns volks is uit zeer verren lande: Is dan de HEERE niet te Sion, is haar koning niet bij haar? Waarom hebben zij Mij vertoornd met hun gesneden beelden, met ijdelheden der vreemden?","20":"De oogst is voorbijgaande, de zomer is ten einde; nog zijn wij niet verlost.","21":"Ik ben gebroken vanwege de breuk der dochter mijns volks; ik ga in het zwart, ontzetting heeft mij aangegrepen.","22":"Is er geen balsem in Gilead? Is er geen heelmeester aldaar? Want waarom is de gezondheid der dochter mijns volks niet gerezen?"},"KJV":{"1":"At that time, saith the LORD, they shall bring out the bones of the kings of Judah, and the bones of his princes, and the bones of the priests, and the bones of the prophets, and the bones of the inhabitants of Jerusalem, out of their graves:","2":"And they shall spread them before the sun, and the moon, and all the host of heaven, whom they have loved, and whom they have served, and after whom they have walked, and whom they have sought, and whom they have worshipped: they shall not be gathered, nor be buried; they shall be for dung upon the face of the earth.","3":"And death shall be chosen rather than life by all the residue of them that remain of this evil family, which remain in all the places whither I have driven them, saith the LORD of hosts.","4":"Moreover thou shalt say unto them, Thus saith the LORD; Shall they fall, and not arise? shall he turn away, and not return?","5":"Why *then* is this people of Jerusalem slidden back by a perpetual backsliding? they hold fast deceit, they refuse to return.","6":"I hearkened and heard, *but* they spake not aright: no man repented him of his wickedness, saying, What have I done? every one turned to his course, as the horse rusheth into the battle.","7":"Yea, the stork in the heaven knoweth her appointed times; and the turtle and the crane and the swallow observe the time of their coming; but my people know not the judgment of the LORD.","8":"How do ye say, We *are* wise, and the law of the LORD *is* with us? Lo, certainly in vain made he *it*; the pen of the scribes *is* in vain.","9":"The wise *men* are ashamed, they are dismayed and taken: lo, they have rejected the word of the LORD; and what wisdom","10":"Therefore will I give their wives unto others, *and* their fields to them that shall inherit *them*: for every one from the least even unto the greatest is given to covetousness, from the prophet even unto the priest every one dealeth falsely.","11":"For they have healed the hurt of the daughter of my people slightly, saying, Peace, peace; when *there is* no peace.","12":"Were they ashamed when they had committed abomination? nay, they were not at all ashamed, neither could they blush: therefore shall they fall among them that fall: in the time of their visitation they shall be cast down, saith the LORD.","13":"I will surely consume them, saith the LORD: *there shall be* no grapes on the vine, nor figs on the fig tree, and the leaf shall fade; and *the things that* I have given them shall pass away","14":"Why do we sit still? assemble yourselves, and let us enter into the defenced cities, and let us be silent there: for the LORD our God hath put us to silence, and given us water of gall to drink, because we have sinned against the LORD.","15":"We looked for peace, but no good *came; and* for a time of health, and behold trouble!","16":"The snorting of his horses was heard from Dan: the whole land trembled at the sound of the neighing of his strong ones; for they are come, and have devoured the land, and all that is in it; the city, and those that dwell","17":"For, behold, I will send serpents, cockatrices, among you, which *will* not *be* charmed, and they shall bite you, saith the LORD.","18":"*When* I would comfort myself against sorrow, my heart *is* faint","19":"Behold the voice of the cry of the daughter of my people because of them that dwell in a far country: *Is* not the LORD in Zion? *is* not her king in her? Why have they provoked me to anger with their graven images, *and* with strange vanities?","20":"The harvest is past, the summer is ended, and we are not saved.","21":"For the hurt of the daughter of my people am I hurt; I am black; astonishment hath taken hold","22":"*Is there* no balm in Gilead; *is there* no physician there? why then is not the health of the daughter of my people recovered?"}},"tsk":{"2":[{"kopje":"en het hele heerleger","refs":["Jer 19:13","Jer 44:17-19","Deut 4:19","Deut 17:3","2 Kon 17:16","2 Kon 21:3","2 Kon \"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> out of their graves:","2":"And they shall <span class=\"wl wl-kjv\" data-code=\"H7849\">spread</span> them before the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> whom they have <span class=\"wl wl-kjv\" data-code=\"H157\">loved,</span> and whom they have <span class=\"wl wl-kjv\" data-code=\"H5647\">served,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> whom they have <span class=\"wl wl-kjv\" data-code=\"H1980\">walked,</span> and whom they have <span class=\"wl wl-kjv\" data-code=\"H1875\">sought,</span> and whom they have <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped:</span> they shall not be <span class=\"wl wl-kjv\" data-code=\"H622\">gathered,</span> nor be <span class=\"wl wl-kjv\" data-code=\"H6912\">buried;</span> they shall be for <span class=\"wl wl-kjv\" data-code=\"H1828\">dung</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the earth.","3":"And <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> shall be <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> rather than <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> by all the <span class=\"wl wl-kjv\" data-code=\"H7611\">residue</span> of them that <span class=\"wl wl-kjv\" data-code=\"H7604\">remain</span> of this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H4940\">family,</span> which <span class=\"wl wl-kjv\" data-code=\"H7604\">remain</span> in all the <span class=\"wl wl-kjv\" data-code=\"H4725\">places</span> whither I have <span class=\"wl wl-kjv\" data-code=\"H5080\">driven</span> them, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","4":"Moreover thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Shall they <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> and not <span class=\"wl wl-kjv\" data-code=\"H6965\">arise?</span> shall he turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away,</span> and not return?","5":"Why then is this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> slidden <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> by a <span class=\"wl wl-kjv\" data-code=\"H5329\">perpetual</span> <span class=\"wl wl-kjv\" data-code=\"H4878\">backsliding?</span> they <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> fast <span class=\"wl wl-kjv\" data-code=\"H8649\">deceit,</span> they <span class=\"wl wl-kjv\" data-code=\"H3985\">refuse</span> to return.","6":"I <span class=\"wl wl-kjv\" data-code=\"H7181\">hearkened</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">heard,</span> but they spake not <span class=\"wl wl-kjv\" data-code=\"H1696\">aright:</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5162\">repented</span> him <span class=\"wl wl-kjv\" data-code=\"H5921\">of</span> his <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> What have I <span class=\"wl wl-kjv\" data-code=\"H6213\">done?</span> every one <span class=\"wl wl-kjv\" data-code=\"H7725\">turned</span> to his <span class=\"wl wl-kjv\" data-code=\"H4794\">course,</span> as the <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> <span class=\"wl wl-kjv\" data-code=\"H7857\">rusheth</span> into the battle.","7":"Yea, the <span class=\"wl wl-kjv\" data-code=\"H2624\">stork</span> in the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> her appointed <span class=\"wl wl-kjv\" data-code=\"H4150\">times;</span> and the <span class=\"wl wl-kjv\" data-code=\"H8449\">turtle</span> and the <span class=\"wl wl-kjv\" data-code=\"H5483\">crane</span> and the <span class=\"wl wl-kjv\" data-code=\"H5693\">swallow</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of their <span class=\"wl wl-kjv\" data-code=\"H935\">coming;</span> but my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> of the LORD.","8":"How do ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> We are <span class=\"wl wl-kjv\" data-code=\"H2450\">wise,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is with us? Lo, <span class=\"wl wl-kjv\" data-code=\"H403\">certainly</span> in <span class=\"wl wl-kjv\" data-code=\"H8267\">vain</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> he it; the <span class=\"wl wl-kjv\" data-code=\"H5842\">pen</span> of the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribes</span> is in vain.","9":"The <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> men are <span class=\"wl wl-kjv\" data-code=\"H3001\">ashamed,</span> they are <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">taken:</span> lo, they have <span class=\"wl wl-kjv\" data-code=\"H3988\">rejected</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and what wisdom","10":"Therefore will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> their <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">others,</span> and their <span class=\"wl wl-kjv\" data-code=\"H7704\">fields</span> to them that shall <span class=\"wl wl-kjv\" data-code=\"H3423\">inherit</span> them: for every one from the <span class=\"wl wl-kjv\" data-code=\"H6996\">least</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H1419\">greatest</span> is <span class=\"wl wl-kjv\" data-code=\"H1214\">given</span> to <span class=\"wl wl-kjv\" data-code=\"H1215\">covetousness,</span> from the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> every one <span class=\"wl wl-kjv\" data-code=\"H6213\">dealeth</span> falsely.","11":"For they have <span class=\"wl wl-kjv\" data-code=\"H7495\">healed</span> the <span class=\"wl wl-kjv\" data-code=\"H7667\">hurt</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7043\">slightly,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">Peace,</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">peace;</span> when there is no peace.","12":"Were they <span class=\"wl wl-kjv\" data-code=\"H3001\">ashamed</span> when they had <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination?</span> nay, they were not at <span class=\"wl wl-kjv\" data-code=\"H954\">all</span> <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed,</span> neither <span class=\"wl wl-kjv\" data-code=\"H3045\">could</span> they <span class=\"wl wl-kjv\" data-code=\"H3637\">blush:</span> therefore shall they <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> among them that <span class=\"wl wl-kjv\" data-code= sliding; that is, an exceeding obstinate back &acirc;&euro;&ldquo; sliding. Of the Hebrew word, see Psal 4. on vers.1 and 13 on vers. 2.]"}],"6":[{"catchword":null,"tekst":"I listened and hearkened, they speak that which is not right; there is no man , that repenteth him of his wickedness, saying, What have i done? Every one turneth him about to his course, as an outragious horse [That hunteth, neigheth, breaketh through, and runneth every where thorow, like a water &acirc;&euro;&ldquo; flood, from whence the Hebrew word is properly used: So the Scripture likewife compareth the neighing of an horse unto thunder, Job 39:22.] to the battel."}],"7":[{"catchword":null,"tekst":"Even a stork on the Heaven, [Heb. In the Heaven; that is, in the air] knoweth her appointed times, and a turtle &acirc;&euro;&ldquo; dove, and crane, and swallow, abserve the time of their coming : [Or, a stork knoweth by the heaven, &c. That is, by the condition and change of aite. These brute creatures know by natural instinct, which they have from God, what is for their good. Comapare Isai.1 3.] but my people know not to judgement of the LORD. [Heed not that which is prescribed unto them by God in his word. Oth. The judgement of the LORD, which by all marks and token they might percieve, that God intended to bring upon them, if they did not repent]"}],"8":[{"catchword":null,"tekst":"How do ye say then, We are wife, and the Law of the LORD is with us? Lo, certainly, in vain [Heb. For lying;that is, in vain. See 1 Sam.25.21. Or, for faksehood, falsely] worketh the false pen of Scribes. [They that ought to understand and expound the Law aright, use mere falsehood. See 1 Sam 25.21. or, for falsehood pen of the Scribes. [They that ought to understand and expound the Law aright, use mere faslehood. See Ezra 7. on.v.6. These are delivery rendered, but all comes to one sense and meaning, to wit, that they wrote in vain many things concerning the Law of God, seeing they abused all to folsehood and lies, and did not in the least according to it, nor taught others to do so. Compare Mat 23:13. Luk 11:52. Rom 2:1, &c.]"}],"9":[{"catchword":null,"tekst":"The wife men [The Scribes, that falsly boasted of thier wisdom, as is said in the former verse] are ashamed, affrigthed, and taken : [Oth, have (These) wife men made (any one) ashemed? Were (the men) frighted and taken? To wit, by their reproofs, so that they repentend of their wickedness?] Behold, thay have rejected the word of the LORD, what wisdom [Hebr.(things) wisdom] should they have then?"}],"10":[{"catchword":null,"tekst":"Therefore wll i give thier wives unto others, their fields to (other) possessors: [Compare above,c 6.12.] for from the least unto the greuest, every one of them practiseth covetousners : from the Prophet unto the Priest every one of them committeth falsehood. [See the same words, that are recorded here and in the following verses, unto vers.13. Above chap.6.13,14,15. Savin fome alteration. See the annotat. There]"}],"11":[{"catchword":null,"tekst":"And they heal the breach of the daughter of my people in the lightest (manner,) saying, Peace, peace : nt there is no peace."}],"12":[{"catchword":null,"tekst":"Are they ashamed, because they have [Or, when they have, &c,] committed abomination yea they are not in the least ashemed, and know not to blush : therefore they shall fall among them that fall, in the time of their visitation shall they stamble, saith the LORD."}],"13":[{"catchword":null,"tekst":"I will surely snatch them away, [Of the Hebrew word, see Ps...6.on.v.9. Heb. Gathering i will gather them . Oth, devour, or confume,] saith the LORD : there are no gaps on the vine, nor figs on the fig &acirc;&euro;&ldquo; tree; yea the leaf is fallen off; [This may be fo understood, that they brought fouth no good works at all, yea had no shew or appearance of any. Comapare Isai.5.1, &c. Mat 21:19. Luk 13:6,&c. Or, (with other) it may be taken for the future general defolation of the Land : or, t (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
