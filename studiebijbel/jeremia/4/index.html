alingen":{"SVnu":{"1":"Als u zich zult bekeren, Israël! spreekt de HEERE, bekeer u tot Mij; en als u uw afschuwelijke afgoden van Mijn aangezicht zult wegdoen, dwaal dan niet meer rond.","2":"Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.","3":"Want zo zegt de HEERE tegen de mannen van Juda en tegen Jeruzalem: Braak voor uzelf een braakland, en zaai niet onder de doornen.","4":"Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden.","5":"Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden!","6":"Werp de banier op naar Sion, vlucht met spoed, blijf niet staan! Want Ik breng een kwaad aan van het noorden, en een grote ondergang.","7":"De leeuw is opgekomen uit zijn schuilplaats, en de verwoester van de heidenvolken is opgetrokken, hij is uitgegaan uit zijn plaats, om uw land te maken tot een woestenij; uw steden zullen verwoest worden, zodat er niemand in woont.","8":"Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.","9":"En op die dag zal het gebeuren, spreekt de HEERE, dat het hart van de koning en het hart van de vorsten zullen bezwijken; en de priesters zullen ontzet zijn, en de profeten zullen zich verwonderen.","10":"Toen zei ik: Ach, Heere HEERE! werkelijk, U hebt dit volk en Jeruzalem grotelijks bedrogen, door te zeggen: U zult vrede hebben; terwijl het zwaard tot aan de ziel raakt.","11":"In die tijd zal tegen dit volk en tegen Jeruzalem gezegd worden: Een dorre wind van de hoge plaatsen in de woestijn, op de weg naar de dochter van Mijn volk; niet om te wannen, of om te zuiveren.","12":"Er zal Mij een wind komen, die hun te sterk zal zijn. Nu zal Ik ook een oordeel tegen hen uitspreken.","13":"Zie, hij komt op als wolken, en zijn wagens zijn als een wervelwind, zijn paarden zijn sneller dan arenden; wee ons, want wij zijn verwoest!","14":"Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?","15":"Want een stem verkondigt vanaf Dan, en laat ellende horen vanaf het gebergte van Efraïm.","16":"Vermeld het aan de volken, zie, laat het horen tegen Jeruzalem; er komen bewakers uit een ver land; en zij verheffen hun stem tegen de steden van Juda.","17":"Als wachters van de velden zijn zij rondom tegen haar; omdat zij tegen Mij opstandig geweest is, spreekt de HEERE.","18":"Uw weg en uw daden hebben u deze dingen gedaan; dit is uw slechtheid, dat het zo bitter is, dat het tot aan uw hart raakt.","19":"O mijn binnenste, mijn binnenste! ik heb weeën, o wanden van mijn hart! Mijn hart maakt getier in mij, ik kan niet zwijgen; want u, mijn ziel! hoort het geluid van de bazuin *en* het krijgsgeschreeuw.","20":"Ondergang op ondergang wordt uitgeroepen; want het hele land is verwoest; haastig zijn mijn tenten verwoest, mijn gordijnen in een ogenblik!","21":"Hoe lang zal ik de banier zien, het geluid van de bazuin horen?","22":"Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.","23":"Ik keek naar het land, en zie, het was woest en leeg; ook naar de hemel, en zijn licht was er niet.","24":"Ik keek naar de bergen, en zie, zij beefden; en alle heuvels schudden.","25":"Ik keek, en zie, er was geen mens; en alle vogels van de hemel waren weggevlogen.","26":"Ik keek, en zie, het vruchtbare land was een woestijn, en al zijn steden waren afgebroken, vanwege de HEERE, vanwege de gloed van Zijn toorn.","27":"Want zo zegt de HEERE: Dit hele land zal een woestijn zijn (toch zal Ik geen volledig einde maken);","28":"Hierom zal de aarde treuren, en de hemel daarboven zwart zijn; omdat Ik het heb gesproken, Ik heb het voorgenomen en het zal Mij niet berouwen, en Ik zal Mij daarvan niet afkeren.","29":"Van het geroep van de ruiters en boogschutters vluchten alle steden; zij gaan de wouden in, en klimmen op de rotsen; alle steden zijn verlaten, zodat niemand erin woont.","30":"Wat zult u dan doen, u die verwoest bent? Al kleedt u zich met scharlaken, al versiert u zich met gouden sieraad, al schuurt u uw ogen met blanketsel, toch zou u zich tevergeefs opmaken; de minnaars versmaden u, zij zullen uw leven zoeken.","31":"Want ik hoor een stem als van een *vrouw*, die in barensnood is, een benauwdheid als van iemand die haar eerste kind baart, de stem van de dochter van Sion; zij hijgt, zij spreidt haar handen uit, en *zegt*: O, wee mij nu, want mijn ziel is moe vanwege de moordenaars!"},"SV":{"1":"Zo gij u bekeren zult, Israël! spreekt de HEERE, bekeer u tot Mij; en zo gij uw verfoeiselen van Mijn aangezicht zult wegdoen, zo zwerft niet om.","2":"Maar zweer: *Zo* *waarachtig* *als* de HEERE leeft! in waarheid, in recht en in gerechtigheid; zo zullen zich de heidenen in Hem zegenen, en zich in Hem beroemen.","3":"Want zo zegt de HEERE tot de mannen van Juda, en tot Jeruzalem: Braakt ulieden een braakland, en zaait niet onder de doornen.","4":"Besnijdt u den HEERE en doet weg de voorhuiden uwer harten, gij mannen van Juda en inwoners van Jeruzalem! opdat Mijner grimmigheid niet uitvare als een vuur, en brande, dat niemand blussen kunne, vanwege de boosheid uwer handelingen.","5":"Verkondigt in Juda, en laat het horen te Jeruzalem, en zegt het; ja, blaast de bazuin in het land; roept met volle *stem* en zegt: Verzamelt ulieden, en laat ons ingaan in de vaste steden!","6":"Werpt de banier op naar Sion, vlucht met hopen, blijft niet staan! want Ik breng een kwaad aan van het noorden, en een grote breuk.","7":"De leeuw is opgekomen uit zijn haag, en de verderver der heidenen is opgetrokken, hij is uitgegaan uit zijn plaats, om uw land te stellen in verwoesting; uw steden zullen verstoord worden, dat er niemand in wone.","8":"Hierom, gordt zakken aan, bedrijft misbaar en huilt; want de hittigheid van des HEEREN toorn is niet van ons afgekeerd.","9":"En het zal te dier tijd geschieden, spreekt de HEERE, *dat* het hart des konings en het hart der vorsten vergaan zal; en de priesters zullen zich ontzetten, en de profeten zich verwonderen.","10":"Toen zeide ik: Ach, Heere HEERE! waarlijk, Gij hebt dit volk en Jeruzalem grotelijks bedrogen, zeggende: Gijlieden zult vrede hebben; daar het zwaard tot aan de ziel raakt.","11":"Te dier tijd zal tot dit volk en tot Jeruzalem gezegd worden: Een dorre wind van de hoge plaatsen in de woestijn, van den weg der dochter Mijns volks; niet om te wannen, noch om te zuiveren.","12":"Er zal Mij een wind komen, die hun te sterk zal zijn. Nu zal Ik ook oordelen tegen hen uitspreken.","13":"Ziet, hij komt op als wolken, en zijn wagenen zijn als een wervelwind, zijn paarden zijn sneller dan arenden; wee ons, want wij zijn verwoest!","14":"Was uw hart van boosheid, o Jeruzalem! opdat gij behouden wordt; hoe lang zult gij de gedachten uwer ijdelheid in het binnenste van u laten vernachten?","15":"Want een stem verkondigt van Dan af, en doet ellende horen van het gebergte van Efraïm.","16":"Vermeldt den volke, ziet, doet het horen tegen Jeruzalem; daar komen hoeders uit verren lande; en zij verheffen hun stem tegen de steden van Juda.","17":"Als de wachters der velden zijn zij rondom tegen haar; omdat zij tegen Mij wederspannig geweest is, spreekt de HEERE.","18":"Uw weg en uw handelingen hebben u deze dingen gedaan; dit is uw boosheid, dat het *zo* bitter is, dat het tot aan uw hart raakt.","19":"O mijn ingewand, mijn ingewand! ik heb barenswee , o wanden mijns harten! mijn hart maakt getier in mij, ik kan niet zwijgen; want gij, mijn ziel! hoort het geluid der bazuin *en* het krijgsgeschrei.","20":"Breuk op breuk wordt er uitgeroepen; want het ganse land is verstoord; haastelijk zijn mijn tenten verstoord, mijn gordijnen in een ogenblik!","21":"Hoe lang zal ik de banier zien, het geluid der bazuin horen?","22":"Zekerlijk, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij zijn niet verstandig; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.","23":"Ik zag het land aan, en ziet, het was woest en ledig; ook naar den hemel, en zijn licht was er niet.","24":"Ik zag de bergen aan, en ziet, zij beefden; en al de heuvelen schudden.","25":"Ik zag, en ziet, er was geen mens; en alle vogelen des hemels waren weggevlogen.","26":"Ik zag, en ziet, het vruchtbare land was een woestijn, en al zijn steden waren afgebroken, vanwege den HEERE, vanwege de hittigheid Zijns toorns.","27":"Want zo zegt de HEERE: Dit ganse land zal een woestijn zijn (doch Ik zal geen voleinding maken);","28":"Hierom zal de aarde treuren, en de hemel daarboven zwart zijn; omdat Ik het heb gesproken, Ik heb het voorgenomen en het zal Mij niet rouwen, en Ik zal Mij daarvan niet afkeren.","29":"Van het geroep der ruiteren en boogschutters vluchten al de steden; zij gaan in de wolken, en klimmen op de rotsen; al de steden zijn verlaten, zodat niemand in dezelve woont.","30":"Wat zult gij dan doen, gij verwoeste? Al kleeddet gij u met scharlaken, al versierdet gij u met gouden sieraad, al schuurdet gij uw ogen met blanketsel, zo zoudt gij u *toch* tevergeefs oppronken; de boelen versmaden u, zij zullen uw ziel zoeken.","31":"Want ik hoor een stem als van een *vrouw*, die in arbeid is, een benauwdheid als van een, die in des eersten kinds nood is, de stem van de dochter Sions; zij hijgt, zij breidt haar handen uit, *zeggende*: O, wee mij nu, want mijn ziel is moede vanwege de doodslagers!"},"KJV":{"1":"If thou wilt return, O Israel, saith the LORD, return unto me: and if thou wilt put away thine abominations out of my sight, then shalt thou not remove.","2":"And thou shalt swear, The LORD liveth, in truth, in judgment, and in righteousness; and the nations shall bless themselves in him, and in him shall they glory.","3":"For thus saith the LORD to the men of Judah and Jerusalem, Break up your fallow ground, and sow not among thorns.","4":"Circumcise yourselves to the LORD, and take away the foreskins of your heart, ye men of Judah and inhabitants of Jerusalem: lest my fury come forth like fire, and burn that none can quench *it*, because of the evil of your doings.","5":"Declare ye in Judah, and publish in Jerusalem; and say, Blow ye the trumpet in the land: cry, gather together, and say, Assemble yourselves, and let us go into the defenced cities.","6":"Set up the standard toward Zion: retire, stay not: for I will bring evil from the north, and a great destruction.","7":"The lion is come up from his thicket, and the destroyer of the Gentiles is on his way; he is gone forth from his place to make thy land desolate; *and* thy cities shall be laid waste, without an inhabitant.","8":"For this gird you with sackcloth, lament and howl: for the fierce anger of the LORD is not turned back","9":"And it shall come to pass at that day, saith the LORD, *that* the heart of the king shall perish, and the heart of the princes; and the priests shall be astonished, and the prophets shall wonder.","10":"Then said I, Ah, Lord GOD! surely thou hast greatly deceived this people and Jerusalem, saying, Ye shall have peace; whereas the sword reacheth unto the soul.","11":"At that time shall it be said to this people and to Jerusalem, A dry wind of the high places in the wilderness toward the daughter of my people, not to fan, nor to cleanse,","12":"*Even* a full wind from those *places* shall come unto me: now also will I give sentence","13":"Behold, he shall come up as clouds, and his chariots *shall be* as a whirlwind: his horses are swifter than eagles. Woe unto us! for we are spoiled.","14":"O Jerusalem, wash thine heart from wickedness, that thou mayest be saved. How long shall thy vain thoughts lodge within","15":"For a voice declareth from Dan, and publisheth affliction from mount Ephraim.","16":"Make ye mention to the nations; behold, publish against Jerusalem, *that* watchers come from a far country, and give out their voice against the cities of Judah.","17":"As keepers of a field, are they against her round about; because she hath been rebellious against me, saith the LORD.","18":"Thy way and thy doings have procured these *things* unto thee; this *is* thy wickedness, because it is bitter, because it reacheth unto thine heart.","19":"My bowels, my bowels! I am pained at my very heart; my heart maketh a noise in me; I cannot hold my peace, because thou hast heard, O my soul, the sound of the trumpet, the alarm of war.","20":"Destruction upon destruction is cried; for the whole land is spoiled: suddenly are my tents spoiled, *and* my curtains in a moment.","21":"How long shall I see the standard, *and* hear the sound of the trumpet?","22":"For my people *is* foolish, they have not known me; they *are* sottish children, and they have none understanding: they *are* wise to do evil, but to do good they have no knowledge.","23":"I beheld the earth, and, lo, *it was* without form, and void; and the heavens, and they *had* no light.","24":"I beheld the mountains, and, lo, they trembled, and all the hills moved lightly.","25":"I beheld, and, lo, *there was* no man, and all the birds of the heavens were fled.","26":"I beheld, and, lo, the fruitful place *was* a wilderness, and all the cities thereof were broken down at the presence of the LORD, *and* by his fierce anger.","27":"For thus hath the LORD said, The whole land shall be desolate; yet will I not make a full end.","28":"For this shall the earth mourn, and the heavens above be black: because I have spoken *it*, I have purposed *it*, and will not repent, neither will I turn back","29":"The whole city shall flee for the noi he <span class=\"wl wl-kjv\" data-code=\"H5251\">standard</span> toward <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> <span class=\"wl wl-kjv\" data-code=\"H5756\">retire,</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stay</span> not: for I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> from the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> destruction.","7":"The <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> is come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from his <span class=\"wl wl-kjv\" data-code=\"H5441\">thicket,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyer</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles</span> is on his <span class=\"wl wl-kjv\" data-code=\"H5265\">way;</span> he is gone <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> from his <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H8047\">desolate;</span> and thy <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> shall be laid <span class=\"wl wl-kjv\" data-code=\"H5327\">waste,</span> without an inhabitant.","8":"For this <span class=\"wl wl-kjv\" data-code=\"H2296\">gird</span> you with <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth,</span> <span class=\"wl wl-kjv\" data-code=\"H5594\">lament</span> and <span class=\"wl wl-kjv\" data-code=\"H3213\">howl:</span> for the <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is not turned back","9":"And it shall come to pass at that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H6\">perish,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8074\">astonished,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> shall wonder.","10":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I, <span class=\"wl wl-kjv\" data-code=\"H162\">Ah,</span> <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD!</span> <span class=\"wl wl-kjv\" data-code=\"H403\">surely</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H5377\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H5377\">deceived</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye shall have <span class=\"wl wl-kjv\" data-code=\"H7965\">peace;</span> whereas the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">reacheth</span> unto the soul.","11":"At that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> shall it be <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> and to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> A <span class=\"wl wl-kjv\" data-code=\"H6703\">dry</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> of the high <span class=\"wl wl-kjv\" data-code=\"H8205\">places</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">toward</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> not to <span class=\"wl wl-kjv\" data-code=\"H2219\">fan,</span> nor to cleanse,","12":"Even a <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> from those places shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto me: now also will I <span class=\"wl wl-kjv\" data-code=\"H1696\">give</span> sentence","13":"Behold, he shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> as <span class=\"wl wl-kjv\" data-code=\"H6051\">clouds,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots</span> shall be as a <span class=\"wl wl-kjv\" data-code=\"H5492\">whirlwind:</span> his <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> are <span class=\"wl wl-kjv\" data-code=\"H7043\">swifter</span> than <span class=\"wl wl-kjv\" data-code=\"H5404\">eagles.</span> <span class=\"wl wl-kjv\" data-code=\"H188\">Woe</span> unto us! for we are spoiled.","14":"O <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> from <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness,</span> that thou mayest be <span class=\"wl wl-kjv\" data-code=\"H3467\">saved.</span> How long shall thy <span class=\"wl wl-kjv\" data-code=\"H205\">vain</span> <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge</span> within","15":"For a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">declareth</span> from <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">publisheth</span> <span class=\"wl wl-kjv\" data-code=\"H205\">affliction</span> from <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Ephraim.","16":"Make ye <span class=\"wl wl-kjv\" data-code=\"H2142\">mention</span> to the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations;</span> behold, <span class=\"wl wl-kjv\" data-code=\"H8085\">publish</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> that <span class=\"wl wl-kjv\" data-code=\"H5341\">watchers</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> from a <span class=\"wl wl-kjv\" data-code=\"H4801\">far</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> and give <span class=\"wl wl-kjv\" data-code=\"H5414\">out</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> against the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of Judah.","17":"As <span class=\"wl wl-kjv\" data-code=\"H8104\">keepers</span> of a <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> are they against her round <span class=\"wl wl-kjv\" data-code=\"H5439\">about;</span> because she hath been <span class=\"wl wl-kjv\" data-code=\"H4784\">rebellious</span> against me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","18":"Thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4611\">doings</span> have <span class=\"wl wl-kjv\" data-code=\"H6213\">procured</span> these things unto thee; this is thy <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness,</span> because it is <span class=\"wl wl-kjv\" data-code=\"H4751\">bitter,</span> because it <span class=\"wl wl-kjv\" data-code=\"H5060\">reacheth</span> unto thine heart.","19":"My <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels,</span> my <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels!</span> I am <span class=\"wl wl-kjv\" data-code=\"H2342\">pained</span> at my <span class=\"wl wl-kjv\" data-code=\"H7023\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart;</span> my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> maketh a <span class=\"wl wl-kjv\" data-code=\"H1993\">noise</span> in me; I cannot hold my <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> because thou hast <span class=\"wl wl-kjv\" data-code=\"H8085\">heard,</span> O my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> the <span class=\"wl wl-kjv\" data-code=\"H8643\">alarm</span> of war.","20":"<span class=\"wl wl-kjv\" data-code=\"H7667\">Destruction</span> upon <span class=\"wl wl-kjv\" data-code=\"H7667\">destruction</span> is <span class=\"wl wl-kjv\" data-code=\"H7121\">cried;</span> for the whole <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled:</span> <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly</span> are my <span class=\"wl wl-kjv\" data-code=\"H168\">tents</span> <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled,</span> and my <span class=\"wl wl-kjv\" data-code=\"H3407\">curtains</span> in a moment.","21":"How long shall I <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H5251\">standard,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the trumpet?","22":"For my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> is <span class=\"wl wl-kjv\" data-code=\"H191\">foolish,</span> they have not <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> me; they are <span class=\"wl wl-kjv\" data-code=\"H5530\">sottish</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> and they have none <span class=\"wl wl-kjv\" data-code=\"H995\">understanding:</span> they are <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> to do <span class=\"wl wl-kjv\" data-code=\"H7489\">evil,</span> but to do <span class=\"wl wl-kjv\" data-code=\"H3190\">good</span> they have no knowledge.","23":"I <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and, lo, it was without <span class=\"wl wl-kjv\" data-code=\"H8414\">form,</span> and <span class=\"wl wl-kjv\" data-code=\"H922\">void;</span> and the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> and they had no light.","24":"I <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and, lo, they <span class=\"wl wl-kjv\" data-code=\"H7493\">trembled,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills</span> moved lightly.","25":"I <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld,</span> and, lo, there was no <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5775\">birds</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> were fled.","26":"I <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld,</span> and, lo, the fruitful <span class=\"wl wl-kjv\" data-code=\"H3759\">place</span> was a <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> thereof were broken <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> at the <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and by his <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> anger.","27":"For thus hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The whole <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate;</span> yet will I not <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a full end.","28":"For this shall the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H56\">mourn,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">above</span> be <span class=\"wl wl-kjv\" data-code=\"H6937\">black:</span> because I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it, I have <span class=\"wl wl-kjv\" data-code=\"H2161\">purposed</span> it, and will not <span class=\"wl wl-kjv\" data-code=\"H5162\">repent,</span> neither will I turn back","29":"The whole <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall <span class=\"wl wl-kjv\" data-code=\"H1272\">flee</span> for the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> and <span class=\"wl wl-kjv\" data-code=\"H7198\">bowmen;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into <span class=\"wl wl-kjv\" data-code=\"H5645\">thickets,</span> and climb <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3710\">rocks:</span> every <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken,</span> and not a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein.","30":"And when thou art <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled,</span> what wilt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">do?</span> Though thou <span class=\"wl wl-kjv\" data-code=\"H3847\">clothest</span> thyself with <span class=\"wl wl-kjv\" data-code=\"H8144\">crimson,</span> though thou <span class=\"wl wl-kjv\" data-code=\"H5710\">deckest</span> thee n het volgende verklaard wordt."},{"catchword":"verfoeiselen","tekst":"Uw verfoeilijke en afschuwelijke afgoderijen of drekgoden, die bij de verfoeiselen gevoegd worden; Deu 29:17 ; zie 2Ch 15:8 ."},{"catchword":"zwerft","tekst":"Op bergen en heuvelen, om afgoderij te bedrijven. Zie boven Jer 2:20 , en Jer 3:6 , Jer 3:13 ; of, zo zult gij niet omzwerven; dat is, in ballingschap gaan, en in het volgende: en gij zult zweren."}],"2":[{"catchword":"zweer","tekst":"Bewijzende daarmede dat gij mij kent en eert als uw enigen God, en dat oprechtelijke, zonder valsheid of huichelarij, vergelijk onder Jer 5:2 ."},{"catchword":"waarheid,","tekst":"Deze drie dingen begrijpen hetgeen tot den heiligen eed en den godsdienst vereist wordt, ten aanzien van God, den mens zelf en zijnen naaste, zo in het algemeen als in een bijzonder beroep; vergelijk de voorgaande aantekening en Gen 18:19 ; 1Ki 10:9 ."},{"catchword":"recht","tekst":"Of, oordeel."},{"catchword":"heidenen","tekst":"Die nu met u en mij spotten, omdat gij u zo schandelijk gedraagt, dat Ik u zelfs door de heidenen moet straffen om de eer van mijnen naam."},{"catchword":"Hem zegenen,","tekst":"Namelijk den HEERE; ziende uwe godzaligheid, en daarop Gods beloofden zegen, over u, zullen zij genodigd worden om zich tot den waren God te bekeren, en bij Hem alleen hunne welvaart te zoeken, Hem alleen die toe te schrijven, en zich in Hem gelukzalig te achten; vergelijk Gen 22:18 ; Deu 29:19 ; Psa 10:3 , en Psa 49:19-20 ."}],"3":[{"catchword":"mannen van Juda,","tekst":"Hebreeuws, den man; dat is de mannen, of een iegelijk, of die van Juda; alzo vs.4; en Jer 11:9 , en Jer 17:25 , en Jer 18:11 , en Jer 32:32 , enz."},{"catchword":"Jeruzalem","tekst":"Dat is, de inwoners van Jeruzalem, gelijk vs.4."},{"catchword":"Braakt ulieden","tekst":"Gelijk men een braakland of dresland opnieuw wel doorploegt en zuivert, opdat het daarna bekwaam zij om het goede zaad te ontvangen en goede vruchten te dragen, alzo zuivert gij u grondig van onreinheden, en wordt vernieuwd, als een nieuw schepsel, enz.; vergelijk Gal 6:15 ; Eph 4:22-24 ; Heb 6:7 ."},{"catchword":"doornen","tekst":"Vergelijk Mat 13:7 , Mat 13:22 ."}],"4":[{"catchword":"Besnijdt","tekst":"Zie Deu 10:16 , en Deu 30:6 , en wijders Gen 17 , en onder Jer 9:26 ."},{"catchword":"vuur,","tekst":"Vergelijk Deu 4:24 ."}],"5":[{"catchword":"volle stem","tekst":"Hebreeuws, roept, vervult. Van zulke samenvoeging van twee woorden, zie Psa 45:5 . De zin is: Roept ten volle uit, overal, dat alle plaatsen met uitroeping vervuld worden. Anders, roept, vergadert, of legt, maakt een volle vergadering, opdat het elkeen hore en wete, want het zal een algemene ellende zijn in het ganse land."},{"catchword":"steden","tekst":"Tegen des vijands aankomst. Hebreeuws steden der vesting."}],"6":[{"catchword":"naar Sion,","tekst":"Tot een teken dat zij allen moeten vluchten naar Jeruzalem, als een koninklijke vesting."},{"catchword":"met hopen,","tekst":"Of, sterkelijk, sterkt u tot de vlucht; alzo onder Jer 6:1 , en Isa 10:31 . Anders: hoopt u tezamen, vergadert u, kuddet u [om zo te spreken] gelijk Exo 9:19 . Te weten, om met alle man te vluchten. Het Hebreeuwse woord [dat in de voorgemelde plaatsen gevonden wordt] heeft de betekenis van vluchten, vertrekken, zich elders heen begeven, en van vergaderen."},{"catchword":"kwaad","tekst":"Dat is, groot ongeluk, jammer en ellende, gelijk de laatste woorden van vs.6 verklaren."},{"catchword":"noorden,","tekst":"Uit Chaldea, of Babylonië."},{"catchword":"breuk","tekst":"Of, verbreking; dat is ellende, jammer, verderf, verwoesting, gelijk onder vs.20, en Jer 6:1 , Jer 6:14 , en Jer 8:11 , Jer 8:21 , en Jer 10:19 , en Jer 14:17 ; vergelijk ook Jer 17:18 , en Jer 22:20 , en Jer 48:3-5 , en elders dikwijls in dit boek; alzo Isa 1:28 , enz."}],"7":[{"catchword":"leeuw","tekst":"Nebukadnezar, koning van Babel, zal met zijne heirkracht, als een leeuw uit zijn leger en hol, opbreken. Vergelijk Isa 5:26-29 ."},{"catchword":"uw land","tekst":"O Zion, of Jeruzalem, uit het voorgaande."}],"8":[{"catchword":"zakken aan,","tekst":"Zie Gen 37:34 ."}],"9":[{"catchword":"vergaan zal;","tekst":"Dat is, alle moed en courage zal hun ontvallen. Zie 2Ki 25 , enz., en onder Jer 39 , Jer 52 ."},{"catchword":"profeten","tekst":"De valse. Zie de volgende aantekening vs.10."}],"10":[{"catchword":"grotelijks","tekst":"Hebreeuws, bedriegende bedrogen; te weten door de valse profeten, wien gij toelaat het volk onder voorgeven van uw naam en dienst, alle welvaart valselijk te beloven, daar toch de uiterste ellende voorhanden is. Vergelijk 1Ki 22:21-23 , en de aantekening aldaar. Idem Eze 14:9 , en onder Jer 6:14 , en Jer 7:4 , Jer 7:10 , en Jer 23:1 ."},{"catchword":"ziel raakt","tekst":"Vergelijk onder vs.18."}],"11":[{"catchword":"dorre wind","tekst":"Of, schrale; anders: gladde; dat is, die glad en ongehinderd zal doorgaan om alles neder te vellen; versta de Babyloniërs, die van het noorden zouden komen, over het gebergte Libanon. Zie onder Jer 5:15 ."},{"catchword":"van den weg","tekst":"Dat is, naar het Joodse land en Jeruzalem."},{"catchword":"zuiveren","tekst":"Maar om te verwoesten, wil de Heere zeggen."}],"12":[{"catchword":"te sterk","tekst":"Hebreeuws, vol; dat is te sterk, zodat zij hem niet zullen kunnen verdragen en tegenstaan. Hebreeuws, voller dan zij. Anders: een volle wind van die [plaatsen], te weten die in het voorgaande zijn beschreven."},{"catchword":"oordelen","tekst":"Dat is, mijne vonnissen over hen, dat is, Ik zal recht over hen houden. Zie boven Jer 1:16 . Een ander gebruik dezer manier van spreken hebt gij onder Jer 12:1 ."}],"13":[{"catchword":"hij komt","tekst":"De Babyloniër zal u zo haastig aankomen als wolken enz."},{"catchword":"sneller","tekst":"Hebreeuws, lichter."},{"catchword":"wee ons,","tekst":"Woorden der Joden, als gevoelende Gods oordeel; of van den profeet, als beklagende de ellende van het volk."}],"14":[{"catchword":"gedachten","tekst":"Dat is: uw ijdele gedachten, waarmede  tijding van een andere; vergelijk Psa 42:8 en zie boven vs.6."},{"catchword":"tenten","tekst":"Dat is, woonplaatsen van mijn volk."},{"catchword":"ogenblik","tekst":"Dat is, zeer haastelijk."}],"22":[{"catchword":"wijs zijn","tekst":"Arglistig en wel ervaren in het kwade. Vergelijk 2Sa 13:3 ."},{"catchword":"goed te doen","tekst":"Vergelijk Amo 3:10 ."}],"23":[{"catchword":"land aan,","tekst":"Het Joodse land."},{"catchword":"woest","tekst":"Zie Gen 1:2 . Dit is een figuurlijke beschrijving en levendige vertoning van een algemene en verschrikkelijke verwoesting en ruïne van het Joodse land."},{"catchword":"licht","tekst":"Dat is, de hemel was donker en zwart, vergelijk Isa 5:30 , en Isa 50:3 , onder vs.28."}],"24":[{"catchword":"schudden","tekst":"Hebreeuws, maakten zich licht, of snel, dat is bewogen zich snellijk."}],"25":[{"catchword":"weggevlogen","tekst":"Hebreeuws, weggezworven, of weggevloden. Zie onder Jer 9:10 , en Jer 50:3 ."}],"26":[{"catchword":"vruchtbare land","tekst":"Hebreeuws, Karmel; zie boven Jer 2:7 ."},{"catchword":"zijn steden","tekst":"Van het vruchtbare land, die daarin of aan gelegen waren"},{"catchword":"den HEERE,","tekst":"Hebreeuws, vanwege het aangezicht des Heeren. Hetwelk enigen nemen voor zijn toorn, zijn toornig aangezicht; zie boven Jer 3:12 ."}],"27":[{"catchword":"woestheid zijn","tekst":"Dat is, overal zeer verwoest."},{"catchword":"voleinding","tekst":"Of, vernieling, vertering; vergelijk onder Jer 5:10 , Jer 5:18 ; Eze 11:13 , en Eze 20:17 ; dat is, Ik zal het niet gans uitmaken, maar mijne genade nog onder mijn toorn mengen, en mij een overblijfsel en zaad behouden in Jakob; zie onder Jer 30:11 , en Jer 46:28 . Dit voegt God hier in, onder deze verschrikkelijk dreigementen, tot troost der uitverkorenen en gelovigen; sommigen verstaan dat de zin dezer woorden is: Het zal hiermede nog niet gedaan zijn, mijn toorn en oordeel zal hiermede nog geen einde hebben, maar wijders voortgaan, en lang duren over dit land, waarop zij dan passen den rouw der aarde en des hemels, waarvan in het volgende. Deze manier van spreken wordt in een anderen zin gebruikt van zondaars, die ten uiterste misdaan en de maat vervuld hebben; zie Gen 18:21 ."}],"28":[{"catchword":"zwart zijn;","tekst":"Als rouwdragende; zie Psa 35:14 ."}],"29":[{"catchword":"geroep","tekst":"Hebreeuws, stem."},{"catchword":"vluchten","tekst":"Hebreeuws, is al de stad, of de ganse stad vluchtende; dat is de stadslieden of inwoners der steden [gelijk de volgende woorden uitwijzen] zullen vluchten, en zo in het volgende."},{"catchword":"wolken,","tekst":"Dat is, op de hoogten der bergen, die tot aan de wolken raken, om zich aldaar te verbergen. Anders: in dikke, of dichte plaatsen; als bosjes, heggen."}],"30":[{"catchword":"gij verwoeste?","tekst":"Dochter Zions, gelijk in vs.31, dat is, gij die verstoord, of verwoest zult worden."},{"catchword":"kleeddet","tekst":"Op zijn afgodisch en heidens, om uwen vijanden te behagen en te vermurwen; gelijk de hoeren zich oppronken om de boelen te behagen."},{"catchword":"schuurdet","tekst":"Al versierdet en blankettet gij u zozeer en dikwijls, dat uw aangezicht of wangen daarvan kwamen te splijten en te scheuren."},{"catchword":"boelen","tekst":"De Babyloniërs, die u zoeken machtig te worden."},{"catchword":"ziel zoeken","tekst":"Dat is, naar het leven staan. Zie 2Sa 4:8 ."}],"31":[{"catchword":"hijgt,","tekst":"Anders: kermt, klaagt, vanwege den overlast en de benauwdheid."},{"catchword":"breidt","tekst":"Als die plegen te doen, die in groten rouw en de uiterste noden zijn."},{"catchword":"de doodslagers","tekst":"De Babyloniërs."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"If thou will return, Israel, saith the LORD, return unto me :[As if God should say: If thou at any time art minded to return, as thou often times pretendest thou shalt mind to do , then do it now , and do it sincerely without hypocrisie and mixture of any Idolatry, as is shewed in the sequel] and if thou will put away thine abominations[ that is, thy abominable and horrible Idolatry,or dung-gods which are joyned with the abominations, Deuteronom,29.17. See 2 Chron.15 on verse 8.] from my face , then wander not about.[ Upon mountains and hills , to commit idolatry. See above , chap 2.20. and 3.6,13. Or, then thou shalt not wander about ; that is ,go into exile; and in the sequel ,And thou shalt swear.]"}],"2":[{"catchword":null,"tekst":"But swear (As true as as) the LORD liveth [shewing thereby that thou knowest and honourest me as thine onely God, and that sincerely, withou falshood or hypocrise, as followeth. Compare below chap 5.2 ] in truth, in judgement and in righteousness: [These three things comprehend all that is requisite to an holy oath and worship of God, in respect to God , a mans self and his neighbour , both in his general and particular calling .Compare the former annotat. And Genes.18. On verse 19, 1 Kings 10 o verse 9 .]so shall the heathen [ that now mock both at you and me because you behave yourself so shamefully as that lam fain to punish you by the heathen themselves by the honour of my Name.bless themselves in him , and glory in him [Namely, the LORD; beholding your piety , and there upon God&rsquo;s blessing upon you , they will be invited to turn unto the true God , and to seek their happinesse onely in him, to ascribe it to him alone , and to account themselves blessed and happy in him Compare Gen.22 on verse 18 , Deut. 29.19 Psal 10.3 and 49.19,20.]"}],"3":[{"catchword":null,"tekst":"For thus saith the LORD to the men of Juda ,[Hebr, the men, etc. That is, the men, or every man , or those of Juda , so verse 4 and chap.11.9 and 17.25. and 18.11 and 32,33, & c.] and to Jerusalem [ that is , the inhabitants of Jerusalem,as verse 4.]Break up unto yourselves a fallow ground :[As a fallow ground must be well ploughed up and cleansed anew , that it may be fit to receive good feed, and to bear good fruit : so purge yourselvev throughly from all uncleanesse, // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
