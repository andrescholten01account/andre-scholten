e hart.", "8": "En zoals de slechte vijgen, die vanwege de slechtheid niet gegeten kunnen worden (want zo zegt de HEERE), zo zal Ik Zedekia, de koning van Juda, maken, alsook zijn vorsten, en het overblijfsel van Jeruzalem, die in dit land zijn overgebleven, en die in het land Egypte wonen;", "9": "En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben;", "10": "En Ik zal onder hen zenden het zwaard, de honger en de pest, totdat zij verteerd zullen zijn uit het land, dat Ik hun en hun vaderen gegeven had."}, "SV": {"1": "De HEERE deed mij zien, en ziet, er waren twee vijgenkorven, gezet voor den tempel des HEEREN; nadat Nebukadnezar, koning van Babel, gevankelijk had weggevoerd Jechonia, den zoon van Jojakim, den koning van Juda, mitsgaders de vorsten van Juda, en de timmerlieden, en de smeden van Jeruzalem, en hen te Babel gebracht had.", "2": "*In* den enen korf waren zeer goede vijgen, als de eerste rijpe vijgen zijn; maar *in* den anderen korf waren zeer boze vijgen, die vanwege de boosheid niet konden gegeten worden.", "3": "En de HEERE zeide tot mij: Wat ziet gij, Jeremia? En ik zeide: Vijgen; de goede vijgen zijn zeer goed, en de boze zeer boos, die vanwege de boosheid niet kunnen gegeten worden.", "4": "Toen geschiedde des HEEREN woord tot mij, zeggende:", "5": "Zo zegt de HEERE, de God Israëls: Gelijk die goede vijgen, alzo zal Ik kennen de gevankelijk weggevoerden van Juda, die Ik uit deze plaats naar het land der Chaldeen heb weggeschikt, ten goede.", "6": "En Ik zal Mijn oog op hen stellen ten goede, en zal hen wederbrengen in dit land; en Ik zal hen bouwen, en niet afbreken; en zal hen planten, en niet uitrukken.", "7": "En Ik zal hun een hart geven om Mij te kennen, dat Ik de HEERE ben; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn; want zij zullen zich tot Mij met hun ganse hart bekeren.", "8": "En gelijk de boze vijgen, die vanwege de boosheid niet kunnen gegeten worden (want aldus zegt de HEERE), alzo zal Ik maken Zedekia, den koning van Juda, mitsgaders zijn vorsten, en het overblijfsel van Jeruzalem, die in dit land zijn overgebleven, en die in Egypteland wonen;", "9": "En Ik zal hen overgeven tot een beroering ten kwade, allen koninkrijken der aarde; tot smaadheid, en tot een spreekwoord, tot een spotrede, en tot een vloek, in al de plaatsen, waarhenen Ik hen gedreven zal hebben;", "10": "En Ik zal onder hen zenden het zwaard, den honger en de pestilentie, totdat zij verteerd zullen zijn uit het land, dat Ik hun en hun vaderen gegeven had."}, "KJV": {"1": "The LORD shewed me, and, behold, two baskets of figs *were* set before the temple of the LORD, after that Nebuchadrezzar king of Babylon had carried away captive Jeconiah the son of Jehoiakim king of Judah, and the princes of Judah, with the carpenters and smiths, from Jerusalem, and had brought them to Babylon.", "2": "One basket *had* very good figs, *even* like the figs *that are* first ripe: and the other basket *had* very naughty figs, which could not be eaten, they were so bad.", "3": "Then said the LORD unto me, What seest thou, Jeremiah? And I said, Figs; the good figs, very good; and the evil, very evil, that cannot be eaten, they are so evil.", "4": "Again the word of the LORD came unto me, saying,", "5": "Thus saith the LORD, the God of Israel; Like these good figs, so will I acknowledge them that are carried away captive of Judah, whom I have sent out of this place into the land of the Chaldeans for *their* good.", "6": "For I will set mine eyes upon them for good, and I will bring them again to this land: and I will build them, and not pull *them* down; and I will plant them, and not pluck *them* up.", "7": "And I will give them an heart to know me, that I *am* the LORD: and they shall be my people, and I will be their God: for they shall return unto me with their whole heart.", "8": "And as the evil figs, which cannot be eaten, they are so evil; surely thus saith the LORD, So will I give Zedekiah the king of Judah, and his princes, and the residue of Jerusalem, that remain in this land, and them that dwell in the land of Egypt:", "9": "And I will deliver them to be removed into all the kingdoms of the earth for *their* hurt, *to be* a reproach and a proverb, a taunt and a curse, in all places whither I shall drive", "10": "And I will send the sword, the famine, and the pestilence, among them, till they be consumed from off the land that I gave unto them and to their fathers."}}, "tsk": {"1": [{"kopje": "HEERE", "refs": ["Amos 3:7", "Amos 7:1", "Amos 7:4", "Amos 7:7", "Amos 8:1", "Zach 1:20", "Zach 3:1"]}, {"kopje": "twee", "refs": ["Deut 26:2-4"]}, {"kopje": "nadat", "refs": ["Jer 22:24-28", "Jer 29:2", "2 Kon 24:12-16", "2 Kron 36:10", "Ezech 19:9"]}, {"kopje": "smeden", "refs": ["1 Sam 13:19", "1 Sam 13:20"]}], "2": [{"kopje": "In de ene korf", "refs": ["Jer 24:5-7", "Hos 9:10", "Micha 7:1"]}, {"kopje": "eerste rijpe", "refs": ["Jes 28:4"]}, {"kopje": "slechte", "refs": ["Jer 24:8-10", "Jes 5:4", "Jes 5:7", "Ezech 15:2-5", "Mal 1:12-14", "Matt 5:13"]}], "3": [{"kopje": "Wat", "refs": ["Jer 1:11-14", "1 Sam 9:9", "Amos 7:8", "Amos 8:2", "Zach 4:2", "Zach 5:2", "Zach 5:5-11", "Matt 25:32", "Matt 25:33"]}], "5": [{"kopje": "erkennen", "refs": ["Nahum 1:7", "Zach 13:9", "Matt 25:12", "Joh 10:27", "1 Kor 8:3", "Gal 4:9", "2 Tim 2:19"]}, {"kopje": "de weggevoerden", "refs": ["Deut 8:16", "Ps 94:12-14", "Ps 119:67", "Ps 119:71", "Rom 8:28", "Hebr 12:5-10", "Openb 3:19"]}], "6": [{"kopje": "Ik zal", "refs": ["Jer 21:10", "Deut 11:12", "2 Kron 16:9", "Neh 5:19", "Job 33:27", "Job 33:28", "Ps 34:16", "1 Petr 3:12"]}, {"kopje": "en zal hen terugbrengen", "refs": ["Jer 12:15", "Jer 23:3", "Jer 29:10", "Jer 32:37", "Ezech 11:15-17", "Ezech 36:24"]}, {"kopje": "Ik zal hen bouwen", "refs": ["Jer 1:10", "Jer 18:7-9", "Jer 32:41", null}], "kinderen": []}]}]}], "torrey": [{"topic": "Wicked, The, Are Compared To", "href": "../../torrey/w/#t-wicked-the-are-compared-to", "kinderen": [{"label": "Evil figs", "href": "../../torrey/w/?hl=Jer.24.8#i23155", "refs": [{"disp": "Jer 24:8", "href": "../../jeremia/24/#v8", "ref": "Jer 24:8", "svLabel": null}], "kinderen": []}]}]}, "9": {"nave": [{"topic": "Dispersion", "href": "../../nave/d/#t-dispersion", "kinderen": [{"label": "Of the Jews, foretold", "href": "../../nave/d/?hl=Jer.24.9#i5536", "refs": [{"disp": "Jer 16:15", "href": "../../jeremia/16/#v15", "ref": "Jer 16:15", "svLabel": null}, {"disp": "Jer 24:9", "href": "../../jeremia/24/#v9", "ref": "Jer 24:9", "svLabel": null}, {"disp": "Joh 7:35", "href": "../../johannes/7/#v35", "ref": "Joh 7:35", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ef 4:7": "Maar aan ieder van ons is de genade gegeven, naar de maat van de gave van Christus.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Jer 50:5": "Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten.", "Hebr 6:1": "Laten wij daarom het beginsel van de leer van Christus achterlaten en doorgaan tot de volmaaktheid; niet opnieuw het fundament leggend van de bekering van dode werken en van het geloof in God,", "Jes 44:22": "Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.", "Dan 12:1": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "Jer 30:22": "En u zult Mij tot een volk zijn, en Ik zal u tot een God zijn.", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Jona 1:1": "Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Jer 29:22": "En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;", "Mark 1:4": "Johannes doopte in de woestijn en predikte de doop van bekering tot vergeving van de zonden.", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Ex 8:9": "Doch Mozes zei tegen Farao: Heb de eer boven mij! Tegen wanneer zal ik voor u, en voor uw knechten, en voor uw volk, vurig bidden, om deze kikkers van u en van uw huizen te verdelgen, zodat zij alleen in de rivier overblijven?", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "Deut 10:16": "Besnijd dan de voorhuid van uw hart, en verhard uw nek niet meer.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Jes 26:2": "Doe de poorten open, zodat het rechtvaardige volk daarin gaat, dat de trouw bewaart.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "Rom 1:20": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Luk 12:12": "Want de Heilige Geest zal u op datzelfde moment leren wat u moet spreken.", "Ezech 17:11-21": "Daarna kwam het woord van de HEERE tot mij en zei: Zeg nu tegen dat opstandige huis: Weet u niet wat deze dingen betekenen? Zeg: Zie, de koning van Babel is naar Jeruzalem gekomen, en heeft haar koning genomen, en haar vorsten, en heeft ze naar zich toe gevoerd naar Babel. Daartoe heeft hij van het koninklijke zaad genomen, en daarmee een verbond gemaakt, en heeft hem tot een eed gebracht, en de machtigen van het land heeft hij weggenomen;", "1 Petr 1:7": "opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Ex 4:11": "En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE?", "1 Sam 7:3": "Toen sprak Samuël tot heel het huis van Israël en zei: Als u zich met heel uw hart tot de HEERE bekeert, doe dan de vreemde goden uit uw midden weg, ook de Astharoths; en richt uw hart op de HEERE, en dien Hem alleen, dan zal Hij u uit de hand van de Filistijnen rukken.", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Hos 14:2": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.", "1 Kon 9:7": "Dan zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken.", "2 Tim 1:7": "Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid.", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Hebr 12:5-11": "En u bent de vermaning vergeten, die tot u spreekt als tot zonen: Mijn zoon, acht de kastijding van de Heere niet klein, en bezwijk niet als u door Hem bestraft wordt; Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt. Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Deut 11:12": "Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar.", "2 Kor 1:22": "Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Luk 1:76-79": "En u, kind, zult een profeet van de Allerhoogste genoemd worden; want u zult voor het aangezicht van de Heere uit gaan, om Zijn wegen te bereiden; om Zijn volk kennis van het heil te geven, in vergeving van hun zonden, door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Zach 3:1": "Daarna liet Hij mij Jozua zien, de hogepriester, staande voor het aangezicht van de Engel van de HEERE; en de satan stond aan zijn rechterhand, om hem te weerstaan.", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "Jer 3:14-18": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen. En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand. En het zal gebeuren, wanneer u meer geworden en vruchtbaar geworden bent in het land, in die dagen, spreekt de HEERE, dat zij niet meer zullen zeggen: De ark van het verbond van de HEERE, en zij zal ook niet in het hart opkomen; en zij zullen er niet aan denken, en haar niet bezoeken, en zij zal niet opnieuw gemaakt worden.", "Jer 24:5-7": "Zo zegt de HEERE, de God van Israël: Zoals die goede vijgen, zo zal Ik de weggevoerden van Juda erkennen, die Ik uit deze plaats naar het land van de Chaldeeën heb weggestuurd, tot hun eigen goed. En Ik zal Mijn oog op hen richten tot hun goed, en zal hen terugbrengen in dit land; en Ik zal hen bouwen, en niet afbreken; en Ik zal hen planten, en niet uitrukken. En Ik zal hun een hart geven om Mij te kennen, dat Ik de HEERE ben; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn; want zij zullen zich tot Mij bekeren met hun hele hart.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Zach 1:20": "En de HEERE toonde mij vier smeden.", "Jer 22:24-28": "Zo waarachtig als Ik leef, spreekt de HEERE, al was Chonia, de zoon van Jojakim, de koning van Juda, een zegelring aan Mijn rechterhand, toch zal Ik u vandaar wegrukken. En Ik zal u geven in de hand van hen die uw leven zoeken, en in de hand van hen voor wier gezicht u beeft, namelijk in de hand van Nebukadnezar, de koning van Babel, en in de hand van de Chaldeeën. En Ik zal u, en uw moeder, die u gebaard heeft, wegwerpen in een ander land, waarin u niet geboren bent, en daar zult u sterven.", "Joh 10:27": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij.", "Matt 18:3": "en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan.", "1 Kor 8:3": "Maar als iemand God liefheeft, die is door Hem gekend.", "Jer 1:11-14": "Verder kwam het woord van de HEERE tot mij, en zei: Wat ziet u, Jeremia? En ik zei: Ik zie een amandelroede. En de HEERE zei tegen mij: U hebt goed gezien; want Ik zal wakker zijn over Mijn woord, om dat te doen. En het woord van de HEERE kwam voor de tweede keer tot mij, en zei: Wat ziet u? En ik zei: Ik zie een ziedende pot, waarvan het voorste deel tegen het noorden gekeerd is.", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "1 Sam 3:20": "En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.", "Rom 6:3-23": "Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn? Wij zijn dan met Hem begraven door de doop in de dood, opdat, zoals Christus uit de doden opgewekt is tot de heerlijkheid van de Vader, zo ook wij in nieuwheid van leven zouden wandelen. Want als wij met Hem één geworden zijn in de gelijkmaking van Zijn dood, dan zullen wij het ook zijn in de gelijkmaking van Zijn opstanding;", "Deut 30:8-10": "U dan zult zich bekeren, en de stem van de HEERE gehoorzaam zijn, en u zult doen al Zijn geboden, die ik u heden gebied. En de HEERE, uw God, zal u overvloed geven in al het werk van uw hand, in de vrucht van uw buik, en in de vrucht van uw vee, en in de vrucht van uw land, ten goede; want de HEERE zal Zich weer verblijden over u ten goede, zoals Hij Zich over uw vaderen verblijd heeft; wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, door Zijn geboden en Zijn inzettingen te houden, die in dit boek van de wet geschreven zijn; wanneer u zich zult bekeren tot de HEERE, uw God, met uw ganse hart en met uw ganse ziel.", "Job 36:8-10": "En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben; En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.", "Job 36:10": "En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Num 12:6-8": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "1 Kor 11:32": "Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "2 Kron 36:10": "En bij de terugkeer van het jaar zond koning Nebukadnezar heen, en liet hem naar Babel halen, met de kostbare voorwerpen van het huis van de HEERE; en hij maakte zijn broer Zedekia koning over Juda en Jeruzalem.", "Jes 30:18-26": "En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten. Want het volk zal in Sion wonen, te Jeruzalem; u zult helemaal niet wenen; zeker zal Hij u genadig zijn op de stem van uw geroep; zodra Hij het horen zal, zal Hij u antwoorden. De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;", "Mark 4:26-29": "En Hij zei: Zo is het Koninkrijk van God, alsof een mens het zaad in de aarde wierp; en vervolgens sliep en opstond, nacht en dag; en het zaad ontkiemde en groeide op, terwijl hij zelf niet wist hoe. Want de aarde brengt uit zichzelf vruchten voort: eerst het kruid, daarna de aar, daarna het volle koren in de aar.", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Ps 51:4": "Was mij goed van mijn ongerechtigheid, en reinig mij van mijn zonde.", "Luk 18:10-14": "Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar. Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Deut 29:4": "Maar de HEERE heeft u geen hart gegeven om te verstaan, geen ogen om te zien, en geen oren om te horen, tot op deze dag.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Hebr 8:10": "Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "Hand 11:17": "Als God hun dan dezelfde gave gegeven heeft als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik dan, dat ik God zou kunnen tegenhouden?", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Joh 10:10": "De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Ezech 36:29": "En Ik zal u verlossen van al uw onreinheden; en Ik zal roepen tot het koren, en zal dat vermenigvuldigen, en Ik zal geen honger op u leggen.", "Joh 1:1": "In het begin was het Woord, en het Woord was bij God, en het Woord was God.", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "Ezech 3:14": "Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.", "Jer 3:12-14": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden. Erken alleen uw ongerechtigheid, dat u tegen de HEERE, uw God, overtreden hebt, en uw wegen verspreid hebt naar de vreemden, onder elke groene boom, maar u bent Mijn stem niet gehoorzaam geweest, spreekt de HEERE. Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.", "Joh 3:3-8": "Jezus antwoordde en zei tegen hem: Voorwaar, voorwaar, Ik zeg u: Als iemand niet opnieuw geboren wordt, kan hij het Koninkrijk van God niet zien. Nicodemus zei tegen Hem: Hoe kan een mens geboren worden als hij al oud is? Kan hij soms voor de tweede keer in de buik van zijn moeder ingaan en geboren worden? Jezus antwoordde: Voorwaar, voorwaar, Ik zeg u: Als iemand niet geboren wordt uit water en Geest, kan hij het Koninkrijk van God niet binnengaan.", "2 Kron 30:6-9": "De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië. En wees niet als uw vaders en als uw broeders, die tegen de HEERE, de God van hun vaderen, ontrouw geweest zijn; daarom heeft Hij hen overgegeven tot verwoesting, zoals u ziet. Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Jes 37:32": "Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "Luk 13:1-5": "En er waren in diezelfde tijd enigen aanwezig, die Hem vertelden van de Galileeërs, van wie Pilatus het bloed met hun offers gemengd had. En Jezus antwoordde en zei tegen hen: Denkt u dat deze Galileeërs meer zondaars zijn geweest dan alle andere Galileeërs, omdat zij zulke dingen hebben geleden? Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Joh 1:16": "En uit Zijn volheid hebben wij allen ontvangen, ook genade voor genade.", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Zach 5:5-11": "En de Engel Die met mij sprak, ging naar buiten, en zei tegen mij: Hef nu uw ogen op, en zie wat dit is, dat er tevoorschijn komt. En ik zei: Wat is dat? En Hij zei: Dit is een efa die tevoorschijn komt. Verder zei Hij: Dit is het beeld van hen in het hele land. En zie, een plaat van lood werd opgeheven, en er was een vrouw, zittend midden in de efa.", "Jes 52:6": "Daarom zal Mijn volk, daarom zal het Mijn Naam op die dag kennen, dat Ik het Zelf ben, Die spreekt: Zie, hier ben Ik.", "Ezech 36:26": "En Ik zal u een nieuw hart geven, en zal een nieuwe geest geven in het binnenste van u; en Ik zal het stenen hart uit uw vlees wegnemen, en zal u een vlezen hart geven.", "Jer 19:8": "En Ik zal deze stad zetten tot een ontzetting en tot een aanfluiting; ieder die haar voorbijgaat, zal zich ontzetten en fluiten over al haar plagen.", "Ps 109:18": "En laat hij bekleed zijn met de vloek, als met zijn kleed, en laat die gaan tot in zijn binnenste als het water, en als de olie in zijn beenderen.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Jes 4:3": "En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;", "Job 34:31": "Zeker heeft hij tot God gezegd: Ik heb Uw straf verdragen, ik zal het niet verderven.", "Jer 34:17": "Daarom zegt de HEERE zo: U hebt naar Mij niet gehoord, om vrijheid uit te roepen, ieder voor zijn broeder, en ieder voor zijn naaste; zie, zo roep Ik tegen u uit, spreekt de HEERE, een vrijheid ten zwaard, ter pest, en ten honger, en zal u overgeven ter opschudding aan alle koninkrijken van de aarde.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Ezech 16:60-63": "Toch zal Ik denken aan Mijn verbond met u, in de dagen van uw jeugd, en Ik zal met u een eeuwig verbond oprichten. Dan zult u aan uw wegen denken en beschaamd zijn, wanneer u uw zusters, die groter zijn dan u, samen met hen die kleiner zijn dan u, aannemen zult; want Ik zal ze u geven tot dochters, maar niet op grond van uw verbond. Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben;", "2 Kor 4:11": "Want wij, die leven, worden altijd om Jezus' wil in de dood overgegeven, opdat ook het leven van Jezus in ons sterfelijk vlees openbaar zou worden.", "Deut 28:37": "En u zult tot een schrik, tot een spreekwoord en tot een spotlied worden, onder al de volken waarheen de HEERE u leiden zal.", "Ps 66:10": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert;", "Deut 30:2-5": "En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had. Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.", "Ezech 5:12": "Een derde deel van u zal door de pest sterven, en zal door honger in het midden van u omkomen; en een derde deel zal door het zwaard vallen rondom u; en een derde deel zal Ik naar alle windrichtingen verstrooien, en Ik zal het zwaard achter hen uittrekken.", "Ps 22:28": "Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden.", "Ezech 15:2-5": "Mensenkind, wat is het hout van de wijnstok meer dan alle hout, of de wijnrank meer dan dat onder het hout van een woud is? Wordt daarvan hout genomen, om een stuk werk te maken? Neemt men daarvan een pin, om er enig vat aan te hangen? Zie, het wordt aan het vuur overgegeven, opdat het verteerd wordt; het vuur verteert beide einden ervan, en het middelste ervan wordt verbrand; zou het deugen tot een stuk van het werk?", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Hos 9:10": "Ik vond Israël als druiven in de woestijn, Ik zag uw vaders als de eerste vrucht aan de vijgenboom in haar begintijd; maar zij gingen naar Baäl-peor, en zonderden zich af tot die schande, en werden helemaal verfoeilijk, net als datgene wat zij liefhadden.", "Joh 9:3": "Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Micha 2:12": "Zeker zal Ik u, o Jakob, geheel verzamelen; zeker zal Ik het overblijfsel van Israël bijeenbrengen; Ik zal het samen bijeenzetten als schapen van Bozra; als een kudde in het midden van haar kooi zullen zij dreunen van de mensenmenigte.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Klaagl 2:15-17": "Samech. Allen die voorbijgaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter van Jeruzalem, en zeggen: Is dit die stad, waarvan men zei, dat zij volkomen was van schoonheid, een vreugde van de hele aarde? Pe. Al uw vijanden sperren hun mond open over u, zij fluiten en knersen met de tanden, zij zeggen: Wij hebben haar verslonden; dit is zeker de dag die wij verwacht hebben, wij hebben hem gevonden, wij hebben hem gezien. Ain. De HEERE heeft gedaan wat Hij Zich had voorgenomen, Hij heeft Zijn woord vervuld, dat Hij bevolen had van oude dagen af; Hij heeft afgebroken en niet gespaard; en Hij heeft de vijand over u verblijd, Hij heeft de hoorn van uw tegenstanders verhoogd.", "Jak 5:19": "Broeders, als iemand onder u van de waarheid is afgedwaald, en iemand hem bekeert,", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Matt 13:11": "En Hij antwoordde en zei tegen hen: Omdat het u gegeven is de verborgenheden van het Koninkrijk der hemelen te kennen, maar hun is het niet gegeven.", "Amos 7:1": "De Heere HEERE liet mij dit zien: zie, Hij vormde sprinkhanen, in het begin van het opkomen van het nagras; en zie, het was het nagras, na het maaien van de koning.", "Luk 18:17": "Voorwaar, Ik zeg u: wie het Koninkrijk van God niet ontvangt als een kind, zal daar geenszins ingaan.", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Ps 87:4": "Ik zal Rahab en Babel vermelden, onder hen die Mij kennen; zie, de Filistijn en de Tyriër, met de Moor, deze is daar geboren.", "1 Petr 2:3": "Als u tenminste geproefd hebt dat de Heere goedertieren is.", "Joh 16:13": "Maar wanneer Hij zal gekomen zijn, namelijk de Geest van de waarheid, zal Hij u in alle waarheid leiden; want Hij zal niet uit Zichzelf spreken, maar wat Hij zal gehoord hebben, zal Hij spreken, en de toekomende dingen zal Hij u verkondigen.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "1 Joh 5:1": "Ieder die gelooft dat Jezus de Christus is, is uit God geboren; en ieder die Hem liefheeft Die geboren heeft, heeft ook lief hem die uit Hem geboren is.", "Ezech 37:1": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.", "Joh 1:5": "En het Licht schijnt in de duisternis, en de duisternis heeft het niet begrepen.", "Jer 23:3": "En Ik zal het overblijfsel van Mijn schapen Zelf verzamelen uit al de landen, waarheen Ik ze verdreven heb; en Ik zal ze terugbrengen tot hun kooien, en zij zullen vruchtbaar zijn, en zich vermenigvuldigen.", "Deut 34:9-11": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Ps 44:15": "U stelt ons tot een spreekwoord onder de heidenvolken, tot een hoofdschudden onder de volken.", "Joël 2:15-18": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Kol 3:9": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan,", "2 Tess 1:5": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt;", "Ezech 3:10-12": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Matt 12:44": "Dan zegt hij: Ik zal teruggaan naar mijn huis, waar ik vandaan gekomen ben; en als hij komt, vindt hij het leeg, schoongeveegd en versierd.", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Joh 17:26": "En Ik heb hun Uw Naam bekendgemaakt, en zal Hem bekendmaken; opdat de liefde waarmee U Mij liefgehad hebt, in hen is, en Ik in hen.", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Jer 32:3-5": "Want Zedekia, de koning van Juda, had hem opgesloten en gezegd: Waarom profeteert u en zegt u: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal haar innemen; En Zedekia, de koning van Juda, zal aan de hand van de Chaldeeën niet ontkomen; maar hij zal zeker gegeven worden in de hand van de koning van Babel, en zijn mond zal tot diens mond spreken, en zijn ogen zullen diens ogen zien; En hij zal Zedekia naar Babel voeren, en daar zal hij zijn, totdat Ik hem bezoek, spreekt de HEERE; ofschoon u tegen de Chaldeeën strijdt, u zult toch geen geluk hebben.)", "Ezech 36:2": "Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden!", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "1 Kor 12:8": "Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest;", "Matt 12:43": "En wanneer de onreine geest van de mens is uitgegaan, gaat hij door dorre plaatsen, op zoek naar rust, en vindt die niet.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Luk 8:39": "Keer terug naar uw huis, en vertel wat voor grote dingen God aan u gedaan heeft. En hij ging heen en verkondigde door de hele stad wat voor grote dingen Jezus aan hem gedaan had.", "Joh 12:46": "Ik ben een Licht, in de wereld gekomen, opdat ieder die in Mij gelooft, niet in de duisternis blijft.", "2 Kor 5:17": "Dus als iemand in Christus is, is hij een nieuw schepsel; het oude is voorbijgegaan, zie, het is alles nieuw geworden.", "Jer 26:13": "Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft.", "Ex 1:11": "En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses.", "Jer 1:10": "Zie, Ik stel u op deze dag over de volken en over de koninkrijken, om uit te rukken, en af te breken, en te verderven, en te verstoren; ook om te bouwen en te planten.", "Jer 32:36-44": "En nu, daarom zegt de HEERE, de God van Israël, zo over deze stad, waarvan u zegt: Zij is gegeven in de hand van de koning van Babel, door het zwaard, en door de honger, en door de pest; Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen. Ja, zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Ex 19:3": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "Matt 16:17": "En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.", "Joh 15:3": "U bent nu rein om het woord dat Ik tot u gesproken heb.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "Ef 4:16": "Uit Wie het hele lichaam bekwaam samengevoegd en samen vastgemaakt wordt, door alle gewrichten die het voeden, naar de werking van ieder deel in zijn maat, groei van het lichaam bereikt, tot opbouw van zichzelf in de liefde.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "1 Petr 1:22": "Nu u uw zielen gereinigd hebt door de gehoorzaamheid aan de waarheid, door de Geest, tot ongeveinsde broederlijke liefde, heb dan elkaar vurig lief uit een rein hart;", "Ps 51:19": "De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Job 22:22": "Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart.", "Joh 6:50": "Dit is het Brood dat uit de hemel neerdaalt, zodat de mens ervan eet en niet sterft.", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Ezech 14:11": "Opdat het huis van Israël niet meer van achter Mij afdwaalt, en zij zich niet meer verontreinigen met al hun overtredingen; dan zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn, spreekt de Heere HEERE.", "Job 22:21": "Gewen u toch aan Hem, en heb vrede; daardoor zal het goede u overkomen.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Mark 10:15": "Voorwaar, Ik zeg u: Wie het Koninkrijk van God niet ontvangt als een kind, die zal er geenszins ingaan.", "Mal 3:4": "Dan zal het spijsoffer van Juda en Jeruzalem de HEERE zoet zijn, zoals in de oude dagen, en zoals in de vorige jaren.", "Job 11:13-15": "Als u uw hart klaargemaakt hebt, breid dan uw handen tot Hem uit. Als er ondeugd in uw hand is, doe die ver weg; en laat het onrecht in uw tenten niet wonen. Want dan zult u uw gezicht opheffen zonder smet, en zult vast staan, en niet vrezen.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Jes 26:12-19": "HEERE, U zult ons vrede geven, want U hebt ook al onze zaken voor ons volbracht. HEERE, onze God, andere heren, behalve U, hebben over ons geheerst; maar door U alleen gedenken wij Uw Naam. Zij die dood zijn, zullen niet opnieuw leven, overledenen zullen niet opstaan; daarom hebt U hen bezocht en hebt U hen verdelgd, en U hebt al hun gedachtenis doen vergaan.", "Spr 1:23": "Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest overvloedig over u uitstorten; Ik zal Mijn woorden u bekendmaken.", "1 Joh 3:9": "Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren.", "Job 33:26-28": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven. Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat; Maar God heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet.", "1 Kon 8:46-50": "Wanneer zij tegen U gezondigd zullen hebben (want er is geen mens die niet zondigt), en U tegen hen vertoornd zult zijn, en hen leveren zult voor het aangezicht van de vijand, zodat hun overwinnaars hen gevankelijk wegvoeren naar het land van de vijand, veraf of nabij; en zij in het land, waar zij gevankelijk weggevoerd zijn, weer tot inkeer komen, en zich bekeren, en tot U smeken in het land van hen die ze gevankelijk hebben weggevoerd, en zeggen: Wij hebben gezondigd, en verkeerd gedaan, wij hebben goddeloos gehandeld; en zij zich tot U bekeren, met hun hele hart, en met hun hele ziel, in het land van hun vijanden, die hen gevankelijk zullen hebben weggevoerd; en tot U bidden zullen in de richting van hun land (dat U hun vaderen gegeven hebt), naar deze stad, die U verkoren hebt, en naar dit huis, dat ik voor Uw Naam gebouwd heb;", "2 Sam 12:1": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.", "Num 22:18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "1 Kor 3:7": "Zo is dan noch hij die plant iets, noch hij die nat maakt, maar God, Die de groei geeft.", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "Ps 51:8": "Zie, U hebt lust tot waarheid in het binnenste, en in het verborgene maakt U mij wijsheid bekend.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Jer 49:34": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurde tegen Elam, in het begin van het koninkrijk van Zedekia, de koning van Juda, en zei:", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "Ps 107:17-21": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden; Hun ziel gruwde van alle voedsel, en zij waren tot aan de poorten van de dood gekomen. Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "2 Petr 1:12": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt.", "Rom 11:23": "Maar ook zij, als zij in het ongeloof niet blijven, zullen ingeënt worden; want God is machtig om hen weer in te enten.", "Ezech 36:1-38": "En u, mensenkind! Profeteer tot de bergen van Israël, en zeg: Bergen van Israël! Hoort het woord van de HEERE. Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden! Daarom profeteer en zeg: Zo zegt de Heere HEERE: Daarom, omdat men u van rondom verwoest en opgeslokt heeft, opdat u voor het overblijfsel van de heidenen ten erve zou zijn, en u gebracht bent op de klapachtige lip en in opspraak van het volk;", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "1 Sam 3:21": "En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "Ps 19:2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen.", "1 Sam 10:6": "En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Jes 4:4": "wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Hebr 10:17": "En aan hun zonden en hun ongerechtigheden zal Ik geenszins meer denken.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Ps 147:3": "Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Jer 33:6": "Zie, Ik zal haar gezondheid en genezing laten opkomen, en Ik zal hen genezen, en Ik zal hun een overvloed van vrede en waarheid openbaren.", "1 Kor 2:9-14": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben. Maar God heeft het ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten van God. Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God.", "Jes 49:13-23": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen. Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Rom 7:6": "Maar nu zijn wij vrijgemaakt van de wet, omdat wij gestorven zijn aan datgene waaronder wij vastgehouden werden; zodat wij dienen in nieuwheid van de Geest, en niet in de oudheid van de letter.", "Jak 4:8-10": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen! Gedraag u als ellendigen, en treur en ween; laat uw lachen veranderen in treuren, en uw blijdschap in verdriet. Verneder u voor de Heere, en Hij zal u verhogen.", "Jer 45:1": "Het woord dat de profeet Jeremia gesproken heeft tot Baruch, de zoon van Nerija, toen hij deze woorden uit de mond van Jeremia in een boek schreef, in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda:", "Jer 33:7": "En Ik zal de gevangenschap van Juda en de gevangenschap van Israël wenden, en zal ze bouwen als in het begin.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "2 Petr 1:2-5": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Matt 12:33-35": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend. Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond. De goede mens brengt goede dingen voort uit de goede schat van het hart, en de slechte mens brengt slechte dingen voort uit de slechte schat.", "Ps 94:12-14": "Gelukkig is de man, o HEERE! die Gij tuchtigt, en die Gij leert uit Uw wet, Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt. Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Jes 41:27": "Ik, de Eerste, zeg tegen Sion: Zie, zie ze daar! En tegen Jeruzalem: Ik zal iemand geven die een blijde boodschap brengt.", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Num 24:16": "Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.", "Deut 26:2-4": "dan zult u van de eerstelingen van alle vrucht van het land nemen, die u opbrengt van uw land dat de HEERE, uw God, u geeft, en zult ze in een korf leggen; en u zult gaan naar de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; en u zult komen bij de priester die er in die dagen zal zijn, en tegen hem zeggen: Ik verklaar heden voor de HEERE, uw God, dat ik gekomen ben in het land dat de HEERE onze vaderen gezworen heeft ons te zullen geven. En de priester zal de korf uit uw hand nemen, en hij zal die voor het altaar van de HEERE, uw God, neerzetten.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "1 Kon 8:33-50": "Wanneer Uw volk Israël verslagen wordt voor het aangezicht van de vijand, omdat zij tegen U gezondigd zullen hebben, en zich tot U bekeren, en Uw Naam belijden, en tot U in dit huis bidden en smeken zullen; hoor Ú dan in de hemel, en vergeef de zonde van Uw volk Israël, en breng hen terug in het land, dat U hun vaderen gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij op deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "Jes 65:15": "En u zult uw naam voor Mijn uitverkorenen tot een vervloeking laten; en de Heere HEERE zal u doden, maar Zijn knechten zal Hij met een andere naam noemen;", "Rom 8:9": "Maar u bent niet in het vlees, maar in de Geest, als tenminste de Geest van God in u woont. Maar als iemand de Geest van Christus niet heeft, die komt Hem niet toe.", "Ezech 44:7": "Omdat u vreemden hebt binnengebracht, onbesnedenen van hart en onbesnedenen van vlees, om in Mijn heiligdom te zijn, om dat te ontheiligen, namelijk Mijn huis; toen u Mijn brood, het vette en het bloed offerde, en zij Mijn verbond verbraken, naast al uw gruwelen.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "Ps 109:19": "Laat het hem zijn als een kleed, waarmee hij zich bedekt, en tot een gordel, waarmee hij zich steeds omgordt.", "Hebr 5:8": "Hoewel Hij de Zoon was, heeft Hij toch gehoorzaamheid geleerd uit wat Hij geleden heeft.", "Jes 9:13": "Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag.", "Job 38:37": "Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?", "Jes 9:12": "Want dit volk keert zich niet tot Hem, Die het slaat, en de HEERE van de heerscharen zoeken zij niet.", "Jer 24:2-7": "In de ene korf waren zeer goede vijgen, zoals de eerste rijpe vijgen zijn; maar in de andere korf waren zeer slechte vijgen, die vanwege de slechtheid niet gegeten konden worden. En de HEERE zei tegen mij: Wat ziet u, Jeremia? En ik zei: Vijgen; de goede vijgen zijn zeer goed, en de slechte zeer slecht, die vanwege de slechtheid niet gegeten kunnen worden. Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Jer 24:2-8": "In de ene korf waren zeer goede vijgen, zoals de eerste rijpe vijgen zijn; maar in de andere korf waren zeer slechte vijgen, die vanwege de slechtheid niet gegeten konden worden. En de HEERE zei tegen mij: Wat ziet u, Jeremia? En ik zei: Vijgen; de goede vijgen zijn zeer goed, en de slechte zeer slecht, die vanwege de slechtheid niet gegeten kunnen worden. Toen kwam het woord van de HEERE tot mij, en Hij zei:", "1 Kron 22:12": "Laat de HEERE u alleen wijsheid en verstand geven, en u bevel geven over Israël, en dat om de wet van de HEERE, van uw God, te onderhouden.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "1 Kor 3:9": "Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u.", "Fil 3:15": "Laten wij dan, zovelen als wij volmaakt zijn, dit gevoelen; en als u ergens anders over denkt, ook dat zal God u openbaren.", "2 Petr 1:8": "Want als deze dingen bij u aanwezig zijn en in u overvloedig worden, zullen ze u niet nutteloos noch onvruchtbaar laten in de kennis van onze Heere Jezus Christus.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Jer 12:15": "En het zal gebeuren, nadat Ik hen zal hebben uitgerukt, dat Ik zal terugkeren, en Mij over hen zal ontfermen; en Ik zal hen terugbrengen, ieder tot zijn erfenis, en ieder tot zijn land.", "Jes 32:15": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Jer 37:7-10": "Zo zegt de HEERE, de God van Israël: Zo zult u zeggen tegen de koning van Juda, die u naar Mij gestuurd heeft om Mij te raadplegen: Zie, het leger van Farao, dat u ter hulp is uitgetrokken, zal terugkeren naar zijn land, naar Egypte; En de Chaldeeën zullen terugkeren en tegen deze stad strijden; en zij zullen haar innemen en met vuur verbranden. Zo zegt de HEERE: Bedrieg uzelf niet door te zeggen: De Chaldeeën zullen zeker van ons wegtrekken; want zij zullen niet wegtrekken.", "Joh 6:47": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, heeft het eeuwige leven.", "Joh 9:39": "En Jezus zei: Ik ben tot een oordeel in deze wereld gekomen, opdat zij die niet zien, zien mogen, en zij die zien, blind worden.", "Deut 4:29-31": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel. Wanneer u in angst zult zijn, en al deze dingen u zullen treffen, in de laatste dagen, dan zult u terugkeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn. Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Luk 3:3": "En hij kwam in heel het omliggende land van de Jordaan, en predikte de doop van bekering tot vergeving van zonden,", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Ps 16:7": "Ik zal de HEERE loven, Die mij raad heeft gegeven; zelfs 's nachts onderwijzen mijn nieren mij.", "Ps 51:12": "Schep mij een rein hart, o God! en vernieuw in mijn binnenste een vaste geest.", "Joh 6:57": "Zoals de levende Vader Mij gezonden heeft, en Ik leef door de Vader; zo zal ook wie Mij eet, leven door Mij.", "Jer 43:1": "En het gebeurde, toen Jeremia geëindigd had tot het hele volk te spreken al de woorden van de HEERE, hun God, met welke de HEERE, hun God, hem tot hen gezonden had, te weten al die woorden,", "Richt 2:21": "zo zal Ik ook niet doorgaan om voor hun aangezicht iemand uit de bezitting te verdrijven, van de heidenvolken die Jozua heeft achtergelaten toen hij stierf;", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "Ezech 5:2": "Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "Deut 28:25": "De HEERE zal geven dat u verslagen wordt voor uw vijanden; door één weg zult u tegen hem uittrekken, en door zeven wegen zult u voor hem vluchten; en u zult heen en weer gedreven worden onder alle koninkrijken van de aarde.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Jes 61:4-9": "En zij zullen de oude, verwoeste plaatsen bouwen, de vorige verstoringen weer oprichten, en de verwoeste steden vernieuwen, die verstoord waren van geslacht op geslacht. En vreemdelingen zullen klaarstaan en uw kudden weiden; en buitenlanders zullen uw akkerlieden en uw wijngaardeniers zijn. Maar u zult priesters van de HEERE heten, men zal u dienaren van onze God noemen; u zult het vermogen van de heidenvolken eten, en op hun heerlijkheid zult u zich beroemen.", "Mal 1:12-14": "Maar u ontheiligt die, als u zegt: De tafel van de HEERE is verontreinigd, en haar inkomst, haar voedsel, is verachtelijk. Verder zegt u: Zie, wat een vermoeidheid! maar u zou het kunnen wegblazen, zegt de HEERE van de heerscharen; u brengt ook wat geroofd is, en wat kreupel en krank is; u brengt ook spijsoffer; zou Mij dat aangenaam zijn van uw hand? zegt de HEERE. Ja, vervloekt is de bedrieger, die een mannetje in zijn kudde heeft, en de Heere een gelofte doet, en offert wat verdorven is! want Ik ben een groot Koning, zegt de HEERE van de heerscharen, en Mijn Naam is ontzagwekkend onder de heidenen.", "Zach 10:5-12": "En zij zullen zijn als de helden, die in het slijk van de straten treden in de strijd, en zij zullen strijden; want de HEERE zal met hen zijn, en zij zullen hen beschamen die op paarden rijden. En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren. En zij zullen zijn als een held van Efraïm, en hun hart zal zich verblijden als door de wijn; en hun kinderen zullen het zien en zich verblijden, hun hart zal zich verheugen in de HEERE.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "Zach 8:8": "En Ik zal hen hierheen brengen, zodat zij in het midden van Jeruzalem wonen zullen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn, in waarheid en in gerechtigheid.", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "1 Kon 17:24": "Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "1 Kron 3:16": "De kinderen van Jojakim nu waren: Jechonia zijn zoon, Zedekia zijn zoon.", "Jer 32:41": "En Ik zal Mij over hen verblijden, dat Ik hun goeddoe; en Ik zal hen trouw in dat land planten, met Mijn hele hart en met Mijn hele ziel.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "1 Joh 5:5": "Wie is het, die de wereld overwint, dan hij die gelooft dat Jezus de Zoon van God is?", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Klaagl 1:5": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "Jer 26:6": "Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek voor alle volken van de aarde.", "Joh 15:1": "Ik ben de ware Wijnstok, en Mijn Vader is de Landman.", "Ezech 18:21-23": "Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven. Al zijn overtredingen, die hij gedaan heeft, zullen hem niet aangerekend worden; door zijn gerechtigheid, die hij gedaan heeft, zal hij leven. Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "2 Kon 24:12-16": "Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem gevangen in het achtste jaar van zijn regering. En hij bracht van daar al de schatten van het huis van de HEERE, en de schatten van het huis van de koning; en hij hakte alle gouden vaten stuk die Salomo, de koning van Israël, in de tempel van de HEERE gemaakt had, zoals de HEERE gesproken had. En hij voerde heel Jeruzalem weg, alsook al de vorsten, en alle strijdbare helden, tienduizend gevangenen, en alle timmerlieden en smeden; niemand werd overgelaten, dan het arme volk van het land.", "Micha 2:13": "De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits.", "2 Kon 3:11": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.", "Rom 6:17": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;", "1 Petr 1:6": "Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,", "Jes 35:6": "Dan zal de kreupele springen als een hert, en de tong van de stomme zal juichen; want in de woestijn zullen wateren uitbarsten, en beken in de wildernis.", "Ezech 37:1-14": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen. En Hij deed mij daar helemaal omheen voorbijgaan; en zie, er waren er zeer veel op de grond van de vallei; en zie, ze waren zeer dor. En Hij zei tot mij: Mensenkind! Zullen deze beenderen levend worden? En ik zei: Heere HEERE, U weet het!", "Ps 44:14": "U stelt ons tot smaad voor onze naburen, tot spot en schimp voor hen die rondom ons zijn.", "Deut 30:6": "En de HEERE, uw God, zal uw hart besnijden, en het hart van uw nageslacht, om de HEERE, uw God, lief te hebben met uw ganse hart en met uw ganse ziel, opdat u leeft.", "Ezech 26:2": "Mensenkind! Omdat Tyrus van Jeruzalem gezegd heeft: Heah! Zij is verbroken, de poort van de volken; zij is tot mij omgewend; ik zal vervuld worden, zij is verwoest!", "Hebr 8:11": "En zij zullen niet leren, ieder zijn naaste en ieder zijn broeder, en zeggen: Ken de Heere; want zij zullen Mij allen kennen, van de kleinste onder hen tot de grootste onder hen.", "Luk 10:13": "Wee u, Chorazin, wee u, Bethsaïda, want als in Tyrus en Sidon de krachten waren gebeurd die in u gebeurd zijn, zouden zij zich allang, in zak en as zittend, bekeerd hebben.", "Deut 4:36": "Vanuit de hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn grote vuur laten zien; en u hebt Zijn woorden uit het midden van het vuur gehoord.", "Gal 6:15": "Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar een nieuw schepsel.", "Joh 17:6": "Ik heb Uw Naam geopenbaard aan de mensen die U Mij uit de wereld gegeven hebt. Zij waren van U, en U hebt Mij hen gegeven; en zij hebben Uw woord bewaard.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Amos 3:8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "Matt 4:17": "Van toen af aan begon Jezus te prediken en te zeggen: Bekeer u; want het Koninkrijk der hemelen is nabijgekomen.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Hand 16:14": "En een zekere vrouw, met de naam Lydia, een purperverkoopster uit de stad Thyatira, die God diende, hoorde ons; haar hart heeft de Heere geopend, zodat zij acht gaf op wat door Paulus gesproken werd.", "Jer 32:29": "En de Chaldeeën, die tegen deze stad strijden, zullen erin komen, en deze stad met vuur aansteken, en zullen haar verbranden, met de huizen op wier daken zij voor Baäl gerookt en aan andere goden drankoffers geofferd hebben, om Mij te vertoornen.", "Zach 1:7": "Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Jes 43:7": "ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "Jer 32:38-40": "Ja, zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn. En Ik zal hun één hart en één weg geven, om Mij te vrezen alle dagen, hun ten goede, alsook hun kinderen na hen. En Ik zal een eeuwig verbond met hen sluiten, dat Ik Mij van achter hen niet zal afkeren, opdat Ik hun goeddoe; en Ik zal Mijn vrees in hun hart geven, zodat zij niet van Mij afwijken.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "1 Petr 1:23": "u die opnieuw geboren bent, niet uit vergankelijk, maar uit onvergankelijk zaad, door het levende en eeuwig blijvende Woord van God.", "Lev 26:40-42": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Jes 12:3": "En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Hand 2:40": "En met veel meer andere woorden getuigde hij, en vermaande hen, en zei: Laat u behouden van dit verkeerde geslacht!", "1 Kon 8:58": "terwijl Hij ons hart tot Zich neigt, om in al Zijn wegen te wandelen, en om Zijn geboden te houden, en Zijn inzettinge
