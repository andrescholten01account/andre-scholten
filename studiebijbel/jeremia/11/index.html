<style>

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  .vers:hover { background: var(--bg-soft); }

  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .vtekst em, .pcel em { font-style: italic; color: #555; }

  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

}},"vertalingen":{"SVnu":{"1":"Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:","2":"Hoor u de woorden van dit verbond, en spreek tot de mannen van Juda, en tot de inwoners van Jeruzalem;","3":"Zeg dan tegen hen: Zo zegt de HEERE, de God van Israël: Vervloekt is de man die niet hoort naar de woorden van dit verbond.","4":"Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;","5":"Opdat Ik de eed bevestig, die Ik uw vaderen gezworen heb, hun een land te geven vloeiende van melk en honing, zoals het is op deze dag. Toen antwoordde ik en zei: Amen, o HEERE!","6":"En de HEERE zei tegen mij: Roep al deze woorden uit in de steden van Juda, en in de straten van Jeruzalem, en zeg: Hoor de woorden van dit verbond, en doe die.","7":"Want Ik heb uw vaderen ernstig betuigd, op de dag dat Ik hen uit Egypteland opvoerde, tot op deze dag, vroeg opstaand en betuigend, en Ik zei: Hoor naar Mijn stem!","8":"Maar zij hebben niet gehoord, en ook hun oor niet geneigd, maar hebben gewandeld, ieder naar het goeddunken van hun boze hart; daarom heb Ik over hen gebracht al de woorden van dit verbond, dat Ik geboden had te doen, maar zij hebben het niet gedaan.","9":"Verder zei de HEERE tegen mij: Er is een samenzwering gevonden onder de mannen van Juda, en onder de inwoners van Jeruzalem.","10":"Zij zijn teruggekeerd tot de ongerechtigheden van hun voorvaders, die Mijn woorden geweigerd hebben te horen; en zij zijn andere goden nagelopen, om die te dienen; het huis van Israël en het huis van Juda hebben Mijn verbond gebroken, dat Ik met hun vaderen gemaakt heb.","11":"Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.","12":"Dan zullen de steden van Juda en de inwoners van Jeruzalem heengaan, en roepen tot de goden aan wie zij wierook gebracht hebben; maar die zullen hen zeker niet kunnen verlossen ten tijde van hun kwaad.","13":"Want *naar* het getal van uw steden zijn uw goden geweest, o Juda! en *naar* het getal van de straten van Jeruzalem hebt u altaren gesteld voor die schaamte, altaren om Baäl te beroken.","14":"U dan, bid niet voor dit volk, en hef geen geschrei of gebed voor hen op; want Ik zal niet horen, in de tijd dat zij vanwege hun kwaad tot Mij zullen roepen.","15":"Wat heeft Mijn beminde in Mijn huis *te* *doen*, terwijl zij die schandelijke daad *met* velen doet, en het heilige vlees van u geweken is? Wanneer u kwaad *doet*, dan springt u op van vreugde.","16":"De HEERE had uw naam genoemd een groene olijfboom, mooi door heerlijke vruchten; *maar* *nu* heeft Hij met het geluid van een groot geroep een vuur om hem heen aangestoken, en zijn takken zullen verbroken worden.","17":"Want de HEERE van de heerscharen¹, Die u geplant heeft, heeft een kwaad over u uitgesproken; vanwege de boosheid van het huis van Israël en van het huis van Juda, die zij onder elkaar bedrijven, om Mij te vertoornen, door Baäl te beroken.","18":"De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.","19":"En ik was als een lam, *als* een os, die geleid wordt om geslacht te worden; want ik wist niet dat zij plannen tegen mij beraamden, en zeiden: Laten wij de boom met zijn vrucht verderven, en laten wij hem uit het land van de levenden uitroeien, zodat aan zijn naam niet meer gedacht wordt.","20":"Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.","21":"Daarom, zo zegt de HEERE van de mannen van Anathoth, die uw leven zoeken, en zeggen: Profeteer niet in de Naam van de HEERE, opdat u niet door onze handen sterft.","22":"Daarom, zo zegt de HEERE van de heerscharen¹: Zie, Ik zal met een bezoeking over hen komen: de jongemannen zullen door het zwaard sterven, hun zonen en hun dochters zullen van honger sterven.","23":"En zij zullen geen overblijfsel hebben; want Ik zal een kwaad brengen over de mannen van Anathoth, *in* het jaar van hun bezoeking."},"SV":{"1":"Het woord, dat tot Jeremia geschied is, van den HEERE, zeggende:","2":"Hoort gijlieden de woorden dezes verbonds, en spreekt tot de mannen van Juda, en tot de inwoners van Jeruzalem;","3":"Zeg dan tot hen: Zo zegt de HEERE, de God Israëls: Vervloekt zij de man, die niet hoort de woorden dezes verbonds.","4":"Dat Ik uw vaderen geboden heb, ten dage als Ik hen uit Egypteland, uit den ijzeroven, uitvoerde, zeggende: Zijt Mijner stem gehoorzaam, en doet dezelve, naar alles wat Ik ulieden gebiede; zo zult gij Mij tot een volk zijn, en Ik zal u tot een God zijn;","5":"Opdat Ik den eed bevestige, dien Ik uw vaderen gezworen heb, hun te geven een land, vloeiende van melk en honig, als het is te dezen dage. Toen antwoordde ik en zeide: Amen, o HEERE!","6":"En de HEERE zeide tot mij: Roep al deze woorden uit in de steden van Juda, en in de straten van Jeruzalem, zeggende: Hoort de woorden dezes verbonds, en doet dezelve.","7":"Want Ik heb uw vaderen ernstiglijk betuigd, ten dage als Ik hen uit Egypteland opvoerde, tot op dezen dag, vroeg op zijnde en betuigende, zeggende: Hoort naar Mijn stem!","8":"Maar zij hebben niet gehoord, noch hun oor geneigd, maar hebben gewandeld, een iegelijk naar het goeddunken van hunlieder boos hart; daarom heb Ik over hen gebracht al de woorden dezes verbonds, dat Ik geboden heb te doen, maar zij niet gedaan hebben.","9":"Voorts zeide de HEERE tot mij: Er is een verbintenis bevonden onder de mannen van Juda, en onder de inwoners van Jeruzalem.","10":"Zij zijn wedergekeerd tot de ongerechtigheden hunner voorvaderen, die Mijn woorden geweigerd hebben te horen; en zij hebben andere goden nagewandeld, om die te dienen; het huis Israëls en het huis van Juda hebben Mijn verbond gebroken, dat Ik met hun vaderen gemaakt heb.","11":"Daarom zegt de HEERE alzo: Ziet, Ik zal een kwaad over hen brengen, uit hetwelk zij niet zullen kunnen uitkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.","12":"Dan zullen de steden van Juda en de inwoners van Jeruzalem henengaan, en roepen tot de goden, dien zij gerookt hebben; maar zij zullen hen gans niet kunnen verlossen ten tijde huns kwaads.","13":"Want *naar* het getal uwer steden zijn uw goden geweest, o Juda! en *naar* het getal der straten van Jeruzalem hebt gijlieden altaren gesteld voor die schaamte, altaren om den Baäl te roken.","14":"Gij dan, bid niet voor dit volk, en hef geen geschrei noch gebed voor hen op; want Ik zal niet horen, ten tijde als zij over hun kwaad tot Mij zullen roepen.","15":"Wat heeft Mijn beminde in Mijn huis *te* *doen*, dewijl zij die schandelijke daad *met* velen doet, en het heilige vlees van u geweken is? Wanneer gij kwaad *doet*, dan springt gij op van vreugde.","16":"De HEERE had uw naam genoemd een groenen olijfboom, schoon van liefelijke vruchten; *maar* *nu* heeft Hij met een geluid van een groot geroep een vuur om denzelven aangestoken, en zijn takken zullen verbroken worden.","17":"Want de HEERE der heirscharen, Die u heeft geplant, heeft een kwaad over u uitgesproken; om der boosheid wil van het huis Israëls en van het huis van Juda, die zij onder zich bedrijven, om Mij te vertoornen, rokende den Baäl.","18":"De HEERE nu heeft het mij te kennen gegeven, dat ik het wete; toen hebt Gij mij hun handelingen doen zien.","19":"En ik was als een lam, *als* een os, die geleid wordt om te slachten; want ik wist niet, dat zij gedachten tegen mij dachten, *zeggende*: Laat ons den boom met zijn vrucht verderven, en laat ons hem uit het land der levenden uitroeien, dat zijn naam niet meer gedacht worde.","20":"Maar, o HEERE der heirscharen, Gij rechtvaardige Rechter, Die de nieren en het hart proeft! laat mij Uw wraak van hen zien; want aan U heb ik mijn twistzaak ontdekt.","21":"Daarom, zo zegt de HEERE van de mannen van Anathoth, die uw ziel zoeken, zeggende: Profeteer niet in den Naam des HEEREN, opdat gij van onze handen niet sterft.","22":"Daarom, zo zegt de HEERE der heirscharen: Ziet, Ik zal bezoeking over hen doen: de jongelingen zullen door het zwaard sterven, hun zonen en hun dochteren zullen van honger sterven.","23":"En zij zullen geen overblijfsel hebben; want Ik zal een kwaad brengen over de mannen van Anathoth, *in* het jaar hunner bezoeking."},"KJV":{"1":"The word that came to Jeremiah from the LORD, saying,","2":"Hear ye the words of this covenant, and speak unto the men of Judah, and to the inhabitants of Jerusalem;","3":"And say thou unto them, Thus saith the LORD God of Israel; Cursed *be* the man that obeyeth not the words of this covenant,","4":"Which I commanded your fathers in the day *that* I brought them forth out of the land of Egypt, from the iron furnace, saying, Obey my voice, and do them, according to all which I command you: so shall ye be my people, and I will be your God:","5":"That I may perform the oath which I have sworn unto your fathers, to give them a land flowing with milk and honey, as *it is* this day. Then answered I, and said, So be it, O LORD.","6":"Then the LORD said unto me, Proclaim all these words in the cities of Judah, and in the streets of Jerusalem, saying, Hear ye the words of this covenant, and do","7":"For I earnestly protested unto your fathers in the day *that* I brought them up out of the land of Egypt, *even* unto this day, rising early and protesting, saying, Obey my voice.","8":"Yet they obeyed not, nor inclined their ear, but walked every one in the imagination of their evil heart: therefore I will bring upon them all the words of this covenant, which I commanded *them* to do; but they did","9":"And the LORD said unto me, A conspiracy is found among the men of Judah, and among the inhabitants of Jerusalem.","10":"They are turned back to the iniquities of their forefathers, which refused to hear my words; and they went after other gods to serve them: the house of Israel and the house of Judah have broken my covenant which I made with their fathers.","11":"Therefore thus saith the LORD, Behold, I will bring evil upon them, which they shall not be able to escape; and though they shall cry unto me, I will not hearken","12":"Then shall the cities of Judah and inhabitants of Jerusalem go, and cry unto the gods unto whom they offer incense: but they shall not save them at all in the time of their trouble.","13":"For *according to* the number of thy cities were thy gods, O Judah; and *according to* the number of the streets of Jerusalem have ye set up altars to *that* shameful thing, *even* altars to burn incense unto Baal.","14":"Therefore pray not thou for this people, neither lift up a cry or prayer for them: for I will not hear *them* in the time that they cry unto me for their trouble.","15":"What hath my beloved to do in mine house, *seeing* she hath wrought lewdness with many, and the holy flesh is passed from thee? when thou doest evil, then thou rejoicest.","16":"The LORD called thy name, A green olive tree, fair, *and* of goodly fruit: with the noise of a great tumult he hath kindled fire upon it, and the branches of it are broken.","17":"For the LORD of hosts, that planted thee, hath pronounced evil against thee, for the evil of the house of Israel and of the house of Judah, which they have done against themselves to provoke me to anger in offering incense unto Baal.","18":"And the LORD hath given me knowledge *of it*, and I know *it*: then thou shewedst me their doings.","19":"But I *was* like a lamb *or* an ox *that* is brought to the slaughter; and I knew not that they had devised devices against me, *saying*, Let us destroy the tree with the fruit thereof, and let us cut him off from the land of the living, that his name may be no more remembered.","20":"But, O LORD of hosts, that judgest righteously, that triest the reins and the heart, let me see thy vengeance on them: for unto thee have I revealed my cause.","21":"Therefore thus saith the LORD of the men of Anathoth, that seek thy life, saying, Prophesy not in the name of the LORD, that thou die not by our hand:","22":"Therefore thus saith the LORD of hosts, Behold, I will punish them: the young men shall die by the sword; their sons and their daughters shall die by famine:","23":"And there shall be no remnant of them: for I will bring evil upon the men of Anathoth, *even* the year of their visitation."}},"tsk":{"4":[{"kopje":"geboden heb","refs":["Jer 31:32","Ex 24:3-8","Deut 5:2","Deut 5:3","Deut 29:10-15","Ezech 20:6-12","Hebr 8:8-10"]},{"kopje":"ijzeroven","refs":["Deut 4:20","1 Kon 8:51","Jes 48:10"]},{"kopje":"gehoorzaam","refs":["Jer 7:22","Jer 7:23","Jer 26:13","Ex 20:6","Ex 23:21","Ex 23:22","Lev 26:3","Lev 26:12","Deut 11:27","Deut 28:1-14","1 Sam 15:22","Zach 6:15","Matt 28:20","Hebr 5:9"]},{"kopje":"zult","refs":["Jer 24:7","Jer 30:22","Jer 31:31","Jer 31:33","Jer 32:38","Gen 17:8","Lev 26:12","Ezech 11:20","Ezech 14:11","Ezech 36:28","Ezech 37:23","Ezech 37:27","Zach 8:8","Zach 13:9","2 Kor 6:16","Hebr 8:10"]}],"5":[{"kopje":"bevestig","refs":["Gen 22:16-18","Gen 26:3-5","Ps 105:9-11"]},{"kopje":"een land","refs":["Ex 3:8-17","Lev 20:24","Deut 6:3","Deut 7:12","Deut 7:13"]},{"kopje":"Amen","refs":["Jer 28:6","Deut 27:15-26","Matt 6:13","1 Kor 14:16"]}],"6":[{"kopje":"Roep","refs":["Jer 3:12","Jer 7:2","Jer 19:2","Jes 58:1","Zach 7:7"]},{"kopje":"Hoor","refs":["Jer 11:2-4","Ps 15:5","Joh 13:17","Rom 2:13","Jak 1:22"]}],"7":[{"kopje":"ernstig betuigd","refs":["1 Sam 8:9","Ef 4:17","2 Tess 3:12"]},{"kopje":"op de dag","refs":["Jer 7:13","Jer 7:23-25","Jer 25:4","Jer 35:15","Ex 15:26","Ex 23:21","Ex 23:22","Deut 4:6","Deut 5:29","Deut 6:2","Deut 8:6","Deut 10:12","Deut 10:13","Deut 11:26-28","Deut 12:32","Deut 28:1-14","Deut 30:20"]}],"8":[{"kopje":"gehoord","refs":["Jer 3:17","Jer 6:16","Jer 6: he house of Israel, and the house of Juda have broken [Or, made void] my covenant, which I made with their father [See Genes.15. on vers.17.18.]"}],"11":[{"catchword":null,"tekst":"Therefore thus saith the LORD, Behold, I will bring an evil [That is, punishment, mischief, misery etc. as vers .12 ] upon them, out of which they shall then cry unto me, I will not hearken unto them. [Compare Pro 1:28. Isai.1.15. below chap.14.12. Ezech.8.18. Mic 3:4."}],"12":[{"catchword":null,"tekst":"Then shall be the cities of Juda, and the inhabitants of Jerusalem go, and cry unto the Gods, unto whom they have burnt incense: but they shall not be able to deliver them at all [Heb. Delivering not deliver ] in the lime time of their evil. [Which I will bring upon them, vers.11. So ver.14.17,23]"}],"13":[{"catchword":null,"tekst":"For (according to) the number of thy Cities, were thy God, O Juda: [As above chap.2.28.] and (according to) the number of streets of Jerusalem, have ye set (up) altars for that shame; [That is, shamefull Idol Baal. See above chap.3. on vers. 23.]to burn incense unto Baal"}],"14":[{"catchword":null,"tekst":"Thou then, [O Jeremia] pray not for this people neither lift up a cry,or a prayer for them.(see above chap.7.16 and below chap.14.11) for I will not hear,in the time when they cry unto me for this evil."}],"15":[{"catchword":null,"tekst":"What hath my beloved (to do) in mine house,(compare the Phrase with 2 Sam.16.10. and the annotat there. (beloved) To wit, this people, (The Hebrew word is put in the masculine gender, but the following words in the feminine) that so call themselves, or boast of it, that they are my people. Or, God calleth them so notwithstanding their unthankfulness, because of his covenant, which he had made them, their fathers, and the mercies that he had bestowed on them. Compare below chap.12. 7,8 Rom. 3.3. and 11.28. Some understand hereby, the Prophesied daily in the Temple to this wicked people. Compare chap. 7.2. As if God should say; What have servants any more to do in the Temple among this rebellions people, to instruct them, or, to pay for them? See vers. 14 (mine house) The Temple: as if God should say; To what purpose do they run so much, and so often in the Temple, whereas they are so full of all kinde of wickedness.] Seeing the [Meaning the daughter of my people, or city of Jerusalem; that is, the inhabitants thereof ] that lawd act [Oth. Gross lewduesse; because the Hebrew word, which signifieth an abominable fact, or plot, (See Prov.31. on vers.16.) hath here a letter more then ordinary, serving to heighten the signification of it. Compare Psal.3. on vers.3 Understand hereby, the abominable idolatry, mentioned, vers 13, etc] with many,[ To wit, with many idols, as above vers.13. Or, it may be understood of the multitude, or great company of those, that commited these abominations, thus: seeing many of them commit thus heinous act. Some put in instead of with many (yea even) the Great ones. Compare Eze.8.11. and 23.39] and the holy fesh is passed from thee? [Hebr. The flesh of holiness, or, of the sanctuary, are passed from thee. As the word flesh is not in use among using the plural number, so neither is it used more then once in the whole text of the Hebrew Bible in the plural number, to wit, Pro 14:30. The meaning is, All thy offerings, O Jerusalem, are no more of any value, thou offerest no more an holy offering, because thou profanest all thy things by thy wickedness. Some understand it thus: that God threateth them, that the time is at hand, that the time is at hand, that they being punished, and driven out of their Land for their wickedness, shall come no more into the Temple, nor sacrifice, nor keep their wonted joyful feats with the flesh of the offerings as they did at present, but with an horrible profentation of Gods holy institutions, therefore God would caft them out of the Land. Some understand by the holy flesh, the true sincere Israelites, who were circumcised both outwardly inwardly] when thou (doest) evil, then thou leapest up joy; [Or, when (in) thy wickedness, &c. Oth. When evil (that is, thy punishment, misery) is at hand, or is fore &acirc;&euro;&ldquo; told or threatened by Prophets) then thou rejoycest; that is, thou despisest my threatening so extremely, as that even to vex and spite me as it were, thou doest the more rejoice, to shew that thou carest not at all for them]"}],"16":[{"catchword":null,"tekst":"The LORD had called thy name, A green olive tree, fair, of pleasant &acirc;&euro;&ldquo; fruits: [Hebr. fruit of form] (but now) with a sound of great cry [ Compare Ezec. 1.24.] be hath kindled of fire [Meaning the desolation, destruction, and consumption of the land people, by the Babyloan] about it, [The olive &acirc;&euro;&ldquo; tree. Oth. A fire hath kindled the leaves thereof] and the boughs [ Or, branches, twings, sprigs] thereof shall be broken.[Oth. They shall break.]"}],"17":[{"catchword":null,"tekst":"For the LORD of hosts, that planted thee, [As an olive- tree, as was said in the former verse] hath thee: because of the wickedness of the house of Israel, and of the House of Juda, which they commit among themselves, to incense me, [Or, to provoke me anger] burning incense unto Baal."}],"18":[{"catchword":null,"tekst":"Now the LORD made it known unto me, [When in simplicity of the heart my calling, according to God command, and thoygth not of any evil] that I might know it.: Then thou causeth me to see their dealings. [Jeremia speaketh this unto God, whom he callethto record, that he speaketh this not out of humane suspicion or passion, but onely by divine revelation in a vision. Compare below, chap.24.1.]"}],"19":[{"catchword":null,"tekst":"And I was like a Lamb (like) an ox, that is led to be slain, [To the daughter, to be killed, that he may be slain] for I know no that they thought against me, [That is, intended wicked devices and practices and practices against me] (saying) Let us destroy tree with fruit thereof, [To wit, the Prophet Jeremia with his Doctrine and Prophecy. Hebr. properly bread; that is, meat, and consequently fruit, serving for meat] and let us cut him off from the Land of the living, [See Psal.27. on vers.13.] that his name may be no more remembered."}],"20":[{"catchword":null,"tekst":"But, O LORD of Hosts, thou righteous Judge, [Heb. Judge of righteousness, or, that judgest righteousness] that trist the reins of the reins of the heart, [The innermost and secret thoughts and motions of the heart. See Job 19.on vers.27. and Psal7. on vers.10. and 26.2. 1 Sam.16.7. 1 Chron.28.9. revel.2.23.] let me fee thy vengeance on them, [Which thou will take of them, or excute upon them] for unto thee have I discovered [Presented and committed as to mine Advance and Judge] my cause."}],"21":[{"catchword":null,"tekst":"Threfore, thus saith the LORD of the men of Anathoth, [See above chap.1.1.] that seek thy soul, [Seek thy life. See Exod.4. on vers.19. and 2 Sam.4. on verse.8.] saying: Prophet not in the Name of the LORD, that thou die not by our hands."}],"22":[{"catchword":null,"tekst":"Therefore, thus saith the LORD of Host; Behold, I will visit them; [That is, punish them See Genes.21. on verse 1.] The young men shall die the sword, their sons and their daughters shall die by famine."}],"23":[{"catchword":null,"tekst":"And they shall have no remnant: [That is, none of them shall remain: they shall all perish and be cut off: meaning if they do not repent ] for I will bring evil upon the men of Anathoth, (in) the yeer of their visitation. [Or, to wit, the yeer of their visitatio; that is of their punishment. So below.23.12. etc.]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;

        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
