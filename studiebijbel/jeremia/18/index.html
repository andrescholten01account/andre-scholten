}},"vertalingen":{"SVnu":{"1":"Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:","2":"Maak u op en ga naar het huis van de pottenbakker, en daar zal Ik u Mijn woorden doen horen.","3":"Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven.","4":"En het vat dat hij maakte werd verdorven, als leem, in de hand van de pottenbakker; toen maakte hij daarvan weer een ander vat, zoals het goed was in de ogen van de pottenbakker om te maken.","5":"Toen kwam het woord van de HEERE tot mij, en Hij zei:","6":"Zal Ik u niet kunnen doen, gelijk deze pottenbakker, o huis van Israël? spreekt de HEERE; zie, gelijk leem in de hand van de pottenbakker, zo bent u in Mijn hand, o huis van Israël!","7":"In een ogenblik zal Ik spreken over een volk en over een koninkrijk, dat Ik het zal uitrukken en afbreken en verdoen;","8":"Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen.","9":"Ook zal Ik in een ogenblik spreken over een volk en over een koninkrijk, dat Ik het zal bouwen en planten;","10":"Maar als het doet wat kwaad is in Mijn ogen, dat het naar Mijn stem niet luistert, dan zal Ik berouw hebben over het goede waarmee Ik gezegd had hen te zullen weldoen.","11":"Nu dan, spreek nu tot de mannen van Juda en tot de inwoners van Jeruzalem, en zeg: Zo zegt de HEERE: Zie, Ik formeer een kwaad tegen u, en denk tegen u een gedachte; bekeer u dan nu, ieder van zijn boze weg, en maak uw wegen en uw daden goed.","12":"Doch zij zeggen: Het is buiten hoop; maar wij zullen naar onze eigen gedachten wandelen, en wij zullen doen, ieder, wat zijn boze hart goeddunkt.","13":"Daarom, zo zegt de HEERE: Vraag nu onder de heidenvolken; wie heeft zoiets gehoord? De jonkvrouw Israël doet een zeer afschuwelijke zaak.","14":"Zal men ook om een rotssteen van het veld de sneeuw van Libanon verlaten? Zullen ook de vreemde, koude, vlietende wateren verlaten worden?","15":"Toch heeft Mijn volk Mij vergeten, zij branden reukwerk voor de ijdelheid; want zij hebben hen doen struikelen op hun wegen, op de oude paden, om te wandelen in stegen van een weg die niet opgehoogd is;","16":"Om hun land te maken tot een verschrikking, tot eeuwige aanfluitingen; ieder die daar voorbijgaat, zal ontzet zijn, en met zijn hoofd schudden.","17":"Als een oostenwind zal Ik hen verstrooien voor het aangezicht van de vijand; Ik zal hun de nek en niet het aangezicht laten zien, op de dag van hun verderf.","18":"Toen zeiden zij: Kom, laten wij gedachten tegen Jeremia denken; want de wet zal niet vergaan van de priester, evenmin de raad van de wijze, of het woord van de profeet; kom, laten wij hem slaan met de tong, en laten wij niet luisteren naar enig van zijn woorden!","19":"HEERE, luister naar mij, en hoor naar de stem van hen die met mij twisten.","20":"Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.","21":"Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd.","22":"Laat er een geschrei uit hun huizen gehoord worden, wanneer U snel een bende over hen brengt; omdat zij een kuil gegraven hebben om mij te vangen, en strikken verborgen hebben voor mijn voeten.","23":"Doch U, HEERE, weet al hun plannen tegen mij, om mij te doden; maak geen verzoening over hun ongerechtigheid, en delg hun zonde niet uit van voor Uw aangezicht; maar laat hen neergeveld worden voor Uw aangezicht; handel zo met hen, in de tijd van Uw toorn."},"SV":{"1":"Het woord, dat tot Jeremia geschied is van den HEERE, zeggende:","2":"Maak u op, en ga af *in* het huis des pottenbakkers, en aldaar zal Ik u Mijn woorden doen horen.","3":"Zo ging ik af *in* het huis des pottenbakkers; en ziet, hij maakte een werk op de schijven.","4":"En het vat, dat hij maakte, werd verdorven, als leem, in de hand des pottenbakkers; toen maakte hij daarvan weder een ander vat, gelijk als het recht was in de ogen des pottenbakkers te maken.","5":"Toen geschiedde des HEEREN woord tot mij, zeggende:","6":"Zal Ik ulieden niet kunnen doen, gelijk deze pottenbakker, o huis Israëls? spreekt de HEERE; ziet, gelijk leem in de hand des pottenbakkers, alzo zijt gijlieden in Mijn hand, o huis Israëls!","7":"*In* een ogenblik zal Ik spreken over een volk en over een koninkrijk, dat Ik het zal uitrukken, en afbreken, en verdoen;","8":"Maar *indien* datzelve volk, over hetwelk Ik *zulks* gesproken heb, zich van zijn boosheid bekeert, zo zal Ik berouw hebben over het kwaad, dat Ik hetzelve gedacht te doen.","9":"Ook zal Ik *in* een ogenblik spreken over een volk en over een koninkrijk, dat Ik het zal bouwen en planten;","10":"Maar *indien* het doet, dat kwaad is in Mijn ogen, dat het naar Mijn stem niet hoort, zo zal Ik berouw hebben over het goede, *met* hetwelk Ik gezegd had hetzelve te zullen weldoen.","11":"Nu dan, spreek nu tot de mannen van Juda en tot de inwoners van Jeruzalem, zeggende: Zo zegt de HEERE: Ziet, Ik formeer een kwaad tegen ulieden, en denk tegen ulieden een gedachte; *zo* bekeert u nu, een iegelijk van zijn bozen weg, en maakt uw wegen en uw handelingen goed.","12":"Doch zij zeggen: Het is buiten hoop; maar wij zullen naar onze gedachten wandelen, en wij zullen doen, een iegelijk het goeddunken van zijn boos hart.","13":"Daarom, zo zegt de HEERE: Vraagt nu onder de heidenen; wie heeft alzulks gehoord? De jonkvrouw Israëls doet een zeer afschuwelijke zaak.","14":"Zal men ook om een rotssteen des velds verlaten de sneeuw van Libanon? Zullen ook de vreemde, koude, vlietende wateren verlaten worden?","15":"Nochtans heeft Mijn volk Mij vergeten, zij roken der ijdelheid; want zij hebben hen doen aanstoten op hun wegen, *op* de oude paden, opdat zij mochten wandelen in stegen van een weg, die niet opgehoogd is;","16":"Om hun land te stellen tot een ontzetting, *tot* eeuwige aanfluitingen; al wie daar voorbijgaat, zal zich ontzetten, en met zijn hoofd schudden.","17":"Als een oostenwind zal Ik hen verstrooien voor het aangezicht des vijands; Ik zal hun den nek en niet het aangezicht laten zien, ten dage huns verderfs.","18":"Toen zeiden zij: Komt aan, laat ons gedachten tegen Jeremia denken; want de wet zal niet vergaan van den priester, noch de raad van den wijze, noch het woord van den profeet; komt aan, en laat ons hem slaan met de tong, en laat ons niet luisteren naar enige zijner woorden!","19":"HEERE! luister naar mij, en hoor naar de stem mijner twisters.","20":"Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk, dat ik voor Uw aangezicht gestaan heb, om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.","21":"Daarom, geef hun zonen den honger over, en doe ze wegvloeien door het geweld des zwaards, en laat hun vrouwen van kinderen beroofd en weduwen worden, en laat hun mannen door den dood omgebracht, *en* hun jongelingen met het zwaard geslagen worden in den strijd.","22":"Laat er een geschrei uit hun huizen gehoord worden, wanneer Gij haastelijk een bende over hen zult brengen; dewijl zij een kuil gegraven hebben om mij te vangen, en strikken verborgen voor mijn voeten.","23":"Doch Gij, HEERE! weet al hun raad tegen mij ten dode; maak geen verzoening over hun ongerechtigheid, en delg hun zonde niet uit van voor Uw aangezicht; maar laat hen nedergeveld worden voor Uw aangezicht; handel *alzo* met hen, ten tijde Uws toorns."},"KJV":{"1":"The word which came to Jeremiah from the LORD, saying,","2":"Arise, and go down to the potter's house, and there I will cause thee to hear my words.","3":"Then I went down to the potter's house, and, behold, he wrought a work on the wheels.","4":"And the vessel that he made of clay was marred in the hand of the potter: so he made it again another vessel, as seemed good to the potter to make","5":"Then the word of the LORD came to me, saying,","6":"O house of Israel, cannot I do with you as this potter? saith the LORD. Behold, as the clay *is* in the potter's hand, so *are* ye in mine hand, O house of Israel.","7":"*At what* instant I shall speak concerning a nation, and concerning a kingdom, to pluck up, and to pull down, and to destroy","8":"If that nation, against whom I have pronounced, turn from their evil, I will repent of the evil that I thought to do","9":"And *at what* instant I shall speak concerning a nation, and concerning a kingdom, to build and to plant","10":"If it do evil in my sight, that it obey not my voice, then I will repent of the good, wherewith I said I would benefit","11":"Now therefore go to, speak to the men of Judah, and to the inhabitants of Jerusalem, saying, Thus saith the LORD; Behold, I frame evil against you, and devise a device against you: return ye now every one from his evil way, and make your ways and your doings good.","12":"And they said, There is no hope: but we will walk after our own devices, and we will every one do the imagination of his evil heart.","13":"Therefore thus saith the LORD; Ask ye now among the heathen, who hath heard such things: the virgin of Israel hath done a very horrible thing.","14":"Will *a man* leave the snow of Lebanon *which cometh* from the rock of the field? *or* shall the cold flowing waters that come from another place be forsaken?","15":"Because my people hath forgotten me, they have burned incense to vanity, and they have caused them to stumble in their ways *from* the ancient paths, to walk in paths, *in* a way not cast up;","16":"To make their land desolate, *and* a perpetual hissing; every one that passeth thereby shall be astonished, and wag his head.","17":"I will scatter them as with an east wind before the enemy; I will shew them the back, and not the face, in the day of their calamity.","18":"Then said they, Come, and let us devise devices against Jeremiah; for the law shall not perish from the priest, nor counsel from the wise, nor the word from the prophet. Come, and let us smite him with the tongue, and let us not give heed to any of his words.","19":"Give heed to me, O LORD, and hearken to the voice of them that contend","20":"Shall evil be recompensed for good? for they have digged a pit for my soul. Remember that I stood before thee to speak good for them, *and* to turn away thy wrath","21":"Therefore deliver up their children to the famine, and pour out their *blood* by the force of the sword; and let their wives be bereaved of their children, and *be* widows; and let their men be put to death; *let* their young men *be* slain by the sword in battle.","22":"Let a cry be heard from their houses, when thou shalt bring a troop suddenly upon them: for they have digged a pit to take me, and hid snares for my feet.","23":"Yet, LORD, thou knowest all their counsel against me to slay *me*: forgive not their iniquity, neither blot out their sin from thy sight, but let them be overthrown before thee; deal *thus* with them in the time of thine anger."}},"tsk":{"2":[{"kopje":"ga","refs":["Jer 13:1","Jer 19:1","Jer 19:2","Jes 20:2","Ezech 4:1","Ezech 5:1","Amos 7:7","Hebr 1:1"]},{"kopje":"doen horen","refs":["Jer 23:22","Hand 9:6"]}],"3":[{"kopje":"ging ik","refs":["Jona 1:3","Joh 15:14","Hand 26:19"]}],"4":[{"kopje":"verdorven","refs":["Jer 18:6","Jes 45:9","Rom 9:20-23"]}],"7":[{"kopje":"uitrukken","refs":["Jer 1:10","Jer 12:14-17","Jer 25:9-14","Jer 45:4","Amos 9:8","Jona 3:4"]}],"8":[{"kopje":"datzelfde volk","refs":["Jer 7:3-7","Jer 36:3","Richt 10:15","Richt 10:16","1 Kon 8:33","1 Kon 8:34","2 Kron 12:6","Jes 1:16-19","Ezech 18:21","Ezech 33:11","Ezech 33:13","Jona 2:5-10","Luk 13:3-5"]},{"kopje":"dan zal Ik","refs":["Jer 15:6","Jer 26:3","Jer 26:13","Jer 42:10","Ex 32:12","Deut 32:36","Richt 2:18","Ps 90  wl-kjv\" data-code=\"H4194\">death;</span> let their young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> be <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> in battle.","22":"Let a <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> be <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> from their <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> when thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> a <span class=\"wl wl-kjv\" data-code=\"H1416\">troop</span> <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly</span> upon them: for they have <span class=\"wl wl-kjv\" data-code=\"H3738\">digged</span> a <span class=\"wl wl-kjv\" data-code=\"H7745\">pit</span> to <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> me, and <span class=\"wl wl-kjv\" data-code=\"H2934\">hid</span> <span class=\"wl wl-kjv\" data-code=\"H6341\">snares</span> for my feet.","23":"Yet, <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> all their <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> against me to <span class=\"wl wl-kjv\" data-code=\"H4194\">slay</span> me: <span class=\"wl wl-kjv\" data-code=\"H3722\">forgive</span> not their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> neither blot <span class=\"wl wl-kjv\" data-code=\"H4229\">out</span> their <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> from thy <span class=\"wl wl-kjv\" data-code=\"H6440\">sight,</span> but let them be <span class=\"wl wl-kjv\" data-code=\"H3782\">overthrown</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee; <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> thus with them in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of thine anger."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"pottenbakkers,","tekst":"Hebreeuws, des formeerders."}],"3":[{"catchword":"maakte een werk","tekst":"Of, hij deed [zijn] werk, hij arbeidde."},{"catchword":"schijven","tekst":"Het Hebreeuwse woord staat in het getal van meervoud, omdat er twee raderen of schijven zijn, die de pottenbakkers in hun arbeid gebruiken, het onderste, dat groter is, en het bovenste, dat kleiner is, gelijk sommigen betuigen dat alsnog in de oosterse landen ook gebruikelijk is. Anders: stoelen, vormen."}],"4":[{"catchword":"maakte,","tekst":"Anders: dat hij van leem maakte, met zijne handen."},{"catchword":"als leem,","tekst":"Dat is, gelijk leem in de hand van een pottenbakker somtijds wel pleegt te misvallen."},{"catchword":"weder een ander vat,","tekst":"Hebreeuws, hij keerde weder en maakte dat een ander vat."},{"catchword":"recht was","tekst":"Dat is, alzo het hem goeddocht of behaagde."}],"7":[{"catchword":"uitrukken,","tekst":"Gelijk boven Jer 1:10 ."}],"8":[{"catchword":"berouw hebben","tekst":"Zie Gen 6:6 , alzo vs.10."},{"catchword":"kwaad,","tekst":"Dit is, ongeluk, ellende, plagen, alzo vs.11."},{"catchword":"hetzelve","tekst":"Dat volk en koninkrijk."}],"10":[{"catchword":"goede,","tekst":"Dat is, geluk, voorspoed, zegen."},{"catchword":"hetzelve","tekst":"Dat volk en koninkrijk."}],"11":[{"catchword":"mannen van Juda","tekst":"Gelijk boven Jer 17:25 , en Jer 4:3 ."},{"catchword":"formeer","tekst":"Het Hebreeuwse woord is hetzelfde, dat boven een pottenbakker betekende. Alsof de Heere zeide: Ik zal een kwaad tegen u bereiden en bakken, enz."},{"catchword":"kwaad","tekst":"Gelijk vs.8."},{"catchword":"gedachte;","tekst":"Dat is: Ik heb voorgekomen dat kwaad over u te brengen; vergelijk 2Sa 14:14 , en onder vs.18."},{"catchword":"maakt uw wegen","tekst":"Zie boven Jer 7:3 ."}],"12":[{"catchword":"Het is buiten hoop;","tekst":"Zie boven Jer 2:25 , en Jer 6:16 ."},{"catchword":"goeddunken","tekst":"Gelijk Jer 3:17 ."}],"13":[{"catchword":"jonkvrouw","tekst":"Vergelijk boven Jer 14:17 ."},{"catchword":"afschuwelijke zaak","tekst":"Vergelijk boven Jer 5:30 ."}],"14":[{"catchword":"om een rotssteen","tekst":"Dat is, zal men de lieflijke verkoelende sneeuw van den berg Libanon [waarbij zich God vergelijkt] verlaten om een dorren drogen rotssteen des velds; waarbij de afgoden en de afgoderij vergeleken worden?"},{"catchword":"vreemde,","tekst":"Die uit andere afgelegen bergachtige plaatsen door verholen gangen afvlieten en met kanalen afgeleid worden, en ten laatste in of nabij ene stad, een frisse, koele en zeer aangename fontein maken of uitgeven, zodat het zotheid zou zijn die te verlaten en elders ander water te zoeken. Anders: zullen ook de stromen [te weten die bij de hand of nabij zijn] verlaten worden [om] vreemde, of uitlandse, of schrikkelijk [gelijk het woord vreemd ook genomen wordt Isa 28:21 ] koude wateren, die onbekend, ongezond en zeer schadelijk mochten zijn? De mening van dit vs. [dat verscheidenlijk wordt overgezet] is, dat Gods volk zeer dwaas handelde, verlatende den waren God en godsdienst waarin hun heil bestond, en lopende tot de heidense afgoden om hulp, tot hun eigen verderf."}],"15":[{"catchword":"ijdelheid;","tekst":"Den afgoden, gelijk boven Jer 14:22 ."},{"catchword":"zij hebben hen","tekst":"De valse profeten hebben teweeggebracht dat het volk, zich verergerde aan den rechten godsdienst, tot afgoderij geweken is. Vergelijk Mal 2:8 ."},{"catchword":"hun wegen,","tekst":"Die hun van God waren voorgeschreven."},{"catchword":"oude paden,","tekst":"Hebreeuws, paden der eeuwigheid; dat is, oudheid, die in voortijden van God waren geleerd, door Mozes verklaard en van de vrome voorvaders bewandeld. Van deze betekenis van het woord Olam zie boven Jer 2:20 , en Jer 6:16 ."},{"catchword":"weg, die","tekst":"Of, ongebaanden weg, als daar zijn rotsstenen en sneeuwachtige bergen, waarvan in vs.14."},{"catchword":"opgehoogd is;","tekst":"Dat is, niet gebaand, waarop het onbekwaam en gevaarlijk is te wandelen."}],"16":[{"catchword":"Om hun land","tekst":"Of, stellende, enz., dat is, deze straffen daardoor veroorzakende en over hun hals halende; of opdat Ik daardoor vertoornd zijnde, hun land, enz. Vergelijk onder Jer 27:10 , Jer 27:15 ; Lam 2:14 ; Mic 6:16 , met de aantekening."},{"catchword":"ontzetting,","tekst":"Dat is, stof van schrik en verwondering. Anders: verwoesting, alzo onder Jer 19:8 , en Jer 25:9 , en Jer 29:18 , enz."},{"catchword":"aanfluitingen;","tekst":"Of, schuifelingen, sijfelingen, pijpingen der eeuwigheid; tekenen van smaadheid en schande; zie 1Ki 9:8 ; onder Jer 19:8 , en Jer 25:9 , Jer 25:18 , en Jer 29:18 , enz."},{"catchword":"hoofd schudden","tekst":"Zie 2Ki 19:21 ."}],"17":[{"catchword":"Als een oostenwind","tekst":"Dat is, alsof Ik een oostenwind ware. Of, als [met] een oostenwind; die zeer sterk en doordringend was in die landen. Zie Exo 10:13 ; Job 27:21 ."},{"catchword":"nek","tekst":"Dat is, mij afkerig en niet goedwillig of gunstig tegen hen tonen, gelijk zij tegen mij ook gedaan hebben. Hebreeuws, Ik zal hun den nek en niet het aangezicht zien, hetwelk enigen alzo verstaan, dat God hen, vluchtende, van achteren zal nazien of vervolgen; zie onder Jer 32:33 ."},{"catchword":"verderfs","tekst":"Of, dodelijk ongeval."}],"18":[{"catchword":"zij","tekst":"Tot wie Jeremia dit alles door Gods bevel gesproken had; zie boven vs.11, of, zij hebben gezegd, of zeggen."},{"catchword":"gedachten","tekst":"Dat is, aanslagen tegen hem maken, praktijken beramen om hem van kant te helpen. Vergelijk de manier van spreken met vs.11."},{"catchword":"wet","tekst":"Of, leer; zie Psa 1:2 . Zij willen zeggen dat Jeremia een vals profeet is, omdat vast allen, die onder Gods volk in aanzien zijn, als priester, oudsten en andere profeten, hem tegenspreken, van wie zij nochtans geloven dat Gods Geest hen moet gehoorzamen; zie Deu 17:9-10 ; Mal 2:7-8 ; Joh 7:48-49 ."},{"catchword":"de tong,","tekst":"Hem met valse getuigenissen overvallen en als een valsen profeet ter dood helpen. Anders: om der tongen wil; dat is, om zijn verdrietelijke en onverdragelijke profetieën."}],"19":[{"catchword":"mijner twisters","tekst":"Dat is, dergenen, die met mij twisten, van wie hij boven geklaagd heeft dat zij van hem afweken, Jer 17:13 ."}],"20":[{"catchword":"Zal dan kwaad","tekst":"Is dat betamelijk? Heb ik dat met mijne getrouwheid aan hen verdiend? wil de profeet zeggen."},{"catchword":"mijn ziel","tekst":"Dat is, een aanslag gemaakt om mij het leven te benemen."},{"catchword":"goed voor hen","tekst":"Of, het goede, ten beste, dat is, om voor hen te bidden; zulks dat Gij mij hebt moeten bevelen dat ik gene voorbeden meer zou doen; zie boven Jer 7:16 , en Jer 11:14 , en Jer 14:14 ."}],"21":[{"catchword":"geef hun zonen","tekst":"Vergelijk dit gebed met Psa 69:23 , enz., en Psa 109:6 , enz., en zie de aantekening aldaar."},{"catchword":"wegvloeien","tekst":"Hunne krachten vergaan als water, dat uitgestort is; of hun bloed wegvloeien, enz.; vergelijk 2Sa 14:14 ; Psa 22:15 , en Psa 63:11 ; Eze 35:5 ."},{"catchword":"geweld","tekst":"Of, middel van het zwaard. Hebreeuws, handen des zwaards. Alzo Job 5:20 ; zie aldaar."},{"catchword":"kinderen","tekst":"Vergelijk boven Jer 15:7-8 ."},{"catchword":"door den dood","tekst":"Hebreeuws, gedoden des doods zijn."},{"catchword":"met het zwaard","tekst":"Hebreeuws, geslagenen des zwaards."}],"22":[{"catchword":"bende","tekst":"Een hoop van rovende en verdervende krijgslieden, te weten de Babyloniërs."},{"catchword":"brengen;","tekst":"Of, gebracht hebben."},{"catchword":"kuil gegraven","tekst":"Vergelijk Psa 7:16 , en Psa 9:16 , en Psa 35:7 , en Psa 57:7 , enz."},{"catchword":"verborgen","tekst":"Dat is, in het verborgen gelegd om mij te doen vallen."}],"23":[{"catchword":"ten dode;","tekst":"Strekkende om mij te doden."},{"catchword":"verzoening","tekst":"Of, bedek niet genadiglijk; vergelijk Psa 65:4 , met de aantekening."},{"catchword":"van voor Uw aangezicht;","tekst":"Dat zij niet zou voor U blijven in gedachte en rekening, om gestraft te worde // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    return label + refChips(nd.refs) + kids;
  };

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
