}},"vertalingen":{"SVnu":{"1":"Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan.","2":"En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood *bestemd is*, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap!","3":"Want Ik zal een bezoeking over hen brengen met vier soorten *straf*, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.","4":"En Ik zal hen overgeven tot een schrikbeeld voor alle koninkrijken van de aarde, vanwege Manasse, zoon van Jehizkia, koning van Juda, om wat hij in Jeruzalem gedaan heeft.","5":"Want wie zou u sparen, o Jeruzalem? of wie zou medelijden met u hebben, of wie zou omgaan om u naar vrede te vragen?","6":"U hebt Mij verlaten, spreekt de HEERE; u bent achterwaarts gegaan; daarom zal Ik Mijn hand tegen u uitstrekken en u vernietigen; Ik ben het van het berouwen moe geworden.","7":"En Ik zal hen wannen met een wan, in de poorten van het land; Ik heb Mijn volk van kinderen beroofd en te gronde gericht; zij zijn van hun wegen niet teruggekeerd.","8":"Hun weduwen zijn Mij meer geworden dan het zand van de zeeën; Ik heb hun over de moeder een jongeman doen komen, een verwoester op de middag; Ik heb hem haastig hen doen overvallen, de stad met verschrikkingen.","9":"Zij die zeven *kinderen* baarde, is zwak geworden; zij heeft haar ziel uitgeblazen, haar zon is ondergegaan, toen het nog dag was; zij is beschaamd en te schande geworden; en hun overblijfsel zal Ik aan het zwaard overgeven, voor het aangezicht van hun vijanden, spreekt de HEERE.","10":"Wee mij, mijn moeder, dat u mij gebaard hebt, een man van twist, en een man van ruzie voor het hele land! Ik heb hun niet op rente gegeven, ook hebben zij mij niet op rente gegeven, *toch* vervloekt mij ieder van hen.","11":"De HEERE zei: Zeker, uw overblijfsel zal het goed hebben! Zeker, Ik zal ervoor zorgen dat de vijand in de tijd van het kwaad en in de tijd van de benauwdheid u goed behandelt!","12":"Zal ook enig ijzer het ijzer uit het noorden of koper verbreken?","13":"Ik zal uw vermogen en uw schatten als een roof geven, zonder prijs; en dat om al uw zonden, en in al uw gebieden.","14":"En Ik zal u overvoeren met uw vijanden, naar een land dat u niet kent; want een vuur is aangestoken in Mijn toorn, het zal over u branden.","15":"O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.","16":"Toen Uw woorden gevonden werden, heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap van mijn hart; want ik ben naar Uw Naam genoemd, o HEERE, God van de heerscharen*!","17":"Ik heb in de raad van de spotters niet gezeten, en ben ook niet van vreugde opgesprongen; vanwege Uw hand heb ik alleen gezeten, want U hebt mij met gramschap vervuld.","18":"Waarom is mijn pijn steeds durend, en mijn plaag smartelijk? Zij weigert genezen te worden; zou U voor mij helemaal als een leugenachtige zijn, als water dat niet betrouwbaar is?","19":"Daarom zegt de HEERE zo: Als u zult terugkeren, zal Ik u laten terugkeren; u zult voor Mijn aangezicht staan; en als u het kostbare van het waardeloze scheidt, zult u als Mijn mond zijn; laat hen naar u terugkeren, maar u zult niet naar hen terugkeren.","20":"Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE.","21":"Ja, Ik zal u redden uit de hand van de bozen, en Ik zal u verlossen uit de greep van de tirannen."},"SV":{"1":"Maar de HEERE zeide tot mij: Al stond Mozes en Samuël voor Mijn aangezicht, zo zou *toch* Mijn ziel tot dit volk niet wezen; drijf ze weg van Mijn aangezicht, en laat ze uitgaan.","2":"En het zal geschieden, wanneer zij tot u zullen zeggen: Waarhenen zullen wij uitgaan? dat gij tot hen zult zeggen: Zo zegt de HEERE: Wie ten dood, ten dode; en wie tot het zwaard, ten zwaarde, en wie tot den honger, ten honger; en wie ter gevangenis, ter gevangenis!","3":"Want Ik zal bezoeking over hen doen *met* vier geslachten, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te slepen; en met het gevogelte des hemels, en met het gedierte der aarde, om op te eten en te verderven.","4":"En Ik zal hen overgeven tot een beroering aan alle koninkrijken der aarde, vanwege Manasse, zoon van Jehizkia, koning van Juda, om hetgeen hij te Jeruzalem gedaan heeft.","5":"Want wie zou u verschonen, o Jeruzalem? of wie zou medelijden met u hebben, of wie zou aftreden, om u naar vrede te vragen?","6":"Gij hebt Mij verlaten, spreekt de HEERE; gij zijt achterwaarts gegaan; daarom zal Ik Mijn hand tegen u uitstrekken en u verderven; Ik ben des berouwens moede geworden.","7":"En Ik zal hen wannen met een wan, in de poorten des lands; Ik heb Mijn volk van kinderen beroofd *en* verdaan; zij zijn van hun wegen niet wedergekeerd.","8":"Hun weduwen zijn Mij meerder geworden dan zand der zeeën; Ik heb hun over de moeder doen komen een jongeling, een verwoester op den middag; Ik heb *hem* haastelijk hen doen overvallen, de stad met verschrikkingen.","9":"Zij, die zeven baarde, is zwak geworden; zij heeft haar ziel uitgeblazen, haar zon is ondergegaan, als het nog dag was; zij is beschaamd en schaamrood geworden; en hunlieder overblijfsel zal Ik aan het zwaard overgeven, voor het aangezicht hunner vijanden, spreekt de HEERE.","10":"Wee mij, mijn moeder, dat gij mij gebaard hebt, een man van twist, en een man van krakeel den gansen lande! Ik heb *hun* niet op woeker gegeven, ook hebben zij mij niet op woeker gegeven, *nog* vloekt mij een ieder van hen.","11":"De HEERE zeide: Zo niet uw overblijfsel ten goede zal zijn! zo Ik niet, in de tijd des kwaads en in tijd der benauwdheid, bij den vijand voor u tussenkome!","12":"Zal ook *enig* ijzer het ijzer van het noorden of koper verbreken?","13":"Ik zal uw vermogen en uw schatten tot een roof geven, zonder prijs; en dat om al uw zonden, en in al uw landpalen.","14":"En Ik zal *u* overvoeren met uw vijanden, in een land, *dat* gij niet kent; want een vuur is aangestoken in Mijn toorn, het zal over u branden.","15":"O HEERE! Gij weet *het*, gedenk mijner, en bezoek mij, en wreek mij van mijn vervolgers; neem mij niet weg in Uw lankmoedigheid *over* *hen*; weet, dat ik om Uwentwil versmaadheid drage.","16":"*Als* Uw woorden gevonden zijn, zo heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap mijns harten; want ik ben naar Uw Naam genoemd, o HEERE, God der heirscharen!","17":"Ik heb in den raad der bespotters niet gezeten, noch ben van vreugde opgesprongen; vanwege Uw hand heb ik alleen gezeten, want Gij hebt mij *met* gramschap vervuld.","18":"Waarom is mijn pijn steeds durende, en mijn plage smartelijk? Zij weigert geheeld te worden; zoudt Gij mij ganselijk zijn als een leugenachtige, *als* wateren, *die* niet bestendig zijn?","19":"Daarom zegt de HEERE alzo: Zo gij zult wederkeren, zo zal Ik u doen wederkeren; gij zult voor Mijn aangezicht staan; en zo gij het kostelijke van het snode uittrekt, zult gij als Mijn mond zijn; laat hen tot u wederkeren, maar gij zult tot hen niet wederkeren.","20":"Want Ik heb u tegen dit volk gesteld tot een koperen vasten muur; zij zullen wel tegen u strijden, maar u niet overmogen; want Ik ben met u, om u te behouden en om u uit te rukken, spreekt de HEERE.","21":"Ja, Ik zal u rukken uit de hand der bozen, en Ik zal u verlossen uit de handpalm der tirannen."},"KJV":{"1":"Then said the LORD unto me, Though Moses and Samuel stood before me, *yet* my mind *could* not *be* toward this people: cast *them* out of my sight, and let them go forth.","2":"And it shall come to pass, if they say unto thee, Whither shall we go forth? then thou shalt tell them, Thus saith the LORD; Such as *are* for death, to death; and such as *are* for the sword, to the sword; and such as *are* for the famine, to the famine; and such as *are* for the captivity, to the captivity.","3":"And I will appoint over them four kinds, saith the LORD: the sword to slay, and the dogs to tear, and the fowls of the heaven, and the beasts of the earth, to devour and destroy.","4":"And I will cause them to be removed into all kingdoms of the earth, because of Manasseh the son of Hezekiah king of Judah, for *that* which he did in Jerusalem.","5":"For who shall have pity upon thee, O Jerusalem? or who shall bemoan thee? or who shall go aside to ask how thou doest?","6":"Thou hast forsaken me, saith the LORD, thou art gone backward: therefore will I stretch out my hand against thee, and destroy thee; I am weary with repenting.","7":"And I will fan them with a fan in the gates of the land; I will bereave *them* of children, I will destroy my people, *since* they return not from their ways.","8":"Their widows are increased to me above the sand of the seas: I have brought upon them against the mother of the young men a spoiler at noonday: I have caused *him* to fall upon it suddenly, and terrors upon the city.","9":"She that hath borne seven languisheth: she hath given up the ghost; her sun is gone down while *it was* yet day: she hath been ashamed and confounded: and the residue of them will I deliver to the sword before their enemies, saith the LORD.","10":"Woe is me, my mother, that thou hast borne me a man of strife and a man of contention to the whole earth! I have neither lent on usury, nor men have lent to me on usury; *yet* every one of them doth curse","11":"The LORD said, Verily it shall be well with thy remnant; verily I will cause the enemy to entreat thee *well* in the time of evil and in the time of affliction.","12":"Shall iron break the northern iron and the steel?","13":"Thy substance and thy treasures will I give to the spoil without price, and *that* for all thy sins, even in all thy borders.","14":"And I will make *thee* to pass with thine enemies into a land *which* thou knowest not: for a fire is kindled in mine anger, *which* shall burn","15":"O LORD, thou knowest: remember me, and visit me, and revenge me of my persecutors; take me not away in thy longsuffering: know that for thy sake I have suffered rebuke.","16":"Thy words were found, and I did eat them; and thy word was unto me the joy and rejoicing of mine heart: for I am called by thy name, O LORD God of hosts.","17":"I sat not in the assembly of the mockers, nor rejoiced; I sat alone because of thy hand: for thou hast filled me with indignation.","18":"Why is my pain perpetual, and my wound incurable, *which* refuseth to be healed? wilt thou be altogether unto me as a liar, *and as* waters *that* fail?","19":"Therefore thus saith the LORD, If thou return, then will I bring thee again, *and* thou shalt stand before me: and if thou take forth the precious from the vile, thou shalt be as my mouth: let them return unto thee; but return","20":"And I will make thee unto this people a fenced brasen wall: and they shall fight against thee, but they shall not prevail against thee: for I *am* with thee to save thee and to deliver thee, saith the LORD.","21":"And I will deliver thee out of the hand of the wicked, and I will redeem thee out of the hand of the terrible."}},"tsk":{"1":[{"kopje":"Al stonden","refs":["Jer 7:16","Jer 11:14","Jer 14:11","Ezech 14:14","Ezech 14:21"]},{"kopje":"Mozes","refs":["Ex 32:11-14","Num 14:13-20","1 Sam 7:9","1 Sam 12:23","Ps 99:6"]},{"kopje":"stonden","refs":["Jer 18:20","Gen 19:27","Ps 106:23","Zach 3:3","Hebr 9:24"]},{"kopje":"Mijn ziel","refs":["Richt 5:9","Spr 14:35"]},{"kopje":"drijf","refs":["Jer 7:15","Jer 23:39"," a-code=\"H6299\">Ik</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6299\">zal</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6299\">u</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6299\">verlossen</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6299\">uit</span> de greep van <span class=\"wl\" data-l=\"L5\" data-code=\"H6184\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6184\">tirannen</span>."},"koppeling_kjv":{"1":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto me, Though <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me, yet my <span class=\"wl wl-kjv\" data-code=\"H5315\">mind</span> could not be toward this <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> cast them <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> of my <span class=\"wl wl-kjv\" data-code=\"H6440\">sight,</span> and let them go forth.","2":"And it shall come to pass, if they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto thee, Whither shall we go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth?</span> then thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Such as are for <span class=\"wl wl-kjv\" data-code=\"H4194\">death,</span> to <span class=\"wl wl-kjv\" data-code=\"H4194\">death;</span> and such as are for the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> to the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and such as are for the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> to the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine;</span> and such as are for the <span class=\"wl wl-kjv\" data-code=\"H7628\">captivity,</span> to the captivity.","3":"And I will <span class=\"wl wl-kjv\" data-code=\"H6485\">appoint</span> over them <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H4940\">kinds,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> to <span class=\"wl wl-kjv\" data-code=\"H2026\">slay,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> to <span class=\"wl wl-kjv\" data-code=\"H5498\">tear,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> and destroy.","4":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">cause</span> them to be <span class=\"wl wl-kjv\" data-code=\"H2189\">removed</span> into all <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"H1558\">because</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> for that which he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> in Jerusalem.","5":"For who shall have <span class=\"wl wl-kjv\" data-code=\"H2550\">pity</span> upon thee, O <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem?</span> or who shall <span class=\"wl wl-kjv\" data-code=\"H5110\">bemoan</span> thee? or who shall go <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> to <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> how thou doest?","6":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H5203\">forsaken</span> me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thou art <span class=\"wl wl-kjv\" data-code=\"H3212\">gone</span> <span class=\"wl wl-kjv\" data-code=\"H268\">backward:</span> therefore will I stretch <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against thee, and <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> thee; I am <span class=\"wl wl-kjv\" data-code=\"H3811\">weary</span> with repenting.","7":"And I will <span class=\"wl wl-kjv\" data-code=\"H2219\">fan</span> them with a <span class=\"wl wl-kjv\" data-code=\"H4214\">fan</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> I will <span class=\"wl wl-kjv\" data-code=\"H7921\">bereave</span> them of children, I will <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> since they <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> not from their ways.","8":"Their <span class=\"wl wl-kjv\" data-code=\"H490\">widows</span> are <span class=\"wl wl-kjv\" data-code=\"H6105\">increased</span> to me above the <span class=\"wl wl-kjv\" data-code=\"H2344\">sand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">seas:</span> I have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> upon them against the <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> of the young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> a <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiler</span> at <span class=\"wl wl-kjv\" data-code=\"H6672\">noonday:</span> I have caused him to <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> upon it <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly,</span> and <span class=\"wl wl-kjv\" data-code=\"H928\">terrors</span> upon the city.","9":"She that hath <span class=\"wl wl-kjv\" data-code=\"H3205\">borne</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H535\">languisheth:</span> she hath given <span class=\"wl wl-kjv\" data-code=\"H5301\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">ghost;</span> her <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">gone</span> down while it was yet <span class=\"wl wl-kjv\" data-code=\"H3119\">day:</span> she hath been <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> and <span class=\"wl wl-kjv\" data-code=\"H2659\">confounded:</span> and the <span class=\"wl wl-kjv\" data-code=\"H7611\">residue</span> of them will I <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> to the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","10":"<span class=\"wl wl-kjv\" data-code=\"H188\">Woe</span> is me, my <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H3205\">borne</span> me a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H7379\">strife</span> and a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H4066\">contention</span> to the whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth!</span> I have neither lent on <span class=\"wl wl-kjv\" data-code=\"H5383\">usury,</span> nor men have lent to me on <span class=\"wl wl-kjv\" data-code=\"H5383\">usury;</span> yet every one of them doth curse","11":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3808\">Verily</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H2896\">well</span> with thy <span class=\"wl wl-kjv\" data-code=\"H8281\">remnant;</span> <span class=\"wl wl-kjv\" data-code=\"H518\">verily</span> I will cause the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> to <span class=\"wl wl-kjv\" data-code=\"H6293\">entreat</span> thee well in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> and in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of affliction.","12":"Shall <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> <span class=\"wl wl-kjv\" data-code=\"H7489\">break</span> the <span class=\"wl wl-kjv\" data-code=\"H6828\">northern</span> <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> and the steel?","13":"Thy <span class=\"wl wl-kjv\" data-code=\"H2428\">substance</span> and thy <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to the <span class=\"wl wl-kjv\" data-code=\"H957\">spoil</span> without <span class=\"wl wl-kjv\" data-code=\"H4242\">price,</span> and that for all thy <span class=\"wl wl-kjv\" data-code=\"H2403\">sins,</span> even in all thy borders.","14":"And I will make thee to <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> with thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> into a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> not: for a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> is <span class=\"wl wl-kjv\" data-code=\"H6919\">kindled</span> in mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> which shall burn","15":"O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest:</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> me, and <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> me, and <span class=\"wl wl-kjv\" data-code=\"H5358\">revenge</span> me of my <span class=\"wl wl-kjv\" data-code=\"H7291\">persecutors;</span> take me not <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> in thy <span class=\"wl wl-kjv\" data-code=\"H639\">longsuffering:</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that for thy sake I have <span class=\"wl wl-kjv\" data-code=\"H5375\">suffered</span> rebuke.","16":"Thy <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> were <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> and I did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> them; and thy <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> was unto me the <span class=\"wl wl-kjv\" data-code=\"H8342\">joy</span> and <span class=\"wl wl-kjv\" data-code=\"H8057\">rejoicing</span> of mine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart:</span> for I am <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> by thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of hosts.","17":"I <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> not in the <span class=\"wl wl-kjv\" data-code=\"H5475\">assembly</span> of the <span class=\"wl wl-kjv\" data-code=\"H7832\">mockers,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5937\">rejoiced;</span> I <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> <span class=\"wl wl-kjv\" data-code=\"H910\">alone</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> for thou hast <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> me with indignation.","18":"Why is my <span class=\"wl wl-kjv\" data-code=\"H3511\">pain</span> <span class=\"wl wl-kjv\" data-code=\"H5331\">perpetual,</span> and my <span class=\"wl wl-kjv\" data-code=\"H4347\">wound</span> <span class=\"wl wl-kjv\" data-code=\"H605\">incurable,</span> which <span class=\"wl wl-kjv\" data-code=\"H3985\">refuseth</span> to be <span class=\"wl wl-kjv\" data-code=\"H7495\">healed?</span> wilt thou be altogether unto me as a <span class=\"wl wl-kjv\" data-code=\"H391\">liar,</span> and as <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> that fail?","19":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> If thou <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> then will I bring thee <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me: and if thou take <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> from the <span class=\"wl wl-kjv\" data-code=\"H2151\">vile,</span> thou shalt be as my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> let them <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto thee; but return","20":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee unto this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> a <span class=\"wl wl-kjv\" data-code=\"H1219\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H2346\">wall:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against thee, but they shall not <span class=\"wl wl-kjv\" data-code=\"H3201\">prevail</span> against thee: for I am with thee to <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> thee and to <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> thee, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","21":"And I will <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> thee out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H7451\">wicked,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem</span> thee out of the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of the terrible."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de HEERE","tekst":"God antwoordt wijders op de voorgaande voorbede van Jeremia."},{"catchword":"stond Mozes","tekst":"Dat is, al waren zij nu in het leven en baden voor dit volk, zo zou Ik hen toch niet verhoren, gelijk Ik wel eertijds gedaan heb; zie Exo 32:14 ; 1Sa 7:9 , en vergelijk Eze 14:14 , Eze 14:18 , Eze 14:20 ."},{"catchword":"ziel","tekst":"Dat is, lust, genegenheid, vergelijk Psa 27:12 ."},{"catchword":"drijf ze weg","tekst":"Dat is, profeteer hun in mijn naam dat Ik hen uit mijn huis, stad en land zal verdrijven. Vergelijk boven Jer 1:10 ."}],"2":[{"catchword":"ten dood,","tekst":"Dat is, sterfte, pest, enz. Versta, gesteld of verordineerd of overgegeven [gelijk vs.4] is, die zal uitgaan tot, enz. gelijk uit het voorgaande kan worden afgenomen, en zo in het volgende, alzo onder Jer 43:11 ."}],"3":[{"catchword":"bezoeking","tekst":"Anders: Ik zal over hen stellen, als officieren, of opzieners."},{"catchword":"geslachten,","tekst":"Dat is, soorten van plagen, die in het volgende worden opgeteld, vergelijk Eze 14:21 ."},{"catchword":"slepen;","tekst":"Tot verscheuring."}],"4":[{"catchword":"overgeven","tekst":"Of, stellen."},{"catchword":"beroering","tekst":"Of, omjaging, omdrijving in alle koninkrijken, enz. Zie Deu 28:25 ."},{"catchword":"Manasse,","tekst":"2Ki 21:11-13 , enz."}],"5":[{"catchword":"u verschonen,","tekst":"Of, zich over u ontfermen?"},{"catchword":"medelijden","tekst":"Of, u beklagen?"},{"catchword":"aftreden,","tekst":"Gelijk men van den weg afgaat, om een vriend of bekende aan te spreken en te vragen hoe het met hem is; zie Jdg 18:15 ."},{"catchword":"vrede","tekst":"Dat is, naar uw welstand, hoe het u gaat; zie Gen 43:27 . Zij zijn niet waardig [wil de Heere zeggen] dat men zich met hen zoveel zou bemoeien, dat men eens zou vragen of het hun wel of kwalijk gaat."}],"6":[{"catchword":"berouwens","tekst":"Dat is, dat Ik de welverdiende straffen langer zou ophouden, uitstellen, minderen of afwenden, gelijk Ik dikwijls gedaan heb, maar nu des moede ben; menselijk God gesproken; vergelijk Gen 6:6 ."}],"7":[{"catchword":"poorten","tekst":"Dat is, in de landpalen, uiterste grenssteden, sterkten, waarop gij u nu verlaat; gelijk men het koren in of voor de deuren wel pleegt te wannen en te schudden, om het kaf en stof bij den wind te verstrooien en uit te wannen; alzo enz. Anders: in de steden des lands; dat is, overal."},{"catchword":"heb Mijn volk","tekst":"Dat is, Ik zal enz., en zo in vs.8."},{"catchword":"kinderen","tekst":"Of, van alles wat zij hebben, of hun lief is; omdat in het volgende van de weduwen gesproken wordt, en het Hebreeuwse woord niet alleen gebruikt wordt van beroving van kinderen, maar ook van andere dingen. Zie 2Ki 2:19 ; Eze 36:12-15 , met de aantekening."},{"catchword":"wegen","tekst":"Dat is, hebben zich van hun bozen handel en wandel niet bekeerd. Zie Gen 6:12 ."}],"8":[{"catchword":"Hun weduwen","tekst":"Van het volk."},{"catchword":"meerder","tekst":"Of, sterker in getal; doordien hune mannen bij menigten zouden omgebracht worden."},{"catchword":"moeder","tekst":"Namelijk Jeruzalem. Anders: over de moeder der jongelingen een verwoester op den middag; dat is, over de vergadering der jonge manschap."},{"catchword":"jongeling,","tekst":"Den koning van Babel, wakker en fris zijnde in dit werk, als een jongeling."},{"catchword":"middag;","tekst":"Vergelijk boven Jer 6:4 ."},{"catchword":"de stad","tekst":"Hebreeuws, de stad, en verschrikkingen of verbaasdheden. De zin kan zijn: Ik, zal dien jongeling haar, te weten de stad, en daar zal enkel schrik zijn, of zodat er grote schrik zal zijn. Of aldus: Ik zal haastiglijk op hen de stad doen vallen en verschrikkingen."}],"9":[{"catchword":"Zij,","tekst":"Namelijk Jeruzalem, die zoveel volk uitgaf als ene vrouw die zeven, dat is, vele [zie Gen 4:15 ] kinderen voortbrengt."},{"catchword":"ziel","tekst":"Is gestorven van hartzeer en jammer, en troosteloos. Vergelijk Job 11:20 ."},{"catchword":"zon","tekst":"Dat is, haar vreugde, of bloeiende staat, is veranderd in de uiterste droefenis en ellende, ten tijde als zij nog in haar bloei was of meende te zijn. Vergelijk 2Sa 23:4 ; Amo 8:9 ; Mic 3:6 ."},{"catchword":"dag was;","tekst":"Of, hunlieder dag."},{"catchword":"overblijfsel","tekst":"Die in het eerst niet zijn omgebracht."}],"10":[{"catchword":"Wee mij,","tekst":"De profeet, merkende dat hij Gods oordeel niet kon afbidden, wordt hartelijk bedroefd en klaagt over zijn moeilijken verdrietigen staat onder zijne boze landslieden, waartegen de Heere hem vertroost in vs.11."},{"catchword":"twist,","tekst":"Met wien een ieder twist en krakeelt. Vergelijk 2Sa 8:10 ."},{"catchword":"woeker","tekst":"Waaruit gemeenlijk twisten en krakelen, schelden en lasteren pleegt te ontstaan. De profeet wil zeggen dat hij hun geen oorzaak heeft gegeven van twist, haat en vloek, als niets met hen te doen hebbende, buiten des Heeren woord en zijn beroep, waarom hij alleenlijk moest lijden."}],"11":[{"catchword":"Zo niet","tekst":"Een afgebroken rede in het eedzweren gebruikelijk. Zie Gen 14:23 , en Deu 1:35 . God zweert Jeremia dat Hij zijn lijden ten beste zal veranderen, zodat hij het ten tijde van des vijands overval veel beter zal hebben dan dit boze volk. Sommigen nemen het vragenderwijze, in denzelfden zin."},{"catchword":"overblijfsel","tekst":"Of, het overige van u. De zin schijnt te zijn: zo Ik niet zal maken dat het u welga in den overigen tijd van uw leven, waarin gij zult overblijven, wanneer dit boze volk zal geplaagd worden en omkomen; of, dat Ik het volk een overblijfsel behoud in het midden der straffen."},{"catchword":"kwaads","tekst":"Dat is, der plagen en ellenden."},{"catchword":"tussenkome","tekst":"Of, voorspreek, tussenspreek, gelijk Isa 59:16 . Of, den vijand u [ten goede] doe bejegenen! Dat is, make dat de vijand u vriendelijk behandele. Zie de vervulling hiervan onder Jer 40:1-4 , enz."}],"12":[{"catchword":"koper","tekst":"Of, staal."},{"catchword":"verbreken?","tekst":"Geenszins, wil God zeggen. [Dewijl het noordse ijzer veel harder en als staal is, gelijk de landbeschrijvers ook betuigen,] zijn dan deze lieden, die u dus kwellen, hard, zo ben Ik nog harder, machtig genoeg om hunne aanslagen tegen u te breken. Doch sommigen verstaan dat God in vs.12 wederom begint te spreken van de aankomst der Babyloniërs van het noorden, welker macht de Joden met hun tegenweer zo weinig zouden kunnen wederstaan als een gemeen ijzer zwaard een noords stalen zwaard zou kunnen verbreken; beide in een goeden zin."}],"13":[{"catchword":"vermogen","tekst":"Dat is, rijkdom."},{"catchword":"zonder prijs;","tekst":"Hebreeuws, niet om prijs, of niet in koop; dat is, om niet; zij zullen alles naar hun lust wegnemen zonder u iets daarvoor te geven."},{"catchword":"en in al uw landpalen","tekst":"Versta, zal Ik zulks doen, of om uwe zonden, die gij in al uwe landpalen bedreven hebt, gelijk onder Jer 17:3 ."}],"14":[{"catchword":"u overvoeren","tekst":"Of, [de schatten] [waarvan in vs.13] overvoeren tot, enz. Anders: Ik zal uwe vijanden doen overkomen door een land, dat gij niet kent; dat is, gij zult van hun pas en aankomst niet weten, zij zullen u overkomen door wegen en op ene wijze, die u onbekend zijn. Sommigen verstaan het aldus: Ik zal uwe vijanden over [u] doen heengaan, dat is, tirannisch doen behandelen. Vergelijk Job 13:13 , en Psa 129:3 ."},{"catchword":"vuur","tekst":"Van oorlog, ellende, plagen, verwoesting. Vergelijk onder Jer 17:4 , en Jer 43:12 , en Deu 32:22 ; Job 22:20 , met de aantekening."}],"15":[{"catchword":"het ,","tekst":"Mijne onschuld, waarvan boven, vs.10. Dit zijn de woorden van den profeet weder tot God."},{"catchword":"gedenk mijner,","tekst":"Ten goede, gelijk Neh 5:19 , en Neh 13:21 . Zie Gen 8:1 ."},{"catchword":"bezoek mij,","tekst":"Genadiglijk. Zie Gen 21:1 ."},{"catchword":"in Uw lankmoedigheid","tekst":"Dat is, terwijl Gij dus lankmoedig met mijne vervolgers handelt, dat Gij hen niet verhindert, maar uwe straffen uitstelt, zo verhoed nochtans dat zij mij ondertussen om het leven brengen, gelijk zij voorhebben te doen. Of naar uwe lankmoedigheid, als die zal ten einde zijn en Gij dit volk zult straffen, dan behoud mij. Anders: in, of bij verlenging van uw toorn; dat is, terwijl Gij dit boze volk een langen tijd zult straffen, zo maak toch onderscheid tussen hen en mij, dat ik niet met hen omkome; vergelijk Psa 26:9 ."}],"16":[{"catchword":"gevonden zijn,","tekst":"Dat is, zo haast als zij voorhanden waren, mij geopenbaard werden, of mij door uwe openbaring zijn voorgekomen, heb ik hen met groten ijver aangenomen en zeer vlijtiglijk behartigd. Vergelijk Eze 2:8 , en Eze 3:1-3 , met de aantekening, en Rev 10:9 ."},{"catchword":"ik ben naar Uw Naam","tekst":"Hebreeuws, uw naam is over mij genoemd, of uitgeroepen, dewijl ik uw knecht en profeet ben. Zie boven Jer 7:10 ."},{"catchword":"heirscharen","tekst":"Zie 1Ki 18:15 ."}],"17":[{"catchword":"bespotters","tekst":"Gelijk de priesters en profeten te dien tijde waren."},{"catchword":"gezeten,","tekst":"Vergelijk Psa 1:1 ."},{"catchword":"hand","tekst":"Te weten uw straffende hand, die Gij over dit volk wilt uitstrekken; of om den wil van uw bevel, omdat ik mij ten enenmale van uwe hand en door uwen Geest der profetie wilde laten regeren en U gehoorzamen. Zie Eze 1:3 ."},{"catchword":"alleen gezeten,","tekst":"Mij afscheidende van de bozen, verdrietig zijnde en wenende over hunne boosheid en nakende plagen. Vergelijk boven Jer 9:2 , en Jer 13:17 ; idem Exo 33:7 ."},{"catchword":"gramschap","tekst":"Een heiligen toorn, die ik uit uwe profetieën geschept heb, over de hardnekkigheid van het volk tegen U en wreveligheid tegen mij. Vergelijk boven Jer 6:11 ."}],"18":[{"catchword":"steeds durende,","tekst":"Of, sterk, doordringende. Zie van het Hebreeuwse woord Psa 13:2 ."},{"catchword":"ganselijk","tekst":"Of, enigszins. Hebreeuws, zijnde zijn; dat is, U allerwegen tegen mij betonen, alsof Gij met leugen omringt? dewijl Gij mij zo sterke beloften hebt gedaan [boven Jer 1:17-19 ] , en ik nochtans dagelijks van dit volk geplaagd, en in gevaar ben."},{"catchword":"bestendig zijn?","tekst":"Die uitdrogen, verlopen of wegzijpelen, zodat hij bedrogen wordt, die daarvan meent te scheppen. Vergelijk Job 6:15 . Aldus wordt de profeet met onverduldigheid, verdrietelijkheid, wantrouwen en murmurering, vanwege des volks boosheid, bestreden, waarop God hem in het volgende onderwijst en sterkt."}],"19":[{"catchword":"wederkeren,","tekst":"Van deze onverduldigheid en murmureringen, [waarvan in het voorgaande] zulks dat ze u van uw plicht en ambt niet afrukken."},{"catchword":"wederkeren;","tekst":"Dat is, u opnieuw herstellen en bevestigen in uw profetischen dienst. Anders: zo gij u wenden zult waarheen Ik u wend; dat is, mijne bevelen getrouwelijk verrichte, zo zult gij enz."},{"catchword":"staan;","tekst":"Dat is, mij dienen, mijn knecht en profeet zijn en blijven. Zie 1Ki 17:1 , en 1Ki 18:15 , en Deu 10:8 ."},{"catchword":"het kostelijke","tekst":"Of, den kostelijke van den snode; dat is, de godzaligen [die voor mij zeer dierbaar zijn] onderscheidt van de goddelozen, hun beiden onderscheidenlijk en vrijmoediglijk aanzeggende wat Ik u belast. Sommigen verstaan hier het onderscheiden van ware en valse leer, profetie, vertroosting, enz. Het schijnt een gelijkenis te zijn, genomen van het werk der goudsmeden. Vergelijk boven Jer 6:29 , en zie ook Psa 12:7 ."},{"catchword":"mond zijn;","tekst":"Vergelijk boven Jer 1:9 , dat is, mijn rechte profeet en tolk."},{"catchword":"laat hen","tekst":"Of, zij zullen tot u wederkeren, raad en troost bij u zoekende. Zie onder Jer 37:3 ."},{"catchword":"wederkeren","tekst":"Dat gij door kleinhartigheid of menselijke vrees zoudt bezwijken, hun in hunne boosheid toegeven, voegen of bijvallen; idem, raad en troost van hen zoeken."}],"20":[{"catchword":"heb u tegen","tekst":"Of, en Ik zal u stellen, of Ik stel u; te weten, als opnieuw. Vergelijk Jer 1:18 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But the LORD said unto me;[God answereth furthur to the former intercession of Jeremia] Though Moseh and Samuel stood before my face ,(yet) should not my soul [that is minde affection.Compare Psal.27 on verse 12.] be toward his people:[That is, though they were now alive, and prayed for this people, yet I would not hear them, as I have done heretofore. See Exod. 32.14, 1 Samuel7.9 and compare Ezechiel 14.14,18,20.]drive them away from my face,[that is prophecie unto them in my Name, That I will expell them out of my house, city, and land.Compare above chapter 1 on verse 10.] and let them goe forth."}],"2":[{"catchword":null,"tekst":"And it shall come to pass, when they shall say unto thee, wither shall we go forth? That thou shalt say unto them, thus saith the LORD, whosoever to death, to death,[That is, mortality, pestilence, &c. As may be gathered from the former verse, and so is the sequel. So below chap.43.21.] and whosoever to the sword, to the sword, and whosoever to the famine, to the famine, and whosoever to captivity, to captivity."}],"3":[{"catchword":null,"tekst":"For I will visit them (with) [Oth. I will appoint over them, as officers, or overseers]four kinds,that is, four sorts of plagues, which are reckoned up in the following words. Compare Ezech 14.21] saith the LORD; with the sword to slay, and wth th /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
