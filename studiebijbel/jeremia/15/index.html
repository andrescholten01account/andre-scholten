Zijn gezicht was als de zon wanneer die schijnt in haar kracht.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Hand 10:42": "En Hij heeft ons geboden aan het volk te prediken, en te betuigen dat Hij Degene is Die door God aangesteld is tot een Rechter van levenden en doden.", "Spr 4:14": "Kom niet op het pad van de goddelozen, en betreed niet de weg van de bozen.", "Ex 24:4": "Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "1 Sam 2:5": "Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "Matt 23:35": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar.", "Spr 16:29": "Een man van geweld verlokt zijn naaste, en hij leidt hem op een weg die niet goed is.", "Ex 33:12": "En Mozes zei tegen de HEERE: Zie, U zegt tegen mij: Voer dit volk op! maar U laat mij niet weten aan wie U met mij zult zenden; terwijl U gezegd hebt: Ik ken u bij naam! en ook: U hebt genade gevonden in Mijn ogen!", "Ps 129:2": "Zij hebben mij dikwijls van mijn jeugd af benauwd; toch hebben zij niet de overhand op mij gekregen.", "Ezech 2:7": "Maar u zult Mijn woorden tot hen spreken, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen; want zij zijn opstandig.", "Fil 1:12-14": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is; Zodat mijn banden in Christus openbaar geworden zijn in het hele rechthuis, en aan alle anderen; En dat het merendeel van de broeders in de Heere, doordat zij vertrouwen gekregen hebben door mijn banden, veel overvloediger het Woord onbevreesd durven spreken.", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "Mark 3:5": "En nadat Hij hen met toorn had aangekeken, bedroefd over de verharding van hun hart, zei Hij tegen de man: Strek uw hand uit. En hij strekte hem uit; en zijn hand werd hersteld, gezond als de andere.", "Amos 2:5": "Daarom zal Ik een vuur in Juda zenden, dat zal Jeruzalems paleizen verteren.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "1 Kor 7:12": "Maar tegen de anderen zeg ik, niet de Heere: als een broeder een ongelovige vrouw heeft, en zij ermee tevreden is bij hem te wonen, laat hij haar niet verlaten;", "Jes 31:1-3": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken. Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken. Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Ps 119:172-174": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid. Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen. O HEERE! ik verlang naar Uw heil, en Uw wet is al mijn vermaking.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Jer 11:14": "U dan, bid niet voor dit volk, en hef geen geschrei of gebed voor hen op; want Ik zal niet horen, in de tijd dat zij vanwege hun kwaad tot Mij zullen roepen.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Ps 42:10": "Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?", "Zach 1:4": "Wees niet als uw vaderen, tot wie de vorige profeten riepen en zeiden: Zo zegt de HEERE van de heerscharen: Bekeer u toch van uw slechte wegen en uw slechte daden; maar zij hoorden niet, en zij luisterden niet naar Mij, spreekt de HEERE.", "Ex 29:45": "En Ik zal in het midden van de kinderen van Israël wonen, en Ik zal hun tot een God zijn.", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "Ex 28:38": "En zij zal op het voorhoofd van Aäron zijn, opdat Aäron de ongerechtigheid draagt van de heilige dingen die de kinderen van Israël geheiligd zullen hebben, in alle gaven van hun geheiligde dingen; en zij zal voortdurend aan zijn voorhoofd zijn, om hen voor het aangezicht van de HEERE aangenaam te maken.", "Ezech 11:7-12": "Daarom, zo zegt de Heere HEERE: Uw gedoden, die u in het midden daarvan neergelegd hebt, die zijn het vlees, en deze stad is de pot; maar u zal Ik uit het midden daarvan doen weggaan. U hebt het zwaard gevreesd; en het zwaard zal Ik over u brengen, spreekt de Heere HEERE. Ook zal Ik u uit het midden daarvan doen weggaan, en Ik zal u overgeven in de hand van vreemden; en Ik zal recht onder u doen.", "Rom 11:17-20": "En als enige van de takken afgebroken zijn, en u, een wilde olijfboom zijnde, in hun plaats bent ingeënt, en van de wortel en van de vettigheid van de olijfboom mede deelachtig bent geworden, Roem dan niet tegen de takken; en als u daartegen roemt, u draagt de wortel niet, maar de wortel u. U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden.", "Deut 15:5": "Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied.", "Jer 12:16": "En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "2 Kon 21:11-13": "Omdat Manasse, de koning van Juda, deze gruwelen gedaan heeft, erger doend dan alles wat de Amorieten gedaan hebben die vóór hem geweest zijn, ja, ook Juda door zijn drekgoden heeft doen zondigen; Daarom, zo zegt de HEERE, de God van Israël: Zie, Ik ga een kwaad over Jeruzalem en Juda brengen, zodat ieder die het hoort, beide zijn oren zullen tuiten. En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, alsook het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, zoals men een schotel uitwist; men wist hem uit, en men keert hem om op zijn holle kant.", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "Jer 9:21": "Want de dood is geklommen in onze vensters, hij is in onze paleizen gekomen, om de kinderen uit te roeien van de wijken, de jongemannen van de straten.", "Ps 41:13": "Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "Ex 24:3": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.", "Ps 129:5": "Laat hen beschaamd worden en achteruitgedreven, allen die Sion haten.", "Jes 13:16": "Ook zullen hun kinderen voor hun ogen verpletterd worden; hun huizen zullen geplunderd, en hun vrouwen geschonden worden.", "Spr 22:21": "om u de zekerheid van de woorden van de waarheid bekend te maken, opdat u de woorden van de waarheid kunt beantwoorden aan hen die u zenden?", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "Ps 31:23": "Ik zei wel in mijn haast: Ik ben afgesneden van voor Uw ogen; maar toch hoorde U de stem van mijn smekingen, toen ik tot U riep.", "Jer 7:24": "Toch hebben zij niet gehoord, noch hun oor geneigd, maar gewandeld in de raadslagen, in het eigen goeddunken van hun slechte hart; en zij zijn achterwaarts gekeerd, en niet voorwaarts.", "Jer 30:15": "Wat schreeuwt u over uw breuk, dat uw smart dodelijk is? Om de grootheid van uw ongerechtigheid, omdat uw zonden machtig veel zijn, heb Ik u deze dingen gedaan.", "Ps 35:9": "Zo zal mijn ziel zich verheugen in de HEERE; zij zal vrolijk zijn in Zijn heil.", "Ps 69:28": "Doe misdaad bij hun misdaad, en laat hen niet komen tot Uw gerechtigheid.", "1 Sam 7:5-8": "Verder zei Samuël: Verzamel heel Israël naar Mizpa, en ik zal de HEERE voor u bidden. En zij werden verzameld te Mizpa, en zij schepten water en goten het uit voor het aangezicht van de HEERE; en zij vastten die dag, en zeiden daar: Wij hebben tegen de HEERE gezondigd. Zo richtte Samuël de kinderen van Israël te Mizpa. Toen de Filistijnen hoorden dat de kinderen van Israël zich verzameld hadden te Mizpa, kwamen de leiders van de Filistijnen op tegen Israël. Toen de kinderen van Israël dat hoorden, werden zij bang voor de Filistijnen.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Ps 26:4": "Ik zit niet bij nietswaardige mensen, en met huichelaars ga ik niet om.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Jer 25:8-38": "Daarom, zo zegt de HEERE van de heerscharen: Omdat u Mijn woorden niet hebt gehoord; Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden. En Ik zal van hen doen vergaan de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid, het geluid van de molens en het licht van de lamp.", "Deut 31:19": "En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël.", "Dan 6:11": "Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.", "Ps 27:12": "Geef mij niet over in de begeerte van mijn tegenstanders; want valse getuigen zijn tegen mij opgestaan, alsook wie geweld uitblaast.", "Jer 26:3": "Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.", "Jer 8:4": "Zeg verder tegen hen: Zo zegt de HEERE: Zal men vallen, en niet weer opstaan? Zal men afkeren, en niet terugkeren?", "Ef 3:12": "door wie wij de vrijmoedigheid hebben, en de toegang met vertrouwen, door het geloof aan Hem.", "Ex 22:24": "en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Mark 7:9": "En Hij zei tegen hen: U doet inderdaad het gebod van God volledig teniet, opdat u uw overleveringen zou onderhouden.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Job 13:21": "Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.", "Ps 77:2": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.", "Ezech 20:21": "Maar die kinderen waren ook opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.", "Deut 4:6": "Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!", "Deut 7:13": "en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven.", "Ps 39:14": "Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "Rom 12:3-8": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld. Want zoals wij in één lichaam veel leden hebben, en de leden niet allemaal dezelfde functie hebben, zo zijn wij, hoewel velen, één lichaam in Christus, maar ieder afzonderlijk zijn wij elkaars leden.", "Deut 17:19": "En het moet bij hem blijven, en hij moet daarin lezen al de dagen van zijn leven; opdat hij de HEERE, zijn God, leert vrezen, om al de woorden van deze wet en deze inzettingen te bewaren en te doen;", "Ps 107:19": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Jer 11:8": "Maar zij hebben niet gehoord, en ook hun oor niet geneigd, maar hebben gewandeld, ieder naar het goeddunken van hun boze hart; daarom heb Ik over hen gebracht al de woorden van dit verbond, dat Ik geboden had te doen, maar zij hebben het niet gedaan.", "Openb 12:11": "En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Luk 8:25": "En Hij zei tegen hen: Waar is uw geloof? Maar zij werden bevreesd en verwonderden zich, en zeiden tegen elkaar: Wie is toch Deze, dat Hij ook de winden en het water gebiedt, en zij Hem gehoorzaam zijn?", "Joël 1:13-15": "Omgord u, en rouwklaag, priesters! Huil, dienaars van het altaar! Ga naar binnen, overnacht in zakken, dienaars van mijn God! Want spijsoffer en drankoffer is geweerd van het huis van uw God. Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE. Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Deut 28:18": "Vervloekt zal zijn de vrucht van uw schoot, en de vrucht van uw land, de aanwas van uw koeien, en de kudden van uw kleinvee.", "Neh 5:19": "Gedenk mij, mijn God, ten goede, alles wat ik voor dit volk gedaan heb.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "Ps 119:154": "Twist mijn twistzaak, en verlos mij, maak mij levend, naar Uw toezegging.", "Jer 17:17": "Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Joh 17:17": "Heilig hen in Uw waarheid; Uw woord is de waarheid.", "Matt 13:33": "Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "Rom 8:35": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard?", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "Jer 7:23-25": "Maar deze zaak heb Ik hun geboden, en Ik zei: Hoor naar Mijn stem, dan zal Ik u tot een God zijn, en u zult Mij tot een volk zijn; en wandel in heel de weg die Ik u gebieden zal, opdat het u goed gaat. Toch hebben zij niet gehoord, noch hun oor geneigd, maar gewandeld in de raadslagen, in het eigen goeddunken van hun slechte hart; en zij zijn achterwaarts gekeerd, en niet voorwaarts. Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "Ef 6:17": "En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.", "Ps 51:10": "Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Ps 11:7": "Want de HEERE is rechtvaardig, Hij heeft gerechtigheden lief; Zijn aangezicht aanschouwt de oprechte.", "Hebr 3:10-12": "Daarom was Ik vertoornd over dat geslacht, en zei: Altijd dwalen zij met hun hart, en zij hebben Mijn wegen niet gekend. Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan! Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Klaagl 3:24": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen.", "2 Sam 16:10-12": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd. Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Spr 30:6": "Voeg niets toe aan Zijn woorden, opdat Hij u niet bestraft, en u leugenachtig wordt bevonden.", "Ps 82:5": "Zij weten niet, en verstaan niet; zij wandelen steeds in duisternis; daardoor wankelen alle fundamenten van de aarde.", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Job 22:26": "Want dan zult u zich verlustigen over de Almachtige, en u zult uw aangezicht opheffen tot God.", "Ps 101:7": "Wie bedrog pleegt, zal binnen mijn huis niet blijven; die leugens spreekt, zal voor mijn ogen niet bevestigd worden.", "Ps 132:14": "Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd.", "Matt 23:35-38": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar. Voorwaar, Ik zeg u: Al deze dingen zullen komen over dit geslacht. Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Ps 2:11": "Dient de HEERE met vrees, en verheugt u met beving.", "Jer 1:11-16": "Verder kwam het woord van de HEERE tot mij, en zei: Wat ziet u, Jeremia? En ik zei: Ik zie een amandelroede. En de HEERE zei tegen mij: U hebt goed gezien; want Ik zal wakker zijn over Mijn woord, om dat te doen. En het woord van de HEERE kwam voor de tweede keer tot mij, en zei: Wat ziet u? En ik zei: Ik zie een ziedende pot, waarvan het voorste deel tegen het noorden gekeerd is.", "Ezech 2:6-8": "En u, mensenkind! Wees niet bevreesd voor hen, en wees niet bevreesd voor hun woorden, hoewel er wederwillige mensen en doornen bij u zijn, en u bij schorpioenen woont; wees voor hun woorden niet bevreesd, en schrik niet voor hun gezicht, want zij zijn een opstandig huis. Maar u zult Mijn woorden tot hen spreken, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen; want zij zijn opstandig. Doch u, mensenkind, hoor wat Ik tot u spreek; wees u niet opstandig, zoals dat opstandige huis; open uw mond, en eet, wat Ik u geef.", "Mark 9:42": "En wie een van deze kleinen die in Mij geloven, doet struikelen, het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd, en dat hij in de zee geworpen werd.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Ps 83:14-18": "Mijn God! Maak hen als een wervelwind, als stoppels voor de wind. Zoals het vuur een woud verbrandt, en zoals de vlam de bergen in brand steekt; vervolg hen zo met Uw onweer, en verschrik hen met Uw storm.", "Ef 4:11": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars;", "Jes 62:7": "En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.", "Mark 7:13": "Zo maakt u Gods woord krachteloos door uw overlevering, die u heeft ingesteld; en vele dergelijke dingen doet u.", "Ps 74:8": "Zij hebben in hun hart gezegd: Laat ze ons samen uitplunderen; zij hebben alle vergaderplaatsen van God in het land verbrand.", "Jer 20:5": "Ook zal Ik al het bezit van deze stad geven, en al haar opbrengst, en al haar kostbaarheden, en alle schatten van de koningen van Juda, Ik zal ze geven in de hand van hun vijanden, die zullen ze roven, ze meenemen en ze naar Babel brengen.", "Luk 7:35": "Doch de wijsheid is in het gelijk gesteld door al haar kinderen.", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Matt 7:24": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft;", "Jes 51:13": "En u vergeet de HEERE, Die u gemaakt heeft, Die de hemelen heeft uitgebreid, en de aarde gegrond heeft, en u vreest voortdurend de hele dag, vanwege de grimmigheid van de benauwer, wanneer hij zich bereidt om te verderven? Waar is dan de grimmigheid van de benauwer?", "Mark 3:29": "Maar wie zal lasteren tegen de Heilige Geest, die heeft geen vergeving in eeuwigheid, maar is schuldig aan een eeuwig oordeel.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Luk 6:47": "Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt.", "Ps 110:4": "De HEERE heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Luk 24:45": "Toen opende Hij hun verstand, zodat zij de Schriften begrepen.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Gal 1:10": "Want predik ik nu de mensen, of God? Of zoek ik mensen te behagen? Want als ik nog mensen behaagde, zou ik geen dienstknecht van Christus zijn.", "Matt 15:3": "Maar Hij antwoordde en zei tegen hen: Waarom overtreedt u ook het gebod van God, door uw overlevering?", "Hebr 12:15-17": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden. Dat niemand een hoereerder is, of een onheilige, zoals Ezau, die om één voedsel zijn eerstgeboorterecht wegdeed. Want u weet dat hij ook daarna, toen hij de zegening wilde erven, verworpen werd; want hij vond geen gelegenheid tot berouw, hoewel hij het met tranen zocht.", "Gal 1:12": "Want ik heb het ook niet van een mens ontvangen, ook niet geleerd, maar door de openbaring van Jezus Christus.", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Jes 18:6": "Zij zullen samen overgelaten worden aan de roofvogels van de bergen, en aan de dieren van de aarde; en de roofvogels zullen op hen overzomeren, en alle dieren van de aarde zullen daarop overwinteren.", "Deut 4:7": "Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Jer 18:18-23": "Toen zeiden zij: Kom, laten wij gedachten tegen Jeremia denken; want de wet zal niet vergaan van de priester, evenmin de raad van de wijze, of het woord van de profeet; kom, laten wij hem slaan met de tong, en laten wij niet luisteren naar enig van zijn woorden! HEERE, luister naar mij, en hoor naar de stem van hen die met mij twisten. Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "Ps 147:15": "Hij zendt Zijn bevel over de aarde; Zijn woord loopt zeer snel.", "Openb 6:3-8": "En toen Het het tweede zegel geopend had, hoorde ik het tweede dier zeggen: Kom en zie! En een ander paard ging uit, dat rood was; en hem, die daarop zat, werd macht gegeven de vrede van de aarde te nemen; en dat zij elkaar zouden doden; en hem werd een groot zwaard gegeven. En toen Het het derde zegel geopend had, hoorde ik het derde dier zeggen: Kom en zie! En ik zag, en zie, een zwart paard, en die daarop zat, had een weegschaal in zijn hand.", "Ps 119:162": "Ik ben vrolijk over Uw toezegging, als iemand, die een grote buit vindt.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "Joh 6:63": "De Geest is het Die levend maakt; het vlees heeft geen nut. De woorden die Ik tot u spreek, zijn geest en zijn leven.", "Jer 1:18": "Want zie, Ik stel u vandaag tot een vaste stad, en tot een ijzeren pilaar, en tot koperen muren tegen het hele land; tegen de koningen van Juda, tegen haar vorsten, tegen haar priesters, en tegen het volk van het land.", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "1 Sam 1:10": "Zij dan, bitter bedroefd zijnde, bad tot de HEERE, en zij weende zeer.", "Ezech 22:18": "Mensenkind, zij die van het huis van Israël zijn, zijn Mij tot schuim geworden; zij zijn allemaal koper, of tin, of ijzer, of lood, in het midden van de oven; zilverschuim zijn zij geworden.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Hand 6:4": "Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "1 Tim 1:11": "Naar het Evangelie van de heerlijkheid van de zalige God, dat aan mij toevertrouwd is.", "Ps 42:9": "Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.", "2 Kron 12:1": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "1 Petr 3:16": "en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "Ps 16:6": "De snoeren zijn mij op fijne plaatsen gevallen; ja, een mooie erfenis is mij ten deel gevallen.", "Deut 32:9-12": "Want het deel van de HEERE is Zijn volk, Jakob is het snoer van Zijn erfenis. Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel. Zoals een arend zijn nest opwekt, over zijn jongen zweeft, zijn vleugels uitbreidt, ze neemt en ze draagt op zijn vleugels;", "Jes 65:3": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "Lev 26:39": "En de overgeblevenen onder u zullen om hun ongerechtigheid in de landen van uw vijanden wegteren; ja, ook om de ongerechtigheden van hun vaderen zullen zij met hen wegteren.", "Jer 50:7": "Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, in de woning van de gerechtigheid, ja, tegen de HEERE, de Verwachting van hun vaderen.", "Hab 3:18": "Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil.", "Jer 17:3": "Ik zal Mijn berg met het veld, uw vermogen en al uw schatten ten roof geven, alsook uw hoogten, om de zonde in al uw landpalen.", "Jer 44:16": "Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen.", "Nahum 2:10": "Zij is geledigd, ja, uitgeledigd, uitgeput, en haar hart smelt weg, en de knieën schudden, en in alle lenden is smart, en aller aangezichten worden bleek, als een pot.", "Matt 18:5": "En wie zo'n kind ontvangt in Mijn Naam, die ontvangt Mij.", "Ps 33:21": "Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen.", "Ps 85:6-8": "Zult U eeuwig tegen ons toornen? Zult U Uw toorn uitstrekken van geslacht tot geslacht? Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt? Toon ons Uw goedertierenheid, o HEERE, en geef ons Uw heil.", "2 Sam 22:20": "En Hij voerde mij uit in de ruimte, en rukte mij eruit, want Hij had lust aan mij.", "Dan 10:21": "Doch Ik zal u bekendmaken wat opgetekend is in het geschrift van de waarheid; en er is niemand die zich met Mij sterk maakt tegen dezen, dan uw vorst Michaël.", "Jer 8:17": "Want zie, Ik zend slangen, basilisken onder u, waartegen geen bezwering helpt; die zullen u bijten, spreekt de HEERE.", "Hos 9:1-17": "Verblijd u niet, Israël, tot uitbundige vreugde toe, zoals de volken; want u hoereert van uw God af; u hebt hoerenloon lief, op alle dorsvloeren van het koren. De dorsvloer en de wijnkuip zullen hen niet voeden, en de most zal hen bedriegen. Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.", "Openb 6:8": "En ik zag, en zie, een vaal paard, en die daarop zat, zijn naam was de dood; en de hel volgde hem na. En hun werd macht gegeven om te doden tot het vierde deel van de aarde, met zwaard, en met honger, en met de dood, en door de wilde beesten van de aarde.", "Num 23:21": "Hij ziet geen ongerechtigheid in Jakob; ook ziet Hij geen boosheid in Israël. De HEERE, zijn God, is met hem, en het geschal van de Koning is bij hem.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "Lev 10:8-11": "En de HEERE sprak tegen Aäron: Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties; En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "Ps 81:12": "Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.", "Jes 48:4": "Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;", "Gal 6:17": "Verder, laat niemand mij moeite aandoen; want ik draag de littekenen van de Heere Jezus in mijn lichaam.", "Jer 31:32": "Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE;", "Job 33:13": "Waarom hebt u tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Ps 108:13": "Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Jona 2:1-10": "En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis. En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.", "Jer 31:3": "De HEERE is mij verschenen van lang geleden! Ja, Ik heb u liefgehad met een eeuwige liefde; daarom heb Ik u getrokken met goedertierenheid.", "Ps 120:5-7": "O, wee mij, dat ik een vreemdeling ben in Mesech, dat ik in de tenten van Kedar woont. Mijn ziel heeft lang gewoond bij hen die de vrede haten. Ik ben vreedzaam; maar als ik spreek, zijn zij uit op oorlog.", "2 Tess 2:15": "Welnu dan, broeders, staat vast en houdt vast aan de overleveringen, die u geleerd zijn, hetzij door ons woord, hetzij door onze brief.", "Ezech 8:18": "Daarom zal Ik ook handelen in grimmigheid, Mijn oog zal niet ontzien, en Ik zal niet sparen; al roepen zij voor Mijn oren met luide stem, toch zal Ik hen niet horen.", "Matt 16:19": "En Ik zal u de sleutels geven van het Koninkrijk der hemelen; en alles wat u zult binden op de aarde, zal in de hemelen gebonden zijn; en alles wat u zult ontbinden op de aarde, zal in de hemelen ontbonden zijn.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "Ps 24:4": "Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert;", "Jer 13:11": "Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Openb 19:18": "Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.", "2 Kor 13:5-7": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent. Maar ik hoop dat u zult begrijpen, dat wij niet verwerpelijk zijn. En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Hebr 11:32": "En wat zal ik nog meer zeggen? Want de tijd zou mij tekortschieten, als ik zou vertellen over Gideon, en Barak, en Simson, en Jefta, en David, en Samuël, en de profeten;", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Ps 106:11": "En de wateren overdekten hun tegenstanders; niet één van hen bleef over.", "Jes 50:1": "Zo zegt de HEERE: Waar is de scheidbrief van uw moeder, waarmee Ik haar weggezonden heb? Of wie is er van Mijn schuldeisers, aan wie Ik u verkocht heb? Zie, om uw ongerechtigheden bent u verkocht, en om uw overtredingen is uw moeder weggezonden.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Jer 48:28": "Verlaat de steden, en woont in de rots, u inwoners van Moab! En word als een duif, die in de doorgangen van de ingang van een hol nestelt.", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Ps 35:17": "Heere! Hoe lang zult U toezien? Breng mijn ziel weer van hun verwoestingen, mijn eenzame van de jonge leeuwen.", "Lev 26:22": "Want Ik zal onder u zenden het gedierte van het veld, dat u van uw kinderen zal beroven, en uw vee zal uitroeien, en u zal verminderen; en uw wegen zullen woest worden.", "Jer 29:18": "En Ik zal hen achtervolgen met het zwaard, met de honger en met de pest; en Ik zal hen overgeven aan een verschrikking, in al de koninkrijken van de aarde, tot een vloek, en tot een schrik, en tot een aanfluiting, en tot een smaad, onder al de volken waarheen Ik hen zal hebben verdreven;", "2 Tess 3:6": "En wij bevelen u, broeders, in de Naam van onze Heere Jezus Christus, dat u zich onttrekt van iedere broeder die ongeregeld wandelt, en niet naar de overlevering die hij van ons ontvangen heeft.", "2 Kor 5:16": "Zo kennen wij van nu af aan niemand meer naar het vlees; en al hebben wij ook Christus naar het vlees gekend, toch kennen wij Hem nu niet meer naar het vlees.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "1 Petr 4:4": "waarin zij het vreemd vinden dat u niet meeloopt naar dezelfde uitspatting van losbandigheid, en u belasteren;", "Joh 17:8": "Want de woorden die U Mij gegeven hebt, heb Ik hun gegeven, en zij hebben ze ontvangen, en zij hebben werkelijk erkend dat Ik van U ben uitgegaan, en hebben geloofd dat U Mij gezonden hebt.", "2 Tim 4:5": "Maar u, wees waakzaam in alles, verdraag verdrukkingen, doe het werk van een evangelist, vervul uw dienst ten volle.", "Ps 115:12": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen.", "Judas 1:24": "Aan Hem nu, Die machtig is u voor struikelen te bewaren, en onstraffelijk te stellen voor Zijn heerlijkheid, in vreugde,", "Jer 17:15-18": "Zie, zij zeggen tegen mij: Waar is het woord van de HEERE? Laat het nu komen! Ik heb toch niet aangedrongen, meer dan een herder achter U betaamde; ook heb ik de dodelijke dag niet begeerd, Gij weet het; wat uit mijn lippen is gegaan, is voor Uw aangezicht geweest. Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Micha 4:13": "Maak u op en dors, dochter van Sion! Want Ik zal uw hoorn ijzer maken, en uw hoeven koper maken, en u zult veel volken verpletteren; en Ik zal hun winst aan de HEERE toewijden, en hun bezit aan de Heere van de hele aarde.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Ps 73:1": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.", "Matt 18:13": "En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Ps 56:5": "In God zal ik Zijn woord prijzen; ik vertrouw op God, ik zal niet vrezen; wat zou vlees mij doen?", "2 Tim 2:9-12": "waarvoor ik verdrukkingen lijd tot aan boeien toe, als een misdadiger; maar het Woord van God is niet gebonden. Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid. Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven;", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Mark 10:43-45": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die zal uw dienaar zijn. En wie van u de eerste wil worden, die zal ieders dienstknecht zijn. Want ook de Zoon des mensen is niet gekomen om gediend te worden, maar om te dienen, en Zijn leven te geven als losprijs voor velen.", "Gen 49:23": "De schutters hebben hem wel bitterheid aangedaan, en op hem geschoten, en hem gehaat;", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Ps 103:8-10": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Jer 14:19": "Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking.", "2 Kon 18:12": "Omdat zij de stem van de HEERE, hun God, niet gehoorzaam waren geweest, maar Zijn verbond overtreden hadden; en al wat Mozes, de knecht van de HEERE, geboden had, dat hadden zij niet gehoord, noch gedaan.", "Ps 19:9": "De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "1 Sam 15:29": "En ook liegt Hij niet, Die de Overwinning van Israël is, en het berouwt Hem niet; want Hij is geen mens, dat Hem iets berouwen zou.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "1 Tess 5:20": "Veracht de profetieën niet.", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Job 27:7": "Mijn vijand zij als de goddeloze, en die zich tegen mij opmaakt, als de verkeerde.", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "Joël 3:17": "En u zult weten dat Ik de HEERE, uw God, ben, die op Sion woont, Mijn heilige berg; en Jeruzalem zal heilig zijn, en vreemden zullen er niet meer doorheen trekken.", "Dan 12:9": "En Hij zei: Ga heen, Daniël! want deze woorden zijn toegesloten en verzegeld tot de tijd van het einde.", "Ps 30:11": "Hoor, HEERE! en wees mij genadig; HEERE! wees mij een Helper.", "Gal 4:29": "Maar zoals destijds hij die naar het vlees geboren was, hem vervolgde die naar de Geest geboren was, zo is het ook nu.", "Gen 6:5-7": "En de HEERE zag dat de slechtheid van de mens groot was op de aarde, en dat elk bedenksel van de gedachten van zijn hart alle dagen alleen maar slecht was. Toen had de HEERE er berouw van, dat Hij de mens op de aarde gemaakt had, en het smartte Hem aan Zijn hart. En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "1 Tim 4:6": "Als u deze dingen aan de broeders voorhoudt, zult u een goede dienaar van Jezus Christus zijn, gevoed door de woorden van het geloof en van de goede leer, die u gevolgd hebt.", "Spr 15:8": "Het offer van de goddelozen is de HEERE een gruwel; maar het gebed van de oprechten is Zijn welgevallen.", "Gen 19:27": "En Abraham stond de volgende morgen vroeg op, en ging naar de plaats waar hij voor het aangezicht van de HEERE gestaan had.", "Hebr 12:4": "U hebt nog niet tot bloedens toe tegenstand geboden, terwijl u streed tegen de zonde;", "Klaagl 1:1": "Aleph. Hoe zit die stad zo eenzaam, die vol volk was; zij is als een weduwe geworden, zij, die groot was onder de heidenen, een vorstin onder de landschappen, is cijnsbaar geworden.", "2 Kron 29:6": "Want onze vaders hebben overtreden, en gedaan wat kwaad was in de ogen van de HEERE, onze God, en hebben Hem verlaten, en zij hebben hun gezicht van de tabernakel van de HEERE afgewend, en hebben Hem de rug toegekeerd.", "Matt 21:33": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland.", "Jes 44:22": "Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.", "Jer 30:22": "En u zult Mij tot een volk zijn, en Ik zal u tot een God zijn.", "Ps 59:16": "Laat hen zelfs omzwerven om eten; en laat hen vernachten, ook al zijn zij niet verzadigd.", "Ps 31:22": "Geloofd zij de HEERE, want Hij heeft Zijn goedertierenheid aan mij wonderlijk gemaakt, mij voerende als in een vaste stad.", "Jes 63:15-17": "Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in. U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam. HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "Jer 8:9": "De wijzen zijn beschaamd, verschrikt en gevangen; zie, zij hebben het woord van de HEERE verworpen; wat wijsheid zouden zij dan hebben?", "Jer 4:12": "Er zal Mij een wind komen, die hun te sterk zal zijn. Nu zal Ik ook een oordeel tegen hen uitspreken.", "Jes 5:29": "Hun gebrul zal zijn als van een oude leeuw, en zij zullen brullen als de jonge leeuwen, en zij zullen grommen, en de prooi grijpen en wegvoeren; en er zal niemand zijn die redt.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Spr 2:19": "Allen die tot haar ingaan, zullen niet terugkomen, en zullen de paden van het leven niet bereiken;", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Num 5:3": "Van de man tot de vrouw toe zult u hen wegzenden; tot buiten het leger zult u hen wegzenden; zodat zij hun legers niet verontreinigen, in welker midden Ik woon.", "Jer 29:11-14": "Want Ik weet de gedachten die Ik over u koester, spreekt de HEERE, gedachten van vrede en niet van kwaad, om u het einde en de verwachting te geven. Dan zult u Mij aanroepen, en heengaan, en tot Mij bidden; en Ik zal naar u horen. En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Jer 16:12": "En u erger gedaan hebt dan uw vaders; want zie, u wandelt, ieder naar het goeddunken van zijn slechte hart, om naar Mij niet te horen.", "Matt 18:6": "Maar wie een van deze kleinen die in Mij geloven, doet struikelen, voor hem zou het beter zijn dat een molensteen aan zijn hals gehangen werd en dat hij in de diepte van de zee verzonken werd.", "Ps 139:22": "Ik haat hen met volkomen haat, tot vijanden zijn zij mij.", "1 Petr 4:16": "maar als iemand lijdt als een christen, laat hij zich daar niet voor schamen, maar God verheerlijken in dit opzicht.", "Luk 16:17": "En het is lichter dat de hemel en de aarde voorbijgaan, dan dat één tittel van de wet valt.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Jer 2:21": "Ik had u toch geplant, een edele wijnstok, een geheel getrouw zaad; hoe bent u Mij dan veranderd in verbasterde ranken van een vreemde wijnstok?", "Luk 23:28-31": "En Jezus keerde Zich naar hen toe en zei: Dochters van Jeruzalem, weent niet over Mij, maar weent over uzelf, en over uw kinderen. Want zie, er komen dagen waarin men zal zeggen: Zalig zijn de onvruchtbaren, en de buiken die niet gebaard hebben, en de borsten die niet gezoogd hebben. Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Jer 20:7": "HEERE! U hebt mij overgehaald, en ik ben overgehaald; U bent mij te sterk geweest, en hebt de overhand gehad; ik ben de hele dag tot een belaching, ieder van hen bespot mij.", "Ps 109:29": "Laat mijn tegenstanders met schande bekleed worden, en laat hen zich met hun schande bedekken, als met een mantel.", "2 Kor 6:4": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden,", "Ps 69:29": "Laat hen uitgedelgd worden uit het boek van het leven, en met de rechtvaardigen niet aangeschreven worden.", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Jer 14:1-16": "Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte. Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Hos 8:14": "Want Israël heeft zijn Maker vergeten en tempels gebouwd, en Juda heeft versterkte steden vermenigvuldigd; maar Ik zal een vuur zenden in zijn steden, dat zal hun paleizen verteren.", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "Klaagl 3:1-18": "Aleph. Ik ben de man die ellende gezien heeft door de roede van Zijn verbolgenheid. Aleph. Hij heeft mij geleid en gevoerd in de duisternis, en niet in het licht. Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Jes 62:4": "Tegen u zal niet meer gezegd worden: Wie verlaten is; en tegen uw land zal niet meer gezegd worden: Het verwoeste; maar u zult genoemd worden: Mijn lust is aan haar! en uw land: Het getrouwde; want de HEERE heeft een lust aan u, en uw land zal getrouwd worden.", "Jer 2:30": "Tevergeefs heb Ik uw kinderen geslagen; zij hebben de tucht niet aangenomen; uw eigen zwaard heeft uw profeten verteerd, als een verdervende leeuw.", "Rom 9:20": "Maar toch, o mens, wie bent u, die tegen God antwoordt? Zal ook het maaksel tegen hem die het gemaakt heeft zeggen: Waarom hebt u mij zo gemaakt?", "Gal 1:11": "Maar ik maak u bekend, broeders, dat het Evangelie dat door mij verkondigd is, niet naar de mens is.", "Hand 19:25-28": "hij bracht hen bijeen, met de handwerkers van dergelijke dingen, en zei: Mannen, u weet dat wij uit dit gewin onze welvaart hebben; en u ziet en hoort, dat deze Paulus veel volk, niet alleen van Efeze, maar ook bijna van heel Azië, overreed en afgekeerd heeft, en zegt dat het geen goden zijn die met handen gemaakt worden. En wij lopen niet alleen gevaar dat dit onze zaak in verachting komt, maar ook dat de tempel van de grote godin Diana als niets geacht zal worden, en dat ook haar majesteit ten onder zal gaan, zij die geheel Azië en de gehele wereld verering bewijst.", "Deut 28:10": "En alle volken van de aarde zullen zien dat de Naam van de HEERE over u uitgeroepen is, en zij zullen voor u vrezen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "1 Kon 18:18": "Toen zei hij: Ik heb Israël niet in beroering gebracht, maar u en het huis van uw vader, doordat u de geboden van de HEERE verlaten hebt en de Baäls bent gaan navolgen.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Joh 16:27": "Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Hebr 11:33-38": "die door het geloof koninkrijken hebben overwonnen, gerechtigheid gedaan, de beloften verkregen, de muilen van de leeuwen toegestopt, de kracht van het vuur hebben geblust, aan de scherpte van het zwaard zijn ontkomen, vanuit zwakheid kracht hebben gekregen, in de strijd sterk zijn geworden, legers van vreemden op de vlucht hebben gebracht; de vrouwen hebben hun doden door de opstanding weer teruggekregen; en anderen zijn gefolterd, en wilden de aangeboden verlossing niet aannemen, opdat zij een betere opstanding zouden verkrijgen.", "Ps 77:3": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Lev 22:33": "Die u uit het land Egypte heb uitgevoerd, opdat Ik u tot een God zou zijn; Ik ben de HEERE!", "1 Kor 7:6": "Maar dit zeg ik als toegeving, niet als bevel.", "Zach 1:14": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "Jes 56:9": "Alle dieren van het veld, kom om te eten, ja, alle dieren in het woud!", "Jes 35:1": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos.", "Matt 10:11-13": "En in welke stad of dorp u ook ingaat, onderzoekt wie daarin waardig is; en blijft daar, totdat u vertrekt. En als u het huis ingaat, groet het dan. En als dat huis waardig is, laat uw vrede dan over dat huis komen; maar als het niet waardig is, laat uw vrede dan naar u terugkeren.", "Ps 124:1-3": "Een lied Hammaäloth, van David. Als de HEERE niet bij ons geweest was, laat Israël dat nu zeggen: Als de HEERE niet bij ons geweest was, toen de mensen tegen ons opstonden, dan zouden zij ons levend verslonden hebben, toen hun toorn tegen ons ontstak.", "Jer 21:4-7": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Ps 106:34": "Zij hebben die volken niet verdelgd, die de HEERE hun gezegd had;", "Amos 4:10-12": "Ik heb de pest onder u gezonden, naar de wijze van Egypte; Ik heb uw jongemannen door het zwaard gedood, en uw paarden gevankelijk laten wegvoeren; en Ik heb de stank van uw legers zelfs in uw neus laten opgaan; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Ik heb sommigen onder u omgekeerd, zoals God Sodom en Gomorra omkeerde, u, die was als een stuk brandhout, dat uit de brand gered is; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Daarom zal Ik u zo doen, Israël! Omdat Ik u dan dit doen zal, maak u dan gereed, Israël, om uw God te ontmoeten.", "Rom 8:32": "Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "Deut 29:23": "Dat zijn hele aarde zwavel en zout is van de verbranding; die niet bezaaid zal zijn, en geen spruit zal voortgebracht hebben, en geen kruid daarin zal opgekomen zijn; zoals de omkering van Sodom en Gomorra, Adama en Zeboïm, die de HEERE heeft omgekeerd in Zijn toorn en in Zijn grimmigheid;", "Jer 11:11": "Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.", "2 Kron 12:5": "Toen kwam Semaja, de profeet, tot Rehabeam en de leiders van Juda, die zich vanwege Sisak in Jeruzalem verzameld hadden, en hij zei tegen hen: Zo zegt de HEERE: U hebt Mij verlaten, daarom heb Ik u ook verlaten in de hand van Sisak.", "1 Tess 2:2": "maar hoewel wij eerst geleden hadden, en ons ook smaad was aangedaan, zoals u weet, in Filippi, hebben wij toch vrijmoedigheid gebruikt in onze God, om het Evangelie van God tot u te spreken onder veel strijd.", "Ps 119:148": "Mijn ogen komen de nachtwaken voor, om Uw rede te betrachten.", "1 Kor 11:2": "En ik prijs u, broeders, dat u in alles aan mij denkt, en de inzettingen behoudt, zoals ik die u overgegeven heb.", "Hebr 3:16-18": "Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn. Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn? En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Gen 18:32": "Nog zei hij: Laat de Heere toch niet boos worden, dat ik alleen deze keer nog spreek: misschien zullen er tien gevonden worden. En Hij zei: Ik zal haar niet verwoesten omwille van de tien.", "Jer 7:34": "En Ik zal uit de steden van Juda en uit de straten van Jeruzalem doen ophouden de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid; want het land zal tot een verwoesting worden.", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Nahum 3:7": "En het zal gebeuren, dat allen die u zien, van u zullen wegvluchten en zeggen: Nineve is verstoord, wie zal medelijden met haar hebben? Van waar zal ik u troosters zoeken?", "Hand 8:8": "En er ontstond grote blijdschap in die stad.", "Jes 1:1-24": "Het visioen van Jesaja, de zoon van Amoz, dat hij zag over Juda en Jeruzalem, in de dagen van Uzzia, Jotham, Achaz en Hizkia, de koningen van Juda. Hoor, hemelen! en neem het ter oor, aarde! Want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd, maar zij hebben tegen Mij overtreden. Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "Ex 20:24": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "2 Petr 2:7": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft;", "Luk 2:52": "En Jezus nam toe in wijsheid en grootte, en in genade bij God en de mensen.", "1 Tess 2:14": "Want u, broeders, bent navolgers geworden van de Gemeenten van God die in Judea zijn, in Christus Jezus; omdat ook u hetzelfde geleden hebt van uw eigen medeburgers, zoals zij van de Joden;", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Joh 16:20": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden.", "Jes 2:6": "Maar U hebt Uw volk, het huis van Jakob, verlaten, want zij zijn vervuld met goddeloosheid, meer dan het oosten, en zij zijn van het guichelaar gelijk de Filistijnen, en aan de kinderen van de vreemden tonen zij hun behagen.", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "1 Tess 5:12": "En wij bidden u, broeders, erken hen die onder u arbeiden, en uw voorstanders zijn in de Heere, en u vermanen;", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Jes 54:8": "In een kleine toorn heb Ik Mijn aangezicht van u een ogenblik verborgen; maar met eeuwige goedertierenheid zal Ik Mij over u ontfermen, zegt de HEERE, uw Verlosser.", "Jer 34:17": "Daarom zegt de HEERE zo: U hebt naar Mij niet gehoord, om vrijheid uit te roepen, ieder voor zijn broeder, en ieder voor zijn naaste; zie, zo roep Ik tegen u uit, spreekt de HEERE, een vrijheid ten zwaard, ter pest, en ten honger, en zal u overgeven ter opschudding aan alle koninkrijken van de aarde.", "Jes 6:12": "Want de HEERE zal die mensen ver wegdoen, en de verlating zal groot zijn in het binnenste van het land.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Hand 5:29": "Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen.", "Neh 9:32": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "Ef 5:18": "En word niet dronken van wijn, waarin overdaad is, maar word vervuld met de Geest,", "Ex 18:7": "Toen ging Mozes naar buiten, zijn schoonvader tegemoet, en hij boog zich, en kuste hem; en zij vroegen elkaar naar hun welstand, en zij gingen naar de tent.", "Matt 19:29": "En al wie huizen zal verlaten hebben, of broeders, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers, om Mijn Naam, die zal honderdvoud ontvangen, en het eeuwige leven beërven.", "2 Tess 3:4": "En wij vertrouwen van u in de Heere, dat u wat wij u bevelen, ook doet, en doen zult.", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "1 Joh 2:12": "Ik schrijf u, kinderen, want de zonden zijn u vergeven omwille van Zijn Naam.", "Ef 2:16": "en opdat Hij die beiden met God in één lichaam zou verzoenen door het kruis, nadat Hij de vijandschap daaraan gedood had.", "Ps 35:4": "Laat hen beschaamd worden en te schande, die mijn ziel zoeken; laat hen achterwaarts gedreven worden en schaamrood, die kwaad tegen mij bedenken.", "Joh 15:27": "En u zult ook getuigen, want u bent van het begin met Mij geweest.", "1 Kron 16:27": "Majesteit en heerlijkheid zijn voor Zijn aangezicht, sterkte en vrolijkheid zijn in Zijn plaats.", "Deut 9:25-29": "En ik wierp mij neer voor het aangezicht van de HEERE, die veertig dagen en veertig nachten waarin ik mij neerwierp, omdat de HEERE gezegd had dat Hij u verdelgen zou. En ik bad tot de HEERE, en zei: Heere, HEERE, verderf Uw volk en Uw erfdeel niet, dat U door Uw grootheid verlost hebt; dat U uit Egypte door een sterke hand hebt uitgevoerd. Denk aan Uw knechten, Abraham, Izak en Jakob; zie niet op de hardheid van dit volk, noch op zijn goddeloosheid, noch op zijn zonde;", "Jes 49:13-17": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen. Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Ps 78:65": "Toen ontwaakte de Heere, als iemand die slaapt, als een held, die juicht van de wijn.", "Job 35:12": "Daar roepen zij; maar Hij antwoordt niet, vanwege de hoogmoed van de bozen.", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Job 16:20": "Mijn vrienden bespotten mij; maar mijn oog druipt tot God.", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Neh 13:31": "Ook voor het offer van het hout, op vastgestelde tijden, en voor de eerstelingen. Denk aan mij, mijn God, ten goede.", "Ps 71:4": "Mijn God, bevrijd mij van de hand van de goddeloze, van de hand van hem die verkeerd handelt, en van de opgeblazene.", "Joh 17:26": "En Ik heb hun Uw Naam bekendgemaakt, en zal Hem bekendmaken; opdat de liefde waarmee U Mij liefgehad hebt, in hen is, en Ik in hen.", "Ps 71:2": "Red mij door Uw gerechtigheid, en bevrijd mij; neig Uw oor tot mij, en verlos mij.", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Gen 32:28": "Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Rom 4:23": "Nu is het niet alleen om zijnentwil geschreven, dat het hem toegerekend is;", "Ezech 18:13": "Uitleent op woeker, en overwinst neemt; zou die leven? Hij zal niet leven, al die gruwelen heeft hij gedaan; hij zal zeker gedood worden; zijn bloed zal op hem zijn!", "Jer 2:5": "Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij ver van Mij zijn geweken, en de ijdelheid hebben nagewandeld, en zelf ijdel zijn geworden?", "Spr 29:10": "Bloeddorstige mensen haten de vrome; maar de oprechten zoeken zijn leven.", "Ps 25:3": "Gimel. Ja, allen die U verwachten, zullen niet beschaamd worden; zij zullen beschaamd worden, die trouweloos handelen zonder oorzaak.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Amos 5:27": "Daarom zal Ik u gevankelijk wegvoeren, ver voorbij Damaskus, zegt de HEERE, Wiens Naam is God van de heerscharen.", "2 Tess 2:7-12": "Want de verborgenheid van de onrechtvaardigheid werkt al; alleen, Hij die hem nu weerhoudt, zal hem blijven weerhouden, totdat hij uit het midden weggedaan wordt. En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen;", "Openb 10:9": "En ik ging heen naar de engel, en zei tegen hem: Geef mij dat boekje. En hij zei tegen mij: Neem het en eet het op; en het zal uw buik bitter maken, maar in uw mond zal het zoet zijn als honing.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Spr 2:12": "Om u te redden van de kwade weg, van de man die verkeerdheden spreekt;", "Jer 21:4": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad.", "Ps 44:16-19": "Mijn schande is de hele dag voor mij, en de schaamte van mijn aangezicht bedekt mij; Om de stem van hem die hoont en lastert, vanwege de vijand en de wraakgierige. Dit alles is ons overkomen, toch hebben wij U niet vergeten, en niet vals gehandeld tegen Uw verbond.", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Jer 14:11": "Verder zei de HEERE tegen mij: Bid niet voor dit volk ten goede.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Spr 21:13": "Wie zijn oor stopt voor het geschrei van de arme, die zal ook roepen, en niet verhoord worden.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Ps 31:7": "Ik haat hen die op valse ijdelheden acht slaan, en ik vertrouw op de HEERE.", "Ps 31:2-5": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid. Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden. Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "Deut 32:24": "Uitgeteerd zullen zij zijn van honger, opgegeten door de karbonkel en bitter verderf; en Ik zal de tanden van de beesten onder hen sturen, met vurig venijn van slangen van het stof.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Hebr 6:12": "opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Ps 94:1-23": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend! Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen. Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?", "Ps 27:11": "HEERE, leer mij Uw weg, en leid mij op het rechte pad, omwille van mijn verspieders.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Ps 81:14": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld!", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "Num 24:1": "Toen Bileam zag dat het goed was in de ogen van de HEERE dat hij Israël zegende, ging hij ditmaal niet, zoals de andere keren, op zoek naar toverijen; maar hij richtte zijn gezicht naar de woestijn.", "Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "Ps 35:8": "De verwoesting overkomt hem, zodat hij het niet weet, en zijn net, dat hij verborgen heeft, vangt hemzelf; hij valt daarin met verwoesting.", "Klaagl 3:17": "Vau. En U hebt mijn ziel ver van de vrede verstoten, ik heb het goede vergeten.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Ef 3:3-5": "Dat Hij mij door openbaring deze verborgenheid heeft bekendgemaakt (zoals ik met weinig woorden eerder geschreven heb; waaraan u, als u dit leest, mijn inzicht in deze verborgenheid van Christus kunt bemerken), die in andere eeuwen aan de kinderen van de mensen niet bekendgemaakt is, zoals zij nu geopenbaard is aan Zijn heilige apostelen en profeten, door de Geest;", "Matt 15:22-28": "En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten. Maar Hij antwoordde haar geen
