}},"vertalingen":{"SVnu":{"1":"Toen Sefatja, de zoon van Matthan, en Gedalia, de zoon van Pashur, en Juchal, de zoon van Selemja, en Pashur, de zoon van Malchia, de woorden hoorden die Jeremia tot al het volk sprak:","2":"Zo zegt de HEERE: Wie in deze stad blijft, zal door het zwaard, door de honger of door de pestilentie sterven; maar wie naar de Chaldeeën uitgaat, die zal leven, want hij zal zijn leven als buit hebben, en zal leven.","3":"Zo zegt de HEERE: Deze stad zal zeker gegeven worden in de hand van het leger van de koning van Babel, dat zal haar innemen;","4":"Toen zeiden de vorsten tegen de koning: Laat toch deze man gedood worden; want zo maakt hij de handen van de krijgslieden die in deze stad zijn overgebleven, en de handen van het hele volk slap, doordat hij zulke woorden tot hen spreekt; want deze man zoekt niet de vrede van dit volk, maar het kwaad.","5":"En de koning Zedekia zei: Zie, hij is in uw hand; want de koning kan niets tegen u.","6":"Toen namen zij Jeremia en wierpen hem in de kuil van Malchia, de zoon van Hammelech, die in het voorhof van de bewaking was, en zij lieten Jeremia met touwen zakken; in de kuil nu was geen water, maar slijk; en Jeremia zonk in het slijk.","7":"Toen Ebed-Melech, de Moorman, een van de kamerlingen die toen in het huis van de koning was, hoorde dat zij Jeremia in de kuil gedaan hadden (de koning zat toen in de poort van Benjamin);","8":"Zo ging Ebed-Melech het huis van de koning uit, en hij sprak tot de koning:","9":"Mijn heer koning! Deze mannen hebben slecht gehandeld in alles wat zij gedaan hebben aan de profeet Jeremia, die zij in de kuil geworpen hebben; want hij zou daar ter plaatse gestorven zijn van de honger, omdat er geen brood meer in de stad is.","10":"Toen gebood de koning de Moorman Ebed-Melech: Neem van hier dertig mannen met u mee, en haal de profeet Jeremia op uit de kuil, voordat hij sterft.","11":"Zo nam Ebed-Melech de mannen met zich mee, en ging het huis van de koning in tot onder de schatkamer, en nam vandaar enkele oude, kapotte en oude, versleten lompen; en hij liet ze met touwen naar beneden zakken naar Jeremia in de kuil.","12":"En Ebed-Melech, de Moorman, zei tegen Jeremia: Leg nu deze oude, kapotte en versleten lompen onder de oksels van uw armen, onderaan de touwen. En Jeremia deed zo.","13":"En zij trokken Jeremia aan de touwen, en haalden hem op uit de kuil; en Jeremia bleef in het voorhof van de bewaking.","14":"Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.","15":"En Jeremia zei tegen Zedekia: Als ik het u verklaar, zult u mij dan niet zeker doden? En als ik u raad geef, zult u toch niet naar mij luisteren.","16":"Toen zwoer de koning Zedekia in het geheim aan Jeremia: Zo waarachtig als de HEERE leeft, Die ons dit leven gemaakt heeft: Ik zal u niet doden, en ik zal u niet overgeven in de hand van deze mannen die u naar het leven staan!","17":"Jeremia dan zei tegen Zedekia: Zo zegt de HEERE, de God van de heerscharen[1], de God van Israël: Als u gewillig naar de vorsten van de koning van Babel uitgaat, dan zal uw leven behouden blijven, en deze stad zal niet met vuur verbrand worden; en u zult leven, u en uw huis.","18":"Maar als u naar de vorsten van de koning van Babel niet uitgaat, dan zal deze stad gegeven worden in de hand van de Chaldeeën, en zij zullen haar met vuur verbranden; ook zult u zelf uit hun hand niet ontkomen.","19":"En de koning Zedekia zei tegen Jeremia: Ik ben bang voor de Joden die naar de Chaldeeën zijn overgelopen, dat zij mij misschien in hun hand overgeven, en zij de spot met mij drijven.","20":"En Jeremia zei: Zij zullen u niet overgeven; wees toch gehoorzaam aan de stem van de HEERE, die ik tot u spreek; zo zal het u goed gaan, en zal uw leven behouden blijven.","21":"Maar als u weigert uit te gaan, dan is dit het woord dat de HEERE mij heeft laten zien;","22":"Zie, al de vrouwen die in het huis van de koning van Juda zijn overgebleven, zullen naar buiten gebracht worden tot de vorsten van de koning van Babel; en die zullen zeggen: Uw vredegenoten hebben u aangezet, en hebben de overhand op u gekregen; uw voeten zijn in de modder gezonken; zij zijn achteruit gekeerd!","23":"Zij zullen dan al uw vrouwen en al uw zonen naar de Chaldeeën uitvoeren; ook zult u zelf uit hun hand niet ontkomen; maar u zult door de hand van de koning van Babel gegrepen worden, en u zult deze stad met vuur verbranden.","24":"Toen zei Zedekia tegen Jeremia: Laat niemand van deze woorden weten, dan zult u niet sterven.","25":"En als de vorsten horen dat ik met u gesproken heb, en tot u komen en tegen u zeggen: Vertel ons nu, wat hebt u tegen de koning gezegd? Verberg het niet voor ons, dan zullen wij u niet doden; en wat heeft de koning tegen u gezegd?","26":"Dan zult u tegen hen zeggen: Ik wierp mijn smeking voor de koning neder, dat hij mij niet terug zou laten brengen naar het huis van Jonathan, om daar te sterven.","27":"Toen al de vorsten bij Jeremia kwamen en hem vroegen, vertelde hij hun overeenkomstig al deze woorden die de koning geboden had; en zij lieten hem met rust, omdat de zaak niet uitgelekt was.","28":"En Jeremia bleef in het voorhof van de bewaking tot op de dag dat Jeruzalem werd ingenomen; en hij was er nog, toen Jeruzalem werd ingenomen."},"SV":{"1":"Als Sefatja, de zoon van Matthan, en Gedalia, de zoon van Pashur, en Juchal, de zoon van Selemja, en Pashur, de zoon van Malchia, de woorden hoorden, die Jeremia tot al het volk sprak, zeggende:","2":"Zo zegt de HEERE: Wie in deze stad blijft, zal door het zwaard, door den honger of door de pestilentie sterven; maar wie tot de Chaldeen uitgaat, die zal leven, want hij zal zijn ziel tot een buit hebben, en zal leven .","3":"Zo zegt de HEERE: Deze stad zal zekerlijk gegeven worden in de hand van het heir des konings van Babel, datzelve zal ze innemen;","4":"Zo zeiden de vorsten tot den koning: Laat toch dezen man gedood worden; want aldus maakt hij de handen der krijgslieden, die in deze stad zijn overgebleven, en de handen des gansen volks slap, alzulke woorden tot hen sprekende; want deze man zoekt den vrede dezes volks niet, maar het kwaad.","5":"En de koning Zedekia zeide: Ziet, hij is in uw hand; want de koning zou geen ding tegen u vermogen.","6":"Toen namen zij Jeremia en wierpen hem in den kuil van Malchia, den zoon van Hammelech, die in het voorhof der bewaring was, en zij lieten Jeremia af met zelen; in den kuil nu was geen water, maar slijk; en Jeremia zonk in het slijk.","7":"Als nu Ebed-melech, de Moorman, een der kamerlingen, die toen in des konings huis was, hoorde, dat zij Jeremia in den kuil gedaan hadden (de koning nu zat in de poort van Benjamin);","8":"Zo ging Ebed-melech uit het huis des konings uit, en hij sprak tot den koning, zeggende:","9":"Mijn heer koning! deze mannen hebben kwalijk gehandeld in alles, wat zij gedaan hebben aan den profeet Jeremia, dien zij in den kuil geworpen hebben; daar hij toch in zijn plaats zou gestorven zijn vanwege den honger, dewijl geen brood meer in de stad is.","10":"Toen gebood de koning den Moorman Ebed-melech, zeggende: Neem van hier dertig mannen onder uw hand, en haal den profeet Jeremia op uit den kuil, eer dat hij sterft.","11":"Alzo nam Ebed-melech de mannen onder zijn hand, en ging in des konings huis tot onder de schatkamer, en nam van daar enige oude verscheurde en oude versleten lompen; en hij liet ze met zelen af tot Jeremia in den kuil.","12":"En Ebed-melech, de Moorman, zeide tot Jeremia: Leg nu deze oude verscheurde en versleten lompen onder de oksels uwer armen, van onder aan de zelen. En Jeremia deed alzo.","13":"En zij trokken Jeremia bij de zelen, en haalden hem op uit de kuil; en Jeremia bleef in het voorhof der bewaring.","14":"Toen zond de koning Zedekia henen, en liet den profeet Jeremia tot zich halen, in den derden ingang, die aan des HEEREN huis was; en de koning zeide tot Jeremia: Ik zal u een ding vragen, verheel geen ding voor mij.","15":"En Jeremia zeide tot Zedekia: Als ik *het* u verklaren zal, zult gij mij niet zekerlijk doden? En als ik u raad zal geven, gij zult *toch* naar mij niet horen.","16":"Toen zwoer de koning Zedekia aan Jeremia in het verborgene, zeggende: *Zo* *waarachtig* *als* de HEERE leeft, Die ons deze ziel gemaakt heeft: Indien ik u zal doden, of indien ik u zal overgeven in de hand dezer mannen, die uw ziel zoeken!","17":"Jeremia dan zeide tot Zedekia: Zo zegt de HEERE, de God der heirscharen, de God Israëls: Indien gij gewilliglijk tot de vorsten des koning van Babel zult uitgaan, zo zal uw ziel leven, en deze stad zal niet verbrand worden met vuur; en gij zult leven, gij en uw huis.","18":"Maar indien gij tot de vorsten des konings van Babel niet zult uitgaan, zo zal deze stad gegeven worden in de hand der Chaldeen, en zij zullen ze met vuur verbranden; ook zult gij van hunlieder hand niet ontkomen.","19":"En de koning Zedekia zeide tot Jeremia: Ik ben bevreesd voor de Joden, die tot de Chaldeen gevallen zijn, dat zij mij misschien in derzelver hand overgeven, en zij den spot met mij drijven.","20":"En Jeremia zeide: Zij zullen *u* niet overgeven; wees toch gehoorzaam aan de stem des HEEREN, naar dewelke ik tot u spreek; zo zal het u welgaan, en uw ziel zal leven.","21":"Maar indien gij weigert uit te gaan, *zo* is dit het woord, dat de HEERE mij heeft doen zien;","22":"Ziedaar, al de vrouwen, die in het huis des konings van Juda zijn overgebleven, zullen uitgevoerd worden tot de vorsten des konings van Babel; en dezelve zullen zeggen: Uw vredegenoten hebben u aangehitst, en hebben u overmocht; uw voeten zijn in den modder gezonken; zij zijn achterwaarts gekeerd!","23":"Zij zullen dan al uw vrouwen en al uw zonen tot de Chaldeen uitvoeren; ook zult gij zelf van hun hand niet ontkomen; maar gij zult door de hand des konings van Babel gegrepen worden, en gij zult deze stad met vuur verbranden.","24":"Toen zeide Zedekia tot Jeremia: Dat niemand wete van deze woorden, zo zult gij niet sterven.","25":"En als de vorsten zullen horen, dat ik met u gesproken heb, en tot u komen, en tot u zeggen: Verklaar ons nu, wat hebt gij tot den koning gesproken? verheel het niet voor ons, zo zullen wij u niet doden; en wat heeft de koning tot u gesproken?","26":"Zo zult gij tot hen zeggen: Ik wierp mijn smeking voor des konings aangezicht neder, dat hij mij niet zou weder laten brengen in Jonathans huis, om aldaar te sterven.","27":"Als dan al de vorsten tot Jeremia kwamen, en hem vraagden, verklaarde hij hun, naar al deze woorden, die de koning geboden had; en zij lieten van hem af, omdat de zaak niet was gehoord.","28":"En Jeremia bleef in het voorhof der bewaring tot op den dag, dat Jeruzalem werd ingenomen; en hij was er *nog*, als Jeruzalem was ingenomen."},"KJV":{"1":"Then Shephatiah the son of Mattan, and Gedaliah the son of Pashur, and Jucal the son of Shelemiah, and Pashur the son of Malchiah, heard the words that Jeremiah had spoken unto all the people, saying,","2":"Thus saith the LORD, He that remaineth in this city shall die by the sword, by the famine, and by the pestilence: but he that goeth forth to the Chaldeans shall live; for he shall have his life for a prey, and shall live.","3":"Thus saith the LORD, This city shall surely be given into the hand of the king of Babylon's army, which shall take","4":"Therefore the princes said unto the king, We beseech thee, let this man be put to death: for thus he weakeneth the hands of the men of war that remain in this city, and the hands of all the people, in speaking such words unto them: for this man seeketh not the welfare of this people, but the hurt.","5":"Then Zedekiah the king said, Behold, he *is* in your hand: for the king *is* not *he that* can do *any* thing","6":"Then took they Jeremiah, and cast him into the dungeon of Malchiah the son of Hammelech, that *was* in the court of the prison: and they let down Jeremiah with cords. And in the dungeon *there was* no water, but mire: so Jeremiah sunk in the mire.","7":"Now when Ebedmelech the Ethiopian, one of the eunuchs which was in the king's house, heard that they had put Jeremiah in the dungeon; the king then sitting in the gate of Benjamin;","8":"Ebedmelech went forth out of the king's house, and spake to the king, saying,","9":"My lord the king, these men have done evil in all that they have done to Jeremiah the prophet, whom they have cast into the dungeon; and he is like to die for hunger in the place where he is: for *there is* no more bread in the city.","10":"Then the king commanded Ebedmelech the Ethiopian, saying, Take from hence thirty men with thee, and take up Jeremiah the prophet out of the dungeon, before he die.","11":"So Ebedmelech took the men with him, and went into the house of the king under the treasury, and took thence old cast clouts and old rotten rags, and let them down by cords into the dungeon to Jeremiah.","12":"And Ebedmelech the Ethiopian said unto Jeremiah, Put now *these* old cast clouts and rotten rags under thine armholes under the cords. And Jeremiah did","13":"So they drew up Jeremiah with cords, and took him up out of the dungeon: and Jeremiah remained in the court of the prison.","14":"Then Zedekiah the king sent, and took Jeremiah the prophet unto him into the third entry that *is* in the house of the LORD: and the king said unto Jeremiah, I will ask thee a thing; hide","15":"Then Jeremiah said unto Zedekiah, If I declare *it* unto thee, wilt thou not surely put me to death? and if I give thee counsel, wilt thou not hearken","16":"So Zedekiah the king sware secretly unto Jeremiah, saying, *As* the LORD liveth, that made us this soul, I will not put thee to death, neither will I give thee into the hand of these men that seek thy life.","17":"Then said Jeremiah unto Zedekiah, Thus saith the LORD, the God of hosts, the God of Israel; If thou wilt assuredly go forth unto the king of Babylon's princes, then thy soul shall live, and this city shall not be burned with fire; and thou shalt live, and thine house:","18":"But if thou wilt not go forth to the king of Babylon's princes, then shall this city be given into the hand of the Chaldeans, and they shall burn it with fire, and thou shalt not escape out of their hand.","19":"And Zedekiah the king said unto Jeremiah, I am afraid of the Jews that are fallen to the Chaldeans, lest they deliver me into their hand, and they mock","20":"But Jeremiah said, They shall not deliver *thee*. Obey, I beseech thee, the voice of the LORD, which I speak unto thee: so it shall be well unto thee, and thy soul shall live.","21":"But if thou refuse to go forth, this *is* the word that the LORD hath shewed","22":"And, behold, all the women that are left in the king of Judah's house *shall be* brought forth to the king of Babylon's princes, and those *women* shall say, Thy friends have set thee on, and have prevailed against thee: thy feet are sunk in the mire, *and* they are turned away back.","23":"So they shall bring out all thy wives and thy children to the Chaldeans: and thou shalt not escape out of their hand, but shalt be taken by the hand of the king of Babylon: and thou shalt cause this city to be burned with fire.","24":"Then said Zedekiah unto Jeremiah, Let no man know of these words, and thou shalt not die.","25":"But if the princes hear that I have talked with thee, and they come unto thee, and say unto thee, Declare unto us now what thou hast said unto the king, hide it not from us, and we will not put thee to death; also what the king said","26":"Then thou shalt say unto them, I presented my supplication before the king, that he would not cause me to return to Jonathan's house, to die","27":"Then came all the princes unto Jeremiah, and asked him: and he told them according to all these words that the king had commanded. So they left off speaking with him; for the matter was not perceived.","28":"So Jeremiah abode in the court of the prison until the day that Jerusalem was taken: and he was *there* when Jerusalem was taken."}},"tsk":{"1":[{"kopje":"Sefatja","refs":["Ezra 2:3","Neh 7:9"]},{"kopje":"Juchal","refs":["Jer 37:4"]},{"kopje":"Pashur","refs":["Jer 21:1-10","1 Kron 9:12","Neh 11:12"]},{"kopje":"hoorden","refs":["Hand 4:1","Hand 4:2","Hand 4:6-10","Hand 5:28"]}],"2":[{"kopje":"Hij","refs":["Jer 38:17-23","Jer 21:8","Jer 21:9","Jer 24:8","Jer 27:13","Jer 29:18","Jer 34:17","Jer 42:17","Jer 42:22","Jer 44:13","Ezech 5:12-17","Ezech 6:11","Ezech 7:15","Ezech 14:21","Matt 24:7","Matt 24:8","Openb 6:4-8"]},{"kopje":"zal zijn","refs":["Jer 21:9","Jer 39:18","Jer 45:5"]}],"4":[{"kopje":"de vorsten","refs":["Jer 26:11","Jer 26:21-23","Jer 36:12-16","2 Kron 24:21","Ezech 22:27","Micha 3:1-3","Zef 3:1-3"]},{"kopje":"zo","refs":["Ex 5:4","1 Kon 18:17","1 Kon 18:18","1 Kon 21:20","Ezra 4:12","Neh 6:9","Amos 7:10","Luk 23:2","Joh 11:46-50","Hand 16:20","Hand 17:6","Hand 24:5","Hand 28:22"]},{"kopje":"vrede","refs":["Jer 29:7"]}],"5":[{"kopje":"want de koning","refs":["1 Sam 15:24","1 Sam 29:9","2 Sam 3:39","2 Sam 19:22","Spr 29:25","Joh 19:12-16"]}],"6":[{"kopje":"namen","refs":["Jer 37:21","Ps 109:5","Luk 3:19","Luk 3:20"]},{"kopje":"in","refs":["Jer 37:16","Klaagl 3:55","Hand 16:24","2 Kor 4:8","2 Kor 4:9","Hebr 10:36"]},{"kopje":"Hammelech","refs":["Jer 36:26"]},{"kopje":"en zij","refs":["Jer 38:11","Jer 38:12"]},{"kopje":"in de kuil","refs":["Jer 38:26","Jer 37:20","Jer 38:22","Gen 37:24","Ps 40:3","Ps 69:3","Ps 69:15","Ps 69:16","Klaagl 3:52-55","Zach 9:11"]}],"7":[{"kopje":"Ebed-Melech","refs":["Jer 39:16-18"]},{"kopje":"Moorman","refs":["Jer 13:23","Ps 68:32","Matt 8:11","Matt 8:12","Matt 20:16","Luk 10:30-36","Luk 13:29","Luk 13:30","Hand 8:27-39"]},{"kopje":"kamerlingen","refs":["Jer 29:2","Jer 34:19","2 Kon 24:15"]},{"kopje":"de koning","refs":["Jer 37:13","Deut 21:19","Job 29:7-17","Amos 5:10"]}],"9":[{"kopje":"deze","refs":["Jer 38:1-6","Est 7:4-6","Job // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';

  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
