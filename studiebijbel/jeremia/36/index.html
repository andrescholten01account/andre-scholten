,"vertalingen":{"SVnu":{"1":"Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam:","2":"Neem een rol van het boek, en schrijf daarop alle woorden die Ik tot u gesproken heb over Israël, over Juda en over alle volken, vanaf de dag dat Ik tot u gesproken heb, vanaf de dagen van Josia tot op deze dag.","3":"Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.","4":"Toen riep Jeremia Baruch, de zoon van Nerija; en Baruch schreef uit de mond van Jeremia alle woorden van de HEERE, die Hij tot hem gesproken had, op een rol van het boek.","5":"En Jeremia gebood Baruch: Ik word tegengehouden*, ik zal niet in het huis van de HEERE kunnen gaan.","6":"Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.","7":"Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.","8":"En Baruch, de zoon van Nerija, deed naar alles wat de profeet Jeremia hem geboden had, door in dat boek de woorden van de HEERE te lezen, in het huis van de HEERE.","9":"Want het gebeurde in het vijfde jaar van Jojakim, de zoon van Josia, de koning van Juda, in de negende maand, dat zij een vasten voor het aangezicht van de HEERE uitriepen, voor het hele volk in Jeruzalem, alsook voor het hele volk dat uit de steden van Juda naar Jeruzalem kwam.","10":"Zo las Baruch in dat boek de woorden van Jeremia in het huis van de HEERE, in de kamer van Gemarja, de zoon van Safan, de schrijver, in het bovenste voorhof, bij de deur van de nieuwe poort van het huis van de HEERE, voor de oren van het hele volk.","11":"Toen Michaja, de zoon van Gemarja, de zoon van Safan, al de woorden van de HEERE uit dat boek gehoord had,","12":"ging hij naar het huis van de koning, naar de kamer van de schrijver; en zie, daar zaten al de vorsten: Elisama, de schrijver, en Delaja, de zoon van Semaja, en Elnathan, de zoon van Achbor, en Gemarja, de zoon van Safan, en Zedekia, de zoon van Hananja, en al de vorsten.","13":"En Michaja maakte hun al de woorden bekend die hij gehoord had, toen Baruch uit dat boek las voor de oren van het volk.","14":"Toen zonden al de vorsten Jehudi, de zoon van Nethanja, de zoon van Selemja, de zoon van Cuschi, naar Baruch, om te zeggen: De rol waarin u voor de oren van het volk gelezen hebt, neem die in uw hand, en kom. Zo nam Baruch, de zoon van Nerija, de rol in zijn hand, en kwam naar hen.","15":"En zij zeiden tegen hem: Ga toch zitten, en lees ze voor onze oren; en Baruch las voor hun oren.","16":"En het gebeurde, toen zij al de woorden hoorden, dat zij schrokken, de één tegen de ander; en zij zeiden tegen Baruch: Zeker zullen wij al deze woorden aan de koning bekendmaken.","17":"En zij vroegen Baruch: Verklaar ons toch, hoe hebt u al deze woorden uit zijn mond geschreven?","18":"En Baruch zei tegen hen: Uit zijn mond las hij mij al deze woorden voor, en ik schreef ze met inkt in dit boek.","19":"Toen zeiden de vorsten tegen Baruch: Ga heen, verberg u, u en Jeremia; en niemand mag weten waar u bent.","20":"Zij dan gingen naar de koning, in het voorhof; maar de rol legden zij weg in de kamer van Elisama, de schrijver; en zij verklaarden al die woorden voor de oren van de koning.","21":"Toen zond de koning Jehudi om de rol te halen; en hij haalde ze uit de kamer van Elisama, de schrijver; en Jehudi las ze voor de oren van de koning, en voor de oren van al de vorsten die bij de koning stonden.","22":"(De koning nu zat in het winterhuis, in de negende maand; en er was een vuur voor zijn aangezicht op de haard aangestoken.)","23":"En het gebeurde, toen Jehudi drie of vier stukken gelezen had, dat hij ze met een schrijfmes doorsneed, en ze in het vuur wierp dat op de haard was, totdat de hele rol verteerd was in het vuur dat op de haard was.","24":"En zij schrokken niet, en scheurden hun kleren niet, de koning noch al zijn dienaren die al deze woorden gehoord hadden.","25":"Hoewel ook Elnathan, en Delaja, en Gemarja bij de koning ervoor pleitten dat hij de rol niet zou verbranden; toch luisterde hij niet naar hen.","26":"Daarop gebood de koning aan Jerahmeel, de zoon van Hammelech, en Zeraja, de zoon van Azriël, en Selemja, de zoon van Abdeël, om de schrijver Baruch en de profeet Jeremia te vangen. Maar de HEERE had hen verborgen.","27":"Toen kwam het woord van de HEERE tot Jeremia, nadat de koning de rol en de woorden die Baruch geschreven had uit de mond van Jeremia, verbrand had:","28":"Neem u weer een andere rol, en schrijf daarop al de eerste woorden die op de eerste rol stonden, die Jojakim, de koning van Juda, verbrand heeft.","29":"En tegen Jojakim, de koning van Juda, zult u zeggen: Zo zegt de HEERE: U hebt deze rol verbrand, en gezegd: Waarom hebt u daarop geschreven: De koning van Babel zal zeker komen, en dit land verderven, en maken dat mens en dier daarin ophouden te bestaan?","30":"Daarom zegt de HEERE zo van Jojakim, de koning van Juda: Hij zal niemand hebben die op de troon van David zit; en zijn dode lichaam zal weggeworpen worden, overdag in de hitte, en 's nachts in de vorst.","31":"En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken**; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.","32":"Jeremia dan nam een andere rol, en gaf ze aan de schrijver Baruch, de zoon van Nerija; die schreef daarop, uit de mond van Jeremia, alle woorden van het boek dat Jojakim, de koning van Juda, met vuur verbrand had; en er werden nog veel woorden van dezelfde soort aan toegevoegd."},"SV":{"1":"Het gebeurde ook in het vierde jaar van Jojakim, den zoon van Josia, den koning van Juda, *dat* dit woord tot Jeremia geschiedde van den HEERE, zeggende:","2":"Neem u een rol des boeks, en schrijf daarop al de woorden, die Ik tot u gesproken heb, over Israël, en over Juda, en over al de volken, van den dag aan, *dat* Ik tot u gesproken heb, van de dagen van Josia aan, tot op dezen dag.","3":"Misschien zullen die van het huis van Juda horen al het kwaad, dat Ik hun gedenk te doen; opdat zij zich bekeren, een iegelijk van zijn bozen weg, en Ik hun ongerechtigheid en hun zonde vergeve.","4":"Toen riep Jeremia Baruch, den zoon van Nerija; en Baruch schreef uit den mond van Jeremia alle woorden des HEEREN, die Hij tot hem gesproken had, op een rol des boeks.","5":"En Jeremia gebood Baruch, zeggende: Ik ben opgehouden, ik zal in des HEEREN huis niet kunnen gaan.","6":"Zo ga gij henen, en lees in de rol, *in* dewelke gij uit mijn mond geschreven hebt, de woorden des HEEREN, voor de oren des volks, in des HEEREN huis, op den vastendag; en gij zult ze ook lezen voor de oren van gans Juda, die uit hun steden komen.","7":"Misschien zal hunlieder smeking voor des HEEREN aangezicht nedervallen, en zij zullen zich bekeren, een iegelijk van zijn bozen weg; want groot is de toorn en de grimmigheid, die de HEERE tegen dit volk heeft uitgesproken.","8":"En Baruch, de zoon van Nerija, deed naar alles, wat hem de profeet Jeremia geboden had, lezende in dat boek de woorden des HEEREN, *in* het huis des HEEREN.","9":"Want het geschiedde in het vijfde jaar van Jojakim, den zoon van Josia, den koning van Juda, in de negende maand, *dat* zij een vasten voor des HEEREN aangezicht uitriepen, allen volke te Jeruzalem, mitsgaders allen volke, die uit de steden van Juda te Jeruzalem kwamen.","10":"Zo las Baruch in dat boek de woorden van Jeremia *in* des HEEREN huis, in de kamer van Gemarja, den zoon van Safan, den schrijver, in het bovenste voorhof, *aan* de deur der nieuwe poort van het huis des HEEREN, voor de oren des gansen volks.","11":"Als nu Michaja, de zoon van Gemarja, den zoon van Safan, al de woorden des HEEREN uit dat boek gehoord had;","12":"Zo ging hij af ten huize des konings in de kamer des schrijvers; en ziet, aldaar zaten al de vorsten: Elisama, de schrijver, en Delaja, de zoon van Semaja, en Elnathan, de zoon van Achbor, en Gemarja, de zoon van Safan, en Zedekia, de zoon van Hananja, en al de vorsten.","13":"En Michaja maakte hun bekend al de woorden, die hij gehoord had, als Baruch uit dat boek las voor de oren des volks.","14":"Toen zonden al de vorsten Jehudi, den zoon van Nethanja, den zoon van Selemja, den zoon van Cuschi, tot Baruch, om te zeggen: De rol, waarin gij voor de oren des volks gelezen hebt, neem die in uw hand, en kom. Alzo nam Baruch, de zoon van Nerija, de rol in zijn hand, en kwam tot hen.","15":"En zij zeiden tot hem: Zit toch neder, en lees ze voor onze oren; en Baruch las voor hun oren.","16":"En het geschiedde, als zij al de woorden hoorden, *dat* zij verschrikten, de een tegen den ander; en zij zeiden tot Baruch: Voorzeker zullen wij al deze woorden den koning bekend maken.","17":"En zij vraagden Baruch, zeggende: Verklaar ons toch, hoe hebt gij al deze woorden uit zijn mond geschreven?","18":"En Baruch zeide tot hen: Uit zijn mond las hij tot mij al deze woorden, en ik schreef ze met inkt in dit boek.","19":"Toen zeiden de vorsten tot Baruch: Ga henen, verberg u, gij en Jeremia; en niemand wete, waar gijlieden zijt.","20":"Zij dan gingen in tot den koning in het voorhof; maar de rol leiden zij weg in de kamer van Elisama, den schrijver; en zij verklaarden al die woorden voor de oren des konings.","21":"Toen zond de koning Jehudi, om de rol te halen; en hij haalde ze uit de kamer van Elisama, den schrijver; en Jehudi las ze voor de oren des konings, en voor de oren van al de vorsten, die omtrent den koning stonden.","22":"(De koning nu zat *in* het winterhuis in de negende maand; en er was *een* *vuur* voor zijn aangezicht op den haard aangestoken.)","23":"En het geschiedde, als Jehudi drie stukken, of vier gelezen had, versneed hij ze met een schrijfmes, en wierp ze in het vuur, dat op den haard was, totdat de ganse rol verteerd was in het vuur, dat op den haard was.","24":"En zij verschrikten niet, en scheurden hun klederen niet, de koning noch al zijn knechten, die al deze woorden gehoord hadden.","25":"Hoewel ook Elnathan, en Delaja, en Gemarja bij den koning daarvoor spraken, dat hij de rol niet zou verbranden; doch hij hoorde niet naar hen.","26":"Daartoe gebood de koning aan Jerahmeel, den zoon van Hammelech, en Zeraja, den zoon van Azriël, en Selemja, den zoon van Abdeël, om den schrijver Baruch en den profeet Jeremia te vangen. Maar de HEERE had hen verborgen.","27":"Toen geschiedde des HEEREN woord tot Jeremia, nadat de koning de rol en de woorden, die Baruch geschreven had uit den mond van Jeremia, verbrand had, zeggende:","28":"Neem u weder een andere rol, en schrijf daarop al de eerste woorden, die geweest zijn op de eerste rol, die Jojakim, de koning van Juda, verbrand heeft.","29":"En tot Jojakim, den koning van Juda, zult gij zeggen: Zo zegt de HEERE: Gij hebt deze rol verbrand, zeggende: Waarom hebt gij daarop geschreven, zeggende: De koning van Babel zal zekerlijk komen, en dit land verderven, en maken, dat mens en beest daarin ophouden?","30":"Daarom zegt de HEERE alzo van Jojakim, den koning van Juda: Hij zal geen hebben, die op Davids troon zitte; en zijn dood lichaam zal weggeworpen zijn, des daags in de hitte, en des nachts in de vorst.","31":"En Ik zal over hem, en over zijn zaad, en over zijn knechten hunlieder ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen, dat Ik tot hen gesproken heb; maar zij hebben niet gehoord.","32":"Jeremia dan nam een andere rol, en gaf ze aan den schrijver Baruch, den zoon van Nerija; die schreef daarop, uit den mond van Jeremia, al de woorden des boeks, dat Jojakim, de koning van Juda, met vuur verbrand had; en tot dezelve werden nog veel dergelijke woorden toegedaan."},"KJV":{"1":"And it came to pass in the fourth year of Jehoiakim the son of Josiah king of Judah, *that* this word came unto Jeremiah from the LORD, saying,","2":"Take thee a roll of a book, and write therein all the words that I have spoken unto thee against Israel, and against Judah, and against all the nations, from the day I spake unto thee, from the days of Josiah, even unto this day.","3":"It may be that the house of Judah will hear all the evil which I purpose to do unto them; that they may return every man from his evil way; that I may forgive their iniquity and their sin.","4":"Then Jeremiah called Baruch the son of Neriah: and Baruch wrote from the mouth of Jeremiah all the words of the LORD, which he had spoken unto him, upon a roll of a book.","5":"And Jeremiah commanded Baruch, saying, I *am* shut up; I cannot go into the house of the LORD:","6":"Therefore go thou, and read in the roll, which thou hast written from my mouth, the words of the LORD in the ears of the people in the LORD'S house upon the fasting day: and also thou shalt read them in the ears of all Judah that come out of their cities.","7":"It may be they will present their supplication before the LORD, and will return every one from his evil way: for great *is* the anger and the fury that the LORD hath pronounced against this people.","8":"And Baruch the son of Neriah did according to all that Jeremiah the prophet commanded him, reading in the book the words of the LORD in the LORD'S house.","9":"And it came to pass in the fifth year of Jehoiakim the son of Josiah king of Judah, in the ninth month, *that* they proclaimed a fast before the LORD to all the people in Jerusalem, and to all the people that came from the cities of Judah unto Jerusalem.","10":"Then read Baruch in the book the words of Jeremiah in the house of the LORD, in the chamber of Gemariah the son of Shaphan the scribe, in the higher court, at the entry of the new gate of the LORD'S house, in the ears of all the people.","11":"When Michaiah the son of Gemariah, the son of Shaphan, had heard out of the book all the words of the LORD,","12":"Then he went down into the king's house, into the scribe's chamber: and, lo, all the princes sat there, *even* Elishama the scribe, and Delaiah the son of Shemaiah, and Elnathan the son of Achbor, and Gemariah the son of Shaphan, and Zedekiah the son of Hananiah, and all the princes.","13":"Then Michaiah declared unto them all the words that he had heard, when Baruch read the book in the ears of the people.","14":"Therefore all the princes sent Jehudi the son of Nethaniah, the son of Shelemiah, the son of Cushi, unto Baruch, saying, Take in thine hand the roll wherein thou hast read in the ears of the people, and come. So Baruch the son of Neriah took the roll in his hand, and came","15":"And they said unto him, Sit down now, and read it in our ears. So Baruch read *it* in their ears.","16":"Now it came to pass, when they had heard all the words, they were afraid both one and other, and said unto Baruch, We will surely tell the king of all these words.","17":"And they asked Baruch, saying, Tell us now, How didst thou write all these words at his mouth?","18":"Then Baruch answered them, He pronounced all these words unto me with his mouth, and I wrote *them* with ink in the book.","19":"Then said the princes unto Baruch, Go, hide thee, thou and Jeremiah; and let no man know where","20":"And they went in to the king into the court, but they laid up the roll in the chamber of Elishama the scribe, and told all the words in the ears of the king.","21":"So the king sent Jehudi to fetch the roll: and he took it out of Elishama the scribe's chamber. And Jehudi read it in the ears of the king, and in the ears of all the princes which stood beside the king.","22":"Now the king sat in the winterhouse in the ninth month: and *there was a fire* on the hearth burning before","23":"And it came to pass, *that* when Jehudi had read three or four leaves, he cut it with the penknife, and cast *it* into the fire that *was* on the hearth, until all the roll was consumed in the fire that *was* on the hearth.","24":"Yet they were not afraid, nor rent their garments, *neither* the king, nor any of his servants that heard all these words.","25":"Nevertheless Elnathan and Delaiah and Gemariah had made intercession to the king that he would not burn the roll: but he would not hear","26":"But the king commanded Jerahmeel the son of Hammelech, and Seraiah the son of Azriel, and Shelemiah the son of Abdeel, to take Baruch the scribe and Jeremiah the prophet: but the LORD hid","27":"Then the word of the LORD came to Jeremiah, after that the king had burned the roll, and the words which Baruch wrote at the mouth of Jeremiah, saying,","28":"Take thee again another roll, and write in it all the former words that were in the first roll, which Jehoiakim the king of Judah hath burned.","29":"And thou shalt say to Jehoiakim king of Judah, Thus saith the LORD; Thou hast burned this roll, saying, Why hast thou written therein, saying, The king of Babylon shall certainly come and destroy this land, and shall cause to cease from thence man and beast?","30":"Therefore thus saith the LORD of Jehoiakim king of Judah; He shall have none to sit upon the throne of David: and his dead body shall be cast out in the day to the heat, and in the night to the frost.","31":"And I will punish him and his seed and his servants for their iniquity; and I will bring upon them, and upon the inhabitants of Jerusalem, and upon the men of Judah, all the evil that I have pronounced against them; but they hearkened","32":"Then took Jeremiah another roll, and gave it to Baruch the scribe, the son of Neriah; who wrote therein from the mouth of Jeremiah all the words 607\">entry</span> of the <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of all the people.","11":"When <span class=\"wl wl-kjv\" data-code=\"H4321\">Michaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1587\">Gemariah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan,</span> had <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the LORD,","12":"Then he went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> into the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe's</span> <span class=\"wl wl-kjv\" data-code=\"H3957\">chamber:</span> and, lo, all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> there, even <span class=\"wl wl-kjv\" data-code=\"H476\">Elishama</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe,</span> and <span class=\"wl wl-kjv\" data-code=\"H1806\">Delaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H494\">Elnathan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5907\">Achbor,</span> and <span class=\"wl wl-kjv\" data-code=\"H1587\">Gemariah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan,</span> and <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2608\">Hananiah,</span> and all the princes.","13":"Then <span class=\"wl wl-kjv\" data-code=\"H4321\">Michaiah</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">declared</span> unto them all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that he had <span class=\"wl wl-kjv\" data-code=\"H8085\">heard,</span> when <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of the people.","14":"Therefore all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H3065\">Jehudi</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5418\">Nethaniah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8018\">Shelemiah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3570\">Cushi,</span> unto <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> the <span class=\"wl wl-kjv\" data-code=\"H4039\">roll</span> wherein thou hast <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">come.</span> So <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5374\">Neriah</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4039\">roll</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and came","15":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Sit <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> now, and <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> it in our <span class=\"wl wl-kjv\" data-code=\"H241\">ears.</span> So <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> it in their ears.","16":"Now it came to pass, when they had <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> they were <span class=\"wl wl-kjv\" data-code=\"H6342\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H413\">both</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> and <span class=\"wl wl-kjv\" data-code=\"H7453\">other,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch,</span> We will <span class=\"wl wl-kjv\" data-code=\"H5046\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of all these words.","17":"And they <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">Tell</span> us now, How didst thou <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> at his mouth?","18":"Then <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> them, He <span class=\"wl wl-kjv\" data-code=\"H7121\">pronounced</span> all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> unto me with his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and I <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> them with <span class=\"wl wl-kjv\" data-code=\"H1773\">ink</span> in the book.","19":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> unto <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> thee, thou and <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah;</span> and let no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> where","20":"And they went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> into the <span class=\"wl wl-kjv\" data-code=\"H2691\">court,</span> but they laid <span class=\"wl wl-kjv\" data-code=\"H6485\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4039\">roll</span> in the <span class=\"wl wl-kjv\" data-code=\"H3957\">chamber</span> of <span class=\"wl wl-kjv\" data-code=\"H476\">Elishama</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of the king.","21":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H3065\">Jehudi</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">fetch</span> the <span class=\"wl wl-kjv\" data-code=\"H4039\">roll:</span> and he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> it out of <span class=\"wl wl-kjv\" data-code=\"H476\">Elishama</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe's</span> <span class=\"wl wl-kjv\" data-code=\"H3957\">chamber.</span> And <span class=\"wl wl-kjv\" data-code=\"H3065\">Jehudi</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> it in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> which <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">beside</span> the king.","22":"Now the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">winterhouse</span> in the <span class=\"wl wl-kjv\" data-code=\"H8671\">ninth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month:</span> and there was a fire on the <span class=\"wl wl-kjv\" data-code=\"H254\">hearth</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">burning</span> before","23":"And it came to pass, that when <span class=\"wl wl-kjv\" data-code=\"H3065\">Jehudi</span> had <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> or <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H1817\">leaves,</span> he <span class=\"wl wl-kjv\" data-code=\"H7167\">cut</span> it with the <span class=\"wl wl-kjv\" data-code=\"H8593\">penknife,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> it into the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> that was on the <span class=\"wl wl-kjv\" data-code=\"H254\">hearth,</span> until all the <span class=\"wl wl-kjv\" data-code=\"H4039\">roll</span> was <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed</span> in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> that was on the hearth.","24":"Yet they were not <span class=\"wl wl-kjv\" data-code=\"H6342\">afraid,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> their <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> neither the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> nor any of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> that <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> all these words.","25":"Nevertheless <span class=\"wl wl-kjv\" data-code=\"H494\">Elnathan</span> and <span class=\"wl wl-kjv\" data-code=\"H1806\">Delaiah</span> and <span class=\"wl wl-kjv\" data-code=\"H1587\">Gemariah</span> had made <span class=\"wl wl-kjv\" data-code=\"H6293\">intercession</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> that he would not <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> the <span class=\"wl wl-kjv\" data-code=\"H4039\">roll:</span> but he would not hear","26":"But the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H3396\">Jerahmeel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4429\">Hammelech,</span> and <span class=\"wl wl-kjv\" data-code=\"H8304\">Seraiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5837\">Azriel,</span> and <span class=\"wl wl-kjv\" data-code=\"H8018\">Shelemiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5655\">Abdeel,</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe</span> and <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet:</span> but the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hid","27":"Then the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came to <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> had <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> the <span class=\"wl wl-kjv\" data-code=\"H4039\">roll,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> which <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> at the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah,</span> saying,","28":"<span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> thee <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H4039\">roll,</span> and <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> in it all the <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H4039\">roll,</span> which <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> hath burned.","29":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Thou hast <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> this <span class=\"wl wl-kjv\" data-code=\"H4039\">roll,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Why hast thou <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> therein, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and shall cause to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> from thence <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and beast?","30":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> He shall have none to <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> and his dead <span class=\"wl wl-kjv\" data-code=\"H5038\">body</span> shall be cast <span class=\"wl wl-kjv\" data-code=\"H7993\">out</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to the <span class=\"wl wl-kjv\" data-code=\"H2721\">heat,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> to the frost.","31":"And I will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> him and his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> and his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> for their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon them, and upon the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> all the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that I have <span class=\"wl wl-kjv\" data-code=\"H1696\">pronounced</span> against them; but they hearkened","32":"Then <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H4039\">roll,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it to <span class=\"wl wl-kjv\" data-code=\"H1263\">Baruch</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5374\">Neriah;</span> who <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> therein from the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> which <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> had <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> and there were <span class=\"wl wl-kjv\" data-code=\"H3254\">added</span> besides unto them <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H1992\">like</span> words."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"vierde jaar van Jójakim,","tekst":"Zie boven Jer 25:1 ."}],"2":[{"catchword":"boeks,","tekst":"Het woord sepher, dat voor een boek genomen wordt, heeft ook een algemene betekenis van allerlei schriften, brieven, patenten, kaarten, enz.; zie boven Jer 32:11-12 , enz.; Deu 24:1 ; 2Ki 5:5-6 , en kan hier een rol des boeks zoveel zijn als een grote schrijfrol inplaats van een boek, dienende om beschreven en samengerold te worden; zie wijders Ezr 6:2 . Hiervan komt deze manier van spreken: De hemelen zullen worden samengerold als een boek, Isa 34:4 ; Rev 6:14 ; vergelijk Isa 8:1 ."},{"catchword":"Josia aan,","tekst":"Zie boven Jer 1:2 ."}],"3":[{"catchword":"Misschien","tekst":"Menselijkerwijze van den alwetenden God gesproken, om te tonen hoe aangenaam hem de ware bekering is. Vergelijk Deu 5:29 , alzo ook terstond in het woord denken, en elders dikwijls."},{"catchword":"zullen die van het huis van Juda horen","tekst":"Hebreeuws, zullen het huis Juda horen."},{"catchword":"kwaad,","tekst":"Der straf. Dit dient tot bewijs van de vertwijfelde hardnekkigheid van het volk, die nu zover waren vervallen, dat er gene middelen overbleven dan dreigementen van kwaad."}],"5":[{"catchword":"opgehouden,","tekst":"Of opgesloten, dat sommigen verstaan van enige gevangenschap, of gevangenneming, uit boven Jer 33:1 , waar hetzelfde Hebreeuwse woord gebruikt wordt. Maar anderen, oordelende dat zulks niet wel overeenkomt met onder vs.19, nemen het voor enig ander beletsel, als door een bijzonder bevel van God, of enige uiterlijke onreinheid der wet, of een godsdienstige belofte, zie Num 19:11 , enz.; 1Sa 21:7 ; Neh 6:10 ."}],"6":[{"catchword":"vastendag;","tekst":"Dien zij buitengewoon door hun eigen goedvinden hadden aangesteld, merkende zonder twijfel uit verscheidene tekenen dat God vertoornd was; zie onder vs.9."},{"catchword":"komen","tekst":"Te Jeruzalem, op den vastendag; gelijk onder vs.9."}],"7":[{"catchword":"nedervallen,","tekst":"Dat is, misschien zullen zij met ootmoedig smeken en bidden voor God nedervallen, of hun smeken Hem voordragen. Men kan het ook aldus nemen dat, gelijk het gebed gezegd wordt op te klimmen, ten aanzien van het geloof, alzo ook met recht gezegd wordt voor den Heere neder te vallen, ten aanzien der nederigheid en bekentenis onzer onwaardigheid. Sommigen nemen vallen voor bevallen, gevallen, welgevallen; dat is, aangenaam zijn, gelijk onder Jer 37:20 . Vergelijk ook Jer 38:26 , en Jer 42:2 , Jer 42:9 ."},{"catchword":"toorn en de grimmigheid,","tekst":"De straffen, plagen en ellenden, die Hij hun gedreigd heeft, indien zij zich niet bekeren."}],"9":[{"catchword":"negende maand,","tekst":"Van het lopende jaar, genoemd [in het kerkelijke jaar] de maand Chisleu of Casleu, passende op onzen November en December."},{"catchword":"voor des HEEREN aangezicht uitriepen,","tekst":"Om in zijn huis voor Hem belijdenis te doen van zonden en Hem om genade te bidden, waartoe het vasten een dienstig hulpmiddel was. Maar wat God van het vasten der goddelozen en huichelaars hield, zie daarvan Isa 58:3-5 , enz."},{"catchword":"kwamen","tekst":"Of, gekomen waren."}],"10":[{"catchword":"kamer van Gemárja,","tekst":"Anders: aan, of bij de kamer. Zie van het gebouw dezer kamers, 1Ki 6:5-6 , met de aantekening."},{"catchword":"schrijver,","tekst":"Dat is, die de openbare akten van Gods huis en de profetieën, die aldaar werden gelezen of uitgesproken, optekenend, gelijk enigen menen; of der schriftgeleerden, waarvan te zien is Ezr 7:6 . Anders wordt het Hebreeuwse woord genomen vs.12, waar het een staatssecretaris van den koning betekent."},{"catchword":"bovenste voorhof,","tekst":"Anders, naar sommiger gevoelen, genoemd het voorhof der priesters, onderscheiden van het grote voorhof der gemeente, dat daaraan was. Zie 2Ch 4:9 . Doch sommigen verstaan dit van het binnenste en bovenste deel van het voorhof van het volk. Het kan zijn dat hij in het venster van ene der kamers, die in het voorhof waren gelegen, en het volk, hetwelk in het voorhof was, voorgelezen had."},{"catchword":"nieuwe poort van het huis des HEEREN,","tekst":"Zie boven Jer 26:10 ."}],"12":[{"catchword":"schrijvers;","tekst":"Dat is, des konings secretaris, en in de schrijverskamer; dat isk, in de secretarie, kanselarij, of raadkamer; zie 1Ki 4:3 . Deze schrijver wordt terstond genoemd Elisama."},{"catchword":"Elnáthan,","tekst":"Zie boven Jer 26:22 ."},{"catchword":"Gemárja,","tekst":"Of deze dezelfde is, die boven vs.10, vermeld is, en vermits zijn aanzien en ervarenheid [gelijk een kerkelijk geschiedschrijver of schriftgeleerde, gelijk Ezra was] in dezen raad, of raadpleging, op den vastendag, gebruikt is, dan of het een ander is geweest van de vorsten, van wie enigen menen dat de voornaamste hier genoemd worden, kan de verstandige lezer nadenken."}],"13":[{"catchword":"maakte hun bekend al de woorden,","tekst":"Of hij dit gedaan heeft ter goeder mening, om den vorsten in bedenking te geven hoe men Gods toorn zou mogen afwenden, gelijk sommigen daaruit willen afnemen, dat de vorsten zijn bericht gehoord hebbende, zich niet dan beleefd jegens Baruch hebben gedragen, over de zaken zijn bewogen geweest, en zorg hebben gedragen voor de behoudenis van Jeremia en Baruch, gelijk volgt; dan of hij Jeremia in lijden heeft willen brengen, is onzeker; vergelijk boven Jer 20:10 ."}],"15":[{"catchword":"lees ze voor onze oren;","tekst":"Lees de rol; dat is, hetgeen gij daarin geschreven hebt."}],"16":[{"catchword":"de een tegen den ander;","tekst":"Hebreeuws, de man, of een iegelijk tegen zijn naaste of metgezel; dat is, zij zagen elkander met verschriktheid aan, de een zag op den ander."},{"catchword":"Voorzeker zullen wij al deze woorden","tekst":"Of, wij moeten ganselijk, enz. Hebreeuws, wij zullen bekendmakende bekendmaken."}],"18":[{"catchword":"las hij tot mij al deze woorden,","tekst":"Of, hij riep, hij sprak luide uit zijnen mond tot mij; dat is, [gelijk men spreekt] hij dicteerde mij van woord tot woord."},{"catchword":"inkt","tekst":"Het Hebreeuwse woord wordt alleenlijk hier gevonden."},{"catchword":"boek","tekst":"Dat is, in deze schrijfrol."}],"20":[{"catchword":"voorhof;","tekst":"Van het koninklijk paleis."},{"catchword":"legden zij weg","tekst":"Te weten onder iemands hand, gelijk deze manier van spreken gevonden wordt 2Ch 12:10 ; of bewaarden, zij gaven te bewaren; gelijk Lev 6:4 , en onder Jer 37:21 ."}],"21":[{"catchword":"Jehûdi,","tekst":"Van welken boven vs.14."},{"catchword":"halen;","tekst":"Hebreeuws, nemen; dat is nemen en brengen, waarvoor wij zeggen, halen. Zie Gen 12:15 ."},{"catchword":"omtrent den koning stonden","tekst":"Of, bezijden, tegenover, om."}],"22":[{"catchword":"winterhuis","tekst":"Gelijk de koningen en andere groten verscheidene vertrekken, zelfs winterhuizen en zomerhuizen, hadden; zie Jdg 3:20 ; Ezr 6:2 ; Amo 3:15 , met de aantekening."},{"catchword":"negende maand;","tekst":"Gelijk boven vs.9."},{"catchword":"en er was een vuur","tekst":"Hebreeuws eigenlijk: en de haard was voor zijn aangezicht aangestoken, of brandende; dat is, een vuur op den haard."},{"catchword":"op den haard aangestoken","tekst":"Sommigen verstaan een vuurpan vol gloeiende kolen, waar men hout op aanstak. Het Hebreeuwse woord wordt alleenlijk in deze plaats alzo gevonden."}],"23":[{"catchword":"stukken,","tekst":"Hebreeuws, deuren; dat is kolommen; waarvan wij nu gebruiken, de zijden, of bladen en hoofdstukken van een boek."},{"catchword":"hij ze","tekst":"De koning sneed de rol in stukken."},{"catchword":"schrijfmes,","tekst":"Hebreeuws eigenlijk, een schrijversscheermes; dat is een pennemes, gelijk wij nu spreken."}],"24":[{"catchword":"scheurden hun klederen niet,","tekst":"Gelijk men in rouw en harteleed gewoon was te doen; [zie Gen 37:29 ; 2Ki 18:37 , en 2Ki 19:1 , en 2Ki 22:11 ] , maar zij voegden zich naar den koning, vergeten hebbende hun voorgaande beweging, vs.16."},{"catchword":"knechten,","tekst":"Dat is, niemand van zijne officieren en hovelingen, die omtrent hem waren."}],"25":[{"catchword":"doch hij hoorde naar hen niet","tekst":"Of, zo hoorde hij toch niet naar hen."}],"26":[{"catchword":"Hammelech,","tekst":"Of, des konings; dat is, zijn eigen zoon; alzo onder Jer 38:6 ."},{"catchword":"vangen","tekst":"Alzo wordt het Hebreeuwse woord, dat anders nemen en voorts halen betekent, ook gebruikt; Pro 24:11 , en onder Jer 39:5 ."}],"28":[{"catchword":"Neem u weder een andere rol,","tekst":"Hebreeuws, keer weder, neem; dat is, neem weder, gelijk dikwijls."}],"29":[{"catchword":"tot Jójakim,","tekst":"Anders: van, dat is, gij zult in uwe profetieën van hem schrijven door mijn last."},{"catchword":"zeggen","tekst":"Versta daarna, in volgenden tijd, alzo hij te dezer tijd door der vorsten raad en Gods voorzorg verborgen was; zie vs.19, 26; maar God kon lichtelijk [als het Hem beliefde] des konings hoogmoed en wreedheid alzo bedwingen, dat hij Jeremia voor zijn aangezicht moest leiden en horen spreken."},{"catchword":"zeggende","tekst":"Dat is, aldus."},{"catchword":"zekerlijk komen,","tekst":"Hebreeuws, komende komen."},{"catchword":"daarin ophouden?","tekst":"Hebreeuws, daaruit, of daarvan; dat is, dat er gene meer zijn."}],"30":[{"catchword":"geen hebben,","tekst":"Versta, zoon, die hem in de koninklijke regering opvolgt, alzo, te weten dat het den naam van opvolging en regering met recht zou mogen hebben; want zijn zoon Jechonia of Jojachin is maar drie maanden koning geweest, [hetwelk voor geen zitten gerekend wordt] en toen naar Babel gevoerd, 2Ki 24:8 , 2Ki 24:12 , en Zedekia, die in zijne plaats kwam, was niet Jojakims zoon, maar broeder, tevoren genoemd Mattanja, 2Ki 24:17 ."},{"catchword":"dood lichaam zal weggeworpen zijn,","tekst":"Vergelijk boven Jer 22:19 , met de aantekening."}],"31":[{"catchword":"knechten hunlieder ongerechtigheid","tekst":"Gelijk boven vs.24."},{"catchword":"bezoeken;","tekst":"Dat is, straffen; zie Gen 21:1 ."},{"catchword":"gesproken heb;","tekst":"En in de vorige rol begrepen was."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Also it came to pass in the forth year of Jojakim the son of Josiah [see above chapter 25] king of Judah that this word came unto Jeremiah from the Lord saying :"}],"2":[{"catchword":null,"tekst":"Take the a roll of a book [the word Sepher which is taken for a book signifieth in general all manner of writings letters patents maps c see above chapter 32,11,12c Deu 24:1 2Ki 5:5,6 and here a roll of a book may be as to say as a written roll instead of a book serving to be written upon all rolled together see further Ezra 6 on verse 2 hence is the phrase the heavens shall be rolled together as a book Isa 34:4 Rev 6:14 compare Isa 8:1 ]and write upon it all the words that I have spoken unto thee [as above chapter 30.2] concerning Israel and concerning Judah and concerning all the nations from the day that I spake unto thee from the days of Josiah [see above chapter 1.2] unto this day."}],"3":[{"catchword":null,"tekst":"It may be that those of the house of Judah may hear [Heb the house of Judah will hear ]all the evil [of punishment] which I think to do unto them [this serveth to prove the people&acirc;&euro;&trade;s desperate obstinacy who where now so far declined as that they remained no means but threatening of evil]that they may return everyone from his evil way that I may forgive their iniquity and their sin [it may be c it is spoken of the all knowing God after the manner of man to shew acceptable to him true repentance is compare Deuteronomy 5 on verse 29 so also in the word thinking and elsewhere often.]"}],"4":[{"catchword":null,"tekst":"Then Jeremiah called Baruch the son of Nerija and Baruch wrote from the mouth of Jeremiah all the words of the Lord which he spoken unto him upon the roll of a book."}],"5":[{"catchword":null,"tekst":"And Jeremiah commanded Baruch and said I am detained [or shut up which some understand of some imprisonment or confinement from above chapter 33.1 where some Hebrew word is used but others judging that this doth not well agree with below verse 19 take it for some other impediment as by a special command of God or some outward legal uncleanness or religious vow see Num 19:11c 1Samuel 21 on verse 7 Nehemiah 6 on verse 10] I shall not be able to go into the house of the Lord."}],"6":[{"catchword":null,"tekst":"Therefore go thou thy ways and read in the roll in which thou hast written from thy mouth the words of the Lord before the ears of the people in the house of the Lord upon the fasting day [which they themselves extraordinarily thought to good keep observing doubtless by sundry tokens that God was provoked to anger see below verse 9] and thou shalt also read them below the ears of Judah that came out of their cities [to Jerusalem upon their fasting day as below verse 9.]"}],"7":[{"catchword":null,"tekst":"It may be their supplication will fall down before the Lord&acirc;&euro;&trade;s face [that is it may be they will fall down by humble supplication and prayer or present their supplication before him it may be likewise taken thus that as prayer is said to ascend in respect of faith so may it also justly be said to fall down before the Lord in respect of humility and confession of our unworthiness some take falling for well pleasing gracious acceptable as below chapter 37.20 compare also chapter 38.26 and chapter 42.2,9] and they will return everyone from his evil way and great is the anger and fury which the Lord hath pronounced against this people [that is great are the judgments miseries plagues which they threatened them if they repent not .]"}],"8":[{"catchword":null,"tekst":"And Baruch the son of Nerija // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
