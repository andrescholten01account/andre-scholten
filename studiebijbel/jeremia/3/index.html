  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }

rtalingen":{"SVnu":{"1":"Men zegt: Als een man zijn vrouw verlaat, en zij gaat van hem weg en wordt de vrouw van een andere man, zal hij dan nog naar haar terugkeren? Zou dat land niet ernstig ontheiligd worden? U hebt met veel minnaars gehoereerd, en toch zou u weer naar Mij terugkeren, spreekt de HEERE.","2":"Sla uw ogen op naar de hoge plaatsen, en zie toe: waar bent u niet beslapen? U hebt voor hen gezeten langs de wegen, als een Arabier in de woestijn; zo hebt u het land ontheiligd met uw hoererijen en met uw slechtheid.","3":"Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.","4":"Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!","5":"Zal Hij voor eeuwig Zijn toorn behouden? Zal Hij die voortdurend bewaren? Zie, u spreekt en doet die slechte dingen, en u zet door zoveel u kunt.","6":"Verder zei de HEERE tegen mij, in de dagen van koning Josia: Hebt u gezien wat het afgekeerde Israël gedaan heeft? Zij ging op elke hoge berg en onder elke groene boom, en hoereerde daar.","7":"En Ik zei, nadat zij dit alles gedaan had: Bekeer u tot Mij; maar zij bekeerde zich niet. Dit zag haar trouweloze zuster Juda.","8":"En Ik zag, toen Ik vanwege alles waarin het afgekeerde Israël overspel had gepleegd, haar had weggestuurd en haar een scheidbrief had gegeven, dat de trouweloze Juda, haar zuster, niet vreesde, maar wegging en zelf ook hoereerde.","9":"Ja, het gebeurde, vanwege het gerucht van haar hoererij, dat zij het land ontheiligde; want zij bedreef overspel met steen en met hout.","10":"En zelfs bij dit alles heeft haar trouweloze zuster Juda zich niet met haar hele hart tot Mij bekeerd, maar slechts in schijn, spreekt de HEERE.","11":"Toen zei de HEERE tegen mij: Het afgekeerde Israël heeft zichzelf rechtvaardiger getoond dan de trouweloze Juda.","12":"Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.","13":"Erken alleen uw ongerechtigheid, dat u tegen de HEERE, uw God, overtreden hebt, en uw wegen verspreid hebt naar de vreemden, onder elke groene boom, maar u bent Mijn stem niet gehoorzaam geweest, spreekt de HEERE.","14":"Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.","15":"En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand.","16":"En het zal gebeuren, wanneer u meer geworden en vruchtbaar geworden bent in het land, in die dagen, spreekt de HEERE, dat zij niet meer zullen zeggen: De ark van het verbond van de HEERE, en zij zal ook niet in het hart opkomen; en zij zullen er niet aan denken, en haar niet bezoeken, en zij zal niet opnieuw gemaakt worden.","17":"In die tijd zullen zij Jeruzalem noemen: de troon van de HEERE; en alle heidenvolken zullen daar samenkomen, vanwege de Naam van de HEERE, in Jeruzalem; en zij zullen niet meer wandelen naar het goeddunken van hun slechte hart.","18":"In die dagen zal het huis van Juda naar het huis van Israël gaan; en zij zullen samen komen uit het land van het noorden, naar het land dat Ik uw vaderen als erfenis gegeven heb.","19":"Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen[1] van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.","20":"Waarlijk, zoals een vrouw trouweloos scheidt van haar vriend, zo hebt u trouweloos tegen Mij gehandeld, huis van Israël! spreekt de HEERE.","21":"Er is een stem gehoord op de hoge plaatsen, geween en smekingen van de kinderen van Israël, omdat zij hun weg verdraaid hebben, en de HEERE, hun God, vergeten hebben.","22":"Keer terug, afkerige kinderen! Ik zal uw afkeringen genezen. Zie, hier zijn wij, wij komen tot U, want U bent de HEERE, onze God!","23":"Waarlijk, tevergeefs verwacht men het van de heuvels en de menigte van bergen; waarlijk, in de HEERE, onze God, is het heil van Israël!","24":"Want de schaamte heeft de arbeid van onze vaderen opgegeten, van onze jeugd af aan; hun schapen en hun runderen, hun zonen en hun dochters.","25":"Wij liggen in onze schaamte, en onze schande overdekt ons, want wij hebben tegen de HEERE, onze God, gezondigd, wij en onze vaderen, van onze jeugd af aan tot op deze dag; en wij zijn de stem van de HEERE, onze God, niet gehoorzaam geweest."},"SV":{"1":"Men zegt: Zo een man zijn huisvrouw verlaat, en zij gaat van hem, en wordt eens anderen mans, zal hij ook tot haar nog wederkeren? Zou datzelve land niet grotelijks ontheiligd worden? Gij nu hebt *met* veel boeleerders gehoereerd, keer nochtans weder tot Mij, spreekt de HEERE.","2":"Hef uw ogen op naar de hoge plaatsen, en zie toe, waar zijt gij niet beslapen ? Gij hebt voor hen gezeten aan de wegen, als een Arabiër in de woestijn; alzo hebt gij het land ontheiligd met uw hoererijen en met uw boosheid.","3":"Daarom zijn de regendruppelen ingehouden, en er is geen spade regen geweest. Maar gij hebt een hoerenvoorhoofd, gij weigert schaamrood te worden.","4":"Zult gij niet van nu af tot Mij roepen: Mijn Vader! Gij zijt de leidsman mijner jeugd!","5":"Zal Hij in eeuwigheid *den* *toorn* behouden? Zal Hij *dien* gestadig bewaren? Zie, gij spreekt en doet die boosheden, en neemt de overhand.","6":"Voorts zeide de HEERE tot mij, in de dagen van den koning Josia: Hebt gij gezien, wat de afgekeerde Israël gedaan heeft? Zij ging henen op allen hogen berg, en tot onder allen groenen boom, en hoereerde aldaar.","7":"En Ik zeide, nadat zij zulks alles gedaan had: Bekeer u tot Mij; maar zij bekeerde zich niet. Dit zag de trouweloze, haar zuster Juda.","8":"En Ik zag, als Ik ter oorzake van alles, waarin de afgekeerde Israël overspel bedreven had, haar verlaten, en haar haar scheidbrief gegeven had, dat de trouweloze, haar zuster Juda, niet vreesde, maar ging henen, en hoereerde zelve ook.","9":"Ja, het geschiedde, vanwege het gerucht harer hoererij, dat zij het land ontheiligde; want zij bedreef overspel met steen en met hout.","10":"En zelfs in dit alles heeft zich haar trouweloze zuster Juda tot Mij niet bekeerd met haar ganse hart, maar valselijk, spreekt de HEERE.","11":"Dies de HEERE tot mij zeide: De afgekeerde Israël heeft haar ziel gerechtvaardigd, meer dan de trouweloze Juda.","12":"Ga henen, en roep deze woorden uit tegen het noorden, en zeg: Bekeer u, gij afgekeerde Israël! spreekt de HEERE, zo zal Ik Mijn toorn op ulieden niet doen vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal *den* *toorn* niet in eeuwigheid behouden.","13":"Alleen ken uw ongerechtigheid, dat gij tegen den HEERE, uw God, hebt overtreden, en uw wegen verstrooid hebt tot de vreemden, onder allen groenen boom, maar gij zijt Mijner stem niet gehoorzaam geweest, spreekt de HEERE.","14":"Bekeert u, gij afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, een uit een stad, en twee uit een geslacht, en zal u brengen te Sion.","15":"En Ik zal ulieden herders geven naar Mijn hart; die zullen u weiden *met* wetenschap en verstand.","16":"En het zal geschieden, wanneer gij vermenigvuldigd en vruchtbaar zult geworden zijn in het land, in die dagen, spreekt de HEERE, zullen zij niet meer zeggen: De ark des verbonds des HEEREN, ook zal zij in het hart niet opkomen; en zij zullen aan haar niet gedenken, en *haar* niet bezoeken, en zij zal niet weder gemaakt worden.","17":"Te dier tijd zullen zij Jeruzalem noemen, des HEEREN troon; en al de heidenen zullen tot haar vergaderd worden, om des HEEREN Naams wil, te Jeruzalem; en zij zullen niet meer wandelen naar het goeddunken van hun boos hart.","18":"In die dagen zal het huis van Juda gaan tot het huis van Israël; en zij zullen te zamen komen uit het land van het noorden, in het land, dat Ik uw vaderen ten erve gegeven heb.","19":"Ik zeide wel: Hoe zal Ik u onder de kinderen zetten, en u geven het gewenste land, de sierlijke erfenis van de heirscharen der heidenen? Maar Ik zeide: Gij zult tot Mij roepen: Mijn Vader! en gij zult van achter Mij niet afkeren.","20":"Waarlijk, *gelijk* een vrouw trouwelooslijk scheidt van haar vriend, alzo hebt gijlieden trouwelooslijk tegen Mij gehandeld, gij huis Israëls! spreekt de HEERE.","21":"Er is een stem gehoord op de hoge plaatsen, een geween *en* smekingen der kinderen Israëls, omdat zij hun weg verkeerd, *en* den HEERE, hun God, vergeten hebben.","22":"Keert weder, gij afkerige kinderen! Ik zal uw afkeringen genezen. Zie, *hier* zijn wij, wij komen tot U, want Gij zijt de HEERE, onze God!","23":"Waarlijk, tevergeefs *verwacht* *men* *het* van de heuvelen *en* de menigte der bergen; waarlijk, in den HEERE, onzen God, is Israëls heil!","24":"Want de schaamte heeft den arbeid onzer vaderen opgegeten, van onze jeugd aan; hun schapen en hun runderen, hun zonen en hun dochteren.","25":"Wij liggen in onze schaamte, en onze schande overdekt ons, want wij hebben tegen den HEERE, onzen God, gezondigd, wij en onze vaderen, van onze jeugd aan tot op dezen dag; en wij zijn der stem des HEEREN, onzes Gods, niet gehoorzaam geweest."},"KJV":{"1":"They say, If a man put away his wife, and she go from him, and become another man's, shall he return unto her again? shall not that land be greatly polluted? but thou hast played the harlot with many lovers; yet return again to me, saith the LORD.","2":"Lift up thine eyes unto the high places, and see where thou hast not been lien with. In the ways hast thou sat for them, as the Arabian in the wilderness; and thou hast polluted the land with thy whoredoms and with thy wickedness.","3":"Therefore the showers have been withholden, and there hath been no latter rain; and thou hadst a whore's forehead, thou refusedst to be ashamed.","4":"Wilt thou not from this time cry unto me, My father, thou *art* the guide of my youth?","5":"Will he reserve *his anger* for ever? will he keep *it* to the end? Behold, thou hast spoken and done evil things as thou couldest.","6":"The LORD said also unto me in the days of Josiah the king, Hast thou seen *that* which backsliding Israel hath done? she is gone up upon every high mountain and under every green tree, and there hath played the harlot.","7":"And I said after she had done all these *things*, Turn thou unto me. But she returned not. And her treacherous sister Judah saw","8":"And I saw, when for all the causes whereby backsliding Israel committed adultery I had put her away, and given her a bill of divorce; yet her treacherous sister Judah feared not, but went and played the harlot","9":"And it came to pass through the lightness of her whoredom, that she defiled the land, and committed adultery with stones and with stocks.","10":"And yet for all this her treacherous sister Judah hath not turned unto me with her whole heart, but feignedly, saith the LORD.","11":"And the LORD said unto me, The backsliding Israel hath justified herself more than treacherous Judah.","12":"Go and proclaim these words toward the north, and say, Return, thou backsliding Israel, saith the LORD; *and* I will not cause mine anger to fall upon you: for I *am* merciful, saith the LORD, *and* I will not keep *anger* for ever.","13":"Only acknowledge thine iniquity, that thou hast transgressed against the LORD thy God, and hast scattered thy ways to the strangers under every green tree, and ye have not obeyed my voice, saith the LORD.","14":"Turn, O backsliding children, saith the LORD; for I am married unto you: and I will take you one of a city, and two of a family, and I will bring you to Zion:","15":"And I will give you pastors according to mine heart, which shall feed you with knowledge and understanding.","16":"And it shall come to pass, when ye be multiplied and increased in the land, in those days, saith the LORD, they shall say no more, The ark of the covenant of the LORD: neither shall it come to mind: neither shall they remember it; neither shall they visit *it*; neither shall *that* be done","17":"At that time they shall call Jerusalem the throne of the LORD; and all the nations shall be gathered unto it, to the name of the LORD, to Jerusalem: neither shall they walk any more after the imagination of their evil heart.","18":"In those days the house of Judah shall walk with the house of Israel, and they shall come together out of the land of the north to the land that I have given for an inheritance unto your fathers.","19":"But I said, How shall I put thee among the children, and give thee a pleasant land, a goodly heritage of the hosts of nations? and I said, Thou shalt call me, My father; and shalt not turn away from me.","20":"Surely *as* a wife treacherously departeth from her husband, so have ye dealt treacherously with me, O house of Israel, saith the LORD.","21":"A voice was heard upon the high places, weeping *and* supplications of the children of Israel: for they have perverted their way, *and* they have forgotten the LORD their God.","22":"Return, ye backsliding children, *and* I will heal your backslidings. Behold, we come unto thee; for thou *art* the LORD our God.","23":"Truly in vain *is salvation hoped for* from the hills, *and from* the multitude of mountains: truly in the LORD our God *is* the salvation of Israel.","24":"For shame hath devoured the labour of our fathers from our youth; their flocks and their herds, their sons and their daughters.","25":"We lie down in our shame, and our confusion covereth us: for we have sinned against the LORD our God, we and our fathers, from our youth even unto this day, and have not obeyed the voice of the LORD our God."}},"tsk":{"1":[{"kopje":"Als een man","refs":["Deut 24:1-4"]},{"kopje":"Zou niet","refs":["Jer 3:9","Jer 2:7","Lev 18:24-28","Jes 24:5","Micha 2:10"]},{"kopje":"U hebt","refs":["Jer ssen God en hen was, evenzeer verbroken hadden als de andere tien stammen Israëls, die allen bloedverwanten van Juda waren, als zijnde allen tezamen afkomstig van den patriarch Jakob; daarom worden zij zusters genoemd. Vergelijk Eze 16:46 , en Eze 23:2 , Eze 23:4 , en alzo in het volgende."}],"8":[{"catchword":"scheidbrief","tekst":"Haar overgevende in de hand der Assyriërs, die de tien stammen, als van Gods aangezicht en uit zijn land, gevankelijk hebben weggevoerd."},{"catchword":"vreesde,","tekst":"Zich niet ontzag, of niet schroomde het boze voorbeeld van Israël na te volgen, niettegenstaande zij al die straffen, die Israël waren overkomen, als voor ogen gezien had. Vergelijk onder Jer 44:10 , en Pro 28:14 ."}],"9":[{"catchword":"gerucht","tekst":"Hebreeuws, stem; dat men ook zo kan nemen dat het ene roepende zonde geweest is, gelijk de Schriftuur elders spreekt; vergelijk Gen 4:10 , met de aantekening. Anders: lichtvaardigheid."},{"catchword":"zij het land","tekst":"Dit duiden sommigen nog op Israël, uit vergelijking van vs.10."},{"catchword":"steen","tekst":"Dat is, stenen of houten afgoden. Alzo Eze 20:32 ; zie aldaar."}],"10":[{"catchword":"in alle dezen","tekst":"Of, om, of door, dit alles; dat is, hoewel zij dit alles gezien had, dat tevoren van Israël verhaald is."},{"catchword":"valselijk,","tekst":"Hebreeuws, in, of met valsheid; dat is bedriegelijk, huichelachtig."}],"11":[{"catchword":"ziel","tekst":"Dat is, zichzelve, haar persoon, gelijk dikwijls. Zie Gen 12:5 . De zin is: Israël mag zich des roemen, dat zij het zo slim nog niet gemaakt heeft als Juda. Zie Eze 16:51-52 , en Eze 33:11 ."}],"12":[{"catchword":"noorden,","tekst":"Naar Assyrië en Medië toe, waar de tien stammen waren heengevoerd; 2Ki 17:6 ."},{"catchword":"toorn","tekst":"Hebreeuws, aangezicht; dat is mijn toorn, of mijn toornig aangezicht, waardoor Gods strenge straffen verstaan worden. Zie Psa 21:10 , onder Jer 4:26 ; Lev 17:10 . Anders: mijn aangezicht tegen u niet nederslaan, of ned t":"Of, vermaakt worden; of [dat, of zulks alles] zal er niet meer geschieden, of gedaan worden. Anders: zij zal niet meer groot gemaakt, dat is hoog geacht en geroemd worden, omdat de Zoon Gods in het vlees zal geopenbaard zijn, gelijk het woord maken alzo bij sommigen ook genomen wordt; Deu 32:6 ; 1Sa 12:6 , en elders."}],"17":[{"catchword":"om des HEEREN","tekst":"Of, tot den naam des HEEREN; dat is tot den Heere zelf, die in het vlees en aan zijne kerk, als bij naam, zal zijn geopenbaard."},{"catchword":"goeddunken","tekst":"Of, inbeelding, beschouwing, gedachte; anders: hardigheid; alzo Deu 29:19 ; Psa 81:13 ; onder Jer 7:24 , en Jer 9:14 , en Jer 11:8 , en Jer 18:12 , enz."}],"18":[{"catchword":"gaan tot het huis","tekst":"Zie boven vs.14, die tevoren van elkander gescheiden, oneens en vijanden waren, zullen in goeden vrede, door enen geest des geloofs, als leden van een lichaam onder een hoofd Jezus Christus, tezamen hier in Gods kerk en hierna in het hemelse Kanaän, Gods erfenis bezitten; vergelijk Isa 11:13 ; Eze 37:16 , enz.; Heb 11:14-15 , en Heb 12:22 , en onder Jer 50:4 ."},{"catchword":"noorden,","tekst":"Dat is, van hunne gevangenis; zijnde dit een beeld der geestelijke gevangenis en verlossing uit dezelve door Christus."},{"catchword":"ten erve","tekst":"Of, heb doen erven, erfelijk bezitten."}],"19":[{"catchword":"Ik zeide wel","tekst":"Dat is, Ik dacht, als terstond wederom; menselijkerwijze van God, als bij zichzelven aldus denkende en beraadslagende, gesproken, om de onwaardigheid van dit volk [waarvan wijders vs.20], en de grootheid zijner genade uit te drukken; alsof God zeide: Maar hoe zal Ik daartoe komen, dat Ik van zulk boos volk mij ene kerk maak, en hen tot mijne kinderen en erfgenamen van het hemelse en heerlijke Kanaän met de menigte d er heidenen, aanneem? Waarop God als bij zichzelven aldus antwoordt: Ik zal maken door mijnen Geest der bekering en des kindschaps, dat zij zich bekeren, [gelijk volgt] en in geloof tot mij roepen: Abba, en van mij niet afwijken; zie Jer 32:40 ; Rom 8:15 . Sommigen nemen dit vers als een vervolg van de voorgaande belofte, en stellen het aldus: Ook zeide Ik, of want Ik zeide, hoe zal Ik, enz., verwonderenderwijze; en in het volgende: Ook zeide Ik, gij zult tot mij roepen, enz."},{"catchword":"gewenste","tekst":"Hebreeuws, land der begeerte, van den wens; zie Psa 106:24 ."},{"catchword":"sierlijke","tekst":"Hebreeuws, erfenis des sieraads. Aldus was Kanaän genoemd, zijnde een voorbeeld van het hemelse Kanaän; zie Eze 20:6 ; Dan 8:9 , en Dan 11:16 , Dan 11:41 , Dan 11:45 ."},{"catchword":"tot Mij roepen","tekst":"Of, mij noemen."}],"20":[{"catchword":"vriend,","tekst":"Of, metgezel; dat is, man; vergelijk Hos 3:1 ."}],"21":[{"catchword":"is een stem","tekst":"Dat is, daar zal gehoord worden. Hier begint ene profetie en beschrijving van de bekering der Israëlieten."},{"catchword":"en smekingen","tekst":"Of, een geween der smekingen."}],"22":[{"catchword":"Keert weder,","tekst":"Dit is Gods stem."},{"catchword":"Zie, hier","tekst":"Dit is het antwoord der wenende en smekende boetvaardige Israëlieten."}],"24":[{"catchword":"schaamte","tekst":"Dat is, de afgod Baäl, dies wij ons wel mogen schamen, want hij is een vuile en schandelijke afgod en heeft ons beschaamd en te schande gemaakt. Alzo onder Jer 11:13 ; Hos 9:10 ."},{"catchword":"arbeid","tekst":"Dat is, hetgeen zij met arbeid verkregen hadden, gelijk in het volgende verklaard wordt."},{"catchword":"opgegeten,","tekst":"Dat is, verteerd, zo vanwege de kostbaarheid der afgoderij als de rechtvaardige plagen, die hun daarom zijn overkomen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"They say ,[Heb.to say, or,saying; that is ,they say so, in a manner of speaking ,suppose that,&] If a man leave his wife, and she go from him,and become another mans, shall he also yet return unto her?[that is ,may also the first husband take her again]should not that same land [ wherein such an abomination should be committed. See hereof, Deut.24.4] be greatly profaned] thou now hast played the harlot with many lovers ,[Heb. Companions,friends]yet return again unto me,speaketh the LORD .[the Lord doth intimate hereby , that he will not withstanding graciously receive his people , if they shall seriously repent of all these abominations and breaches of covenant]"}],"2":[{"catchword":null,"tekst":"Lift up thine eyes unto the high places, and , behold where hast thoou not been lien with?[That is , there are no high places, but thou hast committed Idolatry upon them ]thou hast sate for them in the wayes ,[ to watch for the lovers , as a common impudent strumpet. Compare Gen 38.14. Ezek. 16.24,25.] as qan Arabbian in the wildernesse: [As thieves and robbers watch for passengers in the desert places]so hast thou profaned the land with thy whoredoms and with thy wckedness ."}],"3":[{"catchword":null,"tekst":"Therefore the drops of rain [Or, showers of rain] have been with-held,[ to wit, by me, according to my threatenings , Levit 26.19. Deut 28.23,24] and there hath been no latter rain : [see Deut. 11 on verse 14 ] but thou hast an whores [Heb. A womans ,a whores; as often] forehead, thou refusest to blush .[That is , thou wilt not be ashamed, whih tho indeed oughtest to be , when thou feelest my judgements , which l bring you upon the land.]"}],"4":[{"catchword":null,"tekst":"Wilt thou not from this time cry unto me? [Heb. Doest tho not cry utno me , or doest thou not call me,&c as if God should say , wilt thou not now yet return unto me? Repent yet from this time] My father , thou art the guide of my youth.[ that hast led and guided me from the beginning with instruction , counsel, action, as a good husband doth his wife. Compare prov 2.17]"}],"5":[{"catchword":null,"tekst":"Will he reserve (anger) forever? [compare below, v12 and Psalms 103 .9 also Levit.19.18 Nahum 1.2 in which places the word anger, for the clearing of the sense, is to be understood. These and the words that follow may be taken as the words of the people , which God prescribeth unto them , to move him him thereby in a penitent and humble manner to have compassion on them : or, as the words of God, or of Prophet,shewing that God will turn away his anger,if they do repent] will he keep (it) continually? Behold thou speakest,and doest those wickedness,[which are related above .These are the words of God unto Israel] and doest prevail.[that is, thou doest obstinately break thorow with thy wickedness, as if God should say,It&rsquo;s but in vain for me to call thee to repentance, thou carest not for it,thou goest but the more wilfully on in thy wickednesse]"}],"6":[{"catchword":null,"tekst":"Moreover the LORD said unto me,In the days of King Josia; [When the ten tribes of Israel were carried away into Assyria] hast thou not seen what the backsliding Israel hath done?[Heb. Properly aversnesse, or back-sliding. Oth. The backsliding, in the faminine gender, agreeing to the following text, where Israel is compared to an harlot] she went up into all (or every) high mountain, and under all (or every) green tree, and there played the harlot."}],"7":[{"catchword":null,"tekst":"And l said , after she had done all this, Turn thou unto me , but she returned not: This trencherous(one) her sister Juda saw.[The treancherous (one) so doth God call them of the tribe of Juda, by reason of their Idolatry, whereby they had broken the spiritual bond. And faith of marriage , that was between God and them. As well as the other ten tribes of Israel had done,which were all kinsmen of Juda, as being all descended from Patriarch Jacob:therefore they are called sisters .Compare Ezech.16.46. And 23.2,4,etc. So in the sequel.]"}],"8":[{"catchword":null,"tekst":"And l saw, when because all, wherein the backslidden Israel had committed adultery,l had forsaken her, and given her her bill of divorce,[delivering her into the hand of the Assyrians,who carried the ten tribes away captive,as rom the face of God , and out of their own Land] that the unfaithful,her filter Juda,feared not [ stuck not,or, was not afraid to follow the evil example of Israel ,notwithstanding that she had,as it were beheld with her eyes all those judgements that had lighted upon Israel. Compare below chap.44.10 and Prov.28. On vers.14] but went her wayes, and played the harlot herself also."}],"9":[{"catchword":null,"tekst":"Yea it came to passe, by reason of the fame of her whoredom ,[Hebr. Voice,&c which may be also so taken, as they it was a crying voice, as the scripture elsewhere speaketh, Gen. 4.10 with the annotat. Oth lightness ]that she perfumed the land :[some apply this still to Israel , by comparing the following verse ] for the committed adultery wood with stone and with[That is with stone and wooden idols so e zech. 20.32. See there]"}],"10":[{"catchword":null,"tekst":"and even in all this ,[or, for, or, by all this,that is , though she had seen all this that was before related concerning Israel]her unfaithful sister Juda hath not turned unto me with her whole heart; but falsly,[Heb. In ,or,with falshood; that is, deceitfully,hypocritically] saith the Lord."}],"11":[{"catchword":null,"tekst":"Therefore the Lord said unto me ,The backslidden Israel had justified her soul [That is herself, her person,as often. See Genes 12.on verse 5 ] more then the unfaithful Judah. [The meaning is, Israel may boast of it,that she hath not done yet so wickedly,as judah hath. See Eze 16:51,52. And 23.11]"}],"12":[{"catchword":null,"tekst":"Go thy wayes, and proclaim these words towards the North,[ Toward Assyria and Media, whither the ten tribes were carried] and say: Repent , thou back-slidden Israel, saith the LORD, then I will not cause mine anger [ Hebr face; that is, mine anger,or, my angry countenance, whereby is meant God&rsquo;s severe judgements, See Psal 21. on verse 10 and below chap. 4.26. Lev.17 on verse.10] to fall upon you: [Oth. I will not cast down my face against you : that is, I will not look upon you with an angry and stern countenance: ( Compare Genes.4.5,6) but will shew mercy and favour to you]for I. am gracious,[See 2.Chron.6 on verse 41] I will not keep (anger) forever. [see above on verse 5. Compare Psal.86.15 and 103.8,9.and 145.17]"}],"13":[{"catchword":null,"tekst":"Onely know[or,acknowledge] thine iniquity, that thou hast transgressed against the LORD thy God;[See above chap.2. On vers28.]and hast scattered thy wayes to the strangers, under all (or,every) green tree,[That is,hast run hither and thither to and fro,like a light impudent harlot, to commit idolatry with strange idols, as above vers.2.6 See also Ezech.16.24,etc and 23.5,6,7etc] but ye have not bee obedient to my voice,saith the LORD."}],"14":[{"catchword":null,"tekst":"Return,ye backsliding children,speaketh the LORD, for I have married you: [Having the authority of an husband over you] and I will take you, one of a City,and two of a Family, and I will bring you to Zion.[I will in mercy save a remnant, and bring them to fellowship of my Church,represented by Zion. See 1Chron9.3 and Rom 11:5. For this hath principally respect to the time of Christ,and of the New Testament]"}],"15":[{"catchword":null,"tekst":"And l will give you pastours;[That is , Teachers,Preachers] according to mine heart; they shall feed you(with) knowledge and understanding. [see further concerning this promise,below chap.23.4. Ezech.34.23.and Compare Eph4.11.and 1Sam.13.14]"}],"16":[{"catchword":null,"tekst":"And it shall come to pass, when ye shall be multiplied and become fruitful in the Land,[To wit, by the preaching of the Gospel,as came to passe in the time of our Saviour Christ,and his Apostles. See some beginning hereof, Act 1:15. 1Cor.15.6 and afterward, Act 2:41 and 4.4,etc] in those dayes, saith the LORD,[That is, the Ceremonies of the Old Testament(among which the ark was likewise a chief part)shall cease, as being shadows and types of the Messiah Jesus Christ, who being then come shall accoumplish all things, and cause his Church to worship God in Spirit ,and in truth ,in all places. See Job 4:21,23. 1Tim 2.8,etc.]neither shall it come to minde;[that is expounded by the following words. Compare Isai.65.17. And below chap 7 on vers31] neither shall they remember it,[To wit,not so,as in former time,and for the use of God&rsquo;s worship. Compare below Chap.16. On vers14.]nor visit (it)neither shall it be made[or be repaired]again[Or,(that,or.all those things)shall come to passe, or, be done no more. Oth it shall be no more magnified;that is , be highly esteemed and praised: because the Son of God shall be manifested in the flesh; as the word made, is likewise so taken by some,Deut.32.6 and 1Sam.12.6. And elsewhere.]"}],"17":[{"catchword":null,"tekst":"At that time they shall call Jerusalem, ther throne of the LORD and all heathen shall be gathered unto it ,because of the Name of the LORD ,[Or, to the Name of the LORD ;that is , to the LORD Himself,who shall be manifesteed in the flesh ,andand unto his Church,as it were by Name ]to Jerusalem: and they shall walk no more after the opinion [Or imagination,speculation, thought.Oth.ha rdnesse. See Deut.29.19 Psal 81.13 and below chap.7.24 and 9.24 and 10.8 and 18.12, etc.]of their evil heart,"}],"18":[{"catchword":null,"tekst":"In those day es the house of Juda shall go to the house of Israel : and they shall come together out of the Land of the North, into the Land that l have given for inheritance unto your Fathers [See above on vers.14. They that formally were separated from one another,and were at oddess and enemies to each other ,shall live in peace and unity together ,here in the Church of God,by one Spirit of Faith, as members of one body under one head Jesus Christand shall hereafter possess the inheritance of God in the heavenly Canaan .Compare Isai.11.13 Ezech.37.16,etc and Hebr,11.14,15. And 12.22 and below chap 50.4 (and they shall come together out of the Land of the North). That is, of their captivity: this being a figure of their spiritual captivity ,and deliverance out of it by Christ (into the Land that l have given unto your Fathers for an inheritance)Or which l cause them to inherit,or, possess hereditarily]."}],"19":[{"catchword":null,"tekst":"I said indeed;How shall l put thee among the children? And give thee desired Land [Hebr. The Land of desire,of wish See Psal .106 on verse 24.]the beautiful inheritance.[Hebr. The inheritance of beauty. So was Canaan called , being a type of the heavenly Canaan See Ezech 20.3 Dan.8.9 and 11.6,41,45.]of the armies of the heathen ? But l said ,Thou shalt cry unto me ,[or, call me]My father ,and thou shalt not turn away from after.[L said,etc.That is, l thought as straight way again, spoken of God after the manner of men ,as it were considering and advising thus with himself , to expresse the unworthiness of his people (whereof furthur vers. 20.) and the greatness of his mercy:as if God should say:But how shall l attain to it ,to make me a church of such a wicked nation, and to adopt them for my children , and the heirs of the heavenly and glorious Canaan , with the multitudes of the Gentiles ? Whereunto God thus maketh answer within himself : I will by my spirit of conversion and adoption cause them to return (as followeth ) and to cry unto me in faith, Abba, Father, and not to depart from me . See Rom 8:9. Jerem. 32.40. Some take this versw as a consequent of the former promise and render it thus ,Also l said ,or For l said, how shall l,& c.by way of admiration: and in the sequel also l said , Thou shalt cry unto me ,etc.]"}],"20":[{"catchword":null,"tekst":"Verily (as) a woman unfaithfully departeth from her friend ;[Or companion ; that is, husband. Cmpare Hsi.3.1.] so have ye delt unfaithfully against me, ye house of Israel , saith the LORD."}],"21":[{"catchword":null,"tekst":"Ther is a voice heard [That is , there shall be heard ] upon the high places , a weeping (and) supplications[or a weeping of supplications] of the children of Israel, because they have perverted their way , and have forgotten the LORD, their God . [here beginneth a prophecie and description of the conversionof the Israelites.]"}],"22":[{"catchword":null,"tekst":"Return, ye backsliding children, I will heal your backslidings: [This is the voice of God]. Behold (here) are wel, we come unto thee, for thou art the LORD our God. [This is the answer of the weeping and supplicating penitent Israelites.]"}],"23":[{"catchword":null,"tekst":"Truly in vain (it is expected) from the hills,(and) the multitude of the mountains: truly in the LORD our God is the Salvation of Israel.[ Compare Psa 121:1]"}],"24":[{"catchword":null,"tekst":"For the shame [That is, the Idol Baal, of whom indeed we may be ashamed and confounded. So below ,chap.11.13. Hos .9.10 ] hath eaten up[that is ,devoured] the labour of our fathers, [that is, that which they had gotten by their labour ,as is expounded in the words following] from our youth ;their sheep, and their oxen, their sons and their daughters.[ this shameful Idol Baal had consumed the labour of their fathers, both in respect of the just judgements that came upon them for it.]"}],"25":[{"catchword":null,"tekst":"We lie (down)in our shame, and our confusion convereth us , for we have sinned against the LORD, our God , we and our fathers from our youth unto this day: and we have not been obedient unto the voice of the LORD our God."}]}}};

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
