}},"vertalingen":{"SVnu":{"1":"Het woord van de HEERE, dat tot de profeet Jeremia gebeurd is tegen de heidenen.","2":"Tegen Egypte; tegen het leger van Farao Necho, koning van Egypte, dat aan de rivier Frath, bij Karchemis was, dat Nebukadrezar, de koning van Babel, sloeg, in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda.","3":"Rust het schild en de rondas toe, en nadert tot de strijd!","4":"Spant de paarden aan, en klimt op, ruiters! En stelt u op met helmen; veegt de speren, trekt de pantsers aan!","5":"Waarom zie Ik, dat zij versaagd en achterwaarts gedreven zijn? Zelfs hun helden zijn verslagen, en nemen de vlucht, en zien niet om; er is schrik van rondom, spreekt de HEERE.","6":"De snelle ontvliedt niet, en de held ontkomt niet; tegen het noorden, aan de oever van de rivier Frath zijn zij gestruikeld en gevallen.","7":"Wie is deze, die optrekt als een stroom, wiens water zich beweegt als de rivieren?","8":"Egypte trekt op als een stroom, en zijn water beweegt zich als de rivieren; en hij zegt: Ik zal optrekken, ik zal de aarde bedekken, ik zal de stad, en die daarin wonen, verderven.","9":"Trekt op, paarden! En raast, wagens! En laat de helden uittrekken: de Moren, en de Puteeërs, die het schild hanteren, en de Lydiërs, die de boog hanteren en spannen.","10":"Maar deze dag is van de Heere, de HEERE van de heerscharen[1], een dag van wraak, dat Hij zich wreekt van Zijn tegenstanders, en het zwaard zal verslinden, en verzadigd, en dronken worden van hun bloed; want de Heere, HEERE van de heerscharen, heeft een slachtoffer in het land van het noorden, aan de rivier Frath.","11":"Ga heen op naar Gilead, en haal balsem, jonkvrouw, dochter van Egypte! Tevergeefs vermenigvuldigt u de medicijnen, er is geen genezing voor u.","12":"De volken hebben uw schande gehoord, en het land is vol van uw geroep; want zij hebben zich gestoten, held tegen held, zij zijn beiden samen gevallen.","13":"Het woord, dat de HEERE tot de profeet Jeremia sprak, over de aankomst van Nebukadrezar, de koning van Babel, om Egypteland te slaan.","14":"Verkondigt in Egypte, en doet het horen te Migdol; doet het ook horen te Nof en Tachpanhes; zegt: Stelt u op, en maakt u gereed, want het zwaard heeft verslonden, wat rondom u is.","15":"Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef.","16":"Hij maakte de struikelende velen; ja, de een viel op de ander; zodat zij zeiden: Staat op en laat ons wederkeren tot ons volk, en tot het land van onze geboorte, vanwege het verdrukkende zwaard.","17":"Daar riepen zij: Farao, de koning van Egypte, is maar een gedruis; hij heeft de gezette tijd laten voorbijgaan.","18":"Zo waarachtig als Ik leef, spreekt de Koning, Wiens Naam is HEERE van de heerscharen; hij zal voorzeker, als Thabor onder de bergen, en als Karmel bij de zee, aankomen!","19":"Maak voor u gereedschap van de gevankelijke wegvoering, inwoonster, dochter van Egypte! Want Nof zal tot verwoesting worden, en zal verbrand worden, dat er niemand in woont.","20":"Egypte is een zeer mooie vaars; de slachter komt, hij komt van het noorden.","21":"Zelfs haar gehuurden in haar midden zijn als gemeste kalveren; maar die hebben zich ook gewend, zij zijn samen gevlucht, zij hebben niet gestaan; want de dag van hun verderf is over hen gekomen, de tijd van hun bezoeking.","22":"Haar stem zal gaan als van een slang; want zij zullen met krijgsmacht daarheen trekken, en tot haar met bijlen komen, gelijk houthouwers.","23":"Zij hebben haar woud afgehouwen, spreekt de HEERE, hoewel het niet te onderzoeken is; want zij zijn meer dan de sprinkhanen, zodat men hen niet tellen kan.","24":"De dochter van Egypte is beschaamd; zij is gegeven in de hand van het volk van het noorden.","25":"De HEERE van de heerscharen, de God van Israël, zegt: Ziet, Ik zal bezoeking doen over de menigte van No, en over Farao, en over Egypte, en over haar goden, en over haar koningen, ja, over Farao, en over hen die op hem vertrouwen.","26":"En Ik zal hen geven in de hand van hen die hun ziel zoeken, en in de hand van Nebukadrezar, de koning van Babel, en in de hand van zijn knechten. Maar daarna zal het bewoond worden als in de dagen van ouds, spreekt de HEERE.","27":"Maar u, Mijn knecht Jakob! Vrees niet, en wees niet ontzet, Israël! Want zie, Ik zal u verlossen uit verre landen, en uw nageslacht uit het land van hun gevangenschap; en Jakob zal wederkomen, en stil en gerust zijn, en niemand zal hem verschrikken.","28":"U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden."},"SV":{"1":"Het woord des HEEREN, dat tot den profeet Jeremia geschied is tegen de heidenen.","2":"Tegen Egypte; tegen het heir van Farao Necho, koning van Egypte, dat aan de rivier Frath, bij Karchemis was, dat Nebukadrezar, de koning van Babel, sloeg, in het vierde jaar van Jojakim, den zoon van Josia, den koning van Juda.","3":"Rust het schild en de rondas toe, en nadert tot den strijd!","4":"Spant de paarden aan, en klimt op, gij ruiters! en stelt u met helmen; veegt de spiesen, trekt de pantsiers aan!","5":"Waarom zie Ik, *dat* zij versaagd *en* achterwaarts gedreven zijn? Zelfs hun helden zijn verslagen, en nemen de vlucht, en zien niet om; er is schrik van rondom, spreekt de HEERE.","6":"De snelle ontvliede niet, en de held ontkome niet; tegen het noorden, aan den oever der rivier Frath zijn zij gestruikeld en gevallen.","7":"Wie is deze, *die* optrekt als een stroom, wiens wateren zich bewegen als de rivieren?","8":"Egypte trekt op als een stroom, en *zijn* wateren bewegen zich als de rivieren; en hij zegt: Ik zal optrekken, ik zal de aarde bedekken, ik zal de stad, en die daarin wonen, verderven.","9":"Trekt op, gij paarden! en raast, gij wagens! en laat de helden uittrekken: de Moren, en de Puteers, die het schild handelen, en de Lydiers, die den boog handelen *en* spannen.","10":"Maar deze dag is des Heeren, des HEEREN der heirscharen, een dag der wrake, dat Hij zich wreke van Zijn wederpartijders, en het zwaard zal vreten, en verzadigd, en dronken worden van hun bloed; want de Heere, HEERE der heirscharen, heeft een slachtoffer in het land van het noorden, aan de rivier Frath.","11":"Ga henen op naar Gilead, en haal balsem, gij jonkvrouw, dochter van Egypte! Tevergeefs vermenigvuldigt gij de medicijnen, er is geen heling voor u.","12":"De volken hebben uw schande gehoord, en het land is vol van uw gekrijt; want zij hebben zich gestoten, held tegen held, zij zijn beiden te zamen gevallen.","13":"Het woord, dat de HEERE tot den profeet Jeremia sprak, van de aankomst van Nebukadrezar, den koning van Babel, om Egypteland te slaan.","14":"Verkondigt in Egypte, en doet het horen te Migdol; doet het ook horen te Nof en Tachpanhes; zegt: Stelt er u naar, en maakt u gereed, want het zwaard heeft verteerd, wat rondom u is.","15":"Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat hen de HEERE voortdreef.","16":"Hij maakte der struikelenden veel; ja, de een viel op den ander; zodat zij zeiden: Staat op en laat ons wederkeren tot ons volk, en tot het land onzer geboorte, vanwege het verdrukkende zwaard.","17":"Daar riepen zij: Farao, de koning van Egypte, is *maar* een gedruis; hij heeft den gezetten tijd laten voorbijgaan.","18":"*Zo* *waarachtig* *als* Ik leef, spreekt de Koning, Wiens Naam is HEERE der heirscharen; hij zal voorzeker, als Thabor onder de bergen, en als Karmel bij de zee, aankomen!","19":"Maak voor u gereedschap der gevankelijke wegvoering, gij inwoneres, gij dochter van Egypte! want Nof zal ter verwoesting worden, en zal verbrand worden, dat er niemand in wone.","20":"Egypte is een zeer schone vaarze; de slachter komt, hij komt van het noorden.","21":"Zelfs haar gehuurden in haar midden zijn als gemeste kalveren; maar die hebben zich ook gewend, zij zijn te zamen gevlucht, zij hebben niet gestaan; want de dag huns verderfs is over hen gekomen, de tijd hunner bezoeking.","22":"Haar stem zal gaan als van een slang; want zij zullen met krijgsmacht daarhenen trekken, en tot haar met bijlen komen, gelijk houthouwers.","23":"Zij hebben haar woud afgehouwen, spreekt de HEERE, hoewel het niet is te onderzoeken; want zij zijn meerder dan de sprinkhanen, zodat men hen niet tellen kan.","24":"De dochter van Egypte is beschaamd; zij is gegeven in de hand des volks van het noorden.","25":"De HEERE der heirscharen, de God Israëls, zegt: Ziet, Ik zal bezoeking doen over de menigte van No, en over Farao, en over Egypte, en over haar goden, en over haar koningen, ja, over Farao, en over degenen, die op hem vertrouwen.","26":"En Ik zal hen geven in de hand dergenen, die hunlieder ziel zoeken, en in de hand van Nebukadrezar, den koning van Babel, en in de hand zijner knechten. Maar daarna zal zij bewoond worden als *in* de dagen van ouds, spreekt de HEERE.","27":"Maar gij, Mijn knecht Jakob! vrees niet, en ontzet u niet, o Israël! want zie, Ik zal u verlossen uit verre *landen*, en uw zaad uit het land hunner gevangenis; en Jakob zal wederkomen, en stil en gerust zijn, en niemand zal *hem* verschrikken.","28":"Gij *dan* Mijn knecht Jakob! vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarhenen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet gans onschuldig houden."},"KJV":{"1":"The word of the LORD which came to Jeremiah the prophet against the Gentiles;","2":"Against Egypt, against the army of Pharaohnecho king of Egypt, which was by the river Euphrates in Carchemish, which Nebuchadrezzar king of Babylon smote in the fourth year of Jehoiakim the son of Josiah king of Judah.","3":"Order ye the buckler and shield, and draw near to battle.","4":"Harness the horses; and get up, ye horsemen, and stand forth with *your* helmets; furbish the spears, *and* put on the brigandines.","5":"Wherefore have I seen them dismayed *and* turned away back? and their mighty ones are beaten down, and are fled apace, and look not back: *for* fear *was* round about, saith the LORD.","6":"Let not the swift flee away, nor the mighty man escape; they shall stumble, and fall toward the north by the river Euphrates.","7":"Who *is* this *that* cometh up as a flood, whose waters are moved as the rivers?","8":"Egypt riseth up like a flood, and *his* waters are moved like the rivers; and he saith, I will go up, *and* will cover the earth; I will destroy the city and the inhabitants","9":"Come up, ye horses; and rage, ye chariots; and let the mighty men come forth; the Ethiopians and the Libyans, that handle the shield; and the Lydians, that handle *and* bend the bow.","10":"For this *is* the day of the Lord GOD of hosts, a day of vengeance, that he may avenge him of his adversaries: and the sword shall devour, and it shall be satiate and made drunk with their blood: for the Lord GOD of hosts hath a sacrifice in the north country by the river Euphrates.","11":"Go up into Gilead, and take balm, O virgin, the daughter of Egypt: in vain shalt thou use many medicines; *for* thou shalt not be cured.","12":"The nations have heard of thy shame, and thy cry hath filled the land: for the mighty man hath stumbled against the mighty, *and* they are fallen both together.","13":"The word that the LORD spake to Jeremiah the prophet, how Nebuchadrezzar king of Babylon should come *and* smite the land of Egypt.","14":"Declare ye in Egypt, and publish in Migdol, and publish in Noph and in Tahpanhes: say ye, Stand fast, and prepare thee; for the sword shall devour round about","15":"Why are thy valiant *men* swept away? they stood not, because the LORD did drive","16":"He made many to fall, yea, one fell upon another: and they said, Arise, and let us go again to our own people, and to the land of our nativity, from the oppressing sword.","17":"They did cry there, Pharaoh king of Egypt *is but* a noise; he hath passed the time appointed.","18":"*As* I live, saith the King, whose name *is* the LORD of hosts, Surely as Tabor *is* among the mountains, and as Carmel by the sea, *so* shall he come.","19":"O thou daughter dwelling in Egypt, furnish thyself to go into captivity: for Noph shall be waste and desolate without an inhabitant.","20":"Egypt *is like* a very fair heifer, *but* destruction cometh; it cometh out of the north.","21":"Also her hired men *are* in the midst of her like fatted bullocks; for they also are turned back, *and* are fled away together: they did not stand, because the day of their calamity was come upon them, *and* the time of their visitation.","22":"The voice thereof shall go like a serpent; for they shall march with an army, and come against her with axes, as hewers of wood.","23":"They shall cut down her forest, saith the LORD, though it cannot be searched; because they are more than the grasshoppers, and *are* innumerable.","24":"The daughter of Egypt shall be confounded; she shall be delivered into the hand of the people of the north.","25":"The LORD of hosts, the God of Israel, saith; Behold, I will punish the multitude of No, and Pharaoh, and Egypt, with their gods, and their kings; even Pharaoh, and *all* them that trust","26":"And I will deliver them into the hand of those that seek their lives, and into the hand of Nebuchadrezzar king of Babylon, and into the hand of his servants: and afterward it shall be inhabited, as in the days of old, saith the LORD.","27":"But fear not thou, O my servant Jacob, and be not dismayed, O Israel: for, behold, I will save thee from afar off, and thy seed from the land of their captivity; and Jacob shall return, and be in rest and at ease, and none shall make *him* afraid.","28":"Fear thou not, O Jacob my servant, saith the LORD: for I *am* with thee; for I will make a full end of all the nations whither I have driven thee: but I will not make a full end of thee, but correct thee in measure; yet will I not leave thee wholly unpunished."}},"tsk":{"1":[{"kopje":"tegen","refs":["Jer 1:10","Jer 4:7","Jer 25:15-29","Gen 10:5","Num 23:9","Zach 2:8","Rom 3:29"]}],"2":[{"kopje":"Tegen Egypte","refs":["Jer 46:14","Jer 25:9","Jer 25:19","Ezech 29:1","Ezech 32:32"]},{"kopje":"Farao Necho","refs":["2 Kon 23:29","2 Kron 35:20","2 Kron 35:21"]},{"kopje":"Karchemis","refs":["Jes 10:9"]},{"kopje":"in het","refs":["Jer 25:1","Jer 36:1"]}],"4":[{"kopje":"veegt","refs":["Ezech 21:9-11","Ezech 21:28"]},{"kopje":"pantsers","refs":["Jer 51:3"]}],"5":[{"kopje":"en hun","refs":["Openb 6:15"]},{"kopje":"nemen de vlucht","refs":["Jer 46:15","Gen 19:17","2 Kon 7:6","2 Kon 7:7","Nahum 2:8"]},{"kopje":"schrik","refs":["Jer 6:25","Jer 20:3","Jer 20:4","Jer 46:10","Jer 49:29","Jes 19:16","Ezech 32:10","Openb 6:15-17"]}],"6":[{"kopje":"niet","refs":["Richt 4:15-21","Ps 33:16","Ps 33:17","Ps 147:10","Ps 147:11","Pred 9:11","Jes 30:16","Jes 30:17","Amos 2:14","Amos 2:15","Amos 9:1-3"]},{"kopje":"gestruikeld","refs":["Jer 46:12","Jer 20:11","Jer 50:32","Ps 27:2","Jes 8:15","Dan 11:19","Dan 11:22"]},{"kopje":"tegen","refs":["Jer 46:10","Jer 1:14","Jer 4:6","Jer 6:1","Jer 25:9"]}],"7":[{"kopje":"Wie","refs":["Hoogl 3:6","Hoogl 8:5","Jes 63:1"]},{"kopje":"als een stroom","refs":["Jer 47:2","Jes 8:7","Jes 8:8","Dan 9:26","Dan 11:22","Amos 8:8","Openb 12:15"]}],"8":[{"kopje":"trekt op","refs":["Ezech 29:3","Ezech 32:2"]},{"kopje":"Ik zal optrekken","refs":["Ex 15:9","Ex 15:10","Jes 10:13-16","Jes 37:24-26"]}],"9":[{"kopje":"raast","refs":["Nahum 2:3","Nahum 2:4"]},{"kopje":"Moren","refs":["Gen 10:6","1 Kor 1:8","Ezech 27:10","Nahum 3:9","Hand 2:10"]},{"kopje":"Lydiërs","refs":["Gen 10:13","1 Kron 1:11","Jes 66:19","Ezech 27:10","Jer 30:5"]}],"10":[{"kopje":"deze dag","refs":["Jer 51:6","Jes 13:6","Jes 34:6","Jes 34:8","Jes 61:2","Jes 63:4","Joël 1:15","Joël 2:1","Zef 1:14","Zef 1:15","Luk 21:22"]},{"kopje":"het zwaard","refs":["Deut 32:42","Jes \"wl wl-kjv\" data-code=\"H5650\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for I am with thee; for I will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a full <span class=\"wl wl-kjv\" data-code=\"H3617\">end</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> whither I have <span class=\"wl wl-kjv\" data-code=\"H5080\">driven</span> thee: but I will not <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a full <span class=\"wl wl-kjv\" data-code=\"H3617\">end</span> of thee, but <span class=\"wl wl-kjv\" data-code=\"H3256\">correct</span> thee in <span class=\"wl wl-kjv\" data-code=\"H4941\">measure;</span> yet will I not leave thee <span class=\"wl wl-kjv\" data-code=\"H5352\">wholly</span> unpunished."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Tegen Egypte;","tekst":"Of, van Egypte, of de Egyptenaars."},{"catchword":"dat aan de rivier","tekst":"Of, die, te weten Farao Necho."},{"catchword":"Frath,","tekst":"Eufraat. Zie Gen 2:14 ; alzo in het volgende."},{"catchword":"bij Kárchemis was,","tekst":"Of, te Karchemis; verstaande zulks van den koning Farao Necho zelf, hebbende zijn leger daaromtrent; alzo het onzeker is of hij ten tijde van Josia, dien hij overwon, deze stad [die Sanherib den Syriërs afgenomen had] na de overwinning heeft ingenomen, dan of hij nu wederom met zijn leger daarvoor is geweest om die te winnen, òf van dien tijd af de belegering voortgezet heeft; zie 2Ki 23:29 ; en 2Ch 35:20 ; idem, Isa 10:9 ."},{"catchword":"sloeg,","tekst":"Bij het leven van zijn vader Nabopolassar, nadat Jeremia zulks alles tevoren geprofeteerd had, gelijk volgt; na welke nederlaag de koning van Egypte tehuis bleef, hoewel hij ten tijde van Zedekia nog een tocht voornam, maar tevergeefs;; zie 2Ki 24:7 , en boven Jer 37:5 , Jer 37:11 ."}],"3":[{"catchword":"nadert tot den strijd","tekst":"Om slag te leveren. Aldus spreekt de profeet de Egyptische krijgslieden aan, bespottenderwijze, alsof hij zeide: Bereidt u vrij op het best dat gij moogt, het zal maar tevergeefs zijn, gij zult evenwel geslagen worden. Vergelijk onder Jer 51:11 ."}],"4":[{"catchword":"Spant de paarden aan en klimt op,","tekst":"Te weten, aan de wagens, van dewelke de wagenruiters te dien tijde plachten te vechten; zie 2Sa 10:18 . Hebreeuws, bindt. Vergelijk Gen 46:29 , en Exo 14:6 ; 1Ki 18:44 , enz. alwaar hetzelfde Hebreeuwse woord gebruikt wordt. Anders: zadelt de paarden."}],"5":[{"catchword":"zie Ik,","tekst":"In het profetisch gezicht, dat hem God dienaangaande vertoonde."},{"catchword":"nemen de vlucht,","tekst":"Hebreeuws, vluchtende vlucht."}],"6":[{"catchword":"snelle ontvliede niet,","tekst":"Hebreeuws, lichte; te weten op de voeten; gelijk 2Sa 2:18 ; dat is, snel in het lopen. God wil zeggen dat hen noch snelheid noch sterkte zal helpen. Anders: de snelle zal niet ontvlieden, en de held zal niet ontkomen."},{"catchword":"oever der rivier Frath","tekst":"Hebreeuws, aan de hand, of zijde; zie boven Jer 41:9 ."}],"7":[{"catchword":"stroom,","tekst":"Deze gelijkenissen zien op de gelegenheid van Egypteland, dat vele rivieren of waterstromen had. Versta hierdoor de menigte zijner krijgslieden, met welke Farao zeer prachtig aankwam."}],"8":[{"catchword":"Egypte trekt op als een stroom,","tekst":"Dat is, de Egyptenaars."},{"catchword":"bedekken,","tekst":"Met de menigte van mijn krijgsvolk, als met een wolk."},{"catchword":"stad,","tekst":"Indien men dit duidt op Karchemis, waarvan boven vs.2, zo heeft hij deze stad nog niet ingehad, maar nu gemeend te vermeesteren. Anderen verstaan door de stad, in het algemeen, steden en inwoners; alzo onder Jer 47:2 ."}],"9":[{"catchword":"raast,","tekst":"Alsof gij dol en onzinnig waart."},{"catchword":"Moren,","tekst":"Hebreeuws, Chus; zie hiervan, en van de Puteërs en Lydiërs, Gen 10:6 , Gen 10:13 ; dezen waren gehuurd door den koning van Egypte; zie vs.16,17, 21."}, const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
