"Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Tegen Moab zegt de HEERE van de heerscharen[1], de God van Israël, zo: Wee over Nebo, want zij is verwoest; Kirjathaïm is beschaamd, zij is ingenomen; de stad van het hoge vertrek[2] is beschaamd en verschrikt.", "2": "Moabs roem van Hesbon is er niet meer; zij hebben kwaad tegen haar bedacht en gezegd: Komt, laten we haar uitroeien, zodat zij geen volk meer is; ook u, o Madmen! zult neergehouwen worden, het zwaard zal achter u aan gaan.", "3": "Er is een stem van geroep uit Horonaïm; verwoesting en een grote breuk!", "4": "Moab is verbroken; haar kleine kinderen hebben een geschreeuw laten horen.", "5": "Want bij de opgang naar Luhith zal geween bij geween opgaan, want bij de afgang van Horonaïm hebben de tegenstanders van Moab een jammergeschreeuw gehoord.", "6": "Vlucht, redt uw ziel! en word als de heide in de woestijn;", "7": "Want om uw vertrouwen op uw werken, en op uw schatten, zult u ook ingenomen worden; en Kamos zal weggaan in gevangenschap, zijn priesters en zijn vorsten samen.", "8": "Want de verwoester zal komen over elke stad, zodat niet één stad zal ontkomen; en het dal zal vergaan, en het effen veld verdelgd worden; want de HEERE heeft het gezegd.", "9": "Geeft Moab vleugels, want al vliegend zal zij weggaan; en haar steden zullen tot verwoesting worden, zodat niemand daarin woont.", "10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "11": "Moab is van zijn jeugd af aan rustig geweest, en hij heeft op zijn droesem stilgelegen, en is van vat in vat niet overgegoten, en heeft niet in gevangenschap gewandeld; daarom is zijn smaak in hem gebleven, en zijn geur niet veranderd.", "12": "Daarom, zie, de dagen komen, spreekt de HEERE, dat Ik hem vreemde gasten zal toesturen, die hem naar vreemde plaatsen zullen voeren, en zijn vaten leegmaken, en hun kruiken in stukken slaan.", "13": "En Moab zal beschaamd worden vanwege Kamos, zoals het huis van Israël beschaamd is geworden vanwege Bethel, hun vertrouwen.", "14": "Hoe kunt u zeggen: Wij zijn helden en dappere mannen voor de strijd?", "15": "Moab is verwoest, en uit zijn steden opgetrokken, en de keur van zijn jongemannen is ter slachting afgegaan, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.", "16": "Moabs ondergang is nabij om te komen, en zijn ellende komt zeer snel.", "17": "Beklaagt hem, u allen die rondom hem zijt, en allen die zijn naam kennen; zegt: Hoe is de sterke staf, de sierlijke stok verbroken?", "18": "Daal neer uit uw heerlijkheid, en woon in dorst, u inwoonster, u dochter van Dibon! Want de verwoester van Moab is tegen u opgetrokken, hij heeft uw vestingen verwoest.", "19": "Sta aan de weg, en kijk uit, u inwoonster van Aroër! Vraag de vluchtende man en de vrouw die ontkomen is; zeg: Wat is er gebeurd?", "20": "Moab is beschaamd, want hij is verslagen; huilt en schreeuwt! Verkondigt het bij Arnon, dat Moab verwoest is.", "21": "En het oordeel is gekomen over het vlakke land; over Holon, en over Jahza, en over Mefaäth,", "22": "En over Dibon, en over Nebo, en over Beth-diblathaïm,", "23": "En over Kirjathaïm, en over Beth-gamul, en over Beth-meon,", "24": "En over Kerioth, en over Bozra; ja, over alle steden van Moabs land, die ver weg en die dichtbij zijn.", "25": "Moabs hoorn is afgesneden, en zijn arm verbroken, spreekt de HEERE.", "26": "Maak hem dronken, omdat hij zich groot gemaakt heeft tegen de HEERE; zo zal Moab met de handen klappen in zijn uitspuwsel, en hij zelf zal ook tot bespotting zijn.", "27": "Want is Israël u niet tot bespotting geweest? Was hij onder de dieven gevonden, dat u zich zo bewoog, van de tijd af dat uw woorden over hem gingen?", "28": "Verlaat de steden, en woont in de rots, u inwoners van Moab! En word als een duif, die in de doorgangen van de ingang van een hol nestelt.", "29": "Wij hebben Moabs hoogmoed gehoord (hij is zeer hoogmoedig), zijn trots, en zijn hoogmoed, en zijn overmoed, en de hoogheid van zijn hart.", "30": "Ik ken zijn woede, spreekt de HEERE, maar het zal niet zo gaan; zijn loze taal zal het niet zo bewerken.", "31": "Daarom zal Ik over Moab huilen, ja, om heel Moab zal Ik het uitschreeuwen; over de mensen van Kir-heres zal men zuchten.", "32": "Meer dan om het geween van Jaëzer zal Ik u bewenen, u wijnstok van Sibma! Uw ranken zijn over de zee gegaan, zij hebben gereikt tot aan de zee van Jaëzer; maar de verwoester is gevallen op uw zomervruchten en op uw wijnoogst;", "33": "Zodat de blijdschap en vreugde uit het vruchtbare veld, namelijk uit Moabs land, weggenomen is; want Ik heb de wijn doen ophouden uit de kuipen; men zal geen druiven treden met vreugdegeroep; het vreugdegeroep zal geen vreugdegeroep zijn.", "34": "Vanwege Hesbons geroep tot Eleale toe, tot Jahaz toe, hebben zij hun stem verheven, van Zoar tot aan Horonaïm, die driejarige vaars; want ook de wateren van Nimrim zullen tot verwoesting worden.", "35": "En Ik zal in Moab doen ophouden, spreekt de HEERE, hem die op de hoogte offert, en die aan zijn goden reukwerk brandt.", "36": "Daarom zal Mijn hart over Moab klagen als de fluiten; ook zal Mijn hart over de mensen van Kir-heres klagen als de fluiten, omdat het overschot dat hij gemaakt had, verloren is.", "37": "Want alle hoofden zijn kaal, en alle baarden afgeknipt; op alle handen zijn insnijdingen, en op de lenden is een rouwkleed.", "38": "Op alle daken van Moab, en op al haar straten is overal rouwklacht; want Ik heb Moab verbroken als een vat waaraan men geen behagen heeft, spreekt de HEERE.", "39": "Hoe is hij verslagen! Zij huilen; hoe heeft Moab de nek met schaamte gewend! Zo zal Moab voor allen die rondom hem zijn tot bespotting en tot ontzetting worden.", "40": "Want zo zegt de HEERE: Zie, hij zal snel vliegen als een arend, en hij zal zijn vleugels over Moab uitspreiden.", "41": "Elke stad is gewonnen, en elke vesting is ingenomen; en het hart van Moabs helden zal op die dag zijn als het hart van een vrouw die in barensnood is.", "42": "Want Moab zal verdelgd worden, zodat hij geen volk meer is, omdat hij zich groot gemaakt heeft tegen de HEERE.", "43": "De angst, en de kuil, en de strik, over u, inwoner van Moab! spreekt de HEERE.", "44": "Wie voor de angst vlucht, zal in de kuil vallen, en wie uit de kuil opklimt, zal in de strik gevangen worden; want Ik zal over haar, over Moab, het jaar van hun bezoeking[3] brengen, spreekt de HEERE.", "45": "Zij die voor de macht van de vijand vluchtten, bleven staan in de schaduw van Hesbon; maar een vuur is uitgegaan van Hesbon, en een vlam van tussen Sihon, en heeft de hoeken van Moab en de schedel van de kinderen van het rumoer verteerd.", "46": "Wee u, Moab! Het volk van Kamos is verloren; want uw zonen zijn weggenomen in gevangenschap; ook zijn uw dochters in gevangenschap.", "47": "Maar in het laatste van de dagen zal Ik Moabs gevangenschap wenden, spreekt de HEERE. Tot hiertoe is Moabs oordeel."}, "SV": {"1": "Tegen Moab zegt de HEERE der heirscharen, de God Israëls, alzo: Wee over Nebo, want zij is verstoord; Kirjathaim is beschaamd, zij is ingenomen; *de* *stad* des hogen vertreks is beschaamd en verschrikt.", "2": "Moabs roem van Hesbon is er niet meer; zij hebben kwaad tegen haar gedacht, *zeggende*: Komt, en laat ons haar uitroeien, dat zij geen volk *meer* zij; ook gij, o Madmen! zult nedergehouwen worden, het zwaard zal achter u heengaan.", "3": "Er is een stem des gekrijts van Horonaim; verstoring en een grote breuk!", "4": "Moab is verbroken; haar kleine *kinderen* hebben een gekrijt laten horen.", "5": "Want *in* den opgang van Luhith zal geween bij geween opgaan, want in den afgang van Horonaim hebben *Moabs* wederpartijders een jammergeschrei gehoord.", "6": "Vlucht, redt ulieder ziel! en wordt als de heide in de woestijn;", "7": "Want om uw vertrouwen op uw werken, en op uw schatten, zult gij ook ingenomen worden; en Kamos zal henen uitgaan in gevangenis, zijn priesteren en zijn vorsten te zamen.", "8": "Want de verstoorder zal komen over elke stad, dat niet een stad ontkomen zal; en het dal zal verderven, en het effen veld verdelgd worden; want de HEERE heeft het gezegd.", "9": "Geeft Moab vederen, want al vliegende zal zij uitgaan; en haar steden zullen ter verwoesting worden, dat niemand in dezelve wone.", "10": "Vervloekt zij, die des HEEREN werk bedriegelijk doet; ja, vervloekt zij, die zijn zwaard van het bloed onthoudt!", "11": "Moab is van zijn jeugd aan gerust geweest, en hij heeft op zijn heffe stil gelegen, en is van vat in vat niet geledigd, en heeft niet gewandeld in gevangenis; daarom is zijn smaak in hem gebleven, en zijn reuk niet veranderd.", "12": "Daarom, ziet, de dagen komen, spreekt de HEERE, dat Ik hem vreemde gasten zal toeschikken, die hem in vreemde plaatsen zullen voeren, en zijn vaten ledigen, en hunlieder flessen in stukken slaan.", "13": "En Moab zal beschaamd worden vanwege Kamos, gelijk als het huis Israëls beschaamd is geworden vanwege Beth-el, hunlieder vertrouwen.", "14": "Hoe zult gij zeggen: Wij zijn helden en dappere mannen ten strijde?", "15": "Moab is verstoord, en *uit* zijn steden opgegaan, en de keur zijner jongelingen is ter slachting afgegaan, spreekt de Koning, Wiens Naam is HEERE der heirscharen.", "16": "Moabs verderf is nabij om te komen, en zijn kwaad haast zeer.", "17": "Beklaagt hem, gij allen, die rondom hem zijt, en allen, die zijn naam kent; zegt: Hoe is de sterke staf, de sierlijke stok verbroken?", "18": "Daal neder uit *uw* heerlijkheid, en woon in dorst, gij inwoneres, gij dochter van Dibon! want Moabs verstoorder is tegen u opgetogen, hij heeft uw vestingen verdorven.", "19": "Sta aan den weg, en zie toe, gij inwoneres van Aroer! Vraag den vluchtenden *man* en de ontkomene *vrouw*; zeg: Wat is er geschied?", "20": "Moab is beschaamd, want hij is verslagen; huilt en krijt! verkondigt te Arnon, dat Moab verstoord is.", "21": "En het oordeel is gekomen over het vlakke land; over Holon, en over Jahza, en over Mefaath,", "22": "En over Dibon, en over Nebo, en over Beth-diblathaim,", "23": "En over Kirjathaim, en over Beth-gamul, en over Beth-meon,", "24": "En over Kerioth, en over Bozra; ja, over alle steden van Moabs land, die verre en die nabij zijn.", "25": "Moabs hoorn is afgesneden, en zijn arm verbroken, spreekt de HEERE.", "26": "Maak hem dronken, omdat hij zich groot gemaakt heeft tegen den HEERE; zo zal Moab *met* *de* *handen* klappen in zijn uitspuwsel, en hij zelf zal ook ter belaching zijn.", "27": "Want is u niet Israël ter belaching geweest? Was hij onder de dieven gevonden, dat gij u *zo* bewoogt, van den tijd af, dat uw woorden van hem waren?", "28": "Verlaat de steden, en woont in de steenrots, gij inwoners van Moab! en wordt gelijk een duif, die in de doorgangen van den mond eens hols nestelt.", "29": "Wij hebben Moabs hovaardij gehoord (hij is zeer hovaardig), zijn trotsheid, en zijn hovaardij, en zijn hoogmoed, en zijns harten hoogheid.", "30": "Ik ken zijn verbolgenheid, spreekt de HEERE, maar niet alzo; zijn grendelen doen het zo niet.", "31": "Daarom zal Ik over Moab huilen, ja, om gans Moab zal Ik krijten; over de lieden van Kir-heres zal men zuchten.", "32": "Boven het geween van Jaezer zal Ik u bewenen, gij wijnstok van Sibma! uw wijnranken zijn over zee gegaan, zij hebben gereikt tot aan Jaezers zee; *maar* de verstoorder is gevallen op uw zomervruchten en op uw wijnoogst;", "33": "Zodat de blijdschap en verheuging uit het vruchtbare veld, namelijk uit Moabs land, weggenomen is; want Ik heb den wijn doen ophouden uit de kuipen; men zal geen *druiven* treden met vreugdegeschrei; het vreugdegeschrei zal geen vreugdegeschrei zijn.", "34": "Vanwege Hesbons gekrijt tot Eleale toe, tot Jahaz toe, hebben zij hun stem verheven, van Zoar tot aan Horonaim, die driejarige vaarze; want ook de wateren van Nimrim zullen tot verwoestingen worden.", "35": "En Ik zal in Moab doen ophouden, spreekt de HEERE, dien, die *op* de hoogte offert, en die zijn goden rookt.", "36": "Daarom zal Mijn hart over Moab getier maken als de fluiten; ook zal Mijn hart over de lieden van Kir-heres getier maken als de fluiten, omdat het overschot, *dat* hij gemaakt had, verloren is.", "37": "Want alle hoofden zijn kaal, en alle baarden afgekort; op alle handen zijn insnijdingen, en op de lenden is een zak.", "38": "Op alle daken van Moab, en op al haar straten is overal misbaar; want Ik heb Moab verbroken als een vat, waar men geen lust aan heeft, spreekt de HEERE.", "39": "Hoe is hij verslagen! zij huilen; hoe heeft Moab den nek *met* schaamte gewend! Alzo zal Moab allen, die rondom hem zijn, tot belaching en tot een ontzetting worden.", "40": "Want zo zegt de HEERE: Ziet, hij zal snel vliegen als een arend, en hij zal zijn vleugelen over Moab uitbreiden.", "41": "Elk een der steden is gewonnen, en elk een der vastigheden is ingenomen; en het hart van Moabs helden zal te dien dage wezen, als het hart ener vrouw, die in nood is.", "42": "Want Moab zal verdelgd worden, dat hij geen volk zij, omdat hij zich groot gemaakt heeft tegen den HEERE.", "43": "De vreze, en de kuil, en de strik, over u, gij inwoner van Moab! spreekt de HEERE.", "44": "Die van de vreze ontvliedt , zal in den kuil vallen, en die uit den kuil opkomt, zal in den strik gevangen worden; want Ik zal over haar, over Moab, het jaar van hunlieder bezoeking brengen, spreekt de HEERE.", "45": "Die voor *des* *vijands* macht vluchtten, bleven staan in de schaduw van Hesbon; maar een vuur is uitgegaan van Hesbon, en een vlam van tussen Sihon, en heeft de hoeken van Moab en den schedel der kinderen van het gedruis verteerd.", "46": "Wee u, Moab! het volk van Kamos is verloren; want uw zonen zijn weggenomen in gevangenis; ook zijn uw dochters in gevangenis.", "47": "Maar in het laatste der dagen, zal Ik Moabs gevangenis wenden, spreekt de HEERE. Tot hiertoe is Moabs oordeel."}, "KJV": {"1": "Against Moab thus saith the LORD of hosts, the God of Israel; Woe unto Nebo! for it is spoiled: Kiriathaim is confounded *and* taken: Misgab is confounded and dismayed.", "2": "*There shall be* no more praise of Moab: in Heshbon they have devised evil against it; come, and let us cut it off from *being* a nation. Also thou shalt be cut down, O Madmen; the sword shall pursue thee.", "3": "A voice of crying *shall be* from Horonaim, spoiling and great destruction.", "4": "Moab is destroyed; her little ones have caused a cry to be heard.", "5": "For in the going up of Luhith continual weeping shall go up; for in the going down of Horonaim the enemies have heard a cry of destruction.", "6": "Flee, save your lives, and be like the heath in the wilderness.", "7": "For because thou hast trusted in thy works and in thy treasures, thou shalt also be taken: and Chemosh shall go forth into captivity *with* his priests and his princes together.", "8": "And the spoiler shall come upon every city, and no city shall escape: the valley also shall perish, and the plain shall be destroyed, as the LORD hath spoken.", "9": "Give wings unto Moab, that it may flee and get away: for the cities thereof shall be desolate, without any to dwell therein.", "10": "Cursed *be* he that doeth the work of the LORD deceitfully, and cursed *be* he that keepeth back his sword from blood.", "11": "Moab hath been at ease from his youth, and he hath settled on his lees, and hath not been emptied from vessel to vessel, neither hath he gone into captivity: therefore his taste remained in him, and his scent is not changed.", "12": "Therefore, behold, the days come, saith the LORD, that I will send unto him wanderers, that shall cause him to wander, and shall empty his vessels, and break their bottles.", "13": "And Moab shall be ashamed of Chemosh, as the house of Israel was ashamed of Bethel their confidence.", "14": "How say ye, We *are* mighty and strong men for the war?", "15": "Moab is spoiled, and gone up *out of* her cities, and his chosen young men are gone down to the slaughter, saith the King, whose name *is* the LORD of hosts.", "16": "The calamity of Moab *is* near to come, and his affliction hasteth fast.", "17": "All ye that are about him, bemoan him; and all ye that know his name, say, How is the strong staff broken, *and* the beautiful rod!", "18": "Thou daughter that dost inhabit Dibon, come down from *thy* glory, and sit in thirst; for the spoiler of Moab shall come upon thee, *and* he shall destroy thy strong holds.", "19": "O inhabitant of Aroer, stand by the way, and espy; ask him that fleeth, and her that escapeth, *and* say, What is done?", "20": "Moab is confounded; for it is broken down: howl and cry; tell ye it in Arnon, that Moab is spoiled,", "21": "And judgment is come upon the plain country; upon Holon, and upon Jahazah, and upon Mephaath,", "22": "And upon Dibon, and upon Nebo, and upon Bethdiblathaim,", "23": "And upon Kiriathaim, and upon Bethgamul, and upon Bethmeon,", "24": "And upon Kerioth, and upon Bozrah, and upon all the cities of the land of Moab, far or near.", "25": "The horn of Moab is cut off, and his arm is broken, saith the LORD.", "26": "Make ye him drunken: for he magnified *himself* against the LORD: Moab also shall wallow in his vomit, and he also shall be in derision.", "27": "For was not Israel a derision unto thee? was he found among thieves? for since thou spakest of him, thou skippedst", "28": "O ye that dwell in Moab, leave the cities, and dwell in the rock, and be like the dove *that* maketh her nest in the sides of the hole's mouth.", "29": "We have heard the pride of Moab, (he is exceeding proud) his loftiness, and his arrogancy, and his pride, and the haughtiness of his heart.", "30": "I know his wrath, saith the LORD; but *it shall* not *be* so; his lies shall not so effect", "31": "Therefore will I howl for Moab, and I will cry out for all Moab; *mine heart* shall mourn for the men of Kirheres.", "32": "O vine of Sibmah, I will weep for thee with the weeping of Jazer: thy plants are gone over the sea, they reach *even* to the sea of Jazer: the spoiler is fallen upon thy summer fruits and upon thy vintage.", "33": "And joy and gladness is taken from the plentiful field, and from the land of Moab; and I have caused wine to fail from the winepresses: none shall tread with shouting; *their* shouting *shall be* no shouting.", "34": "From the cry of Heshbon *even* unto Elealeh, *and even* unto Jahaz, have they uttered their voice, from Zoar *even* unto Horonaim, *as* an heifer of three years old: for the waters also of Nimrim shall be desolate.", "35": "Moreover I will cause to cease in Moab, saith the LORD, him that offereth in the high places, and him that burneth incense to his gods.", "36": "Therefore mine heart shall sound for Moab like pipes, and mine heart shall sound like pipes for the men of Kirheres: because the riches *that* he hath gotten are perished.", "37": "For every head *shall be* bald, and every beard clipped: upon all the hands *shall be* cuttings, and upon the loins sackcloth.", "38": "*There shall be* lamentation generally upon all the housetops of Moab, and in the streets thereof: for I have broken Moab like a vessel wherein *is* no pleasure, saith the LORD.", "39": "They shall howl, *saying*, How is it broken down! how hath Moab turned the back with shame! so shall Moab be a derision and a dismaying to all them about", "40": "For thus saith the LORD; Behold, he shall fly as an eagle, and shall spread his wings over Moab.", "41": "Kerioth is taken, and the strong holds are surprised, and the mighty men's hearts in Moab at that day shall be as the heart of a woman in her pangs.", "42": "And Moab shall be destroyed from *being* a people, because he hath magnified *himself* against the LORD.", "43": "Fear, and the pit, and the snare, *shall be* upon thee, O inhabitant of Moab, saith the LORD.", "44": "He that fleeth from the fear shall fall into the pit; and he that getteth up out of the pit shall be taken in the snare: for I will bring upon it, *even* upon Moab, the year of their visitation, saith the LORD.", "45": "They that fled stood under the shadow of Heshbon because of the force: but a fire shall come forth out of Heshbon, and a flame from the midst of Sihon, and shall devour the corner of Moab, and the crown of the head of the tumultuous ones.", "46": "Woe be unto thee, O Moab! the people of Chemosh perisheth: for thy sons are taken captives, and thy daughters captives.", "47": "Yet will I bring again the captivity of Moab in the latter days, saith the LORD. Thus far *is* the judgment of Moab."}}, "tsk": {"1": [{"kopje": "Moab", "refs": ["Jer 9:26", "Jer 25:21", "Jer 27:3", "Gen 19:37", "Num 24:17", "2 Kron 20:10", "Jes 15:1", "Jes 16:14", "Jes 25:10", "Jes 27:3", "Ezech 25:8-11", "Amos 2:1", "Amos 2:2", "Zef 2:8-11"]}, {"kopje": "Nebo", "refs": ["Jer 48:22", "Jer 48:23", "Num 32:3", "Num 32:37", "Num 32:38", "Num 33:47", "Jes 15:2"]}], "2": [{"kopje": "niet meer", "refs": ["Jer 48:17", "Jes 16:14"]}, {"kopje": "Hesbon", "refs": ["Jer 48:34", "Jer 48:35", "Num 21:25-30", "Num 32:37", "Jes 15:5", "Jes 16:8", "Jes 16:9"]}, {"kopje": "komt", "refs": ["Jer 48:42", "Jer 31:36", "Jer 33:24", "Jer 46:28", "Est 3:8-14", "Ps 83:5-9"]}, {"kopje": "zult", "refs": ["Jer 25:15", "Jer 25:17"]}, {"kopje": "neergehouwen", "refs": ["Jes 15:1", "Jes 25:10"]}], "3": [{"kopje": "stem", "refs": ["Jer 4:20", "J ningen/23/#v13", "ref": "2 Kon 23:13", "svLabel": null}, {"disp": "Jer 48:7", "href": "../../jeremia/48/#v7", "ref": "Jer 48:7", "svLabel": null}, {"disp": "Jer 48:13", "href": "../../jeremia/48/#v13", "ref": "Jer 48:13", "svLabel": null}, {"disp": "Jer 48:46", "href": "../../jeremia/48/#v46", "ref": "Jer 48:46", "svLabel": null}], "kinderen": []}]}]}], "torrey": [{"topic": "Moabites", "href": "../../torrey/m/#t-moabites", "kinderen": [{"label": "Called", "href": "../../torrey/m/?hl=Jer.48.46#i13298", "refs": [], "kinderen": [{"label": "People of Chemosh", "href": "../../torrey/m/?hl=Jer.48.46#i13300", "refs": [{"disp": "Num 21:29", "href": "../../numeri/21/#v29", "ref": "Num 21:29", "svLabel": null}, {"disp": "Jer 48:46", "href": "../../jeremia/48/#v46", "ref": "Jer 48:46", "svLabel": null}], "kinderen": []}]}]}]}, "47": {"torrey": [{"topic": "Moabites", "href": "../../torrey/m/#t-moabites", "kinderen": [{"label": "Prophesies Respecting", "href": "../../torrey/m/?hl=Jer.48.47#i13335", "refs": [], "kinderen": [{"label": "Restoration from captivity", "href": "../../torrey/m/?hl=Jer.48.47#i13342", "refs": [{"disp": "Jer 48:47", "href": "../../jeremia/48/#v47", "ref": "Jer 48:47", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ps 96:5": "Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemel gemaakt.", "Jer 1:16": "En Ik zal Mijn oordelen tegen hen uitspreken over al hun slechtheid; dat zij Mij verlaten hebben, en voor andere goden reukwerk verbrand hebben, en zich gebogen hebben voor de werken van hun handen.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "2 Kron 20:10": "En nu, zie, de kinderen van Ammon, en Moab, en die van het gebergte Seir, aan wie U niet toestond dat Israël erdoorheen zou trekken, toen zij uit Egypteland kwamen, maar zij weken van hen af en vernietigden hen niet;", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Joh 10:5": "Maar een vreemde zullen zij nooit volgen, maar zij zullen van hem wegvluchten; omdat zij de stem van de vreemden niet kennen.", "Jer 4:21": "Hoe lang zal ik de banier zien, het geluid van de bazuin horen?", "Dan 10:14": "Nu ben Ik gekomen om u te doen begrijpen wat uw volk zal overkomen in het vervolg van de dagen, want het gezicht is nog voor veel dagen.", "Joh 10:10-13": "De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben. Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen. Maar de huurling, die geen herder is, van wie de schapen niet zelf zijn, ziet de wolf komen, en verlaat de schapen, en vlucht; en de wolf grijpt ze, en verstrooit de schapen.", "Ps 138:6": "Want de HEERE is hoog, toch ziet Hij de nederige aan, en de verhevene kent Hij van verre.", "Ps 49:12": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.", "Matt 20:26": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;", "Num 32:36": "en Beth-Nimra, en Beth-Haran, versterkte steden en schaapskooien.", "Jer 14:3": "En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Klaagl 1:13": "Mem. Van de hoogte heeft Hij een vuur in mijn beenderen gezonden, waarover Hij geheerst heeft; Hij heeft voor mijn voeten een net uitgebreid, Hij heeft mij achterwaarts doen keren, Hij heeft mij woest en ziek gemaakt de hele dag.", "Openb 13:6": "En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en hen die in de hemel wonen.", "Klaagl 1:19": "Koph. Ik riep tot mijn liefhebbers, maar zij hebben mij bedrogen; mijn priesters en mijn oudsten hebben in de stad de geest gegeven, toen zij voedsel voor zich zochten, opdat zij hun ziel mochten verkwikken.", "Jes 47:12-15": "Sta nu met uw bezweringen, en met de veelheid van uw toverijen, waarin u gearbeid hebt van uw jeugd af; misschien kunt u voordeel doen, misschien kunt u zich sterken. U bent moe geworden van de veelheid van uw raadslagen; laat nu opstaan die de hemel waarnemen, die naar de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen die over u komen zullen. Zie, zij zullen zijn als stoppels, het vuur zal ze verbranden, zij zullen zichzelf niet kunnen rukken uit de macht van de vlam; het zal geen kool zijn om bij te warmen, geen vuur om daarvoor bij neer te zitten.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Jes 16:8-10": "Want de velden van Hesbon zijn verdord, ook de wijnstok van Sibma; de heren van de heidenvolken hebben zijn beste planten verpletterd; zij reiken tot Jaezer toe, zij dwaalden door de woestijn; hun scheuten zijn uitgespreid, zij zijn over de zee gegaan. Daarom beween ik, met de wening over Jaezer, de wijnstok van Sibma; ik maak u doornat met mijn tranen, o Hesbon en Eleale! Want het vreugdegeroep over uw zomervruchten en over uw oogst is verstomd; zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "1 Kor 3:1-4": "En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus. Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet. Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?", "Joz 9:4": "handelden zij ook arglistig, en gingen op weg, en deden alsof zij gezanten waren, en zij namen oude zakken op hun ezels, en oude en gescheurde, en samengebonden lederen wijnzakken;", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Richt 11:24": "Zou u niet erven wat uw god Kamos voor u uit het bezit verdreef? Zo zullen wij alles erven wat de HEERE, onze God, voor ons aangezicht uit het bezit verdrijft.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Ex 14:12": "Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Amos 7:16": "Nu dan, hoor het woord van de HEERE: U zegt: U zult niet profeteren tegen Israël, en niets uitspreken tegen het huis van Izak.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Ezech 16:53-55": "Wanneer Ik hun gevangenen terugbreng, namelijk de gevangenen van Sodom en haar dochters, en de gevangenen van Samaria en haar dochters, dan zal Ik ook de gevangenen van uw gevangenschap in hun midden terugbrengen. Opdat u uw schande draagt, en te schande gemaakt wordt, om alles wat u gedaan hebt, wanneer u hen troosten zult. Wanneer uw zusters, Sodom en haar dochters, terugkeren zullen naar hun vorige toestand, alsook Samaria en haar dochters zullen terugkeren naar hun vorige toestand, zult u ook, en uw dochters, terugkeren naar uw vorige toestand.", "Jes 41:26-29": "Wie heeft iets verkondigd van het begin af aan, zodat wij het weten mogen, of van tevoren, zodat wij mogen zeggen: Hij is rechtvaardig? Maar er is niemand die het verkondigt, ook niemand die iets laat horen, ook niemand die uw woorden hoort. Ik, de Eerste, zeg tegen Sion: Zie, zie ze daar! En tegen Jeruzalem: Ik zal iemand geven die een blijde boodschap brengt. Want Ik zag toe, maar er was niemand, zelfs onder hen niet; er was geen raadgever, zodat Ik hen zou kunnen vragen, en zij Mij antwoord zouden geven.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Luk 19:14": "Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Amos 4:5": "En laat rook opgaan van het gedesemde als een lofoffer, en roep vrijwillige offers uit, laat het horen; want zo hebt u het graag, kinderen van Israël! spreekt de Heere HEERE.", "Jes 22:1": "De last van het dal van het gezicht. Wat is er nu met u, dat u helemaal naar de daken bent geklommen?", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "2 Kron 30:10": "Zo trokken de boodschappers van stad tot stad, door het land van Efraïm en Manasse, tot Zebulon toe; maar zij lachten hen uit, en bespotten hen.", "Dan 11:45": "En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben.", "Mal 1:14": "Ja, vervloekt is de bedrieger, die een mannetje in zijn kudde heeft, en de Heere een gelofte doet, en offert wat verdorven is! want Ik ben een groot Koning, zegt de HEERE van de heerscharen, en Mijn Naam is ontzagwekkend onder de heidenen.", "1 Kor 4:6-8": "En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar. Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had? Al bent u verzadigd, al bent u rijk geworden, zonder ons hebt u geheerst; en och, was het maar zo dat u heerste, opdat ook wij met u heersen mochten!", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Jes 9:7-11": "De Heere heeft een woord gezonden in Jakob, en het is gevallen in Israël. En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden: De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Klaagl 2:1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "Jer 49:39": "Maar het zal gebeuren in het laatste van de dagen, dat Ik Elams gevangenschap wenden zal, spreekt de HEERE.", "Jes 15:5": "Mijn hart schreeuwt over Moab, zijn vluchtelingen gaan naar Zoar toe, de driejarige vaars. Want hij gaat op met geween naar de bergpas van Luhith, want op de weg naar Horonaim verwekken zij een jammergeschrei over de verwoesting.", "Num 21:25-30": "Zo nam Israël al deze steden in; en Israël woonde in al de steden van de Amorieten, te Hesbon, en in al haar onderhorige plaatsen. Want Hesbon was de stad van Sihon, de koning van de Amorieten; en hij had gestreden tegen de vorige koning van de Moabieten, en hij had al zijn land uit zijn hand genomen, tot aan de Arnon. Daarom zeggen zij die spreekwoorden gebruiken: Komt tot Hesbon; men bouwt en bevestigt de stad van Sihon!", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Hos 9:10": "Ik vond Israël als druiven in de woestijn, Ik zag uw vaders als de eerste vrucht aan de vijgenboom in haar begintijd; maar zij gingen naar Baäl-peor, en zonderden zich af tot die schande, en werden helemaal verfoeilijk, net als datgene wat zij liefhadden.", "Zach 11:5": "Die hen bezitten doden hen, en houden het niet voor schuld; en ieder van hen die ze verkopen, zegt: Geloofd zij de HEERE, dat ik rijk geworden ben! En niemand van hen die ze weiden, ontziet ze.", "Jer 30:24": "De gloed van de toorn van de HEERE zal zich niet afwenden, totdat Hij het gedaan heeft, en totdat Hij tot stand gebracht heeft de gedachten van Zijn hart; in het laatste van de dagen zult u daarop letten.", "Ps 24:8-10": "Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat! Wie is Hij, deze Koning der ere? De HEERE van de heerscharen, Die is de Koning der ere. Sela.", "Jer 51:30-58": "Babels helden hebben opgehouden te strijden, zij zijn gebleven in de vestingen, hun kracht is bezweken, zij zijn tot vrouwen geworden; zij hebben hun woningen aangestoken, hun grendels zijn verbroken. De ene loper zal de andere loper tegemoet lopen, en de ene kondschapper de andere kondschapper tegemoet, om de koning van Babel bekend te maken dat zijn stad van het ene einde tot het andere is ingenomen; En dat de veren ingenomen zijn, en de rietpoelen met vuur verbrand zijn; en dat de krijgslieden verbaasd zijn.", "Jes 37:23": "Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "1 Kon 21:27": "Het gebeurde nu, toen Achab deze woorden hoorde, dat hij zijn kleren scheurde, en een zak om zijn lichaam legde, en vastte; hij lag ook neer in de zak, en ging langzaam.", "Spr 26:16": "De luiaard is wijzer in zijn eigen ogen, dan zeven die met verstand antwoorden.", "Hos 9:8": "De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.", "Jes 13:4": "Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger.", "Jer 13:20": "Hef uw ogen op, en zie hen die daar uit het noorden komen! Waar is de kudde die u gegeven was, de schapen van uw heerlijkheid?", "1 Kon 20:30": "En de overgeblevenen vluchtten naar Afek, de stad in, en de muur viel op zeven en twintig duizend mannen, die overgebleven waren; ook vluchtte Benhadad, en kwam in de stad van kamer in kamer.", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "Jes 45:10": "Wee hem die tegen zijn vader zegt: Wat verwekt u? en tegen de vrouw: Wat baart u?", "1 Kron 5:8": "en Bela, de zoon van Azaz, de zoon van Sema, de zoon van Joël, die woonde te Aroër, tot aan Nebo en Baäl-Meon,", "Ezech 36:2": "Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden!", "Matt 13:22": "En die in de doornen bezaaid is, dit is degene die het woord hoort; en de zorgen van deze wereld en de verleiding van de rijkdom verstikken het woord, en het wordt onvruchtbaar.", "1 Kor 3:10-16": "Naar de genade van God, die mij gegeven is, heb ik als een wijs bouwmeester het fundament gelegd; en een ander bouwt daarop. Maar ieder ziet toe hoe hij daarop bouwt. Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus. En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;", "Job 22:9": "De weduwen hebt u met lege handen weggezonden, en de armen van de wezen zijn verbrijzeld.", "Jer 25:10": "En Ik zal van hen doen vergaan de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid, het geluid van de molens en het licht van de lamp.", "Matt 23:4": "Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "Jes 47:1": "Daal af en ga zitten in het stof, jonkvrouw, dochter van Babel! Zit op de aarde, er is geen troon meer, dochter van de Chaldeeën! Want u zult niet meer genoemd worden de tedere, of de wellustige.", "Luk 5:38": "Maar nieuwe wijn moet men in nieuwe leren zakken doen, en beide blijven behouden.", "Jer 33:24": "Hebt u niet gezien wat dit volk zegt: De twee geslachten die de HEERE verkozen had, die heeft Hij nu verworpen? Ja, zij versmaden Mijn volk, zodat het geen volk meer is voor hun aangezicht.", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Jer 27:9-18": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen. Want zij profeteren u leugens, om u ver uit uw land weg te brengen, en dat Ik u wegjaag, en u omkomt. Maar het volk dat zijn hals onder het juk van de koning van Babel zal brengen, en hem dienen, dat zal Ik in zijn land laten blijven, spreekt de HEERE, en het zal het bebouwen en erin wonen.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Mark 3:22": "En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit.", "1 Kron 5:22": "Want er vielen veel gewonden, omdat de strijd van God was; en zij woonden in hun plaats, totdat zij gevankelijk werden weggevoerd.", "Deut 4:30": "Wanneer u in angst zult zijn, en al deze dingen u zullen treffen, in de laatste dagen, dan zult u terugkeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn.", "Jer 11:17": "Want de HEERE van de heerscharen¹, Die u geplant heeft, heeft een kwaad over u uitgesproken; vanwege de boosheid van het huis van Israël en van het huis van Juda, die zij onder elkaar bedrijven, om Mij te vertoornen, door Baäl te beroken.", "1 Kon 13:1-5": "En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken. En hij riep tegen het altaar, door het woord van de HEERE, en zei: Altaar, altaar, zo zegt de HEERE: Zie, er zal aan het huis van David een zoon geboren worden, wiens naam Josia zal zijn; die zal op u de priesters van de hoogten offeren, die op u roken, en men zal mensenbeenderen op u verbranden. En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden.", "Jes 2:11-17": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn. Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt; En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;", "Jes 7:8": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is.", "Spr 6:4": "Laat uw ogen geen slaap toe, en uw oogleden geen sluimering;", "Ezech 6:14": "Daarom zal Ik Mijn hand over hen uitstrekken, en zal het land woest maken, ja, woester dan de woestijn, tot Diblath toe, in al hun woonplaatsen; en zij zullen bevinden dat Ik de HEERE ben.", "Jes 24:7-12": "De most treurt, de wijnstok kwijnt weg, allen die blijhartig waren, zuchten. De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust. Zij zullen geen wijn drinken met gezang; de sterke drank zal bitter zijn voor hen die hem drinken.", "1 Kon 12:29": "En hij zette het ene te Beth-el, en het andere plaatste hij te Dan.", "Amos 2:1": "Zo zegt de HEERE: Om drie overtredingen van Moab, en om vier zal Ik dat niet afwenden; omdat hij de beenderen van de koning van Edom tot kalk verbrand heeft.", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Jer 51:40": "Ik zal hen afvoeren als lammeren om te slachten, als rammen met bokken.", "2 Kron 24:24": "Hoewel het leger van Syrië met weinig mannen kwam, gaf de HEERE toch in hun hand een leger van zeer grote omvang, omdat zij de HEERE, de God van hun vaderen, verlaten hadden; zo voerden zij de oordelen uit tegen Joas.", "Jes 30:10": "Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.", "Deut 28:49": "De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan;", "2 Kron 32:15-19": "Laat Jehizkia u dan nu niet bedriegen, en laat hij u op deze manier niet opruien, en geloof hem niet; want geen god van enig volk en koninkrijk heeft zijn volk kunnen redden uit mijn hand en de hand van mijn vaderen; hoeveel te minder zal uw God u kunnen redden uit mijn hand? Daarbij spraken zijn dienaren nog meer tegen God, de HEERE, en tegen Zijn dienaar Jehizkia. Ook schreef hij brieven, om de HEERE, de God van Israël, te honen en om tegen Hem te spreken, en zei: Zoals de goden van de volken van de landen hun volk niet gered hebben uit mijn hand, zo zal de God van Jehizkia Zijn volk niet redden uit mijn hand.", "Mark 10:35-37": "En Jakobus en Johannes, de zonen van Zebedeüs, kwamen naar Hem toe, en zeiden: Meester, wij zouden graag willen dat U voor ons deed wat wij ook zullen vragen. En Hij zei tegen hen: Wat wilt u dat Ik voor u doe? En zij zeiden tegen Hem: Geef ons dat wij mogen zitten, de één aan Uw rechterhand, en de ander aan Uw linkerhand, in Uw heerlijkheid.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Jes 24:3": "Dat land zal helemaal leeg gemaakt worden, en het zal helemaal beroofd worden; want de HEERE heeft dit woord gesproken.", "Ps 36:3": "Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is.", "Dan 8:7-9": "En ik zag hem dicht bij de ram komen, en hij ontstak in woede tegen hem, en hij stiet de ram, en hij brak zijn beide hoorns; en in de ram was geen kracht om voor hem stand te houden; en hij wierp hem ter aarde en vertrapte hem, en er was niemand die de ram uit zijn hand redde. En de geitenbok werd uitermate groot; maar toen hij sterk geworden was, brak die grote hoorn af, en er kwamen op zijn plaats vier opvallende hoorns op, naar de vier windstreken van de hemel. En uit één van die kwam een kleine hoorn voort, die uitzonderlijk groot werd, tegen het zuiden, en tegen het oosten, en tegen het sierlijke land.", "Jes 33:8": "De gebaande wegen zijn verwoest, wie over de paden gaat, houdt op; hij vernietigt het verbond, hij veracht de steden, hij telt geen mens.", "Ps 115:4": "Hun afgoden zijn zilver en goud, het werk van mensenhanden;", "Matt 24:5": "Want velen zullen komen onder Mijn Naam en zeggen: Ik ben de Christus; en zij zullen velen misleiden.", "Deut 28:53-57": "En u zult de vrucht van uw schoot eten, het vlees van uw zonen en van uw dochters, die de HEERE, uw God, u gegeven zal hebben; in de belegering en in de benauwdheid waarmee uw vijanden u zullen benauwen. Wat betreft de man die teder onder u is, en die zeer verwend geweest is, zijn oog zal boosaardig zijn tegen zijn broeder, en tegen de vrouw van zijn schoot, en tegen zijn overige zonen die hij overgehouden zal hebben; Zodat hij aan niemand van hen iets zal geven van het vlees van zijn zonen die hij eet, omdat hij voor zichzelf niets heeft overgehouden; in de belegering en in de benauwdheid waarmee uw vijand u in al uw poorten zal benauwen.", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "Amos 5:6": "Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Joz 21:39": "Hesbon en haar voorsteden, Jaezer en haar voorsteden: al die steden zijn vier.", "Matt 5:19": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen.", "Jes 15:1-4": "De last die op Moab rust. Zeker, in de nacht is Ar-Moab verwoest, zij is uitgeroeid; zeker, in de nacht is Kir-Moab verwoest, zij is uitgeroeid! Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden. Op hun wegen hebben zij rouwkleding aangegord; op hun daken en op hun pleinen huilen zij allemaal, terwijl zij afdalen met geween.", "Amos 4:11": "Ik heb sommigen onder u omgekeerd, zoals God Sodom en Gomorra omkeerde, u, die was als een stuk brandhout, dat uit de brand gered is; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Ps 105:25": "Hij keerde hun hart om, zodat zij Zijn volk haatten, dat zij met Zijn knechten listig omgingen.", "Spr 15:17": "Beter is een gerecht van groente, waar ook liefde is, dan een vetgemeste os met haat erbij.", "Jes 28:7": "Maar ook dezen dwalen door de wijn, en zij dolen door de sterke drank; de priester en de profeet dwalen door de sterke drank; zij zijn verslonden door de wijn, zij dolen door sterke drank; zij dwalen in het zien van visioenen; zij waggelen in het rechtspreken.", "Joël 1:5": "Word wakker, dronkaards! En huil, en jammer, alle wijnzuipers! Om de nieuwe wijn, omdat hij van uw mond is afgesneden.", "Matt 24:4": "En Jezus antwoordde en zei tegen hen: Kijk uit dat niemand u misleidt.", "Jer 13:13": "Maar u zult tegen hen zeggen: Zo zegt de HEERE: Zie, Ik zal alle inwoners van dit land, zelfs de koningen die op de troon van David zitten, en de priesters, en de profeten, en alle inwoners van Jeruzalem, vullen met dronkenschap.", "Jer 50:25": "De HEERE heeft Zijn schatkamer opengedaan, en de wapens van Zijn gramschap voortgebracht; want dat is een werk van de Heere, de HEERE van de heerscharen, in het land van de Chaldeeën.", "Joz 21:37": "Kedemoth en haar voorsteden, en Mefaath en haar voorsteden: vier steden.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Ex 16:7": "En morgen zult u de heerlijkheid van de HEERE zien, omdat Hij uw gemor tegen de HEERE gehoord heeft; want wat zijn wij, dat u tegen ons mort?", "1 Sam 15:13-35": "Samuël nu kwam bij Saul, en Saul zei tegen hem: Gezegend bent u door de HEERE! Ik heb het woord van de HEERE volbracht. Toen zei Samuël: Wat is dan dit voor een geluid van schapen in mijn oren, en een geluid van runderen dat ik hoor? Saul nu zei: Ze hebben ze van de Amalekieten gebracht, want het volk heeft de beste schapen en runderen verschoond, om ze aan de HEERE, uw God, te offeren; maar de rest hebben wij verbannen.", "Ezech 16:49": "Zie, dit was de ongerechtigheid van uw zuster Sodom: hoogmoed, verzadiging van brood, en zorgeloze rust had zij en haar dochters; maar zij versterkte de hand van de arme en de behoeftige niet.", "Jer 47:2": "Zo zegt de HEERE: Zie, er komt water op van het noorden, en het zal worden tot een overlopende beek, en zal overlopen het land en de volheid ervan, de stad en wie daarin wonen; en de mensen zullen schreeuwen, en alle inwoners van het land zullen huilen;", "Micha 3:5-7": "Zo zegt de HEERE, tegen de profeten, die Mijn volk verleiden; die met hun tanden bijten, en vrede uitroepen; maar tegen hem die niet in hun mond geeft, tegen die heiligen zij een oorlog. Daarom zal het nacht voor u worden vanwege het visioen, en u zal duisternis zijn vanwege de waarzegging; en de zon zal over deze profeten ondergaan; en de dag zal over hen zwart worden. En de zieners zullen beschaamd, en de waarzeggers schaamrood worden; en zij zullen allen samen de bovenlip bewimpelen; want er zal geen antwoord van God zijn.", "Ps 79:1-3": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt. Zij hebben de dode lichamen van Uw knechten aan het gevogelte van de hemel tot voedsel gegeven; het vlees van Uw gunstgenoten aan het gedierte van het land. Zij hebben hun bloed rondom Jeruzalem als water vergoten; en er was niemand die hen begroef.", "Jes 34:2-8": "Want de toorn van de HEERE is over alle heidenvolken, en grimmigheid over heel hun leger; Hij heeft hen met de ban geslagen, Hij heeft ze ter slachting overgegeven. En hun gesneuvelden zullen weggeworpen worden, en van hun dode lichamen zal hun stank opstijgen; en de bergen zullen smelten van hun bloed. En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "Num 32:38": "en Nebo, en Baäl-Meon, waarvan de naam veranderd was, en Sibma; en zij noemden de steden die zij bouwden met andere namen.", "Job 34:33": "Zal het van u zijn, hoe Hij iets vergelden zal, omdat u Hem versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.", "Amos 2:14": "Zodat de snelle niet zal ontvlieden, en de sterke zijn kracht niet zal versterken, en een held zijn ziel niet zal bevrijden.", "Jes 16:13": "Dit is het woord dat de HEERE tegen Moab gesproken heeft, van toen af.", "1 Tim 1:3-7": "Zoals ik u vermaand heb dat u in Efeze zou blijven, toen ik naar Macedonië reisde, zo vermaan ik het u nog, opdat u sommigen zou bevelen geen andere leer te leren; Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is. Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "2 Kon 23:13": "De hoogten ook, die vooraan bij Jeruzalem waren, die aan de rechterhand van de berg Mashith lagen, die Salomo, de koning van Israël, gebouwd had voor Astoreth, het verfoeisel van de Sidoniërs, en voor Kamos, het verfoeisel van de Moabieten, en voor Milchom, de gruwel van de kinderen van Ammon, verontreinigde de koning.", "Jer 19:7-9": "Want Ik zal de raad van Juda en Jeruzalem in deze plaats verijdelen, en zal hen voor het aangezicht van hun vijanden doen vallen door het zwaard, en door de hand van hen die hun ziel zoeken; en Ik zal hun dode lichamen aan het gevogelte van de hemel en het gedierte van de aarde tot voedsel geven. En Ik zal deze stad zetten tot een ontzetting en tot een aanfluiting; ieder die haar voorbijgaat, zal zich ontzetten en fluiten over al haar plagen. En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "1 Sam 4:14": "Toen Eli het geluid van het geroep hoorde, zei hij: Wat betekent dit geluid van deze opschudding? Toen haastte die man zich, en hij kwam en vertelde het aan Eli.", "Openb 2:18": "En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:", "Jer 51:6": "Vlucht uit het midden van Babel, en red ieder zijn ziel; word niet uitgeroeid in haar ongerechtigheid; want dit is de tijd van de wraak van de HEERE, Die haar de verdienste betaalt.", "Jer 19:10": "Dan zult u de kruik verbreken voor de ogen van de mannen, die met u meegegaan zijn;", "Openb 2:20-23": "Maar Ik heb enkele weinige dingen tegen u, dat u de vrouw Izébel toelaat, die zichzelf een profetes noemt, te leren en Mijn dienstknechten te verleiden, zodat zij hoereren en afgodenoffer eten. En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd. Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Jes 16:14": "Maar nu spreekt de HEERE en zegt: Binnen drie jaar (zoals de jaren van het huurling), dan zal de eer van Moab veracht worden, met heel die grote menigte; en het overblijfsel zal klein, weinig, machteloos zijn.", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "Jer 50:32": "Dan zal de trotse aanstoten en vallen, en er zal niemand zijn die hem opricht; ja, Ik zal een vuur aansteken in zijn steden, dat zal alle plaatsen rondom hem verteren.", "Jer 8:2": "En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn.", "1 Kor 8:1": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Spr 17:19": "Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Jes 36:4": "En Rabsake zei tegen hen: Zeg toch tegen Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat is dit voor vertrouwen, waarmee u vertrouwt?", "Obadja 1:4": "Al verheft u zich als de arend, en al zet u uw nest tussen de sterren, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Hos 5:1-3": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor. En zij die afwijken, verdiepen zich erin om te slachten; maar Ik zal hun allen een tuchtmeester zijn. Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "Tit 3:10": "Verwerp iemand die een ketter is, na de eerste en tweede vermaning;", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "Jes 32:13": "Op het land van mijn volk zal de doorn en de distel opgaan; ja, op alle vreugdehuizen, in de vrolijk huppelende stad.", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Ezech 30:21-25": "Mensenkind! Ik heb de arm van Farao, de koning van Egypte, gebroken; en zie, hij zal niet verbonden worden om te genezen, door er pleisters op te leggen, door er een windsel om te doen, om hem te verbinden, om hem sterk te maken, zodat hij het zwaard kan vasthouden. Daarom zegt de Heere HEERE zo: Zie, Ik keer Mij tegen Farao, de koning van Egypte, en zal zijn armen breken, zowel de sterke als de gebroken arm; en Ik zal het zwaard uit zijn hand doen vallen. En Ik zal de Egyptenaars verstrooien onder de heidenvolken, en zal hen verspreiden in de landen.", "Ezech 7:19": "Zij zullen hun zilver op de straten werpen, en hun goud zal tot onreinheid zijn; hun zilver en hun goud zal hen niet kunnen uithelpen ten dage van de verbolgenheid van de HEERE; hun ziel zullen zij niet verzadigen, en hun ingewanden zullen zij niet vullen; want het zal de aanstoot van hun ongerechtigheid zijn.", "Ezech 26:3": "Daarom, zo zegt de Heere HEERE: Zie, Ik wil aan u, o Tyrus! En Ik zal veel heidenvolken tegen u doen opkomen, alsof Ik de zee met haar golven deed opkomen.", "Gen 3:1": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof?", "Ps 55:7": "Zodat ik zeg: Och, kreeg ik maar vleugels als een duif! ik zou wegvliegen, waar ik blijven mocht.", "Amos 8:3": "Maar de gezangen van de tempel zullen op die dag huilen worden, spreekt de Heere HEERE; er zullen veel dode lichamen zijn, in alle plaatsen zal men ze stilzwijgend wegwerpen.", "Jer 25:34": "Huil, herders! en schreeuw, en wentel u in de as, heerlijke leiders van de kudde! Want uw dagen zijn vervuld, dat men slachten zal, en van uw verstrooiingen; dan zult u vervallen als een kostelijk vat.", "Jer 6:24": "Wij hebben zijn gerucht gehoord, onze handen zijn slap geworden; benauwdheid heeft ons aangegrepen, weedom als van een barende vrouw.", "Joh 5:45": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.", "Spr 19:27": "Laat af, mijn zoon, om, terwijl u de tucht hoort, af te dwalen van de woorden van de kennis.", "Hos 7:10": "Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Jer 10:3-16": "Want de inzettingen van de volken zijn ijdelheid; want het is hout, dat men uit het woud gehouwen heeft, een werk van de handen van de werkmeester met de bijl. Men pronkt het op met zilver en met goud; zij hechten het met spijkers en met hamers, opdat het niet waggelt. Zij zijn gelijk een palmboom van dicht werk, maar kunnen niet spreken; zij moeten gedragen worden, want zij kunnen niet gaan; vreest niet voor hen, want zij kunnen geen kwaad doen, ook is er geen goeddoen bij hen.", "Spr 14:6": "De spotter zoekt wijsheid, en vindt niets; maar de kennis is voor de verstandige licht.", "Job 30:3-7": "Die door gebrek en honger eenzaam waren, vluchtend naar dorre plaatsen, in het donkere, woeste en verwoeste land. Die ziltige kruiden plukten bij de struiken, en wiens voedsel de wortel van de jenevers was. Zij werden uit het midden van de mensen weggejaagd; men riep hen na, als achter een dief,", "Jes 19:2": "Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk.", "Luk 11:46-52": "Maar Hij zei: Wee ook u, wetgeleerden! want u belast de mensen met lasten die zwaar zijn om te dragen, en zelf raakt u die lasten niet aan met één van uw vingers. Wee u, want u bouwt de graven van de profeten, en uw vaders hebben hen gedood. Zo getuigt u dus dat u instemt met de daden van uw vaderen; want zij hebben hen gedood, en u bouwt hun graven.", "Nahum 3:10": "Toch is zij gevankelijk gegaan in de gevangenis; ook zijn haar kinderen op het hoofd van alle straten verpletterd geworden; en over haar geëerde hebben zij het lot geworpen, en al haar groten zijn in boeien gebonden geworden.", "Amos 4:4": "Kom naar Beth-el, en overtreed te Gilgal; maak veel van het overtreden, en breng uw offers 's morgens, uw tienden om de drie dagen!", "Jer 13:9": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Jak 4:13-15": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "2 Sam 16:2": "En de koning zei tegen Ziba: Wat wilt u daarmee? En Ziba zei: De ezels zijn voor het huis van de koning, om op te rijden, en het brood en de zomervruchten om te eten voor de knechten; en de wijn, opdat wie moede zijn in de woestijn, kunnen drinken.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Matt 21:42": "Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "Jes 23:7": "Is dit uw vrolijk huppelende stad? Wier oudheid van oude dagen af is; maar haar eigen voeten zullen haar ver wegdragen, om als vreemdeling te verblijven.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Openb 11:3": "En Ik zal Mijn twee getuigen macht geven, en zij zullen profeteren duizend tweehonderd zestig dagen, met zakken bekleed.", "Jes 36:18": "Laat Hizkia u niet verleiden, door te zeggen: De HEERE zal ons redden; hebben de goden van de volken, ieder zijn eigen land, gered uit de hand van de koning van Assyrië?", "Hab 2:16": "U zult ook verzadigd worden met schande, in plaats van eer; drink ook zelf, en laat uw voorhuid ontbloot worden; de beker van de rechterhand van de HEERE zal zich tot u wenden, en er zal een schandelijk uitbraaksel over uw heerlijkheid zijn.", "Joz 13:19": "En Kirjathaim, en Sibma, en Zeret-hassahar, op de berg van het dal,", "Luk 22:34": "Maar Hij zei: Ik zeg u, Petrus, de haan zal vandaag niet kraaien, voordat u driemaal geloochend zult hebben dat u Mij kent.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Matt 23:13": "Maar wee u, Schriftgeleerden en Farizeeën, huichelaars! Want u sluit het Koninkrijk der hemelen voor de mensen, want u gaat er zelf niet in, en degenen die er in willen gaan, laat u niet ingaan.", "Luk 4:23": "En Hij zei tegen hen: U zult zonder twijfel dit spreekwoord tegen Mij zeggen: Dokter, genees Uzelf; al wat wij gehoord hebben dat in Kapernaüm gebeurd is, doe dat ook hier in Uw vaderland.", "2 Kron 15:6": "Dat volk tegen volk, en stad tegen stad in stukken gestoten werden; want God had hen met allerlei angst verschrikt.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "Nahum 3:19": "Er is geen genezing voor uw breuk, uw plaag is smartelijk; allen die het gerucht van u horen, zullen de handen over u klappen; want over wie is uw boosheid niet voortdurend gegaan?", "Dan 7:8": "Ik lette op de horens, en zie, een andere kleine horen kwam op tussen de horens, en drie van de vorige horens werden voor die horen uitgerukt; en zie, in die horen waren ogen als mensenogen, en een mond, die grote dingen sprak.", "1 Kon 12:33": "En hij offerde op het altaar, dat hij te Beth-el gemaakt had, op de vijftiende dag van de achtste maand, van de maand die hij uit zijn eigen hart bedacht had; zo maakte hij voor de kinderen van Israël een feest, en offerde op dat altaar, en bracht reukwerk.", "Hab 2:19": "Wee hem die tegen het hout zegt: Word wakker! en: Ontwaak! tegen de zwijgende steen. Zou die kunnen leren? Zie, het is met goud en zilver overtrokken, en er is helemaal geen geest in het midden ervan.", "Jes 2:11": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn.", "Hos 5:1": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor.", "Jer 17:11": "Zoals een veldhoen eieren verzamelt, maar ze niet uitbroedt, zo is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.", "Spr 29:8": "Spotters brengen een stad in vuur en vlam; maar de wijzen keren de toorn af.", "Jes 31:1-3": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken. Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken. Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Num 33:46": "En zij vertrokken van Dibon-gad, en legerden zich in Almon-diblathaim.", "Jes 26:18": "Wij waren zwanger, wij hadden de smarten, maar wij hebben niets dan wind gebaard; wij hebben het land geen behoud gebracht, en de inwoners van de wereld zijn niet gevallen.", "Jak 5:3": "Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Zef 2:10": "Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Jes 30:7": "Want Egypte zal nutteloos en tevergeefs helpen; daarom heb Ik hierover geroepen: Stilzitten zal hun sterkte zijn.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Jes 5:15": "Dan zal de gewone man neergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen van de hoogmoedigen zullen vernederd worden.", "Luk 18:14": "Ik zeg u: deze ging gerechtvaardigd naar zijn huis, meer dan die ander; want ieder die zichzelf verhoogt, zal vernederd worden, en die zichzelf vernedert, zal verhoogd worden.", "Jes 43:28": "Daarom zal Ik de leiders van het heiligdom ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Ezech 28:2-5": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God. Zie, u bent wijzer dan Daniël; zij hebben niets van het toegesloten voor u verborgen. Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten.", "Zach 11:16": "Want zie, Ik zal een herder verwekken in dit land; wat gereed is om afgesneden te worden, zal hij niet bezoeken; het jonge zal hij niet zoeken, en het verbrokene zal hij niet helen, en het stilstaande zal hij niet dragen; maar het vlees van het vette zal hij eten, en hun klauwen zal hij verscheuren.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Num 16:41": "Maar de volgende dag morde de hele vergadering van de kinderen van Israël tegen Mozes en tegen Aäron, en zei: U hebt het volk van de HEERE gedood!", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Mark 5:5": "En hij was altijd, nacht en dag, op de bergen en in de graven, roepend en zichzelf met stenen slaand.", "Dan 2:28": "Maar er is een God in de hemel, Die geheimen openbaart, Die de koning Nebukadnezar bekendgemaakt heeft wat er gebeuren zal in het laatste der dagen; uw droom en de visioenen van uw hoofd op uw bed zijn deze:", "Jes 13:16": "Ook zullen hun kinderen voor hun ogen verpletterd worden; hun huizen zullen geplunderd, en hun vrouwen geschonden worden.", "Jer 2:26": "Zoals een dief beschaamd wordt, wanneer hij gevonden wordt, zo is het huis van Israël beschaamd; zij, hun koningen, hun vorsten, en hun priesters, en hun profeten;", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "Jer 50:43": "De koning van Babel heeft hun gerucht gehoord, en zijn handen zijn slap geworden; benauwdheid heeft hem aangegrepen, weeën als van een barende vrouw.", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Jes 9:3": "Want het juk van hun last, en de stok van hun schouders, en de staf van hem die hen dreef, hebt U verbroken, zoals op de dag van de Midianieten;", "Spr 10:2": "Schatten van goddeloosheid geven geen voordeel; maar gerechtigheid redt van de dood.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Spr 16:18": "Hoogmoed komt vóór de ondergang, en hoogheid van geest vóór de val.", "Zef 1:7-18": "Zwijg voor het aangezicht van de Heere HEERE; want de dag van de HEERE is nabij; want de HEERE heeft een slachtoffer bereid, Hij heeft Zijn genode geheiligd. En het zal gebeuren in de dag van het slachtoffer van de HEERE, dat Ik bezoeking zal doen over de vorsten, en over de kinderen van de koning, en over allen die zich kleden met vreemde kleding. Ook zal Ik op diezelfde dag bezoeking doen over allen die over de drempel springen; die het huis van hun heren vullen met geweld en bedrog.", "Hoogl 2:14": "Mijn duif, die in de kloven van de steenrotsen bent, in het verborgene van een steile plaats, toon Mij uw gedaante, laat Mij uw stem horen; want uw stem is zoet, en uw gedaante is liefelijk.", "Ezech 35:15": "Zoals u zich verblijd hebt over de erfenis van het huis van Israël, omdat die verwoest is, zo zal Ik aan u doen; het gebergte van Seir, en heel Edom, zal helemaal een verwoesting worden; en zij zullen weten, dat Ik de HEERE ben.", "Jer 25:27-29": "U zult dan tot hen zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Drink, en word dronken, en spuw, en val neer, zodat u niet weer opstaat, vanwege het zwaard, dat Ik onder u zal zenden. En het zal gebeuren, wanneer zij weigeren de beker van uw hand aan te nemen om te drinken, dat u tot hen zult zeggen: Zo zegt de HEERE van de heerscharen: U zult zeker drinken! Want zie, in de stad, die naar Mijn Naam genoemd is, begin Ik te plagen, en zou u dan zonder meer onschuldig gehouden worden? U zult niet onschuldig worden gehouden; want Ik roep het zwaard over alle inwoners van de aarde, spreekt de HEERE van de heerscharen.", "Dan 11:36": "En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren.", "Jes 47:4-10": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël. Zit zwijgend, en ga in de duisternis, dochter van de Chaldeeën! Want u zult niet meer genoemd worden koningin van de koninkrijken. Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; toch bewees u hun geen barmhartigheid, ja, zelfs over de oude maakte u uw juk zeer zwaar.", "Jer 17:6": "Want hij zal zijn als de heide in de wildernis, die het niet merkt wanneer het goede komt; maar blijft in dorre plaatsen in de woestijn, in zout en onbewoond land.", "Mark 13:22": "Want er zullen valse christussen, en valse profeten opstaan, en zij zullen tekenen en wonderen doen, om te misleiden, indien het mogelijk zou zijn, ook de uitverkorenen.", "Job 32:9-13": "De groten zijn niet altijd wijs, en de ouden verstaan het recht niet. Daarom zeg ik: Luister naar mij; ik zal mijn mening ook tonen. Zie, ik heb gewacht op uw woorden; ik heb het oor gewend tot uw overwegingen, totdat u redenen had uitgezocht.", "Fil 1:15": "Sommigen prediken Christus wel uit afgunst en twist, maar sommigen ook uit goedwilligheid.", "Dan 8:21": "Die harige bok nu, is de koning van Griekenland; en de grote hoorn die tussen zijn ogen is, is de eerste koning.", "Zach 11:4": "Zo zegt de HEERE, mijn God: Weid deze slachtschapen.", "Hagg 2:17": "Voordat die dingen gebeurden, kwam iemand bij de korenhoop van twintig maten, en er waren er maar tien; kwam iemand bij de wijnbak om vijftig maten uit de pers te putten, en er waren er maar twintig.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "Ezech 31:10-14": "Daarom, zo zegt de Heere HEERE: Omdat u zich verheven heeft over uw stam, ja, hij stak zijn top op boven het midden van de dichte takken, en zijn hart verhief zich over zijn hoogte; daarom gaf Ik hem in de hand van de machtigste van de heidenvolken, zodat die hem naar recht zou behandelen; Ik dreef hem uit om zijn goddeloosheid. En vreemden, de meest tirannieke van de heidenvolken, roeiden hem uit en verlieten hem; zijn takken vielen op de bergen en in alle valleien, en zijn scheuten werden verbroken bij alle waterstromen van het land; en alle volken van de aarde gingen weg uit zijn schaduw, en verlieten hem.", "Neh 9:27-37": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten. Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered. En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.", "Luk 12:15": "En Hij zei tegen hen: Kijk uit en wees op uw hoede voor hebzucht; want het leven van iemand hangt niet af van de overvloed van zijn bezittingen.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Ezech 33:20": "Toch zegt u: De weg van de Heere is niet recht; Ik zal u richten, ieder naar zijn wegen, o huis van Israël!", "Openb 18:10": "Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "Ps 30:7": "Ik zei wel in mijn voorspoed: Ik zal nooit wankelen.", "Jer 23:17": "Zij zeggen steeds tegen hen die Mij lasteren: De HEERE heeft het gesproken, u zult vrede hebben; en tegen ieder die naar het goeddunken van zijn eigen hart wandelt, zeggen zij: U zal geen kwaad overkomen.", "Jer 12:5": "Als u loopt met de voetgangers, zo maken zij u moe; hoe z
