ss=\"wl wl-kjv\" data-code=\"H3212\">pursue</span> thee.", "3": "A <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H6818\">crying</span> shall be from <span class=\"wl wl-kjv\" data-code=\"H2773\">Horonaim,</span> <span class=\"wl wl-kjv\" data-code=\"H7701\">spoiling</span> and <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> destruction.", "4": "<span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is <span class=\"wl wl-kjv\" data-code=\"H7665\">destroyed;</span> her little <span class=\"wl wl-kjv\" data-code=\"H6810\">ones</span> have caused a <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> to be heard.", "5": "For in the going <span class=\"wl wl-kjv\" data-code=\"H4608\">up</span> of <span class=\"wl wl-kjv\" data-code=\"H3872\">Luhith</span> <span class=\"wl wl-kjv\" data-code=\"H1065\">continual</span> <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping</span> shall go <span class=\"wl wl-kjv\" data-code=\"H5927\">up;</span> for in the going <span class=\"wl wl-kjv\" data-code=\"H4174\">down</span> of <span class=\"wl wl-kjv\" data-code=\"H2773\">Horonaim</span> the <span class=\"wl wl-kjv\" data-code=\"H6862\">enemies</span> have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> a <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> of destruction.", "6": "<span class=\"wl wl-kjv\" data-code=\"H5127\">Flee,</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">save</span> your <span class=\"wl wl-kjv\" data-code=\"H5315\">lives,</span> and <span class=\"wl wl-kjv\" data-code=\"H1961\">be</span> like the <span class=\"wl wl-kjv\" data-code=\"H6176\">heath</span> in the wilderness.", "7": "For because thou hast <span class=\"wl wl-kjv\" data-code=\"H982\">trusted</span> in thy <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> and in thy <span class=\"wl wl-kjv\" data-code=\"H214\">treasures,</span> thou shalt also be <span class=\"wl wl-kjv\" data-code=\"H3920\">taken:</span> and <span class=\"wl wl-kjv\" data-code=\"H3645\">Chemosh</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity</span> with his <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> together.", "8": "And the <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiler</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon every <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and no <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall <span class=\"wl wl-kjv\" data-code=\"H4422\">escape:</span> the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> also shall <span class=\"wl wl-kjv\" data-code=\"H6\">perish,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4334\">plain</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath spoken.", "9": "<span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> <span class=\"wl wl-kjv\" data-code=\"H6731\">wings</span> unto <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> that it may <span class=\"wl wl-kjv\" data-code=\"H5323\">flee</span> and get <span class=\"wl wl-kjv\" data-code=\"H3318\">away:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H8047\">desolate,</span> without any to <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein.", "10": "<span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> be he that <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7423\">deceitfully,</span> and <span class=\"wl wl-kjv\" data-code=\"H779\">cursed</span> be he that keepeth <span class=\"wl wl-kjv\" data-code=\"H4513\">back</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> from blood.", "11": "<span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> hath been at <span class=\"wl wl-kjv\" data-code=\"H7599\">ease</span> from his <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H8252\">settled</span> on his <span class=\"wl wl-kjv\" data-code=\"H8105\">lees,</span> and hath not been <span class=\"wl wl-kjv\" data-code=\"H7324\">emptied</span> from <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> to <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel,</span> neither hath he <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> into <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity:</span> therefore his <span class=\"wl wl-kjv\" data-code=\"H2940\">taste</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">remained</span> in him, and his <span class=\"wl wl-kjv\" data-code=\"H7381\">scent</span> is not changed.", "12": "Therefore, behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> unto him <span class=\"wl wl-kjv\" data-code=\"H6808\">wanderers,</span> that shall cause him to <span class=\"wl wl-kjv\" data-code=\"H6808\">wander,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7324\">empty</span> his <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> and <span class=\"wl wl-kjv\" data-code=\"H5310\">break</span> their bottles.", "13": "And <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> of <span class=\"wl wl-kjv\" data-code=\"H3645\">Chemosh,</span> as the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> was <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> of <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> their confidence.", "14": "How <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> ye, We are <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> and <span class=\"wl wl-kjv\" data-code=\"H2428\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> for the war?", "15": "<span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled,</span> and gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of her <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4005\">chosen</span> young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> are gone <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H2874\">slaughter,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">King,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.", "16": "The <span class=\"wl wl-kjv\" data-code=\"H343\">calamity</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is <span class=\"wl wl-kjv\" data-code=\"H7138\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7451\">affliction</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">hasteth</span> fast.", "17": "All ye that are <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> him, <span class=\"wl wl-kjv\" data-code=\"H5110\">bemoan</span> him; and all ye that <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> How is the <span class=\"wl wl-kjv\" data-code=\"H5797\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H4294\">staff</span> <span class=\"wl wl-kjv\" data-code=\"H7665\">broken,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8597\">beautiful</span> rod!", "18": "Thou <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> that dost <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabit</span> <span class=\"wl wl-kjv\" data-code=\"H1769\">Dibon,</span> come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from thy <span class=\"wl wl-kjv\" data-code=\"H3519\">glory,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> in <span class=\"wl wl-kjv\" data-code=\"H6772\">thirst;</span> for the <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiler</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall <span class=\"wl wl-kjv\" data-code=\"H5927\">come</span> upon thee, and he shall <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> thy strong holds.", "19": "O <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H6177\">Aroer,</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H6822\">espy;</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> him that <span class=\"wl wl-kjv\" data-code=\"H5127\">fleeth,</span> and her that <span class=\"wl wl-kjv\" data-code=\"H4422\">escapeth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> What is done?", "20": "<span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is <span class=\"wl wl-kjv\" data-code=\"H3001\">confounded;</span> for it is broken <span class=\"wl wl-kjv\" data-code=\"H2865\">down:</span> <span class=\"wl wl-kjv\" data-code=\"H3213\">howl</span> and <span class=\"wl wl-kjv\" data-code=\"H2199\">cry;</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> ye it in <span class=\"wl wl-kjv\" data-code=\"H769\">Arnon,</span> that <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is spoiled,", "21": "And <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4334\">plain</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country;</span> upon <span class=\"wl wl-kjv\" data-code=\"H2473\">Holon,</span> and upon <span class=\"wl wl-kjv\" data-code=\"H3096\">Jahazah,</span> and upon Mephaath,", "22": "And upon <span class=\"wl wl-kjv\" data-code=\"H1769\">Dibon,</span> and upon <span class=\"wl wl-kjv\" data-code=\"H5015\">Nebo,</span> and upon Bethdiblathaim,", "23": "And upon <span class=\"wl wl-kjv\" data-code=\"H7156\">Kiriathaim,</span> and upon <span class=\"wl wl-kjv\" data-code=\"H1014\">Bethgamul,</span> and upon Bethmeon,", "24": "And upon <span class=\"wl wl-kjv\" data-code=\"H7152\">Kerioth,</span> and upon <span class=\"wl wl-kjv\" data-code=\"H1224\">Bozrah,</span> and upon all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> <span class=\"wl wl-kjv\" data-code=\"H7350\">far</span> or near.", "25": "The <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is cut <span class=\"wl wl-kjv\" data-code=\"H1438\">off,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> is <span class=\"wl wl-kjv\" data-code=\"H7665\">broken,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "26": "Make ye him <span class=\"wl wl-kjv\" data-code=\"H7937\">drunken:</span> for he <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified</span> himself against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> also shall <span class=\"wl wl-kjv\" data-code=\"H5606\">wallow</span> in his <span class=\"wl wl-kjv\" data-code=\"H6892\">vomit,</span> and he also shall be in derision.", "27": "For was not <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> a <span class=\"wl wl-kjv\" data-code=\"H7814\">derision</span> unto thee? was he <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> among <span class=\"wl wl-kjv\" data-code=\"H1590\">thieves?</span> for <span class=\"wl wl-kjv\" data-code=\"H1767\">since</span> thou <span class=\"wl wl-kjv\" data-code=\"H1697\">spakest</span> of him, thou skippedst", "28": "O ye that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> and be like the <span class=\"wl wl-kjv\" data-code=\"H3123\">dove</span> that maketh her <span class=\"wl wl-kjv\" data-code=\"H7077\">nest</span> in the <span class=\"wl wl-kjv\" data-code=\"H5676\">sides</span> of the <span class=\"wl wl-kjv\" data-code=\"H6354\">hole's</span> mouth.", "29": "We have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H1347\">pride</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> (he is <span class=\"wl wl-kjv\" data-code=\"H3966\">exceeding</span> <span class=\"wl wl-kjv\" data-code=\"H1343\">proud)</span> his <span class=\"wl wl-kjv\" data-code=\"H1363\">loftiness,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1346\">arrogancy,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1347\">pride,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7312\">haughtiness</span> of his heart.", "30": "I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> his <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> but it shall not be so; his <span class=\"wl wl-kjv\" data-code=\"H907\">lies</span> shall not so effect", "31": "Therefore will I <span class=\"wl wl-kjv\" data-code=\"H3213\">howl</span> for <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and I will cry <span class=\"wl wl-kjv\" data-code=\"H2199\">out</span> for all <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab;</span> mine heart shall <span class=\"wl wl-kjv\" data-code=\"H1897\">mourn</span> for the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of Kirheres.", "32": "O <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> of <span class=\"wl wl-kjv\" data-code=\"H7643\">Sibmah,</span> I will <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> for thee with the <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping</span> of <span class=\"wl wl-kjv\" data-code=\"H3270\">Jazer:</span> thy <span class=\"wl wl-kjv\" data-code=\"H5189\">plants</span> are gone <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> they <span class=\"wl wl-kjv\" data-code=\"H5060\">reach</span> even to the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> of <span class=\"wl wl-kjv\" data-code=\"H3270\">Jazer:</span> the <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiler</span> is <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> upon thy summer <span class=\"wl wl-kjv\" data-code=\"H7019\">fruits</span> and upon thy vintage.", "33": "And <span class=\"wl wl-kjv\" data-code=\"H8057\">joy</span> and <span class=\"wl wl-kjv\" data-code=\"H1524\">gladness</span> is <span class=\"wl wl-kjv\" data-code=\"H622\">taken</span> from the plentiful <span class=\"wl wl-kjv\" data-code=\"H3759\">field,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab;</span> and I have caused <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> to <span class=\"wl wl-kjv\" data-code=\"H7673\">fail</span> from the <span class=\"wl wl-kjv\" data-code=\"H3342\">winepresses:</span> none shall <span class=\"wl wl-kjv\" data-code=\"H1869\">tread</span> with <span class=\"wl wl-kjv\" data-code=\"H1959\">shouting;</span> their <span class=\"wl wl-kjv\" data-code=\"H1959\">shouting</span> shall be no shouting.", "34": "From the <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> even unto <span class=\"wl wl-kjv\" data-code=\"H500\">Elealeh,</span> and even unto <span class=\"wl wl-kjv\" data-code=\"H3096\">Jahaz,</span> have they <span class=\"wl wl-kjv\" data-code=\"H5414\">uttered</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> from <span class=\"wl wl-kjv\" data-code=\"H6820\">Zoar</span> even unto <span class=\"wl wl-kjv\" data-code=\"H2773\">Horonaim,</span> as an <span class=\"wl wl-kjv\" data-code=\"H5697\">heifer</span> of three years <span class=\"wl wl-kjv\" data-code=\"H7992\">old:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> also of <span class=\"wl wl-kjv\" data-code=\"H5249\">Nimrim</span> shall be desolate.", "35": "Moreover I will cause to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> in <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> him that <span class=\"wl wl-kjv\" data-code=\"H5927\">offereth</span> in the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> and him that burneth <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> to his gods.", "36": "Therefore mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> shall <span class=\"wl wl-kjv\" data-code=\"H1993\">sound</span> for <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> like <span class=\"wl wl-kjv\" data-code=\"H2485\">pipes,</span> and mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> shall <span class=\"wl wl-kjv\" data-code=\"H1993\">sound</span> like <span class=\"wl wl-kjv\" data-code=\"H2485\">pipes</span> for the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7025\">Kirheres:</span> because the <span class=\"wl wl-kjv\" data-code=\"H3502\">riches</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">gotten</span> are perished.", "37": "For every <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7144\">bald,</span> and every <span class=\"wl wl-kjv\" data-code=\"H2206\">beard</span> <span class=\"wl wl-kjv\" data-code=\"H1639\">clipped:</span> upon all the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1417\">cuttings,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> sackcloth.", "38": "There shall be <span class=\"wl wl-kjv\" data-code=\"H4553\">lamentation</span> generally upon all the <span class=\"wl wl-kjv\" data-code=\"H1406\">housetops</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H7339\">streets</span> thereof: for I have <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> like a <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> wherein is no <span class=\"wl wl-kjv\" data-code=\"H2656\">pleasure,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "39": "They shall <span class=\"wl wl-kjv\" data-code=\"H3213\">howl,</span> saying, How is it broken <span class=\"wl wl-kjv\" data-code=\"H2865\">down!</span> how hath <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> the <span class=\"wl wl-kjv\" data-code=\"H6203\">back</span> with <span class=\"wl wl-kjv\" data-code=\"H954\">shame!</span> so shall <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> be a <span class=\"wl wl-kjv\" data-code=\"H7814\">derision</span> and a <span class=\"wl wl-kjv\" data-code=\"H4288\">dismaying</span> to all them about", "40": "For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Behold, he shall <span class=\"wl wl-kjv\" data-code=\"H1675\">fly</span> as an <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> his <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> over Moab.", "41": "<span class=\"wl wl-kjv\" data-code=\"H7152\">Kerioth</span> is <span class=\"wl wl-kjv\" data-code=\"H3920\">taken,</span> and the strong <span class=\"wl wl-kjv\" data-code=\"H4679\">holds</span> are <span class=\"wl wl-kjv\" data-code=\"H8610\">surprised,</span> and the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> in <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> at that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall be as the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> in her pangs.", "42": "And <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> from being a <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> because he hath <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified</span> himself against the LORD.", "43": "<span class=\"wl wl-kjv\" data-code=\"H6343\">Fear,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6354\">pit,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6341\">snare,</span> shall be upon thee, O <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "44": "He that <span class=\"wl wl-kjv\" data-code=\"H5127\">fleeth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> into the <span class=\"wl wl-kjv\" data-code=\"H6354\">pit;</span> and he that getteth <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6354\">pit</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> in the <span class=\"wl wl-kjv\" data-code=\"H6341\">snare:</span> for I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon it, even upon <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of their <span class=\"wl wl-kjv\" data-code=\"H6486\">visitation,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "45": "They that <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> under the <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> because of the <span class=\"wl wl-kjv\" data-code=\"H3581\">force:</span> but a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> shall come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3852\">flame</span> from the <span class=\"wl wl-kjv\" data-code=\"H996\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> the <span class=\"wl wl-kjv\" data-code=\"H6285\">corner</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and the crown of the <span class=\"wl wl-kjv\" data-code=\"H6936\">head</span> of the <span class=\"wl wl-kjv\" data-code=\"H7588\">tumultuous</span> ones.", "46": "<span class=\"wl wl-kjv\" data-code=\"H188\">Woe</span> be unto thee, O <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab!</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H3645\">Chemosh</span> <span class=\"wl wl-kjv\" data-code=\"H6\">perisheth:</span> for thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> are <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H7628\">captives,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> captives.", "47": "Yet will I bring <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> in the <span class=\"wl wl-kjv\" data-code=\"H319\">latter</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> Thus <span class=\"wl wl-kjv\" data-code=\"H2008\">far</span> is the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> of Moab."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
