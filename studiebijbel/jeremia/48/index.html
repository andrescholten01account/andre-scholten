}},"vertalingen":{"SVnu":{"1":"Tegen Moab zegt de HEERE van de heerscharen[1], de God van Israël, zo: Wee over Nebo, want zij is verwoest; Kirjathaïm is beschaamd, zij is ingenomen; de stad van het hoge vertrek[2] is beschaamd en verschrikt.","2":"Moabs roem van Hesbon is er niet meer; zij hebben kwaad tegen haar bedacht en gezegd: Komt, laten we haar uitroeien, zodat zij geen volk meer is; ook u, o Madmen! zult neergehouwen worden, het zwaard zal achter u aan gaan.","3":"Er is een stem van geroep uit Horonaïm; verwoesting en een grote breuk!","4":"Moab is verbroken; haar kleine kinderen hebben een geschreeuw laten horen.","5":"Want bij de opgang naar Luhith zal geween bij geween opgaan, want bij de afgang van Horonaïm hebben de tegenstanders van Moab een jammergeschreeuw gehoord.","6":"Vlucht, redt uw ziel! en word als de heide in de woestijn;","7":"Want om uw vertrouwen op uw werken, en op uw schatten, zult u ook ingenomen worden; en Kamos zal weggaan in gevangenschap, zijn priesters en zijn vorsten samen.","8":"Want de verwoester zal komen over elke stad, zodat niet één stad zal ontkomen; en het dal zal vergaan, en het effen veld verdelgd worden; want de HEERE heeft het gezegd.","9":"Geeft Moab vleugels, want al vliegend zal zij weggaan; en haar steden zullen tot verwoesting worden, zodat niemand daarin woont.","10":"Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!","11":"Moab is van zijn jeugd af aan rustig geweest, en hij heeft op zijn droesem stilgelegen, en is van vat in vat niet overgegoten, en heeft niet in gevangenschap gewandeld; daarom is zijn smaak in hem gebleven, en zijn geur niet veranderd.","12":"Daarom, zie, de dagen komen, spreekt de HEERE, dat Ik hem vreemde gasten zal toesturen, die hem naar vreemde plaatsen zullen voeren, en zijn vaten leegmaken, en hun kruiken in stukken slaan.","13":"En Moab zal beschaamd worden vanwege Kamos, zoals het huis van Israël beschaamd is geworden vanwege Bethel, hun vertrouwen.","14":"Hoe kunt u zeggen: Wij zijn helden en dappere mannen voor de strijd?","15":"Moab is verwoest, en uit zijn steden opgetrokken, en de keur van zijn jongemannen is ter slachting afgegaan, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.","16":"Moabs ondergang is nabij om te komen, en zijn ellende komt zeer snel.","17":"Beklaagt hem, u allen die rondom hem zijt, en allen die zijn naam kennen; zegt: Hoe is de sterke staf, de sierlijke stok verbroken?","18":"Daal neer uit uw heerlijkheid, en woon in dorst, u inwoonster, u dochter van Dibon! Want de verwoester van Moab is tegen u opgetrokken, hij heeft uw vestingen verwoest.","19":"Sta aan de weg, en kijk uit, u inwoonster van Aroër! Vraag de vluchtende man en de vrouw die ontkomen is; zeg: Wat is er gebeurd?","20":"Moab is beschaamd, want hij is verslagen; huilt en schreeuwt! Verkondigt het bij Arnon, dat Moab verwoest is.","21":"En het oordeel is gekomen over het vlakke land; over Holon, en over Jahza, en over Mefaäth,","22":"En over Dibon, en over Nebo, en over Beth-diblathaïm,","23":"En over Kirjathaïm, en over Beth-gamul, en over Beth-meon,","24":"En over Kerioth, en over Bozra; ja, over alle steden van Moabs land, die ver weg en die dichtbij zijn.","25":"Moabs hoorn is afgesneden, en zijn arm verbroken, spreekt de HEERE.","26":"Maak hem dronken, omdat hij zich groot gemaakt heeft tegen de HEERE; zo zal Moab met de handen klappen in zijn uitspuwsel, en hij zelf zal ook tot bespotting zijn.","27":"Want is Israël u niet tot bespotting geweest? Was hij onder de dieven gevonden, dat u zich zo bewoog, van de tijd af dat uw woorden over hem gingen?","28":"Verlaat de steden, en woont in de rots, u inwoners van Moab! En word als een duif, die in de doorgangen van de ingang van een hol nestelt.","29":"Wij hebben Moabs hoogmoed gehoord (hij is zeer hoogmoedig), zijn trots, en zijn hoogmoed, en zijn overmoed, en de hoogheid van zijn hart.","30":"Ik ken zijn woede, spreekt de HEERE, maar het zal niet zo gaan; zijn loze taal zal het niet zo bewerken.","31":"Daarom zal Ik over Moab huilen, ja, om heel Moab zal Ik het uitschreeuwen; over de mensen van Kir-heres zal men zuchten.","32":"Meer dan om het geween van Jaëzer zal Ik u bewenen, u wijnstok van Sibma! Uw ranken zijn over de zee gegaan, zij hebben gereikt tot aan de zee van Jaëzer; maar de verwoester is gevallen op uw zomervruchten en op uw wijnoogst;","33":"Zodat de blijdschap en vreugde uit het vruchtbare veld, namelijk uit Moabs land, weggenomen is; want Ik heb de wijn doen ophouden uit de kuipen; men zal geen druiven treden met vreugdegeroep; het vreugdegeroep zal geen vreugdegeroep zijn.","34":"Vanwege Hesbons geroep tot Eleale toe, tot Jahaz toe, hebben zij hun stem verheven, van Zoar tot aan Horonaïm, die driejarige vaars; want ook de wateren van Nimrim zullen tot verwoesting worden.","35":"En Ik zal in Moab doen ophouden, spreekt de HEERE, hem die op de hoogte offert, en die aan zijn goden reukwerk brandt.","36":"Daarom zal Mijn hart over Moab klagen als de fluiten; ook zal Mijn hart over de mensen van Kir-heres klagen als de fluiten, omdat het overschot dat hij gemaakt had, verloren is.","37":"Want alle hoofden zijn kaal, en alle baarden afgeknipt; op alle handen zijn insnijdingen, en op de lenden is een rouwkleed.","38":"Op alle daken van Moab, en op al haar straten is overal rouwklacht; want Ik heb Moab verbroken als een vat waaraan men geen behagen heeft, spreekt de HEERE.","39":"Hoe is hij verslagen! Zij huilen; hoe heeft Moab de nek met schaamte gewend! Zo zal Moab voor allen die rondom hem zijn tot bespotting en tot ontzetting worden.","40":"Want zo zegt de HEERE: Zie, hij zal snel vliegen als een arend, en hij zal zijn vleugels over Moab uitspreiden.","41":"Elke stad is gewonnen, en elke vesting is ingenomen; en het hart van Moabs helden zal op die dag zijn als het hart van een vrouw die in barensnood is.","42":"Want Moab zal verdelgd worden, zodat hij geen volk meer is, omdat hij zich groot gemaakt heeft tegen de HEERE.","43":"De angst, en de kuil, en de strik, over u, inwoner van Moab! spreekt de HEERE.","44":"Wie voor de angst vlucht, zal in de kuil vallen, en wie uit de kuil opklimt, zal in de strik gevangen worden; want Ik zal over haar, over Moab, het jaar van hun bezoeking[3] brengen, spreekt de HEERE.","45":"Zij die voor de macht van de vijand vluchtten, bleven staan in de schaduw van Hesbon; maar een vuur is uitgegaan van Hesbon, en een vlam van tussen Sihon, en heeft de hoeken van Moab en de schedel van de kinderen van het rumoer verteerd.","46":"Wee u, Moab! Het volk van Kamos is verloren; want uw zonen zijn weggenomen in gevangenschap; ook zijn uw dochters in gevangenschap.","47":"Maar in het laatste van de dagen zal Ik Moabs gevangenschap wenden, spreekt de HEERE. Tot hiertoe is Moabs oordeel."},"SV":{"1":"Tegen Moab zegt de HEERE der heirscharen, de God Israëls, alzo: Wee over Nebo, want zij is verstoord; Kirjathaim is beschaamd, zij is ingenomen; *de* *stad* des hogen vertreks is beschaamd en verschrikt.","2":"Moabs roem van Hesbon is er niet meer; zij hebben kwaad tegen haar gedacht, *zeggende*: Komt, en laat ons haar uitroeien, dat zij geen volk *meer* zij; ook gij, o Madmen! zult nedergehouwen worden, het zwaard zal achter u heengaan.","3":"Er is een stem des gekrijts van Horonaim; verstoring en een grote breuk!","4":"Moab is verbroken; haar kleine *kinderen* hebben een gekrijt laten horen.","5":"Want *in* den opgang van Luhith zal geween bij geween opgaan, want in den afgang van Horonaim hebben *Moabs* wederpartijders een jammergeschrei gehoord.","6":"Vlucht, redt ulieder ziel! en wordt als de heide in de woestijn;","7":"Want om uw vertrouwen op uw werken, en op uw schatten, zult gij ook ingenomen worden; en Kamos zal henen uitgaan in gevangenis, zijn priesteren en zijn vorsten te zamen.","8":"Want de verstoorder zal komen over elke stad, dat niet een stad ontkomen zal; en het dal zal verderven, en het effen veld verdelgd worden; want de HEERE heeft het gezegd.","9":"Geeft Moab vederen, want al vliegende zal zij uitgaan; en haar steden zullen ter verwoesting worden, dat niemand in dezelve wone.","10":"Vervloekt zij, die des HEEREN werk bedriegelijk doet; ja, vervloekt zij, die zijn zwaard van het bloed onthoudt!","11":"Moab is van zijn jeugd aan gerust geweest, en hij heeft op zijn heffe stil gelegen, en is van vat in vat niet geledigd, en heeft niet gewandeld in gevangenis; daarom is zijn smaak in hem gebleven, en zijn reuk niet veranderd.","12":"Daarom, ziet, de dagen komen, spreekt de HEERE, dat Ik hem vreemde gasten zal toeschikken, die hem in vreemde plaatsen zullen voeren, en zijn vaten ledigen, en hunlieder flessen in stukken slaan.","13":"En Moab zal beschaamd worden vanwege Kamos, gelijk als het huis Israëls beschaamd is geworden vanwege Beth-el, hunlieder vertrouwen.","14":"Hoe zult gij zeggen: Wij zijn helden en dappere mannen ten strijde?","15":"Moab is verstoord, en *uit* zijn steden opgegaan, en de keur zijner jongelingen is ter slachting afgegaan, spreekt de Koning, Wiens Naam is HEERE der heirscharen.","16":"Moabs verderf is nabij om te komen, en zijn kwaad haast zeer.","17":"Beklaagt hem, gij allen, die rondom hem zijt, en allen, die zijn naam kent; zegt: Hoe is de sterke staf, de sierlijke stok verbroken?","18":"Daal neder uit *uw* heerlijkheid, en woon in dorst, gij inwoneres, gij dochter van Dibon! want Moabs verstoorder is tegen u opgetogen, hij heeft uw vestingen verdorven.","19":"Sta aan den weg, en zie toe, gij inwoneres van Aroer! Vraag den vluchtenden *man* en de ontkomene *vrouw*; zeg: Wat is er geschied?","20":"Moab is beschaamd, want hij is verslagen; huilt en krijt! verkondigt te Arnon, dat Moab verstoord is.","21":"En het oordeel is gekomen over het vlakke land; over Holon, en over Jahza, en over Mefaath,","22":"En over Dibon, en over Nebo, en over Beth-diblathaim,","23":"En over Kirjathaim, en over Beth-gamul, en over Beth-meon,","24":"En over Kerioth, en over Bozra; ja, over alle steden van Moabs land, die verre en die nabij zijn.","25":"Moabs hoorn is afgesneden, en zijn arm verbroken, spreekt de HEERE.","26":"Maak hem dronken, omdat hij zich groot gemaakt heeft tegen den HEERE; zo zal Moab *met* *de* *handen* klappen in zijn uitspuwsel, en hij zelf zal ook ter belaching zijn.","27":"Want is u niet Israël ter belaching geweest? Was hij onder de dieven gevonden, dat gij u *zo* bewoogt, van den tijd af, dat uw woorden van hem waren?","28":"Verlaat de steden, en woont in de steenrots, gij inwoners van Moab! en wordt gelijk een duif, die in de doorgangen van den mond eens hols nestelt.","29":"Wij hebben Moabs hovaardij gehoord (hij is zeer hovaardig), zijn trotsheid, en zijn hovaardij, en zijn hoogmoed, en zijns harten hoogheid.","30":"Ik ken zijn verbolgenheid, spreekt de HEERE, maar niet alzo; zijn grendelen doen het zo niet.","31":"Daarom zal Ik over Moab huilen, ja, om gans Moab zal Ik krijten; over de lieden van Kir-heres zal men zuchten.","32":"Boven het geween van Jaezer zal Ik u bewenen, gij wijnstok van Sibma! uw wijnranken zijn over zee gegaan, zij hebben gereikt tot aan Jaezers zee; *maar* de verstoorder is gevallen op uw zomervruchten en op uw wijnoogst;","33":"Zodat de blijdschap en verheuging uit het vruchtbare veld, namelijk uit Moabs land, weggenomen is; want Ik heb den wijn doen ophouden uit de kuipen; men zal geen *druiven* treden met vreugdegeschrei; het vreugdegeschrei zal geen vreugdegeschrei zijn.","34":"Vanwege Hesbons gekrijt tot Eleale toe, tot Jahaz toe, hebben zij hun stem verheven, van Zoar tot aan Horonaim, die driejarige vaarze; want ook de wateren van Nimrim zullen tot verwoestingen worden.","35":"En Ik zal in Moab doen ophouden, spreekt de HEERE, dien, die *op* de hoogte offert, en die zijn goden rookt.","36":"Daarom zal Mijn hart over Moab getier maken als de fluiten; ook zal Mijn hart over de lieden van Kir-heres getier maken als de fluiten, omdat het overschot, *dat* hij gemaakt had, verloren is.","37":"Want alle hoofden zijn kaal, en alle baarden afgekort; op alle handen zijn insnijdingen, en op de lenden is een zak.","38":"Op alle daken van Moab, en op al haar straten is overal misbaar; want Ik heb Moab verbroken als een vat, waar men geen lust aan heeft, spreekt de HEERE.","39":"Hoe is hij verslagen! zij huilen; hoe heeft Moab den nek *met* schaamte gewend! Alzo zal Moab allen, die rondom hem zijn, tot belaching en tot een ontzetting worden.","40":"Want zo zegt de HEERE: Ziet, hij zal snel vliegen als een arend, en hij zal zijn vleugelen over Moab uitbreiden.","41":"Elk een der steden is gewonnen, en elk een der vastigheden is ingenomen; en het hart van Moabs helden zal te dien dage wezen, als het hart ener vrouw, die in nood is.","42":"Want Moab zal verdelgd worden, dat hij geen volk zij, omdat hij zich groot gemaakt heeft tegen den HEERE.","43":"De vreze, en de kuil, en de strik, over u, gij inwoner van Moab! spreekt de HEERE.","44":"Die van de vreze ontvliedt , zal in den kuil vallen, en die uit den kuil opkomt, zal in den strik gevangen worden; want Ik zal over haar, over Moab, het jaar van hunlieder bezoeking brengen, spreekt de HEERE.","45":"Die voor *des* *vijands* macht vluchtten, bleven staan in de schaduw van Hesbon; maar een vuur is uitgegaan van Hesbon, en een vlam van tussen Sihon, en heeft de hoeken van Moab en den schedel der kinderen van het gedruis verteerd.","46":"Wee u, Moab! het volk van Kamos is verloren; want uw zonen zijn weggenomen in gevangenis; ook zijn uw dochters in gevangenis.","47":"Maar in het laatste der dagen, zal Ik Moabs gevangenis wenden, spreekt de HEERE. Tot hiertoe is Moabs oordeel."},"KJV":{"1":"Against Moab thus saith the LORD of hosts, the God of Israel; Woe unto Nebo! for it is spoiled: Kiriathaim is confounded *and* taken: Misgab is confounded and dismayed.","2":"*There shall be* no more praise of Moab: in Heshbon they have devised evil against it; come, and let us cut it off from *being* a nation. Also thou shalt be cut down, O Madmen; the sword shall pursue thee.","3":"A voice of crying *shall be* from Horonaim, spoiling and great destruction.","4":"Moab is destroyed; her little ones have caused a cry to be heard.","5":"For in the going up of Luhith continual weeping shall go up; for in the going down of Horonaim the enemies have heard a cry of destruction.","6":"Flee, save your lives, and be like the heath in the wilderness.","7":"For because thou hast trusted in thy works and in thy treasures, thou shalt also be taken: and Chemosh shall go forth into captivity *with* his priests and his princes together.","8":"And the spoiler shall come upon every city, and no city shall escape: the valley also shall perish, and the plain shall be destroyed, as the LORD hath spoken.","9":"Give wings unto Moab, that it may flee and get away: for the cities thereof shall be desolate, without any to dwell therein.","10":"Cursed *be* he that doeth the work of the LORD deceitfully, and cursed *be* he that keepeth back his sword from blood.","11":"Moab hath been at ease from his youth, and he hath settled on his lees, and hath not been emptied from vessel to vessel, neither hath he gone into captivity: therefore his taste remained in him, and his scent is not changed.","12":"Therefore, behold, the days come, saith the LORD, that I will send unto him wanderers, that shall cause him to wander, and shall empty his vessels, and break their bottles.","13":"And Moab shall be ashamed of Chemosh, as the house of Israel was ashamed of Bethel their confidence.","14":"How say ye, We *are* mighty and strong men for the war?","15":"Moab is spoiled, and gone up *out of* her cities, and his chosen young men are gone down to the slaughter, saith the King, whose name *is* the LORD of hosts.","16":"The calamity of Moab *is* near to come, and his affliction hasteth fast.","17":"All ye that are about him, bemoan him; and all ye that know his name, say, How is the strong staff broken, *and* the beautiful rod!","18":"Thou daughter that dost inhabit Dibon, come down from *thy* glory, and sit in thirst; for the spoiler of Moab shall come upon thee, *and* he shall destroy thy strong holds.","19":"O inhabitant of Aroer, stand by the way, and espy; ask him that fleeth, and her that escapeth, *and* say, What is done?","20":"Moab is confounded; for it is broken down: howl and cry; tell ye it in Arnon, that Moab is spoiled,","21":"And judgment is come upon the plain country; upon Holon, and upon Jahazah, and upon Mephaath,","22":"And upon Dibon, and upon Nebo, and upon Bethdiblathaim,","23":"And upon Kiriathaim, and upon Bethgamul, and upon Bethmeon,","24":"And upon Kerioth, and upon Bozrah, and upon all the cities of the land of Moab, far or near.","25":"The horn of Moab is cut off, and his arm is broken, saith the LORD.","26":"Make ye him drunken: for he magnified *himself* against the LORD: Moab also shall wallow in his vomit, and he also shall be in derision.","27":"For was not Israel a derision unto thee? was he found among thieves? for since thou spakest of him, thou skippedst","28":"O ye that dwell in Moab, leave the cities, and dwell in the rock, and be like the dove *that* maketh her nest in the sides of the hole's mouth.","29":"We have heard the pride of Moab, (he is exceeding proud) his loftiness, and his arrogancy, and his pride, and the haughtiness of his heart.","30":"I know his wrath, saith the LORD; but *it shall* not *be* so; his lies shall not so effect","31":"Therefore will I howl for Moab, and I will cry out for all Moab; *mine heart* shall mourn for the men of Kirheres.","32":"O vine of Sibmah, I will weep for thee with the weeping of Jazer: thy plants are gone over the sea, they reach *even* to the sea of Jazer: the spoiler is fallen upon thy summer fruits and upon thy vintage.","33":"And joy and gladness is taken from the plentiful field, and from the land of Moab; and I have caused wine to fail from the winepresses: none shall tread with shouting; *their* shouting *shall be* no shouting.","34":"From the cry of Heshbon *even* unto Elealeh, *and even* unto Jahaz, have they uttered their voice, from Zoar *even* unto Horonaim, *as* an heifer of three years old: for the waters also of Nimrim shall be desolate.","35":"Moreover I will cause to cease in Moab, saith the LORD, him that offereth in the high places, and him that burneth incense to his gods.","36":"Therefore mine heart shall sound for Moab like pipes, and mine heart shall sound like pipes for the men of Kirheres: because the riches *that* he hath gotten are perished.","37":"For every head *shall be* bald, and every beard clipped: upon all the hands *shall be* cuttings, and upon the loins sackcloth.","38":"*There shall be* lamentation generally upon all the housetops of Moab, and in the streets thereof: for I have broken Moab like a vessel wherein *is* no pleasure, saith the LORD.","39":"They shall howl, *saying*, How is it broken down! how hath Moab turned the back with shame! so shall Moab be a derision and a dismaying to all them about","40":"For thus saith the LORD; Behold, he shall fly as an eagle, and shall spread his wings over Moab.","41":"Kerioth is taken, and the strong holds are surprised, and the mighty men's hearts in Moab at that day shall be as the heart of a woman in her pangs.","42":"And Moab shall be destroyed from *being* a people, because he hath magnified *himself* against the LORD.","43":"Fear, and the pit, and the snare, *shall be* upon thee, O inhabitant of Moab, saith the LORD.","44":"He that fleeth from the fear shall fall into the pit; and he that getteth up out of the pit shall be taken in the snare: for I will bring upon it, *even* upon Moab, the year of their visitation, saith the LORD.","45":"They that fled stood under the shadow of Heshbon because of the force: but a fire shall come forth out of Heshbon, and a flame from the midst of Sihon, and shall devour the corner of Moab, and the crown of the head of the tumultuous ones.","46":"Woe be unto thee, O Moab! the people of Chemosh perisheth: for thy sons are taken captives, and thy daughters captives.","47":"Yet will I bring again the captivity of Moab in the latter days, saith the LORD. Thus far *is* the judgment of Moab."}},"tsk":{"1":[{"kopje":"Moab","refs":["Jer 9:26","Jer 25:21","Jer 27:3","Gen 19:37","Num 24:17","2 Kron 20:10","Jes 15:1","Jes 16:14","Jes 25:10","Jes 27:3","Ezech 25:8-11","Amos 2:1","Amos 2:2","Zef 2:8-11"]},{"kopje":"Nebo","refs":["Jer 48:22","Jer 48:23","Num 32:3","Num 32:37","Num 32:38","Num 33:47","Jes 15:2"]}],"2":[{"kopje":"niet meer","refs":["Jer 48:17","Jes 16:14"]},{"kopje":"Hesbon","refs":["Jer 48:34","Jer 48:35","Num 21:25-30","Num 32:37","Jes 15:5","Jes 16:8","Jes 16:9"]},{"kopje":"komt","refs":["Jer 48:42","Jer 31:36","Jer 33:24","Jer 46:28","Est 3:8-14","Ps 83:5-9"]},{"kopje":"zult","refs":["Jer 25:15","Jer 25:17"]},{"kopje":"neergehouwen","refs":["Jes 15:1","Jes 25:10"]}],"3":[{"kopje":"stem","refs":["Jer 4:20","Jer 4:21","Jer 47:2","Jes 15:2","Jes 15:8","Jes 16:7-11","Jes 22:4"]},{"kopje":"Horonaïm","refs":["Jer 48:5","Jer 48:34","Jes 15:5"]}],"4":[{"kopje":"Moab","refs":["Num 21:27-30"]},{"kopje":"haar","refs":["Est 8:11","Ps 137:9"]}],"5":[{"kopje":"Luhith","refs":["Jer 48:34","Jes 15:5"]}],"6":[{"kopje":"Vlucht","refs":["Jer 51:6","Gen 19:17","Ps 11:1","Spr 6:4","Spr 6:5","Matt 24:16-18","Luk 3:7","Luk 17:31-33","Hebr 6:18"]},{"kopje":"word als","refs":["Jer 17:6","Job 30:3-7"]}],"7":[{"kopje":"om","refs":["Jer 9:23","Jer 13:25","Ps 40:5","Ps 49:7","Ps 49:8","Ps 52:9","Ps 62:9-11","Jes 59:4-6","Ezech 28:2-5","Hos 10:13","1 Tim 6:17","Openb 18:7"]},{"kopje":"Kamos","refs":["Jer 48:13","Jer 48:46","Jer 43:12","Num 21:29","Richt 11:24","1 Kon 11:7","1 Kon 11:33","Jes 46:1","Jes 46:2"]},{"kopje":"zijn priesters","refs":["Jer 49:3"]}],"8":[{"kopje":"de verwoester","refs":["Jer 48:18","Jer 6:26","Jer 15:8","Jer 25:9","Jer 51:56"]},{"kopje":"zodat niet één","refs":["Jer 48:20-25","Ezech an> unto <span class=\"wl wl-kjv\" data-code=\"H5015\">Nebo!</span> for it is <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled:</span> <span class=\"wl wl-kjv\" data-code=\"H7156\">Kiriathaim</span> is <span class=\"wl wl-kjv\" data-code=\"H3001\">confounded</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">taken:</span> <span class=\"wl wl-kjv\" data-code=\"H4869\">Misgab</span> is <span class=\"wl wl-kjv\" data-code=\"H3001\">confounded</span> and dismayed.","2":"There shall be no more <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab:</span> in <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> they have <span class=\"wl wl-kjv\" data-code=\"H2803\">devised</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> against it; <span class=\"wl wl-kjv\" data-code=\"H3212\">come,</span> and let us cut it <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from being a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation.</span> Also thou shalt be cut <span class=\"wl wl-kjv\" data-code=\"H1826\">down,</span> O <span class=\"wl wl-kjv\" data-code=\"H4086\">Madmen;</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> shall <span class=\"wl wl-kjv\" data-code=\"H3212\">pursue</span> thee.","3":"A <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H6818\">crying</span> shall be from <span class=\"wl wl-kjv\" data-code=\"H2773\">Horonaim,</span> <span class=\"wl wl-kjv\" data-code=\"H7701\">spoiling</span> and <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> destruction.","4":"<span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is <span class=\"wl wl-kjv\" data-code=\"H7665\">destroyed;</span> her little <span class=\"wl wl-kjv\" data-code=\"H6810\">ones</span> have caused a <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> to be heard.","5":"For in the going <span class=\"wl wl-kjv\" data-code=\"H4608\">up</span> of <span class=\"wl wl-kjv\" data-code=\"H3872\">Luhith</span> <span class=\"wl wl-kjv\" data-code=\"H1065\">continual</span> <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping</span> shall go <span class=\"wl wl-kjv\" data-code=\"H5927\">up;</span> for in the going <span class=\"wl wl-kjv\" data-code=\"H4174\">down</span> of <span class=\"wl wl-kjv\" data-code=\"H2773\">Horonaim</span> the <span class=\"wl wl-kjv\" data-code=\"H6862\">enemies</span> have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> a <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> of destruction.","6":"<span class=\"wl wl-kjv\" data-code=\"H5127\">Flee,</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">save</span> your <span class=\"wl wl-kjv\" data-code=\"H5315\">lives,</span> and <span class=\"wl wl-kjv\" data-code=\"H1961\">be</span> like the <span class=\"wl wl-kjv\" data-code=\"H6176\">heath</span> in the wilderness.","7":"For because thou hast <span class=\"wl wl-kjv\" data-code=\"H982\">trusted</span> in thy <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> and in thy <span class=\"wl wl-kjv\" data-code=\"H214\">treasures,</span> thou shalt also be <span class=\"wl wl-kjv\" data-code=\"H3920\">taken:</span> and <span class=\"wl wl-kjv\" data-code=\"H3645\">Chemosh</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity</span> with his <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> together.","8":"And the <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiler</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon every <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and no <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall <span class=\"wl wl-kjv\" data-code=\"H4422\">escape:</span> the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> also shall <span class=\"wl wl-kjv\" data-code=\"H6\">perish,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4334\">plain</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath spoken.","9":"<span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> <span class=\"wl wl-kjv\" data-code=\"H6731\">wings</span> unto <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> that it may <span class=\"wl wl-kjv\" data-code=\"H5323\">flee</span> and get <span class=\"wl wl-kjv\" data-code=\"H3318\">away:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H8047\">desolate,</span> without any to <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein.","10":"<span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> be he that <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7423\">deceitfully,</span> and <span class=\"wl wl-kjv\" data-code=\"H779\">cursed</span> be he that keepeth <span class=\"wl wl-kjv\" data-code=\"H4513\">back</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> from blood.","11":"<span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> hath been at <span class=\"wl wl-kjv\" data-code=\"H7599\">ease</span> from his <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H8252\">settled</span> on his <span class=\"wl wl-kjv\" data-code=\"H8105\">lees,</span> and hath not been <span class=\"wl wl-kjv\" data-code=\"H7324\">emptied</span> from <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> to <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel,</span> neither hath he <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> into <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity:</span> therefore his <span class=\"wl wl-kjv\" data-code=\"H2940\">taste</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">remained</span> in him, and his <span class=\"wl wl-kjv\" data-code=\"H7381\">scent</span> is not changed.","12":"Therefore, behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> unto him <span class=\"wl wl-kjv\" data-code=\"H6808\">wanderers,</span> that shall cause him to <span class=\"wl wl-kjv\" data-code=\"H6808\">wander,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7324\">empty</span> his <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> and <span class=\"wl wl-kjv\" data-code=\"H5310\">break</span> their bottles.","13":"And <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> of <span class=\"wl wl-kjv\" data-code=\"H3645\">Chemosh,</span> as the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> was <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> of <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> their confidence.","14":"How <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> ye, We are <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> and <span class=\"wl wl-kjv\" data-code=\"H2428\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> for the war?","15":"<span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled,</span> and gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of her <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4005\">chosen</span> young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> are gone <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H2874\">slaughter,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">King,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","16":"The <span class=\"wl wl-kjv\" data-code=\"H343\">calamity</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is <span class=\"wl wl-kjv\" data-code=\"H7138\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7451\">affliction</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">hasteth</span> fast.","17":"All ye that are <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> him, <span class=\"wl wl-kjv\" data-code=\"H5110\">bemoan</span> him; and all ye that <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> How is the <span class=\"wl wl-kjv\" data-code=\"H5797\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H4294\">staff</span> <span class=\"wl wl-kjv\" data-code=\"H7665\">broken,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8597\">beautiful</span> rod!","18":"Thou <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> that dost <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabit</span> <span class=\"wl wl-kjv\" data-code=\"H1769\">Dibon,</span> come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from thy <span class=\"wl wl-kjv\" data-code=\"H3519\">glory,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> in <span class=\"wl wl-kjv\" data-code=\"H6772\">thirst;</span> for the <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiler</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall <span class=\"wl wl-kjv\" data-code=\"H5927\">come</span> upon thee, and he shall <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> thy strong holds.","19":"O <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H6177\">Aroer,</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H6822\">espy;</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> him that <span class=\"wl wl-kjv\" data-code=\"H5127\">fleeth,</span> and her that <span class=\"wl wl-kjv\" data-code=\"H4422\">escapeth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> What is done?","20":"<span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is <span class=\"wl wl-kjv\" data-code=\"H3001\">confounded;</span> for it is broken <span class=\"wl wl-kjv\" data-code=\"H2865\">down:</span> <span class=\"wl wl-kjv\" data-code=\"H3213\">howl</span> and <span class=\"wl wl-kjv\" data-code=\"H2199\">cry;</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> ye it in <span class=\"wl wl-kjv\" data-code=\"H769\">Arnon,</span> that <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is spoiled,","21":"And <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4334\">plain</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country;</span> upon <span class=\"wl wl-kjv\" data-code=\"H2473\">Holon,</span> and upon <span class=\"wl wl-kjv\" data-code=\"H3096\">Jahazah,</span> and upon Mephaath,","22":"And upon <span class=\"wl wl-kjv\" data-code=\"H1769\">Dibon,</span> and upon <span class=\"wl wl-kjv\" data-code=\"H5015\">Nebo,</span> and upon Bethdiblathaim,","23":"And upon <span class=\"wl wl-kjv\" data-code=\"H7156\">Kiriathaim,</span> and upon <span class=\"wl wl-kjv\" data-code=\"H1014\">Bethgamul,</span> and upon Bethmeon,","24":"And upon <span class=\"wl wl-kjv\" data-code=\"H7152\">Kerioth,</span> and upon <span class=\"wl wl-kjv\" data-code=\"H1224\">Bozrah,</span> and upon all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> <span class=\"wl wl-kjv\" data-code=\"H7350\">far</span> or near.","25":"The <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is cut <span class=\"wl wl-kjv\" data-code=\"H1438\">off,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> is <span class=\"wl wl-kjv\" data-code=\"H7665\">broken,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","26":"Make ye him <span class=\"wl wl-kjv\" data-code=\"H7937\">drunken:</span> for he <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified</span> himself against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> also shall <span class=\"wl wl-kjv\" data-code=\"H5606\">wallow</span> in his <span class=\"wl wl-kjv\" data-code=\"H6892\">vomit,</span> and he also shall be in derision.","27":"For was not <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> a <span class=\"wl wl-kjv\" data-code=\"H7814\">derision</span> unto thee? was he <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> among <span class=\"wl wl-kjv\" data-code=\"H1590\">thieves?</span> for <span class=\"wl wl-kjv\" data-code=\"H1767\">since</span> thou <span class=\"wl wl-kjv\" data-code=\"H1697\">spakest</span> of him, thou skippedst","28":"O ye that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> and be like the <span class=\"wl wl-kjv\" data-code=\"H3123\">dove</span> that maketh her <span class=\"wl wl-kjv\" data-code=\"H7077\">nest</span> in the <span class=\"wl wl-kjv\" data-code=\"H5676\">sides</span> of the <span class=\"wl wl-kjv\" data-code=\"H6354\">hole's</span> mouth.","29":"We have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H1347\">pride</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> (he is <span class=\"wl wl-kjv\" data-code=\"H3966\">exceeding</span> <span class=\"wl wl-kjv\" data-code=\"H1343\">proud)</span> his <span class=\"wl wl-kjv\" data-code=\"H1363\">loftiness,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1346\">arrogancy,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1347\">pride,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7312\">haughtiness</span> of his heart.","30":"I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> his <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> but it shall not be so; his <span class=\"wl wl-kjv\" data-code=\"H907\">lies</span> shall not so effect","31":"Therefore will I <span class=\"wl wl-kjv\" data-code=\"H3213\">howl</span> for <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and I will cry <span class=\"wl wl-kjv\" data-code=\"H2199\">out</span> for all <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab;</span> mine heart shall <span class=\"wl wl-kjv\" data-code=\"H1897\">mourn</span> for the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of Kirheres.","32":"O <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> of <span class=\"wl wl-kjv\" data-code=\"H7643\">Sibmah,</span> I will <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> for thee with the <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping</span> of <span class=\"wl wl-kjv\" data-code=\"H3270\">Jazer:</span> thy <span class=\"wl wl-kjv\" data-code=\"H5189\">plants</span> are gone <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> they <span class=\"wl wl-kjv\" data-code=\"H5060\">reach</span> even to the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> of <span class=\"wl wl-kjv\" data-code=\"H3270\">Jazer:</span> the <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiler</span> is <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> upon thy summer <span class=\"wl wl-kjv\" data-code=\"H7019\">fruits</span> and upon thy vintage.","33":"And <span class=\"wl wl-kjv\" data-code=\"H8057\">joy</span> and <span class=\"wl wl-kjv\" data-code=\"H1524\">gladness</span> is <span class=\"wl wl-kjv\" data-code=\"H622\">taken</span> from the plentiful <span class=\"wl wl-kjv\" data-code=\"H3759\">field,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab;</span> and I have caused <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> to <span class=\"wl wl-kjv\" data-code=\"H7673\">fail</span> from the <span class=\"wl wl-kjv\" data-code=\"H3342\">winepresses:</span> none shall <span class=\"wl wl-kjv\" data-code=\"H1869\">tread</span> with <span class=\"wl wl-kjv\" data-code=\"H1959\">shouting;</span> their <span class=\"wl wl-kjv\" data-code=\"H1959\">shouting</span> shall be no shouting.","34":"From the <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> even unto <span class=\"wl wl-kjv\" data-code=\"H500\">Elealeh,</span> and even unto <span class=\"wl wl-kjv\" data-code=\"H3096\">Jahaz,</span> have they <span class=\"wl wl-kjv\" data-code=\"H5414\">uttered</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> from <span class=\"wl wl-kjv\" data-code=\"H6820\">Zoar</span> even unto <span class=\"wl wl-kjv\" data-code=\"H2773\">Horonaim,</span> as an <span class=\"wl wl-kjv\" data-code=\"H5697\">heifer</span> of three years <span class=\"wl wl-kjv\" data-code=\"H7992\">old:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> also of <span class=\"wl wl-kjv\" data-code=\"H5249\">Nimrim</span> shall be desolate.","35":"Moreover I will cause to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> in <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> him that <span class=\"wl wl-kjv\" data-code=\"H5927\">offereth</span> in the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> and him that burneth <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> to his gods.","36":"Therefore mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> shall <span class=\"wl wl-kjv\" data-code=\"H1993\">sound</span> for <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> like <span class=\"wl wl-kjv\" data-code=\"H2485\">pipes,</span> and mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> shall <span class=\"wl wl-kjv\" data-code=\"H1993\">sound</span> like <span class=\"wl wl-kjv\" data-code=\"H2485\">pipes</span> for the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7025\">Kirheres:</span> because the <span class=\"wl wl-kjv\" data-code=\"H3502\">riches</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">gotten</span> are perished.","37":"For every <span class=\"wl \" data-code=\"H5404\">eagle,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> his <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> over Moab.","41":"<span class=\"wl wl-kjv\" data-code=\"H7152\">Kerioth</span> is <span class=\"wl wl-kjv\" data-code=\"H3920\">taken,</span> and the strong <span class=\"wl wl-kjv\" data-code=\"H4679\">holds</span> are <span class=\"wl wl-kjv\" data-code=\"H8610\">surprised,</span> and the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> in <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> at that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall be as the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> in her pangs.","42":"And <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> from being a <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> because he hath <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified</span> himself against the LORD.","43":"<span class=\"wl wl-kjv\" data-code=\"H6343\">Fear,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6354\">pit,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6341\">snare,</span> shall be upon thee, O <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","44":"He that <span class=\"wl wl-kjv\" data-code=\"H5127\">fleeth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> into the <span class=\"wl wl-kjv\" data-code=\"H6354\">pit;</span> and he that getteth <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6354\">pit</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> in the <span class=\"wl wl-kjv\" data-code=\"H6341\">snare:</span> for I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon it, even upon <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of their <span class=\"wl wl-kjv\" data-code=\"H6486\">visitation,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","45":"They that <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> under the <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> because of the <span class=\"wl wl-kjv\" data-code=\"H3581\">force:</span> but a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> shall come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3852\">flame</span> from the <span class=\"wl wl-kjv\" data-code=\"H996\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> the <span class=\"wl wl-kjv\" data-code=\"H6285\">corner</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and the crown of the <span class=\"wl wl-kjv\" data-code=\"H6936\">head</span> of the <span class=\"wl wl-kjv\" data-code=\"H7588\">tumultuous</span> ones.","46":"<span class=\"wl wl-kjv\" data-code=\"H188\">Woe</span> be unto thee, O <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab!</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H3645\">Chemosh</span> <span class=\"wl wl-kjv\" data-code=\"H6\">perisheth:</span> for thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> are <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H7628\">captives,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> captives.","47":"Yet will I bring <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> in the <span class=\"wl wl-kjv\" data-code=\"H319\">latter</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> Thus <span class=\"wl wl-kjv\" data-code=\"H2008\">far</span> is the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> of Moab."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Tegen Moab zegt de HEERE der heirscharen,","tekst":"Of, van Moab. Vergelijk Isa 15 , Isa 16 ; Eze 25:9 ; Amo 2:1 , boven Jer 25:21 , en Jer 27:3 ."},{"catchword":"Nebo,","tekst":"Deze stad en de volgende waren allen over de Jordaan in der Moabieten land gelegen. Zie Num 32:34 , enz."},{"catchword":"is verstoord;","tekst":"Dat is, zal zekerlijk verstoord worden, alzo in het volgende."},{"catchword":"stad","tekst":"des hogen vertreks] Dit duiden sommigen op Hesbon, gelegen op een groten hogen berg, waarvan de Moabieten zich meest beroemden, gelijk volgt, of een van de voornaamste sterkten. Anderen verstaan Bamoth, uit Isa 15:2 , en hier onder vs.35; anderen den rotssteen Sela, uit vs.28. Sommigen houden het Hebreeuwse woord Misgab in den tekst."}],"2":[{"catchword":"Hesbon is er niet meer;","tekst":"Een koninklijke stad, Deu 2:24 , enz., van de kinderen Rubens herbouwd, Num 32:37 . Anders: daar is geen roem Moabs [meer;] te Hesbons hebben zij, enz."},{"catchword":"zij hebben kwaad","tekst":"De vijanden hebben besloten Hesbon te vernielen."},{"catchword":"gedacht,","tekst":"Dit w // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
