}},"vertalingen":{"SVnu":{"1":"Zo zegt de HEERE: Zie, Ik zal een verdervende wind opwekken tegen Babel, en tegen hen die daar wonen, in het hart van hen die tegen Mij opstaan.","2":"En Ik zal Babel wanners toeschikken, die haar wannen, en haar land uitledigen zullen; want zij zullen ten dage van het kwaad van rondom tegen haar zijn.","3":"De schutter spant zijn boog tegen wie spant, en tegen wie zich verheft in zijn pantser; en verschoont haar jongelingen niet, verbant heel haar leger;","4":"Zodat de verslagenen liggen in het land van de Chaldeeën, en de doorstokenen op haar straten.","5":"Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.","6":"Vlucht uit het midden van Babel, en red ieder zijn ziel; word niet uitgeroeid in haar ongerechtigheid; want dit is de tijd van de wraak van de HEERE, Die haar de verdienste betaalt.","7":"Babel was een gouden beker in de hand van de HEERE, die de hele aarde dronken maakte; de volken hebben van haar wijn gedronken, daarom zijn de volken dol geworden.","8":"Plotseling is Babel gevallen en verbroken; huil over haar, neem balsem voor haar pijn, misschien zal zij genezen worden.","9":"Wij hebben Babel gemeesterd, maar zij is niet genezen; verlaat haar dan, en laat ons ieder naar zijn land trekken; want haar oordeel reikt tot aan de hemel, en is verheven tot aan de bovenste wolken.","10":"De HEERE heeft onze gerechtigheden hervoor gebracht; kom en laat ons in Sion het werk van de HEERE, onze God, vertellen!","11":"Zuivert de pijlen, rust de schilden volkomen toe; de HEERE heeft de geest van de koningen van Medië opgewekt; want Zijn voornemen is tegen Babel, om haar te verderven; want dit is de wraak van de HEERE, de wraak van Zijn tempel.","12":"Verhef de banier op de muren van Babel, versterk de wacht, stel wachters op, bereid de hinderlagen; want zoals de HEERE heeft voorgenomen, zo heeft Hij gedaan, wat Hij over de inwoners van Babel gesproken heeft.","13":"U, die aan veel water woont, die machtig bent van schatten! Uw einde is gekomen, de maat van uw gierigheid.","14":"De HEERE van de heerscharen heeft gezworen bij Zijn ziel: Ofschoon Ik u met mensen als met kevers vervuld heb, toch zullen zij elkaar een vreugdegeroep over u toeroepen!","15":"Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid door Zijn verstand;","16":"Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.","17":"Ieder mens is redeloos geworden, zodat hij geen kennis heeft; iedere goudsmid is beschaamd over het gesneden beeld; want zijn gegoten beeld is leugen, en er is geen geest in hen.","18":"IJdelheid zijn zij, een werk van verleidingen; ten tijde van hun vergelding zullen zij vergaan.","19":"Jakobs deel is niet gelijk aan hen; want Hij is de Formeerder van alles, en Israël is de stam van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.","20":"U bent Mij een voorhamer, *en* oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.","21":"En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter.","22":"En door u zal Ik in stukken slaan de man en de vrouw; en door u zal Ik in stukken slaan de oude en de jonge; en door u zal Ik in stukken slaan de jongeling en de jonkvrouw.","23":"En door u zal Ik in stukken slaan de herder en zijn kudde; en door u zal Ik in stukken slaan de akkerman en zijn juk *ossen*; en door u zal Ik in stukken slaan landvoogden en overheden.","24":"Maar Ik zal Babel en alle inwoners van Chaldea vergelden al hun slechtheid, die zij gedaan hebben aan Sion, voor uw ogen, spreekt de HEERE.","25":"Zie, Ik *heb het* tegen u, verdervende berg! spreekt de HEERE, u, die de hele aarde verderft, en Ik zal Mijn hand tegen u uitstrekken, en u van de rotsen afwentelen, en zal u stellen tot een berg van brand.","26":"En zij zullen uit u geen steen nemen voor een hoek, ook geen steen voor fundamenten; want u zult tot eeuwige woestenijen zijn, spreekt de HEERE.","27":"Verhef de banier in het land, blaas de bazuin onder de heidenvolken, heilig de heidenvolken tegen haar, roep tegen haar bijeen de koninkrijken van Ararat, Minni en Askenaz; stel een legeraanvoerder tegen haar aan, breng paarden naar boven, als ruige kevers!","28":"Heilig tegen haar de heidenvolken, de koningen van Medië, haar landvoogden en al haar overheden, ja, het hele land van haar heerschappij.","29":"Dan zal het land beven en pijn lijden; want elk voornemen van de HEERE staat vast tegen Babel, om Babels land te stellen tot een verwoesting, zodat er geen inwoner is.","30":"Babels helden hebben opgehouden te strijden, zij zijn gebleven in de vestingen, hun kracht is bezweken, zij zijn tot vrouwen geworden; zij hebben hun woningen aangestoken, hun grendels zijn verbroken.","31":"De ene loper zal de andere loper tegemoet lopen, en de ene kondschapper de andere kondschapper tegemoet, om de koning van Babel bekend te maken dat zijn stad van het ene einde tot het andere is ingenomen;","32":"En dat de veren ingenomen zijn, en de rietpoelen met vuur verbrand zijn; en dat de krijgslieden verbaasd zijn.","33":"Want zo zegt de HEERE van de heerscharen, de God van Israël: De dochter van Babel is als een dorsvloer, het is tijd dat men haar dorst; nog een korte tijd, dan zal haar de tijd van de oogst overkomen.","34":"Nebukadrezar, de koning van Babel, heeft mij opgegeten, hij heeft mij verpletterd, hij heeft mij gesteld als een leeg vat, hij heeft mij verslonden als een draak, hij heeft zijn buik gevuld met mijn lekkernijen, hij heeft mij verdreven.","35":"Het geweld, dat mij en mijn vlees is aangedaan, zij op Babel! moet de inwoonster van Sion zeggen; en mijn bloed zij op de inwoners van Chaldea! moet Jeruzalem zeggen.","36":"Daarom, zo zegt de HEERE: Zie, Ik zal uw twist twisten, en uw wraak wreken; en Ik zal haar zee droogmaken, en haar springader opdrogen.","37":"En Babel zal worden tot steenhopen, een woning van draken, een ontzetting en aanfluiting, zodat er geen inwoner is.","38":"Zij zullen samen brullen als jonge leeuwen, brullen als leeuwenwelpen.","39":"Als zij verhit zijn, zal Ik hun drank opzetten, en zal hen dronken maken, opdat zij opspringen; maar zij zullen een eeuwige slaap slapen, en niet ontwaken, spreekt de HEERE.","40":"Ik zal hen afvoeren als lammeren om te slachten, als rammen met bokken.","41":"Hoe is Sesach *zo* veroverd, en de roem van de hele aarde ingenomen! Hoe is Babel geworden tot een ontzetting onder de heidenvolken!","42":"Een zee is over Babel gerezen, door de veelheid van haar golven is zij bedekt.","43":"Haar steden zijn geworden tot verwoesting, een dor land en wildernis; een land waarin niemand woont, en waar geen mensenkind doorheen trekt.","44":"En Ik zal bezoeking doen over Bel te Babel, en Ik zal uit zijn muil uithalen wat hij verslonden heeft; en de heidenvolken zullen niet meer naar hem toestromen; *want* ook Babels muur is gevallen.","45":"Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.","46":"En opdat uw hart misschien niet week wordt, en u vreest voor het gerucht dat gehoord zal worden in het land; want er zal een gerucht komen in het *ene* jaar, en daarna een gerucht in het *andere* jaar; en er zal geweld zijn in het land, heerser tegen heerser.","47":"Daarom zie, de dagen komen dat Ik bezoeking zal doen over de gesneden beelden van Babel; en haar hele land zal beschaamd worden, en al haar verslagenen zullen in haar midden liggen.","48":"En de hemel en de aarde, alsook alles wat daarin is, zullen juichen over Babel; want vanuit het noorden zullen haar de verstoorders aankomen, spreekt de HEERE.","49":"Zoals Babel geweest is tot een val van de verslagenen van Israël, zo zullen te Babel de verslagenen van het hele land vallen.","50":"U die ontkomen bent aan het zwaard, ga weg, en blijf niet staan; gedenk de HEERE van verre, en laat Jeruzalem in uw hart opkomen.","51":"*U zou kunnen zeggen*: Wij zijn beschaamd geworden, want wij hebben smaad gehoord, schaamte heeft ons gezicht bedekt; omdat vreemden over de heiligdommen van het huis van de HEERE gekomen zijn;","52":"Daarom zie, de dagen komen, spreekt de HEERE, dat Ik bezoeking doen zal over haar gesneden beelden; en de dodelijk gewonde zal kermen in haar hele land.","53":"Al klom Babel ten hemel op, en al maakte zij de hoogte van haar sterkte vast, toch zullen haar verstoorders van Mij overkomen, spreekt de HEERE.","54":"Er is een stem van gekrijs uit Babel, en een grote breuk uit het land van de Chaldeeën.","55":"Want de HEERE verstoort Babel, en zal de luide stem uit haar doen vergaan; want hun golven zullen bruisen als veel water; het geruis van hun geluid zal zich verheffen.","56":"Want de verstoorder komt over haar, over Babel, en haar helden zullen gevangen worden; hun bogen zijn verbroken; want de HEERE, de God van de vergelding, zal *hun* zeker betalen.","57":"En Ik zal haar vorsten, en haar wijzen, haar landvoogden, en haar overheden, en haar helden dronken maken; en zij zullen een eeuwige slaap slapen, en niet ontwaken, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.","58":"Zo zegt de HEERE van de heerscharen: Die brede muur van Babel zal helemaal afgebroken worden, en haar hoge poorten zullen met vuur aangestoken worden; zodat de volken tevergeefs, en de naties voor het vuur zullen gearbeid hebben, totdat zij moe worden.","59":"Het woord dat de profeet Jeremia opdroeg aan Seraja, de zoon van Nerija, de zoon van Machseja, toen hij met Zedekia, de koning van Juda, naar Babel trok, in het vierde jaar van zijn regering; en Seraja was een vreedzame vorst.","60":"Jeremia nu schreef al het kwaad, dat over Babel komen zou, in een boek, *namelijk* al deze woorden, die tegen Babel geschreven zijn.","61":"En Jeremia zei tegen Seraja: Als u in Babel komt, zult u zien en al deze woorden lezen;","62":"En u zult zeggen: O HEERE, U hebt over deze plaats gesproken, dat U ze zult uitroeien, zodat er geen inwoner in is, van de mens tot het dier, maar dat zij zal worden tot eeuwige woestenijen.","63":"En het zal gebeuren, als u deze rol geheel gelezen hebt, dat u er een steen aan zult binden, en hem zult werpen in het midden van de Eufraat;","64":"En zult zeggen: Zo zal Babel zinken, en niet meer opkomen, vanwege het kwaad dat Ik over haar zal brengen, en zij zullen moe worden. Tot hiertoe zijn de woorden van Jeremia."},"SV":{"1":"Zo zegt de HEERE: Ziet, Ik zal een verdervenden wind opwekken tegen Babel, en tegen degenen, die daar wonen in het hart van degenen, die tegen Mij opstaan.","2":"En Ik zal Babel wanners toeschikken, die haar wannen, en haar land uitledigen zullen; want zij zullen ten dage des kwaads van rondom tegen haar zijn.","3":"De schutter spanne zijn boog tegen *dien*, die spant, en tegen *dien*, die zich verheft in zijn pantsier; en verschoont haar jongelingen niet, verbant al haar heir;","4":"Dat de verslagenen liggen in het land der Chaldeen, en de doorstokenen op haar straten.","5":"Want Israël of Juda zal niet in weduwschap gelaten worden van zijn God, van den HEERE der heirscharen (hoewel hunlieder land vol van schuld is), van den Heilige Israëls.","6":"Vliedt uit het midden van Babel, en redt, een iegelijk zijn ziel; wordt niet uitgeroeid in haar ongerechtigheid; want dit is de tijd der wraak des HEEREN, Die haar de verdienste betaalt.","7":"Babel was een gouden beker in de hand des HEEREN, die de ganse aarde dronken maakte; de volken hebben van haar wijn gedronken, daarom zijn de volken dol geworden.","8":"Schielijk is Babel gevallen en verbroken; huilt over haar, neemt balsem tot haar pijn, misschien zal zij genezen worden.","9":"Wij hebben Babel gemeesterd, maar zij is niet genezen; verlaat haar *dan*, en laat ons een iegelijk in zijn land trekken; want haar oordeel reikt tot aan den hemel, en is verheven tot aan de bovenste wolken.","10":"De HEERE heeft onze gerechtigheden hervoor gebracht; komt en laat ons te Sion het werk des HEEREN, onzes Gods, vertellen!","11":"Zuivert de pijlen, rust de schilden volkomenlijk toe; de HEERE heeft den geest der koningen van Medië opgewekt; want Zijn voornemen is tegen Babel, dat Hij haar verderve; want dit is de wraak des HEEREN, de wraak Zijns tempels.","12":"Verheft de banier op de muren van Babel, versterkt de wacht, stelt wachters, bereidt de lagen; want gelijk de HEERE heeft voorgenomen, alzo heeft Hij gedaan, wat Hij over de inwoners van Babel gesproken heeft.","13":"Gij, die aan vele wateren woont , die machtig zijt van schatten! uw einde is gekomen, de maat uwer gierigheid.","14":"De HEERE der heirscharen heeft gezworen bij Zijn ziel: Ofschoon Ik u met mensen als *met* kevers vervuld heb, nochtans zullen zij elkander een vreugdegeschrei over u toeroepen!","15":"Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en den hemel uitgebreid door Zijn verstand;","16":"Als Hij Zijn stem geeft, zo is er een gedruis van wateren in den hemel, en Hij doet de dampen opklimmen van het einde der aarde; Hij maakt de bliksemen met den regen, en doet den wind voortkomen uit Zijn schatkameren.","17":"Een ieder mens is onvernuftig geworden, zodat hij geen wetenschap heeft; een ieder goudsmid is beschaamd van het gesneden beeld; want zijn gegoten beeld is leugen, en er is geen geest in hen.","18":"Ijdelheid zijn zij, een werk van verleidingen; ten tijde hunner bezoeking zullen zij vergaan.","19":"Jakobs deel is niet gelijk die; want Hij is de Formeerder van alles, en *Israël* is de roede Zijner erfenis; HEERE der heirscharen is Zijn Naam.","20":"Gij zijt Mij een voorhamer, *en* krijgswapenen; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.","21":"En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan den wagen en zijn ruiter.","22":"En door u zal Ik in stukken slaan den man en de vrouw; en door u zal Ik in stukken slaan den oude en den jonge; en door u zal Ik in stukken slaan den jongeling en de jonkvrouw.","23":"En door u zal Ik in stukken slaan den herder en zijn kudde; en door u zal Ik in stukken slaan den akkerman en zijn juk *ossen*; en door u zal Ik in stukken slaan landvoogden en overheden.","24":"Maar Ik zal Babel en allen inwoneren van Chaldea vergelden al hun boosheid, die zij gedaan hebben aan Sion, voor ulieder ogen, spreekt de HEERE.","25":"Ziet, Ik *wil* aan u, gij verdervende berg! spreekt de HEERE, gij, die de ganse aarde verderft, en Ik zal Mijn hand tegen u uitstrekken, en u van de steenrotsen afwentelen, en zal u stellen tot een berg des brands.","26":"En zij zullen uit u geen steen nemen tot een hoek, ook *geen* steen tot fondamenten; want gij zult *tot* eeuwige woestheden zijn, spreekt de HEERE.","27":"Verheft de banier in het land, blaast de bazuin onder de heidenen, heiligt de heidenen tegen haar, roept tegen haar bijeen de koninkrijken van Ararat, Minni en Askenaz; bestelt een krijgsoverste tegen haar, brengt paarden opwaarts, als ruige kevers!","28":"Heiligt tegen haar de heidenen, de koningen van Medië, haar landvoogden en al haar overheden, ja, het ganse land harer heerschappij.","29":"Dan zal het land beven en pijn lijden; want elk een van des HEEREN gedachten staat vast tegen Babel, om Babels land te stellen tot een verwoesting, dat er geen inwoner zij.","30":"Babels helden hebben opgehouden te strijden, zij zijn gebleven in de vestingen, hun macht is bezweken, zij zijn tot wijven geworden; zij hebben hun woningen aangestoken, hun grendels zijn verbroken.","31":"De loper zal den loper tegemoet lopen, en de kondschapper den kondschapper tegemoet, om den koning van Babel bekend te maken, dat zijn stad van het einde is ingenomen;","32":"En *dat* de veren ingenomen, en de rietpoelen met vuur verbrand zijn; en *dat* de krijgslieden verbaasd zijn.","33":"Want zo zegt de HEERE der heirscharen, de God Israëls: De dochter van Babel is als een dorsvloer, het is tijd, dat men ze trede; nog een weinig, dan zal haar de tijd des oogstes overkomen.","34":"Nebukadrezar, de koning van Babel, heeft mij opgegeten, hij heeft mij verpletterd, hij heeft mij gesteld *als* een ledig vat, hij heeft mij verslonden als een draak, hij heeft zijn balg gevuld van mijn lekkernijen; hij heeft mij verdreven.","35":"Het geweld, dat mij en mijn vlees is aangedaan, zij op Babel! zegge de inwoneres van Sion; en mijn bloed zij op de inwoners van Chaldea! zegge Jeruzalem.","36":"Daarom, zo zegt de HEERE: Ziet, Ik zal uw twist twisten, en uw wraak wreken; en Ik zal haar zee droog maken, en haar springader opdrogen.","37":"En Babel zal worden tot *steen* hopen, een woning der draken, een ontzetting en aanfluiting, dat er geen inwoner zij.","38":"Zij zullen te zamen brullen als jonge leeuwen, briesen als leeuwenwelpen.","39":"Als zij verhit zijn, zal Ik hun drank opzetten, en zal hen dronken maken, opdat zij opspringen; maar zij zullen een eeuwigen slaap slapen, en niet opwaken, spreekt de HEERE.","40":"Ik zal hen afvoeren als lammeren om te slachten, als rammen met bokken.","41":"Hoe is Sesach *zo* veroverd, en de roem der ganse aarde ingenomen! Hoe is Babel geworden tot een ontzetting onder de heidenen!","42":"Een zee is over Babel gerezen, door de veelheid harer golven is zij bedekt.","43":"Haar steden zijn geworden tot verwoesting, een dor land en wildernis; een land, waarin niemand woont, en waar geen mensenkind doorgaat.","44":"En Ik zal bezoeking doen over Bel te Babel, en Ik zal uit zijn muil uithalen, wat hij verslonden heeft; en de heidenen zullen niet meer tot hem toevloeien, *want* ook Babels muur is gevallen.","45":"Gaat uit, Mijn volk, uit het midden van haar, en redt een iegelijk zijn ziel, vanwege de hittigheid van den toorn des HEEREN.","46":"En opdat ulieder hart misschien niet week worde, en gij vreest van het gerucht, dat gehoord zal worden in het land; want er zal een gerucht komen in het *ene* jaar, en daarna een gerucht in het *andere* jaar; en er zal geweld zijn in het land, heer over heer.","47":"Daarom ziet, de dagen komen, dat Ik bezoeking zal doen over de gesneden beelden van Babel; en haar ganse land zal beschaamd worden, en al haar verslagenen zullen in het midden van haar liggen.","48":"En de hemel en de aarde, mitsgaders al wat daarin is, zullen juichen over Babel; want van het noorden zullen haar de verstoorders aankomen, spreekt de HEERE.","49":"Gelijk Babel geweest is tot een val der verslagenen van Israël, alzo zullen te Babel de verslagenen des gansen lands vallen.","50":"Gij ontkomenen van het zwaard, gaat weg, en blijft niet staan; gedenkt des HEEREN van verre, en laat Jeruzalem in ulieder hart opkomen.","51":"*Gij* *moogt* *zeggen*: Wij zijn beschaamd geworden, want wij hebben versmaadheid gehoord, schaamroodheid heeft ons aangezicht bedekt; omdat uitlandsen over de heiligdommen van des HEEREN huis gekomen zijn;","52":"Daarom ziet, de dagen komen, spreekt de HEERE, dat Ik bezoeking doen zal over haar gesneden beelden; en de dodelijk verwonde zal kermen in haar ganse land.","53":"Al klom Babel ten hemel op, en al maakte zij vast de hoogte harer sterkte, zo zullen haar *toch* verstoorders van Mij overkomen, spreekt de HEERE.","54":"Er is een stem des gekrijts uit Babel, en een grote breuk uit het land der Chaldeen.","55":"Want de HEERE verstoort Babel, en zal de grootse stem uit haar doen vergaan; want hunlieder golven zullen bruisen als grote wateren; het geruis van hunlieder geluid zal zich verheffen.","56":"Want de verstoorder komt over haar, over Babel, en haar helden zullen gevangen worden; hunlieder bogen zijn verbroken; want de HEERE, de God der vergelding, zal *hun* zekerlijk betalen.","57":"En Ik zal haar vorsten, en haar wijzen, haar landvoogden, en haar overheden, en haar helden dronken maken; en zij zullen een eeuwigen slaap slapen, en niet opwaken, spreekt de Koning, Wiens Naam is HEERE der heirscharen.","58":"Zo zegt de HEERE der heirscharen: Die brede muur van Babel zal ten enemale ontbloot worden, en haar hoge poorten zullen met vuur aangestoken worden; zodat de volken tevergeefs, en de natiën ten vure zullen gearbeid hebben, dat zij mat worden.","59":"Het woord, dat de profeet Jeremia beval aan Seraja, den zoon van Nerija, den zoon van Machseja, als hij van Zedekia, den koning van Juda, naar Babel toog, in het vierde jaar zijner regering; en Seraja was een vreemdzaam vorst.","60":"Jeremia nu schreef al het kwaad, dat over Babel komen zou, in een boek, *te* *weten* al deze woorden, die tegen Babel geschreven zijn.","61":"En Jeremia zeide tot Seraja: Als gij te Babel komt, zo zult gij zien en lezen al deze woorden;","62":"En gij zult zeggen: O HEERE, Gij hebt over deze plaats gesproken, dat Gij ze zult uitroeien, zodat er geen inwoner in zij, van den mens tot op het beest, maar dat zij worden zal *tot* eeuwige woestheden.","63":"En het zal geschieden, als gij geëindigd zult hebben dit boek te lezen, *dan* zult gij een steen daaraan binden, en werpen het in het midden van den Frath;","64":"En zult zeggen: Alzo zal Babel zinken, en niet weder opkomen, vanwege het kwaad, dat Ik over haar zal brengen, en zij zullen mat worden. Tot hiertoe zijn de woorden van Jeremia."},"KJV":{"1":"Thus saith the LORD; Behold, I will raise up against Babylon, and against them that dwell in the midst of them that rise up against me, a destroying wind;","2":"And will send unto Babylon fanners, that shall fan her, and shall empty her land: for in the day of trouble they shall be against her round about.","3":"Against *him that* bendeth let the archer bend his bow, and against *him that* lifteth himself up in his brigandine: and spare ye not her young men; destroy ye utterly all her host.","4":"Thus the slain shall fall in the land of the Chaldeans, and *they that are* thrust through in her streets.","5":"For Israel *hath* not *been* forsaken, nor Judah of his God, of the LORD of hosts; though their land was filled with sin against the Holy One of Israel.","6":"Flee out of the midst of Babylon, and deliver every man his soul: be not cut off in her iniquity; for this *is* the time of the LORD'S vengeance; he will render unto her a recompence.","7":"Babylon *hath been* a golden cup in the LORD'S hand, that made all the earth drunken: the nations have drunken of her wine; therefore the nations are mad.","8":"Babylon is suddenly fallen and destroyed: howl for her; take balm for her pain, if so be she may be healed.","9":"We would have healed Babylon, but she is not healed: forsake her, and let us go every one into his own country: for her judgment reacheth unto heaven, and is lifted up *even* to the skies.","10":"The LORD hath brought forth our righteousness: come, and let us declare in Zion the work of the LORD our God.","11":"Make bright the arrows; gather the shields: the LORD hath raised up the spirit of the kings of the Medes: for his device *is* against Babylon, to destroy it; because it *is* the vengeance of the LORD, the vengeance of his temple.","12":"Set up the standard upon the walls of Babylon, make the watch strong, set up the watchmen, prepare the ambushes: for the LORD hath both devised and done that which he spake against the inhabitants of Babylon.","13":"O thou that dwellest upon many waters, abundant in treasures, thine end is come, *and* the measure of thy covetousness.","14":"The LORD of hosts hath sworn by himself, *saying*, Surely I will fill thee with men, as with caterpillers; and they shall lift up a shout","15":"He hath made the earth by his power, he hath established the world by his wisdom, and hath stretched out the heaven by his understanding.","16":"When he uttereth *his* voice, *there is* a multitude of waters in the heavens; and he causeth the vapours to ascend from the ends of the earth: he maketh lightnings with rain, and bringeth forth the wind out of his treasures.","17":"Every man is brutish by *his* knowledge; every founder is confounded by the graven image: for his molten image *is* falsehood, and *there is* no breath","18":"They *are* vanity, the work of errors: in the time of their visitation they shall perish.","19":"The portion of Jacob *is* not like them; for he *is* the former of all things: and *Israel is* the rod of his inheritance: the LORD of hosts *is* his name.","20":"Thou *art* my battle axe *and* weapons of war: for with thee will I break in pieces the nations, and with thee will I destroy kingdoms;","21":"And with thee will I break in pieces the horse and his rider; and with thee will I break in pieces the chariot and his rider;","22":"With thee also will I break in pieces man and woman; and with thee will I break in pieces old and young; and with thee will I break in pieces the young man and the maid;","23":"I will also break in pieces with thee the shepherd and his flock; and with thee will I break in pieces the husbandman and his yoke of oxen; and with thee will I break in pieces captains and rulers.","24":"And I will render unto Babylon and to all the inhabitants of Chaldea all their evil that they have done in Zion in your sight, saith the LORD.","25":"Behold, I *am* against thee, O destroying mountain, saith the LORD, which destroyest all the earth: and I will stretch out mine hand upon thee, and roll thee down from the rocks, and will make thee a burnt mountain.","26":"And they shall not take of thee a stone for a corner, nor a stone for foundations; but thou shalt be desolate for ever, saith the LORD.","27":"Set ye up a standard in the land, blow the trumpet among the nations, prepare the nations against her, call together against her the kingdoms of Ararat, Minni, and Ashchenaz; appoint a captain against her; cause the horses to come up as the rough caterpillers.","28":"Prepare against her the nations with the kings of the Medes, the captains thereof, and all the rulers thereof, and all the land of his dominion.","29":"And the land shall tremble and sorrow: for every purpose of the LORD shall be performed against Babylon, to make the land of Babylon a desolation without an inhabitant.","30":"The mighty men of Babylon have forborn to fight, they have remained in *their* holds: their might hath failed; they became as women: they have burned her dwellingplaces; her bars are broken.","31":"One post shall run to meet another, and one messenger to meet another, to shew the king of Babylon that his city is taken at *one* end,","32":"And that the passages are stopped, and the reeds they have burned with fire, and the men of war are affrighted.","33":"For thus saith the LORD of hosts, the God of Israel; The daughter of Babylon *is* like a threshingfloor, *it is* time to thresh her: yet a little while, and the time of her harvest shall come.","34":"Nebuchadrezzar the king of Babylon hath devoured me, he hath crushed me, he hath made me an empty vessel, he hath swallowed me up like a dragon, he hath filled his belly with my delicates, he hath cast me out.","35":"The violence done to me and to my flesh *be* upon Babylon, shall the inhabitant of Zion say; and my blood upon the inhabitants of Chaldea, shall Jerusalem say.","36":"Therefore thus saith the LORD; Behold, I will plead thy cause, and take vengeance for thee; and I will dry up her sea, and make her springs dry.","37":"And Babylon shall become heaps, a dwellingplace for dragons, an astonishment, and an hissing, without an inhabitant.","38":"They shall roar together like lions: they shall yell as lions' whelps.","39":"In their heat I will make their feasts, and I will make them drunken, that they may rejoice, and sleep a perpetual sleep, and not wake, saith the LORD.","40":"I will bring them down like lambs to the slaughter, like rams with he goats.","41":"How is Sheshach taken! and how is the praise of the whole earth surprised! how is Babylon become an astonishment among the nations!","42":"The sea is come up upon Babylon: she is covered with the multitude of the waves","43":"Her cities are a desolation, a dry land, and a wilderness, a land wherein no man dwelleth, neither doth *any* son of man pass thereby.","44":"And I will punish Bel in Babylon, and I will bring forth out of his mouth that which he hath swallowed up: and the nations shall not flow together any more unto him: yea, the wall of Babylon shall fall.","45":"My people, go ye out of the midst of her, and deliver ye every man his soul from the fierce anger of the LORD.","46":"And lest your heart faint, and ye fear for the rumour that shall be heard in the land; a rumour shall both come *one* year, and after that in *another* year *shall come* a rumour, and violence in the land, ruler against ruler.","47":"Therefore, behold, the days come, that I will do judgment upon the graven images of Babylon: and her whole land shall be confounded, and all her slain shall fall in the midst","48":"Then the heaven and the earth, and all that *is* therein, shall sing for Babylon: for the spoilers shall come unto her from the north, saith the LORD.","49":"As Babylon *hath caused* the slain of Israel to fall, so at Babylon shall fall the slain of all the earth.","50":"Ye that have escaped the sword, go away, stand not still: remember the LORD afar off, and let Jerusalem come into your mind.","51":"We are confounded, because we have heard reproach: shame hath covered our faces: for strangers are come into the sanctuaries of the LORD'S house.","52":"Wherefore, behold, the days come, saith the LORD, that I will do judgment upon her graven images: and through all her land the wounded shall groan.","53":"Though Babylon should mount up to heaven, and though she should fortify the height of her strength, *yet* from me shall spoilers come unto her, saith the LORD.","54":"A sound of a cry *cometh* from Babylon, and great destruction from the land of the Chaldeans:","55":"Because the LORD hath spoiled Babylon, and destroyed out of her the great voice; when her waves do roar like great waters, a noise of their voice is uttered:","56":"Because the spoiler is come upon her, *even* upon Babylon, and her mighty men are taken, every one of their bows is broken: for the LORD God of recompences shall surely requite.","57":"And I will make drunk her princes, and her wise *men*, her captains, and her rulers, and her mighty men: and they shall sleep a perpetual sleep, and not wake, saith the King, whose name *is* the LORD of hosts.","58":"Thus saith the LORD of hosts; The broad walls of Babylon shall be utterly broken, and her high gates shall be burned with fire; and the people shall labour in vain, and the folk in the fire, and they shall be weary.","59":"The word which Jeremiah the prophet commanded Seraiah the son of Neriah, the son of Maaseiah, when he went with Zedekiah the king of Judah into Babylon in the fourth year of his reign. And *this* Seraiah *was* a quiet prince.","60":"So Jeremiah wrote in a book all the evil that should come upon Babylon, *even* all these words that are written against Babylon.","61":"And Jeremiah said to Seraiah, When thou comest to Babylon, and shalt see, and shalt read all these words;","62":"Then shalt thou say, O LORD, thou hast spoken against this place, to cut it off, that none shall remain in it, neither man nor beast, but that it shall be desolate for ever.","63":"And it shall be, when thou hast made an end of reading this book, *that* thou shalt bind a stone to it, and cast it into the midst of Euphrates:","64":"And thou shalt say, Thus shall Babylon sink, and shall not rise from the evil that I will bring upon her: and they shall be weary. Thus far *are* the words of Jeremiah."}},"tsk":{"1":[{"kopje":"Ik zal","refs":["Jer 50:9","Jer 50:14-16","Jer 50:21","Jes 13:3-5","Amos 3:6"]},{"kopje":"opwekken","refs":["Jer 50:24","Jer 50:29","Jer 50:33","Zach 2:8","Hand 9:4"]},{"kopje":
