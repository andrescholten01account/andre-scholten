kjv\" data-code=\"H3068\">LORD</span> hath brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> our <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness:</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H5608\">declare</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our God.","11":"Make <span class=\"wl wl-kjv\" data-code=\"H1305\">bright</span> the <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows;</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">gather</span> the <span class=\"wl wl-kjv\" data-code=\"H7982\">shields:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath raised <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H4074\">Medes:</span> for his <span class=\"wl wl-kjv\" data-code=\"H4209\">device</span> is against <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> it; because it is the <span class=\"wl wl-kjv\" data-code=\"H5360\">vengeance</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H5360\">vengeance</span> of his temple.","12":"Set <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H5251\">standard</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> make the <span class=\"wl wl-kjv\" data-code=\"H4929\">watch</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">strong,</span> set <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H8104\">watchmen,</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> the <span class=\"wl wl-kjv\" data-code=\"H693\">ambushes:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath both <span class=\"wl wl-kjv\" data-code=\"H2161\">devised</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> that which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> against the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of Babylon.","13":"O thou that <span class=\"wl wl-kjv\" data-code=\"H7931\">dwellest</span> upon <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">abundant</span> in <span class=\"wl wl-kjv\" data-code=\"H214\">treasures,</span> thine <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and the <span class=\"wl wl-kjv\" data-code=\"H520\">measure</span> of thy covetousness.","14":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> hath <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> by <span class=\"wl wl-kjv\" data-code=\"H5315\">himself,</span> saying, Surely I will <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> thee with <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> as with <span class=\"wl wl-kjv\" data-code=\"H3218\">caterpillers;</span> and they shall lift <span class=\"wl wl-kjv\" data-code=\"H6030\">up</span> a shout","15":"He hath <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> by his <span class=\"wl wl-kjv\" data-code=\"H3581\">power,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> by his <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and hath stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> by his understanding.","16":"When he <span class=\"wl wl-kjv\" data-code=\"H5414\">uttereth</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> there is a <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> in the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens;</span> and he causeth the <span class=\"wl wl-kjv\" data-code=\"H5387\">vapours</span> to <span class=\"wl wl-kjv\" data-code=\"H5927\">ascend</span> from the <span class=\"wl wl-kjv\" data-code=\"H7097\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> he <span class=\"wl wl-kjv\" data-code=\"H6213\">maketh</span> <span class=\"wl wl-kjv\" data-code=\"H1300\">lightnings</span> with <span class=\"wl wl-kjv\" data-code=\"H4306\">rain,</span> and bringeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> out of his treasures.","17":"Every <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> is <span class=\"wl wl-kjv\" data-code=\"H1197\">brutish</span> by his <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge;</span> every <span class=\"wl wl-kjv\" data-code=\"H6884\">founder</span> is <span class=\"wl wl-kjv\" data-code=\"H3001\">confounded</span> by the graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image:</span> for his molten <span class=\"wl wl-kjv\" data-code=\"H5262\">image</span> is <span class=\"wl wl-kjv\" data-code=\"H8267\">falsehood,</span> and there is no breath","18":"They are <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity,</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H8595\">errors:</span> in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of their <span class=\"wl wl-kjv\" data-code=\"H6486\">visitation</span> they shall perish.","19":"The <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> is not like them; for he is the <span class=\"wl wl-kjv\" data-code=\"H3335\">former</span> of all things: and Israel is the <span class=\"wl wl-kjv\" data-code=\"H7626\">rod</span> of his <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> is his name.","20":"Thou art my battle <span class=\"wl wl-kjv\" data-code=\"H4661\">axe</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war:</span> for with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and with thee will I <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> kingdoms;","21":"And with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> and his <span class=\"wl wl-kjv\" data-code=\"H7392\">rider;</span> and with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> and his rider;","22":"With thee also will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">woman;</span> and with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H5288\">young;</span> and with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> the young <span class=\"wl wl-kjv\" data-code=\"H970\">man</span> and the maid;","23":"I will also break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> with thee the <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd</span> and his <span class=\"wl wl-kjv\" data-code=\"H5739\">flock;</span> and with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H406\">husbandman</span> and his yoke of <span class=\"wl wl-kjv\" data-code=\"H6776\">oxen;</span> and with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">captains</span> and rulers.","24":"And I will <span class=\"wl wl-kjv\" data-code=\"H7999\">render</span> unto <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldea</span> all their <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that they have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> in your <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","25":"Behold, I am against thee, O <span class=\"wl wl-kjv\" data-code=\"H4889\">destroying</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyest</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> and I will stretch <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon thee, and roll thee <span class=\"wl wl-kjv\" data-code=\"H1556\">down</span> from the <span class=\"wl wl-kjv\" data-code=\"H5553\">rocks,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee a <span class=\"wl wl-kjv\" data-code=\"H8316\">burnt</span> mountain.","26":"And they shall not <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of thee a <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> for a <span class=\"wl wl-kjv\" data-code=\"H6438\">corner,</span> nor a <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> for <span class=\"wl wl-kjv\" data-code=\"H4146\">foundations;</span> but thou shalt be <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","27":"Set ye <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H5251\">standard</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H8628\">blow</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">prepare</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> against her, call <span class=\"wl wl-kjv\" data-code=\"H8085\">together</span> against her the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of <span class=\"wl wl-kjv\" data-code=\"H780\">Ararat,</span> <span class=\"wl wl-kjv\" data-code=\"H4508\">Minni,</span> and <span class=\"wl wl-kjv\" data-code=\"H813\">Ashchenaz;</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">appoint</span> a <span class=\"wl wl-kjv\" data-code=\"H2951\">captain</span> against her; cause the <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> to come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> as the <span class=\"wl wl-kjv\" data-code=\"H5569\">rough</span> caterpillers.","28":"<span class=\"wl wl-kjv\" data-code=\"H6942\">Prepare</span> against her the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H4074\">Medes,</span> the <span class=\"wl wl-kjv\" data-code=\"H6346\">captains</span> thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers</span> thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of his dominion.","29":"And the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall <span class=\"wl wl-kjv\" data-code=\"H7493\">tremble</span> and <span class=\"wl wl-kjv\" data-code=\"H2342\">sorrow:</span> for every <span class=\"wl wl-kjv\" data-code=\"H4284\">purpose</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6965\">performed</span> against <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> a <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation</span> without an inhabitant.","30":"The mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> have <span class=\"wl wl-kjv\" data-code=\"H2308\">forborn</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight,</span> they have <span class=\"wl wl-kjv\" data-code=\"H3427\">remained</span> in their <span class=\"wl wl-kjv\" data-code=\"H4679\">holds:</span> their <span class=\"wl wl-kjv\" data-code=\"H1369\">might</span> hath <span class=\"wl wl-kjv\" data-code=\"H5405\">failed;</span> they became as <span class=\"wl wl-kjv\" data-code=\"H802\">women:</span> they have <span class=\"wl wl-kjv\" data-code=\"H3341\">burned</span> her <span class=\"wl wl-kjv\" data-code=\"H4908\">dwellingplaces;</span> her <span class=\"wl wl-kjv\" data-code=\"H1280\">bars</span> are broken.","31":"One <span class=\"wl wl-kjv\" data-code=\"H7323\">post</span> shall <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">another,</span> and one <span class=\"wl wl-kjv\" data-code=\"H5046\">messenger</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">another,</span> to <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> that his <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> is <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> at one end,","32":"And that the <span class=\"wl wl-kjv\" data-code=\"H4569\">passages</span> are <span class=\"wl wl-kjv\" data-code=\"H8610\">stopped,</span> and the <span class=\"wl wl-kjv\" data-code=\"H98\">reeds</span> they have <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> are affrighted.","33":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> The <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> is like a <span class=\"wl wl-kjv\" data-code=\"H1637\">threshingfloor,</span> it is <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> to <span class=\"wl wl-kjv\" data-code=\"H1869\">thresh</span> her: yet a little <span class=\"wl wl-kjv\" data-code=\"H4592\">while,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of her <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> shall come.","34":"<span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> hath <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> me, he hath <span class=\"wl wl-kjv\" data-code=\"H2000\">crushed</span> me, he hath <span class=\"wl wl-kjv\" data-code=\"H3322\">made</span> me an <span class=\"wl wl-kjv\" data-code=\"H7385\">empty</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel,</span> he hath swallowed me <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> like a <span class=\"wl wl-kjv\" data-code=\"H8577\">dragon,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> his <span class=\"wl wl-kjv\" data-code=\"H3770\">belly</span> with my <span class=\"wl wl-kjv\" data-code=\"H5730\">delicates,</span> he hath cast me out.","35":"The <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> done to me and to my <span class=\"wl wl-kjv\" data-code=\"H7607\">flesh</span> be upon <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say;</span> and my <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldea,</span> shall <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> say.","36":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H7378\">plead</span> thy <span class=\"wl wl-kjv\" data-code=\"H7379\">cause,</span> and take <span class=\"wl wl-kjv\" data-code=\"H5358\">vengeance</span> for <span class=\"wl wl-kjv\" data-code=\"H5360\">thee;</span> and I will dry <span class=\"wl wl-kjv\" data-code=\"H2717\">up</span> her <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and make her <span class=\"wl wl-kjv\" data-code=\"H4726\">springs</span> dry.","37":"And <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall become <span class=\"wl wl-kjv\" data-code=\"H1530\">heaps,</span> a <span class=\"wl wl-kjv\" data-code=\"H4583\">dwellingplace</span> for <span class=\"wl wl-kjv\" data-code=\"H8577\">dragons,</span> an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment,</span> and an <span class=\"wl wl-kjv\" data-code=\"H8322\">hissing,</span> without an inhabitant.","38":"They shall <span class=\"wl wl-kjv\" data-code=\"H7580\">roar</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> like <span class=\"wl wl-kjv\" data-code=\"H3715\">lions:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5286\">yell</span> as <span class=\"wl wl-kjv\" data-code=\"H738\">lions'</span> whelps.","39":"In their <span class=\"wl wl-kjv\" data-code=\"H2527\">heat</span> I will <span class=\"wl wl-kjv\" data-code=\"H7896\">make</span> their <span class=\"wl wl-kjv\" data-code=\"H4960\">feasts,</span> and I will make them <span class=\"wl wl-kjv\" data-code=\"H7937\">drunken,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H5937\">rejoice,</span> and <span class=\"wl wl-kjv\" data-code=\"H3462\">sleep</span> a <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep,</span> and not <span class=\"wl wl-kjv\" data-code=\"H6974\">wake,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","40":"I will bring them <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> like <span class=\"wl wl-kjv\" data-code=\"H3733\">lambs</span> to the <span class=\"wl wl-kjv\" data-code=\"H2873\">slaughter,</span> like <span class=\"wl wl-kjv\" data-code=\"H352\">rams</span> with he goats.","41":"How is <span class=\"wl wl-kjv\" data-code=\"H8347\">Sheshach</span> <span class=\"wl wl-kjv\" data-code=\"H3920\">taken!</span> and how is the <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> of the whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H8610\">surprised!</span> how is <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> become an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment</span> among the nations!","42":"The <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> is come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> upon <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon:</span> she is <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> with the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of the waves","43":"Her <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> are a <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation,</span> a <span class=\"wl wl-kjv\" data-code=\"H6723\">dry</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and a <span class=\"wl wl-kjv\" data-code=\"H6160\">wilderness,</span> a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> wherein no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth,</span> neither doth any <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> thereby.","44":"And I will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> <span class=\"wl wl-kjv\" data-code=\"H1078\">Bel</span> in <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and I will bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> that which he hath swallowed <span class=\"wl wl-kjv\" data-code=\"H1105\">up:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall not flow <span class=\"wl wl-kjv\" data-code=\"H5102\">together</span> any more unto him: yea, the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall fall.","45":"My <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> go ye <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of her, and <span class=\"wl wl-kjv\" data-code=\"H4422\">deliver</span> ye every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> from the <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the LORD.","46":"And lest your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H7401\">faint,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> for the <span class=\"wl wl-kjv\" data-code=\"H8052\">rumour</span> that shall be <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> a <span class=\"wl wl-kjv\" data-code=\"H8052\">rumour</span> shall both <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> one <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that in another <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> shall come a <span class=\"wl wl-kjv\" data-code=\"H8052\">rumour,</span> and <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H4910\">ruler</span> against ruler.","47":"Therefore, behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> that I will do <span class=\"wl wl-kjv\" data-code=\"H6485\">judgment</span> upon the graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon:</span> and her whole <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall be <span class=\"wl wl-kjv\" data-code=\"H954\">confounded,</span> and all her <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in the midst","48":"Then the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and all that is therein, shall <span class=\"wl wl-kjv\" data-code=\"H7442\">sing</span> for <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon:</span> for the <span class=\"wl wl-kjv\" data-code=\"H7703\">spoilers</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto her from the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","49":"<span class=\"wl wl-kjv\" data-code=\"H1571\">As</span> <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> hath caused the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> so at <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> of all the earth.","50":"Ye that have <span class=\"wl wl-kjv\" data-code=\"H6405\">escaped</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> go <span class=\"wl wl-kjv\" data-code=\"H1980\">away,</span> stand not <span class=\"wl wl-kjv\" data-code=\"H5975\">still:</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off,</span> and let <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">come</span> into your mind.","51":"We are <span class=\"wl wl-kjv\" data-code=\"H954\">confounded,</span> because we have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach:</span> <span class=\"wl wl-kjv\" data-code=\"H3639\">shame</span> hath <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> our <span class=\"wl wl-kjv\" data-code=\"H6440\">faces:</span> for <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> are <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuaries</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> house.","52":"Wherefore, behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I will do <span class=\"wl wl-kjv\" data-code=\"H6485\">judgment</span> upon her graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images:</span> and through all her <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> the <span class=\"wl wl-kjv\" data-code=\"H2491\">wounded</span> shall groan.","53":"Though <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> should mount <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and though she should <span class=\"wl wl-kjv\" data-code=\"H1219\">fortify</span> the <span class=\"wl wl-kjv\" data-code=\"H4791\">height</span> of her <span class=\"wl wl-kjv\" data-code=\"H5797\">strength,</span> <span class=\"wl wl-kjv\" data-code=\"H227\">yet</span> from me shall <span class=\"wl wl-kjv\" data-code=\"H7703\">spoilers</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","54":"A <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of a <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> cometh from <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7667\">destruction</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the Chaldeans:","55":"Because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled</span> <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed</span> out of her the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice;</span> when her <span class=\"wl wl-kjv\" data-code=\"H1530\">waves</span> do <span class=\"wl wl-kjv\" data-code=\"H1993\">roar</span> like <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> a <span class=\"wl wl-kjv\" data-code=\"H7588\">noise</span> of their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> is uttered:","56":"Because the <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiler</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon her, even upon <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and her mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> are <span class=\"wl wl-kjv\" data-code=\"H3920\">taken,</span> every one of their <span class=\"wl wl-kjv\" data-code=\"H7198\">bows</span> is <span class=\"wl wl-kjv\" data-code=\"H2865\">broken:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H1578\">recompences</span> shall <span class=\"wl wl-kjv\" data-code=\"H7999\">surely</span> requite.","57":"And I will make <span class=\"wl wl-kjv\" data-code=\"H7937\">drunk</span> her <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and her <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> men, her <span class=\"wl wl-kjv\" data-code=\"H6346\">captains,</span> and her <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> and her mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3462\">sleep</span> a <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep,</span> and not <span class=\"wl wl-kjv\" data-code=\"H6974\">wake,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">King,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","58":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> The <span class=\"wl wl-kjv\" data-code=\"H7342\">broad</span> <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6209\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H6209\">broken,</span> and her <span class=\"wl wl-kjv\" data-code=\"H1364\">high</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3341\">burned</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H3021\">labour</span> in <span class=\"wl wl-kjv\" data-code=\"H7385\">vain,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3816\">folk</span> <span class=\"wl wl-kjv\" data-code=\"H1767\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and they shall be weary.","59":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> which <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H8304\">Seraiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5374\">Neriah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4271\">Maaseiah,</span> when he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> into <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> in the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of his <span class=\"wl wl-kjv\" data-code=\"H4427\">reign.</span> And this <span class=\"wl wl-kjv\" data-code=\"H8304\">Seraiah</span> was a <span class=\"wl wl-kjv\" data-code=\"H4496\">quiet</span> prince.","60":"So <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> all the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that should <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> even all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> against Babylon.","61":"And <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H8304\">Seraiah,</span> When thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> all these words;","62":"Then shalt thou <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> against this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> to cut it <span class=\"wl wl-kjv\" data-code=\"H3772\">off,</span> that none shall <span class=\"wl wl-kjv\" data-code=\"H3427\">remain</span> in it, neither <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> nor <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> but that it shall be <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate</span> for ever.","63":"And it shall be, when thou hast made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7121\">reading</span> this <span class=\"wl wl-kjv\" data-code=\"H5612\">book,</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H7194\">bind</span> a <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> to it, and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> it into the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of Euphrates:","64":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thus shall <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> <span class=\"wl wl-kjv\" data-code=\"H8257\">sink,</span> and shall not <span class=\"wl wl-kjv\" data-code=\"H6965\">rise</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon her: and they shall be <span class=\"wl wl-kjv\" data-code=\"H3286\">weary.</span> Thus far are the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of Jeremiah."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
