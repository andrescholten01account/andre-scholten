an class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> that made all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H7937\">drunken:</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> have <span class=\"wl wl-kjv\" data-code=\"H8354\">drunken</span> of her <span class=\"wl wl-kjv\" data-code=\"H3196\">wine;</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> are mad.","8":"<span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> is <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">destroyed:</span> <span class=\"wl wl-kjv\" data-code=\"H3213\">howl</span> for her; <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H6875\">balm</span> for her <span class=\"wl wl-kjv\" data-code=\"H4341\">pain,</span> if so be she may be healed.","9":"We would have <span class=\"wl wl-kjv\" data-code=\"H7495\">healed</span> <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> but she is not <span class=\"wl wl-kjv\" data-code=\"H7495\">healed:</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> her, and let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> into his own <span class=\"wl wl-kjv\" data-code=\"H776\">country:</span> for her <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">reacheth</span> unto <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and is lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> even to the skies.","10":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> our <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness:</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H5608\">declare</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our God.","11":"Make <span class=\"wl wl-kjv\" data-code=\"H1305\">bright</span> the <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows;</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">gather</span> the <span class=\"wl wl-kjv\" data-code=\"H7982\">shields:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath raised <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H4074\">Medes:</span> for his <span class=\"wl wl-kjv\" data-code=\"H4209\">device</span> is against <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> it; because it is the <span class=\"wl wl-kjv\" data-code=\"H5360\">vengeance</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H5360\">vengeance</span> of his temple.","12":"Set <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H5251\">standard</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> make the <span class=\"wl wl-kjv\" data-code=\"H4929\">watch</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">strong,</span> set <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H8104\">watchmen,</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> the <span class=\"wl wl-kjv\" data-code=\"H693\">ambushes:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath both <span class=\"wl wl-kjv\" data-code=\"H2161\">devised</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> that which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> against the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of Babylon.","13":"O thou that <span class=\"wl wl-kjv\" data-code=\"H7931\">dwellest</span> upon <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">abundant</span> in <span class=\"wl wl-kjv\" data-code=\"H214\">treasures,</span> thine <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and the <span class=\"wl wl-kjv\" data-code=\"H520\">measure</span> of thy covetousness.","14":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> hath <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> by <span class=\"wl wl-kjv\" data-code=\"H5315\">himself,</span> saying, Surely I will <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> thee with <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> as with <span class=\"wl wl-kjv\" data-code=\"H3218\">caterpillers;</span> and they shall lift <span class=\"wl wl-kjv\" data-code=\"H6030\">up</span> a shout","15":"He hath <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> by his <span class=\"wl wl-kjv\" data-code=\"H3581\">power,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> by his <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and hath stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> by his understanding.","16":"When he <span class=\"wl wl-kjv\" data-code=\"H5414\">uttereth</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> there is a <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> in the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens;</span> and he causeth the <span class=\"wl wl-kjv\" data-code=\"H5387\">vapours</span> to <span class=\"wl wl-kjv\" data-code=\"H5927\">ascend</span> from the <span class=\"wl wl-kjv\" data-code=\"H7097\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> he <span class=\"wl wl-kjv\" data-code=\"H6213\">maketh</span> <span class=\"wl wl-kjv\" data-code=\"H1300\">lightnings</span> with <span class=\"wl wl-kjv\" data-code=\"H4306\">rain,</span> and bringeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> out of his treasures.","17":"Every <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> is <span class=\"wl wl-kjv\" data-code=\"H1197\">brutish</span> by his <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge;</span> every <span class=\"wl wl-kjv\" data-code=\"H6884\">founder</span> is <span class=\"wl wl-kjv\" data-code=\"H3001\">confounded</span> by the graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image:</span> for his molten <span class=\"wl wl-kjv\" data-code=\"H5262\">image</span> is <span class=\"wl wl-kjv\" data-code=\"H8267\">falsehood,</span> and there is no breath","18":"They are <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity,</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H8595\">errors:</span> in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of their <span class=\"wl wl-kjv\" data-code=\"H6486\">visitation</span> they shall perish.","19":"The <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> is not like them; for he is the <span class=\"wl wl-kjv\" data-code=\"H3335\">former</span> of all things: and Israel is the <span class=\"wl wl-kjv\" data-code=\"H7626\">rod</span> of his <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> is his name.","20":"Thou art my battle <span class=\"wl wl-kjv\" data-code=\"H4661\">axe</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war:</span> for with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and with thee will I <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> kingdoms;","21":"And with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> and his <span class=\"wl wl-kjv\" data-code=\"H7392\">rider;</span> and with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> and his rider;","22":"With thee also will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">woman;</span> and with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H5288\">young;</span> and with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> the young <span class=\"wl wl-kjv\" data-code=\"H970\">man</span> and the maid;","23":"I will also break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> with thee the <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd</span> and his <span class=\"wl wl-kjv\" data-code=\"H5739\">flock;</span> and with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H406\">husbandman</span> and his yoke of <span class=\"wl wl-kjv\" data-code=\"H6776\">oxen;</span> and with thee will I break in <span class=\"wl wl-kjv\" data-code=\"H5310\">pieces</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">captains</span> and rulers.","24":"And I will <span class=\"wl wl-kjv\" data-code=\"H7999\">render</span> unto <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldea</span> all their <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that they have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> in your <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","25":"Behold, I am against thee, O <span class=\"wl wl-kjv\" data-code=\"H4889\">destroying</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyest</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> and I will stretch <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon thee, and roll thee <span class=\"wl wl-kjv\" data-code=\"H1556\">down</span> from the <span class=\"wl wl-kjv\" data-code=\"H5553\">rocks,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee a <span class=\"wl wl-kjv\" data-code=\"H8316\">burnt</span> mountain.","26":"And they shall not <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of thee a <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> for a <span class=\"wl wl-kjv\" data-code=\"H6438\">corner,</span> nor a <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> for <span class=\"wl wl-kjv\" data-code=\"H4146\">foundations;</span> but thou shalt be <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","27":"Set ye <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H5251\">standard</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H8628\">blow</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">prepare</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> against her, call <span class=\"wl wl-kjv\" data-code=\"H8085\">together</span> against her the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of <span class=\"wl wl-kjv\" data-code=\"H780\">Ararat,</span> <span class=\"wl wl-kjv\" data-code=\"H4508\">Minni,</span> and <span class=\"wl wl-kjv\" data-code=\"H813\">Ashchenaz;</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">appoint</span> a <span class=\"wl wl-kjv\" data-code=\"H2951\">captain</span> against her; cause the <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> to come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> as the <span class=\"wl wl-kjv\" data-code=\"H5569\">rough</span> caterpillers.","28":"<span class=\"wl wl-kjv\" data-code=\"H6942\">Prepare</span> against her the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H4074\">Medes,</span> the <span class=\"wl wl-kjv\" data-code=\"H6346\">captains</span> thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers</span> thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of his dominion.","29":"And the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall <span class=\"wl wl-kjv\" data-code=\"H7493\">tremble</span> and <span class=\"wl wl-kjv\" data-code=\"H2342\">sorrow:</span> for every <span class=\"wl wl-kjv\" data-code=\"H4284\">purpose</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6965\">performed</span> against <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> a <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation</span> without an inhabitant.","30":"The mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> have <span class=\"wl wl-kjv\" data-code=\"H2308\">forborn</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight,</span> they have <span class=\"wl wl-kjv\" data-code=\"H3427\">remained</span> in their <span class=\"wl wl-kjv\" data-code=\"H4679\">holds:</span> their <span class=\"wl wl-kjv\" data-code=\"H1369\">might</span> hath <span class=\"wl wl-kjv\" data-code=\"H5405\">failed;</span> they became as <span class=\"wl wl-kjv\" data-code=\"H802\">women:</span> they have <span class=\"wl wl-kjv\" data-code=\"H3341\">burned</span> her <span class=\"wl wl-kjv\" data-code=\"H4908\">dwellingplaces;</span> her <span class=\"wl wl-kjv\" data-code=\"H1280\">bars</span> are broken.","31":"One <span class=\"wl wl-kjv\" data-code=\"H7323\">post</span> shall <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">another,</span> and one <span class=\"wl wl-kjv\" data-code=\"H5046\">messenger</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">another,</span> to <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> that his <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> is <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> at one end,","32":"And that the <span class=\"wl wl-kjv\" data-code=\"H4569\">passages</span> are <span class=\"wl wl-kjv\" data-code=\"H8610\">stopped,</span> and the <span class=\"wl wl-kjv\" data-code=\"H98\">reeds</span> they have <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> are affrighted.","33":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> The <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> is like a <span class=\"wl wl-kjv\" data-code=\"H1637\">threshingfloor,</span> it is <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> to <span class=\"wl wl-kjv\" data-code=\"H1869\">thresh</span> her: yet a little <span class=\"wl wl-kjv\" data-code=\"H4592\">while,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of her <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> shall come.","34":"<span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> hath <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> me, he hath <span class=\"wl wl-kjv\" data-code=\"H2000\">crushed</span> me, he hath <span class=\"wl wl-kjv\" data-code=\"H3322\">made</span> me an <span class=\"wl wl-kjv\" data-code=\"H7385\">empty</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel,</span> he hath swallowed me <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> like a <span class=\"wl wl-kjv\" data-code=\"H8577\">dragon,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> his <span class=\"wl wl-kjv\" data-code=\"H3770\">belly</span> with my <span class=\"wl wl-kjv\" data-code=\"H5730\">delicates,</span> he hath cast me out.","35":"The <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> done to me and to my <span class=\"wl wl-kjv\" data-code=\"H7607\">flesh</span> be upon <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say;</span> and my <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldea,</span> shall <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> say.","36":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H7378\">plead</span> thy <span class=\"wl wl-kjv\" data-code=\"H7379\">cause,</span> and take <span class=\"wl wl-kjv\" data-code=\"H5358\">vengeance</span> for <span class=\"wl wl-kjv\" data-code=\"H5360\">thee;</span> and I will dry <span class=\"wl wl-kjv\" data-code=\"H2717\">up</span> her <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and make her <span class=\"wl wl-kjv\" data-code=\"H4726\">springs</span> dry.","37":"And <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall become <span class=\"wl wl-kjv\" data-code=\"H1530\">heaps,</span> a <span class=\"wl wl-kjv\" data-code=\"H4583\">dwellingplace</span> for <span class=\"wl wl-kjv\" data-code=\"H8577\">dragons,</span> an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment,</span> and an <span class=\"wl wl-kjv\" data-code=\"H8322\">hissing,</span> without an inhabitant.","38":"They shall <span class=\"wl wl-kjv\" data-code=\"H7580\">roar</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> like <span class=\"wl wl-kjv\" data-code=\"H3715\">lions:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5286\">yell</span> as <span class=\"wl wl-kjv\" data-code=\"H738\">lions'</span> whelps.","39":"In their <span class=\"wl wl-kjv\" data-code=\"H2527\">heat</span> I will <span class=\"wl wl-kjv\" data-code=\"H7896\">make</span> their <span class=\"wl wl-kjv\" data-code=\"H4960\">feasts,</span> and I will make them <span class=\"wl wl-kjv\" data-code=\"H7937\">drunken,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H5937\">rejoice,</span> and <span class=\"wl wl-kjv\" data-code=\"H3462\">sleep</span> a <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep,</span> and not <span class=\"wl wl-kjv\" data-code=\"H6974\">wake,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","40":"I will bring them <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> like <span class=\"wl wl-kjv\" data-code=\"H3733\">lambs</span> to the <span class=\"wl wl-kjv\" data-code=\"H2873\">slaughter,</span> like <span class=\"wl wl-kjv\" data-code=\"H352\">rams</span> with he goats.","41":"How is <span class=\"wl wl-kjv\" data-code=\"H8347\">Sheshach</span> <span class=\"wl wl-kjv\" data-code=\"H3920\">taken!</span> and how is the <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> of the whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H8610\">surprised!</span> how is <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> become an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment</span> among the nations!","42":"The <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> is come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> upon <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon:</span> she is <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> with the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of the waves","43":"Her <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> are a <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation,</span> a <span class=\"wl wl-kjv\" data-code=\"H6723\">dry</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and a <span class=\"wl wl-kjv\" data-code=\"H6160\">wilderness,</span> a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> wherein no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth,</span> neither doth any <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> thereby.","44":"And I will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> <span class=\"wl wl-kjv\" data-code=\"H1078\">Bel</span> in <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and I will bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> that which he hath swallowed <span class=\"wl wl-kjv\" data-code=\"H1105\">up:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall not flow <span class=\"wl wl-kjv\" data-code=\"H5102\">together</span> any more unto him: yea, the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall fall.","45":"My <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> go ye <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of her, and <span class=\"wl wl-kjv\" data-code=\"H4422\">deliver</span> ye every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> from the <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the LORD.","46":"And lest your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H7401\">faint,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> for the <span class=\"wl wl-kjv\" data-code=\"H8052\">rumour</span> that shall be <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> a <span class=\"wl wl-kjv\" data-code=\"H8052\">rumour</span> shall both <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> one <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that in another <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> shall come a <span class=\"wl wl-kjv\" data-code=\"H8052\">rumour,</span> and <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H4910\">ruler</span> against ruler.","47":"Therefore, behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> that I will do <span class=\"wl wl-kjv\" data-code=\"H6485\">judgment</span> upon the graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon:</span> and her whole <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall be <span class=\"wl wl-kjv\" data-code=\"H954\">confounded,</span> and all her <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in the midst","48":"Then the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and all that is therein, shall <span class=\"wl wl-kjv\" data-code=\"H7442\">sing</span> for <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon:</span> for the <span class=\"wl wl-kjv\" data-code=\"H7703\">spoilers</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto her from the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","49":"<span class=\"wl wl-kjv\" data-code=\"H1571\">As</span> <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> hath caused the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> so at <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> of all the earth.","50":"Ye that have <span class=\"wl wl-kjv\" data-code=\"H6405\">escaped</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> go <span class=\"wl wl-kjv\" data-code=\"H1980\">away,</span> stand not <span class=\"wl wl-kjv\" data-code=\"H5975\">still:</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off,</span> and let <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">come</span> into your mind.","51":"We are <span class=\"wl wl-kjv\" data-code=\"H954\">confounded,</span> because we have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach:</span> <span class=\"wl wl-kjv\" data-code=\"H3639\">shame</span> hath <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> our <span class=\"wl wl-kjv\" data-code=\"H6440\">faces:</span> for <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> are <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuaries</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> house.","52":"Wherefore, behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I will do <span class=\"wl wl-kjv\" data-code=\"H6485\">judgment</span> upon her graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images:</span> and through all her <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> the <span class=\"wl wl-kjv\" data-code=\"H2491\">wounded</span> shall groan.","53":"Though <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> should mount <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and though she should <span class=\"wl wl-kjv\" data-code=\"H1219\">fortify</span> the <span class=\"wl wl-kjv\" data-code=\"H4791\">height</span> of her <span class=\"wl wl-kjv\" data-code=\"H5797\">strength,</span> <span class=\"wl wl-kjv\" data-code=\"H227\">yet</span> from me shall <span class=\"wl wl-kjv\" data-code=\"H7703\">spoilers</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","54":"A <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of a <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> cometh from <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7667\">destruction</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the Chaldeans:","55":"Because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled</span> <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed</span> out of her the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice;</span> when her <span class=\"wl wl-kjv\" data-code=\"H1530\">waves</span> do <span class=\"wl wl-kjv\" data-code=\"H1993\">roar</span> like <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> a <span class=\"wl wl-kjv\" data-code=\"H7588\">noise</span> of their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> is uttered:","56":"Because the <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiler</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon her, even upon <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and her mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> are <span class=\"wl wl-kjv\" data-code=\"H3920\">taken,</span> every one of their <span class=\"wl wl-kjv\" data-code=\"H7198\">bows</span> is <span class=\"wl wl-kjv\" data-code=\"H2865\">broken:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H1578\">recompences</span> shall <span class=\"wl wl-kjv\" data-code=\"H7999\">surely</span> requite.","57":"And I will make <span class=\"wl wl-kjv\" data-code=\"H7937\">drunk</span> her <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and her <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> men, her <span class=\"wl wl-kjv\" data-code=\"H6346\">captains,</span> and her <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> and her mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3462\">sleep</span> a <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep,</span> and not <span class=\"wl wl-kjv\" data-code=\"H6974\">wake,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">King,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","58":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> The <span class=\"wl wl-kjv\" data-code=\"H7342\">broad</span> <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6209\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H6209\">broken,</span> and her <span class=\"wl wl-kjv\" data-code=\"H1364\">high</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3341\">burned</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H3021\">labour</span> in <span class=\"wl wl-kjv\" data-code=\"H7385\">vain,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3816\">folk</span> <span class=\"wl wl-kjv\" data-code=\"H1767\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and they shall be weary.","59":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> which <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H8304\">Seraiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5374\">Neriah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4271\">Maaseiah,</span> when he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> into <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> in the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of his <span class=\"wl wl-kjv\" data-code=\"H4427\">reign.</span> And this <span class=\"wl wl-kjv\" data-code=\"H8304\">Seraiah</span> was a <span class=\"wl wl-kjv\" data-code=\"H4496\">quiet</span> prince.","60":"So <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> all the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that should <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> even all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> against Babylon.","61":"And <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H8304\">Seraiah,</span> When thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> all these words;","62":"Then shalt thou <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> against this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> to cut it <span class=\"wl wl-kjv\" data-code=\"H3772\">off,</span> that none shall <span class=\"wl wl-kjv\" data-code=\"H3427\">remain</span> in it, neither <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> nor <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> but that it shall be <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate</span> for ever.","63":"And it shall be, when thou hast made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7121\">reading</span> this <span class=\"wl wl-kjv\" data-code=\"H5612\">book,</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H7194\">bind</span> a <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> to it, and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> it into the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of Euphrates:","64":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thus shall <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> <span class=\"wl wl-kjv\" data-code=\"H8257\">sink,</span> and shall not <span class=\"wl wl-kjv\" data-code=\"H6965\">rise</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon her: and they shall be <span class=\"wl wl-kjv\" data-code=\"H3286\">weary.</span> Thus far are the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of Jeremiah."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"verdervenden wind opwekken tegen Babel,","tekst":"Versta, de Meden en Perzen en vergelijk boven Jer 4:11 ."},{"catchword":"hart van degenen,","tekst":"Gelijk wij ook in onze taal zeggen: In het hart van het land. Versta, de inwoners van Babel, die de hoofdstad was van Chaldea en als het midden des lands; zie Deu 4:11 ."}],"2":[{"catchword":"wanners toeschikken,","tekst":"Anders, vreemdelingen toeschikken, die hen verstrooien zullen."},{"catchword":"zullen ten dage","tekst":"Hebreeuws, zijn geweest. Profetischerwijze gesproken; dat is, zullen haar van alle kanten bestrijden."},{"catchword":"kwaads","tekst":"Dat is, van haar ongeluk, ongeval, dat over haar bestemd is."}],"3":[{"catchword":"schutter spanne zijn boog","tekst":"Hebreeuws, de treder trede; dat is, de spanner spanne; woorden Gods tot de schutters van de Meden en Perzen."},{"catchword":"spant,","tekst":"Tegen de schutters van Babel."},{"catchword":"pantsier;","tekst":"Zijnde zwaarder gewapend dan de schutters."},{"catchword":"haar jongelingen niet,","tekst":"Van Babel."},{"catchword":"verbant al haar heir;","tekst":"Zie Deu 2:34 , en boven Jer 50:21 ."}],"4":[{"catchword":"liggen in het land der Chaldeën,","tekst":"Hebreeuws eigenlijk vallen; maar het Hebreeuwse woord wordt ook somtijds voor liggen genomen; zie boven Jer 9:22 , alzo onder vs.47, 49, enz."}],"5":[{"catchword":"weduwschap gelaten worden van zijn God,","tekst":"Anders, geen weduwnaar, of gene weduwe gelaten worden. Het Hebreeuwse woord alman wordt alleen hier gevonden, betekenende iemand, die in den weduwlijken staat gesteld, of gelaten is, gelijk almana ene weduwe betekent. De manier van spreken ziet op het geestelijk huwelijk, dat God met zijn volk gemaakt had; alsof Hij zeide: Al is het dat mijn volk een tijdlang alzo gehandeld is alsof het niemand toebehoorde, of haar man en beschermer dood ware, en zij van hem en van ieder verstoten en verlaten ware, zo zal nochtans zulks niet altoos duren; Ik zal nog tonen dat zij mijne getrouwde is, en hare zaak ter hand nemen, en het ongelijk, dat haar gedaan is, wreken; vergelijk Joh 14:18 ."},{"catchword":"heirscharen","tekst":"Zie 1Ki 18:15 ."},{"catchword":"hunlieder land","tekst":"Te weten van Israël en Juda. Anders: dewijl hunlieder land; [te weten der Chaldeën], enz."},{"catchword":"van schuld is","tekst":"Of, verwoesting, die zij met hunne zonde verschuldigd hebben. Anderen duiden dit op de Chaldeën aldus: Want hun [der Chaldeën] land is vol schuld tegen, of vanwege den Heilige Israëls; dat is, om de zonden, die de Chaldeën tegen God gedaan hebben, waarom Hij hen straffen zal; vergelijk boven Jer 50:19 ."},{"catchword":"Heilige Israëls","tekst":"Zie Psa 71:22 ."}],"6":[{"catchword":"ongerechtigheid;","tekst":"Dat is, wacht u dat gij niet omkomt in de straf harer ongerechtigheid. Zie Lev 5:1 ; Psa 31:11 , en onder vs.45, en boven Jer 50:8 ."},{"catchword":"verdienste betaalt","tekst":"Alzo wordt het Hebreeuwse woord ook genomen Jdg 9:16 . Zie wijders 2Ch 20:11 ."}],"7":[{"catchword":"beker in de hand des HEEREN,","tekst":"De zin dezer verbloemde manier van spreken is dat God Babel gebruikt heeft als zijn knecht en instrument om zijn rechtvaardige oordelen over de inwoners der aarde uit te voeren. Vergelijk boven Jer 25:9 met de aantekening; idem Jer 25:15 , enz., en Jer 49:12 , en onder vs.20,21, enz."},{"catchword":"haar wijn gedronken,","tekst":"Van Babel."},{"catchword":"dol geworden","tekst":"Van de plagen, die hun door de Babyloniërs van Gods hand zijn toegezonden. Vergelijk boven Jer 25:27 . Van het Hebreeuwse woord zie Psa 5:6 ."}],"8":[{"catchword":"balsem tot haar pijn,","tekst":"Zie boven Jer 8:22 ."}],"9":[{"catchword":"gemeesterd,","tekst":"Het Hebreeuwse woord betekent beide, meesteren, medicineren, geneesmiddelen gebruiken, en genezen of gezondmaken, beide betekenissen worden in vs.9 gebruikt, alsof zij zeiden: Wij hebben ons best gedaan om haar te helpen, maar tevergeefs."},{"catchword":"laat ons een iegelijk in zijn land trekken;","tekst":"Gelijk boven Jer 46:16 . Dit zijn woorden van het gehuurde krijgsvolk der Babyloniërs."},{"catchword":"oordeel reikt tot aan den hemel,","tekst":"Dat is, straf. Zie boven Jer 48:21 ."},{"catchword":"verheven","tekst":"Of, verheft zich."},{"catchword":"bovenste wolken","tekst":"Of, dunste."}],"10":[{"catchword":"De HEERE","tekst":"Woorden van Gods volk."},{"catchword":"gerechtigheden hervoor gebracht;","tekst":"Dat is, de rechtvaardigheid onzer zaak tegen Babel. Want ofschoon God met recht zijn volk gestraft heeft, zo was Babel daarom niet onschuldig. Vergelijk Isa 10:7 ; Mic 7:9 , enz."}],"11":[{"catchword":"Zuivert de pijlen,","tekst":"Maakt ze schoon, spottenderwijze tot de Babyloniërs gesproken. Vergelijk boven Jer 46:4 , en hier vs.12."},{"catchword":"rust de schilden volkomenlijk toe;","tekst":"Hebreeuws eigenlijk, vult, vervult; dat is, maakt ze ten volle gereed, of vat ze met volle hand, of (gelijk sommigen) verzamelt ze, breng ze te volle bijeen; idem, volmaakt ze, of er iets aan scheelde. Anders: vult de pijlkokers."},{"catchword":"Medië opgewekt;","tekst":"Versta daarbij ook Perzië. Alzo onder vs.28."},{"catchword":"tempels","tekst":"Zie boven Jer 50:28 ."}],"12":[{"catchword":"lagen;","tekst":"Of, lagenleggers, loerder, die op den vijand mogen passen, en dien onvoorziens een voordeel afzien (gelijk men zeg): het zal altemaal niet helpen, wil de Heere zeggen, want gij zult met al uwe krijgsmaatregelen Gods voornemen en werk niet kunnen beletten."},{"catchword":"voorgenomen,","tekst":"Hebreeuws, ook heeft de HEERE gedacht, of voorgenomen, ook heeft Hij gedaan, enz.; dat is, gelijk, alzo, enz.; of, Hij heeft het niet alleen voorgenomen, maar ook gedaan; dat is, zal het ook gewisselijk doen. Vergelijk onder vs.49."}],"13":[{"catchword":"wateren woont,","tekst":"Omdat de grote rivier Eufraat niet alleen aan Babel, maar ook daardoor liep, en rondom vele watergrachten waren. Vergelijk Rev 17:1 , Rev 17:15 ."},{"catchword":"einde is gekomen,","tekst":"Dat is, tijd van uwen ondergang, dien God over u bestemd heeft."},{"catchword":"maat uwer gierigheid","tekst":"Hebreeuws, el, of maat. Versta hierdoor het perk, dat God hun onverzadelijke begeerlijkheid gesteld had, dat zij niet zouden kunnen overtreden, maar daarmede zou het uit en ten einde zijn."}],"14":[{"catchword":"bij Zijn ziel","tekst":"Menselijk van God gesproken, dat is, bij zichzelven, gelijk God spreekt boven Jer 22:24 , en Jer 49:13 . Zie Gen 22:16 ."},{"catchword":"Ofschoon Ik u","tekst":"Gelijk de Hebreeuwse woorden genomen zijn, boven Jer 2:22 , en Jer 37:10 , zie 1Sa 14:39 . Anders: zo Ik u [niet] vervulde, en zij, enz., verstaande het grote krijgsheir der Meden en Perzen, waarmede God hier zweren zou hen te zullen vervullen."},{"catchword":"kevers vervuld heb,","tekst":"Een soort van ongedierte, hebbende in het Hebreeuws de naam [gelijk enigen menen] van het verderven der vruchten door lekking. Zie Psa 105:34 , onder vs.27; Joe 1:4 , en Joe 2:25 ; Nah 3:15-16 . Sommigen noemen ze kankerwormen, of kruidwormen."},{"catchword":"vreugdegeschrei","tekst":"Zie hiervan boven Jer 25:30 , en versta dit van de vijanden, die Babel zouden overvallen."},{"catchword":"over u toeroepen","tekst":"Triomferende over u, of tegen u, een veldgeschrei maken om elkander tot den aanval en overwinning van u te verwakkeren, al waar gij nog zo vol volk."}],"15":[{"catchword":"Die de aarde gemaakt heeft door Zijn kracht,","tekst":"Zie boven Jer 10:12-16 , waar vast dezelfde woorden gevonden worden, die hier staan tot aan vs.20. Zie de aantekening aldaar."}],"19":[{"catchword":"Israël","tekst":"Dit is hier ingevoegd uit boven Jer 10:16 . Anders: en [Hij] [te weten God] is de roede zijner [te weten Jakobs] erfenis; dat is, die zichzelven zijn volk tot een erfdeel gegeven heeft."}],"20":[{"catchword":"Gij zijt Mij","tekst":"Gods woorden tot den Babyloniër. Anderen verstaan dit als een aanspraak aan den koning Cyrus, die de Babyloniërs zou overweldigen, en zetten (het) over vs.24:en ik zal, enz."},{"catchword":"voorhamer,","tekst":"Of, drijfhamer; versta, zulk een hamer Gods, die alles, zelfs de rotsstenen, in stukken en te morzel slaat; vergelijk boven Jer 23:29 . De gelijkenis [gelijk blijkt uit het volgende], is genomen van de krijgslieden, bijzonderlijk van de curassiers, die hunne vuisthamers of heirhamers plegen te hebben, om de ijzeren wapens daarmede door te houwen en te verbreken, en den vijand neder te vellen."},{"catchword":"krijgswapenen;","tekst":"Of, gereedschap, instrumenten; dat is, gij zult een instrument en roede zijn van mijn toorn en rechtvaardig oordeel over vele volken."},{"catchword":"zal Ik volken in stukken slaan,","tekst":"Hier spreekt God met eigenlijke woorden, te weten in den toekomenden tijd, en niet in den verleden tijd, gelijk anderszins profetischerwijze in deze voorzegging veel geschiedt."}],"21":[{"catchword":"ruiter","tekst":"Of, die daarop rijdt. Van wagenruiters, die in die tijden van de wagens plachten te vechten; zie 2Sa 10:18 ."}],"23":[{"catchword":"Juk- ossen;","tekst":"Of, koppel, paar ossen. Dat is, de ossen, die in het juk (koppel) samen gaan arbeiden."}],"24":[{"catchword":"Maar Ik zal Babel","tekst":"Alsof de Heere zeide: Als Ik de Babyloniërs in al de voorgemelde oordelen, als mijn instrument, zal gebruikt hebben, dan zal Ik niet nalaten te straffen de boosheid, die zij ondertussen daarin gepleegd en bedreven hebben, bijzonderlijk aan mijn volk; vergelijk boven vs.10."},{"catchword":"Chaldea","tekst":"Dat is, van het land der Chaldeën, of van Chaldea; alzo vs.35."},{"catchword":"ulieder ogen,","tekst":"Dit spreekt God tot zijn volk, voor welker ogen Hij dit oordeel over Babel wilde laten gaan."}],"25":[{"catchword":"wil aan u,","tekst":"Gelijk boven Jer 50:31 ."},{"catchword":"berg","tekst":"Alzo wordt Babel genoemd vanwege de koninklijke hoogheid en pracht en de gelijkheid, die zij had met een berg, vermits haar hoge dikke muren en hoge koninklijke gebouwen; vergelijk Rev 17:9 ."},{"catchword":"aarde verderft,","tekst":"Vergelijk Rev 11:18 , en Rev 13:14 ."},{"catchword":"steenrotsen afwentelen,","tekst":"Uit uw hoge vestingen nederstorten, dat gij daarheen zult tuimelen en rollen, gelijk een vat of iets anders, dat van een klip wordt afgewenteld, in stukken berst en als verbrijzeld wordt."},{"catchword":"brands","tekst":"Daar alles als in de as zal liggen, en niets dan enkel as en verbrande steenhopen [gelijk in afgebrande plaatsen] overig zullen zijn; zie onder vs.58."}],"26":[{"catchword":"steen nemen tot een hoek,","tekst":"Dat is, gij zult niet weder gebouwd worden, of zo woest en verdorven zijn, dat men niet een steen onder uw overige steenhopen zal vinden, die bekwaam is tot een hoeksteen of grondsteen."},{"catchword":"want gij zult","tekst":"Of, maar."},{"catchword":"eeuwige woestheden zijn,","tekst":"Hebreeuws, woestheden, of verwoesting der eeuwigheid. Alzo onder vs.62."}],"27":[{"catchword":"heiligt de heidenen tegen haar,","tekst":"Dat is, zondert hen af, bereidt hen, rust toe, tot dit werk des Heeren tegen Babel; vergelijk boven Jer 6:4 , met de aantekening; alzo in vs.28."},{"catchword":"roept tegen haar bijeen de koninkrijken","tekst":"Hebreeuws eigenlijk, doet, of laat horen; dat is somtijds, door uitroeping vergaderen."},{"catchword":"Ararat,","tekst":"Groot-Armenië; zie Gen 8:4 ."},{"catchword":"Minni","tekst":"Klein-Armenië."},{"catchword":"Askenaz;","tekst":"Zie Gen 10:3 . Welke landen men houdt dat Cyrus ingenomen had eer hij Babel veroverde; of dat zij ten dele zijne bondgenoten waren."},{"catchword":"krijgsoverste tegen haar,","tekst":"Het Hebreeuwse woord wordt alleen hier en Nah 3:17 gevonden, betekenende [gelijk sommigen menen] zulk een kommandeur of overste, die de bevelen des konings ontvangt en aan het krijgsvolk overdraagt en verklaart. Anderen verstaan den koning Cyrus zelf, of Darius [naar hun gevoelen] zijn schoonvader."},{"catchword":"ruige","tekst":"Of, ruwe, harige, die de haren overeind steken, alsof zij te berge stonden en ijselijk er uitzien; vergelijk Job 4:15 ; Psa 119:120 , waar hetzelfde woord gebruikt wordt. Hebreeuws, paard als kever, [die] ruig is."},{"catchword":"kevers","tekst":"Paarden in menigte, als sprinkhanen; zie boven vs.14."}],"28":[{"catchword":"Medië,","tekst":"Gelijk boven vs.11."},{"catchword":"haar landvoogden","tekst":"Versta, landvoogden of vorsten van Medië."},{"catchword":"zijner heerschappij","tekst":"Hebreeuws, zijner; te weten een ieder koning, of de geslachten worden verwisseld, omdat het Hebreeuwse woord, dat een land en de aarde betekent, in beiderlei geslachten gebruikt wordt."}],"29":[{"catchword":"elk een van des HEEREN","tekst":"Hebreeuws, de gedachten des Heeren staan vast; dat is, elkeen zijner gedachten, dat is, al zijn voornemen."}],"30":[{"catchword":"gebleven in de vestingen,","tekst":"Zij zullen geen moed hebben om te veld en den vijand onder de ogen te trekken."},{"catchword":"wijven geworden;","tekst":"Zie boven Jer 50:37 , en vergelijk Isa 3:12 ."},{"catchword":"zij hebben hun woningen aangestoken,","tekst":"De vijanden, Meden en Perzen."},{"catchword":"grendels zijn verbroken","tekst":"Van huizen en kleine poorten, die bij menigte naar de rivier toe waren, Herodotus, lib.1."}],"31":[{"catchword":"De loper zal den loper tegemoet lopen,","tekst":"Gelijk in een onvoorzienen of onverwachten inval en inbreuk des vijands placht te geschieden."},{"catchword":"van alle einden is ingenomen;","tekst":"Waar de Perzen en Meden inbraken en de stad innamen, eer men het in het midden en op het andere einde van de stad [vermits hare grootheid] eens wist. Ditzelfde betuigt Herodotus even alzo geschied te zijn, gelijk hier geprofeteerd is."}],"32":[{"catchword":"veren ingenomen,","tekst":"Dewijl Cyrus het water van den Eufraat had afgeleid, zodat het krijgsvolk daardoor in de stad ging. Anders: slechtelijk, passen, passagen."},{"catchword":"rietpoelen met vuur verbrand zijn;","tekst":"Of, biezen, poelen, uit de rivier hier en daar afgeleid, die de vijand aanmerkelijk hinder hadden kunnen doen. Sommigen verstaan dat het slechtelijk van de waterpoelen bij gelijkenis gesproken is, dat zij uitgedroogd waren, alsof zij met vuur uitgebrand en verdroogd waren."}],"33":[{"catchword":"De dochter van Babel","tekst":"Dat is, Babel, die een schone wellustige jonkvrouw gelijk is, zal nu behandeld worden als een dorsvloer en het koren daarop."},{"catchword":"trede;","tekst":"Of, doe treden; dat is, effen, hard en gelijk make om het koren daarop te dorsen, of dat men ze dorse. Want de dorsende ossen of runderen treden het koren."},{"catchword":"weinig,","tekst":"Te weten, tijd; het zal haast, niet lang uitblijven."},{"catchword":"oogstes overkomen","tekst":"En vervolgens, de dorstijd; versta, den tijd van haar ongeval, door de Meden en Perzen, die haar als vertreden en uitdorsen zouden, gelijk zij Gods volk en anderen tevoren gedaan hebben. Zie Isa 21:10 ."}],"34":[{"catchword":"Nebukadrezar,","tekst":"Dat is, een klacht van Gods volk gelijk vs.35 uitwijst."},{"catchword":"opgegeten,","tekst":"Vergelijk Deu 31:17 , met de aantekening; idem Isa 30:14 , en boven Jer 19:11 , en Jer 50:7 ."},{"catchword":"balg gevuld","tekst":"Of, pens, ingewand. Het Hebreeuwse woord wordt alleenlijk hier gevonden."},{"catchword":"verdreven","tekst":"Uit mijn land; of hij heeft mij weggespoeld, in eenen zin."}],"35":[{"catchword":"dat mij en mijn","tekst":"Hebreeuws, mijn geweld en van mijn vlees; dat is, het geweld, dat mij en mijn vlees is aangedaan; vergelijk boven Jer 2:2 ; Jdg 9:24 ; Oba 1:10 ."},{"catchword":"vlees is aangedaan,","tekst":"Dat is, mijnen broeders en bloedverwanten. Vergelijk Rom 11:14 , en Lev 18:6 ."},{"catchword":"zij op Babel","tekst":"Of, is; dat is, ligt; zie Jdg 9:24 ."},{"catchword":"de inwoneres van Sion;","tekst":"Het volk, dat te Jeruzalem tehuis behoort, of Gods kerk."},{"catchword":"bloed zij op de inwoners","tekst":"Vergelijk Mat 27:25 ."},{"catchword":"Chaldea","tekst":"Dat is, van Chaldea, gelijk boven vs.24."}],"36":[{"catchword":"Ziet,","tekst":"Gods antwoord op de voorgaande woorden van zijn volk."},{"catchword":"twist twisten,","tekst":"Zie boven Jer 50:34 ."},{"catchword":"zee droog maken,","tekst":"De wateren van den Eufraat, die rondom en in haar midden zijn. Zie van het gebruik van het woord zee, Gen 1:10 , en vergelijk boven Jer 50:38 , met de aantekening."},{"catchword":"springader opdrogen","tekst":"Dat is, de rivier, die uit haar springader voortkomt."}],"37":[{"catchword":"aanfluiting,","tekst":"Zie 1Ki 9:8 , boven Jer 18:16 ."}],"38":[{"catchword":"Zij zullen te zamen brullen als jonge leeuwen,","tekst":"De Babyloniërs zullen in hun feestbanket juichen, razen en tieren, als dartele jonge wilde leeuwen; waarop vs.39 past. Of, [gelijk sommigen] zij zullen als verhongerde jonge leeuwen brullen en briesen, omdat hun de roof benomen is. Anderen verstaan het van de Perzen en Meden, die over den roof van Babel als leeuwen zouden brullen."},{"catchword":"briesen als leeuwenwelpen","tekst":"Of, ruchelen; dat is een onvolkomen gebrul voortbrengen, dat aan het geluid der ezels gelijk is. Anderen: zich uitschudden, of het haar verschudden; vergelijk Jdg 16:20 , met de aantekening."}],"39":[{"catchword":"verhit zijn,","tekst":"Van dronkenschap in hun goddeloos banket. Dan zal Ik hun een anderen drank opzetten. Zie de vervulling, naar sommiger gevoelen, Dan 5 ."},{"catchword":"drank opzetten,","tekst":"Hebreeuws, drinkingen, of dronken, elkeen zijn drank, dien Ik een ieder in mijn beker des toorn bereid heb en hun zal doen drinken."},{"catchword":"opspringen;","tekst":"Doch niet van vreugde, maar van schrik en siddering."},{"catchword":"eeuwigen slaap slapen,","tekst":"Hebreeuws, slaap der eeuwigheid; dat is den langen slaap, den dood sterven, omgebracht worden, en op aarde of in dit leven niet wederkeren. Vergelijk Psa 76:6 , en Ecc 12:5 , met de aantekening en onder vs.57, idem Psa 13:4 ."}],"40":[{"catchword":"slachten,","tekst":"Dat is, ter slachting, tot de slachtbank, om geslacht te worden, gelijk boven Jer 11:19 , en Jer 25:34 , en Jer 48:15 , en Jer 50:27 ."},{"catchword":"met bokken","tekst":"Dat is, en als bokken."}],"41":[{"catchword":"Hoe is","tekst":"Gelijk boven Jer 50:23 ."},{"catchword":"Sesach zo veroverd,","tekst":"Zie boven Jer 25:26 ."},{"catchword":"roem der ganse aarde ingenomen","tekst":"Dat is, beroemd door de ganse wereld. Vergelijk boven Jer 49:25 , en Isa 13:19 ."},{"catchword":"ontzetting onder de heidenen","tekst":"Dat zich een ieder daarover verwondert en ontzet, gelijk boven vs.37, en dikwijls in het voorgaande."}],"42":[{"catchword":"Een zee is over Babel gerezen,","tekst":"Antwoord op de voorgaande vraag, waarvan de zin is, dat Babel, hetwelk onoverwinnelijk scheen te zijn, door een onwederstaanlijk geweld zou worden overrompeld, te weten door het grote heirleger der Meden en Perzen, zijnde aangevoerd en gesterkt door Gods machtige Hand."}],"43":[{"catchword":"waarin","tekst":"Hebreeuws, in welks, of in deszelfs [steden]."},{"catchword":"niemand woont,","tekst":"Hebreeuws, niet alle man; dat is, niemand, niet een mens."}],"44":[{"catchword":"Bel te Babel,","tekst":"Zie boven Jer 50:2 ."},{"catchword":"verslonden heeft;","tekst":"Hebreeuws, zijne verslinding. Sommigen duiden dit op de offeranden, die men dezen afgod moest doen, waarvan men mag lezen de apocriefe stukken van Daniël en Herodotus. Anderen verstaan den roof en de ondergebrachte landen, van welker overwinning zij dezen afgod de eer gaven. Vergelijk boven Jer 49:1 ; Jdg 11:24 ."},{"catchword":"toevloeien,","tekst":"Als waterstromen, waarvan het Hebreeuwse woord komt. Vergelijk Psa 34:6 , met de aantekening."},{"catchword":"gevallen","tekst":"Dat is, zal zekerlijk vallen, niettegenstaande dat men het houdt voor een eeuwig en onverbrekelijk werk. Zie onder vs.58."}],"45":[{"catchword":"vanwege de hittigheid van den toorn des HEEREN","tekst":"Dat gij in hunne straffen niet mede omkomt, vergelijk boven vs.6; en opdat gij ontgaat de gevaren, waarvan in het volgende."}],"46":[{"catchword":"gerucht,","tekst":"Dat is, tijding, die men horen zal van den optocht, de aankomst en den voortgang der koningen van Medië en Perzië tegen Babel. Hebreeuws eigenlijk, horing."},{"catchword":"ene jaar,","tekst":"Hebreeuws, in het jaar, en in het jaar; of het jaar door en het jaar door; dat is, in het ene jaar en in het andere jaar, of het ene jaar voor en het andere jaar na, jaar op jaar, het ganse jaar door, zo in het eerste jaar als in het tweede jaar. De geschiedenissen vermelden dat Cyrus in het eerste jaar van zijn optocht nog niet voor Babel gekomen is, maar in het tweede."},{"catchword":"heer over heer","tekst":"Of, heerser tegen heerser; te weten de heren van Medië en Perzië zullen zijn over en tegen de Babyloniërs."}],"47":[{"catchword":"gesneden beelden van Babel;","tekst":"Of, gegravene."},{"catchword":"haar verslagenen","tekst":"Dat is, die van haar volk dodelijk gewond en nedergehouwen zullen zijn."},{"catchword":"liggen","tekst":"Zie boven vs.4, en alzo in het volgende."}],"48":[{"catchword":"hemel en de aarde,","tekst":"Vergelijk Rev 12:12 , en Rev 18:20 , en Rev 19:1 , enz."},{"catchword":"Babel;","tekst":"Dat is, over Babels ondergang."},{"catchword":"noorden","tekst":"Zie boven Jer 50:3 ."},{"catchword":"zullen haar de verstoorders aankomen,","tekst":"Hebreeuws, zal haar verstoorders, enz.; dat is, allen en ieder van degenen, die haar verstoren zullen."}],"49":[{"catchword":"tot een val","tekst":"Hebreeuws, toevallen; dat is, zij heeft daartoe gearbeid, is daartoe gesteld geweest, het is haar hart en zin geweest, zij heeft daartoe gediend. Of aldus: Gelijk Babel de verslagenen van Israël heeft doen vallen. De zin is enerlei."},{"catchword":"verslagenen van Israël,","tekst":"Dat het overvol lag van verslagen Joden [zie boven vs.4, met de aantekening], alzo zal het land van Babel weder vol worden van verslagenen. Hebreeuws, ook [is] Babel, ook zullen te Babel, enz.; vergelijk boven vs.12, met de aantekening."},{"catchword":"te Babel","tekst":"Of, der Babel, in Babel."}],"50":[{"catchword":"Gij ontkomenen van het zwaard,","tekst":"Aanspraak aan de gevangen overgebleven Joden in Babel."},{"catchword":"verre,","tekst":"Uit Babylonië; gedenkt alsdan wat Babel aan Jeruzalem gedaan heeft, en hoe het haar vergolden wordt; en voorts, stelt uw hart om weder te keren naar Jeruzalem, enz."},{"catchword":"opkomen","tekst":"Vergelijk boven Jer 3:16 , en Jer 7:31 , met de aantekening."}],"51":[{"catchword":"zeggen","tekst":"Als gij aan Jeruzalem gedenkt."},{"catchword":"uitlandsen over de heiligdommen","tekst":"De Babyloniërs, die den tempel verbrand hebben."}],"52":[{"catchword":"Daarom ziet,","tekst":"Gods antwoord op de voorgaande klacht van zijn volk."},{"catchword":"haar gesneden beelden;","tekst":"Babels afgoden alzo in het volgende."},{"catchword":"kermen in haar ganse land","tekst":"Of, stenen, zuchten; dat is, hun ganse land zal vol zijn van het kermen en krijten der verwonden, die als verslagenen sterven zullen; vergelijk vs.49. Het Hebreeuwse woord betekent beide, een dodelijk verwonde en verslagene."}],"53":[{"catchword":"al maakte zij vast","tekst":"Anders: al maakte zij hare sterkte vast [in] de hoogte; vergelijk boven Jer 49:16 ; Oba 1:4 ."}],"54":[{"catchword":"breuk uit het land der Chaldeën","tekst":"Dat is, verwoesting, jammer, ellende, enz.; zie Jer 4:6 . Anders: gekraak."}],"55":[{"catchword":"HEERE verstoort Babel,","tekst":"Als de bewerker van dezen krijg, of de opperste krijgsoverste der Meden en Perzen."},{"catchword":"grootse stem uit haar doen vergaan;","tekst":"Dat is, den hogen roem, het hoog spreken en pochen der Babyloniërs, dat zij gewoon waren te gebruiken, als hunne monarchie in bloei was. Anders: het groot gedruis; dat is het gewoel, dat binnen Babel was vanwege de veelheid der volken daarbinnen."},{"catchword":"hunlieder golven","tekst":"De Meden en Perzen, die Babel als een zee zullen overlopen; zie boven vs.42. Anders: hoewel hunlieder [der Babyloniërs] golven, enz.; dat is, hoewel zij nu zulk een gewoel maken, enz."},{"catchword":"grote wateren;","tekst":"Of, vele."},{"catchword":"geruis van hunlieder geluid","tekst":"Of, gedreun, groot gedruis hunner stem, te weten der Babyloniërs, die groot getier en geroep maakten over hunne ellenden."},{"catchword":"zal zich verheffen","tekst":"Hebreeuws, is, of wordt gegeven, uitgegeven; dat is, zal verheven worden, zal zich verheffen, zal zich uitgeven, zodat men hunne aankomst van verre zal kunnen horen."}],"56":[{"catchword":"Want de verstoorder komt over haar,","tekst":"Of, wanneer de verstoorder, enz., dan zullen, enz."},{"catchword":"zijn verbroken;","tekst":"Hebreeuws, is verbroken; elkeen van hunne bogen zal verbroken worden."},{"catchword":"zekerlijk betalen","tekst":"Hebreeuws, betalende betalen."}],"57":[{"catchword":"dronken maken;","tekst":"Uit den beker van mijn toorn."},{"catchword":"eeuwigen slaap slapen,","tekst":"Zie boven vs.39."}],"58":[{"catchword":"brede","tekst":"Die vijftig koninklijke ellen dik en breed was, zodat er twee wagens nevens elkander bekwamelijk op rijden konden, blijvende nog een goede ruimte tussen beide, gelijk de geschiedenissen betuigen."},{"catchword":"muur van Babel","tekst":"Hebreeuws, muren, in het getal van velen, omdat die muur zo uitermate dik was, alsof het vele muren geweest waren; gelijk Behemoth, beesten, genomen wordt voor een groot beest, gelijk een olifant, enz. Zie Job 40:10 ; Psa 73:22 ."},{"catchword":"ontbloot worden,","tekst":"Te weten tot de fondamenten toe; vergelijk Psa 137:7 . Anders: verbroken."},{"catchword":"volken","tekst":"Welker arbeid de Babyloniërs gebruikt hebben in het maken van dezen muur."},{"catchword":"tevergeefs,","tekst":"Of, tot uitlediging; dat is, dat alles weder mocht weggenomen, verdorven en verstrooid worden, wat daartoe aangevoerd en samengebracht was."},{"catchword":"vure zullen gearbeid hebben,","tekst":"Of, om des vuurs wil; dat is, opdat hun arbeid met vuur mocht verbrand worden; niet dat dit de mening of het oogmerk der bouwlieden geweest is, maar dat hun arbeid door Gods regering alzo uitgevallen is en daartoe gediend heeft. Vergelijk Hab 2:13 ."}],"59":[{"catchword":"woord,","tekst":"Of, de zaak die, enz."},{"catchword":"van Zedekia,","tekst":"Of, vanwege. Het Hebreeuwse woord wordt somtijds genomen voor van, vanwege, uit, gelijk te zien is Gen 4:1 , en Gen 44:4 ; Exo 9:29 ; Eze 6:9 ; Mic 3:8 , en in deze plaats. Anders, met Zedekia; maar zulks wordt nergens elders in de Schrift vermeld, en het schijnt niet wel gelooflijk dat Zedekia, gerebelleerd hebbende tegen den koning van Babel, zelf in persoon naar Babel zou hebben durven trekken, maar wel, dat hij door dezen vreedzamen vromen dienaar verzoening en vrede gezocht mag hebben te bemiddelen."},{"catchword":"vreedzaam vorst","tekst":"Hebreeuws, vorst der rust; dat is, een vroom, stil en vreedzaam man, wien Jeremia deze zaak heeft mogen vertrouwen, waarmede een ander te dien tijde den spot zou hebben gedreven, of zulks geweigerd hebben, als vol gevaar en zwarigheid zijnde. Anders: overste der rust des konings; dat is, overste kamerling . Sommigen houden het voor een naam van zekeren omtrek, waarvan te zien is 1Ch 2:52 ."}],"60":[{"catchword":"boek,","tekst":"Versta, een bijzonder boek, of dubbel, copie, afschrift, dat hij dezen Seraja mede gaf."}],"61":[{"catchword":"zien en lezen al deze woorden;","tekst":"Of, [haar, namelijk Babel] aanzien, of aanschouwen, bezien, om deze profetie met Babels tegenwoordigen staat te vergelijken. Of, als gij ze zult zien, enz."}],"62":[{"catchword":"eeuwige woestheden","tekst":"Hebreeuws, woestheden, of verwoestingen der eeuwigheid, gelijk boven vs.26."}],"63":[{"catchword":"Frath;","tekst":"De rivier Eufraat, die aan en door Babel liep."}],"64":[{"catchword":"vanwege het kwaad,","tekst":"Hebreeuws, van het aangezicht des kwaads; dat is, van, of vanwege het kwaad der straf, des ongevals, ongeluks, verderfs, enz."},{"catchword":"haar zal brengen,","tekst":"Babel."},{"catchword":"zij zullen mat worden","tekst":"Namelijk de Babyloniërs zullen amechtig machteloos worden en bezwijken, dat zij niet weder zullen kunnen rijzen of opkomen, hoezeer zij ook zich daarom bemoeien."},{"catchword":"Tot hiertoe","tekst":"Vergelijk boven Jer 48:47 ."},{"catchword":"woorden van Jeremia","tekst":"Te weten van Babels straf, of in het algemeen van de profetieën van Jeremia, die in dit boek begrepen en samengebracht zijn. Hieruit wordt bij sommigen afgenomen dat Jer 52 door enigen anderen man Gods daar bijgevoegd is, als tot een zegel en nadere verklaring van de voorgaande profetieën. Vergelijk de aantekening op Deu 34 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Thus saith the Lord behold I will raise up a destroy wind against Babel [meaning the Medes and Persians and compare above chapter 4.11]against Babel and against them that dwell in the heart of them that rise up against me [as we also use to say in our language in the heart of the land meaning the inhabitants of the Babel which was the chief city of the Chaldea and as it were the midst of the land see Deuteronomy 4 on verse 11.]"}],"2":[{"catchword":null,"tekst":"And I will send unto Babel fanners that shall fan her [others strangers that shall destroy her ]and empty her land for in the day of evil [that is of the mischief calamity which is ordained against her ] they shall be round [Heb have been &c spoken in a prophetical manner that is they shall assault her on every side.]"}],"3":[{"catchword":null,"tekst":"Let the archer bend his bow [Heb. let the trader tread ,&that is ,let the bender bend ,&They are the words of God to the archers of the Medes and Persians]against him that bendeth,[against the archers of Babel] and against him that lifeth himself up in the brigandine :[being heavier armed then the archers]and spare her not Babel young men ban [see Deuteronomy 2 on verse 34 and above chapter 50.21] all her hosts."}],"4":[{"catchword":null,"tekst":"That the slain may lie [Heb. properly fall but the Hebrew word is also taken for lying see above chapter 9.22 so below verse 47 and 49c] in the land of the Chaldeans and the stabbed one in her streets"}],"5":[{"catchword":null,"tekst":"For neither Israel nor Judah shall be left in widowhood of his God [ other be left no widower or no widow 7c the Hebrew word Alman is only found here signifying anyone that is or is left in any widowhood as Almana signifieth a widow the phrase hath respect to the spiritual respect that God hath made with his people be for a while so they dwelt with as if they belonged to none or as their husbands and protectors were dead and they were rejected and forsaken of him and everyone besides yet it shall not last always I will yet shew that she is my married wife and I will maintain her cause & and avenge the wrong that is done unto her compare Job 14 on verse 18] of the Lord of hosts [see 1Kings 18 on verse 15] though their land [to wit Israel and Judah others because their land the land of the Chaldeans c] be full of guilt from the holy on of Israel [or desolation &c which they have brought upon themselves by their sins others apply to the Chaldeans thus for their the Chaldean&acirc;&euro;&trade;s land is full of gui diers of the Babylonians ] for her judgment[that is punishment see above chapter 48 on verse21reacheth unto heaven and is lifted up [or lifted up itself ] to the uppermost or thinnest clouds ."}],"10":[{"catchword":null,"tekst":"The Lord hath brought forth our righteousness [the justice of our cause against Babel fro though God justly punished his people yet Babel was not therefore guiltless compare Judges 10 on verse 7 Micah 7.9 they are the words of Gods own people ] come and let us declare in Zion the work of the Lord our God."}],"11":[{"catchword":null,"tekst":"Cleanse the arrows [make them clean spoken to the Babylonians in a deriding way compare above chapter 46.4 and here verse 12] prepare thy shields perfectly [Heb full complete &c that is make them fully ready to take them with a full hand or as some gather them bring them fully together also perfect them be anything be amiss or wanting in them others fill the quivers ] the Lord hath raised up the spirit of the king of media [understand with all like wise Persia so below verse 28] for his purpose is against Babel to destroy it for this is the vengeance of the Lord the vengeance of his temple [ see above chapter 50 on verse 28]"}],"12":[{"catchword":null,"tekst":"lift up the banner upon the walls of Babel make the watch strong set watchmen prepare the ambushes [or hers in wait lurkers to watch the enemy and to disadvantage him unaware imply that all will not avail for ye shall not be able with warlike preparation to hinder Gods design and work as followeth ] for as the Lord hath purposed so hath he done [ Heb the Lord hath also taught or purposed he hath also done &c that is as so c or he hath not only purposed but also performed it that is he will also surely do it compare below verse 49] that which he spake against the inhabitants of Babel."}],"13":[{"catchword":null,"tekst":"Thou dwellest by many waters [because the great river Euphrates ran not only by but through Babel and there were many waters round a (function bouwHfdnav() {

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
