ende ik mijn mond, en Hij gaf mij die rol te eten. En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.", "Matt 27:4": "en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.", "1 Kon 18:10": "Zo waarachtig als de HEERE, uw God, leeft: er is geen volk of koninkrijk waar mijn heer niet naartoe gezonden heeft om u te zoeken; en als zij zeiden: Hij is hier niet, liet hij dat koninkrijk en dat volk zweren dat zij u niet hadden gevonden.", "Job 12:4": "Ik ben degene die zijn vriend een spot is, maar die tot God roept, Die hem verhoort; de rechtvaardige en oprechte is een spot.", "Jer 18:7-10": "In een ogenblik zal Ik spreken over een volk en over een koninkrijk, dat Ik het zal uitrukken en afbreken en verdoen; Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen. Ook zal Ik in een ogenblik spreken over een volk en over een koninkrijk, dat Ik het zal bouwen en planten;", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "Spr 21:29": "Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.", "Jer 44:8-12": "U tergt Mij door de werken van uw handen, terwijl u wierook brandt voor andere goden in het land van Egypte, waar u gekomen bent om daar als vreemdeling te verblijven; zodat u uzelf uitroeit, en zodat u wordt tot een vloek, en tot een smaad onder alle volken van de aarde? Bent u de slechtheden van uw vaderen vergeten, en de slechtheden van de koningen van Juda, en de slechtheden van hun vrouwen, en uw slechtheden, en de slechtheden van uw vrouwen, die zij gedaan hebben in het land van Juda en in de straten van Jeruzalem? Zij zijn tot op deze dag nog niet verbrijzeld van hart, en zij hebben niet gevreesd, noch gewandeld in Mijn wet en in Mijn inzettingen, die Ik voor uw aangezicht en voor het aangezicht van uw vaderen gegeven heb.", "1 Kor 4:2": "En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt.", "Ps 42:4": "Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "Rom 8:35-37": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Jer 2:25": "Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!", "2 Kor 4:1": "Omdat wij deze bediening hebben, naar de barmhartigheid die ons is bewezen, zo worden wij niet moedeloos;", "1 Joh 3:13": "Verwonder u niet, mijn broeders, als de wereld u haat.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "Jer 7:7": "dan zal Ik u in deze plaats, in het land dat Ik uw vaderen gegeven heb, laten wonen van eeuw tot eeuw.", "Jer 36:1": "Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam:", "1 Sam 15:35": "En Samuël zag Saul niet meer tot de dag van zijn dood toe; toch droeg Samuël leed om Saul; en het berouwde de HEERE, dat Hij Saul tot koning over Israël gemaakt had.", "Ezech 14:6": "Daarom, zeg tegen het huis van Israël: Zo zegt de Heere HEERE: Bekeer u, en keer u af van uw drekgoden, en keer uw aangezichten af van al uw gruwelen.", "2 Kron 34:15": "En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.", "Fil 1:29": "Want u is uit genade gegeven in de zaak van Christus, niet alleen om in Hem te geloven, maar ook om voor Hem te lijden;", "2 Kon 11:19": "En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.", "2 Tim 2:2-7": "en wat u van mij gehoord hebt onder veel getuigen, vertrouw dat toe aan trouwe mensen, die bekwaam zullen zijn om ook anderen te leren. Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus. Niemand die als soldaat dient, wikkelt zich in de zaken van het dagelijks leven, opdat hij hem kan behagen die hem tot soldaat heeft aangenomen.", "Jer 37:13": "Toen hij bij de poort van Benjamin was, was daar een wachtmeester, wiens naam Jerija was, de zoon van Selemja, de zoon van Hananja; die greep de profeet Jeremia en zei: U wilt naar de Chaldeeën overlopen!", "Jes 3:1-8": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water; De held en de krijgsman, de rechter en de profeet, en de waarzegger, en de oude; De leider van vijftig, en de aanzienlijke, en de raadsman, en de wijze onder de werkmeesters, en hem die welbespraakt is.", "2 Kon 19:14": "Toen Hizkia de brieven uit de hand van de boden ontvangen had en die gelezen had, ging hij op naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.", "Ps 115:1": "Niet ons, o HEERE, niet ons, maar geef aan Uw Naam eer, om Uw goedertierenheid, om Uw waarheid.", "Ezech 3:26": "En Ik zal uw tong aan uw gehemelte doen kleven, zodat u stom worden zult, en hun niet zult zijn tot een bestraffende man; want zij zijn een opstandig huis.", "Amos 4:12": "Daarom zal Ik u zo doen, Israël! Omdat Ik u dan dit doen zal, maak u dan gereed, Israël, om uw God te ontmoeten.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "2 Kon 17:28": "Zo kwam een van de priesters die zij van Samaria weggevoerd hadden, en woonde te Beth-El; en hij leerde hun hoe zij de HEERE vrezen moesten.", "Hand 26:16-18": "Maar richt u op en sta op uw voeten; want hiertoe ben Ik u verschenen, om u aan te stellen tot een dienaar en getuige, zowel van de dingen die u gezien hebt als van de dingen waarin Ik u nog zal verschijnen; En zal u verlossen van dit volk en van de heidenen, tot wie Ik u nu zend; Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Matt 27:25": "En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen.", "Jer 29:22": "En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;", "Jer 23:22": "Maar als zij in Mijn raad hadden gestaan, dan zouden zij Mijn volk Mijn woorden hebben laten horen, en zouden hen hebben afgekeerd van hun boze weg, en van de boosheid van hun handelingen.", "Mark 1:4": "Johannes doopte in de woestijn en predikte de doop van bekering tot vergeving van de zonden.", "Ps 51:15": "Zo zal ik de overtreders Uw wegen leren; en de zondaars zullen zich tot U bekeren.", "Joh 18:20": "Jezus antwoordde hem: Ik heb vrijuit gesproken tot de wereld; Ik heb altijd onderwezen in de synagoge en in de tempel, waar de Joden van alle plaatsen samenkomen; en in het verborgen heb Ik niets gesproken.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Joh 8:20": "Deze woorden sprak Jezus bij de schatkist, terwijl Hij leerde in de tempel; en niemand greep Hem, want Zijn uur was nog niet gekomen.", "1 Tim 1:3": "Zoals ik u vermaand heb dat u in Efeze zou blijven, toen ik naar Macedonië reisde, zo vermaan ik het u nog, opdat u sommigen zou bevelen geen andere leer te leren;", "Jer 8:4-22": "Zeg verder tegen hen: Zo zegt de HEERE: Zal men vallen, en niet weer opstaan? Zal men afkeren, en niet terugkeren? Waarom keert dit volk van Jeruzalem dan af, met een altijddurende afkering? Zij houden vast aan bedrog, zij weigeren terug te keren. Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd.", "Hand 23:1-7": "En Paulus keek de raad recht aan en zei: Mannen broeders! Ik heb met een geheel goed geweten voor God geleefd tot op deze dag. Maar de hogepriester Ananias beval hun die bij hem stonden dat zij hem op de mond zouden slaan. Toen zei Paulus tegen hem: God zal u slaan, u witgepleisterde muur! Zit u daar om mij naar de wet te oordelen, en beveelt u, tegen de wet in, dat men mij zal slaan?", "Gen 6:6": "Toen had de HEERE er berouw van, dat Hij de mens op de aarde gemaakt had, en het smartte Hem aan Zijn hart.", "Hand 5:29-32": "Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen. De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen. Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Joh 13:17": "Als u deze dingen weet, gelukkig bent u als u ze doet.", "Openb 2:3": "En u hebt verdragen, en hebt geduld; en u hebt om Mijn Naam gearbeid, en bent niet moe geworden.", "Zach 8:21": "En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan.", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "Jer 7:2": "Sta in de poort van het huis van de HEERE, en roep daar dit woord uit, en zeg: Hoor het woord van de HEERE, heel Juda! U die door deze poorten ingaat om de HEERE te aanbidden.", "2 Kron 36:14": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.", "Ps 69:11": "En ik heb geweend in het vasten van mijn ziel; maar het is mij tot allerlei smaad geworden.", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "Hos 14:2-5": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Jer 29:19": "Omdat zij naar Mijn woorden niet geluisterd hebben, spreekt de HEERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.", "Ps 71:18": "Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht.", "Deut 9:19": "Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment.", "Hebr 6:18": "opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "1 Kon 8:42": "(want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis;", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Jer 33:19": "En het woord van de HEERE kwam tot Jeremia, en Hij zei:", "1 Tim 2:7": "waartoe ik gesteld ben als prediker en apostel (ik zeg de waarheid in Christus, ik lieg niet), een leraar van de heidenen, in geloof en waarheid.", "Jer 35:15": "En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opgestaan en gezonden, om te zeggen: Bekeer u toch, ieder van zijn boze weg, en maak uw daden goed, en volg andere goden niet na om hen te dienen, dan zult u in het land blijven dat Ik u en uw vaderen gegeven heb; maar u hebt uw oor niet geneigd, en naar Mij niet geluisterd.", "Jer 3:12-14": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden. Erken alleen uw ongerechtigheid, dat u tegen de HEERE, uw God, overtreden hebt, en uw wegen verspreid hebt naar de vreemden, onder elke groene boom, maar u bent Mijn stem niet gehoorzaam geweest, spreekt de HEERE. Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.", "Luk 6:23": "Verblijd u op die dag, en wees vrolijk; want zie, uw loon is groot in de hemel; want hun vaders deden hetzelfde met de profeten.", "Jes 37:32": "Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.", "2 Kron 31:20": "Zo deed Hizkia in heel Juda; en hij deed wat goed, en recht, en waarachtig was, voor het aangezicht van de HEERE, zijn God.", "Hand 5:40-42": "En zij gaven hem gehoor; en toen zij de apostelen bij zich geroepen hadden, geselden zij hen, en geboden hun dat zij niet zouden spreken in de Naam van Jezus; en lieten hen gaan. Zij dan gingen heen van voor de raad, verblijd dat zij waardig geacht waren om vanwege Zijn Naam smaad te lijden. En zij hielden niet op, elke dag, in de tempel en bij de huizen, te leren, en Jezus Christus te verkondigen.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Ef 4:12": "Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus;", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Hand 25:4": "Maar Festus antwoordde dat Paulus in Cesarea bewaakt werd, en dat hijzelf binnenkort daarheen zou reizen.", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Jes 66:4": "Ik zal ook hun loon kiezen naar hun handelingen, en hun angsten zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet luisterden, maar deden wat kwaad is in Mijn ogen, en kozen wat Ik niet wilde.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Ps 40:8-11": "Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand. Ik verkondig de gerechtigheid in de grote gemeente; zie, mijn lippen bedwing ik niet; HEERE! Gij weet het.", "Jer 17:26": "En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Hand 6:2": "En de twaalf riepen de menigte van de discipelen bij zich en zeiden: Het is niet passend dat wij het Woord van God verwaarlozen om de tafels te bedienen.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Mark 15:11": "Maar de overpriesters brachten de menigte ertoe dat hij hun liever Barabbas zou loslaten.", "Joël 2:15-18": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Jer 37:9": "Zo zegt de HEERE: Bedrieg uzelf niet door te zeggen: De Chaldeeën zullen zeker van ons wegtrekken; want zij zullen niet wegtrekken.", "Pred 12:13": "Van alles wat gehoord is, is dit de slotsom: Vrees God, en houd Zijn geboden, want dit is de hele plicht van de mens.", "Ps 94:5": "O HEERE! Zij verbrijzelen Uw volk, en zij verdrukken Uw erfdeel.", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Hab 2:2": "Toen antwoordde de HEERE mij, en zei: Schrijf het visioen op, en zet het duidelijk op tafels, zodat wie voorbijloopt het kan lezen.", "Luk 22:32": "maar Ik heb voor u gebeden, dat uw geloof niet ophoudt; en u, als u eens bekeerd bent, versterk dan uw broeders.", "Ps 51:19": "De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.", "Joh 17:14": "Ik heb hun Uw woord gegeven; en de wereld heeft hen gehaat, omdat zij niet van de wereld zijn, zoals Ik niet van de wereld ben.", "Joh 8:59": "Toen namen zij stenen op om die op Hem te werpen. Maar Jezus verborg Zich, en ging de tempel uit, terwijl Hij door hun midden ging; en zo ging Hij weg.", "2 Kon 19:25": "Hebt u niet gehoord dat Ik dit lang van tevoren gedaan heb, en het van oude dagen af gevormd heb? Nu heb Ik het laten komen, dat u de versterkte steden zou verstoren tot puinhopen.", "Jer 7:6": "de vreemdeling, de wees en de weduwe niet zult verdrukken, en geen onschuldig bloed in deze plaats zult vergieten, en andere goden niet zult nawandelen, u zelf tot kwaad;", "Job 11:13-15": "Als u uw hart klaargemaakt hebt, breid dan uw handen tot Hem uit. Als er ondeugd in uw hand is, doe die ver weg; en laat het onrecht in uw tenten niet wonen. Want dan zult u uw gezicht opheffen zonder smet, en zult vast staan, en niet vrezen.", "Hand 4:8-13": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël! Als wij vandaag ondervraagd worden over de weldaad aan een zieke mens gedaan, waardoor hij gezond geworden is; Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, zeg ik, staat deze man hier gezond voor u.", "Luk 6:22": "Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen.", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Jer 26:4-6": "Zeg dan tot hen: Zo zegt de HEERE: Als u naar Mij niet zult horen, om te wandelen in Mijn wet, die Ik voor uw aangezicht gegeven heb; Door te horen naar de woorden van Mijn knechten, de profeten, die Ik tot u zend, ja, vroeg opstaand en zendend; maar u niet gehoord hebt; Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek voor alle volken van de aarde.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Dan 5:4-29": "Zij dronken de wijn, en prezen de gouden, zilveren, koperen, ijzeren, houten en stenen goden. Op datzelfde moment kwamen er vingers van een mensenhand tevoorschijn, die schreven tegenover de kandelaar, op de kalk van de wand van het koninklijk paleis, en de koning zag het deel van de hand die daar schreef. Toen veranderde de gezichtskleur van de koning, en zijn gedachten verschrikten hem; en de banden van zijn heupen werden los, en zijn knieën stootten tegen elkaar aan.", "Jer 38:20": "En Jeremia zei: Zij zullen u niet overgeven; wees toch gehoorzaam aan de stem van de HEERE, die ik tot u spreek; zo zal het u goed gaan, en zal uw leven behouden blijven.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Deut 26:16-18": "Op deze dag gebiedt de HEERE, uw God, u deze inzettingen en rechten te doen; houd ze dan en doe ze, met heel uw hart en met heel uw ziel. Heden hebt u de HEERE laten zeggen dat Hij u tot een God zal zijn, en dat u zult wandelen in Zijn wegen, en Zijn inzettingen houden, en Zijn geboden, en Zijn rechten, en dat u Zijn stem zult gehoorzamen. En de HEERE heeft u heden laten zeggen dat u Hem tot een volk van het eigendom zult zijn, zoals Hij u gesproken heeft, en dat u al Zijn geboden zult houden;", "Rom 11:23": "Maar ook zij, als zij in het ongeloof niet blijven, zullen ingeënt worden; want God is machtig om hen weer in te enten.", "2 Kon 25:9": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Hab 1:2-4": "HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet! Waarom laat U mij ongerechtigheid zien, en aanschouwt U de kwelling? Want verwoesting en geweld is tegen mij, en er is twist, en men neemt gekijf op. Daarom wordt de wet losgelaten, en het recht komt nooit meer voort; want de goddeloze omringt de rechtvaardige; daarom komt het recht verdraaid voort.", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "Amos 7:3": "Toen kreeg de HEERE berouw hierover; het zal niet gebeuren, zei de HEERE.", "Jer 26:10-24": "Toen nu de vorsten van Juda deze woorden hoorden, gingen zij op uit het huis van de koning naar het huis van de HEERE; en zij zetten zich bij de deur van de nieuwe poort van de HEERE. Toen spraken de priesters en de profeten tot de vorsten en tot al het volk, en zeiden: Deze man verdient de dood, want hij heeft geprofeteerd tegen deze stad, zoals u met uw eigen oren gehoord hebt. Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "2 Kor 12:10": "Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.", "Jer 45:1": "Het woord dat de profeet Jeremia gesproken heeft tot Baruch, de zoon van Nerija, toen hij deze woorden uit de mond van Jeremia in een boek schreef, in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda:", "Matt 27:20": "Maar de overpriesters en de oudsten haalden de menigte over dat zij Barabbas zouden vragen, en Jezus zouden laten doden.", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Jer 1:17-19": "U dan, omgord uw lendenen, en maak u op, en spreek tot hen alles wat Ik u gebieden zal; wees niet verslagen voor hun aangezicht, opdat Ik u niet versla voor hun aangezicht. Want zie, Ik stel u vandaag tot een vaste stad, en tot een ijzeren pilaar, en tot koperen muren tegen het hele land; tegen de koningen van Juda, tegen haar vorsten, tegen haar priesters, en tegen het volk van het land. En zij zullen tegen u strijden, maar tegen u niets vermogen; want Ik ben met u, spreekt de HEERE, om u eruit te helpen.", "Jes 37:33": "Daarom, zo zegt de HEERE van de koning van Assyrië: Hij zal in deze stad niet komen, en er ook geen pijl inschieten; ook zal hij niet met een schild ervoor komen, en geen wal daartegen opwerpen.", "1 Kon 8:33-50": "Wanneer Uw volk Israël verslagen wordt voor het aangezicht van de vijand, omdat zij tegen U gezondigd zullen hebben, en zich tot U bekeren, en Uw Naam belijden, en tot U in dit huis bidden en smeken zullen; hoor Ú dan in de hemel, en vergeef de zonde van Uw volk Israël, en breng hen terug in het land, dat U hun vaderen gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij op deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Ex 32:14": "Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.", "1 Kon 19:1-3": "Achab vertelde Izebel alles wat Elia gedaan had, en ook dat hij alle profeten met het zwaard gedood had. Toen stuurde Izebel een bode naar Elia, om te zeggen: Zo mogen de goden mij doen, en nog erger, als ik uw leven niet morgen omstreeks deze tijd maak als het leven van één van hen. Toen hij dat zag, maakte hij zich op en ging heen om zijn leven te redden, en kwam in Berseba, dat in Juda ligt, en liet zijn knecht daar.", "1 Sam 7:2": "En het gebeurde, vanaf die dag, dat de ark van de Heere in Kirjath-jearim bleef, en de tijd werd lang; het werden twintig jaar; en heel het huis van Israël klaagde de HEERE achterna.", "Hand 8:35": "En Filippus deed zijn mond open en begon vanaf datzelfde Schriftgedeelte, en verkondigde hem Jezus.", "Ezech 33:8": "Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "Jer 7:13-34": "En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt; daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb. En Ik zal u van Mijn aangezicht wegwerpen, zoals Ik al uw broeders, het hele nageslacht van Efraïm, weggeworpen heb.", "Jer 1:8": "Vrees niet voor hun aangezicht, want Ik ben met u, om u te redden, spreekt de HEERE.", "Jer 18:18": "Toen zeiden zij: Kom, laten wij gedachten tegen Jeremia denken; want de wet zal niet vergaan van de priester, evenmin de raad van de wijze, of het woord van de profeet; kom, laten wij hem slaan met de tong, en laten wij niet luisteren naar enig van zijn woorden!", "Fil 2:22": "En u kent zijn beproefdheid, dat hij, zoals een kind zijn vader dient, met mij gediend heeft in het Evangelie.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Ps 78:8": "En dat zij niet zouden worden zoals hun vaders, een opstandig en weerspannig geslacht; een geslacht dat zijn hart niet richtte, en waarvan de geest niet trouw was met God.", "1 Kron 21:15": "En God zond een engel naar Jeruzalem, om die te verderven; en toen hij haar verdierf, zag de HEERE het, en het berouwde Hem over dat kwaad; en Hij zei tegen de verdervende engel: Het is genoeg, trek nu uw hand terug. De engel van de HEERE nu stond bij de dorsvloer van Ornan, de Jebusiet.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Deut 9:18": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "Matt 5:44": "Maar Ik zeg u: heb uw vijanden lief; zegen hen die u vervloeken; doe goed aan hen die u haten; en bid voor hen die u geweld aandoen en die u vervolgen;", "2 Kor 6:5": "in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Jer 13:27": "Uw overspelen en uw hunkeringen, de schandelijkheid van uw hoererij, op heuvels, in het veld; Ik heb uw gruwelen gezien; wee u, Jeruzalem! Zult u niet rein worden? Hoe lang nog hierna?", "Hand 7:51": "U hardnekkigen en onbesnedenen van hart en oren, u weerstaat altijd de Heilige Geest; zoals uw vaders deden, zo doet u ook.", "Jes 1:16-19": "Was u, reinig u, doe de boosheid van uw handelingen van voor Mijn ogen weg, houd op met kwaad te doen. Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe. Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Matt 4:17": "Van toen af aan begon Jezus te prediken en te zeggen: Bekeer u; want het Koninkrijk der hemelen is nabijgekomen.", "1 Tim 6:14": "dat u dit gebod houdt, onbevlekt en onberispelijk, tot de verschijning van onze Heere Jezus Christus;", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "Deut 11:32": "Neem dan waar te doen al de inzettingen en de rechten, die ik u heden voorstel.", "Matt 24:48-51": "Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg, en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Ezech 38:17": "Zo zegt de Heere HEERE: Bent u die, over wie Ik in vroegere dagen gesproken heb, door de dienst van Mijn knechten, de profeten van Israël, die in die dagen geprofeteerd hebben, jarenlang, dat Ik u tegen hen zou aanbrengen?", "Jer 18:8": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Joh 12:42": "Toch geloofden ook zelfs velen van de leiders in Hem; maar om de Farizeeën beleden zij het niet, opdat zij niet uit de synagoge geworpen zouden worden.", "Ps 7:14": "En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ef 4:32": "Maar wees jegens elkaar goedertieren, barmhartig, en vergeef elkaar, zoals ook God in Christus u vergeven heeft.", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "2 Kor 4:5": "Want wij prediken niet onszelf, maar Christus Jezus, de Heere; en onszelf als uw dienaars, om Jezus' wil.", "Hebr 11:25-27": "en verkoos hij liever met het volk van God slecht behandeld te worden, dan voor een tijd van de genietingen van de zonde te hebben; en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon. Door het geloof heeft hij Egypte verlaten, zonder bang te zijn voor de toorn van de koning; want hij hield vol, als iemand die de Onzichtbare ziet.", "Luk 17:33": "Wie zijn leven zal zoeken te behouden, zal het verliezen; en wie het zal verliezen, zal het in het leven behouden.", "1 Tim 4:12-16": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid. Houd aan met het voorlezen, met het vermanen, met het onderwijzen, totdat ik kom. Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap.", "Hand 11:26": "en toen hij hem gevonden had, bracht hij hem naar Antiochië. En het gebeurde dat zij een heel jaar samenkwamen in de gemeente en een grote menigte onderwezen; en dat de discipelen voor het eerst in Antiochië Christenen genoemd werden.", "Jes 42:22-25": "Maar nu is het een beroofd en geplunderd volk; zij zijn allen verstrikt in de holen, en verstopt in de gevangenissen; zij zijn tot een roof geworden, en er is niemand die ze redt; tot een plundering, en niemand zegt: Geef ze terug. Wie onder u neemt dit ter harte? Wie merkt op en hoort, wat hierna zijn zal? Wie heeft Jakob tot een plundering overgegeven, en Israël aan de rovers? Is het niet de HEERE, Hij, tegen Wie wij gezondigd hebben? Want zij wilden niet wandelen in Zijn wegen, en zij luisterden niet naar Zijn wet.", "2 Kor 5:9": "Daarom stellen wij er ook alles aan, hetzij wij thuis zijn, hetzij afwezig, om Hem welgevallig te zijn.", "Joh 19:7": "De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelf Gods Zoon gemaakt.", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Num 23:12": "Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?", "Job 2:5": "Strek toch Uw hand uit, en tast zijn gebeente en zijn vlees aan; dan zal hij U beslist in Uw aangezicht vervloeken!", "Jer 28:1": "Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Hand 16:4": "En terwijl zij de steden doorreisden, gaven zij hun de verordeningen door die door de apostelen en de oudsten in Jeruzalem waren vastgesteld, om die te onderhouden.", "1 Tim 6:17-21": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten; dat zij goed doen, rijk worden in goede werken, vrijgevig zijn en bereid om te delen; en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Matt 10:5": "Deze twaalf heeft Jezus uitgezonden, en Hij gaf hun bevel en zei: U moet niet heengaan op de weg van de heidenen, en u moet niet ingaan in enige stad van de Samaritanen.", "Jer 40:9": "En Gedalia, de zoon van Ahikam, de zoon van Safan, zwoer hun en hun mannen, en zei: Wees niet bang om de Chaldeeën te dienen; blijf in het land, en dien de koning van Babel, dan zal het u goed gaan.", "Matt 7:6": "Geef het heilige niet aan de honden, en gooi uw parels niet voor de zwijnen; anders vertrappen ze die met hun poten, en verscheuren u nadat ze zich hebben omgekeerd.", "Joh 4:35-38": "Zegt u niet: Het zijn nog vier maanden, en dan komt de oogst? Zie, Ik zeg u: Sla uw ogen op en bekijk de velden; want ze zijn al wit om te oogsten. En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait. Want hierin is dat gezegde waar: De één is het die zaait, en de ander die maait.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Ezech 33:9": "Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Ezech 46:3": "Ook zal het volk van het land aanbidden voor de deur van die poort, op de sabbatten en op de nieuwe manen, voor het aangezicht van de HEERE.", "Hand 7:52": "Wie van de profeten hebben uw vaders niet vervolgd? En zij hebben degenen gedood die van tevoren de komst van de Rechtvaardige verkondigd hebben, van Wie u nu verraders en moordenaars geworden bent.", "Hand 9:14": "en hij heeft hier macht van de overpriesters om allen te binden die Uw Naam aanroepen.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "2 Kon 22:12-14": "En de koning gebood Hilkia, de priester, en Ahikam, de zoon van Safan, en Achbor, de zoon van Michaja, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei: Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is. Toen ging de priester Hilkia, en Ahikam, en Achbor, en Safan, en Asaja naar de profetes Hulda, de vrouw van Sallum, de zoon van Tikva, de zoon van Harhas, de klederbewaarder (zij woonde nu te Jeruzalem, in het tweede deel), en zij spraken met haar.", "Jona 3:10": "En God zag hun werken, dat zij zich bekeerden van hun boze weg; en het berouwde God over het kwaad, dat Hij gesproken had hun te zullen doen, en Hij deed het niet.", "Jer 43:8": "Toen kwam het woord van de HEERE tot Jeremia te Tachpanhes, en Hij zei:", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "1 Petr 3:17": "Want het is beter, als het de wil van God is, dat u lijdt om het goeddoen, dan om het kwaaddoen.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Mal 4:4": "Denk aan de wet van Mozes, Mijn knecht, die Ik hem geboden heb op Horeb voor heel Israël, met de inzettingen en rechten.", "Matt 5:10-12": "Zalig zijn zij die vervolgd worden om de gerechtigheid, want hun is het Koninkrijk der hemelen. Zalig bent u, als de mensen u smaden en vervolgen, en liegend allerlei kwaad tegen u spreken, omwille van Mij. Verblijd en verheug u, want uw loon is groot in de hemelen; want zo hebben zij de profeten vervolgd die vóór u geweest zijn.", "2 Tim 1:6-8": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen. Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid. Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "2 Kor 8:1-5": "Verder maken wij u bekend, broeders, de genade van God, die in de gemeenten van Macedonië gegeven is. Dat in veel beproeving van de verdrukking de overvloed van hun blijdschap, en hun zeer diepe armoede overvloedig geweest is tot de rijkdom van hun goeddadigheid. Want zij zijn naar vermogen (ik betuig het), ja, boven vermogen gewillig geweest;", "Ex 32:31": "Zo keerde Mozes terug tot de HEERE, en zei: Och, dit volk heeft een grote zonde gezondigd, doordat zij zich gouden goden gemaakt hebben.", "Matt 26:3": "Toen kwamen de overpriesters en de Schriftgeleerden en de oudsten van het volk samen in de zaal van de hogepriester, die Kajafas genoemd werd;", "2 Kor 7:15": "En zijn innerlijke bewegingen zijn des te overvloediger jegens u, wanneer hij denkt aan de gehoorzaamheid van u allen, hoe u hem met vrees en beven hebt ontvangen.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Jer 21:10": "Want Ik heb Mijn gezicht tegen deze stad gesteld ten kwade en niet ten goede, spreekt de HEERE; zij zal gegeven worden in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "Deut 4:1-40": "Israël! hoor naar de inzettingen en de rechten die ik u leer te doen, opdat u leeft, en het land binnentrekt en in bezit neemt dat de HEERE, de God van uw vaderen, u geeft. U mag aan dit woord, dat ik u gebied, niets toevoegen, en er ook niets van afdoen; opdat u de geboden bewaart van de HEERE, uw God, die ik u gebied. Uw ogen hebben gezien wat God bij Baäl-peor gedaan heeft; want ieder man die Baäl-peor navolgde, die heeft de HEERE, uw God, uit uw midden weggevaagd.", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "2 Kor 12:19": "Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw.", "Openb 17:6": "En ik zag dat de vrouw dronken was van het bloed van de heiligen, en van het bloed van de getuigen van Jezus. En ik verwonderde mij, toen ik haar zag, met grote verwondering.", "Ps 119:95": "De goddelozen hebben op mij gewacht, om mij te doen vergaan; ik neem acht op Uw getuigenissen.", "1 Tim 1:18": "Dit gebod beveel ik u, mijn zoon Timotheüs, dat u naar de profetieën die eerder over u uitgesproken zijn, daarmee de goede strijd strijdt;", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "1 Kor 4:21": "Wat wilt u? Zal ik met de roede naar u toe komen, of in liefde en in de geest van zachtmoedigheid?", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Ps 119:161": "Schin. De vorsten hebben mij vervolgd zonder oorzaak; maar mijn hart heeft gevreesd voor Uw woord.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "1 Kor 13:3": "En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "1 Tim 5:19-22": "Neem tegen een ouderling geen beschuldiging aan, dan alleen op grond van twee of drie getuigen. Bestraf hen die zondigen in aanwezigheid van allen, opdat ook de anderen ontzag mogen hebben. Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Jer 42:10": "Als u in dit land blijft wonen, dan zal Ik u bouwen en niet afbreken, en u planten en niet uitrukken; want Ik heb berouw over het kwaad dat Ik u aangedaan heb.", "Deut 4:44": "Dit is nu de wet die Mozes de kinderen van Israël voorlegde:", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Jer 11:19": "En ik was als een lam, als een os, die geleid wordt om geslacht te worden; want ik wist niet dat zij plannen tegen mij beraamden, en zeiden: Laten wij de boom met zijn vrucht verderven, en laten wij hem uit het land van de levenden uitroeien, zodat aan zijn naam niet meer gedacht wordt.", "2 Tim 4:2": "Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs.", "Ps 38:21": "En die kwaad voor goed vergelden, staan mij tegen, omdat ik het goede najaag.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Jer 32:33": "Die Mij de nek toegekeerd hebben en niet het aangezicht; hoewel Ik hen leerde, vroeg opstaand en lerend, evenwel luisterden zij niet, om tucht aan te nemen;", "Jer 6:17": "Ik heb ook wachters over u gesteld, en gezegd: Luistert naar het geluid van de bazuin; maar zij zeggen: Wij zullen niet luisteren.", "Hebr 13:16": "En vergeet de weldadigheid en de mededeelzaamheid niet; want aan zulke offers heeft God een welgevallen.", "Openb 18:20-24": "Bedrijf vreugde over haar, u hemel, en u heilige apostelen en profeten, want God heeft uw oordeel aan haar voltrokken. En een sterke engel hief een steen op als een grote molensteen, en wierp die in de zee, en zei: Zo zal de grote stad Babylon met geweld neergeworpen worden, en zal niet meer gevonden worden. En de stem van citerspelers, en zangers, en fluiters, en bazuinblazers, zal in u niet meer gehoord worden; en geen enkele kunstenaar van welke kunst dan ook zal meer in u gevonden worden; en het geluid van de molen zal in u niet meer gehoord worden.", "Hand 1:21": "Het is dan nodig dat van de mannen die met ons omgegaan hebben al de tijd waarin de Heere Jezus onder ons in- en uitgegaan is,", "Mal 2:2": "Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Jer 36:10": "Zo las Baruch in dat boek de woorden van Jeremia in het huis van de HEERE, in de kamer van Gemarja, de zoon van Safan, de schrijver, in het bovenste voorhof, bij de deur van de nieuwe poort van het huis van de HEERE, voor de oren van het hele volk.", "Kol 1:7": "Zoals u ook geleerd hebt van Epafras, onze geliefde mededienstknecht, die een trouw dienaar van Christus is voor u;", "Deut 8:16-20": "Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed; En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "Kol 1:24": "die mij nu verblijd in mijn lijden voor u, en aanvult in mijn vlees wat nog ontbreekt aan de verdrukkingen van Christus, voor Zijn lichaam, dat is de Gemeente;", "Job 22:23": "Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "Jes 37:4": "Misschien zal de HEERE, uw God, de woorden horen van Rabsaké, aan wie zijn heer, de koning van Assyrië, gezonden heeft, om de levende God te honen en te schelden met woorden die de HEERE, uw God, gehoord heeft; hef dan een gebed op voor het overblijfsel dat nog gevonden wordt.", "Ezech 33:19": "En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "2 Kron 29:15": "En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.", "Nahum 1:15": "Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid.", "Hand 8:25": "Zij dan nu, toen zij het Woord van de Heere betuigd en gesproken hadden, keerden terug naar Jeruzalem, en verkondigden het Evangelie in veel dorpen van de Samaritanen.", "2 Kor 4:8-12": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven; Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Openb 2:16": "Bekeer u; en zo niet, Ik zal u haastig bij komen, en zal tegen hen strijd voeren met het zwaard van Mijn mond.", "Matt 10:16-18": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven. Maar wees op uw hoede voor de mensen; want zij zullen u overleveren aan de raadsvergaderingen, en zij zullen u geselen in hun synagogen; En u zult ook voor stadhouders en koningen geleid worden, om Mij, tot een getuigenis voor hen en de heidenen.", "Hebr 12:17": "Want u weet dat hij ook daarna, toen hij de zegening wilde erven, verworpen werd; want hij vond geen gelegenheid tot berouw, hoewel hij het met tranen zocht.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Luk 15:1-10": "En alle tollenaars en zondaars kwamen naar Hem toe, om Hem te horen. En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen. En Hij sprak deze gelijkenis tegen hen, en zei:", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Jer 33:23": "Verder kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Hos 4:17": "Efraïm is met de afgoden verbonden; laat hem begaan.", "Openb 2:13": "Ik weet uw werken, en waar u woont; namelijk daar waar de troon van de satan is, en u houdt Mijn Naam vast, en hebt Mijn geloof niet verloochend, ook in die dagen waarin Antipas, Mijn getrouwe getuige, gedood is bij u, daar waar de satan woont.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Micha 1:14": "Daarom geef geschenken aan Morescheth-gaths; de huizen van Achzib zullen de koningen van Israël tot een leugen zijn.", "Jer 20:8-11": "Want zo vaak ik spreek, roep ik uit, roep ik geweld en verwoesting; omdat het woord van de HEERE mij de hele dag tot smaad en spot is. Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet. Want ik heb de kwaadsprekerij van velen gehoord, schrik van alle kanten. \"Geef ons te kennen,\" zeggen ze, \"en wij zullen het bekendmaken\"; al mijn vertrouwde vrienden letten op mijn struikelen; ze zeggen: \"Misschien laat hij zich overhalen, dan zullen wij de overhand over hem krijgen, en onze wraak op hem nemen.\"", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "Joh 20:23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "Jer 25:18": "Namelijk Jeruzalem en de steden van Juda, en haar koningen, en haar vorsten; om die te stellen tot een woestheid, tot een ontzetting, tot een aanfluiting en tot een vloek, zoals het is op deze dag;", "Ps 12:9": "De goddelozen lopen rond aan alle kanten, wanneer de snoodsten van de mensenkinderen verhoogd worden.", "Ps 42:11": "Met een doodsteek in mijn beenderen honen mij mijn tegenstanders, als zij de hele dag tegen mij zeggen: Waar is uw God?", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Ezech 18:28": "Omdat hij toeziet, en zich bekeert van al zijn overtredingen, die hij gedaan heeft, zal hij zeker leven, hij zal niet sterven.", "Luk 3:19": "Maar toen Herodes, de viervorst, door hem bestraft werd vanwege Herodias, de vrouw van Filippus, zijn broer, en vanwege alle slechte dingen die Herodes gedaan had,", "Jak 2:6": "Maar u hebt de arme oneer aangedaan. Onderdrukken de rijken u niet, en trekken zij u niet voor de rechterstoelen?", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Luk 1:10": "En heel de menigte van het volk was buiten aan het bidden, op het uur van het reukoffer.", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "Mark 2:17": "En Jezus hoorde dat, en zei tegen hen: Wie gezond zijn, hebben de dokter niet nodig, maar wie ziek zijn. Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars tot bekering.", "Jer 5:21-24": "Hoor nu dit, dwaas en harteloos volk! die ogen hebben, maar niet zien, die oren hebben, maar niet horen. Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan. Maar dit volk heeft een afvallig en opstandig hart; zij zijn afgevallen en weggegaan;", "Num 15:38-40": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten. En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert; Opdat u denkt aan en doet al Mijn geboden, en voor uw God heilig bent.", "Dan 3:16": "Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.", "1 Kon 3:1": "En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.", "Hand 16:19-22": "Toen de heren van haar nu zagen dat de hoop op hun gewin weg was, grepen zij Paulus en Silas, en sleepten hen naar de markt, voor de leiders. En toen zij hen tot de aanvoerders gebracht hadden, zeiden zij: Deze mensen brengen onze stad in opschudding, omdat zij Joden zijn. En zij verkondigen gewoonten die wij niet mogen aannemen, noch mogen navolgen, omdat wij Romeinen zijn.", "Jer 24:9": "En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben;", "Jer 25:2": "Dat de profeet Jeremia gesproken heeft tot het hele volk van Juda, en tot alle inwoners van Jeruzalem, en hij zei:", "Matt 14:10": "en hij stuurde iemand heen, en onthoofdde Johannes in de kerker.", "Jes 46:12": "Hoor naar Mij, u die hardnekkig van hart bent, u, die ver van de gerechtigheid zijt!", "Matt 11:16-24": "Maar waarbij zal Ik dit geslacht vergelijken? Het is gelijk aan de kinderen, die op de markten zitten, en hun vrienden toeroepen, En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend. Want Johannes is gekomen, niet etend, niet drinkend, en zij zeggen: Hij heeft de duivel.", "Matt 23:34": "Daarom, zie, Ik zend tot u profeten, en wijzen, en schriftgeleerden, en van hen zult u sommigen doden en kruisigen, en sommigen van hen zult u geselen in uw synagogen, en vervolgen van stad tot stad;", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "1 Kon 7:40": "Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:", "Joh 4:34": "Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.", "2 Kon 11:15": "Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Jes 48:8": "Ook hebt u ze niet gehoord, ook hebt u ze niet geweten, ook van toen af is uw oor niet geopend geweest; want Ik heb geweten, dat u volledig trouweloos zou handelen, en dat u van de buik af een overtreder genoemd bent.", "2 Kon 20:5": "Keer terug en zeg tegen Hizkia, de leider van Mijn volk: Zo zegt de HEERE, de God van uw vader David: Ik heb uw gebed gehoord, Ik heb uw tranen gezien; zie, Ik zal u gezond maken; op de derde dag zult u opgaan naar het huis van de HEERE;", "1 Tess 1:6": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest;", "Jer 7:5": "Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Luk 21:37": "Overdag was Hij lerend in de tempel; maar 's nachts ging Hij uit, en overnachtte op de berg die de Olijfberg genoemd wordt.", "Jer 26:12-16": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt; Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft. Maar ik, zie, ik ben in uw handen; doe met mij zoals het goed en recht is in uw ogen;", "Hos 2:6": "En zij zal haar minnaars nalopen, maar hen niet aantreffen; en zij zal hen zoeken, maar niet vinden; dan zal zij zeggen: Ik zal heengaan, en terugkeren naar mijn vorige Man, want toen ging het mij beter dan nu.", "Jes 46:13": "Ik breng Mijn gerechtigheid nabij, zij zal niet ver weg zijn, en Mijn heil zal niet uitblijven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid.", "Jer 17:16": "Ik heb toch niet aangedrongen, meer dan een herder achter U betaamde; ook heb ik de dodelijke dag niet begeerd, Gij weet het; wat uit mijn lippen is gegaan, is voor Uw aangezicht geweest.", "Amos 5:4-6": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef. Maar zoek Beth-el niet, en kom niet naar Gilgal, en trek niet over naar Ber-seba; want Gilgal zal zeker in gevangenschap weggevoerd worden, en Beth-el zal tot niets worden. Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Jer 37:14": "En Jeremia zei: Dat is niet waar, ik wil niet naar de Chaldeeën overlopen. Maar hij luisterde niet naar hem; Jerija greep Jeremia vast en bracht hem naar de vorsten.", "1 Petr 4:3": "Want het is ons genoeg dat wij in de voorgaande tijd van ons leven de wil van de heidenen volbracht hebben, en geleefd hebben in losbandigheid, begeerten, dronkenschap, zwelgpartijen, drinkgelagen en gruwelijke afgoderij;", "Klaagl 4:14": "Nun. Zij zwierven als blinden op de straten, zij waren met bloed besmet, zodat men niet kon zien of men hun kleren aanraakte.", "Jer 18:10": "Maar als het doet wat kwaad is in Mijn ogen, dat het naar Mijn stem niet luistert, dan zal Ik berouw hebben over het goede waarmee Ik gezegd had hen te zullen weldoen.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Jer 11:7": "Want Ik heb uw vaderen ernstig betuigd, op de dag dat Ik hen uit Egypteland opvoerde, tot op deze dag, vroeg opstaand en betuigend, en Ik zei: Hoor naar Mijn stem!", "Num 35:34": "Verontreinig dan het land niet, waarin u gaat wonen, in het midden waarvan Ik wonen zal; want Ik ben de HEERE, die woont in het midden van de Israëlieten.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "1 Joh 3:1": "Zie, hoe grote liefde de Vader ons gegeven heeft, namelijk dat wij kinderen van God genoemd zouden worden. Daarom kent de wereld ons niet, omdat zij Hem niet kent.", "Hand 5:33": "Toen zij dit hoorden, werd hun hart doorstoken, en zij hielden raad om hen te doden.", "Openb 2:5": "Bedenk dan waarvan u uitgevallen bent, en bekeer u, en doe de eerste werken; en zo niet, Ik zal u haastig bij komen, en zal uw kandelaar van zijn plaats wegnemen, als u zich niet bekeert.", "Ps 50:17": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit.", "Deut 19:10": "opdat het bloed van de onschuldige niet vergoten wordt te midden van uw land, dat de HEERE, uw God, u als erfdeel geeft, en er geen bloedschuld op u zou zijn.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Jona 3:8": "Maar mens en dier zullen met zakken bedekt zijn, en zullen sterk tot God roepen; en zij zullen zich bekeren, ieder van zijn boze weg, en van het geweld dat in hun handen is.", "Matt 24:39": "en zij merkten het niet, totdat de zondvloed kwam en hen allen wegnam; zo zal ook de komst van de Zoon des mensen zijn.", "2 Kon 18:5": "Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Zach 8:22": "Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Jer 7:3-7": "Zo zegt de HEERE van de heerscharen, de God van Israël: Maak uw wegen en uw handelingen goed, dan zal Ik u laten wonen in deze plaats. Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze! Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "2 Kron 29:6-11": "Want onze vaders hebben overtreden, en gedaan wat kwaad was in de ogen van de HEERE, onze God, en hebben Hem verlaten, en zij hebben hun gezicht van de tabernakel van de HEERE afgewend, en hebben Hem de rug toegekeerd. Ook hebben zij de deuren van het voorhuis gesloten, en de lampen uitgeblust en het reukwerk niet aangestoken; en het brandoffer hebben zij in het heiligdom aan de God van Israël niet geofferd. Daarom is er een grote toorn van de HEERE over Juda en Jeruzalem geweest; en Hij heeft hen overgegeven aan opschudding, verwoesting en aanfluiting, zoals u ziet met uw eigen ogen.", "Matt 26:25": "En Judas, die Hem verried, antwoordde en zei: Ben ik het, Rabbi? Hij zei tegen hem: U hebt het gezegd.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Dan 9:13": "Zoals geschreven is in de wet van Mozes, zo is al dat kwaad over ons gekomen; en wij smeekten het aangezicht van de HEERE, onze God, niet, door ons af te keren van onze ongerechtigheden en verstandig acht te geven op Uw waarheid.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Deut 32:46": "Zei hij tegen hen: Zet uw hart op al de woorden, die ik heden onder u betuig, dat u ze uw kinderen gebieden zult, dat zij nauwlettend zullen doen al de woorden van deze wet.", "2 Petr 1:12-16": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt. En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken; Want ik weet dat het afleggen van mijn tent spoedig zal zijn, zoals ook onze Heere Jezus Christus mij heeft geopenbaard.", "Num 14:10": "Toen zei de hele vergadering dat men hen met stenen zou stenigen. Maar de heerlijkheid van de HEERE verscheen in de tent van de samenkomst, voor al de kinderen van Israël.", "Ezra 9:11": "die Gij geboden had door de dienst van Uw knechten, de profeten, en zei: Het land, waar u naartoe gaat om het te erven, is een vuil land, door de vuiligheid van de volken van de landen, om hun gruwelen, waarmee zij het vervuld hebben, van het ene einde tot het andere einde, met hun onreinheid.", "2 Kon 22:14": "Toen ging de priester Hilkia, en Ahikam, en Achbor, en Safan, en Asaja naar de profetes Hulda, de vrouw van Sallum, de zoon van Tikva, de zoon van Harhas, de klederbewaarder (zij woonde nu te Jeruzalem, in het tweede deel), en zij spraken met haar.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Matt 10:27": "Wat Ik u zeg in het duister, zegt dat in het licht; en wat u hoort in het oor, predikt dat op de daken.", "Jes 32:9-11": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Jer 32:1": "Het woord dat tot Jeremia gekomen is van de HEERE, in het tiende jaar van Zedekia, koning van Juda; dit jaar was het achttiende jaar van Nebukadnezar.", "Matt 12:42": "De koningin van het zuiden zal opstaan in het oordeel met dit geslacht, en zal het veroordelen; want zij is gekomen van het einde van de aarde, om de wijsheid van Salomo te horen; en zie, meer dan Salomo is hier!", "Ezech 20:43": "Daar zult u dan denken aan uw wegen, en aan al uw handelingen waarmee u zich verontreinigd hebt, en u zult van uzelf een afkeer hebben over al uw slechte daden die u gedaan hebt.", "Matt 5:4": "Zalig zijn zij die treuren, want zij zullen vertroost worden.", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "2 Sam 15:26": "Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Jer 37:10": "Want al zou u het hele leger van de Chaldeeën verslaan, die tegen u strijden, en er zouden van hen alleen gewonde mannen overblijven, dan zouden die zich toch, ieder in zijn tent, opmaken en deze stad met vuur verbranden.", "Hand 23:10": "En toen er grote tweedracht ontstond, gaf de aanvoerder, uit vrees dat Paulus door hen verscheurd zou worden, bevel dat het krijgsvolk zou afdalen en hem uit hun midden zou wegrukken en naar de legerplaats brengen.", "2 Kon 20:8": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "1 Tim 5:7-11": "En beveel dit, opdat zij onberispelijk zijn. Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige. Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Deut 4:8": "En welk groot volk is er, dat zulke rechtvaardige inzettingen en rechten heeft als deze hele wet, die ik vandaag voor u leg?", "2 Kron 32:20": "Maar de koning Jehizkia en de profeet Jesaja, de zoon van Amoz, baden hierover, en
