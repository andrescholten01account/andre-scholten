zij riepen naar de hemel.", "1 Sam 15:22": "Doch Samuël zei: Heeft de HEERE evenveel behagen in brandoffers en slachtoffers, als in het gehoorzamen aan de stem van de HEERE? Zie, gehoorzamen is beter dan slachtoffer, opmerken beter dan het vet van rammen."}, "noten": {"1": "D.i. legermachten"}, "koppeling": {"1": "In <span class=\"wl\" data-l=\"L1\" data-code=\"H7225\">het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7225\">begin</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7225\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4468\">het</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4468\">koningschap</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4468\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3079\">Jojakim</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H3079\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2977\">Josia</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4428\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3063\">Juda</span>, kwam <span class=\"wl\" data-l=\"L8\" data-code=\"H1697\">dit</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1697\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H559\">de</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H559\">HEERE</span>, en Hij zei:", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">Zo</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H559\">zegt</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H559\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5975\">HEERE</span>: <span class=\"wl\" data-l=\"L2\" data-code=\"H5975\">Sta</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5975\">in</span> <span class=\"wl\" data-l=\"L3\" e=\"H4191\">doden</span>."}, "koppeling_kjv": {"1": "In the <span class=\"wl wl-kjv\" data-code=\"H7225\">beginning</span> of the <span class=\"wl wl-kjv\" data-code=\"H4468\">reign</span> of <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> came this <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> saying,", "2": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">Stand</span> in the <span class=\"wl wl-kjv\" data-code=\"H2691\">court</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> thee to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto them; <span class=\"wl wl-kjv\" data-code=\"H1639\">diminish</span> not a word:", "3": "If so be they will <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> from his <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H5162\">repent</span> me of the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> which I <span class=\"wl wl-kjv\" data-code=\"H2803\">purpose</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto them <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H7455\">evil</span> of their doings.", "4": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> If ye will not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> to me, to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in my <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> before", "5": "To <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> to the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of my <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> whom I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto you, both rising up <span class=\"wl wl-kjv\" data-code=\"H7925\">early,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sending</span> them, but ye have not hearkened;", "6": "Then will I <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> this <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> like <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> a <span class=\"wl wl-kjv\" data-code=\"H7045\">curse</span> to all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> of the earth.", "7": "So the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the LORD.", "8": "Now it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> all that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8610\">took</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> die.", "9": "Why hast thou <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> This <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall be like <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> and this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2717\">desolate</span> without an <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant?</span> And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H6950\">gathered</span> against <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the LORD.", "10": "When the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">things,</span> then they came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">entry</span> of the <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the LORD'S", "11": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> This <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> is <span class=\"wl wl-kjv\" data-code=\"H4941\">worthy</span> to <span class=\"wl wl-kjv\" data-code=\"H4194\">die;</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> against this <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> as ye have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> with your ears.", "12": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me to <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> against this <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> and against this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that ye have heard.", "13": "Therefore now <span class=\"wl wl-kjv\" data-code=\"H3190\">amend</span> your <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> and your <span class=\"wl wl-kjv\" data-code=\"H4611\">doings,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">obey</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H5162\">repent</span> him of the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that he hath pronounced", "14": "As for me, behold, I am in your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> with me as <span class=\"wl wl-kjv\" data-code=\"H5869\">seemeth</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and meet", "15": "But <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> ye for <span class=\"wl wl-kjv\" data-code=\"H3045\">certain,</span> that if ye put me to <span class=\"wl wl-kjv\" data-code=\"H4191\">death,</span> ye shall surely <span class=\"wl wl-kjv\" data-code=\"H5414\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon yourselves, and upon this <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> thereof: for of a <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me unto you to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in your ears.", "16": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and to the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets;</span> This <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> is not <span class=\"wl wl-kjv\" data-code=\"H4941\">worthy</span> to <span class=\"wl wl-kjv\" data-code=\"H4194\">die:</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> to us in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our God.", "17": "Then rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> <span class=\"wl wl-kjv\" data-code=\"H582\">certain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to all the <span class=\"wl wl-kjv\" data-code=\"H6951\">assembly</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> saying,", "18": "<span class=\"wl wl-kjv\" data-code=\"H4320\">Micah</span> the <span class=\"wl wl-kjv\" data-code=\"H4183\">Morasthite</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2790\">plowed</span> like a <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> shall become <span class=\"wl wl-kjv\" data-code=\"H5856\">heaps,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> as the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> of a forest.", "19": "Did <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> put him at <span class=\"wl wl-kjv\" data-code=\"H4191\">all</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">death?</span> did he not <span class=\"wl wl-kjv\" data-code=\"H3373\">fear</span> the <span class=\"wl wl-kjv\" data-code= /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
