}},"vertalingen":{"SVnu":{"1":"In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:","2":"Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden *in* het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.","3":"Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.","4":"Zeg dan tot hen: Zo zegt de HEERE: Als u naar Mij niet zult horen, om te wandelen in Mijn wet, die Ik voor uw aangezicht gegeven heb;","5":"Door te horen naar de woorden van Mijn knechten, de profeten, die Ik tot u zend, ja, vroeg opstaand en zendend; maar u niet gehoord hebt;","6":"Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek voor alle volken van de aarde.","7":"En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.","8":"Zo gebeurde het, toen Jeremia geëindigd had te spreken alles wat de HEERE geboden had tot al het volk te spreken, dat de priesters en de profeten en al het volk hem grepen, en zeiden: U zult zeker sterven!","9":"Waarom hebt u in de Naam van de HEERE geprofeteerd, en gezegd: Dit huis zal worden als Silo, en deze stad zal woest worden, zodat er niemand *meer* woont? En het hele volk werd verzameld tegen Jeremia, in het huis van de HEERE.","10":"Toen nu de vorsten van Juda deze woorden hoorden, gingen zij op uit het huis van de koning *naar* *het* huis van de HEERE; en zij zetten zich bij de deur van de nieuwe poort van de HEERE.","11":"Toen spraken de priesters en de profeten tot de vorsten en tot al het volk, en zeiden: Deze man verdient de dood, want hij heeft geprofeteerd tegen deze stad, zoals u met uw eigen oren gehoord hebt.","12":"Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;","13":"Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft.","14":"Maar ik, zie, ik ben in uw handen; doe met mij zoals het goed en recht is in uw ogen;","15":"Maar weet zeker, dat u, als u mij doodt, zeker onschuldig bloed zult brengen op u, en op deze stad, en op haar inwoners; want in waarheid, de HEERE heeft mij tot u gezonden, om al deze woorden voor uw oren te spreken.","16":"Toen zeiden de vorsten en al het volk tot de priesters en tot de profeten: Deze man verdient de dood niet, want hij heeft tot ons gesproken in de Naam van de HEERE, onze God.","17":"Ook stonden er mannen op, van de oudsten van het land, en spraken tot de hele gemeente van het volk, en zeiden:","18":"Micha, de Morastiet, heeft in de dagen van Hizkia, koning van Juda, geprofeteerd, en tot al het volk van Juda gesproken, en gezegd: Zo zegt de HEERE van de heerscharen[1]: Sion zal *als* een akker geploegd worden, en Jeruzalem *tot* *steen*hopen worden, en de berg van dit huis tot hoogten van het woud.","19":"Hebben Hizkia, de koning van Juda, en heel Juda hem ooit gedood? Vreesde hij niet de HEERE, en smeekte hij het aangezicht van de HEERE niet, zodat het de HEERE berouwde over het kwaad dat Hij tegen hen gesproken had? Wij dan doen een groot kwaad tegen onze zielen.","20":"Er was ook een man, die in de Naam van de HEERE profeteerde, Uria, de zoon van Semaja, van Kirjath-jearim; die profeteerde tegen deze stad en tegen dit land, naar al de woorden van Jeremia.","21":"En toen de koning Jojakim, alsook al zijn geweldigen, en al de vorsten zijn woorden hoorden, zocht de koning hem te doden; toen Uria *dat* hoorde, vreesde hij, en vluchtte, en kwam in Egypte;","22":"Maar de koning Jojakim zond mannen *naar* Egypte, Elnathan, de zoon van Achbor, en *andere* mannen met hem, naar Egypte;","23":"Die voerden Uria uit Egypte, en brachten hem tot de koning Jojakim, en hij sloeg hem met het zwaard, en hij wierp zijn dode lichaam in de graven van de kinderen van het volk.","24":"Maar de hand van Ahikam, de zoon van Safan, was met Jeremia, zodat men hem niet overgaf in de hand van het volk, om hem te doden."},"SV":{"1":"In het begin des koninkrijks van Jojakim, den zoon van Josia, koning van Juda, geschiedde dit woord van den HEERE, zeggende:","2":"Zo zegt de HEERE: Sta in het voorhof van het huis des HEEREN, en spreek tot alle steden van Juda, die komen om aan te bidden *in* het huis des HEEREN, al de woorden, die Ik u geboden heb tot hen te spreken, doe er niet een woord af.","3":"Misschien zullen zij horen, en zich bekeren, een iegelijk van zijn bozen weg; zo zou Ik berouw hebben over het kwaad, dat Ik hun denk te doen vanwege de boosheid hunner handelingen.","4":"Zeg dan tot hen: Zo zegt de HEERE: Zo gijlieden naar Mij niet zult horen, dat gij wandelt in Mijn wet, die Ik voor uw aangezicht gegeven heb;","5":"Horende naar de woorden Mijner knechten, de profeten, die Ik tot u zende, zelfs vroeg op zijnde en zendende; doch gij niet gehoord hebt;","6":"Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek allen volken der aarde.","7":"En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis des HEEREN.","8":"Zo geschiedde het, als Jeremia geëindigd had te spreken alles, wat de HEERE geboden had tot al het volk te spreken, dat de priesters en de profeten en al het volk hem grepen, zeggende: Gij zult den dood sterven!","9":"Waarom hebt gij in den Naam des HEEREN geprofeteerd, zeggende: Dit huis zal worden als Silo, en deze stad zal woest worden, dat er niemand wone? En het ganse volk werd vergaderd tegen Jeremia, in het huis des HEEREN.","10":"Als nu de vorsten van Juda deze woorden hoorden, gingen zij op uit het huis des konings *naar* *het* huis des HEEREN; en zij zetten zich bij de deur der nieuwe poort des HEEREN.","11":"Toen spraken de priesters en de profeten tot de vorsten en tot al het volk, zeggende: Aan dezen man is een oordeel des doods, want hij heeft geprofeteerd tegen deze stad, gelijk als gij met uw oren gehoord hebt.","12":"Maar Jeremia sprak tot al de vorsten en tot al het volk, zeggende: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden, die gij gehoord hebt;","13":"Nu dan, maakt uw wegen en uw handelingen goed, en gehoorzaamt de stem des HEEREN, uws Gods; zo zal het den HEERE berouwen over het kwaad, dat Hij tegen u gesproken heeft.","14":"Doch ik, ziet, ik ben in uw handen; doet mij, als het goed, en als het recht is in uw ogen;","15":"Maar weet voorzeker, dat gij, zo gij mij doodt, gewisselijk onschuldig bloed zult brengen op u, en op deze stad, en op haar inwoners; want in der waarheid, de HEERE heeft mij tot u gezonden, om al deze woorden voor uw oren te spreken.","16":"Toen zeiden de vorsten en al het volk tot de priesteren en tot de profeten: Aan dezen man is geen oordeel des doods, want hij heeft tot ons gesproken in den Naam des HEEREN, onzes Gods.","17":"Ook stonden er mannen op, van de oudsten des lands, en spraken tot de ganse gemeente des volks, zeggende:","18":"Micha, de Morastiet, heeft in de dagen van Hizkia, koning van Juda, geprofeteerd, en tot al het volk van Juda gesproken, zeggende: Zo zegt de HEERE des heirscharen: Sion zal *als* een akker geploegd, en Jeruzalem *tot* *steen* hopen worden, en de berg dezes huizes tot hoogten des wouds.","19":"Hebben ook Hizkia, de koning van Juda, en gans Juda hem ooit gedood? Vreesde hij niet den HEERE, en smeekte des HEEREN aangezicht, zodat het den HEERE berouwde over het kwaad, dat Hij tegen hen gesproken had? Wij dan doen een groot kwaad tegen onze zielen.","20":"Er was ook een man, die in den Naam des HEEREN profeteerde, Uria, de zoon van Semaja, van Kirjath-jearim; die profeteerde tegen deze stad en tegen dit land, naar al de woorden van Jeremia.","21":"En als de koning Jojakim, mitsgaders al zijn geweldigen, en al de vorsten zijn woorden hoorden, zocht de koning hem te doden; als Uria *dat* hoorde, zo vreesde hij, en vluchtte, en kwam in Egypte;","22":"Maar de koning Jojakim zond mannen *naar* Egypte, Elnathan, den zoon van Achbor, en *andere* mannen met hem, in Egypte;","23":"Die voerden Uria uit Egypte, en brachten hem tot den koning Jojakim, en hij sloeg hem met het zwaard, en hij wierp zijn dood lichaam in de graven van de kinderen des volks.","24":"Maar de hand van Ahikam, den zoon van Safan, was met Jeremia, dat men hem niet overgaf in de hand des volk, om hem te doden."},"KJV":{"1":"In the beginning of the reign of Jehoiakim the son of Josiah king of Judah came this word from the LORD, saying,","2":"Thus saith the LORD; Stand in the court of the LORD'S house, and speak unto all the cities of Judah, which come to worship in the LORD'S house, all the words that I command thee to speak unto them; diminish not a word:","3":"If so be they will hearken, and turn every man from his evil way, that I may repent me of the evil, which I purpose to do unto them because of the evil of their doings.","4":"And thou shalt say unto them, Thus saith the LORD; If ye will not hearken to me, to walk in my law, which I have set before","5":"To hearken to the words of my servants the prophets, whom I sent unto you, both rising up early, and sending *them*, but ye have not hearkened;","6":"Then will I make this house like Shiloh, and will make this city a curse to all the nations of the earth.","7":"So the priests and the prophets and all the people heard Jeremiah speaking these words in the house of the LORD.","8":"Now it came to pass, when Jeremiah had made an end of speaking all that the LORD had commanded *him* to speak unto all the people, that the priests and the prophets and all the people took him, saying, Thou shalt surely die.","9":"Why hast thou prophesied in the name of the LORD, saying, This house shall be like Shiloh, and this city shall be desolate without an inhabitant? And all the people were gathered against Jeremiah in the house of the LORD.","10":"When the princes of Judah heard these things, then they came up from the king's house unto the house of the LORD, and sat down in the entry of the new gate of the LORD'S","11":"Then spake the priests and the prophets unto the princes and to all the people, saying, This man *is* worthy to die; for he hath prophesied against this city, as ye have heard with your ears.","12":"Then spake Jeremiah unto all the princes and to all the people, saying, The LORD sent me to prophesy against this house and against this city all the words that ye have heard.","13":"Therefore now amend your ways and your doings, and obey the voice of the LORD your God; and the LORD will repent him of the evil that he hath pronounced","14":"As for me, behold, I *am* in your hand: do with me as seemeth good and meet","15":"But know ye for certain, that if ye put me to death, ye shall surely bring innocent blood upon yourselves, and upon this city, and upon the inhabitants thereof: for of a truth the LORD hath sent me unto you to speak all these words in your ears.","16":"Then said the princes and all the people unto the priests and to the prophets; This man *is* not worthy to die: for he hath spoken to us in the name of the LORD our God.","17":"Then rose up certain of the elders of the land, and spake to all the assembly of the people, saying,","18":"Micah the Morasthite prophesied in the days of Hezekiah king of Judah, and spake to all the people of Judah, saying, Thus saith the LORD of hosts; Zion shall be plowed *like* a field, and Jerusalem shall become heaps, and the mountain of the house as the high places of a forest.","19":"Did Hezekiah king of Judah and all Judah put him at all to death? did he not fear the LORD, and besought the LORD, and the LORD repented him of the evil which he had pronounced against them? Thus might we procure great evil against our souls.","20":"And there was also a man that prophesied in the name of the LORD, Urijah the son of Shemaiah of Kirjathjearim, who prophesied against this city and against this land according to all the words of Jeremiah:","21":"And when Jehoiakim the king, with all his mighty men, and all the princes, heard his words, the king sought to put him to death: but when Urijah heard it, he was afraid, and fled, and went into Egypt;","22":"And Jehoiakim the king sent men into Egypt, *namely*, Elnathan the son of Achbor, and *certain* men with him into Egypt.","23":"And they fetched forth Urijah out of Egypt, and brought him unto Jehoiakim the king; who slew him with the sword, and cast his dead body into the graves of the common people.","24":"Nevertheless the hand of Ahikam the son of Shaphan was with Jeremiah, that they should not give him into the hand of the people to put him to death."}},"tsk":{"2":[{"kopje":"Sta","refs":["Jer 7:2","Jer 19:14","Jer 23:28","Jer 36:10","2 Kron 24:20","2 Kron 24:21","Luk 19:47","Luk 19:48","Luk 20:1","Luk 21:37","Luk 21:38","Joh 8:2","Joh 18:20","Hand 5:20","Hand 5:21","Hand 5:25","Hand 5:42"]},{"kopje":"al de woorden","refs":["Jer 1:17","Jer 42:4","Jes 58:1","Jes 58:2","Ezech 3:10","Ezech 3:17-21","Matt 28:20","Hand 20:20","Hand 20:27"]},{"kopje":"af","refs":["Deut 4:2","Deut 12:32","Openb 22:19"]}],"3":[{"kopje":"zo","refs":["Jer 18:7-10","Jer 36:3","Jes 1:16-19","Ezech 18:27-30","Jona 3:8-10","Jona 4:2"]},{"kopje":"Ik","refs":["Jer 26:13","Jer 18:7-10","1 Kon 21:27","1 Kon 21:29"]}],"4":[{"kopje":"Als","refs":["Lev 26:14-46","Deut 28:15-68","Deut 29:18-28","Deut 31:16-18","Deut 31:20","Deut 32:15-25","Joz 23:15","Joz 23:16","1 Kon 9:6","2 Kron 7:19","2 Kron 7:20","Neh 9:26-30","Jes 1:20","Jes 42:23-25"]},{"kopje":"die","refs":["Jer 44:10","Deut 4:8","Deut 4:44","Deut 11:32","Hebr 6:18"]}],"5":[{"kopje":"Mijn","refs":["Jer 7:13","Jer 7:25","Jer 11:7","2 Kon 9:7","2 Kon 17:13","2 Kon 17:23","2 Kon // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
