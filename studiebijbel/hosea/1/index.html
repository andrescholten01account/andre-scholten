 van Israël, maar Ik zal ze zeker wegvoeren.","7":"Maar over het huis van Juda zal Ik Mij ontfermen, en Ik zal ze verlossen door de Heere, hun God, en Ik zal ze niet verlossen door boog, noch door zwaard, noch door oorlog, door paarden noch door ruiters.","8":"Toen zij nu Lo-Ruchama gespeend had, ontving zij, en baarde een zoon.","9":"En Hij zei: Noem zijn naam Lo-Ammi; want u bent Mijn volk niet, zo zal Ik *ook* de uwe niet zijn.","10":"Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.","11":"En de kinderen van Juda en de kinderen van Israël zullen bijeengebracht worden, en zich één hoofd stellen, en uit het land optrekken; want de dag van Jizreël zal groot zijn.","12":"Zeg tegen uw broeders: Ammi, en tegen uw zusters: Ruchama."},"SV":{"1":"Het woord des Heeren, dat geschied is tot Hosea, den zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.","2":"Het begin van het woord des Heeren door Hosea. De Heere dan zeide tot Hosea: Ga henen, neem u een vrouw der hoererijen, en kinderen der hoererijen; want het land hoereert ganselijk van achter den Heere.","3":"Zo ging hij henen, en nam Gomer, een dochter van Diblaim; en zij ontving; en baarde hem een zoon.","4":"En de Heere zeide tot hem: Noem zijn naam Jizreël, want nog een weinig *tijds*, zo zal Ik de bloedschulden van Jizreël bezoeken over het huis van Jehu, en zal het koninkrijk van het huis van Israël doen ophouden.","5":"En het zal te dien dage geschieden, dat Ik Israëls boog verbreken zal, in het dal van Jizreël.","6":"En zij ontving wederom, en baarde een dochter; en Hij zeide tot hem: Noem haar naam Lo-ruchama; want Ik zal Mij voortaan niet meer ontfermen over het huis Israëls, maar Ik zal ze zekerlijk wegvoeren.","7":"Maar over het huis van Juda zal Ik Mij ontfermen, en zal ze verlossen door den Heere, hun God, en Ik zal ze niet verlossen door boog, noch door zwaard, noch door krijg, door paarden noch door ruiteren.","8":"Als zij nu Lo-ruchama gespeend had, ontving zij, en baarde een zoon.","9":"En Hij zeide: Noem zijn naam Lo-ammi; want gijlieden zijt Mijn volk niet, zo zal Ik *ook* de uwe niet zijn.","10":"Nochtans zal het getal der kinderen Israëls zijn als het zand der zee, dat niet gemeten noch geteld kan worden; en het zal geschieden dat ter plaatse, waar tot hen gezegd zal zijn: Gijlieden zijt Mijn volk niet; tot hen gezegd zal worden: Gij zijt kinderen des levenden Gods.","11":"En de kinderen van Juda, en de kinderen Israëls zullen samenvergaderd worden, en zich een enig hoofd stellen, en uit het land optrekken; want de dag van Jizreël zal groot zijn.","12":"Zegt tot uw broederen: Ammi, en tot uw zusteren: Ruchama."},"KJV":{"1":"The word of the LORD that came unto Hosea, the son of Beeri, in the days of Uzziah, Jotham, Ahaz, *and* Hezekiah, kings of Judah, and in the days of Jeroboam the son of Joash, king of Israel.","2":"The beginning of the word of the LORD by Hosea. And the LORD said to Hosea, Go, take unto thee a wife of whoredoms and children of whoredoms: for the land hath committed great whoredom, *departing* from the LORD.","3":"So he went and took Gomer the daughter of Diblaim; which conceived, and bare him a son.","4":"And the LORD said unto him, Call his name Jezreel; for yet a little *while*, and I will avenge the blood of Jezreel upon the house of Jehu, and will cause to cease the kingdom of the house of Israel.","5":"And it shall come to pass at that day, that I will break the bow of Israel in the valley of Jezreel.","6":"And she conceived again, and bare a daughter. And *God* said unto him, Call her name Loruhamah: for I will no more have mercy upon the house of Israel; but I will utterly take them away.","7":"But I will have mercy upon the house of Judah, and will save them by the LORD their God, and will not save them by bow, nor by sword, nor by battle, by horses, nor by horsemen.","8":"Now when she had weaned Loruhamah, she conceived, and bare a son.","9":"Then said *God*, Call his name Loammi: for ye *are* not my people,","10":"Yet the number of the children of Israel shall be as the sand of the sea, which cannot be measured nor numbered; and it shall come to pass, *that* in the place where it was said unto them, Ye *are* not my people, *there* it shall be said unto them, *Ye are* the sons of the living God.","11":"Then shall the children of Judah and the children of Israel be gathered together, and appoint themselves one head, and they shall come up out of the land: for great *shall be* the day of Jezreel.","12":"Say ye unto your brethren, Ammi; and to your sisters, Ruhamah."}},"tsk":{"1":[{"kopje":"woord","refs":["Jer 1:2","Jer 1:4","Ezech 1:3","Joël 1:1","Jona 1:1","Zach 1:1","Joh 10:35","2 Petr 1:21"]},{"kopje":"Hosea","refs":["Rom 9:25"]},{"kopje":"in","refs":["Jes 1:1","Micha 1:1"]},{"kopje":"Uzzia","refs":["2 Kon 14:16-29","2 Kon 15:1","2 Kon 15:2","2 Kon 15:32","2 Kon 16:1-20","2 Kon 18:1-37","2 Kron 26:1","2 Kron 32:33"]}],"2":[{"kopje":"begin","refs":["Mark 1:1"]},{"kopje":"Ga heen","refs":["Hos 3:1","Jes 20:2","Jes 20:3","Jer 13:1-11","Ezech 4:1","Ezech 5:17"]},{"kopje":"kinderen","refs":["Hos 2:3","2 Petr 2:14"]},{"kopje":"want","refs":["Ex 34:15","Ex 34:16","Deut 31:16","2 Kron 21:13","Ps 73:27","Ps 106:39","Jer 2:13","Jer 3:1-4","Jer 3:9","Ezech 6:9","Ezech 16:1-63","Ezech 23:1-49","Openb 17:1","Openb 17:2","Openb 17:5"]}],"4":[{"kopje":"Noem","refs":["Hos 1:6","Hos 1:9","Jes 7:14","Jes 9:5","Matt 1:21","Luk 1:13","Luk 1:31","Luk 1:63","Joh 1:43"]},{"kopje":"en Ik","refs":["2 Kon 9:24","2 Kon 9:25","2 Kon 10:7","2 Kon 10:8","2 Kon 10:10","2 Kon 10:11","2 Kon 10:17","2 Kon 10:29-31","2 Kon 15:10-12"]},{"kopje":"bezoeken","refs":["Hos 2:12","Hos 9:17","Jer 23:2"]},{"kopje":"Ik zal doen ophou ef":"../../2-koningen/8/#v1","ref":"2 Kon 8:1","svLabel":null},{"disp":"Jes 7:8","href":"../../jesaja/7/#v8","ref":"Jes 7:8","svLabel":null},{"disp":"Jes 8:4-7","href":"../../jesaja/8/#v4","ref":"Jes 8:4-7","svLabel":null},{"disp":"Jes 9:8-21","href":"../../jesaja/9/#v7","ref":"Jes 9:7-20","svLabel":"SV 7"},{"disp":"Jes 17:3-11","href":"../../jesaja/17/#v3","ref":"Jes 17:3-11","svLabel":null},{"disp":"Jes 28:1-8","href":"../../jesaja/28/#v1","ref":"Jes 28:1-8","svLabel":null},{"disp":"Hos 1:1-9","href":"../../hosea/1/#v1","ref":"Hos 1:1-9","svLabel":null},{"disp":"Hos 2:1-13","href":"../../hosea/1/#v12","ref":"Hos 1:12-2:12","svLabel":"SV 1:12"},{"disp":"Hos 11:5","href":"../../hosea/11/#v5","ref":"Hos 11:5","svLabel":null},{"disp":"Hos 11:6","href":"../../hosea/11/#v6","ref":"Hos 11:6","svLabel":null},{"disp":"Hos 12:7-14","href":"../../hosea/12/#v8","ref":"Hos 12:8-15","svLabel":"SV 8"},{"disp":"Amos 2:6-16","href":"../../amos/2/#v6","ref":"Amos 2:6-16","svLabel":null}],"kinderen":[]}]}]},{"topic":"Name","href":"../../nave/n/#t-name","kinderen":[{"label":"Symbolical","href":"../../nave/n/?hl=Hos.1.12#i14490","refs":[{"disp":"Hos 1:3","href":"../../hosea/1/#v3","ref":"Hos 1:3","svLabel":null},{"disp":"Hos 1:4","href":"../../hosea/1/#v4","ref":"Hos 1:4","svLabel":null},{"disp":"Hos 1:6","href":"../../hosea/1/#v6","ref":"Hos 1:6","svLabel":null},{"disp":"Hos 1:9","href":"../../hosea/1/#v9","ref":"Hos 1:9","svLabel":null},{"disp":"Hos 2:1","href":"../../hosea/1/#v12","ref":"Hos 1:12","svLabel":"SV 1:12"}],"kinderen":[]}]},{"topic":"Ruhamah","href":"../../nave/r/#t-ruhamah","kinderen":[{"label":"A symbolic name of Israel","href":"../../nave/r/?hl=Hos.1.12#i17556","refs":[{"disp":"Hos 2:1","href":"../../hosea/1/#v12","ref":"Hos 1:12","svLabel":"SV 1:12"}],"kinderen":[]}]}]}},"noten":{"1":"SV: bezoeken. D.i.: vergelden, straffen."},"koppeling":{"1":"Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.","2":"Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.","3":"Zo ging hij heen, en nam Gomer, een dochter van Diblaim; en zij ontving, en baarde hem een zoon.","4":"En de Heere zei tegen hem: Noem zijn naam Jizreël, want nog een korte <em>tijd</em>, en Ik zal de bloedschuld van Jizreël bezoeken<sup class=\"noot\" data-noot=\"1\">1</sup> over het huis van Jehu, en Ik zal het koninkrijk van het huis van Israël doen ophouden.","5":"En het zal op die dag gebeuren, dat Ik de boog van Israël zal breken, in het dal van Jizreël.","6":"En zij ontving opnieuw, en baarde een dochter; en Hij zei tegen hem: Noem haar naam Lo-Ruchama; want Ik zal Mij voortaan niet meer ontfermen over het huis van Israël, maar Ik zal ze zeker wegvoeren.","7":"Maar over het huis van Juda zal Ik Mij ontfermen, en Ik zal ze verlossen door de Heere, hun God, en Ik zal ze niet verlossen door boog, noch door zwaard, noch door oorlog, door paarden noch door ruiters.","8":"Toen zij nu Lo-Ruchama gespeend had, ontving zij, en baarde een zoon.","9":"En Hij zei: Noem zijn naam Lo-Ammi; want u bent Mijn volk niet, zo zal Ik <em>ook</em> de uwe niet zijn.","10":"Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.","11":"En de kinderen van Juda en de kinderen van Israël zullen bijeengebracht worden, en zich één hoofd stellen, en uit het land optrekken; want de dag van Jizreël zal groot zijn.","12":"Zeg tegen uw broeders: Ammi, en tegen uw zusters: Ruchama."},"koppeling_kjv":{"1":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that came unto <span class=\"wl wl-kjv\" data-code=\"H1954\">Hosea,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H882\">Beeri,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah,</span> <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham,</span> <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz,</span> and <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Israel.","2":"The <span class=\"wl wl-kjv\" data-code=\"H8462\">beginning</span> of the <span class=\"wl wl-kjv\" data-code=\"H1696\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> by <span class=\"wl wl-kjv\" data-code=\"H1954\">Hosea.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1954\">Hosea,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> unto thee a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H2183\">whoredoms</span> and <span class=\"wl wl-kjv\" data-code=\"H3206\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H2183\">whoredoms:</span> for the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> hath committed <span class=\"wl wl-kjv\" data-code=\"H2181\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2181\">whoredom,</span> departing <span class=\"wl wl-kjv\" data-code=\"H310\">from</span> the LORD.","3":"So he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H1586\">Gomer</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H1691\">Diblaim;</span> which <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> him a son.","4":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel;</span> for yet a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> while, and I will <span class=\"wl wl-kjv\" data-code=\"H6485\">avenge</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu,</span> and will cause to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> the <span class=\"wl wl-kjv\" data-code=\"H4468\">kingdom</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel.","5":"And it shall come to pass at that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> the <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of Jezreel.","6":"And she conceived <span class=\"wl wl-kjv\" data-code=\"H2029\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter.</span> And God <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> her <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H3819\">Loruhamah:</span> for I will no <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> but I will <span class=\"wl wl-kjv\" data-code=\"H5375\">utterly</span> take them away.","7":"But I will have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and will <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> them by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and will not <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> them by <span class=\"wl wl-kjv\" data-code=\"H7198\">bow,</span> nor by <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> nor by <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> by <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> nor by horsemen.","8":"Now when she had <span class=\"wl wl-kjv\" data-code=\"H1580\">weaned</span> <span class=\"wl wl-kjv\" data-code=\"H3819\">Loruhamah,</span> she <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a son.","9":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> God, <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H3818\">Loammi:</span> for ye are not my people,","10":"Yet the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall be as the <span class=\"wl wl-kjv\" data-code=\"H2344\">sand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> which cannot be <span class=\"wl wl-kjv\" data-code=\"H4058\">measured</span> nor <span class=\"wl wl-kjv\" data-code=\"H5608\">numbered;</span> and it shall come to pass, that in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where it was <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Ye are not my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> there it shall be <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Ye are the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> God.","11":"Then shall the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> be <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">appoint</span> themselves <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and they shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> for <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of Jezreel.","12":"<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> ye unto your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">Ammi;</span> and to your <span class=\"wl wl-kjv\" data-code=\"H269\">sisters,</span> Ruhamah."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Hosea, den zoon van Beëri,","tekst":"In het Nieuwe Testament, in het Grieks genoemd Osee, Rom 9:25 . Denzelfden naam had ook eerst Jozua, Num 13:16 ; idem de laatste koning van Israël, 2Ki 17:1 , 2Ki 17:6 ."},{"catchword":"koningen van Juda,","tekst":"Hieruit blijkt dat deze profeet een zeer langen tijd, te weten tenminste, naar sommiger gevoelen, omtrent drie en veertig jaren geprofeteerd heeft. En of hij wel onder de andere koningen, die in Israël dezen Jerobeam [niet den zoon van Nebat maar van Joas, een kindskind van Jehu] gevolgd zijn, ook geprofeteerd heeft, zo wordt nochtans deze alleen hier genoemd, omdat hij een en veertig jaar geregeerd heeft, en om te tonen dat de goddelijkheid dezer profetie, als welke al geschied is ten tijde als het koninkrijk der tien stammen nog in bloei was. Zie 2Ki 14:25 , en voorts de historiën van de regering dezer koningen van Juda, 2Ki 15 tot 2Ki 21 , en 2Ch 26 tot 2Ch 33 , en vergelijk Amo 1:1 ."}],"2":[{"catchword":"van het woord des HEEREN door Hosea","tekst":"Of, van het spreken, van de spraak; dat is, als de Heere eerst met, door en tot Hosea begon te spreken, sprak Hij dit tot hem, en door hem tot het volk. Anders: in Hosea; [en alzo elders] om nader te tonen dat het volgende niet geschied is inderdaad, maar door een gezicht in den geest, inwendiglijk, bij manier van parabel of gelijkenis, den profeet van God is geopenbaard, en naderhand het volk alzo, als een profetisch gezicht voorgedragen. Zie van zulke profetische gezichten, Gen 15:1 , en vergelijk onder Hos 3:1 , enz.; idem Eze 4:4 , en Eze 8:2 , en Eze 11:24-25 , enz."},{"catchword":"hoererijen, en","tekst":"Dat is, ganselijk tot hoererij begeven. Vergelijk de manier van spreken met Psa 5:7 ."},{"catchword":"kinderen der hoererijen;","tekst":"Omdat hier gezegd wordt: Neem ene hoer met hoerenkinderen, en daarna dat de profeet die kinderen bij die hoer gewonnen heeft, daaruit blijkt dat het niet alzo inderdaad geschied is."},{"catchword":"ganselijk","tekst":"Hebreeuws, hoererende hoereert; dat is, doet doorgaans niets anders. Zie van geestelijke hoererij Lev 17:7 ."},{"catchword":"van achter den HEERE","tekst":"Dat is, alzo dat de inwoners des lands den Heere niet meer navolgen, maar van Hem afwijken, en de afgoden onzinnig nalopen; vergelijk onder Hos 4:12 ."}],"3":[{"catchword":"ging hij henen,","tekst":"Dit alles is den profeet in een gezicht vertoond, en het volk [gelijk op vs.2 is aangetekend] voorgesteld, tot een spiegel en levendige afbeelding van hun goddeloos wezen, in vs.2 vermeld."},{"catchword":"Gomer,","tekst":"Gelijk Gomer in het Hebreeuws somtijds de betekenis heeft van volheid, of volmaaktheid, somtijds van vertering; alzo had God dit volk alles goeds gedaan, maar zij verteerden alles, en ook zichzelven, door afgoderij en andere zonden, waarom zij eindelijk door Gods plagen zouden verteerd worden."},{"catchword":"Diblaïm;","tekst":"Sommigen nemen dit voor een mansnaam, anderen voor de geboorteplaats. Het woord betekent twee klompen vijgen, waardoor beduid kan worden de geilheid, wellustigheid en dartelheid van het volk. Eenigen menen dat deze naam ziet op de woestijn Dibla, vermeld Eze 6:14 , [zie de aantekening aldaar] om te tonen de genade, die God zijn volk bewezen heeft, hen voerende uit de woestijn in Kanaän. [Vergelijk Eze 16:5 , Eze 16:7 ; Son 3:6 ] ; Num 33:46 , wordt vermeld Diblathaim. Zie wijders Jer 2:2 , Jer 2:6 ."}],"4":[{"catchword":"hem","tekst":"Hosea."},{"catchword":"Jizreël,","tekst":"Deze naam moet onderscheiden worden van Israël, en dit ziet op de plaats Jizreël. Zie het volgende en wijders Hos 2:21-22 , met de aantekening."},{"catchword":"bloedschulden van Jizreël","tekst":"Hebreeuws, bloeden; dat is, bloedschulden, doodslagen, moorderijen, [zie Gen 37:26 ] , die aldaar opgelegd en bedreven zijn."},{"catchword":"bezoeken over het huis","tekst":"Met straffen; zie Gen 21:1 ."},{"catchword":"Jehu,","tekst":"Die veel bloed vergoten had in het dal Jizreël, op het bevel des Heeren, maar niet uit een oprecht hart om Achabs afgoderij uit te roeien, gelijk hem God bevolen had [alzo hij zelf 2Ki 10:28-29 , 2Ki 10:31 wordt gezegd aangehangen te hebben de afgoderij van Jerobeam, en niet gewandeld te hebben in de wet des Heeren met zijn ganse hart] maar om het koninkrijk. Waarom God zulks houdt voor een moorderij; vergelijk het voorbeeld van Baesa, 1Ki 15:29 , en 1Ki 16:7 , die Jerobeams huis, naar Gods woord verdelgde, maar niet uit vroomheid."}],"5":[{"catchword":"boog verbreken zal,","tekst":"Dat is, de macht der schutterij, of de krijgsmacht; vergelijk Psa 78:9 ; dienvolgens zal Israël den vijand ten roof moeten worden. Zie 2Sa 1:18 ; Jer 49:35 met de aantekening."},{"catchword":"dal van Jizreël","tekst":"Zie van dit dal Jdg 6:33 . Het schijnt dat Israël hier een grote nederlaag gehad heeft, ten tijde als Salmanassar tegen hen optoog. Zie 2Ki 17:4 , enz. Anders: om het dal Jizreëls; dat is, om de moorderij aldaar bedreven."}],"6":[{"catchword":"Hij zeide tot hem","tekst":"De Heere tot Hosea."},{"catchword":"Lo-rucháma;","tekst":"Dat is, niet ontfermde."},{"catchword":"zekerlijk wegvoeren","tekst":"Hebreeuws, wegvoerende, of opnemende, [dat is, opnemende en wegvoerende] wegvoeren; vergelijk onder Hos 5:14 . Deze woorden worden verscheidenlijk overgezet, vermits de verscheidene betekenissen van het Hebreeuwse woord, dat niet alleen opnemen, wegnemen, wegvoeren, enz., maar ook vergeven betekent. [Zie Psa 25:18 ; Isa 2:9 ] . Dit is vervuld, eerst door Tiglath-Pilezer, daarna door Salmanassar, koningen van Assyrië."}],"7":[{"catchword":"Juda zal Ik Mij ontfermen,","tekst":"Dat is, mijne kerk, of mijn volk, hier bijzonderlijk afgebeeld door Juda, als hebbende den rechten godsdienst, en niet door Israël, die den waren godsdienst verlaten hadden; waarom in het volgende ook van het huis van Juda gezegd wordt, den Heere hunnen God. Vergelijk onder vs.9, en Hos 12:1 ; anderszins worden Juda en Israël [tezamen afbeeldende de algemene kerk uit Joden en heidenen] samengevoegd. Zie onder vs.11, enz.; idem Hos 3:5 ."},{"catchword":"HEERE, hun God,","tekst":"Dat is, door mijn eeuwigen eniggeboren Zoon Jezus Christus, dien Ik tot een Heiland, Behouder, Zaligmaker, Hoofd en Koning van zijn volk verordineerd heb; vergelijk Gen 19:24 ; Isa 10:27 , en Jer 23:4-5 , enz. Anders: door den HEERE hunnen God; dat is, door mijzelven, Ik zal het zelf doen, te weten hen lichamelijk verlossen uit Babel, en geestelijk door den Messias, uit de gevangenis des duivels, enz."},{"catchword":"boog, noch door zwaard,","tekst":"Gelijk de verlossing van Juda uit de Babylonische gevangenschap door mijn zonderlinge genade en regering beschikt en bestuurd zal worden, en niet door menselijk geweld, alzo zal de verlossing door Christus een gans hemels en geestelijk heil zijn, waarvoor zij niemand dan mij zullen hebben te danken. Vergelijk Mic 5:9 , met de aantekening. Sommigen duiden het ook op de wonderlijke regering van God, door welke Hij Juda heeft verlost van de twee koningen, Pekah, koning van Israël, en Rezin, koning van Syrië. Zie Isa 7:1 ,enz.; 2Ki 15:29-30 , en 2Ki 16:9 ."}],"9":[{"catchword":"Hij zeide","tekst":"De Heere."},{"catchword":"de uwe niet zijn","tekst":"Dat is, Ik zal ulieder God niet zijn, gelijk dit sommigen aldus aanvullen: zo zal Ik [ook] ulieder [God] niet zijn, gelijk God elders dikwijls spreekt. Vergelijk boven vs.7 met de aantekening, en zie Gen 17:7 , en Deu 7:6 . Door de geboorte van deze drie kinderen menen sommigen afgebeeld te zijn drieërlei staat van het volk van Israël, telkens meer vervallende in zonden en zwaarder van God gestraft."}],"10":[{"catchword":"kinderen Israëls zijn als het zand der zee,","tekst":"Wien Ik in toekomenden tijden zal genadig zijn. Hier spreekt God van het genade werk, dat Hij voorhad aan zijn volk te bewijzen bij den tijd van het Nieuwe Testament, te weten aan Joden en heidenen, het Israël Gods; zie Rom 9:24 , Rom 9:26 ; Gal 3:28-29 , en Gal 6:16 ; want nu het vleselijk Israël, zowel als de heidenen, Gods volk niet meer waren, zo moesten zij beiden door loutere en vrije genade aangenomen worden, welke God hier hun beiden toezegt."}],"11":[{"catchword":"En de kinderen van Juda,","tekst":"Hoewel sommigen dit enigszins verstaan van de verlossing uit de Babylonische gevangenschap, wanneer de verstrooide en overgebleven vrome Israëlieten, door al de geleden plagen bijkans teniet geworden zijnde, zich zeer gaarne zouden voegen bij de optrekkende Joden, zo ziet het nochtans eigenlijk op de verzamelingen der kerk van het Nieuwe Testament uit Joden en heidenen, onder een Hoofd Jezus Christus door geloof en ware bekering. Vergelijk Jer 23:6 , enz., en Jer 31:5-6 , Jer 31:9 , en Jer 50:4 , enz."},{"catchword":"land optrekken;","tekst":"Van hun lichamelijke gevangenschap, en eigenlijk uit de geestelijke gevangenschap zich begeven tot Gods kerk."},{"catchword":"want de dag van Jizreël zal groot zijn","tekst":"Of, omdat de dag van Jizreël groot zal geweest zijn. Versta, Israëls nederlaag en verwoesting, waarvan boven vs.5. De zin is dat dit oordeel Gods en al de volgende of gevolgde straffen hen daartoe zullen bewegen. Sommigen verstaan door Jizreëls dag den dag van Israëls verlossing, die heerlijk zal zijn, gesteld tegen den dag hunner nederlaag in Jizreël, en daarom ook genoemd Jizreëls dag; dat is Israëls dag. Vergelijk onder Hos 2:21 . Deze verklaring komt met het voorgaande wel overeen. Alzo wordt iemands dag in de Schriftuur genoemd, de tijd in welken iemand iets bijzonders goeds of kwaads van God naar zijn bestemden raad wordt toegeschikt."}],"12":[{"catchword":"Zegt tot uw broederen","tekst":"O gij gelovige overgeblevenen van Israël, zegt tot de Joden, en gij beiden wijders tot de heidenen, door een geloof in een lichaam onder een Hoofd Jezus Christus samengevoegd. Zie Isa 19:23-24 ; Rom 9:25-26 . Dit vs. hechten sommigen aan Hos. 2."},{"catchword":"Ammi,","tekst":"Dat is, [o] mijn volk. Vergelijk boven vs.7, 9; 1Pe 2:10."},{"catchword":"zusteren","tekst":"Gelovige vrouwen in Juda en onder de heidenen."},{"catchword":"Rucháma","tekst":"Dat is [o] ontfermde. Vergelijk boven vs.6."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The word of the LORD, which happened unto Hosea, [In the new Greek Testament he is called Osee. Rom. 9 .25. and t&acirc;&euro;&trade;is the same Name which Josua had once, Num 13:16. and the last King of Israel, 2. Kings.17.1,6.] the son of Beeri; in the days of Uzzija, Jothan, Achaz Hizkia, king of Juda: [hence it appeareth, that this prophet prophecied a very long time, anmely, at the least, according to the opinion of some, about.43. years:] and in the days of Jerobeam, Joas son, king of Israel the successors of this Jerobeam ( the son, not of Nebat, but of Joas, and the grand &acirc;&euro;&ldquo; child of Jehu) yet this king alone is here mentioned, as having reigned longest, viz.41.s together, whence also the divine Character of this prophecie appeareth, that it happened in such a time, whiles the Kingdom of the Tribes, was yet flourishing. See 2 Kings.14. and 15. and withal the histories of the reign of the fore mentioned kings of Jurda.2. Kings from chap. 15. to 21. and 2. Chron. From chap. 26. to 33. and compare Amos 1.1]"}],"2":[{"catchword":null,"tekst":"The beginning of the word [ Or, of the speaking, or, speech] of the LORD by Hosea: [i.e. when the LORD, first began to speak, with, by, and to Hosea, he spake this to him, and by him to the people. Oth. In Hosea (and so elsewhere also) the better to shew, that the thing spoken of in the sequel, did not happen actually, but was revelaed by God unto the prophet in a Vision only, inwardly in the spirit, by way of a parable or multitude, and afterward made out unto the people, as a Propheticall vision; see of the like, Gen.15. 1. and compare bel. chap.3.1. also Ezech.4.3. and 8,8. and 11.24,25,&c.] The LORD then said unto Hosea; Goe to, take thee a wife of whoredoms, [i.e. wholly given up to whoredome. Compare this phrase with Psal.5. on vers.6] etc children of whoredoms; [ the prophet being bid here to take a whore with her children, and it being said to him by and by, that he begat them on that whore, thence it appears yet plainer, that this happened not so in very deed.] for the land altogether goeth a whoring [Hebr. whoring whoreth, i.e. doth practise nothing else. See of spiritual whoredom, Levit, 17. on vers.7.] from after the LORD.[i.e. sothat the inbitants of the land do follow the Lord no more, but turn away from him, and run madly after idols. Compare be. Chap.4.12.]"}],"3":[{"catchword":null,"tekst":"So he went [All this was shewed to the prophet in a vision and afterward by him represented to the people, (as was noted before. V. 2.) fetting this plain looking glass, or lively pourtraict of their wickedness, mentioned in the former verse, before their eyes] and took Gomer [as Gomer in the Hebrew tongue sometimes signifieth fullness or perfection, and sometimes consumption; so God had shewed abundance of good unto this people, but they wasted and consumed it all, and themselves too, by Idolatry and other excesses of sin wherefore they were likewise at last to be confirmed by God judgment] a daughter of Diablaim: [this some take to be mans name, others, the place of the womans nativity. The word doth signifie two lumps of figs, whereby may be implied the wantonnels, lustfulness, and lasciviousness of the people . Some conceive that this name hath respect to the wilderness of Dibla, mentioned Eze 6:14. (See the note there) to hold forth the mercie, which God had shewed to his people, leding them through the wilderness Canaan, (compare Eze 16:5,7. Cant. 3. 6 .) Numb. 33. 46. we read of Diblathaim. See further, Jere.2. 2,6.) and she conceived, and bare him a son."}],"4":[{"catchword":null,"tekst":"And the LORD said to him; [ viz. Hosea] call his name Jezreel: [this name must be distinguished from Israel: nd it hath regard to the place Jezreel. See the Sequel, and further chap. 2. 21,22. with the annot.] for yet a little (time) I shall visit [viz. by punishments, see Gen.21. on vers.1.] the blood guiltiness of Jezreel? [Heb. Bloods in plural, i.c. bloodguiltiness, killing, murtherings; (see Gen.37, on vers.26.) which are layd up and practiced there] upon the house of Jehu, [who had shed much blood in the valley of jezreel, at the command of the LORD, but not of an upright heart, to root out achabs idolatrie, as God had commanded him, but for the kingdoms sake, it being expressly said of him, 2 Kings. 10. 28, 29,31 that he clave to the idolatry of Jerobeam, and walked not in the law of the LORD, with all his heart. Therefore doth God look no otherwise upon him then upon a murtherer. Compare the example of Baesa 1. King. 15., 29. and 16.7. who destroyed likewise the house of Jerobeam, according to the word of God, but not with an honest heart] and shall make the kingdom the house of Israel to cease,"}],"5":[{"catchword":null,"tekst":"And it shall come to pas in that day, that I shall break the bowe of Israel, [i.e. discomfit the power of their ordinary or their militarie forces. Compare Psal. 78.9. and consequently Israel shall become a prey unto their enemies. See 2. Sam.1 18. Jer. 49. 35. with the annot.] in the valley ef Jezreel. [of this valley see Judg.6. on vers. 33. it should seem that Israel had a great overthrow there given them by Salmanasser. See 2. Kings. 17. 4, etc. Other for the valley of Jezreel i.e. for or, by reason of the murthers therein committed.]"}],"6":[{"catchword":null,"tekst":"And the conceived again, and bire a daughter, and he said unto him, [viz. the LORD to Hosea] call her name Lo &acirc;&euro;&ldquo; Ruchama: [i.e. not puttied] for I shall have no more pitty henceforth upon the house of Israel, but I will surely carry them away. [Heb. Carrying away, (or, taking up) carry the away i.c. take them up, and carry them away. Compare bel. Chap.5. 14. these words are variously rendred by interpreters, in regard of the different significations of the Hebrew verb her, taken not only for taking up, taking, or, carrying away; but also for forgiving, pardoning. See Psal. 25. on vers. 18. Isa. 2. 9 This was fulfilled first, by Tiglath Pilefer, and afterwards by Salmanasser, kings of Assyria.]"}],"7":[{"catchword":null,"tekst":"But upon the house of Juda I will have mercy [ i.e. upon my own church or people especially typified here by Judah, as having the true worship of God, and not by Israel, who had forsaken the true worship of God : wherefore also it Is sais in the sequel, the LORD their God; compare bel. V. 9 and ch.12.1 otherwise Juda and Israel ( together representing the catholick church of Jews and Gentiles) are joined together. See bel. Verl. 11, &c. also chap. 3. 5.] and will deliver them through the LORD their God, [i.e. through mine eternal onely begotten son Jesus Christ, whom I have ordained a Saviour, Redeemer, Deliverer, Head and King of his people. Compare Gen.19 on vers. 24. and Isa 10. 27. Jer. 23. 4, 5, &c. Oth. Through the LORD their God i.e. through my own self, I shall doe and accomplish it my self, to wit, bodily, by delivering them out of Babel, and spiritually by the Messiah, out of the captivity of Stan, &c.] and I will deliver them, not by the bowe, nor by the sword, nor by warre, nor by horses, nor by horse &acirc;&euro;&ldquo; man. [like as the deliverance of Juda, out of the Babylonian Captivity, shall be ordered and bought about through my special grace and providence, and not by any humane power, so shall the deliverance through Christ, be altogether a heavenly and spiritual salvation; for which they shall have cause to thank none but my self. Compare Mich.5. 10. with the annot. Some do likewise interpret it of the wonderful Providenceof God whereby he delivered Juda from the two Kings, Pekah, of Israel and Bazin of Syria. See Isa.7. 1. &c., 2 King.15.29.30. & 16.9.]"}],"8":[{"catchword":null,"tekst":"Now when she had weaned Lo &acirc;&euro;&ldquo; ruchamd, she conceived and bare a son."}],"9":[{"catchword":null,"tekst":"And he [viz. the LORD] said, call his name Lo- ammi; for ye are not my people, so (also) shall not be yours.[I.e. I shall not be your God, as some fill up this viz. according to the expression used elsewhere. Compare ab. Vers. 7. with the annot. And see Gen.17. on vers.7. and Deut. 7. on vers. 6. By the birth of these 3. children here some conceive there is held out a threefold state and condition of the people and deeper plunged in fin, and visited according with heaver Judgments]"}],"10":[{"catchword":null,"tekst":"Nevertheless the number of the children of Israel, [To whome namely I shall show mercie] shall be as the sand of the sea that cannot be measured nor numbered: and and it shall come to pass, that where it shall have been said unto them, ye are not my people, it shall said unto them; ye are the children of the living God. [here God speaketh of the work of Grace, which he intended to show unto his people in the time of the new &acirc;&euro;&ldquo; testament, to wit, to Jews and Gentiles, the Israel of God. See Rom.9 24.,26 Gal. 3. 28,29. and 6. 16. for the carnal Israel as well as the heathen, were now no more the people of God, and therefore could not be otherwise, then by meer and free grace, which God here doth promise to them both.]"}],"11":[{"catchword":null,"tekst":"And the children of Juda and the children of Israel shall gather together, and appoint themselves one onely head, and march up out of the Land: [viz. of their bodily captivity first, but principally out of the spiritual be taking themselves to the church of God. Through some doe partly understand this of deliverance out of the Babylonian captivity, when as the scattered and remaining godly Israelites bein // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.className = 'vers'; rij.id = 'v' + n;

    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');

    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');

    const isKjv = wl.classList.contains('wl-kjv');

      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);

    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
