t is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.","9":"Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.","10":"Zij zullen de Heere achterna gaan; Hij zal brullen als een leeuw, wanneer Hij zal brullen, dan zullen de kinderen bevend aankomen van de zee af.","11":"Zij zullen bevend aankomen als een vogeltje uit Egypte, en als een duif uit het land Assur; en Ik zal hen doen wonen in hun huizen, spreekt de Heere."},"SV":{"1":"Als Israël een kind was, toen heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.","2":"*Maar* *gelijk* zij henlieden riepen, alzo gingen zij van hun aangezicht weg; zij offerden den Baäls, en rookten den gesnedenen beelden.","3":"Ik nochtans leerde Efraïm gaan; Hij nam ze op Zijn armen, maar zij bekenden niet, dat Ik ze genas.","4":"Ik trok ze met mensenzelen, met touwen der liefde, en was hun, als degenen, die het juk *van* op hun kinnebakken oplichten, en Ik reikte hem voeder toe.","5":"Hij zal in Egypteland niet wederkeren; maar Assur, die zal zijn koning zijn; omdat zij zich weigerden te bekeren.","6":"En het zwaard zal in zijn steden blijven, en zijn grendelen verteren, en opeten, vanwege hun beraadslagingen.","7":"Want Mijn volk blijft hangen aan de afkering van Mij; zij roepen het wel tot den Allerhoogste, *maar* niet een verhoogt *Hem*.","8":"Hoe zou Ik u overgeven, o Efraïm? u overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboim? Mijn hart is in Mij omgekeerd, al Mijn berouw is te zamen ontstoken.","9":"Ik zal de hittigheid Mijns toorns niet uitvoeren; Ik zal niet wederkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in het midden van u, en Ik zal in de stad niet komen.","10":"Zij zullen den Heere achterna wandelen, Hij zal brullen als een leeuw, wanneer Hij brullen zal, dan zullen de kinderen van de zee af al bevende aankomen.","11":"Zij zullen bevende aankomen als een vogeltje uit Egypte, en als een duif uit het land van Assur; en Ik zal hen doen wonen in hun huizen, spreekt de Heere."},"KJV":{"1":"When Israel *was* a child, then I loved him, and called my son out of Egypt.","2":"*As* they called them, so they went from them: they sacrificed unto Baalim, and burned incense to graven images.","3":"I taught Ephraim also to go, taking them by their arms; but they knew not that I healed","4":"I drew them with cords of a man, with bands of love: and I was to them as they that take off the yoke on their jaws, and I laid meat","5":"He shall not return into the land of Egypt, but the Assyrian shall be his king, because they refused to return.","6":"And the sword shall abide on his cities, and shall consume his branches, and devour *them*, because of their own counsels.","7":"And my people are bent to backsliding from me: though they called them to the most High, none at all would exalt","8":"How shall I give thee up, Ephraim? *how* shall I deliver thee, Israel? how shall I make thee as Admah? *how* shall I set thee as Zeboim? mine heart is turned within me, my repentings are kindled together.","9":"I will not execute the fierceness of mine anger, I will not return to destroy Ephraim: for I *am* God, and not man; the Holy One in the midst of thee: and I will not enter into the city.","10":"They shall walk after the LORD: he shall roar like a lion: when he shall roar, then the children shall tremble from the west.","11":"They shall tremble as a bird out of Egypt, and as a dove out of the land of Assyria: and I will place them in their houses, saith the LORD.","12":"Ephraim compasseth me about with lies, and the house of Israel with deceit: but Judah yet ruleth with God, and is faithful with the saints."}},"tsk":{"1":[{"kopje":"Israël","refs":["Hos 2:14","Deut 7:7","Jer 2:2","Ezech 16:6","Mal 1:2"]},{"kopje":"geroepen","refs":["Ex 4:22","Matt 2:15"]}],"2":[{"kopje":"zij hen riepen","refs":["Hos 11:7","Deut 29:2- inderen":[{"label":"Illustrative","href":"../../torrey/d/?hl=Hos.11.11#i5164","refs":[],"kinderen":[{"label":"(In its flight,) of the return of Israel from captivity","href":"../../torrey/d/?hl=Hos.11.11#i5170","refs":[{"disp":"Hos 11:11","href":"../../hosea/11/#v11","ref":"Hos 11:11","svLabel":null}],"kinderen":[]}]}]}]}},"noten":{},"koppeling":{"1":"Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.","2":"<em>Maar</em> <em>net zoals</em> zij hen riepen, zo gingen zij van hun aangezicht weg; zij offerden aan de Baäls, en brandden reukwerk voor de gesneden beelden.","3":"Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.","4":"Ik trok ze met mensenzelen, met touwen van liefde, en was voor hen als degenen die het juk <em>van</em> op hun kaken oplichten, en Ik reikte hem voedsel toe.","5":"Hij zal niet terugkeren naar het land Egypte; maar Assur, die zal zijn koning zijn; omdat zij weigerden zich te bekeren.","6":"En het zwaard zal in zijn steden blijven, en zijn grendels verteren, en opeten, vanwege hun beraadslagingen.","7":"Want Mijn volk blijft hangen aan de afkering van Mij; zij roepen het wel tot de Allerhoogste, <em>maar</em> niet één verhoogt <em>Hem</em>.","8":"Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.","9":"Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.","10":"Zij zullen de Heere achterna gaan; Hij zal brullen als een leeuw, wanneer Hij zal brullen, dan zullen de kinderen bevend aankomen van de zee af.","11":"Zij zullen bevend aankomen als een vogeltje uit Egypte, en als een duif uit het land Assur; en Ik zal hen doen wonen in hun huizen, spreekt de Heere."},"koppeling_kjv":{"1":"When <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> was a <span class=\"wl wl-kjv\" data-code=\"H5288\">child,</span> then I <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> out of Egypt.","2":"As they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> them, so they <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">them:</span> they <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed</span> unto <span class=\"wl wl-kjv\" data-code=\"H1168\">Baalim,</span> and burned <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> to graven images.","3":"I <span class=\"wl wl-kjv\" data-code=\"H8637\">taught</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> also to <span class=\"wl wl-kjv\" data-code=\"H8637\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">taking</span> them by their <span class=\"wl wl-kjv\" data-code=\"H2220\">arms;</span> but they <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not that I healed","4":"I <span class=\"wl wl-kjv\" data-code=\"H4900\">drew</span> them with <span class=\"wl wl-kjv\" data-code=\"H2256\">cords</span> of a <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> with <span class=\"wl wl-kjv\" data-code=\"H5688\">bands</span> of <span class=\"wl wl-kjv\" data-code=\"H160\">love:</span> and I was to them as they that take <span class=\"wl wl-kjv\" data-code=\"H7311\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> on their <span class=\"wl wl-kjv\" data-code=\"H3895\">jaws,</span> and I <span class=\"wl wl-kjv\" data-code=\"H5186\">laid</span> meat","5":"He shall not <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> but the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrian</span> shall be his <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> because they <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to return.","6":"And the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> shall <span class=\"wl wl-kjv\" data-code=\"H2342\">abide</span> on his <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> his <span class=\"wl wl-kjv\" data-code=\"H905\">branches,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> them, because of their own counsels.","7":"And my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are <span class=\"wl wl-kjv\" data-code=\"H8511\">bent</span> to <span class=\"wl wl-kjv\" data-code=\"H4878\">backsliding</span> from me: though they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> them to the most <span class=\"wl wl-kjv\" data-code=\"H5920\">High,</span> none at <span class=\"wl wl-kjv\" data-code=\"H3162\">all</span> would exalt","8":"How shall I give thee <span class=\"wl wl-kjv\" data-code=\"H5414\">up,</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim?</span> how shall I <span class=\"wl wl-kjv\" data-code=\"H4042\">deliver</span> thee, <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> how shall I <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee as <span class=\"wl wl-kjv\" data-code=\"H126\">Admah?</span> how shall I <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> thee as <span class=\"wl wl-kjv\" data-code=\"H6636\">Zeboim?</span> mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> within me, my <span class=\"wl wl-kjv\" data-code=\"H5150\">repentings</span> are <span class=\"wl wl-kjv\" data-code=\"H3648\">kindled</span> together.","9":"I will not <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> the <span class=\"wl wl-kjv\" data-code=\"H2740\">fierceness</span> of mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim:</span> for I am <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> and not <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of thee: and I will not <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the city.","10":"They shall <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7580\">roar</span> like a <span class=\"wl wl-kjv\" data-code=\"H738\">lion:</span> when he shall <span class=\"wl wl-kjv\" data-code=\"H7580\">roar,</span> then the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> shall <span class=\"wl wl-kjv\" data-code=\"H2729\">tremble</span> from the west.","11":"They shall <span class=\"wl wl-kjv\" data-code=\"H2729\">tremble</span> as a <span class=\"wl wl-kjv\" data-code=\"H6833\">bird</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and as a <span class=\"wl wl-kjv\" data-code=\"H3123\">dove</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3427\">place</span> them in their <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","12":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">compasseth</span> me about with <span class=\"wl wl-kjv\" data-code=\"H3585\">lies,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with <span class=\"wl wl-kjv\" data-code=\"H4820\">deceit:</span> but <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> yet <span class=\"wl wl-kjv\" data-code=\"H7300\">ruleth</span> with <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> and is <span class=\"wl wl-kjv\" data-code=\"H539\">faithful</span> with the saints."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"kind was,","tekst":"zie van het Hebreeuwse woord Jer 1:6 . De zin is: Als Ik Israël eerst tot mijn volk aannam en met hen mijn vebond maakte. Vergelijk Jer 2:2 , en zie de aantekening aldaar."},{"catchword":"heb Mijn","tekst":"En voerde hem door mijn goddelijke kracht uit de slavernij van Egypte, door de woestijn, naar het beloofde land."},{"catchword":"zoon uit Egypte uitgeroepen","tekst":"Namelijk Israël, dat God dikwijls, maar bijzonderlijk Exo 4:22 , door Mozes, in de aanspraak aan Farao, zijn zoon, ja zijn eerstgeboren zoon noemt; welke plaats hiermede dient vergeleken. Maar dat onder deze woorden wijders ene profetie verborgen is van den eniggeboren Zoon des Vaders onzen Heere Jezus Christus, die het Hoofd is van zijn geestelijk Israël of kerk, blijkt Mat 2:15 . Anders: omdat Israël een kind was, dat Ik liefhad, zo heb Ik mijnen Zoon uit Egypte geroepen. Of: Hoewel Israël een kind is, nochtans heb Ik hem lief; daarom heb Ik, enz., verstaande het eerste lid van Israëls domme onverstandigheid, en het tweede van Christus alleen, wien de Vader uit Egypte geroepen heeft om in Judea het werk onzer verlossing te verrichten. Anderen aldus: Omdat Hij is een kind Israëls, en Ik hem liefheb; daarom heb Ik mijnen Zoon uit Egypte geroepen. Verstaande beide leden van vs.1 van Christus."}],"2":[{"catchword":"gelijk","tekst":"zij henlieden riepen,] Dit is hier ingevoegd tot aanvulling van den zin, passende op het volgende woordje, alzo. Zie Psa 48:6 . De zin is: Hoe meer Mozes en andere vrome dienstknechten Gods de Israëlieten riepen om bij hun goeden God te blijven, en Hem aan te hangen, hoe meer zij daarentegen, onder de ogen der vrome profeten, afweken tot alle afgoderij, kerende God en zijnen profeten den rug en het dove oor toe, gelijk men zegt. Vergelijk onder vs.7, en boven Hos 4:7 ."},{"catchword":"hun aangezicht weg;","tekst":"Van het aangezicht der profeten, die hen tot God riepen."}],"3":[{"catchword":"leerde Efraïm gaan;","tekst":"Dat is, Ik leerde hen de voeten zetten, gelijk een moeder haar kind doet."},{"catchword":"Hij nam ze op Zijn armen,","tekst":"Dit zijn de woorden van den profeet, die hij tussen Gods woorden invoegt, uit verwondering over Gods vriendelijkheid en goedertierenheid, alsof hij zeide: Immers is het waar, dat Hij hen, als een vader, of moeder een kind, [zie vs.1,] inzonderheid als het moede is van het gaan, op de armen gedragen heeft; zie Exo 19:4 ; Deu 1:31 , en Deu 32:11-12 ; Isa 63:9 , en van Mozes, Num 11:12 . Anders: ik nam hen, of nemende henlieden bij hunne [Hebreeuws zijne ] armen; omdat er in het volgende dergelijke verwisseling van het veelvoudig en enkelvoudig getal van Efraïm gebruikt wordt."},{"catchword":"genas","tekst":"Dat is, in al hunne noden en zwarigheden zeer lieflijk en gemeenzaamlijk bijstond en verloste; zie Psa 30:3 , en vergelijk boven Hos 7:1 , en Exo 15:26 ."}],"4":[{"catchword":"mensenzelen,","tekst":"Dat is, menselijke, waar men mensen mede trekt, lijdelijke, lieflijke en zachte zelen, om hen niet te kwetsen of te bezeren. Vergelijk de manier van spreken met 2Sa 7:14 ; Isa 8:1 . Deze woorden drukken de lieflijkheid, vriendelijkheid en lankmoedigheid Gods in het leiden van zijn volk zeer levendig uit."},{"catchword":"juk","tekst":"Dat is, de halster of muilband, die op de muilen der beesten blijft zolang zij arbeiden, en die men oplicht of afneemt als zij rust en voeder zullen nemen. Alzo [wil God zeggen] heb Ik met Israël gehandeld, gevende hem verlichting, rust en hun voeder, gelijk volgt."},{"catchword":"hem voeder toe","tekst":"Efraïm. Hebreeuws, Ik deed spijs, of eten tot hem neigen; dat is, gelijk wij zeggen: Ik reikte het hem toe. Niettegenstaande zulks alles zijn zij zo ongehoorzaam geweest, gelijk in het voorgaande en volgende verhaald is: daarom, enz. gelijk volgt."}],"5":[{"catchword":"Hij zal","tekst":"Efraïm."},{"catchword":"Egypteland niet wederkeren;","tekst":"Of zij wel zouden mogen wensen liever in Egypte weder te keren, gelijk zij zich derwaarts zullen begeven om hulp en toevlucht tegen den Assyriër te zoeken, zo zal het hun toch alzo niet gelukken, maar de tien stammen zullen in het algemeen van den Assyriër uit hun land worden weggevoerd, en veel zwaarder geplaagd dan tevoren in Egypte; zie boven Hos 8:13 , en Hos 9:6 , en de aantekening aldaar, en vergelijk boven Hos 10:9 ."}],"6":[{"catchword":"zwaard","tekst":"Dat is, krijg, en alle gevolgen van dien; zie Lev 26:7 , en Psa 22:21 ."},{"catchword":"zijn steden blijven,","tekst":"Efraïm."},{"catchword":"grendelen verteren,","tekst":"Anders: ledematen, te weten zijns lands leden en delen, als een wild dier, verteren en verslinden, of, zijne ranken [gelijk Eze 17:6 ,] dat is, de dorpen, gelegen buiten de steden, zijnde ten aanzien van de steden gelijk takken van de bomen."},{"catchword":"beraadslagingen","tekst":"Zie boven Hos 10:6 ."}],"7":[{"catchword":"van Mij;","tekst":"Hebreeuws, aan mijne afkering; dat is, aan de afkering, of afwijking, waarmede zij van mij steeds afwijken, of die zij tegen mij betonen. Anders: hangen; [te weten, in onzekerheid en twijfelachtigheid om [hunne] afkering van mij; dat is, zij weten niet waarheen zich te keren, nu hier dan daar lopende om hulp. Beiden in een goeden zin."},{"catchword":"zij roepen","tekst":"De profeten, vergelijk boven vs.2, en Hos 7:16 ."},{"catchword":"het wel tot den Allerhoogste,","tekst":"Mijn volk. Anders: zij roepen He g en onveranderlijk in mijne beloften; Num 23:19 ; Mal 3:6 , enz."},{"catchword":"Heilige","tekst":"Zie Psa 71:22 , en dienvolgens zal Ik mij nog een volk onder u overig behouden, dat Ik heilig om mij te dienen, enz. Vergelijk Eze 16:60 ."},{"catchword":"in de stad niet komen","tekst":"Als een vijand, die in een stad invalt en alles daarin vernielt; of gelijk Ik eertijds in de stad Sodom kwam om die te vernielen, gelijk vs.8, hetwelk op de voorgaande woorden: Ik zal niet wederkeren, of wederom keren, enz., zeer wel past. Zie de aantekening. Anders: Ik zal in de stad niet komen; dat is, in geen stoffelijke plaatsen meer wonen, maar in uwe harten. Vergelijk Joh 4:21 ."}],"10":[{"catchword":"HEERE achterna wandelen,","tekst":"Jezus Christus, den Messias, hun Hoofd en Koning. Vergelijk boven Hos 3:5 ."},{"catchword":"brullen als een leeuw,","tekst":"Door de openbare, klare en heldere predikatie van het Evangelie, waardoor Hij zijne uitverkorenen [gelijk een leeuw zijne jongen] bijeen zal roepen, gelijk volgt. Vergelijk Isa 27:13 ; Amo 3:8 ; idem, waardoor Hij niet alleen den zijnen zijn genadewerk zal verkondigen, maar ook zijnen en zijner kerken vijanden, zijne wraak en overwinning, voornamelijk van alle geestelijke vijanden, die Hij, als de rechte leeuw van Juda, zal overwinnen en in triomf voeren. Zie Gen 49:9 ; Col 2:15 ; Rev 5:5 , en vergelijk wijders Isa 31:4-5 ; Joe 3:16 ; Amo 1:2 ."},{"catchword":"kinderen","tekst":"Dat is, uitverkorenen, die hem de Vader gegeven heeft; Joh 17:6 ; Heb 2:13 ."},{"catchword":"van de zee af","tekst":"Hebreeuws, zullen sidderen, of beven van de zee [of, het westen ] af; dat is sidderende aankomen tot zijne en zijner kerken gemeenschap. Vergelijk Isa 24:14 , en Isa 49:12 , boven Hos 3:5 , en zie de aantekening. Alzo in vs.11. Aangaande de manier van spreken, sidderen, of beven, voor sidderende gaan, komen, enz. Vergelijk 1Sa 13:7 , en 1Sa 16:4 ."}],"11":[{"catchword":"vogeltje","tekst":"Dat snellijk vliegt naar zijn aas, of nest, of den strik ontvliedt."},{"catchword":"Egypte,","tekst":"Dat is, in alle plaatsen, waar zij verstrooid zijn, zullen zij zich met ijver begeven tot dien, die hen verlost uit geestelijk Egypte en Assyrië, dat is, de slavernij des duivels en der zonde. Vergelijk Isa 27:13 ; Zec 10:10 ."},{"catchword":"duif","tekst":"Zie Isa 60:8 ."},{"catchword":"wonen in hun huizen,","tekst":"Dat is, [naar den stijl der profeten]. Ik zal hen planten in mijne kerk, en door Christus geven rust en vrede in hunne conscientiën, en na dit leven, hunne plaats in de hemelse woonsteden. Zie boven Hos 2:13 , Hos 2:17 , met de aantekening en onder Hos 12:10 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"When Israel was a child, [see of the Hebr. word Jer 1. on verse 6. the meaning is, when i first chose Israel to be my people, and made a Covenant with them. Compare Jer 2.2 and see the annotat there.] then i loved him: and i have called my son out of Egypt; [bringing him forth by divine power out of the slavery of Egypt, through the wilderness into the land of promise. By his son is meant Israel, whom God frequently, but especially Exod. 4. 22. by Moseh, in his speech to Pharao, doth call his son, yea, his first born, which place may compare with this, But that under these words there lies further hid a prophecie, touching only forgotten Son of the Father, our Lord Saviour Jesus Christ, the Head of all the spiritual Israel, his Church, appeareth clearly by Math 2. 15, Oth Israel being a child, which i loved, therefore i called my son forth out of Egypt: or though Israel be a child, yet do i love him; therefore i called &c. understand the first cause of Israel want of understanding and dullness and the second of Christ alone, whom the Father had called out of Egypt, for to execute the work of the Redemption in Judea Oth. thus, Because he is called my son out of Egypt: understanding both causes of Christ"}],"2":[{"catchword":null,"tekst":"(But as) [This is inserted here for the compleating of the sense, agreeing with the particle so in the sequel See Psal. 48. on verse 6.] they called them, so they went away from their face; [i.e. from the face of the Prophets, which called them to God; the sense is; the more Moseh and other true servants of God did call upon the Israelites to keep close to their God, and to cleave unto him, the more did they on the contrarie turn away from God, even in the sight of those good Prophets, unto all manner of the idolatry, turning their back to God and his messengers, and lending them but a deaf ear all their exhortations. Compare below vers. 7. and chap. 4.7.] they did offer to the Baals, and burnt incense to the carved images."}],"3":[{"catchword":null,"tekst":"I nevertheless, taught Ephraim to go , [i.e. i taught him how to set and use his feet, a a mother doth with her child] he took them upon his arms, [these are the Prophets words, which he inserts here, between God, as if he had said; it is very true indeed, that he took them up and carried them upon his arms, as a father or mother and carried them upon his arms, as a father or mother do their child (see above v. 1.) especially being weary of going. See Exod 19.4. Deut. 1. 31. and 32.11, 12 Isa 63, 9. and Moseh, Num 11, 12 Oth And i took the their (Heb. his) arm: there being the like enter change to the singular and plural used in the sequel] but they acknowledge not, that bealed them .[i.e. that in all their streights and troubles i did sweetly and familiarly assist and deliver them Psal 30. on vers 3. and c. compare above chap. 7 1 and Exod 15 vers. 26]"}],"4":[{"catchword":null,"tekst":"I drew them with cords of men, with cordages of love [ i.e with such as man are or may be drawn with withall, kindly, sweetly, as one may well indure with out hurt, or annoyance. Compare the phrase with 2 Sam. 7. verse. 14 Isa. 8.1. These words do very lively set out the sweetness, kindness and long suffering or forbearance of God in leading of his people] and was unto them, as ainst me, Oth. bang [viz. in uncertanity and and doubtfulness) for their turning away from me i.e. they no not which way to turn them selves, running now this, now that way: both in good sense] they [viz. the Prophets. compare above verse 2. and chap 7. 16. ] call it in deed [i.e. they call my people. Oth they call him indeed upwards] unto the most high, but no one exalts (Him) [i.e. no man. see of the like use of the Heb, word as Ezr.4 on verse 3. Oth (people) doth not together exalt him i.e they do not owner Him in their assemblies. Him i.e. the most High, that they should give him the glory of their repenting, and seeking for comfort and assistance from Him: or, of givingg thanks unto him for his mercy; or exalts or lift up himself i.e. nun bestirs Himself or puts himself in a posture to hear and hearken, as good observers used to do, shewing by their out wards behavour of the body, the inwards motions and stirrings of the heart.]"}],"8":[{"catchword":null,"tekst":"How should i give up or Ephraim; deliver thee up or Israel? how should i make thee as Adama? put thee as Zeboim? [ understand withall, and as the other neighboring Cities] my heart is turned about within me. [ spoken of God, after the manner of man in some sought to set forth the greatness and incomprehensibleness of his compassions. See Lam 1.20. Gen 43. 30. 1 Kins 2. 26] my repenting is kindled together [Heb. as if one should say, my repenting&rsquo;s or repentanesses, or, comfortablenesses are burning together Oth . my bowels etc. God is said to repent, when he with holds, metigates or removes the deserved and treatned punishments, consequently by repentance here may be be understood the compassions and the bowels wit through compassion are warmed, affected and moved. See Gen on verse 6 and 243 and on verse 30. The whole verse, implieth; though he had well deserved, i should destroy all at once like Sodom Gomorra, etc, Gen 19, 24 Deut 29.23.. but the compassion and faithfulness, which i promised you /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
