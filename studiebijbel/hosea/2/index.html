nt toen ging het mij beter dan nu.","7":"Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, *dat* zij voor de Baäl gebruikt hebben.","8":"Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, *dat diende* om haar naaktheid te bedekken.","9":"En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden.","10":"En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.","11":"En Ik zal haar wijnstok en haar vijgenboom verwoesten, waarvan zij zegt: Deze zijn mij een hoerenloon, dat mijn minnaars mij gegeven hebben; maar Ik zal ze tot een woud maken, en het wild gedierte van het veld zal ze opeten.","12":"En Ik zal aan haar de dagen van de Baäl bezoeken, waarin zij hem wierook gebracht heeft, en zich versierd heeft met haar voorhoofdsieraad, en haar halssieraad, en haar minnaars is nagegaan, maar Mij heeft vergeten, spreekt de Heere.","13":"Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken.","14":"En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland.","15":"En het zal op die dag gebeuren, spreekt de Heere, dat u *Mij* zult noemen: Mijn Man; en Mij niet meer zult noemen: Mijn Baäl!","16":"En Ik zal de namen van de Baäls uit haar mond wegdoen; er zal niet meer aan hun namen gedacht worden.","17":"En Ik zal op die dag een verbond voor hen sluiten met het wild gedierte van het veld, en met het gevogelte van de hemel, en het kruipend gedierte van de aardbodem; en Ik zal de boog, en het zwaard, en de oorlog van de aarde wegbreken, en Ik zal hen in veiligheid laten neerliggen.","18":"En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.","19":"En Ik zal u aan Mij verloven in geloof; en u zult de Heere kennen.","20":"En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.","21":"En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.","22":"En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!"},"SV":{"1":"Twist tegen ulieder moeder, twist, omdat zij Mijn vrouw niet is, en Ik haar Man niet ben; en laat ze haar hoererijen van haar aangezicht, en haar overspelerijen van tussen haar borsten wegdoen.","2":"Opdat Ik ze niet naakt uitstrope, en zette ze als ten dage, toen zij geboren werd; ja, make ze als een woestijn, en zette ze als een dor land, en dode ze door dorst;","3":"En Mij harer kinderen niet ontferme, omdat zij kinderen der hoererijen zijn.","4":"Want hunlieder moeder hoereert, die henlieden ontvangen heeft, handelt schandelijk; want zij zegt: Ik zal mijn boelen nagaan, die *mij* mijn brood en mijn water, mijn wol en mijn vlas, mijn olie en mijn drank geven.","5":"Daarom, ziet, Ik zal uw weg met doornen betuinen, en Ik zal een heiningmuur maken, dat zij haar paden niet zal vinden.","6":"En zij zal haar boelen nalopen, maar dezelve niet aantreffen; en zij zal hen zoeken, maar niet vinden; dan zal zij zeggen: Ik zal henengaan, en keren weder tot mijn vorigen Man, want toen was mij beter dan nu.","7":"Zij bekent toch niet, dat Ik haar het koren, en den most, en de olie gegeven heb, en haar het zilver en goud vermenigvuldigd heb, *dat* zij tot den Baäl gebruikt hebben.","8":"Daarom zal Ik wederkomen, en Mijn koren wegnemen op zijn tijd, en Mijn most op zijn gezetten tijd; en Ik zal wegrukken Mijn wol en Mijn vlas, *dienende* om haar naaktheid te bedekken.","9":"En nu zal Ik haar dwaasheid ontdekken voor de ogen harer boelen; en niemand zal haar uit Mijn hand verlossen.","10":"En Ik zal doen ophouden al haar vrolijkheid, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar gezette hoogtijden.","11":"En Ik zal verwoesten haar wijnstok en haar vijgeboom, waarvan zij zegt: Deze zijn mij een hoerenloon, dat mij mijn boelen gegeven hebben; maar Ik zal ze stellen tot een woud, en het wild gedierte des velds zal ze vreten.","12":"En Ik zal over haar bezoeken de dagen des Baäls, waarin zij dien gerookt heeft, en zich versierd met haar voorhoofdsiersel, en haar halssieraad, en is haar boelen nagegaan, maar heeft Mij vergeten, spreekt de Heere.","13":"Daarom, ziet, Ik zal haar lokken, en zal haar voeren in de woestijn; en Ik zal naar haar hart spreken.","14":"En Ik zal haar geven haar wijngaarden van daar af, en het dal Achor, tot een deur der hoop; en aldaar zal zij zingen, als in de dagen harer jeugd, en als ten dage, toen zij optoog uit Egypteland.","15":"En het zal te dien dage geschieden, spreekt de Heere, dat gij *Mij* noemen zult: Mijn Man; en Mij niet meer noemen zult: Mijn Baäl!","16":"En Ik zal de namen der Baäls van haar mond wegdoen; zij zullen niet meer bij hun namen gedacht worden.","17":"En Ik zal te dien dage een verbond voor hen maken met het wild gedierte des velds, en met het gevogelte des hemels, en het kruipend gedierte des aardbodems; en Ik zal den boog, en het zwaard, en den krijg van de aarde verbreken, en zal hen in zekerheid doen nederliggen.","18":"En Ik zal u Mij ondertrouwen in eeuwigheid; ja, Ik zal u Mij ondertrouwen in gerechtigheid en in gericht, en in goedertierenheid en in barmhartigheden.","19":"En Ik zal u Mij ondertrouwen in geloof; en gij zult den Heere kennen.","20":"En het zal te dien dage geschieden, dat Ik verhoren zal, spreekt de Heere; Ik zal den hemel verhoren, en die zal de aarde verhoren.","21":"En de aarde zal het koren verhoren, mitsgaders den most en de olie; en die zullen Jizreël verhoren.","22":"En Ik zal ze Mij op de aarde zaaien, en zal Mij ontfermen over Lo-ruchama; en Ik zal zeggen tot Lo-ammi: Gij zijt Mijn volk; en dat zal zeggen: O, mijn God!"},"KJV":{"1":"Plead with your mother, plead: for she *is* not my wife, neither *am* I her husband: let her therefore put away her whoredoms out of her sight, and her adulteries from between her breasts;","2":"Lest I strip her naked, and set her as in the day that she was born, and make her as a wilderness, and set her like a dry land, and slay her with thirst.","3":"And I will not have mercy upon her children; for they *be* the children of whoredoms.","4":"For their mother hath played the harlot: she that conceived them hath done shamefully: for she said, I will go after my lovers, that give *me* my bread and my water, my wool and my flax, mine oil and my drink.","5":"Therefore, behold, I will hedge up thy way with thorns, and make a wall, that she shall not find her paths.","6":"And she shall follow after her lovers, but she shall not overtake them; and she shall seek them, but shall not find *them*: then shall she say, I will go and return to my first husband; for then *was it* better with me than now.","7":"For she did not know that I gave her corn, and wine, and oil, and multiplied her silver and gold, *which* they prepared for Baal.","8":"Therefore will I return, and take away my corn in the time thereof, and my wine in the season thereof, and will recover my wool and my flax *given* to cover her nakedness.","9":"And now will I discover her lewdness in the sight of her lovers, and none shall deliver her out of mine hand.","10":"I will also cause all her mirth to cease, her feast days, her new moons, and her sabbaths, and all her solemn feasts.","11":"And I will destroy her vines and her fig trees, whereof she hath said, These *are* my rewards that my lovers have given me: and I will make them a forest, and the beasts of the field shall eat","12":"And I will visit upon her the days of Baalim, wherein she burned incense to them, and she decked herself with her earrings and her jewels, and she went after her lovers, and forgat me, saith the LORD.","13":"Therefore, behold, I will allure her, and bring her into the wilderness, and speak comfortably","14":"And I will give her her vineyards from thence, and the valley of Achor for a door of hope: and she shall sing there, as in the days of her youth, and as in the day when she came up out of the land of Egypt.","15":"And it shall be at that day, saith the LORD, *that* thou shalt call me Ishi; and shalt call me no more Baali.","16":"For I will take away the names of Baalim out of her mouth, and they shall no more be remembered by their name.","17":"And in that day will I make a covenant for them with the beasts of the field, and with the fowls of heaven, and *with* the creeping things of the ground: and I will break the bow and the sword and the battle out of the earth, and will make them to lie down safely.","18":"And I will betroth thee unto me for ever; yea, I will betroth thee unto me in righteousness, and in judgment, and in lovingkindness, and in mercies.","19":"I will even betroth thee unto me in faithfulness: and thou shalt know the LORD.","20":"And it shall come to pass in that day, I will hear, saith the LORD, I will hear the heavens, and they shall hear the earth;","21":"And the earth shall hear the corn, and the wine, and the oil; and they shall hear Jezreel.","22":"And I will sow her unto me in the earth; and I will have mercy upon her that had not obtained mercy; and I will say to *them which were* not my people, Thou *art* my people; and they shall say, *Thou art* my God."}},"tsk":{"1":[{"kopje":"Twist tegen","refs":["Jes 58:1","Jer 2:2","Jer 19:3","Ezech 20:4","Ezech 23:45","Matt 23:37-39","Hand 7:51-53","2 Kor 5:16"]},{"kopje":"zij","refs":["Jes 50:1","Jer 3:6-8"]},{"kopje":"laat","refs":["Hos 1:2","Jer 3:1","Jer 3:9","Jer 3:13","Ezech 16:20","Ezech 16: ":"../../torrey/a/#t-adoption","kinderen":[{"label":"Of Gentiles, predicted","href":"../../torrey/a/?hl=Hos.2.22#i25","refs":[{"disp":"Hos 2:23","href":"../../hosea/2/#v22","ref":"Hos 2:22","svLabel":"SV 22"},{"disp":"Rom 9:24-26","href":"../../romeinen/9/#v24","ref":"Rom 9:24-26","svLabel":null},{"disp":"Ef 3:6","href":"../../efeze/3/#v6","ref":"Ef 3:6","svLabel":null}],"kinderen":[]}]},{"topic":"Mercy Of God, The","href":"../../torrey/m/#t-mercy-of-god-the","kinderen":[{"label":"Manifested","href":"../../torrey/m/?hl=Hos.2.22#i12758","refs":[],"kinderen":[{"label":"To whom he will","href":"../../torrey/m/?hl=Hos.2.22#i12768","refs":[{"disp":"Hos 2:23","href":"../../hosea/2/#v22","ref":"Hos 2:22","svLabel":"SV 22"},{"disp":"Rom 9:15","href":"../../romeinen/9/#v15","ref":"Rom 9:15","svLabel":null},{"disp":"Rom 9:18","href":"../../romeinen/9/#v18","ref":"Rom 9:18","svLabel":null}],"kinderen":[]}]}]}]}},"noten":{"1":"Vers 12 – SV: voorhoofdsiersel. D.i.: een ring of sieraad op het voorhoofd (Hebr. nezem)."},"koppeling":{"1":"Twist tegen uw moeder, twist, omdat zij Mijn vrouw niet is, en Ik haar Man niet ben; en laat ze haar hoererijen van haar gezicht, en haar overspelerijen van tussen haar borsten wegdoen.","2":"Anders zal Ik ze naakt uitkleden, en haar neerzetten als op de dag dat zij geboren werd; ja, Ik zal haar maken als een woestijn, en haar neerzetten als een dor land, en haar doden door dorst;","3":"En Ik zal Mij niet ontfermen over haar kinderen, omdat zij kinderen van de hoererijen zijn.","4":"Want hun moeder hoereert, zij die hen ontvangen heeft, handelt schandelijk; want zij zegt: Ik zal mijn minnaars nagaan, die <em>mij</em> mijn brood en mijn water, mijn wol en mijn vlas, mijn olie en mijn drank geven.","5":"Daarom, zie, Ik zal uw weg met doornen omtuinen, en Ik zal een omheiningsmuur maken, zodat zij haar paden niet zal vinden.","6":"En zij zal haar minnaars nalopen, maar hen niet aantreffen; en zij zal hen zoeken, maar niet vinden; dan zal zij zeggen: Ik zal heengaan, en terugkeren naar mijn vorige Man, want toen ging het mij beter dan nu.","7":"Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, <em>dat</em> zij voor de Baäl gebruikt hebben.","8":"Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, <em>dat diende</em> om haar naaktheid te bedekken.","9":"En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden.","10":"En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.","11":"En Ik zal haar wijnstok en haar vijgenboom verwoesten, waarvan zij zegt: Deze zijn mij een hoerenloon, dat mijn minnaars mij gegeven hebben; maar Ik zal ze tot een woud maken, en het wild gedierte van het veld zal ze opeten.","12":"En Ik zal aan haar de dagen van de Baäl bezoeken, waarin zij hem wierook gebracht heeft, en zich versierd heeft met haar voorhoofdsieraad, en haar halssieraad, en haar minnaars is nagegaan, maar Mij heeft vergeten, spreekt de Heere.","13":"Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken.","14":"En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland.","15":"En het zal op die dag gebeuren, spreekt de Heere, dat u <em>Mij</em> zult noemen: Mijn Man; en Mij niet meer zult noemen: Mijn Baäl!","16":"En Ik zal de namen van de Baäls uit haar mond wegdoen; er zal niet meer aan hun namen gedacht worden.","17":"En Ik zal op die dag een verbond voor hen sluiten met het wild gedierte van het veld, en met het gevogelte van de hemel, en het kruipend gedierte van de aardbodem; en Ik zal de boog, en het zwaard, en de oorlog van de aarde wegbreken, en Ik zal hen in veiligheid laten neerliggen.","18":"En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.","19":"En Ik zal u aan Mij verloven in geloof; en u zult de Heere kennen.","20":"En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.","21":"En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.","22":"En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!"},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H7378\">Plead</span> with your <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> <span class=\"wl wl-kjv\" data-code=\"H7378\">plead:</span> for she is not my <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> neither am I her <span class=\"wl wl-kjv\" data-code=\"H376\">husband:</span> let her therefore put <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> her <span class=\"wl wl-kjv\" data-code=\"H2183\">whoredoms</span> out of her <span class=\"wl wl-kjv\" data-code=\"H6440\">sight,</span> and her <span class=\"wl wl-kjv\" data-code=\"H5005\">adulteries</span> from between her breasts;","2":"Lest I <span class=\"wl wl-kjv\" data-code=\"H6584\">strip</span> her <span class=\"wl wl-kjv\" data-code=\"H6174\">naked,</span> and <span class=\"wl wl-kjv\" data-code=\"H3322\">set</span> her as in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that she was <span class=\"wl wl-kjv\" data-code=\"H3205\">born,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> her as a <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and <span class=\"wl wl-kjv\" data-code=\"H7896\">set</span> her like a <span class=\"wl wl-kjv\" data-code=\"H6723\">dry</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> her with thirst.","3":"And I will not have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> upon her <span class=\"wl wl-kjv\" data-code=\"H1121\">children;</span> for they be the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of whoredoms.","4":"For their <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> hath played the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot:</span> she that <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived</span> them hath done <span class=\"wl wl-kjv\" data-code=\"H3001\">shamefully:</span> for she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> my <span class=\"wl wl-kjv\" data-code=\"H157\">lovers,</span> that <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me my <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and my <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> my <span class=\"wl wl-kjv\" data-code=\"H6785\">wool</span> and my <span class=\"wl wl-kjv\" data-code=\"H6593\">flax,</span> mine <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> and my drink.","5":"Therefore, behold, I will <span class=\"wl wl-kjv\" data-code=\"H7753\">hedge</span> up thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> with <span class=\"wl wl-kjv\" data-code=\"H5518\">thorns,</span> and <span class=\"wl wl-kjv\" data-code=\"H1443\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1447\">wall,</span> that she shall not <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> her paths.","6":"And she shall <span class=\"wl wl-kjv\" data-code=\"H7291\">follow</span> after her <span class=\"wl wl-kjv\" data-code=\"H157\">lovers,</span> but she shall not <span class=\"wl wl-kjv\" data-code=\"H5381\">overtake</span> them; and she shall <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> them, but shall not <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> them: then shall she <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to my <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H376\">husband;</span> for then was it <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> with me than now.","7":"For she did not <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> her <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> and <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and <span class=\"wl wl-kjv\" data-code=\"H3323\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> her <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> which they <span class=\"wl wl-kjv\" data-code=\"H6213\">prepared</span> for Baal.","8":"Therefore will I <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> my <span class=\"wl wl-kjv\" data-code=\"H1715\">corn</span> in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> thereof, and my <span class=\"wl wl-kjv\" data-code=\"H8492\">wine</span> in the <span class=\"wl wl-kjv\" data-code=\"H4150\">season</span> thereof, and will <span class=\"wl wl-kjv\" data-code=\"H5337\">recover</span> my <span class=\"wl wl-kjv\" data-code=\"H6785\">wool</span> and my <span class=\"wl wl-kjv\" data-code=\"H6593\">flax</span> given to <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> her nakedness.","9":"And now will I <span class=\"wl wl-kjv\" data-code=\"H1540\">discover</span> her <span class=\"wl wl s:</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the LORD.","20":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6030\">hear,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6030\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H6030\">hear</span> the earth;","21":"And the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall <span class=\"wl wl-kjv\" data-code=\"H6030\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3323\">oil;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H6030\">hear</span> Jezreel.","22":"And I will <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> her unto me in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> and I will have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> upon her that had not obtained <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to them which were not my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Thou art my <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thou art my God."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"tegen ulieder","tekst":"Of, pleit, richt; dat is, gij vrome profeten en gelovige Israëlieten, die nog onder het volk overig zijt, bestraft ernstiglijk en scherpelijk de uiterste boosheid van het volk, met voorstelling van mijn toorn en nakende straffen."},{"catchword":"moeder,","tekst":"Dat is, het volk Israëls, de republiek der tien stammen, of de synagoge Israëls, alzo onder vs.4, en Hos 4:5 . Vergelijk Isa 50:1 , enz."},{"catchword":"omdat zij Mijn vrouw niet is,","tekst":"Zij houdt mij geen geloof, kent mij niet voor haren man, zo zal Ik haar ook niet meer kennen, tenzij dat zij zich bekeert, gelijk volgt: anders zal Ik doen, gelijk vs.2, enz."},{"catchword":"hoererijen van haar aangezicht,","tekst":"Dat is, de uiterlijke tekenen van haar hoerachtige en overspelig hart, als daar zijn blanketsels des aangezichts en sieraad der borsten, enz. Dit alles beduidt de openbare, onbeschaamde en ongebonden afgoderij. Vergelijk Jer 4:30 ; Eze 16:11 , Eze 16:17-18 , en Eze 23:40 , enz.; idem Pro 7:16 ."}],"2":[{"catchword":"uitstrope,","tekst":"Of, doen stropen, uittrekken, ontkleden; dat is, beroof van alle lichamelijke en geestelijke sieraad, waarmede Ik haar zo heerlijk versierd had. Zie Eze 16:10-13 , en Eze 23:26 ."},{"catchword":"geboren werd;","tekst":"Dat is, toen Ik hen eerst tot mijn volk aannam, in Egypte, waar zij in jammerlijke dienstbaarheid staken; ja dat Ik hen nog ellendiger maakte door mijn rechtvaardige oordelen. Vergelijk Eze 16:4 , enz., en Eze 23:2 ."},{"catchword":"make ze als een woestijn,","tekst":"Hebreeuws, stelle ze."},{"catchword":"dor land,","tekst":"Hebreeuws, het land der dorheid, of dorstigheid."},{"catchword":"dorst;","tekst":"Vergelijk Isa 5:13 ; Amo 8:11 , Amo 8:13 ."}],"3":[{"catchword":"kinderen niet ontferme,","tekst":"De leden van het volk Israël."},{"catchword":"kinderen der hoererijen zijn","tekst":"Onherboren, onrein, onheilig; [vergelijk Joh 8:44 ] , als in onecht en in een afgodisch huwelijk gewonnen, dewijl de moeder ene overspeelster en mij ontrouw geworden is, gelijk volgt."}],"4":[{"catchword":"boelen nagaan,","tekst":"Afgoden, en voorts afgodische volken, waar ik wel bij was. Zie Deu 8:12 , Deu 8:14 , Deu 8:19 ; Jer 44:17 ."},{"catchword":"drank geven","tekst":"Hebreeuws alsof men zeide: dranken, drinkingen."}],"5":[{"catchword":"maken,","tekst":"Hebreeuws alsof men zeide: muren toemuren."},{"catchword":"paden niet zal vinden","tekst":"Dat is, Ik zal hen van alle kanten zo benauwen, dat zij dit hoereren wel zullen afleren, of moeten laten aanstaan. Vergelijk Job 3:23 , en Job 19:8 ; Lam 3:7 , Lam 3:9 ; idem Eze 16:41 , en Eze 23:22-24 ."}],"6":[{"catchword":"nalopen,","tekst":"Als tegen mijn dank willende doordringen."},{"catchword":"Man,","tekst":"Den Heere."}],"7":[{"catchword":"bekent toch niet,","tekst":"Of, weet, erkent; dat is, zij wil het niet weten, of bekennen, het is een moedwillige onwetendheid; of zij neemt het niet ter harte."},{"catchword":"koren, en den most,","tekst":"Allerlei zegen."},{"catchword":"gebruikt hebben","tekst":"Of, [waarvan] zij een Baäl gemaakt hebben. Hebreeuws, gedaan, gemaakt, bereid. God wil zeggen dat zij al zijn schone gaven schandelijk ter afgoderij misbruikt hebben. Van Baäl zie Jdg 2:11 , en vergelijk Eze 7:20 , en Eze 16:16-19 , onder Hos 8:4 , en Hos 12:2 ."}],"8":[{"catchword":"Mijn koren wegnemen","tekst":"Vergelijk Eze 16:17-19 , met de aantekening."},{"catchword":"op zijn tijd,","tekst":"Als Ik dat beloofd had en placht te geven; of in den oogst, als het rijp zal zijn, en gij het koren en de most enz. meent in te zamelen."},{"catchword":"wegrukken Mijn wol en Mijn vlas,","tekst":"Dat is, hun ontnemen; alsof de Heere zeide: Het is aan hen kwalijk besteed, zij zijn het niet waard, daarom zal Ik het redden uit de handen dezer misbruikers, die het ten onrechte bezitten."}],"9":[{"catchword":"dwaasheid ontdekken","tekst":"Of, schandelijkheid. Zie Gen 34:7 ; Jer 13:22 ; Eze 16:36-37 ."}],"10":[{"catchword":"feesten,","tekst":"Hebreeuws, feest, nieuwe maand, sabbat, gezette hoogtijd; dat is, zij zullen geen uiterlijken vorm van godsdienst hebben [gelijk onder Hos 3:4 ] , en dienvolgens gene vreugde noch troost in het houden der feestdagen."}],"11":[{"catchword":"hoerenloon,","tekst":"Dat is, beloning mijner afgoderij; vergelijk onder Hos "kanttekeningen_en":{"1":[{"catchword":null,"tekst":"(1) Contend [Or plead strive, debate] with your mother, [i.e. the people of Israel, the common wealth of the ten tribes, or the synagogue of Israel, so bel. Vers. 4. and chap. 4.5. Compar Isa. 1. 50. &c. The sense is ye the godly prophets and faithful Israelites, which yet remain among the people, be admonished seriously and sharply to reprove the excessive wickednesse of the people, setting before their eyes, my fierce wrath and heavy judgement at hand] because she is not my wife, and I am not her husband: [i.e. she is not true and faithful to me, she doth not acknowledge me her husband; therefore I will not own her neither anymore, without she repent, as followeth; otherwise I shall proceed with her, as is set down verse 2.] and let her put away her whoresdoms from her face, and her adulteries from between her breasts, [i.e. all those outward marks and to kens of her whorish and adulterous heart, such as are your painting of the face, and setting out or adorning of the breast, whereby is signified their notorious , shamelesse and uncontrolled idolatry. Compare Jer.4. 30. Ezek. 16. 11,17,18. and 23. 40, etc. and Pro 7:16.]"}],"2":[{"catchword":null,"tekst":"(2) Left I do strip her naked, [Or cause her to be striped, unrayed, despoiled of her garments, i.e. dispossesse and bereave her of all bodily and spiritual ornaments, wherewith I had so gloriously adorn&acirc;&euro;&trade;d her. See Eze 16:10, 11, 12, 13,. And 23. 26. ] and put her as in the day she was born: [i.e. when I first took them to be my people, in the land of Egypt, form under the grievous bondage they were in] yea, make them as desert, [i.e. far worse in condition then they were in Egypt,] and set [or place] them as dry land,[Heb. Land of drought, or thirstiness] and put them to death, through thirst; [viz. by my righteous judgements. Compare Ezek. 16. 4. etc. Amos 8. 11, 13.]"}],"3":[{"catchword":null,"tekst":"(3) And have no pity on their children:[ i.e. on the people of Israel ] because they are children of whoredom, [i.e. unregenerate, polluted, unholy, (compare Job. 8. 44.) as begotten illegitimate, and in an idolatrous wedlock, the mother being become an adultresse, and unfaithful to me, as followeth.]"}],"4":[{"catchword":null,"tekst":"(4) For their mother playeth the whore, she that conceived them, dealeth shamefully: so she saith, I will go after my lovers, [i.e. idols, and consequently idolatrous nations with whom I thrive and prosper as folleth. See Deut. 8. 12, 19. Jer. 44. 17.] that give me (my) bread and water, my wooll and my flax, mine oil and my drink. [Heb. My drinks, or, drinkings]"}],"5":[{"catchword":null,"tekst":"(5) Therefore behold, I will fence way with thrones and I will make a close wall, [Heb. As if one should say, wall up walls] that they shall not finde their paths. [i.e. I shall so trouble and distresse them on all sides, that they shall begin to loath and be glad to leave their whoring, compare Job 3. 23. and 10.8. Lam 3:7,9. also Eze 16:41. and 23.22, 23, 24.]"}],"6":[{"catchword":null,"tekst":"(6) And he shall run after her lovers, [Obstinately attempting to break through all the foresaid implediments] but not to meet them: and she shall seek, but not to finde them: she will say: I will go now and turn again to my former husband; [i.e. to the LORD] for then better with me than now."}],"7":[{"catchword":null,"tekst":"(7) Yet she confesseth not [Or knoweth acknowledgeth not, know nor acknowledge it; it is a willful ignorance of hers; or she takes it not to heart] that I gave her corn, and the wine and the oil, [i.e. all manner of blessings] and multiplied her silver and gold (which) they used for Baal. [or, whereof they made Baal, Heb. Done, made, prepared. God implying here, that they had shamefully abused the good gifts of God unto idolatry. Of Baal, see Jud. 2. on verse. 11, &c. Compare Ezek. 7.20. and 16, 17, 18, 19 and below chap.8. 4. and 12.2."}],"8":[{"catchword":null," e eternal glory of that to come; this is the substance of the following verse of this chapter. Set forth under the notions of temporal promises, according to the stile of the Old Testament, appertaining to the universal Church of Jews and Gentiles. compare Isa. 65. 9. and bel. chap. 12.10.] from thence [viz. from that wildernesse having past it through, i.e. when her former afflictions shall be ended; as formerly also, they came not to the border of Canaan, until they were quite past through the wilderness etc] and the valley of Achor: [ of this valley see Jos.7. 24, 26. It lay right before in the land of promise, by the city of Jericho; and this was a door of hope, or expectation, that, God having, by Joshua, brought his people thus far, he would doubtlesse go on to accomplish his promise, and bring them to full possession of Canaan; as also the faithfull in this valley of mirsery and tribulation here, have though the grace of Christ, a beginning of everlasting life in them, and a door of hope, yea a living hope, of the faithfull possession of everlasting glory to come. See Heb 6.18,19,20 etc and compare Isa 65.10.] and there she shall sing, as in the dayes of her youth, and as at the day of her marching forth of the land of Egypt."}],"15":[{"catchword":null,"tekst":"(15) And it shall come to pass in that day, speaketh the LORD, that thou shalt call me, my husband, and shall no more call me, my Baal. [As meaning my further to honor God through Baal. Compare Exo 3:4,5. and Judg 2. on vers.11. The word Baal indeed doth signifie Lord and master; but in regard they were wont to give that appellation to the appellation to the idols, after them manner of the heathen, therefore God abhors that title.] b"}],"16":[{"catchword":null,"tekst":"(16) And i will put away the names of the Baals from her mouth: and they [viz. the Baals] shall no more be remembered by their names. [i.e. my church shall be cleaned from all pollution of idolatry and superstition.]"}],"17":[{"catchword":null,"tekst":"(17) And i will in that day make covenant for them, [i.e. in their behalf] with the wilde beasts of the field, and with the fowl of heaven, and with the creeping creatures of the earth: and i will break the bow, and the sword, and the war; [i.e. all manner of arms and instruments of war and hostility. Compare Isa. 11. 9. Mich. 5. 10, etc.] and will cause them to lie down [i.e. take rest, and sleep. See Psalm.3 . on verse. 6.] in safety."}],"18":[{"catchword":null,"tekst":"(18) And i will betroth my self unto thee for ever: [Compare Eph.5.25., etc. where the Apostle sheweth forth the mystery of this spiritual marriage, so often recorded in the scriptures. See moreover the song of Salomon] yea, i will betroth my self unto thee in [or, with, through, and soon.] righteousness, and in judgement, and in kindness, and in compassions.[ i.e, righteousness and mercy shall kindely meet and kiss each other in work of Grace; let the devout reader compare these termes with Psal.85. 10, to 15. Isa. 1. 27. and 45.8, 23, 24, etc.]"}],"19":[{"catchword":null,"tekst":"(19) And i will betroth my self unto thee [Observe, that this gracious promise is repeated three times in this and the former verse, for our further comfort and assurance] in faith: [or, faithfullness] and shalt know the LORD."}],"20":[{"catchword":null,"tekst":"(20) And it shall come to pass in that day i shall hear, speaketh the LORD: i will hear the heaven: and the same shall hear the earth. [ figurative expressions, whereby God would make it known, that all creatures would serve his church unto salvation, when he is reconciled and at peace with her Compare Rom.8. 20, 21,22,28.]"}],"21":[{"catchword":null,"tekst":"(21) And the earth shall hear the corn, together with the new wine, and the oyl: and they shall hear Jezreel. [i.e. Gods people is so called, not onely for having lived and suffered there (as above chap. 1.5.) but especially in regard of this name Jezreel, signifying the sowed ones or the see (function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
