Blaas de bazuin te Gibea, de trompet te Rama; roep luid te Beth-Aven; achter u, Benjamin!","9":"Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.","10":"De vorsten van Juda zijn geworden als zij die de grenzen verleggen; Ik zal Mijn verbolgenheid als water over hen uitgieten.","11":"Efraïm is verdrukt, hij is verpletterd met recht; want hij heeft dat zo gewild; hij heeft gewandeld naar het gebod.","12":"Daarom zal Ik voor Efraïm zijn als een mot, en voor het huis van Juda als verrotting.","13":"Toen Efraïm zijn ziekte zag, en Juda zijn gezwel, ging Efraïm naar Assur, en hij stuurde iemand naar koning Jareb; maar die zal u niet kunnen genezen, en zal het gezwel van u niet helen.","14":"Want Ik zal voor Efraïm zijn als een felle leeuw, en voor het huis van Juda als een jonge leeuw; Ik, Ik zal verscheuren en heengaan; Ik zal wegvoeren, en er zal geen redder zijn.","15":"Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken."},"SV":{"1":"Hoort dit, gij priesters! en merkt op, gij huis Israëls! en neemt ter oren, gij huis des konings! want ulieden *gaat* dit oordeel aan, omdat gij een strik zijt geworden te Mizpa, en een uitgespannen net op Thabor.","2":"En die afwijken, verdiepen zich *om* te slachten; maar Ik zal hun allen een tuchtmeester zijn.","3":"Ik ken Efraïm, en Israël is voor Mij niet verborgen; dat gij, o Efraïm! nu hoereert, *en* Israël verontreinigd is.","4":"Zij stellen hun handelingen niet aan, om zich tot hun God te bekeren; want de geest der hoererijen is in het midden van hen, en den Heere kennen zij niet.","5":"Dies zal Israël hovaardij in zijn aangezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook zal Juda met hen vallen.","6":"Met hun schapen, en met hun runderen zullen zij *dan* gaan, om den Heere te zoeken, maar niet vinden; Hij heeft Zich van hen onttrokken.","7":"Zij hebben trouwelooslijk gehandeld tegen den Heere; want zij hebben vreemde kinderen gewonnen; nu zal hen de nieuwe maand verteren met hun delen.","8":"Blaast de bazuin te Gibea, de trompet te Rama; roept luide *te* Beth-aven; achter u, Benjamin!","9":"Efraïm zal tot verwoesting worden, ten dage der straf; onder de stammen Israëls heb Ik bekend gemaakt, dat gewis is.","10":"De vorsten van Juda zijn geworden, gelijk die de landpalen verrukken; Ik zal Mijn verbolgenheid, als water, over hen uitgieten.","11":"Efraïm is verdrukt, hij is verpletterd met recht; want hij heeft *zo* gewild; hij heeft gewandeld naar het gebod.","12":"Daarom zal Ik Efraïm zijn als een mot, en den huize van Juda als een verrotting.","13":"Als Efraïm zijn krankheid zag, en Juda zijn gezwel, zo toog Efraïm tot Assur, en hij zond tot den koning Jareb; maar die zal ulieden niet kunnen genezen, en zal het gezwel van ulieden niet helen.","14":"Want Ik zal Efraïm zijn als een felle leeuw, en den huize van Juda als een jonge leeuw; Ik, Ik zal verscheuren en henengaan; Ik zal wegvoeren, en er zal geen redder zijn.","15":"Ik zal henengaan *en* keren weder tot Mijn plaats, totdat zij zichzelven schuldig kennen en Mijn aangezicht zoeken; als hun bange zal zijn, zullen zij Mij vroeg zoeken."},"KJV":{"1":"Hear ye this, O priests; and hearken, ye house of Israel; and give ye ear, O house of the king; for judgment *is* toward you, because ye have been a snare on Mizpah, and a net spread upon Tabor.","2":"And the revolters are profound to make slaughter, though I *have been* a rebuker","3":"I know Ephraim, and Israel is not hid from me: for now, O Ephraim, thou committest whoredom, *and* Israel is defiled.","4":"They will not frame their doings to turn unto their God: for the spirit of whoredoms *is* in the midst of them, and they have not known the LORD.","5":"And the pride of Israel doth testify to his face: therefore shall Israel and Ephraim fall in their iniquity; Judah also shall fall","6":"They shall go with their flocks and with their herds to seek the LORD; but they shall not find *him*; he hath withdrawn","7":"They have dealt treacherously against the LORD: for they have begotten strange children: now shall a month devour them with their portions.","8":"Blow ye the cornet in Gibeah, *and* the trumpet in Ramah: cry aloud *at* Bethaven, after thee, O Benjamin.","9":"Ephraim shall be desolate in the day of rebuke: among the tribes of Israel have I made known that which shall surely be.","10":"The princes of Judah were like them that remove the bound: *therefore* I will pour out my wrath upon them like water.","11":"Ephraim *is* oppressed *and* broken in judgment, because he willingly walked after the commandment.","12":"Therefore *will* I *be* unto Ephraim as a moth, and to the house of Judah as rottenness.","13":"When Ephraim saw his sickness, and Judah *saw* his wound, then went Ephraim to the Assyrian, and sent to king Jareb: yet could he not heal you, nor cure you of your wound.","14":"For I *will be* unto Ephraim as a lion, and as a young lion to the house of Judah: I, *even* I, will tear and go away; I will take away, and none shall rescue","15":"I will go *and* return to my place, till they acknowledge their offence, and seek my face: in their affliction they will seek me early."}},"tsk":{"1":[{"kopje":"priesters","refs":["Hos 4:1","Hos 4:6","Hos 4:7","Hos 6:9","Mal 1:6","Mal 2:1"]},{"kopje":"huis","refs":["Hos 7:3-5","1 Kon 14:7-16","1 Kon 21:18-22","2 Kron 21:12-15","Jer 13:18","Jer 22:1-9","Amos 7:9","Micha 3:1","Micha 3:9"]},{"kopje":"Want","refs":["Hos 9:11-17","Hos 10:15","Hos 13:8"]},{"kopje":"u geldt dit oordeel","refs":["Hos 9:8","Micha 7:2","Hab 1:15-17"]},{"kopje":"Thabor","refs":["Richt 4:6","Jer 46:18"]}],"2":[{"kopje":"Zij die afwijken","refs":["Hos 6:9","Hos 9:15","Jer 6:28"]},{"kopje":"verdiepen zich","refs":["Ps 64:4-7","Ps 140:2-6","Jes 29:15","Jer 11:18","Jer 11:19","Jer 18:18","Luk 22:2-5","Hand 23:12-15"]}, disp":"Jak 4:8","href":"../../jakobus/4/#v8","ref":"Jak 4:8","svLabel":null},{"disp":"Openb 3:20","href":"../../openbaring/3/#v20","ref":"Openb 3:20","svLabel":null},{"disp":"Openb 21:6","href":"../../openbaring/21/#v6","ref":"Openb 21:6","svLabel":null},{"disp":"Openb 22:17","href":"../../openbaring/22/#v17","ref":"Openb 22:17","svLabel":null}],"kinderen":[]}]}],"torrey":[{"topic":"Afflictions Made Beneficial","href":"../../torrey/a/#t-afflictions-made-beneficial","kinderen":[{"label":"In leading us to seek God in prayer","href":"../../torrey/a/?hl=Hos.5.15#i180","refs":[{"disp":"Richt 4:3","href":"../../richteren/4/#v3","ref":"Richt 4:3","svLabel":null},{"disp":"Jer 31:18","href":"../../jeremia/31/#v18","ref":"Jer 31:18","svLabel":null},{"disp":"Klaagl 2:17-19","href":"../../klaagliederen/2/#v17","ref":"Klaagl 2:17-19","svLabel":null},{"disp":"Hos 5:14","href":"../../hosea/5/#v14","ref":"Hos 5:14","svLabel":null},{"disp":"Hos 5:15","href":"../../hosea/5/#v15","ref":"Hos 5:15","svLabel":null},{"disp":"Jona 2:1","href":"../../jona/2/#v1","ref":"Jona 2:1","svLabel":null}],"kinderen":[]}]},{"topic":"Backsliding","href":"../../torrey/b/#t-backsliding","kinderen":[{"label":"Afflictions sent to heal","href":"../../torrey/b/?hl=Hos.5.15#i1469","refs":[{"disp":"Hos 5:15","href":"../../hosea/5/#v15","ref":"Hos 5:15","svLabel":null}],"kinderen":[]}]},{"topic":"Confession Of Sin","href":"../../torrey/c/#t-confession-of-sin","kinderen":[{"label":"God requires","href":"../../torrey/c/?hl=Hos.5.15#i3572","refs":[{"disp":"Lev 5:5","href":"../../leviticus/5/#v5","ref":"Lev 5:5","svLabel":null},{"disp":"Hos 5:15","href":"../../hosea/5/#v15","ref":"Hos 5:15","svLabel":null}],"kinderen":[]}]},{"topic":"Seeking God","href":"../../torrey/s/#t-seeking-god","kinderen":[{"label":"Afflictions designed to lead to","href":"../../torrey/s/?hl=Hos.5.15#i19072","refs":[{"disp":"Ps 78:33","href":"../../psalmen/78/#v33","ref":"Ps 78:33","svLabel":null},{"disp":"Ps 78:34","href":"../../psalmen/78/#v34","ref":"Ps 78:34","svLabel":null},{"disp":"Hos 5:15","href":"../../hosea/5/#v15","ref":"Hos 5:15","svLabel":null}],"kinderen":[]}]}]}},"noten":{},"koppeling":{"1":"Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor.","2":"En zij die afwijken, verdiepen zich erin om te slachten; maar Ik zal hun allen een tuchtmeester zijn.","3":"Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.","4":"Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet.","5":"Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen.","6":"Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.","7":"Zij hebben trouweloos gehandeld tegen de Heere; want zij hebben vreemde kinderen verwekt; nu zal de nieuwe maand hen verteren met hun delen.","8":"Blaas de bazuin te Gibea, de trompet te Rama; roep luid te Beth-Aven; achter u, Benjamin!","9":"Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.","10":"De vorsten van Juda zijn geworden als zij die de grenzen verleggen; Ik zal Mijn verbolgenheid als water over hen uitgieten.","11":"Efraïm is verdrukt, hij is verpletterd met recht; want hij heeft dat zo gewild; hij heeft gewandeld naar het gebod.","12":"Daarom zal Ik voor Efraïm zijn als een mot, en voor het huis van Juda als verrotting.","13":"Toen Efraïm zijn ziekte zag, en Juda zijn gezwel, ging Efraïm naar Assur, en hij stuurde iemand naar koning Jareb; maar die zal u niet kunnen genezen, en zal het gezwel van u niet helen.","14":"Want Ik zal voor Efraïm zijn als een felle leeuw, en voor het huis van Juda als een jonge leeuw; Ik, Ik zal verscheuren en heengaan; Ik zal wegvoeren, en er zal geen redder zijn.","15":"Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> ye this, O <span class=\"wl wl-kjv\" data-code=\"H3548\">priests;</span> and <span class=\"wl wl-kjv\" data-code=\"H7181\">hearken,</span> ye <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and give ye <span class=\"wl wl-kjv\" data-code=\"H238\">ear,</span> O <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> for <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> is toward you, because ye have been a <span class=\"wl wl-kjv\" data-code=\"H6341\">snare</span> on <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpah,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7568\">net</span> <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> upon Tabor.","2":"And the <span class=\"wl wl-kjv\" data-code=\"H7846\">revolters</span> are <span class=\"wl wl-kjv\" data-code=\"H6009\">profound</span> to make <span class=\"wl wl-kjv\" data-code=\"H7819\">slaughter,</span> though I have been a rebuker","3":"I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is not <span class=\"wl wl-kjv\" data-code=\"H3582\">hid</span> from me: for now, O <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> thou committest <span class=\"wl wl-kjv\" data-code=\"H2181\">whoredom,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is defiled.","4":"They will not <span class=\"wl wl-kjv\" data-code=\"H5414\">frame</span> their <span class=\"wl wl-kjv\" data-code=\"H4611\">doings</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> unto their <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> for the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H2183\">whoredoms</span> is in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of them, and they have not <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> the LORD.","5":"And the <span class=\"wl wl-kjv\" data-code=\"H1347\">pride</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> doth <span class=\"wl wl-kjv\" data-code=\"H6030\">testify</span> to his <span class=\"wl wl-kjv\" data-code=\"H6440\">face:</span> therefore shall <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H3782\">fall</span> in their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> also shall fall","6":"They shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with their <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> and with their <span class=\"wl wl-kjv\" data-code=\"H1241\">herds</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> but they shall not <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> him; he hath withdrawn","7":"They have dealt <span class=\"wl wl-kjv\" data-code=\"H898\">treacherously</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for they have <span class=\"wl wl-kjv\" data-code=\"H3205\">begotten</span> <span class=\"wl wl-kjv\" data-code=\"H2114\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children:</span> now shall a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> them with their portions.","8":"<span class=\"wl wl-kjv\" data-code=\"H8628\">Blow</span> ye the <span class=\"wl wl-kjv\" data-code=\"H7782\">cornet</span> in <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpet</span> in <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah:</span> cry <span class=\"wl wl-kjv\" data-code=\"H7321\">aloud</span> at <span class=\"wl wl-kjv\" data-code=\"H1007\">Bethaven,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> thee, O Benjamin.","9":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8047\">desolate</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H8433\">rebuke:</span> among the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> have I made <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> that which shall surely be.","10":"The <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> were like them that <span class=\"wl wl-kjv\" data-code=\"H5253\">remove</span> the <span class=\"wl wl-kjv\" data-code=\"H1366\">bound:</span> therefore I will pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath</span> upon them like water.","11":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> is <span class=\"wl wl-kjv\" data-code=\"H6231\">oppressed</span> and <span class=\"wl wl-kjv\" data-code=\"H7533\">broken</span> in <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> because he <span class=\"wl wl-kjv\" data-code=\"H2974\">willingly</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the commandment.","12":"Therefore will I be unto <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> as a <span class=\"wl wl-kjv\" data-code=\"H6211\">moth,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> as rottenness.","13":"When <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> his <span class=\"wl wl-kjv\" data-code=\"H2483\">sickness,</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> saw his <span class=\"wl wl-kjv\" data-code=\"H4205\">wound,</span> then <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> to the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrian,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3377\">Jareb:</span> yet <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> he not <span class=\"wl wl-kjv\" data-code=\"H7495\">heal</span> you, nor <span class=\"wl wl-kjv\" data-code=\"H1455\">cure</span> you of your wound.","14":"For I will be unto <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> as a <span class=\"wl wl-kjv\" data-code=\"H7826\">lion,</span> and as a young <span class=\"wl wl-kjv\" data-code=\"H3715\">lion</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah:</span> I, even I, will <span class=\"wl wl-kjv\" data-code=\"H2963\">tear</span> and go <span class=\"wl wl-kjv\" data-code=\"H3212\">away;</span> I will take <span class=\"wl wl-kjv\" data-code=\"H5375\">away,</span> and none shall rescue","15":"I will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to my <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> till they acknowledge their <span class=\"wl wl-kjv\" data-code=\"H816\">offence,</span> and <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face:</span> in their <span class=\"wl wl-kjv\" data-code=\"H6862\">affliction</span> they will seek me early."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"priesters","tekst":"De profeet schijnt hier de drie standen van het koninkrijk van Israël onderscheidenlijk aan te spreken: de kerkelijke, de oudsten van het volk en den koning. Doch sommigen menen dat het huis Israëls hier de tien stammen betekent, en door den koning de koning van Juda verstaan wordt."},{"catchword":"ulieden gaat dit oordeel aan,","tekst":"Hebreeuws, tot, of voor ulieden [is] dit oordeel: te weten Gods; dat is, deze straf gaat u aan; zie Jer 48:21 . Anders: u betaamt het gericht, of recht; dat is, gij behoordet recht te doen; en dan voorts, maar gij zijt een strik. Vergelijk Mic 3:1 , en Mal 2:1 , Mal 2:4 ."},{"catchword":"strik zijt geworden","tekst":"Dat is, als een strik; idem, als een net."},{"catchword":"Mizpa,","tekst":"Daar waren verscheidene hoogten en plaatsen van dezen naam aan beide zijden der Jordaan: van Mizpa in Gilead, zie Jdg 10:17 , met de aantekening. Dit kan men aldus nemen dat de afgodische regenten en priesters der tien stammen aan beide zijden van de Jordaan op de hoogten wachten hebben besteld om te loeren op allen, die naar Jeruzalem mochten trekken om den waren godsdienst te oefenen, om die te vermoorden; waarop ook het begin van Jos 5:2 kan zien. Vergelijk onder Hos 6:9 , met de aantekening en Hos 7:1 ; idem, 1Ki 15:17 , en de aantekening aldaar. Anderen verstaan het alzo, dat zij met allerlei listen en vonden de ingezetenen gezocht hebben te trekken tot hun aangestelde afgoderij, om die als Gode behagelijk te doen goedvinden, handelende alzo met de mensen gelijk de vogelvangers en jagers met de vogels en het wild op deze beide hoge bergen plegen te doen."},{"catchword":"Thabor","tekst":"Van den berg Thabor zie Jdg 8:18 ."}],"2":[{"catchword":"verdiepen zich om te slachten;","tekst":"Wanneer de uitgezonden afvallige Israëlieten van de hoogten der voorschreven bergen enige vrome voorbijgangers hebben gezien, dan begeven zij zich in de laagten om die onvoorziens te vangen en te vermoorden. Sommigen zetten het aldus over: Zij verdiepen zich om de afgaanden of afwijkenden [te weten van het afgodisch Israël naar Juda en Jeruzalem] te kelen; den zin opeen uitkomende. Anderen verstaan het van diep te zondigen door het moorden der vromen, en zetten het over: verdiepen, of vermenigvuldigen het slachten; [dat van het voorzegde weinig verscheelt] of, van de diepe praktijken en arglistige vonden om het slachten der afgodische offeranden [dat God voor onnut slachten, kelen der beesten houdt, Isa 66:3 ] , goed te maken bij het volk, waarvan in de voorgaande aantekening. Het Hebreeuwse woord wordt van beide gebruikt; van zich in diepe plaatsen te begeven, versteken, verbergen, gelijk Jer 49:8 , Jer 49:30 , en van diep zondigen, gelijk Isa 31:6 , onder Hos 9:9 , en van beide tezamen [zo het schijnt] Isa 29:15 , met welke plaatsen deze beide verzen, vs.2,3, ook bekwamelijk kunnen worden vergeleken."},{"catchword":"tuchtmeester zijn","tekst":"Hebreeuws, tucht; dat is, tuchter, tuchtmeester, welk woord voor tuchtigen met woorden en slagen gebruikt wordt. Zie Pro 7:22 . Anders: hoewel Ik hun allen een tuchtmeester geweest ben; dat is, hen anders onderwezen en geleerd heb door mijne profeten."}],"3":[{"catchword":"dat gij, o Efraïm","tekst":"Alsof God zeide: Gij zult mij uw hoerdom niet verduisteren met ontkennen of bemantelen, Ik heb u al te veel op de daad betrapt."}],"4":[{"catchword":"stellen hun handelingen niet aan,","tekst":"Of, hunne handelingen geven het niet dat zij, enz. Of, zij begeven zich niet [met] hunne handelingen, om, enz. Beide manieren van spreken zijn ook in onze taal gebruikelijk. Anders: hunne werken zullen het niet toelaten dat zij, enz. Vergelijk Psa 36:3 , Psa 36:5 , en Psa 55:20 , en Psa 64:6 ."},{"catchword":"geest der hoererijen","tekst":"Zie boven Hos 4:12 ."},{"catchword":"kennen zij niet","tekst":"Hoewel zij hunne afgoderij met zijn naam zoeken te bemantelen. Zie boven Hos 4:1 , Hos 4:15 ."}],"5":[{"catchword":"zal Israël","tekst":"Anders: getuigt, of antwoordt. Alzo onder Hos 7:10 . De zin is: Hun stoute en hardnekkige verachting van alle getrouwe vermaningen en waarschuwingen mijner profeten is zo openbaar, dat zij niet kan worden geloochend, en zal tegen hen staan en als onder hunne ogen, of hen in het aangezicht beschamen en tegen getuigen in mijn gericht, tot hunne overtuiging, en een bewijs dat zij met groot recht van mij gestraft zijn; vergelijk Isa 59:12 ; Jer 14:7 ; Amo 6:8 ; Zep 2:10 . En een gelijke manier van spreken van het tegendeel, Gen 30:33 . Anders: Israëls heerlijkheid, hoogheid, uitnemendheid, enz.; dat is, de zegen, door welken Ik hen zozeer verhoogd heb, zal hen overtuigen van hunne ondankbaarheid."},{"catchword":"vallen door hun ongerechtigheid;","tekst":"Zie boven Hos 4:5 , en onder Hos 14:2 ."},{"catchword":"zal Juda met hen vallen","tekst":"Hebreeuws, is gevallen."}],"6":[{"catchword":"schapen,","tekst":"Om God door offeranden te paaien en hulp van Hem te verkrijgen, maar tevergeefs. Vergelijk 2Ki 23:21-22 , 2Ki 23:26 ."},{"catchword":"onttrokken","tekst":"Of, losgemaakt, vrijgemaakt, niet meer met hen willende te doen hebben, dewijl zij hem met hunne gruwelen lastig en verdrietig waren."}],"7":[{"catchword":"vreemde kinderen gewonnen;","tekst":"Uithuwelijken met heidense vrouwen, tegen Gods uitgedrukt bevel; vergelijk Ezr 9:1-2 ; Neh 13:23 ; Mal 2:11 ; aan zulke huwelijken was dit mede vast, dat de kinderen in afgoderij werden opgevoed."},{"catchword":"nu zal hen","tekst":"Al haast, of daaRom."},{"catchword":"nieuwe maand verteren","tekst":"Dat is, de afgoderij, die zij op de nieuwe maanden bedrijven. Sommigen nemen het als ene gelijkenis van woeker of maandgeld, dat haastelijk oploopt en den schuldenaar verteert. Anderen nemen ene maand voor een korten tijd, gelijk Zec 11:8 , of voor een gezetten zekeren tijd."},{"catchword":"delen","tekst":"Of, portiën, dat is, al hun goed, bezittend land; vergelijk Psa 16:5 met de aantekening. Sommigen verstaan de offeranden, die in vele delen verdeeld werden."}],"8":[{"catchword":"Blaast de bazuin","tekst":"Hier stelt hun God levendig voor ogen de nakende aankomst van den vijand, wanneer men gewoon is in de naastliggende plaatsen alarm te maken."},{"catchword":"Gibea,","tekst":"Gibea en Rama lagen beide in Benjamin aan de grenzen van Efraïm; zie Jdg 19:13 . Deze grens plaatsen zijn ontwijfelijk sterk en wel bezet, en dienvolgens hun toeverlaat geweest. Te Gibea had Saul gewoond, Samuël was geboren te Rama, 1Sa 1 en 1Sa 10:26 ; zie ook 1Ki 15:17 , 1Ki 15:21-22 ."},{"catchword":"Beth-aven;","tekst":"Zie boven Hos 4:15 ."},{"catchword":"achter u, Benjamin","tekst":"Hierop kan men verstaan, is de vijand, of daar is het te doen; te weten in Efraïm is de vijand doende, en daar begint hij te verwoesten, waarvan in vs.9. Benjamin lag tussen Juda en Efraïm; waarvan sommigen deze woorden nemen als ene beschrijving der gelegenheid van Juda, als gelegen in het zuiden achter Benjamin; en dat alzo Juda ook in alarm zou geraken, met trompetten en roepen, gelijk de andere voorzegde plaatsen. Of, men kan het eenvoudig aldus nemen: achter u Benjamin; dat is, Benjamin blaze ook alarm, na, of achter u, om te kennen te geven dat de alarmen van de ene plaats zouden voortgaan tot de andere en elkander volgen."}],"9":[{"catchword":"straf;","tekst":"Of, bestraffing, dat is, ten tijde als Ik het oordeel [waarvan boven vs.1] over hen spreken en uitvoeren zal."},{"catchword":"heb Ik bekend gemaakt,","tekst":"Of, maak Ik bekend; dat is, ik voorzeg openlijk wat zeker en gewis is en zonder fout geschieden zal, opdat zij mogen weten, wanneer het geschiedt, dat Ik de Heere ben. Anders: Ik heb de trouw bekend gemaakt; dat is, mijne trouw aan Israël betoond door veelvuldige waarschuwingen van hun aanstaande verwoesting, indien zij zich niet bekeren."},{"catchword":"gewis is","tekst":"Anders: dat zij gewis is, zij; te weten de voorzegde en gedreigde straf."}],"10":[{"catchword":"landpalen verrukken;","tekst":"Dat God scherpelijk vervloekt en verboden had, Deu 19:14 , en Deu 27:17 ; Job 24:2 ; Pro 22:28 . Desgelijks deden de regenten van Juda ten tijde van Achaz, als zij de grenzen van den reinen godsdienst, van God gesteld en van de vrome koningen bewaard, verrukten, en de grenzen van hun ambt tebuiten gingen, en alles voorts in verwarring brachten, hetwelk op de verwarring der religie door Gods rechtvaardig oordeel placht te volgen; zie 2Ki 16 , en zulks trekt met zich een zondvloed van Gods toorn, die alles overloopt en in verderf stelt."},{"catchword":"water, over hen uitgieten","tekst":"Zie Psa 79:6 ."}],"11":[{"catchword":"verpletterd met recht;","tekst":"Of, verkneuzeld, in stukken gebroken, of gestoten. Hebreeuws, een gepletterde des rechts. De eenvoudigste zin dezer woorden schijnt te zijn, dat hun dit alles rechtvaardiglijk zal overkomen naar hunne verdiensten; waarop de volgende woorden bekwamelijk passen. Sommigen nemen het aldus, dat Efraïm, die tevoren over anderen gewoon was te richten, zal moeten lijden dat andere over hem recht spreken en hem in het gericht verpletteren."},{"catchword":"gebod","tekst":"Van zijn koning Jerobeam, die de stichter der gruwelijke afgoderij en van alle gevolgde ongebondenheid geweest is, en dien zijne opvolgers hebben nagevolgd. Het is hun genoeg geweest dat hun koning zulks gebood, daarop zijn zij onbeschroomd en met lust voortgegaan, zonder op God en zijner profeten waarschuwing te letten. Anderen aldus: Hij heeft gewilligelijk gewandeld, of hij heeft willen wandelen naar het gebod, of bevel. Hebreeuws, hij heeft gewild, hij heeft gewandeld, enz. Zie Psa 45:5 ."}],"12":[{"catchword":"mot,","tekst":"Zie Job 13:28 ; Psa 39:12 ; Pro 12:4 , en Pro 14:30 ; Isa 50:9 , en Isa 51:8 ."},{"catchword":"verrotting","tekst":"Of, vervulling, wormstekigheid; dat is, gelijk de klederen door de motten en andere dingen door verrotting of den worm allengskens worden verteerd, alzo zal Ik deze beide volken door mijn straffen allengskens verteren, hetwelk aan beiden, eerst aan Israël, daarna aan Juda, alzo geschied is."}],"13":[{"catchword":"krankheid zag,","tekst":"Al dit voorzegde kwaad en nakend gevaar gevoelde of merkte."},{"catchword":"gezwel,","tekst":"Vergelijk Oba 1:7 ."},{"catchword":"Assur,","tekst":"Tot Pul, den koning van Assyrië, om dien van vijand tot vriend en helper te maken, door geschenken; dewijl dit schijnt te zien op de geschiedenis van den koning Menahem, 2Ki 15:19 , enz. Zie wijders onder Hos 7:11 , enz."},{"catchword":"hij zond tot den koning","tekst":"Dit duiden sommigen op Juda, uit vergelijking met het voorgaande [zie 2Ki 16:7 ] en vs.14."},{"catchword":"Jareb;","tekst":"Vergelijk onder Hos 10:6 , uit welke plaats afgenomen wordt dat dit een naam moet geweest zijn van zekeren koning in Assyrië, [gelijk ook sommige kroniekschrijvers hebben] of in het algemeen een naam, dien de Joden en Israëlieten dien uitlandsen koningen gewoon waren te geven, welker hulp en bescherming zij, uit mistrouwen op God, verzochten; Jareb is in het Hebreeuws zoveel als: hij zal twisten, richten, pleiten; dat is, de zaak voor ons opnemen en uitvoeren. Vergelijk Jdg 6:31-32 , met de aantekening."},{"catchword":"van ulieden niet helen","tekst":"Alzo dat Hij het van u wegneemt, dat gij het kwijt wordt. Anders: zal de wonde [van niemand] uit, of van u helen."}],"14":[{"catchword":"verscheuren en henengaan;","tekst":"Of, roven. Vergelijk onder Hos 6:1 ."}],"15":[{"catchword":"plaats,","tekst":"Menselijk van God gesproken, die gezegd wordt neder te dalen wanneer Hij iets bijzonders op aarde werkt, of zijne oordelen uitvoert, en weder in zijne plaats te keren en zich stil te houden, als Hij de mensen in ellende laat of niet verlost, totdat zij zich bekeren, en zijn tijd daar is. Vergelijk Gen 11:7 ; Isa 18:4 en Isa 26:21 ."},{"catchword":"aangezicht zoeken;","tekst":"Zie 2Ch 7:14 , en 2Ch 11:16 ."},{"catchword":"vroeg zoeken","tekst":"Dat is, met groten vlijt, ijver en tijdig. Zie Job 7:21 , en Job 8:5 ; Psa 5:4 ; Pro 7:15 , met de aantekening en vergelijk Jer 29:12-14 ; Dan 9 , en de boeken Ezra en Nehemia, en voorts den tijd van het Nieuwe Testament, voornamelijk Mat 11:12 , enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Hear this ye Priests, and attend ye house of Isreal, and give car (O) house of the King; [It should seem that the prophet doth make this addresse here to the three of the kingdom of Israel, in several respects : the ecclesiastical men, the eldest of the people, and the King. Yet some conceive, that by the house of Israel here are understood the ten tribes, and by the King, the king of Juda.] for this judgement concerneth you. [He. For men, or, people, to whom this belongeth; See Jer.48. On verse. 21. oth, the judgement or Right would becomes you, I.e. ought indeed to doe and administer right and judgement, and then the following wordsare read, but yeare a snare &c. compare Mic 3:1. And Mal.2.1.4.] because ye are become a snare [I.e. like one] at Mizpa, [there were divers heights and places of name on both sides o the river Jordan: of Mizpa in Gelead, see Judg. 10. 17. with the annot. This may taken thus, that the idolatrous governors and priest of the ten tribes, appointed guards on both sides of Jordan upon eminent places for to wach and apprehend all such, as would go up to Jerusalem, there to perform the worship God, and so to murther them; which also the beginning of the next verse seems to have respect unto. Compare below. Chap. 6.9. with the annot, chap. 7.1. also 1 Kings. 15. 17. with the annotat. There. Others understand it so, as if by all kinde of subril wayes and diveces they sought to allure the inhabitants unto their new &acirc;&euro;&ldquo; broached idolatry, for get the same approved by them, as a service well pleasing to God; dealing with men no otherwise, then fowlers and huntsmen, were wont to do upon both these high mountains.] and net[ I.e. like a net] spread abroad Thabor. [of this amount see Judg. 8. on v.8.]"}],"2":[{"catchword":null,"tekst":"And those that turn aside, go deep for to say : [When the backsliding Israelites, such as were sent forth on purpose, did spie any honest godly passengers from the tops of those mountains, then they presently got them down towards the bottom, for to lay hold on and slay them: some read it thus: They go deep to murther, (or, kill) the with &acirc;&euro;&ldquo; drawing, or retting ones, or retiring ones, viz. From among the idolatrous Israel, to Juda and Jerusalem; the sence being one and the same: other understand it deep and profound sinning, in murdering the godly, and tender it, make deep, or, multiply the saying which likewise differs but little from the other reading. Or of the deep and profound and subtile device, to beget a good opinion in the people of their idolatrous sacrifices, (as you had in the former note) which God accounts an unprofitable killing and slaying of beasts. The Hebr. Word is used both ways, for to go down, lurk or hide ones self in deep places, as Jer. 49. 8 30. and ff singing deeply, as Isa. 31.6 below chap 9.9. and both together (as it seemeth) Isa. 29. 15. where with both these verses the second and the third may also firtly be compared.] but I will be rebuker to them all. [Heb. A correction, or correctour, correcting &acirc;&euro;&ldquo; master, imply one that doth use to correct both words and stripes. See Prov. 7. on vers. 22. Oth. Through I was an instructor to them all, I.e. taught and instructed them otherwise by my prophets.]"}],"3":[{"catchword":null,"tekst":"I know Ephraim, and Israel is no hid before me, that thou O Ephraim, and art a whoring now, and Israel is polluted. [As if God said, ye shall not able to obscure your whoredomes before me, by disavowing or cloaking the same, I have too plainly and frequently and taken you in the fact.]"}],"4":[{"catchword":null,"tekst":"They doe not dispose their actions, [Or, their actions give up themsleves (with) their actions, to &c. Oth their works, (or, practises) will not give way, or, permit, that, &c. Compare Psa 36. 3. 5. and 55. 20. and 64. 6.] for to convert themselves unto their God, for the spirit of: whoredomes [See above chap. 4. on vers. 12.] is in the midst of them: and the LORD they know not.[ however they seek to cover and cloak their idolatry with his name See above chap. 4. on verse. 1. and 15. ]"}],"5":[{"catchword":null,"tekst":"There fore shall the pride of Israel witness to his face: [Or doth witness, or, answer, and so below chap. 7. 10. the sence is : their insolent and stifnecked contempt of all the faithful warning a and exhortations of my prophets, is so palpable and manifest, that it cannot be denyed; and it shall stand to confront them, or to the shame and confusion of their faces, witness against them in my judgement, to their conviction, and in testimony, that they are justly punished by me. Compare Isa 59. 12. Jer. 14. 7. Amos 6.8. Zech .2. 10. and like phrase of the contray, Gen 30. 33. Oth the glory, exaltation, excellery, &c. of Israel. I.e. the blesting whereby I have so much exalted them, shall convince them of their unthanfulnes ] and Israel and Ephraim shall, through their iniquiry; [See above. Chap 4,5. and 14. 9.] Juda also shall fall [Heb is fallen] with them."}],"6":[{"catchword":null,"tekst":"With their sheep and with their oxen shall they go (then) for the seek the LORD, but not finde him [I.e. they shall think and go about to satisfie, or appease God with their sacrifices,thereby to obtain help and succour from him,but in vain.Compare 2 Kings 23.21,] he hath withdraw himself from them.[ or, made himself loose (or free) from them, as one that would have nothing more to do with them, by reason of their offending him so much with their abominations.]"}],"7":[{"catchword":null,"tekst":"They have dealt unfaithfully against the LORD; they have gotten strange children: [By matching themselves with heathish women, against the expresse command of God. Compare Ezek. 9. 1,2. Nehem. 13. 23. Mal. 2. 21. it being one consequence of such matches that the children came thereby to be nursed up in idolatry ] now [ I.e. shortly , or therefore] the now moon shall consume the, [ by the new moon in understood the idolatry, which they commited in the moons. Some take it as similatude of usury, or moneth &acirc;&euro;&ldquo; money returns very hastily, and consumes the debtor before he is aware of it. Oth. Take a moneth for short time, as Zach. 11. 8. or for appointed time] with their parts. [Or portions shares, I.e. wil all their goods, lands and possessions. Compare Psal. 16. 5. with the annot. Some do understand the sacrifices which were divided into many parts.]"}],"8":[{"catchword":null,"tekst":"Blow the trumpets [Here God very lively sets before their eyes the terrour of the approaching enemie; when as it is usual to found alatum in the places next adjacent] at Gibea, the Trumpet at Rama; [Gibea and Rama lay both in Benjamin, on the borders of Ephraim. See Jud. 19. on verse 13. These fronter &acirc;&euro;&ldquo; places were doubtless strong and well garison&rsquo;d, and consequently they reposed much confidence in them; at Gibea, saul dwelt, at Ramah Samuel was born; 1Sam 10. 6 and chap. 1. See likewise 1 Kings. 15. 17, 21, 22.] cry aloud (at) Both &acirc;&euro;&ldquo; Aven; [See above chap. 4. on verse. 15.] after the Benjamin. [Hereupon may be understood, is the Enemy, or ther is the work, to wit, The enemy is busie in Ephraim, and there he begins to lay waste, whereof next verse. Benjamin lay between Juda and Ephraim; in which regard some do take these words, as a description of the situation of Juda, laying south behind Benjamin; and that thus Juda also should be alrmed like unto the foresaid places. Or it may plainly be taken thus, after, or behind thee Benjamin, I.e. let Benjamin likewise blow the alarm, backwards, to shew that the alarms should spread all about on the neck of one another, from one place to the other]."}],"9":[{"catchword":null,"tekst":"Ephraim shall become a desolation, in the day of punishment; [Or, correction, I.e. at that time, when I shall pronounce and execute the judgement spoken of before, verse. 1. ] among the tribes of Israel, I have made known, [Or I do make known] that which is certain and assured, and I shall come to passe without all peradventure, that they may know, when it dith come to passe, that I am the LORD. Oth. I have made known the faithfulness, I.e. have shewed forth my faithfulnesse to Israel, by mainfold warning of their desolation to come, if they prevented it not by timely repentance. Oth. Thus it is certain. It, viz. The foretold and threatned judgement.]"}],"10":[{"catchword":null,"tekst":"The Princes of Juda are become like unto those that remove the borders; [A thing which God had severely forbidden and accursed, Deut. 19. 14. and 27. 17 Job 24. 2. Prov. 22. 28. This was like wise practised by the Governours of Juda in that time of Achaz, when they trespassed and inchroached upon the limits of God himself, and carefully maintained by the good kings; and went beyond the bounds of their office and administration, bringing all things into confusion, the usual consequence, by God judgement, of confounding true Religion. See 2 Kings 16. and that draweth along with it Deluge of Gods indignation and vengeance, overflowing and destroying all] I will pour out mine indignation over them like water. [See Psal. 79. on verse 6.]"}],"11":[{"catchword":null,"tekst":"Ephraim is oppressed, he is bruised with right (or, judgement;)[Or he is battered, broken, or beaten in places. Heb. Bruising of judgement. The plainest sense of these words seems // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

}

    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
