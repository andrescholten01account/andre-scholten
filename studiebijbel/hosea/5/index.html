EERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.", "Hos 13:15": "Want hij zal vrucht voortbrengen onder de broeders; toch zal er een oostenwind komen, een wind van de Heere, opkomend uit de woestijn; en zijn bron zal uitdrogen, die zal de schat van alle kostbare voorwerpen roven.", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "Deut 29:4": "Maar de HEERE heeft u geen hart gegeven om te verstaan, geen ogen om te zien, en geen oren om te horen, tot op deze dag.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Jer 22:23": "O u, die nu op de Libanon woont, en in de ceders nestelt! hoe genadig zult u zijn, als de smarten u zullen overkomen, de pijn als van een barende vrouw!", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "1 Kor 1:29": "Opdat geen vlees zou roemen voor Hem.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Hos 10:6": "Ja, dat zal naar Assur gevoerd worden, als geschenk voor koning Jareb; Efraïm zal schaamte oplopen, en Israël zal beschaamd worden vanwege zijn eigen plan.", "Ps 82:2": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela.", "Jes 48:3": "De vorige dingen heb Ik verkondigd van toen af, en uit Mijn mond zijn zij voortgekomen, en Ik heb ze doen horen; Ik heb ze snel gedaan, en zij zijn gekomen;", "Job 35:9": "Vanwege de grootheid van hun onderdrukking doen zij de onderdrukten roepen; zij schreeuwen vanwege de arm van de groten.", "Luk 18:9-14": "En Hij vertelde ook aan sommigen, die op zichzelf vertrouwden dat zij rechtvaardig waren en de anderen niets waard achtten, deze gelijkenis: Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "Jer 3:12-14": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden. Erken alleen uw ongerechtigheid, dat u tegen de HEERE, uw God, overtreden hebt, en uw wegen verspreid hebt naar de vreemden, onder elke groene boom, maar u bent Mijn stem niet gehoorzaam geweest, spreekt de HEERE. Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "2 Tim 3:8": "Zoals Jannes en Jambres Mozes tegenstonden, zo staan ook dezen de waarheid tegen; mensen, verdorven van verstand, verwerpelijk wat het geloof betreft.", "Ezech 22:4": "Door uw bloed dat u vergoten hebt, bent u schuldig geworden, en met uw drekgoden die u gemaakt hebt, hebt u zich verontreinigd, en hebt u uw dagen doen naderen en bent u tot uw jaren gekomen; daarom heb Ik u aan de heidenvolken overgegeven tot een smaad, en aan alle landen tot een spot.", "Hos 2:1-4": "Twist tegen uw moeder, twist, omdat zij Mijn vrouw niet is, en Ik haar Man niet ben; en laat ze haar hoererijen van haar gezicht, en haar overspelerijen van tussen haar borsten wegdoen. Anders zal Ik ze naakt uitkleden, en haar neerzetten als op de dag dat zij geboren werd; ja, Ik zal haar maken als een woestijn, en haar neerzetten als een dor land, en haar doden door dorst; En Ik zal Mij niet ontfermen over haar kinderen, omdat zij kinderen van de hoererijen zijn.", "Jes 22:19": "En Ik zal u wegstoten van uw positie, en van uw plaats zal Hij u neerhalen.", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Hos 5:1-15": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor. En zij die afwijken, verdiepen zich erin om te slachten; maar Ik zal hun allen een tuchtmeester zijn. Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "Job 13:28": "En hij vergaat als een verrotting, als een kleed dat de mot opeet.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Jes 66:4": "Ik zal ook hun loon kiezen naar hun handelingen, en hun angsten zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet luisterden, maar deden wat kwaad is in Mijn ogen, en kozen wat Ik niet wilde.", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Jes 57:13": "Wanneer u zult roepen, laat dan degenen die door u verzameld zijn, u redden; maar de wind zal hen allemaal wegvoeren, de leegte zal hen wegnemen. Maar wie op Mij vertrouwt, die zal het land erven, en Mijn heilige berg in bezit krijgen.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Klaagl 2:14": "Nun. Uw profeten hebben u ijdelheid en ongerijmdheid gezien, en zij hebben u uw ongerechtigheid niet geopenbaard, om uw gevangenschap af te wenden, maar zij hebben voor u gezien ijdele lasten en uitstotingen.", "Matt 20:20-27": "Toen kwam de moeder van de zonen van Zebedeüs met haar zonen naar Hem toe, boog zich voor Hem neer, en vroeg Hem iets. En Hij zei tegen haar: Wat wilt u? Zij zei tegen Hem: Zeg dat deze twee zonen van mij mogen zitten, de een aan Uw rechterhand en de ander aan Uw linkerhand in Uw Koninkrijk. Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.", "Gal 1:6-8": "Ik verwonder mij dat u zo snel, wijkend van hem die u in de genade van Christus geroepen heeft, overgebracht wordt naar een ander evangelie; terwijl er geen ander is; maar er zijn sommigen die u in verwarring brengen, en het Evangelie van Christus willen verdraaien. Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Spr 17:15": "Wie de goddeloze rechtvaardigt, en de rechtvaardige veroordeelt, zijn de HEERE een gruwel, zij beiden.", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Jes 30:33": "Want Tofeth is van oudsher bereid; ja, hij is ook voor de koning bereid; Hij heeft hem diep en wijd gemaakt, het vuur en hout van zijn brandstapel is veel; de adem van de HEERE zal hem aansteken als een zwavelstroom.", "Joël 2:15-18": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "2 Tess 1:5": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt;", "Ezech 44:8": "En u hebt de wacht van Mijn heilige dingen niet in acht genomen; maar u hebt uzelf enigen tot wachters van Mijn wacht gesteld in Mijn heiligdom.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Jer 22:15": "Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Luk 19:12-27": "Hij zei dan: Een man van hoge afkomst reisde naar een ver land om voor zichzelf een koninkrijk te ontvangen, en dan terug te keren. En hij riep zijn tien dienstknechten, gaf hun tien ponden, en zei tegen hen: Doe er zaken mee totdat ik terugkom. Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Jes 30:22": "En u zult voor onrein houden het deksel van uw zilveren gesneden beelden, en het overtreksel van uw gouden gegoten beelden; u zult ze wegwerpen als een maanstondig kleed, en tegen elk daarvan zeggen: Ga weg!", "Jer 2:11-13": "Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in iets dat geen nut doet. Ontzet u hierover, hemelen, en wees verschrikt, word zeer woest, spreekt de HEERE. Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Luk 13:25-28": "namelijk nadat de heer des huizes zal zijn opgestaan en de deur zal hebben gesloten, en u buiten zult beginnen te staan en op de deur te kloppen, en zult zeggen: Heere, Heere, doe ons open! en Hij zal antwoorden en tegen u zeggen: Ik weet niet waar u vandaan komt. Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven. En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Ps 51:19": "De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Jer 42:3": "dat de HEERE, uw God, ons de weg bekendmaakt die wij zullen ingaan, en de zaak die wij zullen doen.", "Ps 78:56-64": "Maar zij verzochten en verbitterden God, de Allerhoogste, en onderhielden Zijn getuigenissen niet. En zij weken terug, en handelden trouweloos, zoals hun vaders; zij zijn omgekeerd, als een bedrieglijke boog. En zij verwekten Hem tot toorn door hun hoogten, en verwekten Hem tot ijver door hun gesneden beelden.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Ezech 13:10": "Daarom, ja, daarom dat zij Mijn volk verleiden, en zeggen: Vrede, terwijl er geen vrede is; en dat de een een lemen wand bouwt, en zie, de anderen die pleisteren met loze kalk.", "Job 11:13-15": "Als u uw hart klaargemaakt hebt, breid dan uw handen tot Hem uit. Als er ondeugd in uw hand is, doe die ver weg; en laat het onrecht in uw tenten niet wonen. Want dan zult u uw gezicht opheffen zonder smet, en zult vast staan, en niet vrezen.", "Jes 3:14": "De HEERE komt ten gerichte tegen de oudsten van Zijn volk en hun vorsten, want u hebt deze wijngaard verteerd; de roof van de ellendige is in uw huizen.", "Joh 3:19": "En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht.", "Jer 26:4-6": "Zeg dan tot hen: Zo zegt de HEERE: Als u naar Mij niet zult horen, om te wandelen in Mijn wet, die Ik voor uw aangezicht gegeven heb; Door te horen naar de woorden van Mijn knechten, de profeten, die Ik tot u zend, ja, vroeg opstaand en zendend; maar u niet gehoord hebt; Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek voor alle volken van de aarde.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Jer 5:21": "Hoor nu dit, dwaas en harteloos volk! die ogen hebben, maar niet zien, die oren hebben, maar niet horen.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Jes 1:15": "En als u uw handen uitspreidt, verberg Ik Mijn ogen voor u; ook wanneer u het gebed vermenigvuldigt, hoor Ik niet; want uw handen zijn vol bloed.", "Joh 4:22": "U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Rom 11:23": "Maar ook zij, als zij in het ongeloof niet blijven, zullen ingeënt worden; want God is machtig om hen weer in te enten.", "Amos 4:2": "De Heere HEERE heeft gezworen bij Zijn heiligheid, dat er, zie, dagen over u zullen komen, dat men u zal optrekken met haken, en uw nakomelingen met visangels.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "Richt 4:6": "En zij zond heen en riep Barak, de zoon van Abinoam, van Kedes-nafthali; en zij zei tegen hem: Heeft de HEERE, de God van Israël, niet geboden: Ga heen en trek op naar de berg Thabor, en neem met u tienduizend man, van de kinderen van Nafthali en van de kinderen van Zebulon?", "Hos 9:11-17": "Wat Efraïm aangaat, hun heerlijkheid zal wegvluchten als een vogel; vanaf de geboorte, en vanaf de moederschoot, en vanaf de ontvangenis af. Ofschoon zij hun kinderen mochten grootbrengen, Ik zal hen er toch van beroven, zodat er geen mens over zal blijven; want ook, wee hun, wanneer Ik van hen zal zijn weggegaan! Efraïm is, zoals Ik Tyrus aanzag, geplant in een aangename woonplaats; maar Efraïm zal zijn kinderen moeten uitbrengen naar de moordenaar.", "Jer 3:20": "Waarlijk, zoals een vrouw trouweloos scheidt van haar vriend, zo hebt u trouweloos tegen Mij gehandeld, huis van Israël! spreekt de HEERE.", "Jes 59:12": "Want onze overtredingen zijn talrijk voor U, en onze zonden getuigen tegen ons; want onze overtredingen zijn bij ons, en onze ongerechtigheden kennen wij;", "Jer 15:1": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan.", "Jes 28:18": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden.", "Spr 15:12": "De spotter zal hem die hem bestraft niet liefhebben; hij zal niet naar de wijzen gaan.", "Zach 11:17": "Wee de nietige herder, die de kudde verlaat! Het zwaard zal over zijn arm zijn, en over zijn rechteroog; zijn arm zal helemaal verdorren, en zijn rechteroog zal helemaal donker worden.", "Joh 12:38-41": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard? Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft: Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Jes 17:11": "Op de dag dat u ze plant, zult u ze doen groeien, en in de morgenstond zult u uw zaad doen bloeien; maar het zal maar een hoop zijn van het gemaaide, op de dag van ziekte en van pijnlijke smart.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Job 27:8-10": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Jer 23:2": "Daarom zegt de HEERE, de God van Israël, zo van de herders, die Mijn volk weiden: U hebt Mijn schapen verstrooid, en hebt ze verdreven, en hebt niet naar hen omgezien; zie, Ik zal over u de boosheid van uw handelingen bezoeken, spreekt de HEERE.", "1 Kon 8:33-50": "Wanneer Uw volk Israël verslagen wordt voor het aangezicht van de vijand, omdat zij tegen U gezondigd zullen hebben, en zich tot U bekeren, en Uw Naam belijden, en tot U in dit huis bidden en smeken zullen; hoor Ú dan in de hemel, en vergeef de zonde van Uw volk Israël, en breng hen terug in het land, dat U hun vaderen gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij op deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "2 Kron 28:21": "Want Achaz nam een deel van het huis van de HEERE, en van het huis van de koning en van de vorsten, en gaf het aan de koning van Assyrië; maar het hielp hem niet.", "Ps 94:8": "Let op, u onverstandigen onder het volk! En u dwazen! Wanneer zult u verstandig worden?", "Matt 24:24": "Want er zullen valse christussen en valse profeten opstaan, en zij zullen grote tekenen en wonderen doen, zodat zij, als het mogelijk was, ook de uitverkorenen zouden misleiden.", "Hebr 5:8": "Hoewel Hij de Zoon was, heeft Hij toch gehoorzaamheid geleerd uit wat Hij geleden heeft.", "Ezech 22:28": "Haar profeten nu pleisteren hen met loze kalk; zij zien ijdelheid en voorzeggen hun leugen, en zeggen: Zo zegt de Heere HEERE! terwijl de HEERE niet gesproken heeft.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Deut 4:25-31": "Wanneer u nu kinderen en kleinkinderen verwekt hebt, en oud geworden bent in het land, en u zich te gronde richt door gesneden beelden te maken, de gelijkenis van iets, en door te doen wat kwaad is in de ogen van de HEERE, uw God, om Hem tot toorn te verwekken; Dan roep ik vandaag de hemel en de aarde tot getuige tegen u, dat u zeker snel zult omkomen uit het land waar u de Jordaan voor oversteekt om het in bezit te nemen; u zult uw dagen daarin niet verlengen, maar helemaal uitgeroeid worden. En de HEERE zal u verstrooien onder de volken; en u zult met weinigen in getal overblijven onder de heidenvolken waarheen de HEERE u zal leiden.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Hos 10:15": "Zo heeft Beth-el u gedaan, vanwege de grote boosheid van uw boosheid; Israëls koning is in de vroege morgen volledig uitgeroeid.", "Richt 4:3": "Toen riepen de Israëlieten tot de HEERE; want hij had negenhonderd ijzeren wagens, en hij had de Israëlieten met geweld onderdrukt, twintig jaar.", "Deut 31:16-30": "En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb. Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is? Ik dan zal Mijn aangezicht op die dag geheel en al verbergen, om al het kwaad dat het gedaan heeft; want het heeft zich gewend tot andere goden.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Jer 7:13-34": "En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt; daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb. En Ik zal u van Mijn aangezicht wegwerpen, zoals Ik al uw broeders, het hele nageslacht van Efraïm, weggeworpen heb.", "Ps 14:1": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "Jes 59:13": "het overtreden en het liegen tegen de HEERE, en het achterwaarts wijken van onze God; het spreken van onderdrukking en afval, het ontvangen en het uitspreken van valse woorden uit het hart.", "Jer 18:18": "Toen zeiden zij: Kom, laten wij gedachten tegen Jeremia denken; want de wet zal niet vergaan van de priester, evenmin de raad van de wijze, of het woord van de profeet; kom, laten wij hem slaan met de tong, en laten wij niet luisteren naar enig van zijn woorden!", "Jes 66:3": "Wie een os slacht, slaat een man; wie een lam offert, breekt een hond de hals; wie spijsoffer offert, is als die zwijnenbloed offert; wie wierook brandt tot een gedenkoffer, is als die een afgod zegent. Dezen kiezen ook hun eigen wegen, en hun ziel heeft plezier in hun verfoeisels.", "Neh 1:8": "Denk toch aan het woord, dat U Uw dienaar Mozes geboden hebt, en zei: Als u ontrouw wordt, zal Ik u onder de volken verstrooien.", "Joh 17:25": "Rechtvaardige Vader, de wereld heeft U niet gekend; maar Ik heb U gekend, en dezen hebben erkend dat U Mij gezonden hebt.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Amos 3:4-8": "Zal een leeuw brullen in het woud, als hij geen roof heeft? Zal een jonge leeuw uit zijn hol zijn stem verheffen, tenzij hij iets gevangen heeft? Zal een vogel in de strik op de aarde vallen, als er geen strik voor hem is? Zal men de strik van de aardbodem opnemen, als men helemaal niets gevangen heeft? Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "Ps 78:8": "En dat zij niet zouden worden zoals hun vaders, een opstandig en weerspannig geslacht; een geslacht dat zijn hart niet richtte, en waarvan de geest niet trouw was met God.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Jes 5:21": "Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "Jer 13:27": "Uw overspelen en uw hunkeringen, de schandelijkheid van uw hoererij, op heuvels, in het veld; Ik heb uw gruwelen gezien; wee u, Jeruzalem! Zult u niet rein worden? Hoe lang nog hierna?", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Hand 7:51": "U hardnekkigen en onbesnedenen van hart en oren, u weerstaat altijd de Heilige Geest; zoals uw vaders deden, zo doet u ook.", "Ps 24:3-6": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Jes 10:5-16": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "1 Joh 2:26": "Dit heb ik u geschreven over hen, die u verleiden.", "Matt 4:17": "Van toen af aan begon Jezus te prediken en te zeggen: Bekeer u; want het Koninkrijk der hemelen is nabijgekomen.", "Pred 10:5-7": "Er is nog een kwaad dat ik gezien heb onder de zon, als een dwaling die van het aangezicht van de leider voortkomt. Een dwaas wordt gezet in grote hoogheden, maar de rijken zitten in de laagte. Ik heb knechten te paard gezien, en vorsten die als knechten op de aarde gingen.", "Jes 30:16": "En u zegt: Nee, maar op paarden zullen wij vluchten; daarom zult u vluchten! En: Op snelle paarden zullen wij rijden; daarom zullen uw vervolgers ook snel zijn!", "Jes 43:27": "Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.", "Jes 59:14": "Daarom is het recht achterwaarts geweken, en de gerechtigheid staat ver weg; want de waarheid struikelt op de straat, en wat recht is, kan er niet ingaan.", "Hos 10:13": "U hebt goddeloosheid geploegd, verkeerdheid gemaaid, en de vrucht van de leugen gegeten; want u hebt vertrouwd op uw eigen weg, op de veelheid van uw helden.", "Matt 24:48-51": "Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg, en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Ezech 30:8": "En zij zullen weten dat Ik de HEERE ben, als Ik een vuur in Egypte zal hebben aangestoken, en al zijn helpers zullen verbroken worden.", "Ps 95:10": "Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.", "Zef 2:1-3": "Doorzoek uzelf goed, ja, doorzoek u goed, gij volk, dat met geen lust bevangen wordt! Voordat het besluit vrucht draagt (zoals kaf gaat de dag voorbij), voordat de gloed van de toorn van de HEERE over u komt; voordat de dag van de toorn van de HEERE over u komt. Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Ps 10:2-6": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Jer 18:8": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Ps 7:14": "En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ezech 29:6": "En alle inwoners van Egypte zullen weten dat Ik de HEERE ben, omdat zij voor het huis van Israël een rietstok geweest zijn.", "2 Petr 1:9": "Want bij wie deze dingen niet aanwezig zijn, die is blind, kan niet ver zien, en is vergeten dat hij gereinigd is van zijn vroegere zonden.", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Pred 4:1": "Daarna richtte ik mijn aandacht en zag alle onderdrukkingen die onder de zon gebeuren; en zie, er waren de tranen van de verdrukten, en van hen die geen trooster hadden; en aan de kant van hun verdrukkers was macht, zij daarentegen hadden geen trooster.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Ps 78:40-43": "Hoe dikwijls verbitterden zij Hem in de woestijn, deden zij Hem smart aan in de wildernis! Want zij kwamen telkens terug, en verzochten God, en stelden de Heilige van Israël een grens. Zij dachten niet aan Zijn hand, aan de dag, toen Hij hen verloste van de tegenstander;", "Job 24:24": "Zij zijn een korte tijd verheven, daarna is er niemand meer van hen; zij worden neergedrukt; net als alle anderen worden zij weggenomen; en net als de top van een aar worden zij afgesneden.", "Richt 19:12-15": "Maar zijn heer zei tegen hem: Wij zullen hierheen niet afwijken naar een vreemde stad, die niet van de kinderen van Israël is; maar wij zullen doortrekken tot aan Gibea. Verder zei hij tegen zijn knecht: Kom, laten wij naderen tot een van die plaatsen, en overnachten in Gibea of in Rama. Zo trokken zij verder, en gingen hun weg; en de zon ging voor hen onder bij Gibea, dat aan Benjamin toebehoort;", "Zef 3:2": "Zij hoort niet naar de stem; zij neemt de tucht niet aan; zij vertrouwt niet op de HEERE; tot haar God nadert zij niet.", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "1 Kon 8:47-53": "en zij in het land, waar zij gevankelijk weggevoerd zijn, weer tot inkeer komen, en zich bekeren, en tot U smeken in het land van hen die ze gevankelijk hebben weggevoerd, en zeggen: Wij hebben gezondigd, en verkeerd gedaan, wij hebben goddeloos gehandeld; en zij zich tot U bekeren, met hun hele hart, en met hun hele ziel, in het land van hun vijanden, die hen gevankelijk zullen hebben weggevoerd; en tot U bidden zullen in de richting van hun land (dat U hun vaderen gegeven hebt), naar deze stad, die U verkoren hebt, en naar dit huis, dat ik voor Uw Naam gebouwd heb; hoor dan in de hemel, de vaste plaats van Uw woning, hun gebed en hun smeking, en voer hun recht uit;", "Jes 42:22-25": "Maar nu is het een beroofd en geplunderd volk; zij zijn allen verstrikt in de holen, en verstopt in de gevangenissen; zij zijn tot een roof geworden, en er is niemand die ze redt; tot een plundering, en niemand zegt: Geef ze terug. Wie onder u neemt dit ter harte? Wie merkt op en hoort, wat hierna zijn zal? Wie heeft Jakob tot een plundering overgegeven, en Israël aan de rovers? Is het niet de HEERE, Hij, tegen Wie wij gezondigd hebben? Want zij wilden niet wandelen in Zijn wegen, en zij luisterden niet naar Zijn wet.", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Hab 1:4": "Daarom wordt de wet losgelaten, en het recht komt nooit meer voort; want de goddeloze omringt de rechtvaardige; daarom komt het recht verdraaid voort.", "Jes 11:13": "En de nijd van Efraïm zal wegwijken, en de tegenstanders van Juda zullen uitgeroeid worden; Efraïm zal Juda niet benijden, en Juda zal Efraïm niet benauwen.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Jer 13:9-27": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem. Dit boosaardige volk, dat weigert Mijn woorden te horen, dat wandelt naar het goeddunken van zijn hart, en andere goden navolgt om die te dienen en zich voor die neer te buigen; dat zal worden als deze gordel, die nergens meer voor deugt. Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Ezra 9:10": "En nu, wat zullen wij zeggen, o onze God, na dit alles? Want wij hebben Uw geboden verlaten,", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Matt 5:6": "Zalig zijn zij die hongeren en dorsten naar de gerechtigheid, want zij zullen verzadigd worden.", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Hos 4:12": "Mijn volk vraagt zijn hout om raad, en zijn stok zal het hem bekendmaken; want de geest van de hoererijen verleidt hen, zodat zij van onder hun God weghoereren.", "Matt 13:14": "En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Micha 3:1": "Verder zei ik: Hoor nu, hoofden van Jakob, en leiders van het huis van Israël! Betaamt het u niet om het recht te weten?", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Spr 19:2": "Ook is het niet goed als de ziel zonder kennis is; en die met de voeten haastig is, zondigt.", "Ezech 33:9": "Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Joh 9:29-39": "Wij weten dat God tot Mozes gesproken heeft; maar van Deze weten wij niet vanwaar Hij is. De man antwoordde en zei tegen hen: Hierin zit toch iets wonderlijks, dat u niet weet vanwaar Hij is, en Hij heeft toch mijn ogen geopend. En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.", "Ezech 28:2": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God.", "Tit 3:11": "Wetend dat zo iemand verkeerd is, en zondigt, terwijl hij zichzelf veroordeelt.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Jes 22:11": "Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "Ps 34:5": "Daleth. Ik heb de HEERE gezocht, en Hij heeft mij geantwoord, en mij uit al mijn angsten gered.", "Rom 9:21": "Of heeft de pottenbakker geen macht over het leem, om uit dezelfde klomp het ene vat tot eer te maken, en het andere tot oneer?", "Spr 11:2": "Als de hoogmoed komt, zal de schande ook komen; maar met de ootmoedigen is wijsheid.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ps 10:6": "Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Amos 3:11": "Daarom, zo zegt de Heere HEERE: De vijand! En dat rondom het land! Die zal uw sterkte van u neerstorten, en uw paleizen zullen uitgeplunderd worden.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Mark 6:52": "Want zij hadden het wonder van de broden niet begrepen; want hun hart was verhard.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Deut 8:17-20": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is. Maar als het gebeurt, dat u de HEERE, uw God, helemaal vergeet, en andere goden navolgt, en hen dient, en u voor hen buigt, dan verklaar ik vandaag tegen u, dat u zeker zult omkomen.", "Jer 6:1": "Vlucht met opeenpakking, kinderen van Benjamin, uit het midden van Jeruzalem, en waai de bazuin te Thekoa, en hef een vuurteken op te Beth-cherem; want er kijkt een kwaad uit van het noorden, en een grote breuk.", "Matt 11:20-24": "Toen begon Hij de steden te verwijten waarin Zijn krachten meest gebeurd waren, omdat zij zich niet bekeerd hadden. Wee u, Chorazin! Wee u, Bethsaïda! Want als in Tyrus en Sidon de krachten gebeurd waren die in u gebeurd zijn, zouden zij zich lang geleden in zak en as bekeerd hebben. Maar Ik zeg u: het zal Tyrus en Sidon draaglijker zijn op de dag van het oordeel, dan u.", "Jer 29:13": "En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Ps 119:71": "Het is mij goed, dat ik verdrukt ben geweest, opdat ik Uw inzettingen leerde.", "1 Kor 1:20": "Waar is de wijze? Waar is de schriftgeleerde? Waar is de onderzoeker van deze eeuw? Heeft God de wijsheid van deze wereld niet dwaas gemaakt?", "Deut 17:2-5": "Wanneer in uw midden, in een van uw poorten die de HEERE, uw God, u geeft, een man of vrouw gevonden wordt die doet wat kwaad is in de ogen van de HEERE, uw God, door Zijn verbond te overtreden, Doordat hij heengaat en andere goden dient, en zich voor die buigt, of voor de zon, of voor de maan, of voor het hele leger van de hemel, wat ik niet geboden heb; En het wordt u aangezegd, en u hoort het; dan moet u het goed onderzoeken; en zie, het is de waarheid, de zaak staat vast, zo'n gruwel is in Israël gedaan;", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "1 Sam 13:5": "En de Filistijnen werden verzameld om tegen Israël te strijden, dertigduizend wagens en zesduizend ruiters, en volk in menigte als het zand dat aan de oever van de zee is; en zij trokken op en legerden zich te Michmas, ten oosten van Beth-aven.", "Jer 14:13": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "1 Joh 4:5": "Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Luk 17:26-30": "En zoals het gebeurde in de dagen van Noach, zo zal het ook zijn in de dagen van de Zoon des mensen. Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf. Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Jes 50:9": "Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Jes 11:12": "En Hij zal een banier oprichten onder de heidenen, en Hij zal de verdrevenen van Israël verzamelen, en de verstrooiden uit Juda bijeenbrengen, van de vier hoeken van het aardrijk.", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Tit 1:10-14": "Want er zijn ook veel ongeregelde mensen, mensen die zinloze praat verkondigen en misleiden, vooral zij die uit de besnijdenis zijn; hun moet men de mond snoeren, want zij brengen hele huizen in verwarring, en leren wat niet behoort, om het schandelijke gewin. Iemand uit hen, hun eigen profeet, heeft gezegd: De Kretenzers zijn altijd leugenachtig, kwade beesten, luie buiken.", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Jer 2:32": "Vergeet ook een jonkvrouw haar versiersel, of een bruid haar bindselen? Toch heeft Mijn volk Mij vergeten, dagen zonder getal.", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "Zach 11:8": "En ik heb drie herders in één maand afgesneden; want mijn ziel was verdrietig over hen geworden, en ook had hun ziel een walg van mij.", "Hoogl 3:1-4": "Ik zocht 's nachts op mijn bed Hem, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet; ik zei: ... Ik zal nu opstaan, en in de stad omgaan, in de wijken en in de straten; ik zal Hem zoeken, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet. De wachters, die in de stad omgingen, vonden mij: ik zei: Hebt u Die gezien, Die mijn ziel liefheeft?", "Micha 5:11-13": "En Ik zal de toverijen uit uw hand uitroeien, en u zult geen guichelaars meer hebben. En Ik zal uw gesneden beelden en uw opgerichte beelden uit uw midden uitroeien, zodat u zich niet meer zult neerbuigen voor het werk van uw handen. Verder zal Ik uw bossen uit uw midden uitroeien, en Ik zal uw steden verdelgen.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Ps 7:3": "Anders zou hij mijn ziel roven als een leeuw, die verscheurt, terwijl er geen redder is.", "Hand 2:21": "En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "Hand 20:29": "Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen.", "Ps 73:8": "Zij mergelen de mensen uit, en spreken bos van verdrukking; zij spreken uit de hoogte.", "Klaagl 3:25": "Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.", "Matt 5:16": "Laat uw licht zo schijnen voor de mensen, dat zij uw goede werken mogen zien en uw Vader, Die in de hemelen is, verheerlijken.", "2 Kron 27:2": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader Uzzia gedaan had, behalve dat hij de tempel van de HEERE niet binnenging; en het volk verdierf zich nog.", "Jer 11:19": "En ik was als een lam, als een os, die geleid wordt om geslacht te worden; want ik wist niet dat zij plannen tegen mij beraamden, en zeiden: Laten wij de boom met zijn vrucht verderven, en laten wij hem uit het land van de levenden uitroeien, zodat aan zijn naam niet meer gedacht wordt.", "Mark 9:33-35": "En Hij kwam in Kapernaüm, en toen Hij in huis was, vroeg Hij hun: Waarover had u het onderweg met elkaar? Maar zij zwegen; want zij hadden onderweg met elkaar getwist over wie de belangrijkste zou zijn. En Hij ging zitten, riep de twaalf, en zei tegen hen: Als iemand de eerste wil zijn, die zal de laatste van allen zijn, en de dienaar van allen.", "Job 21:31": "Wie zal hem in het aangezicht zijn weg voorhouden? Als hij iets doet, wie zal het hem vergelden?", "Zach 7:13": "Daarom is het gebeurd, zoals Hij geroepen had en zij niet gehoord hebben, dat zij ook riepen, maar Ik niet hoorde, zegt de HEERE van de heerscharen;", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Jer 23:14-16": "Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra. Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land. Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Ps 79:6": "Stort Uw grimmigheid uit over de heidenen, die U niet kennen, en over de koninkrijken, die Uw Naam niet aanroepen.", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Mal 2:11-15": "Juda handelt trouweloos, en er wordt een gruwel gedaan in Israël en in Jeruzalem; want Juda ontheiligt de heiligheid van de HEERE, die Hij liefheeft; want hij heeft de dochter van een vreemde god getrouwd. De HEERE zal de man die dit doet, uitroeien uit de tenten van Jakob, hem die waakt en hem die antwoordt, en die de HEERE van de heerscharen een spijsoffer brengt. Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen.", "Job 22:13": "Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?", "Jer 32:33": "Die Mij de nek toegekeerd hebben en niet het aangezicht; hoewel Ik hen leerde, vroeg opstaand en lerend, evenwel luisterden zij niet, om tucht aan te nemen;", "Jer 6:17": "Ik heb ook wachters over u gesteld, en gezegd: Luistert naar het geluid van de bazuin; maar zij zeggen: Wij zullen niet luisteren.", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "Jer 50:38": "Droogte zal zijn over haar water, zodat het uitdroogt; want het is een land van gesneden beelden, en zij razen naar de schrikwekkende afgoden.", "Hos 4:8-13": "Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid. Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden. En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen in aantal; want zij hebben nagelaten de Heere in acht te nemen.", "Hos 7:3-5": "Zij verblijden de koning met hun boosheid, en de vorsten met hun leugens. Zij plegen allemaal samen overspel, zij zijn als een bakoven, die heet gemaakt is door de bakker; die ophoudt met opstoken nadat hij het deeg heeft gekneed, totdat het doorgezuurd is. Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Jes 47:8": "Nu dan, hoor dit, weelderige! Die zo zeker woont, die in haar hart zegt: Ik ben het, en niemand meer dan ik: ik zal geen weduwe zitten, en de beroving van kinderen niet kennen.", "Deut 1:45": "Toen u terugkwam en huilde voor het aangezicht van de HEERE, luisterde de HEERE niet naar uw stem, en neigde Zijn oren niet tot u.", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Jes 56:10": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Jer 23:11": "Want zowel profeten als priesters zijn huichelaars; zelfs in Mijn huis vind Ik hun boosheid, spreekt de HEERE.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Mal 2:2": "Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Rom 11:25": "Want ik wil niet, broeders, dat u deze verborgenheid onbekend is (opdat u niet wijs bent, bij uzelf), dat de verharding voor een deel over Israël gekomen is, totdat de volheid van de heidenen zal ingegaan zijn.", "Job 22:23": "Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Kol 2:19": "En hij houdt het Hoofd niet vast, van waaruit het hele lichaam, door de gewrichten en banden gevoed en samengevoegd, groeit met een goddelijke groei.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Ezech 33:19": "En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "Job 33:16-30": "Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding; Opdat Hij de mens afwendt van zijn werk, en van de man de hoogmoed verbergt; Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Jer 31:19": "Zeker, nadat ik bekeerd ben, heb ik berouw gehad, en nadat ik mijzelf ben bekendgemaakt, heb ik op de heup geklopt, ik ben beschaamd, ja, ook schaamrood geworden, omdat ik de smaad van mijn jeugd gedragen heb.", "Openb 2:16": "Bekeer u; en zo niet, Ik zal u haastig bij komen, en zal tegen hen strijd voeren met het zwaard van Mijn mond.", "Ezech 28:17": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Ps 58:3": "Ja, u werkt ongerechtigheden in het hart; u weegt het geweld van uw handen af op de aarde.", "Hebr 12:17": "Want u weet dat hij ook daarna, toen hij de zegening wilde erven, verworpen werd; want hij vond geen gelegenheid tot berouw, hoewel hij het met tranen zocht.", "Jer 16:10": "En het zal gebeuren, als u dit volk al deze woorden aanzegt, en zij tegen u zeggen: Waarom spreekt de HEERE al dit grote kwaad over ons, en wat is onze misdaad, en wat is onze zonde, die wij tegen de HEERE, onze God, gezondigd hebben?", "Jes 48:5": "Daarom heb Ik het u van toen af verkondigd, voordat het kwam, heb Ik het u doen horen; opdat u niet misschien zou zeggen: Mijn afgod heeft die dingen gedaan, of mijn gesneden beeld, of mijn gegoten beeld heeft ze bevolen.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Matt 20:27": "en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Jes 28:1-3": "Wee de hoogmoedige kroon van de dronkaards van Efraïm, wiens heerlijke sieraad een verwelkende bloem is, die daar is op het hoofd van de zeer vruchtbare vallei, van hen die door de wijn geveld zijn. Zie, de Heere heeft een sterke en machtige, er is als een hagelvloed, een verwoestende storm; als een vloed van sterk, overstromend water zal Hij ze met de hand ter aarde neerwerpen. De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "Zef 1:6": "En hen die terugkeren van achter de HEERE; en die de HEERE niet zoeken, en niet naar Hem vragen.", "2 Kon 17:20": "Zo verwierp de HEERE heel het nageslacht van Israël, en onderdrukte hen, en gaf hen in de hand van rovers, totdat Hij hen van Zijn aangezicht weggeworpen had.", "Jer 22:22": "De wind zal al uw herders weiden, en uw minnaars zullen in gevangenschap gaan; dan zult u zeker beschaamd worden en te schande gemaakt worden, vanwege al uw slechtheid.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Jes 20:5": "En zij zullen verschrikken en beschaamd zijn over de Moren, op wie zij hun hoop hadden gevestigd, en over de Egyptenaars, hun roem.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Matt 23:10-12": "Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus. Maar de meeste onder u zal uw dienaar zijn. En wie zichzelf verhogen zal, die zal vernederd worden; en wie zichzelf zal vernederen, die zal verhoogd worden.", "Luk 15:1-10": "En alle tollenaars en zondaars kwamen naar Hem toe, om Hem te horen. En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen. En Hij sprak deze gelijkenis tegen hen, en zei:", "2 Tess 2:1": "En wij vragen u dringend, broeders, met het oog op de komst van onze Heere Jezus Christus, en onze samenkomst met Hem,", "Hebr 10:26-31": "Want als wij willens en wetens zondigen, nadat wij de kennis van de waarheid ontvangen hebben, blijft er geen offer meer over voor de zonden; maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Pred 8:9": "Dit alles heb ik gezien, toen ik mijn hart richtte op elk werk dat onder de zon gebeurt: er is een tijd dat de ene mens over de andere heerst, hem tot zijn eigen kwaad.", "Jer 2:19": "Uw boosheid zal u kastijden, en uw afkeringen zullen u straffen; weet dan en zie, dat het kwaad en bitter is, dat u de HEERE, uw God, verlaat, en Mijn vreze niet bij u is, spreekt de Heere, de HEERE van de heerscharen.", "Ezech 14:9": "Als nu een profeet overreed is en iets gesproken heeft, Ik, de HEERE, heb die profeet overreed, en Ik zal Mijn hand tegen hem uitstrekken, en zal hem verdelgen uit het midden van Mijn volk Israël.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "Hos 4:17": "Efraïm is met de afgoden verbonden; laat hem begaan.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Luk 14:26-33": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn. En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn. Want wie van u die een toren wil bouwen, gaat niet eerst zitten om de kosten te berekenen, of hij wel genoeg heeft om het af te maken?", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "2 Kron 28:16-18": "In diezelfde tijd zond koning Achaz tot de koningen van Assyrië, dat zij hem zouden helpen. Bovendien waren ook de Edomieten gekomen, en hadden Juda geslagen en gevangenen weggevoerd. Daartoe waren de Filistijnen ingevallen in de steden van het laagland en het zuiden van Juda, en hadden ingenomen Beth-Semes, en Ajalon, en Gederoth, en Socho met haar bijbehorende plaatsen, en Timna met haar bijbehorende plaatsen, en Gimzo met haar bijbehorende plaatsen; en zij woonden daar.", "2 Kon 18:21": "Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Jer 48:29": "Wij hebben Moabs hoogmoed gehoord (hij is zeer hoogmoedig), zijn trots, en zijn hoogmoed, en zijn overmoed, en de hoogheid van zijn hart.", "Ps 27:8": "Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE!", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Jes 10:1-3": "Wee hun die onrechtvaardige regels bepalen, en de schrijvers die moeite voorschrijven; om de armen van het recht af te wenden, en om het recht van de ellendigen van Mijn volk te roven, opdat de weduwen hun buit worden, en opdat zij de wezen mogen plunderen! Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Jer 46:18": "Zo waarachtig als Ik leef, spreekt de Koning, Wiens Naam is HEERE van de heerscharen; hij zal voorzeker, als Thabor onder de bergen, en als Karmel bij de zee, aankomen!", "Jer 12:7": "Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.", "2 Tess 1:8": "Met vlammend vuur, wraak oefenend over hen die God niet kennen, en over hen die het Evangelie van onze Heere Jezus Christus niet gehoorzaam zijn.", "Jes 29:11": "Daarom is voor u elk visioen geworden als de woorden van een verzegeld boek, dat men geeft aan iemand die lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet, want het is verzegeld.", "Jer 7:4": "Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze!", "Ps 12:9": "De goddelozen lopen rond aan alle kanten, wanneer de snoodsten van de mensenkinderen verhoogd worden.", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Ps 94:12": "Gelukkig is de man, o HEERE! die Gij tuchtigt, en die Gij leert uit Uw wet,", "Hos 10:9": "Sinds de dagen van Gibea hebt u gezondigd, o Israël; daar zijn zij blijven staan; de strijd te Gibea tegen de kinderen van de verkeerdheid zal hen niet inhalen.", "Mark 7:18": "En Hij zei tegen hen: Bent ook u zo onwetend? Begrijpt u niet dat alles wat van buiten in de mens ingaat, hem niet kan verontreinigen?", "Micha 3:1-3": "Verder zei ik: Hoor nu, hoofden van Jakob, en leiders van het huis van Israël! Betaamt het u niet om het recht te weten? Zij haten het goede, en hebben het kwade lief; zij roven hun huid van hen af, en hun vlees van hun beenderen. Ja, zij zijn het, die het vlees van mijn volk eten, en hun huid afstropen, en hun beenderen verbreken; en uiteen leggen, zoals in een pot, en als vlees in het midden van een ketel.", "Ezech 18:28": "Omdat hij toeziet, en zich bekeert van al zijn overtredingen, die hij gedaan heeft, zal hij zeker leven, hij zal niet sterven.", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Jak 2:6": "Maar u hebt de arme oneer aangedaan. Onderdrukken de rijken u niet, en trekken zij u niet voor de rechterstoelen?", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Jer 6:13": "Want van hun kleinste aan tot hun grootste toe pleegt ieder van hen gierigheid, en van de profeet aan tot de priester toe bedrijft ieder van hen valsheid.", "2 Kron 21:12-15": "Toen kwam er een brief tot hem van de profeet Elia, waarin stond: Zo zegt de HEERE, de God van uw vader David: Omdat u niet gewandeld hebt in de wegen van uw vader Josafat en in de wegen van Asa, de koning van Juda, maar hebt gewandeld in de weg van de koningen van Israël, en Juda en de inwoners van Jeruzalem overspel hebt laten plegen, naar het overspel van het huis van Achab, en ook uw broers, uit het huis van uw vader, gedood hebt, die beter waren dan u; zie, de HEERE zal u treffen met een grote plaag over uw volk, uw kinderen, uw vrouwen en al uw bezit.", "Mark 2:17": "En Jezus hoorde dat, en zei tegen hen: Wie gezond zijn, hebben de dokter niet nodig, maar wie ziek zijn. Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars tot bekering.", "Jer 5:21-24": "Hoor nu dit, dwaas en harteloos volk! die ogen hebben, maar niet zien, die oren hebben, maar niet horen. Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan. Maar dit volk heeft een afvallig en opstandig hart; zij zijn afgevallen en weggegaan;", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Pred 10:17": "Gelukkig bent u, land, waarvan de koning een zoon van edelen is, en waarvan de vorsten op de juiste tijd eten, tot sterkte en niet tot drinkerij.", "Ezech 12:28": "Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Geen van Mijn woorden zal meer worden uitgesteld; het woord dat Ik gesproken heb, dat zal gebeuren, spreekt de Heere HEERE.", "Dan 9:4-12": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden. Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten. En wij hebben niet geluisterd naar Uw dienstknechten, de profeten, die in Uw Naam spraken tot onze koningen, onze vorsten en onze vaders, en tot heel het volk van het land.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "1 Kor 14:38": "Maar als iemand onwetend is, laat hij dan onwetend blijven.", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Hab 1:15-17": "Hij trekt ze allen met de vishaak op, hij vergadert ze in zijn sleepnet, en hij verzamelt ze in zijn net; daarom verblijdt hij zich en verheugt hij zich. Daarom offert hij aan zijn sleepnet, en brandt reukwerk aan zijn net; want daardoor is zijn deel vet geworden, en zijn voedsel smoutig. Zal hij dan daarom voortdurend zijn sleepnet leegmaken, en zal hij er niet mee ophouden om aanhoudend de volken te doden?", "Hos 8:11": "Omdat Efraïm de altaren vermenigvuldigd heeft om te zondigen, zijn hem de altaren geworden tot zondigen.", "Jer 5:11": "Want het huis van Israël en het huis van Juda hebben helemaal trouweloos tegen Mij gehandeld, spreekt de HEERE.", "Jes 46:12": "Hoor naar Mij, u die hardnekkig van hart bent, u, die ver van de gerechtigheid zijt!", "Matt 11:16-24": "Maar waarbij zal Ik dit geslacht vergelijken? Het is gelijk aan de kinderen, die op de markten zitten, en hun vrienden toeroepen, En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend. Want Johannes is gekomen, niet etend, niet drinkend, en zij zeggen: Hij heeft de duivel.", "Spr 18:12": "Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Ps 69:33": "De zachtmoedigen, als zij dit gezien hebben, zullen zich verblijden; en u die God zoekt, uw hart zal leven.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Spr 16:19": "Het is beter nederig van geest te zijn met de zachtmoedigen, dan buit te delen met de hoogmoedigen.", "Pred 7:3": "Het treuren is beter dan het lachen; want door de droefheid van het aangezicht wordt het hart gebeterd.", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Ex 5:2": "Maar Farao zei: Wie is de HEERE, Wiens stem ik ge
