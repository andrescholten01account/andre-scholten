ngen zal Hij hem vergelden.", "4": "In *moeders* buik hield hij zijn broeder bij de verzenen; en in zijn kracht gedroeg hij zich vorstelijk met God.", "5": "Ja, hij gedroeg zich vorstelijk tegen den Engel, en overmocht *Hem*; hij weende en smeekte Hem. *Te* Beth-el vond hij Hem, en aldaar sprak Hij met ons;", "6": "Namelijk, de Heere, de God der heirscharen; Heere is Zijn gedenknaam.", "7": "Gij dan, bekeer u tot uw God, bewaar weldadigheid en recht, en wacht geduriglijk op uw God.", "8": "In des koopmans hand is een bedriegelijke weegschaal, hij bemint te verdrukken;", "9": "Nog zegt Efraïm: Evenwel ben ik rijk geworden, ik heb mij groot goed verkregen; *in* al mijn arbeid zullen zij mij geen ongerechtigheid vinden, die zonde zij.", "10": "Maar Ik ben de Heere, uw God, van Egypteland af; Ik zal u nog in tenten doen wonen, als in de dagen der samenkomst;", "11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door den dienst der profeten zal Ik gelijkenissen voorstellen.", "12": "Zekerlijk is Gilead ongerechtigheid, zij zijn enkel ijdelheid; te Gilgal offeren zij ossen, ja, hun altaren zijn als *steen* hopen op de voren der velden.", "13": "Jakob vlood toch *naar* het veld van Syrië, en Israël diende om een vrouw, en hoedde om een vrouw.", "14": "Maar de Heere voerde Israël op uit Egypte door een profeet, en door een profeet werd hij gehoed.", "15": "Efraïm *daarentegen* heeft *Hem* zeer bitterlijk vertoornd; daarom zal Hij zijn bloed op hem laten, en zijn Heere zal hem zijn smaad vergelden."}, "KJV": {"1": "Ephraim feedeth on wind, and followeth after the east wind: he daily increaseth lies and desolation; and they do make a covenant with the Assyrians, and oil is carried into Egypt.", "2": "The LORD hath also a controversy with Judah, and will punish Jacob according to his ways; according to his doings will he recompense", "3": "He took his brother by the heel in the womb, and by his strength he had power with God:", "4": "Yea, he had power over the angel, and prevailed: he wept, and made supplication unto him: he found him *in* Bethel, and there he spake", "5": "Even the LORD God of hosts; the LORD *is* his memorial.", "6": "Therefore turn thou to thy God: keep mercy and judgment, and wait on thy God continually.", "7": "*He is* a merchant, the balances of deceit *are* in his hand: he loveth to oppress.", "8": "And Ephraim said, Yet I am become rich, I have found me out substance: *in* all my labours they shall find none iniquity in me that *were* sin.", "9": "And I *that am* the LORD thy God from the land of Egypt will yet make thee to dwell in tabernacles, as in the days of the solemn feast.", "10": "I have also spoken by the prophets, and I have multiplied visions, and used similitudes, by the ministry of the prophets.", "11": "*Is there* iniquity *in* Gilead? surely they are vanity: they sacrifice bullocks in Gilgal; yea, their altars *are* as heaps in the furrows of the fields.", "12": "And Jacob fled into the country of Syria, and Israel served for a wife, and for a wife he kept", "13": "And by a prophet the LORD brought Israel out of Egypt, and by a prophet was he preserved.", "14": "Ephraim provoked *him* to anger most bitterly: therefore shall he leave his blood upon him, and his reproach shall his Lord return"}}, "tsk": {"1": [{"kopje": "omsingeld", "refs": ["Hos 7:16", "Hos 12:2", "Hos 12:8", "Ps 78:36", "Jes 29:13", "Jes 44:20", "Jes 59:3", "Jes 59:4", "Micha 6:12"]}, {"kopje": "Juda", "refs": ["Hos 4:15", "2 Kon 18:4-7", "2 Kron 29:1", "2 Kron 32:33"]}, {"kopje": "heerste", "refs": ["Gen 32:28", "1 Kor 6:2", "Openb 1:6", "Openb 3:21", "Openb 5:10"]}], "2": [{"kopje": "weidt", "refs": ["Hos 8:7", "Job 15:2", "Jer 22:22"]}, {"kopje": "de hele dag", "refs": ["Hos 12:1"]}, {"kopje": "en zij", "refs": ["Hos 5:13", "2 Kon 15:19", "2 Kon 17:4-6", "Jes 30:6", "Jes 30:7"]}], "3": [{"kopje": "een twist", "refs": ["Hos 4:1", "Jer 25:31", "Micha 6:2"]}, {"kopje": "en Hij zal", "refs": ["2 Kon r hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "Jes 32:7": "En het hele gereedschap van een gierigaard is kwaad; hij bedenkt schandelijke plannen, om de ellendigen te gronde te richten met valse woorden, ook als de arme spreekt wat recht is.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Jak 5:16-18": "Belijd elkaar de misdaden, en bid voor elkaar, opdat u gezond wordt; een krachtig gebed van de rechtvaardige vermag veel. Elia was een mens net zo onderhevig aan gevoelens als wij; en hij bad een gebed, dat het niet zou regenen; en het regende niet op de aarde, drie jaar en zes maanden lang. En hij bad opnieuw, en de hemel gaf regen, en de aarde bracht haar vrucht voort.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Joh 6:70": "Jezus antwoordde hun: Heb Ik u niet twaalf uitgekozen? En één van u is een duivel.", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Hos 14:2": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.", "Gen 32:9-12": "Verder zei Jakob: O, God van mijn vader Abraham, en God van mijn vader Izak, o HEERE! Die tegen mij gezegd hebt: Keer terug naar uw land en naar uw familie, en Ik zal u goeddoen! Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden! Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Ex 17:16": "En hij zei: Omdat de hand op de troon van de HEERE is, zal er oorlog van de HEERE tegen Amalek zijn, van geslacht tot geslacht!", "Joh 2:16": "En Hij zei tegen hen die de duiven verkochten: Neem deze dingen hier weg; maak het huis van Mijn Vader niet tot een huis van koophandel.", "Ezech 33:24-26": "Mensenkind! De inwoners van die verwoeste plaatsen in het land van Israël zeggen: Abraham was maar één man, en bezat dit land erfelijk; maar wij zijn met velen; het land is ons gegeven tot erfelijk bezit. Daarom, zeg tegen hen: Zo zegt de Heere HEERE: U eet vlees met het bloed, en heft uw ogen op naar uw drekgoden, en vergiet bloed; en zou u het land dan erfelijk bezitten? U vertrouwt op uw zwaard; u doet gruwelijke dingen, en ieder van u verontreinigt de vrouw van zijn naaste; en zou u het land dan erfelijk bezitten?", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Ps 21:5": "Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos.", "Lev 26:13": "Ik ben de HEERE, uw God, Die u uit het land van de Egyptenaren uitgevoerd heeft, opdat u hun slaven niet zou zijn; en Ik heb de disselbomen van uw juk verbroken, en heb u rechtop laten staan.", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "2 Kon 6:21-23": "En de koning van Israël zei tegen Elisa, toen hij hen zag: Zal ik hen doden? Zal ik hen doden, mijn vader? Doch hij zei: U zult hen niet doden; zou u ook doden wie u met uw zwaard en met uw boog gevangen had? Zet hun brood en water voor, dat zij eten en drinken, en naar hun heer trekken. En hij bereidde voor hen een grote maaltijd, dat zij aten en dronken; daarna liet hij hen gaan, en zij trokken naar hun heer. Zo kwamen de rooftroepen van de Syriërs niet meer in het land van Israël.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Spr 11:1": "Een bedrieglijke weegschaal is de HEERE een gruwel; maar een volkomen weegsteen is Zijn welgevallen.", "Joh 15:22": "Als Ik niet gekomen was, en tot hen gesproken had, hadden zij geen zonde; maar nu hebben zij geen voorwendsel voor hun zonde.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Gen 32:24-30": "Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging. En toen Hij zag dat Hij niet de overhand over hem kreeg, raakte Hij zijn heupgewricht aan, zodat het heupgewricht van Jakob verwrongen raakte, terwijl Hij met hem worstelde. En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Neh 3:32": "En tussen de bovenzaal van het punt tot de Schaapspoort toe, verbeterden de goudsmeden en de kruideniers.", "Luk 18:10-14": "Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar. Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Ex 3:2-5": "En de Engel van de HEERE verscheen hem in een vuurvlam uit het midden van een braambos; en hij zag, en zie, het braambos brandde in het vuur, en het braambos werd niet verteerd. En Mozes zei: Ik zal mij nu daarheen wenden, en dat grote gezicht bezien, waarom het braambos niet verbrandt. Toen de HEERE zag dat hij zich daarheen wendde om te kijken, riep God tot hem uit het midden van het braambos, en zei: Mozes, Mozes! En hij zei: Zie, hier ben ik!", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Ps 55:21": "Hij slaat zijn handen aan hen die vrede met Hem hadden; hij ontheiligt Zijn verbond.", "Amos 4:5": "En laat rook opgaan van het gedesemde als een lofoffer, en roep vrijwillige offers uit, laat het horen; want zo hebt u het graag, kinderen van Israël! spreekt de Heere HEERE.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Amos 3:10": "Want zij weten niet te doen wat recht is, spreekt de HEERE; zij die in hun paleizen schatten vergaren door geweld en verwoesting.", "Joh 7:19": "Heeft Mozes u niet de wet gegeven? En niemand van u doet de wet. Waarom probeert u Mij te doden?", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "Luk 13:1-5": "En er waren in diezelfde tijd enigen aanwezig, die Hem vertelden van de Galileeërs, van wie Pilatus het bloed met hun offers gemengd had. En Jezus antwoordde en zei tegen hen: Denkt u dat deze Galileeërs meer zondaars zijn geweest dan alle andere Galileeërs, omdat zij zulke dingen hebben geleden? Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Richt 6:22-24": "Toen zag Gideon dat het een Engel van de HEERE was; en Gideon zei: Ach, Heere HEERE! Want ik heb een Engel van de HEERE gezien, van aangezicht tot aangezicht. Doch de HEERE zei tegen hem: Vrede zij u, vrees niet, u zult niet sterven. Toen bouwde Gideon daar voor de HEERE een altaar, en noemde het: De Heere is vrede! Het staat nog tot op deze dag in Ofra van de Abiëzrieten.", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "1 Kor 5:13": "Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Gen 28:1-5": "En Izak riep Jakob, zegende hem en gebood hem, en zei tegen hem: Neem geen vrouw van de dochters van Kanaän. Maak u op, ga naar Paddan-aram, naar het huis van Bethuel, de vader van uw moeder, en neem u vandaar een vrouw, van de dochters van Laban, de broer van uw moeder. En God, de Almachtige, zegent u, en maakt u vruchtbaar, en vermenigvuldigt u, zodat u tot een groep volken wordt.", "Ps 55:13-15": "Want het is geen vijand die mij hoont, anders zou ik het hebben gedragen; het is mijn hater niet die zich tegen mij groot maakt, anders zou ik mij voor hem verborgen hebben. Maar u bent het, o mens, als van mijn eigen stand, mijn leidsman en mijn bekende! Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Jona 2:1": "En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis.", "Hos 9:10": "Ik vond Israël als druiven in de woestijn, Ik zag uw vaders als de eerste vrucht aan de vijgenboom in haar begintijd; maar zij gingen naar Baäl-peor, en zonderden zich af tot die schande, en werden helemaal verfoeilijk, net als datgene wat zij liefhadden.", "Zach 11:5": "Die hen bezitten doden hen, en houden het niet voor schuld; en ieder van hen die ze verkopen, zegt: Geloofd zij de HEERE, dat ik rijk geworden ben! En niemand van hen die ze weiden, ontziet ze.", "Mark 9:28": "En toen Hij in huis gegaan was, vroegen Zijn discipelen Hem apart: Waarom konden wij hem niet uitdrijven?", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "1 Kon 2:33": "Zo zal hun bloed terugkeren op het hoofd van Joab, en op het hoofd van zijn nakomelingen voor eeuwig; maar David, en zijn nakomelingen, en zijn huis, en zijn troon zal vrede hebben van de HEERE tot in eeuwigheid.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "2 Kor 2:15": "Want wij zijn voor God een goede geur van Christus, onder hen die behouden worden, en onder hen die verloren gaan;", "Deut 8:17": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven.", "2 Kron 20:37": "Maar Eliëzer, de zoon van Dodava, uit Maresa, profeteerde tegen Josafat en zei: Omdat u zich met Ahazia verbonden hebt, heeft de HEERE uw werken verscheurd. Zo werden de schepen verbroken, zodat zij niet naar Tharsis konden gaan.", "Zef 3:8": "Daarom, verwacht Mij, spreekt de HEERE, op de dag dat Ik Mij opmaak² tot de roof; want Mijn oordeel is, de heidenen te verzamelen, de koninkrijken te vergaderen, om over hen Mijn gramschap, de gehele gloed van Mijn toorn, uit te storten; want dit gehele land zal door het vuur van Mijn na-ijver verteerd worden.", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Matt 5:7": "Zalig zijn de barmhartigen, want hun zal barmhartigheid geschieden.", "Jes 32:5": "De dwaas zal niet meer milddadig genoemd worden, en de gierige zal niet meer mild geheten worden.", "Ezech 7:3": "Nu is het einde over u; want Ik zal Mijn toorn tegen u zenden, en Ik zal u richten naar uw wegen, en Ik zal op u brengen al uw gruwelen.", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "Job 34:28": "Opdat Hij op hem het geroep van de arme brengt, en het geroep van de ellendigen verhoort.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Matt 13:22": "En die in de doornen bezaaid is, dit is degene die het woord hoort; en de zorgen van deze wereld en de verleiding van de rijkdom verstikken het woord, en het wordt onvruchtbaar.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Spr 21:27": "Het offer van de goddelozen is een gruwel; hoeveel te meer, als zij het met een schandelijk voornemen brengen!", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Jes 8:4-7": "Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur. En de HEERE sprak nog verder tegen mij en zei: Omdat dit volk het water van Siloa veracht, dat zachtjes stroomt, en er vreugde is bij Rezin en de zoon van Remalia,", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "1 Tess 5:21": "Beproef alle dingen; behoud het goede.", "2 Tim 2:3": "Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Jes 30:18": "En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten.", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "2 Sam 1:16": "En David zei tegen hem: Uw bloed komt op uw hoofd; want uw mond heeft tegen u getuigd, toen u zei: ik heb de gezalfde van de HEERE gedood.", "Gen 32:24-28": "Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging. En toen Hij zag dat Hij niet de overhand over hem kreeg, raakte Hij zijn heupgewricht aan, zodat het heupgewricht van Jakob verwrongen raakte, terwijl Hij met hem worstelde. En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.", "2 Petr 3:17": "U dan, geliefden, omdat u dit van tevoren weet, wees op uw hoede, dat u niet mede weggesleept wordt door de dwaling van de verdorven mensen, en afvalt van uw eigen standvastigheid;", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Deut 26:5": "Dan zult u voor het aangezicht van de HEERE, uw God, betuigen en zeggen: Mijn vader was een omzwervende Syriër, en hij trok af naar Egypte, en verbleef daar als vreemdeling met weinig mensen; maar hij werd daar tot een groot, machtig en talrijk volk.", "Ezech 33:30-32": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt. En zij komen tot u, zoals het volk gewoon is te komen, en zitten voor uw aangezicht als Mijn volk, en horen uw woorden, maar zij doen ze niet; want zij spreken lieve woorden met hun mond, maar hun hart gaat hun hebzucht na. En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "Job 33:26-28": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven. Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat; Maar God heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Amos 2:7": "Die ernaar hijgen dat het stof van de aarde op het hoofd van de armen is, en de weg van de zachtmoedigen verdraaien; en de man en zijn vader gaan naar een jonge dochter om Mijn heilige Naam te ontheiligen.", "Jes 7:8": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is.", "Jer 35:7": "Ook zult u geen huis bouwen, geen zaad zaaien, geen wijngaard planten, noch hebben; maar u zult in tenten wonen al uw dagen, opdat u veel dagen leeft in het land waar u als vreemdeling verblijft.", "1 Kon 13:1": "En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken.", "Job 8:13-15": "Zo zijn de wegen van allen die God vergeten; en de verwachting van de huichelaar zal vergaan. Van wie zijn hoop walgen zal; en zijn vertrouwen zal zijn als het huis van een spin. Hij zal op zijn huis leunen, maar het zal niet bestaan; hij zal zich eraan vasthouden, maar het zal niet staande blijven.", "Job 31:33": "Als ik, net als Adam, mijn overtredingen bedekt heb, door eigenliefde mijn misdaad verbergende!", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "Nahum 3:16": "U hebt meer handelaars dan er sterren aan de hemel zijn; de kevers zullen invallen, en ervandaan vliegen.", "Micha 6:2": "Hoor, bergen, de twist van de HEERE, en ook u, sterke fundamenten van de aarde! Want de HEERE heeft een twist met Zijn volk, en Hij zal met Israël een rechtszaak voeren.", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Amos 8:6": "Zodat wij de armen voor geld mogen kopen, en de nooddruftige om een paar schoenen; en dan zullen wij het kaf van het koren verkopen.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Hebr 6:11": "Maar wij verlangen ernaar dat ieder van u dezelfde ijver bewijst, tot de volle zekerheid van de hoop, tot het einde toe;", "Openb 21:7": "Wie overwint, zal alles beërven; en Ik zal hem een God zijn, en hij zal Mij een zoon zijn.", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Ps 130:5-7": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord. Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen. Israël, hoop op de HEERE; want bij de HEERE is goedertierenheid, en bij Hem is veel verlossing.", "Matt 6:5": "En wanneer u bidt, wees dan niet zoals de geveinsden; want die bidden graag terwijl ze in de synagogen en op de hoeken van de straten staan, opdat zij door de mensen gezien worden. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.", "Jes 30:10": "Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Hand 14:21": "En toen zij in die stad het Evangelie verkondigd hadden en veel discipelen gemaakt hadden, keerden zij terug naar Lystre, en Ikonium, en Antiochië,", "Spr 13:2": "Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Hand 2:17": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen.", "Ps 36:3": "Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "Matt 21:41": "Zij zeiden tegen hem: Hij zal die kwaden een kwade dood laten sterven, en de wijngaard verhuren aan andere landbouwers, die hem de vruchten op de juiste tijd zullen geven.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Job 32:2": "Toen ontstak de toorn van Elihu, de zoon van Baracheël, de Buziet, uit het geslacht van Ram; tegen Job werd zijn toorn ontstoken, omdat hij zichzelf meer rechtvaardigde dan God.", "Jak 1:14": "Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Lev 19:36": "U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Mark 12:38-40": "En Hij zei tegen hen in Zijn onderwijs: Pas op voor de Schriftgeleerden, die graag in lange kleren willen rondlopen, en gegroet willen worden op de markten; en de voorste plaatsen willen hebben in de synagogen, en de ereplaatsen bij de maaltijden; die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Amos 5:6": "Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Rom 11:19-21": "U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden. Het is wel; zij zijn door ongeloof afgebroken, en u staat door het geloof. Wees niet hoogmoedig, maar vrees. Want als God de natuurlijke takken niet gespaard heeft, zie toe, dat Hij ook mogelijk u niet spaart.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Spr 12:14": "Ieder wordt van de vrucht van de mond met goed verzadigd; en de vergelding van de handen van de mens zal Hij hem terugbrengen.", "2 Tim 1:13": "Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Neh 8:16-18": "en dat zij het bekend zouden maken en een boodschap zouden laten doorgaan door al hun steden en in Jeruzalem, en zeggen: Ga het gebergte in, en haal takken van olijfbomen, en takken van andere olieachtige bomen, en takken van mirtebomen, en takken van palmbomen, en takken van andere dichtbebladerde bomen, om loofhutten te maken, zoals er geschreven staat. Zo ging het volk erop uit en haalde ze, en zij maakten voor zichzelf loofhutten, ieder op zijn dak, en in hun binnenplaatsen, en in de voorhoven van het huis van God, en op het plein van de Waterpoort, en op het plein van de Efraïmpoort. En de hele gemeente van hen die uit de gevangenschap waren teruggekomen, maakte loofhutten en woonde in die loofhutten; want de kinderen van Israël hadden dat niet meer gedaan sinds de dagen van Jozua, de zoon van Nun, tot op die dag toe; en er was zeer grote blijdschap.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Lev 26:40-42": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Spr 15:17": "Beter is een gerecht van groente, waar ook liefde is, dan een vetgemeste os met haat erbij.", "Jer 2:20": "Toen Ik van oude tijden af uw juk verbroken, en uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.", "Matt 22:12": "En hij zei tegen hem: Vriend! Hoe bent u hier binnengekomen zonder een bruiloftskleed aan te hebben? En hij verstomde.", "Jes 5:11-14": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft! En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Ex 23:32": "U zult met hen, noch met hun goden, een verbond sluiten.", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Gen 6:12": "Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.", "Jes 8:7": "daarom, zie, zal de Heere over hen laten opkomen dat sterke en geweldige water van de rivier, de koning van Assyrië en al zijn heerlijkheid; en hij zal opkomen over al zijn stromen, en overgaan over al zijn oevers;", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "2 Kron 25:6": "Daartoe huurde hij uit Israël honderdduizend sterke helden, voor honderd talenten van het zilver.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Luk 11:1-13": "En het gebeurde, toen Hij op een zekere plaats was en bad, dat, toen Hij ophield, een van Zijn discipelen tegen Hem zei: Heere, leer ons bidden, zoals ook Johannes zijn discipelen geleerd heeft. En Hij zei tegen hen: Wanneer u bidt, zegt dan: Onze Vader, Die in de hemelen bent! Uw Naam worde geheiligd. Laat Uw Koninkrijk komen. Uw wil geschiede, zoals in de hemel, zo ook op de aarde. Geef ons elke dag ons dagelijks brood.", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Jes 48:2": "Ja, van de heilige stad worden zij genoemd, en zij steunen op de God van Israël; HEERE van de heerscharen is Zijn Naam.", "Kol 3:12": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld;", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "Mark 6:11": "En als iemand u niet ontvangt, en niet naar u luistert, schud dan, wanneer u vandaar vertrekt, het stof van uw voeten af, hun tot een getuigenis. Voorwaar, Ik zeg u: Het zal voor Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "2 Kon 17:13": "Toen nu de HEERE tegen Israël en tegen Juda, door de dienst van alle profeten en van alle zieners, gewaarschuwd had en zei: Bekeer u van uw slechte wegen en houd Mijn geboden en Mijn inzettingen, naar de hele wet die Ik uw vaderen geboden heb, en die Ik u door de hand van Mijn knechten, de profeten, gezonden heb;", "Jer 19:10": "Dan zult u de kruik verbreken voor de ogen van de mannen, die met u meegegaan zijn;", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "Hos 4:15": "Als u, Israël! wilt hoereren, laat Juda dan zeker niet schuldig worden; kom toch niet naar Gilgal, en ga niet op naar Beth-Aven, en zweer niet: Zo waarachtig als de Heere leeft.", "Hebr 3:14": "Want wij zijn deelgenoten van Christus geworden, als wij tenminste het begin van dit vaste vertrouwen tot het einde toe onwrikbaar vasthouden;", "Jer 8:2": "En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Richt 2:2": "En wat u aangaat, u zult geen verbond maken met de inwoners van dit land; hun altaren zult u afbreken. Maar u bent Mijn stem niet gehoorzaam geweest; waarom hebt u dit gedaan?", "Job 20:4-18": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft, Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Luk 16:1-8": "En Hij zei ook tegen Zijn discipelen: Er was een zeker rijk mens, die een rentmeester had; en deze werd bij hem beschuldigd, dat hij zijn goederen verkwistte. En hij riep hem en zei tegen hem: Hoe hoor ik dit van u? Geef rekenschap van uw rentmeesterschap; want u zult niet meer rentmeester kunnen zijn. En de rentmeester zei bij zichzelf: Wat zal ik doen, omdat mijn heer dit rentmeesterschap van mij afneemt? Graven kan ik niet; te bedelen schaam ik mij.", "Hebr 6:15": "En zo heeft hij, nadat hij geduldig volhard had, de belofte verkregen.", "Gen 23:16": "En Abraham luisterde naar Efron; en Abraham woog Efron het geld af, waarover hij gesproken had ten aanhoren van de zonen van Heth, vierhonderd sikkel van het zilver, gangbaar bij de koopman.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Jer 23:16": "Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.", "1 Kon 2:34": "En Benaja, de zoon van Jojada, ging omhoog, en viel op hem aan, en doodde hem; en hij werd begraven in zijn huis, in de woestijn.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Hos 5:1-3": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor. En zij die afwijken, verdiepen zich erin om te slachten; maar Ik zal hun allen een tuchtmeester zijn. Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Ps 37:26": "De hele dag ontfermt hij zich, en leent; en zijn nageslacht is tot zegen.", "Jes 17:3": "En de vesting zal ophouden in Efraïm, en het koninkrijk in Damaskus, en het overblijfsel van de Syriërs; zij zullen zijn als de heerlijkheid van de kinderen van Israël, spreekt de HEERE van de heerscharen.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Deut 7:2": "en de HEERE, uw God, hen aan u zal hebben overgegeven, zodat u hen verslaat, dan moet u hen helemaal met de ban vernietigen; u zult geen verbond met hen maken, en hun ook niet genadig zijn.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Amos 5:24": "Maar laat het oordeel zich voortbewegen als de wateren, en de gerechtigheid als een sterke beek.", "Jer 42:6": "Hetzij goed of kwaad, wij zullen gehoorzaam zijn aan de stem van de HEERE, onze God, tot Wie wij u zenden; opdat het ons goed gaat, wanneer wij gehoorzaam zijn aan de stem van de HEERE, onze God.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Ezech 7:19": "Zij zullen hun zilver op de straten werpen, en hun goud zal tot onreinheid zijn; hun zilver en hun goud zal hen niet kunnen uithelpen ten dage van de verbolgenheid van de HEERE; hun ziel zullen zij niet verzadigen, en hun ingewanden zullen zij niet vullen; want het zal de aanstoot van hun ongerechtigheid zijn.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Deut 34:10": "En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht,", "Ps 66:20": "Geloofd zij God, Die mijn gebed niet heeft afgewend, en Zijn goedertierenheid niet van mij.", "Job 15:33": "Men zal zijn onrijpe druiven afrukken, als van een wijnstok, en zijn bloeisel afwerpen, als van een olijfboom.", "Ezech 20:39": "En u, o huis van Israël, zo zegt de Heere HEERE: Gaat heen, dient ieder zijn drekgoden, ook hierna, omdat u naar Mij niet wilt horen; maar ontheiligt niet meer Mijn heilige Naam, met uw giften en met uw drekgoden.", "Jes 59:18": "Naar de werken, daarnaar zal Hij vergelden: grimmigheid aan Zijn tegenstanders, vergelding aan Zijn vijanden; aan de eilanden zal Hij het loon vergelden.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Gen 27:43": "Nu dan, mijn zoon! luister naar mijn stem, en maak u op, vlucht naar Haran, naar Laban, mijn broer.", "Ezech 17:4": "Hij plukte de top van zijn jonge takjes af, en bracht hem in een land van koophandel; hij zette hem in een stad van kooplieden.", "Joh 5:45": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.", "Job 22:3": "Is het voor de Almachtige nuttig, dat u rechtvaardig bent; of is het winst voor Hem, dat u uw wegen volmaakt maakt?", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Amos 4:4": "Kom naar Beth-el, en overtreed te Gilgal; maak veel van het overtreden, en breng uw offers 's morgens, uw tienden om de drie dagen!", "Luk 18:18-23": "En een zekere leider vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God. U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Ef 3:11": "naar het eeuwig voornemen, dat Hij gemaakt heeft in Christus Jezus, onze Heere;", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Jak 1:8": "Een dubbelhartig man is onstandvastig in al zijn wegen.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Jak 4:13-15": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Mal 1:6-14": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam? U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk. Want als u iets blinds aanbrengt om te offeren, is dat bij u niet kwaad; en als u iets kreupels of iets kranks aanbrengt, is dat niet kwaad! Breng dat toch aan uw vorst; zal hij welgevallen aan u hebben? of zal hij u gunstig ontvangen? zegt de HEERE van de heerscharen.", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "Ex 23:33": "Zij zullen in uw land niet wonen, opdat zij u niet tegen Mij laten zondigen; als u hun goden dient, zal het u zeker tot een valstrik zijn.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Ps 78:36": "En zij vleiden Hem met hun mond, en logen tegen Hem met hun tong.", "Gen 32:27": "En Hij zei tegen hem: Hoe is uw naam? En hij zei: Jakob.", "Luk 22:34": "Maar Hij zei: Ik zeg u, Petrus, de haan zal vandaag niet kraaien, voordat u driemaal geloochend zult hebben dat u Mij kent.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Luk 10:29": "Maar hij wilde zichzelf rechtvaardigen en zei tegen Jezus: En wie is mijn naaste?", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Spr 4:18": "Maar het pad van de rechtvaardigen is als een schijnend licht, dat voortgaat en meer licht geeft tot de volle dag toe.", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Gen 28:11-19": "En hij kwam op een plaats, waar hij overnachtte, want de zon was ondergegaan; en hij nam van de stenen van die plaats, en maakte er zijn hoofdkussen van, en legde zich te slapen op die plaats. En hij droomde, en zie, een ladder stond op de aarde opgesteld, waarvan de top tot de hemel reikte; en zie, de engelen van God klommen daarlangs op en neer. En zie, de HEERE stond boven op de ladder en zei: Ik ben de HEERE, de God van uw vader Abraham, en de God van Izak; dit land, waarop u ligt te slapen, zal Ik aan u geven, en aan uw nageslacht.", "Rom 2:1": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.", "2 Tess 2:15-17": "Welnu dan, broeders, staat vast en houdt vast aan de overleveringen, die u geleerd zijn, hetzij door ons woord, hetzij door onze brief. En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade, moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Hebr 10:26-30": "Want als wij willens en wetens zondigen, nadat wij de kennis van de waarheid ontvangen hebben, blijft er geen offer meer over voor de zonden; maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Jer 7:8-10": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Jer 17:11": "Zoals een veldhoen eieren verzamelt, maar ze niet uitbroedt, zo is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "Micha 2:1": "Wee hun die onrecht bedenken en kwaad beramen op hun slaapplaatsen; in het licht van de morgen doen zij het, omdat het in de macht van hun hand is.", "Jer 5:2": "En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals.", "Jes 30:7": "Want Egypte zal nutteloos en tevergeefs helpen; daarom heb Ik hierover geroepen: Stilzitten zal hun sterkte zijn.", "Jes 5:15": "Dan zal de gewone man neergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen van de hoogmoedigen zullen vernederd worden.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "1 Kor 15:2": "door wie u ook zalig wordt, als u het vasthoudt op de manier zoals ik het u verkondigd heb; tenzij u tevergeefs geloofd hebt.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Luk 12:2": "Er is niets bedekt, dat niet onthuld zal worden, en niets verborgen, dat niet bekend zal worden.", "Spr 30:20": "Zo is de weg van een overspelige vrouw; zij eet en veegt haar mond af, en zegt: Ik heb geen onrecht gedaan!", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "Rom 12:8": "hetzij wie vermaant, in het vermanen; wie uitdeelt, in eenvoud; wie leiding geeft, met ijver; wie barmhartigheid bewijst, met blijmoedigheid.", "Hebr 2:1": "Daarom moeten wij ons des te meer houden aan wat wij gehoord hebben, opdat wij het niet op enig moment laten wegglijden.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Ex 24:3": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.", "Luk 13:26": "Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "Ps 31:23": "Ik zei wel in mijn haast: Ik ben afgesneden van voor Uw ogen; maar toch hoorde U de stem van mijn smekingen, toen ik tot U riep.", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Hand 11:23": "Toen hij daar aangekomen was en de genade van God zag, werd hij blij, en vermaande hen allen dat zij met een vast voornemen van het hart bij de Heere zouden blijven.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Richt 13:22": "En Manoach zei tegen zijn vrouw: Wij zullen zeker sterven, omdat wij God gezien hebben.", "Gen 29:35": "En zij werd opnieuw zwanger, en baarde een zoon, en zei: Ditmaal zal ik de HEERE loven; daarom noemde zij zijn naam Juda. En zij hield op met baren.", "Spr 26:23-26": "Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim. Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "Spr 10:2": "Schatten van goddeloosheid geven geen voordeel; maar gerechtigheid redt van de dood.", "Spr 21:21": "Wie rechtvaardigheid en weldadigheid najaagt, zal het leven, rechtvaardigheid en eer vinden.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Mark 6:12": "En zij gingen uit, en predikten dat de mensen zich moesten bekeren.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Hebr 5:7": "Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Jer 26:3": "Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.", "Ef 3:12": "door wie wij de vrijmoedigheid hebben, en de toegang met vertrouwen, door het geloof aan Hem.", "Mark 7:9": "En Hij zei tegen hen: U doet inderdaad het gebod van God volledig teniet, opdat u uw overleveringen zou onderhouden.", "Rom 3:27": "Waar is dan de roem? Hij is uitgesloten. Door welke wet? Van de werken? Nee, maar door de wet van het geloof.", "Ps 77:2": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.", "Job 31:34": "Zeker, ik kon wel een grote menigte geweldig onderdrukt hebben; maar de verachtste van de huisgezinnen zou mij afgeschrikt hebben; zodat ik gewezen zou hebben, en bij de deur niet uitgegaan zijn.", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "Luk 21:1-4": "En toen Hij omhoogkeek, zag Hij de rijken hun gaven in de schatkist werpen. En Hij zag ook een zekere arme weduwe twee kleine penningen daarin werpen. En Hij zei: Waarlijk, Ik zeg u, dat deze arme weduwe meer dan allen heeft ingeworpen.", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "Ps 28:6": "Geprezen zij de HEERE, want Hij heeft de stem van mijn smekingen gehoord.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Job 17:8": "De oprechten zullen hierover verbaasd zijn, en de onschuldige zal zich tegen de huichelaar opmaken;", "Jer 6:8": "Laat u tuchtigen, Jeruzalem! Opdat Mijn ziel niet van u afgetrokken wordt, opdat Ik u niet stel tot een woestheid, tot een onbewoond land.", "Spr 26:19": "zo is een man die zijn naaste bedriegt, en zegt: Maakte ik geen grapje?", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Neh 9:27-37": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten. Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered. En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.", "Klaagl 3:26": "Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Luk 12:15": "En Hij zei tegen hen: Kijk uit en wees op uw hoede voor hebzucht; want het leven van iemand hangt niet af van de overvloed van zijn bezittingen.", "Klaagl 3:58": "Resch. Heere! U hebt de rechtszaken van mijn ziel bepleit, U hebt mijn leven verlost.", "Ezech 22:29": "Het volk van het land pleegt enkel verdrukking en bedrijft enkel roverij, ook onderdrukken zij de ellendige en de arme, en de vreemdeling verdrukken zij zonder recht.", "1 Kron 16:35": "En zegt: Verlos ons, o God van ons heil, en verzamel ons, en red ons van de heidenen, opdat wij Uw heilige Naam loven, en opdat wij ons in Uw lof roemen.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "Ps 30:7": "Ik zei wel in mijn voorspoed: Ik zal nooit wankelen.", "Jer 23:17": "Zij zeggen steeds tegen hen die Mij lasteren: De HEERE heeft het gesproken, u zult vrede hebben; en tegen ieder die naar het goeddunken van zijn eigen hart wandelt, zeggen zij: U zal geen kwaad overkomen.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Jer 12:5": "Als u loopt met de voetgangers, zo maken zij u moe; hoe zult u zich dan meten met de paarden? Als u alleen vertrouwt in een land van vrede, hoe zult u het dan maken in de verheffing van de Jordaan?", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Jer 8:19": "Zie, de stem van het geschrei van de dochter van mijn volk klinkt uit een zeer ver land: Is de HEERE dan niet in Sion, is haar Koning niet bij haar? Waarom hebben zij Mij vertoornd met hun gesneden beelden, met de nietige afgoden van de vreemden?", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ps 101:7": "Wie bedrog pleegt, zal binnen mijn huis niet blijven; die leugens spreekt, zal voor mijn ogen niet bevestigd worden.", "Rom 2:5-12": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken: Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Jer 2:35": "Nog zegt u: Zeker, ik ben onschuldig; Zijn toorn is immers van mij afgekeerd. Zie, Ik zal met u rechten, omdat u zegt: Ik heb niet gezondigd.", "Fil 4:6": "Wees over niets bezorgd; maar laat in alles, door bidden en smeken, met dankzegging uw verlangens bekend worden bij God;", "2 Kron 9:14": "Behalve wat de kramers en de kooplieden inbrachten; ook brachten alle koningen van Arabië, en de vorsten van dat land, goud en zilver aan Salomo.", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Ps 37:7": "Daleth. Zwijg voor de HEERE, en verwacht Hem; wind u niet op over hem die voorspoedig is op zijn weg; over een man die listige plannen uitvoert.", "Micha 6:12": "Omdat haar rijke lieden vol zijn van geweld, en haar inwoners leugen spreken, en hun tong bedrieglijk is in hun mond,", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Ps 107:13-20": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten. Hij voerde hen uit de duisternis en de schaduw van de dood, en Hij brak hun banden. Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Jer 22:9": "En zij zullen zeggen: Omdat zij het verbond van de HEERE, hun God, hebben verlaten, en zich voor andere goden hebben neergebogen, en die gediend.", "Jes 58:2-5": "Hoewel zij Mij dagelijks zoeken en een lust hebben aan de kennis van Mijn wegen, als een volk dat gerechtigheid doet en het recht van zijn God niet verlaat, vragen zij Mij naar de rechten van de gerechtigheid; zij hebben een lust om tot God te naderen; En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid. Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Job 34:11": "Want naar het werk van de mens vergeldt Hij hem, en naar ieders weg doet Hij het hem vinden.", "Luk 18:12": "Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "2 Kron 25:7": "Maar er kwam een man van God tot hem, en hij zei: O koning! Laat het leger van Israël niet met u meegaan; want de HEERE is niet met Israël, met al de kinderen van Efraïm.", "Ex 24:7": "En hij nam het boek van het verbond, en hij las het voor de oren van het volk; en zij zeiden: Al wat de HEERE gesproken heeft, zullen wij doen en gehoorzamen.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Jes 30:5": "Hij zal hen allen beschaamd maken door een volk dat hun geen nut kan doen, noch tot hulp, noch tot voordeel, maar tot schande en ook tot smaad zijn zal.", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "Ezech 18:27": "Maar als de goddeloze zich bekeert van zijn goddeloosheid, die hij gedaan heeft, en recht en gerechtigheid doet, die zal zijn ziel in het leven behouden;", "Spr 16:8": "Beter is een weinig met gerechtigheid, dan de veelheid van inkomsten zonder recht.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Hos 14:4": "Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Mark 10:24": "En de discipelen waren verbaasd over deze woorden van Hem. Maar Jezus antwoordde weer en zei tegen hen: Kinderen, hoe moeilijk is het voor hen die op rijkdom vertrouwen, om het Koninkrijk van God binnen te gaan!", "Matt 16:27": "Want de Zoo
