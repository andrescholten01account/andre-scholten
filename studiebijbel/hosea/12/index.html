<style>

  .navselect { font-family:sans-serif; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }

  @keyframes flits { 0% { background: #f0e2bd; } 100% { background: var(--bg-soft); } }

  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }

chaal, hij houdt ervan te verdrukken;","9":"Nog zegt Efraïm: Toch ben ik rijk geworden, ik heb voor mij groot goed verkregen; *in* al mijn arbeid zullen zij mij geen ongerechtigheid vinden, die zonde zou zijn.","10":"Maar Ik ben de Heere, uw God, van Egypteland af; Ik zal u nog in tenten laten wonen, als in de dagen van het feest.","11":"En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.","12":"Zeker is Gilead ongerechtigheid, zij zijn enkel ijdelheid; te Gilgal offeren zij ossen, ja, hun altaren zijn als *steen*hopen op de voren van de velden.","13":"Jakob vluchtte toch *naar* het veld van Syrië, en Israël diende om een vrouw, en hoedde de kudde om een vrouw.","14":"Maar de Heere voerde Israël op uit Egypte door een profeet, en door een profeet werd hij behoed.","15":"Efraïm *daarentegen* heeft *Hem* zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden."},"SV":{"1":"Die van Efraïm hebben Mij omsingeld met leugen, en het huis Israëls met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.","2":"Efraïm weidt zich met wind, en jaagt den oostenwind na; den gansen dag vermenigvuldigt hij leugen en verwoesting; en zij maken verbond met Assur, en de olie wordt naar Egypte gevoerd.","3":"Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.","4":"In *moeders* buik hield hij zijn broeder bij de verzenen; en in zijn kracht gedroeg hij zich vorstelijk met God.","5":"Ja, hij gedroeg zich vorstelijk tegen den Engel, en overmocht *Hem*; hij weende en smeekte Hem. *Te* Beth-el vond hij Hem, en aldaar sprak Hij met ons;","6":"Namelijk, de Heere, de God der heirscharen; Heere is Zijn gedenknaam.","7":"Gij dan, bekeer u tot uw God, bewaar weldadigheid en recht, en wacht geduriglijk op uw God.","8":"In des koopmans hand is een bedriegelijke weegschaal, hij bemint te verdrukken;","9":"Nog zegt Efraïm: Evenwel ben ik rijk geworden, ik heb mij groot goed verkregen; *in* al mijn arbeid zullen zij mij geen ongerechtigheid vinden, die zonde zij.","10":"Maar Ik ben de Heere, uw God, van Egypteland af; Ik zal u nog in tenten doen wonen, als in de dagen der samenkomst;","11":"En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door den dienst der profeten zal Ik gelijkenissen voorstellen.","12":"Zekerlijk is Gilead ongerechtigheid, zij zijn enkel ijdelheid; te Gilgal offeren zij ossen, ja, hun altaren zijn als *steen* hopen op de voren der velden.","13":"Jakob vlood toch *naar* het veld van Syrië, en Israël diende om een vrouw, en hoedde om een vrouw.","14":"Maar de Heere voerde Israël op uit Egypte door een profeet, en door een profeet werd hij gehoed.","15":"Efraïm *daarentegen* heeft *Hem* zeer bitterlijk vertoornd; daarom zal Hij zijn bloed op hem laten, en zijn Heere zal hem zijn smaad vergelden."},"KJV":{"1":"Ephraim compasseth me about with lies, and the house of Israel with deceit: but Judah yet ruleth with God, and is faithful with the saints.","2":"Ephraim feedeth on wind, and followeth after the east wind: he daily increaseth lies and desolation; and they do make a covenant with the Assyrians, and oil is carried into Egypt.","3":"The LORD hath also a controversy with Judah, and will punish Jacob according to his ways; according to his doings will he recompense","4":"He took his brother by the heel in the womb, and by his strength he had power with God:","5":"Yea, he had power over the angel, and prevailed: he wept, and made supplication unto him: he found him *in* Bethel, and there he spake","6":"Even the LORD God of hosts; the LORD *is* his memorial.","7":"Therefore turn thou to thy God: keep mercy and judgment, and wait on thy God continually.","8":"*He is* a merchant, the balances of deceit *are* in his hand: he loveth to oppress.","9":"And Ephraim said, Yet I am become rich, I have found me out substance: *in* all my labours they shall find none iniquity in me that *were* sin.","10":"And I *that am* the LORD thy God from the land of Egypt will yet make thee to dwell in tabernacles, as in the days of the solemn feast.","11":"I have also spoken by the prophets, and I have multiplied visions, and used similitudes, by the ministry of the prophets.","12":"*Is there* iniquity *in* Gilead? surely they are vanity: they sacrifice bullocks in Gilgal; yea, their altars *are* as heaps in the furrows of the fields.","13":"And Jacob fled into the country of Syria, and Israel served for a wife, and for a wife he kept","14":"And by a prophet the LORD brought Israel out of Egypt, and by a prophet was he preserved.","15":"Ephraim provoked *him* to anger most bitterly: therefore shall he leave his blood upon him, and his reproach shall his Lord return"}},"tsk":{"1":[{"kopje":"omsingeld","refs":["Hos 7:16","Hos 12:2","Hos 12:8","Ps 78:36","Jes 29:13","Jes 44:20","Jes 59:3","Jes 59:4","Micha 6:12"]},{"kopje":"Juda","refs":["Hos 4:15","2 Kon 18:4-7","2 Kron 29:1","2 Kron 32:33"]},{"kopje":"heerste","refs":["Gen 32:28","1 Kor 6:2","Openb 1:6","Openb 3:21","Openb 5:10"]}],"2":[{"kopje":"weidt","refs":["Hos 8:7","Job 15:2","Jer 22:22"]},{"kopje":"de hele dag","refs":["Hos 12:1"]},{"kopje":"en zij","refs":["Hos 5:13","2 Kon 15:19","2 Kon 17:4-6","Jes 30:6","Jes 30:7"]}],"3":[{"kopje":"een twist","refs":["Hos 4:1","Jer 25:31","Micha 6:2"]},{"kopje":"en Hij zal","refs":["2 Kon 17:19","2 Kon 17:20","Jes 8:7","Jes 8:8","Jes 10:6","Jer 3:8-11","Ezech 23:11-21","Ezech 23:31","Ezech 23:32"]},{"kopje":"bezoeking doen","refs":["Hos 2:12","Hos 8:13","Hos 9:9","Jes 10:12","Jes 24:21"]},{"kopje":"naar zijn handelingen","refs":["Jes 3:11","Jes 59:18","Matt 16:27","Rom 2:6","Gal 6:7"]}],"4":[{"kopje":"hield","refs":["Gen 25:26","Rom 9:11"]},{"kopje":"gedroeg","refs":["Gen 32:24-28","Jak 5:16-18"]}],"5":[{"kopje":"Engel","refs":["Gen 32:29","Gen 48:15","Ex 3:2-5"," {"disp":"Openb 22:19","href":"../../openbaring/22/#v19","ref":"Openb 22:19","svLabel":null}],"kinderen":[]}]}]}},"noten":{"1":"D.i. legermachten"},"koppeling":{"1":"Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.","2":"Efraïm weidt zich met wind, en jaagt de oostenwind na; de hele dag vermenigvuldigt hij leugen en verwoesting; en zij maken een verbond met Assur, en de olie wordt naar Egypte gevoerd.","3":"Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.","4":"In <em>moeders</em> buik hield hij zijn broeder bij de hielen; en in zijn kracht gedroeg hij zich vorstelijk met God.","5":"Ja, hij gedroeg zich vorstelijk tegen de Engel, en kreeg de overhand op <em>Hem</em>; hij weende en smeekte Hem. <em>Te</em> Bethel vond hij Hem, en daar sprak Hij met ons;","6":"Namelijk, de Heere, de God van de heerscharen<sup class=\"noot\" data-noot=\"1\">1</sup>; Heere is Zijn gedenknaam.","7":"U dan, bekeer u tot uw God, bewaar goedertierenheid en recht, en wacht voortdurend op uw God.","8":"In de hand van de koopman is een bedrieglijke weegschaal, hij houdt ervan te verdrukken;","9":"Nog zegt Efraïm: Toch ben ik rijk geworden, ik heb voor mij groot goed verkregen; <em>in</em> al mijn arbeid zullen zij mij geen ongerechtigheid vinden, die zonde zou zijn.","10":"Maar Ik ben de Heere, uw God, van Egypteland af; Ik zal u nog in tenten laten wonen, als in de dagen van het feest.","11":"En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.","12":"Zeker is Gilead ongerechtigheid, zij zijn enkel ijdelheid; te Gilgal offeren zij ossen, ja, hun altaren zijn als <em>steen</em>hopen op de voren van de velden.","13":"Jakob vluchtte toch <em>naar</em> het veld van Syrië, en Israël diende om een vrouw, en hoedde de kudde om een vrouw.","14":"Maar de Heere voerde Israël op uit Egypte door een profeet, en door een profeet werd hij behoed.","15":"Efraïm <em>daarentegen</em> heeft <em>Hem</em> zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">compasseth</span> me about with <span class=\"wl wl-kjv\" data-code=\"H3585\">lies,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with <span class=\"wl wl-kjv\" data-code=\"H4820\">deceit:</span> but <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> yet <span class=\"wl wl-kjv\" data-code=\"H7300\">ruleth</span> with <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> and is <span class=\"wl wl-kjv\" data-code=\"H539\">faithful</span> with the saints.","2":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">feedeth</span> on <span class=\"wl wl-kjv\" data-code=\"H7307\">wind,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">followeth</span> after the east <span class=\"wl wl-kjv\" data-code=\"H6921\">wind:</span> he <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">increaseth</span> <span class=\"wl wl-kjv\" data-code=\"H3577\">lies</span> and <span class=\"wl wl-kjv\" data-code=\"H7701\">desolation;</span> and they do <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrians,</span> and <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> is <span class=\"wl wl-kjv\" data-code=\"H2986\">carried</span> into Egypt.","3":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath also a <span class=\"wl wl-kjv\" data-code=\"H7379\">controversy</span> with <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> according to his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways;</span> according to his <span class=\"wl wl-kjv\" data-code=\"H4611\">doings</span> will he recompense","4":"He took his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> by the <span class=\"wl wl-kjv\" data-code=\"H6117\">heel</span> in the <span class=\"wl wl-kjv\" data-code=\"H990\">womb,</span> and by his <span class=\"wl wl-kjv\" data-code=\"H202\">strength</span> he had <span class=\"wl wl-kjv\" data-code=\"H8280\">power</span> with God:","5":"Yea, he had <span class=\"wl wl-kjv\" data-code=\"H7786\">power</span> over the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel,</span> and <span class=\"wl wl-kjv\" data-code=\"H3201\">prevailed:</span> he <span class=\"wl wl-kjv\" data-code=\"H1058\">wept,</span> and made <span class=\"wl wl-kjv\" data-code=\"H2603\">supplication</span> unto him: he <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> him in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> and there he spake","6":"Even the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is his memorial.","7":"Therefore <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> thou to thy <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> and <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> and <span class=\"wl wl-kjv\" data-code=\"H6960\">wait</span> on thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> continually.","8":"He is a <span class=\"wl wl-kjv\" data-code=\"H3667\">merchant,</span> the <span class=\"wl wl-kjv\" data-code=\"H3976\">balances</span> of <span class=\"wl wl-kjv\" data-code=\"H4820\">deceit</span> are in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> he <span class=\"wl wl-kjv\" data-code=\"H157\">loveth</span> to oppress.","9":"And <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Yet I am become <span class=\"wl wl-kjv\" data-code=\"H6238\">rich,</span> I have found me <span class=\"wl wl-kjv\" data-code=\"H4672\">out</span> <span class=\"wl wl-kjv\" data-code=\"H202\">substance:</span> in all my <span class=\"wl wl-kjv\" data-code=\"H3018\">labours</span> they shall <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> none <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> in me that were sin.","10":"And I that am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> will yet make thee to <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacles,</span> as in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the solemn feast.","11":"I have also <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> by the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> and I have <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> <span class=\"wl wl-kjv\" data-code=\"H2377\">visions,</span> and used <span class=\"wl wl-kjv\" data-code=\"H1819\">similitudes,</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">ministry</span> of the prophets.","12":"Is there <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity</span> in <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead?</span> surely they are <span class=\"wl wl-kjv\" data-code=\"H7723\">vanity:</span> they <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> <span class=\"wl wl-kjv\" data-code=\"H7794\">bullocks</span> in <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal;</span> yea, their <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> are as <span class=\"wl wl-kjv\" data-code=\"H1530\">heaps</span> in the <span class=\"wl wl-kjv\" data-code=\"H8525\">furrows</span> of the fields.","13":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">country</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> for a <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and for a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> he kept","14":"And by a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and by a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> was he preserved.","15":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> provoked him to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger</span> most <span class=\"wl wl-kjv\" data-code=\"H8563\">bitterly:</span> therefore shall he <span class=\"wl wl-kjv\" data-code=\"H5203\">leave</span> his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon him, and his <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> shall his <span class=\"wl wl-kjv\" data-code=\"H113\">Lord</span> return"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"van Efraïm","tekst":"Hebreeuws, Efraïm hebben mij, enz., dat is, die van Efraïm, de Efraïmieten, waardoor de tien stammen, of Israïl, [gelijk volgt] verstaan worden."},{"catchword":"Mij omsingeld met leugen,","tekst":"Het zijn zo stoute huichelaars geweest, dat zij mij al hunne afgoderij als met geweld hebben willen overdringen, alsof zij die tot mijn eer en dienst pleegden, en de ware religie hadden. Sommigen houden dit voor ene klacht van den profeet over zijn wedervaren bij zijn boze landslieden; gelijk Gods woorden en die van de profeten somtijds onder elkander vermengd worden."},{"catchword":"Juda heerste nog","tekst":"Sommigen verstaan dat hier gesproken wordt van dien tijd, als de tien stammen zich eerst van Juda afzonderden, en een geruimen tijd daarna. Anders: Maar Juda is nog heersende, enz. Hoewel Juda ook zeer vervallen was, en daarover van God door dezen profeet in verscheidene plaatsen scherpelijk bestraft wordt, zo hadden zij nochtans, boven het wettelijk koninkrijk, ook het wettelijk priesterdom, en den uiterlijken godsdienst, die van God was verordineerd, zulks dat de vromen onder de tien stammen somtijds heimelijk naar Jeruzalem reisden, om den waren godsdienst te oefenen, gelijk boven in verscheidene plaatsen is aangemerkt. Maar bij de tien stammen was niets van dit alles; zie 2Ch 12:12 , en 2Ch 13:6 , enz., en 2Ch 15:3 , met de aantekening."},{"catchword":"met God,","tekst":"Zich Gode onderwerpende, en aan Hem en zijn dienst vasthoudende, dat waarlijk heersen en regeren is, gelijk het tegendeel, wat de wereld meent vrijheid en heerschappij te zijn, de snoodste slavernij is. Vergelijk de manier van spreken met boven Hos 9:8 , en de aantekening. Anderszins kan men deze woorden [ten aanzien van het koninkrijk] ook vergelijken met boven Hos 8:4 , [zie aldaar] en onder Hos 13:10-11 ."},{"catchword":"heiligen getrouw","tekst":"Dat is, volgende de voetstappen der heilige voorvaders, en horende naar de vrome profeten en priesters, die onder hen waren. Sommigen verstaan hier de drie personen der heilige Drievuldigheid, uit vergelijking van de voorgaande woorden, en Jos 24:19 ."}],"2":[{"catchword":"wind,","tekst":"Dat is, verlaat zich op ijdelheid, te weten afgoderij en heidense verbonden, waarmede zij zullen varen gelijk iemand, die van den wind meent te leven. Vergelijk Jer 22:22 ; Mic 2:11 , en boven Hos 8:7 ; idem Isa 44:20 , met de aantekening."},{"catchword":"oostenwind na;","tekst":"Dat is, hetgeen hem hard en schadelijk zal zijn, gelijk de oostenwind in die landen was. Zie Exo 10:13 ; Job 27:21 , en onder Hos 13:15 ."},{"catchword":"leugen","tekst":"Valse religie, huichelarij, liegen en bedriegen, tegen God en den naaste."},{"catchword":"verwoesting;","tekst":"Dat is, hetgeen zijne verwoesting zal veroorzaken; of hij pleegt dagelijks verwoesting en verderf van zijnen naaste; of hij heeft zulks gedaan zolang zijn koninkrijk geduurd heeft."},{"catchword":"Assur,","tekst":"Dat is, de Assyriërs, den koning van Assyrië. Zie boven Hos 5:13 , en Hos 7:11 , en onder Hos 14:4 ."},{"catchword":"olie wordt naar Egypte gevoerd","tekst":"Dat is, die kostelijke balsem, die men in die landen bereidde, wordt tot den koning van Egypte gevoerd, tot een geschenk om zijne gunst te verkrijgen. Vergelijk 2Ki 17:4 ; Isa 57:9 , en zie van zulke olie Psa 133:2 , enz."}],"3":[{"catchword":"twist met Juda,","tekst":"Of, pleit, proces, rechtzaak, vanwege hunne zonden. Vergelijk boven Hos 4:1 ."},{"catchword":"en Hij zal","tekst":"Hebreeuws, en om bezoeking te doen; dat is, Hij is gereed, daartoe gesteld om, enz. Vergelijk de manier van spreken met boven Hos 9:13 . Of, en om te bezoeken; dat is, en dat, opdat Hij bezoeke, enz., gelijk elders. Anders: maar over Jakob; [dat is, de tien stammen] zal Hij, enz., verstaande dat God met Juda nog twist, en hun een tijdlang nog zal waarschuwen, maar de tien stammen niet langer wil verschonen noch overzien; alzo het duister is, of Jakob het volk van Juda, of de tien stammen, of beide betekent, waarvan verscheiden gevoelen is. Vergelijk boven Hos 10:11 , enz., in alle gevalle worden Jakobs verbasterde nakomelingen hier zwaarlijk gedreigd."},{"catchword":"bezoeking doen over Jakob","tekst":"Door straffen. Zie Gen 21:1 ."}],"4":[{"catchword":"moeders buik","tekst":"Van de invoeging van dit woord, zie Jdg 13:5 ; Job 3:10 , en boven Hos 9:11 ."},{"catchword":"hij zijn","tekst":"De patriarch Jakob, hunlieder voorvader, van wien hier enige wonderlijke geschiedenissen en bijzondere weldaden Gods, aan hem en door hem aan hen allen bewezen, verhaald worden, om deze zijn lafaardige kinderen vanwege hunne ondankbaarheid te beschamen."},{"catchword":"broeder","tekst":"Ezau."},{"catchword":"verzenen;","tekst":"Tot een teken dat God Jakob het recht der eerstgeboorte door loutere genade toegelegd had, dat hij door het recht der natuur niet kon hebben."},{"catchword":"zijn kracht","tekst":"Die hem God gegeven had om dezen kamp uit te staan."},{"catchword":"gedroeg hij zich vorstelijk met God","tekst":"In zijne worsteling met den Zoon Gods. Zie de historie, Gen 32:24 , enz. en de aantekening."}],"5":[{"catchword":"Engel,","tekst":"Den Zoon Gods, die in vs.4"},{"catchword":"overmocht Hem;","tekst":"Hij overmocht, of had de overhand in den kamp met dezen engel, te weten Gods Zoon, die zich van Jakob liet overwinnen, niet door enige onvermogendheid, of gebrek van krachten, maar om een zeer lieflijke en troostelijke verborgenheid daardoor te beduiden, van den strijd en overwinning der kinderen Gods."},{"catchword":"hij weende en smeekte Hem","tekst":"Namelijk Jakob, weende en bad ernstiglijk om een zegen, vernemende dat hij met God te doen had. Dit wenen wordt wel in Mozes' historie niet vermeld, maar hier, tot verklaring van den Geest des Heeren bijgevoegd."},{"catchword":"Hem,","tekst":"De Zoon Gods vond Jakob daar, en verscheen hem. Zie Gen 35:9 , enz., en zo in het volgende: sprak Hij, te weten dezelfde Zoon Gods."},{"catchword":"ons;","tekst":"Die wij in de lenden van Jakob en onzer voorouders waren; zulks dat het ons mede aangaat, wat God aldaar gesproken en te dien tijde bij onze voorvaders gedaan heeft. Zie Psa 66:6 ."}],"6":[{"catchword":"Namelijk,","tekst":"Omdat de Zoon Gods in het voorgaande onder den naam van den engel, en voorts door het woord hem, enz., is gemeend, zo wordt dit tot verklaring zijner goddelijke majesteit hier bijgevoegd; dat nu de Hebreeuwse letter Vau dikwijls alzo voor namelijk, te weten, gebruikt wordt, is bekend, en hier, op het voorgaande [gelijk de rechtzinnige godvruchtige lezer zal kunnen oordelen] wel passende."},{"catchword":"heirscharen;","tekst":"Zie 1Ki 18:15 , en vergelijk Gen 22:11 , en Gen 48:16 ; Psa 24:10 ; Isa 6:1-5 , en Isa 9:6 , en Isa 25:6 , enz."},{"catchword":"gedenknaam","tekst":"Of, gedenkteken. Hebreeuws, gedachtenis; dat is, JHWH is de naam, met welken [als betekenende het eeuwig, zelfstandig, onveranderlijk, enz. wezen Gods] Hij onder zijn volk bekend, en zijner, mitsgaders zijne eigenschappen, gedacht wordt. Zie Gen 2:4 , en vergelijk Exo 3:14-15 , met de aantekening. Sommigen duiden dit op Jakob aldus: De HEERE [was] zijn [namelijk Jakobs] gedenkteken."}],"7":[{"catchword":"Gij dan,","tekst":"Dit is, Efraïm."},{"catchword":"tot","tekst":"Hier is in het Hebreeuws de letter Beth, voor de letter Lamed, of de woorden el of gnad, dat is, tot; gelijk in de manier van spreken, 1Ki 2:33 :Hun bloed zal wederkeren op heth hoofd van Joab, en op het hoofd van zijn zaad. Alwaar de letter Beth tweemaal gevoegd bij het woord wederkeren hetzelfde betekent, dat het voorgaande woordje gnal, dat is, op, of tot, gelijk ook anderszins het woordje in, zelfs ook in onze en andere talen genomen wordt voor tot, naar toe, als het gevoegd wordt bij woorden, die betekenen zich ergens heen begeven, gaan, reizen, wenden, keren;; als, gaan in zee, in het veld, in de woestijn, in ene stad, landschap, enz.; dat is, tot, derwaarts, enz. Zulks dat het onnodig schijnt, met sommigen, vermits de letter Beth, hier over te zetten, bekeert u met, of door uwen God; dat is, met of door de genade of hulp van uwen God; waarvan de verstandige lezer kan oordelen, en vergelijk de aantekening Joe 2:12 ."},{"catchword":"uw God,","tekst":"Die uwen voorvader, en, door hem, u van den eersten aan zo grote genade bewezen heeft, gelijk voorzegd."},{"catchword":"wacht geduriglijk op uw God","tekst":"Verlatende al uwe afgoden en ijdel vleselijk vertrouwen, zo zult gij God zijne eer geven,, en van Hem niet verlaten worden."}],"8":[{"catchword":"In des","tekst":"In plaats van recht en weldadigheid [wil de Heere zeggen] gaan onrecht en bedriegerij in zwang."},{"catchword":"koopmans hand","tekst":"Zie deze betekenis van het Hebreeuwse woord Kanaän, of Kenaän, Job 40:25 . Hebreeuws, de koopman, in zijne hand is, enz. Anders: [hij is] een Kanaäniet! Alsof de profeet zeide: Die bastaard, hij gedraagt zich niet als een kind van Jakob, maar hij aardt, of slacht en gelijkt meer een heiden en Chams gebroedsel."},{"catchword":"bedriegelijke weegschaal,","tekst":"Hebreeuws, weegschalen des bedrogs; zie Lev 19:13 , Lev 19:35 ; Deu 25:13 ; 1Th 4:6 ."},{"catchword":"verdrukken;","tekst":"Zo door arglistige en onrechtvaardige handelingen in zijn handel, alsook door moedwillige roverij en geweld."}],"9":[{"catchword":"Evenwel ben ik rijk geworden,","tekst":"Alsof zij zeiden: De profeten mogen zeggen wat zij willen, wij varen nochtans wel; daarom moet ons doen Gode zo niet mishagen als zij ons willen wijsmaken. Dit was ene soort van die onbeschaamde huichelarij, waarmede zij God en zijne profeten omsingelden [boven vs.1] en tergden, misbruikende alzo schandelijk de grote lankmoedigheid des Heeren. Vergelijk Amo 6:13 ."},{"catchword":"verkregen;","tekst":"Hebreeuws, gevonden, gelijk Gen 26:12 ; Ezr 7:16 ; Pro 8:9 , enz."},{"catchword":"arbeid","tekst":"Waarmede ik mij bemoeid heb om rijk te worden, of in mijn rijkdom, dien ik met mijn arbeid verkregen heb. Anders: al mijn arbeid is mij niet genoeg, [gelijk het Hebreeuwse woord vinden, gevonden worden, somtijds gebruikt wordt; zie Num 11:22 ] , wij begeren nog al meer te hebben, wij moeten zo nog al voortgaan, [hij heeft] ongerechtigheid [dat is, straf van ongerechtigheid zal dien overkomen] die zonde [heeft], wij worden niet gestraft [zouden wij willen zeggen] daarom is bij ons gene zonde."},{"catchword":"zonde zij","tekst":"Alsof zij zeiden: Het blijkt uit onzen voorspoed, dat wij zo grotelijks niet zondigen in onze middelen, die wij gebruiken om rijk te worden, wat mogen dan deze onrustige mensen [de profeten] dus roepen en tieren over onzen handel?"}],"10":[{"catchword":"Maar Ik ben de HEERE, uw God,","tekst":"Om de gelovigen en uitverkorenen door de scherpe strafpredikatiën niet mismoedig te maken, zo voegt God [naar zijne wijze] deze vertroostingen hierbij, om den zijnen te verzekeren dat Hij, niettegenstaande dit alles, zijn genadeverbond in den Messias met zijn uitverkoren Israël getrouwelijk zal onderhouden. Doch anderen nemen vs.11,12 als een verhaal van Gods weldadigheid in verleden tijden, en nu nog aan zijn volk bewezen, om hen te overtuigen dat Hij de enige auteur van al hun welstand is, en dat zij zich geenszins op hun vermogen hebben te beroemen, gelijk zij nochtans zo trotselijk deden, gelijk in het voorgaande gezegd is."},{"catchword":"van Egypteland af;","tekst":"Dat is, van dien tijd af dat Ik u uit Egypte door Mozes uitgevoerd, mijn verbond met u gemaakt en u mijne wetten gegeven heb, dat God elders hunne jeugd noemt. Zie Jer 2:2 , enz. boven Hos 2:14 ."},{"catchword":"Ik zal u nog in tenten doen wonen,","tekst":"Deze beloften, ziende op den genadetijd van het Nieuwe Testament, zijn voorgesteld met manieren van spreken, genomen van den staat van het Oude Testament. Vergelijk boven Hos 2:13 , Hos 2:17 ; Hos 11:11 , met de aantekening."},{"catchword":"samenkomst;","tekst":"Gelijk Ik u in de woestijn lieflijk in uwe tenten deed legeren rondom de tent der samenkomst, waar gij bijeenkwaamt om mijnen wil te verstaan en mij te dienen, alzo zal Ik u ook nog bij den tijd van het Nieuwe Testament in mijne kerk doen legeren bij de predikatie van mijn Evangelie, waar gij zult samenkomen tot mijn dienst. Anders: als in de dagen van den gezetten hoogtijd; te weten het loofhuttenfeest, wanneer gij u voor een tijd ophieldt in hutten, om uwe wandeling in de woestijn te betrachten en over mijne weldaden vrolijk te zijn. Of, men kan verstaan in het algemeen van alle hoogtijden, in welke zij, vanwege de grote menigte van volk, ook tenten moesten opslaan buiten de stad."}],"11":[{"catchword":"tot de profeten","tekst":"Of, door de profeten; dat is, Ik zal mij opnieuw zeer heerlijk openbaren door de overvloedige predikatie van het Evangelie, die u geschieden zal door den profeet aller profeten, den Messias, zijne apostelen en andere leraars van het Nieuwe Testament, met uitzending der gaven van mijnen Geest. Vergelijk Joe 2:28-29 ; Act 2:16-18 , enz."},{"catchword":"dienst der profeten","tekst":"Hebreeuws, hand."},{"catchword":"gelijkenissen voorstellen","tekst":"Gemeenzaam en klaarlijk leren. Vergelijk Mat 13:34-35 , enz."}],"12":[{"catchword":"Gilead","tekst":"Zie boven Hos 6:8 met de aantekening. Hier keert de profeet weder tot de voorgaande strafpredikatie. Men kan deze woorden ook aldus nemen: Is Gilead ongerechtigheid? alsof zij den profeet voorwierpen: zoudt gij dat durven zeggen? waarop dan de profeet in het volgende antwoordde."},{"catchword":"ongerechtigheid,","tekst":"Dat is, niet dan ongerechtigheid, enkel ongerechtigheid, vol van wrevel en boosheid. Anders: afgoderij, dewijl het Hebreeuwse woord somtijds voor een afgod, afgoderij, afgodendienst, genomen wordt. Zie 1Sa 15:23 ; Isa 66:3 ."},{"catchword":"enkel ijdelheid;","tekst":"Hebreeuws, alleenlijk; dat is, zij zijn niet dan tot alle afgoderij genegen; of gewisselijk zij zijn ijdelheid."},{"catchword":"Gilgal offeren zij ossen,","tekst":"Zie boven Hos 4:15 ."},{"catchword":"steen -hopen","tekst":"Dat is, van hun afgodische altaren is het land overal vol."}],"13":[{"catchword":"Jakob","tekst":"Hier wordt hun wederom voor ogen gesteld de sobere en kommerlijke toestand van hun voorvader Jakob, om te tonen wat van hen allen zou geworden zijn, indien niet God zulks alles door zijn bijzondere genade ten beste gewend, en bij hen gedaan had gelijk volgt. Vergelijk Deu 26:5 , enz. met de aantekening aldaar."},{"catchword":"vlood toch naar het veld van Syrië,","tekst":"Voor zijn broeders Ezau; zie Gen 27:42-43 , en Gen 28:5 , enz. Dit schijnt de eenvoudigste overzetting en zin dezer woorden te zijn. Veld, dat is land, gelijk Oba 1:19 ."},{"catchword":"diende om een vrouw,","tekst":"Jakob diende Laban om Lea en Rachel."}],"14":[{"catchword":"Israël op uit Egypte","tekst":"Het volk van Israël, Israëls of Jakobs nakomelingen."},{"catchword":"profeet, en door een","tekst":"Den groten profeet Mozes."},{"catchword":"profeet werd hij gehoed","tekst":"God hoedde hen en bewaarde hen door Mozes, als een herder zijne schapen. Dit wordt gesteld tegen Jakobs hoeden der schapen, waarvan in vs.13."}],"15":[{"catchword":"zeer bitterlijk vertoornd;","tekst":"Hebreeuws, [met] bitterheden. Anders [met] hoogten, of spitse, hoge, afgodische pilaren, of pilaarbeelden. Zie van het Hebreeuwse woord Tamrurim, Jer 31:21 ."},{"catchword":"bloed op hem","tekst":"Hebreeuws, bloeden; dat is, doodslagen en moorderijen der onschuldigen en derzelver straffen. Zie Gen 4:10 , en Gen 37:26, en Jdg 9:24 , of, bloed op hem laten; dat is, hen in hunne onreinheid en zonden laten, zonder hen daarvan te zuiveren. Vergelijk Eze 16:6 , Eze 16:9 ; Joe 3:21 ."},{"catchword":"laten,","tekst":"Of, over hem uitspreiden."},{"catchword":"zijn Heere","tekst":"God, dien hij niet gekend, gevreesd en gediend heeft. Zie Mal 1:6 ."},{"catchword":"smaad vergelden","tekst":"Die hij Hem, zijne profeten en allen vromen heeft aangedaan."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"(12:1) They of Ephraim have [ Heb. Ephraim have, i.e.they, or these of Ephraim, whereby are understood the ten Tribes, or Israel, with the deceit;[They were such insolent hypocrites, that they meant to force all their idolatry upon me, as they used the same for my honour and service, and had still the true. Religion among them. Some take it as the prophet complaint of the bad entertainment he found among the wicked Countriemen; according asa God, and the Prophets words, are sometimes intermingled] but Juda reigned yet with God.[ subjecting himself unto God, and keeping close to him and his worship , which is truly to reign and govern, as the contrary , which the world accounteth freedom and dominion, is the best slavery. Compare the phrase, with the above chap. 9.8. and the annot. Otherwise these worlds may also (in respect of the kingdom) be compared with ab. Ch.8.4. (see there) and bel. Ch.13.10,11.]and was faithful with the holy ones.[i.e. following the foot steps of the holy father , and hearkening to the pious and prophets, that were among them. Some do understand here the three persons o the Holy Trinity, comparing it with the words foregoing and Jol.24.19. and some are of opinion that the prophet here discribeth the time when the ten tribes first separated themselves from Juda, and some while after. Otherwise, but Juda is yet reigning etc. Though Juda was also much declined, and is sharply therefore rebuke of God by this very prophet in several places; yet priesthood and the outward worship ordained by God ; insomuch that the pious remnant among the ten Tribes, now and then, privily journeyed to Jerusalem, to attend the true worship there, as above in sundry places hath been observed. But among the ten Tribes, there was nothing of all this. See 2 Chron 12.12. and chap.13.6.etc. and chap 15.3. with the annotat.]"}],"2":[{"catchword":null,"tekst":"(2) Ephraim feeds himself with winde, [i.e. relies on vanity, viz. their idolatry and heathenish leagues wherewith they are like to fare, as they think to live on the winde. Compare Jer 22.22. Mich 2.11 and ab. Chap 8.7. as alsoIsa 44.20. with the annotat ] and buneth after the East winde; [i.e. after that which shall be grievous and hurtful to them, as the east winde was in those parts; see Exod 10. on vers 13 and Job 27. on verse 2. an bel. chap. 13.15.] all day long he multiplieth lies, [i.e. false worship, hypocrisy, lies, abd deceit against God and his neighbour] and desolation, [i.e. after that which was in those parts; See Exod 10. on verse 13. and Job 27. on verse2. and bel chap. 13.15.] all the day long he multiplieth lies, [i.e. false worship, hypocrisie, lies and deceit against God and his neighbor] and desolation, [i.e. that which shall cause and hale on his own destruction; or he daily practiseth destruction and desolation of his neighbor; or he did it, during all his reign] and they make (a) covenant with assur, [i.e. the Assyrians, or king of Assyria. See ab. Chap.5.13. and 7.11. and bel. 14.4.] and the oil is carried to Egypt for a present to procure his favour. Compare 2 Kings 17.4. Isa 57.9. and see of such oil, Psal 133. on vers 2, etc.]"}],"3":[{"catchword":null,"tekst":"(3) Also the LORD hath a controversie with Juda, [Or a plea, process, difference, viz. reason of their sins Compare above, chap 4. on verse1] and he shall make visitation on Jacob according to his ways: [Heb. And for to make visitation etc.i.e. He is ready prepared for it Compare the phrase with abive, chap. 9. on verse 13. or for to visit i.e and that to the end that he may visit Oth but over Jacob, .e the ten Tribes, shall be etc. understanding that God was pleading yet with Juda, and would continue warning them yet awhile, but as for the ten Tribes, them he would spare nor wink at no longer it being somewhat obscure, whether Jacob here do signifie Juda, or both together; whereof the opinions vary. Compare ab. Chap.10.11. etc. this is sure and plain, that the danger posterity of Jacob is sorely threatened here] he shall recompense him according to his dealing."}],"4":[{"catchword":null,"tekst":"(4) In ( the mothers) womb [ Of the infertion of the word mother. See Jud.13. on vers.5 and Job.3. on verse 10. and ab. Chap.9. v.11.] he [ viz. the the Patriarch Jacob their forefather, of whom some extraordinary passages and singular mercies of God shewed to him and to them all by him, are related here, thereby to shame and confound his dagenerate off - spring for their ingratitude] held his brother [Hsau] by the heels : [ in token that God through meer grace, had bestowed the right of primogeniture upon Jacob, forasmuch as by the right of he was incapable of it] and in his vigour, [which God enabled him with all to hold out] he carried himself princely with God. Understand in what wresting combate which he held with the Son of God, see the history Gen 32:24. etc. and the annot there.]"}],"5":[{"catchword":null,"tekst":"(5) Yea, he carried himself princely against the angel [i.e. the son of God, called God in in the former verse, and in the sequel, the LORD, the God of best, see Gen 48. on verse 16.] and overpowered (him) [i.e. had that better in the combate with the angels, to wit the son of God suffered himself to be overcome by Jacob, not out of any weakness or insufficiency, but to hold forth thereby a most sweet and comfortable mystery, of the combate and overcoming of all the children of God] he wept.[ Jacob wept and prayed earnestly for blessing, when he perceived with whom he had to do there, viz. with God himself. Of this weeping we finde nothing recorded in Mosehs history, but here the Holy Ghost inserted it, by way o explanation] and besought him: (at) Beth &acirc;&euro;&ldquo; El he found him, [the son of God found Jacob there and appeared unto him, See Gen 3 5 .9, etc. and so in the sequel, he spoke, to wit, the same son of God] and there he spake with us: [we being then yet in the loyns of Jacob and our forefathers; so that it concerns us also, what God spake there, and did the, in the behalf o (function bouwHfdnav() {

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
