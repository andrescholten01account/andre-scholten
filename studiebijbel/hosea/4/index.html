geworden zijn, zo hebben zij tegen Mij gezondigd; Ik zal hun eer in schande veranderen.","8":"Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid.","9":"Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.","10":"En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen *in* *aantal*; want zij hebben nagelaten de Heere in acht te nemen.","11":"Hoererij, en wijn, en jonge wijn neemt het hart weg.","12":"Mijn volk vraagt zijn hout om raad, en zijn stok zal het hem bekendmaken; want de geest van de hoererijen verleidt hen, zodat zij van onder hun God weghoereren.","13":"Op de toppen van de bergen offeren zij, en op de heuvels branden zij reukwerk, onder een eik, en populier, en iepenboom, omdat de schaduw daarvan goed is; daarom hoereren uw dochters, en uw bruiden plegen overspel.","14":"Ik zal over uw dochters geen straf² brengen, omdat zij hoereren, en over uw bruiden, omdat zij overspel plegen; want zij zelf zonderen zich af met de hoeren, en offeren met de snoodste hoeren; het volk dan, dat geen verstand heeft, zal ten onder gaan.","15":"Als u, Israël! wilt hoereren, laat Juda dan zeker niet schuldig worden; kom toch niet naar Gilgal, en ga niet op naar Beth-Aven, en zweer niet: *Zo* *waarachtig* *als* de Heere leeft.","16":"Want Israël is koppig, als een koppige koe; nu zal de Heere hen weiden, als een lam in de ruimte.","17":"Efraïm is met de afgoden verbonden; laat hem begaan.","18":"Hun drank is verzuurd; zij doen niets dan hoereren; hun leiders (het is een schande!) hebben *het* *woord* lief: Geef.","19":"Een wind heeft hen gebonden in zijn vleugels, en zij zullen beschaamd worden vanwege hun offers."},"SV":{"1":"Hoort des Heeren woord, gij kinderen Israëls! want de Heere heeft een twist met de inwoners des lands, omdat er geen trouw, en geen weldadigheid, en geen kennis van God in het land is;","2":"*Maar* vloeken en liegen, en doodslaan, en stelen, en overspel doen; zij breken door, en bloedschulden raken aan bloedschulden.","3":"Daarom zal het land treuren, en een iegelijk, die daarin woont, kwelen, met het gedierte des velds, en met het gevogelte des hemels; ja, ook de vissen der zee zullen weggeraapt worden.","4":"Doch niemand twiste noch bestraffe iemand; want uw volk is als die met den priester twisten.","5":"Daarom zult gij vallen bij dag, ja, zelfs de profeet zal met u vallen bij nacht; en Ik zal uw moeder uitroeien.","6":"Mijn volk is uitgeroeid, omdat het zonder kennis is; dewijl gij de kennis verworpen hebt, heb Ik u ook verworpen, dat gij Mij het priesterambt niet zult bedienen; dewijl gij de wet uws Gods vergeten hebt, zal Ik ook uw kinderen vergeten.","7":"Gelijk zij meerder geworden zijn, alzo hebben zij tegen Mij gezondigd; Ik zal hunlieder eer in schande veranderen.","8":"Zij eten de zonde Mijns volks, en verlangen, een ieder met zijn ziel, naar hun ongerechtigheid.","9":"Daarom, gelijk het volk, alzo zal de priester zijn; en Ik zal zijn wegen over hem bezoeken, en zijn handelingen hem vergelden.","10":"En zij zullen eten, maar niet zat worden, zullen hoereren, maar niet uitbreken *in* *menigte*; want zij hebben nagelaten den Heere in acht te nemen.","11":"Hoererij, en wijn, en most neemt het hart weg.","12":"Mijn volk vraagt zijn hout, en zijn stok zal het hem bekend maken; want de geest der hoererijen verleidt hen, dat zij van onder hun God weghoereren.","13":"Op de hoogten der bergen offeren zij, en op de heuvelen roken zij, onder een eik, en populier, en iepeboom, omdat derzelver schaduw goed is; daarom hoereren uw dochteren, en uw bruiden bedrijven overspel.","14":"Ik zal over uw dochteren geen bezoeking doen, omdat zij hoereren, en over uw bruiden, omdat zij overspel doen; want zij zelven scheiden zich af met de hoeren, en offeren met de snoodste hoeren; het volk dan, *dat* geen verstand heeft, zal omgekeerd worden.","15":"Zo gij, o Israël! wilt hoereren, dat *immers* Juda niet schuldig worde; komt gij toch niet te Gilgal, en gaat niet op naar Beth-aven, en zweert niet: *Zo* *waarachtig* *als* de Heere leeft.","16":"Want Israël is onbandig, als een onbandige koe; nu zal hen de Heere weiden, als een lam in de ruimte.","17":"Efraïm is vergezeld met de afgoden; laat hem varen.","18":"Hunlieder zuiperij is afvallig; zij doen niet dan hoereren; hun schilden (het is een schande!) beminnen *het* *woord*: Geeft.","19":"Een wind heeft hen gebonden in zijn vleugelen, en zij zullen beschaamd worden vanwege hun offeranden."},"KJV":{"1":"Hear the word of the LORD, ye children of Israel: for the LORD hath a controversy with the inhabitants of the land, because *there is* no truth, nor mercy, nor knowledge of God in the land.","2":"By swearing, and lying, and killing, and stealing, and committing adultery, they break out, and blood toucheth blood.","3":"Therefore shall the land mourn, and every one that dwelleth therein shall languish, with the beasts of the field, and with the fowls of heaven; yea, the fishes of the sea also shall be taken away.","4":"Yet let no man strive, nor reprove another: for thy people *are* as they that strive with the priest.","5":"Therefore shalt thou fall in the day, and the prophet also shall fall with thee in the night, and I will destroy thy mother.","6":"My people are destroyed for lack of knowledge: because thou hast rejected knowledge, I will also reject thee, that thou shalt be no priest to me: seeing thou hast forgotten the law of thy God, I will also forget thy children.","7":"As they were increased, so they sinned against me: *therefore* will I change their glory into shame.","8":"They eat up the sin of my people, and they set their heart on their iniquity.","9":"And there shall be, like people, like priest: and I will punish them for their ways, and reward them their doings.","10":"For they shall eat, and not have enough: they shall commit whoredom, and shall not increase: because they have left off to take heed to the LORD.","11":"Whoredom and wine and new wine take away the heart.","12":"My people ask counsel at their stocks, and their staff declareth unto them: for the spirit of whoredoms hath caused *them* to err, and they have gone a whoring from under their God.","13":"They sacrifice upon the tops of the mountains, and burn incense upon the hills, under oaks and poplars and elms, because the shadow thereof *is* good: therefore your daughters shall commit whoredom, and your spouses shall commit adultery.","14":"I will not punish your daughters when they commit whoredom, nor your spouses when they commit adultery: for themselves are separated with whores, and they sacrifice with harlots: therefore the people *that* doth not understand shall fall.","15":"Though thou, Israel, play the harlot, *yet* let not Judah offend; and come not ye unto Gilgal, neither go ye up to Bethaven, nor swear, The LORD liveth.","16":"For Israel slideth back as a backsliding heifer: now the LORD will feed them as a lamb in a large place.","17":"Ephraim *is* joined to idols: let him alone.","18":"Their drink is sour: they have committed whoredom continually: her rulers *with* shame do love, Give","19":"The wind hath bound her up in her wings, and they shall be ashamed because of their sacrifices."}},"tsk":{"1":[{"kopje":"Hoor","refs":["1 Kon 22:19","Jes 1:10","Jes 28:14","Jes 34:1","Jes 66:5","Jer 2:4","Jer 7:2","Jer 9:20","Jer 19:3","Jer 34:4","Amos 7:16","Openb 2:11","Openb 2:29"]},{"kopje":"want","refs":["Hos 12:3","Jes 1:18","Jes 3:13","Jes 3:14","Jes 5:3","Jes 34:8","Jer 25:31","Micha 6:2"]},{"kopje":"geen trouw","refs":["Jes 59:13-15","Jer 6:13","Jer 7:3-6","Micha 7:2-5"]},{"kopje":"geen kennis","refs":["Jer 4:22","Jer 4:28","Jer 5:4","Joh 8:55","Rom 1:28","1 Kor 15:34"]}],"2":[{"kopje":"vloeken","refs":["Jes 24:5","Jes 48:1","Jes 59:2-8","Jes 59:12-15","Jer 5:1","Jer 5:2","Jer 5:7-9","Jer 5:26","Jer 5:27","Jer 6:7","Jer 7:6-10","Jer 9:2-8","Jer 23:10-14","Ezech 22:2-13","Ezech 22 c":"Holy Spirit","href":"../../nave/h/#t-holy-spirit","kinderen":[{"label":"Withdrawn From Incorrigible Sinners","href":"../../nave/h/?hl=Hos.4.18#i8925","refs":[{"disp":"Gen 6:3","href":"../../genesis/6/#v3","ref":"Gen 6:3","svLabel":null},{"disp":"Deut 32:30","href":"../../deuteronomium/32/#v30","ref":"Deut 32:30","svLabel":null},{"disp":"Ps 51:11","href":"../../psalmen/51/#v13","ref":"Ps 51:13","svLabel":"SV 13"},{"disp":"Spr 1:24-28","href":"../../spreuken/1/#v24","ref":"Spr 1:24-28","svLabel":null},{"disp":"Jer 7:29","href":"../../jeremia/7/#v29","ref":"Jer 7:29","svLabel":null},{"disp":"Hos 4:17","href":"../../hosea/4/#v17","ref":"Hos 4:17","svLabel":null},{"disp":"Hos 4:18","href":"../../hosea/4/#v18","ref":"Hos 4:18","svLabel":null},{"disp":"Hos 5:6","href":"../../hosea/5/#v6","ref":"Hos 5:6","svLabel":null},{"disp":"Hos 9:12","href":"../../hosea/9/#v12","ref":"Hos 9:12","svLabel":null},{"disp":"Matt 15:14","href":"../../mattheus/15/#v14","ref":"Matt 15:14","svLabel":null},{"disp":"Luk 13:7","href":"../../lukas/13/#v7","ref":"Luk 13:7","svLabel":null},{"disp":"Rom 1:24","href":"../../romeinen/1/#v24","ref":"Rom 1:24","svLabel":null},{"disp":"Rom 1:26","href":"../../romeinen/1/#v26","ref":"Rom 1:26","svLabel":null},{"disp":"Rom 1:28","href":"../../romeinen/1/#v28","ref":"Rom 1:28","svLabel":null}],"kinderen":[]}]}]},"19":{"nave":[{"topic":"Wind","href":"../../nave/w/#t-wind","kinderen":[{"label":"Figurative","href":"../../nave/w/?hl=Hos.4.19#i21973","refs":[{"disp":"Hos 4:19","href":"../../hosea/4/#v19","ref":"Hos 4:19","svLabel":null}],"kinderen":[]}]}]}},"noten":{"1":"SV: bezoeken. D.i.: vergelden, straffen.","2":"SV: bezoeking. D.i.: straf."},"koppeling":{"1":"Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is;","2":"<em>Maar</em> vloeken en liegen, en doodslaan, en stelen, en overspel plegen; zij breken door, en bloedschuld raakt aan bloedschuld.","3":"Daarom zal het land treuren, en ieder die daarin woont, kwijnen weg, met de dieren van het veld, en met de vogels van de hemel; ja, ook de vissen van de zee zullen weggeraapt worden.","4":"Toch moet niemand twisten of iemand bestraffen; want uw volk is als degenen die met de priester twisten.","5":"Daarom zult u vallen bij dag, ja, zelfs de profeet zal met u vallen bij nacht; en Ik zal uw moeder uitroeien.","6":"Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.","7":"Zoals zij meer geworden zijn, zo hebben zij tegen Mij gezondigd; Ik zal hun eer in schande veranderen.","8":"Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid.","9":"Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.","10":"En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen <em>in</em> <em>aantal</em>; want zij hebben nagelaten de Heere in acht te nemen.","11":"Hoererij, en wijn, en jonge wijn neemt het hart weg.","12":"Mijn volk vraagt zijn hout om raad, en zijn stok zal het hem bekendmaken; want de geest van de hoererijen verleidt hen, zodat zij van onder hun God weghoereren.","13":"Op de toppen van de bergen offeren zij, en op de heuvels branden zij reukwerk, onder een eik, en populier, en iepenboom, omdat de schaduw daarvan goed is; daarom hoereren uw dochters, en uw bruiden plegen overspel.","14":"Ik zal over uw dochters geen straf² brengen, omdat zij hoereren, en over uw bruiden, omdat zij overspel plegen; want zij zelf zonderen zich af met de hoeren, en offeren met de snoodste hoeren; het volk dan, dat geen verstand heeft, zal ten onder gaan.","15":"Als u, Israël! wilt hoereren, laat Juda dan zeker niet schuldig worden; kom toch niet naar Gilgal, en ga niet op naar Beth-Aven, en zweer niet: <em>Zo</em> <em>waarachtig</em> <em>als</em> de Heere leeft.","16":"Want Israël is koppig, als een koppige koe; nu zal de Heere hen weiden, als een lam in de ruimte.","17":"Efraïm is met de afgoden verbonden; laat hem begaan.","18":"Hun drank is verzuurd; zij doen niets dan hoereren; hun leiders (het is een schande!) hebben <em>het</em> <em>woord</em> lief: Geef.","19":"Een wind heeft hen gebonden in zijn vleugels, en zij zullen beschaamd worden vanwege hun offers."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> ye <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath a <span class=\"wl wl-kjv\" data-code=\"H7379\">controversy</span> with the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> because there is no <span class=\"wl wl-kjv\" data-code=\"H571\">truth,</span> nor <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in the land.","2":"By <span class=\"wl wl-kjv\" data-code=\"H422\">swearing,</span> and <span class=\"wl wl-kjv\" data-code=\"H3584\">lying,</span> and <span class=\"wl wl-kjv\" data-code=\"H7523\">killing,</span> and <span class=\"wl wl-kjv\" data-code=\"H1589\">stealing,</span> and committing <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery,</span> they break <span class=\"wl wl-kjv\" data-code=\"H6555\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> blood.","3":"Therefore shall the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H56\">mourn,</span> and every one that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth</span> therein shall <span class=\"wl wl-kjv\" data-code=\"H535\">languish,</span> with the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> yea, the <span class=\"wl wl-kjv\" data-code=\"H1709\">fishes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> also shall be taken away.","4":"Yet let no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7378\">strive,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3198\">reprove</span> <span class=\"wl wl-kjv\" data-code=\"H376\">another:</span> for thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are as they that <span class=\"wl wl-kjv\" data-code=\"H7378\">strive</span> with the priest.","5":"Therefore shalt thou <span class=\"wl wl-kjv\" data-code=\"H3782\">fall</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> also shall <span class=\"wl wl-kjv\" data-code=\"H3782\">fall</span> with thee in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H1820\">destroy</span> thy mother.","6":"My <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are <span class=\"wl wl-kjv\" data-code=\"H1820\">destroyed</span> for lack of <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge:</span> because thou hast <span class=\"wl wl-kjv\" data-code=\"H3988\">rejected</span> <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge,</span> I will also <span class=\"wl wl-kjv\" data-code=\"H3988\">reject</span> thee, that thou shalt be no <span class=\"wl wl-kjv\" data-code=\"H3547\">priest</span> to me: seeing thou hast <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> I will also <span class=\"wl wl-kjv\" data-code=\"H7911\">forget</span> thy children.","7":"As they were <span class=\"wl wl-kjv\" data-code=\"H7230\">increased,</span> so they <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against me: therefore will I <span class=\"wl wl-kjv\" data-code=\"H4171\">change</span> their <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> into shame.","8":"They eat <span class=\"wl wl-kjv\" data-code=\"H398\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5375\">set</span> their <span class=\"wl wl-kjv\" data-code=\"H5315\">heart</span> on their iniquity.","9":"And there shall be, like <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> like <span class=\"wl wl-kjv\" data-code=\"H3548\">priest:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> them for their <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">reward</span> them their doings.","10":"For they shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and not have <span class=\"wl wl-kjv\" data-code=\"H7646\">enough:</span> they shall commit <span class=\"wl wl-kjv\" data-code=\"H2181\">whoredom,</span> and shall not <span class=\"wl wl-kjv\" data-code=\"H6555\">increase:</span> because they have left <span class=\"wl wl-kjv\" data-code=\"H5800\">off</span> to take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to the LORD.","11":"<span class=\"wl wl-kjv\" data-code=\"H2184\">Whoredom</span> and <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> and new <span class=\"wl wl-kjv\" data-code=\"H8492\">wine</span> take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> the heart.","12":"My <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> counsel at their <span class=\"wl wl-kjv\" data-code=\"H6086\">stocks,</span> and their <span class=\"wl wl-kjv\" data-code=\"H4731\">staff</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">declareth</span> unto them: for the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H2183\">whoredoms</span> hath caused them to <span class=\"wl wl-kjv\" data-code=\"H8582\">err,</span> and they have gone a <span class=\"wl wl-kjv\" data-code=\"H2181\">whoring</span> from under their God.","13":"They <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">tops</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills,</span> under <span class=\"wl wl-kjv\" data-code=\"H437\">oaks</span> and <span class=\"wl wl-kjv\" data-code=\"H3839\">poplars</span> and <span class=\"wl wl-kjv\" data-code=\"H424\">elms,</span> because the <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> thereof is <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> therefore your <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> shall commit <span class=\"wl wl-kjv\" data-code=\"H2181\">whoredom,</span> and your <span class=\"wl wl-kjv\" data-code=\"H3618\">spouses</span> shall commit adultery.","14":"I will not <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> your <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> when they commit <span class=\"wl wl-kjv\" data-code=\"H2181\">whoredom,</span> nor your <span class=\"wl wl-kjv\" data-code=\"H3618\">spouses</span> when they commit <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery:</span> for themselves are <span class=\"wl wl-kjv\" data-code=\"H6504\">separated</span> with <span class=\"wl wl-kjv\" data-code=\"H2181\">whores,</span> and they <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> with <span class=\"wl wl-kjv\" data-code=\"H6948\">harlots:</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that doth not <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> shall fall.","15":"Though thou, <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> play the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot,</span> yet let not <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H816\">offend;</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> not ye unto <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal,</span> neither go ye <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H1007\">Bethaven,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7650\">swear,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> liveth.","16":"For <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> slideth <span class=\"wl wl-kjv\" data-code=\"H5637\">back</span> as a <span class=\"wl wl-kjv\" data-code=\"H5637\">backsliding</span> <span class=\"wl wl-kjv\" data-code=\"H6510\">heifer:</span> now the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> them as a <span class=\"wl wl-kjv\" data-code=\"H3532\">lamb</span> in a large place.","17":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> is <span class=\"wl wl-kjv\" data-code=\"H2266\">joined</span> to <span class=\"wl wl-kjv\" data-code=\"H6091\">idols:</span> let him alone.","18":"Their <span class=\"wl wl-kjv\" data-code=\"H5435\">drink</span> is <span class=\"wl wl-kjv\" data-code=\"H5493\">sour:</span> they have committed <span class=\"wl wl-kjv\" data-code=\"H2181\">whoredom</span> <span class=\"wl wl-kjv\" data-code=\"H2181\">continually:</span> her <span class=\"wl wl-kjv\" data-code=\"H4043\">rulers</span> with <span class=\"wl wl-kjv\" data-code=\"H7036\">shame</span> do <span class=\"wl wl-kjv\" data-code=\"H157\">love,</span> Give","19":"The <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> hath bound her <span class=\"wl wl-kjv\" data-code=\"H6887\">up</span> in her <span class=\"wl wl-kjv\" data-code=\"H3671\">wings,</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> because of their sacrifices."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"twist met de inwoners des lands,","tekst":"Of, pleit, proces, niet alleen van woorden, maar ook van daden, dat is straffen; gelijk blijkt vs.2,3, zie boven Hos 2:2 ; 1Sa 25:38-39 ; Amo 7:4 ."},{"catchword":"trouw, en geen weldadigheid,","tekst":"Of, waarheid. God wil zeggen dat zij gans niet deugen, noch in woorden noch in werken, en alzo genoeg bleek dat zij hem niet recht kenden."},{"catchword":"kennis van God in het land is;","tekst":"Versta, rechte, ware en zaligmakende kennis Gods, gericht naar zijn Woord, vergezelschapt met geloof en liefde Gods en des naasten; vergelijk Jer 9:24 , en Jer 22:16 , en Jer 31:34 ; 1Jo 2:4 , enz."}],"2":[{"catchword":"Maar","tekst":"Of, vloeken en liegen, enz. breken door; dat is, nemen de overhand, gelijk een watervloed doorbreekt, met geweld van veel water; idem, gelijk geweldenaars en vijanden door de bressen inbreken, alzo breken zij met allerlei gruwelen stoutelijk door, zonder schroom van Gods wetten en ordinantiën. Een ander gebruik van het Hebreeuwse woord zie onder vs.10."},{"catchword":"bloedschulden raken aan bloedschulden","tekst":"Hebreeuws, bloeden raken aan bloeden; dat is, de ene moord of doodslag volgt op den anderen. Zie boven Hos 1:4 ."}],"3":[{"catchword":"land treuren,","tekst":"Om den inwoners de gruwelijkheid hunner zonden en derzelver verdiensten voor ogen te stellen, moet het land, en al wat er in is, lijden; alzo dikwijls bij de profeten."},{"catchword":"kwelen,","tekst":"Of, kwijnen, flauw, of amechtig worden."},{"catchword":"weggeraapt worden","tekst":"Hebreeuws eigenlijk, verzameld, dat is, vergaan, sterven, samengeraapt en weggeworpen worden, als een stinkend aas; zie van het Hebreeuwse woord Psa 26:9 ."}],"4":[{"catchword":"niemand twiste noch bestraffe iemand;","tekst":"Alsof zij zeiden: Niemand is zo stout, dat hij zich tegen ons reppe en ons doen bestraffe. God verhaalt hier de eigen woorden, die onder het volk zouden omgaan, voorzeggende den profeet, wat hem en andere mannen Gods van de regenten, valse profeten en afgodische priesters en hun aanhang zou bejegenen, te weten dat zij hunne strafpredikatiën zouden verbieden, en dengenen, die hunne daden zouden willen bestraffen, hun vonnis zouden maken, en hen als onrustige mensen en oproermakers straffen."},{"catchword":"uw volk is","tekst":"O Hosea, waar gij mede te doen hebt."},{"catchword":"priester twisten","tekst":"De zonder enige achting en met opgeblazenheid dengenen lastig en hard vallen, die van Godswege en ambtshalve schuldig is hunne zonden te bestraffen, en wiens straf en onderwijs zij eerbiediglijk behoren op te nemen; vergelijk Deu 17:12 ."}],"5":[{"catchword":"gij vallen","tekst":"Een ieder afvallig en wederstrevig Israëliet zal aanstoten, sneuvelen, omkomen; vergelijk onder Hos 5:5 , en Hos 14:2 ."},{"catchword":"dag, ja,","tekst":"Door deze woorden, bij dag bij nacht, kan men verstaan de gedurig nakende ellenden, die de ene op de andere elkander zouden volgen, als dag en nacht, zonder ophouden en rust. Anders: heden dezen dag; dat is, binnen korten tijd, haast; vergelijk Pro 12:16 . Of, gij zult vallen terwijl het nog dag zal zijn; dat is, als gij zult menen in bloei te zijn en geen nood te hebben; vergelijk Jer 15:9 ; Amo 8:9 met de aantekening. En de valse profeten, die u verleiden, zullen vallen bij nacht, of in den nacht, dat is, zijnde in duisternis, onwetendheid, zonder gezicht en kennis van het verderf, dat u en henzelf zal treffen als zij het niet eens denken, belovende zichzelven en u vrede; vergelijk Mic 3:5-7 . Sommigen menen dat het daarop ziet, dat de profeten wel gewoon waren bij nacht gezichten te ontvangen van God, Gen 46:2 ; Zec 1:8 , en dat de valse profeten, zich daarop ijdellijk ook beroemende, gezegd zouden worden in den nacht te vallen."},{"catchword":"profeet zal met u vallen bij nacht;","tekst":"Versta, de valse verleidende profeten, die het volk door beloften van vrede in hunne boosheid stijfden."},{"catchword":"moeder uitroeien","tekst":"Het koninkrijk der tien stammen, het Israëlietische volk, of kerk, synagoge; gelijk boven Hos 2:1 ."}],"6":[{"catchword":"is uitgeroeid,","tekst":"Dat is, zal zekerlijk worden uitgeroeid. Hebreeuws, mijn volk zijn, of worden uitgeroeid."},{"catchword":"kennis is;","tekst":"Gelijk boven vs.1; vergelijk Isa 5:13 ."},{"catchword":"gij de kennis verworpen hebt,","tekst":"Aanspraak aan de afgodische priesters en andere kerkelijke personen, die Gods woord het volk behoren rein en zuiver te leren; zie Deu 33:10 ; Mal 2:7 ."},{"catchword":"vergeten","tekst":"Gelijk Gods gedenken ten goede zijn gunst en zegen betekent, alzo beduidt hier zijn vergeten zijne ongenade en verlating, dat Hij den mens ongezegend laat heengaan en aan allerlei ellende overgeeft."}],"7":[{"catchword":"Gelijk zij meerder geworden zijn,","tekst":"Of, naar hunne vermeerdering, of grootheid; dat is, hoe meer zij in getal, menigte, eer en grootheid gewassen en toegenomen zijn; zijnde een bijzonder koninkrijk geworden, en hebbende een nieuw bijzonder priesterdom opgericht, waarop de volgende woorden schijnen te zien, voornamelijk op het priesterdom, [waarvan in vs.8] hoe ondankbaarder zij tegen mij geworden zijn en hoe gruwelijker gezondigd hebben. Vergelijk de manier van spreken met onder Hos 11:2 ."},{"catchword":"eer in schande veranderen","tekst":"Koninklijke en priesterlijke."}],"8":[{"catchword":"Zij eten","tekst":"De priesters."},{"catchword":"zonde Mijns volks,","tekst":"Dat is, de zondoffers; zie Lev 4:3 . De zin is: Hun oogmerk is niet dat het volk van de offeranden, en voorts van zonden en der zonden verdiensten, idem van den Messias en de ware gerechtigheid mocht worden onderwezen en Gode behagelijk offeren, maar alleen dat zijzelf slechts genoeg mochten hebben om te eten, te teren en te smeren."},{"catchword":"verlangen,","tekst":"Hebreeuws, zij verheffen zijne ziel; dat is, een ieder van hen verheft zijne ziel; dat is, verlangt met grote begeerte daarnaar dat het volk veel moge zondigen, en vervolgens vele zondoffers aanbrengen, opdat hij zich daarvan moge mesten; hoe meer het volk zondigt, hoe liever het hun is, wil de profeet zeggen. Van de Hebreeuwse manier van spreken, zie Psa 24:4 ."}],"9":[{"catchword":"gelijk het volk,","tekst":"Dat is, dewijl de een niet beter is dan de ander, zo zal het den een ook gaan als den ander, zij zullen in eene straf worden ingewikkeld; zie Isa 24:2 ; Mat 15:14 ."},{"catchword":"priester zijn;","tekst":"Of, regent, of beiden tezamen, degenen die in kerk en staat de voornaamste zijn. Zie van het Hebreeuwse woord Gen 41:45 ."},{"catchword":"zijn wegen","tekst":"Des priesters wezen en doen straffen. Zie Gen 6:12 , en Gen 21:1 . Of, zijne; dat is, van een ieder van hen."}],"10":[{"catchword":"uitbreken in menigte;","tekst":"Dat is, niet vermenigvuldigd worden. Zie van het Hebreeuwse woord Gen 28:14 , en Gen 30:30 ; idem Job 1:10 , met de aantekening."},{"catchword":"nagelaten den HEERE in acht te nemen","tekst":"Mits verlatende en niet bewarende de wegen des Heeren en Hem niet voor ogen hebbende."}],"11":[{"catchword":"neemt het hart weg","tekst":"Hebreeuws, zal nemen; dat is, een ieder van deze, [te weten hoererij en dronkenschap] beneemt den mens het verstand en oordeel, en maakt hem dienvolgens zo dol en dwaas, dat hij doet gelijk volgt. Zie Isa 28:7 ; Rev 17:2 , en Pro 9:4 ."}],"12":[{"catchword":"hout,","tekst":"Dat is, houten afgod om raad en hoe het hem in het toekomende gaan zal, en die meent hij dat het hem zal kunnen voorzeggen."},{"catchword":"stok zal het hem bekend maken;","tekst":"Of, staf, dat is zijn afgod, waarop hij zich als op een staf verlaat. Sommigen verstaan hierdoor het hout waar de afgod Baäl van gemaakt is, [zie Deu 28:36 ] . Anderen menen dat het ziet op de manier van waarzeggen, door een stok of roede, idem, van degenen, die op vogelgeschrei acht gaven, dragende een stok in de hand."},{"catchword":"geest der hoererijen verleidt hen,","tekst":"Dat is, de duivel, die een onreine geest genoemd wordt, Zec 13:2 ; Mat 12:43 ; of hun verkeerde zin, hun verdorven genegenheid tot geestelijk en lichamelijk hoereren, waartoe hen de boze geest of duivel aandrijft; alzo onder Hos 5:4 . Vergelijk Rom 1:24 , Rom 1:28 , enz."},{"catchword":"van onder hun God weghoereren","tekst":"Of, van in plaats hun God; dat is, alzo, dat zij zich onder God, als hunnen Heere en echten man, niet willende buigen, of Hem niet onderworpen zijn, de afgoden in alle ongebondenheid nalopen, of, alzo dat zij, in plaats van hun God, vreemde goden kiezen en die aanhangen; vergelijk boven Hos 1:2 ; idem Eze 23:5 , met de aantekening. Deze manieren van spreken zijn aanmerkelijk, als uitdrukkende den aard en de eigenschap der afgoderij."}],"13":[{"catchword":"hoogten der bergen offeren zij,","tekst":"Naar de wijze der heidenen; zie Deu 12:2 , met de aantekening aldaar."},{"catchword":"iepeboom,","tekst":"Of, olmboom. Anders: lindeboom."},{"catchword":"goed is;","tekst":"Dat is fijn, aangenaam, verheugende; of ook, enige donkerheid veroorzakende, die hun ter afgoderij en onkuischheid dienstig was; vergelijk Isa 57:5 , Isa 57:7 ; Jer 3:6 ; Eze 6:13 ; gelijk dan de geestelijke hoererij de lichamelijke naar zich trekt, door een rechtvaardig oordeel Gods; zie Num 25:1-2 , enz.; Rom 1:24 , hierop ziet het volgende woord, daaRom."},{"catchword":"bruiden bedrijven overspel","tekst":"Of, schoondochters."}],"14":[{"catchword":"Ik zal over uw dochteren","tekst":"Dat is, Ik zal hen nu door straffen niet bedwingen, maar hen in deze gruwelen laten voortgaan, tot hunne en ulieder schande en verderf, gelijk sommigen dit nemen; een teken van Gods grootste ongenade. Zie Psa 89:32-34 , en Psa 94:12-13 . Of, Ik zal de jonge dochters en bruiden, of zoons jonge vrouwen, zozeer [vergelijk 1Sa 15:22 ; Jer 7:22 ; idem onder Hos 6:6 ] en zwaarlijk niet straffen, omdat de ouders en mannen met hun goddeloos voorbeeld de jonge dochters en vrouwen zulks leren. Anders: en zou Ik over uw jonge dochters, enz., en dat zij zichzelven afscheiden, enz. Alsof God zeide: Ik kan zulk volk niet ongestraft laten, dat zult gij zelf moeten bekennen, hetwelk met het besluit van vs.14 ook wel overeenkomt. Vergelijk Jer 5:9 , Jer 5:29 , en Jer 9:9 , enz."},{"catchword":"want zij zelven scheiden zich af","tekst":"De ouders en mannen scheiden zich bij troepen af en gaan, onder deksel van afgoderij, zich voegen bij de snoodste hoeren, om kwanswijs met die te offeren, ondertussen gruwelijke ontucht bedrijvende, waarom het hun te doen is."},{"catchword":"omgekeerd worden","tekst":"Of, verward, verstrikt, verbijsterd, gegeseld, gestraft, omgeworpen worden. Het Hebreeuwse woord wordt alleen hier en Pro 10:8 , Pro 10:10 gevonden, betekenende [gelijk uit de omstandigheid dezer drie plaatsen blijkt] een bijzondere soort van straffen, of in het algemeen, ondergang en verstoring."}],"15":[{"catchword":"Zo gij, o Israël","tekst":"Alsof God, verdrietig en walgend zijnde over Israël, [vergelijk onder vs.17] zeide: Wil dan Israël verloren gaan, en zich niet laten raden, ziet gij toch toe, o Juda, dat gij hun voorbeeld niet navolgt. Het is een beklag over Israëls hardnekkigheid, met een zeer bewegelijke vermaning aan Juda."},{"catchword":"Gilgal,","tekst":"Zie Jos 5:9 . Het schijnt dat hier gruwelijke afgoderij aangesteld en bedreven is, omdat deze plaats vermaard was van de eerste besnijdenis en het eerste pasen in Kanaän, waarom God over de schandelijke verontreiniging dezer plaats ten hoogste is vertoornd geweest. Zie onder Hos 9:15 , en Hos 12:12 ; Amo 4:4 en Amo 5:5 ."},{"catchword":"Beth-aven,","tekst":"Dat is, huis der nietigheid, ijdelheid, boosheid, ongerechtigheid, of des afgods. Daar was wel ene plaats nabij Bethel, genaamd Beth-Aven, Jos 18:12-13 , maar hier wordt, naar het algemeen gevoelen, verstaan de plaats, die eigenlijk Bethel genaamd was, dat is, Gods huis. Maar van God genoemd Beth-Aven, ten aanzien van het gouden kalf, dat Jerobeam daar had opgericht, en de afgoderij die aldaar bedreven werd; zie 1Ki 12:29 , en onder Hos 5:8 en Hos 10:5 . Deze plaats was ook tevoren zeer vermaard vanwege Gods bijzondere openbaring aan den patriarch Jakob, Gen 28:19 , en Gen 35:6-7 , enz. Beide deze plaatsen waren nabij Juda gelegen, zodat het niet zonder gevaar was van te vervallen in gemeenschap der afgoderij, waarvan de beginselen openbaar waren; waarom God Juda hier zeer ernstiglijk waarschuwt."},{"catchword":"niet","tekst":"[Zo waarachtig als] de HEERE leeft. Te weten huichelend, afgodisch, op zulke wijze, gelijk de afgodische Israëlieten doen, die mijn naam met hunne afgoden vermengen, om de afgoderij daarmede te bedekken en een schijn van ware godsdienstigheid te geven; hetwelk een gruwel was bij God, die alleen oprecht als God wil geëerd en gediend zijn, naar zijn voorschrift. Vergelijk boven Hos 2:15 met de aantekening, en aangaande het woord niet, vergelijk de aantekening op vs.16, en Zep 1:5 ."}],"16":[{"catchword":"onbandig, als een onbandige koe;","tekst":"Of, wederstrevig, gaande in het wild, niet willende geleid zijn op de rechte wegen en blijvende in goede weide, maar onbedwongen, ongebonden, zonder juk, perk, of bestuur, door dik en dun [gelijk men zegt] heenlopen, waarom hun de Heere zal doen als volgt."},{"catchword":"nu zal","tekst":"Dat is, in korten tijd, al haast. Zie onder Hos 10:3 ."},{"catchword":"hen de HEERE weiden,","tekst":"De Israëlieten."},{"catchword":"lam in de ruimte","tekst":"Gelijk een jong en dom lam, dat in de ruimte gaat, lichtelijk verbijstert, hier en daar in valt, of den wilden dieren in den mond loopt; alzo zal Ik dit volk, dat zo gaarne ongebonden en in het ruime heenloopt, in de ruimte voeren; dat is uit hun land en weide wegvoeren, en in al de vier winden verstrooien onder de heidenen. Sommigen nemen het alzo, dat God Israël eerst wilde als een lam vet weiden; dat is weelderig en rijk maken, en dan als uit de weide halen, om gevoerd te worden ter slachting."}],"17":[{"catchword":"Efraïm","tekst":"Dat is, de tien stammen, waarvan Efraïm de voornaamste was en het koninkrijk had; zie Psa 78:9 ; alzo onder Hos 5:3 , Hos 5:5 , Hos 5:9 , Hos 5:11 , Hos 5:13-14 , enz.; die hier ook door Israël verstaan worden."},{"catchword":"vergezeld","tekst":"Dat is, zo vastgekoppeld aan de afgoden, gelijk de ene metgezel aan den ander."},{"catchword":"afgoden;","tekst":"Zie van het Hebreeuwse woord 2Sa 5:21 ."},{"catchword":"laat hem varen","tekst":"Vergelijk boven vs.15, met de aantekening, en Mat 15:14 ."}],"18":[{"catchword":"zuiperij","tekst":"De dronkenschap, die zij bij hunne afgoderij en onkuischheid plegen."},{"catchword":"afvallig;","tekst":"Dat is, zij worden in hun zuipen en zwelgen niet dan te oproeriger en ongebondener in geestelijke en lichamelijke hoererij. Het een drijft en stijft hen in het ander. Anders: hun wijn, of dronkenschap, is afgaande, of stinkende; dat is, hun afgodische dronkengelagen zijn vol stank en onreinheid, waarin zij zich als beesten omwentelen. Vergelijk de manier van spreken met Pro 20:1 ."},{"catchword":"doen niet dan hoereren;","tekst":"Hebreeuws, hoererende hoereren zij."},{"catchword":"hun","tekst":"Dit hare staat in het vrouwelijk geslacht, ziende [zo het schijnt] op de onbandige koe, vs.16, of de overspelige vrouw, of hoer, uit Hos 3:1 , en Hos 1:2 , enz., alzo in vs.19. Men kan het ook bekwamelijk duiden op Efraïm of Israël zelf, naar den aard van de Hebreeuwse taal, en alzo ook vs.19."},{"catchword":"schilden","tekst":"Dat is, hunne schuts en beschermheren, hunne regenten, gelijk Psa 47:10 , zie de aantekening aldaar."},{"catchword":"(het is een schande)","tekst":"Het is een schandelijke zaak voor de regenten van Gods volk; met verfoeiing gesproken."},{"catchword":"het woord","tekst":"] Geeft. God wil zeggen dat de regenten dit woord geeft dagelijks gebruikten en in den mond hadden, onbeschaamdelijk de lieden vermanende [daar het schandelijk genoeg is, de aangebodene te ontvangen] tot het aanbrengen of geven van geschenken. Het is al, geeft, geeft, of brengt aan, te weten geschenken, gelijk sommigen, wijn om te zuipen. Vergelijk Mic 7:3 ; zie dergelijke woorden, inzake van onverzadelijkheid, Pro 30:15 . Of aldus: Hunlieder wijn wijkt af; zij bedrijven hoererij; geeft, hebben zij lief, hunne beschermers zijn een schande."}],"19":[{"catchword":"wind","tekst":"Versta door dezenwind de Assyriërs, die snellijk en onverhinderd, als een doorbrekende stormwind, de tien stammen gevankelijk uit hun land zouden wegvoeren; hetwelk eerst door Tiglai-Pilezer en daarna volkomenlijk geschied is door Salmanassar. Zie 2Ki 15:29 , en 2Ki 18:9-11 , enz., en vergelijk onder Hos 13:15 ; Psa 55:9 ; Jer 4:11-12 , en Jer 51:1 , enz. God wordt ook gezegd te varen op de vleugelen van den wind; 2Sa 22:11 ; Psa 104:3 ."},{"catchword":"hen","tekst":"Te weten deze koe, of hoer, of overspelige vrouw, of Israël, of Efraïm."},{"catchword":"gebonden in zijn vleugelen,","tekst":"Dat is, zal hen zekerlijk binden en lichtelijk wegvoeren, profetischerwijze gesproken."},{"catchword":"offeranden","tekst":"Versta, de afgodische en hoerse offeranden, als boven vermeld."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Hear the word of the LORD, ye children of Israel: for the LORD huth a controverse [Or, Plea, procels, not onely verbal but real; i.e. Judgements and punishments, readie to be executed, as appears ver. 2.3. see above cha 2.2 and 1 Sam. Ch. 25, v 38, 39 Amos 7.4] with the inhabitants of Land; because there is no faithfulness [Or, truth] nor any kindness, or any knowledge of God in the Land. [God implieth that they are stark nought in words and works, making it out plain enough thereby, that they knew him not aright, viz, by a saving knowledge, grounded on his word, and accompanied with Faith and the Love of God and their neighbour. Compare Jr. 9. 24. and 23. 16. and 31. 34. I Joh 2:4. etc]"}],"2":[{"catchword":null,"tekst":"(But ) cursing, and lying, and killing, and stealing, and committing adulterie: they break through [ Oth, cursing, and lying and killing, and stealing, etc. break through; they do prevail like land floods, violently breaking in; or like fierce enemies forcing the walls and entering the breaches pelmell; for thus did they with all manner of fins and abominations, daringly break through without any fear or awe of God Laws and ordinances: of an other use of the Hebrew word, see below ver. 10.] and blood &acirc;&euro;&ldquo; guiltinesses touch blood guiltinesses. [Heb. Bloods touch bloods i.e. one murther or blood &acirc;&euro;&ldquo; shed followers in the neck of another See above chap. 1. on vers.4.]"}],"3":[{"catchword":null,"tekst":"therefore the land shall mourn, [for the sinful abominations of the inhabitants ; to let their own deserts the more sensibility before their eyes, the whole land, and all that is must suffer; and so occures frequently in the Prophets.] every one is in it fainteth, [ or, languisheth, droopeth, pineth away] with beasts of the field, and with the fowls of the heaven; yea the fishes of the sea also shall be raked away. [Hebr. properly, gathered. I.e. they shall die, perish, be consumed, and raked together to be cast away like carrion. See of the Heb. Word Psal.26. on vers. 9.]"}],"4":[{"catch // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
