als de Libanon.","8":"Zij zullen terugkeren, zittend onder zijn schaduw; zij zullen tot leven voortbrengen *als* koren, en bloeien als de wijnstok; zijn gedachtenis zal zijn als de wijn van Libanon.","9":"Efraïm! wat heb Ik meer met de afgoden te doen? Ik heb *hem* verhoord, en zal op hem zien; Ik zal *hem* zijn als een denneboom die groent; uw vrucht is uit Mij gevonden.","10":"Wie is wijs? die begrijpt deze dingen; *wie* is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen."},"SV":{"1":"Samaria zal woest worden, want zij is wederspannig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderkens zullen verpletterd, en hun zwangere *vrouwen* zullen opengesneden worden.","2":"Bekeer u, o Israël! tot den Heere, uw God, toe; want gij zijt gevallen om uw ongerechtigheid.","3":"Neem *deze* woorden met u, en bekeer u tot den Heere; zeg tot Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de varren onzer lippen.","4":"Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tot het werk onzer handen niet meer zeggen: Gij zijt onze God. Immers zal een wees bij U ontfermd worden.","5":"Ik zal hunlieder afkering genezen, Ik zal hen vrijwilliglijk liefhebben; want Mijn toorn is van hem gekeerd.","6":"Ik zal Israël zijn als de dauw; hij zal bloeien als de lelie, en hij zal zijn wortelen uitslaan als de Libanon.","7":"Zijn scheuten zullen zich uitspreiden, en zijn heerlijkheid zal zijn als des olijfbooms, en hij zal een reuk hebben als de Libanon.","8":"Zij zullen wederkeren, zittende onder zijn schaduw; zij zullen ten leven voortbrengen *als* koren, en bloeien als de wijnstok; zijn gedachtenis zal zijn als de wijn van Libanon.","9":"Efraïm! wat heb Ik meer met de afgoden te doen? Ik heb *hem* verhoord, en zal op hem zien; Ik zal *hem* zijn als een groenende denneboom; uw vrucht is uit Mij gevonden.","10":"Wie is wijs? die versta deze dingen; *wie* is verstandig? die bekenne ze; want des Heeren wegen zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen."},"KJV":{"1":"Samaria shall become desolate; for she hath rebelled against her God: they shall fall by the sword: their infants shall be dashed in pieces, and their women with child shall be ripped up.","2":"O Israel, return unto the LORD thy God; for thou hast fallen by thine iniquity.","3":"Take with you words, and turn to the LORD: say unto him, Take away all iniquity, and receive *us* graciously: so will we render the calves of our lips.","4":"Asshur shall not save us; we will not ride upon horses: neither will we say any more to the work of our hands, *Ye are* our gods: for in thee the fatherless findeth mercy.","5":"I will heal their backsliding, I will love them freely: for mine anger is turned away","6":"I will be as the dew unto Israel: he shall grow as the lily, and cast forth his roots as Lebanon.","7":"His branches shall spread, and his beauty shall be as the olive tree, and his smell as Lebanon.","8":"They that dwell under his shadow shall return; they shall revive *as* the corn, and grow as the vine: the scent thereof *shall be* as the wine of Lebanon.","9":"Ephraim *shall say*, What have I to do any more with idols? I have heard *him*, and observed him: I *am* like a green fir tree. From me is thy fruit found.","10":"Who *is* wise, and he shall understand these *things*? prudent, and he shall know them? for the ways of the LORD *are* right, and the just shall walk in them: but the transgressors shall fall"}},"tsk":{"1":[{"kopje":"Samaria","refs":["2 Kon 17:6","2 Kon 17:18","2 Kon 19:9-11","Jes 7:8","Jes 7:9","Jes 8:4","Jes 17:3","Amos 3:9-15","Amos 4:1","Amos 6:1-8","Amos 9:1","Micha 1:4","Micha 6:16"]},{"kopje":"hun kinderen","refs":["Hos 10:14","Hos 10:15","2 Kon 8:12","2 Kon 15:16","Ps 137:8","Ps 137:9","Jes 13:16","Amos 1:13","Nahum 3:10"]}],"2":[{"kopje":"bekeer u","refs":[" ","href":"../../torrey/p/#t-prudence","kinderen":[{"label":"They Who Have","href":"../../torrey/p/?hl=Hos.14.10#i16716","refs":[],"kinderen":[{"label":"Understand the ways of God","href":"../../torrey/p/?hl=Hos.14.10#i16720","refs":[{"disp":"Hos 14:9","href":"../../hosea/14/#v10","ref":"Hos 14:10","svLabel":"SV 10"}],"kinderen":[]}]}]}]}},"noten":{},"koppeling":{"1":"Samaria zal woest worden, want zij is opstandig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderen zullen verpletterd, en hun zwangere <em>vrouwen</em> zullen opengesneden worden.","2":"Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.","3":"Neem <em>deze</em> woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.","4":"Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.","5":"Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.","6":"Ik zal Israël zijn als de dauw; hij zal bloeien als de lelie, en hij zal zijn wortels uitslaan als de Libanon.","7":"Zijn scheuten zullen zich uitspreiden, en zijn heerlijkheid zal zijn als die van de olijfboom, en hij zal een geur hebben als de Libanon.","8":"Zij zullen terugkeren, zittend onder zijn schaduw; zij zullen tot leven voortbrengen <em>als</em> koren, en bloeien als de wijnstok; zijn gedachtenis zal zijn als de wijn van Libanon.","9":"Efraïm! wat heb Ik meer met de afgoden te doen? Ik heb <em>hem</em> verhoord, en zal op hem zien; Ik zal <em>hem</em> zijn als een denneboom die groent; uw vrucht is uit Mij gevonden.","10":"Wie is wijs? die begrijpt deze dingen; <em>wie</em> is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> shall become <span class=\"wl wl-kjv\" data-code=\"H816\">desolate;</span> for she hath <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled</span> against her <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> their <span class=\"wl wl-kjv\" data-code=\"H5768\">infants</span> shall be dashed in <span class=\"wl wl-kjv\" data-code=\"H7376\">pieces,</span> and their women with <span class=\"wl wl-kjv\" data-code=\"H2030\">child</span> shall be ripped up.","2":"O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> for thou hast <span class=\"wl wl-kjv\" data-code=\"H3782\">fallen</span> by thine iniquity.","3":"<span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> with you <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, Take <span class=\"wl wl-kjv\" data-code=\"H5375\">away</span> all <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> us <span class=\"wl wl-kjv\" data-code=\"H2896\">graciously:</span> so will we <span class=\"wl wl-kjv\" data-code=\"H7999\">render</span> the <span class=\"wl wl-kjv\" data-code=\"H6499\">calves</span> of our lips.","4":"<span class=\"wl wl-kjv\" data-code=\"H804\">Asshur</span> shall not <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> us; we will not <span class=\"wl wl-kjv\" data-code=\"H7392\">ride</span> upon <span class=\"wl wl-kjv\" data-code=\"H5483\">horses:</span> neither will we <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> any more to the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of our <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> Ye are our <span class=\"wl wl-kjv\" data-code=\"H430\">gods:</span> for in thee the <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless</span> findeth mercy.","5":"I will <span class=\"wl wl-kjv\" data-code=\"H7495\">heal</span> their <span class=\"wl wl-kjv\" data-code=\"H4878\">backsliding,</span> I will <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> them <span class=\"wl wl-kjv\" data-code=\"H5071\">freely:</span> for mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> is turned away","6":"I will be as the <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> unto <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H6524\">grow</span> as the <span class=\"wl wl-kjv\" data-code=\"H7799\">lily,</span> and cast <span class=\"wl wl-kjv\" data-code=\"H5221\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H8328\">roots</span> as Lebanon.","7":"His <span class=\"wl wl-kjv\" data-code=\"H3127\">branches</span> shall <span class=\"wl wl-kjv\" data-code=\"H3212\">spread,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1935\">beauty</span> shall be as the olive <span class=\"wl wl-kjv\" data-code=\"H2132\">tree,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7381\">smell</span> as Lebanon.","8":"They that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> under his <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H2421\">revive</span> as the <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> and <span class=\"wl wl-kjv\" data-code=\"H6524\">grow</span> as the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine:</span> the <span class=\"wl wl-kjv\" data-code=\"H2143\">scent</span> thereof shall be as the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> of Lebanon.","9":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> shall say, What have I to do any more with <span class=\"wl wl-kjv\" data-code=\"H6091\">idols?</span> I have <span class=\"wl wl-kjv\" data-code=\"H6030\">heard</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7789\">observed</span> him: I am like a <span class=\"wl wl-kjv\" data-code=\"H7488\">green</span> fir <span class=\"wl wl-kjv\" data-code=\"H1265\">tree.</span> From me is thy <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> found.","10":"Who is <span class=\"wl wl-kjv\" data-code=\"H2450\">wise,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> these things? <span class=\"wl wl-kjv\" data-code=\"H995\">prudent,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> them? for the <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> are <span class=\"wl wl-kjv\" data-code=\"H3477\">right,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6662\">just</span> shall <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in them: but the <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressors</span> shall fall"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zal woest worden,","tekst":"Zo de hoofdstad als het omliggende land. Zie 1Ki 13:32 , en 1Ki 16:24 . Dit vers behoort nog tot het voorgaande hoofdstuk; zie de vervulling dezer profetie, 2Ki 17:5-6 , enz."},{"catchword":"zij zullen door het zwaard vallen,","tekst":"De inwoners."},{"catchword":"kinderkens","tekst":"Zie van het Hebr. woord Psa 8:3 ."},{"catchword":"hun zwangere vrouwen","tekst":"Van Samaria."},{"catchword":"opengesneden worden","tekst":"Verg. Hos 13:8 ."}],"2":[{"catchword":"toe;","tekst":"Zie van deze manier van spreken, zich tot God toe bekeren, Joe 2:12 ."},{"catchword":"gevallen","tekst":"Verg. Hos 4:5 , en Hos 5:5 ."}],"3":[{"catchword":"woorden met u,","tekst":"Versta, de belijdenis uwer zonden met vurige en gelovige gebeden om genade, en oprechte beloften van dankbaarheid, waarvan het voorschrift volgt."},{"catchword":"Neem weg alle ongerechtigheid,","tekst":"Dat is, vergeef, reken niet toe. Zie Psa 25:18 , en Psa 32:1 ."},{"catchword":"geef het","tekst":"Hebr. neem, dat is, neem en geef, neem om ons te geven, of onder ons uit te delen, breng aan. Zie Gen 12:15 , en Gen 24:22 , en Psa 68:19 . Anders: ontvang [ons] goediglijk, of neem het goede aan; dat is zie aan, of ontvang genadiglijk onze bekering en goede werken, die wij als wedergeboren kinderen doen."},{"catchword":"goede,","tekst":"Dat is, allerlei geestelijken en lichamelijken zegen, of goeddaden, weldaden; zie Mat 7:11 ; vergeleken met Luk 11:13 ."},{"catchword":"betalen","tekst":"Voor uw onverdiende ganade zullen wij u bewijzen onze schuldige dankbaarheid."},{"catchword":"varren onzer lippen","tekst":"Of aldus: Varren, [te weten de varren, of jonge ossen] onzer lippen. Anders: varren [met] onze lippen; alsof zij zeiden: Wij weten wel dat Gij met het slachten en offeren der beesten niet tevreden zijt, daarom zullen wij U offeren de geestelijke offerranden van lof en dankzegging. Zie Psa 50:14 , en Psa 69:31-32 , en Psa 116:12-13 ; Heb 13:15 , enz."}],"4":[{"catchword":"Assur zal ons niet behouden,","tekst":"Wij zullen ons heil en onze welvaart niet meer bij mensen of buiten U zoeken, want zulks is ijdelheid, ja ons verderf; zie Hos 12:2 , enz."},{"catchword":"rijden","tekst":"Wij zullen ons vertrouwen niet meer stellen op menselijke middelen, niet meer hier en daar reizen om verbond en hulp. Verg. Hos 5:13 , en Hos 7:11 , en Hos 12:2 ."},{"catchword":"paarden,","tekst":"Hber. paard."},{"catchword":"werk onzer handen","tekst":"De afgodische beelden; zie Hos 13:1-2 , enz."},{"catchword":"God","tekst":"Of, goden."},{"catchword":"Immers","tekst":"Alzo wordt het Hebr. woord ook gebruikt, 1Sa 15:20 . Anders: watn toch, of dat toch, enz., biddenderwijze."},{"catchword":"wees bij U ontfermd worden","tekst":"Een zeer bewegenlijk besluit van dit boetvaardig en gelovig gebed, waarmede zij bekennen dat er voor hen nergens enig heil is dan bij God alleen, naardien zij op aarde [als een weeskind] van alle menselijke hulp verlaten zijn, en vertrouwen dat God zulke weesjes, tot Hem om genade schreiende, niet zal verstoten; verg. Lam 5:3 , en Psa 10:14 , en Psa 68:6 , en Psa 146:9 ; Joh 14:18 ."}],"5":[{"catchword":"Ik zal hunlieder","tekst":"Een zeer lieflijk en vaderlijk antwoord en belofte Gods, op het voorgaande boetvaardig gebed."},{"catchword":"genezen,","tekst":"Vergevende al hun kwaad, en gevende mijn goed, gelijk zij begeerd hebben, vs.3; zie Psa 30:3 ."},{"catchword":"vrijwilliglijk liefhebben;","tekst":"Of, mildelijk, uit goeder harte [gelijk men zegt]. Verg. Deu 30:9 ; Jer 32:41-42 ; Joh 16:26-27 , en zie van het Hebr. woord Lev 7:16 ; Job 12:21 ."},{"catchword":"hem gekeerd","tekst":"Namelijk Israël, die terstond in het volgende vers genoemd wordt, en zie vs.2."}],"6":[{"catchword":"Ik zal Israël zijn als de dauw;","tekst":"Deze beloften, afbeeldende, door schone gelijkenissen, de genade van Jezus Christus en den overvloed der gaven van den Heiligen Geest, behoren allen tot het nieuwe genadeverbond, gegrond in den Messias, onze Heere Jezus Christus, in wien alle beloften ja en amen zijn, 2Co 1:20 , toebehorende het ganse Israël, dat is, aan de ganse kerk der gelovige Israëlieten en heidenen. Verg. Hos 13:14 ."},{"catchword":"Libanon","tekst":"Dat is, de bomen die op den Libanon staan, [alzo in vs.7], alwaar de welriekende wierook, wast, waarvan men houdt dat deze berg zijn naam heeft; want Lebona heet wierook, en deze berg heet in het Hebr. Lebanon."}],"7":[{"catchword":"uitspreiden,","tekst":"Hebr. gaan."},{"catchword":"zijn heerlijkheid","tekst":"Verg. Isa 60:13 ; Jer 11:16 ; Eze 31:3 , Eze 31:7-9 ."}],"8":[{"catchword":"Zij zullen wederkeren,","tekst":"De ware Israëlieten zullen zich bekeren, waartoe zij vermaand zijn, zie vs.2. Anders: zij zullen wederom zitten."},{"catchword":"zijn schaduw;","tekst":"Onder des Heeren vaderlijke beschutting zich verkwikkende en zeker zijnde; zie Rth 2:12 ; Psa 91:1 ."},{"catchword":"leven voortbrengen","tekst":"Dat is, vruchtbaar zijn en vermenigvuldigen; versta dit inzonderheid van de geestelijke vruchten, die zij als nieuwe en wedergeboren mensen zullen voortbrengen door de kracht van den Heiligen Geest, die ons levend maakt ten goede. Verg. Psa 72:16 , en zie de aantekening aldaar."},{"catchword":"zijn gedachtenis","tekst":"De bekeerde Israëls gedachtenis; dat is, naam, faam, gerucht, zal zo aangenaam en welriekend zijn als de edelste wijn van Libanon. Anders: zijne welriekendheid, of reuk, omdat het Hebr. woord, betekenende gedachtenis, somtijds voor reuk schijnt genomen te worden, gelijk een lieflijk reukwerk iemand doet gedenken. Zie Isa 66:3 ; idem Lev 2:2 , Lev 2:9 ; Num 5:26 , en Psa 20:4 , met de aantekening. Sommigen duiden het op de gedachtenis van God, die zeer lieflijk en aangenaam zal zijn bij den gelovige, vanwege zijn overgrote genade."}],"9":[{"catchword":"Efraïm","tekst":"Dit kan men nemen als woorden van God, die zich zonderling laat gevallen [gelijk iemand die verblijd is], dat Efraïm alle afgoderij verworpen heeft en hem daarmede niet meer lastig valt of omsingelt, gelijk tevoren. Zie Hos 12:1 , enz. Of men kan het nemen voor woorden van den bekeerden Efraïm, aldus: Efraïm [zal zeggen] enz."},{"catchword":"wat heb Ik meer met de afgoden te doen?","tekst":"Hebr. wat [is] mij en den afgoden. Zie 2Sa 16:10 , en van het woord afgoden, in Hos 8:4 ."},{"catchword":"verhoord,","tekst":"Dit schijnt te zien op het gebed in vs.3,4. Anders: Ik zal [hem] verhoren, of Ik verhoor en aanschouw, of aanzie hem."},{"catchword":"zien;","tekst":"Mijn ogen zullen steeds op hem zijn, ten goede, Ik zal mijn aangezicht voor hem niet verbergen. Zie Jer 24:6 , gelijk Ik tevoren op hem loerde ten kwade, Hos 13:7 . Anders: Ik heb hem aangezien; te weten genadiglijk, of op hem gelet."},{"catchword":"denneboom;","tekst":"Die zijne groenigheid, of zijn loof, [gelijk de kruidbeschrijvers betuigen] den gansen winter door houdt, en met een lieflijke grote schaduw verkwikt; alzo [wil God zeggen] zal Ik hen verkwikken tegen de hitte aller tegenspoeden en vervolgingen."},{"catchword":"vrucht is uit Mij gevonden","tekst":"Waarvan in Hos 13:15 . Dat is, door mijn genadige en krachtige werking zult gij zeer vruchtbaar zijn ten goede, uwe vrucht zal er gewis zijn. Zie Joh 15:1 , enz.; Psa 1:3 , enz.; en verg. in vs.6-8, en aangaande het woord gevonden, of niet gevonden worden, verg. Mic 1:13 ; Zep 3:13 ; Mal 2:6 ; 1Pe 2:22 ; idem Num 11:22 ; Psa 46:2 ."}],"10":[{"catchword":"Wie is wijs?","tekst":"Een schoon besluit dezer profetie, en in het bijzonder van dit hoofdstuk, en der voorgaande Evangelische leringen en beloften. De zin is: dat de ware wijsheid hierin bestaat, en die wijs willen zijn, dat zij dit moeten verstaan en weten, en zich daarnaar regelen; anders zullen zij dwaas zijn in al hunne wijsheid. Zie 1Co 1:18-19 , enz., en 1Co 2:2 , enz.; en aangaande deze manier van vragen, verg. Deu 20:5-8 ; Psa 25:12 , en Psa 34:13 , en Psa 107:43 . Anders: klagenderwijze aldus: Wie [is] wijs en verstaat deze dingen? verstandig en weet ze? alsof de profeet zeide: Zeer weinig zijn er, die deze wijsheid hebben. Verg. Jer 9:12 ."},{"catchword":"bekenne ze;","tekst":"Of, weet ze."},{"catchword":"wegen","tekst":"Zijne lering en regering. Zie Gen 18:19 , en Psa 25:4 ; idem Deu 32:4 ; Psa 25:10 ."},{"catchword":"recht,","tekst":"Verg. Psa 7:11 , en Psa 19:9 ."},{"catchword":"wandelen,","tekst":"Met genoegen lust en vreugde. Zie Psa 119 ; Mat 11:30 ; 1Jo 5:3 , enz."},{"catchword":"overtreders zullen daarin vallen","tekst":"Of, afvalligen, zullen zich daaraan ergeren, stoten, sneuvelen en vervallen. Zie Isa 8:14 , en Hos 7:13 ; Luk 2:34 ; 2Co 2:16 , enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"(14:1) Samaria shall be laid waste [ Aswell the capital or mother city, as the country and religion about the same, See 1King.13. on verse, 22. and chap 16. on verse, 24 This verse belons yet to the former chapter . See the fulfilling of this prophesy, 2 King 17.5,6, &c.] for shhe hath been rebellious against the LORD fro God: they shall by the sword, [the inhabitants namely] their little children [see the word Ps.8. on verse. 3.] shall be dashed in pieces, [Hos. 10. 14.]] and her [viz. Samaria&rsquo;s] (women) with child [compare above chap 13.8.] shall be cut up."}],"2":[{"catchword":null,"tekst":"(2) Convert thy self, o Israel, even unto the LORD thy God: [Compare this phrase with Joel 2. on verse 11] for thou are fallen for thine iniquity. [Compare above chap 4. 5. and 5.5.]"}],"3":[{"catchword":null,"tekst":"(3) Take (these) words with you, [understand the conses of your sins, with the servent and faithful prayer for grace and forgiveness, joyned with sincere promised of thankfulness, whereof the pattern followeth] and convert your selves to the LORD, say to him; Take way all iniquity , [i.e. forgive it, imput it not. See Psal 25. on vers. 18 and 32. on verse. 1.] and give the good; [i.e. all manner of spiritual blessings or mercies and benesits: see Mat 7. vers 11. Compare with Luke 11. vers.5, 13] so shall we pay [i.e. shew our due thankfulness for thy undeserved mercie] bullocks of our lips ] or thus, bullocks, i.e. the beasts themselves, of our lips: or bullocks, (with) our lips; or, as if they did say, we know well enough; that thou art not satisfied with the saying and offering of beasts, therefore we shall offer unto thee the spiritual sacrifices of praise and thanksgiving. See Psal 50.14 and 116. 12. 15. Heb 13.15 &c.]"}],"4":[{"catchword":null,"tekst":"(4) Assur shall not save us, [We will not put our trust any more in men, or, without thee; all besides thee being vanity, and the relying on it, apparent ruin. See above chap 12.2, &c.] W e will not ride upon horses, [Heb horse i.e. We will consider no more in any humane means, nor travel to and fro, or send abroad for help an confederacies; compare above chap 5.13. and 7. 11. and 12.2.] nor say (any) more to the work of our hands and idolatrous images and representation; See above chap.13. vers. 1,2, &c] Thou are our God : [or Gods] however [thus the Hebrew word is likewise used, 1 Sam 15.20. or yet, or, let i pray, as petitioning] an orphan be visited by thee; [ a very pathetical conclusion of his panitent and faithful prayer whereby they acknowledge, that there is no salvation for them any where but God alone, they being here on earth, (much like orphan) wholly destitute of any humane help, and are humbly confident, that God will not reject such orphans, crying unto him for mercy and compassion. Compare Lam.5. 3. and Psa.10. 14. and 68. and 146.9. Job 14:8]"}],"5":[{"catchword":null,"tekst":"(5) I will heal (or, cure) their backsliding; [A most sweet and father answer and promise of God, upon the foregoing penitent, forgiving them all their evil, and iving them good things, as they desired above verse. 3. see Psal 30. on vers.3.] i will love them freely [or, liberally, from a good heart (as the saying is) the compare Deut. 30. 9. Jer 32.41,42 Jobn 18.26,27 and see the Heb. word, Lev 7. on vers. 16. Job 12. on vers.21] for mine aner is turned away from him. [viz. from Israel , expressed by the name presently in the next verse, and above verse 2.]"}],"6":[{"catchword":null,"tekst":"(6) I will be unto Israel, as the dew, he shall blossom, as the lily [ These promises, representing by very elegant comparisons, the grace of Jesus Christ ,and the abundance of spiritual gifts, do all belong to the Covenant of grace in the new testament , and are grounded upon the Messiah, our Lord Jesus Christ, in whom all promises are yea and Amen, 2 Chron 1.20. appertaining to all Israel, that is, to the whole church of believing Jews and Gentiles. Compare above chap.13. on verse. 14.] and he shall cast forth his roots, like Lebanon [i.e. like the trees, that stand on mount Lebanon; (and so verse 7.) where the sweet &acirc;&euro;&ldquo; smelling frankincense doth grow, from which it is conceived this mountain had its name: for Lebona doth signifie frankincense, and this mountain is called in Hebrew Lebanon]"}],"7":[{"catchword":null,"tekst":"(7) His shoots shall spread themselves abroad [Heb. shall go etc] and his glory shall be as the Olive &acirc;&euro;&ldquo; trees, [compare Isa60. 13. Jer. 11.16. Ezek. 31.3,7,6,9.] and hhe shall have a smell like Lebanon"}],"8":[{"catchword":null,"tekst":"(8) They shall return, [i.e. the true Israelites shall convert themselves; as they are are exhorted to do above vers.2.] sitting [Oth read the verse from the beginning They shall sit again] under his shadow ; [refreshing themselves and being secured under the LORD his fatherly protection. See Ruth 2. on verse. 12 Psal . 91. 1.] they shall bring forth to life, as corn, and bossom as the vine: [i.e. they shall be fruitful and multiply : understand this especially to the spiritual fruits, which they should bring forth as new and regenerate creatures, themselves, and cause like wise others, by means of teaching and edisying, to bring forth the like, through the powerful working of the holy spirit, that quickens us unto good. Compare Psal. 72. 16. and see the annotat there.] his remembrance shall be as sweet vand acceptable as the wine of Lebanon .[viz. the remembrance of the converted Israel ; that is, his Name, Fame and report shall be as sweet and acceptable as the noblest wine of Lebanon. Ot. his fragrancie, or smell; because the Heb, word signifying remembrance seems sometimes to be used for smell, according as sweet perfume causeth one to remember; see Isa 66.3. again Lev.2.2,9. Num.5. 26. and Psal 20.4. with the annotat. Some do apply it to the remembrance of God, which should prove very pleasing and acceptable to the believers, because of his super &acirc;&euro;&ldquo; abundant grace]"}],"9":[{"catchword":null,"tekst":"(9) Ephraim [This may be taken, as spoken by God, who takes a singular pleasure, (as one doth rejoyce) that Ephraim had rejected all idolatry, and was no more trouble to him by it, as formerly. See above chhap. 12. ver1, &c. or it may be taken for the words of converted Ephraim, thus ; Ephraim (shall say) etc] what have i more to do with the idols? [Heb. what (is) to me and idols? see 1Sam 16. on vers.10. and so the word idols, above chap. above chap.8. on vers.4.] i have heard him, and will look upon him; [this seems to have regard to the prayer mad above vers. 3,4. Oth i will hear (him) or, i do hear and regard (or, look upon) him, viz. graciously: or, take notice of him i.e. mine eyes shall be continually upon him. See Jer 24.6. as before i watched him for evil above chap 13. vers 7. Oth i have regarded him] i will be unto him, as a green fire &acirc;&euro;&ldquo; tree; [which keeps its verdure or leaf (as Herbarists testifie) all the winter long and yield a very refreshing shadow: so doth God implie, will i refresh them against the heat of all adversities and persecutions] thy fruit is found out of me [whereof see above chap 13,15 that is through my gracious and powerful working ye shall be fruitful fro good; your fruit shall be sure, see Job 15 vers.1, &c and compare above vers. 6,7,8. and for the word found or, with being found, compare Mich 1.13. Zeph 3.13. Mal.2.6. 1Pet.2.22. again Num 11. on vers22 Psa.46. on verse 2."}],"10":[{"catchword":null,"tekst":"(10) Who is wise ? let him understand these things (who is) understanding: let him acknowledge (or, know) them, [an elegant conclusion of this Prophets,and especially of this chapter, and the foregoing evangelical instructions and promises; the sense is, that true wisdom consists in this, and those that will be wise must understand and know this, and govern themselves accordingly: otherwise they will be fools all their wisdom. See 1 Cor 1.18, 19, &c. and chap 2.2, &c. and so to this manner and asking, compare Deut 20. verse 5.6,7,8. Psa. 25.12. and 34.23. and 107.43. Oth by way of complaint, who is wise and understands these things, understanding and knows them ? as if the prophet had said alass there are but few hhave this wisdom. Compare Jer 9, 12,] for the wayes of the LORD are straight, [i.e. his instruction of government. See Gen.18. on vers.19. and Psa 25. on vers.4. again Deut 32. on verse. 4. Psal.25. on verse 10. Compare also Psal 19.9. and 7.11.] and the righteous shall walk in them, [with content delight and joy, see Psal 119.30. Mat 11:4.1. Job. 5. vers. 3,&c] but the transgressors [or, revolting ones, back &acirc;&euro;&ldquo; sliders ] shall fall therein. [i.e. they shall take offence and stumble thereat , and fall away. See above chhap. 7.13. and Isa chha. 8.14. Luke 2,34. 2Cor.2. 16,&c.]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.className = 'vers'; rij.id = 'v' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
