elding[1] zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.","8":"De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.","9":"Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.","10":"Ik vond Israël als druiven in de woestijn, Ik zag uw vaders als de eerste vrucht aan de vijgenboom in haar begintijd; maar zij gingen naar Baäl-peor, en zonderden zich af tot die schande, en werden helemaal verfoeilijk, net als datgene wat zij liefhadden.","11":"Wat Efraïm aangaat, hun heerlijkheid zal wegvluchten als een vogel; vanaf de geboorte, en vanaf de moederschoot, en vanaf de ontvangenis af.","12":"Ofschoon zij hun kinderen mochten grootbrengen, Ik zal hen er toch van beroven, zodat er geen mens over zal blijven; want ook, wee hun, wanneer Ik van hen zal zijn weggegaan!","13":"Efraïm is, zoals Ik Tyrus aanzag, geplant in een aangename woonplaats; maar Efraïm zal zijn kinderen moeten uitbrengen naar de moordenaar.","14":"Geef hun, Heere! Wat zult U geven? Geef hun een baarmoeder die een miskraam krijgt, en uitdrogende borsten.","15":"Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.","16":"Efraïm is geslagen, hun wortel is verdord, zij zullen geen vrucht voortbrengen; ja, ofschoon zij kinderen zouden krijgen, zo zal Ik toch de gewenste vruchten van hun buik doden.","17":"Mijn God zal ze verwerpen, omdat zij niet naar Hem luisteren; en zij zullen zwervend zijn onder de heidenvolken."},"SV":{"1":"Verblijd u niet, o Israël! tot opspringens toe, gelijk de volken; want gij hoereert van uw God af; gij hebt hoerenloon lief, op alle dorsvloeren des korens.","2":"De *dors* vloer en de wijnkuip zal henlieden niet voeden; en de most zal hun liegen.","3":"Zij zullen in des Heeren land niet blijven; maar Efraïm zal weder tot Egypte keren, en zij zullen in Assyrië het onreine eten.","4":"Zij zullen den Heere geen drankofferen doen van wijn, ook zouden zij Hem niet zoet zijn, hun offeranden zouden hun zijn als treurbrood; allen, die dat zouden eten, zouden onrein worden; want hun brood zal voor hun ziel zijn, het zal in des Heeren huis niet komen.","5":"Wat zult gijlieden *dan* doen op een gezetten hoogtijdsdag, en op een feestdag des Heeren?","6":"Want ziet, zij gaan daarhenen vanwege de verstoring; Egypte zal ze verzamelen, Mof zal ze begraven; begeerte zal er zijn naar hun zilver, netelen zullen hen erfelijk bezitten, doornen zullen in hun tenten zijn.","7":"De dagen der bezoeking zijn gekomen, de dagen der vergelding zijn gekomen; die van Israël zullen het gewaar worden; de profeet is een dwaas, de man des geestes is onzinnig; om de grootheid uwer ongerechtigheid is de haat ook groot.","8":"De wachter van Efraïm is met mijn God, *maar* de profeet is een vogelvangersstrik, op al zijn wegen, een haat in het huis zijns Gods.","9":"Zij hebben zich zeer diep verdorven, als in de dagen van Gibea; Hij zal hunner ongerechtigheid gedenken, Hij zal hun zonden bezoeken.","10":"Ik vond Israël als druiven in de woestijn, Ik zag uw vaderen als de eerste vrucht aan den vijgeboom in haar beginsel; *maar* zij gingen in *tot* Baäl-peor, en zonderden zich af tot die schaamte, en werden gans verfoeilijk naar hun boelerij.","11":"Aangaande Efraïm, hunlieder heerlijkheid zal wegvlieden als een vogel; van de geboorte, en van *moeders* buik, en van de ontvangenis af.","12":"Ofschoon zij hun kinderen mochten groot maken, Ik zal er hen toch van beroven, dat zij onder de mensen niet zullen zijn; want ook, wee hun, als Ik van hen zal geweken zijn!","13":"Efraïm is, gelijk als Ik Tyrus aanzag, die geplant is in een liefelijke woonplaats; maar Efraïm zal zijn kinderen moeten uitbrengen tot den doodslager.","14":"Geef hun, Heere! Wat zult Gij geven? Geef hun een misdragende baarmoeder, en uitdrogende borsten.","15":"Al hun boosheid is te Gilgal, want daar heb Ik ze gehaat, om de boosheid van hun handelingen; Ik zal ze uit Mijn huis uitdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.","16":"Efraïm is geslagen, hunlieder wortel is verdord, zij zullen geen vrucht voortbrengen; ja, ofschoon zij genereerden, zo zal Ik toch de gewenste *vruchten* van hun buik doden.","17":"Mijn God zal ze verwerpen, omdat zij naar Hem niet horen; en zij zullen omzwervende zijn onder de heidenen."},"KJV":{"1":"Rejoice not, O Israel, for joy, as *other* people: for thou hast gone a whoring from thy God, thou hast loved a reward upon every cornfloor.","2":"The floor and the winepress shall not feed them, and the new wine shall fail","3":"They shall not dwell in the LORD'S land; but Ephraim shall return to Egypt, and they shall eat unclean *things* in Assyria.","4":"They shall not offer wine *offerings* to the LORD, neither shall they be pleasing unto him: their sacrifices *shall be* unto them as the bread of mourners; all that eat thereof shall be polluted: for their bread for their soul shall not come into the house of the LORD.","5":"What will ye do in the solemn day, and in the day of the feast of the LORD?","6":"For, lo, they are gone because of destruction: Egypt shall gather them up, Memphis shall bury them: the pleasant *places* for their silver, nettles shall possess them: thorns *shall be* in their tabernacles.","7":"The days of visitation are come, the days of recompence are come; Israel shall know *it*: the prophet *is* a fool, the spiritual man *is* mad, for the multitude of thine iniquity, and the great hatred.","8":"The watchman of Ephraim *was* with my God: *but* the prophet *is* a snare of a fowler in all his ways, *and* hatred in the house of his God.","9":"They have deeply corrupted *themselves*, as in the days of Gibeah: *therefore* he will remember their iniquity, he will visit their sins.","10":"I found Israel like grapes in the wilderness; I saw your fathers as the firstripe in the fig tree at her first time: *but* they went to Baalpeor, and separated themselves unto *that* shame; and *their* abominations were according as they loved.","11":"*As for* Ephraim, their glory shall fly away like a bird, from the birth, and from the womb, and from the conception.","12":"Though they bring up their children, yet will I bereave them, *that there shall* not *be* a man *left*: yea, woe also to them when I depart","13":"Ephraim, as I saw Tyrus, *is* planted in a pleasant place: but Ephraim shall bring forth his children to the murderer.","14":"Give them, O LORD: what wilt thou give? give them a miscarrying womb and dry breasts.","15":"All their wickedness *is* in Gilgal: for there I hated them: for the wickedness of their doings I will drive them out of mine house, I will love them no more: all their princes *are* revolters.","16":"Ephraim is smitten, their root is dried up, they shall bear no fruit: yea, though they bring forth, yet will I slay *even* the beloved *fruit* of their womb.","17":"My God will cast them away, because they did not hearken unto him: and they shall be wanderers among the nations."}},"tsk":{"1":[{"kopje":"Verblijd u","refs":["Hos 10:5","Jes 17:11","Jes 22:12","Klaagl 4:21","Ezech 21:10","Amos 6:6","Amos 6:7","Amos 6:13","Amos 8:10","Jak 4:16","Jak 5:1"]},{"kopje":"zoals","refs":["Ezech 16:47","Ezech 16:48","Ezech 20:32","Amos 3:2"]},{"kopje":"hoereert","refs":["Hos 4:12","Hos 5:4","Hos 5:7"]},{"kopje":"u hebt hoerenloon lief","refs":["Hos 2:11","Jer 44:17"]}],"2":[{"kopje":"dorsvloer","refs":["Hos 2:8","Hos 2:11","Jes 24:7-12","Joël 1:3-7","Joël 1:9-13","Amos 4:6-9","Amos 4:5-11","Micha 6:13-16","Hagg 1:9","Hagg 2:17"]}],"3":[{"kopje":"niet","refs":["Lev 18:28","Lev 20:22","Deut 4:26","Deut ../../ezechiel/36/#v19","ref":"Ezech 36:19","svLabel":null},{"disp":"Dan 9:7","href":"../../daniel/9/#v7","ref":"Dan 9:7","svLabel":null},{"disp":"Joh 7:35","href":"../../johannes/7/#v35","ref":"Joh 7:35","svLabel":null},{"disp":"Hand 2:5","href":"../../handelingen/2/#v5","ref":"Hand 2:5","svLabel":null}],"kinderen":[]}]}]}]}},"noten":{"1":"SV: bezoeking. D.i.: de dagen van Gods straffend ingrijpen."},"koppeling":{"1":"Verblijd u niet, Israël, tot uitbundige vreugde toe, zoals de volken; want u hoereert van uw God af; u hebt hoerenloon lief, op alle dorsvloeren van het koren.","2":"De dorsvloer en de wijnkuip zullen hen niet voeden, en de most zal hen bedriegen.","3":"Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.","4":"Zij zullen de Heere geen drankoffers doen van wijn, en die zouden Hem ook niet aangenaam zijn; hun offers zouden voor hen zijn als treurbrood; allen die daarvan zouden eten, zouden onrein worden; want hun brood zal voor henzelf zijn, het zal niet in het huis van de Heere komen.","5":"Wat zult u dan doen op een vastgestelde hoogtijdsdag, en op een feestdag van de Heere?","6":"Want zie, zij gaan weg vanwege de verwoesting; Egypte zal ze verzamelen, Memfis zal ze begraven; hun begeerlijke plaatsen voor hun zilver zullen door netels bezet worden, doornen zullen in hun tenten zijn.","7":"De dagen van de vergelding<sup class=\"noot\" data-noot=\"1\">1</sup> zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.","8":"De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.","9":"Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.","10":"Ik vond Israël als druiven in de woestijn, Ik zag uw vaders als de eerste vrucht aan de vijgenboom in haar begintijd; maar zij gingen naar Baäl-peor, en zonderden zich af tot die schande, en werden helemaal verfoeilijk, net als datgene wat zij liefhadden.","11":"Wat Efraïm aangaat, hun heerlijkheid zal wegvluchten als een vogel; vanaf de geboorte, en vanaf de moederschoot, en vanaf de ontvangenis af.","12":"Ofschoon zij hun kinderen mochten grootbrengen, Ik zal hen er toch van beroven, zodat er geen mens over zal blijven; want ook, wee hun, wanneer Ik van hen zal zijn weggegaan!","13":"Efraïm is, zoals Ik Tyrus aanzag, geplant in een aangename woonplaats; maar Efraïm zal zijn kinderen moeten uitbrengen naar de moordenaar.","14":"Geef hun, Heere! Wat zult U geven? Geef hun een baarmoeder die een miskraam krijgt, en uitdrogende borsten.","15":"Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.","16":"Efraïm is geslagen, hun wortel is verdord, zij zullen geen vrucht voortbrengen; ja, ofschoon zij kinderen zouden krijgen, zo zal Ik toch de gewenste vruchten van hun buik doden.","17":"Mijn God zal ze verwerpen, omdat zij niet naar Hem luisteren; en zij zullen zwervend zijn onder de heidenvolken."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H8055\">Rejoice</span> not, O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> for <span class=\"wl wl-kjv\" data-code=\"H1524\">joy,</span> as other <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> for thou hast gone a <span class=\"wl wl-kjv\" data-code=\"H2181\">whoring</span> from thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> a <span class=\"wl wl-kjv\" data-code=\"H868\">reward</span> upon every <span class=\"wl wl-kjv\" data-code=\"H1637\">cornfloor.</span>","2":"The <span class=\"wl wl-kjv\" data-code=\"H1637\">floor</span> and the <span class=\"wl wl-kjv\" data-code=\"H3342\">winepress</span> shall not <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> them, and the new <span class=\"wl wl-kjv\" data-code=\"H8492\">wine</span> shall fail","3":"They shall not <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> but <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> things in Assyria.","4":"They shall not <span class=\"wl wl-kjv\" data-code=\"H5258\">offer</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> offerings to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> neither shall they be <span class=\"wl wl-kjv\" data-code=\"H6149\">pleasing</span> unto him: their <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> shall be unto them as the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of <span class=\"wl wl-kjv\" data-code=\"H205\">mourners;</span> all that <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">polluted:</span> for their <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> for their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall not <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the LORD.","5":"What will ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> in the <span class=\"wl wl-kjv\" data-code=\"H4150\">solemn</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of the LORD?","6":"For, lo, they are <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> because of <span class=\"wl wl-kjv\" data-code=\"H7701\">destruction:</span> <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> shall gather them <span class=\"wl wl-kjv\" data-code=\"H6908\">up,</span> <span class=\"wl wl-kjv\" data-code=\"H4644\">Memphis</span> shall <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> them: the <span class=\"wl wl-kjv\" data-code=\"H4261\">pleasant</span> places for their <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> <span class=\"wl wl-kjv\" data-code=\"H7057\">nettles</span> shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> them: <span class=\"wl wl-kjv\" data-code=\"H2336\">thorns</span> shall be in their tabernacles.","7":"The <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H6486\">visitation</span> are <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H7966\">recompence</span> are <span class=\"wl wl-kjv\" data-code=\"H935\">come;</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> it: the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> is a <span class=\"wl wl-kjv\" data-code=\"H191\">fool,</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">spiritual</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> is <span class=\"wl wl-kjv\" data-code=\"H7696\">mad,</span> for the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of thine <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> hatred.","8":"The <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> was with my <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> but the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> is a <span class=\"wl wl-kjv\" data-code=\"H6341\">snare</span> of a <span class=\"wl wl-kjv\" data-code=\"H3352\">fowler</span> in all his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and <span class=\"wl wl-kjv\" data-code=\"H4895\">hatred</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of his God.","9":"They have <span class=\"wl wl-kjv\" data-code=\"H6009\">deeply</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupted</span> themselves, as in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah:</span> therefore he will <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> he will <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> their sins.","10":"I <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> like <span class=\"wl wl-kjv\" data-code=\"H6025\">grapes</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness;</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> as the <span class=\"wl wl-kjv\" data-code=\"H1063\">firstripe</span> in the fig <span class=\"wl wl-kjv\" data-code=\"H8384\">tree</span> at her first <span class=\"wl wl-kjv\" data-code=\"H7225\">time:</span> but they <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H1187\">Baalpeor,</span> and <span class=\"wl wl-kjv\" data-code=\"H5144\">separated</span> themselves unto that <span class=\"wl wl-kjv\" data-code=\"H1322\">shame;</span> and their <span class=\"wl wl-kjv\" data-code=\"H8251\">abominations</span> were according as they loved.","11":"As for <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> their <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> shall fly <span class=\"wl wl-kjv\" data-code=\"H5774\">away</span> like a <span class=\"wl wl-kjv\" data-code=\"H5775\">bird,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3205\">birth,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H990\">womb,</span> and from the conception.","12":"Though they bring <span class=\"wl wl-kjv\" data-code=\"H1431\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> yet will I <span class=\"wl wl-kjv\" data-code=\"H7921\">bereave</span> them, that there shall not be a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> left: yea, <span class=\"wl wl-kjv\" data-code=\"H188\">woe</span> also to them when I depart","13":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> as I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyrus,</span> is <span class=\"wl wl-kjv\" data-code=\"H8362\">planted</span> in a pleasant <span class=\"wl wl-kjv\" data-code=\"H5116\">place:</span> but <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> shall bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> to the murderer.","14":"<span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> them, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> what wilt thou <span class=\"wl wl-kjv\" data-code=\"H5414\">give?</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them a <span class=\"wl wl-kjv\" data-code=\"H7921\">miscarrying</span> <span class=\"wl wl-kjv\" data-code=\"H7358\">womb</span> and <span class=\"wl wl-kjv\" data-code=\"H6784\">dry</span> breasts.","15":"All their <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> is in <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal:</span> for there I <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> them: for the <span class=\"wl wl-kjv\" data-code=\"H7455\">wickedness</span> of their <span class=\"wl wl-kjv\" data-code=\"H4611\">doings</span> I will drive them <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> of mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> I will <span class=\"wl wl-kjv\" data-code=\"H160\">love</span> them no <span class=\"wl wl-kjv\" data-code=\"H3254\">more:</span> all their <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> are revolters.","16":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> is <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten,</span> their <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> is dried <span class=\"wl wl-kjv\" data-code=\"H3001\">up,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H6213\">bear</span> no <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit:</span> yea, though they bring <span class=\"wl wl-kjv\" data-code=\"H3205\">forth,</span> yet will I <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> even the <span class=\"wl wl-kjv\" data-code=\"H4261\">beloved</span> fruit of their womb.","17":"My <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will cast them <span class=\"wl wl-kjv\" data-code=\"H3988\">away,</span> because they did not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto him: and they shall be <span class=\"wl wl-kjv\" data-code=\"H5074\">wanderers</span> among the nations."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"opspringens toe,","tekst":"Of, tot verheugens toe, tot vrolijkheid toe; zie dezelfde manier van spreken Job 3:22 . Het Hebreeuwse woord ziet op de uiterlijke gebaren en bewijs van vreugde."},{"catchword":"volken;","tekst":"Die ten tijde van een goeden oogst gewoon waren grote vreugde te bedrijven ter ere hunner afgoden, die zij hielden voor de bewerkers van dien; vergelijk Psa 4:8 , en hier het volgende; idem Joe 1:12 ."},{"catchword":"hoerenloon lief,","tekst":"Dat is, gij verheugt u over den oogst als over een beloning, die uwe boelen, de afgoden, u zouden hebben gegeven vanwege uw geestelijke hoererij, dat is afgoderij; en op alle plaatsen, waar gij koren stapelt en dorst en waar gij den wijn perst, dankt gij uwe afgoden voor hetgeen Ik u gegeven heb. Vergelijk boven Hos 2:4 , Hos 2:7-8 , Hos 2:11 ."}],"2":[{"catchword":"niet voeden;","tekst":"Hoewel zij zichzelven ander beloven."},{"catchword":"hun","tekst":"Of, tegen haar, onder haar; te weten, deze hoer, of overspeelster; of Efraïm, Israël."},{"catchword":"liegen","tekst":"Dat is, hunne hoop, die zij daarvan hebben, zal feilen en hen bedriegen, zij zullen niet genieten, het zal voor den vijand zijn, en zij moeten het land uit, gelijk volgt. Vergelijk boven Hos 8:7 , en de manier van spreken met Hab 3:17 ; Isa 52:11 , en Job 40:28 , en zie de aantekening aldaar."}],"3":[{"catchword":"land niet blijven;","tekst":"Namelijk Kanaän, dat Gods land en erfenis dikwijls genoemd wordt; zie Psa 68:10 , en Joe 1:6 , en Joe 3:2 , enz."},{"catchword":"Egypte keren,","tekst":"Zie boven Hos 8:13 ."},{"catchword":"en zij zullen","tekst":"Of, maar; indien men het verstaat van hulp in Egypte te zoeken tegen den Assyriër. Alsof God zeide: Zij mogen naar Egypte lopen zoveel zij willen, zij zullen evenwel naar Assyrië moeten."},{"catchword":"Assyrië","tekst":"Waarheen zij gevankelijk zullen worden weggevoerd."},{"catchword":"onreine eten","tekst":"Dat God in zijne wet verboden had te eten, en waarvan zij etende, naar de wet der ceremoniën onrein werden. Vergelijk Eze 4:12-13 ; Dan 1:8 , en hier vs.4."}],"4":[{"catchword":"zullen","tekst":"Wanneer zij in Assyrië zullen zijn weggevoerd en eten wat onrein is, van welken ellendigen toestand der Israëlieten in het voorgaande en vs.5 gesproken wordt."},{"catchword":"den HEERE","tekst":"Als zijnde buiten zijn land en plaats, enz., die God tot offeren verordineerd had, en voorts geen gelegenheid of middel hebbende om den Heere wat reins te offeren, gelijk blijkt uit de voorgaande en volgende woorden."},{"catchword":"drankofferen doen van wijn,","tekst":"Hebreeuws, uitstorten, uitgieten, of uitspreiden van wijn; dat is, drankoffers van wijn offeren. Zie Psa 16:4 ."},{"catchword":"zoet zijn,","tekst":"Dat is, aangenaam of behagelijk, gelijk Jer 6:20 ; Mal 3:4 ."},{"catchword":"treurbrood;","tekst":"Hebreeuws, brood der treurenden, of rouwenden; dat is, leedspijs, die men eet in sterfhuizen; zulks alles was naar de wet der ceremoniën onrein. Zie Lev 21:1 , enz. en Lev 22:4 , enz.; Num 19:14 ; Deu 26:14 , enz. Ook waren zij gehouden te offeren met vreugde, Deu 12:6-7 ; waarom sommigen door brood of spijs de offeranden verstaan; zie Lev 3:11 , en Lev 21:6 ; Num 28:2 ; Eze 44:7 ."},{"catchword":"ziel zijn,","tekst":"Dat is, hunne spijs, hun eten en drinken, hunne maaltijden, zullen alsdan, in hunne ballingschap, wezen over hunne doden, die zij verloren hebben, of als over hunne doden, [vergelijk Eze 24:17 ,] dewijl zij in gedurigen rouw zullen leven, en overzulks onrein zijn. Alzo wordt het woord ziel genomen voor een dood lichaam of een dode, Psa 16:10 ; Lev 19:28 ; zie de aantekening aldaar. Anders: voor hun eigen personen, of voor henzelven; [gelijk het Hebreeuwse word ook genomen wordt] dat is, zij eten en drinken voor zichzelven, maar niet mij ter ere [gelijk boven Hos 8:13 ] ; dewijl enigen verstaan dat in vs.4 niet gesproken wordt van den staat der ballingschap, maar van hetgeen de Israëlieten nu deden en tot de ballingschap toe doen zouden. Vergelijk Zec 7:5-6 ."},{"catchword":"niet komen","tekst":"Dat is, zulks, als zijnde onrein, mag men in Gods huis niet brengen, noch daarvan offeren."}],"5":[{"catchword":"gezetten hoogtijdsdag,","tekst":"Wanneer men naar mijn gebod voor mij moest offeren met vreugde, daar gij zonder offer en in rouw zult zitten buiten uw land; zie Num 10:10 , en Deu 12:12 , enz., en vergelijk boven Hos 3:4 , en de aantekening op vs.4."}],"6":[{"catchword":"gaan daarhenen","tekst":"Dat is, zullen voorzeker uit hun land moeten weggaan; of zij gaan heen, dat is zij gaan verloren, of verdwijnen."},{"catchword":"verstoring;","tekst":"Die de Assyriër zou aanrichten."},{"catchword":"Egypte zal ze verzamelen,","tekst":"Uit deze woorden schijnt afgenomen te kunnen worden dat er een gedeelte van Israël voor den Assyriër zou vluchten naar Egypte, menende aldaar wel ontvangen en geholpen te zullen worden, omdat zij den Assyriër verlatende met den koning van Egypte gehandeld hadden; zie boven Hos 8:13 , maar hoe zij daarover zouden varen, wordt hun hier geprofeteerd. Sommigen gissen dat zij eerst tot die van Juda, daarna met hen naar Egypte getogen zijn."},{"catchword":"Mof zal","tekst":"De stad Memfis in Egypte, anders [naar sommiger gevoelen] ook genoemd Nof, Isa 19:13 ; zie de aantekening aldaar."},{"catchword":"begraven;","tekst":"En vervolgens zullen zij in hun land niet wederkeren, maar in ballingschap omkomen."},{"catchword":"begeerte zal er zijn naar hun zilver,","tekst":"Men zal hun geld zoeken en roven. Of, de pleizierige [plaatsen], of gewenste [schatten] van hun zilver, die zal de netel erfelijk bezitten; begeerte voor begeerlijke dingen, die uit zilver waren, of met zilver sieraad gepronkt."},{"catchword":"netelen zullen hen erfelijk bezitten,","tekst":"Hebreeuws, netel; dat is, hun land en woonplaatsen zullen lang woest liggen en onbewoond blijven. Vergelijk Isa 32:13 , en Isa 34:13 , en onder Hos 10:8 . Door de mensen versta, hun land of plaatsen waar zij gewoond hebben; zie Jdg 11:23 ; Jer 49:1 met de aantekening."},{"catchword":"doornen","tekst":"Hebreeuws, doorn, of distel; vergelijk Job 31:40 ; Isa 5:6 , en Isa 7:24 ."},{"catchword":"tenten zijn","tekst":"Ter plaatse waar hun heerlijke woningen zullen geweest zijn."}],"7":[{"catchword":"gewaar worden;","tekst":"Of, weten, bekennen; dat is, alsdan daaraan gedenken en bevinden dat hun de waarheid gezegd is en dat hun valse profeten hen bedrogen hebben. Waarvan in het volgende."},{"catchword":"profeet is een dwaas,","tekst":"De valse profeten, die aan het volk vrede en voorspoed profeteren."},{"catchword":"man des geestes is onzinnig;","tekst":"De profeet, die zich valselijk beroemt van Gods Geest gedreven te worden, of geestelijke gezichten en openbaringen van God te hebben; vergelijk Eze 13:3 . Hier zegt God zelf van de valse profeten hetgeen de verleiders en wereldse mensen ten onrechte plegen te zeggen van God ware profeten; zie 2Ki 9:11 , en Jer 29:26 , enz. Anders: de man des winds; dat is, die met ijdelheid en leugen omgaat. Vergelijk Mic 2:11 ."},{"catchword":"haat ook groot","tekst":"Dit kan men verstaan van Efraïms groten haat of wederstand, wreveligheid, wederspannigheid tegen God en zijn heilig woord, of van Gods haat, die tegen Efraïm groot is, dien Hij betonen zal in de voorgemelde dagen der bezoeking en vergelding, en waaruit ook voortkomt dat Hij hen straft door valse profeten."}],"8":[{"catchword":"De wachter van Efraïm","tekst":"De ware profeten, die God onder de tien stammen heeft verwekt, houden bestendiglijk en vast aan mijnen God en zijn reinen dienst; gelijk Elia, Elisa en anderen gedaan hebben, en ik ook doe. Zie van dezen titel der profeten Eze 3:17 , en vergelijk wijders Jer 12:3 , en onder Hos 12:1 ; idem de manier van spreken, met God te wandelen, Gen 5:22 . Zie de aantekening aldaar. Anders: Is er een wachter Efraïms met mijnen God, de profeet is een vogelvangers strik op al deszelfs wegen. Anders: Efraïms wachter [behoorde] met mijnen God [te zijn], maar, enz. Anders: hij [de valse profeet, waarvan in vs.7] houdt wacht tegen Efraïm [die] met mijnen God [is]; dat is, hij loert op de Israëlieten, die het met God en zijn reinen godsdienst nog houden. Zie 1Ki 19:18 , waarop het volgende ook niet kwalijk past. Vergelijk boven Hos 5:1-2 en de aantekening aldaar."},{"catchword":"profeet","tekst":"Versta, de valse profeten, waarvan in het voorgaande is gesproken."},{"catchword":"vogelvangersstrik,","tekst":"Dit kan men duiden op het geestelijk vangen en verstrikken der zielen, en van het lichamelijk loeren, betrappen, vangen en moorden der vromen, gelijk in de voorgaande aantekening is vermeld."},{"catchword":"zijn wegen,","tekst":"Op alle straten en wegen in Israël; of, in al zijn eigen doen en handel is de valse profeet niets anders dan een strik, enz."},{"catchword":"haat","tekst":"Die met recht van God en alle vromen gehaat is, en niet dan Gods haat tegen Israël [boven Hos 8:1 , genoemd des Heeren huis ] door al zijne verleiding en goddelozen handel verwekt en veroorzaakt."},{"catchword":"zijns Gods","tekst":"Efraïm, of des getrouwen wachters, van wien in het begin van vs.8 gesproken is."}],"9":[{"catchword":"zeer diep verdorven,","tekst":"Hebreeuws, zij hebben verdiept, zij hebben verdorven; zie van zulke samenvoeging van twee woorden Psa 45:5 , en van het Hebreeuwse woord boven Hos 5:2 ."},{"catchword":"Gibea;","tekst":"Gelijk die van Benjamin te Gibea tot gruwelijke boosheid vervallen waren, en een iegelijk in Israël deed wat hij wilde; zie de historie, Jdg 19 , en vergelijk onder Hos 10:9 ."},{"catchword":"gedenken,","tekst":"Gelijk boven Hos 8:13 , zie aldaar."}],"10":[{"catchword":"druiven in de woestijn,","tekst":"Dat is, toen Ik Israël eerst tot mijn volk aannam, waren zij mij zo aangenaam als een wandelaar druiven zijn, die hij vindt in een woestijn, en zo zoet als de eerste rijpe vijgen aan den vijgeboom; vergelijk Mic 7:1 ."},{"catchword":"Baäl-peor,","tekst":"Der Moabieten afgod, om met hem geestelijk overspel of hoererij te bedrijven, waarop de lichamelijke ontucht gevolgd is. Zie Num 25:1-3 , enz. en de navolging van dit voorbeeld hunner voorvaders; 1Ki 18:31-32 , enz."},{"catchword":"zonderden zich af","tekst":"Met een bijzondere afgodische voorbereiding tot den religieusen dienst van dezen afgod. Het Hebreeuwse woord is hetzel d Levt.19.28. See the annot. There Oth for their own person, or for themselves( as the Heb word is likewise taken) that is they eat amnd drink for themselves, and not to honour God thereby (as ab. Ch.8. 13.) because some do understand that this verse doth not speak of the condition of their file, but what the Israelites were a doing new, and would do, until that time . Compare Zach .7.5,6.] it shall not come into the LORDS house.[i.e. the same being unclean may not be brought into the house of God, nor ought to be offered at all.]"}],"5":[{"catchword":null,"tekst":"What would yo do (then) upon a High &acirc;&euro;&ldquo; times &acirc;&euro;&ldquo; day, or upon a Feast &acirc;&euro;&ldquo; day of the LORD? [ To wit, when according to my precept ye should before me with cheerfulness, when as ye shall sit mourning then, and may not offer, and are without your land, and cannot. See Num 10:10. and Deut.12.12, etc. and comp.ab. chap.3. verse 4. and the annotat. On the former verse.]"}],"6":[{"catchword":null,"tekst":"For lo, they pass&Atilde;&copy; away [i.e. they shall surely be outed out of their land; Or they pass away, i.e. they perish, vanish away] because of the destruction: [to be made by that Assyrian] Egypt shall assemble them; [from these words it may be conjectured, that some of the Israelites flying before the Assyrians should betake themselves for shelter to Egypt, conceiving they should finde good entertainment and assistance there, forasmuch as they had forsaken the Assyrian, and adhered to the king of Egypt. See ab.ch.8.on vers 13. But how they should speed there, is foretold them here in the following words. Some are opinion, that first they retired among those of Juda, and afterwards together with them into Egypt] Moph [ the city of Memphis in Egypt, otherwise (as some think) also calleth Nop, Isa 19:13. See the annot there.] shall them; [and consequently they shall not return into their own land, but die and perish in exile] their silver shall be desired aster, [i.e. their money shall be greedily sought for, and preyed upon] nettles shall hereditarily possee them; [Heb. Nettle etc., their land and habitation shall lie waste for a long time, and remain without inhabitation shall lie waste for long time, and remain without inhabitant. Compare Isa 32.13. and 34.13. and bel. Chap.10. verse.8.By them, viz. men understand their land places of abode. See Judg.11.23. Jer 49:1. with the annotat. Others read, the pleasant (places ) or desired (shadows) of their silver, the nettle shall possess hereditarily. Desires, for desirable things made silver, or silver, or set forth, adormed with silver dressing of furniture] thorns shall be in their tents. [in stead of the stately dwellings they had there. Hebr. thorn or thistle. Compare Job 31:40 Isa 5:6. and 7.14.]"}],"7":[{"catchword":null,"tekst":"The days of visitation are come, the dayes of recompense are come; they of Israel shall perceive it: [Or, know, acknowledge it, i.e. remember and find then, that the truth was told them, and that they were deceived by their false prophets, whereof in the sequel] the prophet is a fool [ meaning the false prophet prophesying nothing but peace and prosperity] the man of the spirit [i.e. the prophet which falsely boateth to be inspired by the holy spirit, to have spiritual visions or revalations from God. Compare Eze 13:0.] is mad; [Here God himself averreth that the false prophets, that the seducers, and wordly men use to say ubusively to God true prophets. See 2 Kings 9.11. and Jer 29:26, etc. Oth the man of the winde i.e. he that practiseth vanity and lies Compare Mich 2.11.] because of the greatness of your iniquity, the hatred also is great. [This may be understood of Ephraims great hatred, or obstinacy, violence, contrariousness, against God and his word; or of Gods hatred, which was great against Ephraim, and which he would shew forth in the foresaid dayes of visitation and recompence, and whence also it come, that God punished them (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
