 hen zijn als treurbrood; allen die daarvan zouden eten, zouden onrein worden; want hun brood zal voor henzelf zijn, het zal niet in het huis van de Heere komen.", "5": "Wat zult u dan doen op een vastgestelde hoogtijdsdag, en op een feestdag van de Heere?", "6": "Want zie, zij gaan weg vanwege de verwoesting; Egypte zal ze verzamelen, Memfis zal ze begraven; hun begeerlijke plaatsen voor hun zilver zullen door netels bezet worden, doornen zullen in hun tenten zijn.", "7": "De dagen van de vergelding[1] zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "8": "De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.", "9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "10": "Ik vond Israël als druiven in de woestijn, Ik zag uw vaders als de eerste vrucht aan de vijgenboom in haar begintijd; maar zij gingen naar Baäl-peor, en zonderden zich af tot die schande, en werden helemaal verfoeilijk, net als datgene wat zij liefhadden.", "11": "Wat Efraïm aangaat, hun heerlijkheid zal wegvluchten als een vogel; vanaf de geboorte, en vanaf de moederschoot, en vanaf de ontvangenis af.", "12": "Ofschoon zij hun kinderen mochten grootbrengen, Ik zal hen er toch van beroven, zodat er geen mens over zal blijven; want ook, wee hun, wanneer Ik van hen zal zijn weggegaan!", "13": "Efraïm is, zoals Ik Tyrus aanzag, geplant in een aangename woonplaats; maar Efraïm zal zijn kinderen moeten uitbrengen naar de moordenaar.", "14": "Geef hun, Heere! Wat zult U geven? Geef hun een baarmoeder die een miskraam krijgt, en uitdrogende borsten.", "15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "16": "Efraïm is geslagen, hun wortel is verdord, zij zullen geen vrucht voortbrengen; ja, ofschoon zij kinderen zouden krijgen, zo zal Ik toch de gewenste vruchten van hun buik doden.", "17": "Mijn God zal ze verwerpen, omdat zij niet naar Hem luisteren; en zij zullen zwervend zijn onder de heidenvolken."}, "SV": {"1": "Verblijd u niet, o Israël! tot opspringens toe, gelijk de volken; want gij hoereert van uw God af; gij hebt hoerenloon lief, op alle dorsvloeren des korens.", "2": "De *dors* vloer en de wijnkuip zal henlieden niet voeden; en de most zal hun liegen.", "3": "Zij zullen in des Heeren land niet blijven; maar Efraïm zal weder tot Egypte keren, en zij zullen in Assyrië het onreine eten.", "4": "Zij zullen den Heere geen drankofferen doen van wijn, ook zouden zij Hem niet zoet zijn, hun offeranden zouden hun zijn als treurbrood; allen, die dat zouden eten, zouden onrein worden; want hun brood zal voor hun ziel zijn, het zal in des Heeren huis niet komen.", "5": "Wat zult gijlieden *dan* doen op een gezetten hoogtijdsdag, en op een feestdag des Heeren?", "6": "Want ziet, zij gaan daarhenen vanwege de verstoring; Egypte zal ze verzamelen, Mof zal ze begraven; begeerte zal er zijn naar hun zilver, netelen zullen hen erfelijk bezitten, doornen zullen in hun tenten zijn.", "7": "De dagen der bezoeking zijn gekomen, de dagen der vergelding zijn gekomen; die van Israël zullen het gewaar worden; de profeet is een dwaas, de man des geestes is onzinnig; om de grootheid uwer ongerechtigheid is de haat ook groot.", "8": "De wachter van Efraïm is met mijn God, *maar* de profeet is een vogelvangersstrik, op al zijn wegen, een haat in het huis zijns Gods.", "9": "Zij hebben zich zeer diep verdorven, als in de dagen van Gibea; Hij zal hunner ongerechtigheid gedenken, Hij zal hun zonden bezoeken.", "10": "Ik vond Israël als druiven in de woestijn, Ik zag uw vaderen als de eerste vrucht aan den vijgeboom in haar beginsel; *maar* zij gingen in *tot* Baäl-peor, en zonderden zich af tot die schaamte, en werden gans verfoeilijk naar hun boelerij.", "11": "Aangaande Efraïm, hunlieder heerlijkheid zal wegvlieden als een vogel; van de geboorte, en van *moeders* buik, en van de ontvangenis af.", "12": "Ofschoon zij hun kinderen mochten groot maken, Ik zal er hen toch van beroven, dat zij onder de mensen niet zullen zijn; want ook, wee hun, als Ik van hen zal geweken zijn!", "13": "Efraïm is, gelijk als Ik Tyrus aanzag, die geplant is in een liefelijke woonplaats; maar Efraïm zal zijn kinderen moeten uitbrengen tot den doodslager.", "14": "Geef hun, Heere! Wat zult Gij geven? Geef hun een misdragende baarmoeder, en uitdrogende borsten.", "15": "Al hun boosheid is te Gilgal, want daar heb Ik ze gehaat, om de boosheid van hun handelingen; Ik zal ze uit Mijn huis uitdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "16": "Efraïm is geslagen, hunlieder wortel is verdord, zij zullen geen vrucht voortbrengen; ja, ofschoon zij genereerden, zo zal Ik toch de gewenste *vruchten* van hun buik doden.", "17": "Mijn God zal ze verwerpen, omdat zij naar Hem niet horen; en zij zullen omzwervende zijn onder de heidenen."}, "KJV": {"1": "Rejoice not, O Israel, for joy, as *other* people: for thou hast gone a whoring from thy God, thou hast loved a reward upon every cornfloor.", "2": "The floor and the winepress shall not feed them, and the new wine shall fail", "3": "They shall not dwell in the LORD'S land; but Ephraim shall return to Egypt, and they shall eat unclean *things* in Assyria.", "4": "They shall not offer wine *offerings* to the LORD, neither shall they be pleasing unto him: their sacrifices *shall be* unto them as the bread of mourners; all that eat thereof shall be polluted: for their bread for their soul shall not come into the house of the LORD.", "5": "What will ye do in the solemn day, and in the day of the feast of the LORD?", "6": "For, lo, they are gone because of destruction: Egypt shall gather them up, Memphis shall bury them: the pleasant *places* for their silver, nettles shall possess them: thorns *shall be* in their tabernacles.", "7": "The days of visitation are come, the days of recompence are come; Israel shall know *it*: the prophet *is* a fool, the spiritual man *is* mad, for the multitude of thine iniquity, and the great hatred.", "8": "The watchman of Ephraim *was* with my God: *but* the prophet *is* a snare of a fowler in all his ways, *and* hatred in the house of his God.", "9": "They have deeply corrupted *themselves*, as in the days of Gibeah: *therefore* he will remember their iniquity, he will visit their sins.", "10": "I found Israel like grapes in the wilderness; I saw your fathers as the firstripe in the fig tree at her first time: *but* they went to Baalpeor, and separated themselves unto *that* shame; and *their* abominations were according as they loved.", "11": "*As for* Ephraim, their glory shall fly away like a bird, from the birth, and from the womb, and from the conception.", "12": "Though they bring up their children, yet will I bereave them, *that there shall* not *be* a man *left*: yea, woe also to them when I depart", "13": "Ephraim, as I saw Tyrus, *is* planted in a pleasant place: but Ephraim shall bring forth his children to the murderer.", "14": "Give them, O LORD: what wilt thou give? give them a miscarrying womb and dry breasts.", "15": "All their wickedness *is* in Gilgal: for there I hated them: for the wickedness of their doings I will drive them out of mine house, I will love them no more: all their princes *are* revolters.", "16": "Ephraim is smitten, their root is dried up, they shall bear no fruit: yea, though they bring forth, yet will I slay *even* the beloved *fruit* of their womb.", "17": "My God will cast them away, because they did not hearken unto him: and they shall be wanderers among the nations."}}, "tsk": {"1": [{"kopje": "Ver disp": "Ezech 4:13", "href": "../../ezechiel/4/#v13", "ref": "Ezech 4:13", "svLabel": null}, {"disp": "Ezech 5:10", "href": "../../ezechiel/5/#v10", "ref": "Ezech 5:10", "svLabel": null}, {"disp": "Ezech 5:12", "href": "../../ezechiel/5/#v12", "ref": "Ezech 5:12", "svLabel": null}, {"disp": "Ezech 20:23", "href": "../../ezechiel/20/#v23", "ref": "Ezech 20:23", "svLabel": null}, {"disp": "Ezech 36:19", "href": "../../ezechiel/36/#v19", "ref": "Ezech 36:19", "svLabel": null}, {"disp": "Dan 9:7", "href": "../../daniel/9/#v7", "ref": "Dan 9:7", "svLabel": null}, {"disp": "Joh 7:35", "href": "../../johannes/7/#v35", "ref": "Joh 7:35", "svLabel": null}, {"disp": "Hand 2:5", "href": "../../handelingen/2/#v5", "ref": "Hand 2:5", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Spr 24:22": "Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?", "Jer 3:8": "En Ik zag, toen Ik vanwege alles waarin het afgekeerde Israël overspel had gepleegd, haar had weggestuurd en haar een scheidbrief had gegeven, dat de trouweloze Juda, haar zuster, niet vreesde, maar wegging en zelf ook hoereerde.", "Jes 51:17-20": "Word wakker, word wakker, sta op, Jeruzalem! U die gedronken hebt uit de hand van de HEERE de beker van Zijn grimmigheid; de droesem van de beker van de zwijmeling hebt u gedronken, ja, uitgezogen. Er is niemand van al de kinderen, die zij gebaard heeft, die haar zachtjes leidt; en niemand van al de kinderen, die zij opgevoed heeft, die haar bij de hand grijpt. Deze twee dingen zijn u overkomen, wie heeft medelijden met u? Er is verwoesting, en verbreking, en honger, en zwaard, door wie zal Ik u troosten?", "Jer 5:5": "Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, en de banden verscheurd.", "Jer 1:16": "En Ik zal Mijn oordelen tegen hen uitspreken over al hun slechtheid; dat zij Mij verlaten hebben, en voor andere goden reukwerk verbrand hebben, en zich gebogen hebben voor de werken van hun handen.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "Jes 32:7": "En het hele gereedschap van een gierigaard is kwaad; hij bedenkt schandelijke plannen, om de ellendigen te gronde te richten met valse woorden, ook als de arme spreekt wat recht is.", "Joh 10:5": "Maar een vreemde zullen zij nooit volgen, maar zij zullen van hem wegvluchten; omdat zij de stem van de vreemden niet kennen.", "Joh 6:70": "Jezus antwoordde hun: Heb Ik u niet twaalf uitgekozen? En één van u is een duivel.", "Joh 10:10-13": "De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben. Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen. Maar de huurling, die geen herder is, van wie de schapen niet zelf zijn, ziet de wolf komen, en verlaat de schapen, en vlucht; en de wolf grijpt ze, en verstrooit de schapen.", "Luk 17:26-29": "En zoals het gebeurde in de dagen van Noach, zo zal het ook zijn in de dagen van de Zoon des mensen. Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf. Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Hos 14:2": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Jes 54:5": "Want uw Maker is uw Man, HEERE van de heerscharen is Zijn Naam; en de Heilige van Israël is uw Verlosser; Hij zal de God van de hele aardbodem genoemd worden.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Micha 6:14": "U zult eten, maar niet verzadigd worden, en uw neergedrukte honger zal in uw midden blijven; en u zult aangrijpen, maar niet wegbrengen, en wat u zult wegbrengen, zal Ik aan het zwaard overgeven.", "Jes 43:1-4": "Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij. Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken. Want Ik ben de HEERE, uw God, de Heilige van Israël, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven tot uw losgeld in uw plaats.", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Rom 11:28": "Zo zijn zij wel vijanden aangaande het Evangelie, om uwentwil, maar aangaande de verkiezing zijn zij geliefden, om de vaderen wil;", "Ps 78:62": "En Hij leverde Zijn volk over aan het zwaard, en werd verbolgen tegen Zijn erfenis.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Hos 13:8": "Ik ontmoette hen als een berin die van haar jongen beroofd is, en scheurde het omhulsel van hun hart open; en Ik verslond hen daar als een leeuw; het wilde dier van het veld verscheurde hen.", "Jer 33:24-26": "Hebt u niet gezien wat dit volk zegt: De twee geslachten die de HEERE verkozen had, die heeft Hij nu verworpen? Ja, zij versmaden Mijn volk, zodat het geen volk meer is voor hun aangezicht. Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld; Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "1 Kor 3:1-4": "En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus. Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet. Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?", "Matt 18:1-4": "Op datzelfde moment kwamen de discipelen naar Jezus en zeiden: Wie is toch de belangrijkste in het Koninkrijk der hemelen? En Jezus riep een kind bij Zich en zette het in hun midden, en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan.", "Hos 7:9": "Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid over hem verspreid, en hij merkt het niet.", "Deut 14:2": "Want u bent een heilig volk voor de HEERE, uw God; en de HEERE heeft u uitgekozen om Hem tot een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn.", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "Amos 4:5": "En laat rook opgaan van het gedesemde als een lofoffer, en roep vrijwillige offers uit, laat het horen; want zo hebt u het graag, kinderen van Israël! spreekt de Heere HEERE.", "Jer 6:30": "Men noemt hen een verworpen zilver; want de HEERE heeft hen verworpen.", "Ps 55:21": "Hij slaat zijn handen aan hen die vrede met Hem hadden; hij ontheiligt Zijn verbond.", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Jes 59:2-8": "Maar uw ongerechtigheden brengen een scheiding tussen u en uw God, en uw zonden verbergen Zijn aangezicht voor u, zodat Hij niet hoort. Want uw handen zijn met bloed bevlekt, en uw vingers met ongerechtigheid; uw lippen spreken valsheid, uw tong spreekt onrecht uit. Er is niemand die om gerechtigheid roept, en niemand die zich voor de waarheid in het gericht begeeft; zij vertrouwen op ijdelheid en spreken leugen; met moeite zijn zij zwanger, en zij baren ongerechtigheid.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Ef 5:11": "En heb geen gemeenschap met de onvruchtbare werken van de duisternis, maar bestraf ze veeleer.", "1 Tim 5:6": "Maar wie haar lust volgt, die is levend gestorven.", "Ps 105:6": "U, nakomelingen van Abraham, Zijn knecht, u, kinderen van Jakob, Zijn uitverkorene!", "2 Kon 7:19": "En die hoofdman had de man Gods geantwoord en gezegd: Zie, al zou de HEERE vensters in de hemel maken, zou het dan ook naar dit woord kunnen gebeuren? En hij had gezegd: Zie, u zult het met uw ogen zien, maar daarvan niet eten.", "Joh 7:19": "Heeft Mozes u niet de wet gegeven? En niemand van u doet de wet. Waarom probeert u Mij te doden?", "Lev 26:24": "Dan zal Ik ook tegen u in gaan, en Ik zal u ook zevenvoudig over uw zonden slaan.", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Rom 3:10-18": "zoals geschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt. Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is zelfs niet één.", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Richt 19:22-30": "Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem bekennen. En de man, de heer van het huis, ging naar hen toe naar buiten, en zei tegen hen: Nee, mijn broeders, doe toch zo'n kwaad niet; omdat deze man in mijn huis gekomen is, doe zo'n dwaasheid niet. Zie, mijn dochter die maagd is, en zijn bijvrouw, die zal ik nu naar buiten brengen, opdat u hen schendt, en met hen doet wat goed is in uw ogen; maar doe aan deze man zo'n dwaze zaak niet.", "Jes 1:4-7": "Wee het zondige volk, het volk van zware ongerechtigheid, het nageslacht van de boosdoeners, de verdervende kinderen! Zij hebben de HEERE verlaten, zij hebben de Heilige van Israël gelasterd, zij hebben zich vervreemd, wijkende achterwaarts. Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat. Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "1 Kor 5:13": "Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Ezech 5:12": "Een derde deel van u zal door de pest sterven, en zal door honger in het midden van u omkomen; en een derde deel zal door het zwaard vallen rondom u; en een derde deel zal Ik naar alle windrichtingen verstrooien, en Ik zal het zwaard achter hen uittrekken.", "Ps 55:13-15": "Want het is geen vijand die mij hoont, anders zou ik het hebben gedragen; het is mijn hater niet die zich tegen mij groot maakt, anders zou ik mij voor hem verborgen hebben. Maar u bent het, o mens, als van mijn eigen stand, mijn leidsman en mijn bekende! Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Spr 28:4": "Wie de wet verlaten, prijzen de goddelozen; maar wie de wet bewaren, gaan de strijd met hen aan.", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "Zach 11:5": "Die hen bezitten doden hen, en houden het niet voor schuld; en ieder van hen die ze verkopen, zegt: Geloofd zij de HEERE, dat ik rijk geworden ben! En niemand van hen die ze weiden, ontziet ze.", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "Ps 114:2": "Werd Juda tot Zijn heiligdom, Israël Zijn volkomen heerschappij.", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Jes 24:6": "Daarom verteert de vloek het land, en zij die daarin wonen, zullen verwoest worden; daarom zullen de inwoners van het land verbrand worden, en er zullen weinig mensen overblijven.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Jes 1:22": "Uw zilver is geworden tot schuim; uw wijn is vermengd met water.", "Jes 32:5": "De dwaas zal niet meer milddadig genoemd worden, en de gierige zal niet meer mild geheten worden.", "Jer 13:20": "Hef uw ogen op, en zie hen die daar uit het noorden komen! Waar is de kudde die u gegeven was, de schapen van uw heerlijkheid?", "Jak 1:1": "Jakobus, een dienstknecht van God en van de Heere Jezus Christus, aan de twaalf stammen die in de verstrooiing zijn: gegroet.", "Ps 10:4-11": "De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is. Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg. Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Tit 3:3": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Matt 13:22": "En die in de doornen bezaaid is, dit is degene die het woord hoort; en de zorgen van deze wereld en de verleiding van de rijkdom verstikken het woord, en het wordt onvruchtbaar.", "1 Kor 3:10-16": "Naar de genade van God, die mij gegeven is, heb ik als een wijs bouwmeester het fundament gelegd; en een ander bouwt daarop. Maar ieder ziet toe hoe hij daarop bouwt. Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus. En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;", "Spr 21:27": "Het offer van de goddelozen is een gruwel; hoeveel te meer, als zij het met een schandelijk voornemen brengen!", "Matt 23:4": "Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Spr 15:21": "De dwaasheid is voor de verstandeloze een blijdschap; maar een man van verstand gaat recht zijn weg.", "2 Kon 4:43": "Doch zijn dienaar zei: Wat, zou ik dit aan honderd mannen voorzetten? En hij zei: Geef aan het volk, zodat zij eten; want zo zegt de HEERE: Men zal eten en overhouden.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Richt 6:32": "Daarom noemde hij hem op die dag Jerubbaäl, en zei: Laat Baäl tegen hem strijden, omdat hij zijn altaar heeft omgeworpen.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Jer 27:9-18": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen. Want zij profeteren u leugens, om u ver uit uw land weg te brengen, en dat Ik u wegjaag, en u omkomt. Maar het volk dat zijn hals onder het juk van de koning van Babel zal brengen, en hem dienen, dat zal Ik in zijn land laten blijven, spreekt de HEERE, en het zal het bebouwen en erin wonen.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Jer 15:1-14": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan. En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap! Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Ezech 33:30-32": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt. En zij komen tot u, zoals het volk gewoon is te komen, en zitten voor uw aangezicht als Mijn volk, en horen uw woorden, maar zij doen ze niet; want zij spreken lieve woorden met hun mond, maar hun hart gaat hun hebzucht na. En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "Jes 54:6": "Want de HEERE heeft u geroepen, als een verlaten vrouw en bedroefde van geest; toch bent u de huisvrouw van de jeugd, hoewel u versmaad bent geweest, zegt uw God.", "Job 8:13-15": "Zo zijn de wegen van allen die God vergeten; en de verwachting van de huichelaar zal vergaan. Van wie zijn hoop walgen zal; en zijn vertrouwen zal zijn als het huis van een spin. Hij zal op zijn huis leunen, maar het zal niet bestaan; hij zal zich eraan vasthouden, maar het zal niet staande blijven.", "Job 31:33": "Als ik, net als Adam, mijn overtredingen bedekt heb, door eigenliefde mijn misdaad verbergende!", "Jes 24:7-12": "De most treurt, de wijnstok kwijnt weg, allen die blijhartig waren, zuchten. De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust. Zij zullen geen wijn drinken met gezang; de sterke drank zal bitter zijn voor hen die hem drinken.", "Jes 40:24": "Ja, zij worden niet geplant, ja, zij worden niet gezaaid, ja, hun afgehouwen stam wortelt niet in de aarde; ook als Hij op hen waait, zullen zij verdorren, en een stormwind zal hen als een stoppel wegnemen.", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Amos 6:3-7": "U, die de kwade dag ver weg zet, en de zetel van het geweld dichtbij brengt. Die daar liggen op ivoren bedsteden, en weelderig zijn op hun rustbanken, en de lammeren van de kudde eten, en de kalveren uit het midden van de meststal. Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Jer 51:19": "Jakobs deel is niet gelijk aan hen; want Hij is de Formeerder van alles, en Israël is de stam van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "Job 30:7": "Zij schreeuwden tussen de struiken; onder de netels verzamelden zij zich.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Matt 6:5": "En wanneer u bidt, wees dan niet zoals de geveinsden; want die bidden graag terwijl ze in de synagogen en op de hoeken van de straten staan, opdat zij door de mensen gezien worden. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.", "Jes 30:10": "Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.", "Ps 78:11": "En zij vergaten Zijn daden, en Zijn wonderen, die Hij hun had laten zien.", "Amos 6:6": "Die wijn uit schalen drinken, en zich zalven met de beste olie, maar zich niet bekommeren over de verbreking van Jozef.", "Mark 10:35-37": "En Jakobus en Johannes, de zonen van Zebedeüs, kwamen naar Hem toe, en zeiden: Meester, wij zouden graag willen dat U voor ons deed wat wij ook zullen vragen. En Hij zei tegen hen: Wat wilt u dat Ik voor u doe? En zij zeiden tegen Hem: Geef ons dat wij mogen zitten, de één aan Uw rechterhand, en de ander aan Uw linkerhand, in Uw heerlijkheid.", "Spr 13:2": "Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Lev 25:38": "Ik ben de HEERE, uw God, Die u uit het land Egypte geleid heb, om u het land Kanaän te geven, opdat Ik u tot een God ben.", "Gen 46:3": "En Hij zei: Ik ben die God, de God van uw vader; wees niet bang om af te trekken naar Egypte; want Ik zal u daar tot een groot volk maken.", "Spr 27:7": "Een verzadigde ziel vertrapt de honingraat; maar voor een hongerige ziel is alles wat bitter is, zoet.", "Lev 22:32": "En u zult Mijn heilige Naam niet ontheiligen, opdat Ik in het midden van de kinderen van Israël geheiligd word; Ik ben de HEERE, Die u heiligt!", "Jes 9:12": "Want dit volk keert zich niet tot Hem, Die het slaat, en de HEERE van de heerscharen zoeken zij niet.", "Richt 10:12-14": "En de Sidoniërs, de Amalekieten en de Maonieten, die u onderdrukten toen u tot Mij riep, heb Ik u toen niet uit hun hand verlost? Toch hebt u Mij verlaten, en andere goden gediend; daarom zal Ik u niet meer verlossen. Ga heen, roep tot de goden die u hebt uitgekozen; laten die u verlossen in de tijd van uw benauwdheid.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "Joh 8:34": "Jezus antwoordde hun: Voorwaar, voorwaar, Ik zeg u: Ieder die de zonde doet, is een dienstknecht van de zonde.", "Matt 21:41": "Zij zeiden tegen hem: Hij zal die kwaden een kwade dood laten sterven, en de wijngaard verhuren aan andere landbouwers, die hem de vruchten op de juiste tijd zullen geven.", "Jak 1:14": "Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Hos 5:4": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet.", "Jer 8:1-22": "In die tijd, spreekt de HEERE, zullen ze de beenderen van de koningen van Juda, en de beenderen van hun vorsten, en de beenderen van de priesters, en de beenderen van de profeten, en de beenderen van de inwoners van Jeruzalem, uit hun graven halen. En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn. En de dood zal boven het leven verkozen worden, door heel het overblijfsel van hen die overgebleven zijn uit dit boze geslacht, in al de plaatsen van de overgeblevenen, waarheen Ik hen verdreven zal hebben, spreekt de HEERE van de heerscharen.", "Deut 28:32": "Uw zonen en uw dochters zullen aan een ander volk gegeven worden, terwijl uw ogen toekijken en de hele dag naar hen smachten; maar het zal niet in de macht van uw hand zijn.", "Matt 24:5": "Want velen zullen komen onder Mijn Naam en zeggen: Ik ben de Christus; en zij zullen velen misleiden.", "Ps 81:13": "Daarom heb Ik hen overgegeven aan het goeddunken van hun hart, zodat zij wandelden in hun eigen raadslagen.", "Spr 13:19": "De begeerte die vervuld wordt, is zoet voor de ziel; maar het is de dwazen een gruwel om van het kwade af te wijken.", "Mark 12:38-40": "En Hij zei tegen hen in Zijn onderwijs: Pas op voor de Schriftgeleerden, die graag in lange kleren willen rondlopen, en gegroet willen worden op de markten; en de voorste plaatsen willen hebben in de synagogen, en de ereplaatsen bij de maaltijden; die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Ezech 26:1": "En het gebeurde in het elfde jaar, op de eerste van de maand, dat het woord van de HEERE tot mij kwam en zei:", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "Hos 11:4": "Ik trok ze met mensenzelen, met touwen van liefde, en was voor hen als degenen die het juk van op hun kaken oplichten, en Ik reikte hem voedsel toe.", "Matt 5:19": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Ps 73:2-22": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Ps 78:68": "Maar Hij verkoos de stam van Juda, de berg Sion, die Hij liefhad.", "Ps 106:13": "Maar zij vergaten al snel Zijn werken, zij wachtten niet op Zijn raad.", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Deut 4:34": "Of: of God ooit beproefd heeft te gaan om Zich een volk uit het midden van een ander volk aan te nemen, door beproevingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekte arm, en met grote verschrikkingen; naar alles wat de HEERE, uw God, voor u in Egypte voor uw ogen gedaan heeft?", "Jes 28:7": "Maar ook dezen dwalen door de wijn, en zij dolen door de sterke drank; de priester en de profeet dwalen door de sterke drank; zij zijn verslonden door de wijn, zij dolen door sterke drank; zij dwalen in het zien van visioenen; zij waggelen in het rechtspreken.", "2 Kon 2:14": "En hij nam de mantel van Elia, die van hem afgevallen was, en sloeg het water, en zei: Waar is de HEERE, de God van Elia? Ja, Dezelfde? En hij sloeg het water, en het werd naar de ene en de andere kant verdeeld, en Elisa ging er door.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Matt 24:4": "En Jezus antwoordde en zei tegen hen: Kijk uit dat niemand u misleidt.", "Matt 22:12": "En hij zei tegen hem: Vriend! Hoe bent u hier binnengekomen zonder een bruiloftskleed aan te hebben? En hij verstomde.", "Spr 21:17": "Wie blijdschap liefheeft, die zal gebrek lijden; wie wijn en olie liefheeft, zal niet rijk worden.", "Jes 5:11-14": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft! En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Ezech 16:43": "Omdat u niet gedacht hebt aan de dagen van uw jeugd, en Mij tot beroering geweest bent met dit alles, zie, zo zal Ik ook uw weg op uw hoofd geven, spreekt de Heere HEERE; en u zult die schandelijke daad niet meer doen boven al uw gruwelen.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Gen 6:12": "Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.", "Micha 3:5-7": "Zo zegt de HEERE, tegen de profeten, die Mijn volk verleiden; die met hun tanden bijten, en vrede uitroepen; maar tegen hem die niet in hun mond geeft, tegen die heiligen zij een oorlog. Daarom zal het nacht voor u worden vanwege het visioen, en u zal duisternis zijn vanwege de waarzegging; en de zon zal over deze profeten ondergaan; en de dag zal over hen zwart worden. En de zieners zullen beschaamd, en de waarzeggers schaamrood worden; en zij zullen allen samen de bovenlip bewimpelen; want er zal geen antwoord van God zijn.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Joz 23:15": "En het zal gebeuren, zoals al die goede dingen over u gekomen zijn, die de HEERE, uw God, tot u gesproken heeft, zo zal de HEERE over u laten komen al die kwade dingen, totdat Hij u verdelgt van dit goede land, dat de HEERE, uw God, u gegeven heeft.", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Jer 7:12-34": "Want ga nu naar Mijn plaats die te Silo was, waar Ik Mijn Naam in het begin had laten wonen; en zie wat Ik daaraan gedaan heb vanwege de slechtheid van Mijn volk Israël. En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt; daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb.", "1 Tim 1:3-7": "Zoals ik u vermaand heb dat u in Efeze zou blijven, toen ik naar Macedonië reisde, zo vermaan ik het u nog, opdat u sommigen zou bevelen geen andere leer te leren; Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is. Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "Ps 90:1": "Een gebed van Mozes, de man van God. Heere! U bent ons geweest een Toevlucht van geslacht tot geslacht.", "1 Kor 7:29-31": "Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden; en zij die wenen, alsof zij niet weenden; en zij die blij zijn, alsof zij niet blij waren; en zij die kopen, alsof zij niet bezaten; en zij die deze wereld gebruiken, alsof zij die niet misbruikten; want de gedaante van deze wereld gaat voorbij.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "Jes 48:2": "Ja, van de heilige stad worden zij genoemd, en zij steunen op de God van Israël; HEERE van de heerscharen is Zijn Naam.", "Kol 3:12": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld;", "2 Petr 2:10": "maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren;", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "Openb 2:18": "En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "Luk 15:11-27": "En Hij zei: Een zeker mens had twee zonen. En de jongste van hen zei tegen de vader: Vader, geef mij het deel van het bezit, dat mij toekomt. En hij verdeelde onder hen het bezit. En niet veel dagen daarna heeft de jongste zoon alles bijeengebracht, en is weggereisd naar een ver land, en heeft daar zijn bezit doorgebracht, terwijl hij overdadig leefde.", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "Openb 2:20-23": "Maar Ik heb enkele weinige dingen tegen u, dat u de vrouw Izébel toelaat, die zichzelf een profetes noemt, te leren en Mijn dienstknechten te verleiden, zodat zij hoereren en afgodenoffer eten. En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd. Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Jes 7:13": "Toen zei hij: Hoor toch, u, huis van David! Is het u te weinig, dat u de mensen moe maakt, dat u ook mijn God moe maakt?", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "Jes 43:22": "Doch u hebt Mij niet aangeroepen, o Jakob! toen u zich tegen Mij vermoeid hebt, o Israël!", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "Hos 4:15": "Als u, Israël! wilt hoereren, laat Juda dan zeker niet schuldig worden; kom toch niet naar Gilgal, en ga niet op naar Beth-Aven, en zweer niet: Zo waarachtig als de Heere leeft.", "Jer 8:2": "En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn.", "2 Sam 3:35": "Daarna kwam al het volk om David brood te laten eten, terwijl het nog dag was; maar David zwoer: God moet mij zo doen, en er nog meer aan toevoegen, als ik vóór het ondergaan van de zon brood of iets anders smaak!", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Joh 15:19": "Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.", "Job 20:4-18": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft, Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "2 Kron 5:14": "En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Joël 3:20": "Maar Juda zal blijven tot in eeuwigheid, en Jeruzalem van geslacht tot geslacht.", "Deut 31:17": "Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is?", "Amos 2:4": "Zo zegt de HEERE: Om drie overtredingen van Juda, en om vier zal Ik dat niet afwenden; omdat zij de wet van de HEERE verworpen, en Zijn inzettingen niet bewaard hebben; en hun leugens hen verleid hebben, die hun vaders hebben nagevolgd.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Jes 11:11": "Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Jer 23:16": "Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Hos 5:1-3": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor. En zij die afwijken, verdiepen zich erin om te slachten; maar Ik zal hun allen een tuchtmeester zijn. Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "Tit 3:10": "Verwerp iemand die een ketter is, na de eerste en tweede vermaning;", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Jes 32:13": "Op het land van mijn volk zal de doorn en de distel opgaan; ja, op alle vreugdehuizen, in de vrolijk huppelende stad.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "Spr 4:16": "Want zij slapen niet, als zij geen kwaad gedaan hebben; en hun slaap wordt weggenomen, als zij niemand hebben doen struikelen.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Ezech 7:19": "Zij zullen hun zilver op de straten werpen, en hun goud zal tot onreinheid zijn; hun zilver en hun goud zal hen niet kunnen uithelpen ten dage van de verbolgenheid van de HEERE; hun ziel zullen zij niet verzadigen, en hun ingewanden zullen zij niet vullen; want het zal de aanstoot van hun ongerechtigheid zijn.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Job 15:33": "Men zal zijn onrijpe druiven afrukken, als van een wijnstok, en zijn bloeisel afwerpen, als van een olijfboom.", "Ezech 20:39": "En u, o huis van Israël, zo zegt de Heere HEERE: Gaat heen, dient ieder zijn drekgoden, ook hierna, omdat u naar Mij niet wilt horen; maar ontheiligt niet meer Mijn heilige Naam, met uw giften en met uw drekgoden.", "Spr 23:21": "Want een zuiper en een vraat zullen arm worden; en de sluimering doet iemand versleten kleren dragen.", "Gen 28:17": "En hij vreesde, en zei: Hoe ontzagwekkend is deze plaats! Dit is niets anders dan een huis van God, en dit is de poort van de hemel!", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Jer 31:14": "En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "Deut 32:25": "Van buiten zal het zwaard beroven, en uit de binnenkamers de verschrikking; ook de jongeling, ook de jonge dochter, het zuigende kind met de grijze man.", "Pred 2:1-12": "Ik zei in mijn hart: Nu, welaan, ik zal u beproeven door vreugde; laat daarom het goede genieten; maar zie, ook dat was ijdelheid. Tot het lachen zei ik: U bent onzinnig, en tot de vreugde: Wat maakt deze? Ik heb in mijn hart nagespeurd om mijn vlees op te houden in de wijn, (en toch mijn hart leidend in wijsheid) en om de dwaasheid vast te houden, totdat ik zou zien wat voor de kinderen van de mensen het beste zou zijn om te doen onder de hemel, gedurende het aantal dagen van hun leven.", "Spr 19:27": "Laat af, mijn zoon, om, terwijl u de tucht hoort, af te dwalen van de woorden van de kennis.", "Hos 7:10": "Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.", "Mal 1:6": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam?", "Amos 4:6-11": "Daarom heb Ik u ook reinheid van de tanden gegeven in al uw steden, en gebrek aan brood in al uw plaatsen; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Jer 32:31": "Want tot Mijn toorn en tot Mijn grimmigheid is Mij deze stad geweest, vanaf de dag dat zij haar gebouwd hebben tot op deze dag toe; zodat Ik haar van Mijn aangezicht wegdeed;", "Luk 11:46-52": "Maar Hij zei: Wee ook u, wetgeleerden! want u belast de mensen met lasten die zwaar zijn om te dragen, en zelf raakt u die lasten niet aan met één van uw vingers. Wee u, want u bouwt de graven van de profeten, en uw vaders hebben hen gedood. Zo getuigt u dus dat u instemt met de daden van uw vaderen; want zij hebben hen gedood, en u bouwt hun graven.", "Joh 12:43": "Want zij hadden de eer van mensen lief, meer dan de eer van God.", "Amos 4:4": "Kom naar Beth-el, en overtreed te Gilgal; maak veel van het overtreden, en breng uw offers 's morgens, uw tienden om de drie dagen!", "Jak 1:8": "Een dubbelhartig man is onstandvastig in al zijn wegen.", "Mal 1:6-14": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam? U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk. Want als u iets blinds aanbrengt om te offeren, is dat bij u niet kwaad; en als u iets kreupels of iets kranks aanbrengt, is dat niet kwaad! Breng dat toch aan uw vorst; zal hij welgevallen aan u hebben? of zal hij u gunstig ontvangen? zegt de HEERE van de heerscharen.", "Jes 17:10": "Want u hebt de God van uw heil vergeten, en niet gedacht aan de Rotssteen van uw sterkte; daarom zult u wel liefelijke planten planten, en die met uitheemse ranken bezetten;", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "Jes 11:15": "Ook zal de HEERE de inham van de zee van Egypte verbannen, en Hij zal Zijn hand bewegen tegen de rivier, door de sterkte van Zijn wind; en Hij zal die slaan in de zeven stromen, en Hij zal maken dat men er met schoenen doorheen zal gaan.", "Micha 7:7": "Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen.", "Deut 28:42": "Al uw geboomte, en de vrucht van uw land, zal het schadelijke gewormte in bezit nemen.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Matt 23:13": "Maar wee u, Schriftgeleerden en Farizeeën, huichelaars! Want u sluit het Koninkrijk der hemelen voor de mensen, want u gaat er zelf niet in, en degenen die er in willen gaan, laat u niet ingaan.", "Jer 17:1": "De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren;", "Rom 2:1": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.", "Hos 5:1": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor.", "Jer 7:8-10": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Matt 6:23": "maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!", "Hos 5:2": "En zij die afwijken, verdiepen zich erin om te slachten; maar Ik zal hun allen een tuchtmeester zijn.", "Hos 12:12": "Zeker is Gilead ongerechtigheid, zij zijn enkel ijdelheid; te Gilgal offeren zij ossen, ja, hun altaren zijn als steenhopen op de voren van de velden.", "Jer 5:2": "En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Jes 43:28": "Daarom zal Ik de leiders van het heiligdom ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Zach 11:16": "Want zie, Ik zal een herder verwekken in dit land; wat gereed is om afgesneden te worden, zal hij niet bezoeken; het jonge zal hij niet zoeken, en het verbrokene zal hij niet helen, en het stilstaande zal hij niet dragen; maar het vlees van het vette zal hij eten, en hun klauwen zal hij verscheuren.", "Ezech 23:18": "Zo ontdekte zij haar hoererijen, en ontdekte haar schaamte; toen werd Mijn ziel van haar afgekeerd, zoals Mijn ziel afgekeerd was van haar zuster.", "Zach 1:4": "Wees niet als uw vaderen, tot wie de vorige profeten riepen en zeiden: Zo zegt de HEERE van de heerscharen: Bekeer u toch van uw slechte wegen en uw slechte daden; maar zij hoorden niet, en zij luisterden niet naar Mij, spreekt de HEERE.", "1 Petr 2:11": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel;", "1 Sam 23:1": "En men vertelde het David: Kijk, de Filistijnen strijden tegen Kehila, en zij beroven de dorsvloeren.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Ex 29:45": "En Ik zal in het midden van de kinderen van Israël wonen, en Ik zal hun tot een God zijn.", "Luk 12:2": "Er is niets bedekt, dat niet onthuld zal worden, en niets verborgen, dat niet bekend zal worden.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Jes 57:6": "Aan de gladde stenen van de beek is uw deel; die, die zijn uw lot; ook stort u daarover een drankoffer uit, u offert hun een spijsoffer; zou Ik Mij hierover laten troosten?", "Jer 9:21": "Want de dood is geklommen in onze vensters, hij is in onze paleizen gekomen, om de kinderen uit te roeien van de wijken, de jongemannen van de straten.", "Lev 17:11": "Want de ziel van het vlees is in het bloed; daarom heb Ik het u op het altaar gegeven, om voor uw zielen verzoening te doen; want het is het bloed, dat voor de ziel verzoening doet.", "Luk 13:26": "Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Zach 10:10": "Want Ik zal hen terugbrengen uit het land Egypte, en Ik zal hen verzamelen uit Assyrië; en Ik zal hen in het land van Gilead en Libanon brengen, maar het zal voor hen niet genoeg ruimte zijn.", "Hos 2:14": "En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Spr 26:23-26": "Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim. Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Job 27:14": "Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Matt 18:11": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Deut 28:68": "En de HEERE zal u met schepen laten terugkeren naar Egypte, langs een weg waarvan ik u gezegd heb: U zult die niet meer zien; en daar zult u zich aan uw vijanden willen verkopen als slaven en slavinnen; maar er zal geen koper zijn.", "Mark 13:22": "Want er zullen valse christussen, en valse profeten opstaan, en zij zullen tekenen en wonderen doen, om te misleiden, indien het mogelijk zou zijn, ook de uitverkorenen.", "2 Tim 3:2-13": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig, zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede, verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Job 31:34": "Zeker, ik kon wel een grote menigte geweldig onderdrukt hebben; maar de verachtste van de huisgezinnen zou mij afgeschrikt hebben; zodat ik gewezen zou hebben, en bij de deur niet uitgegaan zijn.", "Deut 7:13": "en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven.", "Fil 1:15": "Sommigen prediken Christus wel uit afgunst en twist, maar sommigen ook uit goedwilligheid.", "Lev 20:22": "Houd dan al Mijn inzettingen en al Mijn rechten, en doe ze; opdat het land waarheen Ik u breng om daarin te wonen, u niet uitspuwt.", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "Ezech 25:17": "En Ik zal grote wraak met grimmige straffen onder hen voltrekken; en zij zullen weten dat Ik de HEERE ben, wanneer Ik Mijn wraak aan hen zal hebben voltrokken.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "Jer 11:8": "Maar zij hebben niet gehoord, en ook hun oor niet geneigd, maar hebben gewandeld, ieder naar het goeddunken van hun boze hart; daarom heb Ik over hen gebracht al de woorden van dit verbond, dat Ik geboden had te doen, maar zij hebben het niet gedaan.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Neh 5:19": "Gedenk mij, mijn God, ten goede, alles wat ik voor dit volk gedaan heb.", "Deut 28:18": "Vervloekt zal zijn de vrucht van uw schoot, en de vrucht van uw land, de aanwas van uw koeien, en de kudden van uw kleinvee.", "Zach 11:4": "Zo zegt de HEERE, mijn God: Weid deze slachtschapen.", "Hagg 2:17": "Voordat die dingen gebeurden, kwam iemand bij de korenhoop van twintig maten, en er waren er maar tien; kwam iemand bij de wijnbak om vijftig maten uit de pers te putten, en er waren er maar twintig.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "Job 17:8": "De oprechten zullen hierover verbaasd zijn, en de onschuldige zal zich tegen de huichelaar opmaken;", "Spr 26:19": "zo is een man die zijn naaste bedriegt, en zegt: Maakte ik geen grapje?", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "Neh 9:27-37": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten. Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered. En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "Jer 30:12-15": "Want zo zegt de HEERE: Uw breuk is dodelijk, uw plaag is smartelijk. Er is niemand die uw zaak behartigt, aangaande het gezwel; u hebt geen heelpleisters. Al uw minnaars hebben u vergeten, zij vragen niet naar u; want Ik heb u geslagen met de plaag van een vijand, met de kastijding van iemand wrede; om de grootheid van uw ongerechtigheid, omdat uw zonden machtig veel zijn.", "Jer 23:17": "Zij zeggen steeds tegen hen die Mij lasteren: De HEERE heeft het gesproken, u zult vrede hebben; en tegen ieder die naar het goeddunken van zijn eigen hart wandelt, zeggen zij: U zal geen kwaad overkomen.", "Ef 4:17-19": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed. Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart; Zij hebben, ongevoelig geworden, zichzelf overgegeven aan losbandigheid, om alle onreinheid gierig te bedrijven.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Jer 8:19": "Zie, de stem van het geschrei van de dochter van mijn volk klinkt uit een zeer ver land: Is de HEERE dan niet in Sion, is haar Koning niet bij haar? Waarom hebben zij Mij vertoornd met hun gesneden beelden, met de nietige afgoden van de vreemden?", "Ps 101:7": "Wie bedrog pleegt, zal binnen mijn huis niet blijven; die leugens spreekt, zal voor mijn ogen niet bevestigd worden.", "Jer 2:35": "Nog zegt u: Zeker, ik ben onschuldig; Zijn toorn is immers van mij afgekeerd. Zie, Ik zal met u rechten, omdat u zegt: Ik heb niet gezondigd.", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "Jes 8:4": "Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur.", "Jes 5:18-25": "Wee hun die de ongerechtigheid trekken met koorden van ijdelheid, en de zonde als met dikke wagentouwen! Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen! Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Fil 1:16": "Dezen verkondigen Christus wel uit eigenbelang, niet zuiver, en menen aan mijn banden verdrukking toe te brengen;", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "1 Joh 2:15-17": "Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem. Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld. En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Jer 22:9": "En zij zullen zeggen: Omdat zij het verbond van de HEERE, hun God, hebben verlaten, en zich voor andere goden hebben neergebogen, en die gediend.", "Jes 58:2-5": "Hoewel zij Mij dagelijks zoeken en een lust hebben aan de kennis van Mijn wegen, als een volk dat gerechtigheid doet en het recht van zijn God niet verlaat, vragen zij Mij naar de rechten van de gerechtigheid; zij hebben een lust om tot God te naderen; En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid. Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Job 20:4-29": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft, Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;", "Ezech 24:17": "Houd stil met kermen, u zult geen dodenrouw bedrijven, bind uw hoofddeksel op u, en doe uw schoenen aan uw voeten; en de bovenlip zult u niet bedekken, en het brood van de mensen zult u niet eten.", "Luk 18:12": "Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Jer 29:26": "De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Ezech 5:10": "Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun v
