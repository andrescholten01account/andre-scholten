moette hen als een berin die van haar jongen beroofd is, en scheurde het omhulsel van hun hart open; en Ik verslond hen daar als een leeuw; het wilde dier van het veld verscheurde hen.","9":"Het heeft u te gronde gericht, o Israël! Want in Mij is uw hulp.","10":"Waar is uw koning nu? Laat hij u toch redden in al uw steden! En uw rechters, van wie u zei: Geef mij een koning en vorsten?","11":"Ik gaf u een koning in Mijn toorn en nam *hem* weg in Mijn woede.","12":"Efraïms ongerechtigheid is samengebonden, zijn zonde is opgeslagen.","13":"Weeën van een barende *vrouw* zullen hem overkomen; hij is een onverstandig kind; want *anders* zou hij niet zo lang blijven staan op het punt van de geboorte.","14":"*Toch* zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,","15":"Want hij zal vrucht voortbrengen onder de broeders; *toch* zal er een oostenwind komen, een wind van de Heere, opkomend uit de woestijn; en zijn bron zal uitdrogen, die zal de schat van alle kostbare voorwerpen roven."},"SV":{"1":"Als Efraïm sprak, zo beefde men, hij heeft zich verheven in Israël; maar hij is schuldig geworden aan den Baäl en is gestorven.","2":"En nu zijn zij voortgevaren te zondigen, en hebben zich van hun zilver een gegoten beeld gemaakt, afgoden naar hun verstand, die altemaal smedenwerk zijn; waarvan zij *nochtans* zeggen: De mensen, die offeren, zullen de kalveren kussen.","3":"Daarom zullen zij zijn als een morgenwolk, en als een vroegkomende dauw, die henengaat; als kaf van den dorsvloer, en als rook uit den schoorsteen wordt weggestormd.","4":"Ik ben toch de Heere, uw God, van Egypteland af; daarom zoudt gij geen God kennen dan Mij alleen, want er is geen Heiland dan Ik.","5":"Ik heb u gekend in de woestijn, in een zeer heet land.","6":"Daarna zijn zij, naardat hunlieder weide was, zat geworden; als zij zat zijn geworden, heeft zich hun hart verheven; daarom hebben zij Mij vergeten.","7":"Dies werd Ik hun als een felle leeuw; als een luipaard loerde Ik op den weg.","8":"Ik ontmoette hen als een beer, die van jongen beroofd is, en scheurde het slot huns harten; en Ik verslond ze aldaar als een oude leeuw; het wild gedierte des velds verscheurde hen.","9":"Het heeft u bedorven, o Israël! want in Mij is uw hulp.","10":"Waar is uw koning nu? Dat hij u behoude in al uw steden! En uw richters, waar gij van zeidet: Geef mij een koning en vorsten?","11":"Ik gaf u een koning in Mijn toorn en nam *hem* weg in Mijn verbolgenheid.","12":"Efraïms ongerechtigheid is samengebonden, zijn zonde is opgelegd.","13":"Smarten ener barende *vrouw* zullen hem aankomen; hij is een onwijs kind; want *anders* zou hij geen tijd in de kindergeboorte blijven staan.","14":"*Doch* Ik zal hen van het geweld der hel verlossen, Ik zal ze vrijmaken van den dood: o dood! waar zijn uw pestilentien? hel! waar is uw verderf? Berouw zal van Mijn ogen verborgen zijn,","15":"Want hij zal vrucht voortbrengen onder de broederen; *doch* er zal een oostenwind komen, een wind des Heeren, opkomende uit de woestijn; en zijn springader zal uitdrogen, diezelve zal den schat van alle gewenste huisraad roven."},"KJV":{"1":"When Ephraim spake trembling, he exalted himself in Israel; but when he offended in Baal, he died.","2":"And now they sin more and more, and have made them molten images of their silver, *and* idols according to their own understanding, all of it the work of the craftsmen: they say of them, Let the men that sacrifice kiss the calves.","3":"Therefore they shall be as the morning cloud, and as the early dew that passeth away, as the chaff *that* is driven with the whirlwind out of the floor, and as the smoke out of the chimney.","4":"Yet I *am* the LORD thy God from the land of Egypt, and thou shalt know no god but me: for *there is* no saviour beside me.","5":"I did know thee in the wilderness, in the land of great drought.","6":"According to their pasture, so were they filled; they were filled, and their heart was exalted; therefore have they forgotten","7":"Therefore I will be unto them as a lion: as a leopard by the way will I observe","8":"I will meet them as a bear *that is* bereaved *of her whelps*, and will rend the caul of their heart, and there will I devour them like a lion: the wild beast shall tear","9":"O Israel, thou hast destroyed thyself; but in me *is* thine help.","10":"I will be thy king: where *is any other* that may save thee in all thy cities? and thy judges of whom thou saidst, Give me a king and princes?","11":"I gave thee a king in mine anger, and took *him* away in my wrath.","12":"The iniquity of Ephraim *is* bound up; his sin *is* hid.","13":"The sorrows of a travailing woman shall come upon him: he *is* an unwise son; for he should not stay long in *the place of* the breaking forth of children.","14":"I will ransom them from the power of the grave; I will redeem them from death: O death, I will be thy plagues; O grave, I will be thy destruction: repentance shall be hid from mine eyes.","15":"Though he be fruitful among *his* brethren, an east wind shall come, the wind of the LORD shall come up from the wilderness, and his spring shall become dry, and his fountain shall be dried up: he shall spoil the treasure of all pleasant vessels.","16":"Samaria shall become desolate; for she hath rebelled against her God: they shall fall by the sword: their infants shall be dashed in pieces, and their women with child shall be ripped up."}},"tsk":{"1":[{"kopje":"Efraïm","refs":["1 Sam 15:17","Spr 18:12","Jes 66:2","Luk 14:11"]},{"kopje":"verheven","refs":["Num 2:18-21","Num 10:22","Num 13:8","Num 13:16","Num 27:16-23","Joz 3:7","1 Kon 12:25"]},{"kopje":"schuldig geworden","refs":["Hos 11:2","1 Kon 16:29-33","1 Kon 18:18","1 Kon 18:19","2 Kon 17:16-18"]},{"kopje":"gestorven","refs":["Gen 2:17","Rom 5:12","2 Kor 5:14"]}],"2":[{"kopje":"nu","refs":["Num 32:14","2 Kron 28:13","2 Kron 33:23","J l=Hos.13.15#i21959","refs":[],"kinderen":[{"label":"In Canaan","href":"../../nave/w/?hl=Hos.13.15#i21962","refs":[{"disp":"Hos 13:15","href":"../../hosea/13/#v15","ref":"Hos 13:15","svLabel":null},{"disp":"Luk 12:55","href":"../../lukas/12/#v55","ref":"Luk 12:55","svLabel":null}],"kinderen":[]}]},{"label":"Figurative","href":"../../nave/w/?hl=Hos.13.15#i21973","refs":[],"kinderen":[{"label":"Of the judgments of God","href":"../../nave/w/?hl=Hos.13.15#i21974","refs":[{"disp":"Jer 22:22","href":"../../jeremia/22/#v22","ref":"Jer 22:22","svLabel":null},{"disp":"Hos 13:15","href":"../../hosea/13/#v15","ref":"Hos 13:15","svLabel":null},{"disp":"Matt 7:25","href":"../../mattheus/7/#v25","ref":"Matt 7:25","svLabel":null}],"kinderen":[]}]}]}],"torrey":[{"topic":"Fountains And Springs","href":"../../torrey/f/#t-fountains-and-springs","kinderen":[{"label":"Drying up of, a severe punishment","href":"../../torrey/f/?hl=Hos.13.15#i7191","refs":[{"disp":"Ps 107:33","href":"../../psalmen/107/#v33","ref":"Ps 107:33","svLabel":null},{"disp":"Ps 107:34","href":"../../psalmen/107/#v34","ref":"Ps 107:34","svLabel":null},{"disp":"Hos 13:15","href":"../../hosea/13/#v15","ref":"Hos 13:15","svLabel":null}],"kinderen":[]}]},{"topic":"Wind, The","href":"../../torrey/w/#t-wind-the","kinderen":[{"label":"Mentioned In Scripture","href":"../../torrey/w/?hl=Hos.13.15#i23267","refs":[],"kinderen":[{"label":"East","href":"../../torrey/w/?hl=Hos.13.15#i23270","refs":[{"disp":"Job 27:21","href":"../../job/27/#v21","ref":"Job 27:21","svLabel":null},{"disp":"Ezech 17:10","href":"../../ezechiel/17/#v10","ref":"Ezech 17:10","svLabel":null},{"disp":"Hos 13:15","href":"../../hosea/13/#v15","ref":"Hos 13:15","svLabel":null}],"kinderen":[]}]}]}]}},"noten":{"1":"Hos. 13:14 SV: pestilentiën — D.i.: plagen, dodelijke ziekten."},"koppeling":{"1":"Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.","2":"En nu gaan zij voort met zondigen, en hebben zich van hun zilver een gegoten beeld gemaakt, afgoden naar hun eigen inzicht, die allemaal het werk van smeden zijn; waarvan zij <em>toch</em> zeggen: De mensen die offeren, zullen de kalveren kussen.","3":"Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.","4":"Ik ben toch de Heere, uw God, van het land Egypte af; daarom zou u geen God kennen dan Mij alleen, want er is geen Heiland dan Ik.","5":"Ik heb u gekend in de woestijn, in een zeer dor land.","6":"Daarna zijn zij, naarmate hun weide was, verzadigd geworden; toen zij verzadigd waren geworden, heeft hun hart zich verheven; daarom hebben zij Mij vergeten.","7":"Daarom werd Ik voor hen als een felle leeuw; als een luipaard loerde Ik op de weg.","8":"Ik ontmoette hen als een berin die van haar jongen beroofd is, en scheurde het omhulsel van hun hart open; en Ik verslond hen daar als een leeuw; het wilde dier van het veld verscheurde hen.","9":"Het heeft u te gronde gericht, o Israël! Want in Mij is uw hulp.","10":"Waar is uw koning nu? Laat hij u toch redden in al uw steden! En uw rechters, van wie u zei: Geef mij een koning en vorsten?","11":"Ik gaf u een koning in Mijn toorn en nam <em>hem</em> weg in Mijn woede.","12":"Efraïms ongerechtigheid is samengebonden, zijn zonde is opgeslagen.","13":"Weeën van een barende <em>vrouw</em> zullen hem overkomen; hij is een onverstandig kind; want <em>anders</em> zou hij niet zo lang blijven staan op het punt van de geboorte.","14":"<em>Toch</em> zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,","15":"Want hij zal vrucht voortbrengen onder de broeders; <em>toch</em> zal er een oostenwind komen, een wind van de Heere, opkomend uit de woestijn; en zijn bron zal uitdrogen, die zal de schat van alle kostbare voorwerpen roven."},"koppeling_kjv":{"1":"When <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H7578\">trembling,</span> he <span class=\"wl wl-kjv\" data-code=\"H5375\">exalted</span> himself in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> but when he <span class=\"wl wl-kjv\" data-code=\"H816\">offended</span> in <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> he died.","2":"And now they <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> more and <span class=\"wl wl-kjv\" data-code=\"H3254\">more,</span> and have <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> them molten <span class=\"wl wl-kjv\" data-code=\"H4541\">images</span> of their <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H6091\">idols</span> according to their own <span class=\"wl wl-kjv\" data-code=\"H8394\">understanding,</span> all of it the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of the <span class=\"wl wl-kjv\" data-code=\"H2796\">craftsmen:</span> they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> of them, Let the <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> <span class=\"wl wl-kjv\" data-code=\"H5401\">kiss</span> the calves.","3":"Therefore they shall be as the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> that passeth <span class=\"wl wl-kjv\" data-code=\"H1980\">away,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4671\">chaff</span> that is driven with the <span class=\"wl wl-kjv\" data-code=\"H5590\">whirlwind</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1637\">floor,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke</span> out of the chimney.","4":"Yet I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> no <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> but <span class=\"wl wl-kjv\" data-code=\"H2108\">me:</span> for there is no <span class=\"wl wl-kjv\" data-code=\"H3467\">saviour</span> beside me.","5":"I did <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> thee in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of great drought.","6":"According to their <span class=\"wl wl-kjv\" data-code=\"H4830\">pasture,</span> so were they <span class=\"wl wl-kjv\" data-code=\"H7646\">filled;</span> they were <span class=\"wl wl-kjv\" data-code=\"H7646\">filled,</span> and their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> was <span class=\"wl wl-kjv\" data-code=\"H7311\">exalted;</span> therefore have they forgotten","7":"Therefore I will be unto them as a <span class=\"wl wl-kjv\" data-code=\"H7826\">lion:</span> as a <span class=\"wl wl-kjv\" data-code=\"H5246\">leopard</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> will I observe","8":"I will <span class=\"wl wl-kjv\" data-code=\"H6298\">meet</span> them as a <span class=\"wl wl-kjv\" data-code=\"H1677\">bear</span> that is <span class=\"wl wl-kjv\" data-code=\"H7909\">bereaved</span> of her whelps, and will <span class=\"wl wl-kjv\" data-code=\"H7167\">rend</span> the <span class=\"wl wl-kjv\" data-code=\"H5458\">caul</span> of their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> and there will I <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> them like a <span class=\"wl wl-kjv\" data-code=\"H3833\">lion:</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">wild</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> shall tear","9":"O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> thyself; but in me is thine help.","10":"I <span class=\"wl wl-kjv\" data-code=\"H165\">will</span> be thy <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> <span class=\"wl wl-kjv\" data-code=\"H645\">where</span> is any other that may <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> thee in all thy <span class=\"wl wl-kjv\" data-code=\"H5892\">cities?</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> of whom thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> me a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and princes?","11":"I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> thee a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> in mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> him away in my wrath.","12":"The <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> is bound <span class=\"wl wl-kjv\" data-code=\"H6887\">up;</span> his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> is hid.","13":"The <span class=\"wl wl-kjv\" data-code=\"H2256\">sorrows</span> of a travailing <span class=\"wl wl-kjv\" data-code=\"H3205\">woman</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon him: he is an <span class=\"wl wl-kjv\" data-code=\"H2450\">unwise</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> for he should not <span class=\"wl wl-kjv\" data-code=\"H5975\">stay</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">long</span> in the place of the breaking <span class=\"wl wl-kjv\" data-code=\"H4866\">forth</span> of children.","14":"I will <span class=\"wl wl-kjv\" data-code=\"H6299\">ransom</span> them from the <span class=\"wl wl-kjv\" data-code=\"H3027\">power</span> of the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave;</span> I will <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> them from <span class=\"wl wl-kjv\" data-code=\"H4194\">death:</span> O <span class=\"wl wl-kjv\" data-code=\"H4194\">death,</span> I <span class=\"wl wl-kjv\" data-code=\"H165\">will</span> be thy <span class=\"wl wl-kjv\" data-code=\"H1698\">plagues;</span> O <span class=\"wl wl-kjv\" data-code=\"H7585\">grave,</span> I <span class=\"wl wl-kjv\" data-code=\"H165\">will</span> be thy <span class=\"wl wl-kjv\" data-code=\"H6987\">destruction:</span> <span class=\"wl wl-kjv\" data-code=\"H5164\">repentance</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5641\">hid</span> from mine eyes.","15":"Though he be <span class=\"wl wl-kjv\" data-code=\"H6500\">fruitful</span> among his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> an east <span class=\"wl wl-kjv\" data-code=\"H6921\">wind</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4726\">spring</span> shall become <span class=\"wl wl-kjv\" data-code=\"H954\">dry,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4599\">fountain</span> shall be dried <span class=\"wl wl-kjv\" data-code=\"H2717\">up:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H8154\">spoil</span> the <span class=\"wl wl-kjv\" data-code=\"H214\">treasure</span> of all <span class=\"wl wl-kjv\" data-code=\"H2532\">pleasant</span> vessels.","16":"<span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> shall become <span class=\"wl wl-kjv\" data-code=\"H816\">desolate;</span> for she hath <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled</span> against her <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> their <span class=\"wl wl-kjv\" data-code=\"H5768\">infants</span> shall be dashed in <span class=\"wl wl-kjv\" data-code=\"H7376\">pieces,</span> and their women with <span class=\"wl wl-kjv\" data-code=\"H2030\">child</span> shall be ripped up."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Efraïm sprak,","tekst":"Anders: als Efraïm bevende, of [met] beven sprak, verhief hij [zichzelven] in Israël. De zin op een uitkomende. Hebreeuws, als Efraïm sprak, beving; dat is, de stam van Efraïm was in voortijden volgens den zegen van den patriarch Jakob [ Gen 48:19-20 ] van zulk een aanzien en macht in Israël, dat een ieder, om zo te spreken, beefde als hij met hevigheid iets dreef, zulks dat hij ook ten tijde van Rehabeam het koninkrijk der tien stammen eerst aan zich trok, door den eersten koning Jerobeam, die uit Efraïm was. Zie Jdg 8:1-2 , enz. en Jdg 12:1-2 , dnz. idem 1Ki 11:26 , enz. en 1Ki 12:20 ."},{"catchword":"verheven in Israël;","tekst":"Te weten tot het koninkrijk. Van het Hebreeuwse woord, dat verheffen betekent, komt een ander, dat een prins, vorst, regent, die over anderen verheven is, beduidt, waarop hier gezien wordt."},{"catchword":"Baäl","tekst":"Baäls afgoderij. Zie boven Hos 2:7 , Hos 2:12 ."},{"catchword":"gestorven","tekst":"Dat is, heeft allen aanzien verloren, is in een zeer ellendigen en verachtelijken staat vervallen, bij God en de mensen, binnen en buiten; [vergelijk de manier van spreken met Psa 31:13 , en Psa 88:4-6 , en Psa 143:3 ; Isa 59:10 ; Amo 2:2 ; Eph 2:1 ; Rev 3:1 , en Rev 20:5 ] . Zelfs is de koninklijke waardigheid van hem genomen. Zie 1Ki 14:10-11 , en 1Ki 15:27-30 , en vergelijk vs.3."}],"2":[{"catchword":"gegoten beeld gemaakt,","tekst":"Versta, een afgodische kalfsbeeld [waarvan in het volgende] en dergelijke anderen, naardat hun zin en lust opgaf, maar geenszins naar Gods zin. Zie van het woord zonde, inzake van afgoderij, boven Hos 8:11 ."},{"catchword":"afgoden","tekst":"Zie boven Hos 8:4 ."},{"catchword":"naar hun verstand,","tekst":"Die meesterlijk en kunstiglijk fatsoenerende en oppronkende. Vergelijk Jer 10:3 , Jer 10:14 , enz."},{"catchword":"smedenwerk zijn;","tekst":"Eene bespotting der ijdelheid, dwaasheid en nietigheid dezer afgoderij. Vergelijk boven Hos 8:6 , enz."},{"catchword":"zij nochtans zeggen","tekst":"De afgodische priesters en regenten. Anders: zij zeggen tot hen, die van Efraïm tot het andere Israëlietische volk."},{"catchword":"De mensen,","tekst":"Hebreeuws, de offerande des, of der mensen. De zin is, degenen, die onder de mensen Gode willen offeren moeten deze kalven [als hunne goden] eren. Zie 1Ki 12:28 , en vergelijk de manier van spreken met Isa 29:19 , alwaar staat: De nooddruftige, of behoeftige des, of der mensen; dat is onder de mensen, die onder de mensen behoeftig zijn, behoeftige mensen; idem, ellendige der schapen, Zec 11:7 , Zec 11:11 . Dat is, ellendige schapen, of ellendigste onder de schapen, en dergelijke veel."},{"catchword":"kalveren","tekst":"Te Dan en Bethel eerst opgericht, en daarna misschien in meer andere plaatsen. Zie 1Ki 12:28 , gelijk zij van tijd tot tijd in afgoderij zijn toegenomen."},{"catchword":"kussen","tekst":"Met een religieusen of godsdienstigen kus. Vergelijk Gen 41:40 ; 1Ki 19:18 ; Job 31:27 , en zie de aantekening aldaar."}],"3":[{"catchword":"als een morgenwolk,","tekst":"Dat is, zij zullen zo haast en licht met hun gansen bloei vergaan en verstrooid worden, gelijk deze gelijkenissen medebrengen. Vergelijk boven Hos 6:4 ."},{"catchword":"schoorsteen wordt weggestormd","tekst":"Of, venster, enig ander rookgat of opening, waardoor de rook wordt uitgelaten."}],"4":[{"catchword":"Ik ben toch de HEERE, uw God,","tekst":"Gelijk boven Hos 12:10 ."},{"catchword":"daarom zoudt gij geen God kennen dan Mij alleen,","tekst":"Of, en gij kendet geen god, enz. Versta, te dien tijde, als gij nog in afgoderij niet waart vervallen."}],"5":[{"catchword":"gekend in de woestijn,","tekst":"Dat is, liefgehad en bezorgd, gelijk Amo 3:2 . Zie Psa 1:6 ."},{"catchword":"heet land","tekst":"En vervolgens, dor, onvruchtbaar, uitermate verdrietelijk. Zie Deu 8:15 , en Deu 32:10 . Hebreeuws, land der hittigheden, of dorrigheden."}],"6":[{"catchword":"weide was,","tekst":"Nadat zij uit de woestijn in de vette landstreek van Gilead en voorts in het land Kanaän, overvloed van alles bekomen en genoten hebben. Zie Deu 8:7-10 , en Deu 32:13-14 ."},{"catchword":"hart verheven;","tekst":"Waarvan hen God tevoren gewaarschuwd, en terstond daarom gestraft had. Zie Deu 8:11 en Deu 32:15 , Deu 32:19-20 , enz."}],"7":[{"catchword":"leeuw;","tekst":"Dat is, Ik onthaalde hen hard en verschrikkelijk; gelijk eerst dikwijls geschied is ten tijde der richters, door verscheidene omliggende vijanden, daarna als zij van Juda gescheiden waren, door den Assyriër Tiglat-Pilezer, enz. Zie 2Ki 15:29 . Doch sommigen nemen vs.7 en het volgende in den toekomenden tijd, als ene voorzegging der toekomstige verwoesting door Salmanasser. Vergelijk boven Hos 5:14 ; Lam 3:10 ."},{"catchword":"loerde Ik op den weg","tekst":"Vergelijk Jer 5:6 ."}],"8":[{"catchword":"ontmoette hen","tekst":"Of, zal hen ontmoeten, en zo in het volgende."},{"catchword":"beer,","tekst":"Vergelijk 2Sa 17:8 ; Pro 17:12 ."},{"catchword":"slot huns harten;","tekst":"Dat is, hun borst, of hartedeksel, om hun hartebloed te zuigen of te drinken, gelijk verscheurende wilde beesten plegen te doen."},{"catchword":"aldaar als een oude leeuw;","tekst":"Op de plaats, gelijk men spreekt, of ter plaatse waar zij de vorenverhaalde boosheid bedreven, in Kanaän, of Gilead. Sommigen duiden het voornamelijk op Tiglat-Pilezers inval, 2Ki 15:29 ."},{"catchword":"het wild gedierte des velds verscheurde hen","tekst":"Anders: [of als] een [ander] wild dier des velds, [dat] hen in tweeën spleet, of kliefde. Versta, de wrede heidense vijanden, door wie God aldus met hen gehandeld heeft, of nog handelen wilde."}],"9":[{"catchword":"Het heeft u bedorven,","tekst":"Te weten uw afgoderij en moedwillige boosheid, waarvan vs.2, 6, gesproken is. Anders: hij heeft u bedorven; namelijk Efraïm [van wien in het voorgaande en volgende gesproken wordt] heeft Israël [dat is, de tien stammen] in het verderf gebracht, door zijn koning [waarvan in vs.10, en waarop dit ook sommigen duiden. Vergelijk onder Hos 14:5-6 , alwaar hem, Hos 14:5 , staat, en wie het is, in vs.6 verklaard wordt, namelijk Israël. Vergelijk ook boven vs.5,6, alzo elders]. Jerobeam, die met zijne vorsten den tijd van twee en twintig jaren, die hij geregeerd heeft, [ 1Ki 14:20 ] de gruwelijke afgoderij met alle handelingen en geweld gedreven, gevorderd heeft, waardoor niet alleen Efraïm zelf [gelijk boven vs.1] gestorven is, maar ook gans Israël met hem, door zijn Baäls- en kalvendienst, mitsgaders allerlei andere daaraan klevende goddeloosheid, in den dood en het verderf gestort heeft; zie 1Ki 14:15-16 , en 1Ki 15:30 , en 2Ki 17:21-22 , enz., hetwelk niet anders kon uitvallen. Want bij den waren God alleen [gelijk hier en boven vs.4 beduid wordt] is alle heil en hulp te zoeken en te vinden, dien zij verlatende en elders heil en hulp"},{"catchword":"Het heeft u bedorven,","tekst":"zoekende, samen bedorven en verloren zijn. Anders: Het is uw verderf, of het heeft u bedorven, o Israël, dat gij tegen mij, tegen uwe hulp, [gerebelleerd hebt]; welke overzetting [die hier verscheiden valt, in een goeden zin] ook eenvoudig en onstraffelijk is."},{"catchword":"Mij","tekst":"En ziet in uwe Baäls, gouden kalven, koningen, vorsten, helden, vastigheden, verbonden, overvloed en rijkdom, enz., waarin gij, naar Efraïms voorbeeld en raad, uw heil gesteld hebt."},{"catchword":"is uw hulp","tekst":"Hebreeuws eigenlijk, in mij, in uwe hulp. Van zulke overtolligheid van de Hebreeuwse letter Beth, zie Psa 54:6 . Of aldus: Maar in mij is [dat] tot uwe hulp [dient of strekken kan]."}],"10":[{"catchword":"Waar is uw","tekst":"Zie van het Hebreeuwse woord, vs.14."},{"catchword":"koning","tekst":"Op wien gij u verlaten hebt, menende dat hij u genoeg behouden zou. Alzo bespot de Heere hun ijdel vertrouwen, sprekende van het toekomende alsof het tegenwoordig ware. Vergelijk boven Hos 10:3 ."},{"catchword":"nu?","tekst":"Aldus wordt het Hebreeuwse woord Epho ook gebruikt voor nu, of dan, tot aanvulling van ene rede, Job 9:24 , en Job 17:15 , en Job 19:6 ; Isa 19:12 , en Isa 22:1 . Anders: Ik zal, of zou uw koning zijn, waar is [een ander?] dat hij u, enz., of die u behoude, enz., of Ik zal er zijn, [maar] waar is uw koning, enz. Alsof God zeide: Ik ben en blijf eeuwiglijk dezelfde, [zie Exo 3:14 ] , waarom gij bij mij uwe hulp en heil behoordet gezocht te hebben; maar gij hebt vertrouwd op uwen koning, die nu nergens voorhanden is. Vergelijk boven Hos 10:15 ."},{"catchword":"richters,","tekst":"Dat is, regenten, die den koning zouden bijstaan om u te beschermen."},{"catchword":"zeidet","tekst":"Ten tijde van den profeet Samuël. Zie 1Sa 8:5 ; ten ware dat die van Efraïm dergelijke woorden, volgens hunne trotsheid, mochten hebben gebruikt ten tijde van Rehabeam, als zij zich van Juda afscheurden en een eigen koning over de tien stammen maakten, hetwelk God door zijn verborgen raad alzo geschikt heeft, en verklaard dat Hij het gedaan heeft [ 1Ki 11:31 , 1Ki 11:35 ] , hoewel de schuld van het volk daarom niet te minder is geweest."}],"11":[{"catchword":"koning","tekst":"Saul. Sommigen duiden het op den eersten koning der tien stammen, Jerobeam, die uit Efraïm was en Israël bedorven heeft, gelijk boven is aangetekend."},{"catchword":"toorn","tekst":"Zie 1Sa 8:7-8 ; 1Ki 11:33 ; boven Hos 8:4 ."},{"catchword":"hem weg in Mijn verbolgenheid","tekst":"Saul; zie 1Sa 15:23 , en 1Sa 16:1 , en 1Sa 31:4 , 1Sa 31:6 . Sommigen zetten het over: Ik zal [hem] wegnemen, enz., duidende dit op den laatsten koning der tien stammen, Hosea, die van Salmanasser is overheerd, en in welken het koninkrijk van Israël een einde heeft genomen, 2Ki 17 . Vergelijk boven Hos 10:3 , Hos 10:7 , Hos 10:15 . Anderen verstaan het in het algemeen van de koningen der tien stammen, met welken God hier te doen heeft, [vergelijk boven Hos 7:16 , en Hos 8:4 ] , en zetten het over: Ik geef een koning, enz. en neem [hem] enz."}],"12":[{"catchword":"Efraïms ongerechtigheid","tekst":"Waarvan boven vs.9, enz."},{"catchword":"samengebonden,","tekst":"Als in een bundel of zak geknoopt, verzegeld en [om zo te spreken] in Gods griffie of schatkamer opgelegd, om te zijner tijd te voorschijn gehaald, ontdekt, geoordeeld en gestraft te worden. Vergelijk Job 14:17 ; Lam 1:14 ; Deu 32:34 , en zie de aantekening aldaar."}],"13":[{"catchword":"Smarten ener barende vrouw","tekst":"Dat is, zeer grote nood en bangheid, gelijk elders dikwijls."},{"catchword":"kind;","tekst":"Dat is, als een zeer onvernuftig, of verkeerd, misstaltig kind, dat tot de geboorte niet arbeidt, en zichzelven [om zo te spreken] in den weg is."},{"catchword":"want anders","tekst":"Of aldus: want hij staat niet tijdig of ter rechter tijd, in de voortbreking der kinderen, dat is, baarmoeder, of arbeid tot de geboorte. Vergelijk 2Ki 19:3 , en zie de aantekening aldaar. Sommigen verstaan het van den stoel, waar de barende vrouw op zit. De zin is, dat Efraïm, inplaats dat hij intijds zijn nakend verderf door boetvaardigheid zou voorkomen, blijft, tegen alle vermaningen, waarschuwingen en dreigementen, in zijne boosheid en onboetvaardigheid steken, gelijk een kind in de geboorte, dat zichzelf en zijne moeder om hals brengt, daar toch de kleinste onvernuftige creaturen het gevaar in dezen door natuurlijk ingeven weten te ontgaan."}],"14":[{"catchword":"Doch Ik zal hen","tekst":"Hier voegt de Heere wederom tussen in een schone Evangelische genadebelofte, tot troost zijner uitverkorenen en boetvaardigen. Vergelijk boven Hos 12:10-11 met de aantekening. Alsof de Heere zeide: Des volks ontrouw en langwijlige onboetvaardigheid zal evenwel mijne trouw en de waarheid mijner verbondsbeloften niet beletten, noch breken. Zie Rom 3:3 , en Rom 11:1 , enz."},{"catchword":"geweld der hel verlossen,","tekst":"Hebreeuws, van de hand der hel; dat is, van het graf. Zie Job 5:20 ; Psa 49:16 . De zin is: Ik zal mijn uitverkoren Israël door den Messias Jezus Christus, verlossen van al hun geestelijke vijanden en uit den dood, die het geweld over hen had door de zonde, doen opstaan tot de heerlijkheid van het eeuwige leven. Zie 1Co 15:54-55 ."},{"catchword":"waar zijn","tekst":"Nergens [wil God zeggen]; zij zijn nergens te vinden, als zijnde ten enenmale vernield. Met deze aanspraak bespot God den dood en het graf, als triomferende over hunne nederlaag [vergelijk Isa 25:8 ] . Het Hebreeuwse woord is hier tweemaal [gelijk ook boven vs.10] overgezet, waar? uit 1Co 15:55 , alwaar de apostel deze plaats alzo aantrekt en verklaart, gelijk de Griekse overzetters [en de Chaldeeuwse ook, vs.10] hadden gedaan, en sommigen der Hebreën zelf voor goed kennen. Anderen ook wel aldus: Dood, Ik zal uwe pestilentie zijn, graf, Ik zal uw verderf zijn."},{"catchword":"uw pestilentiën?","tekst":"Dat is, waar is al uw vergif, of uw sterke pestilentie, waarmede gij over mijn volk heerstet? Het veelvoudig getal dient tot vergroting of verzwaring, gelijk elders."},{"catchword":"verderf?","tekst":"Of, vernieling, verdelging, afsnijding, afhouwing. Een dergelijk Hebreeuws woord is Deu 32:24 ; Psa 91:6 ; Isa 28:2 ."},{"catchword":"Berouw","tekst":"Dat is, het zal mij van dit genadebesluit nimmermeer berouwen, Ik zal het zekerlijk volbrengen; wat voor Gods ogen verborgen is, dat is er niet, zo zal er dan geen berouw bij God in dezen zijn."}],"15":[{"catchword":"hij zal vrucht voortbrengen","tekst":"Efraïm, hoe ongezien en ongelooflijk het nu schijnt te zijn, zal nochtans in mijne kerk geplant zijnde, als een goede boom, nog goede vruchten voortbrengen, dat is, boetvaardig en gelovig geworden zijnde, goede werken doen. Zie Mat 3:8 , enz. Deze belofte slaat zeer aardiglijk op de gelijkheid van het Hebreeuwse woord Jafri, dat is, hij zal vrucht dragen, of vruchtbaar maken, en van den naam Efraïm. Hij, [de Messias, Efraïms Verlosser, van wien in het voorgaande gesproken is] Hij zal [hem] [Efraïm] vruchtbaar maken. Verstaande ook wijders het volgende tot aan het einde van dit hfdst. van Christus' geweld en macht tegen zijne en zijner kerke voorzeide vijanden."},{"catchword":"een","tekst":"Hier keert de profeet weder tot de strafpredikatie. Vergelijk boven Hos 12:12 ."},{"catchword":"oostenwind komen,","tekst":"Versta, den Assyriër, of de verwoesting, die hij zou aanrichten. Vergelijk Eze 19:12 , en boven Hos 4:19 , en Hos 12:2 ."},{"catchword":"des HEEREN,","tekst":"Dien de Heere door zijn rechtvaardig oordeel tot Efraïms straf verwekken zal, om hem te verstrooien, totdat hen Christus weder vergadere."},{"catchword":"uit de woestijn;","tekst":"En dienvolgens geweldig, onverhinderd en glad doorgaande."},{"catchword":"zijn","tekst":"Van Efraïm, en van de andere stammen, die zijn kwaad voorbeeld navolgden."},{"catchword":"springader","tekst":"Dat is, van al zijn vermogen en rijkdom, dien hij door Gods zegen heeft, zal hij beroofd worden, gelijk in het volgende verklaard wordt."},{"catchword":"die zal den schat","tekst":"Te weten, wind, dat is, de vijand, de Assyriër, die bij dien oostenwind vergeleken is."},{"catchword":"gewenste","tekst":"Gelijk Nah 2:9 ."},{"catchword":"huisraad roven","tekst":"Van het Hebreeuwse woord, zie Lev 15:4 , en Eze 16:17 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"When Ephraim spake, men trembled; [Oth when Ephraim spake trembling, or with trembling Heb. when Ephraim spake, trembling; (sustantive) the meaning is. The tribe of Ephraim was in for mer times, answerable to the blessing of the Patriarch Jacob, Gen. 48. 19.20. ) Of thhe authority and power in Israel, that very one trembled as it were, when he appeared resolved in business, whereby also in the time of King Rehabeam it came to pass that he first assumed the kingdom of the tribes unto himself by means of the first King Jerobeam, see jud 8.1,2,. etc. and 12.1,2. 1 King 11.26. and chap 12.20.] be exalted himself: [to wit to the kingdom. Of the Hebr,. word that signifying a Prince, ruler, Governour, that is exalted above another, which is here aimed at] but he is become guilty and Raal, [Baals idolatry see ab. chap. 2.8. 13.] and is dead. [that is he hath now lost all authority, and is decayed to very miserable and contemptible estate, both with God and men at home abroad. (Compare the phrase with Psal 31. 13 and 88. 4,5,6. and 143 .3. Isa 59. 10. Amos. 2. 1. Rev 3.1. and 20. 5.) the royal dignite it self is taken away from him see 1 King. 14. 10,11. and chap 15. 27, 28, 29, 30. and compare verse.3.]"}],"2":[{"catchword":null,"tekst":"And now they went on to sin , and made a molten imgge of their silver, [understand the idolatrous image of claf (whereof see in the sequel ) and others such like evn as they pleased and fancied, and not at all, as God would have it. Of the word sins in matters of Idolatry , see above chap 8. on verse11] idols, [see above chap 8.4.] according to their understanding [i.e. shaping and dressing them with all the art and skill they could . Compare Jer 10.3, 14. etc.] which are all together Smith work: [a mocking at the vanity, folly and frivolousness of this idolatry. Compare above chap 8.6, etc.] whereof they say nevertheless ; [they viz, the idolatrous Priest and Governors. Oth they say to them, viz. those of Ephraim unto the other Israelites] the men that offer [Heb, the off (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
