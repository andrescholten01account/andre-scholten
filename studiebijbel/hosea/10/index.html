e oplopen, en Israël zal beschaamd worden vanwege zijn eigen plan.","7":"De koning van Samaria is afgehouwen, als schuim op het water.","8":"En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!","9":"Sinds de dagen van Gibea hebt u gezondigd, o Israël; daar zijn zij blijven staan; de strijd te Gibea tegen de kinderen van de verkeerdheid zal hen niet inhalen.","10":"Het is Mijn wens, dat Ik hen zal tuchtigen; en volken zullen tegen hen verzameld worden, wanneer Ik hen bind in hun twee voren.[1]","11":"Omdat Efraïm een vaars is, gewend om graag te dorsen, ben Ik over de schoonheid van haar hals heengegaan; Ik zal Efraïm laten rijden, Juda zal ploegen, Jakob zal voor zich eggen.","12":"Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.","13":"U hebt goddeloosheid geploegd, verkeerdheid gemaaid, en de vrucht van de leugen gegeten; want u hebt vertrouwd op uw eigen weg, op de veelheid van uw helden.","14":"Daarom zal er een groot rumoer ontstaan onder uw volken, en al uw vestingen zullen verwoest worden, zoals Salman Beth-arbel verwoestte op de dag van de strijd; de moeder werd verpletterd met de zonen.","15":"Zo heeft Beth-el u gedaan, vanwege de grote boosheid van uw boosheid; Israëls koning is in de vroege morgen volledig uitgeroeid."},"SV":{"1":"Israël is een uitgeledigde wijnstok, hij brengt *weder* vrucht voor zich; *maar* naar de veelheid zijner vrucht heeft hij de altaren vermenigvuldigd; naar de goedheid zijns lands, hebben zij de opgerichte beelden goed gemaakt.","2":"Hij heeft hun hart verdeeld, nu zullen zij verwoest worden; Hij zal hun altaren doorhouwen, Hij zal hun opgerichte beelden verstoren.","3":"Want nu zullen zij zeggen: Wij hebben geen koning; want wij hebben den Heere niet gevreesd; wat zou ons dan een koning doen?","4":"Zij hebben woorden gesproken, valselijk zwerende *in* *het* verbond maken; daarom zal het oordeel als een vergiftig kruid groenen, op de voren der velden.","5":"De inwoners van Samaria zullen verschrikt zijn over het kalf van Beth-aven; want zijn volk zal over hetzelve treuren, mitsgaders zijn Chemarim (die zich over hetzelve verheugden), over zijn heerlijkheid, omdat zij van hetzelve is weggevaren.","6":"Ja, datzelve zal naar Assur gevoerd worden, *tot* een geschenk voor den koning Jareb; Efraïm zal schaamte behalen, en Israël zal beschaamd worden vanwege zijn raadslag.","7":"De koning van Samaria is afgehouwen, als schuim op het water.","8":"En de hoogten van Aven, Israëls zonde, zullen verdelgd worden; doornen en distelen zullen op hunlieder altaren opkomen; en zij zullen zeggen tot de bergen: Bedekt ons! en tot de heuvelen: Valt op ons!","9":"Sinds de dagen van Gibea, hebt gij gezondigd, o Israël; daar zijn zij staande gebleven; de strijd te Gibea, tegen de kinderen der verkeerdheid, zal ze niet aangrijpen.","10":"Het is in Mijn lust, dat Ik ze zal binden; en volken zullen tegen henlieden verzameld worden, als Ik ze binden zal in hun twee voren.","11":"Dewijl Efraïm een vaars is, gewend gaarne te dorsen, zo ben Ik over de schoonheid van haar hals overgegaan; Ik zal Efraïm berijden, Juda zal ploegen, Jakob zal voor zich eggen.","12":"Zaait u tot gerechtigheid, maait tot weldadigheid; braakt u een braakland; dewijl het tijd is den Heere te zoeken, totdat Hij kome, en over u de gerechtigheid regene.","13":"Gij hebt goddeloosheid geploegd, verkeerdheid gemaaid, *en* de vrucht der leugen gegeten; want gij hebt vertrouwd op uw weg, op de veelheid uwer helden.","14":"Daarom zal er een groot gedruis ontstaan onder uw volken, en al uw vestingen zullen verstoord worden, gelijk Salman Beth-arbel verstoorde ten dage des krijgs; de moeder werd verpletterd met de zonen.","15":"Alzo heeft Beth-el ulieden gedaan, vanwege de boosheid uwer boosheid; Israëls koning is in den dageraad ten enenmale uitgeroeid."},"KJV":{"1":"Israel *is* an empty vine, he bringeth forth fruit unto himself: according to the multitude of his fruit he hath increased the altars; according to the goodness of his land they have made goodly images.","2":"Their heart is divided; now shall they be found faulty: he shall break down their altars, he shall spoil their images.","3":"For now they shall say, We have no king, because we feared not the LORD; what then should a king do","4":"They have spoken words, swearing falsely in making a covenant: thus judgment springeth up as hemlock in the furrows of the field.","5":"The inhabitants of Samaria shall fear because of the calves of Bethaven: for the people thereof shall mourn over it, and the priests thereof *that* rejoiced on it, for the glory thereof, because it is departed","6":"It shall be also carried unto Assyria *for* a present to king Jareb: Ephraim shall receive shame, and Israel shall be ashamed of his own counsel.","7":"*As for* Samaria, her king is cut off as the foam upon the water.","8":"The high places also of Aven, the sin of Israel, shall be destroyed: the thorn and the thistle shall come up on their altars; and they shall say to the mountains, Cover us; and to the hills, Fall","9":"O Israel, thou hast sinned from the days of Gibeah: there they stood: the battle in Gibeah against the children of iniquity did not overtake","10":"*It is* in my desire that I should chastise them; and the people shall be gathered against them, when they shall bind themselves in their two furrows.","11":"And Ephraim *is as* an heifer *that is* taught, *and* loveth to tread out *the corn*; but I passed over upon her fair neck: I will make Ephraim to ride; Judah shall plow, *and* Jacob shall break his clods.","12":"Sow to yourselves in righteousness, reap in mercy; break up your fallow ground: for *it is* time to seek the LORD, till he come and rain righteousness","13":"Ye have plowed wickedness, ye have reaped iniquity; ye have eaten the fruit of lies: because thou didst trust in thy way, in the multitude of thy mighty men.","14":"Therefore shall a tumult arise among thy people, and all thy fortresses shall be spoiled, as Shalman spoiled Betharbel in the day of battle: the mother was dashed in pieces upon *her* children.","15":"So shall Bethel do unto you because of your great wickedness: in a morning shall the king of Israel utterly be cut off."}},"tsk":{"1":[{"kopje":"een uitgeledigde wijnstok","refs":["Zach 7:5","Zach 7:6","Rom 14:7","Rom 14:8","2 Kor 5:16","Fil 2:21"]},{"kopje":"naar de veelheid","refs":["Hos 2:7","Hos 8:4","Hos 8:11","Hos 12:9","Hos 12:12","Hos 13:2","Hos 13:6","Jer 2:28"]},{"kopje":"beelden","refs":["Lev 26:1","1 Kon 14:23"]}],"2":[{"kopje":"Hij heeft hun hart verdeeld","refs":["Hos 7:8","1 Kon 18:21","Jes 44:18","Zef 1:5","Matt 6:24","Luk 16:13","2 Tess 2:11","2 Tess 2:12","Jak 1:8","Jak 4:4","1 Joh 2:15","Openb 3:15","Openb 3:16"]},{"kopje":"afbreken","refs":["Hos 10:5-8","Hos 8:5","Hos 8:6","1 Sam 5:4","Jer 43:13","Micha 5:12","Zach 13:2"]}],"3":[{"kopje":"Wij hebben","refs":["Hos 10:7","Hos 10:15","Hos 3:4","Hos 11:5","Hos 13:11","Gen 49:10","Micha 4:9","Joh 19:15"]}],"4":[{"kopje":"gezworen","refs":["Hos 6:7","2 Kon 17:3","2 Kon 17:4","Ezech 17:13-19","Rom 1:31","2 Tim 3:3"]},{"kopje":"daarom","refs":["Deut 29:18","Jes 5:7","Jes 59:13-15","Amos 5:7","Amos 6:12","Hand 8:23","Hebr 12:15","Openb 8:10","Openb 8:11"]}],"5":[{"kopje":"het kalf","refs":["Hos 8:5","Hos 8:6","Hos 13:2","1 Kon 12:28-32","2 Kon 10:29","2 Kon 17:16","2 Kron 11:15","2 Kron 13:8"]},{"kopje":"Beth-aven","refs":["Hos 4:15","Hos 5:8","Joz 7:2"]},{"kopje":"zijn volk","refs":["Richt 18:24","Openb 18:11-19"]},{"kopje":"zijn afgodspriesters","refs":["2 Kon 23:5","Zef 1:4"]},{"kopje":"over zijn heerlijkheid","refs":["Hos 9:11","1 Sam 4:21","1 Sam 4:22","Hand 19:27"]}],"6":[{"kopje":"gevoerd","refs":["Hos 8:6","Jes 46:1","Jes 46:2","Jer 43:12","Jer 43:13" href":"../../openbaring/19/#v17","ref":"Openb 19:17","svLabel":null},{"disp":"Openb 19:18","href":"../../openbaring/19/#v18","ref":"Openb 19:18","svLabel":null}],"kinderen":[]}]}],"torrey":[{"topic":"Fortresses","href":"../../torrey/f/#t-fortresses","kinderen":[{"label":"Often","href":"../../torrey/f/?hl=Hos.10.14#i7140","refs":[],"kinderen":[{"label":"Spoiled","href":"../../torrey/f/?hl=Hos.10.14#i7142","refs":[{"disp":"Hos 10:14","href":"../../hosea/10/#v14","ref":"Hos 10:14","svLabel":null}],"kinderen":[]}]}]}]}},"noten":{"1":"SV: in hun twee voren. D.i.: onduidelijke beeldspraak, mogelijk verwijzend naar hun (afgoderij bij het) ploegen."},"koppeling":{"1":"Israël is een uitgeledigde wijnstok, hij brengt weer vrucht voort voor zichzelf; maar naar de veelheid van zijn vrucht heeft hij de altaren vermeerderd; naar de goedheid van zijn land hebben zij de opgerichte beelden mooi gemaakt.","2":"Hij heeft hun hart verdeeld, nu zullen zij schuldig bevonden worden; Hij zal hun altaren afbreken, Hij zal hun opgerichte beelden vernielen.","3":"Want nu zullen zij zeggen: Wij hebben geen koning; want wij hebben de Heere niet gevreesd; wat zou een koning dan voor ons doen?","4":"Zij hebben woorden gesproken, vals gezworen bij het sluiten van een verbond; daarom zal het oordeel als een giftig kruid opschieten, op de voren van de velden.","5":"De inwoners van Samaria zullen bang zijn vanwege het kalf van Beth-aven; want zijn volk zal erover treuren, alsook zijn afgodspriesters (die zich erover verheugden), over zijn heerlijkheid, omdat die van hen is weggegaan.","6":"Ja, dat zal naar Assur gevoerd worden, als geschenk voor koning Jareb; Efraïm zal schaamte oplopen, en Israël zal beschaamd worden vanwege zijn eigen plan.","7":"De koning van Samaria is afgehouwen, als schuim op het water.","8":"En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!","9":"Sinds de dagen van Gibea hebt u gezondigd, o Israël; daar zijn zij blijven staan; de strijd te Gibea tegen de kinderen van de verkeerdheid zal hen niet inhalen.","10":"Het is Mijn wens, dat Ik hen zal tuchtigen; en volken zullen tegen hen verzameld worden, wanneer Ik hen bind in hun twee voren.<sup class=\"noot\" data-noot=\"1\">1</sup>","11":"Omdat Efraïm een vaars is, gewend om graag te dorsen, ben Ik over de schoonheid van haar hals heengegaan; Ik zal Efraïm laten rijden, Juda zal ploegen, Jakob zal voor zich eggen.","12":"Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.","13":"U hebt goddeloosheid geploegd, verkeerdheid gemaaid, en de vrucht van de leugen gegeten; want u hebt vertrouwd op uw eigen weg, op de veelheid van uw helden.","14":"Daarom zal er een groot rumoer ontstaan onder uw volken, en al uw vestingen zullen verwoest worden, zoals Salman Beth-arbel verwoestte op de dag van de strijd; de moeder werd verpletterd met de zonen.","15":"Zo heeft Beth-el u gedaan, vanwege de grote boosheid van uw boosheid; Israëls koning is in de vroege morgen volledig uitgeroeid."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is an <span class=\"wl wl-kjv\" data-code=\"H1238\">empty</span> <span class=\"wl wl-kjv\" data-code=\"H1612\">vine,</span> he bringeth <span class=\"wl wl-kjv\" data-code=\"H7737\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> unto himself: according to the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of his <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7235\">increased</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars;</span> according to the <span class=\"wl wl-kjv\" data-code=\"H2896\">goodness</span> of his <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> they have made <span class=\"wl wl-kjv\" data-code=\"H2895\">goodly</span> images.","2":"Their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is <span class=\"wl wl-kjv\" data-code=\"H2505\">divided;</span> now shall they be found <span class=\"wl wl-kjv\" data-code=\"H816\">faulty:</span> he shall break <span class=\"wl wl-kjv\" data-code=\"H6202\">down</span> their <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7703\">spoil</span> their images.","3":"For now they shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> We have no <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> because we <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> what then should a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> do","4":"They have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> <span class=\"wl wl-kjv\" data-code=\"H422\">swearing</span> <span class=\"wl wl-kjv\" data-code=\"H7723\">falsely</span> in <span class=\"wl wl-kjv\" data-code=\"H3772\">making</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant:</span> thus <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> springeth <span class=\"wl wl-kjv\" data-code=\"H6524\">up</span> as <span class=\"wl wl-kjv\" data-code=\"H7219\">hemlock</span> in the <span class=\"wl wl-kjv\" data-code=\"H8525\">furrows</span> of the field.","5":"The <span class=\"wl wl-kjv\" data-code=\"H7934\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> shall <span class=\"wl wl-kjv\" data-code=\"H1481\">fear</span> because of the <span class=\"wl wl-kjv\" data-code=\"H5697\">calves</span> of <span class=\"wl wl-kjv\" data-code=\"H1007\">Bethaven:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> thereof shall <span class=\"wl wl-kjv\" data-code=\"H56\">mourn</span> over it, and the <span class=\"wl wl-kjv\" data-code=\"H3649\">priests</span> thereof that <span class=\"wl wl-kjv\" data-code=\"H1523\">rejoiced</span> on it, for the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> thereof, because it is departed","6":"It shall be also <span class=\"wl wl-kjv\" data-code=\"H2986\">carried</span> unto <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> for a <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> to <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3377\">Jareb:</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> shall <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> <span class=\"wl wl-kjv\" data-code=\"H1317\">shame,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> of his own counsel.","7":"As for <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> her <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> is cut <span class=\"wl wl-kjv\" data-code=\"H1820\">off</span> as the <span class=\"wl wl-kjv\" data-code=\"H7110\">foam</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">upon</span> the water.","8":"The high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> also of <span class=\"wl wl-kjv\" data-code=\"H206\">Aven,</span> the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed:</span> the <span class=\"wl wl-kjv\" data-code=\"H6975\">thorn</span> and the <span class=\"wl wl-kjv\" data-code=\"H1863\">thistle</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> on their <span class=\"wl wl-kjv\" data-code=\"H4196\">altars;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> <span class=\"wl wl-kjv\" data-code=\"H3680\">Cover</span> us; and to the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills,</span> Fall","9":"O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah:</span> there they <span class=\"wl wl-kjv\" data-code=\"H5975\">stood:</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> in <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah</span> against the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5932\">iniquity</span> did not overtake","10":"It is in my <span class=\"wl wl-kjv\" data-code=\"H185\">desire</span> that I should <span class=\"wl wl-kjv\" data-code=\"H3256\">chastise</span> them; and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall be <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> against them, when they shall <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> themselves in their <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> furrows.","11":"And <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> is as an <span class=\"wl wl-kjv\" data-code=\"H5697\">heifer</span> that is <span class=\"wl wl-kjv\" data-code=\"H3925\">taught,</span> and <span class=\"wl wl-kjv\" data-code=\"H157\">loveth</span> to tread <span class=\"wl wl-kjv\" data-code=\"H1758\">out</span> the corn; but I passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> upon her <span class=\"wl wl-kjv\" data-code=\"H2898\">fair</span> <span class=\"wl wl-kjv\" data-code=\"H6677\">neck:</span> I will make <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> to <span class=\"wl wl-kjv\" data-code=\"H7392\">ride;</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> shall <span class=\"wl wl-kjv\" data-code=\"H2790\">plow,</span> and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> shall break his clods.","12":"<span class=\"wl wl-kjv\" data-code=\"H2232\">Sow</span> to yourselves in <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness,</span> <span class=\"wl wl-kjv\" data-code=\"H7114\">reap</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">in</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy;</span> break <span class=\"wl wl-kjv\" data-code=\"H5214\">up</span> your fallow <span class=\"wl wl-kjv\" data-code=\"H5215\">ground:</span> for it is <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> till he <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H3384\">rain</span> righteousness","13":"Ye have <span class=\"wl wl-kjv\" data-code=\"H2790\">plowed</span> <span class=\"wl wl-kjv\" data-code=\"H7562\">wickedness,</span> ye have <span class=\"wl wl-kjv\" data-code=\"H7114\">reaped</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity;</span> ye have <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of <span class=\"wl wl-kjv\" data-code=\"H3585\">lies:</span> because thou didst <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of thy mighty men.","14":"Therefore shall a <span class=\"wl wl-kjv\" data-code=\"H7588\">tumult</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arise</span> among thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and all thy <span class=\"wl wl-kjv\" data-code=\"H4013\">fortresses</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiled,</span> as <span class=\"wl wl-kjv\" data-code=\"H8020\">Shalman</span> <span class=\"wl wl-kjv\" data-code=\"H7701\">spoiled</span> <span class=\"wl wl-kjv\" data-code=\"H1009\">Betharbel</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">battle:</span> the <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> was dashed in <span class=\"wl wl-kjv\" data-code=\"H7376\">pieces</span> upon her children.","15":"<span class=\"wl wl-kjv\" data-code=\"H3602\">So</span> shall <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto you <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of your <span class=\"wl wl-kjv\" data-code=\"H7451\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness:</span> in a <span class=\"wl wl-kjv\" data-code=\"H7837\">morning</span> shall the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H1820\">utterly</span> be cut off."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"is een uitgeledigde wijnstok,","tekst":"Of, was, te weten door de schatting van den koning Menahem, die duizend talenten zilver van zijne onderdanen genomen heeft voor den koning van Assyrië, Pul, zie 2Ki 15:19-20 , waarop sommigen dit duiden. Vergelijk boven Hos 7:9 . Anderen verstaan het van de onzinnige verkwisting hunner middelen in allerlei afgoderij, [waarvan in het volgende] en zetten het aldus over [menende de eigenschap der Hebreeuwse woorden wat nader te komen]: Israël is een wijnstok, uitledigende de vrucht [die] hij voor zich brengt, of weglegt; dat is, die zichzelven door zijne afgoderij berooft van hetgeen hij door mijn zegen ontvangt. Of, nader aldus: Israël ledigt den wijnstok uit, hij legt de vrucht voor zich weg; te weten tot afgodisch gebruik."},{"catchword":"hij brengt weder vrucht voor zich;","tekst":"Dat is, hij begint weder te bekomen, door mijn zegen, dien hij nochtans schandelijk misbruikt. Anders: hij maakt de vrucht zichzelven gelijk, de vrucht is gelijk de boom, gelijk hij van anderen wordt beroofd en uitgeput, alzo put hij zichzelven ook uit van zijn eigen middelen."},{"catchword":"goedheid zijns lands,","tekst":"Dat is vruchtbaarheid, goede inkomst, die Ik hun genadiglijk verleen."},{"catchword":"goed gemaakt","tekst":"Dat is schoon en kostelijk; hoe meer Ik hen zegen, hoe darteler en weelderiger zij in afgoderij worden, waaraan zij hun vermogen ten koste leggen. Vergelijk boven Hos 2:7 , en Hos 4:7 ."}],"2":[{"catchword":"Hij heeft hun hart","tekst":"Namelijk God, van wien in het volgende klaarlijk gesproken wordt. Dit schijnt het eenvoudigste te wezen."},{"catchword":"verdeeld,","tekst":"Door den geest van den twist en de tweedracht, waardoor zij elkander vernielen; zie boven Hos 7:7 , en vergelijk Jdg 9:23 , en de aantekening aldaar."},{"catchword":"verwoest worden;","tekst":"Dit wordt in het volgende verklaard. Anders: schuldig bevonden worden."},{"catchword":"doorhouwen,","tekst":"Gelijk men enen misdadiger den nek doorhouwt, of onthalst."}],"3":[{"catchword":"nu zullen zij zeggen","tekst":"Dat is, al haast, binnen korten tijd [gelijk in vs.2 en boven Hos 2:9 , en Hos 4:16 en Hos 8:10 , Hos 8:13 ; Isa 49:19 ; Jer 14:10 ; Amo 6:7 ; Mic 4:10 , en Mic 7:10 ] als hun land, koninkrijk en koning verwoest zullen zijn, dan zullen zij, gevoelende de waarheid van Gods dreigementen, en overtuigd zijnde van hun moedwillige boosheid, zichzelven moeten veroordelen. Vergelijk onder Hos 13:10 ."},{"catchword":"geen koning;","tekst":"Vergelijk onder vs.7, 15."},{"catchword":"doen?","tekst":"Al hebben wij een koning, wat hulp of voordeel zouden wij van hem kunnen verwachten, daar God onze tegenpartij geworden is? Zij willen zeggen, nietmetal."}],"4":[{"catchword":"woorden gesproken,","tekst":"Dit kan men verstaan van hoge, bittere en trotse woorden van den een tegen den ander in hun onderlinge samenzweringen, òf, tegen God en zijne profeten. [Vergelijk boven Hos 7:16 , en de aantekening; idem Mal 3:13 ] , òf, van hunne menigerlei samensprekingen en beraadslagingen [gelijk woorden ook voor raadslagen genomen worden. Zie 1Ki 1:7 ; Eze 38:10 met de aantekening] tot stijving hunner afgoderij en van hun staat tegen God, door handelingen met heidense koningen en verbonden, die zich lichtelijk met hoge woorden bezwoeren, en ze weder lichtelijk braken, waarop de volgende woorden zien."},{"catchword":"valselijk zwerende","tekst":"Gelijk zij zonder twijfel gedaan hebben, als zij zich aan den koning van Assyrië verbonden, en kort daarna weder van hem afvielen tot den koning van Egypte; 2Ki 17:3-4 . Anders: ijdellijk, of tevergeefs vloekende, zichzelven verzwerende, gelijk goddeloze mensen plegen te doen; zie boven Hos 4:2 ."},{"catchword":"oordeel","tekst":"Dat is, hunne straf, mijn oordeel over hen; zie Jer 48:21 , en boven Hos 6:5 ."},{"catchword":"vergiftig kruid","tekst":"Zie Psa 69:22 ."},{"catchword":"groenen,","tekst":"De straffen zullen zo overvloedig komen en toenemen als een boos onkruid wast in het veld."}],"5":[{"catchword":"inwoners van Samaria","tekst":"Hebreeuws, de inwoners zullen verschrikt worden over, of vrezen voor, enz.; dat is, elkeen der Samaritaanse inwoners zal verbaasd en ontzet zijn."},{"catchword":"kalf","tekst":"Versta, het gouden kalf van Bethel. Hebreeuws, kalven, of vaarskalven; dat is, dat grote kalf, gelijk behemoth; beesten, dat is, een groot beest gelijk een olifant, enz., want in het volgende wordt van dit kalf gesproken in het enkelvoud, en hetwelk op het kostelijkste moet gemaakt en versierd zijn geweest, omdat zij er zozeer over verschrikt en bedroefd zijn geweest, en dat het tot een geschenk voor den koning van Assyrië is weggevoerd. Anders zou dit kalf door verachting vaarskalven kunnen genoemd zijn of, omdat zij er meer dan een mogen gemaakt hebben, het ene van tijd tot tijd kostelijker en schoner dan het andere, uit vs.1."},{"catchword":"Beth-aven;","tekst":"Dat is, Bethel, gelijk onder vs.15. Zie boven Hos 4:15 ."},{"catchword":"zijn volk","tekst":"Het volk van het kalf, dat is, dat het kalf als een god eerde en aanhing. Vergelijk Jer 48:7 , en Jer 49:3 ."},{"catchword":"zal over hetzelve treuren,","tekst":"Hebreeuws, heeft getreurd, of treurt; dat is zal treuren, uit het voorgaande en volgende."},{"catchword":"Chemárim","tekst":"Versta, des kalfs afgodische papen of priesters; van deze chemarim, zie 2Ki 23:5 ."},{"catchword":"omdat zij van hetzelve is weggevaren","tekst":"Omdat zijne [des kalfs] heerlijkheid van hem weggevaren is; of, zij treuren over zijne [des kalfs] heerlijkheid, omdat het [kalf] is weggevaren in gevangenschap, gelijk volgt. Vergelijk Jer 48:7 ."}],"6":[{"catchword":"datzelve zal naar Assur gevoerd worden,","tekst":"Te weten kalf."},{"catchword":"Jareb;","tekst":"Zie boven Hos 5:13 ."},{"catchword":"raadslag","tekst":"Dat hij zich met Egypte heeft menen te sterken tegen den Assyriër, of, in het algemeen, vanwege al zijn afgodische vonden en vleselijke handelingen, waardoor hij zich meende als tegen Gods dank [om alzo te spreken] op de benen te houden, en in het bijzonder, den raad van Jerobeam van de twee kalven, welke afgoderij hij tot bevestiging van zijnen staat uitgedacht had; 1Ki 12:27-29 , en 2Ki 17:21 ."}],"7":[{"catchword":"Samaria is afgehouwen,","tekst":"Of, aangaande Samaria, hun koning is afgehouwen, afgesneden, uitgeroeid, of vergaan; dat is, zal zekerlijk uitgeroeid worden. Zie 2Ki 17:4 , en onder vs.15."},{"catchword":"schuim op het water","tekst":"Dat in het bruisen en zieden der wateren zich opdoet en verheft, alsof het iets ware, zijnde toch nietig en haast verdwijnende; alzo zal de koning met al zijn pracht en hoogmoed vergaan, en zeer veil en verachtelijk in gevangenschap worden weggestoken, alsof hij voor de ogen van zijn volk, gelijk een schuim, verdwenen was, en meteen het vertrouwen, dat Samaria op hunnen koning had."}],"8":[{"catchword":"Aven,","tekst":"Dat is, Beth-Aven, boven vs.5. Dat is, Bethel."},{"catchword":"zonde,","tekst":"Dat is, welke hoogten de voornaamste stof, idem ene aanleiding of aanritsing zijn van Israëls gruwelijke afgoderij en allerlei andere zonden, die zij aldaar in hunne tempels bij hunne altaren, idem onder al de groene bomen en in bossen, bedrijven. Vergelijk Deu 9:21 ; Isa 27:9 , en zie boven Hos 4:13 ; Lev 26:30 ; Eze 6:13 , en Eze 20:29 met de aantekening."},{"catchword":"doornen en distelen","tekst":"Vergelijk boven Hos 9:6 ."},{"catchword":"Bedekt ons","tekst":"Woorden van wanhopende mensen, die vanwege het gevoel en den schrik der tegenwoordige en toekomende oordelen Gods, mitsgaders het oordeel hunner eigen conscientiën, verbaasd en troosteloos zijnde, niet anders wensen dan maar al evenveel hoe, dood, of uit den weg te zijn, hoewel tevergeefs. Vergelijk Isa 2:19 ; Luk 23:30 ; Rev 6:16 ."}],"9":[{"catchword":"Sinds de dagen van Gibea,","tekst":"Of, meer dan [in] de dagen van Gibea. Zie boven Hos 9:9 met de aantekening."},{"catchword":"staande gebleven;","tekst":"Of slechtelijk, daar hebben zij gestaan. Men kan dit verstaan van de verschrikkelijke hardnekkigheid der Gibeanieten en de anderen van Benjamins stam, die in hunne goddeloosheid onbeschaamd bleven staan, stelden zich ten krijg als mannen [zo zij meenden] tegen hunne broeders, maar werden ten laatste bijkans ten enenmale uitgeroeid; of men kan het alzo nemen [hetwelk Israël in het algemeen aangaat, en met de volgende woorden het eenvoudigst schijnt overeen te komen] dat zij te dien tijde door Gods genade nog overeind zijn gebleven, en niet gans uitgeroeid, hoewel zij van beide zijden in gevaar waren van door elkander geheel vernield te worden."},{"catchword":"kinderen der verkeerdheid,","tekst":"Zie 2Sa 3:34 , en versta, de Gibeanieten met alle andere Benjaminieten."},{"catchword":"niet aangrijpen","tekst":"Dat is, zij zullen het nu zo goed niet hebben, hunne straf zal nu veel zwaarder vallen, zij zullen nu niet blijven staan, gelijk te dien tijde."}],"10":[{"catchword":"Het is in Mijn lust,","tekst":"Dat is, Ik heb het besloten en heb lust of begeerte dat Ik het uitvoer, en zal het ook doen. Vergelijk Deu 28:63 ; Isa 1:24 , en zie een gelijke manier van spreken Job 10:7 ."},{"catchword":"binden;","tekst":"Alsof de Heere zeide: Dewijl zij zich onder mijn juk niet wilden buigen, noch aan mijne wetten gebonden, noch van mij gedwongen zijn tot hun best, zo zal Ik hen nu door vreemde volken, als misdadigers ter straf, of als ossen, samenbinden en onder een vreemd juk brengen. Zie wijders op vs.11. Anders, tuchtigen."},{"catchword":"als Ik ze binden zal","tekst":"Of, als men hen binden zal, of met, mits, hen te binden, of hen bindende; dat is, deze volken zullen hen binden, door mijn rechtvaardig oordeel."},{"catchword":"voren","tekst":"Gelijk Efraïm en Juda zich samengekoppeld hebben als een paar ossen, gaande nevens elkander onder hun eigen juk in gelijke voren der afgoderij en andere zonden, zo zal Ik hen ook door hunne vijanden samenkoppelen ter straf, om onder een ander juk te gaan ploegen, enz. Anders, in hunne beide woningen, te weten Efraïm en Juda. Of, om hunne twee ongerechtigheden, ziende op de kalven van Dan en Bethel."}],"11":[{"catchword":"vaars is,","tekst":"Dat is, gelijk een jonge, dartele, weelderige koe, die liever het koren treedt [gelijk in het dorsen gebruikelijk was; zie Deu 25:4 ] , en daarvan eet, dan dat zij onder het juk zou gaan ploegen en hijgen; alzo [wil God zeggen] is Efraïm genegen om in weelde te leven naar zijn eigen lust en begeerte, maar niet onder mijn bedwang."},{"catchword":"gewend gaarne te dorsen,","tekst":"Hebreeuws, geleerd [zie Jer 2:24 ] liefhebbende te dorsen. Zie een gelijke samenvoeging van twee woorden, boven Hos 9:9 . Anders aldus: Zo Efraïm ene vaars gewend ware geweest mij liefhebbende, om te dorsen, toen Ik nevens zijn schonen hals ging, zo zou Ik Efraïm hebben doen rijden, enz., zie het einde van de volgende aantekening."},{"catchword":"schoonheid van haar hals overgegaan;","tekst":"Dat is, zijnen [des kalfs] schonen, vetten, gladden hals. Hebreeuws, goedheid; dat is, Ik zal hem onder het juk brengen, dat hem die vettigheid en schoonheid van den hals wel vergaan zal gelijk de ploegende ossen. Anderen nemen het alzo, dat God Efraïms schonen hals een langen tijd is als voorbijgegaan, heeft overgezien en verschoond, maar dat Hij nu aan hem zal doen gelijk volgt. Sommigen nemen ook wijders het volgende: Ik heb Efraïm doen rijden, Juda ploegen, Jakob eggen, enz.; alsof God hem verhaalde zijne weldaden aan hem bewezen."},{"catchword":"berijden,","tekst":"Dat is, Ik zal hen altemaal straffen, genoeg bedwingen en betemmen, maar Efraïm zal het kwaadste hebben, Juda en de rest van het volk ook kwaad genoeg, maar dragelijker dan de tien stammen, gelijk voor de beesten ploegen en eggen [dat is, de kluiten breken] wel lastig is, maar daarenboven den akkerman op den rug te hebben, of van een straffen ruiter bereden te worden, veel harder is."},{"catchword":"hem eggen","tekst":"Dat is, zoveel als slechts eggen, zijnde het woordje hem, of voor hem, of zich, als een overtollig bijvoegsel naar het gebruik der Hebreeuwse taal, gelijk ook dikwijls in de onze. Anders, hem, te weten Juda; verstaande dat Efraïm, als de machtigste, Juda nu en dan overmeesterd en bedwongen heeft; zie 2Ki 14:13 ; 2Ch 28:6 , en boven Hos 6:11 , met de aantekening. Of, [gelijk sommigen] Jakob [dat is, Israël of Efraïm] zal hem [Juda] de kluiten moeten breken."}],"12":[{"catchword":"Zaait u","tekst":"Versta hierop: Dat is het, dat Ik u steeds door mijne profeten heb laten voordragen. Vergelijk 2Ki 17:13 . Aangaande de manieren van spreken, van zaaien en maaien, vergelijk boven Hos 8:7 , en zie Job 4:8 . De zin is: Tracht naar ware bekering, naar een oprecht geloof en ongeveinsde liefde, opdat het u naar ziel en lichaam welga."},{"catchword":"tot gerechtigheid,","tekst":"Of, in."},{"catchword":"tot weldadigheid;","tekst":"Anders, naar."},{"catchword":"braakt u een braakland;","tekst":"Zie Jer 4:3 ."},{"catchword":"gerechtigheid","tekst":"Dat is, de vrucht der gerechtigheid; u overvloediglijk begenadigende met zijn tijdelijken en eeuwigen verbondszegen, dien Hij beloofd heeft dengenen, die in geloof en liefde wandelen. Vergelijk Psa 24:5 ; Eze 18:20 , en de aantekening aldaar. Tenware dat men dit eenvoudig moch duiden op den genadetijd van den Messias die onze gerechtigheid is voor God. Vergelijk Jer 23:6 ; Dan 9:24 , enz. en boven Hos 2:18 ."},{"catchword":"regene","tekst":"Anders: leer. Vergelijk Joe 2:23 ."}],"13":[{"catchword":"Gij hebt goddeloosheid geploegd,","tekst":"De Heere wil zeggen dat al zijne vermaningen en bevelen van hen veracht zijn, en dat zij regelrecht daartegen zijn aangegaan."},{"catchword":"verkeerdheid gemaaid,","tekst":"Het Hebreeuwse woord, dat verkeerdheid, of onrechtvaardigheid, schalkheid, ondeugd betekent, heeft hier een letter meer dan gewoon, dat hier van sommigen met het woord enkel wordt uitgedrukt; vergelijk Psa 3:3 . Men kan hierdoor verstaan de straf der verkeerdheid, als ongerechtigheid voor straf der ongerechtigheid, Lev 5:1 ; Psa 31:11 ; zonde voor straf der zonde, Zec 14:19 , enz. Of door het maaien hier en in vs.12 verstaan, den aanwas, het vervolg of de voortduring en gestadigen voortgang in het kwaad en goed."},{"catchword":"vrucht der leugen gegeten;","tekst":"Dewijl gij met leugens hebt omgegaan, en u daarop verlaten, zo ontvangt gij daarvan de rechtvaardige straf en beloning, als een vrucht uwer werken, der afgoderij en heidense verbonden; of gij eet leugenvrucht; dat is, gij komt bedrogen uit, gij bekomt niet wat gij verwacht hebt, uw arbeid of vertrouwen liegt u. Vergelijk boven Hos 9:2 ."},{"catchword":"weg,","tekst":"Dien gij ingegaan zijt om uw rijk te bevestigen, te weten afgoderij, met allerlei goddeloosheid en vleselijk vertrouwen op uzelven en de verbonden met uwe boelen."}],"14":[{"catchword":"gedruis ontstaan","tekst":"Of, rumoer, oproer, gekraak, groot geroep, als in tijden van groten overval des vijands placht te geschieden."},{"catchword":"volken,","tekst":"Der tien stammen."},{"catchword":"zullen verstoord worden,","tekst":"Hebreeuws, zal verstoord worden; dat is, elk in het bijzonder."},{"catchword":"Salman","tekst":"Anders genaamd Salmaneser, of Salmanasser, die wrede en trotse tiran van Assyrië; zie 2Ki 17:3 , enz. en 2Ki 18:9 , 2Ki 18:34-35 , en 2Ki 19:11-13 ."},{"catchword":"Beth-arbel","tekst":"Het is onzeker waar deze plaats is gelegen geweest. Sommigen houden het voor een stad in Israël over de Jordaan. Josef. lib. Antiq 12, cap.18, en lib.14, cap.32, maakt melding van ene stad Arbela, gelegen in Galilea, die mede schijnt vermeld te zijn 1 Mach.9:2; anderen voor een landschap in Assyrië, hebbende den naam van de stad Arbela, waaromtrent Alexander de Grote den Perzischen koning Darius overwon, en de Perzische monarchie eindigde. Deze historie van Salman en Betharbel is te dien tijde zonder twijfel onder het volk zeer bekend geweest."},{"catchword":"krijgs;","tekst":"In dien tocht, waarvan kortelijk gesproken wordt 2Ki 17:3-4 , enz. en 2Ki 19:13 , gelijk enigen menen."},{"catchword":"moeder werd er verpletterd","tekst":"Zie Gen 32:11 ."}],"15":[{"catchword":"Bethel ulieden gedaan,","tekst":"Dat is, al die gruwelijke afgoderij met andere zonden, te Bethel, of Beth aven [gelijk boven vs.5, of Aven, vs.8] bedreven, zijn de oorzaak van deze uwe plagen."},{"catchword":"boosheid uwer boosheid;","tekst":"Dat is, omdat uwe boosheid zo veelvoudig en verschrikkelijk groot is."},{"catchword":"koning","tekst":"Op wien zij vertrouwen; zie boven vs.7, en de aantekening."},{"catchword":"dageraad","tekst":"Dat is, vroeg, of haastiglijk, gelijk de dageraad of morgenrood met het rijzen van de zon vergaat, of onvoorziens, gelijk wanneer iemand in den morgenstond overvallen wordt; dit kan men ook vergelijken met Eze 7:7 , Eze 7:10 ; zie de aantekening aldaar."},{"catchword":"ten enenmale uitgeroeid","tekst":"Hebreeuws, uitgeroeid, of afgehouwen, afgesneden wordende, is hij uitgeroeid, enz. dat is, zal zekerlijk, enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Israel is an emptied vine; [Or, was etc. viz. by the tax of King Menahem who took a thousand talents silver from his subjects, for the king of Assyria, Pul. See 2 Kings 15.19,20. which some apply this unto. Compare ab. Chp. 7.9. Other understand it of their mad profuseness in spending upon all manner of idolatry, (whereof in sequel) reading the words thus (as seeming to come somewhat nearer the original) Israel is a vine emptying the fruit (which) he bringeth, or layeth up for himself i.e. by this idolatry doth bereave himself of what he receiveth through my blessing or closer yet, Israel emptieth the vine, be layes up the fruit for himself, viz. for idolatrous uses] he bringeth (again) fruit for himself, [i.e. he begins to bear again, through my blessing; which yet he grossely abuseth. Oth. He makes the fruit like to himself , the fruit is like the tree, as he is preyed upon and exhausted by others, so he exhaust and spoils himself no less of his own means] (but) according to the multitude of his fruit he hath multiplied the altars, according to the goodness of his land, [i.e. the fertility and good revenues thereof, which I have graciously bestowed upon them] they made good the erected images.[i.e. Made, set them out very stately and richly, implying, the more I blessed them, the more wanton and vain they grow in their idolatry, spending all upon the same. Compare ab.ch. 2.8. and chap. 4.7.]"}],"2":[{"catchword":null,"tekst":"He [viz. God, expressly spoken of in the sequel, this seems to be the plainest meaning] hath divided their heart; [by the spirit of discord and division, whereby they undo each other. See above chap 7 7. and compare Jud 9. 23. and the annot] now they shall be said waste; [this is explained in the sequel. Oth. Be found guilty] he shall cut &acirc;&euro;&ldquo; thorow all their idols; [as the neck is cut &acirc;&euro;&ldquo; thorow to a malefactor, I.e. as it were behead them] he shall destroy their standing images"}],"3":[{"catchword":null,"tekst":"For now they shall say, [I.e. are long, shortly, (as in the former verse, and ab. Chap. 2.10. and 4.16. Mich 4. 10, 13. Isa 40.29. Jer 14. 10. Amos 6.7. Mich 4. 10. and 7 10.) when their land, king and kingdom shall be destroyed; then experimentally finding; the truth of Gods threatenings, and being convinced of their selfwilled wickedness, they shall be bought to condemn themselves. [Compare bel. Chap. 13. 10.] we have no king; [Compare bel. Vers. 7.15.] for we have not feared the LORD; what then should a king do unto us? [thought we had a king, what help or advantage can we have by him, if God be become or adversarie? Implying, none at all sure.]"}],"4":[{"catchword":null,"tekst":"They spake words, [This may be understood of haughty, bitter and spightful words which they uttered one against the other in their mutual consiracies; or, against God and his Prophets. Compare ab. Chap. 7. 16. with the one, also Mal. 3.13 or of their manifold conferences and deliberations, (as words are likewise taken thus See 1 Kings 1 7. Ezek 38. 10. with the annot) for the maintenance of their idolatry and state against God, by Treaties with heathen kings, and confedencies with them, which they lightly sware to, in high words and as lightly brake again; which the following words seem to confirm] falsely swearing in making Covenant: [as doubtless they did, when they engaged themselves with the king of Assyria, and soon after sell off again from hi unto the king of Egypt, 2Kings 17. 34 Oth vainly, or I vain cursing , for wearing themselves, as wicked people use to do; See above ch.4 2.] therefore shall the judgment [I.e. their punishment, my judgment upon them. See Jer 48. on verse 21. and above chap 6.5.] spring forth as a poisonous herb [See Psal 60. on verse 22. I.e their punishment shall come increase abundantly, as worst weed in the field] upon the furrows of the fiel."}],"5":[{"catchword":null,"tekst":"The inhabitants of Samaria shall be dismayed, [Heb. The inhabitants shall be affrighted over one of the Samaritane inhabitants shall be terrified] over the calfe [ understand the golden Calfe of Bethel. Heb Calves, or, Heifes, even as Behemoth, Beasts, I.e. a great beast, such as an Elephant, etc. For in the sequel this calfe is spoken of in the singular number, which must need have been set out very sumptuously and gorgeously, they having stood in such a frightful awe of it, and it having been carried away afterwards to the King of Assyria, as a great present. Otherwise this Calfe may in contempt be called heifer, because they had made themselves more then one, and fro time to time, the one stately and glorious then the other, see verse 1.] of Beth &acirc;&euro;&ldquo; Aven: [I.e. Bethel, as below verse. 15. see above chap. 4. on vers. 15] foe this people [ the calf his people, I.e. which adored and adhered to the calf as God. Compare Jer 48. 7 and 49, 3. ] shall mourn over the same, [Heb. Hath mourned, or, doth mourn I.e. shall mourn, from what goeth before and followeth] together with his chermarim, [understand, the idolatrous Priests of the calf, of whom see further, 2 Kings 23. on vers 5.] (who) rejoyced over it, over its glory, it being desperated from it. [I.e. because the glory of this calf is gone and past. Or, they mourn over the glory of this calf, the same calf being carried away into captivity, as followeth, compare Jer 48:7]"}],"6":[{"catchword":null,"tekst":"Yea, the same [viz, calf] shall be carried to Assur, for a present to the King Jareb: [See above chap. 5. on vers.13] Ephraim shall get shame, and Israel shall be made ashamed because of his counsel:[ in that he thought to have strengthened himself against the Assyria with Egypt, or in general, because of all his wicked idolatrous devices, and carnal policies, whereby he conceived he should maintain him self well enough, no thanks to God, (as the saying is) yea against him; and especially that counsel of Jerobeam of setting up the two Calves, which idolatrie he had devised for the establishment of his state and Kingdom. 1 Kin.12,27,28,29. and 2 Kin.17.21.]"}],"7":[{"catchword":null,"tekst":"The king of Samaria is cut off, [Or, concerning Samaria, her King is cut off, chopt off, destroyed or, perijed. I.e. shall assuredly be destroyed. See 2 Kin.17.4 and below vers.15.] as scurn upon the water. [which in boiling and bubbling water doth swell and raise as if it were something, though it soon abates and comes to nothing, thus shall the King wit all his pomp and state decay suddenly, and vilely and contemptibly be made captive, as if he were vanished away in the sight of all his people, like a scurn, together with the confidence they had put in him.]"}],"8":[{"catchword":null,"tekst":"And the high places of Aven [i.e. Beth &acirc;&euro;&ldquo; aven, as above vers.5. meaning Bethel] Israel sin, [which high places were the chiefest matter and motive, or enticement of Israel for the committing of their abominable idolatry, and all manner of other sins, which there in their Temples, by their Altars, and under every green Tree, and in the groves they constantly committed. Compare Deut 9.21. Isa 27:9. and see above chap4.13. Lev.26.30. Ezek.6,13. and 20.29. with the annotat.] shall be destroyed: thorns and thistes shall come up [compare above chap. 9.6.] upon their Altars: And they shall say unto the Mountains, cover us, and unto the Hills, fall upon us. [words of despairing people, who by rason of the apprehensions and terrour of the present and approaching Judgment of God, together with the Verdict of their own conscience, are so dismaid and disconsolate, that they wish themselves dead and dispatched they care not how, so they may be out of the reach thereof, through all in vain. Compare Luke 23, 30. Rev 6.16. and Isa 2:19.]"}],"9":[{"catchword":null,"tekst":"Since the days of Gibea, [Or, more then in the days &c. See chap.9.9 with the annotat] hast thou sinned O Israel : there they stood to it; [Or simply there they stood. This may be understood of the fearful obstinancie of the Gibeonites and others of the tribe of Benjamin, who shamelessly stood to their wickedness, and put themselves in battle &acirc;&euro;&ldquo; array like men, (as they were conceited of themselves) against their brethren, but were at last destroyed almost altogether. Or it may be taken thus, (which concernd Israel in general, seems to agree most plainly with the following text) that they, by Gods mercy stood as yet, and were not utterly destroye, though on both sides they stood in danger to be utterly destroyed even the one by the other] the battle at Gibea, against the children of perversness, [See 2 Sam 3. on vers.55. and understand the Gibeonites, with all the rest of the Tribe of Benjamin] shall not seize them [i.e. they shall not have no good, but be far more grievously punished; they shall not be able to stand to it now, as they did.]"}],"10":[{"catchword":null,"tekst":"It is in my longing [Or, I long, i.e. I have decreed it, and long or desire to execute the same, and will do it also. Compare Deut.28.63. Isa.24. and see the like phrase Job10.7.] to bind them; [as in the LORD should say: seeing they will not bow under yoke, nor be tied to my Lawes, nor coerced or constrained for their own good, I shall cause them now to be bound as malefactors by foreign Nations, for punishment, or, as oxen coupling and fastening them together, to draw and bow down under a strange yoke. See further on the next vers. Others binde read correct, chastile] and Nations shall be gathered against them, when I shall binde them, [or when they binde them, or, with, together with their binding or, binding them. I.e. these Nations shall bind them, through my righteous Judgment] in their surrowes. [As Ephraim and Juda had yoked themselves together like yoke of oxen, drawing together under their own yoke in the same surrowes of idolatrie and other sins, so I will likewise couple them together by the enemy for punishment, to go plowing under a strange yoke, &c. oth, in both their habitations, to wit Ephraim&acirc;&euro;&trade;s and Juda&acirc;&euro;&trade;s; or, for their two iniquities, having respect to the Calves of Dan and Bethel.]"}],"11":[{"catchword":null,"tekst":"Because Ephraim is an Heifer used to love threshing, [Heb. taught (See Jer.2. on vers 24.) loving to thresh: see the like joyning of two above chap.9. verse 9. the sence is, like a yong, wanton, skittish Cow, much rather goes treading the full sheaves (which was the manner of the threshing then. See Deut.25. on vers4.) and feeding on them, then drawing the yoke and doing to plough; so (implies God here) is Ephraim inclined to live in the world, according to his own lust and pleasure, rather then under my Government and guidance] therefore I have passed over the beauty of her neck: [i.e. that calf its godly fat, and smooth neck.Heb. goodness I shall bring under the yoke, that the fastness and goodliness of this neck, shall soon pass&Atilde;&copy; away, as to plowing oxen: other take it thus; that God for a long time had as it were, past by, winked at and spared Ephraim&acirc;&euro;&trade;s goodly neck, but that now he would serve him as followeth] I will ride Ephraim, Juda shall plough, Jacob shall harrow before him. [i.e. I shall punish them all, and sufficiently order and tame them, but Ephraim shall have the worst of it; Juda and the rest, shall fare ill enough, but more tolerably then ten Tribes; as for the beast it is toilsome enough to plough and horrow (i.e. to break the colds) but to have the ploughman on the back besides, or to ridden by a fierce rider is much harder. By harrowing for or before him, is understood nothing but plain hartowing the words before him, or for himself being a certain redundancies, usual in the Hebrew language, as in other also. Oth. Him, to wit. Juda, understanding, that Ephraim, as the mightiest, had now then overmastered, and gotten the better hand of Juda, see 2 King 14.13. 2 Chro.28.6 and above chap.6.11. with the annotat, or as some, Jacob, I.e. Israel or Ephraim; shall be brought to break the clods to him viz, Juda: Some read thus, I made Ephraim ride, Juda a plow, Jacob must harrow &c. as if God related here what benefits he had shewed him otherwise the whole may admit this reading also. If Ephraim, an heifer, had been used, loving me, to thresh, when I went by his godly neck, I would have made Ephraim to ride, Juda to plough. As in the former reading]"}],"12":[{"catchword":null,"tekst":"Sowe to your selves for (or, in) righteousness, reap for (a, according to ) mercy; [understand here with all; this is that which I ever set before you by my Prophet Compare 2 King 17.13. As to the phrase of sowing and reaping, compare above chap. 8.7. and see Job 4. on vers. 8. the sense is, endovour for true repentance, upright Faith and unsained love, that it may go well with you in soul and body] break up your selves follow ground: [See vers. Jer.4. On vers. 3.] because it is time to seek the LORD, until he come, and rain upon you [I.e. teach, instruct you; compare Joel 2.23.] righteousness. [I.e. the fruit of righteousness abundantly blessing you with his temporal and eternal Covenants bliss, which he promised unto those that walk in faith and love. Compare Psal 24. 5. Ezek. 18.20. and the annotat there. Unless this should directly be applied to the time of grace of the Messiah&rsquo;s who is our righteousness before God. Compare Jer. 23.6. Dan.9, 24, &c and above chap. 2. 18]"}],"13":[{"catchword":null,"tekst":"To ploughed wickedness, reaped perverseness, [The LORD implied hereby, [that all his exhortation and receipts were had in contempt by them, and that they went clean contrary to him in all things. Th const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"

let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');

    const t = (D.noten || {})[noot.dataset.noot];

    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
