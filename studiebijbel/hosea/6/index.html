5","href":"../../hosea/5/#v5","ref":"Hos 5:5","svLabel":null},{"disp":"Hos 6:4","href":"../../hosea/6/#v4","ref":"Hos 6:4","svLabel":null},{"disp":"Hos 6:10","href":"../../hosea/6/#v10","ref":"Hos 6:10","svLabel":null},{"disp":"Hos 8:11","href":"../../hosea/8/#v11","ref":"Hos 8:11","svLabel":null},{"disp":"Hos 12:14","href":"../../hosea/12/#v15","ref":"Hos 12:15","svLabel":"SV 15"}],"kinderen":[]}]}]}]},"11":{"torrey":[{"topic":"Harvest, The","href":"../../torrey/h/#t-harvest-the","kinderen":[{"label":"Illustrative","href":"../../torrey/h/?hl=Hos.6.11#i8300","refs":[],"kinderen":[{"label":"Of a time of judgment","href":"../../torrey/h/?hl=Hos.6.11#i8304","refs":[{"disp":"Jer 51:33","href":"../../jeremia/51/#v33","ref":"Jer 51:33","svLabel":null},{"disp":"Hos 6:11","href":"../../hosea/6/#v11","ref":"Hos 6:11","svLabel":null}],"kinderen":[]}]}]}]}},"noten":{},"koppeling":{"1":"Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden.","2":"Hij zal ons na twee dagen levend maken; op de derde dag zal Hij ons doen opstaan, en wij zullen voor Zijn aangezicht leven.","3":"Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen <em>en</em> vroege regen voor het land.","4":"Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat.","5":"Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen <em>als</em> het licht.","6":"Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.","7":"Maar zij hebben het verbond overtreden als Adam; daar hebben zij trouweloos tegen Mij gehandeld.","8":"Gilead is een stad van werkers van ongerechtigheid; zij is besmeurd met bloed.","9":"Zoals de benden van straatrovers op iemand wachten, <em>zo</em> is het gezelschap van de priesters; zij moorden <em>op</em> de weg naar Sichem, waarlijk, zij doen schandelijke daden.","10":"Ik zie een afschuwelijke zaak in het huis van Israël; daar is Efraïms hoererij, Israël is verontreinigd.","11":"Ook heeft Hij u, o Juda! een oogst bepaald, toen Ik de gevangenen van Mijn volk terugbracht."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H2963\">torn,</span> and he will <span class=\"wl wl-kjv\" data-code=\"H7495\">heal</span> us; he hath <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten,</span> and he will bind us up.","2":"After two <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> will he <span class=\"wl wl-kjv\" data-code=\"H2421\">revive</span> us: in the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> he will raise us <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and we shall <span class=\"wl wl-kjv\" data-code=\"H2421\">live</span> in his sight.","3":"Then shall we <span class=\"wl wl-kjv\" data-code=\"H3045\">know,</span> if we <span class=\"wl wl-kjv\" data-code=\"H7291\">follow</span> on to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> his going <span class=\"wl wl-kjv\" data-code=\"H4161\">forth</span> is <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> as the <span class=\"wl wl-kjv\" data-code=\"H7837\">morning;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto us as the <span class=\"wl wl-kjv\" data-code=\"H1653\">rain,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4456\">latter</span> and former <span class=\"wl wl-kjv\" data-code=\"H3384\">rain</span> unto the earth.","4":"O <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> what shall I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto thee? O <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> what shall I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto thee? for your <span class=\"wl wl-kjv\" data-code=\"H2617\">goodness</span> is as a <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> it goeth away.","5":"Therefore have I <span class=\"wl wl-kjv\" data-code=\"H2672\">hewed</span> them by the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets;</span> I have <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> them by the <span class=\"wl wl-kjv\" data-code=\"H561\">words</span> of my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> are as the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> that goeth forth.","6":"For I <span class=\"wl wl-kjv\" data-code=\"H2654\">desired</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy,</span> and not <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> more than burnt offerings.","7":"But they like <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> have <span class=\"wl wl-kjv\" data-code=\"H5674\">transgressed</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant:</span> there have they dealt treacherously","8":"<span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> is a <span class=\"wl wl-kjv\" data-code=\"H7151\">city</span> of them that <span class=\"wl wl-kjv\" data-code=\"H6466\">work</span> <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity,</span> and is <span class=\"wl wl-kjv\" data-code=\"H6121\">polluted</span> with blood.","9":"And as <span class=\"wl wl-kjv\" data-code=\"H1416\">troops</span> of robbers <span class=\"wl wl-kjv\" data-code=\"H2442\">wait</span> for a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> so the <span class=\"wl wl-kjv\" data-code=\"H2267\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H7523\">murder</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> by <span class=\"wl wl-kjv\" data-code=\"H7926\">consent:</span> for they <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> lewdness.","10":"I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> an horrible <span class=\"wl wl-kjv\" data-code=\"H8186\">thing</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> there is the <span class=\"wl wl-kjv\" data-code=\"H2184\">whoredom</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is defiled.","11":"Also, O <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7896\">set</span> an <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> for thee, when I <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of my people."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"en laat ons wederkeren tot den HEERE,","tekst":"Sommigen hechten deze woorden aan het laatste van Hos 5 , als zijnde een onderlinge aanspraak tot bekering, die de gelovigen alsdan tot elkander zullen gebruiken."},{"catchword":"genezen;","tekst":"Dat Assur en Jareb niet doen konden, boven Hos 5:14 ; zie wijders Psa 30:3 ."},{"catchword":"geslagen,","tekst":"Vergelijk Eze 7:9 , met de aantekening."},{"catchword":"verbinden","tekst":"Zie Job 5:18 ; Psa 147:3 ."}],"2":[{"catchword":"levend maken;","tekst":"Want zij, [Efraïm en Juda, boven Hos 5:14 ] waren als doden en begravenen, ten tijde als zij naar Assyrië en Babel waren weggevoerd; [gelijk wij allen geestelijk dood waren door de zonde] zulks dat de verlossing was gelijk ene opwekking uit de doden; zie Eze 37 , Isa 26:19 , met de aantekening. Gelijk nu de verlossing uit Babel een voorbeeld was van onze geestelijke verlossing door Christus, alzo kunnen deze schone Evangelische woorden van dit en het volgende vs. wijders bekwamelijk geduid worden op de verrijzenis van onzen Zaligmaker en Hoofd Jezus Christus ten derden dage, en op de heerlijke vruchten, die het ganse lichaam van Christus, dat is, zijne kerk, daarvan geniet. Zie Rom 6:8 , Rom 6:11 ; Col 2:13 , en Col 3:1-3 , enz."},{"catchword":"leven","tekst":"Als nieuwgeboren kinderen, een nieuw mens, nieuwe creaturen, zullen wij in zijn huis onder zijn vaderlijke gunst gelukzalig leven en met vreugde wandelen in nieuwheid des levens, heiligheid en gerechtigheid, hier, en hierna in eeuwigheid. Zie Gen 17:1 ; Psa 4:7 ; Eze 16:6 , met de aantekening; idem, Luk 1:75 ; Rom 6:4 , Rom 6:8 , Rom 6:11 ; 2Co 5:15 , 2Co 5:17 ; Gal 6:15 ; Eph 2:15 , en Eph 4:24 ; 1Th 4:17 , en 1Th 5:10 ; 1Pe 2:2 ."}],"3":[{"catchword":"kennen,","tekst":"Zie van zulke samenvoeging van twee woorden Psa 45:5 . De zin is: Wij zullen door des Heeren genade alsdan hem en zijnen Messias kennen, en vuriglijk ijveren en zorg daarvoor dragen, dat wij in kennis mogen toenemen en wassen, totdat wij eindelijk na dezen de volmaaktheid bekomen. Zie boven Hos 2:19 ; 1Co 13:9-10 , en vergelijk hiermede hun vorigen staat, boven Hos 4:1 , Hos 4:6 , en Hos 5:4 ."},{"catchword":"uitgang","tekst":"Dat is opgang, als wanneer de zon gelijk een bruidegom uit zijne slaapkamer uitgaat, [ Psa 19:6 ] . Versta, de aankomst van God tot de verlossing van zijn volk uit de Babylonische gevangenschap, en de Heere Christus tot onze geestelijke verlossing."},{"catchword":"bereid","tekst":"Of, gericht, geschikt."},{"catchword":"dageraad;","tekst":"Zo aangenaam en lieflijk, idem zo zeker en vast, als het aanbreken van den dag en het rijzen der zon, na de nachtelijke duisternis."},{"catchword":"tot ons komen","tekst":"Of, voor ons, tot ons best."},{"catchword":"regen,","tekst":"Dat is, na een langdurige droogte, wanneer men zeer naar regen verlangd heeft. Vergelijk Deu 32:2 ; Job 29:23 ; Psa 72:6 , en Eze 34:26 ."},{"catchword":"spade regen en vroege regen","tekst":"Zie Deu 11:14 . De zin is dat God niet zal feilen om zijne weldadigheid aan zijne kerk te bewijzen en te vervolgen, telkens op zijnen tijd, en voornamelijk zijn genadewerk door Christus."},{"catchword":"des lands","tekst":"Of, der aarde."}],"4":[{"catchword":"Wat zal Ik u doen,","tekst":"Alsof de Heere zeide: Hoe kan ik u anders doen dan Ik u dagelijks dreig? Hoe zou Ik u kunnen verschonen? Hier komt God weder tot de straf predikatie , gelijk het gevolg van den tekst uitwijst."},{"catchword":"morgenwolk,","tekst":"Die haast opkomt en weder vergaat. Vergelijk onder Hos 13:3 . God wil zeggen dat zij somtijds zich hielden en een schijn gaven alsof zij zich wilden bekeren, maar dat zelfs die schijn terstond weder verdween; zo ver was het vandaar, dat zij zich dadelijk zouden bekeren."}],"5":[{"catchword":"behouwen door de profeten;","tekst":"Dat is, hardelijk en scherpelijk bestraft en gescholden, gebruikende [gelijk men zegt] een scherpe harde bijl tot een harden kwast."},{"catchword":"gedood","tekst":"Dat is, allen troost en hulp ontzegt, en integendeel het oordeel des doods, of van een dodelijk verderf aangezegd. Zie Jer 1:10 , enz."},{"catchword":"uw oordelen","tekst":"Versta, de oordelen, vonnissen, of straffen, die Ik over u, o Efraïm en Juda, wil laten gaan. Hebreeuws, uwe oordelen zal, enz.; dat is, elk oordeel, dat gij door uw veelvoudig en langdurig zondigen voor en na verdiend hebt."},{"catchword":"voortkomen aan het licht","tekst":"Dat is, zullen ten laatste uitbreken, voor den dag komen en in het openbaar voor al de wereld over uw openbare zonden geoefend en voor rechtvaardig bekend worden. Vergelijk de manier van spreken met Job 12:22 , en Job 28:11 ; Mic 7:9 ; Zep 3:5 . Dit schijnt de eenvoudigste overzetting dezer woorden te zijn. Anders: en, of, opdat uwe oordelen licht zal voortkomen."}],"6":[{"catchword":"Want Ik heb lust tot weldadigheid,","tekst":"Alsof God zeide: Gij zoudt mogen zeggen dat gij immers niet nalaat in het offeren, volgens mijn gebod; maar [wil God zeggen] het is u genoeg bekend wat Ik dienaangaande u geboden en geleerd heb, gelijk volgt. Vergelijk Mic 6:6-8 ."},{"catchword":"niet tot offer;","tekst":"Dat is, meer dan tot offer, niet tot offer alleen, gelijk in het volgende lid gezegd wordt; [vergelijk Gen 32:28 ; 1Sa 15:22 ; Pro 8:10 ; Jer 7:22 , en Jer 16:14 met de aantekening] of eenvoudig niet tot offer; te weten een huichelachtig offer, het uiterlijk offer in zichzelf, zonder geloof en boetvaardigheid, [vergelijk Psa 50:12-15 ; Isa 1:11 , enz.] en dan voorts, meer dan, in het volgende, dat is, en niet tot brandoffers, in gelijk verstande, gelijk tevoren; [vergelijk Luk 18:14 ] , zodat het volgende verklaard wordt door het voorgaande. Beide manieren van spreken zijn in de Schriftuur van deze stof gebruikelijk; want somtijds wordt het uitwendige [als ook in zijn graad van God ingesteld zijnde] met het inwendige vergeleken, somtijds in zich alleen en zonder het inwendige aangemerkt en kortweg verworpen, ja zeer heftig gescholden, als een trouweloze verbondbreking, gelijk hier ook in het volgende."}],"7":[{"catchword":"verbond overtreden","tekst":"Wat Ik met hen en zij met mij gemaakt hadden, door tussenkomen van offeranden. Zie Psa 50:5 ."},{"catchword":"Adam;","tekst":"Volgende de voetstappen van hun eersten vader, die, hoewel overvloediglijk van mij begaafd en gezegend zijnde, nochtans mijn gebod overtrad en van mij afviel. Vergelijk Job 31:22 , en Isa 43:27 , met de aantekening. Anders, als mensen; dat is, als lichtvaardige lieden plegen te doen. Of, als eens mensen, te weten verbond; dat is, alsof zij met een gewoon mens en niet met mij, den almachtigen en rechtvaardigen God, te doen hadden."},{"catchword":"daar hebben zij trouwelooslijk","tekst":"Dat is, daarin, in de wezenlijkheid van het verbond en den godsdienst mij bespottende met hun huichelachtige offers, die zij mij hebben willen opdringen, alsof zij daarmede aan het verbond hadden voldaan. Anders, raad, te weten in mijn heilig land, dat Ik hun had gegeven om mij daarin te dienen en gehoorzaam te zijn."}],"8":[{"catchword":"Gilead is een stad","tekst":"Dit wordt bij sommigen gehouden voor Ramoth Gileads, in den stam van Gad, zijnde ene stad der Levieten, en verordineerd tot een vrijstad, aan de oostzijde van de Jordaan, maar onder deksel van dien, geworden ene spelonk van moedwillige doodslagers en moordenaars. Zie Deu 4:43 ; Jos 20:8 , en Jos 21:38 . Nochtans wordt in sommige kaarten ene stad met den naam van Gilead gesteld aan het gebergte Gilead, waar Laban Jakob achterhaalde, waarvan de verstandige lezer kan oordelen. Sommigen zetten het over: Elke stad van Gilead [is ene stad] van, enz. Of, Gilead is [als] een stad, enz. Dat is, het ganse land Gilead is als een enige stad, verenigd in boosheid, en daarom gestraft. Zie 2Ki 15:25 , 2Ki 15:29 ; 1Ch 5:25-26 ."},{"catchword":"betreden van bloed","tekst":"Dat is, vol van moorderijen, zodat de voetstappen van het bloed [om zo te spreken] overal staan. Dit schijnt de eenvoudigste zin dezer woorden te zijn. Vergelijk onder Hos 12:12 ; 2Ki 21:16 ."}],"9":[{"catchword":"benden der straatschenders","tekst":"Of, stropende benden, struikrovers, enz., die in die landen, vermits de gebergten en woestijnen, vele waren, inzonderheid bij den vervallen staat des lands."},{"catchword":"wachten,","tekst":"Om den reizenden man af te zetten, te moorden en te plunderen."},{"catchword":"priesteren;","tekst":"Of, regeerders der officieren, zo kerkelijke als burgerlijke. Zie boven Hos 4:9 ."},{"catchword":"Sichem,","tekst":"Ook ene stad der Levieten en een vrijstad, aan de westzijde van de Jordaan in Kanaän; Jos 21:21 . Zie wijders van Sichems gelegenheid, Jdg 8:31 , en Jdg 9:25 met de aantekening. Waaruit blijkt dat aldaar de rovers op de hoogten der bergen plachten te loeren op degenen, die op de heerstraten voorbij reisden. Zo deden nu de priesters, gestijfd door de goddeloze regenten. Een gruwelijk gevolg van afgoderij. Vergelijk boven Hos 5:1-2 , met de aantekening. Anders [naar] de wijze van Sichem, idem, met [enen] schouder; dat is, eendrachtiglijk. Zie Zep 3:9 ."},{"catchword":"schandelijke daden","tekst":"Dat is, zij vergrijpen zich niet uit roekeloosheid, haastigheid of onbedachtzaamheid, maar bedrijven zulke gruwelijke schelmstukken met voorbedacht opzet, waar het Hebreeuwse woord op ziet."}],"10":[{"catchword":"afschuwelijke zaak","tekst":"Vergelijk Jer 5:30 , en Jer 18:13 , en Jer 23:14 ."}],"11":[{"catchword":"hij u, o Juda","tekst":"Namelijk Efraïm."},{"catchword":"oogst gezet,","tekst":"Het schijnt dat God hier wil zeggen, dat de tien stammen [van welker goddeloosheid in het voorgaand gesproken is] een kwaad zaad der afgoderij onder die van Juda gezaaid, of een plant, tak, loot, afzetsel daarvan medegedeeld hebben, waarvan Juda niets dan verdriet en ellende heeft ingeoogst; gelijk gebeurd is ten tijde van den koning Achaz, wanneer God, op Juda vertoornd zijnde, hen voor Pekah, den zoon van Remalia, koning van Israël, liet vallen, zodat er honderd twintig duizend van Juda doodgeslagen en twee honderd duizend vrouwen, zonen en dochters gevankelijk werden weggevoerd naar Samaria, met groten roof. Alzo strafte God Juda door Israël zelf, wiens voorbeeld zij in afgoderij begonnen na te volgen. Zie 2Ch 28:5-6 , enz., en vergelijk de manier van spreken met Jer 51:33 ; Joe 3:13 ; Rev 14:15 ."},{"catchword":"gevangenen Mijns volks","teks (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
