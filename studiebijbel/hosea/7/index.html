d onder hen die tot Mij roept.","8":"Efraïm, die vermengt zich met de volken; Efraïm is een koek die niet is omgekeerd;","9":"Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid[1] over hem verspreid, en hij merkt het niet.","10":"Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.","11":"Want Efraïm is als een domme duif, zonder verstand; zij roepen Egypte aan, zij gaan heen tot Assur.","12":"Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.","13":"Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.","14":"Zij roepen ook niet tot Mij met hun hart, wanneer zij huilen op hun bedden; om koren en most verzamelen zij zich, *maar* zij weerstreven Mij.","15":"Ik heb hen wel getuchtigd, *en* hun armen gesterkt; maar zij denken kwaad tegen Mij.","16":"Zij keren zich om, *maar* niet *naar* de Allerhoogste, zij zijn als een bedrieglijke boog; hun vorsten vallen door het zwaard, vanwege de woede van hun tong; dit zal hun bespotting zijn in het land Egypte."},"SV":{"1":"Terwijl Ik Israël genees, zo wordt Efraïms ongerechtigheid ontdekt, mitsgaders de boosheden van Samaria; want zij werken valsheid; en de dief gaat er in, de bende der straatschenders stroopt daar buiten.","2":"En zij zeggen niet in hun hart, *dat* Ik al hunner boosheid gedachtig ben; nu omsingelen hen hun handelingen, zij zijn voor Mijn aangezicht.","3":"Zij verblijden den koning met hun boosheid, en de vorsten met hun leugenen.","4":"Zij bedrijven al te zamen overspel, zij zijn gelijk een bakoven, die heet gemaakt is van den bakker; *die* ophoudt van wakker te zijn, nadat hij het deeg heeft gekneed, totdat het doorgezuurd zij.","5":"Het is de dag onzes konings; de vorsten maken *hem* krank *door* verhitting van den wijn; hij strekt zijn hand voort met de spotters.","6":"Want zij voeren hun hart aan, als een bakoven, tot hun lagen; hunlieder bakker slaapt den gansen nacht; 's morgens brandt hij als een vlammend vuur.","7":"Zij zijn allen te zamen verhit als een bakoven, en zij verteren hun rechters; al hun koningen vallen; er is niemand onder hen, die tot Mij roept.","8":"Efraïm, die verwart zich met de volken; Efraïm is een koek, die niet is omgekeerd;","9":"Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwigheid op hem verspreid, en hij merkt het niet.","10":"Dies zal de hovaardij van Israël in zijn aangezicht getuigen; dewijl zij zich niet bekeren tot den Heere, hun God, noch Hem zoeken in alle deze.","11":"Want Efraïm is als een botte duif, zonder hart; zij roepen Egypte aan, zij gaan henen tot Assur.","12":"Wanneer zij zullen henengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogelen des hemels doen nederdalen. Ik zal ze tuchtigen, gelijk gehoord is in hun vergadering.","13":"Wee hen, want zij zijn van Mij afgezworven; verstoring over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugenen tegen Mij.","14":"Zij roepen ook niet tot Mij met hun hart, wanneer zij huilen op hun legers; om koren en most verzamelen zij zich, *maar* zij wederstreven tegen Mij.","15":"Ik heb hen wel getuchtigd, *en* hunlieder armen gesterkt; maar zij denken kwaad tegen Mij.","16":"Zij keren zich, *maar* niet *tot* den Allerhoogste, zij zijn als een bedriegelijke boog; hun vorsten vallen door het zwaard; vanwege de gramschap hunner tong; dit is hunlieder bespotting in Egypteland."},"KJV":{"1":"When I would have healed Israel, then the iniquity of Ephraim was discovered, and the wickedness of Samaria: for they commit falsehood; and the thief cometh in, *and* the troop of robbers spoileth without.","2":"And they consider not in their hearts *that* I remember all their wickedness: now their own doings have beset them about; they are before my face.","3":"They make the king glad with their wickedness, and the princes with their lies.","4":"They *are* all adulterers, as an oven heated by the baker, *who* ceaseth from raising after he hath kneaded the dough, until it be leavened.","5":"In the day of our king the princes have made *him* sick with bottles of wine; he stretched out his hand with scorners.","6":"For they have made ready their heart like an oven, whiles they lie in wait: their baker sleepeth all the night; in the morning it burneth as a flaming fire.","7":"They are all hot as an oven, and have devoured their judges; all their kings are fallen: *there is* none among them that calleth","8":"Ephraim, he hath mixed himself among the people; Ephraim is a cake not turned.","9":"Strangers have devoured his strength, and he knoweth *it* not: yea, gray hairs are here and there upon him, yet he knoweth","10":"And the pride of Israel testifieth to his face: and they do not return to the LORD their God, nor seek","11":"Ephraim also is like a silly dove without heart: they call to Egypt, they go to Assyria.","12":"When they shall go, I will spread my net upon them; I will bring them down as the fowls of the heaven; I will chastise them, as their congregation hath heard.","13":"Woe unto them! for they have fled from me: destruction unto them! because they have transgressed against me: though I have redeemed them, yet they have spoken lies","14":"And they have not cried unto me with their heart, when they howled upon their beds: they assemble themselves for corn and wine, *and* they rebel","15":"Though I have bound *and* strengthened their arms, yet do they imagine mischief","16":"They return, *but* not to the most High: they are like a deceitful bow: their princes shall fall by the sword for the rage of their tongue: this *shall be* their derision in the land of Egypt."}},"tsk":{"1":[{"kopje":"Ik genees","refs":["Jer 51:9","Matt 23:37","Lu /1-johannes/2/#v9","ref":"1 Joh 2:9","svLabel":null},{"disp":"1 Joh 2:19","href":"../../1-johannes/2/#v19","ref":"1 Joh 2:19","svLabel":null},{"disp":"1 Joh 4:20","href":"../../1-johannes/4/#v20","ref":"1 Joh 4:20","svLabel":null},{"disp":"Judas 1:1","href":"../../judas/1/#v1","ref":"Judas 1:1","svLabel":null},{"disp":"Openb 2:9","href":"../../openbaring/2/#v9","ref":"Openb 2:9","svLabel":null},{"disp":"Openb 3:1","href":"../../openbaring/3/#v1","ref":"Openb 3:1","svLabel":null},{"disp":"Openb 3:9","href":"../../openbaring/3/#v9","ref":"Openb 3:9","svLabel":null}],"kinderen":[]}]}],"torrey":[{"topic":"Bow, The","href":"../../torrey/b/#t-bow-the","kinderen":[{"label":"Illustrative","href":"../../torrey/b/?hl=Hos.7.16#i2035","refs":[],"kinderen":[{"label":"(When deceitful,) of the hypocrite","href":"../../torrey/b/?hl=Hos.7.16#i2038","refs":[{"disp":"Ps 78:57","href":"../../psalmen/78/#v57","ref":"Ps 78:57","svLabel":null},{"disp":"Hos 7:16","href":"../../hosea/7/#v16","ref":"Hos 7:16","svLabel":null}],"kinderen":[]}]}]}]}},"noten":{"1":"SV: grauwigheid. D.i.: grijze haren, teken van ouderdom."},"koppeling":{"1":"Terwijl Ik Israël genees, wordt Efraïms ongerechtigheid ontdekt, alsook de boosheden van Samaria; want zij werken valsheid; en de dief gaat er in, de bende van straatschenders plundert daarbuiten.","2":"En zij zeggen niet in hun hart <em>dat</em> Ik al hun boosheid onthoud; nu omsingelen hun daden hen, zij zijn voor Mijn aangezicht.","3":"Zij verblijden de koning met hun boosheid, en de vorsten met hun leugens.","4":"Zij plegen allemaal samen overspel, zij zijn als een bakoven, die heet gemaakt is door de bakker; <em>die</em> ophoudt met opstoken nadat hij het deeg heeft gekneed, totdat het doorgezuurd is.","5":"Het is de dag van onze koning; de vorsten maken <em>hem</em> ziek <em>door</em> verhitting van de wijn; hij strekt zijn hand uit met de spotters.","6":"Want zij brengen hun hart klaar, als een bakoven, voor hun listen; hun bakker slaapt de hele nacht; 's morgens brandt hij als een vlammend vuur.","7":"Zij zijn allemaal samen verhit als een bakoven, en zij verteren hun rechters; al hun koningen vallen; er is niemand onder hen die tot Mij roept.","8":"Efraïm, die vermengt zich met de volken; Efraïm is een koek die niet is omgekeerd;","9":"Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid<sup class=\"noot\" data-noot=\"1\">1</sup> over hem verspreid, en hij merkt het niet.","10":"Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.","11":"Want Efraïm is als een domme duif, zonder verstand; zij roepen Egypte aan, zij gaan heen tot Assur.","12":"Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.","13":"Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.","14":"Zij roepen ook niet tot Mij met hun hart, wanneer zij huilen op hun bedden; om koren en most verzamelen zij zich, <em>maar</em> zij weerstreven Mij.","15":"Ik heb hen wel getuchtigd, <em>en</em> hun armen gesterkt; maar zij denken kwaad tegen Mij.","16":"Zij keren zich om, <em>maar</em> niet <em>naar</em> de Allerhoogste, zij zijn als een bedrieglijke boog; hun vorsten vallen door het zwaard, vanwege de woede van hun tong; dit zal hun bespotting zijn in het land Egypte."},"koppeling_kjv":{"1":"When I would have <span class=\"wl wl-kjv\" data-code=\"H7495\">healed</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> then the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> was <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria:</span> for they <span class=\"wl wl-kjv\" data-code=\"H6466\">commit</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">falsehood;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1590\">thief</span> cometh <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1416\">troop</span> of robbers <span class=\"wl wl-kjv\" data-code=\"H6584\">spoileth</span> without.","2":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">consider</span> not in their <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> that I <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> all their <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness:</span> now their own <span class=\"wl wl-kjv\" data-code=\"H4611\">doings</span> have beset them <span class=\"wl wl-kjv\" data-code=\"H5437\">about;</span> they are before my face.","3":"They make the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8055\">glad</span> with their <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> with their lies.","4":"They are all <span class=\"wl wl-kjv\" data-code=\"H5003\">adulterers,</span> as an <span class=\"wl wl-kjv\" data-code=\"H8574\">oven</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">heated</span> by the <span class=\"wl wl-kjv\" data-code=\"H644\">baker,</span> who <span class=\"wl wl-kjv\" data-code=\"H7673\">ceaseth</span> from <span class=\"wl wl-kjv\" data-code=\"H5782\">raising</span> after he hath <span class=\"wl wl-kjv\" data-code=\"H3888\">kneaded</span> the <span class=\"wl wl-kjv\" data-code=\"H1217\">dough,</span> until it be leavened.","5":"In the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of our <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> have made him <span class=\"wl wl-kjv\" data-code=\"H2470\">sick</span> with <span class=\"wl wl-kjv\" data-code=\"H2534\">bottles</span> of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine;</span> he stretched <span class=\"wl wl-kjv\" data-code=\"H4900\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> with scorners.","6":"For they have made <span class=\"wl wl-kjv\" data-code=\"H7126\">ready</span> their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> like an <span class=\"wl wl-kjv\" data-code=\"H8574\">oven,</span> whiles they lie in <span class=\"wl wl-kjv\" data-code=\"H693\">wait:</span> their <span class=\"wl wl-kjv\" data-code=\"H644\">baker</span> <span class=\"wl wl-kjv\" data-code=\"H3463\">sleepeth</span> all the <span class=\"wl wl-kjv\" data-code=\"H3915\">night;</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> it <span class=\"wl wl-kjv\" data-code=\"H1197\">burneth</span> as a <span class=\"wl wl-kjv\" data-code=\"H3852\">flaming</span> fire.","7":"They are all <span class=\"wl wl-kjv\" data-code=\"H2552\">hot</span> as an <span class=\"wl wl-kjv\" data-code=\"H8574\">oven,</span> and have <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> their <span class=\"wl wl-kjv\" data-code=\"H8199\">judges;</span> all their <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> are <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen:</span> there is none among them that calleth","8":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H1101\">mixed</span> himself among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> is a <span class=\"wl wl-kjv\" data-code=\"H5692\">cake</span> not turned.","9":"<span class=\"wl wl-kjv\" data-code=\"H2114\">Strangers</span> have <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> his <span class=\"wl wl-kjv\" data-code=\"H3581\">strength,</span> and he <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> it not: yea, gray <span class=\"wl wl-kjv\" data-code=\"H7872\">hairs</span> are here and <span class=\"wl wl-kjv\" data-code=\"H2236\">there</span> upon him, yet he knoweth","10":"And the <span class=\"wl wl-kjv\" data-code=\"H1347\">pride</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">testifieth</span> to his <span class=\"wl wl-kjv\" data-code=\"H6440\">face:</span> and they do not <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> nor seek","11":"<span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> also is like a <span class=\"wl wl-kjv\" data-code=\"H6601\">silly</span> <span class=\"wl wl-kjv\" data-code=\"H3123\">dove</span> without <span class=\"wl wl-kjv\" data-code=\"H3820\">heart:</span> they <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> to <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> they <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> to Assyria.","12":"When they shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> my <span class=\"wl wl-kjv\" data-code=\"H7568\">net</span> upon them; I will bring them <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> as the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> I will <span class=\"wl wl-kjv\" data-code=\"H3256\">chastise</span> them, as their <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> hath heard.","13":"<span class=\"wl wl-kjv\" data-code=\"H188\">Woe</span> unto them! for they have <span class=\"wl wl-kjv\" data-code=\"H5074\">fled</span> from me: <span class=\"wl wl-kjv\" data-code=\"H7701\">destruction</span> unto them! because they have <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressed</span> against me: though I have <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> them, yet they have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> lies","14":"And they have not <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> unto me with their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> when they <span class=\"wl wl-kjv\" data-code=\"H3213\">howled</span> upon their <span class=\"wl wl-kjv\" data-code=\"H4904\">beds:</span> they <span class=\"wl wl-kjv\" data-code=\"H1481\">assemble</span> themselves for <span class=\"wl wl-kjv\" data-code=\"H1715\">corn</span> and <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and they rebel","15":"Though I have <span class=\"wl wl-kjv\" data-code=\"H3256\">bound</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> their <span class=\"wl wl-kjv\" data-code=\"H2220\">arms,</span> yet do they <span class=\"wl wl-kjv\" data-code=\"H2803\">imagine</span> mischief","16":"They <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> but not to the most <span class=\"wl wl-kjv\" data-code=\"H5920\">High:</span> they are like a <span class=\"wl wl-kjv\" data-code=\"H7423\">deceitful</span> <span class=\"wl wl-kjv\" data-code=\"H7198\">bow:</span> their <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> for the <span class=\"wl wl-kjv\" data-code=\"H2195\">rage</span> of their <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue:</span> <span class=\"wl wl-kjv\" data-code=\"H2097\">this</span> shall be their <span class=\"wl wl-kjv\" data-code=\"H3933\">derision</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"genees,","tekst":"Dat is, bezig ben door mijne profeten om de tien stammen tot bekering te vermanen, en hen tot geestelijken en lichamelijken welstand te brengen. Zie Psa 30:3 , en onder Hos 11:3 ."},{"catchword":"ontdekt,","tekst":"Dat is, zo bevindt zich, dat de wortel en oorsprong aller boosheid en ongebondenheid tegen de eerste en tweede tafel, is in den stam van Efraïm, en voornamelijk in des konings hof te Samaria. Of, hunne boosheid wordt ontdekt, door hunne wederstrevigheid tegen al mijne vermaningen, zulks dat zij zich ongeneeslijk tonen."},{"catchword":"Samaria;","tekst":"Zie 1Ki 16:24 ."},{"catchword":"valsheid;","tekst":"Dat is, allerlei afgoderij en huichelarij, zijnde enkel bedrog en valsheid, waardoor zij het verbond met mj breken; zie Psa 44:18 , Psa 44:21 ; handelende insgelijks valselijk met den naaste; zie Lev 19:11 ."},{"catchword":"gaat er in,","tekst":"Stelen, roven en moorden is binnen en buiten vrij, en heeft de overhand, zodat beide tafelen van Gods wet verbroken zijn."},{"catchword":"bende der straatschenders","tekst":"Zie boven Hos 5:1-2 ."}],"2":[{"catchword":"zij zeggen niet in hun hart,","tekst":"Dat is, zij denken niet eens dat Ik zulks alles zie en zoeken zal."},{"catchword":"omsingelen hen hun handelingen,","tekst":"Als touwen, hen benauwende en verstrikkende, zodat zij niet zullen kunnen ontkomen, of als dienaars van justitie, om hen als misdadigers te vangen en voor het gericht te stellen, waarvan zij nu [dat is, al haast] de waarheid zullen bevinden."},{"catchword":"voor Mijn aangezicht","tekst":"Naakt en bloot, zij zijn mij alle bekend, en Ik zal ze ter hand nemen, om daarop te letten en recht te doen."}],"3":[{"catchword":"verblijden den koning met hun boosheid,","tekst":"De goddeloosheid van den koning en zijne vorsten was zo groot, dat zij vreugde en vermaak namen in de gruwelijke boosheid der priesters en van het volk, als dienende tot stijving der afgoderij, waarin zij de vastigheid van hunnen staat stelden; zulks het volk wetende, maakten het zo, gelijk hun koning het gaarne had, hoe erger hoe liever."}],"4":[{"catchword":"bakoven,","tekst":"Zij zijn zo verhit in de afgoderij en de aanklevende zonden, als een brandende of gloeiende oven, en evenwel zo ongevoelig en zo zorgeloos daarover, als de slapende bakker. Zie vs.6."},{"catchword":"zijn,","tekst":"Of, wakker te maken; dat is, hij slaapt zelf, en laat alles slapen en in rust, totdat men het brood in den oven zal steken, wanneer het deeg genoeg gerezen en doorzuurd is. Alzo laten zij den zuurdesem der boosheid voortgaan en den oven der afgoderij heet worden, totdat alles naar hunnen zin, op het allerergste gesteld is. Vergelijk Mat 16:12 ; Luk 12:1 . Anderen aldus: Die heet gemaakt wordt van den bakker als hij ophoudt van op te wekken; [te weten, degenen die bakken zullen] nadat men het deeg heeft gekneed, totdat het doorzuurd is."}],"5":[{"catchword":"Het is de dag onzes konings;","tekst":"Dit kan men nemen als woorden der vorsten en hovelingen. Anders: [op] den dag van onzen koning, maken de vorsten hem krank. Door den dag van den koning kan men verstaan den dag zijner geboorte, gelijk Gen 40:20 , of kroning, of een feestdag van hem aangesteld tot den dienst der kalven; zie 1Ki 12:32-33 , en vergelijk Joh 1:4 met de aantekening, Mat 14:6 ."},{"catchword":"hem krank","tekst":"Den koning; uit het voorgaande en volgende. Anders: maken zichzelven krank."},{"catchword":"door verhitting van den wijn;","tekst":"Dat is, door hete wijnteugen, of door het zuipen van heten wijn. Anders: [met] flessen van wijn."},{"catchword":"strekt zijn hand voort met de spotters","tekst":"Als hij krank is van den wijn, dan slaat hij op met spotters en pretmakers, die hem den tijd en de wijnkrankte zullen verdrijven; of wanneer hij dronken is, zo doet hij zulks, zodat het hof vol van ijdelheid en goddeloosheid is. Van spotters, zie Psa 1:1 ; Pro 1:22 , en Pro 9:7 , enz."}],"6":[{"catchword":"Want","tekst":"Of, zekerlijk, gewisselijk."},{"catchword":"voeren hun hart aan,","tekst":"Hebreeuws eigenlijk, doen hun hart naderen; dat is, zij geven zich daarop, drijven, vieren, stoken en hitsen, zichzelven aan, om in het heimelijke lagen te leggen dengenen, die hen tegen zijn, en die door streken in lijden, verdriet en om het leven te brengen, hetzij dat zij hunne goddeloosheid niet toestaan, of anderszins enen haat op hen hebben."},{"catchword":"bakker slaapt den gansen nacht;","tekst":"Hierdoor verstaan sommigen den koning, die het beleid en bestuur van alle boze vonden zijnen vorsten en raadsheren beveelt, en als hij de uitvoering daarvan in vollen zwang ziet, zijn pleizier en lust daarin schept; of, terwijl hij slaapt, zo zijn zijne vorsten met hunne helpers doende, om tegen hem samen te spannen; [waarvan in vs.7] en eer de koning daarop denkt, zulks in het werk stellen, zettende alles [om zo te spreken] in vuur en vlam."}],"7":[{"catchword":"verhit als een bakoven,","tekst":"In boosheid en goddeloosheid."},{"catchword":"rechters;","tekst":"Dat is, hunne koningen, vorsten en regenten, gelijk de volgende woorden verklaren, en onder vs.16; vergelijk Jdg 2:16 ."},{"catchword":"vallen;","tekst":"Dat is, worden om het leven gebracht, de een zweert samen tegen den ander, en slaat hem dood; zie Gen 14:10 , en de historie hiervan 2Ki 15:8 , enz. tot 2Ki 15:32 , alzo onder vs.16."},{"catchword":"roept","tekst":"Die mij kent, en om genade en hulp aanzoekt; vergelijk onder vs.10, 13,14."}],"8":[{"catchword":"verwart zich met de volken;","tekst":"Door heidense huwelijken, gemeenschap van afgoderij en andere zonden, idem ongeoorloofde verbonden. Zie boven Hos 5:7 , Hos 5:13 , en onder vs.11, enz."},{"catchword":"is een","tekst":"Dat is, gelijk een koek."},{"catchword":"koek,","tekst":"Zie van het Hebreeuwse woord Gen 18:6 ."},{"catchword":"niet is omgekeerd;","tekst":"En derhalve half gaar, die de hongerige Assyriërs evenwel zullen verslinden; of aan de ene zijde verbrand, aan de andere rauw of ongaar, en dus onsmakelijk en bedorven, niet veel deugende [gelijk men zegt] noch om te houden, noch om weg te werpen, gelijk een koek moet worden, wanneer zij op het vuur of de kolen verzuimd en niet waargenomen wordt. Deze gelijkenis wordt verscheidenlijk verklaard, en op Efraïm gepast. Uit het voorgaande en navolgende schijnt dat God wil zeggen: Efraïm heeft zijn eigen geestelijke en lichamelijke welvaart verwaarloosd, en naar buiten tot de afgodische heidenen lopende, om bij hen zijne behoudenis te zoeken, is hij door hunne gemeenschap zo bedorven, dat hij nauwelijks enig fatsoen, of reuk en smaak [gelijk men zegt] meer had, als een koek die half rauw, half verbrand, of geheel doorbrand en verschrokt is. Sommigen duiden het op de onbekeerlijkheid, niettegenstaande Gods straffen, waarvan vs.10."}],"9":[{"catchword":"Vreemden verteren","tekst":"Zie voorbeelden 2Ki 15:19-20 ; idem aldaar 2Ki 15:29 ."},{"catchword":"zijn kracht,","tekst":"Van Efraïm."},{"catchword":"grauwigheid op hem verspreid,","tekst":"Dat is, hij wordt zwak en machteloos, en heeft er geen gevoel van, gelijk oude lieden die overal grauwe haren krijgen; nochtans blijft hij even stout en hardnekkig, gelijk volgt."}],"10":[{"catchword":"hovaardij van Israël","tekst":"Omdat zij in dezen hun ellendigen toestand nog zo ongevoelig, opgeblazen en stout tegen mij zijn. Zie boven Hos 5:5 , met de aantekening."}],"11":[{"catchword":"botte duif,","tekst":"Dat is, domme, slechte, simpele duiven, omdat men ze verlokken, verleiden en bepraten kan gelijk men wil, stellende zich alleszins tot een spot. Dit wordt in het volgende verklaard."},{"catchword":"hart;","tekst":"Dat is, verstand. Zie Job 9:4 ."},{"catchword":"Egypte aan,","tekst":"Zie 2Ki 17:3-4 , en boven Hos 5:13 , en onder Hos 8:9 , en Hos 12:2 ."},{"catchword":"Assur","tekst":"Dat is, Assyrië, of den koning van Assyrië."}],"12":[{"catchword":"net over hen uitspreiden,","tekst":"Dat is, Ik zal hen vangen, verstrikken en vernietigen door hunne tractaten of handelingen met Egypte en Assur, gelijk men de vogels beslaat, vangt en verstrikt door het net. Vergelijk Job 19:6 ; Eze 12:13 , en Eze 17:20 en Eze 19:8 en Eze 32:3 , met de aantekening."},{"catchword":"nederdalen","tekst":"Daar zij omhoog menen te vliegen."},{"catchword":"tuchtigen,","tekst":"Met straffen en plagen; zie Pro 7:22 ."},{"catchword":"gelijk gehoord is in hun vergadering","tekst":"Hebreeuws, naar de horing, of het gehoor van, of aan, in hunne vergadering; dat is, gelijk Ik hun openlijk in mijne wet en door mijne profeten in hunne bijeenkomsten voor de gemeente heb aangezegd en gedreigd, zie 2Ki 17:13 ."}],"13":[{"catchword":"afgezworven;","tekst":"Hier en daar afgodische en vleselijke hulp zoekende, zwervende als een verbijsterde vogel, die nergens rust vindt."},{"catchword":"tegen Mij overtreden","tekst":"Of, zijn van mij afgevallen, zie 1Ki 8:50 , en 1Ki 12:19 ; idem Jer 2:8 , Jer 2:29 , en vergelijk onder Hos 8:1 , en Hos 14:10 ."},{"catchword":"zou hen wel verlossen,","tekst":"Of, Ik heb hen wel verlost, of Ik verlos hen wel, of als Ik hen verlos, enz., zo, enz. Zie 2Ki 14:25-28 ."},{"catchword":"leugens tegen Mij","tekst":"Wat hun goeds van mij geschiedt, daarvan geven zij valselijk hunnen afgoden de eer; of zij beloven wel bekering en dankbaarheid, maar denken het niet."}],"14":[{"catchword":"hart,","tekst":"Hun bidden en kermen tot mij is enkel huichelarij; het is maar een gehuil, uit verdriet, murmurering en ongeduldigheid, zonder geloof en bekering. Sommigen menen dat het volgende woord legeren of bedden, ziet op plaatsen [gelijk hoogten, tempels, enz.] hunner afgoderij, die een geestelijk overspel is; zie Isa 57:7-8 , met de aantekening, waarop het volgende woord verzamelen, niet kwalijk past; vergelijk ook Eze 23:41 ."},{"catchword":"om koren en most","tekst":"Anders: [wanneer] zij zich om koren en most verzamelen [en] tot mij keren."},{"catchword":"verzamelen zij zich,","tekst":"Om zulks van mij te verkrijgen, maar metterdaad bewijzen zij allen wederspannigheid tegen mij. Anders: maken zij zichzelven insnijdingen, te weten in hun vlees, naar de wijze der heidenen en afgodendienaars; zie 1Ki 18:28 met de aantekening."},{"catchword":"wederstreven tegen Mij","tekst":"Anders: zij wijken van mij af, of, wijken af tegen mij, te weten rebellerende, dewijl zij evenzeer blijven hangen aan hunn afgoderij, zelfs wanneer zij koren en most van mij kwanswijs verzoeken."}],"15":[{"catchword":"heb hen wel getuchtigd,","tekst":"Met woorden en slagen. Anders: Ik bind en sterk hunne armen, te weten gelijk een goed chirurgijn en medicijnmeester pleegt te doen; vergelijk vs.1."},{"catchword":"gesterkt;","tekst":"Dat is, matiglijk gekastijd, gevende hun nog kracht om de kastijding te verdragen, of alzo: dat Ik hen niet verteerde; of, als Ik bezig was om hen te genezen door mijn heilzame tucht, zo voegde Ik mij naar hun vermogen, ondersteunende hen met nodige krachten, en hunne zwakheden dragende; of, Ik kastijdde hen wel, maar onderhield hunnen staat, dat zij niet te gronde gingen."},{"catchword":"kwaad tegen Mij","tekst":"Mijn goeddoen vergelden zij mij, [in plaats van met dankbaarheid] met kwade handelingen tegen mij; overdenkende hoe zij hun bouwvalligen staat, zonder mij en tegen al mijne waarschuwingen en dreigementen, evenwel, als tot mijn hoon en spijt, nog zouden mogen vastmaken door afgodische, vleselijke en heidense hulp, daar zij mij schuldig waren te danken voor al hetgeen dat er nog van hunnen staat overig en behouden is. Waarop het volgende mede ziet."}],"16":[{"catchword":"keren zich,","tekst":"Zij lopen vast overal, hier en daar, maar tot mij, bij wien hun heil te zoeken is, komen zij niet; vergelijk onder Hos 11:7 . Of, zij tonen somtijds een schijn van bekering, maar zij bekeren zich niet inderdaad; vergelijk boven Hos 6:4 , met de aantekening. Anders: eenvoudig aldus: Zij bekeren zich niet tot den Allerhoogste."},{"catchword":"bedriegelijke boog;","tekst":"Hebreeuws, boog des bedrogs; zie Psa 78:57 met de aantekening. De zin i (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {

}

      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
