aël is verslonden; nu zijn zij onder de heidenen geworden als een vat waar niemand naar omkijkt.","9":"Want zij zijn opgetrokken naar Assur, als een wilde ezel die alleen voor zichzelf leeft; die van Efraïm hebben minnaars gehuurd voor hoerenloon.","10":"Omdat zij dus onder de heidenen minnaars gehuurd hebben voor hoerenloon, zal Ik hen nu ook verzamelen; ja, zij zijn al een beetje begonnen te lijden vanwege de last van de koning der vorsten.","11":"Omdat Efraïm de altaren vermenigvuldigd heeft om te zondigen, zijn hem de altaren geworden tot zondigen.","12":"Ik schrijf hem de voortreffelijke dingen van Mijn wet voor; maar die worden beschouwd als iets vreemds.","13":"Aangaande de offers van Mijn gaven: zij offeren vlees en eten het, maar de Heere heeft in hen geen welbehagen. Nu zal Hij aan hun ongerechtigheid denken en hun zonden straffen; zij zullen terugkeren naar Egypte.","14":"Want Israël heeft zijn Maker vergeten en tempels gebouwd, en Juda heeft versterkte steden vermenigvuldigd; maar Ik zal een vuur zenden in zijn steden, dat zal hun paleizen verteren."},"SV":{"1":"De bazuin aan uw mond; *hij* *komt* als een arend tegen het huis des Heeren; omdat zij Mijn verbond hebben overtreden, en zijn tegen Mijn wet afvallig geworden.","2":"*Dan* zullen zij tot Mij roepen: Mijn God! wij, Israël, kennen U.","3":"Israël heeft het goede verstoten; de vijand zal hem vervolgen.","4":"Zij hebben koningen gemaakt, maar niet uit Mij; zij hebben vorsten gesteld, maar Ik heb het niet gekend; van hun zilver en hun goud hebben zij voor zichzelven afgoden gemaakt, opdat zij uitgeroeid worden.","5":"Uw kalf, o Samaria! heeft *u* verstoten; Mijn toorn is tegen hen ontstoken; hoe lang zullen zij de reinigheid niet verdragen?","6":"Want dat is ook uit Israël; een werkmeester heeft het gemaakt, en het is geen God, maar het zal *tot* stukken worden, het kalf van Samaria.","7":"Want zij hebben wind gezaaid, en zullen een wervelwind maaien; het zal geen staande koren hebben, het uitspruitsel zal geen meel maken; of het misschien maakte, vreemden zullen het verslinden.","8":"Israël is verslonden; nu zijn zij onder de heidenen geworden, gelijk een vat, waar men geen lust toe heeft.","9":"Want zij zijn opgetogen *naar* Assur, een woudezel, die alleen voor zichzelven is; die van Efraïm hebben boelen om hoerenloon gehuurd.","10":"Dewijl zij *dan* onder de heidenen *boelen* om hoerenloon gehuurd hebben, zo zal Ik die nu ook verzamelen; ja, zij hebben al een weinig begonnen, vanwege den last van den koning der vorsten.","11":"Omdat Efraïm de altaren vermenigvuldigd heeft tot zondigen, zo zijn hem de altaren geworden tot zondigen.","12":"Ik schrijf hem de voortreffelijkheden Mijner wet voor; *maar* die zijn geacht als wat vreemds.","13":"Aangaande de offeranden Mijner gaven, zij offeren vlees, en eten het, *maar* de Heere heeft aan hen geen welgevallen. Nu zal Hij hunner ongerechtigheid gedenken, en hun zonden bezoeken; zij zullen weder *in* Egypte keren.","14":"Want Israël heeft zijn Maker vergeten, en tempelen gebouwd, en Juda heeft vaste steden vermenigvuldigd; maar Ik zal een vuur zenden in zijn steden, dat zal haar paleizen verteren."},"KJV":{"1":"*Set* the trumpet to thy mouth. *He shall come* as an eagle against the house of the LORD, because they have transgressed my covenant, and trespassed against my law.","2":"Israel shall cry unto me, My God, we know","3":"Israel hath cast off *the thing that is* good: the enemy shall pursue","4":"They have set up kings, but not by me: they have made princes, and I knew *it* not: of their silver and their gold have they made them idols, that they may be cut off.","5":"Thy calf, O Samaria, hath cast *thee* off; mine anger is kindled against them: how long *will it be* ere they attain to innocency?","6":"For from Israel *was* it also: the workman made it; therefore it *is* not God: but the calf of Samaria shall be broken in pieces.","7":"For they have sown the wind, and they shall reap the whirlwind: it hath no stalk: the bud shall yield no meal: if so be it yield, the strangers shall swallow it up.","8":"Israel is swallowed up: now shall they be among the Gentiles as a vessel wherein *is* no pleasure.","9":"For they are gone up to Assyria, a wild ass alone by himself: Ephraim hath hired lovers.","10":"Yea, though they have hired among the nations, now will I gather them, and they shall sorrow a little for the burden of the king of princes.","11":"Because Ephraim hath made many altars to sin, altars shall be unto him to sin.","12":"I have written to him the great things of my law, *but* they were counted as a strange thing.","13":"They sacrifice flesh *for* the sacrifices of mine offerings, and eat *it; but* the LORD accepteth them not; now will he remember their iniquity, and visit their sins: they shall return to Egypt.","14":"For Israel hath forgotten his Maker, and buildeth temples; and Judah hath multiplied fenced cities: but I will send a fire upon his cities, and it shall devour the palaces"}},"tsk":{"1":[{"kopje":"de bazuin","refs":["Hos 5:8","Jes 18:3","Jes 58:1","Jer 4:5","Jer 6:1","Jer 51:27","Ezech 7:14","Ezech 33:3-6","Joël 2:1","Joël 2:15","Amos 3:6","Zef 1:16","Zach 9:14","1 Kor 15:52"]},{"kopje":"als","refs":["Deut 28:49","Jer 4:13","Jer 48:40","Hab 1:8","Matt 24:28"]},{"kopje":"het huis","refs":["Hos 9:15","2 Kon 18:27","Amos 8:3","Amos 9:1","Zach 11:1"]},{"kopje":"overtreden","refs":["Hos 6:7","Jes 24:5","Jer 31:32","Ezech 16:59","Hebr 8:8-13"]}],"3":[{"kopje":"verstoten","refs":["Ps 36:4","Ps 81:11","Ps 81:12","Amos 1:11","1 Tim 5:12"]},{"kopje":"de vijand","refs":["Lev 26:36","Deut 28:25","Klaagl 3:66","Klaagl 4:19"]}],"4":[{"kopje":"aangesteld","refs":["1 Kon 12:16-20","2 Kon 15:10-30","Matt 25:12","Luk 13:25","Luk 13:27","Joh 10:14","Gal 4:9"]},{"kopje":"van","refs":["Hos 2:7","Hos 13:2","1 Kon 12:28","1 Kon 16:31"]},{"kopje":"zodat zij","refs":["Hos 13:9","1 Kon 13:34","Jer 44:7","Jer 44:8","Ezech 18:31"]}],"5":[{"kopje":"kalf","refs":["Hos 8:6","Hos 10 b 8:13","svLabel":null},{"disp":"Ps 9:17","href":"../../psalmen/9/#v18","ref":"Ps 9:18","svLabel":"SV 18"},{"disp":"Jes 17:10","href":"../../jesaja/17/#v10","ref":"Jes 17:10","svLabel":null},{"disp":"Jes 17:11","href":"../../jesaja/17/#v11","ref":"Jes 17:11","svLabel":null},{"disp":"Ezech 23:35","href":"../../ezechiel/23/#v35","ref":"Ezech 23:35","svLabel":null},{"disp":"Hos 8:14","href":"../../hosea/8/#v14","ref":"Hos 8:14","svLabel":null}],"kinderen":[]}]},{"topic":"Idolatry","href":"../../torrey/i/#t-idolatry","kinderen":[{"label":"Temples built for","href":"../../torrey/i/?hl=Hos.8.14#i9781","refs":[{"disp":"Hos 8:14","href":"../../hosea/8/#v14","ref":"Hos 8:14","svLabel":null}],"kinderen":[]}]}]}},"noten":{"1":"SV: afvallig geworden"},"koppeling":{"1":"De bazuin aan uw mond; hij komt als een arend tegen het huis van de Heere; omdat zij Mijn verbond hebben overtreden, en tegen Mijn wet in opstand zijn gekomen<sup class=\"noot\" data-noot=\"1\">1</sup>.","2":"Dan zullen zij tot Mij roepen: Mijn God! Wij, Israël, kennen U.","3":"Israël heeft het goede verstoten; de vijand zal hem vervolgen.","4":"Zij hebben koningen aangesteld, maar niet door Mij; zij hebben vorsten aangesteld, maar Ik heb het niet erkend; van hun zilver en hun goud hebben zij voor zichzelf afgoden gemaakt, zodat zij uitgeroeid worden.","5":"Uw kalf, Samaria! heeft u verstoten; Mijn toorn is tegen hen ontstoken; hoe lang zullen zij de reinheid niet verdragen?","6":"Want ook dat komt uit Israël; een vakman heeft het gemaakt, en het is geen God, maar het zal in stukken worden gebroken, het kalf van Samaria.","7":"Want zij hebben wind gezaaid, en zullen een wervelwind maaien; het zal geen staand koren hebben, de opbrengst zal geen meel opleveren; en als het toch iets opleverde, zullen vreemden het verslinden.","8":"Israël is verslonden; nu zijn zij onder de heidenen geworden als een vat waar niemand naar omkijkt.","9":"Want zij zijn opgetrokken naar Assur, als een wilde ezel die alleen voor zichzelf leeft; die van Efraïm hebben minnaars gehuurd voor hoerenloon.","10":"Omdat zij dus onder de heidenen minnaars gehuurd hebben voor hoerenloon, zal Ik hen nu ook verzamelen; ja, zij zijn al een beetje begonnen te lijden vanwege de last van de koning der vorsten.","11":"Omdat Efraïm de altaren vermenigvuldigd heeft om te zondigen, zijn hem de altaren geworden tot zondigen.","12":"Ik schrijf hem de voortreffelijke dingen van Mijn wet voor; maar die worden beschouwd als iets vreemds.","13":"Aangaande de offers van Mijn gaven: zij offeren vlees en eten het, maar de Heere heeft in hen geen welbehagen. Nu zal Hij aan hun ongerechtigheid denken en hun zonden straffen; zij zullen terugkeren naar Egypte.","14":"Want Israël heeft zijn Maker vergeten en tempels gebouwd, en Juda heeft versterkte steden vermenigvuldigd; maar Ik zal een vuur zenden in zijn steden, dat zal hun paleizen verteren."},"koppeling_kjv":{"1":"Set the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> to thy <span class=\"wl wl-kjv\" data-code=\"H2441\">mouth.</span> He shall come as an <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle</span> against the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H5674\">transgressed</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> and <span class=\"wl wl-kjv\" data-code=\"H6586\">trespassed</span> against my law.","2":"<span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H2199\">cry</span> unto me, My <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> we know","3":"<span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> hath cast <span class=\"wl wl-kjv\" data-code=\"H2186\">off</span> the thing that is <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> shall pursue","4":"They have set up <span class=\"wl wl-kjv\" data-code=\"H4427\">kings,</span> but not by me: they have made <span class=\"wl wl-kjv\" data-code=\"H7786\">princes,</span> and I <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> it not: of their <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and their <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> have they <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> them <span class=\"wl wl-kjv\" data-code=\"H6091\">idols,</span> that they may be cut off.","5":"Thy <span class=\"wl wl-kjv\" data-code=\"H5695\">calf,</span> O <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> hath <span class=\"wl wl-kjv\" data-code=\"H2186\">cast</span> thee off; mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> is <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against them: how long will it be <span class=\"wl wl-kjv\" data-code=\"H3808\">ere</span> they <span class=\"wl wl-kjv\" data-code=\"H3201\">attain</span> to innocency?","6":"For from <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> was it also: the <span class=\"wl wl-kjv\" data-code=\"H2796\">workman</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> it; therefore it is not <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> but the <span class=\"wl wl-kjv\" data-code=\"H5695\">calf</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> shall be broken in pieces.","7":"For they have <span class=\"wl wl-kjv\" data-code=\"H2232\">sown</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7114\">reap</span> the <span class=\"wl wl-kjv\" data-code=\"H5492\">whirlwind:</span> it hath no <span class=\"wl wl-kjv\" data-code=\"H7054\">stalk:</span> the <span class=\"wl wl-kjv\" data-code=\"H6780\">bud</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">yield</span> no <span class=\"wl wl-kjv\" data-code=\"H7058\">meal:</span> <span class=\"wl wl-kjv\" data-code=\"H194\">if</span> so be it <span class=\"wl wl-kjv\" data-code=\"H6213\">yield,</span> the <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> shall swallow it up.","8":"<span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is swallowed <span class=\"wl wl-kjv\" data-code=\"H1104\">up:</span> now shall they be among the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles</span> as a <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> wherein is no pleasure.","9":"For they are gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> a wild <span class=\"wl wl-kjv\" data-code=\"H6501\">ass</span> <span class=\"wl wl-kjv\" data-code=\"H909\">alone</span> by himself: <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> hath <span class=\"wl wl-kjv\" data-code=\"H8566\">hired</span> lovers.","10":"Yea, though they have <span class=\"wl wl-kjv\" data-code=\"H8566\">hired</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> now will I <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> them, and they shall <span class=\"wl wl-kjv\" data-code=\"H2490\">sorrow</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> for the <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of princes.","11":"Because <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> hath made <span class=\"wl wl-kjv\" data-code=\"H7235\">many</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> shall be unto him to sin.","12":"I have <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> to him the great <span class=\"wl wl-kjv\" data-code=\"H7230\">things</span> of my <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> but they were <span class=\"wl wl-kjv\" data-code=\"H2803\">counted</span> as a strange thing.","13":"They <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> for the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> of mine <span class=\"wl wl-kjv\" data-code=\"H1890\">offerings,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it; but the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7521\">accepteth</span> them not; now will he <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> their <span class=\"wl wl-kjv\" data-code=\"H2403\">sins:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to Egypt.","14":"For <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> hath <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> his <span class=\"wl wl-kjv\" data-code=\"H6213\">Maker,</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">buildeth</span> <span class=\"wl wl-kjv\" data-code=\"H1964\">temples;</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> hath <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> <span class=\"wl wl-kjv\" data-code=\"H1219\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities:</span> but I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> upon his <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> the palaces"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"bazuin aan uw","tekst":"Dit is een haastige en onvolkomen manier van spreken, die men pleegt te gebruiken in een onvoorzienen haastigen overval. Men kan dit nemen als woorden Gods tot den profeet, dien Hij gebiedt zijne stem als een bazuin te verheffen, vermits de ongevoeligheid en hardnekkigheid van het volk, gelijk Isa 58:1 , enz. Of, als ene afbeelding van den aanstaanden nood en aankomst van den vijand, wanneer men gewoon is alarm te maken; zie boven Hos 5:8 ."},{"catchword":"mond;","tekst":"Hebreeuws, gehemelte."},{"catchword":"hij komt","tekst":"Te weten, de vijand, de koning van Assyrië."},{"catchword":"arend tegen","tekst":"Vergelijk Jer 48:40 , met de aantekening."},{"catchword":"huis des HEEREN;","tekst":"Te weten, Israël, of de tien stammen, [gelijk het volgende uitwijst] die dien naam mede voerden, en Gods volk wilden geacht zijn. Sommigen menen dat God hier van Juda spreekt, en verstaan den tempel van Jeruzalem, en door den vijand Nebukadnezar."},{"catchword":"afvallig geworden","tekst":"Zie boven Hos 7:13 ."}],"2":[{"catchword":"zij tot Mij","tekst":"Te weten, die van Israël, gelijk het volgende verklaart."},{"catchword":"roepen","tekst":"Mijn God! Niet uit geloof en bekering, maar alleenlijk uit gevoel van de voorzegde en gedreigde ellende."},{"catchword":"wij, Israël, kennen U","tekst":"Wij voeren immers den naam van uw volk Israël, en hebben uw woord gehoord en doen belijdenis van uwen dienst; vergelijk Mat 7:21-22 ; Luk 13:26-27 . Anderen aldus: Wij kennen U, [wij zijn] Israël; in een zin."}],"3":[{"catchword":"goede verstoten;","tekst":"Al mijn heilzame leringen en vermaningen, welker navolging hun geestelijke en lichamelijke behoudenis zou geweest zijn."},{"catchword":"vijand zal hem vervolgen","tekst":"Van wien vs.1 gesproken is."}],"4":[{"catchword":"uit Mij;","tekst":"Dat is, zonder mij in het opwerpen en maken van hunne koningen raad te vragen, of mijn bevel te verwachten; alhoewel anderszins de scheiding der tien stammen van Juda niet zonder Gods rechtvaardig bestuur en regering geschied is; zie 1Ki 11:31 , enz.; onder Hos 13:11 , en vergelijk Isa 30:1 , en Isa 54:15 ."},{"catchword":"vorsten gesteld,","tekst":"De woorden koningen en vorsten, worden hier verwisseld, gelijk boven Hos 7:7 , Hos 7:16 ."},{"catchword":"niet gekend;","tekst":"Niet dat den alwetenden God dit enigszins onbekend zou geweest zijn, maar deze manier van spreken wil zeggen dat God hun maken van koningen niet voor goed heeft gekend. Vergelijk Psa 1:6 , met de aantekening."},{"catchword":"afgoden gemaakt,","tekst":"Zie van het Hebreeuwse woord 2Sa 5:21 , en versta hier, de gouden kalven te Dan en Bethel en andere afgodische beelden, gelijk onder Hos 13:2 , en Hos 14:9 ."},{"catchword":"opdat zij uitgeroeid worden","tekst":"Hebreeuws, opdat hij uitgeroeid werd; dat is, elkeen van hen, of Israël. de zin is dat zij door deze afgoderij hun eigen verderf hebben veroorzaakt. Vergelijk Jer 18:16 ; Mic 6:16 , met de aantekening."}],"5":[{"catchword":"kalf, o Samaria","tekst":"Uw afgodische kalverdienst, die uwe koningen, o Samaria [die binnen u hun hof houden] gesticht en gevoed hebben."},{"catchword":"u verstoten;","tekst":"Te weten gij Israëlieten. De zin is, gelijk zij het goede van zich verstoten hebben, [boven vs.3,] zo zal het kwaad, dat zij verkoren hebben, te weten de afgoderij, hun uit hun land verstoten; dat is, de oorzaak daarvan zijn. Anders: uw kalf heeft [u] verlaten. Moetende zelf als in gevangenschap het land uitgevoerd worden. Zie onder Hos 10:6 . Of aldus, Hij [de Heere] heeft uw kalf, o Samaria, verstoten, gelijk gij zijn goed verstoten hebt, alzo verstoot Hij uw kwaad."},{"catchword":"reinigheid","tekst":"Vergelijk Jer 13:27 ."},{"catchword":"verdragen?","tekst":"Of, vermogen. Het kan ook een afgebroken rede zijn, uit verdriet en toornigheid, aldus: Hoelang zullen zij gene reinheid kennen; te weten bekomen, doen, plegen?"}],"6":[{"catchword":"dat is ook uit Israël;","tekst":"Te weten, gouden kalf, [in het begin van het voorgaande en in het einde van dit vs. vermeld] is van Israël afgekomen, zij hebben het van mij niet geleerd, maar het is een vond en werk van hun eigen goddeloosheid, gelijk eertijds het kalf in de woestijn een vond geweest is van hunne voorvaders."},{"catchword":"stukken worden,","tekst":"Of, klein schaafsel, gruis, morsel. Dit schijnt te zien op de vermaling van het gouden kalf, Exo 32:20 , alsof God zeide: Wat een fijne god is dat, die zichzelven niet beter kan behouden."}],"7":[{"catchword":"wind gezaaid,","tekst":"Dat is, afgoderij en heidense verbonden hebben zij nagejaagd, dies zullen zij de vrucht hunner werken genieten; zodanig hun doen is, zodanige straf zal er op volgen. Vergelijk Job 4:8 , met de aantekening en onder Hos 12:2 ."},{"catchword":"wervelwind maaien;","tekst":"Dat is, Gods schrikkelijke en onvermijdelijke lagen. Zie Job 9:17 ; Psa 83:16 ; Pro 1:27 ; Jer 4:13 ; Amo 1:14 , met de aantekening."},{"catchword":"het zal geen staande koren hebben,","tekst":"Te weten zaad, of hij, te weten Israël. Gelijk zij met ijdelheid hebben omgegaan, alzo zal al hun arbeid ijdel zijn, of niets voortbrengen; of, wat er van moge voortkomen, zal voor den vijand zijn."},{"catchword":"uitspruitsel","tekst":"Of, gewas, zonder iets van voortkomt."},{"catchword":"maken;","tekst":"Dat is, geven, daar zal geen meel van komen, en zo in het volgende, en onder Hos 9:16 ; zie Psa 1:3 ."},{"catchword":"vreemden","tekst":"Of, uitlandse, dat is heidense vijanden."},{"catchword":"verslinden","tekst":"Dat is, zal zekerlijk van de vijanden verteerd worden, waarvan de beginselen klaar zijn."}],"8":[{"catchword":"nu zijn zij onder de heidenen geworden,","tekst":"Zij zijn alrede veracht bij de omliggende heidenen, en zullen het al haast nog meer worden. Vergelijk vs.10."},{"catchword":"vat,","tekst":"Gelijk Jer 22:28 . Zie aldaar; idem Psa 31:13 , en vergelijk Isa 30:14 ."}],"9":[{"catchword":"Assur,","tekst":"Om hun staat door gunst en hulp van den koning van Assyrië te bevestigen. Zie 2Ki 15:19-20 ."},{"catchword":"woudezel,","tekst":"Dat is, wilden, wreden en onbeleefden, rovende voor zichzelven, niet zoekende dan zijn eigen voordeel, om een ander zich niet bekommerende; zie Job 24:5 , en Job 39:8 . Sommigen duiden het op Israël, overal om hulp en verbond lopende, als een onbetemde wilde woudezel, die overal op de lucht gaat en dommelijk voeder zoekt, doch dikwijls niet vindt, en zelf anderen ten roof wordt. Vergelijk Jer 2:24 ."},{"catchword":"boelen om hoerenloon gehuurd","tekst":"Dat is, helpers en bondgenoten, verlatende hun rechten man, Heere en bondgenoot, namelijk God. Hebreeuws, liefden, minnen, of boelerijen; dat is, boelen, minnaars; zie Job 35:13 , en Jer 27:9 ."}],"10":[{"catchword":"Dewijl zij dan","tekst":"Of, schoon zij, hoewel zij, maar ofschoon zij, enz., zo zal Ik hen [toch] verzamelen, enz., gelijk de Hebreeuwse woorden genomen zijn, onder Hos 9:16 . Alsof de Heere zeide: Zij mogen zoveel helpers huren als zij willen, het zal hun toch niet helpen."},{"catchword":"die nu ook verzamelen;","tekst":"Die heidense helpers, die zij gehuurd hebben, zal Ik tegen henzelven verzamelen om inplaats van hulp, hen te bederven; vergelijk Eze 16:37 . Anders: Ik zal hen [de Israëlieten] verzamelen, te weten om hun den vijanden over te geven en het land uit te drijven, gelijk dit woord somtijds ook voor verzamelen ter straf gebruikt wordt; zie Psa 26:9 ."},{"catchword":"zij hebben al een weinig begonnen,","tekst":"De boelen, die zij gezocht en gehuurd hebben, tot hunne hulp, hebben hen al begonnen te plagen, doch dat is maar een weinig ten aanzien van de rest, die volgen zal. Anders: dat zij weinig smart zullen hebben van, enz.; dat is, het volgende lijden zal zo groot zijn, dat zij weinig gedenken zullen aan dezen last."},{"catchword":"last van den koning","tekst":"Dat is, de belasting, die de koning van Assyrië Israël had opgelegd; zie 2Ki 15:19-20 , en 2Ki 17:3 ."},{"catchword":"der vorsten","tekst":"Van den groten koning van Assyrië, die vele vorsten en prinsen onder zich heeft; vergelijk 2Ki 18:19 , 2Ki 18:24 ; Isa 10:8 ; Eze 31 ."}],"11":[{"catchword":"vermenigvuldigd heeft tot zondigen,","tekst":"Dewijl zij enkel de gruwelijke zonde der afgoderij hebben willen bedrijven, zonder maat en einde, zo zal Ik hen ook daarin laten voortgaan, en alzo zonde op zonde doen hopen, tot hun rechtvaardige straf; of, Ik zal hen onder de heidenen wegvoeren, waar zij dan de afgodische altaren genoeg of de volheid zullen hebben, en tot allerlei afgoderij gedwongen worden. Zie Jer 5:19 , en onder Hos 9:3 , en van het woord zonde, in zake van afgoderij, 1Ki 12:30 , en 1Ki 13:34 met de aantekening en 1Ki 14:16 , en 1Ki 15:30 , 1Ki 15:34 , en 1Ki 16:2 ."}],"12":[{"catchword":"voortreffelijkheden","tekst":"Dat is, de uitnemende, grote, heerlijke en voortreffelijke leringen van mijn woord heb Ik hun niet alleen mondelijk, maar ook schriftelijk in overvloed laten voordragen, door onderhouding van welke zij groot en machtig zouden worden. Vergelijk Isa 42:21 ."},{"catchword":"wet voor;","tekst":"Of, leer; zie Psa 1:2 ."},{"catchword":"die zijn geacht","tekst":"Voortreffelijke leringen van mijn woord."},{"catchword":"vreemds","tekst":"Zij verwerpen ze, alsof al mijne leringen hen in het minst niet aangingen, of zij daarmede niet te doen hadden; wat hunzelven lust, wat zij zelf verzinnen en bedenken, of van de heidenen aannemen, dat alleen behaagt hun."}],"13":[{"catchword":"Mijner gaven,","tekst":"Dat is, de vrijwillige dankoffers, die zij mij menen te offeren [van de gaven, die Ik hun in der waarheid gegeven heb,] om kwanswijs te betonen dat zij immers naar mij nog vragen en mij niet verachten."},{"catchword":"maar de HEERE","tekst":"Veranderende mijne offeranden in onheilige mestbanketten, zij zijn niet tot mijn dienst, maar voor hun mond en buik; vergelijk Jer 7:21 ."},{"catchword":"aan hen geen","tekst":"Te weten, aan de offeraars, welker boosheid Hij gedenken wil, gelijk volgt. Anders: daaraan, of aan die; te weten offeranden. Vergelijk Eze 20:40 , en Eze 43:27 ; Amo 5:22 ."},{"catchword":"welgevallen","tekst":"Want zij offeren niet ter plaatse, die van God daartoe is verordineerd, te weten binnen Jeruzalem in den tempel, maar tegen Gods gebod, waar het hun belieft, tot verachting Gods, en voorts zonder geloof en bekering."},{"catchword":"gedenken,","tekst":"Betonende zulks door straffen. Alzo Jer 14:10 , en onder Hos 9:9 ; zie Gen 8:1 , en zie het tegendeel Psa 79:8 ; Jer 31:34 ; Eze 18:22 , enz."},{"catchword":"bezoeken;","tekst":"Te weten met straffen; zie Gen 21:1 ."},{"catchword":"Egypte keren","tekst":"Dat is, in Assyrië, waar zij behandeld zullen worden gelijk voormaals in Egypte, zij zullen weder gevoerd worden in een nieuw Egypte; vergelijk onder Hos 9:3 , naar Egypte, om met den Egyptenaar te handelen, verlatende den koning van Assyrië, die daarover verstoord zijnde, hen verderven zal. Zie 2Ki 17:3-5 ; [aldus zou men door hunne ongerechtigheid verstaan de meinedigheid en trouweloosheid begaan tegen den Assyriër; vergelijk Eze 21:23 , en Eze 29:16 ,] dan zullen er sommigen naar Egypte trekken om de verwoesting der Assyriërs te ontgaan; zie onder Hos 9:6 ."}],"14":[{"catchword":"Maker vergeten,","tekst":"Te weten God, die hen niet alleen geschapen, maar ook tot zijn volk gemaakt, bereid en alzo grootgemaakt heeft; zie Job 8:17 , en Psa 100:3 ; Isa 51:13 , en Isa 54:5 ."},{"catchword":"tempelen gebouwd,","tekst":"Afgodische tempelen, tot den kalvendienst, te Dan en Bethel en elders, om daardoor zijnen staat vast te maken, het volk van Gods tempel te Jeruzalem af te houden, en te naderen tot de vriendschap en gemeenschap met de afgodische heidenen; vergelijk Eze 20:32 . Anders: paleizen; zie Isa 9:9 ."},{"catchword":"vaste steden vermenigvuldigd;","tekst":"Om zich daardoor te verzekeren tegen des vijands aankomst, waarvan de profeten zoveel spraken; zie Isa 22:8-9 , enz."},{"catchword":"vuur zenden in zijn steden,","tekst":"Dat is, vijandelijken oorlog, met de gevolgen van dien, allerlei plagen en ellenden; zie Job 15:34 , en Amo 1:4 , enz."},{"catchword":"paleizen verteren","tekst":"In elk der steden van het land van Juda. In het Hebreeuws staat, hare, in het enkelvoudig getal en het vrouwelijk geslacht, ziende op het land, of elke stad."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The Trumpet to thy mouth; [Heb. Palate. This is hasty and abrupt kinde of expression, such as is usual in unexpected sudden suprisals, it may be taken here, as Gods speech to the prophet, charging him to lift up his voice as a Trumpet, by reason of the people obstinacy, and senceless, as Isa. 58. verse 1, etc. or as a lively represenation of the instant danger and approach of the Enemy, which is signified by sounding alarms. See ab. Chap 5. 8. VERSE. 8.] (He cometh) [viz. the Enemy the King of Assyria] like an eagle, [Compare Jer. 48.40.with annotat.] against the house of the LORD; [to wit, Israel, or ren Tribes (as the sequel sheweth) which bore the Name likewise, and would still accounted God people. Some think that God speaks here gainst Juda, and understand the Temple of Jerusealem, and the Enemy Nebucadnezar] because they have transgressed my Covenant, and are revolted [See above, chap.7. on verse.13.] against my Law"}],"2":[{"catchword":null,"tekst":"(Then) shall they [viz. they of Israel, as is plain by the next verse] crie unto me; [not out of faith and repentance, but onely through the sense of their foretold and threatened miseries] My God., we Israel know thee. [sure we bear the Name of thy people Israel, and have heard thy word, and prosesse thy worship. Compare Mat 7.21,22. Luk 13:26,27 oth thus, We know thee(we are) Israel, the sense being one and the same.]"}],"3":[{"catchword":null,"tekst":"Israel hath rejected the good;[ I.e. all my wholsom instructions and admonitions, the heeding and keeping whereof would have proved their spiritual and temporal preservation] the enemie shall pursue him.[Spoken of above vers.1.]"}],"4":[{"catchword":null,"tekst":"They have made Kings, but not of me; [Without asking my advice, or staying for my command, for the chusing and setting up of their Kings: although in another sence, the separating of the ten Tribes happened not without Gods righteous disposing and government; See 1 Kings 11.31., &c and 13.11. and compare Isa 30:1. and chap. 54.14.] they have set up Princes, [the words Kings and Princes are taken here interchangeable as above chap. 7.7,16.] but I knew them not: [not as if the all knowing God being only, to expresse by this phrase, that God approved not of it. Compare Psa.1. v.6. with the annotat] of their silver and their gold they have made themselves idols, [see of the Heb. Word, 2 Sam 5. on v. 21. and understand here the golden calves at Dan and Bethel, together with their idolatrous images and resemblances, as below chap. 13.2. and 14. verse 9.] for to be destroyed. [Heb. That he may be destroyed, i.e. every one of them; or Israel. The meaning is, that by this idolatrie they caused their own destruction, comp[are Jer. 18.16. Mich. 6.16. with the annot.]"}],"5":[{"catchword":null,"tekst":"Thy calf, O Samaria,[ i.e our idolatrous Calf worship, which the Kings residing in Samaria had instituted and kept up] hath rejected (thee) [to wit, you the Israelites; the sense being even as they had rejected the good, above verse. 3. from themselves, so should the evil which they chose, that is their idolatry, reject and thrust them forth out of the land; as being the cause thereof. Oth. Thy Calf hath forsaken (thee;) being it self to be carried away, as into captivity. See below ch.10. 6. Or, thus, (the LORD) hath rejected thy Calf, o Samaria even as ye rejected his good things, so he rejecteth your evil .] mine nger is kindled against them: how long will they endure (or, let avail) puritie! [Compare Jer 13.27. it may also be an abrupt kinde of speech, out of anger and vexation; thus: how shall they not puritie be able, viz. to get or practice.]"}],"6":[{"catchword":null,"tekst":"For, that also is out of Israel; [viz. the golden Calf, ( mentioned in the former verse, and in the end of this) came forth in Israel, for, in or themselves; they were not taught it of me; it is a device and workmanship of their own wickedness, as formerly the Calf in the wilderness was a device of their forefathers] a work &acirc;&euro;&ldquo; master made it, and it is god, but it shall be rent in pieces, the Calf of Samaria. [Or, it shall become sharings, silvers, grindings: this seems to have respect to the golden Calf, Exo 32:20. is if God said; what a pure god is this, that knows nobetter how to preserve himself?]"}],"7":[{"catchword":null,"tekst":"For they have sowed wind, and they shall whirlwind: [ i.e. Gods terrible and unavoidable judgments. See Job 9:17. Psal.82. 16. Prov. 1.27. Jer 4.13. Amos 1.14. with the annotat. The meaning is, they had run after idolatry and heathenish alliances and confederacie, and therefore they should enjoy the fruit of their own works; such as their practice was, such should be their reward and punishment. Compare Job 4:8. with the annotat and below chap.12.1.] I [viz. the seed, or, he viz. Israel] shall have no standing corn; the spronting forth [ or, growth; if any thing come forth of it] shall make [or, yeeld, give] no meal; [ i.e. there shall meal be made of what shall produce; and so in the sequel, and below cha. 9.16. See Psal.1.on v 3.] and if happy it should make, stranger shall swallow it. [or foreigners, i.e. heathenish enemies the sense of the whole is, That as they had busied themselves with vanitie, so all their labour should be in vain, or, bring forth nothing; or, if it produced ought, the enemies should have the benefit thereof."}],"8":[{"catchword":null,"tekst":"Israel is swallowed up: [ i.e. shall assuredly be destroyed by the enemies, whereof the beginnings are apparent] now they are become among the heathen like a vessel which on e hath no pleasure in. [i.e. they are already a scorn to the neighbouring heathen nations, and shall be more contemptible yet. Compare verse 10. and see Jrer. 22. 28. and Psa 31:13. and compare Isa 30:14.]"}],"9":[{"catchword":null,"tekst":"For they marched up (to) Assur, [viz. for to secure their state, by the favour and help of the King of Assyria. See 1Kings 15. 19,20.] a wild asse, that is only for himself;[ i.e. very savage, fierce and undiscreet Prince, preying onely for himself, and seeking nothing but his own advantage, not caring how it fared with others See 24.5. and 39.8. Some applie it to Israel, running every where about for help and allies, like an uruly wild asse, that roaves at random, and seeks for food without foresight, finding oft &acirc;&euro;&ldquo; times none, and rather becoming a prey himself to others: Compare Jer 2.24.]those of Ephraim have hired lovers for harlots wages [ i.e. have sought and bought themselves helpers and confederates, forsaking their own husband, Lord and confederate, viz. God himself. The Hebr. for lovers hath, loves, woings, i.e. lovers see Job 35. on verse 13.and Jer 27. on vers.9.]"}],"10":[{"catchword":null,"tekst":"Bacause (then) for harlts wages they have hired (lovers) among the heathen, [Or, although, however, but though &c. (yet) will I gather them &c as the Hebr. particles are taken below ch.9.16. as if the LORD should say; let them chuse as many helpers as they lift, it shall avail them nothing] I shall also gather now: [to wit, those heathen helpers, whom they hired, and shall bring them against themselves, instead of help, to destroy them. Compare Ezek 16.37. Oth I will gather them, ( the Israelites) viz. for to deliver them up unto their enemies, and to drive them out of their Land, as this word is likewise taken sometimes for to gather unto punishment . See Psal.26. on verse.9.] Yea, they have even begun a little, [i.e. Those lovers, whom they sought and hired to help them,, have already begun to plague them, yet that is but little in comparison of the rest, which is to follow. Oth. That they shall have small pain of etc. i.e. the succeeding trouble shall be so great, that they shall not value this burthen] because of the burthen of the King of Princes. [ i.e by reason of the Tribute or tax, which the King of Assyria had laid upon Israel. See 2 King 25.19,20. and 17.3. being called the King of Princes, for having many Princes under him. Compare 2 Kings 18.19,24. Isa 10.8. Ezek.31.]"}],"11":[{"catchword":null,"tekst":"Therefore because Ephraim multiplied the altar to sinning, the altars are become sinning unto him [ In regard they would needs give up themselves single to that abominable sin idolatrie, without end and measure; I shall likewise suffer them to go on therein, and by that means, heap sin upon sin, until the time of their righteous punishment: or I shall carry them away among the heathen, where they shall have idolatrous altars to the fill, nay even be compelled to all manner of idolatrie. 1 Kings 15.16. and chap 15.30,34. and above 16.2.again chap 12.30. and 13.35. with the annotat.]"}],"12":[{"catchword":null,"tekst":"I prescribe him the excellencies of my law:[Or, doctrine, see Psal 1. on verse.2. The sense is; I have caused those excellent and glorious instructions of saving word, to be set before them, not only by word of mouth, but in writing also, very abundantly: by the keeping whereof they were sure to grow great and mightie: Compare Isa 4.2.21.] but those [viz. excellent instructions of my word] are counted as a strange thing [ i.e. they do reject the same, as if all my instructions concerned them not at all, and they had nothing to do with them they take delight in nothing, but their own humor, their own fancies and devices, and what they take up from the heathen.]"}],"13":[{"catchword":null,"tekst":"As to the sacrifices of my gifts, [ i.e. the free will thankoffering, which they pretend to offer me, (of those guists which I truly gave them) and whereby they would seem indeed to be mindefull of, and to despise me.] they offer the flesh and eat it, [ turning my sacrifices into profane gurmandizing, having no regard to my service, but onely to their panch and palate. Compare Jer.7. 21.] but the LORD hath no pleasure in them. [ i.e. in those scarifiers whose iniquity he will remember as followeth. Oth theirin, or in the same, viz. offerings. Compare below. Chap.9.3. and chap.11.5.11. or they shall return to Egypt, to treat with Egypt, for seaking the King of Assyria, who growing troubled thereat should destroy them. See 2 Kings.17.3,4,5 (thus by their iniquity should be understood, their perfidiousness and disloyalty against the Assyrian. Compare Ezek.21. 23. and 29.16.) then there should some of them go down into Egypt, eschew the destruction of the Assyrian ,See below chap.9.6."}],"14":[{"catchword":null,"tekst":"For Israel hath forgotten his maker, [To wit God who not created them, but also made them his people, formed and raised them thus See Job 4. on vers.17. and Psal 100.3. Isa 51:13. and 54.5.] and builded temples [viz. idolatrous one s for the worship of the calves at Dan and Bethel and elsewhere; and thereby for the establishing of their state, to withdraw and keep back the people from Gods temple at Jerusalem, and to allure them to friendship and communion with the idolatrous heathen. Compare Eze.20.32. Oth places. See Isa 9.9.] and Juda hath multiplied fenced cities: [thereby to secure themselves against the enemies approach and surprisal, whereof the Prophets spake so much. See Isa. 22.8, 9. etc] but I will send a fire into his cities, [i.e. engage them in open war, and cause all the consequences of the same, all manner of plagues and miseries, to surrounding and consume them, See Job.15. on ver.34. and Amos1.34, etc.] the same shall consume their palaces.[ viz. in each cities of the land of Juda: in the Heb. We have her places, having respect to the land, or, each cities.]"}]}}};

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
