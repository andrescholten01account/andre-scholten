et voorbeeld dat de HEERE Mozes getoond had, zo had hij de kandelaar gemaakt.","5":"En de HEERE sprak tot Mozes en zei:","6":"Neem de Levieten uit het midden van de kinderen van Israël, en reinig hen.","7":"En zo zult u hun doen, om hen te reinigen: sprenkel op hen water van de ontzondiging; en zij zullen het scheermes over hun hele lichaam laten gaan, en zij zullen hun kleren wassen, en zich reinigen.","8":"Daarna zullen zij een jonge stier nemen, met zijn spijsoffer van meelbloem, met olie gemengd; en een andere jonge stier zult u nemen als zondoffer.","9":"En u zult de Levieten voor de tent van de samenkomst laten naderen; en u zult de hele vergadering van de kinderen van Israël laten verzamelen.","10":"Ja, u zult de Levieten voor het aangezicht van de HEERE laten naderen; en de kinderen van Israël zullen hun handen op de Levieten leggen.","11":"En Aäron zal de Levieten bewegen als beweegoffer voor het aangezicht van de HEERE, vanwege de kinderen van Israël; opdat zij er zijn om de dienst van de HEERE te verrichten.","12":"En de Levieten zullen hun handen op het hoofd van de stieren leggen; daarna bereidt u de één als zondoffer, en de ander als brandoffer voor de HEERE, om over de Levieten verzoening te doen.","13":"En u zult de Levieten stellen voor het aangezicht van Aäron, en voor het aangezicht van zijn zonen, en u zult hen bewegen als beweegoffer voor de HEERE.","14":"En u zult de Levieten uit het midden van de kinderen van Israël uitscheiden, opdat de Levieten van Mij zijn.","15":"En daarna zullen de Levieten binnengaan, om de tent van de samenkomst te dienen; en u zult hen reinigen, en u zult hen als beweegoffer bewegen.","16":"Want zij zijn gegeven, zij zijn Mij gegeven uit het midden van de kinderen van Israël; in plaats van hen die de baarmoeder openen, *in plaats van* de eerstgeborenen van elk van de kinderen van Israël, heb Ik ze voor Mij genomen.","17":"Want elke eerstgeborene onder de kinderen van Israël is van Mij, onder de mensen en onder de dieren; op de dag dat Ik elke eerstgeborene in Egypteland sloeg, heb Ik ze voor Mij geheiligd.","18":"En Ik heb de Levieten genomen in plaats van alle eerstgeborenen onder de kinderen van Israël.","19":"En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.","20":"En Mozes deed, en Aäron, en de hele vergadering van de kinderen van Israël, aan de Levieten, naar alles wat de HEERE Mozes geboden had over de Levieten; zo deden de kinderen van Israël aan hen.","21":"En de Levieten ontzondigden zich, en wasten hun kleren, en Aäron bewoog hen als beweegoffer voor het aangezicht van de HEERE; en Aäron deed verzoening over hen, om hen te reinigen.","22":"En daarna kwamen de Levieten om hun dienst te verrichten in de tent van de samenkomst, voor het aangezicht van Aäron, en voor het aangezicht van zijn zonen; zoals de HEERE Mozes over de Levieten geboden had, zo deden zij aan hen.","23":"En de HEERE sprak tot Mozes en zei:","24":"Dit is het wat de Levieten aangaat: van vijfentwintig jaar oud en daarboven, zullen zij binnengaan om de strijd te strijden, in de dienst van de tent van de samenkomst.","25":"Maar vanaf dat hij vijftig jaar oud is, zal hij van de strijd van deze dienst afgaan, en hij zal niet meer dienen.","26":"Doch hij zal met zijn broeders dienen in de tent van de samenkomst, om de wacht waar te nemen; maar de dienst zal hij niet verrichten. Zo zult u aan de Levieten doen in hun wachten."},"SV":{"1":"En de HEERE sprak tot Mozes, zeggende:","2":"Spreek tot Aäron, en zeg tot hem: Als gij de lampen aansteken zult, recht tegenover den kandelaar zullen de zeven lampen lichten.","3":"En Aäron deed alzo: tegenover vooraan den kandelaar stak hij deszelfs lampen aan; gelijk als de HEERE Mozes geboden had.","4":"Dit werk nu des kandelaars was van dicht goud, tot zijn schacht, tot zijn bloemen was het dicht; naar de gedaante, die de HEERE Mozes vertoond had, alzo had hij den kandelaar gemaakt.","5":"En de HEERE sprak tot Mozes, zeggende:","6":"Neem de Levieten uit het midden van de kinderen Israëls, en reinig hen.","7":"En aldus zult gij hun doen, om hen te reinigen: spreng op hen water der ontzondiging; en zij zullen het scheermes over hun ganse vlees doen gaan, en zij zullen hun klederen wassen, en zich reinigen.","8":"Daarna zullen zij nemen een var, een jong rund, met zijn spijsoffer van meelbloem, met olie gemengd; en een anderen var, een jong rund, zult gij nemen ten zondoffer.","9":"En gij zult de Levieten voor de tent der samenkomst doen naderen; en gij zult de gehele vergadering der kinderen Israëls doen verzamelen.","10":"Ja, gij zult de Levieten voor het aangezicht des HEEREN doen naderen; en de kinderen Israëls zullen hun handen op de Levieten leggen.","11":"En Aäron zal de Levieten bewegen ten beweegoffer voor het aangezicht des HEEREN, vanwege de kinderen Israëls; opdat zij zijn, om den dienst des HEEREN te bedienen.","12":"En de Levieten zullen hun handen op het hoofd der varren leggen; daarna bereidt gij een ten zondoffer, en een ten brandoffer den HEERE, om over de Levieten verzoening te doen.","13":"En gij zult de Levieten stellen voor het aangezicht van Aäron, en voor het aangezicht van zijn zonen, en gij zult hen bewegen ten beweegoffer den HEERE.","14":"En gij zult de Levieten uit het midden van de kinderen Israëls uitscheiden, opdat de Levieten Mijn zijn.","15":"En daarna zullen de Levieten inkomen, om de tent der samenkomst te bedienen; en gij zult hen reinigen, en zult hen ten beweegoffer bewegen.","16":"Want zij zijn gegeven, zij zijn Mij gegeven uit het midden van de kinderen Israëls; voor de opening van alle baarmoeder, *voor* de eerstgeborenen van een ieder uit de kinderen Israëls, heb Ik ze Mij genomen.","17":"Want alle eerstgeborene onder de kinderen Israëls is Mijn, onder de mensen en onder de beesten; ten dage dat Ik alle eerstgeboorte in Egypteland sloeg, heb Ik dezelve Mij geheiligd.","18":"En Ik heb de Levieten genomen voor alle eerstgeborenen onder de kinderen Israëls.","19":"En Ik heb de Levieten aan Aäron en aan zijn zonen tot een gift gegeven, uit het midden van de kinderen Israëls, om den dienst van de kinderen Israëls in de tent der samenkomst te bedienen, en om voor de kinderen Israëls verzoening te doen, dat er geen plage zij onder de kinderen Israëls, als de kinderen Israëls tot het heiligdom naderen zouden.","20":"En Mozes deed, en Aäron, en de ganse vergadering der kinderen Israëls, aan de Levieten, naar alles, wat de HEERE Mozes geboden had van de Levieten, zo deden de kinderen Israëls aan hen.","21":"En de Levieten ontzondigden zich, en wiesen hun klederen, en Aäron bewoog hen ten beweegoffer voor het aangezicht des HEEREN; en Aäron deed verzoening over hen, om hen te reinigen.","22":"En daarna kwamen de Levieten, om hun dienst te bedienen in de tent der samenkomst, voor het aangezicht van Aäron, en voor het aangezicht zijner zonen; gelijk als de HEERE Mozes van de Levieten geboden had, alzo deden zij aan hen.","23":"En de HEERE sprak tot Mozes, zeggende:","24":"Dit is het, wat de Levieten aangaat: van vijf en twintig jaren oud en daarboven, zullen zij inkomen, om den strijd te strijden, in den dienst van de tent der samenkomst.","25":"Maar van dat hij vijftig jaren oud is, zal hij van den strijd van dezen dienst afgaan, en hij zal niet meer dienen.","26":"Doch hij zal met zijn broederen dienen in de tent der samenkomst, om de wacht waar te nemen; maar den dienst zal hij niet bedienen. Alzo zult gij aan de Levieten doen in hun wachten."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Speak unto Aaron, and say unto him, When thou lightest the lamps, the seven lamps shall give light over against the candlestick.","3":"And Aaron did so; he lighted the lamps thereof over against the candlestick, as the LORD commanded Moses.","4":"And this work of the candlestick *was of* beaten gold, unto the shaft thereof, unto the flowers thereof, *was* beaten work: according unto the pattern which the LORD had shewed Moses, so he made the candlestick.","5":"And the LORD spake unto Moses, saying,","6":"Take the Levites from among the children of Israel, and cleanse","7":"And thus shalt thou do unto them, to cleanse them: Sprinkle water of purifying upon them, and let them shave all their flesh, and let them wash their clothes, and *so* make themselves clean.","8":"Then let them take a young bullock with his meat offering, *even* fine flour mingled with oil, and another young bullock shalt thou take for a sin offering.","9":"And thou shalt bring the Levites before the tabernacle of the congregation: and thou shalt gather the whole assembly of the children of Israel together:","10":"And thou shalt bring the Levites before the LORD: and the children of Israel shall put their hands upon the Levites:","11":"And Aaron shall offer the Levites before the LORD *for* an offering of the children of Israel, that they may execute the service of the LORD.","12":"And the Levites shall lay their hands upon the heads of the bullocks: and thou shalt offer the one *for* a sin offering, and the other *for* a burnt offering, unto the LORD, to make an atonement for the Levites.","13":"And thou shalt set the Levites before Aaron, and before his sons, and offer them *for* an offering unto the LORD.","14":"Thus shalt thou separate the Levites from among the children of Israel: and the Levites","15":"And after that shall the Levites go in to do the service of the tabernacle of the congregation: and thou shalt cleanse them, and offer them *for* an offering.","16":"For they *are* wholly given unto me from among the children of Israel; instead of such as open every womb, *even instead of* the firstborn of all the children of Israel, have I taken","17":"For all the firstborn of the children of Israel *are* mine, *both* man and beast: on the day that I smote every firstborn in the land of Egypt I sanctified","18":"And I have taken the Levites for all the firstborn of the children of Israel.","19":"And I have given the Levites *as* a gift to Aaron and to his sons from among the children of Israel, to do the service of the children of Israel in the tabernacle of the congregation, and to make an atonement for the children of Israel: that there be no plague among the children of Israel, when the children of Israel come nigh unto the sanctuary.","20":"And Moses, and Aaron, and all the congregation of the children of Israel, did to the Levites according unto all that the LORD commanded Moses concerning the Levites, so did the children of Israel","21":"And the Levites were purified, and they washed their clothes; and Aaron offered them *as* an offering before the LORD; and Aaron made an atonement for them to cleanse","22":"And after that went the Levites in to do their service in the tabernacle of the congregation before Aaron, and before his sons: as the LORD had commanded Moses concerning the Levites, so did","23":"And the LORD spake unto Moses, saying,","24":"This *is it* that *belongeth* unto the Levites: from twenty and five years old and upward they shall go in to wait upon the service of the tabernacle of the congregation:","25":"And from the age of fifty years they shall cease waiting upon the service *thereof*, and shall serve","26":"But shall minister with their brethren in the tabernacle of the congregation, to keep the charge, and shall do no service. Thus shalt thou do unto the Levites touching their charge."}},"tsk":{"4":[{"kopje":"dit werk","refs":["Ex 25:31-39","Ex 37:17-24"]},{"kopje":"gedreven werk","refs":["Ex 25:18","Ex 37:7","Ex 37:17","Ex 37:22"]},{"kopje":"het voorbeeld","refs":["Ex 25:9","Ex 25:40","1 Kron 28:11-19","Hebr 8:5","Hebr 9:23"]}],"6":[{"kopje":"reinig hen","refs":["Ex 19:15","2 Kor 126\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H5564\">put</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> upon the Levites:","11":"And <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> shall <span class=\"wl wl-kjv\" data-code=\"H5130\">offer</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for an <span class=\"wl wl-kjv\" data-code=\"H8573\">offering</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H5647\">execute</span> the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the LORD.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> shall <span class=\"wl wl-kjv\" data-code=\"H5564\">lay</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of the <span class=\"wl wl-kjv\" data-code=\"H6499\">bullocks:</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">offer</span> the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for the Levites.","13":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H5130\">offer</span> them for an <span class=\"wl wl-kjv\" data-code=\"H8573\">offering</span> unto the LORD.","14":"Thus shalt thou <span class=\"wl wl-kjv\" data-code=\"H914\">separate</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and the Levites","15":"And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that shall the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to do the <span class=\"wl wl-kjv\" data-code=\"H5647\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation:</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H2891\">cleanse</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5130\">offer</span> them for an offering.","16":"For they are wholly <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto me from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> instead of such as <span class=\"wl wl-kjv\" data-code=\"H6363\">open</span> every <span class=\"wl wl-kjv\" data-code=\"H7358\">womb,</span> even instead of the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> have I taken","17":"For all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> are mine, both <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H929\">beast:</span> on the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that I <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> every <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> I sanctified","18":"And I have <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> for all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","19":"And I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> as a <span class=\"wl wl-kjv\" data-code=\"H5414\">gift</span> to <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and to his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">do</span> the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and to make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> that there be no <span class=\"wl wl-kjv\" data-code=\"H5063\">plague</span> among the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> come <span class=\"wl wl-kjv\" data-code=\"H5066\">nigh</span> unto the sanctuary.","20":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> according unto all that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> so <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel","21":"And the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> were <span class=\"wl wl-kjv\" data-code=\"H2398\">purified,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3526\">washed</span> their <span class=\"wl wl-kjv\" data-code=\"H899\">clothes;</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H5130\">offered</span> them as an <span class=\"wl wl-kjv\" data-code=\"H8573\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> made an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for them to cleanse","22":"And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> in to <span class=\"wl wl-kjv\" data-code=\"H5647\">do</span> their <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons:</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> so did","23":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","24":"This is it that belongeth unto the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites:</span> from <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward</span> they shall go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to <span class=\"wl wl-kjv\" data-code=\"H6633\">wait</span> upon the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation:","25":"And from the <span class=\"wl wl-kjv\" data-code=\"H1121\">age</span> of <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7725\">cease</span> <span class=\"wl wl-kjv\" data-code=\"H6635\">waiting</span> upon the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> thereof, and shall serve","26":"But shall <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> with their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5647\">do</span> no <span class=\"wl wl-kjv\" data-code=\"H5656\">service.</span> Thus shalt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> touching their charge."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"aansteken zult,","tekst":"Hebreeuws, doen opgaan"},{"catchword":"recht tegenover","tekst":"Hebreeuws, tegenover het aangezicht des kandelaars; dat is, aan de beide zijden van de schacht des kandelaars, welke was als het lichaam deszelven, want de kandelaar had aan zijn schacht zes rieten met zoveel lampen en een aan den schacht, welke aangestoken zijnde, aan de zijden des kandelaars licht gaven. Zie Exo 25:37."}],"4":[{"catchword":"van dicht goud,","tekst":"Dat is, van geheel een massief goud, of van één massa en klomp van goud samen uitgewrocht en niet van verscheidene stukken en delen aaneen gehecht. Zie Exo 25:31."},{"catchword":"de gedaante,","tekst":"Hebreeuws, aanzien, of gezicht; dat is, patroon"},{"catchword":"vertoond had,","tekst":"Te weten, op den berg; Exo 25:40."}],"6":[{"catchword":"reinig hen","tekst":"Hetwelk geschiedde toen de Levieten openlijk tot den dienst des Heeren, van de andere stammen afgezonderd zijnde, met het zondwater besprengd, geschoren en hun klederen gewassen en offeranden voor hen gedaan werden. Zie de volgende verzen."}],"7":[{"catchword":"water der ontzondiging;","tekst":"Dat is, water om te ontzondigen en naar de wet der ceremoniën van zonden te reinigen. Zie van dit water onder, Num 19:9, waar het een water der afzondering genaamd werd."}],"8":[{"catchword":"een jong rund,","tekst":"Hebreeuws, de zoon eens runds; en zo in het volgende."}],"10":[{"catchword":"de kinderen Israëls","tekst":"Versta, de oversten der stammen en enige voornaamsten, die in naam der gehele gemeente dit en andere dergelijke dingen uitvoerden. Zie van de oplegging der handen Gen 48:14, en Lev 1:4."}],"11":[{"catchword":"bewegen","tekst":"Dat is, offeren, schenken, of toeëigenen"},{"catchword":"beweegoffer","tekst":"Zie van het beweegoffer, alzo eigenlijk en bijzonder genoemd, Lev 7:30; maar hier schijnt het Hebreeuwse woord in het algemeen genomen te zijn, voor hetgeen aan God geofferd en toegeëigend wordt; in welken zin het staat Exo 35:22, en Exo 38:24, Exo 38:29; en hier in vs.13, 15, 21, hoewel de eerste betekenis [naar sommiger gevoelen] hier ook plaats zou mogen hebben, te weten, dat zij naar de vier hoeken der wereld bewogen worden."}],"15":[{"catchword":"en gij zult hen reinigen,","tekst":"Anders, als gij hen gereinigd zult hebben, enz."}],"16":[{"catchword":"gegeven,","tekst":"Alzo boven, Num 3:9."},{"catchword":"de opening van alle baarmoeder,","tekst":"Zie boven, Num 3:12."}],"19":[{"catchword":"tot een gift gegeven,","tekst":"Hebreeuws, gegevene gegeven"},{"catchword":"om den dienst van de kinderen Israëls","tekst":"Dat is, opdat zij door hun personen de plaats van de eerstgeborenen der Israëlieten bewaren zouden; zie boven, Num 3:7; en door hun dienst de zoenoffers bedienen, die voor allen naar gelegenheid gedaan moesten worden."},{"catchword":"plage zij","tekst":"Gelijk den koning Uzzia wedervaren is; 2Ch 26:18."},{"catchword":"naderen zouden","tekst":"Hetwelk de Levieten daarom in hun naam doen moesten."}],"21":[{"catchword":"ontzondigden zich,","tekst":"Hetwelk naar de wet der ceremoniën geschiedde door wassingen, besprengingen en offeranden; Lev 15:13-15; onder, Num 19:11-12, enz."},{"catchword":"bewoog hen ten beweegoffer","tekst":"Zie boven, vs.11."}],"24":[{"catchword":"van vijf en twintig jaren oud","tekst":"De Levieten waren, ten aanzien van hun ouderdom onderscheiden in vier hopen. De&lt;i&gt;I.&lt;/i&gt; waren van hun kindsheid tot hun vijf en twintigste jaar als leerlingen onderwezen in de dingen, die de wet en haar dienst aangingen;&lt;i&gt;II.&lt;/i&gt; Die vijf en twintig jaren oud waren, tot dertig toe, begonnen de handen aan het werk te slaan en tot de praktijk te komen, van hetgeen zij geleerd hadden;&lt;i&gt;III.&lt;/i&gt; Die van dertig jaren tot vijftig jaren oud waren, bedienden den gehelen en vollen dienst van het Levietische ambt;&lt;i&gt;IV.&lt;/i&gt; Die, oude zijnde vijftig jaren en daarboven, waren vrij van het werk van den dienst, hebbende evenwel opzicht over degenen, die dat dadelijk bedienden. Vergelijk boven de aantekeningen Num 3:15."},{"catchword":"om den strijd te strijden,","tekst":"Zie boven, Num 4:3."}],"26":[{"catchword":"broederen dienen","tekst":"Dat is, de andere Levieten, die in den tabernakel dienden en nog geen vijftig jaren oud waren."},{"catchword":"om de wacht waar te nemen;","tekst":"Dat is, om opzicht te nemen over degenen, die in den tabernakel dienden, teneinde dat alles met orde en stichting naar de wetten Gods, die daarvan waren, door hen uitgericht werd. Anders, om hun in hun dienst behulpzaam te wezen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the LORD spoke to Moseh, saying:"}],"2":[{"catchword":null,"tekst":"Speak to Aaron, and say to him: when thou shalt kindle the Lamps, [Heb. cause the Lamps to arise] the seven Lamps shall shine right over against the Candlestick, [Heb. over against the face of the Candlestick, i.e. on both sides of the body of the Candlestick, which had six reeds or branches issuing forth the same, and on a top which being lighted, they cast their light on the sides of the Candlestick. See Exod. 25. 37.]"}],"3":[{"catchword":null,"tekst":"And Aaron did so; he kindled the Lamps thereof, over against before the Candlestick, even as the LORD had commanded Moseh."}],"4":[{"catchword":null,"tekst":"This work now of the Candlestick was of massy gold, [i.e wrought all out of one lump or mass of gold, and not joined or smothered together by piece-meal, of several parts or joints. See Exod. 25. On v. 31.] unto his stem unto his flowers it was massy, according to the fashion [Heb. regard, aspect, hue, i.e. fashion or pattern] which the LORD had showed Moseh, [viz. on the mount Exod. 25. 40.] so he had made the Candlestick."}],"5":[{"catchword":null,"tekst":"And the LORD spoke to Moseh, saying;"}],"6":[{"catchword":null,"tekst":"Take the Levites out of the midst of the children of Israel, and cleanse them. [Which was done when the Levites, being solemnly set apart for the service of the LORD, and separated from the rest of the Tribes, were sprinkled with the sin-water, and shaved, and their cloths washed, and sacrifices offered for them. See further hereof in the following verses.]"}],"7":[{"catchword":null,"tekst":"And thus shalt thou do to them to cleanse them, sprinkle upon them water of expiation, [i.e. water for to unsin, i.e. to cleanse and purify them from sins, according to the Ceremonial Law. Of this water see below v. 19. Where it is called a water of separation] and they shall let their razor go over all their flesh, and shall wash their clothes and cleanse themselves."}],"8":[{"catchword":null,"tekst":"After that shall they take a bullock, a young one: [Heb. the Son of a bullock, and so in the sequel] with his meat-offering of meal-flower, mixed with Oil, and another bullock, a young one, thou shalt take for a sin-offering."}],"9":[{"catchword":null,"tekst":"And thou shalt cause the Levites to approach before the Tent of the Congregation, and thou shalt cause the whole Congregation of the children of Israel to assemble?"}],"10":[{"catchword":null,"tekst":"Yea thou shalt cause the Levites to approach before the Tent of the Congregation: and the children of Israel shall lay their hands upon the Levites: [Understand the chief of the Tribes, and some of the principal rank among them, who were used to transact and execute such public affairs in the name and behalf of all the Congregation. Of the laying on of hands, see Gen. 48. 14. And Lev. 1. On ver. 4.]"}],"11":[{"catchword":null,"tekst":"And Aaron shall wave the Levites, [i.e. offer up, give and dedicate them] for a wave-offering [See of the wave-offering properly called thus, Lev. 17. On v. 30. But it seemeth the Hebrew word is generally taken for anything offered and dedicated to God, in which sense ye find it used, Exod. 35. 22. And chap. 28. 24, 29 and here in the following verses, 13, 15, and 21. Although the first signification (according to some) may likewise take place here, viz. that they were waved towards the four parts of the world] before the face of the LORD, in the behalf (or because) of the children of Israel, that they may be for to administer the service of the LORD."}],"12":[{"catchword":null,"tekst":"And the Levites shall lay their hands upon the head of the bullocks, after that prepare thou one for a sin-offering, and one for a burnt-offering to the LORD, to make Expiation over the Levites."}],"13":[{"catchword":null,"tekst":"And thou shalt put the Levites before the face of Aaron, and before the // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
