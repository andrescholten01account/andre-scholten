 vee;","4":"Zo zal hij, die zijn offerande de HEERE offert, een spijsoffer offeren van een tiende meelbloem, gemengd met een vierendeel van een hin[1] olie.","5":"En wijn ten drankoffer, een vierendeel van een hin, zult u bereiden tot een brandoffer of tot een slachtoffer, voor één lam.","6":"Of voor een ram zult u een spijsoffer bereiden, van twee tienden meelbloem, gemengd met olie, een derde deel van een hin.","7":"En wijn ten drankoffer, een derde deel van een hin, zult u offeren tot een liefelijke reuk voor de HEERE.","8":"En wanneer u een jong rund zult bereiden tot een brandoffer of een slachtoffer, om een gelofte af te zonderen, of tot dankoffer voor de HEERE;","9":"Zo zal hij bij een jong rund een spijsoffer offeren van drie tienden meelbloem, gemengd met olie, de helft van een hin.","10":"En wijn zult u offeren ten drankoffer, de helft van een hin, tot een vuuroffer van liefelijke reuk voor de HEERE.","11":"Zo zal het gedaan worden met de ene os, of met de ene ram, of met het klein vee, van de lammeren of van de geiten.","12":"Naar het getal dat u bereiden zult, zult u zo doen met elk, naar hun getal.","13":"Elke inboorling zal deze dingen zo doen, terwijl hij een vuuroffer offert tot een liefelijke reuk voor de HEERE.","14":"Wanneer ook een vreemdeling bij u als vreemdeling verblijft, of wie dan ook die in uw midden is, in uw geslachten, en hij een vuuroffer zal bereiden tot een liefelijke reuk voor de HEERE; zoals u doet, zo zal hij doen.","15":"U, gemeente, het geldt voor u en voor de vreemdeling die als vreemdeling bij u verblijft, één inzetting: een eeuwige inzetting bij uw geslachten; zoals u bent, zo zal de vreemdeling voor het aangezicht van de HEERE zijn.","16":"Eén wet en één recht zal er zijn voor u en voor de vreemdeling die bij u als vreemdeling verblijft.","17":"Vervolgens sprak de HEERE tot Mozes en zei:","18":"Spreek tot de kinderen van Israël en zeg tot hen: Als u gekomen bent in het land waarheen Ik u brengen zal,","19":"Dan zal het gebeuren, wanneer u van het brood van het land eet, dat u de HEERE een hefoffer zult offeren.","20":"De eerstelingen van uw deeg, een koek, zult u tot een hefoffer offeren; zoals het hefoffer van de dorsvloer, zo zult u het offeren.","21":"Van de eerstelingen van uw deeg zult u de HEERE een hefoffer geven, bij uw geslachten.","22":"Verder, wanneer u afgedwaald zult zijn, en niet gedaan hebt al deze geboden die de HEERE tot Mozes gesproken heeft;","23":"Alles wat de HEERE u door de hand van Mozes geboden heeft; van de dag af dat de HEERE het geboden heeft, en vervolgens bij uw geslachten;","24":"Dan zal het gebeuren, indien iets bij dwaling gedaan is, *en* voor de ogen van de vergadering *verborgen* *is*, dat de hele vergadering een var, een jong rund, zal bereiden tot brandoffer, tot een liefelijke reuk voor de HEERE, met zijn spijsoffer en zijn drankoffer, naar de gebruikelijke wijze; en een geitenbok tot zondoffer.","25":"En de priester zal de verzoening doen voor de hele vergadering van de kinderen van Israël, en het zal hun vergeven worden; want het was een afdwaling, en zij hebben hun offerande gebracht, een vuuroffer voor de HEERE, en hun zondoffer, voor het aangezicht van de HEERE, over hun afdwaling.","26":"Het zal dan aan de hele vergadering van de kinderen van Israël vergeven worden, ook aan de vreemdeling die in hun midden als vreemdeling verblijft; want het is het hele volk door dwaling overkomen.","27":"En indien één ziel door afdwaling gezondigd zal hebben, zal die een eenjarige geit tot zondoffer offeren.","28":"En de priester zal de verzoening doen over de dwalende ziel, wanneer zij gezondigd heeft door afdwaling, voor het aangezicht van de HEERE, door de verzoening over haar te doen; en het zal haar vergeven worden.","29":"Voor de inboorling van de kinderen van Israël en de vreemdeling die in hun midden als vreemdeling verblijft, zal één wet gelden, voor hem die het door afdwaling doet.","30":"Maar de ziel die iets doet met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt de HEERE; en die ziel zal uitgeroeid worden uit het midden van haar volk;","31":"Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.","32":"Toen de kinderen van Israël in de woestijn waren, vonden zij een man die hout las op de sabbatdag.","33":"En zij die hem hout zagen lezen, brachten hem tot Mozes en tot Aäron en tot de hele vergadering.","34":"En zij stelden hem in bewaring; want het was niet duidelijk gemaakt wat hem gedaan moest worden.","35":"Toen zei de HEERE tot Mozes: Die man zal zeker gedood worden; de hele vergadering zal hem met stenen stenigen buiten het leger.","36":"Toen bracht de hele vergadering hem naar buiten, buiten het leger, en zij stenigden hem met stenen, zodat hij stierf, zoals de HEERE Mozes geboden had.","37":"En de HEERE sprak tot Mozes en zei:","38":"Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten.","39":"En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert;","40":"Opdat u denkt aan en doet al Mijn geboden, en voor uw God heilig bent.","41":"Ik ben de HEERE, uw God, Die u uit het land Egypte uitgeleid heb, om u tot een God te zijn; Ik ben de HEERE, uw God!"},"SV":{"1":"Daarna sprak de HEERE tot Mozes, zeggende:","2":"Spreek tot de kinderen Israëls, en zeg tot hen: Wanneer gij gekomen zult zijn in het land uwer woningen, dat Ik u geven zal;","3":"En gij een vuuroffer den HEERE zult doen, een brandoffer, of slachtoffer, om af te zonderen een gelofte, of in een vrijwillig offer, of in uw gezette hoogtijden, om den HEERE een liefelijken reuk te maken, van runderen of van klein vee;","4":"Zo zal hij, die zijn offerande den HEERE offert, een spijsoffer offeren van een tiende meelbloem, gemengd met een vierendeel van een hin olie.","5":"En wijn ten drankoffer, een vierendeel van een hin, zult gij bereiden tot een brandoffer of tot een slachtoffer, voor een lam.","6":"Of voor een ram zult gij een spijsoffer bereiden, van twee tienden meelbloem, gemengd met olie, een derde deel van een hin.","7":"En wijn ten drankoffer, een derde deel van een hin, zult gij offeren tot een liefelijken reuk den HEERE.","8":"En wanneer gij een jong rund zult bereiden tot een brandoffer of een slachtoffer, om een gelofte af te zonderen, of ten dankoffer den HEERE;","9":"Zo zal hij tot een jong rund offeren een spijsoffer van drie tienden meelbloem, gemengd met olie, de helft van een hin.","10":"En wijn zult gij offeren ten drankoffer, de helft van een hin, tot een vuuroffer van liefelijken reuk den HEERE.","11":"Alzo zal gedaan worden met den enen os, of met den enen ram, of met het klein vee, van de lammeren, of van de geiten.","12":"Naar het getal, dat gij bereiden zult, zult gij alzo doen met elkeen, naar hun getal.","13":"Alle inboorling zal deze dingen alzo doen, offerende een vuuroffer tot een liefelijken reuk den HEERE.","14":"Wanneer ook een vreemdeling bij u als vreemdeling verkeert, of die in het midden van u is, in uw geslachten, en hij een vuuroffer zal bereiden tot een liefelijken reuk den HEERE; gelijk als gij zult doen, alzo zal hij doen.","15":"Gij, gemeente, het zij ulieden en den vreemdeling, die als vreemdeling *bij* *u* verkeert, enerlei inzetting: ter eeuwige inzetting bij uw geslachten, gelijk gijlieden, alzo zal de vreemdeling voor des HEEREN aangezicht zijn.","16":"Enerlei wet en enerlei recht zal ulieden zijn, en den vreemdeling, die bij ulieden als vreemdeling verkeert.","17":"Voorts sprak de HEERE tot Mozes, zeggende:","18":"Spreek tot de kinderen Israëls, en zeg tot hen: Als gij zult gekomen zijn in het land, waarheen Ik u inbrengen zal,","19":"Zo zal het geschieden, als gij van het brood des lands zult eten, dan zult gij den HEERE een hefoffer offeren.","20":"De eerstelingen uws deegs, een koek zult gij tot een hefoffer offeren; gelijk het hefoffer des dorsvloers zult gij dat offeren.","21":"Van de eerstelingen uws deegs zult gij den HEERE een hefoffer geven, bij uw geslachten.","22":"Voorts wanneer gijlieden afgedwaald zult zijn, en niet gedaan hebben al deze geboden, die de HEERE tot Mozes gesproken heeft;","23":"Alles, wat u de HEERE door de hand van Mozes geboden heeft; van dien dag af, dat het de HEERE geboden heeft, en voortaan bij uw geslachten;","24":"Zo zal het geschieden, indien iets bij dwaling gedaan, *en* voor de ogen der vergadering *verborgen* *is*, dat de ganse vergadering een var, een jong rund, zal bereiden ten brandoffer, tot een liefelijken reuk den HEERE, met zijn spijsoffer en zijn drankoffer, naar de wijze; en een geitenbok ten zondoffer.","25":"En de priester zal de verzoening doen voor de ganse vergadering van de kinderen Israëls, en het zal hun vergeven worden; want het was een afdwaling, en zij hebben hun offerande gebracht, een vuuroffer den HEERE, en hun zondoffer, voor het aangezicht des HEEREN, over hun afdwaling.","26":"Het zal dan aan de ganse vergadering der kinderen Israëls vergeven worden, ook den vreemdeling, die in het midden van henlieden als vreemdeling verkeert; want het is het ganse volk door dwaling *overkomen*.","27":"En indien een ziel door afdwaling gezondigd zal hebben, die zal een eenjarige geit ten zondoffer offeren.","28":"En de priester zal de verzoening doen over de dwalende ziel, als zij gezondigd heeft door afdwaling, voor het aangezicht des HEEREN, doende de verzoening over haar; en het zal haar vergeven worden.","29":"Den inboorling der kinderen Israëls, en den vreemdeling, die in hunlieder midden als vreemdeling verkeert, enerlei wet zal ulieden zijn, dengene, die het door afdwaling doet.","30":"Maar de ziel, die iets gedaan zal hebben met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt den HEERE; en diezelve ziel zal uitgeroeid worden uit het midden van haar volk;","31":"Want zij heeft het woord des HEEREN veracht en Zijn gebod vernietigd; diezelve ziel zal ganselijk uitgeroeid worden; haar ongerechtigheid is op haar.","32":"Als nu de kinderen Israëls in de woestijn waren, zo vonden zij een man, hout lezende op den sabbatdag.","33":"En die hem vonden, hout lezende, brachten hem tot Mozes, en tot Aäron, en tot de ganse vergadering.","34":"En zij stelden hem in bewaring; want het was niet verklaard, wat hem gedaan zou worden.","35":"Zo zeide de HEERE tot Mozes: Die man zal zekerlijk gedood worden; de ganse vergadering zal hem met stenen stenigen buiten het leger.","36":"Toen bracht hem de ganse vergadering uit tot buiten het leger, en zij stenigden hem met stenen, dat hij stierf, gelijk als de HEERE Mozes geboden had.","37":"En de HEERE sprak tot Mozes, zeggende:","38":"Spreek tot de kinderen Israëls, en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken hunner klederen, bij hun geslachten; en op de snoertjes des hoeks zullen zij een hemelsblauwen draad zetten.","39":"En hij zal ulieden aan de snoertjes zijn, opdat gij het aanziet, en aan al de geboden des HEEREN gedenkt, en die doet; en gij zult naar uw hart, en naar uw ogen niet sporen, die gij zijt nahoererende;","40":"Opdat gij gedenkt en doet al Mijn geboden, en uw God heilig zijt.","41":"Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb, om u tot een God te zijn; Ik ben de HEERE, uw God!"},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Speak unto the children of Israel, and say unto them, When ye be come into the land of your habitations, which I give","3":"And will make an offering by fire unto the LORD, a burnt offering, or a sacrifice in performing a vow, or in a freewill offering, or in your solemn feasts, to make a sweet savour unto the LORD, of the herd, or of the flock:","4":"Then shall he that offereth his offering unto the LORD bring a meat offering of a tenth deal of flour mingled with the fourth *part* of an hin of oil.","5":"And the fourth *part* of an hin of wine for a drink offering shalt thou prepare with the burnt offering or sacrifice, for one lamb.","6":"Or for a ram, thou shalt prepare *for* a meat offering two tenth deals of flour mingled with the third *part* of an hin of oil.","7":"And for a drink offering thou shalt offer the third *part* of an hin of wine, *for* a sweet savour unto the LORD.","8":"And when thou preparest a bullock *for* a burnt offering, or *for* a sacrifice in performing a vow, or peace offerings unto the LORD:","9":"Then shall he bring with a bullock a meat offering of three tenth deals of flour mingled with half an hin of oil.","10":"And thou shalt bring for a drink offering half an hin of wine, *for* an offering made by fire, of a sweet savour unto the LORD.","11":"Thus shall it be done for one bullock, or for one ram, or for a lamb, or a kid.","12":"According to the number that ye shall prepare, so shall ye do to every one according to their number.","13":"All that are born of the country shall do these things after this manner, in offering an offering made by fire, of a sweet savour unto the LORD.","14":"And if a stranger sojourn with you, or whosoever *be* among you in your generations, and will offer an offering made by fire, of a sweet savour unto the LORD; as ye do, so he shall do.","15":"One ordinance *shall be both* for you of the congregation, and also for the stranger that sojourneth *with you*, an ordinance for ever in your generations: as ye *are*, so shall the stranger be before the LORD.","16":"One law and one manner shall be for you, and for the stranger that sojourneth","17":"And the LORD spake unto Moses, saying,","18":"Speak unto the children of Israel, and say unto them, When ye come into the land whither I bring","19":"Then it shall be, that, when ye eat of the bread of the land, ye shall offer up an heave offering unto the LORD.","20":"Ye shall offer up a cake of the first of your dough *for* an heave offering: as *ye do* the heave offering of the threshingfloor, so shall ye heave","21":"Of the first of your dough ye shall give unto the LORD an heave offering in your generations.","22":"And if ye have erred, and not observed all these commandments, which the LORD hath spoken unto Moses,","23":"*Even* all that the LORD hath commanded you by the hand of Moses, from the day that the LORD commanded *Moses*, and henceforward among your generations;","24":"Then it shall be, if *ought* be committed by ignorance without the knowledge of the congregation, that all the congregation shall offer one young bullock for a burnt offering, for a sweet savour unto the LORD, with his meat offering, and his drink offering, according to the manner, and one kid of the goats for a sin offering.","25":"And the priest shall make an atonement for all the congregation of the children of Israel, and it shall be forgiven them; for it *is* ignorance: and they shall bring their offering, a sacrifice made by fire unto the LORD, and their sin offering before the LORD, for their ignorance:","26":"And it shall be forgiven all the congregation of the children of Israel, and the stranger that sojourneth among them; seeing all the people *were* in ignorance.","27":"And if any soul sin through ignorance, then he shall bring a she goat of the first year for a sin offering.","28":"And the priest shall make an atonement for the soul that sinneth ignorantly, when he sinneth by ignorance before the LORD, to make an atonement for him; and it shall be forgiven","29":"Ye shall have one law for him that sinneth through ignorance, *both for* him that is born among the children of Israel, and for the stranger that sojourneth among","30":"But the soul that doeth *ought* presumptuously, *whether he be* born in the land, or a stranger, the same reproacheth the LORD; and that soul shall be cut off from among his people.","31":"Because he hath despised the word of the LORD, and hath broken his commandment, that soul shall utterly be cut off; his iniquity","32":"And while the children of Israel were in the wilderness, they found a man that gathered sticks upon the sabbath day.","33":"And they that found him gathering sticks brought him unto Moses and Aaron, and unto all the congregation.","34":"And they put him in ward, because it was not declared what should be done","35":"And the LORD said unto Moses, The man shall be surely put to death: all the congregation shall stone him with stones without the camp.","36":"And all the congregation brought him without the camp, and stoned him with stones, and he died; as the LORD commanded Moses.","37":"And the LORD spake unto Moses, saying,","38":"Speak unto the children of Israel, and bid them that they make them fringes in the borders of their garments throughout their generations, and that they put upon the fringe of the borders a ribband of blue:","39":"And it shall be unto you for a fringe, that ye may look upon it, and remember all the commandments of the LORD, and do them; and that ye seek not after your own heart and your own eyes, after which ye use to go a whoring:","40":"That ye may remember, and do all my commandments, and be holy unto your God.","41":"I *am* the LORD your God, which brought you out of the land of Egypt, to be your God: I *am* the LORD your God."}},"tsk":{"3":[{"kopje":"zult doen","refs":["Ex 29:18","Ex 29:25","Ex 29:41","Lev 1:2","Lev 1:3","Lev 1:9","Lev 1:13","Lev 1:17","Lev 10:13"]},{"kopje":"een brandoffer","refs":["Lev 1:1-17"]},{"kopje":"slachtoffer","refs":["Lev 7:16","Lev 22:18-23","Deut 12:11"]},{"kopje":"af te zonderen","refs":["Lev 27:2"]},{"kopje":"of in een vrijwillig offer","refs":["Lev 22:21","Lev 22:23","Deut 12:6","Deut 12:17","Deut 16:10"]},{"kopje":"op uw","refs":["Num 28:16-19","Num 28:27","Num 29:1","Num 29:2","Num 29:8","Num 29:13-40","Lev 23:8","Lev 23:12","Lev 23:36","Deut 16:1-17"]},{"kopje":"een liefelij "vergadering","tekst":"Dit verstaan sommigen van bijzondere vergaderingen of gemeenten, die in het land Kanaän in steden en dorpen alsdan zouden zijn, en dat, Lev 4:13, enz. van de ganse vergadering, daar zij buiten Kanaän in het leger bijeen was, gesproken is, met bevel van alleenlijk een jong rund ten zondoffer te offeren, buiten het leger te voeren en te verbranden, Lev 4:21; maar hier wordt een jong rund ten brandoffer en een geitenbok ten zondoffer bevolen."},{"catchword":"verborgen is,","tekst":"Dit wordt hier ingevoegd uit Lev 4:13."}],"25":[{"catchword":"ganse vergadering","tekst":"Zie op het voorgaande vs."}],"27":[{"catchword":"ziel door afdwaling","tekst":"Dat is, mens, persoon; alzo in het volgende."},{"catchword":"eenjarige geit ten zondoffer offeren","tekst":"Hebreeuws, een dochter van haar jaar."}],"30":[{"catchword":"opgeheven hand,","tekst":"Dat is, met opzet, trots en hoogmoed, moedwilligheid, zonder enig schromen of ontzag voor den Allerhoogste en zijn geboden. Deze manier van spreken wordt ook in een anderen zin gebruikt. Zie Exo 14:8; Num 33:3."},{"catchword":"uitgeroeid worden","tekst":"Zie Gen 17:14."}],"31":[{"catchword":"is op haar","tekst":"Of, zij op haar. Dat is, zij drage de straf harer ongerechtigheid, waarvan zij zelve de schuld heeft. Vergelijk Lev 20:9."}],"33":[{"catchword":"vergadering","tekst":"Der oudsten en rechters."}],"34":[{"catchword":"zij stelden hem in bewaring;","tekst":"Te weten, die hem er op bevonden hadden, of anderen, door bevel van Mozes, enz."},{"catchword":"niet verklaard,","tekst":"Versta, welken dood men hem zou aandoen, daarvan was geen uitgedrukte wet, hoewel Exo 35:2 bevolen was dat men zou ombrengen dengene, die enig dienstwerk op den sabbatdag deed."}],"38":[{"catchword":"snoertjes maken aan de hoeken hunner klederen,","tekst":"Vergelijk Deu 22:12;; Mat 23:5; idem Exo 13:16; Deu 6:8, en Deu 11:18."}],"39":[{"catchword":"hij zal ulieden aan de snoertjes zijn,","tekst":"Te weten, de draad."},{"catchword":"naa function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);

    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }

}

    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
