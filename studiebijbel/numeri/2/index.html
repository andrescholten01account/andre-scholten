 van Juda zijn.","4":"Zijn leger nu, en zijn getelden, waren vierenzeventigduizend zeshonderd.","5":"En ernaast zal zich legeren de stam van Issaschar; en Nethaneel, de zoon van Zuar, zal de leider van de zonen van Issaschar zijn.","6":"Zijn leger nu, en zijn getelden, waren vierenvijftigduizend vierhonderd.","7":"*Daartoe* de stam van Zebulon; en Eliab, de zoon van Helon, zal de leider van de zonen van Zebulon zijn.","8":"Zijn leger nu, en zijn getelden, waren zevenenvijftigduizend vierhonderd.","9":"Al de getelden van het leger van Juda waren honderdzesentachtigduizend vierhonderd, naar hun legers. Zij zullen vooraan optrekken.","10":"De banier van het leger van Ruben, naar hun legers, zal tegen het zuiden zijn; en Elizur, de zoon van Sedeur, zal de leider van de zonen van Ruben zijn.","11":"Zijn leger nu, en zijn getelden, waren zesenveertigduizend vijfhonderd.","12":"En naast hem zal zich legeren de stam van Simeon; en Selumiël, de zoon van Zurisaddai, zal de leider van de zonen van Simeon zijn.","13":"Zijn leger nu, en zijn getelden, waren negenenvijftigduizend driehonderd.","14":"Daartoe de stam van Gad; en Eljasaf, de zoon van Rehuël, zal de leider van de zonen van Gad zijn.","15":"Zijn leger nu, en zijn getelden, waren vijfenveertigduizend zeshonderdvijftig.","16":"Al de getelden in het leger van Ruben waren honderdeenenvijftigduizend vierhonderdvijftig, naar hun legers. En zij zullen als tweede optrekken.","17":"Daarna zal de tent van de samenkomst optrekken, met het leger van de Levieten, in het midden van de legers; zoals zij zich legeren zullen, zo zullen zij optrekken, ieder op zijn plaats, naar hun banieren.","18":"De banier van het leger van Efraïm, naar hun legers, zal tegen het westen zijn; en Elisama, de zoon van Ammihud, zal de leider van de zonen van Efraïm zijn.","19":"Zijn leger nu, en zijn getelden, waren veertigduizend vijfhonderd.","20":"En naast hem de stam van Manasse; en Gamaliël, de zoon van Pedazur, zal de leider van de zonen van Manasse zijn.","21":"Zijn leger nu, en zijn getelden, waren tweeëndertigduizend tweehonderd.","22":"Daartoe de stam van Benjamin; en Abidan, de zoon van Gideoni, zal de leider van de zonen van Benjamin zijn.","23":"Zijn leger nu, en zijn getelden, waren vijfendertigduizend vierhonderd.","24":"Al de getelden in het leger van Efraïm waren honderdachtduizend eenhonderd, naar hun legers. En zij zullen als derde optrekken.","25":"De banier van het leger van Dan zal tegen het noorden zijn, naar hun legers; en Ahiëzer, de zoon van Ammisaddai, zal de leider van de zonen van Dan zijn.","26":"Zijn leger nu, en zijn getelden, waren tweeënzestigduizend zevenhonderd.","27":"En naast hem zal zich legeren de stam van Aser; en Pagiel, de zoon van Ochran, zal de leider van de zonen van Aser zijn.","28":"Zijn leger nu, en zijn getelden, waren eenenveertigduizend vijfhonderd.","29":"Daartoe de stam van Nafthali; en Ahira, de zoon van Enan, zal de leider van de zonen van Nafthali zijn.","30":"Zijn leger nu, en zijn getelden, waren drieënvijftigduizend vierhonderd.","31":"Al de getelden in het leger van Dan waren honderdzevenenvijftigduizend zeshonderd. Zij zullen achteraan optrekken, naar hun banieren.","32":"Dezen zijn de getelden van de Israëlieten, naar het huis van hun vaderen; al de getelden van de legers, naar hun legers, waren zeshonderddrieduizend vijfhonderdvijftig.","33":"Maar de Levieten werden niet geteld onder de Israëlieten, zoals de HEERE Mozes geboden had.","34":"En de Israëlieten deden naar alles wat de HEERE Mozes geboden had; zo legerden zij zich naar hun banieren, en zo trokken zij op, ieder naar zijn geslachten, naar het huis van zijn vaderen."},"SV":{"1":"En de HEERE sprak tot Mozes en tot Aäron, zeggende:","2":"De kinderen Israëls zullen zich legeren, een ieder onder zijn banier, naar de tekenen van het huis hunner vaderen; rondom tegenover de tent der samenkomst zullen zij zich legeren.","3":"Die zich nu legeren zullen oostwaarts tegen den opgang, zal zijn de banier des legers van Juda, naar hun heiren; en Nahesson, de zoon van Amminadab, zal de overste der zonen van Juda zijn.","4":"Zijn heir nu, en zijn getelden waren vier en zeventig duizend en zeshonderd.","5":"En nevens zal zich legeren de stam van Issaschar; en Nethaneel, de zoon van Zuar, zal de overste der zonen van Issaschar zijn.","6":"Zijn heir nu, en zijn getelden waren vier en vijftig duizend en vierhonderd.","7":"*Daartoe* de stam van Zebulon; en Eliab, de zoon van Helon, zal de overste der zonen van Zebulon zijn.","8":"Zijn heir nu, en zijn getelden waren zeven en vijftig duizend en vierhonderd.","9":"Al de getelden des legers van Juda waren honderd zes en tachtig duizend en vierhonderd, naar hun heiren. Zij zullen vooraan optrekken.","10":"De banier des legers van Ruben, naar hun heiren, zal tegen het zuiden zijn; en Elizur, de zoon van Sedeur, zal de overste der zonen van Ruben zijn.","11":"Zijn heir nu, en zijn getelden waren zes en veertig duizend en vijfhonderd.","12":"En nevens hem zal zich legeren de stam van Simeon; en Selumiël, de zoon van Zurisaddai, zal de overste der zonen van Simeon zijn.","13":"Zijn heir nu, en zijn getelden waren negen en vijftig duizend en driehonderd.","14":"Daartoe de stam van Gad; en Eljasaf, de zoon van Rehuël, zal de overste der zonen van Gad zijn.","15":"Zijn heir nu, en zijn getelden waren vijf en veertig duizend zeshonderd en vijftig.","16":"Al de getelden in het leger van Ruben waren honderd een en vijftig duizend vierhonderd en vijftig; naar hun heiren. En zij zullen de tweede optrekken.","17":"Daarna zal de tent der samenkomst optrekken, met het leger der Levieten, in het midden van de legers; gelijk als zij zich legeren zullen, alzo zullen zij optrekken, een iegelijk aan zijn plaats, naar hun banieren.","18":"De banier des legers van Efraïm, naar hun heiren, zal tegen het westen zijn; en Elisama, de zoon van Ammihud, zal de overste der zonen van Efraïm zijn.","19":"Zijn heir nu, en zijn getelden waren veertig duizend en vijfhonderd.","20":"En nevens hem de stam van Manasse; en Gamaliël, de zoon van Pedazur, zal de overste der zonen van Manasse zijn.","21":"Zijn heir nu, en zijn getelden waren twee en dertig duizend en tweehonderd.","22":"Daartoe de stam van Benjamin; en Abidan, de zoon van Gideoni, zal de overste der zonen van Benjamin zijn.","23":"Zijn heir nu, en zijn getelden waren vijf en dertig duizend en vierhonderd.","24":"Al de getelden in het leger van Efraïm waren honderd acht duizend en eenhonderd, naar hun heiren. En zij zullen de derde optrekken.","25":"De banier des legers van Dan zal tegen het noorden zijn, naar hun heiren; en Ahiëzer, de zoon van Ammisaddai, zal de overste der zonen van Dan zijn.","26":"Zijn heir nu, en zijn getelden waren twee en zestig duizend en zevenhonderd.","27":"En nevens hem zal zich legeren de stam van Aser; en Pagiel, de zoon van Ochran, zal de overste der zonen van Aser zijn.","28":"Zijn heir nu, en zijn getelden waren een en veertig duizend en vijfhonderd.","29":"Daartoe de stam van Nafthali; en Ahira, de zoon van Enan, zal de overste der zonen van Nafthali zijn.","30":"Zijn heir nu, en zijn getelden waren drie en vijftig duizend en vierhonderd.","31":"Al de getelden in het leger van Dan waren honderd zeven en vijftig duizend en zeshonderd. In het achterste zullen zij optrekken, naar hun banieren.","32":"Dezen zijn de getelden van de kinderen Israëls, naar het huis hunner vaderen; al de getelden der legers, naar hun heiren, waren zeshonderd drie duizend vijfhonderd en vijftig.","33":"Maar de Levieten werden niet geteld onder de zonen van Israël, gelijk als de HEERE Mozes geboden had.","34":"En de kinderen Israëls deden naar alles, wat de HEERE Mozes geboden had, zo legerden zij zich naar hun banieren, en zo trokken zij op, een iegelijk naar zijn geslachten, naar het huis zijner vaderen."},"KJV":{"1":"And the LORD spake unto Moses and unto Aaron, saying,","2":"Every man of the children of Israel shall pitch by his own standard, with the ensign of their father's house: far off about the tabernacle of the congregation shall they pitch.","3":"And on the east side toward the rising of the sun shall they of the standard of the camp of Judah pitch throughout their armies: and Nahshon the son of Amminadab *shall be* captain of the children of Judah.","4":"And his host, and those that were numbered of them, *were* threescore and fourteen thousand and six hundred.","5":"And those that do pitch next unto him *shall be* the tribe of Issachar: and Nethaneel the son of Zuar *shall be* captain of the children of Issachar.","6":"And his host, and those that were numbered thereof, *were* fifty and four thousand and four hundred.","7":"*Then* the tribe of Zebulun: and Eliab the son of Helon *shall be* captain of the children of Zebulun.","8":"And his host, and those that were numbered thereof, *were* fifty and seven thousand and four hundred.","9":"All that were numbered in the camp of Judah *were* an hundred thousand and fourscore thousand and six thousand and four hundred, throughout their armies. These shall first set forth.","10":"On the south side *shall be* the standard of the camp of Reuben according to their armies: and the captain of the children of Reuben *shall be* Elizur the son of Shedeur.","11":"And his host, and those that were numbered thereof, *were* forty and six thousand and five hundred.","12":"And those which pitch by him *shall be* the tribe of Simeon: and the captain of the children of Simeon *shall be* Shelumiel the son of Zurishaddai.","13":"And his host, and those that were numbered of them, *were* fifty and nine thousand and three hundred.","14":"Then the tribe of Gad: and the captain of the sons of Gad *shall be* Eliasaph the son of Reuel.","15":"And his host, and those that were numbered of them, *were* forty and five thousand and six hundred and fifty.","16":"All that were numbered in the camp of Reuben *were* an hundred thousand and fifty and one thousand and four hundred and fifty, throughout their armies. And they shall set forth in the second rank.","17":"Then the tabernacle of the congregation shall set forward with the camp of the Levites in the midst of the camp: as they encamp, so shall they set forward, every man in his place by their standards.","18":"On the west side *shall be* the standard of the camp of Ephraim according to their armies: and the captain of the sons of Ephraim *shall be* Elishama the son of Ammihud.","19":"And his host, and those that were numbered of them, *were* forty thousand and five hundred.","20":"And by him *shall be* the tribe of Manasseh: and the captain of the children of Manasseh *shall be* Gamaliel the son of Pedahzur.","21":"And his host, and those that were numbered of them, *were* thirty and two thousand and two hundred.","22":"Then the tribe of Benjamin: and the captain of the sons of Benjamin *shall be* Abidan the son of Gideoni.","23":"And his host, and those that were numbered of them, *were* thirty and five thousand and four hundred.","24":"All that were numbered of the camp of Ephraim *were* an hundred thousand and eight thousand and an hundred, throughout their armies. And they shall go forward in the third rank.","25":"The standard of the camp of Dan *shall be* on the north side by their armies: and the captain of the children of Dan *shall be* Ahiezer the son of Ammishaddai.","26":"And his host, and those that were numbered of them, *were* threescore and two thousand and seven hundred.","27":"And those that encamp by him *shall be* the tribe of Asher: and the captain of the children of Asher *shall be* Pagiel the son of Ocran.","28":"And his host, and those that were numbered of them, *were* forty and one thousand and five hundred.","29":"Then the tribe of Naphtali: and the captain of the children of Naphtali *shall be* Ahira the son of Enan.","30":"And his host, and those that were numbered of them, *were* fifty and three thousand and four hundred.","31":"All they that were numbered in the camp of Dan *were* an hundred thousand and fifty and seven thousand and six hundred. They shall go hindmost with their standards.","32":"These *are* those which were numbered of the children of Israel by the house of their fathers: all those that were numbered of the camps throughout their hosts *were* six hundred thousand and three thousand and five hundred and fifty.","33":"But the Levites were not numbered among the children of Israel; as the LORD commanded Moses.","34":"And the children of Israel did according to all that the LORD commanded Moses: so they pitched by their standards, and so they set forward, every one after their families, according to the house of their fathers."}},"tsk":{"2":[{"kopje":"zullen zich legeren","refs":["Num 2:3","Num 2:10","Num 1:52","Num 10:14","Num 10:18","Num 10:22","Num 10:25"]},{"kopje":"zijn banier","refs":["Jes 11:10-12","Jes 18:3","Zach 9:16"]},{"kopje":"tegenover","refs":["Joz 3:4"]},{"kopje":"rondom","refs":["Num 1:50","Num 1:53","Ps 76:12","Jes 12:6","Ezech 43:7","1 Kor 14:33","1 Kor 14:40","Fil 1:27","Kol 2:19","Openb 4:2-5"]}],"3":[{"kopje":"de banier","refs":["Gen 49:8-10","Richt 1:1","Richt 1:2","1 Kron 5:2"]},{"kopje":"Nahesson","refs":["Num 1:7","Num 7:12","Num 7:17","Num 10:14-16","Num 26:19-22","Ruth 4:20","1 Kron 2:10","Matt 1:4","Luk 3:32","Luk 3:33"]}],"9":[{"kopje":"Zij zullen","refs":["Num 10:14"]}],"10":[{"kopje":"leger van Ruben","refs":["Gen 49:3","Gen 49:4","1 Kron 5:1"]},{"kopje":"Elizur","refs":["Num 1:5","Num 7:30","Num 7:35","Num 10:18"]}],"12":[{"kopje":"Selumiël","refs":["Num 1:6","Num 7:36","Num 7:41","Num 10:19"]}],"14":[{"kopje":"Eljasaf","refs":["Num 1:14","Num 7:42","Num 7:47","Num 10:20"]}],"16":[{"kopje":"honderd","refs":["Num 2:9","Num 2:24","Num 2:31"]},{"kopje":"zij zullen","refs":["Num 10:18"]}],"17":[{"kopje":"tent van de samenkomst","refs":["Num 2:1","Num 1:50-53","Num 3:38","Num 10:17","Num 10:21","1 Kor 14:40","Kol 2:5"]}],"18":[{"kopje":"leger van Efraïm","refs":["Num 1:32","Num 10:22", /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
