 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En de HEERE sprak tot Mozes en tot Aäron:", "2": "Neem de som op van de zonen van Kohath, uit het midden van de zonen van Levi, naar hun geslachten, naar het huis van hun vaderen.", "3": "Van dertig jaar oud en ouder, tot vijftig jaar oud; ieder die in deze strijd komt om het werk in de tent der samenkomst te doen.", "4": "Dit zal de dienst zijn van de zonen van Kohath, in de tent der samenkomst: namelijk het allerheiligste.", "5": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken.", "6": "En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen.", "7": "Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "8": "Daarna zullen zij een scharlaken kleed daarover uitspreiden, en dat met een deksel van dassenvellen bedekken; en zij zullen de bijbehorende handbomen aanleggen.", "9": "Dan zullen zij een kleed van hemelsblauw nemen, en de kandelaar van het licht bedekken, en zijn lampen, en zijn snuiters, en zijn blusvaten, en al zijn olievaten, waarmee zij daaraan dienen.", "10": "Zij zullen ook die, en al zijn gereedschap, in een deksel van dassenvellen doen, en zullen hem op de draagboom leggen.", "11": "En over het gouden altaar zullen zij een kleed van hemelsblauw uitspreiden, en dat met een deksel van dassenvellen bedekken; en zij zullen de bijbehorende handbomen aanleggen.", "12": "Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.", "13": "En zij zullen de as van het altaar vegen, en zij zullen daarover een kleed van purper uitspreiden.", "14": "En zij zullen daarop leggen al zijn gereedschap, waarmee zij daaraan dienen, de koolpannen, de krauwels, en de schoffels, en de sprenkelschalen*, al het gereedschap van het altaar; en zij zullen daarover een deksel van dassenvellen uitspreiden, en zullen de bijbehorende handbomen aanleggen.", "15": "Als Aäron en zijn zonen het dekken van het heiligdom, en van al het gereedschap van het heiligdom, bij het optrekken van het leger, voltooid hebben, dan zullen daarna de zonen van Kohath komen om te dragen; maar zij zullen dat heilige niet aanraken, opdat zij niet sterven. Dit is de last van de zonen van Kohath, in de tent der samenkomst.", "16": "Het toezicht nu van Eleazar, de zoon van Aäron, de priester, zal zijn over de olie van het licht, en het reukwerk van de welriekende specerijen, en het gedurige spijsoffer, en de zalfolie; het toezicht over de hele tabernakel, en alles wat daarin is, over het heiligdom en zijn gereedschap.", "17": "En de HEERE sprak tot Mozes en tot Aäron:", "18": "U zult de stam van de geslachten van de Kohathieten niet laten uitroeien uit het midden van de Levieten;", "19": "Maar dit zult u voor hen doen, opdat zij leven en niet sterven, wanneer zij tot het allerheiligste naderen: Aäron en zijn zonen zullen komen, en hen ieder aanstellen over zijn dienst en zijn last.", "20": "Maar zij zullen niet binnenkomen om te kijken wanneer men het heiligdom inpakt, opdat zij niet sterven.", "21": "En de HEERE sprak tot Mozes:", "22": "Neem ook de som op van de zonen van Gerson, naar het huis van hun vaderen, naar hun geslachten.", "23": "U zult hen tellen van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die komt om in de strijd te dienen, om de dienst te verrichten in de tent der samenkomst.", "24": "Dit zal de dienst zijn van de geslachten van de Gersonieten, in het dienen en in het dragen.", "25": "Zij zullen dan dragen de gordijnen van de tabernakel, en de tent der samenkomst; namelijk haar deksel, en het dassendeksel dat daar bovenop is, en het deksel van de deur van de tent der samenkomst,", "26": "En de behangsels van de voorhof, en het deksel van de deur van de poort van de voorhof, dat bij de tabernakel en bij het altaar rondom is; en hun touwen, en al het gereedschap van hun dienst, alsook alles wat daarvoor gemaakt wordt, opdat zij dienen.", "27": "De hele dienst van de zonen van de Gersonieten, in al hun last, en in al hun dienst, zal zijn naar het bevel van Aäron en van zijn zonen; en u zult hun ter bewaring al hun last opdragen.", "28": "Dit is de dienst van de geslachten van de zonen van de Gersonieten, in de tent der samenkomst; en hun taak zal zijn onder de hand van Ithamar, de zoon van Aäron, de priester.", "29": "Wat de zonen van Merari betreft, die zult u naar hun geslachten, en naar het huis van hun vaderen tellen.", "30": "U zult hen tellen van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die komt tot deze strijd, om de dienst van de tent der samenkomst te verrichten.", "31": "Dit zal nu de taak zijn van hun last, naar al hun dienst, in de tent der samenkomst: de planken van de tabernakel, en zijn richels, en zijn pilaren, en zijn voeten;", "32": "Alsook de pilaren van de voorhof rondom, hun voeten, en hun pennen, en hun touwen, met al hun gereedschap, en met al hun dienst; en het gereedschap van de taak van hun last zult u bij name tellen.", "33": "Dit is de dienst van de geslachten van de zonen van Merari, naar hun hele dienst, in de tent der samenkomst, onder de hand van Ithamar, de zoon van Aäron, de priester.", "34": "Mozes dan en Aäron, en de leiders van de vergadering telden de zonen van de Kohathieten, naar hun geslachten, en naar het huis van hun vaderen:", "35": "Van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die kwam tot deze strijd, tot de dienst in de tent der samenkomst;", "36": "Hun getelden nu waren, naar hun geslachten, tweeduizend zevenhonderdvijftig.", "37": "Dit zijn de getelden van de geslachten van de Kohathieten, van allen die in de tent der samenkomst dienden, die Mozes en Aäron geteld hebben, naar het bevel van de HEERE, door de hand van Mozes.", "38": "Evenzo de getelden van de zonen van Gerson, naar hun geslachten, en naar het huis van hun vaderen;", "39": "Van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die kwam tot deze strijd, tot de dienst in de tent der samenkomst;", "40": "Hun getelden waren, naar hun geslachten, naar het huis van hun vaderen, tweeduizend zeshonderddertig.", "41": "Dezen zijn de getelden van de geslachten van de zonen van Gerson, van allen die in de tent der samenkomst dienden, die Mozes en Aäron telden, naar het bevel van de HEERE.", "42": "En de getelden van de geslachten van de zonen van Merari, naar hun geslachten, naar het huis van hun vaderen,", "43": "Van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die kwam tot deze strijd, tot de dienst in de tent der samenkomst;", "44": "Hun getelden nu waren, naar hun geslachten, drieduizend tweehonderd.", "45": "Dezen zijn de getelden van de geslachten van de zonen van Merari, die Mozes en Aäron geteld hebben, naar het bevel van de HEERE, door de hand van Mozes.", "46": "Alle getelden, die Mozes en Aäron, en de leiders van Israël geteld hebben van de Levieten, naar hun geslachten, en naar het huis van hun vaderen,", "47": "Van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die kwam om de dienst van de bediening en de dienst van de last, in de tent der samenkomst, te verrichten;", "48": "Hun getelden waren achtduizend vijfhonderdtachtig.", "49": "Men telde hen, naar het bevel van de HEERE, door de hand van Mozes, ieder naar zijn dienst, en naar zijn last; en zijn getelden waren zoals de HEERE Mozes geboden had."}, "SV": {"1": "En de HEERE sprak tot Mozes en tot Aäron, zeggende:", "2": "Neemt op de som der zonen van Kohath, uit het midden der zonen van Levi, naar hun geslachten, naar het huis hunner vaderen.", "3": "Van dertig jaren oud en daarboven, tot vijftig jaren oud; al wie tot dezen strijd inkomt, om het werk in de tent der samenkomst te doen.", "4": "Dit zal de dienst zijn der zonen van Kohath, in de tent der samenkomst, *te* *weten* de heiligheid der heiligheden.", "5": "In het optrekken des legers, zo zullen Aäron en zijn zonen komen, en den voorhang des deksels afnemen, en zullen daarmede de ark der getuigenis bedekken.", "6": "En zij zullen een deksel van dassenvellen daarop leggen, en een geheel kleed van hemelsblauw daar bovenop uitspreiden; en zij zullen derzelver handbomen aanleggen.", "7": "Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en zullen daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurig brood daarop zijn.", "8": "Daarna zullen zij een scharlaken kleed daarover uitspreiden, en zullen dat met een deksel van dassenvellen bedekken; en zij zullen derzelver handbomen aanleggen.", "9": "Dan zullen zij een kleed van hemelsblauw nemen, en bedekken den kandelaar des luchters, en zijn lampen, en zijn snuiters, en zijn blusvaten, en al zijn olievaten, met welke zij aan denzelven dienen.", "10": "Zij zullen ook denzelven, en al zijn gereedschap, in een deksel van dassenvellen doen, en zullen hem op den draagboom leggen.", "11": "En over het gouden altaar zullen zij een kleed van hemelsblauw uitspreiden, en zullen dat met een deksel van dassenvellen bedekken; en zij zullen deszelfs handbomen aanleggen.", "12": "Zij zullen ook nemen alle gereedschap van den dienst, met hetwelk zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen hetzelve met een deksel van dassenvellen bedekken; en zij zullen het op den draagboom leggen.", "13": "En zij zullen de as van het altaar vegen, en zij zullen daarover een kleed van purper uitspreiden.", "14": "En zij zullen daarop leggen al zijn gereedschap, waarmede zij aan hetzelve dienen, de koolpannen, de krauwelen, en de schoffelen, en de sprengbekkens, al het gereedschap des altaars; en zij zullen daarover een deksel van dassenvellen uitspreiden, en zullen deszelfs handbomen aanleggen.", "15": "Als nu Aäron en zijn zonen, het dekken van het heiligdom, en van alle gereedschap des heiligdoms, in het optrekken des legers, zullen voleind hebben, zo zullen daarna de zonen van Kohath komen om te dragen; maar zij zullen dat heilige niet aanroeren, dat zij niet sterven. Dit is de last der zonen van Kohath, in de tent der samenkomst.", "16": "Het opzicht nu van Eleazar, den zoon van Aäron, den priester, zal zijn over de olie des luchters, en het reukwerk der welriekende specerijen, en het gedurig spijsoffer, en de zalfolie; het opzicht des gansen tabernakels, en alles wat daarin is, aan het heiligdom en aan zijn gereedschap.", "17": "En de HEERE sprak tot Mozes en tot Aäron, zeggende:", "18": "Gij zult den stam van de geslachten der Kohathieten niet laten uitgeroeid worden, uit het midden der Levieten;", "19": "Maar dit zult gij hun doen, opdat zij leven en niet sterven, als zij tot de heiligheid der heiligheden toetreden zullen: Aäron en zijn zonen zullen komen, en stellen hen een ieder over zijn dienst en aan zijn last.", "20": "Doch zij zullen niet inkomen om te zien, als men het heiligdom inwindt, opdat zij niet sterven.", "21": "En de HEERE sprak tot Mozes, zeggende:", "22": "Neem ook op de som der zonen van Gerson, naar het huis hunner vaderen, naar hun geslachten.", "23": "Gij zult hen tellen van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkomt om den strijd te strijden, opdat hij den dienst bediene in de tent der samenkomst.", "24": "Dit zal zijn de dienst der geslachten van de Gersonieten, in het dienen en in den last.", "25": "Zij zullen dan dragen de gordijnen des tabernakels, en de tent der samenkomst; *te* *weten* haar deksel, en het dassendeksel, dat er bovenop is, en het deksel der deur van de tent der samenkomst,", "26": "En de behangselen des voorhofs, en het deksel der deur van de poort des voorhofs, hetwelk is bij den tabernakel en bij het altaar rondom; en hun zelen, en al het gereedschap van hun dienst, mitsgaders al wat daarvoor bereid wordt, opdat zij dienen.", "27": "De gehele dienst van de zonen der Gersonieten, in al hun last, en in al hun dienst, zal zijn naar het bevel van Aäron en van zijn zonen; en gijlieden zult hun ter bewaring al hun last bevelen.", "28": "Dit is de dienst van de geslachten der zonen van de Gersonieten, in de tent der samenkomst; en hun wacht zal zijn onder de hand van Ithamar, den zoon van Aäron, den priester.", "29": "Aangaande de zonen van Merari, die zult gij naar hun geslachten, en naar het huis hunner vaderen tellen.", "30": "Gij zult hen tellen van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkomt tot dezen strijd, om te bedienen den dienst van de tent der samenkomst.", "31": "Dit zal nu zijn de onderhouding van hun last, naar al hun dienst, in de tent der samenkomst: de berderen des tabernakels, en zijn richelen, en zijn pilaren, en zijn voeten;", "32": "Mitsgaders de pilaren des voorhofs rondom, hun voeten, en hun pennen, en hun zelen, met al hun gereedschap, en met al hun dienst; en het gereedschap van de waarneming van hun last zult gij bij namen tellen.", "33": "Dit is de dienst van de geslachten der zonen van Merari, naar hun gansen dienst, in de tent der samenkomst, onder de hand van Ithamar, den zoon van Aäron, den priester.", "34": "Mozes dan en Aäron, en de oversten der vergadering telden de zonen der Kohathieten, naar hun geslachten, en naar het huis hunner vaderen:", "35": "Van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkwam tot dezen strijd, tot den dienst in de tent der samenkomst;", "36": "Hun getelden nu waren, naar hun geslachten, twee duizend zevenhonderd en vijftig.", "37": "Dit zijn de getelden van de geslachten der Kohathieten, van al wie in de tent der samenkomst diende, welke Mozes en Aäron geteld hebben, naar het bevel des HEEREN, door de hand van Mozes.", "38": "Insgelijks de getelden der zonen van Gerson, naar hun geslachten, en naar het huis hunner vaderen;", "39": "Van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkwam tot dezen strijd, tot den dienst in de tent der samenkomst;", "40": "Hun getelden waren, naar hun geslachten, naar het huis hunner vaderen, twee duizend zeshonderd en dertig.", "41": "Dezen zijn de getelden van de geslachten der zonen van Gerson, van al wie in de tent der samenkomst diende, welke Mozes en Aäron telden, naar het bevel des HEEREN.", "42": "En de getelden van de geslachten der zonen van Merari, naar hun geslachten, naar het huis hunner vaderen,", "43": "Van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkwam tot dezen strijd, tot den dienst in de tent der samenkomst;", "44": "Hun getelden nu waren, naar hun geslachten, drie duizend en tweehonderd.", "45": "Dezen zijn de getelden van de geslachten der zonen van Merari, welke Mozes en Aäron geteld hebben, naar het bevel des HEEREN, door de hand van Mozes.", "46": "Al de getelden, welke Mozes en Aäron, en de oversten van Israël geteld hebben van de Levieten, naar hun geslachten, en naar het huis hunner vaderen,", "47": "Van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkwam, om den dienst der bediening en den dienst van den last, in de tent der samenkomst, te bedienen;", "48": "Hun getelden waren acht duizend vijfhonderd en tachtig.", "49": "Men telde hen, naar het bevel des HEEREN, door de hand van Mozes, een ieder naar zijn dienst, en naar zijn last; en zijn getelden waren, die de HEERE Mozes geboden had."}, "KJV": {"1": "And the LORD spake unto Moses and unto Aaron, saying,", "2": "Take the sum of the sons of Kohath from among the sons of Levi, after their families, by the house of their fathers,", "3": "From thirty years old and upward even until fifty years old, all that enter into the host, to do the work in the tabernacle of the congregation.", "4": "This *shall be* the service of the sons of Kohath in the tabernacle of the congregation, *about* the most holy things:", "5": "And when the camp setteth forward, Aaron shall come, and his sons, and they shall take down the covering vail, and cover the ark of testimony", "6": "And shall put thereon the covering of badgers' skins, and shall spread over *it* a cloth wholly of blue, and shall put in the staves", "7": "And upon the table of shewbread they shall spread a cloth of blue, and put thereon the dishes, and the spoons, and the bowls, and covers to cover withal: and the continual bread", "8": "And they shall spread upon them a cloth of scarlet, and cover the same with a covering of badgers' skins, and shall put in the staves", "9": "And they shall take a cloth of blue, and cover the candlestick of the light, and his lamps, and his tongs, and his snuffdishes, and all the oil vessels thereof, wherewith they minister", "10": "And they shall put it and all the vessels thereof within a covering of badgers' skins, and shall put *it* upon a bar.", "11": "And upon the golden altar they shall spread a cloth of blue, and cover it with a covering of badgers' skins, and shall put to the staves", "12": "And they shall take all the instruments of ministry, wherewith they minister in the sanctuary, and put *them* in a cloth of blue, and cover them with a covering of badgers' skins, and shall put *them* on a bar:", "13": "And they shall take away the ashes from the altar, and spread a purple cloth", "14": "And they shall put upon it all the vessels thereof, wherewith they minister about it, *even* the censers, the fleshhooks, and the shovels, and the basons, all the vessels of the altar; and they shall spread upon it a covering of badgers' skins, and put to the staves", "15": "And when Aaron and his sons have made an end of covering the sanctuary, and all the vessels of the sanctuary, as the camp is to set forward; after that, the sons of Kohath shall come to bear *it*: but they shall not touch *any* holy thing, lest they die. These *things are* the burden of the sons of Kohath in the tabernacle of the congregation.", "16": "And to the office of Eleazar the son of Aaron the priest *pertaineth* the oil for the light, and the sweet incense, and the daily meat offering, and the anointing oil, *and* the oversight of all the tabernacle, and of all that therein *is*, in the sanctuary, and in the vessels", "17": "And the LORD spake unto Moses and unto Aaron, saying,", "18": "Cut ye not off the tribe of the families of the Kohathites from among the Levites:", "19": "But thus do unto them, that they may live, and not die, when they approach unto the most holy things: Aaron and his sons shall go in, and appoint them every one to his service and to his burden:", "20": "But they shall not go in to see when the holy things are covered, lest they die.", "21": "And the LORD spake unto Moses, saying,", "22": "Take also the sum of the sons of Gershon, throughout the houses of their fathers, by their families;", "23": "From thirty years old and upward until fifty years old shalt thou number them; all that enter in to perform the service, to do the work in the tabernacle of the congregation.", "24": "This *is* the service of the families of the Gershonites, to serve, and for burdens:", "25": "And they shall bear the curtains of the tabernacle, and the tabernacle of the congregation, his covering, and the covering of the badgers' skins that *is* above upon it, and the hanging for the door of the tabernacle of the congregation,", "26": "And the hangings of the court, and the hanging for the door of the gate of the court, which *is* by the tabernacle and by the altar round about, and their cords, and all the instruments of their service, and all that is made for them: so shall they serve.", "27": "At the appointment of Aaron and his sons shall be all the service of the sons of the Gershonites, in all their burdens, and in all their service: and ye shall appoint unto them in charge all their burdens.", "28": "This *is* the service of the families of the sons of Gershon in the tabernacle of the congregation: and their charge *shall be* under the hand of Ithamar the son of Aaron the priest.", "29": "As for the sons of Merari, thou shalt number them after their families, by the house of their fathers;", "30": "From thirty years old and upward even unto fifty years old shalt thou number them, every one that entereth into the service, to do the work of the tabernacle of the congregation.", "31": "And this *is* the charge of their burden, according to all their service in the tabernacle of the congregation; the boards of the tabernacle, and the bars thereof, and the pillars thereof, and sockets", "32": "And the pillars of the court round about, and their sockets, and their pins, and their cords, with all their instruments, and with all their service: and by name ye shall reckon the instruments of the charge of their burden.", "33": "This *is* the service of the families of the sons of Merari, according to all their service, in the tabernacle of the congregation, under the hand of Ithamar the son of Aaron the priest.", "34": "And Moses and Aaron and the chief of the congregation numbered the sons of the Kohathites after their families, and after the house of their fathers,", "35": "From thirty years old and upward even unto fifty years old, every one that entereth into the service, for the work in the tabernacle of the congregation:", "36": "And those that were numbered of them by their families were two thousand seven hundred and fifty.", "37": "These *were* they that were numbered of the families of the Kohathites, all that might do service in the tabernacle of the congregation, which Moses and Aaron did number according to the commandment of the LORD by the hand of Moses.", "38": "And those that were numbered of the sons of Gershon, throughout their families, and by the house of their fathers,", "39": "From thirty years old and upward even unto fifty years old, every one that entereth into the service, for the work in the tabernacle of the congregation,", "40": "Even those that were numbered of them, throughout their families, by the house of their fathers, were two thousand and six hundred and thirty.", "41": "These *are* they that were numbered of the families of the sons of Gershon, of all that might do service in the tabernacle of the congregation, whom Moses and Aaron did number according to the commandment of the LORD.", "42": "And those that were numbered of the families of the sons of Merari, throughout their families, by the house of their fathers,", "43": "From thirty years old and upward even unto fifty years old, every one that entereth into the service, for the work in the tabernacle of the congregation,", "44": "Even those that were numbered of them after their families, were three thousand and two hundred.", "45": "These *be* those that were numbered of the families of the sons of Merari, whom Moses and Aaron numbered according to the word of the LORD by the hand of Moses.", "46": "All those that were numbered of the Levites, whom Moses and Aaron and the chief of Israel numbered, after their families, and after the house of their fathers,", "47": "From thirty years old and upward even unto fifty years old, every one that came to do the service of the ministry, and the service of the burden in the tabernacle of the congregation,", "48": "Even those that were numbered of them, were eight thousand and five hundred and fourscore.", "49": "According to the commandment of the LORD they were numbered by the hand of Moses, every one according to his service, and according to his burden: thus were they numbered of him, as the LORD commanded Moses."}}, "tsk": {"3": [{"kopje": "dertig jaar", "refs": ["Num 8:24-26", "Gen 41:46", "1 Kron 23:3", "1 Kron 23:24-27", "1 Kron 28:12", "1 Kron 28:13", "Luk 3:23", gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël.", "1 Sam 2:36": "En het zal gebeuren, dat ieder die van uw huis over is, zal komen om zich voor hem neer te buigen voor een stukje geld en een bol brood, en zal zeggen: Neem mij toch aan tot een van de priesterlijke bedieningen, dat ik een stukje brood mag eten.", "Ex 29:40": "Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "Ex 40:3": "En u zult daar de ark der getuigenis neerzetten; en u zult de ark met het voorhangsel bedekken.", "Lev 16:12": "Hij zal ook een wierookvat vol vurige kolen nemen van het altaar, van voor het aangezicht van de HEERE, en zijn handen vol fijngestoten reukwerk van welriekende specerijen; en hij zal het binnen het voorhangsel dragen.", "Num 19:2": "Dit is de inzetting van de wet, die de HEERE geboden heeft: Spreek tot de kinderen van Israël, dat zij u een rode volkomen vaars brengen, waarin geen gebrek is, en waarop geen juk gekomen is.", "Jes 3:6": "Wanneer iemand zijn broeder uit het huis van zijn vader zal aangrijpen, en zegt: U hebt een kleed, wees onze leider, laat toch deze puinhoop onder uw hand wezen;", "Ex 26:31": "Daarna moet u een voorhang maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het uiterst kunstige werk zal men die maken, met cherubs.", "Ex 24:10": "En zij zagen de God van Israël, en onder Zijn voeten als een werk van saffierstenen, en als de gestalte van de hemel in Zijn klaarheid.", "2 Sam 6:13": "En het gebeurde, toen zij die de ark van de HEERE droegen, zes treden voortgegaan waren, dat hij ossen en gemest vee offerde.", "Num 20:12": "Daarom zei de HEERE tot Mozes en tot Aäron: Omdat u Mij niet geloofd hebt, door Mij te heiligen voor de ogen van de kinderen van Israël, daarom zult u deze gemeente niet brengen in het land, dat Ik hun gegeven heb.", "Num 7:9": "Maar aan de zonen van Kohath gaf hij niets; want de dienst van de heilige dingen die op hen rustte, moesten zij op de schouders dragen.", "1 Kron 15:7": "Van de nakomelingen van Gersom was Joël leider, en van zijn broeders waren er honderddertig.", "Num 3:31": "Hun wacht nu zal zijn de ark, en de tafel, en de kandelaar, en de altaren en het gereedschap van het heiligdom, waarmee zij dienst doen, en het deksel, en alles wat tot zijn dienst behoort.", "Num 4:23-49": "U zult hen tellen van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die komt om in de strijd te dienen, om de dienst te verrichten in de tent der samenkomst. Dit zal de dienst zijn van de geslachten van de Gersonieten, in het dienen en in het dragen. Zij zullen dan dragen de gordijnen van de tabernakel, en de tent der samenkomst; namelijk haar deksel, en het dassendeksel dat daar bovenop is, en het deksel van de deur van de tent der samenkomst,", "2 Kron 20:8": "Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, en zeiden:", "Ezech 1:26": "En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend.", "Ex 38:23": "En met hem Aholiab, de zoon van Ahisamach, van de stam van Dan, een werkmeester en vernuftig kunstenaar, en een borduurder in hemelsblauw, en in purper, en in scharlaken, en in fijn linnen.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Num 7:61": "Zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Num 16:6": "Doe dit: neem wierookvaten, Korach en uw hele vergadering;", "2 Kon 11:4-12": "In het zevende jaar zond Jojada, en nam de leiders van honderd met de hoofdmannen en met de lijfwacht, en hij bracht hen bij zich, in het huis van de HEERE; en hij sloot een verbond met hen en beëdigde hen in het huis van de HEERE, en hij toonde hun de zoon van de koning. En hij gebood hun en zei: Dit is de zaak die u doen zult: een derde deel van u, die op de sabbat de dienst ingaan, zal de wacht waarnemen van het huis van de koning; en een derde deel zal zijn bij de poort Sur; en een derde deel bij de poort achter de lijfwacht; zo zult u de wacht van dit huis waarnemen, tegen inbraak.", "Ex 25:5": "En roodgeverfde ramsvellen, en dassenvellen; en acaciahout;", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Lev 14:49": "Daarna zal hij, om dat huis te ontzondigen, twee vogeltjes nemen, alsook cederhout, en scharlaken, en hysop.", "Jes 25:7": "En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn.", "Ex 35:5-7": "Neemt van hetgeen dat u hebt, een hefoffer voor de HEERE; ieder wiens hart vrijwillig is, zal het brengen als hefoffer voor de HEERE: goud, en zilver, en koper; Als ook hemelsblauw, en purper, en scharlaken, en fijn linnen, en geitenhaar; En roodgeverfde ramsvellen, en dassenvellen, en acaciahout;", "Jer 10:9": "Uitgerekt zilver wordt van Tarsis gebracht, en goud van Ufaz, tot een werk van de werkmeester en van de handen van de goudsmid; hemelsblauw en purper is hun kleding, een werk van de wijzen zijn zij allemaal samen.", "Num 5:18": "Daarna zal de priester de vrouw voor het aangezicht van de HEERE stellen, en zal het hoofd van de vrouw ontbloten, en zal het spijsoffer van de gedachtenis op haar handen leggen, dat het spijsoffer van de ijveringen is; en in de hand van de priester zal dat bittere water zijn, dat de vloek meebrengt.", "Num 4:31-33": "Dit zal nu de taak zijn van hun last, naar al hun dienst, in de tent der samenkomst: de planken van de tabernakel, en zijn richels, en zijn pilaren, en zijn voeten; Alsook de pilaren van de voorhof rondom, hun voeten, en hun pennen, en hun touwen, met al hun gereedschap, en met al hun dienst; en het gereedschap van de taak van hun last zult u bij name tellen. Dit is de dienst van de geslachten van de zonen van Merari, naar hun hele dienst, in de tent der samenkomst, onder de hand van Ithamar, de zoon van Aäron, de priester.", "Ex 30:34-38": "Verder zei de HEERE tegen Mozes: Neem welriekende specerijen: mirresap, en onycha, en galbanum, deze welriekende specerijen, en zuivere wierook; dat van elk een gelijke hoeveelheid zij. En daarvan moet u een reukwerk maken, een mengsel, volgens het werk van een apotheker, dooreengemengd, rein, heilig. En daarvan moet u een deel heel fijn stoten, en daarvan moet u leggen vóór de getuigenis, in de tent van de samenkomst, waar Ik tot u komen zal; het zal voor u allerheiligst zijn.", "Jes 11:2-4": "En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen. Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "1 Kor 11:2": "En ik prijs u, broeders, dat u in alles aan mij denkt, en de inzettingen behoudt, zoals ik die u overgegeven heb.", "Lev 11:1": "En de HEERE sprak tot Mozes en tot Aäron, en zei tegen hen:", "Num 16:16-18": "Verder zei Mozes tegen Korach: U, en uw hele vergadering, wees voor het aangezicht van de HEERE; u, en zij, ook Aäron, morgen. En neem ieder zijn wierookvat, en leg reukwerk daarin, en breng het voor het aangezicht van de HEERE, ieder zijn wierookvat, tweehonderd en vijftig wierookvaten; ook u, en Aäron, ieder zijn wierookvat. Zo nam ieder zijn wierookvat, en deed vuur daarin, en legde reukwerk daarin; en zij stonden voor de deur van de tent van de samenkomst, ook Mozes en Aäron.", "Num 3:20": "En de zonen van Merari, naar hun geslachten: Maheli en Musi; dit zijn de geslachten van de Levieten, naar het huis van hun vaderen.", "Num 1:50": "Maar u, stel de Levieten aan over de tabernakel van de getuigenis, en over al zijn gereedschap, en over alles wat daarbij hoort; zij zullen de tabernakel dragen, en al zijn gereedschap; en zij zullen die verzorgen, en zij zullen zich rondom de tabernakel legeren.", "Gen 41:46": "Jozef nu was dertig jaar oud, toen hij voor Farao, de koning van Egypte, stond; en Jozef ging weg van Farao, en trok door heel Egypteland.", "Ex 28:31": "U zult ook de mantel van de efod geheel van hemelsblauw maken.", "Joz 21:6": "En aan de kinderen van Gerson, van de families van de stam van Issaschar, en van de stam van Aser, en van de stam van Nafthali, en van de halve stam van Manasse, in Bazan, bij het lot, dertien steden.", "Ps 73:17": "Totdat ik in Gods heiligdommen inging, en op hun einde lette.", "Num 4:22-28": "Neem ook de som op van de zonen van Gerson, naar het huis van hun vaderen, naar hun geslachten. U zult hen tellen van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die komt om in de strijd te dienen, om de dienst te verrichten in de tent der samenkomst. Dit zal de dienst zijn van de geslachten van de Gersonieten, in het dienen en in het dragen.", "Num 1:50-53": "Maar u, stel de Levieten aan over de tabernakel van de getuigenis, en over al zijn gereedschap, en over alles wat daarbij hoort; zij zullen de tabernakel dragen, en al zijn gereedschap; en zij zullen die verzorgen, en zij zullen zich rondom de tabernakel legeren. En als de tabernakel zal optrekken, zullen de Levieten hem afbreken; en wanneer de tabernakel neergezet moet worden, zullen de Levieten hem oprichten; en de vreemde die daarbij komt, zal gedood worden. En de kinderen van Israël zullen zich legeren, ieder bij zijn eigen leger, en ieder bij zijn eigen banier, naar hun legers.", "Num 2:33": "Maar de Levieten werden niet geteld onder de Israëlieten, zoals de HEERE Mozes geboden had.", "Ex 35:19": "De ambtsklederen om in het heilige te dienen, de heilige klederen van de priester Aäron, en de klederen van zijn zonen, om het priesterambt te bedienen.", "1 Kron 23:28-32": "Omdat hun standplaats was aan de hand van de zonen van Aäron in de dienst van het huis van de HEERE, over de voorhoven, en over de kamers, en over de reiniging van alle heilige dingen, en het werk van de dienst van het huis van God; Te weten voor het brood van de bereiding, en voor de meelbloem ten spijsoffer, en voor de ongezuurde vladen, en voor de pannen, en voor het geroosterde, en voor alle mate en afmeting; En om elke morgen te staan om de HEERE te loven en te prijzen; en evenzo 's avonds;", "Ex 30:23-33": "Neem u de beste specerijen: de zuiverste mirre, vijfhonderd sikkels, en geurige kaneel, half zoveel, namelijk tweehonderdvijftig sikkels, ook geurige kalmoes, tweehonderdvijftig sikkels; Ook kassie, vijfhonderd, naar de sikkel van het heiligdom, en olie van olijfbomen, één hin. En maak daarvan een olie van de heilige zalving, een zalf, heel kunstig gemaakt, volgens het werk van een apotheker; het zal een olie van de heilige zalving zijn.", "Ex 38:17": "De voeten van de pilaren nu waren van koper, de haken van de pilaren en hun banden waren van zilver, en het overdeksel van hun koppen was van zilver, en al de pilaren van de voorhof waren met zilver omvat.", "Ex 37:29": "Hij maakte ook de heilige zalfolie, en het reukwerk van zuivere welriekende specerijen, zoals een apotheker dat maakt.", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "1 Kron 13:9": "Toen zij bij de dorsvloer van Chidon gekomen waren, strekte Uza zijn hand uit om de ark vast te houden, want de runderen struikelden.", "Num 3:27-32": "En van Kahath is het geslacht van de Amramieten, en het geslacht van de Izharieten, en het geslacht van de Hebronieten, en het geslacht van de Uzziëlieten; dit zijn de geslachten van de Kohathieten. In getal van al wat mannelijk was, van een maand oud en daarboven, waren achtduizend zeshonderd, die de wacht van het heiligdom waarnamen. De geslachten van de zonen van Kohath zullen zich legeren aan de zijde van de tabernakel, zuidwaarts.", "Lev 21:12": "En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "Lev 13:1": "Verder sprak de HEERE tot Mozes en tot Aäron, en Hij zei:", "Num 5:15": "Dan zal die man zijn huisvrouw tot de priester brengen, en zal haar offerande voor haar meebrengen, een tiende deel van een efa gerstemeel; hij zal geen olie daarop gieten, en geen wierook daarop leggen, omdat het een spijsoffer van de ijveringen is, een spijsoffer van de gedachtenis, dat de ongerechtigheid in gedachtenis brengt.", "Ex 28:37": "En u zult die aanhechten met een hemelsblauw snoer, zo dat zij aan de hoed is; aan de voorste zijde van de hoed zal zij zijn.", "Num 26:57-62": "Dit zijn nu de getelden van Levi, naar hun geslachten: van Gerson het geslacht der Gersonieten; van Kohath het geslacht der Kohathieten; van Merari het geslacht der Merarieten. Dit zijn de geslachten van Levi: het geslacht der Libnieten, het geslacht der Hebronieten, het geslacht der Machlieten, het geslacht der Muzieten, het geslacht der Korachieten. En Kohath verwekte Amram. En de naam van de vrouw van Amram was Jochebed, de dochter van Levi, die de vrouw van Levi baarde in Egypte; en deze baarde aan Amram, Aäron, en Mozes, en Mirjam, hun zuster.", "1 Kron 23:21-23": "De kinderen van Merari waren Maheli en Musi; de kinderen van Maheli waren Eleazar en Kis. En Eleazar stierf, en hij had geen zonen, maar dochters; en de kinderen van Kis, hun broeders, namen hen tot vrouw. De kinderen van Musi waren Maheli, en Eder, en Jeremoth; drie.", "Ex 37:1-9": "Zo maakte Bezaleël de ark van acaciahout; twee en een halve el was haar lengte, anderhalve el haar breedte, en anderhalve el haar hoogte. En hij overtrok haar met zuiver goud, van binnen en van buiten; en hij maakte er een gouden krans omheen. En hij goot er vier gouden ringen voor, aan haar vier hoeken, zodat er twee ringen aan de ene zijde waren, en twee ringen aan de andere zijde.", "Jes 63:18": "Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.", "Ex 39:24": "En aan de zomen van de mantel maakten zij granaatappels van hemelsblauw, en purper, en scharlaken, getweernd.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Ef 6:10-19": "Vervolgens, mijn broeders, word krachtig in de Heere, en in de sterkte van Zijn macht. Doe de hele wapenrusting van God aan, opdat u kunt staan tegen de listige omleidingen van de duivel. Want wij hebben de strijd niet tegen vlees en bloed, maar tegen de overheden, tegen de machten, tegen de geweldhebbers van de wereld, van de duisternis van deze eeuw, tegen de geestelijke boosheden in de lucht.", "Num 31:6": "En Mozes zond hen ten strijde, duizend van elke stam, hen en Pinehas, de zoon van Eleazar, de priester, ten strijde, met de heilige voorwerpen en de trompetten om te schallen in zijn hand.", "2 Kron 2:7": "Zend mij nu daarom een wijze man, om te werken in goud, en in zilver, en in koper, en in ijzer, en in purper, en karmozijn, en hemelsblauw, en die weet graveersels te graveren, samen met de wijzen die bij mij zijn in Juda en in Jeruzalem, die mijn vader David aangesteld heeft.", "Num 3:30": "De aanvoerder nu van het vaderlijke huis van de geslachten van de Kohathieten, zal zijn Elisafan, de zoon van Uzziël.", "Lev 14:51": "Dan zal hij dat cederhout, en die hysop, en het scharlaken, en de levende vogel nemen, en zal die in het bloed van de geslachte vogel en in het levende water dopen; en hij zal dat huis zevenmaal besprengen.", "Hebr 12:18-29": "Want u bent niet gekomen tot de tastbare berg, en het brandende vuur, en donkerheid, en duisternis, en onweer, En tot het geschal van de bazuin, en de stem van de woorden; waarbij zij die het hoorden, baden dat het woord tot hen niet meer gesproken zou worden. (Want zij konden niet dragen wat er geboden werd: Zelfs als een dier de berg aanraakt, zal het gestenigd of met een pijl doorschoten worden.", "Num 3:9": "U zult dan, aan Aäron en aan zijn zonen, de Levieten geven; zij zijn gegeven, zij zijn hem gegeven, uit de kinderen van Israël.", "Num 16:9": "Is het u te weinig, dat de God van Israël u van de vergadering van Israël heeft afgescheiden, om u tot Zich te laten naderen; om de dienst van de tabernakel van de HEERE te verrichten, en te staan voor het aangezicht van de vergadering, om hen te dienen?", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "1 Kron 23:3": "En de Levieten werden geteld, van dertig jaar af en daarboven; en hun aantal was, naar hun hoofden, aan mannen, achtendertigduizend.", "2 Tim 2:3": "Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "Num 10:14": "Want als eerste trok op de banier van het leger van de kinderen van Juda, naar hun legers; en over zijn leger was Nahesson, de zoon van Amminadab.", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Ex 30:9": "U moet geen vreemd reukwerk daarop aansteken, ook geen brandoffer, geen spijsoffer; u moet er ook geen drankoffer op gieten.", "Ex 6:15": "Dit nu zijn de namen van de zonen van Levi, naar hun geboorten: Gerson, en Kehath, en Merari. En de jaren van het leven van Levi waren honderdzevenendertig jaren.", "Lev 14:4": "zal de priester gebieden dat men voor hem die te reinigen is twee levende reine vogels neemt, alsook cederhout, en scharlaken, en hysop.", "Ex 35:7": "En roodgeverfde ramsvellen, en dassenvellen, en acaciahout;", "Num 7:5-7": "Neem ze van hen aan, opdat zij zijn om de dienst van de tent van de samenkomst te verrichten; en u zult ze aan de Levieten geven, ieder naar zijn dienst. Zo nam Mozes die wagens en die runderen, en gaf ze aan de Levieten. Twee wagens en vier runderen gaf hij aan de zonen van Gerson, naar hun dienst;", "Num 3:8": "En dat zij al het gereedschap van de tent der samenkomst, en de wacht van de kinderen van Israël waarnemen, om de dienst van de tabernakel te bedienen.", "Num 10:21": "Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.", "1 Kron 15:2": "Toen zei David: Niemand mag de ark van God dragen, dan de Levieten; want die heeft de HEERE uitgekozen, om de ark van God te dragen, en om Hem te dienen tot in eeuwigheid.", "Num 15:3-16": "En u de HEERE een vuuroffer zult doen, een brandoffer of slachtoffer, om een gelofte af te zonderen, of in een vrijwillig offer, of op uw vastgestelde hoogtijden, om de HEERE een liefelijke reuk te maken, van runderen of van klein vee; Zo zal hij, die zijn offerande de HEERE offert, een spijsoffer offeren van een tiende meelbloem, gemengd met een vierendeel van een hin olie. En wijn ten drankoffer, een vierendeel van een hin, zult u bereiden tot een brandoffer of tot een slachtoffer, voor één lam.", "Ex 25:29": "U zult ook maken haar schotels, en haar rookschalen, en haar kannen, en haar kroezen (waarmee zij bedekt zal worden); van zuiver goud zult u ze maken.", "Num 7:49": "Zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "1 Kron 6:19": "De kinderen van Merari waren Maheli en Musi. En dit zijn de families van de Levieten, naar hun vaderen.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Num 3:32": "De aanvoerder nu van de aanvoerders van Levi zal zijn Eleazar, de zoon van Aäron, de priester; zijn opzicht zal zijn over degenen, die de wacht van het heiligdom waarnemen.", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Ex 39:1-5": "Zij maakten ook ambtsklederen, om in het heilige te dienen, van hemelsblauw, en purper, en scharlaken; ook maakten zij de heilige klederen, die voor Aäron waren, zoals de HEERE aan Mozes geboden had. Zo maakte hij de efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen. En zij rekten de dunne platen van goud uit, en sneden het tot draden, om te verwerken in het midden van het hemelsblauw, en in het midden van het purper, en in het midden van het scharlaken, en in het midden van het fijn linnen, uiterst kunstig werk.", "Ex 35:25": "En alle vrouwen die wijs van hart waren, sponnen met hun handen, en zij brachten het gesponnene, het hemelsblauwe garen, en het purper, het scharlaken, en het fijn linnen.", "1 Kron 28:13": "en van de afdelingen van de priesters en de Levieten, en van al het werk van de dienst van het huis van de HEERE, en van alle voorwerpen van de dienst van het huis van de HEERE.", "1 Kron 23:27": "Want naar de laatste woorden van David werden de kinderen van Levi geteld, van twintig jaar oud en daarboven;", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Lev 14:6": "Die levende vogel zal hij nemen, en het cederhout, en het scharlaken, en de hysop; en zal die, en de levende vogel, dopen in het bloed van de vogel die boven het levende water geslacht is.", "2 Kron 30:8": "Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Num 4:18-20": "U zult de stam van de geslachten van de Kohathieten niet laten uitroeien uit het midden van de Levieten; Maar dit zult u voor hen doen, opdat zij leven en niet sterven, wanneer zij tot het allerheiligste naderen: Aäron en zijn zonen zullen komen, en hen ieder aanstellen over zijn dienst en zijn last. Maar zij zullen niet binnenkomen om te kijken wanneer men het heiligdom inpakt, opdat zij niet sterven.", "Num 2:17": "Daarna zal de tent van de samenkomst optrekken, met het leger van de Levieten, in het midden van de legers; zoals zij zich legeren zullen, zo zullen zij optrekken, ieder op zijn plaats, naar hun banieren.", "Num 18:9": "Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn.", "Num 1:54": "Zo deden de kinderen van Israël; naar alles wat de HEERE Mozes geboden had, zo deden zij.", "Ex 35:28": "En specerijen en olie, voor de luchter en voor de zalfolie, en welriekende specerijen voor het roken.", "Openb 8:3": "En er kwam een andere engel, en hij stond aan het altaar met een gouden wierookvat; en hem werd veel van het reukwerk gegeven, opdat hij dat met de gebeden van alle heiligen zou leggen op het gouden altaar dat voor de troon is.", "2 Kor 10:4": "Want de wapens van onze strijd zijn niet vleselijk, maar krachtig door God, tot het neerwerpen van bolwerken;", "2 Kor 6:7": "in het woord van de waarheid, in de kracht van God, door de wapens van de gerechtigheid aan de rechter- en aan de linkerzijde;", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "Hebr 9:19-23": "Want toen alle geboden, naar de wet van Mozes, aan heel het volk uitgesproken waren, nam hij het bloed van kalveren en bokken, met water, en purperen wol, en hysop, en besprenkelde zowel het boek zelf, als heel het volk, en zei: Dit is het bloed van het testament, dat God u geboden heeft. En hij besprenkelde eveneens ook de tabernakel, en alle voorwerpen van de dienst met het bloed.", "Ex 26:15": "U moet ook voor de tabernakel rechtopstaande planken maken, van acaciahout.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Rom 12:4-8": "Want zoals wij in één lichaam veel leden hebben, en de leden niet allemaal dezelfde functie hebben, zo zijn wij, hoewel velen, één lichaam in Christus, maar ieder afzonderlijk zijn wij elkaars leden. Wij hebben nu verschillende gaven, naar de genade die ons gegeven is:", "Ex 38:1-7": "Hij maakte ook het brandofferaltaar van acaciahout; vijf ellen was de lengte ervan, en vijf ellen zijn breedte, vierkant, en drie ellen zijn hoogte. En hij maakte de hoornen ervan op de vier hoeken; uit hetzelfde hout waren zijn hoornen; en hij overtrok het met koper. Hij maakte ook al het gereedschap van het altaar, de potten, en de schoffels, en de sprengbekkens, en de krauwels, en de koolpannen; al zijn voorwerpen maakte hij van koper.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "Ex 19:12": "En bepaal de grens voor het volk rondom, en zeg: Wacht ervoor de berg te beklimmen en de rand ervan aan te raken; al wie de berg aanraakt, zal zeker gedood worden.", "Num 3:21-37": "Van Gerson was het geslacht van de Libnieten, en het geslacht van de Simeïeten; dit zijn de geslachten van de Gersonieten. Hun getelden in getal waren van al wat mannelijk was, van een maand oud en daarboven; hun getelden waren zevenduizend vijfhonderd. De geslachten van de Gersonieten zullen zich legeren achter de tabernakel, westwaarts.", "2 Kron 29:21": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren.", "Ex 40:29": "En hij zette het altaar van het brandoffer bij de deur van de tabernakel, van de tent der samenkomst; en hij offerde daarop brandoffer en spijsoffer, zoals de HEERE aan Mozes geboden had.", "Joz 4:10": "De priesters nu, die de ark droegen, stonden midden in de Jordaan, totdat alles volbracht was wat de HEERE Jozua geboden had het volk aan te zeggen, naar alles wat Mozes Jozua geboden had. En het volk haastte zich, en trok over.", "Num 8:19": "En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.", "Ex 25:30": "En u zult op deze tafel altijd het toonbrood voor Mijn aangezicht leggen.", "Ex 37:23": "En hij maakte er zeven lampen bij; zijn snuiters en zijn bakjes waren van zuiver goud.", "1 Kron 23:5": "En vierduizend poortwachters, en vierduizend lofzangers van de HEERE, met instrumenten die ik gemaakt heb, zei David, om lof te zingen.", "Ex 39:31": "En zij bevestigden een snoer van hemelsblauw daaraan, om het van boven aan de hoed te bevestigen, zoals de HEERE aan Mozes geboden had.", "2 Kron 2:14": "de zoon van een vrouw uit de dochters van Dan, en wiens vader een man van Tyrus geweest is, die weet te werken in goud, en in zilver, in koper, in ijzer, in stenen, en in hout, in purper, in hemelsblauw, en in fijn linnen, en in karmozijn, en om alle graveersels te graveren, en om elke vernuftige vinding te bedenken die hem voorgelegd zal worden, samen met uw wijzen, en de wijzen van mijn heer, uw vader David.", "Lev 14:52": "Zo zal hij dat huis ontzondigen met het bloed van de vogel, en met dat levende water, en met de levende vogel, en met dat cederhout, en met de hysop, en met het scharlaken.", "1 Sam 2:13": "Want de gewoonte van deze priesters met het volk was, dat wanneer iemand een offer offerde, de jongen van de priester kwam, terwijl het vlees kookte, met een drietandige vork in zijn hand;", "1 Kron 6:30": "Zijn zoon Simea; zijn zoon Haggija; zijn zoon Asaja.", "Ezech 48:8": "Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn.", "Ex 36:35": "Daarna maakte hij een voorhang van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het uiterst kunstige werk maakte hij die, met cherubs.", "Hebr 9:3": "maar achter het tweede voorhangsel was de tabernakel, genoemd het heilige der heiligen;", "Ex 25:3-5": "Dit nu is het hefoffer, dat u van hen nemen zult: goud, zilver en koper; En hemelsblauw, purper, scharlaken, fijn linnen, en geitenhaar. En roodgeverfde ramsvellen, en dassenvellen; en acaciahout;", "2 Kron 5:9": "Daarna schoven zij de draagstokken verder uit, zodat de uiteinden van de draagstokken gezien werden vanuit de ark, vóór het binnenste heiligdom, maar buiten werden ze niet gezien; en zij was daar tot op deze dag.", "Ps 110:1-7": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Num 7:43": "Zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "1 Kron 6:43": "De zoon van Jahath, de zoon van Gerson, de zoon van Levi.", "Num 4:23-26": "U zult hen tellen van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die komt om in de strijd te dienen, om de dienst te verrichten in de tent der samenkomst. Dit zal de dienst zijn van de geslachten van de Gersonieten, in het dienen en in het dragen. Zij zullen dan dragen de gordijnen van de tabernakel, en de tent der samenkomst; namelijk haar deksel, en het dassendeksel dat daar bovenop is, en het deksel van de deur van de tent der samenkomst,", "Num 19:20": "Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.", "1 Kron 23:24": "Dit zijn de kinderen van Levi, naar het huis van hun vaderen, de hoofden van de vaderen, naar hun telling in het getal van de namen naar hun hoofden, die het werk deden van de dienst van het huis van de HEERE, van twintig jaar oud en daarboven.", "2 Kron 3:14": "Hij maakte ook het voorhangsel van hemelsblauw, en purper, en karmozijn, en fijn linnen; en hij bracht cherubs daarop aan.", "Ex 6:16": "De zonen van Gerson: Libni en Simeï, naar hun huisgezinnen.", "Openb 11:19": "En de tempel van God in de hemel is geopend, en de ark van het verbond is gezien in Zijn tempel; en er kwamen bliksems, en stemmen, en donderslagen, en aardbeving, en grote hagel.", "Ex 25:4": "En hemelsblauw, purper, scharlaken, fijn linnen, en geitenhaar.", "1 Tim 6:12": "Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "1 Kon 8:8": "Daarna schoven zij de draagstokken verder naar buiten, zodat de uiteinden van de draagstokken gezien werden vanuit het heiligdom, vóór het binnenste heiligdom, maar buiten werden zij niet gezien; en zij zijn daar tot op deze dag.", "1 Kon 7:49": "En de kandelaars, vijf aan de rechterkant, en vijf aan de linkerkant, voor het binnenste heiligdom, van zuiver goud; en de bloemen, de lampen, en de snuiters van goud;", "Ex 25:8": "En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.", "1 Kor 4:1": "Zo houdt men ons voor, ieder mens: als dienaars van Christus, en uitdelers van de verborgenheden van God.", "1 Kron 6:62": "En de kinderen van Gerson, naar hun families, hadden van de stam van Issaschar, en van de stam van Aser, en van de stam van Nafthali, en van de stam van Manasse in Basan, dertien steden.", "Num 10:17": "Toen werd de tabernakel afgenomen, en de zonen van Gerson en de zonen van Merari trokken op, dragend de tabernakel.", "Num 16:46": "En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen.", "Ex 37:10-16": "Hij maakte ook een tafel van acaciahout; twee el was haar lengte, een el haar breedte, en anderhalve el haar hoogte. En hij overtrok haar met zuiver goud, en hij maakte er een gouden krans omheen. Hij maakte er ook een lijst omheen, een hand breed; en hij maakte een gouden krans rondom die lijst.", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "2 Sam 6:2-9": "En David maakte zich op en ging heen met al het volk dat bij hem was, van Baälim-juda, om vandaar de ark van God op te brengen, bij wie de Naam wordt aangeroepen, de Naam van de HEERE van de heerscharen, Die daarop woont tussen de cherubs. En zij zetten de ark van God op een nieuwe wagen, en haalden die uit het huis van Abinadab, dat op een heuvel is; en Uza en Ahio, zonen van Abinadab, leidden de nieuwe wagen. Toen zij hem nu uit het huis van Abinadab, dat op de heuvel is, met de ark van God, wegvoerden, ging Ahio voor de ark uit.", "Lev 24:5-8": "U zult ook meelbloem nemen en er twaalf koeken van bakken; van twee tienden zal één koek zijn. En u zult ze in twee rijen leggen, zes in een rij, op de reine tafel, voor het aangezicht van de HEERE. En op elke rij zult u zuivere wierook leggen, die het brood tot een gedenkoffer zal zijn; het is een vuuroffer voor de HEERE.", "Ex 37:16": "En hij maakte het gereedschap dat op de tafel moest staan: haar schotels, haar reukschalen, haar kroezen, en haar kannen (waarmee zij overgoten zou worden), van zuiver goud.", "2 Kron 26:18": "En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Jes 49:1-8": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld. En Hij heeft Mijn mond gemaakt als een scherp zwaard, onder de schaduw van Zijn hand heeft Hij Mij bedekt; en Hij heeft Mij tot een gezuiverde pijl gesteld, in Zijn pijlkoker heeft Hij Mij verborgen. En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.", "Ps 74:7": "Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.", "Ex 29:39-41": "Het ene lam zult u 's morgens bereiden; maar het andere lam zult u bereiden tussen de twee avonden. Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam. Het andere lam nu zult u bereiden tussen de twee avonden; u zult daarmee doen gelijk met het morgenspijsoffer, en gelijk met het drankoffer daarvan, tot een liefelijke reuk; het is een vuuroffer voor de HEERE.", "Lev 10:2": "Toen ging er een vuur uit van het aangezicht van de HEERE, en verteerde hen; en zij stierven voor het aangezicht van de HEERE.", "Num 7:55": "Zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "Num 3:18-26": "En dit zijn de namen van de zonen van Gerson, naar hun geslachten: Libni en Simeï. En de zonen van Kahath, naar hun geslachten: Amram en Izhar, Hebron en Uzziël. En de zonen van Merari, naar hun geslachten: Maheli en Musi; dit zijn de geslachten van de Levieten, naar het huis van hun vaderen.", "Num 3:7": "En dat zij zijn wacht waarnemen, en de wacht van de hele vergadering, voor de tent der samenkomst, om de dienst van de tabernakel te bedienen;", "Ex 39:2": "Zo maakte hij de efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen.", "Ex 27:16": "In de poort van de voorhof nu zal een gordijn zijn van twintig el, hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, geborduurd werk; de pilaren vier, en hun voeten vier.", "Lev 23:13": "en zijn spijsoffer twee tienden meelbloem, met olie gemengd, tot een vuuroffer, voor de HEERE tot een liefelijke reuk; en zijn drankoffer van wijn, het vierde deel van een hin.", "Ex 28:15": "U zult ook een borstlap van het gericht maken, van het uiterst kunstige werk, gelijk het werk van de efod zult u hem maken; van goud, hemelsblauw, en purper, en scharlaken, en van fijn getweernd linnen zult u hem maken.", "Num 7:31": "Zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Ex 39:21": "En zij bonden het borstlap met zijn ringen aan de ringen van de efod, met een hemelsblauw snoer, dat op de kunstige riem van de efod was; opdat het borstlap van de efod niet losraakte, zoals de HEERE aan Mozes geboden had.", "Joz 3:6": "Zo sprak Jozua ook tot de priesters: Neem de ark van het verbond op, en ga voor het volk uit. Zij namen dan de ark van het verbond op, en zij gingen voor het volk uit.", "Num 5:25": "En de priester zal uit de hand van die vrouw het spijsoffer van de ijveringen nemen, en hij zal dat spijsoffer voor het aangezicht van de HEERE bewegen, en zal dat op het altaar offeren.", "Lev 5:12": "En hij zal het naar de priester brengen, en de priester zal daarvan een handvol nemen, als gedenkdeel daarvan, en dat op het altaar aansteken, boven op de vuuroffers van de HEERE; het is een zondoffer.", "2 Kor 10:3-5": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees; Want de wapens van onze strijd zijn niet vleselijk, maar krachtig door God, tot het neerwerpen van bolwerken; Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "1 Kon 8:7": "Want de cherubs spreidden hun beide vleugels uit over de plaats van de ark; en de cherubs overdekten de ark en haar draagstokken van boven.", "Lev 10:8": "En de HEERE sprak tegen Aäron:", "Num 4:5-33": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken. En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen. Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "Ex 28:33": "En aan de zomen daarvan zult u granaatappels maken van hemelsblauw, en van purper, en van scharlaken, aan zijn zomen rondom, en gouden schelletjes rondom daartussen.", "Neh 10:39": "Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "Num 3:6-9": "Laat de stam van Levi naderen, en stel hem voor het aangezicht van de priester Aäron, opdat zij hem dienen; En dat zij zijn wacht waarnemen, en de wacht van de hele vergadering, voor de tent der samenkomst, om de dienst van de tabernakel te bedienen; En dat zij al het gereedschap van de tent der samenkomst, en de wacht van de kinderen van Israël waarnemen, om de dienst van de tabernakel te bedienen.", "Ps 150:1": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte!", "Num 3:28": "In getal van al wat mannelijk was, van een maand oud en daarboven, waren achtduizend zeshonderd, die de wacht van het heiligdom waarnamen.", "Ex 26:1": "U moet de tabernakel maken van tien gordijnen, van fijn getweernd linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk moet u ze maken.", "Num 18:3-6": "En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u. Maar zij zullen u bijgevoegd worden, en de wacht van de tent der samenkomst waarnemen, in alle dienst van de tent; en een vreemde zal u niet naderen. U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Num 1:51": "En als de tabernakel zal optrekken, zullen de Levieten hem afbreken; en wanneer de tabernakel neergezet moet worden, zullen de Levieten hem oprichten; en de vreemde die daarbij komt, zal gedood worden.", "Rom 12:6-8": "Wij hebben nu verschillende gaven, naar de genade die ons gegeven is: laten wij die gaven inzetten: hetzij profetie, naar de mate van het geloof; hetzij dienstbetoon, in het dienen; hetzij wie onderwijst, in het onderwijzen; hetzij wie vermaant, in het vermanen; wie uitdeelt, in eenvoud; wie leiding geeft, met ijver; wie barmhartigheid bewijst, met blijmoedigheid.", "Num 28:12": "En drie tienden meelbloem als spijsoffer, met olie gemengd bij de ene stier; en twee tienden meelbloem als spijsoffer, met olie gemengd, bij de ene ram;", "1 Kron 6:16": "Zo zijn dan de kinderen van Levi: Gerson, Kahath en Merari.", "Num 4:2-15": "Neem de som op van de zonen van Kohath, uit het midden van de zonen van Levi, naar hun geslachten, naar het huis van hun vaderen. Van dertig jaar oud en ouder, tot vijftig jaar oud; ieder die in deze strijd komt om het werk in de tent der samenkomst te doen. Dit zal de dienst zijn van de zonen van Kohath, in de tent der samenkomst: namelijk het allerheiligste.", "1 Sam 2:14": "En sloeg die in de teil, of in de ketel, of in de pan, of in de pot; al wat de vork optrok, dat nam de priester voor zich. Zo deden zij aan alle Israëlieten die in Silo kwamen.", "Ex 25:23-30": "U zult ook een tafel maken van acaciahout; twee el zal haar lengte zijn, en een el haar breedte, en een el en een halve zal haar hoogte zijn. En u zult ze met zuiver goud overtrekken; u zult daaraan ook een gouden krans maken, rondom. U zult ook een lijst rondom daaraan maken, een hand breed; en u zult een gouden krans rondom die lijst maken.", "Ex 36:19": "Ook maakte hij voor de tent een dekkleed van roodgeverfde ramsvellen, en daarover een dekkleed van dassenvellen.", "Hebr 9:1": "Zo had dan het eerste verbond wel regels van de eredienst, en het aardse heiligdom.", "Ex 40:21": "En hij bracht de ark in de tabernakel, en hij hing het voorhangsel op als bedekking, en bedekte de ark der getuigenis, zoals de HEERE aan Mozes geboden had.", "Num 7:25": "Zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Lev 15:1": "Verder sprak de HEERE tot Mozes en tot Aäron, en zei:", "1 Kron 6:1": "De kinderen van Levi waren Gerson, Kahath en Merari.", "Lev 24:2": "Gebied de Israëlieten dat zij zuivere, gestoten olijfolie naar u toe brengen, voor de lamp, om de lampen voortdurend te laten branden.", "Num 4:17-49": "En de HEERE sprak tot Mozes en tot Aäron: U zult de stam van de geslachten van de Kohathieten niet laten uitroeien uit het midden van de Levieten; Maar dit zult u voor hen doen, opdat zij leven en niet sterven, wanneer zij tot het allerheiligste naderen: Aäron en zijn zonen zullen komen, en hen ieder aanstellen over zijn dienst en zijn last.", "1 Tim 2:5": "Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "1 Tim 1:18": "Dit gebod beveel ik u, mijn zoon Timotheüs, dat u naar de profetieën die eerder over u uitgesproken zijn, daarmee de goede strijd strijdt;", "1 Kron 15:15": "En de nakomelingen van de Levieten droegen de ark van God op hun schouders, met de draagbomen die erop waren, zoals Mozes geboden had naar het woord van de HEERE.", "Rom 7:14-24": "Want wij weten dat de wet geestelijk is, maar ik ben vleselijk, verkocht onder de zonde. Want wat ik doe, dat begrijp ik niet; want wat ik wil, dat doe ik niet, maar wat ik haat, dat doe ik. En als ik doe wat ik niet wil, dan stem ik ermee in dat de wet goed is.", "Ex 27:9": "U moet ook de voorhof van de tabernakel maken; aan de zuidkant, zuidwaarts, moeten aan de voorhof behangsels zijn van fijn getweernd linnen; de lengte van één zijde zal honderd el zijn.", "Num 3:25": "En de wacht van de zonen van Gerson in de tent der samenkomst zal zijn de tabernakel en de tent, haar deksel, en het deksel aan de deur van de tent der samenkomst;", "2 Tim 2:4": "Niemand die als soldaat dient, wikkelt zich in de zaken van het dagelijks leven, opdat hij hem kan behagen die hem tot soldaat heeft aangenomen.", "Lev 9:17": "En hij liet het spijsoffer toebrengen, en vulde daarvan zijn hand, en stak het aan op het altaar, behalve het morgenbrandoffer.", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Num 19:5": "Vervolgens zal men deze vaars voor zijn ogen verbranden; haar vel, en haar vlees, en haar bloed, met haar mest, zal men verbranden.", "Ex 25:38": "Zijn snuiters en zijn blusvaten zullen van zuiver goud zijn.", "Num 7:19": "Hij bracht zijn offergave: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Num 2:1": "En de HEERE sprak tot Mozes en tot Aäron:", "1 Kron 28:12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "1 Kron 28:10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "Gal 5:24": "Maar wie van Christus zijn, hebben het vlees gekruisigd met zijn hartstochten en begeerten.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Jes 42:1-7": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Num 18:5": "U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Num 7:13": "En zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Ex 36:8": "Zo maakte ieder wijze van hart, onder degenen die het werk maakten, de tabernakel van tien gordijnen, van getweernd fijn linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk maakte hij ze.", "Num 3:26": "En de behangsels van de voorhof, en het deksel van de deur van de voorhof, die bij de tabernakel en bij het altaar rondom zijn; alsook de touwen, voor zijn hele dienst.", "Num 29:4": "En een tiende voor een lam, tot al die zeven lammeren toe;", "Ex 35:18": "De pinnen van de tabernakel, en de pinnen van de voorhof, met de bijbehorende touwen;", "1 Kron 24:5": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "Num 3:36": "En het opzicht van de wachten van de zonen van Merari zal zijn over de planken van de tabernakel, en zijn richels, en zijn pilaren, en zijn voeten, en al zijn gereedschap, en alles wat tot zijn dienst behoort;", "1 Kron 6:29": "De kinderen van Merari waren Maheli; zijn zoon Libni; zijn zoon Simeï; zijn zoon Uzza;", "Ex 27:20": "U nu moet de kinderen van Israël gebieden, dat zij tot u brengen zuivere olie van olijven, gestoten voor het licht, zodat men voortdurend de lampen aansteekt.", "Num 8:23-26": "En de HEERE sprak tot Mozes en zei: Dit is het wat de Levieten aangaat: van vijfentwintig jaar oud en daarboven, zullen zij binnengaan om de strijd te strijden, in de dienst van de tent van de samenkomst. Maar vanaf dat hij vijftig jaar oud is, zal hij van de strijd van deze dienst afgaan, en hij zal niet meer dienen.", "Ex 26:36": "U moet ook voor de deur van de tent een deksel maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, geborduurd werk.", "Dan 9:17": "En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf.", "Ps 63:3": "Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;", "Lev 23:17": "U zult uit uw woningen twee beweegbroden brengen, zij zullen van twee tienden meelbloem zijn, gedesemd zullen zij gebakken worden; het zijn de eerstelingen voor de HEERE.", "1 Kron 9:30": "En uit de zonen van de priesters waren van het bereider van het reukwerk van de specerijen.", "1 Sam 6:19": "En de Heere sloeg onder de mensen van Beth-Semes, omdat zij in de ark van de HEERE gekeken hadden; ja, Hij sloeg van het volk zeventig mannen, en vijftigduizend mannen. Toen bedreef het volk rouw, omdat de HEERE een grote slag onder het volk geslagen had.", "Num 3:51": "En Mozes gaf dat geld van de gelosten aan Aäron en aan zijn zonen, naar het bevel van de HEERE, zoals de HEERE Mozes geboden had.", "2 Sam 15:24": "En zie, Zadok was ook daar, en alle Levieten met hem, die de ark van het verbond van God droegen; en zij zetten de ark van God neer, en Abjathar klom op, totdat heel het volk uit de stad klaar was met overgaan.", "Hebr 10:19": "Omdat wij dan, broeders, vrijmoedigheid hebben om in te gaan in het heiligdom door het bloed van Jezus,", "Num 3:17-26": "Dit nu waren de zonen van Levi met hun namen: Gerson, en Kahath, en Merari. En dit zijn de namen van de zonen van Gerson, naar hun geslachten: Libni en Simeï. En de zonen van Kahath, naar hun geslachten: Amram en Izhar, Hebron en Uzziël.", "Dan 11:31": "En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Num 3:37": "En de pilaren van de voorhof rondom, en hun voeten, en hun pennen, en hun touwen.", "2 Tim 4:7": "Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden;", "Ex 26:14": "U moet ook voor de tent een dekkleed maken van roodgeverfde ramsvellen, en daarover een dekkleed van dassenvellen.", "Ex 12:1": "De HEERE nu had tot Mozes en tot Aäron in Egypteland gesproken en gezegd:", "Num 4:5-15": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken. En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen. Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "2 Kron 4:19": "Ook maakte Salomo alle voorwerpen die voor het huis van God waren, en het gouden altaar, en de tafels waarop de toonbroden liggen;", "Num 15:24": "Dan zal het gebeuren, indien iets bij dwaling gedaan is, en voor de ogen van de vergadering verborgen is, dat de hele vergadering een var, een jong rund, zal bereiden tot brandoffer, tot een liefelijke reuk voor de HEERE, met zijn spijsoffer en zijn drankoffer, naar de gebruikelijke wijze; en een geitenbok tot zondoffer.", "Ex 29:41": "Het andere lam nu zult u bereiden tussen de twee avonden; u zult daarmee doen gelijk met het morgenspijsoffer, en gelijk met het drankoffer daarvan, tot een liefelijke reuk; het is een vuuroffer voor de HEERE.", "Num 28:5": "En een tiende deel van een efa meelbloem als spijsoffer, gemengd met het vierendeel van een hin gestoten olie.", "1 Petr 5:2": "Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed;", "1 Kor 9:7": "Wie dient ooit in de krijgsdienst op eigen kosten? Wie plant een wijngaard, en eet niet van zijn vrucht? Of wie hoedt een kudde, en eet niet van de melk van de kudde?", "1 Kor 12:4-31": "En er is verscheiden
