heiligste.","5":"Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken.","6":"En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen.","7":"Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.","8":"Daarna zullen zij een scharlaken kleed daarover uitspreiden, en dat met een deksel van dassenvellen bedekken; en zij zullen de bijbehorende handbomen aanleggen.","9":"Dan zullen zij een kleed van hemelsblauw nemen, en de kandelaar van het licht bedekken, en zijn lampen, en zijn snuiters, en zijn blusvaten, en al zijn olievaten, waarmee zij daaraan dienen.","10":"Zij zullen ook die, en al zijn gereedschap, in een deksel van dassenvellen doen, en zullen hem op de draagboom leggen.","11":"En over het gouden altaar zullen zij een kleed van hemelsblauw uitspreiden, en dat met een deksel van dassenvellen bedekken; en zij zullen de bijbehorende handbomen aanleggen.","12":"Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.","13":"En zij zullen de as van het altaar vegen, en zij zullen daarover een kleed van purper uitspreiden.","14":"En zij zullen daarop leggen al zijn gereedschap, waarmee zij daaraan dienen, de koolpannen, de krauwels, en de schoffels, en de sprenkelschalen*, al het gereedschap van het altaar; en zij zullen daarover een deksel van dassenvellen uitspreiden, en zullen de bijbehorende handbomen aanleggen.","15":"Als Aäron en zijn zonen het dekken van het heiligdom, en van al het gereedschap van het heiligdom, bij het optrekken van het leger, voltooid hebben, dan zullen daarna de zonen van Kohath komen om te dragen; maar zij zullen dat heilige niet aanraken, opdat zij niet sterven. Dit is de last van de zonen van Kohath, in de tent der samenkomst.","16":"Het toezicht nu van Eleazar, de zoon van Aäron, de priester, zal zijn over de olie van het licht, en het reukwerk van de welriekende specerijen, en het gedurige spijsoffer, en de zalfolie; het toezicht over de hele tabernakel, en alles wat daarin is, over het heiligdom en zijn gereedschap.","17":"En de HEERE sprak tot Mozes en tot Aäron:","18":"U zult de stam van de geslachten van de Kohathieten niet laten uitroeien uit het midden van de Levieten;","19":"Maar dit zult u voor hen doen, opdat zij leven en niet sterven, wanneer zij tot het allerheiligste naderen: Aäron en zijn zonen zullen komen, en hen ieder aanstellen over zijn dienst en zijn last.","20":"Maar zij zullen niet binnenkomen om te kijken wanneer men het heiligdom inpakt, opdat zij niet sterven.","21":"En de HEERE sprak tot Mozes:","22":"Neem ook de som op van de zonen van Gerson, naar het huis van hun vaderen, naar hun geslachten.","23":"U zult hen tellen van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die komt om in de strijd te dienen, om de dienst te verrichten in de tent der samenkomst.","24":"Dit zal de dienst zijn van de geslachten van de Gersonieten, in het dienen en in het dragen.","25":"Zij zullen dan dragen de gordijnen van de tabernakel, en de tent der samenkomst; namelijk haar deksel, en het dassendeksel dat daar bovenop is, en het deksel van de deur van de tent der samenkomst,","26":"En de behangsels van de voorhof, en het deksel van de deur van de poort van de voorhof, dat bij de tabernakel en bij het altaar rondom is; en hun touwen, en al het gereedschap van hun dienst, alsook alles wat daarvoor gemaakt wordt, opdat zij dienen.","27":"De hele dienst van de zonen van de Gersonieten, in al hun last, en in al hun dienst, zal zijn naar het bevel van Aäron en van zijn zonen; en u zult hun ter bewaring al hun last opdragen.","28":"Dit is de dienst van de geslachten van de zonen van de Gersonieten, in de tent der samenkomst; en hun taak zal zijn onder de hand van Ithamar, de zoon van Aäron, de priester.","29":"Wat de zonen van Merari betreft, die zult u naar hun geslachten, en naar het huis van hun vaderen tellen.","30":"U zult hen tellen van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die komt tot deze strijd, om de dienst van de tent der samenkomst te verrichten.","31":"Dit zal nu de taak zijn van hun last, naar al hun dienst, in de tent der samenkomst: de planken van de tabernakel, en zijn richels, en zijn pilaren, en zijn voeten;","32":"Alsook de pilaren van de voorhof rondom, hun voeten, en hun pennen, en hun touwen, met al hun gereedschap, en met al hun dienst; en het gereedschap van de taak van hun last zult u bij name tellen.","33":"Dit is de dienst van de geslachten van de zonen van Merari, naar hun hele dienst, in de tent der samenkomst, onder de hand van Ithamar, de zoon van Aäron, de priester.","34":"Mozes dan en Aäron, en de leiders van de vergadering telden de zonen van de Kohathieten, naar hun geslachten, en naar het huis van hun vaderen:","35":"Van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die kwam tot deze strijd, tot de dienst in de tent der samenkomst;","36":"Hun getelden nu waren, naar hun geslachten, tweeduizend zevenhonderdvijftig.","37":"Dit zijn de getelden van de geslachten van de Kohathieten, van allen die in de tent der samenkomst dienden, die Mozes en Aäron geteld hebben, naar het bevel van de HEERE, door de hand van Mozes.","38":"Evenzo de getelden van de zonen van Gerson, naar hun geslachten, en naar het huis van hun vaderen;","39":"Van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die kwam tot deze strijd, tot de dienst in de tent der samenkomst;","40":"Hun getelden waren, naar hun geslachten, naar het huis van hun vaderen, tweeduizend zeshonderddertig.","41":"Dezen zijn de getelden van de geslachten van de zonen van Gerson, van allen die in de tent der samenkomst dienden, die Mozes en Aäron telden, naar het bevel van de HEERE.","42":"En de getelden van de geslachten van de zonen van Merari, naar hun geslachten, naar het huis van hun vaderen,","43":"Van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die kwam tot deze strijd, tot de dienst in de tent der samenkomst;","44":"Hun getelden nu waren, naar hun geslachten, drieduizend tweehonderd.","45":"Dezen zijn de getelden van de geslachten van de zonen van Merari, die Mozes en Aäron geteld hebben, naar het bevel van de HEERE, door de hand van Mozes.","46":"Alle getelden, die Mozes en Aäron, en de leiders van Israël geteld hebben van de Levieten, naar hun geslachten, en naar het huis van hun vaderen,","47":"Van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die kwam om de dienst van de bediening en de dienst van de last, in de tent der samenkomst, te verrichten;","48":"Hun getelden waren achtduizend vijfhonderdtachtig.","49":"Men telde hen, naar het bevel van de HEERE, door de hand van Mozes, ieder naar zijn dienst, en naar zijn last; en zijn getelden waren zoals de HEERE Mozes geboden had."},"SV":{"1":"En de HEERE sprak tot Mozes en tot Aäron, zeggende:","2":"Neemt op de som der zonen van Kohath, uit het midden der zonen van Levi, naar hun geslachten, naar het huis hunner vaderen.","3":"Van dertig jaren oud en daarboven, tot vijftig jaren oud; al wie tot dezen strijd inkomt, om het werk in de tent der samenkomst te doen.","4":"Dit zal de dienst zijn der zonen van Kohath, in de tent der samenkomst, *te* *weten* de heiligheid der heiligheden.","5":"In het optrekken des legers, zo zullen Aäron en zijn zonen komen, en den voorhang des deksels afnemen, en zullen daarmede de ark der getuigenis bedekken.","6":"En zij zullen een deksel van dassenvellen daarop leggen, en een geheel kleed van hemelsblauw daar bovenop uitspreiden; en zij zullen derzelver handbomen aanleggen.","7":"Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en zullen daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurig brood daarop zijn.","8":"Daarna zullen zij een scharlaken kleed daarover uitspreiden, en zullen dat met een deksel van dassenvellen bedekken; en zij zullen derzelver handbomen aanleggen.","9":"Dan zullen zij een kleed van hemelsblauw nemen, en bedekken den kandelaar des luchters, en zijn lampen, en zijn snuiters, en zijn blusvaten, en al zijn olievaten, met welke zij aan denzelven dienen.","10":"Zij zullen ook denzelven, en al zijn gereedschap, in een deksel van dassenvellen doen, en zullen hem op den draagboom leggen.","11":"En over het gouden altaar zullen zij een kleed van hemelsblauw uitspreiden, en zullen dat met een deksel van dassenvellen bedekken; en zij zullen deszelfs handbomen aanleggen.","12":"Zij zullen ook nemen alle gereedschap van den dienst, met hetwelk zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen hetzelve met een deksel van dassenvellen bedekken; en zij zullen het op den draagboom leggen.","13":"En zij zullen de as van het altaar vegen, en zij zullen daarover een kleed van purper uitspreiden.","14":"En zij zullen daarop leggen al zijn gereedschap, waarmede zij aan hetzelve dienen, de koolpannen, de krauwelen, en de schoffelen, en de sprengbekkens, al het gereedschap des altaars; en zij zullen daarover een deksel van dassenvellen uitspreiden, en zullen deszelfs handbomen aanleggen.","15":"Als nu Aäron en zijn zonen, het dekken van het heiligdom, en van alle gereedschap des heiligdoms, in het optrekken des legers, zullen voleind hebben, zo zullen daarna de zonen van Kohath komen om te dragen; maar zij zullen dat heilige niet aanroeren, dat zij niet sterven. Dit is de last der zonen van Kohath, in de tent der samenkomst.","16":"Het opzicht nu van Eleazar, den zoon van Aäron, den priester, zal zijn over de olie des luchters, en het reukwerk der welriekende specerijen, en het gedurig spijsoffer, en de zalfolie; het opzicht des gansen tabernakels, en alles wat daarin is, aan het heiligdom en aan zijn gereedschap.","17":"En de HEERE sprak tot Mozes en tot Aäron, zeggende:","18":"Gij zult den stam van de geslachten der Kohathieten niet laten uitgeroeid worden, uit het midden der Levieten;","19":"Maar dit zult gij hun doen, opdat zij leven en niet sterven, als zij tot de heiligheid der heiligheden toetreden zullen: Aäron en zijn zonen zullen komen, en stellen hen een ieder over zijn dienst en aan zijn last.","20":"Doch zij zullen niet inkomen om te zien, als men het heiligdom inwindt, opdat zij niet sterven.","21":"En de HEERE sprak tot Mozes, zeggende:","22":"Neem ook op de som der zonen van Gerson, naar het huis hunner vaderen, naar hun geslachten.","23":"Gij zult hen tellen van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkomt om den strijd te strijden, opdat hij den dienst bediene in de tent der samenkomst.","24":"Dit zal zijn de dienst der geslachten van de Gersonieten, in het dienen en in den last.","25":"Zij zullen dan dragen de gordijnen des tabernakels, en de tent der samenkomst; *te* *weten* haar deksel, en het dassendeksel, dat er bovenop is, en het deksel der deur van de tent der samenkomst,","26":"En de behangselen des voorhofs, en het deksel der deur van de poort des voorhofs, hetwelk is bij den tabernakel en bij het altaar rondom; en hun zelen, en al het gereedschap van hun dienst, mitsgaders al wat daarvoor bereid wordt, opdat zij dienen.","27":"De gehele dienst van de zonen der Gersonieten, in al hun last, en in al hun dienst, zal zijn naar het bevel van Aäron en van zijn zonen; en gijlieden zult hun ter bewaring al hun last bevelen.","28":"Dit is de dienst van de geslachten der zonen van de Gersonieten, in de tent der samenkomst; en hun wacht zal zijn onder de hand van Ithamar, den zoon van Aäron, den priester.","29":"Aangaande de zonen van Merari, die zult gij naar hun geslachten, en naar het huis hunner vaderen tellen.","30":"Gij zult hen tellen van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkomt tot dezen strijd, om te bedienen den dienst van de tent der samenkomst.","31":"Dit zal nu zijn de onderhouding van hun last, naar al hun dienst, in de tent der samenkomst: de berderen des tabernakels, en zijn richelen, en zijn pilaren, en zijn voeten;","32":"Mitsgaders de pilaren des voorhofs rondom, hun voeten, en hun pennen, en hun zelen, met al hun gereedschap, en met al hun dienst; en het gereedschap van de waarneming van hun last zult gij bij namen tellen.","33":"Dit is de dienst van de geslachten der zonen van Merari, naar hun gansen dienst, in de tent der samenkomst, onder de hand van Ithamar, den zoon van Aäron, den priester.","34":"Mozes dan en Aäron, en de oversten der vergadering telden de zonen der Kohathieten, naar hun geslachten, en naar het huis hunner vaderen:","35":"Van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkwam tot dezen strijd, tot den dienst in de tent der samenkomst;","36":"Hun getelden nu waren, naar hun geslachten, twee duizend zevenhonderd en vijftig.","37":"Dit zijn de getelden van de geslachten der Kohathieten, van al wie in de tent der samenkomst diende, welke Mozes en Aäron geteld hebben, naar het bevel des HEEREN, door de hand van Mozes.","38":"Insgelijks de getelden der zonen van Gerson, naar hun geslachten, en naar het huis hunner vaderen;","39":"Van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkwam tot dezen strijd, tot den dienst in de tent der samenkomst;","40":"Hun getelden waren, naar hun geslachten, naar het huis hunner vaderen, twee duizend zeshonderd en dertig.","41":"Dezen zijn de getelden van de geslachten der zonen van Gerson, van al wie in de tent der samenkomst diende, welke Mozes en Aäron telden, naar het bevel des HEEREN.","42":"En de getelden van de geslachten der zonen van Merari, naar hun geslachten, naar het huis hunner vaderen,","43":"Van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkwam tot dezen strijd, tot den dienst in de tent der samenkomst;","44":"Hun getelden nu waren, naar hun geslachten, drie duizend en tweehonderd.","45":"Dezen zijn de getelden van de geslachten der zonen van Merari, welke Mozes en Aäron geteld hebben, naar het bevel des HEEREN, door de hand van Mozes.","46":"Al de getelden, welke Mozes en Aäron, en de oversten van Israël geteld hebben van de Levieten, naar hun geslachten, en naar het huis hunner vaderen,","47":"Van dertig jaren oud en daarboven, tot vijftig jaren oud, al wie inkwam, om den dienst der bediening en den dienst van den last, in de tent der samenkomst, te bedienen;","48":"Hun getelden waren acht duizend vijfhonderd en tachtig.","49":"Men telde hen, naar het bevel des HEEREN, door de hand van Mozes, een ieder naar zijn dienst, en naar zijn last; en zijn getelden waren, die de HEERE Mozes geboden had."},"KJV":{"1":"And the LORD spake unto Moses and unto Aaron, saying,","2":"Take the sum of the sons of Kohath from among the sons of Levi, after their families, by the house of their fathers,","3":"From thirty years old and upward even until fifty years old, all that enter into the host, to do the work in the tabernacle of the congregation.","4":"This *shall be* the service of the sons of Kohath in the tabernacle of the congregation, *about* the most holy things:","5":"And when the camp setteth forward, Aaron shall come, and his sons, and they shall take down the covering vail, and cover the ark of testimony","6":"And shall put thereon the covering of badgers' skins, and shall spread over *it* a cloth wholly of blue, and shall put in the staves","7":"And upon the table of shewbread they shall spread a cloth of blue, and put thereon the dishes, and the spoons, and the bowls, and covers to cover withal: and the continual bread","8":"And they shall spread upon them a cloth of scarlet, and cover the same with a covering of badgers' skins, and shall put in the staves","9":"And they shall take a cloth of blue, and cover the candlestick of the light, and his lamps, and his tongs, and his snuffdishes, and all the oil vessels thereof, wherewith they minister","10":"And they shall put it and all the vessels thereof within a covering of badgers' skins, and shall put *it* upon a bar.","11":"And upon the golden altar they shall spread a cloth of blue, and cover it with a covering of badgers' skins, and shall put to the staves","12":"And they shall take all the instruments of ministry, wherewith they minister in the sanctuary, and put *them* in a cloth of blue, and cover them with a covering of badgers' skins, and shall put *them* on a bar:","13":"And they shall take away the ashes from the altar, and spread a purple cloth","14":"And they shall put upon it all the vessels thereof, wherewith they minister about it, *even* the censers, the fleshhooks, and the shovels, and the basons, all the vessels of the altar; and they shall spread upon it a covering of badgers' skins, and put to the staves","15":"And when Aaron and his sons have made an end of covering the sanctuary, and all the vessels of the sanctuary, as the camp is to set forward; after that, the sons of Kohath shall come to bear *it*: but they shall not touch *any* holy thing, lest they die. These *things are* the burden of the sons of Kohath in the tabernacle of the congregation.","16":"And to the office of Eleazar the son of Aaron the priest *pertaineth* the oil for the light, and the sweet incense, and the daily meat offering, and the anointing oil, *and* the oversight of all the tabernacle, and of all that therein *is*, in the sanctuary, and in the vessels","17":"And the LORD spake unto Moses and unto Aaron, saying,","18":"Cut ye not off the tribe of the families of the Kohathites from among the Levites:","19":"But thus do unto them, that they may live, and not die, when they approach unto the most holy things: Aaron and his sons shall go in, and appoint them every one to his service and to his burden:","20":"But they shall not go in to see when the holy things are covered, lest they die.","21":"And the LORD spake unto Moses, saying,","22":"Take also the sum of the sons of Gershon, throughout the houses of their fathers, by their families;","23":"From thirty years old and upward until fifty years old shalt thou number them; all that enter in to perform the service, to do the work in the tabernacle of the congregation.","24":"This *is* the service of the families of the Gershonites, to serve, and for burdens:","25":"And they shall bear the curtains of the tabernacle, and the tabernacle of the congregation, his covering, and the covering of the badgers' skins that *is* above upon it, and the hanging for the door of the tabernacle of the congregation,","26":"And the hangings of the court, and the hanging for the door of the gate of the court, which *is* by the tabernacle and by the altar round about, and their cords, and all the instruments of their service, and all that is made for them: so shall they serve.","27":"At the appointment of Aaron and his sons shall be all the service of the sons of the Gershonites, in all their burdens, and in all their service: and ye shall appoint unto them in charge all their burdens.","28":"This *is* the service of the families of the sons of Gershon in the tabernacle of the congregation: and their charge *shall be* under the hand of Ithamar the son of Aaron the priest.","29":"As for the sons of Merari, thou shalt number them after their families, by the house of their fathers;","30":"From thirty years old and upward even unto fifty years old shalt thou number them, every one that entereth into the service, to do the work of the tabernacle of the congregation.","31":"And this *is* the charge of their burden, according to all their service in the tabernacle of the congregation; the boards of the tabernacle, and the bars thereof, and the pillars thereof, and sockets","32":"And > <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward</span> even unto <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old,</span> every one that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">do</span> the service of the <span class=\"wl wl-kjv\" data-code=\"H5656\">ministry,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation,","48":"Even those that were <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> of them, were <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and fourscore.","49":"According to the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> they were <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H376\">every</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> according to his <span class=\"wl wl-kjv\" data-code=\"H5656\">service,</span> and according to his <span class=\"wl wl-kjv\" data-code=\"H4853\">burden:</span> thus were they <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> of him, as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"som der zonen van Kahath,","tekst":"Hebreeuws, het hoofd. Zie boven, Num 1:2."}],"3":[{"catchword":"Van dertig jaren oud en daarboven,","tekst":"Hebreeuws, van een zoon van dertig jaar. Alzo in het volgende. Zie boven, Num 3:15."},{"catchword":"dezen","tekst":"Versta, een heiligen en kerkelijken strijd, waarin men den dienst des tabernakels naar de gestelde orde moest waarnemen. Gelijk de soldaten in den krijgshandel elk hun last naar orde moesten uitrichten, alzo wordt de kerkedienst een strijd of krijg genaamd, vs.3, en onder, vs.23, 30, 35, en Num 8:24, omdat de bedienaars derzelve goede orde moesten houden, om geduriglijk te werken, te waken en te strijden tegen de vijanden van de zaligheid der mensen. Zie 1Co 9:7; 2Co 10:3; 1Ti 1:18; 2Ti 2:3,4."},{"catchword":"strijd inkomt,","tekst":"Anders, heir, heirschaar. Alzo in het volgende, vs.30, 43."}],"4":[{"catchword":"heiligheid der heiligheden","tekst":"Versta hierdoor de ark des verbonds, de tafel tot de toonbroden, den kandelaar, het reukaltaar, de vaten en het gereedschap des heiligdoms en het brandofferaltaar. Van welke stukken hier tevoren, Num 3:31, iets gezegd is, maar nu breder verklaring wordt gedaan. Deze dingen moesten door de Kohathieten in het verreizen gedragen worden. Zie onder, vs.15."}],"5":[{"catchword":"voorhang des deksels","tekst":"Zie Exo 26:31-33; Lev 4:6, en Heb 9:3, waar hij genoemd wordt de tweede voorhang."}],"6":[{"catchword":"dassenvellen","tekst":"Zie van dezen Exo 25:5."},{"catchword":"aanleggen","tekst":"Dat is, recht toeschikken en passen, opdat zij bekwamelijk gedragen mochten worden, want de handbomen moesten altijd in de ringen der ark blijven, Exo 25:15. Vergelijk 1Ki 8:8."}],"7":[{"catchword":"toontafel","tekst":"Hebreeuws, de tafel der aangezichten; te weten, de broden der aangezichten; anders genoemd toonbroden, die op deze tafel lagen. Zij worden zo geheten omdat zij altijd op deze tafel voor het aangezicht des Heeren als tentoongesteld werden, en van hier is de naam toontafel"},{"catchword":"schotels,","tekst":"In welke de toonbroden gelegd werden, [zie van deze Exo 25:29 ] , en bleven daar de gehele week, totdat wederom andere nieuwe gemaakt en in de plaats der oude gelegd werden; Lev 24:8."},{"catchword":"reukschalen,","tekst":"Welke met reukwerk boven op de toonbroden gesteld werden; Lev 24:7."},{"catchword":"kroezen,","tekst":"Waaruit gesprengd en geschonken werd. Anders, bezems, waarmede de tafel afgeveegd en gereinigd werd."},{"catchword":"dekschotels;","tekst":"Hebreeuws, de schotels der bedekking; waarmede de toonbroden bedekt werden. Deze waren twaalf, naar het getal van de toonbroden. Zie Exo 25:29. Anders, de schotels der besprenging"},{"catchword":"gedurig brood daarop zijn","tekst":"Versta, de twaalf toonbroden, die op elken sabbatdag vernieuwd moesten worden; Lev 24:8."}],"9":[{"catchword":"met welke zij","tekst":"Zie van dit gereedschap tot den kandelaar en de lampen Exo 25:38, en Exo 35:14."},{"catchword":"denzelven dienen","tekst":"Te weten, den kandelaar."}],"10":[{"catchword":"op den draagboom leggen","tekst":"Versta, een instrument van stokken, waaraan iets gehangen werd, om van de ene plaats naar de andere verdragen te worden. Vergelijk onder, vs.12, en Num 13:23. Anders, planken, of draagburriën."}],"11":[{"catchword":"gouden altaar","tekst":"Versta, het reukaltaar, dat in het heilige stond en met goud overtrokken was. Zie Exo 30:3,4."}],"12":[{"catchword":"gereedschap van den dienst,","tekst":"Versta hierdoor, alle heilige klederen, met welke de priesters hun dienst doen moesten. Van welke zie Exo 31:10, en Exo 35:19, en Exo 39:1, Exo 39:41, waar zij ook klederen van den dienst genoemd worden. Hieronder begrijpen ook enigen allerlei vaten en diensttuig van den tabernakel. Van welke zie Exo 25:29, en Exo 27:3; 2Ki 15:14-15."}],"13":[{"catchword":"van het altaar vegen,","tekst":"Te weten, van het altaar des brandoffers."}],"14":[{"catchword":"zijn gereedschap,","tekst":"Zie van dit Exo 27:3, enz."}],"15":[{"catchword":"de zonen van Kahath","tekst":"Naderhand hebben de priesters, vermenigvuldigd zijnde, deze dingen ook gedragen. Zie Deu 31:9; Jos 3:6, en Jos 8:33; 1Sa 4:4; 1Ch 15:11-12. Hoewel het schijnt dat de Levieten niet geheel uitgesloten waren; 2Ch 5:5."},{"catchword":"om te dragen;","tekst":"Te weten, op hun eigen schouders. Zie onder, Num 7:9, en niet op wagens; welke orde de Israëlieten niet onderhouden hebben; 2Sa 6:3, 2Sa 6:6-7; 1Ch 13:7, en 1Ch 15:12-15."},{"catchword":"niet aanroeren,","tekst":"Zie onder, vs.20."},{"catchword":"dat zij niet sterven","tekst":"Zie 1Sa 6:19 welke straf den Bethsemieten wedervaren is, omdat zij in de ark des Heeren gezien hadden, en 2Sa 6:6-7, wat Uzza overkomen is, toen hij de ark des Heeren aanroerde."},{"catchword":"last der zonen van Kahath,","tekst":"Dat is, hetgeen zij bezorgen en dragen moesten."}],"16":[{"catchword":"gedurig spijsoffer,","tekst":"Hetwelk iederen morgen en avond geofferd werd. Zie hiervan Exo 29:38-39."}],"18":[{"catchword":"laten uitgeroeid worden,","tekst":"Te weten, door mijn rechtvaardige straf, wanneer gij door onachtzaamheid en zorgeloosheid oorzaak zoudt zijn, dat de heilige dingen zouden ontdekt bevonden worden van de Kohathieten, die dezelve alzo ziende en aanroerende, door de hand des HEEREN zouden sterven."}],"19":[{"catchword":"stellen hen","tekst":"Te weten, ieder hunner aanwijzende en verordinerende wat hij dragen moest."},{"catchword":"een ieder over zijn dienst","tekst":"Hebreeuws, man man; alzo onder, vs.49. Zie Lev 15:2."}],"20":[{"catchword":"opdat zij niet sterven","tekst":"Gelijk in een ander geval twee zonen van Aäron, Nadab en Abihu, wedervaren was, Lev 10:1, en in een ander, Korach met zijn rot, onder, Num 16:32-33, enz."}],"23":[{"catchword":"van dertig jaren oud en daarboven,","tekst":"Hebreeuws, van een zoon van dertig jaar; zo in het volgende; zie ook van deze telling boven, Num 3:15."},{"catchword":"om den strijd te strijden,","tekst":"Zie boven, de aantekeningen vs.3. Anders, om in de heirscharen te verzamelen. Vergelijk Exo 38:8."}],"24":[{"catchword":"last","tekst":"Zie boven, vs.15."}],"25":[{"catchword":"tent der samenkomst;","tekst":"Versta, de gordijnen, die van geitenhaar gemaakt waren en de gehele tent bedekten. Want haar berderen en pilaren, enz. moesten de Merarieten dragen, onder, vs.31."},{"catchword":"dassendeksel,","tekst":"Hebreeuws, het deksel van den das; dat is, der dassenvellen."},{"catchword":"deksel der deur","tekst":"Versta, het tapijt of behangsel, hetwelk hing aan de deur des tabernakels, tussen den voorhof en het heilige."}],"27":[{"catchword":"het bevel van Aäron en van zijn zonen;","tekst":"Hebreeuws, de mond. Zie Gen 41:40; alzo hieronder, vs.37, 41, 45, 49."}],"28":[{"catchword":"wacht zal zijn","tekst":"Dat is, hun ambt en bediening, waarop zij wel achtgeven moeten, ten einde zij alle delen daarvan getrouwelijk uitvoeren."},{"catchword":"onder de hand van Ithamar,","tekst":"Dat is, onder het beleid, opzicht en de regering van Ithamar, welke moest toezien dat een iegelijk zijn ambt recht bediende. Alzo ook onder, vs.33; idem Num 31:49, en Lev 8:36."}],"30":[{"catchword":"wie inkomt tot dezen strijd,","tekst":"Zie boven, vs.3."}],"31":[{"catchword":"zijn voeten;","tekst":"Te weten, op welke de pilaren stonden, en waren honderd in getal gemaakt, elk van een talent zilvers. Zie Exo 38:27."}],"32":[{"catchword":"zelen,","tekst":"Versta, de koorden van de pilaren des voorhofs. Gelijk de Gersonieten de zelen droegen, en de touwen van de behangselen des voorhofs, en het deksel der deur van de poort des voorhofs. Zie boven, vs.26, en Num 3:26."},{"catchword":"bij namen tellen","tekst":"Dat is, gij zult dat stuk voor stuk tellen en overleveren, met een register van hetzelve, opdat niets daarvan verloren worde."}],"37":[{"catchword":"door de hand van Mozes","tekst":"Zie boven, vs.28, en alzo in het volgende."}],"44":[{"catchword":"drie duizend en tweehonderd","tekst":"Als men dit 44 vs. vergelijkt met de voorgaande vs.36, 40, dan ziet men dat onder de Levieten, die tot den dienst des tabernakels bekwaam waren, de Merarieten in getal de meesten geweest zijn, hoewel zij de minsten waren in hun algemeen en vol getal. Zie boven de aantekeningen, Num 3:39, hetwelk alzo geschied is door de alwijze voorzichtigheid Gods, omdat de Merarieten de zwaarste lasten te dragen hadden, en daartoe meer sterke en middeljarige mannen behoefden dan de Kohathieten en Gersonieten. Vergelijk boven de aantekeningen Num 3:36."}],"47":[{"catchword":"om den dienst der bediening","tekst":"Dat is, om dienst en hulp te bewijzen aan de priesters, die den dienst des tabernakels bedienden. Want de gemene Levieten moesten den priesters in hun ambt de hand bieden."}],"49":[{"catchword":"die de HEERE Mozes geboden had","tekst":"Of, gelijk de HEERE Mozes geboden had."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the LORD spoke to Moseh and to Aaron, saying;"}],"2":[{"catchword":null,"tekst":"Take up the sum [Heb. the head, see above chap. 1. On verse 2.] of the sons of Kohath, out of the midst of the sons of Levi; by their Families, according to the house of their Fathers."}],"3":[{"catchword":null,"tekst":"From thirty year old, [Heb. from a son of thirty year, and so in the sequel, see above chap. 3. On verse 15.] and upwards, until fifty years old; all (or, every one) that comes into this warfare [or host or army, and so below vers. 30. And 43. Understand a holy and Ecclesiastical warfare, in which the service of the Tabernacle was to be exactly observed according to the orders once instituted; even as the Soldiers in military affairs, each one instituted; even as the Soldiers in military affairs, each one must discharged his duty and service, according to his orders and commands. Thus the Ministry of the Church is called a War or Warfare, Combat, here and below verse 23, 30, 35. And chap. 8. 24. Because that the Ministers thereof are bound to keep good orders, and incessantly to work and watch, and fight against the enemies of men&acirc;&euro;&trade;s salvation, see 1 Cor. 9. 7. And 2 Cor. 10. 3. 1 Tim. 1. 18. 2 Tim. 2. 3, 4.] For to do the work in the Tent of the Congregation."}],"4":[{"catchword":null,"tekst":"This shall be the service of the sons of Kohath, in the Tent of the Congregation (to wit) the holinesses. [Understand hereby the Ark of the Covenant, the Table for the Show-bread, the Candlestick, the Incense-altar, the Vessels and the furniture of the Sanctuary, and the Altar of burnt-offerings; of which thing somewhat was said before, chap. 3. V. 31. But now a fuller declaration is made, and all these things were to be carried by the Kohathites in their removing, see below verse 15."}],"5":[{"catchword":null,"tekst":"In the marching of the Camp, Aaron and his sons shall come, and take off the Vail of the Cover, [See Exod. 26, 31, 32, 33. And Lev. 4. On vers. 6. And Heb. 9. 3. Where it is called the second Vail] and therewith they shall cover the Ark of the Testimony."}],"6":[{"catchword":null,"tekst":"And thereupon they shall lay a Cover of Badgers-skins, [Of these, see Exod. 25. 5.] And spread a whole suite of sky-colour abroad upon it, and they shall put on the hand-bars thereof. [i.e. so fit and accommodate them unto the same, that it might conveniently be born up and carried thereby; for otherwise the said hand-bars were always to remain in the rings of the Ark, Exod. 25. 15. Comp. 1 King 8. 8.]"}],"7":[{"catchword":null,"tekst":"They shall likewise spread a sky-colour suite abroad upon the show Table, [Heb. Table of the faces, to wit, of the bread of the faces, otherwise called the Show-bread (Loaves) which lay upon this Table, and were called thus, because they were always laid upon the Table before the face of the LORD for show as it were; and thence is the name here of the Show-Table] and shall set there-upon the dishes (wherein the Show-bread-loaves were laid, of these, see Exod. 25. 29.) And remained there all the week, until new ones were made and laid in their stead, Lev. 24. 8.] and the incense-plates [which were placed above upon the Show-bread with incense, Lev. 24. 7.] and the Cruises [wherewith they sprinkled and poured forth liquors: Otherwise besoms, wherewith the Table was made and kept clean] and the covering plates, [Hebr. Plates of covering, wherewith the Show-bread was covered, of these there were twelve, according to the number of the Show-bread (loaves) see Exod. 25. 29. Otherwise, the dishes of sprinkling] also the continual Bread shall upon it. [i.e. the twelve Show-bread (loaves or Cakes) which were to be renewed every Sabbath, Lev. 24. 8.]"}],"8":[{"catchword":null,"tekst":"Then they shall spread a scarlet suite over it, and shall cover the same with a cover of Badgers-skins, and they shall put on the hand-bars thereof."}],"9":[{"catchword":null,"tekst":"Then shall they take a suite of sky-colour, and cover the Candlestick of the light, and his lamps, and his snuffers, and his extinguishers, and all his oil-vessels wherewith they serve the same, [viz. the candlestick. See of furniture for the candlestick and the lamps thereof, Exod. 25. 38. And 35. 14.]"}],"10":[{"catchword":null,"tekst":"They shall likewise put the same, and all his furniture into a Cover of Badgers-skins, and shall lay him upon the Bear. [Understand an Ensign of staves, where something might be hung to be transported from one place to another, compare below verse 12. And chap. 13. 24. Otherwise planks, or bearing, supporting boards.]"}],"11":[{"catchword":null,"tekst":"And over the golden Altar [Understand the Incense Altar, which stood in the holy place, and was overlaid with gold. See Exod. 30. Verse 3. 4.] they shall spread forth a suite of sky-colour, and shall cover the same with a cover of Badgers-skins, and they shall put on the hand-bars thereof."}],"12":[{"catchword":null,"tekst":"They shall likewise take all the furniture of the service, [Understand hereby all the holy Vestments, wherein the Priests were to officiate; whereof see Exod. 31. 10. And 35. 19. Vers. 41. Where they are likewise comprehend all manner of Vessels, and Utensils of the Tabernacle, whereof see Exod. 25. 29. And 27. 3. 2 King 25. 14. 15.] wherewith they serve in the Sanctuary, and shall lay them in a suite of sky-color, and shall cover them with a cover of Badgers-skins, and shall put them upon the Bear."}],"13":[{"catchword":null,"tekst":"And they shall scour off the ashes from the Altar, [viz. of the Burnt-offerings] and they shall spread over it a suite of purple."}],"14":[{"catchword":null,"tekst":"And they shall lay upon it all his furniture, [Whereof see Exod. 27. Vers. 3. Etc] wherewith they serve at it, the chasing-dishes, the flesh-books, and the shovels, and the sprinkling basons, all the furniture of the Altar: and they shall spread forth over it a Cover of Badgers-skins, and shall put on his hand-bars."}],"15":[{"catchword":null,"tekst":"Now when Aaron and his sons shall have accomplished the covering of the Sanctuary, in the marching of the Camp, then shall the sons of Kohath come after that, [In aftertimes the Priests likewise themselves being multiplied, did carry these things, see Deut. 31. 9. Josh. 3. 6. And 8. 33. 1 Sam. 4. 4. 1 Chron. 15. 11, 12. Though it seemeth the Levites were not altogether excluded, 2 Chron. 5. 5.] for to carry, [viz. upon their own shoulders, see below chap. 7. 9. And not upon Wagons, which order the Israelites observed not, 2 Sam. 6. 6, 7. 1 Chron. 13. 7. And chap. 15. Ver. 12, 13, 14, 15.] but they shall not touch that holy (thing) [see below verse 20] that they die not; see 1 Sam. 6. 19. What punishment lighted upon the Bethshemites, for having seen the Ark of the LORD, and 2 Sam. 6. 6, 7. What befell Uzza, for touching of it] this is the charge of the sons of Kohath [i.e. that which they are to take care of for to carry] in the Tent of the Congregation."}],"16":[{"catchword":null,"tekst":"The inspection now of Eleazar the son of Aaron the Priest, shall be over the oil of the Candlestick, and the incense of the fragrant spices, and the continual meat-offering [Which was offered every morning and evening, See hereof Exod. 29. 38, 39.] and the anointing oil, the inspection of all the Tabernacle, and all that is in it, on the Sanctuary, and on his furniture."}],"17":[{"catchword":null,"tekst":"And the Lord spoke to Moseh, and to Aaron, saying;"}],"18":[{"catchword":null,"tekst":"Ye shall not suffer the Tribe of the families of the Kohathites to be destroyed out of the midst of the Levites. [viz. by my righteous judgement, when as by your heedlessness or carelessness, ye should cause the holy things to be uncovered in the sight of the Kohathites, who seeing them, and laying hold on them, or onely touching them, might come to die for it by the hand of the LORD.]"}],"19":[{"catchword":null,"tekst":"But this ye shall do to them, that they may live and not die, when they shall draw near to the holiness of the holinesses; Aaron and his sons shall come and place them every one [Hebr. Man, man, and so below verse 49. See Lev. 15. On verse 2.] ever his service and on his charge . [viz. appointing and ordering every one of them what he should bear.]"}],"20":[{"catchword":null,"tekst":"Yet they shall not come in for to see, when they wrap in the Sanctuary, that they die not: [viz. in such a manner, as happened unto the two sons of Aaron, Nadab and Abihu upon another trespass, Lev. 1. 10. And yet upon another unto Korah and his company, below chap. 16. Verse 32. 33. Etc.]"}],"21":[{"catchword":null,"tekst":"And the LORD spoke to Moseh, saying;"}],"22":[{"catchword":null,"tekst":"Take up likewise the sum of the sons of Gerson, according to the house of their Fathers by their Families."}],"23":[{"catchword":null,"tekst":"Thou shalt number them from thirty year old [Heb. from a son of thirty year; and so in the sequel. See likewise of this numbering above, chap. 3. On verse 15.] and upwards, until fifty year old; all (or, every one) that comes in to fight the combat, [See above the Annot. On vers. 3. Otherwise for to gather (or) assemble in the host, comp. Exod. 38. 8.] to administer the service in the Tent of the Congregation."}],"24":[{"catchword":null,"tekst":"This shall be the service of the Families of the Gersonites, in the serving and in the charge. [See above on verse 15.]"}],"28":[{"catchword":null,"tekst":"That is the service of the Families of the sons of the Gersonites in the Tent of the Congregation, and their Guard [i.e. their charge and office which they must be very regardful of, that they may execute the same faithfully in all the parts and circumstances thereof] under the hand of Ithamar the son of Aaron the Priest. [i.e. under his inspection and direction, it belonging to his care, to look to it, that every one faithfully discharged his office, so also below, verse 33. Item chap. 31. 49. Item Lev. 8. 36.]"}],"29":[{"catchword":null,"tekst":"As for the sons of Merari, thou shalt number them by their Families, and according to the house of their Fathers."}],"30":[{"catchword":null,"tekst":"Thou shalt tell them from thirty year old and upwards until fifty year old, all that comes in to this Warfare (or Combat) [See above on verse 3.] for to administer the service of the Tent of the Congregation."}],"31":[{"catchword":null,"tekst":"This now shall be the observation of their charge, according to all their service in the Tent of the Congregation; the Planks of the Tabernacle, and his Bars, and his Pillars, and his Feet. [viz. whereon the Pillar stood, whereof there were made an hundred in number, each one of a Talent of silver, see Exod. 38. 27.]"}],"32":[{"catchword":null,"tekst":"Together with the Pillars of the Court round about, and their Feet, and their Pins, and their Coards, [Understand the Coards of the Pillars of the Court; as the Gersonites carried the Coards and Wapes of the hangings of the Court, and of the covering of the door of the gate of the Court, see above vers. 26. And chap. 3. Verse 26.] with all their furniture, and with all their service, and the furniture of the observation of their charge thou shalt tell by name. [i.e. thou shalt count and deliver them piece by piece into their hands, keeping a register of it, that nothing may be lost.]"}],"33":[{"catchword":null,"tekst":"That is the service of the Families of the Sons of Merari, according to all their service, in the Tent of the Congregation, under the hand of Ithamar the son of Aaron the Priest."}],"34":[{"catchword":null,"tekst":"Moseh then and Aaron, and the chief of the Congregation, numbered the sons of the Kohathites; by their Families, and according to the house of their Fathers."}],"35":[{"catchword":null,"tekst":"From thirty year old and upwards, until fifty year old, all (or, every one) that came into this warfare, for the service in the Tent of the Congregation."}],"36":[{"catchword":null,"tekst":"Their numbered (ones) now were, by their families, two thousand seven hundred and fifty."}],"37":[{"catchword":null,"tekst":"These are the numbered of the Families of the Kohathites, of all that served in the Tent of the Congregation whom Moseh and Aaron numbered, according to the LORD&acirc;&euro;&trade;s command, by the hand of Moseh. [See above on verse 28. And so in the sequel.]"}],"38":[{"catchword":null,"tekst":"As likewise the numbered of the Sons of Gerson, by their Families and according to the house of their Fathers."}],"39":[{"catchword":null,"tekst":"From thirty year old and upward, until fifty year old, all that came into this warfare, for the service in the Tent of the Congregation."}],"40":[{"catchword":null,"tekst":"Their numbered (ones) by their Families, according to the house of their Fathers were two thousand six hundred and thirty."}],"41":[{"catchword":null,"tekst":"These are the numbered of the Families of the sons of Gerson, of all that served in the Tent of the Congregation, whom Moseh and Aaron numbered according to the LORD&acirc;&euro;&trade;s command."}],"42":[{"catchword":null,"tekst":"And the numbered of the Families of the sons of Merari, by their families according to the house of their Fathers."}],"43":[{"catchword":null,"tekst":"From thirty year old and upwards, until fifty year old: all that came into this warfare, for the service in the Tent of the congregation."}],"44":[{"catchword":null,"tekst":"Their numbered now were by their families three thousand two hundred. [This verse being compared with foregoing thirty six and forty, it appeareth that among the Levites, which were the fewest in their general account or total number, see above chap. 3. On verse 39. Which happened thus by the all-wise providence of God; the Merarits having the heaviest burden to carry, required more and stronger middle-aged men then the Kohathites and Gersonites, compare above chap. 3. On verse 36.]"}],"45":[{"catchword":null,"tekst":"These are the numbered of the Families of the sons of Merari whom Moseh and Aaron numbered at God&acirc;&euro;&trade;s command, by the hand of Moseh."}],"46":[{"catchword":null,"tekst":"All the numbered, whom Moseh and Aaron, and the chief of Israel numbered of the Levites, by their Families, and according to the house of their Fathers."}],"47":[{"catchword":null,"tekst":"From thirty year old and upwards , till fifty year old, all that came in for to serve the service of the Administration, and the service of the charge, in the Tent of the Congregation [i.e. for to serve and assist the Priests, who administered the service of the Tabernacle: for the common Levites were only to be sub servant unto the Priests in their office.]"}],"49":[{"catchword":null,"tekst":"They numbered them (or they were numbered) according to the LORD&acirc;&euro;&trade;s command by the hand of Moseh, every one according to his service, and according to his charge; and his numbered (ones) were those whom the LORD had commanded Moseh. [or as the LORD. Etc]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {

  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);

}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

function toggle(n) {

    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');

  const isOpen = paneel.classList.toggle('open');

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

const popupCache = {};

  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);

  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
