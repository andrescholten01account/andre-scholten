ezicht van de HEERE, toen zij vreemd vuur voor het aangezicht van de HEERE in de woestijn van Sinaï brachten, en zij hadden geen kinderen; doch Eleazar en Ithamar bedienden het priesterambt voor het aangezicht van hun vader Aäron.","5":"En de HEERE sprak tot Mozes en zei:","6":"Laat de stam van Levi naderen, en stel hem voor het aangezicht van de priester Aäron, opdat zij hem dienen;","7":"En dat zij zijn wacht waarnemen, en de wacht van de hele vergadering, voor de tent der samenkomst, om de dienst van de tabernakel te bedienen;","8":"En dat zij al het gereedschap van de tent der samenkomst, en de wacht van de kinderen van Israël waarnemen, om de dienst van de tabernakel te bedienen.","9":"U zult dan, aan Aäron en aan zijn zonen, de Levieten geven; zij zijn gegeven, zij zijn hem gegeven, uit de kinderen van Israël.","10":"Maar Aäron en zijn zonen zult u aanstellen, dat zij hun priesterambt waarnemen; en de vreemde die nadert, zal gedood worden.","11":"En de HEERE sprak tot Mozes en zei:","12":"En Ik, zie, Ik heb de Levieten uit het midden van de kinderen van Israël genomen, in plaats van elke eerstgeborene, die de baarmoeder opent, uit de kinderen van Israël; en de Levieten zullen van Mij zijn.","13":"Want elke eerstgeborene is van Mij; van de dag dat Ik alle eerstgeborenen in Egypteland sloeg, heb Ik Mij geheiligd alle eerstgeborenen in Israël, van de mensen tot de dieren; zij zullen van Mij zijn; Ik ben de HEERE!","14":"En de HEERE sprak tot Mozes in de woestijn van Sinaï en zei:","15":"Tel de zonen van Levi naar het huis van hun vaderen, naar hun geslachten, alles wat mannelijk is, van een maand oud en daarboven, dat zult u tellen.","16":"En Mozes telde hen naar het bevel van de HEERE, zoals hem geboden was.","17":"Dit nu waren de zonen van Levi met hun namen: Gerson, en Kahath, en Merari.","18":"En dit zijn de namen van de zonen van Gerson, naar hun geslachten: Libni en Simeï.","19":"En de zonen van Kahath, naar hun geslachten: Amram en Izhar, Hebron en Uzziël.","20":"En de zonen van Merari, naar hun geslachten: Maheli en Musi; dit zijn de geslachten van de Levieten, naar het huis van hun vaderen.","21":"Van Gerson was het geslacht van de Libnieten, en het geslacht van de Simeïeten; dit zijn de geslachten van de Gersonieten.","22":"Hun getelden in getal waren van al wat mannelijk was, van een maand oud en daarboven; hun getelden waren zevenduizend vijfhonderd.","23":"De geslachten van de Gersonieten zullen zich legeren achter de tabernakel, westwaarts.","24":"De aanvoerder nu van het vaderlijke huis van de Gersonieten zal zijn Eljasaf, de zoon van Lael.","25":"En de wacht van de zonen van Gerson in de tent der samenkomst zal zijn de tabernakel en de tent, haar deksel, en het deksel aan de deur van de tent der samenkomst;","26":"En de behangsels van de voorhof, en het deksel van de deur van de voorhof, die bij de tabernakel en bij het altaar rondom zijn; alsook de touwen, voor zijn hele dienst.","27":"En van Kahath is het geslacht van de Amramieten, en het geslacht van de Izharieten, en het geslacht van de Hebronieten, en het geslacht van de Uzziëlieten; dit zijn de geslachten van de Kohathieten.","28":"In getal van al wat mannelijk was, van een maand oud en daarboven, waren achtduizend zeshonderd, die de wacht van het heiligdom waarnamen.","29":"De geslachten van de zonen van Kohath zullen zich legeren aan de zijde van de tabernakel, zuidwaarts.","30":"De aanvoerder nu van het vaderlijke huis van de geslachten van de Kohathieten, zal zijn Elisafan, de zoon van Uzziël.","31":"Hun wacht nu zal zijn de ark, en de tafel, en de kandelaar, en de altaren en het gereedschap van het heiligdom, waarmee zij dienst doen, en het deksel, en alles *wat tot* zijn dienst *behoort*.","32":"De aanvoerder nu van de aanvoerders van Levi zal zijn Eleazar, de zoon van Aäron, de priester; *zijn* opzicht zal zijn over degenen, die de wacht van het heiligdom waarnemen.","33":"Van Merari is het geslacht van de Mahelieten, en het geslacht van de Musieten; dit zijn de geslachten van Merari.","34":"En hun getelden in getal van al wat mannelijk was, van een maand oud en daarboven, waren zesduizend tweehonderd.","35":"De aanvoerder nu van het vaderlijke huis van de geslachten van Merari zal zijn Zuriël, de zoon van Abihaïl; zij zullen zich legeren aan de zijde van de tabernakel, noordwaarts.","36":"En het opzicht van de wachten van de zonen van Merari zal zijn over de planken van de tabernakel, en zijn richels, en zijn pilaren, en zijn voeten, en al zijn gereedschap, en alles *wat tot* zijn dienst *behoort*;","37":"En de pilaren van de voorhof rondom, en hun voeten, en hun pennen, en hun touwen.","38":"Die zich nu zullen legeren voor de tabernakel oostwaarts, voor de tent der samenkomst, tegen de opgang, zullen zijn Mozes, en Aäron met zijn zonen, die de wacht van het heiligdom waarnemen, voor de wacht van de kinderen van Israël; en de vreemde die nadert, zal gedood worden.","39":"Alle getelden van de Levieten, die Mozes en Aäron, op het bevel van de HEERE, naar hun geslachten, geteld hebben, alles wat mannelijk was, van een maand oud en daarboven, waren tweeëntwintigduizend.","40":"En de HEERE zei tegen Mozes: Tel alle eerstgeborenen, wat mannelijk is onder de kinderen van Israël, van een maand oud en daarboven; en neem het getal van hun namen op.","41":"En u zult voor Mij de Levieten nemen (Ik ben de HEERE!), in plaats van alle eerstgeborenen onder de kinderen van Israël, en de dieren van de Levieten, in plaats van alle eerstgeborenen onder de dieren van de kinderen van Israël.","42":"Mozes dan telde, zoals de HEERE hem geboden had, alle eerstgeborenen onder de kinderen van Israël.","43":"En alle eerstgeborenen die mannelijk waren, in het getal van de namen, van een maand oud en daarboven, naar hun getelden, waren tweeëntwintigduizend tweehonderddrieënzeventig.","44":"En de HEERE sprak tot Mozes en zei:","45":"Neem de Levieten, in plaats van alle eerstgeboorte onder de kinderen van Israël, en de dieren van de Levieten, in plaats van hun dieren; want de Levieten zullen van Mij zijn; Ik ben de HEERE!","46":"Aangaande de tweehonderddrieënzeventig, die gelost zullen worden, die overschieten, boven de Levieten, van de eerstgeborenen van de kinderen van Israël;","47":"U zult voor elk hoofd vijf sikkels nemen; naar de sikkel van het heiligdom zult u ze nemen; die sikkel is twintig gera.","48":"En u zult dat geld aan Aäron en zijn zonen geven, *het geld* van de gelosten die onder hen overschieten.","49":"Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten.","50":"Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig *sikkels*, naar de sikkel van het heiligdom.","51":"En Mozes gaf dat geld van de gelosten aan Aäron en aan zijn zonen, naar het bevel van de HEERE, zoals de HEERE Mozes geboden had."},"SV":{"1":"Dit nu zijn de geboorten van Aäron en Mozes; ten dage *als* de HEERE met Mozes gesproken heeft op den berg Sinaï.","2":"En dit zijn de namen der zonen van Aäron: de eerstgeborene, Nadab, daarna Abihu, Eleazar, en Ithamar.","3":"Dit zijn de namen der zonen van Aäron, der priesteren, die gezalfd waren, welker hand men gevuld had, om het priesterambt te bedienen.","4":"Maar Nadab en Abihu stierven voor het aangezicht des HEEREN, als zij vreemd vuur voor het aangezicht des HEEREN in de woestijn van Sinaï brachten, en hadden geen kinderen, doch Eleazar en Ithamar bedienden het priesterambt voor het aangezicht van hun vader Aäron.","5":"En de HEERE sprak tot Mozes, zeggende:","6":"Doe den stam van Levi naderen, en stel hem voor het aangezicht van den priester Aäron, opdat zij hem dienen;","7":"En dat zij waarnemen zijn wacht, en de wacht der gehele vergadering, voor de tent der samenkomst, om den dienst des tabernakels te bedienen;","8":"En dat zij al het gereedschap van de tent der samenkomst, en de wacht der kinderen Israëls waarnemen, om den dienst des tabernakels te bedienen.","9":"Gij zult dan, aan Aäron en aan zijn zonen, de Levieten geven; zij zijn gegeven, zij zijn hem gegeven uit de kinderen Israëls.","10":"Maar Aäron en zijn zonen zult gij stellen, dat zij hun priesterambt waarnemen; en de vreemde, die nadert, zal gedood worden.","11":"En de HEERE sprak tot Mozes, zeggende:","12":"En Ik, zie, Ik heb de Levieten uit het midden van de kinderen Israëls genomen, in plaats van allen eerstgeborene, die de baarmoeder opent, uit de kinderen Israëls; en de Levieten zullen Mijne zijn.","13":"Want alle eerstgeborene is Mijn; van den dag, dat Ik alle eerstgeborenen in Egypteland sloeg, heb Ik Mij geheiligd alle eerstgeborenen in Israël, van de mensen tot de beesten; zij zullen Mijn zijn; Ik ben de HEERE!","14":"En de HEERE sprak tot Mozes in de woestijn van Sinaï, zeggende:","15":"Tel de zonen van Levi naar het huis hunner vaderen, naar hun geslachten, al wat mannelijk is, van een maand oud en daarboven, die zult gij tellen.","16":"En Mozes telde hen naar het bevel des HEEREN, gelijk als hem geboden was.","17":"Dit nu waren de zonen van Levi met hun namen: Gerson, en Kahath, en Merari.","18":"En dit zijn de namen der zonen van Gerson, naar hun geslachten: Libni en Simeï.","19":"En de zonen van Kahath, naar hun geslachten; Amram en Izhar, Hebron en Uzziël.","20":"En de zonen van Merari, naar hun geslachten: Maheli en Musi; dit *zijn* de geslachten der Levieten, naar het huis hunner vaderen.","21":"Van Gerson was het geslacht der Libnieten, en het geslacht der Simeïeten; dit zijn de geslachten der Gersonieten.","22":"Hun getelden in getal waren van al wat mannelijk was, van een maand oud en daarboven; hun getelden waren zeven duizend en vijfhonderd.","23":"De geslachten der Gersonieten zullen zich legeren achter den tabernakel, westwaarts.","24":"De overste nu van het vaderlijke huis der Gersonieten zal zijn Eljasaf, de zoon van Lael.","25":"En de wacht der zonen van Gerson in de tent der samenkomst zal zijn de tabernakel en de tent, haar deksel, en het deksel aan de deur van de tent der samenkomst;","26":"En de behangselen des voorhofs, en het deksel van de deur des voorhofs, welke bij den tabernakel en bij het altaar rondom zijn; mitsgaders de zelen, tot zijn gansen dienst.","27":"En van Kahath is het geslacht der Amramieten, en het geslacht der Izharieten, en het geslacht der Hebronieten, en het geslacht der Uzziëlieten; dit zijn de geslachten der Kohathieten.","28":"In getal van al wat mannelijk was, van een maand oud en daarboven, waren acht duizend en zeshonderd, waarnemende de wacht des heiligdoms.","29":"De geslachten der zonen van Kohath zullen zich legeren aan de zijde des tabernakels, zuidwaarts.","30":"De overste nu van het vaderlijke huis der geslachten van de Kohathieten, zal zijn Elisafan, de zoon van Uzziël.","31":"Hun wacht nu zal zijn de ark, en de tafel, en de kandelaar, en de altaren en het gereedschap des heiligdoms, met hetwelk zij dienst doen, en het deksel, en al *wat* *tot* zijn dienst *behoort*.","32":"De overste nu der oversten van Levi zal zijn Eleazar, de zoon van Aäron, den priester; *zijn* opzicht zal zijn over degenen, die de wacht des heiligdoms waarnemen.","33":"Van Merari is het geslacht der Mahelieten, en het geslacht der Musieten; dit zijn de geslachten van Merari.","34":"En hun getelden in getal van al wat mannelijk was, van een maand oud en daarboven, waren zes duizend en tweehonderd.","35":"De overste nu van het vaderlijke huis der geslachten van Merari zal zijn Zuriël, de zoon van Abihaïl; zij zullen zich legeren aan de zijde des tabernakels, noordwaarts.","36":"En het opzicht der wachten van de zonen van Merari zal zijn over de berderen des tabernakels, en zijn richelen, en zijn pilaren, en zijn voeten, en al zijn gereedschap, en al *wat* *tot* zijn dienst *behoort*;","37":"En de pilaren des voorhofs rondom, en hun voeten, en hun pennen, en hun zelen.","38":"Die nu zich legeren zullen voor den tabernakel oostwaarts, voor de tent der samenkomst, tegen den opgang, zullen zijn Mozes, en Aäron met zijn zonen, waarnemende de wacht des heiligdoms, voor de wacht der kinderen Israëls; en de vreemde, die nadert, zal gedood worden.","39":"Alle getelden der Levieten, welke Mozes en Aäron, op het bevel des HEEREN, naar hun geslachten, geteld hebben, al wat mannelijk was, van een maand oud en daarboven, waren twee en twintig duizend.","40":"En de HEERE zeide tot Mozes: Tel alle eerstgeborenen, wat mannelijk is onder de kinderen Israëls, van een maand oud en daarboven; en neem het getal hunner namen op.","41":"En gij zult voor Mij de Levieten nemen (Ik ben de HEERE!), in plaats van alle eerstgeborenen onder de kinderen Israëls, en de beesten der Levieten, in plaats van alle eerstgeborenen onder de beesten der kinderen Israëls.","42":"Mozes dan telde, gelijk als de HEERE hem geboden had, alle eerstgeborenen onder de kinderen Israëls.","43":"En alle eerstgeborenen, die mannelijk waren, in het getal der namen, van een maand oud en daarboven, naar hun getelden, waren twee en twintig duizend tweehonderd en drie en zeventig.","44":"En de HEERE sprak tot Mozes, zeggende:","45":"Neem de Levieten, in plaats van alle eerstgeboorte onder de kinderen Israëls, en de beesten der Levieten, in plaats van hun beesten; want de Levieten zullen Mijn zijn; Ik ben de HEERE!","46":"Aangaande de tweehonderd drie en zeventig, die gelost zullen worden, die overschieten, boven de Levieten, van de eerstgeborenen van de kinderen Israëls;","47":"Gij zult voor elk hoofd vijf sikkels nemen; naar den sikkel des heiligdoms zult gij ze nemen; die sikkel is twintig gera.","48":"En gij zult dat geld aan Aäron en zijn zonen geven, *het* *geld* der gelosten die onder hen overschieten.","49":"Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten.","50":"Van de eerstgeborenen van de kinderen Israëls nam hij dat geld, duizend driehonderd vijf en zestig *sikkelen*, naar den sikkel des heiligdoms.","51":"En Mozes gaf dat geld der gelosten aan Aäron en aan zijn zonen, naar het bevel des HEEREN, gelijk als de HEERE Mozes geboden had."},"KJV":{"1":"These also *are* the generations of Aaron and Moses in the day *that* the LORD spake with Moses in mount Sinai.","2":"And these *are* the names of the sons of Aaron; Nadab the firstborn, and Abihu, Eleazar, and Ithamar.","3":"These *are* the names of the sons of Aaron, the priests which were anointed, whom he consecrated to minister in the priest's office.","4":"And Nadab and Abihu died before the LORD, when they offered strange fire before the LORD, in the wilderness of Sinai, and they had no children: and Eleazar and Ithamar ministered in the priest's office in the sight of Aaron their father.","5":"And the LORD spake unto Moses, saying,","6":"Bring the tribe of Levi near, and present them before Aaron the priest, that they may minister","7":"And they shall keep his charge, and the charge of the whole congregation before the tabernacle of the congregation, to do the service of the tabernacle.","8":"And they shall keep all the instruments of the tabernacle of the congregation, and the charge of the children of Israel, to do the service of the tabernacle.","9":"And thou shalt give the Levites unto Aaron and to his sons: they *are* wholly given unto him out of the children of Israel.","10":"And thou shalt appoint Aaron and his sons, and they shall wait on their priest's office: and the stranger that cometh nigh shall be put to death.","11":"And the LORD spake unto Moses, saying,","12":"And I, behold, I have taken the Levites from among the children of Israel instead of all the firstborn that openeth the matrix among the children of Israel: therefore the Levites","13":"Because all the firstborn *are* mine; *for* on the day that I smote all the firstborn in the land of Egypt I hallowed unto me all the firstborn in Israel, both man and beast: mine shall they be: I *am* the LORD.","14":"And the LORD spake unto Moses in the wilderness of Sinai, saying,","15":"Number the children of Levi after the house of their fathers, by their families: every male from a month old and upward shalt thou number","16":"And Moses numbered them according to the word of the LORD, as he was commanded.","17":"And these were the sons of Levi by their names; Gershon, and Kohath, and Merari.","18":"And these *are* the names of the sons of Gershon by their families; Libni, and Shimei.","19":"And the sons of Kohath by their families; Amram, and Izehar, Hebron, and Uzziel.","20":"And the sons of Merari by their families; Mahli, and Mushi. These *are* the families of the Levites according to the house of their fathers.","21":"Of Gershon *was* the family of the Libnites, and the family of the Shimites: these *are* the families of the Gershonites.","22":"Those that were numbered of them, according to the number of all the males, from a month old and upward, *even* those that were numbered of them *were* seven thousand and five hundred.","23":"The families of the Gershonites shall pitch behind the tabernacle westward.","24":"And the chief of the house of the father of the Gershonites *shall be* Eliasaph the son of Lael.","25":"And the charge of the sons of Gershon in the tabernacle of the congregation *shall be* the tabernacle, and the tent, the covering thereof, and the hanging for the door of the tabernacle of the congregation,","26":"And the hangings of the court, and the curtain for the door of the court, which *is* by the tabernacle, and by the altar round about, and the cords of it for all the service","27":"And of Kohath *was* the family of the Amramites, and the family of the Izeharites, and the family of the Hebronites, and the family of the Uzzielites: these *are* the families of the Kohathites.","28":"In the number of all the males, from a month old and upward, *were* eight thousand and six hundred, keeping the charge of the sanctuary.","29":"The families of the sons of Kohath shall pitch on the side of the tabernacle southward.","30":"And the chief of the house of the father of the families of the Kohathites *shall be* Elizaphan the son of Uzziel.","31":"And their charge *shall be* the ark, and the table, and the candlestick, and the altars, and the vessels of the sanctuary wherewith they minister, and the hanging, and all the service","32":"And Eleazar the son of Aaron the priest *shall be* chief over the chief of the Levites, *and have* the oversight of them that keep the charge of the sanctuary.","33":"Of Merari *was* the family of the Mahlites, and the family of the Mushites: these *are* the families of Merari.","34":"And those that were numbered of them, according to the number of all the males, from a month old and upward, *were* six thousand and two hundred.","35":"And the chief of the house of the father of the families of Merari *was* Zuriel the son of Abihail: *these* shall pitch on the side of the tabernacle northward.","36":"And *under* the custody and charge of the sons of Merari *shall be* the boards of the tabernacle, and the bars thereof, and the pillars thereof, and the sockets thereof, and all the vessels thereof, and all that serveth","37":"And the pillars of the court round about, and their sockets, and their pins, and their cords.","38":"But those that encamp before the tabernacle toward the east, *even* before the tabernacle of the congregation eastward, *shall be* Moses, and Aaron and his sons, keeping the charge of the sanctuary for the charge of the children of Israel; and the stranger that cometh nigh shall be put to death.","39":"All that were numbered of the Levites, which Moses and Aaron numbered at the commandment of the LORD, throughout their families, all the males from a month old and upward, *were* twenty and two thousand.","40":"And the LORD said unto Moses, Number all the firstborn of the males of the children of Israel from a month old and upward, and take the number of their names.","41":"And thou shalt take the Levites for me (I *am* the LORD) instead of all the firstborn among the children of Israel; and the cattle of the Levites instead of all the firstlings among the cattle of the children of Israel.","42":"And Moses numbered, as the LORD commanded him, all the firstborn among the children of Israel.","43":"And all the firstborn males by the number of names, from a month old and upward, of those that were numbered of them, were twenty and two thousand two hundred and threescore and thirteen.","44":"And the LORD spake unto Moses, saying,","45":"Take the Levites instead of all the firstborn among the children of Israel, and the cattle of the Levites instead of their cattle; and the Levites shall be mine: I *am* the LORD.","46":"And for those that are to be redeemed of the two hundred and threescore and thirteen of the firstborn of the children of Israel, which are more than the Levites;","47":"Thou shalt even take five shekels apiece by the poll, after the shekel of the sanctuary shalt thou take *them*: (the shekel *is* twenty gerahs:)","48":"And thou shalt give the money, wherewith the odd number of them is to be redeemed, unto Aaron and to his sons.","49":"And Moses took the redemption money of them that were over and above them that were redeemed by the Levites:","50":"Of the firstborn of the children of Israel took he the money; a thousand three hundred and threescore and five *shekels*, after the shekel of the sanctuary:","51":"And Moses gave the money of them that were redeemed unto Aaron and to his sons, according to the word of the LORD, as the LORD commanded Moses."}},"tsk":{"1":[{"kopje":"geboorten","refs":["Gen 2:4","Gen 5:1","Gen 10:1","Ex 6:15","Ex 6:19","Matt 1:1"]},{"kopje":"gesproken heeft","refs":["Num 1:1","Lev 25:1","Lev 27:34"]}],"3":[{"kopje":"de priesters","refs":["Ex 28:41","Ex 40:13","Ex 40:15","Lev 8:2","Lev 8:12","Lev 8:30"]},{"kopje":"wier hand men gevuld had","refs":["Ex 29:1-37","Lev 8:1","Lev 9:24","Hebr 7:28"]}],"4":[{"kopje":"Nadab","refs":["Num 26:61","Lev 10:1","Lev 10:2"]}],"7":[{"kopje":"waarnemen","refs":["Num 3:32","Nu ilies;</span> <span class=\"wl wl-kjv\" data-code=\"H6019\">Amram,</span> and <span class=\"wl wl-kjv\" data-code=\"H3324\">Izehar,</span> <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> and Uzziel.","20":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4847\">Merari</span> by their <span class=\"wl wl-kjv\" data-code=\"H4940\">families;</span> <span class=\"wl wl-kjv\" data-code=\"H4249\">Mahli,</span> and <span class=\"wl wl-kjv\" data-code=\"H4187\">Mushi.</span> These <span class=\"wl wl-kjv\" data-code=\"H1992\">are</span> the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their fathers.","21":"Of <span class=\"wl wl-kjv\" data-code=\"H1648\">Gershon</span> was the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H3846\">Libnites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H8097\">Shimites:</span> these are the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the Gershonites.","22":"Those that were <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> of them, according to the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of all the <span class=\"wl wl-kjv\" data-code=\"H2145\">males,</span> from a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> even those that were <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> of them were <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> hundred.","23":"The <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H1649\">Gershonites</span> shall <span class=\"wl wl-kjv\" data-code=\"H2583\">pitch</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> westward.","24":"And the <span class=\"wl wl-kjv\" data-code=\"H5387\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of the <span class=\"wl wl-kjv\" data-code=\"H1649\">Gershonites</span> shall be <span class=\"wl wl-kjv\" data-code=\"H460\">Eliasaph</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Lael.","25":"And the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1648\">Gershon</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle,</span> and the <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> the <span class=\"wl wl-kjv\" data-code=\"H4372\">covering</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H4539\">hanging</span> for the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation,","26":"And the <span class=\"wl wl-kjv\" data-code=\"H7050\">hangings</span> of the <span class=\"wl wl-kjv\" data-code=\"H2691\">court,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4539\">curtain</span> for the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H2691\">court,</span> which is by the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle,</span> and by the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4340\">cords</span> of it for all the service","27":"And of <span class=\"wl wl-kjv\" data-code=\"H6955\">Kohath</span> was the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H6020\">Amramites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H3325\">Izeharites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H2276\">Hebronites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H5817\">Uzzielites:</span> these are the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the Kohathites.","28":"In the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of all the <span class=\"wl wl-kjv\" data-code=\"H2145\">males,</span> from a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> were <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keeping</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the sanctuary.","29":"The <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6955\">Kohath</span> shall <span class=\"wl wl-kjv\" data-code=\"H2583\">pitch</span> on the <span class=\"wl wl-kjv\" data-code=\"H3409\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> southward.","30":"And the <span class=\"wl wl-kjv\" data-code=\"H5387\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H6956\">Kohathites</span> shall be <span class=\"wl wl-kjv\" data-code=\"H469\">Elizaphan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Uzziel.","31":"And their <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H727\">ark,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7979\">table,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4501\">candlestick,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary</span> wherewith they <span class=\"wl wl-kjv\" data-code=\"H8334\">minister,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4539\">hanging,</span> and all the service","32":"And <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5387\">chief</span> over the <span class=\"wl wl-kjv\" data-code=\"H5387\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and have the <span class=\"wl wl-kjv\" data-code=\"H6486\">oversight</span> of them that <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the sanctuary.","33":"Of <span class=\"wl wl-kjv\" data-code=\"H4847\">Merari</span> was the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H4250\">Mahlites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H4188\">Mushites:</span> these are the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of Merari.","34":"And those that were <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> of them, according to the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of all the <span class=\"wl wl-kjv\" data-code=\"H2145\">males,</span> from a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> were <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and two hundred.","35":"And the <span class=\"wl wl-kjv\" data-code=\"H5387\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of <span class=\"wl wl-kjv\" data-code=\"H4847\">Merari</span> was <span class=\"wl wl-kjv\" data-code=\"H6700\">Zuriel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H32\">Abihail:</span> these shall <span class=\"wl wl-kjv\" data-code=\"H2583\">pitch</span> on the <span class=\"wl wl-kjv\" data-code=\"H3409\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> northward.","36":"And under the <span class=\"wl wl-kjv\" data-code=\"H6486\">custody</span> and <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4847\">Merari</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H7175\">boards</span> of the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1280\">bars</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H134\">sockets</span> thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> thereof, and all that serveth","37":"And the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> of the <span class=\"wl wl-kjv\" data-code=\"H2691\">court</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> and their <span class=\"wl wl-kjv\" data-code=\"H134\">sockets,</span> and their <span class=\"wl wl-kjv\" data-code=\"H3489\">pins,</span> and their cords.","38":"But those that <span class=\"wl wl-kjv\" data-code=\"H2583\">encamp</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> toward the <span class=\"wl wl-kjv\" data-code=\"H6924\">east,</span> even <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H4217\">eastward,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keeping</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> for the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2114\">stranger</span> that cometh <span class=\"wl wl-kjv\" data-code=\"H7131\">nigh</span> shall be put to death.","39":"All that were <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> which <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> at the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> throughout their <span class=\"wl wl-kjv\" data-code=\"H4940\">families,</span> all the <span class=\"wl wl-kjv\" data-code=\"H2145\">males</span> from a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> were <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> thousand.","40":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">Number</span> all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of the <span class=\"wl wl-kjv\" data-code=\"H2145\">males</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> from a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of their names.","41":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> for me (I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD)</span> instead of all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> among the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and the <span class=\"wl wl-kjv\" data-code=\"H929\">cattle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> instead of all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstlings</span> among the <span class=\"wl wl-kjv\" data-code=\"H929\">cattle</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","42":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him, all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> among the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","43":"And all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> <span class=\"wl wl-kjv\" data-code=\"H2145\">males</span> by the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of <span class=\"wl wl-kjv\" data-code=\"H8034\">names,</span> from a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> of those that were <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> of them, were <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">thirteen.</span>","44":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","45":"<span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> instead of all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> among the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H929\">cattle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> instead of their <span class=\"wl wl-kjv\" data-code=\"H929\">cattle;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> shall be mine: I am the LORD.","46":"And for those that are to be <span class=\"wl wl-kjv\" data-code=\"H6302\">redeemed</span> of the two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">thirteen</span> of the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which are <span class=\"wl wl-kjv\" data-code=\"H5736\">more</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">than</span> the Levites;","47":"Thou shalt even <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> apiece by the <span class=\"wl wl-kjv\" data-code=\"H1538\">poll,</span> after the <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> them: (the <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel</span> is <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> gerahs:)","48":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> wherewith the odd <span class=\"wl wl-kjv\" data-code=\"H5736\">number</span> of them is to be <span class=\"wl wl-kjv\" data-code=\"H6302\">redeemed,</span> unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and to his sons.","49":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H6306\">redemption</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of them that were <span class=\"wl wl-kjv\" data-code=\"H5736\">over</span> and above them that were <span class=\"wl wl-kjv\" data-code=\"H6302\">redeemed</span> by the Levites:","50":"Of the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> he the <span class=\"wl wl-kjv\" data-code=\"H3701\">money;</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> shekels, after the <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel</span> of the sanctuary:","51":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of them that were <span class=\"wl wl-kjv\" data-code=\"H6302\">redeemed</span> unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and to his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H6310\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"geboorten van Aäron en Mozes;","tekst":"Versta door geboorten, het verhaal, niet alleen van enige personen, als van Mozes en Aäron, mitsgaders zijn zonen en de Levieten, maar ook van hetgeen onder hen door Gods ordinantie zich toegedragen heeft. Alzo is dit woord genomen Gen 6:9, en Gen 25:19; zie ook Gen 37:2, met de aantekeningen daarop."}],"3":[{"catchword":"welker hand men","tekst":"Dat is, die men gewijd had tot de bediening des priesterdoms. Zie de verklaring van deze manier van spreken Lev 7:37, idem zie Exo 28:41, en Exo 29:9."}],"4":[{"catchword":"voor het aangezicht des HEEREN,","tekst":"Zie Lev 10:2."},{"catchword":"vreemd vuur","tekst":"Zie Lev 10:1."},{"catchword":"voor het aangezicht van hun vader Aäron","tekst":"Dat is, terwijl hun vader nog in het leven was. Zie gelijke manier van spreken Gen 11:28."}],"7":[{"catchword":"waarnemen zijn wacht,","tekst":"Of, zijn bevel en last onderhouden. Hebreeuws, onderhouden zijn onderhouding. Zie dezelfde manier van spreken, onder, vs.8, 28, 32, 38, en Num 9:19, idem, zie Lev 8:35."},{"catchword":"gehele vergadering,","tekst":"Dat is, die de gehele vergadering moesten waarnemen, in wier naam de eerstgeborenen der Israëlieten tevoren de bezorging hadden, gelijk Exo 19:22 te zien is. Maar nu voortaan wordt dit ambt den Levieten opgelegd. Zie boven, Num 1:53, en vergelijk onder, vs.38, en Num 16:9."}],"8":[{"catchword":"der kinderen Israëls waarnemen,","tekst":"Dat is, die de kinderen Israëls tevoren zelf door hun eerstgeborenen te bewaren toestond."}],"10":[{"catchword":"vreemde, die nadert,","tekst":"Dat is, die niet is van het priesterlijke huis, denwelken het niet geoorloofd was het priesterambt te bedienen. Zie ook onder, vs.38, en Num 16:40, idem, vergelijk Lev 22:10."}],"12":[{"catchword":"die de baarmoeder opent,","tekst":"Hebreeuws, opening der baarmoeder; zo worden genaamd de mensen en beesten, die het eerst uit hunne moeder geboren worden; Exo 13:2, en Exo 34:19, en onder, Num 18:15."}],"15":[{"catchword":"een maand oud en daarboven,","tekst":"Hebreeuws, van een zoon der maand. De telling der Levieten was drieërlei:&lt;i&gt;I.&lt;/i&gt; Van een maand oud en daarboven, wanneer zij den Heere toegeheiligd werden, van welke gesproken wordt vs.15, en onder vs.40;&lt;i&gt;II.&lt;/i&gt; Van vijf en twintig jaren oud en daarboven, toen zij gesteld werden om het gemene werk des tabernakels als nieuwe aankomelingen te bedienen; zie van dezen onder, Num 8:24;&lt;i&gt;III.&lt;/i&gt; Van dertig jaren oud en daarboven, welke waren de voornaamsten, niet alleen in de bediening des tabernakels, maar ook in het verdragen van denzelven en zijn gereedschap. Zie van dezen onder, Num 4:3, welke, tot vijftig jaren gekomen zijnde, vrij waren van hun dienst, hoewel zij de anderen met hun autoriteit, opzicht, beleid en raad moesten bijstand doen; onder, Num 8:25-26."}],"16":[{"catchword":"bevel des HEEREN,","tekst":"Hebreeuws, mond. Zie Gen 41:40; Exo 17:1, en onder, vs.39."}],"17":[{"catchword":"Kahath,","tekst":"Hebreeuws, Kehath. Anders ook genoemd Kohath, gelijk in het volgende vs.29, enz."}],"22":[{"catchword":"een maand oud en daarboven;","tekst":"Hebreeuws, van een zoon der maand, en zo in het volgende."}],"23":[{"catchword":"westwaarts","tekst":"Hebreeuws, ter zeewaarts. Zie boven, Num 2:18."}],"25":[{"catchword":"wacht","tekst":"Hebreeuws, bewaring, of waarneming; dat is, hetgeen zij bewaren of waarnemen moesten."},{"catchword":"der zonen van Gerson","tekst":"De last van deze en der andere Levieten wordt in dit hoofdstuk kortelijk aangewezen, maar in het volgende breder beschreven."},{"catchword":"de tabernakel en de tent,","tekst":"Versta door den namen tabernakel en tent al de gordijnen, behangselen en bedekselen, tot denzelven beneden en boven behorende, die van de Gersonieten gedragen moesten worden."}],"28":[{"catchword":"waarnemende de wacht","tekst":"Zie boven, vs.17."}],"29":[{"catchword":"zuidwaarts","tekst":"Het zuiden heeft bij de Hebreën zijn naam van de rechterhand, omdat degenen, die zich met het aangezicht wenden naar het oosten, het zuiden aan de rechterhand hebben."}],"31":[{"catchword":"altaren","tekst":"Versta, het reukaltaar en het brandofferaltaar, gelijk te zien is onder, Num 4:11, Num 4:13, waarvan het ene in den voorhof en het andere in het heilige stond."},{"catchword":"zij dienst doen,","tekst":"Namelijk, de priesters."},{"catchword":"deksel,","tekst":"Versta hiermede het voorhangsel, onderscheidende het heilige van het allerheiligste, mitsgaders de dekselen van welke wij lezen onder, Num 4:5-7, enz."},{"catchword":"zijn dienst behoort.","tekst":"Hebreeuws, zijn dienst; dat is, zijn gereedschap, tuig, vaten en wat er toe behoort. Vergelijk onder, Num 4:26."}],"32":[{"catchword":"De overste","tekst":"Deze was gesteld over de oversten der Levieten, en was de voornaamste naast den hogepriester, die in tijd van nood zijn plaats bewaarde. Zie 1Ki 4:4; zijnde hierom genaamd de tweede priester; 2Ki 25:18."},{"catchword":"der oversten van Levi","tekst":"Van dezen waren er drie, uit elk geslacht van Levi een: namelijk, Eljasaf, uit het geslacht van Gerson, boven, vs.24, en Elisafan uit het geslacht van Kohath, vs.30, en Zuriël, uit het geslacht van Merari, vs.35."},{"catchword":"zijn opzicht","tekst":"Namelijk, van Eleazar, die de overste der oversten van de Levieten was. Anders, dit is het ambt dergenen, die de wacht des heiligdoms waarnemen; houdende deze woorden een besluit te zijn van het verhaal des ambts der Kohathieten."},{"catchword":"die de wacht des heiligdoms","tekst":"Dat is, die in den godsdienst enig ambt of last hebben."}],"36":[{"catchword":"de berderen des tabernakels,","tekst":"Dewijl de Merarieten meerder last te dragen hadden dan de Gersonieten, gelijk af te nemen is uit de vergelijking van dit en het volgende vs. Met de voorgaande verz.25,26, zo zijn aan de Merarieten tot uitvoering van hun dienst vier wagens en acht runderen gegeven, maar den Gersonieten niet meer dan twee wagens met vier runderen. Zie onder, Num 7:7-8."}],"38":[{"catchword":"voor de wacht der kinderen Israëls;","tekst":"Dat is, de plaats van de wacht, die de kinderen Israëls anders hadden moeten waarnemen. Zie boven, vs.7."},{"catchword":"en de vreemde die nadert,","tekst":"Zie boven, vs.10."}],"39":[{"catchword":"twee en twintig duizend","tekst":"Zo men vs.22, 28, 34 inziet, zal men bevinden dat het getal der Gersonieten is geweest 7500, der Kohathieten 8600, en der Merarieten 6200, makende samen het getal van 22.300, even 300 meer dan hier in dit vs. vermeld worden; maar men moet weten dat bij het getal van 22.000 de priesters, zijnde uit het geslacht van Kohath, en daarna de eerstgeborenen der Levieten mede bijgevoegd moeten worden, die, overmits zij [samen 300 zijnde] den priesters niet gegeven waren, als Gode op een bijzondere wijze eigen blijvende, Exo 13:2; en de andere eerstgeborenen niet kunnende lossen dewijl zij zelf eerstgeborenen waren, zo worden terecht maar 22.000 hier in rekening gebracht, als niet meer den priesters gegeven zijnde."}],"45":[{"catchword":"Levieten,","tekst":"Namelijk, die 22.000 getelden, van welke men zie boven, vs.39."}],"46":[{"catchword":"overschieten,","tekst":"Want het getal der Levieten was maar 22.000, vs.39, en der eerstgeborenen was twee en twintig duizend, twee honderd drie en zeventig, vs.43."}],"47":[{"catchword":"voor elk hoofd","tekst":"Hebreeuws, vijf vijf sikkelen; naar den kop, of het bekkeneel"},{"catchword":"naar den sikkel des heiligdoms","tekst":"Zie Gen 20:16, en Gen 23:15."},{"catchword":"gera","tekst":"Zie Lev 27:25."}],"49":[{"catchword":"die overschoten","tekst":"Welke waren in getal twee honderd drie en zeventig, gelijk in het voorgaande gemeld wordt, en dienvolgens moesten zoveel eerstgeborenen met geld gelost worden. Vergelijk de aantekeningen vs.46."}],"50":[{"catchword":"de eerstgeborenen","tekst":"Te weten, die overig waren boven het getal der Levieten."},{"catchword":"duizend driehonderd vijf en zestig sikkelen,","tekst":"Elk hoofd der twee honderd drie en zeventig eerstgeborenen, die boven de Levieten overig waren, moest tot zijn lossing vijf sikkelen geven, boven, vs.47, waarom het voorgemelde getal, met vijf vermenigvuldigd zijnde, deze som uitbrengt."}],"51":[{"catchword":"bevel des HEEREN,","tekst":"Hebreeuws, mond."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"These now are the Birth&acirc;&euro;&trade;s (Generations) of Aaron and Moseh; [Understand hereby the relation or rehearsal not onely of some particular persons, as Moseh and Aaron, together with his sons and the Levites, but likewise of that which through God&acirc;&euro;&trade;s Ordinance fell out and came to pass amongst them: Thus the Word Birth, or Generations is likewise taken, Gen. 6. 9. And 25. 18. See likewise chap. 37. 2. With the Annotations thereon] on the day (when) the LORD spoke with Moseh, on Mount Sinai."}],"2":[{"catchword":null,"tekst":"And these are the names of the sons of Aaron, the first-born Nadab; after that Abihu, Eleazar and Ithamar."}],"3":[{"catchword":null,"tekst":"These are the Names of the sons of Aaron the Priests (in the plural) which were anointed, whose hands were filled to administer the Priesthood. [i.e. who were consecrated for the service of the Priesthood. See the explaining of this kind of speaking, Lev. 7. On verse 37. Item see Exod. 28. 41. And 29. 9.]"}],"4":[{"catchword":null,"tekst":"But Nadab and Abihu died before the face of the LORD, [see Lev. 10. On 2.] when they brought strange fire before the face of the LORD, [see Lev. 10. On verse 1.] In the wilderness of Sinai, and had no Children, but ELeazar and Ithamar administered the Priestly office, before the face of their father Aaron. [i.e. in their father&acirc;&euro;&trade;s lifetime, see the like phrase, Gen. 11. 28.]"}],"5":[{"catchword":null,"tekst":"And the LORD spoke to Moseh, saying;"}],"6":[{"catchword":null,"tekst":"Cause the Tribe of Levi to approach, and put him before the face of Aaron the Priest, that they may serve him."}],"7":[{"catchword":null,"tekst":"And that they observe his guard [Or, keep his orders and command, Heb. Keep his keeping, see the like below, vers. 8. 28, 32, 38. And chap. 9. 19. Item see Lev. 8. On verse 35.] and the guard of the whole Congregation, [i.e. which the whole Congregation otherwise was to observe and keep, in whose name the first born of the Israelites had formerly attended this charge, as appears Exod. 19. 22. But now it was laid on the Levites, see above chap. 1. 53. And compare below here verse 38. And chap. 16. 9.] Before the Tabernacle of the Congregation, for to administer the service of the Tabernacle."}],"8":[{"catchword":null,"tekst":"And that they take care of all the furniture of the Tent of the Congregation, and the Guard of the Children of Israel, [i.e. that which formerly belonged to the care of the Children of Israel, by their first born] to administer the service of the Tabernacle."}],"9":[{"catchword":null,"tekst":"Thou shalt then give the Levites unto Aaron and his sons; they are given, they are given him out of the Children of Israel."}],"10":[{"catchword":null,"tekst":"But Aaron and his sons thou shalt place, that they take care of their Priests office, and the stranger which approacheth shall be put to death. [i.e. He that is not of the Priestly house or off-spring, to whom it was not at all permitted, to administer the Priests office, see likewise below verse 38. And chap 16. Verse 40. Item compare Lev. 22. Verse 10.]"}],"11":[{"catchword":null,"tekst":"And the LORD spoke to Moseh, saying;"}],"12":[{"catchword":null,"tekst":"And I behold, I have taken the Levites out of the midst of the children of Israel; in stead of all the first-born that openeth the womb, [Heb. The opening of the womb: thus both men and beast, the first that come forth out of the womb of their mothers and dams, are called in Scripture, Exod. 13. 2. And 34. 19. And below chap. 18. 15.] Out of the Children of Israel, and the Levites shall be mine."}],"13":[{"catchword":null,"tekst":"For all (or, every) first-born is mine; from that day that I smote all the first-born in the land of Egypt, have I hallowed me all the first-born in the land of Egypt, have I hallowed me all the first-born in Israel, from the men to the beasts: they shall be mine, I am the LORD."}],"14":[{"catchword":null,"tekst":"And the LORD spoke to Moseh in the Wilderness of Sinai, saying;"}],"15":[{"catchword":null,"tekst":"number the sons of Levi, by the house of their Fathers, according to their Families; all the is male, from one month old and upwards, them thou shall number. [Heb. From a son of the month. The numbering of the Levites was threefold. 1. From one month old and upwards, at which time they were hallowed to the LORD, whereof our text here speaketh, and below verse 40. 2. From 25 year old and upwards who were the principal, not only in the administration of the Tabernacle, but likewise in the transportation thereof and its furniture, of which see below chap. 4. 3. Who having attained to the fiftieth year, they then were exempted from further attendance in this kind, and onely obliged to assist the rest with their authority, inspection, direction and advice, below chap. 8. Verse 25. 26.]"}],"17":[{"catchword":null,"tekst":"These now were the sons of Levi; by their names Gerson and Kahath, [Heb. Kehath otherwise also called Kohath, as in the following 19. Verse, etc.] And Merari."}],"18":[{"catchword":null,"tekst":"And these are the names of the sons of Gerson, by their Families, Libni and Simei."}],"19":[{"catchword":null,"tekst":"And the sons of Kohath, by th function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);

  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
