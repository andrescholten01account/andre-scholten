 hun vleugels op en verhieven zich van de aarde omhoog voor mijn ogen, toen zij naar buiten gingen; en de raderen waren tegenover hen; en elk bleef staan bij de deur van de Oostpoort van het huis van de HEERE; en de heerlijkheid van de God van Israël was van boven over hen.", "Ex 40:2": "Op de dag van de eerste maand, namelijk op de eerste van de maand, zult u de tabernakel, de tent der samenkomst, oprichten.", "Joz 22:2": "En hij zei tegen hen: U hebt alles onderhouden wat Mozes, de dienaar van de HEERE, u geboden heeft; en u bent mijn stem gehoorzaam geweest in alles wat ik u geboden heb.", "Num 18:8": "Verder sprak de HEERE tot Aäron: En Ik, zie, Ik heb u gegeven de wacht van Mijn hefoffers, met alle heilige dingen van de kinderen van Israël heb Ik ze u gegeven, vanwege de zalving, en aan uw zonen, tot een eeuwige inzetting.", "1 Joh 2:17": "En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Lev 5:2": "Of wanneer een mens iets onreins zal hebben aangeraakt, hetzij het dode aas van een wild onrein dier, of het dode aas van onrein vee, of het dode aas van onrein kruipend gedierte; ook al is het voor hem verborgen geweest, toch is hij onrein en schuldig.", "Num 12:10": "En de wolk week weg van boven de tent; en zie, Mirjam was melaats, wit als de sneeuw. En Aäron keek naar Mirjam, en zie, zij was melaats.", "Num 15:34": "En zij stelden hem in bewaring; want het was niet duidelijk gemaakt wat hem gedaan moest worden.", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Tit 2:15": "Spreek dit, en vermaan, en bestraf met alle ernst. Laat niemand u minachten.", "Hebr 11:8": "Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou.", "Luk 1:6": "En zij waren beiden rechtvaardig voor God, en wandelden onberispelijk in alle geboden en voorschriften van de Heere.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "1 Joh 5:3": "Want dit is de liefde van God, dat wij Zijn geboden bewaren; en Zijn geboden zijn niet zwaar.", "Ex 12:10": "U moet daarvan ook niets laten overblijven tot de morgen; maar wat daarvan overblijft tot de morgen, moet u met vuur verbranden.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Ex 16:10": "En het gebeurde, toen Aäron tegen de hele gemeenschap van de Israëlieten sprak, en zij zich naar de woestijn keerden, zie, daar verscheen de heerlijkheid van de HEERE in de wolk.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "2 Kon 18:6": "Want hij kleefde de HEERE aan; hij week niet van Hem af om Hem na te volgen, en hij hield Zijn geboden, die de HEERE aan Mozes geboden had.", "Ex 33:15": "Toen zei hij tegen Hem: Als Uw aangezicht niet meegaat, laat ons dan van hier niet optrekken!", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Ex 23:15": "Het feest van de ongezuurde broden zult u houden; zeven dagen zult u ongezuurde broden eten (zoals Ik u geboden heb), op de vastgestelde tijd in de maand Abib, want in die maand bent u uit Egypte getrokken; en men zal niet met lege handen voor Mijn aangezicht verschijnen.", "Ex 12:43": "Vervolgens zei de HEERE tot Mozes en Aäron: Dit is de inzetting van het pascha: geen zoon van een vreemdeling mag daarvan eten.", "Ex 19:1": "In de derde maand na het uittrekken van de kinderen van Israël uit Egypteland, op diezelfde dag kwamen zij in de woestijn Sinaï.", "Ex 34:22": "Het feest van de weken zult u ook houden, namelijk het feest van de eerstelingen van de tarweoogst, en het feest van de inzameling, als het jaar om is.", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Luk 11:28": "Maar Hij zei: Ja, gelukkiger zijn zij die het Woord van God horen, en het bewaren.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Lev 7:21": "En wanneer een ziel iets onreins aangeraakt zal hebben, zoals de onreinheid van een mens, of het onreine vee, of enig onrein verfoeisel, en zal van het vlees van het dankoffer, dat van de HEERE is, gegeten hebben, dan zal die ziel uit haar volk uitgeroeid worden.", "Ex 40:38": "Want de wolk van de HEERE was overdag op de tabernakel, en het vuur was er 's nachts op, voor de ogen van heel het huis van Israël, op al hun tochten.", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "1 Kor 4:21": "Wat wilt u? Zal ik met de roede naar u toe komen, of in liefde en in de geest van zachtmoedigheid?", "2 Kor 2:10": "Wie u iets vergeeft, die vergeef ik ook; want als ik ook iets vergeven heb, heb ik dat, wie ik het ook vergaf, vergeven om u, voor het aangezicht van Christus,", "Deut 22:13-29": "Wanneer een man een vrouw genomen heeft, en tot haar ingegaan is, en haar dan haat, En haar oorzaak geeft tot naspraak, en een kwade naam over haar verspreidt, en zegt: Deze vrouw heb ik genomen, en toen ik tot haar naderde, heb ik haar maagdelijkheid niet gevonden; Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.", "Ps 80:3": "Wek Uw macht op voor het aangezicht van Efraïm, en Benjamin, en Manasse, en kom tot onze verlossing.", "Lev 17:10": "En ieder uit het huis van Israël, en uit de vreemdelingen, die in hun midden als vreemdelingen verkeren, die enig bloed zal gegeten hebben, tegen diens ziel, die dat bloed zal gegeten hebben, zal Ik Mijn aangezicht keren, en zal die uit het midden van haar volk uitroeien.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "Mark 4:20": "En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Ezra 6:19": "Ook hielden de kinderen van de wegvoering het pascha, op de veertiende van de eerste maand.", "Lev 11:24-28": "En hierdoor zult u onrein worden: wie hun kadaver aangeraakt zal hebben, zal onrein zijn tot de avond. Wie van hun kadaver gedragen zal hebben, zal zijn kleren wassen, en onrein zijn tot de avond. Elk dier dat de klauw verdeelt, maar de klauwen niet in tweeën gespleten heeft, en niet herkauwt, zal voor u onrein zijn; wie het aangeraakt zal hebben, zal onrein zijn.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Jes 6:4": "Zodat de posten van de dorpels bewogen door de stem van hem die riep; en het huis werd vervuld met rook.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Ex 14:20": "En zij kwam tussen het leger van de Egyptenaren en tussen het leger van Israël; en de wolk was tegelijk duisternis en verlichtte de nacht; zodat de een tot de ander niet naderde de hele nacht.", "Joh 15:10": "Als u Mijn geboden bewaart, dan zult u in Mijn liefde blijven; zoals Ik de geboden van Mijn Vader bewaard heb, en blijf in Zijn liefde.", "Openb 12:17": "En de draak werd toornig op de vrouw, en ging heen om oorlog te voeren tegen de overigen van haar nageslacht, die de geboden van God bewaren, en de getuigenis van Jezus Christus hebben.", "Openb 22:7": "Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart.", "2 Kron 30:3": "Zeker, zij hadden het niet kunnen houden op diezelfde tijd, omdat de priesters zich niet genoeg geheiligd hadden, en het volk zich niet verzameld had te Jeruzalem.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Num 9:2-5": "Dat de kinderen van Israël het pascha houden zouden, op zijn vastgestelde tijd. Op de veertiende dag in deze maand, tussen twee avonden, zult u dat houden, op zijn vastgestelde tijd; naar al zijn inzettingen, en naar al zijn rechten zult u dat houden. Mozes dan sprak tot de kinderen van Israël, dat zij het pascha zouden houden.", "Num 10:8": "En de zonen van Aäron, de priesters, zullen met die trompetten blazen; en zij zullen u zijn tot een eeuwige inzetting bij uw geslachten.", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Ps 119:10": "Ik zoek U met mijn hele hart, laat mij van Uw geboden niet afdwalen.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Openb 10:7": "maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Ezech 2:7": "Maar u zult Mijn woorden tot hen spreken, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen; want zij zijn opstandig.", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "Hand 1:4": "En toen Hij met hen vergaderd was, beval Hij hun dat zij niet uit Jeruzalem weg zouden gaan, maar de belofte van de Vader verwachten, die u, zei Hij, van Mij gehoord hebt.", "Ex 13:21": "En de HEERE ging voor hun aangezicht uit, overdag in een wolkkolom om hen de weg te leiden, en 's nachts in een vuurkolom om hen licht te geven, zodat zij dag en nacht konden voortgaan.", "1 Kron 28:12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "Num 15:35": "Toen zei de HEERE tot Mozes: Die man zal zeker gedood worden; de hele vergadering zal hem met stenen stenigen buiten het leger.", "1 Tess 5:14": "En wij bidden u, broeders, vermaan de ongeregelde mensen, vertroost de kleinmoedigen, ondersteun de zwakken, wees geduldig tegenover allen.", "Deut 2:31": "En de HEERE zei tegen mij: Zie, Ik heb begonnen Sihon en zijn land aan u over te geven; begin het dan te bezitten, om zijn land in erfelijk bezit te nemen.", "Lev 25:2-12": "Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer u in het land gekomen zult zijn, dat Ik u geef, dan zal dat land rusten, een sabbat voor de HEERE. Zes jaar zult u uw akker bezaaien, en zes jaar uw wijngaard snoeien, en de opbrengst daarvan inzamelen. Maar in het zevende jaar zal voor het land een sabbat van rust zijn, een sabbat voor de HEERE; uw akker zult u niet bezaaien en uw wijngaard niet snoeien.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Num 22:12": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend.", "Ex 40:34": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel.", "1 Kon 6:1": "Het gebeurde nu in het vierhonderdtachtigste jaar, na de uittocht van de kinderen van Israël uit Egypte, in het vierde jaar van het koninkrijk van Salomo over Israël, in de maand Ziv (dat is de tweede maand), dat hij het huis van de HEERE bouwde.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "2 Tim 4:2": "Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs.", "Num 16:19": "En Korach liet de hele vergadering tegen hen verzamelen bij de deur van de tent van de samenkomst. Toen verscheen de heerlijkheid van de HEERE aan deze hele vergadering.", "Ps 25:10": "Caph. Alle paden van de HEERE zijn goedertierenheid en waarheid, voor hun die Zijn verbond en Zijn getuigenissen bewaren.", "Matt 25:20-23": "En hij die de vijf talenten ontvangen had, kwam, en bracht hem andere vijf talenten, en zei: Heer, vijf talenten hebt u mij gegeven; zie, andere vijf talenten heb ik daarbij gewonnen. En zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht! Over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer. En hij die de twee talenten ontvangen had, kwam ook, en zei: Heer, twee talenten hebt u mij gegeven; zie, twee andere talenten heb ik daarbij gewonnen.", "Ps 48:15": "Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.", "Num 10:33-36": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren. En de wolk van de HEERE was overdag over hen, als zij uit het leger vertrokken. Het gebeurde nu bij het optrekken van de ark, dat Mozes zei: Sta op, HEERE! En laat Uw vijanden verstrooid worden, en laat Uw haters van Uw aangezicht vluchten!", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Ex 12:2": "Deze maand zal voor u het begin van de maanden zijn; zij zal voor u de eerste van de maanden van het jaar zijn.", "Rom 14:1": "Neem hem aan die zwak is in het geloof, maar niet tot twistige samensprekingen.", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Luk 11:2": "En Hij zei tegen hen: Wanneer u bidt, zegt dan: Onze Vader, Die in de hemelen bent! Uw Naam worde geheiligd. Laat Uw Koninkrijk komen. Uw wil geschiede, zoals in de hemel, zo ook op de aarde.", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "2 Kor 6:3": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt.", "Ps 119:47": "En ik zal mij vermaken in Uw geboden, die ik liefheb.", "Lev 24:11": "Toen lasterde de zoon van de Israëlitische vrouw uitdrukkelijk de NAAM, en vloekte; daarom brachten zij hem tot Mozes; de naam van zijn moeder nu was Selomith, de dochter van Dibri, van de stam Dan.", "Ps 106:30": "Toen stond Pinehas op, en hij voerde het oordeel uit, en de plaag werd opgehouden.", "Lev 22:4-8": "Niemand van het nageslacht van Aäron die melaats is, of een vloed heeft, zal van die heilige dingen eten, totdat hij rein is; alsook wie iets aanraakt dat onrein is door een dood lichaam, of een man aan wie het zaad van de gemeenschap ontgaat. Of wie ook maar enig kruipend gedierte zal hebben aangeraakt waardoor hij onrein wordt, of een mens waardoor hij onrein wordt, naar al zijn onreinheid; De mens die dat zal hebben aangeraakt, zal onrein zijn tot aan de avond, en hij zal van die heilige dingen niet eten, maar zal zijn lichaam met water baden.", "Ef 2:2": "waarin u eertijds gewandeld hebt, naar de eeuw van deze wereld, naar de leider van de macht van de lucht, van de geest die nu werkt in de kinderen van de ongehoorzaamheid;", "Lev 22:4": "Niemand van het nageslacht van Aäron die melaats is, of een vloed heeft, zal van die heilige dingen eten, totdat hij rein is; alsook wie iets aanraakt dat onrein is door een dood lichaam, of een man aan wie het zaad van de gemeenschap ontgaat.", "2 Kor 6:14": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis?", "Ps 119:44": "Zo zal ik Uw wet voortdurend onderhouden, eeuwig en altijd.", "Ex 12:3-49": "Spreekt tot de hele vergadering van Israël en zeg: Op de tiende dag van deze maand moet ieder een lam nemen, naar de huizen van de vaderen, een lam voor een huis. Maar als een huis te klein is voor een lam, dan moet hij het samen met zijn buurman, die het dichtst bij zijn huis woont, nemen, naar het aantal zielen; ieder naar wat hij eten kan, zo moet u het rekenen voor het lam. U moet een volkomen lam hebben, een mannetje, een jaar oud; van de schapen of van de geitenbokken moet u het nemen.", "Dan 2:19": "Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.", "Ex 20:9-11": "Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is; want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Num 29:40": "En Mozes sprak tot de kinderen van Israël naar alles wat de HEERE Mozes geboden had.", "Num 6:7": "Om zijn vader of om zijn moeder, om zijn broeder of om zijn zuster, om hen zal hij zich niet verontreinigen, als zij dood zijn; want het Nazireeërschap van zijn God is op zijn hoofd.", "2 Kron 15:1": "Toen kwam de Geest van God op Azaria, de zoon van Oded.", "Ex 12:43-49": "Vervolgens zei de HEERE tot Mozes en Aäron: Dit is de inzetting van het pascha: geen zoon van een vreemdeling mag daarvan eten. Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten. Geen uitlander noch huurling mag ervan eten.", "Matt 13:23": "Maar die in de goede aarde bezaaid is, dit is degene die het woord hoort en begrijpt, die ook vrucht draagt en voortbrengt, de een honderdvoud, de ander zestigvoud, en de ander dertigvoud.", "Gal 3:28": "Daarin is geen Jood en geen Griek; daarin is geen slaaf en geen vrije; daarin is geen man en vrouw; want u bent allen één in Christus Jezus.", "Deut 21:22": "Verder, wanneer iemand een zonde heeft begaan die de doodstraf verdient, zodat hij gedood wordt, en u hem aan het hout hebt opgehangen;", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Deut 33:9": "Die tegen zijn vader en tegen zijn moeder zei: Ik zie hem niet; en die zijn broeders niet kende, en zijn zonen niet achtte; want zij onderhielden Uw woord, en bewaarden Uw verbond.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "Ps 119:55": "HEERE! 's nachts ben ik Uw Naam indachtig geweest, en heb Uw wet bewaard.", "2 Kon 21:8": "En Ik zal niet langer de voet van Israël laten wankelen uit dit land, dat Ik hun vaderen gegeven heb; alleen als zij nauwlettend doen naar alles wat Ik hun geboden heb, en naar de hele wet die Mijn dienaar Mozes hun geboden heeft.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "1 Tim 5:2": "De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Jer 11:18": "De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.", "Ezech 11:24": "Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.", "Lev 15:2-13": "Spreek tot de kinderen van Israël, en zeg tegen hen: Iedere man, als hij een vloed heeft uit zijn vlees, zal om zijn vloed onrein zijn. Dit nu zal zijn onreinheid zijn om zijn vloed: of zijn vlees zijn vloed laat druppelen, of zijn vlees van zijn vloed zich verstopt, dat is zijn onreinheid. Elk bed waarop hij, die de vloed heeft, zal liggen, zal onrein zijn, en al het voorwerp waarop hij zal zitten, zal onrein zijn.", "Ezech 10:3": "De cherubs nu stonden aan de rechterzijde van het huis, toen die man naar binnen ging; en een wolk vervulde de binnenste voorhof.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Num 5:2-4": "Gebied de kinderen van Israël dat zij uit het leger wegzenden alle melaatsen, en alle vloeiende, en allen die onrein zijn van een dode. Van de man tot de vrouw toe zult u hen wegzenden; tot buiten het leger zult u hen wegzenden; zodat zij hun legers niet verontreinigen, in welker midden Ik woon. En de kinderen van Israël deden zo, en zonden hen tot buiten het leger; zoals de HEERE tot Mozes gesproken had, zo deden de kinderen van Israël.", "Ps 119:109": "Mijn ziel is voortdurend in mijn hand; nochtans vergeet ik Uw wet niet.", "Joh 7:17": "Als iemand de wil van Hem wil doen, zal hij van deze leer weten of ze uit God is, of dat Ik uit Mijzelf spreek.", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Ex 39:43": "Mozes nu bezag het gehele werk, en zie, zij hadden het gemaakt zoals de HEERE geboden had; zo hadden zij het gemaakt. Toen zegende Mozes hen.", "Deut 17:2-13": "Wanneer in uw midden, in een van uw poorten die de HEERE, uw God, u geeft, een man of vrouw gevonden wordt die doet wat kwaad is in de ogen van de HEERE, uw God, door Zijn verbond te overtreden, Doordat hij heengaat en andere goden dient, en zich voor die buigt, of voor de zon, of voor de maan, of voor het hele leger van de hemel, wat ik niet geboden heb; En het wordt u aangezegd, en u hoort het; dan moet u het goed onderzoeken; en zie, het is de waarheid, de zaak staat vast, zo'n gruwel is in Israël gedaan;", "Ps 119:45": "En ik zal wandelen in de ruimte, omdat ik Uw bevelen gezocht heb.", "Ezra 7:10": "Want Ezra had zijn hart erop gericht om de wet van de HEERE te zoeken en te doen, en om in Israël de inzettingen en de rechten te leren.", "Joh 10:3-5": "Voor hem doet de deurwachter open, en de schapen horen zijn stem; en hij roept zijn eigen schapen bij naam, en leidt ze naar buiten. En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen. Maar een vreemde zullen zij nooit volgen, maar zij zullen van hem wegvluchten; omdat zij de stem van de vreemden niet kennen.", "Ex 33:10": "Toen het volk de wolkkolom in de deur van de tent zag staan, stond al het volk op, en zij bogen zich, ieder in de deur van zijn tent.", "Num 33:38": "Toen ging de priester Aäron de berg Hor op, naar het bevel van de HEERE, en stierf daar, in het veertigste jaar na de uittocht van de kinderen van Israël uit het land Egypte, in de vijfde maand, op de eerste dag van de maand.", "Lev 15:16-28": "Verder, een man bij wie het zaad van het bijliggen zal zijn uitgegaan, die zal zijn hele vlees met water baden, en onrein zijn tot aan de avond. Ook elk kledingstuk, en elk vel, waaraan het zaad van het bijliggen zal zijn, dat zal met water gewassen worden, en onrein zijn tot aan de avond. Alsook de vrouw, als een man met het zaad van het bijliggen bij haar gelegen zal hebben; daarom zullen zij zich beiden met water baden, en onrein zijn tot aan de avond.", "Lev 17:14-16": "Want het is de ziel van alle vlees; zijn bloed is voor zijn ziel; daarom heb Ik tegen de kinderen van Israël gezegd: U zult het bloed van geen enkel vlees eten; want de ziel van alle vlees, dat is zijn bloed; wie dat eet, zal uitgeroeid worden. En elke ziel onder de inboorlingen of onder de vreemdelingen, die een dood aas of het verscheurde zal gegeten hebben, die zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond; daarna zal hij rein zijn. Maar als hij die niet wast, en zijn vlees niet baadt, zo zal hij zijn ongerechtigheid dragen.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Ex 34:5": "De HEERE nu kwam neerwaarts in een wolk, en stelde Zich daar bij hem; en Hij riep de Naam van de HEERE uit.", "Num 15:30": "Maar de ziel die iets doet met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt de HEERE; en die ziel zal uitgeroeid worden uit het midden van haar volk;", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Ex 13:3": "Verder zei Mozes tegen het volk: Denk aan deze dag, waarop u uit Egypte, uit het diensthuis, gegaan bent; want de HEERE heeft u door een sterke hand van hier uitgevoerd; daarom mag het gedesemde niet gegeten worden.", "Matt 17:5": "Terwijl hij nog sprak, zie, een lichtende wolk overschaduwde hen; en zie, een stem uit de wolk zei: Dit is Mijn geliefde Zoon, in wie Ik Mijn welbehagen heb; luister naar Hem!", "Num 9:1-5": "En de HEERE sprak tot Mozes in de woestijn van Sinaï, in het tweede jaar, nadat zij uit Egypteland uitgetogen waren, in de eerste maand, en Hij zei: Dat de kinderen van Israël het pascha houden zouden, op zijn vastgestelde tijd. Op de veertiende dag in deze maand, tussen twee avonden, zult u dat houden, op zijn vastgestelde tijd; naar al zijn inzettingen, en naar al zijn rechten zult u dat houden.", "1 Sam 19:20": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.", "Num 28:16": "En in de eerste maand, op de veertiende dag van de maand, is het Pascha voor de HEERE.", "Ex 40:18": "Want Mozes richtte de tabernakel op, en zette zijn voetstukken, en plaatste zijn planken, en zette zijn richels daaraan, en hij richtte zijn pilaren op.", "Num 28:26": "Ook op de dag van de eerstelingen, als u een nieuw spijsoffer de HEERE zult offeren naar uw weken, zult u een heilige samenkomst hebben; geen dienstwerk zult u doen.", "Ezech 33:14-16": "Als Ik ook tegen de goddeloze zeg: U zult zeker sterven! en hij zich van zijn zonde bekeert en recht en gerechtigheid doet; Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven. Aan al zijn zonden die hij gezondigd heeft, zal niet meer gedacht worden; hij heeft recht en gerechtigheid gedaan, hij zal zeker leven.", "Amos 9:1": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.", "Fil 3:7-14": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Ef 2:13": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus.", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Ex 35:2": "Zes dagen zal men het werk doen; maar op de zevende dag zal het voor u heiligheid zijn, een sabbat van rust voor de HEERE; ieder die daarop werk doet, zal gedood worden.", "Lev 24:22": "Eén recht zult u hebben; zo zal het gelden voor de vreemdeling als voor de geboren Israëliet; want Ik ben de HEERE, uw God!", "Ex 12:49": "Eén wet zal er zijn voor de ingeborene, en voor de vreemdeling die als vreemdeling in uw midden verblijft.", "Num 27:5-11": "En Mozes bracht hun rechtszaak voor de HEERE. En de HEERE zei tegen Mozes: De dochters van Zelafead spreken terecht; u zult hun zeker een bezitting geven als erfenis, onder de broers van hun vader; en u zult de erfenis van hun vader op hen laten overgaan.", "Ex 13:22": "Hij nam de wolkkolom overdag, en de vuurkolom 's nachts, niet weg van voor het aangezicht van het volk.", "Num 10:11": "En het gebeurde in het tweede jaar, in de tweede maand, op de twintigste van de maand, dat de wolk omhoog gebracht werd van boven de tabernakel van de getuigenis.", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Num 29:7": "En op de tiende dag van deze zevende maand zult u een heilige samenkomst hebben, en u zult uw zielen verootmoedigen; geen werk zult u doen;", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Ezech 8:1": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.", "Joh 20:23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Mark 2:14": "En terwijl Hij voorbijging, zag Hij Levi, de zoon van Alfeüs, in het tolhuis zitten, en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Num 8:20": "En Mozes deed, en Aäron, en de hele vergadering van de kinderen van Israël, aan de Levieten, naar alles wat de HEERE Mozes geboden had over de Levieten; zo deden de kinderen van Israël aan hen.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "Ezech 11:4": "Daarom, profeteer tegen hen; profeteer, o mensenkind!", "Ex 23:15-18": "Het feest van de ongezuurde broden zult u houden; zeven dagen zult u ongezuurde broden eten (zoals Ik u geboden heb), op de vastgestelde tijd in de maand Abib, want in die maand bent u uit Egypte getrokken; en men zal niet met lege handen voor Mijn aangezicht verschijnen. En het feest van de oogst, van de eerste vruchten van uw arbeid, die u op het veld gezaaid zult hebben. En het feest van de inzameling, aan het einde van het jaar, wanneer u de opbrengst van uw arbeid van het veld ingezameld zult hebben. Drie keer per jaar zullen al uw mannen voor het aangezicht van de Heere HEERE verschijnen.", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Ezech 2:1": "En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Joh 15:14": "U bent Mijn vrienden, als u doet wat Ik u gebied.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ezech 3:22": "En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.", "Ps 119:104-106": "Uit Uw bevelen krijg ik verstand, daarom haat ik alle leugenpaden. Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad. Ik heb gezworen, en zal het bevestigen, dat ik onderhouden zal de rechten van Uw gerechtigheid.", "Luk 12:37": "Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Luk 8:21": "Maar Hij antwoordde en zei tegen hen: Mijn moeder en Mijn broers zijn zij die Gods Woord horen en het doen.", "Joz 22:3": "U hebt uw broeders niet verlaten, nu al deze tijd, tot op deze dag toe; maar u hebt de onderhouding van de geboden van de HEERE, uw God, waargenomen.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Ps 17:3": "U hebt mijn hart geproefd, 's nachts bezocht, U hebt mij getoetst. U vindt niets; wat ik gedacht heb, overtreedt mijn mond niet.", "Joh 8:28": "Jezus zei dan tegen hen: Wanneer u de Zoon des mensen verhoogd zult hebben, dan zult u weten dat Ik Die ben, en dat Ik niets uit Mijzelf doe; maar Ik spreek deze dingen zoals Mijn Vader Mij geleerd heeft.", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "Ex 12:6": "En u moet het bewaren tot de veertiende dag van deze maand; en de hele gemeente van de vergadering van Israël zal het slachten tussen de twee avonden.", "2 Kron 30:2-15": "Want de koning had overlegd met zijn leiders en de hele gemeente te Jeruzalem, om het pascha te houden in de tweede maand. Zeker, zij hadden het niet kunnen houden op diezelfde tijd, omdat de priesters zich niet genoeg geheiligd hadden, en het volk zich niet verzameld had te Jeruzalem. En deze zaak was goed in de ogen van de koning, en in de ogen van de hele gemeente.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "Luk 9:34": "Terwijl hij dit zei, kwam er een wolk en overschaduwde hen; en zij werden bang toen zij de wolk in gingen.", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "2 Kor 13:1": "Dit is de derde keer dat ik naar u toe kom; op grond van de verklaring van twee of drie getuigen zal elk woord vaststaan.", "Num 31:20": "Ook moet u alle kleding, en alle voorwerpen van vellen, en alle werk van geitenhaar, en voorwerpen van hout, ontzondigen.", "Ps 119:33": "He. HEERE! leer mij de weg van Uw inzettingen, en ik zal hem houden tot het einde toe.", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "2 Tess 3:14": "Maar als iemand ons woord, geschreven door deze brief, niet gehoorzaam is, tekent hem aan; en ga niet met hem om, opdat hij beschaamd wordt;", "Num 9:6-12": "Toen waren er mannen geweest, die over het dode lichaam van een mens onrein waren, en op diezelfde dag het pascha niet hadden kunnen houden; daarom naderden zij voor het aangezicht van Mozes, en voor het aangezicht van Aäron op diezelfde dag. En diezelfde mannen zeiden tot hem: Wij zijn onrein over het dode lichaam van een mens; waarom zouden wij ervan uitgesloten worden, dat wij de offerande van de HEERE op zijn vastgestelde tijd niet zouden offeren, te midden van de kinderen van Israël? En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal.", "Openb 22:6": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.", "2 Kor 7:8": "Want hoewel ik u in de brief bedroefd heb, heb ik daar geen berouw over, hoewel ik er wel berouw over heb gehad; want ik zie dat die brief, al was het maar voor een korte tijd, u bedroefd heeft.", "Luk 1:70": "zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Ex 6:28": "Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.", "Ps 25:14": "Samech. De verborgenheid van de HEERE is voor hen die Hem vrezen; en Zijn verbond, om het hun bekend te maken.", "Ex 40:16": "Mozes nu deed het naar alles wat de HEERE hem geboden had; zo deed hij het.", "Num 9:17-23": "Maar nadat de wolk werd opgeheven van boven de tent, zo trokken daarna ook de kinderen van Israël verder; en op de plaats waar de wolk bleef, daar legerden de kinderen van Israël zich. Naar het bevel van de HEERE trokken de kinderen van Israël verder, en naar het bevel van de HEERE legerden zij zich; al de dagen dat de wolk over de tabernakel bleef, legerden zij zich. En als de wolk veel dagen over de tabernakel verbleef, dan namen de kinderen van Israël de wacht van de HEERE waar, en trokken niet verder.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Deut 21:1-9": "Wanneer in het land, dat de HEERE, uw God, u geven zal om dat te erven, iemand gevonden wordt die gedood is, liggend in het veld, zonder dat bekend is wie hem gedood heeft; Dan zullen uw oudsten en uw rechters uitgaan, en zij zullen meten naar de steden die rondom de gedode liggen. De stad nu die het dichtst bij de gedode ligt, daar zullen de oudsten van die stad een jonge koe nemen waarmee niet gewerkt is, die aan het juk niet getrokken heeft.", "Num 14:14": "en zij zullen het zeggen tegen de inwoners van dit land, die gehoord hebben dat U, HEERE, in het midden van dit volk bent; dat U, HEERE, oog in oog gezien wordt, dat Uw wolk over hen staat, en U voor hun aangezicht gaat in een wolkkolom overdag, en in een vuurkolom 's nachts.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Rom 15:8-19": "En ik zeg dat Jezus Christus een dienaar van de besnijdenis geworden is, vanwege de waarheid van God, opdat Hij de beloften aan de vaderen zou bevestigen; en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen. En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk!", "Hand 4:19": "Maar Petrus en Johannes antwoordden hun: Oordeelt u zelf, of het recht is voor God, meer naar u te luisteren dan naar God.", "Deut 2:4": "En gebied het volk: U zult doortrekken langs het gebied van uw broeders, de kinderen van Ezau, die in Seir wonen; zij zullen wel voor u vrezen; maar u zult u zeer wachten.", "1 Joh 3:22": "en wat wij ook bidden, ontvangen wij van Hem, omdat wij Zijn geboden bewaren en doen wat welgevallig is voor Hem.", "Ps 119:22": "Wentel van mij smaad en verachting, want ik heb Uw getuigenissen onderhouden.", "Ps 119:87": "Zij hebben mij bijna vernietigd op de aarde, maar ik heb Uw bevelen niet verlaten.", "1 Sam 3:1": "En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.", "Num 9:11-21": "In de tweede maand, op de veertiende dag, tussen de twee avonden, zullen zij dat houden; met ongezuurde broden en bittere kruiden zullen zij dat eten. Zij zullen daarvan niets overlaten tot de morgen, en zullen daaraan geen been breken; naar alle inzetting van het pascha zullen zij dat houden. Als een man, die rein is, en niet op reis is, en nalaat het pascha te houden, dan zal die ziel uit haar volk uitgeroeid worden; want hij heeft de offerande van de HEERE op zijn vastgestelde tijd niet geofferd, die man zal zijn zonde dragen.", "2 Kor 10:1-11": "Verder, ik Paulus zelf bid u, door de zachtmoedigheid en goedertierenheid van Christus, die – tegenwoordig zijnde – wel gering ben onder u, maar afwezig stout ben tegen u; Ik bid dan, dat ik, tegenwoordig zijnde, niet stout hoef te zijn met die vrijmoedigheid, waarmee ik denk stout te moeten optreden tegen sommigen, die ons zo beoordelen alsof wij naar het vlees wandelden. Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Num 19:11-16": "Wie een dode aanraakt, welk dood lichaam van een mens dan ook, die zal zeven dagen onrein zijn. Op de derde dag zal hij zich daarmee ontzondigen, dan zal hij op de zevende dag rein zijn; maar als hij zich op de derde dag niet ontzondigt, dan zal hij op de zevende dag niet rein zijn. Ieder die een dode, het dode lichaam van een mens die gestorven is, aanraakt, en zich niet ontzondigd zal hebben, die verontreinigt de tabernakel van de HEERE; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water van de afzondering niet op hem gesprenkeld is, zal hij onrein zijn; zijn onreinheid is nog in hem.", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "Ex 24:7": "En hij nam het boek van het verbond, en hij las het voor de oren van het volk; en zij zeiden: Al wat de HEERE gesproken heeft, zullen wij doen en gehoorzamen.", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Hand 23:1": "En Paulus keek de raad recht aan en zei: Mannen broeders! Ik heb met een geheel goed geweten voor God geleefd tot op deze dag.", "1 Joh 2:3-6": "En hieraan weten wij, dat wij Hem gekend hebben, als wij Zijn geboden bewaren. Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet; Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Num 10:34": "En de wolk van de HEERE was overdag over hen, als zij uit het leger vertrokken.", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "1 Kor 5:4-7": "In de Naam van onze Heere Jezus Christus, wanneer u en mijn geest samen vergaderd zijn, met de kracht van onze Heere Jezus Christus, Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus. Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Gen 6:9": "Dit zijn de afstammelingen van Noach. Noach was een rechtvaardig, oprecht man onder zijn tijdgenoten. Noach wandelde met God.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Deut 1:5": "Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:", "Lev 13:2-59": "Een mens, als er in het vel van zijn vlees een gezwel, of gezweer, of witte blaar zal zijn, welke in het vel van zijn vlees tot een plaag van de melaatsheid zou worden, hij zal dan naar de priester Aäron, of naar een van zijn zonen, de priesters, gebracht worden. En de priester zal de plaag in het vel van het vlees bekijken; als het haar in die plaag in wit veranderd is, en het aanzien van de plaag dieper is dan het vel van zijn vlees, is het de plaag van de melaatsheid; als de priester hem bekeken zal hebben, zal hij hem onrein verklaren. Maar als de blaar in het vel van zijn vlees wit is, en haar aanzien niet dieper is dan het vel, en het haar niet in wit veranderd is, zal de priester hem, die de plaag heeft, zeven dagen opsluiten.", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "2 Tess 3:15": "En houd hem niet als een vijand, maar vermaan hem als een broeder.", "Dan 7:16": "Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.", "Deut 16:2": "Dan zult u de HEERE, uw God, het pascha slachten, schapen en runderen, in de plaats die de HEERE zal uitkiezen om Zijn Naam daar te doen wonen.", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "Lev 14:34-48": "Als u gekomen zult zijn in het land Kanaän, dat Ik u tot bezitting geven zal, en Ik de plaag van de melaatsheid aan een huis van dat land van uw bezitting gegeven zal hebben, zal hij, van wie dat huis is, komen, en het de priester te kennen geven en zeggen: Het schijnt mij, alsof er een plaag in het huis is. En de priester zal gebieden dat zij dat huis ruimen, voordat de priester komt om die plaag te bezien, zodat niet alles wat in dat huis is onrein wordt; en daarna zal de priester komen om dat huis te bezien.", "Num 1:52": "En de kinderen van Israël zullen zich legeren, ieder bij zijn eigen leger, en ieder bij zijn eigen banier, naar hun legers.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Num 28:16-25": "En in de eerste maand, op de veertiende dag van de maand, is het Pascha voor de HEERE. En op de vijftiende dag van die maand is het feest; zeven dagen zullen ongezuurde broden gegeten worden. Op de eerste dag zal een heilige samenkomst zijn; geen dienstwerk zult u doen;", "2 Joh 1:6": "En dit is de liefde, dat wij wandelen naar Zijn geboden. Dit is het gebod, zoals u van het begin af aan gehoord hebt, dat u daarin zou wandelen.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Ps 119:4-6": "Heere! U hebt geboden, dat men Uw bevelen zeer bewaren zal. Och, dat mijn wegen gericht werden, om Uw inzettingen te bewaren! Dan zou ik niet beschaamd worden, wanneer ik letten zou op al Uw geboden.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Ps 119:51": "De hoogmoedigen hebben mij boven mate zeer bespot; nochtans ben ik van Uw wet niet geweken.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "Hebr 12:25": "Zie erop toe dat u Hem, Die spreekt, niet verwerpt; want als dezen niet ontkomen zijn, die hem verwierpen die op aarde Goddelijke antwoorden gaf, hoeveel te meer zullen wij niet ontkomen, als wij ons afkeren van Hem Die van de hemelen is;", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Ex 40:37": "Maar als de wolk niet opgeheven werd, dan reisden zij niet, tot op de dag dat zij opgeheven werd.", "Mark 14:12": "En op de eerste dag van de ongezuurde broden, wanneer zij het pascha slachtten, zeiden Zijn discipelen tegen Hem: Waar wilt U dat wij heengaan en voorbereiden, dat U het pascha eet?", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "Ex 12:15": "Zeven dagen moet u ongezuurde broden eten; maar op de eerste dag moet u het zuurdeeg wegdoen uit uw huizen; want wie het gedesemde eet, van de eerste dag af tot de zevende dag, die ziel zal uitgeroeid worden uit Israël.", "Ex 12:14": "En deze dag zal voor u een gedachtenis zijn, en u zult hem als een feest voor de HEERE vieren; u zult hem vieren onder uw geslachten, als een eeuwige inzetting.", "Ex 34:18": "Het feest van de ongezuurde broden zult u houden; zeven dagen zult u ongezuurde broden eten, zoals Ik u geboden heb, op de vastgestelde tijd van de maand Abib; want in de maand Abib bent u uit Egypte weggetrokken.", "Num 19:11": "Wie een dode aanraakt, welk dood lichaam van een mens dan ook, die zal zeven dagen onrein zijn.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Joh 10:3": "Voor hem doet de deurwachter open, en de schapen horen zijn stem; en hij roept zijn eigen schapen bij naam, en leidt ze naar buiten.", "1 Kron 28:19": "Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.", "Ps 119:167": "Mijn ziel onderhoudt Uw getuigenissen, en ik heb ze zeer lief.", "Ef 2:12": "dat u in die tijd was zonder Christus, vervreemd van het burgerschap van Israël, en vreemdelingen van de verbonden van de belofte, geen hoop hebbend, en zonder God in de wereld.", "2 Kron 30:2": "Want de koning had overlegd met zijn leiders en de hele gemeente te Jeruzalem, om het pascha te houden in de tweede maand.", "Jer 42:4": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "Ef 3:6-9": "namelijk dat de heidenen medeerfgenamen zijn, en van hetzelfde lichaam, en mededeelgenoten van Zijn belofte in Christus, door het Evangelie; waarvan ik een dienaar geworden ben, naar de gave van de genade van God, die mij gegeven is, naar de werking van Zijn kracht. Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "Rom 13:2": "Zodat hij die zich tegen de macht stelt, de instelling van God weerstaat; en zij die weerstaan, zullen over zichzelf een oordeel halen.", "Deut 5:31": "Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.", "1 Tim 5:19": "Neem tegen een ouderling geen beschuldiging aan, dan alleen op grond van twee of drie getuigen.", "Ex 12:48": "Als nu een vreemdeling bij u verblijft, en het pascha voor de HEERE wil houden, dan moet alles wat mannelijk is bij hem besneden worden, en dan mag hij daartoe komen om dat te houden, en hij zal zijn als een ingeborene van het land; maar geen onbesnedene mag daarvan eten.", "Ex 17:1": "Daarna trok de hele gemeenschap van de kinderen van Israël, volgens hun dagreizen, uit de woestijn Sin, op bevel van de HEERE, en zij legerden zich bij Rafidim. Daar was echter geen water voor het volk om te drinken.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Jer 22:3": "Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "Num 23:21": "Hij ziet geen ongerechtigheid in Jakob; ook ziet Hij geen boosheid in Israël. De HEERE, zijn God, is met hem, en het geschal van de Koning is bij hem.", "Ps 119:100-102": "Ik ben voorzichtiger dan de ouden, omdat ik Uw bevelen bewaard heb. Ik heb mijn voeten geweerd van alle kwade paden, opdat ik Uw woord zou onderhouden. Ik ben niet geweken van Uw rechten, want U hebt mij geleerd.", "Joh 9:35": "Jezus hoorde dat zij hem eruit geworpen hadden, en toen Hij hem vond, zei Hij tegen hem: Gelooft u in de Zoon van God?", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "Lev 14:8": "Die nu te reinigen is, zal zijn kleren wassen, en al zijn haar afscheren, en zich in het water afwassen, dan zal hij rein zijn; daarna zal hij in het leger komen, maar zal buiten zijn tent zeven dagen blijven.", "Ezra 10:1-44": "Terwijl Ezra zo bad en deze belijdenis deed, huilend en zich voor het huis van God neerwerpend, verzamelde zich bij hem uit Israël een zeer grote gemeente van mannen, vrouwen en kinderen; want het volk huilde met groot geween. Toen antwoordde Sechanja, de zoon van Jehiel, een van de zonen van Elam, en zei tegen Ezra: Wij hebben overtreden tegen onze God, en wij hebben vreemde vrouwen van de volken van het land bij ons laten wonen; maar nu is er hoop voor Israël wat dit betreft. Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet.", "Lev 22:6": "De mens die dat zal hebben aangeraakt, zal onrein zijn tot aan de avond, en hij zal van die heilige dingen niet eten, maar zal zijn lichaam met water baden.", "Joh 9:22": "Dit zeiden zijn ouders, omdat zij de Joden vreesden; want de Joden hadden al met elkaar afgesproken dat als iemand beleed dat Hij de Christus was, die uit de synagoge geworpen zou worden.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Ex 40:36": "Als nu de wolk opgeheven werd van boven de tabernakel, dan reisden de kinderen van Israël verder op al hun tochten.", "Matt 13:8": "En een ander deel viel in de goede aarde, en gaf vrucht, het ene honderdvoud, het andere zestigvoud, en het andere dertigvoud.", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "Tit 1:13": "Deze getuigenis is waar. Daarom, bestraf hen scherp, opdat zij gezond mogen zijn in het geloof.", "Lev 20:20": "Als ook een man gemeenschap heeft met de vrouw van zijn oom, heeft hij de schaamte van zijn oom ontdekt; zij zullen hun zonde dragen; zonder kinderen zullen zij sterven.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Num 15:33": "En zij die hem hout zagen lezen, brachten hem tot Mozes en tot Aäron en tot de hele vergadering.", "Ezech 10:4": "Toen hief de heerlijkheid van de HEERE zich omhoog van boven de cherub, naar de drempel van het huis; en het huis werd vervuld met een wolk, en het voorhof was vol van de glans van de heerlijkheid van de HEERE.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Ex 18:19": "Hoor nu naar mijn stem, ik zal u raad geven, en God zal met u zijn; wees u voor het volk bij God, en breng u de zaken voor God;", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Num 15:29": "Voor de inboorling van de kinderen van Israël en de vreemdeling die in hun midden als vreemdeling verblijft, zal één wet gelden, voor hem die het door afdwaling doet.", "Ex 12:2-14": "Deze maand zal voor u het begin van de maanden zijn; zij zal voor u de eerste van de maanden van het jaar zijn. Spreekt tot de hele vergadering van Israël en zeg: Op de tiende dag van deze maand moet ieder een lam nemen, naar de huizen van de vaderen, een lam voor een huis. Maar als een huis te klein is voor een lam, dan moet hij het samen met zijn buurman, die het dichtst bij zijn huis woont, nemen, naar het aantal zielen; ieder naar wat hij eten kan, zo moet u het rekenen voor het lam.", "Matt 16:19": "En Ik zal u de sleutels geven van het Koninkrijk der hemelen; en alles wat u zult binden op de aarde, zal in de hemelen gebonden zijn; en alles wat u zult ontbinden op de aarde, zal in de hemelen ontbonden zijn.", "Deut 23:10": "Wanneer iemand onder u is die niet rein is door iets wat hem 's nachts is overkomen, dan zal hij naar buiten, tot buiten het leger gaan; hij zal niet tot binnen het leger komen.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "Ps 143:10": "Leer mij Uw welbehagen doen, want Gij zijt mijn God; Uw goede Geest leidt mij in een effen land.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Gal 6:1": "Broeders, als een mens door een misdaad vervallen is, moet u, die geestelijk bent, hem die zo is terechtbrengen met een geest van zachtmoedigheid; en let daarbij op uzelf, zodat ook u niet in verzoeking komt.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "Ex 30:37": "Maar het reukwerk dat u volgens dit recept gemaakt hebt, mag u voor uzelf niet namaken; het zal u heilig zijn, voor de HEERE.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Lev 23:4-8": "Deze zijn de vaste feesttijden van de HEERE, de heilige samenkomsten, die u uitroepen zult op hun vastgestelde tijd. In de eerste maand, op de veertiende van de maand, tussen twee avonden is het pascha van de HEERE. En op de vijftiende dag van diezelfde maand is het feest van de ongezuurde broden van de HEERE; zeven dagen zult u ongezuurde broden eten.", "Num 14:10": "Toen zei de hele vergadering dat men hen met stenen zou stenigen. Maar de heerlijkheid van de HEERE verscheen in de tent van de samenkomst, voor al de kinderen van Israël.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Deut 16:16": "Driemaal in het jaar zal alles wat mannelijk onder u is, verschijnen voor het aangezicht van de HEERE, uw God, in de plaats die Hij zal uitkiezen: op het feest van de ongezuurde broden, en op het feest van de weken, en op het feest van de loofhutten; maar men zal niet met lege handen verschijnen voor het aangezicht van de HEERE.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Lev 14:3": "En de priester zal het leger uit gaan; als de priester merkt dat, zie, die plaag van de melaatsheid van de melaatse genezen is,", "2 Tess 3:6": "En wij bevelen u, broeders, in de Naam van onze Heere Jezus Christus, dat u zich onttrekt van iedere broeder die ongeregeld wandelt, en niet naar de overlevering die hij van ons ontvangen heeft.", "Gen 6:22": "En Noach deed het; naar alles wat God hem geboden had, zo deed hij.", "Ex 39:32": "Zo werd al het werk van de tabernakel, van de tent der samenkomst, voltooid; en de kinderen van Israël hadden het gemaakt naar alles wat de HEERE aan Mozes geboden had; zo hadden zij het gemaakt.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "2 Kron 30:15": "Toen slachtten zij het pascha, op de veertiende dag van de tweede maand; en de priesters en de Levieten waren beschaamd geworden, en hadden zich geheiligd, en hadden brandoffers gebracht in het huis van de HEERE.", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Neh 9:19": "Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "Joh 17:8": "Want de woorden die U Mij gegeven hebt, heb Ik hun gegeven, en zij hebben ze ontvangen, en zij hebben werkelijk erkend dat Ik van U ben uitgegaan, en hebben geloofd dat U Mij gezonden hebt.", "Jak 2:10-12": "Want wie de hele wet houdt, en in één ding struikelt, die is schuldig geworden aan alle geboden. Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden. Spreek zo, en doe zo, als mensen die door de wet van de vrijheid geoordeeld zullen worden.", "Ps 119:54-56": "Uw inzettingen zijn mij gezangen geweest, ter plaatse van mijn vreemdelingschap. HEERE! 's nachts ben ik Uw Naam indachtig geweest, en heb Uw wet bewaard. Dat is mij gebeurd, omdat ik Uw bevelen bewaard heb.", "Ex 40:36-38": "Als nu de wolk opgeheven werd van boven de tabernakel, dan reisden de kinderen van Israël verder op al hun tochten. Maar als de wolk niet opgeheven werd, dan reisden zij niet, tot op de dag dat zij opgeheven werd. Want de wolk van de HEERE was overdag op de tabernakel, en het vuur was er 's nachts op, voor de ogen van heel het huis van Israël, op al hun tochten.", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Ps 101:3": "Ik zal geen slechte zaak voor mijn ogen stellen; ik haat het doen van de afvalligen, het zal mij niet aankleven.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ex 32:25-29": "Toen Mozes zag dat het volk losbandig was geworden (want Aäron had het losbandig laten worden tot spot voor hun tegenstanders), bleef Mozes staan in de poort van het kamp en zei: Wie de HEERE toebehoort, kom bij mij! Toen verzamelden alle zonen van Levi zich bij hem. En hij zei tegen hen: Zo zegt de HEERE, de God van Israël: Ieder doe zijn zwaard om zijn heup; ga heen en weer, van poort tot poort in het kamp, en ieder dode zijn broeder, en elk zijn vriend, en elk zijn naaste!", "Ps 103:18": "Over hen die Zijn verbond houden, en die aan Zijn bevelen denken, om die te doen.", "Joh 10:9": "Ik ben de Deur; als iemand door Mij ingaat, zal hij behouden worden; en hij zal ingaan en uitgaan, en weide vinden.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Ps 103:21": "Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet!", "Num 29:1": "Ook in de zevende maand, op de eerste dag van de maand, zult u een heilige samenkomst hebben; geen dienstwerk zult u doen; het zal u een dag van het geschal zijn.", "Lev 14:54-57": "Dit is de wet voor elke plaag van de melaatsheid, en voor schurftheid; en voor melaatsheid van de kleren, en van de huizen; alsook voor gezwel, en voor gezweer, en voor blaren;", "Num 10:12": "En de kinderen van Israël trokken op naar hun tochten, uit de woestijn Sinaï; en de wolk bleef in de woestijn Paran.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Num 5:2": "Gebied de kinderen van Israël dat zij uit het leger wegzenden alle melaatsen, en alle vloeiende, en allen die onrein zijn van een dode.", "2 Kor 6:15": "En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige?", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Luk 2:9": "En zie, een engel van de Heere stond bij hen, en de heerlijkheid van de Heere omscheen hen, en zij werden zeer bevreesd.", "Deut 16:1-8": "Neem waar dat het de maand Abib is, als u de HEERE, uw God, pascha viert; want in de maand Abib heeft de HEERE, uw God, u bij nacht uit Egypteland uitgevoerd. Dan zult u de HEERE, uw God, het pascha slachten, schapen en runderen, in de plaats die de HEERE zal uitkiezen om Zijn Naam daar te doen wonen. U zult daarbij niets eten van het gedesemd; zeven dagen zult u daarbij ongezuurde broden eten, brood van de ellende (want u bent in haast uit Egypteland getrokken), opdat u gedenkt aan de dag van uw uittrekken uit Egypteland, alle dagen van uw leven.", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "Deut 13:12-18": "Wanneer u van een van uw steden, die de HEERE, uw God, u geeft om daar te wonen, zult horen zeggen: Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt; dan zult u onderzoeken, en naspeuren, en goed navragen; en zie, als het de waarheid is, de zaak zeker vaststaat, zo'n gruwel in uw midden gedaan is;", "Lev 23:5": "In de eerste maand, op de veertiende van de maand, tussen twee avonden is het pascha van de HEERE.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Ex 18:15": "Toen zei Mozes tegen zijn schoonvader: Omdat dit volk tot mij komt om God raad te vragen.", "Ps 81:4": "Blaast de bazuin in de nieuwe maan, op de bestemde tijd, op onze feestdag.", "Matt 9:9": "En toen Jezus vandaar verder ging, zag Hij een man in het tolhuis zitten, genaamd Mattheüs; en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Luk 2:8": "En er waren herders in diezelfde landstreek, die in het veld verbleven en 's nachts de wacht hielden over hun kudde.", "Ex 15:25": "Hij dan riep tot de HEERE; en de HEERE wees hem een stuk hout, dat wierp hij in het water; toen werd het water zoet. Daar stelde Hij het volk een inzetting en recht, en daar beproefde Hij hen,", "Luk 8:15": "En wat in de goede aarde valt, dat zijn zij die het Woord gehoord hebben en het in een eerlijk en goed hart bewaren, en met volharding vruchten voortbrengen.", "Ex 13:10": "Houd daarom deze inzetting op de vastgestelde tijd, van jaar tot jaar.", "Deut 5:12-14": "Onderhoud de sabbatdag, dat u die heiligt, zoals de HEERE, uw God, u geboden heeft. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw os, noch uw ezel, noch enig van uw vee, noch de vreemdeling die in uw poorten is; opdat uw dienstknecht en uw dienstmaagd rusten, net als u.", "Joh 18:28": "Zij leidden Jezus dan van Kajafas naar het gerechtsgebouw. En het was 's morgens vroeg; en zij zelf gingen niet naar binnen in het gerechtsgebouw, opdat zij niet verontreinigd zouden worden, maar opdat zij het pascha konden eten.", "Jes 24:5": "Want het land is bevlekt vanwege zijn inwoners; want zij overtreden de wetten, zij veranderen de inzettingen, zij vernietigen het eeuwige verbond.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">HEERE</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">sprak</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">tot</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4872\">Mozes</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4872\">in</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4057\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4057\">woestijn</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4057\">van<
