 en een weinig honing, specerijen en mirre, terpentijnnoten en amandelen.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Lev 15:20": "En alles waarop zij in haar afzondering zal hebben gelegen, zal onrein zijn; alsook alles waarop zij zal hebben gezeten, zal onrein zijn.", "Ex 34:26": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.", "Num 8:16-18": "Want zij zijn gegeven, zij zijn Mij gegeven uit het midden van de kinderen van Israël; in plaats van hen die de baarmoeder openen, in plaats van de eerstgeborenen van elk van de kinderen van Israël, heb Ik ze voor Mij genomen. Want elke eerstgeborene onder de kinderen van Israël is van Mij, onder de mensen en onder de dieren; op de dag dat Ik elke eerstgeborene in Egypteland sloeg, heb Ik ze voor Mij geheiligd. En Ik heb de Levieten genomen in plaats van alle eerstgeborenen onder de kinderen van Israël.", "Num 18:15-17": "Alles wat de baarmoeder opent, van alle vlees, dat zij de HEERE zullen brengen, onder de mensen, en onder de dieren, zal het uwe zijn; maar de eerstgeborenen van de mensen zult u helemaal lossen; ook zult u de eerstgeborenen van de onreine dieren lossen. Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera. Maar het eerstgeborene van een koe, of het eerstgeborene van een schaap, of het eerstgeborene van een geit zult u niet lossen, zij zijn heilig; hun bloed zult u sprenkelen op het altaar, en hun vet zult u aansteken, tot een vuuroffer van liefelijke reuk voor de HEERE.", "Lev 7:8": "Ook de priester die iemands brandoffer offert, die priester zal de huid van het brandoffer hebben dat hij geofferd heeft.", "Gal 6:6": "En wie onderwezen wordt in het Woord, moet delen van alle goederen met hem die hem onderwijst.", "Lev 8:30": "Mozes nam ook van de zalfolie, en van het bloed dat op het altaar was, en sprenkelde het op Aäron, op zijn kleren, en op zijn zonen, en op de kleren van zijn zonen met hem; en hij heiligde Aäron, zijn kleren, en zijn zonen, en de kleren van zijn zonen met hem.", "Lev 25:51": "Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.", "Lev 10:8": "En de HEERE sprak tegen Aäron:", "Ps 15:5": "Die zijn geld niet uitleent tegen woeker, en geen geschenk aanneemt tegen de onschuldige. Wie deze dingen doet, zal niet wankelen in eeuwigheid.", "Jer 31:14": "En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "2 Kon 22:7": "Doch er werd met hen geen rekening gehouden van het geld dat in hun hand geleverd was, want zij handelden trouw.", "Neh 10:39": "Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "2 Kron 31:12": "Daarin brachten zij die heffing, en de tienden, en de geheiligde dingen, in trouw; en daarover was Chonanja, de Leviet, leider, en Simeï, zijn broer, de tweede.", "Num 16:5-7": "En hij sprak tot Korach en tot zijn hele vergadering, en zei: Morgenvroeg zal de HEERE bekendmaken wie van Hem is, en wie de heilige is, die Hij tot Zich zal laten naderen; en wie Hij verkoren zal hebben, die zal Hij tot Zich laten naderen. Doe dit: neem wierookvaten, Korach en uw hele vergadering; En doe morgen vuur daarin, leg reukwerk daarop voor het aangezicht van de HEERE; en het zal gebeuren dat de man die de HEERE verkiezen zal, die zal heilig zijn. Het is te veel voor u, kinderen van Levi!", "Ps 150:1": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte!", "Num 3:6-9": "Laat de stam van Levi naderen, en stel hem voor het aangezicht van de priester Aäron, opdat zij hem dienen; En dat zij zijn wacht waarnemen, en de wacht van de hele vergadering, voor de tent der samenkomst, om de dienst van de tabernakel te bedienen; En dat zij al het gereedschap van de tent der samenkomst, en de wacht van de kinderen van Israël waarnemen, om de dienst van de tabernakel te bedienen.", "Hebr 5:4": "En niemand neemt zichzelf die eer toe, maar hij die door God geroepen wordt, zoals Aäron.", "Lev 24:9": "En het zal voor Aäron en zijn zonen zijn, die het op de heilige plaats zullen eten; want het is voor hem allerheiligst uit de vuuroffers van de HEERE, een eeuwige inzetting.", "Mal 4:4": "Denk aan de wet van Mozes, Mijn knecht, die Ik hem geboden heb op Horeb voor heel Israël, met de inzettingen en rechten.", "Lev 2:9": "En de priester zal van dat spijsoffer het gedenkoffer daarvan opnemen, en op het altaar aansteken; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Num 3:28": "In getal van al wat mannelijk was, van een maand oud en daarboven, waren achtduizend zeshonderd, die de wacht van het heiligdom waarnamen.", "Num 18:24-26": "Want de tienden van de kinderen van Israël, die zij de HEERE tot een hefoffer zullen offeren, heb Ik aan de Levieten tot een erfenis gegeven; daarom heb Ik tegen hen gezegd: Zij zullen te midden van de kinderen van Israël geen erfenis erven. En de HEERE sprak tot Mozes en zei: U zult ook tot de Levieten spreken, en tegen hen zeggen: Wanneer u van de kinderen van Israël de tienden zult hebben ontvangen, die Ik u voor uw erfenis van hen gegeven heb, dan zult u daarvan een hefoffer voor de HEERE offeren, de tienden van die tienden;", "Num 18:3-6": "En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u. Maar zij zullen u bijgevoegd worden, en de wacht van de tent der samenkomst waarnemen, in alle dienst van de tent; en een vreemde zal u niet naderen. U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Num 1:51": "En als de tabernakel zal optrekken, zullen de Levieten hem afbreken; en wanneer de tabernakel neergezet moet worden, zullen de Levieten hem oprichten; en de vreemde die daarbij komt, zal gedood worden.", "Spr 3:9": "Vereer de HEERE met uw goed, en met de eerstelingen van al uw inkomsten;", "1 Kron 16:39": "En de priester Zadok, en zijn broeders, de priesters, voor de tabernakel van de HEERE op de hoogte, die te Gibeon is;", "Num 28:12": "En drie tienden meelbloem als spijsoffer, met olie gemengd bij de ene stier; en twee tienden meelbloem als spijsoffer, met olie gemengd, bij de ene ram;", "Ps 99:6": "Mozes en Aäron waren onder Zijn priesters, en Samuël onder de aanroepers van Zijn Naam; zij riepen tot de HEERE, en Hij verhoorde hen.", "Ex 29:27": "En u zult de borst van het beweegoffer heiligen, en de schouder van het hefoffer, die bewogen wordt, en die opgeheven zal zijn van de ram van het vuloffer, van hetgeen dat van Aäron is, en van hetgeen dat van zijn zonen is.", "1 Sam 2:14": "En sloeg die in de teil, of in de ketel, of in de pan, of in de pot; al wat de vork optrok, dat nam de priester voor zich. Zo deden zij aan alle Israëlieten die in Silo kwamen.", "Num 31:41": "En Mozes gaf Eleazar, de priester, de schatting van de heffing van de HEERE, zoals de HEERE Mozes geboden had.", "Hebr 9:1": "Zo had dan het eerste verbond wel regels van de eredienst, en het aardse heiligdom.", "Ex 12:43": "Vervolgens zei de HEERE tot Mozes en Aäron: Dit is de inzetting van het pascha: geen zoon van een vreemdeling mag daarvan eten.", "Richt 6:11": "Toen kwam een Engel van de HEERE, en ging zitten onder de eik die in Ofra is, die aan Joas, de Abiëzriet, toebehoorde; en zijn zoon Gideon dorste tarwe bij de wijnpers, om die te verbergen voor de Midianieten.", "Ex 29:28": "En het zal voor Aäron en zijn zonen zijn tot een eeuwige inzetting vanwege de kinderen van Israël; want het is een hefoffer; en het hefoffer vanwege de kinderen van Israël zal zijn van hun dankoffers; hun hefoffer zal voor de HEERE zijn.", "Joh 3:27": "Johannes antwoordde en zei: Een mens kan niets aannemen, als het hem niet uit de hemel gegeven is.", "Ezech 45:12": "En de sikkel zal zijn van twintig gera; twintig sikkels, vijfentwintig sikkels en vijftien sikkels, zal u een pond zijn.", "Lev 15:1": "Verder sprak de HEERE tot Mozes en tot Aäron, en zei:", "Num 4:17-49": "En de HEERE sprak tot Mozes en tot Aäron: U zult de stam van de geslachten van de Kohathieten niet laten uitroeien uit het midden van de Levieten; Maar dit zult u voor hen doen, opdat zij leven en niet sterven, wanneer zij tot het allerheiligste naderen: Aäron en zijn zonen zullen komen, en hen ieder aanstellen over zijn dienst en zijn last.", "Rom 15:16": "opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest.", "Lev 21:10": "En hij, die de hogepriester onder zijn broeders is, op wiens hoofd de zalfolie gegoten is, en wiens hand men gevuld heeft om die klederen aan te trekken, zal zijn hoofd niet ontbloten, en ook zijn klederen niet scheuren.", "Joz 14:3": "Want aan de twee stammen en de halve stam had Mozes een erfdeel gegeven aan de overkant van de Jordaan; maar aan de Levieten had hij geen erfdeel onder hen gegeven.", "1 Tim 1:18": "Dit gebod beveel ik u, mijn zoon Timotheüs, dat u naar de profetieën die eerder over u uitgesproken zijn, daarmee de goede strijd strijdt;", "Deut 21:14": "En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.", "Lev 7:31-34": "En de priester zal dat vet op het altaar aansteken; maar de borst zal voor Aäron en zijn zonen zijn. U zult ook de rechterschouder als hefoffer aan de priester geven, uit uw dankoffers. Wie uit de zonen van Aäron het bloed van het dankoffer en het vet offert, die zal de rechterschouder als deel toekomen.", "Deut 18:3": "Dit nu zal het recht van de priesters zijn van het volk, van hen die een offerande offeren, hetzij een os of klein vee: dat hij de priester de schouder zal geven, en beide kaken, en de pens.", "Lev 7:12-14": "Als hij dat als een lofoffer offert, zal hij naast het lofoffer ongezuurde koeken met olie gemengd, en ongezuurde vladen met olie bestreken, offeren; en die koeken met olie gemengd zullen van geroosterde meelbloem zijn. Naast de koeken zal hij tot zijn offergave gedesemd brood offeren, samen met het lofoffer van zijn dankoffers. En één daarvan uit de hele offergave zal hij de HEERE als hefoffer offeren; het zal voor de priester zijn die het bloed van het dankoffer sprenkelt.", "Neh 5:10": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "Num 3:25": "En de wacht van de zonen van Gerson in de tent der samenkomst zal zijn de tabernakel en de tent, haar deksel, en het deksel aan de deur van de tent der samenkomst;", "Gen 23:9": "Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.", "1 Kron 9:19": "En Sallum, de zoon van Kore, de zoon van Ebjasaf, de zoon van Korah, en zijn broeders van het huis van zijn vader, de Korahieten, waren over het werk van de dienst, wachters van de dorpels van de tabernakel; zoals hun vaders in het leger van de HEERE geweest waren bewaarders van de ingang;", "Hebr 6:20": "waar de Voorloper voor ons is ingegaan, namelijk Jezus, naar de ordening van Melchizedek, Hogepriester geworden in eeuwigheid.", "Lev 9:17": "En hij liet het spijsoffer toebrengen, en vulde daarvan zijn hand, en stak het aan op het altaar, behalve het morgenbrandoffer.", "Lev 5:18": "En hij zal een gaaf ram uit de kudde naar de priester brengen, naar uw schatting, als schuldoffer; en de priester zal voor hem verzoening doen over zijn onwetendheid waardoor hij afgedwaald is, zonder het te weten; zo zal het hem vergeven worden.", "Num 3:10-13": "Maar Aäron en zijn zonen zult u aanstellen, dat zij hun priesterambt waarnemen; en de vreemde die nadert, zal gedood worden. En de HEERE sprak tot Mozes en zei: En Ik, zie, Ik heb de Levieten uit het midden van de kinderen van Israël genomen, in plaats van elke eerstgeborene, die de baarmoeder opent, uit de kinderen van Israël; en de Levieten zullen van Mij zijn.", "Ex 30:7-10": "En Aäron zal daarop welriekende specerijen aansteken; elke morgen, als hij de lampen in orde heeft gebracht, zal hij ze aansteken. En als Aäron de lampen aansteekt, tussen de twee avonden, zal hij het aansteken; het zal een voortdurend reukwerk zijn, voor het aangezicht van de HEERE, bij uw geslachten. U moet geen vreemd reukwerk daarop aansteken, ook geen brandoffer, geen spijsoffer; u moet er ook geen drankoffer op gieten.", "1 Tess 2:5": "Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige!", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Lev 25:37": "Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "Num 10:8": "En de zonen van Aäron, de priesters, zullen met die trompetten blazen; en zij zullen u zijn tot een eeuwige inzetting bij uw geslachten.", "Ex 4:20": "Mozes dan nam zijn vrouw, en zijn zonen, en zette hen op een ezel, en keerde terug naar het land Egypte; en Mozes nam de staf van God in zijn hand.", "Num 2:1": "En de HEERE sprak tot Mozes en tot Aäron:", "Neh 10:37-39": "En dat wij de eerstelingen van ons deeg, en onze hefoffers, en de vrucht van alle bomen, most en olie, zouden brengen tot de priesters, in de kamers van het huis van onze God, en de tienden van ons land tot de Levieten; en dat diezelfde Levieten de tienden zouden hebben in alle steden van onze landbouw; En dat er een priester, een zoon van Aäron, bij de Levieten zou zijn, als de Levieten de tienden ontvangen; en dat de Levieten de tienden zouden opbrengen naar het huis van onze God, in de kamers van het schathuis. Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "Num 3:12": "En Ik, zie, Ik heb de Levieten uit het midden van de kinderen van Israël genomen, in plaats van elke eerstgeborene, die de baarmoeder opent, uit de kinderen van Israël; en de Levieten zullen van Mij zijn.", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "Gen 44:1-8": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "1 Kron 28:10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "Num 17:8": "Het gebeurde nu de volgende dag, dat Mozes de tent van de getuigenis inging; en zie, Aärons staf, voor het huis van Levi, bloeide; want hij bracht bloeisel voort, en bloesemde bloesem, en droeg amandelen.", "Gen 6:17": "Want Ik, zie, Ik breng een watervloed over de aarde, om alle vlees waarin een geest van het leven is, van onder de hemel te verderven; alles wat op de aarde is, zal de geest geven.", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Num 4:19": "Maar dit zult u voor hen doen, opdat zij leven en niet sterven, wanneer zij tot het allerheiligste naderen: Aäron en zijn zonen zullen komen, en hen ieder aanstellen over zijn dienst en zijn last.", "Gen 43:12-23": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Num 29:4": "En een tiende voor een lam, tot al die zeven lammeren toe;", "1 Kron 24:5": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Num 3:36": "En het opzicht van de wachten van de zonen van Merari zal zijn over de planken van de tabernakel, en zijn richels, en zijn pilaren, en zijn voeten, en al zijn gereedschap, en alles wat tot zijn dienst behoort;", "Lev 23:10": "Spreek tot de kinderen van Israël, en zeg tegen hen: Als u in het land zult gekomen zijn, dat Ik u geven zal, en u uw oogst zult inoogsten, dan zult u een schoof van de eerstelingen van uw oogst tot de priester brengen.", "Lev 7:32-34": "U zult ook de rechterschouder als hefoffer aan de priester geven, uit uw dankoffers. Wie uit de zonen van Aäron het bloed van het dankoffer en het vet offert, die zal de rechterschouder als deel toekomen. Want de beweegborst en de hefschouder heb Ik van de kinderen van Israël uit hun dankoffers genomen, en heb die aan Aäron, de priester, en aan zijn zonen gegeven, als een eeuwige inzetting, vanwege de kinderen van Israël.", "1 Tess 2:9": "Want u herinnert zich, broeders, onze inspanning en moeite; want terwijl wij nacht en dag werkten, om niemand van u tot last te zijn, hebben wij het Evangelie van God onder u gepredikt.", "Dan 9:17": "En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf.", "Matt 10:10": "Ook geen reistas voor onderweg, geen twee stel kleren, geen schoenen, geen staf; want de arbeider is zijn voedsel waard.", "Ps 63:3": "Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;", "2 Kon 5:26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "1 Tim 6:1-21": "Alle dienstknechten die onder het juk zijn, moeten hun eigen heren alle eer waardig achten, opdat de Naam van God en de leer niet gelasterd wordt. En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen. Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "Lev 23:17": "U zult uit uw woningen twee beweegbroden brengen, zij zullen van twee tienden meelbloem zijn, gedesemd zullen zij gebakken worden; het zijn de eerstelingen voor de HEERE.", "1 Kor 9:14": "Zo heeft ook de Heere geordend voor hen die het Evangelie verkondigen, dat zij van het Evangelie leven.", "1 Sam 6:19": "En de Heere sloeg onder de mensen van Beth-Semes, omdat zij in de ark van de HEERE gekeken hadden; ja, Hij sloeg van het volk zeventig mannen, en vijftigduizend mannen. Toen bedreef het volk rouw, omdat de HEERE een grote slag onder het volk geslagen had.", "Luk 10:8": "En in welke stad u ook binnengaat en zij u ontvangen, eet wat u wordt voorgezet.", "Ex 28:38": "En zij zal op het voorhoofd van Aäron zijn, opdat Aäron de ongerechtigheid draagt van de heilige dingen die de kinderen van Israël geheiligd zullen hebben, in alle gaven van hun geheiligde dingen; en zij zal voortdurend aan zijn voorhoofd zijn, om hen voor het aangezicht van de HEERE aangenaam te maken.", "Num 3:51": "En Mozes gaf dat geld van de gelosten aan Aäron en aan zijn zonen, naar het bevel van de HEERE, zoals de HEERE Mozes geboden had.", "1 Kon 21:15": "Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.", "Num 4:15": "Als Aäron en zijn zonen het dekken van het heiligdom, en van al het gereedschap van het heiligdom, bij het optrekken van het leger, voltooid hebben, dan zullen daarna de zonen van Kohath komen om te dragen; maar zij zullen dat heilige niet aanraken, opdat zij niet sterven. Dit is de last van de zonen van Kohath, in de tent der samenkomst.", "Dan 11:31": "En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "Deut 18:15": "Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren,", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Hand 20:34": "En u weet zelf, dat deze handen gediend hebben voor mijn behoeften, en voor die van hen die met mij waren.", "2 Kon 15:20": "Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "Ex 12:1": "De HEERE nu had tot Mozes en tot Aäron in Egypteland gesproken en gezegd:", "Hebr 9:3-6": "maar achter het tweede voorhangsel was de tabernakel, genoemd het heilige der heiligen; met een gouden wierookvat, en de ark van het verbond, rondom met goud overdekt, waarin de gouden kruik was met het manna erin, en de staf van Aäron die gebloeid had, en de tafelen van het verbond. En boven over de ark waren de cherubs der heerlijkheid, die het verzoendeksel beschaduwden; van welke dingen wij nu niet stuk voor stuk zullen spreken.", "Num 4:5-15": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken. En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen. Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "Hand 20:33": "Ik heb niemands zilver, of goud, of kleding begeerd.", "Deut 18:2": "Daarom zal hij geen erfdeel hebben tussen zijn broeders; de HEERE is zijn Erfdeel, zoals Hij tot hem gesproken heeft.", "Num 15:24": "Dan zal het gebeuren, indien iets bij dwaling gedaan is, en voor de ogen van de vergadering verborgen is, dat de hele vergadering een var, een jong rund, zal bereiden tot brandoffer, tot een liefelijke reuk voor de HEERE, met zijn spijsoffer en zijn drankoffer, naar de gebruikelijke wijze; en een geitenbok tot zondoffer.", "Ex 29:41": "Het andere lam nu zult u bereiden tussen de twee avonden; u zult daarmee doen gelijk met het morgenspijsoffer, en gelijk met het drankoffer daarvan, tot een liefelijke reuk; het is een vuuroffer voor de HEERE.", "Num 28:5": "En een tiende deel van een efa meelbloem als spijsoffer, gemengd met het vierendeel van een hin gestoten olie.", "Ex 22:25": "Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.", "Lev 27:30-33": "Ook alle tienden van het land, van het zaad van het land, van de vrucht van de boom, zijn van de HEERE; zij zijn de HEERE heilig. Maar als iemand van zijn tienden iets echt wil afkopen, zal hij zijn vijfde deel daarboven toevoegen. Wat betreft alle tienden van runderen en klein vee, alles wat onder de herdersstaf doorgaat, het tiende zal de HEERE heilig zijn.", "Num 15:20": "De eerstelingen van uw deeg, een koek, zult u tot een hefoffer offeren; zoals het hefoffer van de dorsvloer, zo zult u het offeren.", "2 Kor 1:14": "Zoals u ook ten dele ons erkend hebt, dat wij uw roem zijn, zoals u ook de onze bent, in de dag van de Heere Jezus.", "Num 8:16-19": "Want zij zijn gegeven, zij zijn Mij gegeven uit het midden van de kinderen van Israël; in plaats van hen die de baarmoeder openen, in plaats van de eerstgeborenen van elk van de kinderen van Israël, heb Ik ze voor Mij genomen. Want elke eerstgeborene onder de kinderen van Israël is van Mij, onder de mensen en onder de dieren; op de dag dat Ik elke eerstgeborene in Egypteland sloeg, heb Ik ze voor Mij geheiligd. En Ik heb de Levieten genomen in plaats van alle eerstgeborenen onder de kinderen van Israël.", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "Luk 22:36": "Hij zei dan tegen hen: Maar nu, wie een buidel heeft, neem hem, en net zo ook een tas; en wie er geen heeft, verkoopt zijn kleed en koopt een zwaard.", "1 Kor 3:21-23": "Niemand roemt dan op mensen; want alles is van u. Hetzij Paulus, hetzij Apollos, hetzij Cefas, hetzij de wereld, hetzij leven, hetzij dood, hetzij tegenwoordige, hetzij toekomende dingen, ze zijn allemaal van u. Doch u bent van Christus, en Christus is van God.", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "Mark 6:8": "En Hij gebood hun dat zij niets zouden meenemen voor onderweg, dan alleen een staf: geen reistas, geen brood, geen geld in de gordel;", "2 Kron 13:5": "Weet u niet dat de HEERE, de God van Israël, het koninkrijk over Israël voor eeuwig aan David gegeven heeft, aan hem en zijn zonen, met een zoutverbond?", "Num 28:20": "En hun spijsoffer zal zijn meelbloem, met olie gemengd; drie tienden bij een stier, en twee tienden bij een ram zult u bereiden.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Deut 31:7": "En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven.", "Lev 7:1": "Dit is nu de wet van het schuldoffer: het is allerheiligst.", "Num 8:8": "Daarna zullen zij een jonge stier nemen, met zijn spijsoffer van meelbloem, met olie gemengd; en een andere jonge stier zult u nemen als zondoffer.", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Neh 10:36": "En de eerstgeborenen van onze zonen en onze dieren, zoals het in de wet geschreven is; en dat wij de eerstgeborenen van onze runderen en onze schapen zouden brengen naar het huis van onze God, tot de priesters, die in het huis van onze God dienen.", "Deut 2:28": "Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;", "2 Kron 30:16": "En zij stonden op hun plaats, naar hun gewoonte, naar de wet van Mozes, de man van God; de priesters sprengden het bloed, dat zij namen uit de hand van de Levieten.", "Deut 12:17-19": "U zult in uw poorten niet mogen eten de tienden van uw koren, en van uw most, en van uw olie, noch de eerstgeboorte van uw runderen en van uw schapen, noch enige van uw geloften die u zult hebben beloofd, noch uw vrijwillige offers, noch het hefoffer van uw hand. Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt. Wacht u ervoor dat u de Leviet niet verlaat, al uw dagen in uw land.", "Gen 42:25-35": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo. En zij laadden hun koren op hun ezels, en trokken vandaar weg. Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "Num 17:3": "Doch Aärons naam zult u schrijven op de staf van Levi; want er zal één staf zijn voor het hoofd van het huis van hun vaderen.", "Lev 2:2": "En hij zal het brengen tot de zonen van Aäron, de priesters, van wie er één daarvan zijn hand vol zal grijpen uit de meelbloem, en uit de olie, met alle wierook; en de priester zal het gedenkoffer daarvan aansteken op het altaar; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.", "1 Kron 23:13": "De kinderen van Amram waren Aäron en Mozes. Aäron nu werd afgezonderd om de allerheiligste dingen te heiligen, hij en zijn zonen, tot in eeuwigheid, om te roken voor het aangezicht van de HEERE, om Hem te dienen en om in Zijn Naam tot in eeuwigheid te zegenen.", "Gen 23:13": "En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.", "Ezech 34:20": "Daarom zegt de Heere HEERE zo tegen hen: Zie, Ik, ja, Ik zal richten tussen het vette klein vee, en tussen het magere klein vee.", "2 Kor 12:13-18": "Want wat is er, waarin u minder geweest bent dan de andere gemeenten, behalve dan dat ikzelf u niet lastig ben geweest? Vergeef mij dit onrecht. Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen. En ik zal zeer graag de kosten dragen, en voor uw zielen ten koste gegeven worden; hoewel ik, terwijl ik u overvloediger liefheb, minder bemind word.", "Dan 8:13": "Daarna hoorde ik een heilige spreken; en de heilige zei tegen de onbenoemde die daar sprak: Tot hoelang zal dat gezicht van het voortdurende offer en de verwoestende afval duren, dat zowel het heiligdom als het leger vertrapt zal worden?", "Lev 7:34": "Want de beweegborst en de hefschouder heb Ik van de kinderen van Israël uit hun dankoffers genomen, en heb die aan Aäron, de priester, en aan zijn zonen gegeven, als een eeuwige inzetting, vanwege de kinderen van Israël.", "Num 14:34": "Naar het getal van de dagen waarin u dat land verspied hebt, veertig dagen, elke dag voor elk jaar, zult u uw ongerechtigheden dragen, veertig jaar, en u zult Mijn tegenwerking ervaren.", "Lev 5:8": "En hij zal ze naar de priester brengen, die eerst degene zal offeren die voor het zondoffer is; en hij zal haar hoofd bij haar nek met zijn nagel splijten, maar niet afscheiden.", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Num 3:47": "U zult voor elk hoofd vijf sikkels nemen; naar de sikkel van het heiligdom zult u ze nemen; die sikkel is twintig gera.", "1 Tim 4:1-16": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen, door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid; die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.", "Num 16:40": "Ter herinnering voor de kinderen van Israël, opdat geen vreemdeling, die niet uit het nageslacht van Aäron is, nadert om reukwerk aan te steken voor het aangezicht van de HEERE; opdat hij niet wordt als Korach en zijn vergadering, zoals de HEERE hem door de hand van Mozes gezegd had.", "Gen 29:34": "En zij werd nog zwanger, en baarde een zoon, en zei: Nu zal mijn man zich ditmaal aan mij hechten, omdat ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.", "Deut 14:23": "En voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen om Zijn Naam daar te doen wonen, zult u eten de tienden van uw koren, van uw most, en van uw olie, en de eerstgeboorte van uw runderen en van uw schapen; opdat u de HEERE, uw God, leert vrezen alle dagen.", "Ex 29:9": "En u zult hen met de gordel omgorden, namelijk Aäron en zijn zonen; en u zult hun de mutsen opbinden, opdat zij het priesterambt hebben tot een eeuwige inzetting. Vervolgens zult u de hand van Aäron vullen, en de hand van zijn zonen.", "Lev 2:3": "Wat nu overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.", "1 Kron 9:33": "Uit dezen zijn ook de zangers, hoofden van de vaderen onder de Levieten, in de kamers, vrijgesteld van andere dienst; want dag en nacht waren zij bezig met dat werk.", "Ex 21:35": "Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode dier zal men ook gelijk delen.", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "Lev 2:12-16": "De offers van de eerstelingen zult u de HEERE brengen; maar op het altaar zullen zij niet komen tot een liefelijke reuk. En elk offer van uw spijsoffer zult u met zout zouten, en het zout van het verbond van uw God mag u niet laten ontbreken bij uw spijsoffer; met heel uw offer zult u zout offeren. En als u de HEERE een spijsoffer van de eerste vruchten offert, zult u voor het spijsoffer van uw eerste vruchten groene aren, bij het vuur gedord, offeren, dat is, het klein gebroken graan van volle groene aren.", "Lev 22:2": "Spreek tot Aäron en tot zijn zonen, dat zij zich afzonderen van de heilige dingen van de kinderen van Israël, die zij Mij heiligen, opdat zij de Naam van Mijn heiligheid niet ontheiligen; Ik ben de HEERE!", "Deut 12:12": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zonen, en uw dochters, en uw dienstknechten, en uw dienstmaagden, en de Leviet die in uw poorten is; want hij heeft geen deel noch erfenis met u.", "Klaagl 3:24": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen.", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "Est 4:7": "gaf Mordechai hem te kennen alles wat hem overkomen was, en de opgave van het zilver dat Haman gezegd had te zullen wegen in de schatten van de koning, voor de Joden, om hen om te brengen.", "Neh 12:44": "Ook werden op diezelfde dag mannen aangesteld over de kamers, voor de schatten, voor de hefoffers, voor de eerstelingen en voor de tienden, om daarin uit de akkers van de steden de delen van de wet te verzamelen, voor de priesters en voor de Levieten; want Juda was vrolijk over de priesters en over de Levieten, die daar stonden.", "Num 4:1-15": "En de HEERE sprak tot Mozes en tot Aäron: Neem de som op van de zonen van Kohath, uit het midden van de zonen van Levi, naar hun geslachten, naar het huis van hun vaderen. Van dertig jaar oud en ouder, tot vijftig jaar oud; ieder die in deze strijd komt om het werk in de tent der samenkomst te doen.", "Fil 3:9": "En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Num 17:13": "Al wie ook maar enigszins nadert tot de tabernakel van de HEERE, zal sterven; zullen wij dan allen stervend omkomen?", "1 Kron 16:40": "Om de HEERE de brandoffers voortdurend te offeren op het brandofferaltaar, 's morgens en 's avonds; en dat naar alles wat er geschreven staat in de wet van de HEERE, die Hij Israël geboden had.", "Gen 17:12": "Een zoontje van acht dagen zal bij u besneden worden, alles wat mannelijk is in uw geslachten: degene die in het huis geboren is, en degene die met geld gekocht is van elke vreemdeling die niet van uw nageslacht is;", "Deut 14:26": "En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "Lev 24:3": "Aäron zal die voortdurend in orde houden voor het aangezicht van de HEERE, van de avond tot de morgen, buiten het voorhangsel van de getuigenis, in de tent van de samenkomst; het is een eeuwige inzetting voor uw geslachten.", "Jes 48:15": "Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.", "Spr 7:20": "Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.", "Lev 7:6-10": "Al wie mannelijk is onder de priesters mag dat eten; op de heilige plaats zal het gegeten worden; het is allerheiligst. Zoals het zondoffer is, zo zal ook het schuldoffer zijn; er zal één wet voor beide zijn; het zal voor de priester zijn die daarmee verzoening gedaan heeft. Ook de priester die iemands brandoffer offert, die priester zal de huid van het brandoffer hebben dat hij geofferd heeft.", "Lev 23:16": "tot de dag na de zevende sabbat zult u vijftig dagen tellen, dan zult u een nieuw spijsoffer aan de HEERE offeren.", "Lev 7:7": "Zoals het zondoffer is, zo zal ook het schuldoffer zijn; er zal één wet voor beide zijn; het zal voor de priester zijn die daarmee verzoening gedaan heeft.", "Lev 5:13": "Zo zal de priester voor hem verzoening doen over zijn zonde die hij gezondigd heeft in een van die gevallen, en het zal hem vergeven worden; en het overige zal voor de priester zijn, zoals bij het spijsoffer.", "Neh 5:11": "Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste deel van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt.", "2 Kon 12:16": "Het geld van het schuldoffer en het geld van de zondoffers werd niet naar het huis van de HEERE gebracht; het was voor de priesters.", "Num 28:26-31": "Ook op de dag van de eerstelingen, als u een nieuw spijsoffer de HEERE zult offeren naar uw weken, zult u een heilige samenkomst hebben; geen dienstwerk zult u doen. Dan zult u de HEERE een brandoffer tot liefelijke reuk offeren: twee jonge stieren, een ram, zeven eenjarige lammeren; En hun spijsoffer van meelbloem, met olie gemengd: drie tienden bij een stier, twee tienden bij een ram;", "Deut 15:14": "U zult hem rijkelijk meegeven van uw kudde, en van uw dorsvloer, en van uw wijnpers; waarmee de HEERE, uw God, u gezegend heeft, daarvan zult u hem geven.", "Ezech 45:1-4": "Wanneer u dan het land door het lot laat toevallen als erfenis, zult u een hefoffer aan de HEERE brengen, als een heilige plaats, van het land; de lengte zal zijn de lengte van vijfentwintigduizend meetrieten, en de breedte tienduizend; dat zal in zijn hele omtrek rondom heilig zijn. Hiervan zal voor het heiligdom zijn vijfhonderd bij vijfhonderd, vierkant rondom; en het zal vijftig el hebben als buitenruimte rondom. Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, met het heilige der heiligen.", "Num 9:14": "En wanneer een vreemdeling bij u als vreemdeling verblijft, en hij het pascha voor de HEERE ook houden zal, naar de inzetting van het pascha, en naar zijn manier, zo zal hij het houden; het zal één inzetting voor u zijn, zowel voor de vreemdeling als voor de inboorling van het land.", "Job 31:39": "Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;", "Num 3:3": "Dit zijn de namen van de zonen van Aäron, de priesters, die gezalfd waren, wier hand men gevuld had, om het priesterambt te bedienen.", "Lev 7:6": "Al wie mannelijk is onder de priesters mag dat eten; op de heilige plaats zal het gegeten worden; het is allerheiligst.", "Gen 14:18": "En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God.", "Hand 20:26": "Daarom verklaar ik u op deze huidige dag, dat ik rein ben van het bloed van u allen.", "Num 8:24": "Dit is het wat de Levieten aangaat: van vijfentwintig jaar oud en daarboven, zullen zij binnengaan om de strijd te strijden, in de dienst van de tent van de samenkomst.", "Num 18:8-11": "Verder sprak de HEERE tot Aäron: En Ik, zie, Ik heb u gegeven de wacht van Mijn hefoffers, met alle heilige dingen van de kinderen van Israël heb Ik ze u gegeven, vanwege de zalving, en aan uw zonen, tot een eeuwige inzetting. Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn. Aan het allerheiligste zult u dat eten; ieder die mannelijk is zal dat eten; het zal u een heilig ding zijn.", "Lev 5:11": "Maar als zijn hand niet twee tortelduiven of twee jonge duiven kan bereiken, dan zal hij die gezondigd heeft, als zijn offergave het tiende deel van een efa meelbloem brengen als zondoffer; hij zal er geen olie overheen doen, en er ook geen wierook op leggen; want het is een zondoffer.", "Ex 29:32": "Aäron nu en zijn zonen zullen het vlees van deze ram eten, en het brood, dat in de korf zal zijn, bij de deur van de tent van de samenkomst.", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "Num 18:21-24": "En zie, aan de kinderen van Levi heb Ik alle tienden in Israël tot erfenis gegeven, voor hun dienst die zij bedienen, de dienst van de tent der samenkomst. En de kinderen van Israël zullen niet meer tot de tent der samenkomst naderen, om zonde te dragen en te sterven. Maar de Levieten, die zullen de dienst van de tent der samenkomst bedienen, en die zullen hun ongerechtigheid dragen; het zal een eeuwige inzetting zijn voor uw geslachten; en te midden van de kinderen van Israël zullen zij geen erfenis erven.", "Lev 18:15": "U zult de schaamte van uw schoondochter niet ontdekken; zij is de vrouw van uw zoon; u zult haar schaamte niet ontdekken.", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "Mal 1:8": "Want als u iets blinds aanbrengt om te offeren, is dat bij u niet kwaad; en als u iets kreupels of iets kranks aanbrengt, is dat niet kwaad! Breng dat toch aan uw vorst; zal hij welgevallen aan u hebben? of zal hij u gunstig ontvangen? zegt de HEERE van de heerscharen.", "Lev 6:14-23": "Dit is nu de wet van het spijsoffer: een van de zonen van Aäron zal dat voor het aangezicht van de HEERE offeren, voor het altaar. En hij zal daarvan zijn hand vol opnemen, uit de meelbloem van het spijsoffer, en van de olie daarvan, en al de wierook die op het spijsoffer is; dan zal hij het aansteken op het altaar; het is een liefelijke reuk, tot gedachtenis daarvan, voor de HEERE. En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten.", "Ex 21:34": "dan zal de eigenaar van de kuil het vergoeden; hij zal aan de eigenaar van het dier het geld teruggeven; maar het dode dier zal hem toebehoren.", "Lev 10:14": "Ook de beweegborst en de hefschouder moet u eten in een reine plaats, u, en uw zonen, en uw dochters met u; want als uw bescheiden deel, en het bescheiden deel van uw zonen, zijn zij uit de dankoffers van de kinderen van Israël gegeven.", "Ex 40:15": "En u zult hen zalven, zoals u hun vader gezalfd zult hebben, zodat zij Mij als priester bedienen. En het zal gebeuren, dat hun zalving voor hen zal zijn tot een eeuwig priesterschap, door al hun generaties heen.", "Ex 13:2": "Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.", "Ezech 44:29": "Het spijsoffer, en het zondoffer, en het schuldoffer, die zullen zij eten; ook zal al het verbannene  in Israël het hunne zijn.", "Ezech 42:20": "Hij mat het aan de vier zijden; het had een muur rondom, de lengte was vijfhonderd rieten, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en het onheilige.", "Gen 20:16": "En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn, ja, tegenover allen, en wees terechtgewezen.", "Richt 17:4": "Maar hij gaf dat geld aan zijn moeder terug. En zijn moeder nam tweehonderd zilverlingen, en gaf ze aan de goudsmid, die maakte daarvan een gesneden beeld en een gegoten beeld; dat was in het huis van Micha.", "Num 3:10": "Maar Aäron en zijn zonen zult u aanstellen, dat zij hun priesterambt waarnemen; en de vreemde die nadert, zal gedood worden.", "Lev 16:12-14": "Hij zal ook een wierookvat vol vurige kolen nemen van het altaar, van voor het aangezicht van de HEERE, en zijn handen vol fijngestoten reukwerk van welriekende specerijen; en hij zal het binnen het voorhangsel dragen. En hij zal dat reukwerk op het vuur leggen, voor het aangezicht van de HEERE, opdat de wolk van het reukwerk het verzoendeksel dat op de getuigenis is bedekt, en dat hij niet sterft. En hij zal van het bloed van de stier nemen, en zal met zijn vinger op het verzoendeksel aan de oostkant sprenkelen; en voor het verzoendeksel zal hij zevenmaal met zijn vinger van dat bloed sprenkelen.", "Openb 21:3": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn.", "Num 1:52": "En de kinderen van Israël zullen zich legeren, ieder bij zijn eigen leger, en ieder bij zijn eigen banier, naar hun legers.", "Ex 34:20": "Doch de ezel, die de baarmoeder opent, zult u met een stuk klein vee lossen; maar als u hem niet zult lossen, zo zult u hem de nek breken. Al de eerstgeborenen van uw zonen zult u lossen, en men zal voor Mijn aangezicht niet met lege handen verschijnen.", "Ex 14:17": "En Ik, zie, Ik zal het hart van de Egyptenaren verstokken, zodat zij achter hen aan daarin gaan; en Ik zal verheerlijkt worden aan Farao en aan zijn hele leger, aan zijn wagens en aan zijn ruiters.", "Luk 19:15": "En het gebeurde, toen hij terugkwam nadat hij het koninkrijk ontvangen had, dat hij zei dat die dienstknechten aan wie hij het geld gegeven had bij hem geroepen moesten worden, opdat hij zou weten wat ieder met handel verdiend had.", "Num 28:13": "En bij elk tiende deel meelbloem als spijsoffer, met olie gemengd, bij het ene lam; het is een brandoffer tot een liefelijke reuk, een vuuroffer, voor de HEERE.", "Num 18:8-19": "Verder sprak de HEERE tot Aäron: En Ik, zie, Ik heb u gegeven de wacht van Mijn hefoffers, met alle heilige dingen van de kinderen van Israël heb Ik ze u gegeven, vanwege de zalving, en aan uw zonen, tot een eeuwige inzetting. Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn. Aan het allerheiligste zult u dat eten; ieder die mannelijk is zal dat eten; het zal u een heilig ding zijn.", "Ezech 3:4": "En Hij zei tot mij: Mensenkind, ga heen, kom tot het huis Israëls, en spreek tot hen met Mijn woorden.", "Jer 32:9": "Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.", "Num 3:41-45": "En u zult voor Mij de Levieten nemen (Ik ben de HEERE!), in plaats van alle eerstgeborenen onder de kinderen van Israël, en de dieren van de Levieten, in plaats van alle eerstgeborenen onder de dieren van de kinderen van Israël. Mozes dan telde, zoals de HEERE hem geboden had, alle eerstgeborenen onder de kinderen van Israël. En alle eerstgeborenen die mannelijk waren, in het getal van de namen, van een maand oud en daarboven, naar hun getelden, waren tweeëntwintigduizend tweehonderddrieënzeventig.", "1 Kor 9:13": "Weet u niet, dat wie de heilige dingen bedienen, van het heilige eten? En wie steeds bij het altaar zijn, met het altaar meedelen?", "Ex 28:1-4": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron. En u zult voor uw broeder Aäron heilige kleren maken, tot heerlijkheid en tot sieraad. U zult ook spreken tot allen die wijs van hart zijn, die Ik met de geest van wijsheid vervuld heb, dat zij voor Aäron kleren maken om hem te heiligen, zodat hij Mij het priesterambt bedient.", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "Pred 7:12": "Want de wijsheid is tot een schaduw, en het geld is tot een schaduw; maar de uitnemendheid van de wetenschap is, dat de wijsheid haar bezitters het leven geeft.", "Neh 12:47": "Daarom gaf heel Israël, in de dagen van Zerubbabel, en in de dagen van Nehemia, de delen van de zangers en van de poortwachters, van elke dag op zijn dag; en zij heiligden gaven voor de Levieten, en de Levieten heiligden gaven voor de kinderen van Aäron.", "Deut 12:11": "Dan zal er een plaats zijn die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; daarheen zult u brengen alles wat ik u gebied: uw brandoffers, en uw slachtoffers, uw tienden, en het hefoffer van uw hand, en alle beste keuze van uw geloften, die u de HEERE beloven zult.", "Ex 12:14": "En deze dag zal voor u een gedachtenis zijn, en u zult hem als een feest voor de HEERE vieren; u zult hem vieren onder uw geslachten, als een eeuwige inzetting.", "Num 3:38": "Die zich nu zullen legeren voor de tabernakel oostwaarts, voor de tent der samenkomst, tegen de opgang, zullen zijn Mozes, en Aäron met zijn zonen, die de wacht van het heiligdom waarnemen, voor de wacht van de kinderen van Israël; en de vreemde die nadert, zal gedood worden.", "Dan 8:11": "Ja, hij verhief zich tot aan de Vorst van dat leger, en van Hem werd het voortdurende offer weggenomen, en de woning van Zijn heiligdom werd neergeworpen.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "1 Tim 5:17": "De oudsten die goed leiding geven, moeten dubbele eer waardig geacht worden, vooral wie arbeiden in het Woord en de leer.", "Lev 6:20": "Dit is de offerande van Aäron en van zijn zonen, die zij de HEERE offeren zullen op de dag dat hij gezalfd wordt: het tiende deel van een efa meelbloem, een voortdurend spijsoffer; de helft daarvan op de morgen, en de helft daarvan op de avond.", "Lev 7:9-13": "Verder zal al het spijsoffer dat in de oven gebakken wordt, met al wat in de ketel en in de pan bereid wordt, voor de priester zijn die dat offert. Ook elk spijsoffer dat met olie gemengd is, of droog, zal voor alle zonen van Aäron zijn, voor de een evenveel als voor de ander. Dit is nu de wet van het dankoffer, dat men de HEERE zal offeren.", "Num 19:1": "Verder sprak de HEERE tot Mozes en tot Aäron, en zei:", "Num 29:14": "En hun spijsoffer van meelbloem, met olie gemengd: drie tienden voor elke var, van die dertien varren; twee tienden voor elke ram, van die twee rammen;", "2 Sam 24:18": "En Gad kwam diezelfde dag bij David, en zei tegen hem: Ga op, richt de HEERE een altaar op, op de dorsvloer van Arauna, de Jebusiet.", "Rom 13:2": "Zodat hij die zich tegen de macht stelt, de instelling van God weerstaat; en zij die weerstaan, zullen over zichzelf een oordeel halen.", "2 Tim 4:1-8": "Ik roep u dus dringend op, voor het aangezicht van God en de Heere Jezus Christus, Die de levenden en doden zal oordelen bij Zijn verschijning en in Zijn Koninkrijk: Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs. Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;", "Ex 29:29": "De heilige kleren nu, die van Aäron zullen geweest zijn, zullen van zijn zonen na hem zijn, opdat men hen daarin zalft, en dat men hun hand daarin vult.", "1 Kron 9:29": "Want uit hen zijn er aangesteld over de voorwerpen, en over al de heilige voorwerpen, en over de meelbloem, en wijn, en olie, en wierook, en specerijen.", "2 Kron 26:16-21": "Maar toen hij sterk geworden was, verhief zijn hart zich tot zijn eigen verderf, en hij overtrad tegen de HEERE, zijn God; want hij ging het tempel van de HEERE binnen, om te roken op het reukaltaar. Doch Azaria, de priester, ging hem na, en met hem priesters van de HEERE, tachtig kloeke mannen. En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "Num 29:3": "En hun spijsoffer van meelbloem, met olie gemengd; drie tienden voor de var, twee tienden voor de ram.", "2 Kron 34:17": "En zij hebben het geld dat in het huis van de HEERE gevonden is, samengevoegd, en hebben het gegeven in de hand van de opzichters, en in de hand van hen die het werk verrichtten.", "Rom 11:16": "En als de eerstelingen heilig zijn, dan is ook het deeg heilig, en als de wortel heilig is, dan zijn ook de takken heilig.", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "Ezech 48:21": "En het overgelatene zal voor de vorst zijn, van deze en van gene zijde van het heilig hefoffer, en van de bezitting van de stad, voor aan de vijfentwintigduizend meetrieten van het hefoffer, tot aan de oostgrens en westgrens, voor aan de vijfentwintigduizend aan de westgrens, tegenover de andere delen, dat zal voor de vorst zijn; en het heilig hefoffer, en het heiligdom van het huis, zal in het midden daarvan zijn.", "Ezech 45:3": "Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, met het heilige der heiligen.", "Ex 27:21": "In de tent der samenkomst, van buiten het voorhangsel, dat voor de getuigenis is, zal Aäron en zijn zonen ze toerichten, van de avond tot de morgen, voor het aangezicht van de HEERE; dit zal een eeuwige inzetting zijn voor hun geslachten, vanwege de kinderen van Israël.", "Lev 20:20": "Als ook een man gemeenschap heeft met de vrouw van zijn oom, heeft hij de schaamte van zijn oom ontdekt; zij zullen hun zonde dragen; zonder kinderen zullen zij sterven.", "Lev 27:30": "Ook alle tienden van het land, van het zaad van het land, van de vrucht van de boom, zijn van de HEERE; zij zijn de HEERE heilig.", "Lev 23:20": "Dan zal de priester die met het brood van de eerstelingen tot beweegoffer, voor het aangezicht van de HEERE, met de twee lammeren bewegen; zij zullen voor de HEERE een heilig ding zijn, voor de priester.", "1 Kron 23:32": "En dat zij de wacht van de tent der samenkomst zouden waarnemen, en de wacht van het heiligdom, en de wacht van de zonen van Aäron, hun broeders, in de dienst van het huis van de HEERE.", "Lev 5:15": "Als een mens door overtreding ontrouw wordt, en door onwetendheid zondigt tegen de heilige dingen van de HEERE, dan zal hij als zijn schuldoffer aan de HEERE brengen een gaaf ram uit de kudde, naar uw schatting aan zilveren sikkels, gerekend naar de sikkel van het heiligdom, als schuldoffer.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Ezech 34:11": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken.", "Ex 29:16": "En u zult de ram slachten, en u zult zijn bloed nemen, en rondom op het altaar sprengen.", "2 Kron 24:11": "Het gebeurde nu ter tijd, als hij de kist, naar het bevel van de koning, door de hand van de Levieten inbracht, en als zij zagen dat er veel van het geld was, dat de schrijver van de koning kwam, en de gestelde van de hoofdpriester, en de kist leegmaakten, en die opnamen, en die terugbrachten naar haar plaats; zo deden zij van dag tot dag, en verzamelden geld in overvloed;", "Luk 10:7": "En blijf in dat huis, etend en drinkend wat zij u geven; want de arbeider is zijn loon waard. Ga niet van het ene huis naar het andere.", "Gen 17:27": "En alle mannen van zijn huis, degenen die in het huis geboren waren, en degenen die met geld gekocht waren, van de vreemdeling af, werden met hem besneden.", "2 Tim 1:6-13": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen. Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid. Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Ezech 44:15": "Maar de Levitische priesters, de kinderen van Zadok, die de wacht van Mijn heiligdom in acht genomen hebben, toen de kinderen van Israël van Mij afdwaalden, die zullen tot Mij naderen om Mij te dienen; en zullen voor Mijn aangezicht staan om Mij het vette en het bloed te offeren, spreekt de Heere HEERE;", "Lev 7:30-34": "Zijn eigen handen zullen de vuuroffers van de HEERE brengen; het vet aan de borst zal hij met die borst brengen, om die als beweegoffer voor het aangezicht van de HEERE te bewegen. En de priester zal dat vet op het altaar aansteken; maar de borst zal voor Aäron en zijn zonen zijn. U zult ook de rechterschouder als hefoffer aan de priester geven, uit uw dankoffers.", "2 Sam 6:6": "Toen zij nu kwamen tot aan de dorsvloer van Nachon, strekte Uza zijn hand uit naar de ark van God, en hield die vast, want de runderen struikelden.", "1 Joh 2:20": "Maar u hebt de zalving van de Heilige, en u weet alle dingen.", "2 Kor 1:15": "En op dit vertrouwen wilde ik eerder naar u toe komen, opdat u een tweede keer weldaad zou ontvangen;", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Num 28:9": "Maar op de sabbatdag twee volkomen eenjarige lammeren, en twee tienden meelbloem, als spijsoffer, met olie gemengd, alsook zijn drankoffer.", "Lev 7:37": "Dit is de wet van het brandoffer, het spijsoffer, het zondoffer, het schuldoffer, het inwijdingsoffer en het dankoffer;", "Ex 29:31": "U zult de ram van de vulling nemen, en u zult zijn vlees in de heilige plaats koken.", "Ex 21:21": "Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.", "Ex 29:26-28": "En neem de borst van de ram van de vuloffers, die van Aäron is, en beweeg hem tot een beweegoffer voor het aangezicht van de HEERE; en het zal voor u een deel zijn. En u zult de borst van het beweegoffer heiligen, en de schouder van het hefoffer, die bewogen wordt, en die opgeheven zal zijn van de ram van het vuloffer, van hetgeen dat van Aäron is, en van hetgeen dat van zijn zonen is. En het zal voor Aäron en zijn zonen zijn tot een eeuwige inzetting vanwege de kinderen van Israël; want het is een hefoffer; en het hefoffer vanwege de kinderen van Israël zal zijn van hun dankoffers; hun hefoffer zal voor de HEERE zijn.", "Deut 2:6": "Voedsel zult u voor geld van hen kopen, dat u eet; en ook zult u water voor geld van hen kopen, dat u drinkt.", "Num 5:26": "De priester zal ook van dat spijsoffer, het gedenkoffer ervan, een handvol grijpen, en zal het op het altaar in rook doen opgaan; en daarna zal hij dat water die vrouw te drinken geven.", "Deut 18:4": "De eerstelingen van uw koren, van uw most en van uw olie, en de eerstelingen van de wol van uw schapen zult u hem geven;", "Hos 9:1": "Verblijd u niet, Israël, tot uitbundige vreugde toe, zoals de volken; want u hoereert van uw God af; u hebt hoerenloon lief, op alle dorsvloeren van het koren.", "1 Tim 1:18-20": "Dit gebod beveel ik u, mijn zoon Timotheüs, dat u naar de profetieën die eerder over u uitgesproken zijn, daarmee de goede strijd strijdt; Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben; Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Num 17:7": "En Mozes legde deze staven weg, voor het aangezicht van de HEERE, in de tent van de getuigenis.", "Micha 7:1": "Ai mij! Want ik ben als wanneer de zomervruchten zijn ingezameld; als wanneer de nalezingen in de wijnoogst gebeurd zijn; er is geen druif om te eten; mijn ziel begeert vroegrijpe vrucht.", "Joz 1:1-9": "Het gebeurde nu, na de dood van Mozes, de knecht van de HEERE, dat de HEERE tegen Jozua, de zoon van Nun, de dienaar van Mozes, sprak en zei: Mijn knecht Mozes is gestorven; maak u nu op, trek deze Jordaan over, u en al dit volk, naar het land dat Ik hun, de kinderen van Israël, geef. Elke plaats waarop uw voetzool treden zal, heb Ik u gegeven, zoals Ik tegen Mozes gesproken heb.", "2 Tim 3:1-17": "En weet dit, dat in de laatste dagen zware tijden zullen aanbreken. Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig, zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede,", "Zach 10:3": "Tegen de herders was Mijn toorn ontstoken, en over de bokken heb Ik bezoeking gedaan; maar de HEERE van de heerscharen³ zal Zijn kudde bezoeken, het huis van Juda, en Hij zal hen stellen als het paard van Zijn majesteit in de strijd.", "Deut 26:2": "dan zult u van de eerstelingen van alle vrucht van het land nemen, die u opbrengt van uw land dat de HEERE, uw God, u geeft, en zult ze in een korf leggen; en u zult gaan naar de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen;", "Deut 14:22-29": "U zult getrouw vertienen alle opbrengst van uw zaad, dat elk jaar van het veld voortkomt. En voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen om Zijn Naam daar te doen wonen, zult u eten de tienden van uw koren, van uw most, en van uw olie, en de eerstgeboorte van uw runderen en van uw schapen; opdat u de HEERE, uw God, leert vrezen alle dagen. Wanneer dan de weg voor u te lang zal zijn, zodat u het niet zou kunnen dragen, omdat de plaats te ver van u zal zijn – die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te vestigen – wanneer de HEERE, uw God, u gezegend zal hebben;", "Num 5:9": "Evenzo zal alle heffing van alle geheiligde dingen van de kinderen van Israël, die zij tot de priester brengen, van hem zijn.", "Num 18:26-32": "U zult ook tot de Levieten spreken, en tegen hen zeggen: Wanneer u van de kinderen van Israël de tienden zult hebben ontvangen, die Ik u voor uw erfenis van hen gegeven heb, dan zult u daarvan een hefoffer voor de HEERE offeren, de tienden van die tienden; En het zal u gerekend worden tot uw hefoffer, als koren van de dorsvloer, en als de volheid van de perskuip. Zo zult u ook een hefoffer voor de HEERE offeren van al uw tienden, die u van de kinderen van Israël zult hebben ontvangen; en u zult daarvan het hefoffer van de HEERE geven aan de priester Aäron.", "Lev 27:30-32": "Ook alle tienden van het land, van het zaad van het land, van de vrucht van de boom, zijn van de HEERE; zij zijn de HEERE heilig. Maar als iemand van zijn tienden iets echt wil afkopen, zal hij zijn vijfde deel daarboven toevoegen. Wat betreft alle tienden van runderen en klein vee, alles wat onder de herdersstaf doorgaat, het tiende zal de HEERE heilig zijn.", "Gen 17:23": "Toen nam Abraham zijn zoon Ismaël, en alle mannen die in zijn huis geboren waren, en alle die met zijn geld gekocht waren, alles wat mannelijk was onder de mensen van het huis van Abraham, en hij besneed het vlees van hun voorhuid, op diezelfde dag, zoals God met hem gesproken had.", "Num 8:2": "Spreek tot Aäron en zeg tegen hem: Als u de lampen aansteekt, zullen de zeven lampen licht geven recht tegenover de kandelaar.", "Num 28:21": "Bij elk zult u een tiende deel bereiden bij een lam, tot al die zeven lammeren toe.", "Richt 16:18": "Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.", "Ezech 44:27": "En op de dag dat hij in het heilige naar binnen gaat, in het binnenste voorhof, om in het heilige te dienen, zal hij zijn zondoffer offeren, spreekt de Heere HEERE.", "Ex 15:25": "Hij dan riep tot de HEERE; en de HEERE wees hem een stuk hout, dat wierp hij in het water; toen werd het water zoet. Daar stelde Hij het volk een inzetting en recht, en daar beproefde Hij hen,", "Ex 29:21": "Dan zult u nemen van het bloed, dat op het altaar is, en van de zalfolie, en u zult op Aäron en op zijn kleren sprengen, en op zijn zonen en op de kleren van zijn zonen met hem; opdat hij geheiligd is, en zijn kleren, ook zijn zonen, en de kleren van zijn zonen met hem.", "Hebr 9:6": "Deze dingen nu, zo ingericht zijnde, gingen de priesters wel voortdurend de eerste tabernakel binnen, om de erediensten te volbrengen;", "Ex 13:10": "Houd daarom deze inzetting op de vastgestelde tijd, van jaar tot jaar.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Jes 24:5": "Want het land is bevlekt vanwege zijn inwoners; want zij overtreden de wetten, zij veranderen de inzettingen, zij vernietigen het eeuwige verbond.", "1 Kron 9:23": "Zij dan en hun zonen waren aan de poorten van het huis van de HEERE, in het huis van de tent, aan de wachten.", "Jer 32:10": "En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had.", "Joz 13:33": "Maar aan de stam van Levi gaf Mozes geen erfdeel; de HEERE, de God van Israël, is Zelf hun Erfdeel, zoals Hij tot hen gesproken heeft.", "Matt 25:27": "Dan had u mijn geld naar de wisselaars moeten brengen, en zou ik bij mijn komst het mijne met rente teruggekregen hebben."}, "noten": {"1": "D.i. wat door de ban onherroepelijk aan de HEERE gewijd is."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">Zo</span> zei <span class=\"wl\" data-l=\"L2\" data-code=\"H175\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H175\">HEERE</span> tegen <span class=\"wl\" data-l=\"L2\" data-code=\"H175\">Aäron</span>: U, <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">uw</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">zonen</span>
