ssalonicenzen", "href": "../../1-thessalonicenzen/1/"}, {"naam": "2 Thessalonicenzen", "href": "../../2-thessalonicenzen/1/"}, {"naam": "1 Timotheüs", "href": "../../1-timotheus/1/"}, {"naam": "2 Timotheüs", "href": "../../2-timotheus/1/"}, {"naam": "Titus", "href": "../../titus/1/"}, {"naam": "Filemon", "href": "../../filemon/1/"}, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "2": "En ook zult u uw broeders, de stam van Levi, de stam van uw vader, met u laten naderen, zodat zij u worden bijgevoegd, en u dienen; maar u, en uw zonen met u, zult voor de tent der getuigenis zijn.", "3": "En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u.", "4": "Maar zij zullen u bijgevoegd worden, en de wacht van de tent der samenkomst waarnemen, in alle dienst van de tent; en een vreemde zal u niet naderen.", "5": "U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "6": "Want Ik, zie, Ik heb uw broeders, de Levieten, uit het midden van de kinderen van Israël genomen; zij zijn u een gave, gegeven aan de HEERE, om de dienst van de tent der samenkomst te bedienen.", "7": "Maar u, en uw zonen met u, zullen uw priesterambt waarnemen in alle zaken van het altaar, en in wat binnen het voorhangsel is; dat zult u bedienen; uw priesterambt geef Ik u tot een dienst van een geschenk; en de vreemde die nadert, zal gedood worden.", "8": "Verder sprak de HEERE tot Aäron: En Ik, zie, Ik heb u gegeven de wacht van Mijn hefoffers, met alle heilige dingen van de kinderen van Israël heb Ik ze u gegeven, vanwege de zalving, en aan uw zonen, tot een eeuwige inzetting.", "9": "Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn.", "10": "Aan het allerheiligste zult u dat eten; ieder die mannelijk is zal dat eten; het zal u een heilig ding zijn.", "11": "Ook zal dit het uwe zijn: het hefoffer van hun gave, met alle beweegoffers van de kinderen van Israël; Ik heb ze aan u gegeven, en aan uw zonen, en aan uw dochters met u, tot een eeuwige inzetting; ieder die in uw huis rein is, zal dat eten.", "12": "Al het beste van de olie, en al het beste van de most, en van koren, hun eerstelingen, die zij de HEERE zullen geven, heb Ik u gegeven.", "13": "De eerste vruchten van alles wat in hun land is, die zij de HEERE zullen brengen, zullen de uwe zijn; ieder die in uw huis rein is, zal dat eten.", "14": "Al het verbannene[1] in Israël zal het uwe zijn.", "15": "Alles wat de baarmoeder opent, van alle vlees, dat zij de HEERE zullen brengen, onder de mensen, en onder de dieren, zal het uwe zijn; maar de eerstgeborenen van de mensen zult u helemaal lossen; ook zult u de eerstgeborenen van de onreine dieren lossen.", "16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "17": "Maar het eerstgeborene van een koe, of het eerstgeborene van een schaap, of het eerstgeborene van een geit zult u niet lossen, zij zijn heilig; hun bloed zult u sprenkelen op het altaar, en hun vet zult u aansteken, tot een vuuroffer van liefelijke reuk voor de HEERE.", "18": "En hun vlees zal het uwe zijn; net als de beweegborst, en net als de rechterschouder, zal het het uwe zijn.", "19": "Alle hefoffers van de heilige dingen, die de kinderen van Israël de HEERE zullen offeren, heb Ik aan u gegeven, en aan uw zonen, en aan uw dochters met u, tot een eeuwige inzetting; het zal een eeuwig zoutverbond zijn, voor het aangezicht van de HEERE, voor u en voor uw nageslacht met u.", "20": "Ook zei de HEERE tegen Aäron: U zult in hun land niet erven, en u zult geen deel te midden van hen hebben; Ik ben uw deel en uw erfenis, te midden van de kinderen van Israël.", "21": "En zie, aan de kinderen van Levi heb Ik alle tienden in Israël tot erfenis gegeven, voor hun dienst die zij bedienen, de dienst van de tent der samenkomst.", "22": "En de kinderen van Israël zullen niet meer tot de tent der samenkomst naderen, om zonde te dragen en te sterven.", "23": "Maar de Levieten, die zullen de dienst van de tent der samenkomst bedienen, en die zullen hun ongerechtigheid dragen; het zal een eeuwige inzetting zijn voor uw geslachten; en te midden van de kinderen van Israël zullen zij geen erfenis erven.", "24": "Want de tienden van de kinderen van Israël, die zij de HEERE tot een hefoffer zullen offeren, heb Ik aan de Levieten tot een erfenis gegeven; daarom heb Ik tegen hen gezegd: Zij zullen te midden van de kinderen van Israël geen erfenis erven.", "25": "En de HEERE sprak tot Mozes en zei:", "26": "U zult ook tot de Levieten spreken, en tegen hen zeggen: Wanneer u van de kinderen van Israël de tienden zult hebben ontvangen, die Ik u voor uw erfenis van hen gegeven heb, dan zult u daarvan een hefoffer voor de HEERE offeren, de tienden van die tienden;", "27": "En het zal u gerekend worden tot uw hefoffer, als koren van de dorsvloer, en als de volheid van de perskuip.", "28": "Zo zult u ook een hefoffer voor de HEERE offeren van al uw tienden, die u van de kinderen van Israël zult hebben ontvangen; en u zult daarvan het hefoffer van de HEERE geven aan de priester Aäron.", "29": "Van al uw gaven zult u alle hefoffer van de HEERE offeren; van al het beste daarvan, van de heiliging daarvan.", "30": "U zult dan tegen hen zeggen: Als u het beste ervan offert, dan zal het de Levieten toegerekend worden als een opbrengst van de dorsvloer, en als een opbrengst van de perskuip.", "31": "En u zult dat eten op alle plaatsen, u en uw huis; want het is u een loon voor uw dienst in de tent der samenkomst.", "32": "Zo zult u daarover geen zonde dragen, als u het beste daarvan offert; en u zult de heilige dingen van de kinderen van Israël niet ontheiligen, opdat u niet sterft."}, "SV": {"1": "Zo zeide de HEERE tot Aäron: Gij, en uw zonen, en het huis uws vaders met u, zult dragen de ongerechtigheid des heiligdoms; en gij, en uw zonen met u, zult dragen de ongerechtigheid van uw priesterambt.", "2": "En ook zult gij uw broederen, den stam van Levi, den stam uws vaders, met u doen naderen, dat zij u bijgevoegd worden, en u dienen; maar gij, en uw zonen met u, zult zijn voor de tent der getuigenis.", "3": "En zij zullen uw wacht waarnemen, en de wacht der ganse tent; doch tot het gereedschap des heiligdoms en het altaar zullen zij niet naderen, opdat zij niet sterven, zo zij als gijlieden.", "4": "Maar zij zullen u bijgevoegd worden, en de wacht van de tent der samenkomst waarnemen, in allen dienst der tent; en een vreemde zal tot u niet naderen.", "5": "Gijlieden nu zult waarnemen de wacht des heiligdoms, en de wacht des altaars; opdat er geen verbolgenheid meer zij over de kinderen Israëls.", "6": "Want Ik, zie, Ik heb uw broederen, de Levieten, uit het midden der kinderen Israëls genomen; zij zijn ulieden een gave, gegeven den HEERE, om den dienst van de tent der samenkomst te bedienen.", "7": "Maar gij, en uw zonen met u, zult ulieder priesterambt waarnemen in alle zaken des altaars, en in hetgeen van binnen den voorhang is, dat zult gijlieden bedienen; uw priesterambt geve Ik *u* tot een dienst van een geschenk; en de vreemde, die nadert, zal gedood worden.", "8": "Voorts sprak de HEERE tot Aäron: En Ik, zie, Ik heb u gegeven de wacht Mijner hefofferen, met alle heilige dingen van de kinderen Israëls heb Ik ze u gegeven, om der zalving wil, en aan uw zonen, tot een eeuwige inzetting.", "9": "Dit zult gij hebben van de heiligheid der heiligheden, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen wedergeven; het zal u en uw zonen een heiligheid der heiligheden zijn.", "10": "Aan het allerheiligste zult gij dat eten; al wat mannelijk is zal dat eten; het zal u een heiligheid zijn.", "11": "Ook zal dit het uwe zijn: het hefoffer hunner gave, met alle beweegofferen der kinderen Israëls; Ik heb ze aan u gegeven, en aan uw zonen, en aan uw dochteren met u, tot een eeuwige inzetting; al wie in uw huis rein is, zal dat eten.", "12": "Al het beste van de olie, en al het beste van de most, en van koren, hun eerstelingen, die zij den HEERE zullen geven, u heb Ik ze gegeven.", "13": "De eerste vruchten van alles, wat in hun land is, die zij den HEERE zullen brengen, zullen uwe zijn; al wie in uw huis rein is, zal dat eten.", "14": "Al het verbannene in Israël zal het uwe zijn.", "15": "Al wat de baarmoeder opent, van alle vlees, dat zij den HEERE zullen brengen, onder de mensen, en onder de beesten, zal het uwe zijn; doch de eerstgeborenen der mensen zult gij ganselijk lossen; ook zult gij lossen de eerstgeborenen der onreine beesten.", "16": "Die nu onder dezelve gelost zullen worden, zult gij van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkelen, naar den sikkel des heiligdoms, die is twintig gera.", "17": "Maar het eerstgeborene van een koe, of het eerstgeborene van een schaap, of het eerstgeborene van een geit zult gij niet lossen, zij zijn heilig; hun bloed zult gij sprengen op het altaar, en hun vet zult gij aansteken, tot een vuuroffer van liefelijken reuk den HEERE.", "18": "En hun vlees zal het uwe zijn; gelijk de beweegborst, en gelijk de rechterschouder, zal het uwe zijn.", "19": "Alle hefofferen der heilige dingen, die de kinderen Israëls den HEERE zullen offeren, heb Ik aan u gegeven, en aan uw zonen, en aan uw dochteren met u, tot een eeuwige inzetting; het zal een eeuwig zoutverbond zijn, voor het aangezicht des HEEREN, voor u en voor uw zaad met u.", "20": "Ook zeide de HEERE tot Aäron: Gij zult in hun land niet erven, en gij zult geen deel in het midden van henlieden hebben; Ik ben uw deel en uw erfenis, in het midden van de kinderen Israëls.", "21": "En zie, aan de kinderen van Levi heb Ik alle tienden in Israël ter erfenis gegeven, voor hun dienst, dien zij bedienen, den dienst van de tent der samenkomst.", "22": "En de kinderen Israëls zullen niet meer naderen tot de tent der samenkomst, om zonde te dragen *en* te sterven.", "23": "Maar de Levieten, die zullen bedienen den dienst van de tent der samenkomst, en die zullen hun ongerechtigheid dragen; het zal een eeuwige inzetting zijn voor uw geslachten; en in het midden van de kinderen Israëls zullen zij geen erfenis erven.", "24": "Want de tienden der kinderen Israëls, die zij den HEERE tot een hefoffer zullen offeren, heb Ik aan de Levieten tot een erfenis gegeven; daarom heb Ik tot hen gezegd: Zij zullen in het midden van de kinderen Israëls geen erfenis erven.", "25": "En de HEERE sprak tot Mozes, zeggende:", "26": "Gij zult ook tot de Levieten spreken, en tot hen zeggen: Wanneer gij van de kinderen Israëls de tienden zult ontvangen hebben, die Ik u voor uw erfenis van henlieden gegeven heb, zo zult gij daarvan een hefoffer des HEEREN offeren, de tienden van die tienden;", "27": "En het zal u gerekend worden tot uw hefoffer, als koren van den dorsvloer, en als de volheid van de perskuip.", "28": "Alzo zult gij ook een hefoffer des HEEREN offeren van al uw tienden, die gij van de kinderen Israëls zult hebben ontvangen; en gij zult daarvan des HEEREN hefoffer geven aan den priester Aäron.", "29": "Van al uw gaven zult gij alle hefoffer des HEEREN offeren; van al het beste van die, van zijn heiliging daarvan.", "30": "Gij zult dan tot hen zeggen: Als gij deszelfs beste daarvan offert, zo zal het den Levieten toegerekend worden als een inkomen des dorsvloers, en als een inkomen der perskuip.", "31": "En gij zult dat eten in alle plaatsen, gij en uw huis; want het is ulieden een loon voor uw dienst in de tent der samenkomst.", "32": "Zo zult gij daarover geen zonde dragen, als gij deszelfs beste daarvan offert; en gij zult de heilige dingen van de kinderen Israëls niet ontheiligen, opdat gij niet sterft."}, "KJV": {"1": "And the LORD said unto Aaron, Thou and thy sons and thy father's house with thee shall bear the iniquity of the sanctuary: and thou and thy sons with thee shall bear the iniquity of your priesthood.", "2": "And thy brethren also of the tribe of Levi, the tribe of thy father, bring thou with thee, that they may be joined unto thee, and minister unto thee: but thou and thy sons with thee *shall minister* before the tabernacle of witness.", "3": "And they shall keep thy charge, and the charge of all the tabernacle: only they shall not come nigh the vessels of the sanctuary and the altar, that neither they, nor ye also, die.", "4": "And they shall be joined unto thee, and keep the charge of the tabernacle of the congregation, for all the service of the tabernacle: and a stranger shall not come nigh", "5": "And ye shall keep the charge of the sanctuary, and the charge of the altar: that there be no wrath any more upon the children of Israel.", "6": "And I, behold, I have taken your brethren the Levites from among the children of Israel: to you *they are* given *as* a gift for the LORD, to do the service of the tabernacle of the congregation.", "7": "Therefore thou and thy sons with thee shall keep your priest's office for every thing of the altar, and within the vail; and ye shall serve: I have given your priest's office *unto you* as a service of gift: and the stranger that cometh nigh shall be put to death.", "8": "And the LORD spake unto Aaron, Behold, I also have given thee the charge of mine heave offerings of all the hallowed things of the children of Israel; unto thee have I given them by reason of the anointing, and to thy sons, by an ordinance for ever.", "9": "This shall be thine of the most holy things, *reserved* from the fire: every oblation of theirs, every meat offering of theirs, and every sin offering of theirs, and every trespass offering of theirs, which they shall render unto me, *shall be* most holy for thee and for thy sons.", "10": "In the most holy *place* shalt thou eat it; every male shall eat it: it shall be holy", "11": "And this *is* thine; the heave offering of their gift, with all the wave offerings of the children of Israel: I have given them unto thee, and to thy sons and to thy daughters with thee, by a statute for ever: every one that is clean in thy house shall eat", "12": "All the best of the oil, and all the best of the wine, and of the wheat, the firstfruits of them which they shall offer unto the LORD, them have I given", "13": "*And* whatsoever is first ripe in the land, which they shall bring unto the LORD, shall be thine; every one that is clean in thine house shall eat", "14": "Every thing devoted in Israel", "15": "Every thing that openeth the matrix in all flesh, which they bring unto the LORD, *whether it be* of men or beasts, shall be thine: nevertheless the firstborn of man shalt thou surely redeem, and the firstling of unclean beasts shalt thou redeem.", "16": "And those that are to be redeemed from a month old shalt thou redeem, according to thine estimation, for the money of five shekels, after the shekel of the sanctuary, which *is* twenty gerahs.", "17": "But the firstling of a cow, or the firstling of a sheep, or the firstling of a goat, thou shalt not redeem; they *are* holy: thou shalt sprinkle their blood upon the altar, and shalt burn their fat *for* an offering made by fire, for a sweet savour unto the LORD.", "18": "And the flesh of them shall be thine, as the wave breast and as the right shoulder", "19": "All the heave offerings of the holy things, which the children of Israel offer unto the LORD, have I given thee, and thy sons and thy daughters with thee, by a statute for ever: it *is* a covenant of salt for ever before the LORD unto thee and to thy seed", "20": "And the LORD spake unto Aaron, Thou shalt have no inheritance in their land, neither shalt thou have any part among them: I *am* thy part and thine inheritance among the children of Israel.", "21": "And, behold, I have given the children of Levi all the tenth in Israel for an inheritance, for their service which they serve, *even* the service of the tabernacle of the congregation.", "22": "Neither must the children of Israel henceforth come nigh the tabernacle of the congregation, lest they bear sin, and die.", "23": "But the Levites shall do the service of the tabernacle of the congregation, and they shall bear their iniquity: *it shall be* a statute for ever throughout your generations, that among the children of Israel they have no inheritance.", "24": "But the tithes of the children of Israel, which they offer *as* an heave offering unto the LORD, I have given to the Levites to inherit: therefore I have said unto them, Among the children of Israel they shall have no inheritance.", "25": "And the LORD spake unto Moses, saying,", "26": "Thus speak unto the Levites, and say unto them, When ye take of the children of Israel the tithes which I have given you from them for your inheritance, then ye shall offer up an heave offering of it for the LORD, *even* a tenth *part* of the tithe.", "27": "And *this* your heave offering shall be reckoned unto you, as though *it were* the corn of the threshingfloor, and as the fulness of the winepress.", "28": "Thus ye also shall offer an heave offering unto the LORD of all your tithes, which ye receive of the children of Israel; and ye shall give thereof the LORD'S heave offering to Aaron the priest.", "29": "Out of all your gifts ye shall offer every heave offering of the LORD, of all the best thereof, *even* the hallowed part", "30": "Therefore thou shalt say unto them, When ye have heaved the best thereof from it, then it shall be counted unto the Levites as the increase of the threshingfloor, and as the increase of the winepress.", "31": "And ye shall eat it in every place, ye and your households: for it *is* your reward for um 18:11", "href": "../../numeri/18/#v11", "ref": "Num 18:11", "svLabel": null}, {"disp": "Num 18:18", "href": "../../numeri/18/#v18", "ref": "Num 18:18", "svLabel": null}, {"disp": "Num 18:19", "href": "../../numeri/18/#v19", "ref": "Num 18:19", "svLabel": null}, {"disp": "Num 18:31", "href": "../../numeri/18/#v31", "ref": "Num 18:31", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Job 21:10": "Hun stier bespringt en mist niet; hun koe kalft en misdraagt niet.", "Neh 12:45": "En zij namen de wacht van hun God waar, en de wacht van de reiniging, ook de zangers, en de poortwachters, naar het gebod van David en zijn zoon Salomo.", "Num 8:22": "En daarna kwamen de Levieten om hun dienst te verrichten in de tent van de samenkomst, voor het aangezicht van Aäron, en voor het aangezicht van zijn zonen; zoals de HEERE Mozes over de Levieten geboden had, zo deden zij aan hen.", "Deut 14:27": "Maar de Leviet die in uw poorten is, zult u niet verlaten; want hij heeft geen deel noch erfdeel met u.", "Lev 12:1-8": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer een vrouw zwanger is geworden en een jongetje gebaard heeft, dan zal zij zeven dagen onrein zijn; net als in de dagen van haar afzondering tijdens haar maandelijkse ongesteldheid zal zij onrein zijn. En op de achtste dag zal het vlees van zijn voorhuid besneden worden.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Ex 13:12": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn.", "Lev 8:29": "Verder nam Mozes de borst, en bewoog ze als beweegoffer voor het aangezicht van de HEERE; zij werd Mozes ten deel van de ram van het vuloffer, zoals de HEERE Mozes geboden had.", "Hos 9:2": "De dorsvloer en de wijnkuip zullen hen niet voeden, en de most zal hen bedriegen.", "Matt 10:37-39": "Wie vader of moeder liefheeft boven Mij, is Mij niet waard; en wie zoon of dochter liefheeft boven Mij, is Mij niet waard. En wie zijn kruis niet op zich neemt, en Mij navolgt, is Mij niet waard. Wie zijn ziel vindt, zal die verliezen; en wie zijn ziel verloren zal hebben om Mij, zal die vinden.", "Lev 3:2-5": "En hij zal zijn hand op het hoofd van zijn offergave leggen, en zal het slachten voor de deur van de tent der samenkomst; en de zonen van Aäron, de priesters, zullen het bloed rondom op het altaar sprengen. Daarna zal hij van dat dankoffer een vuuroffer aan de HEERE offeren; het vet, dat het ingewand bedekt, en al het vet, dat aan het ingewand is. Dan zal hij beide de nieren, en het vet, dat daaraan is, dat aan de weekdarmen is; en het net over de lever, met de nieren, zal hij afnemen.", "Num 3:45": "Neem de Levieten, in plaats van alle eerstgeboorte onder de kinderen van Israël, en de dieren van de Levieten, in plaats van hun dieren; want de Levieten zullen van Mij zijn; Ik ben de HEERE!", "Lev 5:16": "Zo zal hij vergoeden wat hij, onwetend, tekortgedaan heeft aan de heilige dingen, en zal daarbij een vijfde deel toevoegen, dat hij aan de priester geven zal; zo zal de priester met de ram van het schuldoffer voor hem verzoening doen, en het zal hem vergeven worden.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Ex 29:40": "Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "1 Tim 5:1-22": "Bestraf een oudere man niet hard, maar vermaan hem als een vader; de jongeren als broeders; De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid. Eer de weduwen, die echt weduwen zijn.", "Num 4:20": "Maar zij zullen niet binnenkomen om te kijken wanneer men het heiligdom inpakt, opdat zij niet sterven.", "1 Kor 9:1-23": "Ben ik niet een apostel? Ben ik niet vrij? Heb ik niet Jezus Christus, onze Heere, gezien? Bent u niet mijn werk in de Heere? Als ik voor anderen geen apostel ben, ben ik het toch voor u; want het zegel van het apostelschap ben ik voor u in de Heere. Mijn verantwoording aan hen die onderzoek naar mij doen, is deze.", "1 Tim 5:21": "Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "Ezech 44:28": "Dit nu zal hun tot erfenis zijn: Ik ben hun Erfenis; daarom zult u hun geen bezitting geven in Israël; Ik ben hun Bezitting.", "1 Tess 2:6": "Wij hebben ook geen eer gezocht bij mensen, niet bij u, en ook niet bij anderen; hoewel wij u tot last hadden kunnen zijn als apostelen van Christus;", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "Lev 6:15-18": "En hij zal daarvan zijn hand vol opnemen, uit de meelbloem van het spijsoffer, en van de olie daarvan, en al de wierook die op het spijsoffer is; dan zal hij het aansteken op het altaar; het is een liefelijke reuk, tot gedachtenis daarvan, voor de HEERE. En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten. Het zal niet met desem gebakken worden; het is hun deel, dat Ik hun gegeven heb van Mijn vuuroffers; het is allerheiligst, evenals het zondoffer en evenals het schuldoffer.", "Num 20:12": "Daarom zei de HEERE tot Mozes en tot Aäron: Omdat u Mij niet geloofd hebt, door Mij te heiligen voor de ogen van de kinderen van Israël, daarom zult u deze gemeente niet brengen in het land, dat Ik hun gegeven heb.", "Ex 29:27-34": "En u zult de borst van het beweegoffer heiligen, en de schouder van het hefoffer, die bewogen wordt, en die opgeheven zal zijn van de ram van het vuloffer, van hetgeen dat van Aäron is, en van hetgeen dat van zijn zonen is. En het zal voor Aäron en zijn zonen zijn tot een eeuwige inzetting vanwege de kinderen van Israël; want het is een hefoffer; en het hefoffer vanwege de kinderen van Israël zal zijn van hun dankoffers; hun hefoffer zal voor de HEERE zijn. De heilige kleren nu, die van Aäron zullen geweest zijn, zullen van zijn zonen na hem zijn, opdat men hen daarin zalft, en dat men hun hand daarin vult.", "Num 6:20": "En de priester zal die bewegen als beweegoffer, voor het aangezicht van de HEERE; het is een heilig deel voor de priester, met de borst van het beweegoffer en met de schouder van het hefoffer; en daarna zal die Nazireeër wijn drinken.", "Fil 3:8": "Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen,", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Num 4:17": "En de HEERE sprak tot Mozes en tot Aäron:", "Lev 27:21": "Maar die akker zal, nadat hij in het jubeljaar is uitgegaan, de HEERE heilig zijn, als een verboden akker; het eigendom daarvan zal aan de priester toevallen.", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Num 7:9": "Maar aan de zonen van Kohath gaf hij niets; want de dienst van de heilige dingen die op hen rustte, moesten zij op de schouders dragen.", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "2 Kor 12:13": "Want wat is er, waarin u minder geweest bent dan de andere gemeenten, behalve dan dat ikzelf u niet lastig ben geweest? Vergeef mij dit onrecht.", "Hebr 13:17": "Wees uw voorgangers gehoorzaam en wees hun onderdanig; want zij waken over uw zielen, als degenen die rekenschap moeten geven, opdat zij dit met vreugde mogen doen en niet al zuchtend; want dat is voor u niet nuttig.", "Num 3:31": "Hun wacht nu zal zijn de ark, en de tafel, en de kandelaar, en de altaren en het gereedschap van het heiligdom, waarmee zij dienst doen, en het deksel, en alles wat tot zijn dienst behoort.", "2 Kron 20:8": "Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, en zeiden:", "1 Kor 9:10-14": "Of zegt Hij dat helemaal om onzentwil? Want om onzentwil is dat geschreven; omdat wie ploegt, moet ploegen op hoop, en wie op hoop dorst, moet ook zijn hoop deelachtig worden. Als wij u het geestelijke gezaaid hebben, is het dan een grote zaak, als wij het uwe, dat lichamelijk is, maaien? Als anderen deze macht over u deelachtig zijn, waarom wij dan niet veel meer? Toch hebben wij deze macht niet gebruikt, maar wij verdragen alles, opdat wij geen enkele verhindering geven aan het Evangelie van Christus.", "Rom 15:15": "Maar ik heb u ten dele des te vrijmoediger geschreven, broeders, u als het ware opnieuw dit in herinnering brengend, om de genade die mij van God gegeven is;", "Num 4:12": "Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Matt 10:9": "Verkrijgt u geen goud, geen zilver, geen koperen geld in uw gordels;", "Ps 142:6": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden.", "Deut 14:25": "Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;", "Num 18:2-4": "En ook zult u uw broeders, de stam van Levi, de stam van uw vader, met u laten naderen, zodat zij u worden bijgevoegd, en u dienen; maar u, en uw zonen met u, zult voor de tent der getuigenis zijn. En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u. Maar zij zullen u bijgevoegd worden, en de wacht van de tent der samenkomst waarnemen, in alle dienst van de tent; en een vreemde zal u niet naderen.", "Lev 22:9": "Zij zullen dan Mijn bevel onderhouden, opdat zij daarover geen zonde dragen en daarin sterven, als zij dat ontheiligd zouden hebben; Ik ben de HEERE, Die hen heiligt!", "Hebr 7:5": "En zij die uit de kinderen van Levi het priesterschap ontvangen, hebben wel een gebod om tienden te nemen van het volk, naar de wet, dat is, van hun broeders, hoewel die uit de lenden van Abraham voortgekomen zijn.", "Lev 14:13": "Daarna zal hij dat lam slachten op de plaats waar men het zondoffer en het brandoffer slacht, in de heilige plaats; want het schuldoffer, evenals het zondoffer, is voor de priester; het is allerheiligst.", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Lev 2:10": "En wat overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.", "Hand 20:27": "Want ik heb niet nagelaten u heel de raad van God te verkondigen.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Lev 10:13": "Daarom moet u dat eten in de heilige plaats, omdat het uw bescheiden deel en het bescheiden deel van uw zonen uit de vuuroffers van de HEERE is; want zo is mij geboden.", "Lev 14:12": "En de priester zal dat ene lam nemen, en het offeren als schuldoffer met de log olie; en zal die als beweegoffer voor het aangezicht van de HEERE bewegen.", "Num 5:18": "Daarna zal de priester de vrouw voor het aangezicht van de HEERE stellen, en zal het hoofd van de vrouw ontbloten, en zal het spijsoffer van de gedachtenis op haar handen leggen, dat het spijsoffer van de ijveringen is; en in de hand van de priester zal dat bittere water zijn, dat de vloek meebrengt.", "Num 5:10": "En ieders geheiligde dingen zullen van hem zijn; wat iemand de priester zal gegeven hebben, zal van hem zijn.", "Num 18:1-7": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen. En ook zult u uw broeders, de stam van Levi, de stam van uw vader, met u laten naderen, zodat zij u worden bijgevoegd, en u dienen; maar u, en uw zonen met u, zult voor de tent der getuigenis zijn. En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u.", "Ex 40:13": "En u zult Aäron de heilige kleren aantrekken; en u zult hem zalven, en hem heiligen, zodat hij Mij als priester bedient.", "Ps 16:5": "De HEERE is het deel van mijn erfenis en van mijn beker; U onderhoudt mijn lot.", "Jes 53:6": "Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "Deut 26:13": "En u zult voor het aangezicht van de HEERE, uw God, zeggen: Ik heb het heilige uit het huis weggenomen, en heb het ook aan de Leviet en aan de vreemdeling, aan de wees en aan de weduwe gegeven, naar al Uw geboden die U mij geboden hebt; ik heb niets van Uw geboden overtreden, en niets vergeten.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Ex 28:1": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Lev 11:1": "En de HEERE sprak tot Mozes en tot Aäron, en zei tegen hen:", "Num 6:19": "Daarna zal de priester een gekookte schouder nemen van de ram, en een ongezuurde koek uit de korf, en een ongezuurde vlade; en hij zal ze op de handen van de Nazireeër leggen, nadat hij zijn Nazireeërschap afgeschoren heeft.", "Jes 53:11": "Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen.", "Deut 15:19-22": "Al het eerstgeborene, dat onder uw runderen en onder uw schapen geboren zal worden, als het een mannetje is, zult u aan de HEERE, uw God, heiligen; u zult niet werken met de eerstgeborene van uw os, en de eerstgeborene van uw schapen niet scheren. Voor het aangezicht van de HEERE, uw God, zult u ze jaar op jaar eten in de plaats die de HEERE zal uitkiezen, u en uw huis. Maar als er enig gebrek aan is, hetzij mank of blind, of enig ander ernstig gebrek, dan zult u het aan de HEERE, uw God, niet offeren;", "Lev 23:19": "Ook zult u een geitenbok tot zondoffer, en twee eenjarige lammeren tot dankoffer bereiden.", "Joh 4:36": "En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait.", "1 Kor 11:29": "Want wie onwaardig eet en drinkt, die eet en drinkt zichzelf een oordeel, omdat hij het lichaam van de Heere niet onderscheidt.", "Num 1:50": "Maar u, stel de Levieten aan over de tabernakel van de getuigenis, en over al zijn gereedschap, en over alles wat daarbij hoort; zij zullen de tabernakel dragen, en al zijn gereedschap; en zij zullen die verzorgen, en zij zullen zich rondom de tabernakel legeren.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "Deut 18:3-5": "Dit nu zal het recht van de priesters zijn van het volk, van hen die een offerande offeren, hetzij een os of klein vee: dat hij de priester de schouder zal geven, en beide kaken, en de pens. De eerstelingen van uw koren, van uw most en van uw olie, en de eerstelingen van de wol van uw schapen zult u hem geven; want de HEERE, uw God, heeft hem uit al uw stammen verkozen, dat hij staat om te dienen in de Naam van de HEERE, hij en zijn zonen, alle dagen.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "Num 4:1": "En de HEERE sprak tot Mozes en tot Aäron:", "Ps 73:17": "Totdat ik in Gods heiligdommen inging, en op hun einde lette.", "Num 1:50-53": "Maar u, stel de Levieten aan over de tabernakel van de getuigenis, en over al zijn gereedschap, en over alles wat daarbij hoort; zij zullen de tabernakel dragen, en al zijn gereedschap; en zij zullen die verzorgen, en zij zullen zich rondom de tabernakel legeren. En als de tabernakel zal optrekken, zullen de Levieten hem afbreken; en wanneer de tabernakel neergezet moet worden, zullen de Levieten hem oprichten; en de vreemde die daarbij komt, zal gedood worden. En de kinderen van Israël zullen zich legeren, ieder bij zijn eigen leger, en ieder bij zijn eigen banier, naar hun legers.", "Matt 10:5-42": "Deze twaalf heeft Jezus uitgezonden, en Hij gaf hun bevel en zei: U moet niet heengaan op de weg van de heidenen, en u moet niet ingaan in enige stad van de Samaritanen. Maar ga veel meer heen naar de verloren schapen van het huis van Israël. En terwijl u heengaat, predikt en zeg: Het Koninkrijk der hemelen is nabijgekomen.", "Deut 10:9": "Daarom heeft Levi geen deel, en ook geen erfdeel met zijn broeders; de HEERE is zijn erfdeel, zoals de HEERE, uw God, tegen hem gesproken heeft.", "Ex 29:44": "En Ik zal de tent van de samenkomst heiligen, alsook het altaar; Ik zal ook Aäron en zijn zonen heiligen, opdat zij Mij het priesterambt bedienen.", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "Lev 21:12": "En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "Lev 13:1": "Verder sprak de HEERE tot Mozes en tot Aäron, en Hij zei:", "Lev 10:17": "Waarom hebt u dat zondoffer niet gegeten in de heilige plaats? Want het is allerheiligst, en Hij heeft het u gegeven, opdat u de ongerechtigheid van de gemeenschap zou dragen, om voor hen verzoening te doen voor het aangezicht van de HEERE.", "Hos 9:10": "Ik vond Israël als druiven in de woestijn, Ik zag uw vaders als de eerste vrucht aan de vijgenboom in haar begintijd; maar zij gingen naar Baäl-peor, en zonderden zich af tot die schande, en werden helemaal verfoeilijk, net als datgene wat zij liefhadden.", "Num 5:15": "Dan zal die man zijn huisvrouw tot de priester brengen, en zal haar offerande voor haar meebrengen, een tiende deel van een efa gerstemeel; hij zal geen olie daarop gieten, en geen wierook daarop leggen, omdat het een spijsoffer van de ijveringen is, een spijsoffer van de gedachtenis, dat de ongerechtigheid in gedachtenis brengt.", "1 Kron 26:27": "Van de oorlogen en van de buit hadden zij het geheiligd, om het huis van de HEERE te onderhouden.", "Num 3:48": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten.", "Matt 28:15": "En zij namen het geld, en deden zoals hun geleerd was. En dit verhaal is onder de Joden verspreid geraakt tot op deze huidige dag.", "Num 3:13": "Want elke eerstgeborene is van Mij; van de dag dat Ik alle eerstgeborenen in Egypteland sloeg, heb Ik Mij geheiligd alle eerstgeborenen in Israël, van de mensen tot de dieren; zij zullen van Mij zijn; Ik ben de HEERE!", "Neh 10:38": "En dat er een priester, een zoon van Aäron, bij de Levieten zou zijn, als de Levieten de tienden ontvangen; en dat de Levieten de tienden zouden opbrengen naar het huis van onze God, in de kamers van het schathuis.", "Lev 7:14": "En één daarvan uit de hele offergave zal hij de HEERE als hefoffer offeren; het zal voor de priester zijn die het bloed van het dankoffer sprenkelt.", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "Lev 6:29": "Al wie mannelijk is onder de priesters, zal daarvan eten; het is allerheiligst.", "Ex 30:13": "Dit moeten zij geven, ieder die overgaat tot de getelden: de helft van een sikkel, naar de sikkel van het heiligdom (deze sikkel is twintig gera); de helft van een sikkel is een hefoffer voor de HEERE.", "Richt 5:19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "Jes 63:18": "Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "Lev 16:2": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel.", "Lev 10:12-14": "En Mozes sprak tegen Aäron, en tegen Eleazar en tegen Ithamar, zijn overgebleven zonen: Neem het spijsoffer dat over is van de vuuroffers van de HEERE, en eet dat ongezuurd bij het altaar; want het is allerheiligst. Daarom moet u dat eten in de heilige plaats, omdat het uw bescheiden deel en het bescheiden deel van uw zonen uit de vuuroffers van de HEERE is; want zo is mij geboden. Ook de beweegborst en de hefschouder moet u eten in een reine plaats, u, en uw zonen, en uw dochters met u; want als uw bescheiden deel, en het bescheiden deel van uw zonen, zijn zij uit de dankoffers van de kinderen van Israël gegeven.", "2 Kor 11:7-9": "Heb ik zonde gedaan, toen ik mijzelf vernederd heb opdat u verhoogd zou worden, omdat ik u het Evangelie van God om niet verkondigd heb? Ik heb andere gemeenten beroofd, doordat ik bezoldiging van hen nam om u te dienen; en toen ik bij u aanwezig was en gebrek had, ben ik niemand lastig gevallen. Want mijn gebrek hebben de broeders vervuld die van Macedonië kwamen; en ik heb mijzelf in alles gehouden zonder u te bezwaren, en ik zal mij nog zo houden.", "Num 15:15": "U, gemeente, het geldt voor u en voor de vreemdeling die als vreemdeling bij u verblijft, één inzetting: een eeuwige inzetting bij uw geslachten; zoals u bent, zo zal de vreemdeling voor het aangezicht van de HEERE zijn.", "1 Kon 21:6": "En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.", "Deut 14:29": "Zo zal de Leviet komen – omdat hij geen deel noch erfdeel met u heeft – en de vreemdeling, en de wees en de weduwe die in uw poorten zijn, en zij zullen eten en verzadigd worden; opdat de HEERE, uw God, u zegent in al het werk van uw hand, dat u doen zult.", "Ex 12:24": "Neemt dan deze zaak in acht, als een inzetting voor u en voor uw kinderen, tot in eeuwigheid.", "Num 3:9": "U zult dan, aan Aäron en aan zijn zonen, de Levieten geven; zij zijn gegeven, zij zijn hem gegeven, uit de kinderen van Israël.", "Lev 5:1": "Als een mens gezondigd zal hebben, doordat hij een stem van de vloek gehoord heeft, waarvan hij getuige is, hetzij dat hij het gezien of geweten heeft; als hij het niet bekendmaakt, dan zal hij zijn ongerechtigheid dragen.", "Ezech 44:28-31": "Dit nu zal hun tot erfenis zijn: Ik ben hun Erfenis; daarom zult u hun geen bezitting geven in Israël; Ik ben hun Bezitting. Het spijsoffer, en het zondoffer, en het schuldoffer, die zullen zij eten; ook zal al het verbannene  in Israël het hunne zijn. En de eerstelingen van alle eerste vruchten van alles, en elk hefoffer van alles, van al uw hefoffers, zullen voor de priesters zijn; ook zult u de eerstelingen van uw deeg de priester geven, om de zegen op uw huis te doen rusten.", "Lev 10:12": "En Mozes sprak tegen Aäron, en tegen Eleazar en tegen Ithamar, zijn overgebleven zonen: Neem het spijsoffer dat over is van de vuuroffers van de HEERE, en eet dat ongezuurd bij het altaar; want het is allerheiligst.", "Lev 7:31": "En de priester zal dat vet op het altaar aansteken; maar de borst zal voor Aäron en zijn zonen zijn.", "Deut 14:22": "U zult getrouw vertienen alle opbrengst van uw zaad, dat elk jaar van het veld voortkomt.", "1 Tim 2:1-15": "Ik vermaan dan voor alle dingen, dat er smekingen, gebeden, voorbiddingen en dankzeggingen gedaan worden voor alle mensen; voor koningen en allen die in hoge positie zijn, opdat wij een rustig en stil leven kunnen leiden in alle godsvrucht en eerbaarheid. Want dat is goed en aangenaam voor God, onze Zaligmaker;", "Num 26:62": "En hun getelden waren drieëntwintigduizend, al wat mannelijk is, van een maand oud en daarboven; want dezen werden niet geteld onder de kinderen van Israël, omdat hun geen erfenis gegeven werd onder de kinderen van Israël.", "Mal 2:4-7": "Dan zult u weten dat Ik dit gebod tot u gezonden heb, opdat Mijn verbond met Levi blijft bestaan, zegt de HEERE van de heerscharen. Mijn verbond met hem was het leven en de vrede; en Ik gaf hem die tot een vrees, en hij vreesde Mij, en hij werd om Mijn Naam bevreesd. De wet van de waarheid was in zijn mond, en er werd geen onrecht in zijn lippen gevonden; hij wandelde met Mij in vrede en in rechtvaardigheid, en hij bekeerde er velen van ongerechtigheid.", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "Deut 26:11-13": "en u zult vrolijk zijn over al het goede dat de HEERE, uw God, aan u en uw huis gegeven heeft; u, en de Leviet, en de vreemdeling die in uw midden is. Wanneer u klaar bent met het vertienen van alle tienden van uw inkomen, in het derde jaar, het jaar van de tienden; dan zult u aan de Leviet, aan de vreemdeling, aan de wees en aan de weduwe geven, opdat zij in uw poorten eten en verzadigd worden. En u zult voor het aangezicht van de HEERE, uw God, zeggen: Ik heb het heilige uit het huis weggenomen, en heb het ook aan de Leviet en aan de vreemdeling, aan de wees en aan de weduwe gegeven, naar al Uw geboden die U mij geboden hebt; ik heb niets van Uw geboden overtreden, en niets vergeten.", "Num 18:10-19": "Aan het allerheiligste zult u dat eten; ieder die mannelijk is zal dat eten; het zal u een heilig ding zijn. Ook zal dit het uwe zijn: het hefoffer van hun gave, met alle beweegoffers van de kinderen van Israël; Ik heb ze aan u gegeven, en aan uw zonen, en aan uw dochters met u, tot een eeuwige inzetting; ieder die in uw huis rein is, zal dat eten. Al het beste van de olie, en al het beste van de most, en van koren, hun eerstelingen, die zij de HEERE zullen geven, heb Ik u gegeven.", "Luk 10:1-16": "En hierna wees de Heere nog tweeënzeventig anderen aan, en zond hen twee aan twee voor Zich uit, naar elke stad en plaats waar Hij komen zou. Hij zei dan tegen hen: De oogst is wel groot, maar de arbeiders zijn weinige; bid daarom de Heere van de oogst, dat Hij arbeiders in Zijn oogst uitstuurt. Ga heen; zie, Ik zend u als lammeren te midden van de wolven.", "2 Kon 6:27": "En hij zei: De HEERE helpt u niet; waarmee zou ik u helpen? Van de dorsvloer of van de wijnpers?", "Hebr 1:9": "U hebt rechtvaardigheid liefgehad, en ongerechtigheid gehaat; daarom heeft God, Uw God, U gezalfd met de olie van vreugde boven Uw medegenoten.", "Ex 30:9": "U moet geen vreemd reukwerk daarop aansteken, ook geen brandoffer, geen spijsoffer; u moet er ook geen drankoffer op gieten.", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "Lev 27:18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "2 Kron 31:6": "En de kinderen van Israël en Juda, die in de steden van Juda woonden, brachten ook tienden van de runderen en van de schapen, en tienden van de heilige dingen die aan de HEERE, hun God, geheiligd waren, en maakten er veel hopen van.", "Ex 28:40-43": "Voor de zonen van Aäron zult u ook rokken maken, en u zult voor hen gordels maken; ook zult u voor hen mutsen maken, tot heerlijkheid en sieraad. En u zult die uw broeder Aäron en ook zijn zonen aantrekken; en u zult hen zalven, en hun hand vullen, en hen heiligen, zodat zij Mij het priesterambt bedienen. Maak hun ook linnen onderbroeken, om het vlees van de schaamte te bedekken; zij zullen zijn van de lenden tot de dijen.", "Num 10:21": "Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.", "Num 3:8": "En dat zij al het gereedschap van de tent der samenkomst, en de wacht van de kinderen van Israël waarnemen, om de dienst van de tabernakel te bedienen.", "Lev 4:27": "En als een gewoon mens van het volk van het land door afdwaling gezondigd zal hebben, doordat hij iets doet tegen een van de geboden van de HEERE, wat niet gedaan zou mogen worden, zodat hij schuldig is;", "Neh 13:12": "Toen bracht heel Juda de tienden van het koren, en van de most, en van de olie, naar de schatkamers.", "Lev 10:15": "De hefschouder en de beweegborst zullen zij samen met de vuuroffers van het vet brengen, om als beweegoffer voor het aangezicht van de HEERE te bewegen; dat zal voor u en uw zonen met u tot een eeuwige inzetting zijn, zoals de HEERE geboden heeft.", "1 Kor 11:27": "Zo dan, wie onwaardig dit brood eet, of de drinkbeker van de Heere drinkt, die zal schuldig zijn aan het lichaam en bloed van de Heere.", "Num 15:3-16": "En u de HEERE een vuuroffer zult doen, een brandoffer of slachtoffer, om een gelofte af te zonderen, of in een vrijwillig offer, of op uw vastgestelde hoogtijden, om de HEERE een liefelijke reuk te maken, van runderen of van klein vee; Zo zal hij, die zijn offerande de HEERE offert, een spijsoffer offeren van een tiende meelbloem, gemengd met een vierendeel van een hin olie. En wijn ten drankoffer, een vierendeel van een hin, zult u bereiden tot een brandoffer of tot een slachtoffer, voor één lam.", "Deut 31:14-23": "En de HEERE zei tegen Mozes: Zie, uw dagen zijn genaderd om te sterven; roep Jozua, en stel u op in de tent van de samenkomst, zodat Ik hem een opdracht geef. Zo ging Mozes, en Jozua, en zij stelden zich op in de tent van de samenkomst. Toen verscheen de HEERE in de tent, in de wolkkolom; en de wolkkolom stond boven de deur van de tent. En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb.", "Matt 6:33": "Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "1 Kron 26:26": "Deze Selomith en zijn broers waren over al de schatten van de heilige dingen, die koning David geheiligd had, alsook de hoofden van de families, de leiders over duizenden en honderden, en de leiders van het leger;", "Ezech 3:19": "Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd.", "Jer 24:2": "In de ene korf waren zeer goede vijgen, zoals de eerste rijpe vijgen zijn; maar in de andere korf waren zeer slechte vijgen, die vanwege de slechtheid niet gegeten konden worden.", "Num 4:16": "Het toezicht nu van Eleazar, de zoon van Aäron, de priester, zal zijn over de olie van het licht, en het reukwerk van de welriekende specerijen, en het gedurige spijsoffer, en de zalfolie; het toezicht over de hele tabernakel, en alles wat daarin is, over het heiligdom en zijn gereedschap.", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Lev 22:11-13": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten. Maar als de dochter van de priester aan een vreemde man zal toebehoren, zal zij van het hefoffer van de heilige dingen niet eten. Maar als de dochter van de priester een weduwe of een verstotene zal zijn, en geen nageslacht heeft, en naar het huis van haar vader zal zijn teruggekeerd zoals in haar jeugd, dan zal zij van het voedsel van haar vader eten; maar geen vreemde zal daarvan eten.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Lev 22:3": "Zeg tegen hen: Elke man onder uw geslachten, uit uw hele nageslacht, die tot de heilige dingen zal naderen die de kinderen van Israël de HEERE heiligen, terwijl zijn onreinheid op hem is; die mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE!", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Lev 22:11": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.", "Ef 3:8": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "2 Kron 30:8": "Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Lev 27:27": "Maar is het van een onrein dier, dan zal hij dat afkopen naar uw schatting, en zal er zijn vijfde deel daarboven aan toevoegen; en als het niet afgekocht wordt, dan zal het verkocht worden, naar uw schatting.", "Deut 26:12-15": "Wanneer u klaar bent met het vertienen van alle tienden van uw inkomen, in het derde jaar, het jaar van de tienden; dan zult u aan de Leviet, aan de vreemdeling, aan de wees en aan de weduwe geven, opdat zij in uw poorten eten en verzadigd worden. En u zult voor het aangezicht van de HEERE, uw God, zeggen: Ik heb het heilige uit het huis weggenomen, en heb het ook aan de Leviet en aan de vreemdeling, aan de wees en aan de weduwe gegeven, naar al Uw geboden die U mij geboden hebt; ik heb niets van Uw geboden overtreden, en niets vergeten. Ik heb daarvan niets gegeten in mijn rouw, en heb daarvan niets weggenomen tot iets onreins, en daarvan ook niets gegeven voor een dode; ik ben de stem van de HEERE, mijn God, gehoorzaam geweest, ik heb gedaan naar alles wat U mij geboden hebt.", "Lev 27:25": "Al uw schatting nu zal gebeuren naar de sikkel van het heiligdom; de sikkel zal van twintig gera zijn.", "Lev 9:21": "Maar de borsten en de rechterschouder bewoog Aäron tot beweegoffer voor het aangezicht van de HEERE, zoals Mozes geboden had.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Ezech 3:18": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.", "Jer 23:15": "Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land.", "Num 3:6": "Laat de stam van Levi naderen, en stel hem voor het aangezicht van de priester Aäron, opdat zij hem dienen;", "2 Kon 22:9": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.", "Deut 18:1-8": "De Levitische priesters, de hele stam van Levi, zullen geen deel of erfdeel hebben met Israël; de vuuroffers van de HEERE en Zijn erfdeel zullen zij eten. Daarom zal hij geen erfdeel hebben tussen zijn broeders; de HEERE is zijn Erfdeel, zoals Hij tot hem gesproken heeft. Dit nu zal het recht van de priesters zijn van het volk, van hen die een offerande offeren, hetzij een os of klein vee: dat hij de priester de schouder zal geven, en beide kaken, en de pens.", "2 Kron 31:4": "En hij zei tegen het volk, tegen de inwoners van Jeruzalem, dat zij het deel van de priesters en Levieten zouden geven, opdat zij versterkt zouden worden in de wet van de HEERE.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "Jes 10:27": "En het zal gebeuren op diezelfde dag, dat zijn last zal afwijken van uw schouder, en zijn juk van uw hals; en het juk zal verdorven worden, vanwege de Gezalfde.", "Num 16:1-35": "Korach nu, de zoon van Jizhar, zoon van Kohath, zoon van Levi, nam tot zich zowel Dathan als Abiram, zonen van Eliab, en On, de zoon van Peleth, zonen van Ruben. En zij stonden op voor het aangezicht van Mozes, alsook tweehonderd en vijftig mannen uit de kinderen van Israël, leiders van de vergadering, de geroepenen van de samenkomst, mannen van naam. En zij verzamelden zich tegen Mozes en tegen Aäron, en zeiden tegen hen: Het is te veel voor u, want deze hele vergadering, zij allen, zijn heilig, en de HEERE is in hun midden; waarom verheft u zich dan boven de gemeente van de HEERE?", "1 Sam 2:28": "En Ik heb hem uit alle stammen van Israël voor Mij tot priester verkozen, om te offeren op Mijn altaar, om het reukwerk aan te steken, om de efod voor Mijn aangezicht te dragen; en heb aan het huis van uw vader al de vuuroffers van de kinderen van Israël gegeven.", "Ex 13:13": "Maar alles wat de baarmoeder van de ezelin opent, moet u vrijkopen met een lam; en als u het niet vrijkoopt, moet u het de nek breken; maar alle eerstgeborenen van de mens onder uw zonen moet u vrijkopen.", "Neh 10:37": "En dat wij de eerstelingen van ons deeg, en onze hefoffers, en de vrucht van alle bomen, most en olie, zouden brengen tot de priesters, in de kamers van het huis van onze God, en de tienden van ons land tot de Levieten; en dat diezelfde Levieten de tienden zouden hebben in alle steden van onze landbouw;", "Deut 12:6": "En daarheen zult u brengen uw brandoffers, en uw slachtoffers, en uw tienden, en het hefoffer van uw hand, en uw geloften, en uw vrijwillige offers, en de eerstgeboorte van uw runderen en van uw schapen.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Ex 13:11-15": "Het zal ook gebeuren, wanneer de HEERE u in het land van de Kanaänieten gebracht zal hebben, zoals Hij u en uw vaderen gezworen heeft, en Hij het u gegeven zal hebben, dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn. Maar alles wat de baarmoeder van de ezelin opent, moet u vrijkopen met een lam; en als u het niet vrijkoopt, moet u het de nek breken; maar alle eerstgeborenen van de mens onder uw zonen moet u vrijkopen.", "Lev 21:22": "Het voedsel van zijn God, van de allerheiligste dingen, en van de heilige dingen, zal hij mogen eten;", "2 Tim 2:1-26": "U dan, mijn zoon, word gesterkt in de genade die in Christus Jezus is; en wat u van mij gehoord hebt onder veel getuigen, vertrouw dat toe aan trouwe mensen, die bekwaam zullen zijn om ook anderen te leren. Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "Num 17:1-4": "Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en neem van hen voor elk vaderlijk huis een staf, van al hun leiders, naar het huis van hun vaderen, twaalf staven; ieders naam zult u schrijven op zijn staf. Doch Aärons naam zult u schrijven op de staf van Levi; want er zal één staf zijn voor het hoofd van het huis van hun vaderen.", "Num 3:21-37": "Van Gerson was het geslacht van de Libnieten, en het geslacht van de Simeïeten; dit zijn de geslachten van de Gersonieten. Hun getelden in getal waren van al wat mannelijk was, van een maand oud en daarboven; hun getelden waren zevenduizend vijfhonderd. De geslachten van de Gersonieten zullen zich legeren achter de tabernakel, westwaarts.", "Num 31:29": "Van hun helft moet u het nemen, en aan Eleazar, de priester, geven, als een heffing voor de HEERE.", "Deut 18:1": "De Levitische priesters, de hele stam van Levi, zullen geen deel of erfdeel hebben met Israël; de vuuroffers van de HEERE en Zijn erfdeel zullen zij eten.", "Lev 6:19-23": "Verder sprak de HEERE tot Mozes en zei: Dit is de offerande van Aäron en van zijn zonen, die zij de HEERE offeren zullen op de dag dat hij gezalfd wordt: het tiende deel van een efa meelbloem, een voortdurend spijsoffer; de helft daarvan op de morgen, en de helft daarvan op de avond. Het zal in een pan met olie gemaakt worden; geroosterd zult u het brengen; en de gebakken stukken van het spijsoffer zult u offeren, tot een liefelijke reuk voor de HEERE.", "Num 8:14": "En u zult de Levieten uit het midden van de kinderen van Israël uitscheiden, opdat de Levieten van Mij zijn.", "2 Kron 29:21": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren.", "Ex 40:29": "En hij zette het altaar van het brandoffer bij de deur van de tabernakel, van de tent der samenkomst; en hij offerde daarop brandoffer en spijsoffer, zoals de HEERE aan Mozes geboden had.", "Num 8:19": "En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.", "Ex 22:29": "Met het brengen van de opbrengst van uw oogst en van uw perskuip mag u niet talmen; de eerstgeborene van uw zonen moet u aan Mij geven.", "2 Kron 31:5": "Toen dat bevel nu bekend werd, brachten de kinderen van Israël veel eerstelingen van koren, most, en olie, en honing, en van alle opbrengsten van het veld; ook brachten zij de tienden van alles in met overvloed.", "1 Sam 2:13": "Want de gewoonte van deze priesters met het volk was, dat wanneer iemand een offer offerde, de jongen van de priester kwam, terwijl het vlees kookte, met een drietandige vork in zijn hand;", "Lev 22:15": "Zo zullen zij de heilige dingen van de kinderen van Israël, die zij de HEERE zullen hebben gegeven, niet ontheiligen;", "Ex 31:6": "En Ik, zie, Ik heb hem Aholiab bijgevoegd, de zoon van Ahisamach, van de stam van Dan; en in het hart van ieder die wijs van hart is, heb Ik wijsheid gegeven; en zij zullen alles maken wat Ik u geboden heb.", "Ezech 48:8": "Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn.", "Num 18:8-18": "Verder sprak de HEERE tot Aäron: En Ik, zie, Ik heb u gegeven de wacht van Mijn hefoffers, met alle heilige dingen van de kinderen van Israël heb Ik ze u gegeven, vanwege de zalving, en aan uw zonen, tot een eeuwige inzetting. Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn. Aan het allerheiligste zult u dat eten; ieder die mannelijk is zal dat eten; het zal u een heilig ding zijn.", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "Hebr 7:1-10": "Want deze Melchizedek was koning van Salem, een priester van de allerhoogste God, die Abraham tegemoet ging toen hij terugkeerde van het verslaan van de koningen, en hem zegende; aan wie Abraham ook van alles de tienden gaf; hij wordt eerst vertaald met 'koning van de gerechtigheid', en daarna was hij ook koning van Salem, dat is: koning van de vrede; zonder vader, zonder moeder, zonder geslachtsregister, zonder begin van dagen of einde van leven, maar gelijk geworden aan de Zoon van God, blijft hij een priester voor eeuwig.", "Lev 7:35": "Dit is het deel van de zalving van Aäron en de zalving van zijn zonen, van de vuuroffers van de HEERE, op de dag toen Hij hen liet naderen om het priesterschap voor de HEERE te bedienen;", "Gen 9:9": "Maar Ik, zie, Ik richt Mijn verbond op met u, en met uw nageslacht na u;", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "Lev 6:16": "En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten.", "Lev 6:17-20": "Het zal niet met desem gebakken worden; het is hun deel, dat Ik hun gegeven heb van Mijn vuuroffers; het is allerheiligst, evenals het zondoffer en evenals het schuldoffer. Al wie mannelijk is onder de zonen van Aäron zal het eten; het is een eeuwige inzetting voor uw geslachten, van de vuuroffers van de HEERE; al wat die zal aanraken, zal heilig zijn. Verder sprak de HEERE tot Mozes en zei:", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "1 Petr 2:13": "Wees dan onderdanig aan alle menselijke instelling, om de Heere; hetzij aan de koning, als hebbende het hoogste gezag;", "Neh 10:35": "Dat wij ook de eerstelingen van ons land en de eerstelingen van alle vrucht van al het geboomte, jaar op jaar, zouden brengen naar het huis van de HEERE;", "Lev 27:2-7": "Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer iemand een gelofte gedaan heeft om iemand af te zonderen, zullen de zielen naar uw schatting van de HEERE zijn. Als uw schatting van een man geldt, van twintig jaar oud tot iemand die zestig jaar oud is, dan zal uw schatting vijftig sikkel zilver zijn, naar de sikkel van het heiligdom. Maar is het een vrouw, dan zal uw schatting dertig sikkel zijn.", "Luk 22:35": "En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Neh 10:35-37": "Dat wij ook de eerstelingen van ons land en de eerstelingen van alle vrucht van al het geboomte, jaar op jaar, zouden brengen naar het huis van de HEERE; En de eerstgeborenen van onze zonen en onze dieren, zoals het in de wet geschreven is; en dat wij de eerstgeborenen van onze runderen en onze schapen zouden brengen naar het huis van onze God, tot de priesters, die in het huis van onze God dienen. En dat wij de eerstelingen van ons deeg, en onze hefoffers, en de vrucht van alle bomen, most en olie, zouden brengen tot de priesters, in de kamers van het huis van onze God, en de tienden van ons land tot de Levieten; en dat diezelfde Levieten de tienden zouden hebben in alle steden van onze landbouw;", "Lev 4:22": "Als een leider zal gezondigd hebben, en tegen een van de geboden van de HEERE zijn God, door afdwaling, gedaan zal hebben wat niet gedaan zou mogen worden, zodat hij schuldig is;", "Num 19:20": "Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.", "Lev 19:8": "En wie het eet, zal zijn ongerechtigheid dragen, omdat hij het heilige van de HEERE ontheiligd heeft; daarom zal die ziel uit haar volken uitgeroeid worden.", "Mal 1:7": "U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk.", "Num 3:40-51": "En de HEERE zei tegen Mozes: Tel alle eerstgeborenen, wat mannelijk is onder de kinderen van Israël, van een maand oud en daarboven; en neem het getal van hun namen op. En u zult voor Mij de Levieten nemen (Ik ben de HEERE!), in plaats van alle eerstgeborenen onder de kinderen van Israël, en de dieren van de Levieten, in plaats van alle eerstgeborenen onder de dieren van de kinderen van Israël. Mozes dan telde, zoals de HEERE hem geboden had, alle eerstgeborenen onder de kinderen van Israël.", "1 Tim 3:1-16": "Dit is een betrouwbaar woord: als iemand ernaar verlangt opziener te worden, begeert hij een voortreffelijk werk. Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren; niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "Lev 14:10": "En op de achtste dag zal hij twee volkomen lammeren, en een eenjarig volkomen schaap nemen, alsook drie tienden meelbloem als spijsoffer, met olie gemengd, en een log olie.", "2 Tess 3:7-9": "Want u zelf weet hoe men ons behoort na te volgen; want wij hebben ons niet ongeregeld gedragen onder u; En wij hebben geen brood bij iemand gegeten voor niets, maar in arbeid en moeite, nacht en dag werkend, opdat wij niemand van u lastig zouden zijn; Niet dat wij de macht niet hebben, maar opdat wij onszelf u zouden geven tot een voorbeeld, om ons na te volgen.", "Lev 2:13": "En elk offer van uw spijsoffer zult u met zout zouten, en het zout van het verbond van uw God mag u niet laten ontbreken bij uw spijsoffer; met heel uw offer zult u zout offeren.", "Lev 6:18": "Al wie mannelijk is onder de zonen van Aäron zal het eten; het is een eeuwige inzetting voor uw geslachten, van de vuuroffers van de HEERE; al wat die zal aanraken, zal heilig zijn.", "Mark 6:11": "En als iemand u niet ontvangt, en niet naar u luistert, schud dan, wanneer u vandaar vertrekt, het stof van uw voeten af, hun tot een getuigenis. Voorwaar, Ik zeg u: Het zal voor Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Ex 25:8": "En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.", "Lev 2:14": "En als u de HEERE een spijsoffer van de eerste vruchten offert, zult u voor het spijsoffer van uw eerste vruchten groene aren, bij het vuur gedord, offeren, dat is, het klein gebroken graan van volle groene aren.", "Num 16:46": "En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen.", "Num 27:18-23": "Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem; En stel hem voor Eleazar, de priester, en voor de hele vergadering; en geef hem opdracht voor hun ogen; En leg iets van uw waardigheid op hem, opdat zij luisteren, namelijk de hele vergadering van de kinderen van Israël.", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "Num 15:19-21": "Dan zal het gebeuren, wanneer u van het brood van het land eet, dat u de HEERE een hefoffer zult offeren. De eerstelingen van uw deeg, een koek, zult u tot een hefoffer offeren; zoals het hefoffer van de dorsvloer, zo zult u het offeren. Van de eerstelingen van uw deeg zult u de HEERE een hefoffer geven, bij uw geslachten.", "2 Kron 26:18": "En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Ps 74:7": "Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.", "Joz 18:7": "Want de Levieten hebben geen deel in uw midden; maar het priesterschap van de HEERE is hun erfdeel. Gad nu, en Ruben, en de halve stam van Manasse, hebben hun erfdeel genomen aan de overkant van de Jordaan, oostwaarts, dat Mozes, de knecht van de HEERE, hun gegeven heeft.", "Lev 6:25": "Spreek tot Aäron en tot zijn zonen en zeg: Dit is de wet van het zondoffer: op de plaats waar het brandoffer geslacht wordt, zal het zondoffer voor het aangezicht van de HEERE geslacht worden; het is allerheiligst.", "Fil 4:10-18": "En ik ben zeer verblijd geweest in de Heere, dat u nu eindelijk opnieuw bent opgebloeid om aan mij te denken; waaraan u ook gedacht hebt, maar u hebt de gelegenheid niet gehad. Niet dat ik dit zeg vanwege gebrek; want ik heb geleerd tevreden te zijn in de omstandigheden waarin ik ben. En ik weet vernederd te worden, ik weet ook overvloed te hebben; in alle opzichten en in alles ben ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden.", "Lev 6:26": "De priester die het voor de zonde offert, zal het eten; in de heilige plaats zal het gegeten worden, in de voorhof van de tent der samenkomst.", "Lev 18:13": "U zult de schaamte van de zuster van uw moeder niet ontdekken; want zij is de nabestaande van uw moeder.", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "Num 3:7": "En dat zij zijn wacht waarnemen, en de wacht van de hele vergadering, voor de tent der samenkomst, om de dienst van de tabernakel te bedienen;", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Lev 5:6": "En hij zal zijn schuldoffer aan de HEERE brengen voor zijn zonde die hij gezondigd heeft: een wijfje van het kleinvee, een lam of een jonge geit, als zondoffer; en de priester zal voor hem verzoening doen vanwege zijn zonde.", "Ex 23:19": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.", "Joz 13:14": "Alleen aan de stam Levi gaf hij geen erfenis. De vuuroffers van God, de HEERE van Israël, zijn zijn erfenis, zoals Hij tot hem gesproken had.", "Lev 23:13": "en zijn spijsoffer twee tienden meelbloem, met olie gemengd, tot een vuuroffer, voor de HEERE tot een liefelijke reuk; en zijn drankoffer van wijn, het vierde deel van een hin.", "Num 3:46-51": "Aangaande de tweehonderddrieënzeventig, die gelost zullen worden, die overschieten, boven de Levieten, van de eerstgeborenen van de kinderen van Israël; U zult voor elk hoofd vijf sikkels nemen; naar de sikkel van het heiligdom zult u ze nemen; die sikkel is twintig gera. En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten.", "Lev 27:26": "Maar het eerstgeborene, dat de HEERE als eerstgeborene van een dier toebehoort, dat zal niemand heiligen; hetzij een rund, of een schaap of geit, het is van de HEERE.", "Num 5:25": "En de priester zal uit de hand van die vrouw het spijsoffer van de ijveringen nemen, en hij zal dat spijsoffer voor het aangezicht van de HEERE bewegen, en zal dat op het altaar offeren.", "Lev 5:12": "En hij zal het naar de priester brengen, en de priester zal daarvan een handvol nemen, als gedenkdeel daarvan, en dat op het altaar aansteken, boven op de vuuroffers van de HEERE; het is een zondoffer.", "Gen 43:11": "Toen zei Israël, hun vader, tegen hen: Is het nu zo, doe dan dit; neem van het beste fruit van dit land in uw zakken, en breng die man een geschenk mee: een weinig balsem,
