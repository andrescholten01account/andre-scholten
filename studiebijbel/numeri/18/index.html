v\" data-code=\"H4150\">congregation,</span> for all the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle:</span> and a <span class=\"wl wl-kjv\" data-code=\"H2114\">stranger</span> shall not come nigh", "5": "And ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar:</span> that there be no <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> any more upon the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.", "6": "And I, behold, I have <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> to you they are <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> as a <span class=\"wl wl-kjv\" data-code=\"H4979\">gift</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">do</span> the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.", "7": "Therefore thou and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> with thee shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> your priest's <span class=\"wl wl-kjv\" data-code=\"H3550\">office</span> for every <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and <span class=\"wl wl-kjv\" data-code=\"H1004\">within</span> the <span class=\"wl wl-kjv\" data-code=\"H6532\">vail;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve:</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> your priest's <span class=\"wl wl-kjv\" data-code=\"H3550\">office</span> unto you as a <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of <span class=\"wl wl-kjv\" data-code=\"H4979\">gift:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2114\">stranger</span> that cometh <span class=\"wl wl-kjv\" data-code=\"H7131\">nigh</span> shall be put to death.", "8": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> Behold, I also have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of mine heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offerings</span> of all the hallowed <span class=\"wl wl-kjv\" data-code=\"H6944\">things</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> unto thee have I <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> them by reason of the <span class=\"wl wl-kjv\" data-code=\"H4888\">anointing,</span> and to thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> by an <span class=\"wl wl-kjv\" data-code=\"H2706\">ordinance</span> for ever.", "9": "This shall be thine of the <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things,</span> reserved from the <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> every <span class=\"wl wl-kjv\" data-code=\"H7133\">oblation</span> of theirs, every meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> of theirs, and every sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering</span> of theirs, and every trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering</span> of theirs, which they shall <span class=\"wl wl-kjv\" data-code=\"H7725\">render</span> unto me, shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> for thee and for thy sons.", "10": "In the <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place shalt thou <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it; every <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it: it shall be holy", "11": "And this is thine; the heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> of their <span class=\"wl wl-kjv\" data-code=\"H4976\">gift,</span> with all the wave <span class=\"wl wl-kjv\" data-code=\"H8573\">offerings</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> them unto thee, and to thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and to thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> with thee, by a <span class=\"wl wl-kjv\" data-code=\"H2706\">statute</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> every one that is <span class=\"wl wl-kjv\" data-code=\"H2889\">clean</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall eat", "12": "All the <span class=\"wl wl-kjv\" data-code=\"H2459\">best</span> of the <span class=\"wl wl-kjv\" data-code=\"H3323\">oil,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2459\">best</span> of the <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1715\">wheat,</span> the <span class=\"wl wl-kjv\" data-code=\"H7225\">firstfruits</span> of them which they shall <span class=\"wl wl-kjv\" data-code=\"H5414\">offer</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> them have I given", "13": "And whatsoever is first <span class=\"wl wl-kjv\" data-code=\"H1061\">ripe</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which they shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> shall be thine; every one that is <span class=\"wl wl-kjv\" data-code=\"H2889\">clean</span> in thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall eat", "14": "Every thing <span class=\"wl wl-kjv\" data-code=\"H2764\">devoted</span> in Israel", "15": "Every thing that <span class=\"wl wl-kjv\" data-code=\"H6363\">openeth</span> the <span class=\"wl wl-kjv\" data-code=\"H7358\">matrix</span> in all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> which they <span class=\"wl wl-kjv\" data-code=\"H7126\">bring</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> whether it be of <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> or <span class=\"wl wl-kjv\" data-code=\"H929\">beasts,</span> shall be thine: nevertheless the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6299\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstling</span> of <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> shalt thou redeem.", "16": "And those that are to be <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> from a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem,</span> according to thine <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation,</span> for the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels,</span> after the <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary,</span> which is <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> gerahs.", "17": "But the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstling</span> of a <span class=\"wl wl-kjv\" data-code=\"H7794\">cow,</span> or the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstling</span> of a <span class=\"wl wl-kjv\" data-code=\"H3775\">sheep,</span> or the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstling</span> of a <span class=\"wl wl-kjv\" data-code=\"H5795\">goat,</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem;</span> they are <span class=\"wl wl-kjv\" data-code=\"H6944\">holy:</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkle</span> their <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H6999\">burn</span> their <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> for an offering made by <span class=\"wl wl-kjv\" data-code=\"H801\">fire,</span> for a <span class=\"wl wl-kjv\" data-code=\"H5207\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H7381\">savour</span> unto the LORD.", "18": "And the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of them shall be thine, as the <span class=\"wl wl-kjv\" data-code=\"H8573\">wave</span> <span class=\"wl wl-kjv\" data-code=\"H2373\">breast</span> and as the <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> shoulder", "19": "All the heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offerings</span> of the holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things,</span> which the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7311\">offer</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> have I <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee, and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> with thee, by a <span class=\"wl wl-kjv\" data-code=\"H2706\">statute</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> it is a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of <span class=\"wl wl-kjv\" data-code=\"H4417\">salt</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto thee and to thy seed", "20": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> Thou shalt have no <span class=\"wl wl-kjv\" data-code=\"H5157\">inheritance</span> in their <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> neither shalt thou have any <span class=\"wl wl-kjv\" data-code=\"H2506\">part</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> them: I am thy <span class=\"wl wl-kjv\" data-code=\"H2506\">part</span> and thine <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.", "21": "And, behold, I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi</span> all the <span class=\"wl wl-kjv\" data-code=\"H4643\">tenth</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> for an <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> <span class=\"wl wl-kjv\" data-code=\"H2500\">for</span> their <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> which they <span class=\"wl wl-kjv\" data-code=\"H5647\">serve,</span> even the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.", "22": "Neither must the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5750\">henceforth</span> come <span class=\"wl wl-kjv\" data-code=\"H7126\">nigh</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> lest they <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> <span class=\"wl wl-kjv\" data-code=\"H2399\">sin,</span> and die.", "23": "But the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> shall <span class=\"wl wl-kjv\" data-code=\"H5647\">do</span> the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity:</span> it shall be a <span class=\"wl wl-kjv\" data-code=\"H2708\">statute</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> throughout your <span class=\"wl wl-kjv\" data-code=\"H1755\">generations,</span> that <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> they <span class=\"wl wl-kjv\" data-code=\"H5157\">have</span> no inheritance.", "24": "But the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which they <span class=\"wl wl-kjv\" data-code=\"H7311\">offer</span> as an heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> to <span class=\"wl wl-kjv\" data-code=\"H5159\">inherit:</span> therefore I have <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H8432\">Among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5157\">have</span> no inheritance.", "25": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,", "26": "Thus <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, When ye <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you from them for your <span class=\"wl wl-kjv\" data-code=\"H5159\" (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

    `<select id="hfdkies">${hfdOpties}</select>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
