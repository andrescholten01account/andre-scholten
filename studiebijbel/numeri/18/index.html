jn.","3":"En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u.","4":"Maar zij zullen u bijgevoegd worden, en de wacht van de tent der samenkomst waarnemen, in alle dienst van de tent; en een vreemde zal u niet naderen.","5":"U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.","6":"Want Ik, zie, Ik heb uw broeders, de Levieten, uit het midden van de kinderen van Israël genomen; zij zijn u een gave, gegeven aan de HEERE, om de dienst van de tent der samenkomst te bedienen.","7":"Maar u, en uw zonen met u, zullen uw priesterambt waarnemen in alle zaken van het altaar, en in wat binnen het voorhangsel is; dat zult u bedienen; uw priesterambt geef Ik u tot een dienst van een geschenk; en de vreemde die nadert, zal gedood worden.","8":"Verder sprak de HEERE tot Aäron: En Ik, zie, Ik heb u gegeven de wacht van Mijn hefoffers, met alle heilige dingen van de kinderen van Israël heb Ik ze u gegeven, vanwege de zalving, en aan uw zonen, tot een eeuwige inzetting.","9":"Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn.","10":"Aan het allerheiligste zult u dat eten; ieder die mannelijk is zal dat eten; het zal u een heilig ding zijn.","11":"Ook zal dit het uwe zijn: het hefoffer van hun gave, met alle beweegoffers van de kinderen van Israël; Ik heb ze aan u gegeven, en aan uw zonen, en aan uw dochters met u, tot een eeuwige inzetting; ieder die in uw huis rein is, zal dat eten.","12":"Al het beste van de olie, en al het beste van de most, en van koren, hun eerstelingen, die zij de HEERE zullen geven, heb Ik u gegeven.","13":"De eerste vruchten van alles wat in hun land is, die zij de HEERE zullen brengen, zullen de uwe zijn; ieder die in uw huis rein is, zal dat eten.","14":"Al het verbannene[1] in Israël zal het uwe zijn.","15":"Alles wat de baarmoeder opent, van alle vlees, dat zij de HEERE zullen brengen, onder de mensen, en onder de dieren, zal het uwe zijn; maar de eerstgeborenen van de mensen zult u helemaal lossen; ook zult u de eerstgeborenen van de onreine dieren lossen.","16":"Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.","17":"Maar het eerstgeborene van een koe, of het eerstgeborene van een schaap, of het eerstgeborene van een geit zult u niet lossen, zij zijn heilig; hun bloed zult u sprenkelen op het altaar, en hun vet zult u aansteken, tot een vuuroffer van liefelijke reuk voor de HEERE.","18":"En hun vlees zal het uwe zijn; net als de beweegborst, en net als de rechterschouder, zal het het uwe zijn.","19":"Alle hefoffers van de heilige dingen, die de kinderen van Israël de HEERE zullen offeren, heb Ik aan u gegeven, en aan uw zonen, en aan uw dochters met u, tot een eeuwige inzetting; het zal een eeuwig zoutverbond zijn, voor het aangezicht van de HEERE, voor u en voor uw nageslacht met u.","20":"Ook zei de HEERE tegen Aäron: U zult in hun land niet erven, en u zult geen deel te midden van hen hebben; Ik ben uw deel en uw erfenis, te midden van de kinderen van Israël.","21":"En zie, aan de kinderen van Levi heb Ik alle tienden in Israël tot erfenis gegeven, voor hun dienst die zij bedienen, de dienst van de tent der samenkomst.","22":"En de kinderen van Israël zullen niet meer tot de tent der samenkomst naderen, om zonde te dragen en te sterven.","23":"Maar de Levieten, die zullen de dienst van de tent der samenkomst bedienen, en die zullen hun ongerechtigheid dragen; het zal een eeuwige inzetting zijn voor uw geslachten; en te midden van de kinderen van Israël zullen zij geen erfenis erven.","24":"Want de tienden van de kinderen van Israël, die zij de HEERE tot een hefoffer zullen offeren, heb Ik aan de Levieten tot een erfenis gegeven; daarom heb Ik tegen hen gezegd: Zij zullen te midden van de kinderen van Israël geen erfenis erven.","25":"En de HEERE sprak tot Mozes en zei:","26":"U zult ook tot de Levieten spreken, en tegen hen zeggen: Wanneer u van de kinderen van Israël de tienden zult hebben ontvangen, die Ik u voor uw erfenis van hen gegeven heb, dan zult u daarvan een hefoffer voor de HEERE offeren, de tienden van die tienden;","27":"En het zal u gerekend worden tot uw hefoffer, als koren van de dorsvloer, en als de volheid van de perskuip.","28":"Zo zult u ook een hefoffer voor de HEERE offeren van al uw tienden, die u van de kinderen van Israël zult hebben ontvangen; en u zult daarvan het hefoffer van de HEERE geven aan de priester Aäron.","29":"Van al uw gaven zult u alle hefoffer van de HEERE offeren; van al het beste daarvan, van de heiliging daarvan.","30":"U zult dan tegen hen zeggen: Als u het beste ervan offert, dan zal het de Levieten toegerekend worden als een opbrengst van de dorsvloer, en als een opbrengst van de perskuip.","31":"En u zult dat eten op alle plaatsen, u en uw huis; want het is u een loon voor uw dienst in de tent der samenkomst.","32":"Zo zult u daarover geen zonde dragen, als u het beste daarvan offert; en u zult de heilige dingen van de kinderen van Israël niet ontheiligen, opdat u niet sterft."},"SV":{"1":"Zo zeide de HEERE tot Aäron: Gij, en uw zonen, en het huis uws vaders met u, zult dragen de ongerechtigheid des heiligdoms; en gij, en uw zonen met u, zult dragen de ongerechtigheid van uw priesterambt.","2":"En ook zult gij uw broederen, den stam van Levi, den stam uws vaders, met u doen naderen, dat zij u bijgevoegd worden, en u dienen; maar gij, en uw zonen met u, zult zijn voor de tent der getuigenis.","3":"En zij zullen uw wacht waarnemen, en de wacht der ganse tent; doch tot het gereedschap des heiligdoms en het altaar zullen zij niet naderen, opdat zij niet sterven, zo zij als gijlieden.","4":"Maar zij zullen u bijgevoegd worden, en de wacht van de tent der samenkomst waarnemen, in allen dienst der tent; en een vreemde zal tot u niet naderen.","5":"Gijlieden nu zult waarnemen de wacht des heiligdoms, en de wacht des altaars; opdat er geen verbolgenheid meer zij over de kinderen Israëls.","6":"Want Ik, zie, Ik heb uw broederen, de Levieten, uit het midden der kinderen Israëls genomen; zij zijn ulieden een gave, gegeven den HEERE, om den dienst van de tent der samenkomst te bedienen.","7":"Maar gij, en uw zonen met u, zult ulieder priesterambt waarnemen in alle zaken des altaars, en in hetgeen van binnen den voorhang is, dat zult gijlieden bedienen; uw priesterambt geve Ik *u* tot een dienst van een geschenk; en de vreemde, die nadert, zal gedood worden.","8":"Voorts sprak de HEERE tot Aäron: En Ik, zie, Ik heb u gegeven de wacht Mijner hefofferen, met alle heilige dingen van de kinderen Israëls heb Ik ze u gegeven, om der zalving wil, en aan uw zonen, tot een eeuwige inzetting.","9":"Dit zult gij hebben van de heiligheid der heiligheden, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen wedergeven; het zal u en uw zonen een heiligheid der heiligheden zijn.","10":"Aan het allerheiligste zult gij dat eten; al wat mannelijk is zal dat eten; het zal u een heiligheid zijn.","11":"Ook zal dit het uwe zijn: het hefoffer hunner gave, met alle beweegofferen der kinderen Israëls; Ik heb ze aan u gegeven, en aan uw zonen, en aan uw dochteren met u, tot een eeuwige inzetting; al wie in uw huis rein is, zal dat eten.","12":"Al het beste van de olie, en al het beste van de most, en van koren, hun eerstelingen, die zij den HEERE zullen geven, u heb Ik ze gegeven.","13":"De eerste vruchten van alles, wat in hun land is, die zij den HEERE zullen brengen, zullen uwe zijn; al wie in uw huis rein is, zal dat eten.","14":"Al het verbannene in Israël zal het uwe zijn.","15":"Al wat de baarmoeder opent, van alle vlees, dat zij den HEERE zullen brengen, onder de mensen, en onder de beesten, zal het uwe zijn; doch de eerstgeborenen der mensen zult gij ganselijk lossen; ook zult gij lossen de eerstgeborenen der onreine beesten.","16":"Die nu onder dezelve gelost zullen worden, zult gij van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkelen, naar den sikkel des heiligdoms, die is twintig gera.","17":"Maar het eerstgeborene van een koe, of het eerstgeborene van een schaap, of het eerstgeborene van een geit zult gij niet lossen, zij zijn heilig; hun bloed zult gij sprengen op het altaar, en hun vet zult gij aansteken, tot een vuuroffer van liefelijken reuk den HEERE.","18":"En hun vlees zal het uwe zijn; gelijk de beweegborst, en gelijk de rechterschouder, zal het uwe zijn.","19":"Alle hefofferen der heilige dingen, die de kinderen Israëls den HEERE zullen offeren, heb Ik aan u gegeven, en aan uw zonen, en aan uw dochteren met u, tot een eeuwige inzetting; het zal een eeuwig zoutverbond zijn, voor het aangezicht des HEEREN, voor u en voor uw zaad met u.","20":"Ook zeide de HEERE tot Aäron: Gij zult in hun land niet erven, en gij zult geen deel in het midden van henlieden hebben; Ik ben uw deel en uw erfenis, in het midden van de kinderen Israëls.","21":"En zie, aan de kinderen van Levi heb Ik alle tienden in Israël ter erfenis gegeven, voor hun dienst, dien zij bedienen, den dienst van de tent der samenkomst.","22":"En de kinderen Israëls zullen niet meer naderen tot de tent der samenkomst, om zonde te dragen *en* te sterven.","23":"Maar de Levieten, die zullen bedienen den dienst van de tent der samenkomst, en die zullen hun ongerechtigheid dragen; het zal een eeuwige inzetting zijn voor uw geslachten; en in het midden van de kinderen Israëls zullen zij geen erfenis erven.","24":"Want de tienden der kinderen Israëls, die zij den HEERE tot een hefoffer zullen offeren, heb Ik aan de Levieten tot een erfenis gegeven; daarom heb Ik tot hen gezegd: Zij zullen in het midden van de kinderen Israëls geen erfenis erven.","25":"En de HEERE sprak tot Mozes, zeggende:","26":"Gij zult ook tot de Levieten spreken, en tot hen zeggen: Wanneer gij van de kinderen Israëls de tienden zult ontvangen hebben, die Ik u voor uw erfenis van henlieden gegeven heb, zo zult gij daarvan een hefoffer des HEEREN offeren, de tienden van die tienden;","27":"En het zal u gerekend worden tot uw hefoffer, als koren van den dorsvloer, en als de volheid van de perskuip.","28":"Alzo zult gij ook een hefoffer des HEEREN offeren van al uw tienden, die gij van de kinderen Israëls zult hebben ontvangen; en gij zult daarvan des HEEREN hefoffer geven aan den priester Aäron.","29":"Van al uw gaven zult gij alle hefoffer des HEEREN offeren; van al het beste van die, van zijn heiliging daarvan.","30":"Gij zult dan tot hen zeggen: Als gij deszelfs beste daarvan offert, zo zal het den Levieten toegerekend worden als een inkomen des dorsvloers, en als een inkomen der perskuip.","31":"En gij zult dat eten in alle plaatsen, gij en uw huis; want het is ulieden een loon voor uw dienst in de tent der samenkomst.","32":"Zo zult gij daarover geen zonde dragen, als gij deszelfs beste daarvan offert; en gij zult de heilige dingen van de kinderen Israëls niet ontheiligen, opdat gij niet sterft."},"KJV":{"1":"And the LORD said unto Aaron, Thou and thy sons and thy father's house with thee shall bear the iniquity of the sanctuary: and thou and thy sons with thee shall bear the iniquity of your priesthood.","2":"And thy brethren also of the tribe of Levi, the tribe of thy father, bring thou with thee, that they may be joined unto thee, and minister unto thee: but thou and thy sons with thee *shall minister* before the tabernacle of witness.","3":"And they shall keep thy charge, and the charge of all the tabernacle: only they shall not come nigh the vessels of the sanctuary and the altar, that neither they, nor ye also, die.","4":"And they shall be joined unto thee, and keep the charge of the tabernacle of the congregation, for all the service of the tabernacle: and a stranger shall not come nigh","5":"And ye shall keep the charge of the sanctuary, and the charge of the altar: that there be no wrath any more upon the children of Israel.","6":"And I, behold, I have taken your brethren the Levites from among the children of Israel: to you *they are* given *as* a gift for the LORD, to do the service of the tabernacle of the congregation.","7":"Therefore thou and thy sons with thee shall keep your priest's office for every thing of the altar, and within the vail; and ye shall serve: I have given your priest's office *unto you* as a service of gift: and the stranger that cometh nigh shall be put to death.","8":"And the LORD spake unto Aaron, Behold, I also have given thee the charge of mine heave offerings of all the hallowed things of the children of Israel; unto thee have I given them by reason of the anointing, and to thy sons, by an ordinance for ever.","9":"This shall be thine of the most holy things, *reserved* from the fire: every oblation of theirs, every meat offering of theirs, and every sin offering of theirs, and every trespass offering of theirs, which they shall render unto me, *shall be* most holy for thee and for thy sons.","10":"In the most holy *place* shalt thou eat it; every male shall eat it: it shall be holy","11":"And this *is* thine; the heave offering of their gift, with all the wave offerings of the children of Israel: I have given them unto thee, and to thy sons and to thy daughters with thee, by a statute for ever: every one that is clean in thy house shall eat","12":"All the best of the oil, and all the best of the wine, and of the wheat, the firstfruits of them which they shall offer unto the LORD, them have I given","13":"*And* whatsoever is first ripe in the land, which they shall bring unto the LORD, shall be thine; every one that is clean in thine house shall eat","14":"Every thing devoted in Israel","15":"Every thing that openeth the matrix in all flesh, which they bring unto the LORD, *whether it be* of men or beasts, shall be thine: nevertheless the firstborn of man shalt thou surely redeem, and the firstling of unclean beasts shalt thou redeem.","16":"And those that are to be redeemed from a month old shalt thou redeem, according to thine estimation, for the money of five shekels, after the shekel of the sanctuary, which *is* twenty gerahs.","17":"But the firstling of a cow, or the firstling of a sheep, or the firstling of a goat, thou shalt not redeem; they *are* holy: thou shalt sprinkle their blood upon the altar, and shalt burn their fat *for* an offering made by fire, for a sweet savour unto the LORD.","18":"And the flesh of them shall be thine, as the wave breast and as the right shoulder","19":"All the heave offerings of the holy things, which the children of Israel offer unto the LORD, have I given thee, and thy sons and thy daughters with thee, by a statute for ever: it *is* a covenant of salt for ever before the LORD unto thee and to thy seed","20":"And the LORD spake unto Aaron, Thou shalt have no inheritance in their land, neither shalt thou have any part among them: I *am* thy part and thine inheritance among the children of Israel.","21":"And, behold, I have given the children of Levi all the tenth in Israel for an inheritance, for their service which they serve, *even* the service of the tabernacle of the congregation.","22":"Neither must the children of Israel henceforth come nigh the tabernacle of the congregation, lest they bear sin, and die.","23":"But the Levites shall do the service of the tabernacle of the congregation, and they shall bear their iniquity: *it shall be* a statute for ever throughout your generations, that among the children of Israel they have no inheritance.","24":"But the tithes of the children of Israel, which they offer *as* an heave offering unto the LORD, I have given to the Levites to inherit: therefore I have said unto them, Among the children of Israel they shall have no inheritance.","25":"And the LORD spake unto Moses, saying,","26":"Thus speak unto the Levites, and say unto them, When ye take of the children of Israel the tithes which I have given you from them for your inheritance, then ye shall offer up an heave offering of it for the LORD, *even* a tenth *part* of the tithe.","27":"And *this* your heave offering shall be reckoned unto you, as though *it were* the corn of the threshingfloor, and as the fulness of the winepress.","28":"Thus ye also shall offer an heave offering unto the LORD of all your tithes, which ye receive of the children of Israel; and ye shall give thereof the LORD'S heave offering to Aaron the priest.","29":"Out of all your gifts ye shall offer every heave offering of the LORD, of all the best thereof, *even* the hallowed part","30":"Therefore thou shalt say unto them, When ye have heaved the best thereof from it, then it shall be counted unto the Levites as the increase of the threshingfloor, and as the increase of the winepress.","31":"And ye shall eat it in every place, ye and your households: for it *is* your reward for your service in the tabernacle of the congregation.","32":"And ye shall bear no sin by reason of it, when ye have heaved from it the best of it: neither shall ye pollute the holy things of the children of Israel, lest ye die."}},"tsk":{"1":[{"kopje":"U","refs":["Num 17:3","Num 17:7","Num 17:13","Hebr 4:15"]},{"kopje":"zult dragen","refs":["Num 18:22","Num 14:34","Ex 28:38","Lev 22:9","Jes 53:6","Jes 53:11","Ezech 3:18","Ezech 3:19","Hand 20:26","Hand 20:27","Hebr 13:17","1 Petr 2:24"]}],"2":[{"kopje":"bijgevoegd","refs":["Num 18:4","Gen 29:34"]},{"kopje":"u dienen","refs":["Num 3:6-9","Num 8:19","Num 8:22"]},{"kopje":"maar u","refs":["Num 3:10-13","Num 4:15","Num 16:40","Num 17:7","1 Kron 16:39","1 Kron 16:40","2 Kron 30:16","Ezech 44:15"]}],"3":[{"kopj d thou and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> with thee shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of your priesthood.","2":"And thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> also of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi,</span> the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H7126\">bring</span> thou with thee, that they may be <span class=\"wl wl-kjv\" data-code=\"H3867\">joined</span> unto thee, and <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> unto thee: but thou and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> with thee shall minister <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of witness.","3":"And they shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> thy <span class=\"wl wl-kjv\" data-code=\"H4931\">charge,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of all the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle:</span> only they shall not come <span class=\"wl wl-kjv\" data-code=\"H7126\">nigh</span> the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary</span> and the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> that neither they, nor ye also, die.","4":"And they shall be <span class=\"wl wl-kjv\" data-code=\"H3867\">joined</span> unto thee, and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> for all the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle:</span> and a <span class=\"wl wl-kjv\" data-code=\"H2114\">stranger</span> shall not come nigh","5":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar:</span> that there be no <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> any more upon the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","6":"And I, behold, I have <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> to you they are <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> as a <span class=\"wl wl-kjv\" data-code=\"H4979\">gift</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">do</span> the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.","7":"Therefore thou and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> with thee shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> your priest's <span class=\"wl wl-kjv\" data-code=\"H3550\">office</span> for every <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and <span class=\"wl wl-kjv\" data-code=\"H1004\">within</span> the <span class=\"wl wl-kjv\" data-code=\"H6532\">vail;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve:</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> your priest's <span class=\"wl wl-kjv\" data-code=\"H3550\">office</span> unto you as a <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of <span class=\"wl wl-kjv\" data-code=\"H4979\">gift:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2114\">stranger</span> that cometh <span class=\"wl wl-kjv\" data-code=\"H7131\">nigh</span> shall be put to death.","8":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> Behold, I also have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of mine heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offerings</span> of all the hallowed <span class=\"wl wl-kjv\" data-code=\"H6944\">things</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> unto thee have I <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> them by reason of the <span class=\"wl wl-kjv\" data-code=\"H4888\">anointing,</span> and to thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> by an <span class=\"wl wl-kjv\" data-code=\"H2706\">ordinance</span> for ever.","9":"This shall be thine of the <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things,</span> reserved from the <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> every <span class=\"wl wl-kjv\" data-code=\"H7133\">oblation</span> of theirs, every meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> of theirs, and every sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering</span> of theirs, and every trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering</span> of theirs, which they shall <span class=\"wl wl-kjv\" data-code=\"H7725\">render</span> unto me, shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> for thee and for thy sons.","10":"In the <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place shalt thou <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it; every <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it: it shall be holy","11":"And this is thine; the heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> of their <span class=\"wl wl-kjv\" data-code=\"H4976\">gift,</span> with all the wave <span class=\"wl wl-kjv\" data-code=\"H8573\">offerings</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> them unto thee, and to thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and to thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> with thee, by a <span class=\"wl wl-kjv\" data-code=\"H2706\">statute</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> every one that is <span class=\"wl wl-kjv\" data-code=\"H2889\">clean</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall eat","12":"All the <span class=\"wl wl-kjv\" data-code=\"H2459\">best</span> of the <span class=\"wl wl-kjv\" data-code=\"H3323\">oil,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2459\">best</span> of the <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1715\">wheat,</span> the <span class=\"wl wl-kjv\" data-code=\"H7225\">firstfruits</span> of them which they shall <span class=\"wl wl-kjv\" data-code=\"H5414\">offer</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> them have I given","13":"And whatsoever is first <span class=\"wl wl-kjv\" data-code=\"H1061\">ripe</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which they shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> shall be thine; every one that is <span class=\"wl wl-kjv\" data-code=\"H2889\">clean</span> in thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall eat","14":"Every thing <span class=\"wl wl-kjv\" data-code=\"H2764\">devoted</span> in Israel","15":"Every thing that <span class=\"wl wl-kjv\" data-code=\"H6363\">openeth</span> the <span class=\"wl wl-kjv\" data-code=\"H7358\">matrix</span> in all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> which they <span class=\"wl wl-kjv\" data-code=\"H7126\">bring</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> whether it be of <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> or <span class=\"wl wl-kjv\" data-code=\"H929\">beasts,</span> shall be thine: nevertheless the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6299\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstling</span> of <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> shalt thou redeem.","16":"And those that are to be <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> from a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem,</span> according to thine <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation,</span> for the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels,</span> after the <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary,</span> which is <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> gerahs.","17":"But the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstling</span> of a <span class=\"wl wl-kjv\" data-code=\"H7794\">cow,</span> or the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstling</span> of a <span class=\"wl wl-kjv\" data-code=\"H3775\">sheep,</span> or the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstling</span> of a <span class=\"wl wl-kjv\" data-code=\"H5795\">goat,</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem;</span> they are <span class=\"wl wl-kjv\" data-code=\"H6944\">holy:</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkle</span> their <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H6999\">burn</span> their <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> for an offering made by <span class=\"wl wl-kjv\" data-code=\"H801\">fire,</span> for a <span class=\"wl wl-kjv\" data-code=\"H5207\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H7381\">savour</span> unto the LORD.","18":"And the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of them shall be thine, as the <span class=\"wl wl-kjv\" data-code=\"H8573\">wave</span> <span class=\"wl wl-kjv\" data-code=\"H2373\">breast</span> and as the <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> shoulder","19":"All the heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offerings</span> of the holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things,</span> which the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7311\">offer</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> have I <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee, and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> with thee, by a <span class=\"wl wl-kjv\" data-code=\"H2706\">statute</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> it is a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of <span class=\"wl wl-kjv\" data-code=\"H4417\">salt</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto thee and to thy seed","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> Thou shalt have no <span class=\"wl wl-kjv\" data-code=\"H5157\">inheritance</span> in their <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> neither shalt thou have any <span class=\"wl wl-kjv\" data-code=\"H2506\">part</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> them: I am thy <span class=\"wl wl-kjv\" data-code=\"H2506\">part</span> and thine <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","21":"And, behold, I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi</span> all the <span class=\"wl wl-kjv\" data-code=\"H4643\">tenth</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> for an <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> <span class=\"wl wl-kjv\" data-code=\"H2500\">for</span> their <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> which they <span class=\"wl wl-kjv\" data-code=\"H5647\">serve,</span> even the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.","22":"Neither must the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5750\">henceforth</span> come <span class=\"wl wl-kjv\" data-code=\"H7126\">nigh</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> lest they <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> <span class=\"wl wl-kjv\" data-code=\"H2399\">sin,</span> and die.","23":"But the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> shall <span class=\"wl wl-kjv\" data-code=\"H5647\">do</span> the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity:</span> it shall be a <span class=\"wl wl-kjv\" data-code=\"H2708\">statute</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> throughout your <span class=\"wl wl-kjv\" data-code=\"H1755\">generations,</span> that <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> they <span class=\"wl wl-kjv\" data-code=\"H5157\">have</span> no inheritance.","24":"But the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which they <span class=\"wl wl-kjv\" data-code=\"H7311\">offer</span> as an heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> to <span class=\"wl wl-kjv\" data-code=\"H5159\">inherit:</span> therefore I have <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H8432\">Among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5157\">have</span> no inheritance.","25":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","26":"Thus <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, When ye <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you from them for your <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> then ye shall <span class=\"wl wl-kjv\" data-code=\"H7311\">offer</span> up an heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> of it for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> even a <span class=\"wl wl-kjv\" data-code=\"H4643\">tenth</span> part of the tithe.","27":"And this your heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2803\">reckoned</span> unto you, as though it were the <span class=\"wl wl-kjv\" data-code=\"H1715\">corn</span> of the <span class=\"wl wl-kjv\" data-code=\"H1637\">threshingfloor,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H4395\">fulness</span> of the winepress.","28":"Thus ye also shall <span class=\"wl wl-kjv\" data-code=\"H7311\">offer</span> an heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of all your <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes,</span> which ye <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thereof the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> to <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> the priest.","29":"Out of all your <span class=\"wl wl-kjv\" data-code=\"H4979\">gifts</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H7311\">offer</span> every heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> of all the <span class=\"wl wl-kjv\" data-code=\"H2459\">best</span> thereof, even the hallowed part","30":"Therefore thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, When ye have <span class=\"wl wl-kjv\" data-code=\"H7311\">heaved</span> the <span class=\"wl wl-kjv\" data-code=\"H2459\">best</span> thereof from it, then it shall be <span class=\"wl wl-kjv\" data-code=\"H2803\">counted</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> as the <span class=\"wl wl-kjv\" data-code=\"H8393\">increase</span> of the <span class=\"wl wl-kjv\" data-code=\"H1637\">threshingfloor,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H8393\">increase</span> of the winepress.","31":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it in every <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> ye and your <span class=\"wl wl-kjv\" data-code=\"H1004\">households:</span> for it is your <span class=\"wl wl-kjv\" data-code=\"H7939\">reward</span> <span class=\"wl wl-kjv\" data-code=\"H2500\">for</span> your <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.","32":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> no <span class=\"wl wl-kjv\" data-code=\"H2399\">sin</span> by reason of it, when ye have <span class=\"wl wl-kjv\" data-code=\"H7311\">heaved</span> from it the <span class=\"wl wl-kjv\" data-code=\"H2459\">best</span> of it: neither shall ye <span class=\"wl wl-kjv\" data-code=\"H2490\">pollute</span> the holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> lest ye die."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zeide de HEERE tot Aäron","tekst":"Om het volk de vrees [waarvan in het laatst van het Num 17 gesproken is] te benemen, en een middel aan te wijzen, waardoor voorgekomen mocht worden, dat zulk een onheil hun na dezen niet meer zou overkomen."},{"catchword":"ongerechtigheid des heiligdoms;","tekst":"Dat is, de straf van hetgeen aan het heiligdom en de ceremoniën van dien misdaan wordt; daarom zult gij toezien dat ieder blijve binnen de perken van zijn dienst, anders zult gij daarvoor instaan. Zie Lev 5:1."},{"catchword":"de ongerechtigheid van uw priesterambt","tekst":"De straf van hetgeen aan het priesterambt misdaan wordt, wanneer gij u daarin niet wel gedraagt, of toelaat dat een vreemde in uw ambt treedt en zich daaraan vergrijpt."}],"2":[{"catchword":"getuigenis","tekst":"Zie boven, Num 17:4."}],"3":[{"catchword":"zo zij als gijlieden","tekst":"Hebreeuws, ook zij, ook gijlieden; te weten, wanneer gij dat niet voorkomt, of door onachtzaamheid toelaat, of overziet."}],"4":[{"catchword":"een vreemde zal tot u niet naderen","tekst":"Die niet is van de stam van Levi, zal u niet mogen dienen."}],"5":[{"catchword":"verbolgenheid meer zij","tekst":"Versta, des HEEREN; dat is al zulke straffen of plagen, als er tevoren van God zijn afgekomen over Korach en al zijn medeplichtigen."}],"6":[{"catchword":"zij zijn ulieden een gave,","tekst":"Of, zij zijn ulieden een gave, of geschenk, gegeven den HEERE, of des HEEREN; dat is, zij zijn u ten dienste geschonken, en alzo overgegeven om den HEERE te dienen."},{"catchword":"den HEERE,","tekst":"Anders, voor den Heere."}],"7":[{"catchword":"voorhang is,","tekst":"Waardoor het heilige van den voorhof onderscheiden wordt."},{"catchword":"van een geschenk;","tekst":"Dat is, dat gij met uw linie tot het hogepriesterambt voor anderen zijt verkoren en dat bedienen zult, is een loutere genadegave van Mij, gelijk Ik ook den Levieten het hunne geschonken heb; noch gij, noch zij hebben het verdiend. Alzo is ook het geestelijke, dat hierdoor voorgebeeld en beduid was; te weten, onze gemeenschap met onzen hogepriester Jezus Christus, mitsgaders zijn verdiensten en zaligmakende weldaden, een loutere genadegave des HEEREN; Isa 9:5; Rom 3:24, en Rom 8:32, en Rom 11:35; Eph 2:7-9, enz.; 2Ti 1:9; 1Pe 2:9-10; 1Jo 4:10; Rev 1:5-6."},{"catchword":"vreemde, die nadert,","tekst":"Die niet is van Aärons linie, en zich het priesterambt wil aannemen. Zie boven, Num 16:40, en 2Ch 26:19."}],"8":[{"catchword":"hefofferen,","tekst":"Zie boven, Num 5:9."},{"catchword":"heilige dingen","tekst":"Hebreeuws, heiligheden. Zie Lev 5:15."},{"catchword":"om der zalving wil,","tekst":"Dat is, omdat gij tot dit heilig ambt gezalfd zijt. Zie Lev 8:12, enz."},{"catchword":"eeuwige inzetting","tekst":"Tot de komst van den Messias. Zie Gen 13:15, en Gen 17:7."}],"9":[{"catchword":"heiligheid der heiligheden,","tekst":"Zie Lev 2:3."},{"catchword":"vuur","tekst":"Dat is, wat geen branfoffer is, of geordineerd om met vuur geheel op het altaar verbrand te worden, maar wat van de vuuroffers overblijft, enz."},{"catchword":"heiligheid der heiligheden zijn","tekst":"Dat is, gij en uw zonen zult het voor een zeer heilig ding houden. Anders, een heiligheid der heiligheden, het zal uwe en uwer zonen zijn; dat is, omdat het een zeer heilig ding is, zult gij en uwe zonen dat hebben."}],"10":[{"catchword":"allerheiligste zult gij dat eten;","tekst":"Het zij binnen in het heilige, of buiten nevens het brandofferaltaar, dat zelf een heiligheid der heiligheden genoemd wordt; Exo 29:37. Zie wijders Lev 6:16, Lev 6:26, en Lev 7:6, en Lev 8:31, en Lev 14:13. Deze plaats wordt het heilige der heiligen, of het allerheiligste, of zeer heilige genoemd in vergelijking van den gansen voorhof, waar de gemeente bijeenkwam. God heeft gewild dat de priesters dit alles hier zouden eten, om de heiligheid dezer offeranden te tonen, en de priesters [die niet voor Gods aangezicht als zijn gasten aten] van alle overdaad en onmatigheid af te houden. Wat nu in hun private huizen mocht gegeten worden en door wie, daarvan zie vs.11, 13, 19."}],"12":[{"catchword":"het beste van de olie,","tekst":"Hebreeuws, al het vette der olie; en zo in het volgende, en onder, vs.29, 30, 32. Zie Gen 45:18."}],"14":[{"catchword":"verbannene in Israël","tekst":"Zie Lev 27:28."}],"15":[{"catchword":"opent, van alle vlees,","tekst":"Hebreeuws, alle opening der baarmoeder. Zie Exo 13:2, Exo 13:12-13, Exo 13:15, en Num 3:12."},{"catchword":"ganselijk lossen;","tekst":"Hebreeuws, zult gij lossende lossen; dat is, ganselijk laten lossen, en alzo moet men in de volgende verzen door lossen verstaan: laten lossen."}],"16":[{"catchword":"oud lossen,","tekst":"Hebreeuws, van een zoon van een maand"},{"catchword":"schatting,","tekst":"Die gij naar mijn bevel doen zult, gelijk blijkt in het volgende."},{"catchword":"het geld van vijf sikkelen,","tekst":"Of, zilver van vijf sikkelen"},{"catchword":"sikkel des heiligdoms,","tekst":"Zie Gen 20:16, en Gen 23:15."},{"catchword":"twintig gera","tekst":"Zie Lev 27:25."}],"17":[{"catchword":"heilig;","tekst":"Hebreeuws, heiligheid; dat is, een heilig ding."}],"18":[{"catchword":"beweegborst,","tekst":"Zie Lev 7:34."},{"catchword":"rechterschouder,","tekst":"Of, achterbout."}],"19":[{"catchword":"tot een eeuwige inzetting;","tekst":"Met deze en de volgende woorden heeft God alle murmurering, tegenspraak en krakeel onder de Israëlieten willen voorkomen en bedwingen."},{"catchword":"zoutverbond zijn,","tekst":"Dat is, gedurig en bestendig, gelijk de dingen die gezouten zijn, lang duren en voor vervuiling of verrotting bewaard zijn. Zie Lev 2:13, en 2Ch 13:5."}],"20":[{"catchword":"Uw deel en uw erfenis,","tekst":"Vergelijk Deu 10:9."}],"21":[{"catchword":"En zie,","tekst":"Of, en aangaande de kinderen van Levi, zie Ik heb hun, enz."},{"catchword":"tienden in Israël ter erfenis gegeven,","tekst":"Zie Lev 27:30."}],"22":[{"catchword":"om zonde te dragen","tekst":"Dat is, om zich schuldig te maken en straf op zich te laden. Zie boven, vs.1, en onder, vs.32."},{"catchword":"sterven","tekst":"Gelijk Korach en den zijnen gebeurd is. Zie boven, Num 16."}],"23":[{"catchword":"Levieten,","tekst":"Hebreeuws, Levi"},{"catchword":"hun ongerechtigheid dragen;","tekst":"Dat is, zij zelf de straf dragen, wanneer zij misdoen in hun dienst. Zie boven, vs.1."}],"27":[{"catchword":"als koren van den dorsvloer,","tekst":"Dat is, het zal geacht worden en zo aangenaam zijn, alsof gij eigen land hadt en van deszelfs vrucht [gelijk de andere stammen], uw tienden opofferdet."},{"catchword":"perskuip","tekst":"Wijnpers en oliepers. Zie Joe 2:24."}],"29":[{"catchword":"gaven","tekst":"Dat is, van alle tienden, die u gegeven worden."},{"catchword":"alle hefoffer","tekst":"Dat is, allerlei."},{"catchword":"het beste van die,","tekst":"Hebreeuws, vette; gelijk boven, vs.12, en in vs.30."},{"catchword":"heiliging daarvan","tekst":"Dat is, door welk deel uw tienden geheiligd worden, alzo dat gij die met vrije conscientie nuttigen moogt. Zie onder, vs.32. Anders, zijn heilig deel ervan."}],"30":[{"catchword":"als een inkomen des dorsvloers,","tekst":"Zie boven, vs.27."}],"32":[{"catchword":"dragen,","tekst":"Zie boven, vs.1, 22."},{"catchword":"beste daarvan offert;","tekst":"Hebreeuws, vette; gelijk boven, vs.12. Zie aldaar."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then the LORD said to Aaron; [viz. to dispossess the people of the fear that was upon them, mentioned in the two last verses of the foregoing Chapter; and to prompt them with the means of preventing the like mischief hereafter] thou and thy sons, and thy Fathers house ith thee, shall bear the iniquity of the Sanctuary: [id est, the punishment of what is done amiss in the Sanctuary, and the Ceremonies thereof; therefore ye ought to look well to it, that every one remain within the Verge and limits of his function: otherwise, you must undergo the punishment. See Leviticus, 5. on verse 1.] and thou and thy sons with thee shalt bear the iniquity of your priestly Office. [i.e. the punishment of what is done amiss in the Priestly Office; when ye shall not carry your selves in it as ye ought, or suffer a stranger to meddle and transgress therein.]"}],"3":[{"catchword":null,"tekst":"And they shall observe thy Guard, and the Guard of all the Tent; yet to the furniture of the Sanctuary, and to the Altar, they shall not approach, that they die not; as well they, as your selves. [Hebrew. also they, also yourselves; viz. when you prevent it not, or suffer it to be done through carelessness, or connivance.]"}],"4":[{"catchword":null,"tekst":"But they shall be joined unto thee, and observe the Guard of the Tent of the Congregation, in all the service of the Tent: and a stranger shall not approach unto thee. [i.e. he that is not of the Tribe of Levi, shall not be admitted to serve and minister unto thee.]"}],"5":[{"catchword":null,"tekst":"Ye now shall observe the Guard of the Sanctuary, and the Guard of the Altar: that there may be no indignation [viz. of the LORD] more, over of the children of Israel. [i.e. no such Plague or judgement, as formerly befell Korah and his accomplices.]"}],"6":[{"catchword":null,"tekst":"For, I, behold, I have taken your brethren the Levites, out of the midst of the children of Israel: they are a gift unto you, given to the LORD, [Others, given unto you for your service, and thereby given up and dedicated to the service of the LORD] for to administer the service of the Tent of the Congregation."}],"7":[{"catchword":null,"tekst":"But thou and thy sons with thee shall observe your priestly Office, in all matters of the Altar, and in that which is within the Vail, [Whereby the Holy place is divided from the Court] that ye shall administer: your priests office I give (unto you) for a ministrie of a gift, [i.e. this that you and your posterity are made choice of the priestly Office before others, and are appointed to administer the same, is a meer gift and grace of own; as also I have given to the Levites their Office: neither you, nor they, deserved it at my hands. And thus likewise is the spiritual estate, betokened and typified hereby, to wit, our communion ith our High Priest Jesus Christ, together with his merits and saving mercies, a meer gift of the grace and favour of the LORD, Isa 9:5. Rom 3:24. and 8.32. and 11.35. Eph.2.7,8,9. And 2Tim.1.9. 1 Pet.2.9,10. 1Jn 4:10. Rev 1:5.6.] and the stranger that approacheth, [not being of Aarons line, and going about to Intermeddle with the priestly Office. See above, chapter 16.40. and 2 Chronicles 26.19.] shall be put to death."}],"8":[{"catchword":null,"tekst":"Moreover, the LORD spake to Aaron; and I, behold, I, have given thee the Guard of my heave-offerings, [See above, chapter 5, on verse 9.] with all holy things [Hebrew. Holinesses. See Leviticus 5. On verse 15.] of the children of Israel, have I given you them, for the anointing sake, [i.e. for that thou art anointed to this Holy Office. See Leviticus 8. 11.etc.] and to thy sons for an everlasting Institution. [viz. until the coming of the Messiah, see Genesis 13. On verse 15. And 17.7.]"}],"9":[{"catchword":null,"tekst":"This thou salt have of the Holiness of Holiness. [See Levit.2.on v.3.] out of the fire: [i.e. that which is no burnt-offering, or appointed to be wholly burnt with fire upon the Altar, but is remaining over of the fire-offerings, &c.] all their sacrifices, with all their meat-offering, and with all their sin-offering, and with all their guilt-offering that they shall render unto me; it shall be a holiness of Holiness, to thee, and to thy sons. [i.e. thou and thy sons ought to account of it as a very Holy thing; others, an Holiness of Holinesses, it shall be thine and thy sons; i.e. therefore, because it is a very holy thing, shalt thou and thy sons have it.]"}],"10":[{"catchword":null,"tekst":"At the most Holy place shalt thou eat the same: [Either within the Holy place it self, or without by the Altar of burnt-offerings, which also it self is called an Holiness of Holinesses, Exo 29:37. See further, Lev 6:16.26, and chapter 7. Verse 6. And chapter 8. 31. And 14.13. this place is called, The Holy of Holies; or most or very holy place, in comparison of all the Court, where all the Congregation assembled. God would have the Priests to eat all these things in this place, to // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;

}
function bijbeluitlegHtml(n) {

  const MAX_CW = 60;

            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
