.","4":"En Eleazar, de priester, zal van haar bloed met zijn vinger nemen, en hij zal van haar bloed zeven keer sprenkelen, recht tegenover de tent van de samenkomst.","5":"Vervolgens zal men deze vaars voor zijn ogen verbranden; haar vel, en haar vlees, en haar bloed, met haar mest, zal men verbranden.","6":"En de priester zal cederhout nemen, en hysop, en scharlaken, en dat werpen in het midden van het vuur waarin de vaars brandt.","7":"Dan zal de priester zijn kleren wassen, en zijn lichaam met water baden, en daarna in het leger gaan; en de priester zal onrein zijn tot de avond.","8":"Ook hij die haar verbrand heeft, zal zijn kleren met water wassen, en zijn lichaam met water baden, en onrein zijn tot de avond.","9":"En een rein man zal de as van deze vaars verzamelen, en buiten het leger op een reine plaats wegleggen; en het zal bewaard worden voor de gemeenschap van de kinderen van Israël, tot het water van de afzondering; het is een ontzondiging[1].","10":"En hij die de as van deze vaars verzameld heeft, zal zijn kleren wassen, en onrein zijn tot de avond. Dit zal voor de kinderen van Israël, en voor de vreemdeling die te midden van hen als vreemdeling verblijft, een eeuwige inzetting zijn.","11":"Wie een dode aanraakt, welk dood lichaam van een mens dan ook, die zal zeven dagen onrein zijn.","12":"Op de derde dag zal hij zich daarmee ontzondigen, dan zal hij op de zevende dag rein zijn; maar als hij zich op de derde dag niet ontzondigt, dan zal hij op de zevende dag niet rein zijn.","13":"Ieder die een dode, het dode lichaam van een mens die gestorven is, aanraakt, en zich niet ontzondigd zal hebben, die verontreinigt de tabernakel van de HEERE; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water van de afzondering niet op hem gesprenkeld is, zal hij onrein zijn; zijn onreinheid is nog in hem.","14":"Dit is de wet, wanneer een mens gestorven is in een tent: ieder die in die tent binnengaat, en ieder die in die tent is, zal zeven dagen onrein zijn.","15":"Ook elk open voorwerp waarop geen deksel vastgebonden is, is onrein.","16":"En ieder die in het open veld iemand die met het zwaard gedood is, of een dode, of het gebeente van een mens, of een graf aangeraakt heeft, zal zeven dagen onrein zijn.","17":"Voor een onreine nu zal men nemen van het stof van het vuur van de ontzondiging, en daarop levend water doen in een vat.","18":"En een rein man zal hysop nemen, en die dopen in dat water, en het sprenkelen op die tent, en op alle voorwerpen, en op de personen die daar geweest zijn; evenzo op hem die een gebeente, of een gedode, of een dode, of een graf aangeraakt heeft.","19":"En de reine zal de onreine op de derde dag, en op de zevende dag besprenkelen; en op de zevende dag zal hij hem ontzondigen; en hij zal zijn kleren wassen, en zichzelf met water baden, en op de avond rein zijn.","20":"Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.","21":"Dit zal voor hen een eeuwige inzetting zijn. En hij die het water van de afzondering sprenkelt, zal zijn kleren wassen; ook wie het water van de afzondering aanraakt, die zal onrein zijn tot de avond.","22":"Ja, alles wat die onreine aangeraakt zal hebben, zal onrein zijn; en de ziel die dat aangeraakt zal hebben, zal onrein zijn tot de avond."},"SV":{"1":"Wijders sprak de HEERE tot Mozes en tot Aäron, zeggende:","2":"Dit is de inzetting van de wet, die de HEERE geboden heeft, zeggende: Spreek tot de kinderen Israëls, dat zij tot u brengen een rode volkomen vaars, in welke geen gebrek is, op welke geen juk gekomen is.","3":"En gij zult die geven aan Eleazar, den priester; en hij zal ze uitbrengen tot buiten het leger, en men zal haar voor zijn aangezicht slachten.","4":"En Eleazar, den priester, zal van haar bloed met zijn vinger nemen, en hij zal van haar bloed recht tegenover de tent der samenkomst zevenmaal sprengen.","5":"Voorts zal men deze vaars voor zijn ogen verbranden; haar vel, en haar vlees, en haar bloed, met haar mest, zal men verbranden.","6":"En de priester zal nemen cederhout, en hysop, en scharlaken, en werpen ze in het midden van den brand dezer vaars.","7":"Dan zal de priester zijn klederen wassen, en zijn vlees met water baden, en daarna in het leger gaan; en de priester zal onrein zijn tot aan den avond.","8":"Ook die haar verbrand heeft, zal zijn klederen met water wassen, en zijn vlees met water baden, en onrein zijn tot aan den avond.","9":"En een rein man zal de as dezer vaars verzamelen, en buiten het leger in een reine plaats wegleggen; en het zal zijn ter bewaring voor de vergadering van de kinderen Israëls, tot het water der afzondering; het is ontzondiging.","10":"En die de as dezer vaars verzameld heeft, zal zijn klederen wassen, en onrein zijn tot aan den avond. Dit zal den kinderen Israëls, en den vreemdeling, die in het midden van henlieden als vreemdeling verkeert, tot een eeuwige inzetting zijn.","11":"Wie een dode, enig dood lichaam van een mens, aanroert, die zal zeven dagen onrein zijn.","12":"Op den derden dag zal hij zich daarmede ontzondigen, zo zal hij op den zevenden dag rein zijn; maar indien hij zich op den derden dag niet ontzondigt, zo zal hij op den zevenden dag niet rein zijn.","13":"Al wie een dode4191 , het dode lichaam eens mensen, die gestorven zal zijn, aanroert, en zich niet ontzondigd zal hebben, die verontreinigt den tabernakel des HEEREN; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water der afzondering op hem niet gesprengd is, zal hij onrein zijn; zijn onreinigheid is nog in hem.","14":"Dit is de wet, wanneer een mens zal gestorven zijn in een tent: al wie in die tent ingaat, en al wie in die tent is, zal zeven dagen onrein zijn.","15":"Ook alle open gereedschap, waarop geen deksel gebonden is, dat is onrein.","16":"En al wie in het open veld een, die met het zwaard verslagen is, of een dode, of het gebeente eens mensen, of een graf zal aangeroerd hebben, zal zeven dagen onrein zijn.","17":"Voor een onreine nu zullen zij nemen van het stof des brands der ontzondiging, en daarop levend water doen in een vat.","18":"En een rein man zal hysop nemen, en in dat water dopen, en sprengen het aan die tent, en op al het gereedschap, en aan de zielen, die daar geweest zijn; insgelijks aan dengene, die een gebeente, of een verslagene, of een dode, of een graf aangeroerd heeft.","19":"En de reine zal den onreine op den derden dag, en op den zevenden dag besprengen; en op den zevenden dag zal hij hem ontzondigen; en hij zal zijn klederen wassen, en *zich* met water baden, en op den avond rein zijn.","20":"Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden der gemeente uitgeroeid worden; want hij heeft het heiligdom des HEEREN verontreinigd, het water der afzondering is op hem niet gesprengd, hij is onrein.","21":"Dit zal hunlieden zijn tot een eeuwige inzetting. En die het water der afzondering sprengt, zal zijn klederen wassen; ook wie het water der afzondering aanroert, die zal onrein zijn tot aan den avond.","22":"Ja, al wat die onreine aangeroerd zal hebben, zal onrein zijn; en de ziel, die *dat* aangeroerd zal hebben, zal onrein zijn tot aan den avond."},"KJV":{"1":"And the LORD spake unto Moses and unto Aaron, saying,","2":"This *is* the ordinance of the law which the LORD hath commanded, saying, Speak unto the children of Israel, that they bring thee a red heifer without spot, wherein *is* no blemish, *and* upon which never came yoke:","3":"And ye shall give her unto Eleazar the priest, that he may bring her forth without the camp, and *one* shall slay her before","4":"And Eleazar the priest shall take of her blood with his finger, and sprinkle of her blood directly before the tabernacle of the congregation seven times:","5":"And *one* shall burn the heifer in his sight; her skin, and her flesh, and her blood, with her dung, shall he burn:","6":"And the priest shall take cedar wood, and hyssop, and scarlet, and cast *it* into the midst of the burning of the heifer.","7":"Then the priest shall wash his clothes, and he shall bathe his flesh in water, and afterward he shall come into the camp, and the priest shall be unclean until the even.","8":"And he that burneth her shall wash his clothes in water, and bathe his flesh in water, and shall be unclean until the even.","9":"And a man *that is* clean shall gather up the ashes of the heifer, and lay *them* up without the camp in a clean place, and it shall be kept for the congregation of the children of Israel for a water of separation: it *is* a purification for sin.","10":"And he that gathereth the ashes of the heifer shall wash his clothes, and be unclean until the even: and it shall be unto the children of Israel, and unto the stranger that sojourneth among them, for a statute for ever.","11":"He that toucheth the dead body of any man shall be unclean seven days.","12":"He shall purify himself with it on the third day, and on the seventh day he shall be clean: but if he purify not himself the third day, then the seventh day he shall not be clean.","13":"Whosoever toucheth the dead body of any man that is dead, and purifieth not himself, defileth the tabernacle of the LORD; and that soul shall be cut off from Israel: because the water of separation was not sprinkled upon him, he shall be unclean; his uncleanness","14":"This *is* the law, when a man dieth in a tent: all that come into the tent, and all that *is* in the tent, shall be unclean seven days.","15":"And every open vessel, which hath no covering bound upon it, *is* unclean.","16":"And whosoever toucheth one that is slain with a sword in the open fields, or a dead body, or a bone of a man, or a grave, shall be unclean seven days.","17":"And for an unclean *person* they shall take of the ashes of the burnt heifer of purification for sin, and running water shall be put thereto in a vessel:","18":"And a clean person shall take hyssop, and dip *it* in the water, and sprinkle *it* upon the tent, and upon all the vessels, and upon the persons that were there, and upon him that touched a bone, or one slain, or one dead, or a grave:","19":"And the clean *person* shall sprinkle upon the unclean on the third day, and on the seventh day: and on the seventh day he shall purify himself, and wash his clothes, and bathe himself in water, and shall be clean at even.","20":"But the man that shall be unclean, and shall not purify himself, that soul shall be cut off from among the congregation, because he hath defiled the sanctuary of the LORD: the water of separation hath not been sprinkled upon him; he *is* unclean.","21":"And it shall be a perpetual statute unto them, that he that sprinkleth the water of separation shall wash his clothes; and he that toucheth the water of separation shall be unclean until even.","22":"And whatsoever the unclean *person* toucheth shall be unclean; and the soul that toucheth *it* shall be unclean until even."}},"tsk":{"2":[{"kopje":"de inzetting","refs":["Num 31:21","Hebr 9:10"]},{"kopje":"een rode volkomen vaars","refs":["Lev 22:21","Num 19:6","Lev 14:6","Jes 1:18","Openb 1:5"]},{"kopje":"geen gebrek","refs":["Ex 12:5","Lev 22:20-25","Mal 1:13","Mal 1:14","Luk 1:35","Hebr 7:26","1 Petr 1:19","1 Petr 2:22"]},{"kopje":"waarop","refs":["Deut 21:3","1 Sam 6:7","Klaagl 1:14","Joh 10:17","Joh 10:18","Fil 2:6-8"]}],"3":[{"kopje":"buiten het leger","refs":["Num 5:2","Num 15:36","Lev 4:12","Lev 4:21","Lev 13:45","Lev 13:46","Lev 16:27","Lev 24:14","Hebr 13:11-13"]}],"4":[{"kopje":"sprenkelen","refs":["Lev 4:6","Lev 4:17","Lev 16:14","Lev 16:19","Hebr 9:13","Hebr 9:14","Hebr 12:24","1 Petr 1:2"]}],"9":[{"kopje":"rein","refs":["Num 19:18","Num 9:13","2 Kor 5:21","Hebr 7:26","Hebr 9:13"]},{"kopje":"wegleggen","refs":["Num 19:17"]},{"kopje":"het water van de afzondering","refs":["Hebr 9 ging daarmede zal een teken zijn der reiniging van zonden, die alleen geschiedt door het bloed van den Messias en Zaligmaker, onzen HEERE Jezus Christus, mits gesprengd [dat is, toegeëigend] zijnde aan de zielen van alle ware kinderen Gods, waarvan deze ganse ceremonie een voorbeeld was. Zie Heb 9:12-14, en Heb 10:1-4, Heb 10:12, Heb 10:14; 1Pe 1:2; 1Jo 1:7, enz. Alzo wordt het woord zonde ook zeer dikwijls genomen voor offerande voor de zonde, of zondoffer. Zie en vergelijk boven, Num 8:7 waar dit water genoemd wordt water der zonde, en onder, vs.17 hebt gij brand der zonde."}],"11":[{"catchword":"enig dood lichaam van een mens,","tekst":"Hetzij van een Jood, of van een vreemdeling. Hebreeuws, ziel. Zie Lev 19:28."}],"12":[{"catchword":"daarmede ontzondigen,","tekst":"Met het water der afzondering."}],"13":[{"catchword":"verontreinigt den tabernakel","tekst":"Wanneer hij, nog onrein zijnde, evenwel niet schroomt tegen Gods uitgedrukt bevel in den voorhof van zijn heilige woning te verschijnen."},{"catchword":"die ziel","tekst":"Dat is, mens, persoon."},{"catchword":"uitgeroeid worden uit Israël;","tekst":"Als hebbende moedwilliglijk veracht, niet alleen dit ceremoniëel gebod des HEEREN, maar ook de betekende zaak, te weten, de reiniging door het bloed van den Messias, gelijk de volgende woorden uitwijzen; vergelijk met boven, vs.9. Vergelijk ook Heb 10:26-29. Zie wijders Gen 17:14; alzo onder, vs.20."},{"catchword":"is nog in hem","tekst":"Of, zal voortaan in hem zijn, of, blijft in hem."}],"14":[{"catchword":"in een tent","tekst":"Dat is, in het leger, in zijn woning."}],"15":[{"catchword":"deksel","tekst":"Hebreeuws, gewrongen doek, of stuk laken, of snoer, waarmede men iets bindt."},{"catchword":"gebonden is,","tekst":"Hebreeuws, aangevoegd, samengevoegd, gekoppeld. De zin is, dat nergens mede toegedekt, bestopt of bewonden is."}],"16":[{"catchword":"mensen,","tekst":"Die gestorven is."}],"17":[{"catchword":"Voor een onreine","tekst":"Hier beveelt nu God de wijze aan van het water der afzondering te bereiden en te gebruiken."},{"catchword":"stof des brands","tekst":"Dat is, van de bewaarde as der verbrande rode vaars. Zie boven, vs.9."},{"catchword":"ontzondiging,","tekst":"Hebreeuws, der zonde; dat is, dienende tot ontzondiging of reiniging van zonde. Zie boven, vs.9."},{"catchword":"levend water doen","tekst":"Dat is, springende, lopende of vlietende, genomen uit een fontein of rivier. Zie Gen 26:19; Lev 14:5."}],"20":[{"catchword":"die ziel zal uit het midden der gemeente","tekst":"Dat is, die persoon, of, mens."},{"catchword":"heiligdom des HEEREN verontreinigd,","tekst":"Zie boven, vs.13."}],"22":[{"catchword":"dat aangeroerd zal hebben,","tekst":"Of, hem."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Further, the LORD spake to Moseh and to Aaron, saying;"}],"2":[{"catchword":null,"tekst":"This is the institution of the Law, which the LORD commanded, saying: speak to the children of Israel, that they bring to you [Hebrew take to you, i.e. take and bring to you. See of the like use of such words, Genesis 12. On verse 15.] a red perfect Heifer, wherein there be no defect; [Compare Hebrews 7. 26. 1 Peter 1. 19. etc.] on which no yoke hath come."}],"3":[{"catchword":null,"tekst":"And the same ye shall give to Eleazar, the Priest; and he shall bring her forth without the Camp, [See the signification hereof, Hebrew.13.11, 12.] and they shall slay her before his face."}],"4":[{"catchword":null,"tekst":"And Eleazar the Priest, shall take of her blood, with his finger: and of her blood he shall sprinkle seven times, right over against the Tent of the Congregation."}],"5":[{"catchword":null,"tekst":"Further, they shall burn this Heifer before his eyes; her skin and her flesh, and her blood with her dung shall be burnt."}],"6":[{"catchword":null,"tekst":"And the Priest shall take Cedar-wood, and Hyssop and Scarlet; and cast it into the midst of the burning so this Heifer."}],"7":[{"catchword":null,"tekst":"Then the Priest shall wash his clothes, and hath his flesh with water, and afterward go into the Camp: and the Priest shall be unclean until the Even."}],"8":[{"catchword":null,"tekst":"Also he that burnt her, shall wash his clothes with water, and bathe his flesh with water, and be unclean until the Even."}],"9":[{"catchword":null,"tekst":"And a clean man shall gather the ashes of this Heifer, and lay them aside without the Camp in a clean place: and it shall be to keep, [i.e. these ashes shall be kept and preserved] for the Congregation of the children of Israel, for the Water of separation; [where with those were to be sprinkled, who by means of any ceremonial uncleanness, were to be separated and secluded from the Tabernacle, or meeting of the Congregation; in token of their Purification] it is an Expiation [or, unsinning, Hebrew sin; i.e. Expiation, or cleansing from sin: see verse 12.13,19,20. The meaning is: This Water, and the sprinkling thereof, shall be token of the cleansing and Purification from sin, made, or bemade, onely by the blood of the Messiah our LORD and Saviour Jesus Christ, the same being sprinkled upon (i.e. imputed and appropriated unto) the souls of all true children of God, whereof all the ceremony, was but a type and figure: See Heb 9:12,13,14. And ch.1,2,3,4,12,14. 1 Pet.1.2. 1Jn 1:7,etc. So the word Sin, is also very frequently taken, for sacrifice for sin, or sin-offering. See and compare above, chapter 8. On verse 7. Where this water is called water of sin: and in this chapter v.17. ye have the burning of sin.]"}],"10":[{"catchword":null,"tekst":"And he that gathered the ashes of this Heifer, shall wash his clothes and be unclean until the Even: this shall be unto the children of Israel, and unto the stranger, that sojourneth in the midst of them, for an everlasting institution."}],"11":[{"catchword":null,"tekst":"Whoso toucheth a dead, any dead body of a man, [viz. whether he be born Israelite, or stranger, Heb. soul. See Lev.19.on v.28.] the same shall be unclean seven days."}],"12":[{"catchword":null,"tekst":"On the third day he shall un-sin (or purify) himself therewith, [viz. with the water of separation spoken of before] so shall he be clean on the seventh day: but if he doe not un-sin himself on the third day, he shall not be clean on the seventh day."}],"13":[{"catchword":null,"tekst":"Whosoever toucheth a dead, the dead body of a man, that shall be dead, and shall not have un-sinned himself, the same defilth the Tabernacle of LORD; [viz. whiles being unclean yet, he nevertheless presumeth, and dreads not to appear in the court of Gods Holy Habitation, contrary to the express command of God] therefore shall that soul [i.e. man, or person] be rooted out from Israel: [as having willfully despised, not onely the Ceremonial precept of the LORD, but likewise the thing betokened thereby; to wit, the cleansing through the blood of Christ; as the following words shew forth, compared with the note above, on v .9. compare likewise, Heb 10:26,27,28,29. And see further, Gen.17. on v.14. and below here, v.20.] because the water of separation is not sprinkled upon him, he shall be unclean; his uncleanness is yet in him. [or, shall be further in him; or abideth in him.]"}],"14":[{"catchword":null,"tekst":"This is the Law, when a man shall have died in a Tent: [i.e. in the Camp, in his habitation or dwelling place] Every one that goeth into that Tent, and every one that is in that Tent, shall be unclean seven days."}],"15":[{"catchword":null,"tekst":"(As) also all open furniture, whereon no covering [Hebr. Wrung, or wrested work, or piece of cloth, or band wherewith things are bound up] is bound, [Hebr. Joined, fastened, coupled; the sense is, such things as are not covered, kept close, bound or wrapped up] the same is unclean."}],"16":[{"catchword":null,"tekst":"And whosoever shall have touched in the open field, one slain ith the sword, or a dead (person) or the bones of a man, [Being dead] or a grave, shall be seven days unclean."}],"17":[{"catchword":null,"tekst":"Now for an unclean (one) [Here now God ordereth the manner of preparing and applying the water of separation] they shall take of the dust, [i.e. of the preserved ashes of the red Heifer above mentioned. Verse 9.] of the burning of the unsinning, [or expiation, purification, Heb. sin. i.e. serving for the expiation or abolition of and purifying from sin. See above, on v.9.] and put living water [i.e. spring, or running water, taken out of a fountain or river, see gen.26. on v.19. and Levi.14.5.] there upon in a vessel."}],"18":[{"catchword":null,"tekst":"And a clean man shall take hyssop, and dip into that water, and sprinkle it on that Tent, and on all the furniture, and on the souls that were there: (as) likewise, on him that touched a bone, or a slain, or a dead (person) or a grave."}],"19":[{"catchword":null,"tekst":"And the clean shall sprinkle the unclean on the third day, and on the seventh day: and on the seventh day he shall unsin, (or expiate) him; and he shall wash his clothes, and bathe himself with water, and be clean in the Even."}],"21":[{"catchword":null,"tekst":"This shall be unto them for an everlasting institution: and be that sprinkleth the water of separation, shall wash his clothes; also he that toucheth the water of separation, shall be unclean until the Even."}],"22":[{"catchword":null,"tekst":"Yea, whatsoever shall have touched that unclean (one) shall be unclean; and the soul that shall have touched the same [Or, him] shall be unclean until the Even."}]}}};

  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
