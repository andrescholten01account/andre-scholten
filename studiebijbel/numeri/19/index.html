dag rein zijn; maar als hij zich op de derde dag niet ontzondigt, dan zal hij op de zevende dag niet rein zijn.", "13": "Ieder die een dode, het dode lichaam van een mens die gestorven is, aanraakt, en zich niet ontzondigd zal hebben, die verontreinigt de tabernakel van de HEERE; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water van de afzondering niet op hem gesprenkeld is, zal hij onrein zijn; zijn onreinheid is nog in hem.", "14": "Dit is de wet, wanneer een mens gestorven is in een tent: ieder die in die tent binnengaat, en ieder die in die tent is, zal zeven dagen onrein zijn.", "15": "Ook elk open voorwerp waarop geen deksel vastgebonden is, is onrein.", "16": "En ieder die in het open veld iemand die met het zwaard gedood is, of een dode, of het gebeente van een mens, of een graf aangeraakt heeft, zal zeven dagen onrein zijn.", "17": "Voor een onreine nu zal men nemen van het stof van het vuur van de ontzondiging, en daarop levend water doen in een vat.", "18": "En een rein man zal hysop nemen, en die dopen in dat water, en het sprenkelen op die tent, en op alle voorwerpen, en op de personen die daar geweest zijn; evenzo op hem die een gebeente, of een gedode, of een dode, of een graf aangeraakt heeft.", "19": "En de reine zal de onreine op de derde dag, en op de zevende dag besprenkelen; en op de zevende dag zal hij hem ontzondigen; en hij zal zijn kleren wassen, en zichzelf met water baden, en op de avond rein zijn.", "20": "Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.", "21": "Dit zal voor hen een eeuwige inzetting zijn. En hij die het water van de afzondering sprenkelt, zal zijn kleren wassen; ook wie het water van de afzondering aanraakt, die zal onrein zijn tot de avond.", "22": "Ja, alles wat die onreine aangeraakt zal hebben, zal onrein zijn; en de ziel die dat aangeraakt zal hebben, zal onrein zijn tot de avond."}, "SV": {"1": "Wijders sprak de HEERE tot Mozes en tot Aäron, zeggende:", "2": "Dit is de inzetting van de wet, die de HEERE geboden heeft, zeggende: Spreek tot de kinderen Israëls, dat zij tot u brengen een rode volkomen vaars, in welke geen gebrek is, op welke geen juk gekomen is.", "3": "En gij zult die geven aan Eleazar, den priester; en hij zal ze uitbrengen tot buiten het leger, en men zal haar voor zijn aangezicht slachten.", "4": "En Eleazar, den priester, zal van haar bloed met zijn vinger nemen, en hij zal van haar bloed recht tegenover de tent der samenkomst zevenmaal sprengen.", "5": "Voorts zal men deze vaars voor zijn ogen verbranden; haar vel, en haar vlees, en haar bloed, met haar mest, zal men verbranden.", "6": "En de priester zal nemen cederhout, en hysop, en scharlaken, en werpen ze in het midden van den brand dezer vaars.", "7": "Dan zal de priester zijn klederen wassen, en zijn vlees met water baden, en daarna in het leger gaan; en de priester zal onrein zijn tot aan den avond.", "8": "Ook die haar verbrand heeft, zal zijn klederen met water wassen, en zijn vlees met water baden, en onrein zijn tot aan den avond.", "9": "En een rein man zal de as dezer vaars verzamelen, en buiten het leger in een reine plaats wegleggen; en het zal zijn ter bewaring voor de vergadering van de kinderen Israëls, tot het water der afzondering; het is ontzondiging.", "10": "En die de as dezer vaars verzameld heeft, zal zijn klederen wassen, en onrein zijn tot aan den avond. Dit zal den kinderen Israëls, en den vreemdeling, die in het midden van henlieden als vreemdeling verkeert, tot een eeuwige inzetting zijn.", "11": "Wie een dode, enig dood lichaam van een mens, aanroert, die zal zeven dagen onrein zijn.", "12": "Op den derden dag zal hij zich daarmede ontzondigen, zo zal hij op den zevenden dag rein zijn; maar indien hij zich op den derden dag niet ontzondigt, zo zal hij op den zevenden dag niet rein zijn.", "13": "Al wie een dode4191 , het dode lichaam eens mensen, die gestorven zal zijn, aanroert, en zich niet ontzondigd zal hebben, die verontreinigt den tabernakel des HEEREN; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water der afzondering op hem niet gesprengd is, zal hij onrein zijn; zijn onreinigheid is nog in hem.", "14": "Dit is de wet, wanneer een mens zal gestorven zijn in een tent: al wie in die tent ingaat, en al wie in die tent is, zal zeven dagen onrein zijn.", "15": "Ook alle open gereedschap, waarop geen deksel gebonden is, dat is onrein.", "16": "En al wie in het open veld een, die met het zwaard verslagen is, of een dode, of het gebeente eens mensen, of een graf zal aangeroerd hebben, zal zeven dagen onrein zijn.", "17": "Voor een onreine nu zullen zij nemen van het stof des brands der ontzondiging, en daarop levend water doen in een vat.", "18": "En een rein man zal hysop nemen, en in dat water dopen, en sprengen het aan die tent, en op al het gereedschap, en aan de zielen, die daar geweest zijn; insgelijks aan dengene, die een gebeente, of een verslagene, of een dode, of een graf aangeroerd heeft.", "19": "En de reine zal den onreine op den derden dag, en op den zevenden dag besprengen; en op den zevenden dag zal hij hem ontzondigen; en hij zal zijn klederen wassen, en *zich* met water baden, en op den avond rein zijn.", "20": "Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden der gemeente uitgeroeid worden; want hij heeft het heiligdom des HEEREN verontreinigd, het water der afzondering is op hem niet gesprengd, hij is onrein.", "21": "Dit zal hunlieden zijn tot een eeuwige inzetting. En die het water der afzondering sprengt, zal zijn klederen wassen; ook wie het water der afzondering aanroert, die zal onrein zijn tot aan den avond.", "22": "Ja, al wat die onreine aangeroerd zal hebben, zal onrein zijn; en de ziel, die *dat* aangeroerd zal hebben, zal onrein zijn tot aan den avond."}, "KJV": {"1": "And the LORD spake unto Moses and unto Aaron, saying,", "2": "This *is* the ordinance of the law which the LORD hath commanded, saying, Speak unto the children of Israel, that they bring thee a red heifer without spot, wherein *is* no blemish, *and* upon which never came yoke:", "3": "And ye shall give her unto Eleazar the priest, that he may bring her forth without the camp, and *one* shall slay her before", "4": "And Eleazar the priest shall take of her blood with his finger, and sprinkle of her blood directly before the tabernacle of the congregation seven times:", "5": "And *one* shall burn the heifer in his sight; her skin, and her flesh, and her blood, with her dung, shall he burn:", "6": "And the priest shall take cedar wood, and hyssop, and scarlet, and cast *it* into the midst of the burning of the heifer.", "7": "Then the priest shall wash his clothes, and he shall bathe his flesh in water, and afterward he shall come into the camp, and the priest shall be unclean until the even.", "8": "And he that burneth her shall wash his clothes in water, and bathe his flesh in water, and shall be unclean until the even.", "9": "And a man *that is* clean shall gather up the ashes of the heifer, and lay *them* up without the camp in a clean place, and it shall be kept for the congregation of the children of Israel for a water of separation: it *is* a purification for sin.", "10": "And he that gathereth the ashes of the heifer shall wash his clothes, and be unclean until the even: and it shall be unto the children of Israel, and unto the stranger that sojourneth among them, for a statute for ever.", "11": "He that toucheth the dead body of any man shall be unclean seven days.", "12": "He shall purify himself with it on the third day, and on the seventh day he shall be clean: but if he purify not himself the third day, then the seventh day he shall not be clean.", "13": "Whosoever toucheth the dead body of any man that is dead, and purifieth not himself, defileth the tabernacle of the LORD; and that soul shall be cut off from Israel: because the water of separation was not sprinkled upon him, he shall be unclean; his uncleanness", "14": "This *is* the law, when a man dieth in a tent: all that come into the tent, and all that *is* in the tent, shall be unclean seven days.", "15": "And every open vessel, which hath no covering bound upon it, *is* unclean.", "16": "And whosoever toucheth one that is slain with a sword in the open fields, or a dead body, or a bone of a man, or a grave, shall be unclean seven days.", "17": "And for an unclean *person* they shall take of the ashes of the burnt heifer of purification for sin, and running water shall be put thereto in a vessel:", "18": "And a clean person shall take hyssop, and dip *it* in the water, and sprinkle *it* upon the tent, and upon all the vessels, and upon the persons that were there, and upon him that touched a bone, or one slain, or one dead, or a grave:", "19": "And the clean *person* shall sprinkle upon the unclean on the third day, and on the seventh day: and on the seventh day he shall purify himself, and wash his clothes, and bathe himself in water, and shall be clean at even.", "20": "But the man that shall be unclean, and shall not purify himself, that soul shall be cut off from among the congregation, because he hath defiled the sanctuary of the LORD: the water of separation hath not been sprinkled upon him; he *is* unclean.", "21": "And it shall be a perpetual statute unto them, that he that sprinkleth the water of separation shall wash his clothes; and he that toucheth the water of separation shall be unclean until even.", "22": "And whatsoever the unclean *person* toucheth shall be unclean; and the soul that toucheth *it* shall be unclean until even."}}, "tsk": {"2": [{"kopje": "de inzetting", "refs": ["Num 31:21", "Hebr 9:10"]}, {"kopje": "een rode volkomen vaars", "refs": ["Lev 22:21", "Num 19:6", "Lev 14:6", "Jes 1:18",  "Lev 11:24-28", "svLabel": null}, {"disp": "Lev 11:31-40", "href": "../../leviticus/11/#v31", "ref": "Lev 11:31-40", "svLabel": null}, {"disp": "Lev 13:2-59", "href": "../../leviticus/13/#v2", "ref": "Lev 13:2-59", "svLabel": null}, {"disp": "Lev 14:2", "href": "../../leviticus/14/#v2", "ref": "Lev 14:2", "svLabel": null}, {"disp": "Lev 14:3", "href": "../../leviticus/14/#v3", "ref": "Lev 14:3", "svLabel": null}, {"disp": "Lev 14:8", "href": "../../leviticus/14/#v8", "ref": "Lev 14:8", "svLabel": null}, {"disp": "Lev 14:9", "href": "../../leviticus/14/#v9", "ref": "Lev 14:9", "svLabel": null}, {"disp": "Lev 14:34-48", "href": "../../leviticus/14/#v34", "ref": "Lev 14:34-48", "svLabel": null}, {"disp": "Lev 14:54-57", "href": "../../leviticus/14/#v54", "ref": "Lev 14:54-57", "svLabel": null}, {"disp": "Lev 15:2-13", "href": "../../leviticus/15/#v2", "ref": "Lev 15:2-13", "svLabel": null}, {"disp": "Lev 15:16-28", "href": "../../leviticus/15/#v16", "ref": "Lev 15:16-28", "svLabel": null}, {"disp": "Lev 15:32", "href": "../../leviticus/15/#v32", "ref": "Lev 15:32", "svLabel": null}, {"disp": "Lev 15:33", "href": "../../leviticus/15/#v33", "ref": "Lev 15:33", "svLabel": null}, {"disp": "Lev 22:4-8", "href": "../../leviticus/22/#v4", "ref": "Lev 22:4-8", "svLabel": null}, {"disp": "Num 5:2-4", "href": "../../numeri/5/#v2", "ref": "Num 5:2-4", "svLabel": null}, {"disp": "Num 9:6", "href": "../../numeri/9/#v6", "ref": "Num 9:6", "svLabel": null}, {"disp": "Num 9:10", "href": "../../numeri/9/#v10", "ref": "Num 9:10", "svLabel": null}, {"disp": "Num 19:11-16", "href": "../../numeri/19/#v11", "ref": "Num 19:11-16", "svLabel": null}, {"disp": "Num 19:22", "href": "../../numeri/19/#v22", "ref": "Num 19:22", "svLabel": null}, {"disp": "Num 31:19", "href": "../../numeri/31/#v19", "ref": "Num 31:19", "svLabel": null}, {"disp": "Num 31:20", "href": "../../numeri/31/#v20", "ref": "Num 31:20", "svLabel": null}, {"disp": "Deut 23:10", "href": "../../deuteronomium/23/#v10", "ref": "Deut 23:10", "svLabel": null}, {"disp": "Deut 23:11", "href": "../../deuteronomium/23/#v11", "ref": "Deut 23:11", "svLabel": null}, {"disp": "Deut 24:8", "href": "../../deuteronomium/24/#v8", "ref": "Deut 24:8", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Defilement", "href": "../../torrey/d/#t-defilement", "kinderen": [{"label": "Ceremonial Caused By", "href": "../../torrey/d/?hl=Num.19.22#i4403", "refs": [], "kinderen": [{"label": "Touching an unclean person", "href": "../../torrey/d/?hl=Num.19.22#i4418", "refs": [{"disp": "Num 19:22", "href": "../../numeri/19/#v22", "ref": "Num 19:22", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Hebr 9:14": "hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Lev 24:14": "Breng de vloeker naar buiten, tot buiten het kamp, en laat allen die het gehoord hebben hun handen op zijn hoofd leggen; daarna zal de hele gemeenschap hem stenigen.", "Num 19:11-22": "Wie een dode aanraakt, welk dood lichaam van een mens dan ook, die zal zeven dagen onrein zijn. Op de derde dag zal hij zich daarmee ontzondigen, dan zal hij op de zevende dag rein zijn; maar als hij zich op de derde dag niet ontzondigt, dan zal hij op de zevende dag niet rein zijn. Ieder die een dode, het dode lichaam van een mens die gestorven is, aanraakt, en zich niet ontzondigd zal hebben, die verontreinigt de tabernakel van de HEERE; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water van de afzondering niet op hem gesprenkeld is, zal hij onrein zijn; zijn onreinheid is nog in hem.", "Ex 30:18-21": "U moet ook een koperen wasvat maken, met zijn koperen voet, om mee te wassen; en u moet het zetten tussen de tent van de samenkomst en het altaar, en u moet er water in doen; Zodat Aäron en zijn zonen zich daarmee kunnen wassen, hun handen en voeten. Wanneer zij de tent van de samenkomst binnengaan, moeten zij zich met water wassen, zodat zij niet sterven; of wanneer zij tot het altaar naderen om te dienen, om het vuuroffer aan de HEERE aan te steken;", "Matt 18:15-18": "Maar als uw broeder tegen u gezondigd heeft, ga naar hem toe en wijs hem terecht tussen u en hem alleen; als hij naar u luistert, hebt u uw broeder gewonnen. Maar als hij niet naar u luistert, neem dan nog één of twee mensen met u mee, zodat elk woord vaststaat door de mond van twee of drie getuigen. En als hij naar hen niet luistert, zeg het dan aan de gemeente; en als hij ook naar de gemeente niet luistert, laat hij dan voor u zijn als de heiden en de tollenaar.", "Lev 22:4-7": "Niemand van het nageslacht van Aäron die melaats is, of een vloed heeft, zal van die heilige dingen eten, totdat hij rein is; alsook wie iets aanraakt dat onrein is door een dood lichaam, of een man aan wie het zaad van de gemeenschap ontgaat. Of wie ook maar enig kruipend gedierte zal hebben aangeraakt waardoor hij onrein wordt, of een mens waardoor hij onrein wordt, naar al zijn onreinheid; De mens die dat zal hebben aangeraakt, zal onrein zijn tot aan de avond, en hij zal van die heilige dingen niet eten, maar zal zijn lichaam met water baden.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Gen 17:14": "En wat mannelijk is en de voorhuid heeft, wiens vlees van de voorhuid niet besneden wordt, die persoon zal uit zijn volk uitgeroeid worden; hij heeft Mijn verbond gebroken.", "Ex 26:31": "Daarna moet u een voorhang maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het uiterst kunstige werk zal men die maken, met cherubs.", "Num 20:12": "Daarom zei de HEERE tot Mozes en tot Aäron: Omdat u Mij niet geloofd hebt, door Mij te heiligen voor de ogen van de kinderen van Israël, daarom zult u deze gemeente niet brengen in het land, dat Ik hun gegeven heb.", "Lev 11:31": "Die zullen voor u onrein zijn onder al het kruipend gedierte; wie ze aangeraakt zal hebben, als ze dood zijn, zal onrein zijn tot de avond.", "Lev 11:31-40": "Die zullen voor u onrein zijn onder al het kruipend gedierte; wie ze aangeraakt zal hebben, als ze dood zijn, zal onrein zijn tot de avond. Ook alles waarop iets van hen vallen zal, als ze dood zijn, zal onrein zijn: hetzij een houten vat, of een kleed, of een vel, of een zak, of enig voorwerp waarmee werk gedaan wordt; het zal in het water gestoken worden, en onrein zijn tot de avond; daarna zal het rein zijn. En elk aarden vat waarin iets van hen zal zijn gevallen, alles wat erin is zal onrein zijn, en u zult het breken.", "Lev 15:32": "Dit is de wet van hem die de vloed heeft, en van hem uit wie het zaad van de gemeenschap uitgaat, zodat hij daardoor onrein wordt;", "Num 4:17": "En de HEERE sprak tot Mozes en tot Aäron:", "Lev 4:6": "En de priester zal zijn vinger in dat bloed dopen; en van dat bloed zal hij zevenmaal sprenkelen voor het aangezicht van de HEERE, voor de voorhang van het heilige.", "Num 7:9": "Maar aan de zonen van Kohath gaf hij niets; want de dienst van de heilige dingen die op hen rustte, moesten zij op de schouders dragen.", "Rom 15:1-3": "Maar wij, die sterk zijn, zijn schuldig de zwakheden van de onsterken te dragen, en niet onszelf te behagen. Laat dan ieder van ons zijn naaste behagen ten goede, tot opbouw. Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "1 Kor 15:3": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften;", "2 Kron 20:8": "Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, en zeiden:", "Ex 38:23": "En met hem Aholiab, de zoon van Ahisamach, van de stam van Dan, een werkmeester en vernuftig kunstenaar, en een borduurder in hemelsblauw, en in purper, en in scharlaken, en in fijn linnen.", "Lev 4:17": "En de priester zal zijn vinger indopen, nadat hij van dat bloed genomen heeft; en hij zal zevenmaal sprenkelen voor het aangezicht van de HEERE, voor de voorhang.", "Num 9:7": "En diezelfde mannen zeiden tot hem: Wij zijn onrein over het dode lichaam van een mens; waarom zouden wij ervan uitgesloten worden, dat wij de offerande van de HEERE op zijn vastgestelde tijd niet zouden offeren, te midden van de kinderen van Israël?", "Num 4:12": "Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Lev 16:14": "En hij zal van het bloed van de stier nemen, en zal met zijn vinger op het verzoendeksel aan de oostkant sprenkelen; en voor het verzoendeksel zal hij zevenmaal met zijn vinger van dat bloed sprenkelen.", "Lev 14:49": "Daarna zal hij, om dat huis te ontzondigen, twee vogeltjes nemen, alsook cederhout, en scharlaken, en hysop.", "Ex 35:5-7": "Neemt van hetgeen dat u hebt, een hefoffer voor de HEERE; ieder wiens hart vrijwillig is, zal het brengen als hefoffer voor de HEERE: goud, en zilver, en koper; Als ook hemelsblauw, en purper, en scharlaken, en fijn linnen, en geitenhaar; En roodgeverfde ramsvellen, en dassenvellen, en acaciahout;", "2 Kor 2:11": "opdat de satan geen voordeel over ons krijgt; want zijn gedachten zijn ons niet onbekend.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Num 19:7-10": "Dan zal de priester zijn kleren wassen, en zijn lichaam met water baden, en daarna in het leger gaan; en de priester zal onrein zijn tot de avond. Ook hij die haar verbrand heeft, zal zijn kleren met water wassen, en zijn lichaam met water baden, en onrein zijn tot de avond. En een rein man zal de as van deze vaars verzamelen, en buiten het leger op een reine plaats wegleggen; en het zal bewaard worden voor de gemeenschap van de kinderen van Israël, tot het water van de afzondering; het is een ontzondiging.", "Lev 11:27": "En alles wat op zijn poten loopt onder alle gedierte dat op vier voeten loopt, zal voor u onrein zijn; wie hun kadaver aangeraakt zal hebben, zal onrein zijn tot de avond.", "Mal 1:13": "Verder zegt u: Zie, wat een vermoeidheid! maar u zou het kunnen wegblazen, zegt de HEERE van de heerscharen; u brengt ook wat geroofd is, en wat kreupel en krank is; u brengt ook spijsoffer; zou Mij dat aangenaam zijn van uw hand? zegt de HEERE.", "Lev 11:1": "En de HEERE sprak tot Mozes en tot Aäron, en zei tegen hen:", "Mark 7:2-9": "En toen zij zagen dat sommigen van Zijn discipelen met onreine, dat wil zeggen, met ongewassen handen brood aten, berispten zij hen. Want de Farizeeën en alle Joden eten niet, tenzij zij eerst de handen dikwijls wassen, en zo de overleveringen van de ouden vasthouden. En wanneer zij van de markt komen, eten zij niet, tenzij zij eerst gewassen zijn. En er zijn nog vele andere dingen, die zij aangenomen hebben om vast te houden, namelijk het wassen van drinkbekers, en kannen, en koperen vaten, en bedden.", "Ezech 23:38": "Nog hebben zij Mij dit aangedaan: zij hebben Mijn heiligdom op diezelfde dag verontreinigd, en Mijn sabbatten ontheiligd.", "Ezech 39:11-16": "En op die dag zal het gebeuren dat Ik aan Gog daar een graf zal geven in Israël, het dal van de doorgangers ten oosten van de zee; en dat zal de doorgangers de neus stoppen; en daar zullen zij Gog begraven en zijn hele menigte, en zij zullen het noemen: Het dal van Gogs menigte. Het huis van Israël nu zal hen begraven, om het land te reinigen, zeven maanden lang. Ja, heel het volk van het land zal begraven, en het zal hun tot een naam zijn, op de dag dat Ik verheerlijkt zal zijn, spreekt de Heere HEERE.", "Lev 16:26": "En hij die de bok, die een weggaande bok was, weggebracht heeft, zal zijn klederen wassen, en zijn lichaam met water baden; en daarna zal hij in het kamp komen.", "Mal 1:14": "Ja, vervloekt is de bedrieger, die een mannetje in zijn kudde heeft, en de Heere een gelofte doet, en offert wat verdorven is! want Ik ben een groot Koning, zegt de HEERE van de heerscharen, en Mijn Naam is ontzagwekkend onder de heidenen.", "Lev 7:27": "Elke ziel die enig bloed eet, die ziel zal uit haar volk uitgeroeid worden.", "Num 4:1": "En de HEERE sprak tot Mozes en tot Aäron:", "Ex 28:31": "U zult ook de mantel van de efod geheel van hemelsblauw maken.", "Ps 73:17": "Totdat ik in Gods heiligdommen inging, en op hun einde lette.", "Lev 8:6": "En Mozes liet Aäron en zijn zonen naderbij komen, en waste hen met dat water.", "Ex 30:33": "De man die zo'n zalf maakt als deze, of die daarvan op een vreemde doet, die zal uitgeroeid worden uit zijn volk.", "Ex 30:38": "De man die zoiets namaakt, om eraan te ruiken, die zal uitgeroeid worden uit zijn volk.", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Num 4:13": "En zij zullen de as van het altaar vegen, en zij zullen daarover een kleed van purper uitspreiden.", "Lev 21:12": "En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "1 Kor 16:22": "Als iemand de Heere Jezus Christus niet liefheeft, laat die een vervloeking zijn; Maran-atha!", "Lev 13:1": "Verder sprak de HEERE tot Mozes en tot Aäron, en Hij zei:", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "Lev 15:4-13": "Elk bed waarop hij, die de vloed heeft, zal liggen, zal onrein zijn, en al het voorwerp waarop hij zal zitten, zal onrein zijn. Ieder ook, die zijn bed aanraakt, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond. En wie op dat voorwerp zit waarop hij, die de vloed heeft, gezeten zal hebben, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond.", "Jes 63:18": "Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Lev 14:51": "Dan zal hij dat cederhout, en die hysop, en het scharlaken, en de levende vogel nemen, en zal die in het bloed van de geslachte vogel en in het levende water dopen; en hij zal dat huis zevenmaal besprengen.", "Num 15:15": "U, gemeente, het geldt voor u en voor de vreemdeling die als vreemdeling bij u verblijft, één inzetting: een eeuwige inzetting bij uw geslachten; zoals u bent, zo zal de vreemdeling voor het aangezicht van de HEERE zijn.", "Num 31:19": "En u, legert u buiten het leger, zeven dagen; ieder die een mens gedood heeft, en ieder die een gesneuvelde heeft aangeraakt, moet zich op de derde dag en op de zevende dag ontzondigen, u en uw gevangenen.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Ex 36:18-21": "Hij maakte ook vijftig koperen haakjes, om de tent samen te voegen, zodat die één zou zijn. Ook maakte hij voor de tent een dekkleed van roodgeverfde ramsvellen, en daarover een dekkleed van dassenvellen. Hij maakte ook voor de tabernakel rechtopstaande planken van acaciahout.", "2 Kor 13:2": "Ik heb het van tevoren gezegd, en zeg het van tevoren, alsof ik voor de tweede keer aanwezig was, en ik schrijf het nu terwijl ik afwezig ben, aan hen die eerder gezondigd hebben, en aan alle anderen, dat ik, als ik opnieuw kom, hen niet zal sparen;", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "Gal 5:12": "Och, waren zij maar afgesneden, die u onrustig maken!", "Lev 21:1": "Daarna zei de HEERE tegen Mozes: Spreek tot de priesters, de zonen van Aäron, en zeg tegen hen: Over een dode zal een priester zich niet verontreinigen onder zijn volken.", "Lev 19:5-8": "En wanneer u een dankoffer de HEERE offeren zult, naar uw welgevallen zult u dat offeren. Op de dag van uw offeren, en de volgende dag, zal het gegeten worden; maar wat tot op de derde dag overblijft, zal met vuur verbrand worden. En als het op de derde dag toch gegeten wordt, is het een afschuwelijk ding, het zal niet aangenaam zijn.", "Lev 15:10": "En ieder die iets aanraakt dat onder hem geweest zal zijn, zal onrein zijn tot aan de avond; en wie het draagt, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "Rom 3:29": "Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen;", "Lev 14:4": "zal de priester gebieden dat men voor hem die te reinigen is twee levende reine vogels neemt, alsook cederhout, en scharlaken, en hysop.", "Lev 10:5": "Toen kwamen zij naar voren, en droegen hen, in hun mantels, naar buiten het kamp, zoals Mozes gesproken had.", "Ex 29:4": "Dan zult u Aäron en zijn zonen laten naderen bij de deur van de tent van de samenkomst; en u zult hen met water wassen.", "Deut 19:16-21": "Wanneer een kwaadwillige getuige tegen iemand zal opstaan om een valse verklaring tegen hem af te leggen; dan zullen die twee mannen die de twist hebben, staan voor het aangezicht van de HEERE, voor het aangezicht van de priesters en de rechters, die er in die dagen zullen zijn. En de rechters zullen zorgvuldig onderzoek doen; en zie, de getuige is een valse getuige, hij heeft een valse verklaring afgelegd tegen zijn broeder;", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "Num 4:7": "Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "Lev 17:8": "Zeg dan tegen hen: Ieder van het huis van Israël, en van de vreemdelingen, die in hun midden als vreemdelingen verkeren, die een brandoffer of slachtoffer zal offeren,", "Num 10:21": "Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.", "Tit 3:3-5": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar. Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is, Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Deut 21:3": "De stad nu die het dichtst bij de gedode ligt, daar zullen de oudsten van die stad een jonge koe nemen waarmee niet gewerkt is, die aan het juk niet getrokken heeft.", "Lev 10:4": "En Mozes riep Misaël en Elzafan, de zonen van Uzziël, de oom van Aäron, en zei tegen hen: Kom naar voren, draag uw broeders weg, van voor het heiligdom naar buiten het kamp.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Lev 15:33": "Alsook van een vrouw die zwak is door haar afzondering, en van hem die van zijn vloed is vloeiende, voor een man, en voor een vrouw; en voor een man, die bij een onreine zal hebben gelegen.", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Mark 7:21-23": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden, diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid. Al deze boze dingen komen van binnenuit voort, en verontreinigen de mens.", "Ex 35:25": "En alle vrouwen die wijs van hart waren, sponnen met hun handen, en zij brachten het gesponnene, het hemelsblauwe garen, en het purper, het scharlaken, en het fijn linnen.", "Lev 20:18": "En als een man gemeenschap heeft met een vrouw die ongesteld is, en haar schaamte ontdekt, haar bron blootlegt, en zij zelf de bron van haar bloed ontdekt heeft, zullen zij beiden uit het midden van hun volk uitgeroeid worden.", "Lev 22:3": "Zeg tegen hen: Elke man onder uw geslachten, uit uw hele nageslacht, die tot de heilige dingen zal naderen die de kinderen van Israël de HEERE heiligen, terwijl zijn onreinheid op hem is; die mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE!", "1 Kor 5:2": "En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden?", "1 Tim 5:20": "Bestraf hen die zondigen in aanwezigheid van allen, opdat ook de anderen ontzag mogen hebben.", "Lev 15:16-27": "Verder, een man bij wie het zaad van het bijliggen zal zijn uitgegaan, die zal zijn hele vlees met water baden, en onrein zijn tot aan de avond. Ook elk kledingstuk, en elk vel, waaraan het zaad van het bijliggen zal zijn, dat zal met water gewassen worden, en onrein zijn tot aan de avond. Alsook de vrouw, als een man met het zaad van het bijliggen bij haar gelegen zal hebben; daarom zullen zij zich beiden met water baden, en onrein zijn tot aan de avond.", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Matt 23:27": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u bent net als witgepleisterde graven, die van buiten wel mooi lijken, maar van binnen vol doodsbeenderen en alle onreinheid zijn.", "Joh 10:17": "Daarom heeft de Vader Mij lief, omdat Ik Mijn leven afleg, opdat Ik het opnieuw neem.", "2 Kor 2:6-8": "Voor zo iemand is deze bestraffing genoeg, die door velen is gegeven. Zodat u hem daarentegen juist moet vergeven en vertroosten, opdat zo iemand niet door al te overvloedige droefheid verzwolgen wordt. Daarom bid ik u dat u de liefde voor hem bevestigt.", "Hebr 12:24": "En tot de Middelaar van het nieuwe testament, Jezus, en het bloed van de besprenging, dat betere dingen spreekt dan Abel.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Lev 14:6": "Die levende vogel zal hij nemen, en het cederhout, en het scharlaken, en de hysop; en zal die, en de levende vogel, dopen in het bloed van de vogel die boven het levende water geslacht is.", "2 Kron 30:8": "Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Lev 7:20": "Maar als een ziel het vlees van het dankoffer, dat van de HEERE is, gegeten zal hebben terwijl haar onreinheid op haar is, dan zal die ziel uit haar volk uitgeroeid worden.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Lev 21:11": "Hij zal ook bij geen dode lichamen komen; zelfs over zijn vader en over zijn moeder zal hij zich niet verontreinigen.", "Hebr 9:19-23": "Want toen alle geboden, naar de wet van Mozes, aan heel het volk uitgesproken waren, nam hij het bloed van kalveren en bokken, met water, en purperen wol, en hysop, en besprenkelde zowel het boek zelf, als heel het volk, en zei: Dit is het bloed van het testament, dat God u geboden heeft. En hij besprenkelde eveneens ook de tabernakel, en alle voorwerpen van de dienst met het bloed.", "Judas 1:23": "Maar behoud anderen door vrees, en grijp hen uit het vuur; en haat ook het kleed, dat door het vlees bevlekt is.", "1 Joh 2:2": "En Hij is een verzoening voor onze zonden; en niet alleen voor de onze, maar ook voor de zonden van de hele wereld.", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "1 Tim 5:1": "Bestraf een oudere man niet hard, maar vermaan hem als een vader; de jongeren als broeders;", "Num 31:21": "En Eleazar, de priester, zei tegen de krijgslieden die ten strijde getrokken waren: Dit is de inzetting van de wet, die de HEERE Mozes geboden heeft.", "Matt 15:20": "Deze dingen zijn het die de mens verontreinigen; maar het eten met ongewassen handen verontreinigt de mens niet.", "Lev 5:3": "Of als hij de onreinheid van een mens zal hebben aangeraakt, wat voor onreinheid het ook is waardoor hij onrein wordt; en het is voor hem verborgen geweest, maar hij komt erachter, dan is hij schuldig.", "2 Kron 29:21": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren.", "Num 8:19": "En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.", "Joh 8:24": "Ik heb u dan gezegd, dat u in uw zonden zult sterven; want als u niet gelooft dat Ik Die ben, zult u in uw zonden sterven.", "Lev 15:31": "Zo zult u de kinderen van Israël afzonderen van hun onreinheid; opdat zij in hun onreinheid niet sterven, wanneer zij Mijn tabernakel, die in hun midden is, zouden verontreinigen.", "Joh 4:11": "De vrouw zei tegen Hem: Heere, U hebt niets om mee te putten, en de put is diep; waar hebt U dan het levende water vandaan?", "Deut 23:11": "Maar het zal gebeuren dat hij zich tegen het naken van de avond met water zal baden; en als de zon ondergegaan is, zal hij tot binnen het leger komen.", "Num 15:25": "En de priester zal de verzoening doen voor de hele vergadering van de kinderen van Israël, en het zal hun vergeven worden; want het was een afdwaling, en zij hebben hun offerande gebracht, een vuuroffer voor de HEERE, en hun zondoffer, voor het aangezicht van de HEERE, over hun afdwaling.", "Lev 14:52": "Zo zal hij dat huis ontzondigen met het bloed van de vogel, en met dat levende water, en met de levende vogel, en met dat cederhout, en met de hysop, en met het scharlaken.", "Ex 29:15-18": "Daarna zult u de ene ram nemen, en Aäron en zijn zonen zullen hun handen op het hoofd van de ram leggen; En u zult de ram slachten, en u zult zijn bloed nemen, en rondom op het altaar sprengen. En de ram zult u in zijn delen verdelen; en u zult zijn ingewand en zijn schenkels wassen, en op zijn delen, en op zijn hoofd leggen.", "Lev 11:12": "Alles wat in het water geen vinnen en schubben heeft, dat zal voor u een gruwel zijn.", "Ezech 48:8": "Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn.", "Ex 36:35": "Daarna maakte hij een voorhang van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het uiterst kunstige werk maakte hij die, met cherubs.", "Joh 10:18": "Niemand neemt het van Mij, maar Ik leg het zelf af; Ik heb macht om het af te leggen, en Ik heb macht om het opnieuw te nemen. Dit gebod heb Ik van Mijn Vader ontvangen.", "Matt 15:2": "Waarom overtreden Uw discipelen de overlevering van de ouden? Want zij wassen hun handen niet wanneer zij brood zullen eten.", "Ex 25:3-5": "Dit nu is het hefoffer, dat u van hen nemen zult: goud, zilver en koper; En hemelsblauw, purper, scharlaken, fijn linnen, en geitenhaar. En roodgeverfde ramsvellen, en dassenvellen; en acaciahout;", "Hagg 2:14": "En Haggai zei: Als iemand die onrein is door een dood lichaam iets van die dingen aanraakt, zal het onrein worden? En de priesters antwoordden en zeiden: Het zal onrein worden.", "Klaagl 1:14": "Nun. Het juk van mijn overtredingen is aangebonden door Zijn hand, zij zijn samengevlochten, zij zijn op mijn hals geklommen; Hij heeft mijn kracht doen vervallen; de Heere heeft mij in hun handen gegeven, ik kan niet opstaan.", "Ex 19:14": "Toen ging Mozes van de berg af naar het volk, en hij heiligde het volk; en zij wasten hun kleren.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Num 15:16": "Eén wet en één recht zal er zijn voor u en voor de vreemdeling die bij u als vreemdeling verblijft.", "Lev 5:17": "En als een mens zondigt, en doet tegen een van alle geboden van de HEERE wat niet gedaan mag worden, ook al heeft hij het niet geweten, toch is hij schuldig, en zal zijn ongerechtigheid dragen.", "Gal 5:10": "Ik vertrouw van u in de Heere, dat u niet anders zult denken; maar wie u in verwarring brengt, zal het oordeel dragen, wie hij ook is.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Rom 3:30": "omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Kol 3:11": "waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Lev 17:9": "en dat niet naar de deur van de tent der samenkomst zal brengen, om het aan de HEERE te bereiden; die man zal uit zijn volk uitgeroeid worden.", "Ex 25:8": "En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.", "Lev 14:9": "En op de zevende dag zal gebeuren dat hij al zijn haar afscheert, zijn hoofd, en zijn baard, en de wenkbrauwen van zijn ogen; ja, al zijn haar zal hij afscheren, en al zijn kleren wassen, en zijn lichaam met water baden, dan zal hij rein zijn.", "Lev 23:18": "U zult ook met het brood zeven volkomen eenjarige lammeren, en een var, het jong van een rund, en twee rammen offeren; zij zullen voor de HEERE een brandoffer zijn, met hun spijsoffer en hun drankoffers, een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "2 Kron 26:18": "En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Ps 74:7": "Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.", "Deut 21:18-21": "Wanneer iemand een koppige en opstandige zoon heeft, die niet luistert naar de stem van zijn vader en de stem van zijn moeder; en zij hem gestraft hebben, en hij toch niet naar hen wil horen, Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats. En zij zullen tegen de oudsten van zijn stad zeggen: Deze zoon van ons is koppig en opstandig, hij wil niet naar ons luisteren; hij is een brasser en een dronkaard.", "Lev 16:28": "Wie ze verbrandt, zal zijn klederen wassen, en zijn lichaam met water baden; en daarna zal hij in het kamp komen.", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "2 Kron 34:5": "En de beenderen van de priesters verbrandde hij op hun altaren; en zo reinigde hij Juda en Jeruzalem.", "Tit 3:11": "Wetend dat zo iemand verkeerd is, en zondigt, terwijl hij zichzelf veroordeelt.", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "Openb 7:17": "Want het Lam, Dat in het midden van de troon is, zal hen weiden, en zal hun een Leidsman zijn tot levende fonteinen van water; en God zal alle tranen van hun ogen afwissen.", "Ex 39:2": "Zo maakte hij de efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen.", "Lev 7:19": "En het vlees dat iets onreins aangeraakt heeft, zal niet gegeten worden; met vuur zal het verbrand worden; maar wat het andere vlees betreft, dat vlees mag ieder die rein is, eten.", "Num 31:23": "Alles wat tegen het vuur bestand is, moet u door het vuur laten gaan, zodat het rein wordt; toch zal het ook met het water der afzondering ontzondigd moeten worden; maar alles wat niet tegen het vuur bestand is, moet u door het water laten gaan.", "Lev 5:6": "En hij zal zijn schuldoffer aan de HEERE brengen voor zijn zonde die hij gezondigd heeft: een wijfje van het kleinvee, een lam of een jonge geit, als zondoffer; en de priester zal voor hem verzoening doen vanwege zijn zonde.", "Lev 16:4": "Hij zal de heilige linnen rok aandoen, en een linnen onderbroek zal om zijn lichaam zijn, en met een linnen gordel zal hij zich omgorden, en met een linnen hoofddoek zich bedekken; dit zijn heilige klederen; daarom zal hij zijn lichaam met water baden, als hij ze zal aandoen.", "Ex 27:16": "In de poort van de voorhof nu zal een gordijn zijn van twintig el, hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, geborduurd werk; de pilaren vier, en hun voeten vier.", "Ex 28:15": "U zult ook een borstlap van het gericht maken, van het uiterst kunstige werk, gelijk het werk van de efod zult u hem maken; van goud, hemelsblauw, en purper, en scharlaken, en van fijn getweernd linnen zult u hem maken.", "Tit 3:10": "Verwerp iemand die een ketter is, na de eerste en tweede vermaning;", "Jes 65:4": "Zittend bij de graven, zo overnachten zij bij de bewaarde plaatsen, etend zwijnenvlees, en er is sap van gruwelijke dingen in hun vaten.", "Joh 9:34": "Zij antwoordden en zeiden tegen hem: U bent helemaal in zonden geboren, en u leert ons? En zij wierpen hem eruit.", "Deut 24:8": "Wacht u voor de plaag van de melaatsheid, dat u nauwkeurig in acht neemt en doet naar alles wat de Levitische priesters u zullen leren; zoals ik hun geboden heb, zult u erop letten het te doen.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Lev 15:20": "En alles waarop zij in haar afzondering zal hebben gelegen, zal onrein zijn; alsook alles waarop zij zal hebben gezeten, zal onrein zijn.", "Hebr 9:19": "Want toen alle geboden, naar de wet van Mozes, aan heel het volk uitgesproken waren, nam hij het bloed van kalveren en bokken, met water, en purperen wol, en hysop, en besprenkelde zowel het boek zelf, als heel het volk,", "Ezech 44:25": "Ook zal niemand van hen tot een dode mens naar binnen gaan, zodat hij onrein wordt; maar om een vader, of om een moeder, of om een zoon, of om een dochter, om een broer of om een zuster die geen man gehad heeft, mogen zij zich verontreinigen.", "Num 8:21": "En de Levieten ontzondigden zich, en wasten hun kleren, en Aäron bewoog hen als beweegoffer voor het aangezicht van de HEERE; en Aäron deed verzoening over hen, om hen te reinigen.", "Lev 16:24": "En hij zal zijn lichaam in de heilige plaats met water baden, en zijn klederen aandoen; dan zal hij naar buiten gaan, en zijn brandoffer, en het brandoffer van het volk bereiden, en voor zichzelf en voor het volk verzoening doen.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "1 Kor 5:11-13": "Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten. Want wat heb ik ermee te maken hen die buiten zijn te oordelen? Oordeelt u niet over hen die binnen zijn? Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Lev 10:8": "En de HEERE sprak tegen Aäron:", "Ex 28:33": "En aan de zomen daarvan zult u granaatappels maken van hemelsblauw, en van purper, en van scharlaken, aan zijn zomen rondom, en gouden schelletjes rondom daartussen.", "Lev 14:2": "Dit zal de wet zijn voor de melaatse, op de dag van zijn reiniging: dat hij naar de priester wordt gebracht.", "Neh 10:39": "Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "1 Kor 5:1": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft.", "1 Petr 2:22": "Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden;", "Ps 150:1": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte!", "Num 3:28": "In getal van al wat mannelijk was, van een maand oud en daarboven, waren achtduizend zeshonderd, die de wacht van het heiligdom waarnamen.", "Ex 26:1": "U moet de tabernakel maken van tien gordijnen, van fijn getweernd linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk moet u ze maken.", "Lev 5:7-10": "Maar als zijn hand niet zoveel bereiken kan als genoeg is voor een stuk kleinvee, dan zal hij als zijn offer voor de schuld die hij gezondigd heeft, aan de HEERE brengen twee tortelduiven of twee jonge duiven, een als zondoffer en een als brandoffer. En hij zal ze naar de priester brengen, die eerst degene zal offeren die voor het zondoffer is; en hij zal haar hoofd bij haar nek met zijn nagel splijten, maar niet afscheiden. En van het bloed van het zondoffer zal hij tegen de wand van het altaar sprenkelen; maar wat er van dat bloed overblijft, zal uitgeknepen worden tegen de bodem van het altaar; het is een zondoffer.", "Lev 7:17": "Wat nog van het vlees van het slachtoffer overgebleven is, zal op de derde dag met vuur verbrand worden;", "Lev 5:2": "Of wanneer een mens iets onreins zal hebben aangeraakt, hetzij het dode aas van een wild onrein dier, of het dode aas van onrein vee, of het dode aas van onrein kruipend gedierte; ook al is het voor hem verborgen geweest, toch is hij onrein en schuldig.", "Lev 11:39": "En wanneer van de dieren die u tot voedsel zijn iets zal gestorven zijn, wie het kadaver ervan aangeraakt zal hebben, zal onrein zijn tot de avond.", "Tit 2:15": "Spreek dit, en vermaan, en bestraf met alle ernst. Laat niemand u minachten.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Lev 15:9": "Evenzo zal elk zadel, waarop hij, die de vloed heeft, zal gereden hebben, onrein zijn.", "Ex 36:19": "Ook maakte hij voor de tent een dekkleed van roodgeverfde ramsvellen, en daarover een dekkleed van dassenvellen.", "Hebr 9:1": "Zo had dan het eerste verbond wel regels van de eredienst, en het aardse heiligdom.", "Lev 4:12": "En die hele var zal hij tot buiten het leger uitvoeren, naar een reine plaats, waar men de as uitstort, en zal hem met vuur op het hout verbranden; bij de uitgegoten as zal hij verbrand worden.", "Lev 15:1": "Verder sprak de HEERE tot Mozes en tot Aäron, en zei:", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Lev 14:49-52": "Daarna zal hij, om dat huis te ontzondigen, twee vogeltjes nemen, alsook cederhout, en scharlaken, en hysop. En hij zal de ene vogel slachten in een aarden vat, over levend water. Dan zal hij dat cederhout, en die hysop, en het scharlaken, en de levende vogel nemen, en zal die in het bloed van de geslachte vogel en in het levende water dopen; en hij zal dat huis zevenmaal besprengen.", "Lev 7:21": "En wanneer een ziel iets onreins aangeraakt zal hebben, zoals de onreinheid van een mens, of het onreine vee, of enig onrein verfoeisel, en zal van het vlees van het dankoffer, dat van de HEERE is, gegeten hebben, dan zal die ziel uit haar volk uitgeroeid worden.", "Ex 19:10": "Ook zei de HEERE tot Mozes: Ga tot het volk, en heilig hen heden en morgen, en laat hen hun kleren wassen,", "1 Kor 4:21": "Wat wilt u? Zal ik met de roede naar u toe komen, of in liefde en in de geest van zachtmoedigheid?", "2 Kor 2:10": "Wie u iets vergeeft, die vergeef ik ook; want als ik ook iets vergeven heb, heb ik dat, wie ik het ook vergaf, vergeven om u, voor het aangezicht van Christus,", "Deut 22:13-29": "Wanneer een man een vrouw genomen heeft, en tot haar ingegaan is, en haar dan haat, En haar oorzaak geeft tot naspraak, en een kwade naam over haar verspreidt, en zegt: Deze vrouw heb ik genomen, en toen ik tot haar naderde, heb ik haar maagdelijkheid niet gevonden; Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.", "Lev 16:27": "Maar de stier van het zondoffer, en de bok van het zondoffer, waarvan het bloed binnengebracht is om verzoening te doen in het heilige, zal men tot buiten het kamp brengen; en hun huiden, hun vlees en hun mest zullen zij met vuur verbranden.", "Lev 11:24-28": "En hierdoor zult u onrein worden: wie hun kadaver aangeraakt zal hebben, zal onrein zijn tot de avond. Wie van hun kadaver gedragen zal hebben, zal zijn kleren wassen, en onrein zijn tot de avond. Elk dier dat de klauw verdeelt, maar de klauwen niet in tweeën gespleten heeft, en niet herkauwt, zal voor u onrein zijn; wie het aangeraakt zal hebben, zal onrein zijn.", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Ex 40:32": "Als zij ingingen tot de tent der samenkomst, en als zij tot het altaar naderden, dan wasten zij zich, zoals de HEERE aan Mozes geboden had.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "Num 2:1": "En de HEERE sprak tot Mozes en tot Aäron:", "1 Tess 5:14": "En wij bidden u, broeders, vermaan de ongeregelde mensen, vertroost de kleinmoedigen, ondersteun de zwakken, wees geduldig tegenover allen.", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "1 Kron 28:10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "Ezech 44:26": "En na zijn reiniging zullen zij hem zeven dagen tellen.", "1 Kor 15:4": "en dat Hij is begraven, en dat Hij is opgewekt op de derde dag, naar de Schriften;", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Num 31:24": "U moet ook uw kleren op de zevende dag wassen, zodat u rein wordt; en daarna zult u in het leger komen.", "2 Tim 4:2": "Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs.", "Ex 36:8": "Zo maakte ieder wijze van hart, onder degenen die het werk maakten, de tabernakel van tien gordijnen, van getweernd fijn linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk maakte hij ze.", "Num 18:5": "U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "1 Kron 24:5": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "Lev 15:5": "Ieder ook, die zijn bed aanraakt, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond.", "Ef 5:25-27": "Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven, opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord, opdat Hij haar Zichzelf heerlijk zou voorstellen, een Gemeente die geen vlek of rimpel heeft, of iets dergelijks, maar die heilig en onberispelijk zou zijn.", "Rom 14:1": "Neem hem aan die zwak is in het geloof, maar niet tot twistige samensprekingen.", "Ex 26:36": "U moet ook voor de deur van de tent een deksel maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, geborduurd werk.", "Dan 9:17": "En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf.", "Ps 63:3": "Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;", "Lev 22:4-8": "Niemand van het nageslacht van Aäron die melaats is, of een vloed heeft, zal van die heilige dingen eten, totdat hij rein is; alsook wie iets aanraakt dat onrein is door een dood lichaam, of een man aan wie het zaad van de gemeenschap ontgaat. Of wie ook maar enig kruipend gedierte zal hebben aangeraakt waardoor hij onrein wordt, of een mens waardoor hij onrein wordt, naar al zijn onreinheid; De mens die dat zal hebben aangeraakt, zal onrein zijn tot aan de avond, en hij zal van die heilige dingen niet eten, maar zal zijn lichaam met water baden.", "Lev 22:4": "Niemand van het nageslacht van Aäron die melaats is, of een vloed heeft, zal van die heilige dingen eten, totdat hij rein is; alsook wie iets aanraakt dat onrein is door een dood lichaam, of een man aan wie het zaad van de gemeenschap ontgaat.", "2 Kor 6:14": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis?", "Lev 17:16": "Maar als hij die niet wast, en zijn vlees niet baadt, zo zal hij zijn ongerechtigheid dragen.", "Dan 11:31": "En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Hebr 9:10": "het bestond alleen in spijzen, en dranken, en verscheidene wassingen en instellingen voor het vlees, opgelegd tot de tijd van verbetering.", "Ex 12:5": "U moet een volkomen lam hebben, een mannetje, een jaar oud; van de schapen of van de geitenbokken moet u het nemen.", "Zach 13:1": "Op die dag zal er een bron geopend zijn voor het huis van David en voor de inwoners van Jeruzalem, tegen de zonde en tegen de onreinheid.", "Ex 26:14": "U moet ook voor de tent een dekkleed maken van roodgeverfde ramsvellen, en daarover een dekkleed van dassenvellen.", "Num 6:12": "Daarna zal hij de dagen van zijn Nazireeërschap voor de HEERE afzonderen, en een eenjarig lam brengen als schuldoffer; en de vorige dagen zullen vervallen, omdat zijn Nazireeërschap verontreinigd was.", "Ex 12:1": "De HEERE nu had tot Mozes en tot Aäron in Egypteland gesproken en gezegd:", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "Deut 21:22": "Verder, wanneer iemand een zonde heeft begaan die de doodstraf verdient, zodat hij gedood wordt, en u hem aan het hout hebt opgehangen;", "Hebr 7:26": "Want zo'n Hogepriester paste bij ons: heilig, onschuldig, onbesmet, afgescheiden van de zondaars, en hoger geworden dan de hemelen;", "Num 19:2-6": "Dit is de inzetting van de wet, die de HEERE geboden heeft: Spreek tot de kinderen van Israël, dat zij u een rode volkomen vaars brengen, waarin geen gebrek is, en waarop geen juk gekomen is. En u zult haar geven aan Eleazar, de priester; en hij zal haar naar buiten, buiten het leger, brengen, en men zal haar voor zijn aangezicht slachten. En Eleazar, de priester, zal van haar bloed met zijn vinger nemen, en hij zal van haar bloed zeven keer sprenkelen, recht tegenover de tent van de samenkomst.", "1 Petr 1:19": "maar met het kostbare bloed van Christus, als van een smetteloos en onbevlekt Lam;", "Num 9:10": "Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "Num 15:24": "Dan zal het gebeuren, indien iets bij dwaling gedaan is, en voor de ogen van de vergadering verborgen is, dat de hele vergadering een var, een jong rund, zal bereiden tot brandoffer, tot een liefelijke reuk voor de HEERE, met zijn spijsoffer en zijn drankoffer, naar de gebruikelijke wijze; en een geitenbok tot zondoffer.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "1 Sam 6:7": "Neem dan nu en maak een nieuwe wagen, en twee zogende koeien waarop geen juk gekomen is; span de koeien voor de wagen, en breng hun kalveren van achter hen terug naar huis.", "1 Tim 5:2": "De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid.", "Lev 13:45": "Verder zullen de kleren van de melaatse, in wie die plaag is, gescheurd zijn, en zijn hoofd zal onbedekt zijn, en hij zal zijn bovenlip bedekken; daarbij zal hij roepen: Onrein, onrein!", "Ex 40:31": "En Mozes en Aäron en zijn zonen wasten daaruit hun handen en hun voeten.", "Hebr 9:13": "Want als het bloed van stieren en bokken, en de as van de jonge koe, besprenkeld over de onreinen, hen heiligt tot de reinheid van het vlees,", "Lev 15:2-13": "Spreek tot de kinderen van Israël, en zeg tegen hen: Iedere man, als hij een vloed heeft uit zijn vlees, zal om zijn vloed onrein zijn. Dit nu zal zijn onreinheid zijn om zijn vloed: of zijn vlees zijn vloed laat druppelen, of zijn vlees van zijn vloed zich verstopt, dat is zijn onreinheid. Elk bed waarop hij, die de vloed heeft, zal liggen, zal onrein zijn, en al het voorwerp waarop hij zal zitten, zal onrein zijn.", "Num 5:2-4": "Gebied de kinderen van Israël dat zij uit het leger wegzenden alle melaatsen, en alle vloeiende, en allen die onrein zijn van een dode. Van de man tot de vrouw toe zult u hen wegzenden; tot buiten het leger zult u hen wegzenden; zodat zij hun legers niet verontreinigen, in welker midden Ik woon. En de kinderen van Israël deden zo, en zonden hen tot buiten het leger; zoals de HEERE tot Mozes gesproken had, zo deden de kinderen van Israël.", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "Ex 19:15": "En hij zei tot het volk: Weest gereed tegen de derde dag, en nadert niet tot de vrouw.", "Deut 17:2-13": "Wanneer in uw midden, in een van uw poorten die de HEERE, uw God, u geeft, een man of vrouw gevonden wordt die doet wat kwaad is in de ogen van de HEERE, uw God, door Zijn verbond te overtreden, Doordat hij heengaat en andere goden dient, en zich voor die buigt, of voor de zon, of voor de maan, of voor het hele leger van de hemel, wat ik niet geboden heb; En het wordt u aangezegd, en u hoort het; dan moet u het goed onderzoeken; en zie, het is de waarheid, de zaak staat vast, zo'n gruwel is in Israël gedaan;", "Ex 39:5": "En de kunstige riem van de efod, die daarop was, was gelijk zijn werk, van hetzelfde, van goud, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, zoals de HEERE aan Mozes bevolen had.", "Lev 15:16-28": "Verder, een man bij wie het zaad van het bijliggen zal zijn uitgegaan, die zal zijn hele vlees met water baden, en onrein zijn tot aan de avond. Ook elk kledingstuk, en elk vel, waaraan het zaad van het bijliggen zal zijn, dat zal met water gewassen worden, en onrein zijn tot aan de avond. Alsook de vrouw, als een man met het zaad van het bijliggen bij haar gelegen zal hebben; daarom zullen zij zich beiden met water baden, en onrein zijn tot aan de avond.", "Lev 4:21": "Daarna zal hij die var tot buiten het leger uitvoeren, en hem verbranden, zoals hij de eerste var verbrand heeft; het is een zondoffer van de gemeente.", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Hoogl 4:15": "O fontein van de hoven, put van levend water, dat uit de Libanon vloeit!", "Num 15:30": "Maar de ziel die iets doet met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt de HEERE; en die ziel zal uitgeroeid worden uit het midden van haar volk;", "Num 19:2-22": "Dit is de inzetting van de wet, die de HEERE geboden heeft: Spreek tot de kinderen van Israël, dat zij u een rode volkomen vaars brengen, waarin geen gebrek is, en waarop geen juk gekomen is. En u zult haar geven aan Eleazar, de priester; en hij zal haar naar buiten, buiten het leger, brengen, en men zal haar voor zijn aangezicht slachten. En Eleazar, de priester, zal van haar bloed met zijn vinger nemen, en hij zal van haar bloed zeven keer sprenkelen, recht tegenover de tent van de samenkomst.", "Fil 2:6-8": "Die, terwijl Hij in de gestalte van God was, het geen roof geacht heeft God even gelijk te zijn; Maar heeft Zichzelf ontledigd door de gestalte van een dienstknecht aan te nemen, en is de mensen gelijk geworden; En in gedaante gevonden als een mens, heeft Hij Zichzelf vernederd, gehoorzaam geworden tot de dood, ja, de dood van het kruis.", "Ex 35:23": "En ieder man bij wie hemelsblauw gevonden werd, en purper, en scharlaken, en fijn linnen, en geitenhaar, en roodgeverfde ramsvellen, en dassenvellen, die brachten ze.", "Joh 4:10": "Jezus antwoordde en zei tegen haar: Als u de gave van God kende, en Wie Hij is, Die tegen u zegt: Geef Mij te drinken, dan zou u van Hem hebben gevraagd, en Hij zou u levend water gegeven hebben.", "Dan 8:13": "Daarna hoorde ik een heilige spreken; en de heilige zei tegen de onbenoemde die daar sprak: Tot hoelang zal dat gezicht van het voortdurende offer en de verwoestende afval duren, dat zowel het heiligdom als het leger vertrapt zal worden?", "Ex 12:49": "Eén wet zal er zijn voor de ingeborene, en voor de vreemdeling die als vreemdeling in uw midden verblijft.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Joh 20:23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "Luk 11:44": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u bent als de graven die niet zichtbaar zijn, en de mensen die daaroverheen lopen, weten het niet.", "Ps 51:9": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.", "Lev 22:2": "Spreek tot Aäron en tot zijn zonen, dat zij zich afzonderen van de heilige dingen van de kinderen van Israël, die zij Mij heiligen, opdat zij de Naam van Mijn heiligheid niet ontheiligen; Ik ben de HEERE!", "Matt 15:19": "Want uit het hart komen voort boze overwegingen, doodslagen, overspelen, hoererijen, dieverijen, valse getuigenissen, lasteringen.", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Hand 15:9": "en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "Hos 6:2": "Hij zal ons na twee dagen levend maken; op de derde dag zal Hij ons doen opstaan, en wij zullen voor Zijn aangezicht leven.", "Jes 63:1-3": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen. Waarom bent U rood aan Uw gewaad, en Uw kleren als van iemand die in de wijnpers treedt? Ik heb de pers alleen getreden, en er was niemand van de volken met Mij; en Ik heb hen getreden in Mijn toorn, en heb hen vertrapt in Mijn grimmigheid; en hun bloed is gesprenkeld op Mijn kleren, en heel Mijn gewaad heb Ik bezoedeld.", "Lev 23:26-37": "Verder sprak de HEERE tot Mozes en zei: Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren. En op diezelfde dag zult u geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht van de HEERE, uw God.", "2 Kor 13:1": "Dit is de derde keer dat ik naar u toe kom; op grond van de verklaring van twee of drie getuigen zal elk woord vaststaan.", "Num 31:20": "Ook moet u alle kleding, en alle voorwerpen van vellen, en alle werk van geitenhaar, en voorwerpen van hout, ontzondigen.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Lev 16:19": "En hij zal daarop van dat bloed met zijn vinger zevenmaal sprenkelen, en hij zal het reinigen en heiligen van de onreinheden van de kinderen van Israël.", "2 Tess 3:14": "Maar als iemand ons woord, geschreven door deze brief, niet gehoorzaam is, tekent hem aan; en ga niet met hem om, opdat hij beschaamd wordt;", "2 Kron 4:6": "En hij maakte tien wasvaten, en zette vijf aan de rechterhand en vijf aan de linkerhand, om daarin te wassen; wat bij het brandoffer hoorde, staken zij daarin; maar de zee was ervoor dat de priesters zich daarin zouden wassen.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "2 Kor 7:8": "Want hoewel ik u in de brief bedroefd heb, heb ik daar geen berouw over, hoewel ik er wel berouw over heb gehad; want ik zie dat die brief, al was het maar voor een korte tijd, u bedroefd heeft.", "Num 28:26-31": "Ook op de dag van de eerstelingen, als u een nieuw spijsoffer de HEERE zult offeren naar uw weken, zult u een heilige samenkomst hebben; geen dienstwerk zult u doen. Dan zult u de HEERE een brandoffer tot liefelijke reuk offeren: twee jonge stieren, een ram, zeven eenjarige lammeren; En hun spijsoffer van meelbloem, met olie gemengd: drie tienden bij een stier, twee tienden bij een ram;", "Deut 21:1-9": "Wanneer in het land, dat de HEERE, uw God, u geven zal om dat te erven, iemand gevonden wordt die gedood is, liggend in het veld, zonder dat bekend is wie hem gedood heeft; Dan zullen uw oudsten en uw rechters uitgaan, en zij zullen meten naar de steden die rondom de gedode liggen. De stad nu die het dichtst bij de gedode ligt, daar zullen de oudsten van die stad een jonge koe nemen waarmee niet gewerkt is, die aan het juk niet getrokken heeft.", "Lev 22:20-25": "U zult niets offeren waarin een gebrek is; want het zou niet aangenaam zijn voor u. En als iemand een dankoffer aan de HEERE zal offeren, om een gelofte van de runderen of van de schapen na te komen, of een vrijwillig offer, dan zal het volkomen zijn, opdat het aangenaam is; geen gebrek zal daarin zijn. Het blinde, of gebrokene, of verlamde, of dat een wrat heeft, of droge schurftheid, of etterige schurftheid, deze zult u de HEERE niet offeren, en daarvan zult u de HEERE geen vuuroffer op het altaar geven.", "2 Petr 3:14": "Daarom, geliefden, terwijl u deze dingen verwacht, doe uw best om onbevlekt en onberispelijk door Hem bevonden te worden, in vrede;", "Gen 26:19": "De knechten van Izak dan groeven in dat dal, en zij vonden daar een put met levend water.", "2 Kor 10:1-11": "Verder, ik Paulus zelf bid u, door de zachtmoedigheid en goedertierenheid van Christus, die – tegenwoordig zijnde – wel gering ben onder u, maar afwezig stout ben tegen u; Ik bid dan, dat ik, tegenwoordig zijnde, niet stout hoef te zijn met die vrijmoedigheid, waarmee ik denk stout te moeten optreden tegen sommigen, die ons zo beoordelen alsof wij naar het vlees wandelden. Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Num 19:11-16": "Wie een dode aanraakt, welk dood lichaam van een mens dan ook, die zal zeven dagen onrein zijn. Op de derde dag zal hij zich daarmee ontzondigen, dan zal hij op de zevende dag rein zijn; maar als hij zich op de derde dag niet ontzondigt, dan zal hij op de zevende dag niet rein zijn. Ieder die een dode, het dode lichaam van een mens die gestorven is, aanraakt, en zich niet ontzondigd zal hebben, die verontreinigt de tabernakel van de HEERE; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water van de afzondering niet op hem gesprenkeld is, zal hij onrein zijn; zijn onreinheid is nog in hem.", "Num 9:13": "Als een man, die rein is, en niet op reis is, en nalaat het pascha te houden, dan zal die ziel uit haar volk uitgeroeid worden; want hij heeft de offerande van de HEERE op zijn vastgestelde tijd niet geofferd, die man zal zijn zonde dragen.", "Ex 36:37": "Hij maakte ook voor de ingang van de tent een dekkleed van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, geborduurd werk;", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "Hand 13:39-41": "En dat ieder die gelooft, door Hem gerechtvaardigd wordt van alles waarvan u niet gerechtvaardigd kon worden door de wet van Mozes. Kijk dan uit, dat over u niet komt wat gezegd is in de profeten: Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.", "1 Kor 5:4-7": "In de Naam van onze Heere Jezus Christus, wanneer u en mijn geest samen vergaderd zijn, met de kracht van onze Heere Jezus Christus, Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus. Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Lev 13:2-59": "Een mens, als er in het vel van zijn vlees een gezwel, of gezweer, of witte blaar zal zijn, welke in het vel van zijn vlees tot een plaag van de melaatsheid zou worden, hij zal dan naar de priester Aäron, of naar een van zijn zonen, de priesters, gebracht worden. En de priester zal de plaag in het vel van het vlees bekijken; als het haar in die plaag in wit veranderd is, en het aanzien van de plaag dieper is dan het vel van zijn vlees, is het de plaag van de melaatsheid; als de priester hem bekeken zal hebben, zal hij hem onrein verklaren. Maar als de blaar in het vel van zijn vlees wit is, en haar aanzien niet dieper is dan het vel, en het haar niet in wit veranderd is, zal de priester hem, die de plaag heeft, zeven dagen opsluiten.", "Num 8:7": "En zo zult u hun doen, om hen te reinigen: sprenkel op hen water van de ontzondiging; en zij zullen het scheermes over hun hele lichaam laten gaan, en zij zullen hun kleren wassen, en zich reinigen.", "2 Tess 3:15": "En houd hem niet als een vijand, maar vermaan hem als een broeder.", "Ezech 42:20": "Hij mat het aan de vier zijden; het had een muur rondom, de lengte was vijfhonderd rieten, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en het onheilige.", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "Lev 14:34-48": "Als u gekomen zult zijn in het land Kanaän, dat Ik u tot bezitting geven zal, en Ik de plaag van de melaatsheid aan een huis van dat land van uw bezitting gegeven zal hebben, zal hij, van wie dat huis is, komen, en het de priester te kennen geven en zeggen: Het schijnt mij, alsof er een plaag in het huis is. En de priester zal gebieden dat zij dat huis ruimen, voordat de priester komt om die plaag te bezien, zodat niet alles wat in dat huis is onrein wordt; en daarna zal de priester komen om dat huis te bezien.", "Num 19:17-21": "Voor een onreine nu zal men nemen van het stof van het vuur van de ontzondiging, en daarop levend water doen in een vat. En een rein man zal hysop nemen, en die dopen in dat water, en het sprenkelen op die tent, en op alle voorwerpen, en op de personen die daar geweest zijn; evenzo op hem die een gebeente, of een gedode, of een dode, of een graf aangeraakt heeft. En de reine zal de onreine op de derde dag, en op de zevende dag besprenkelen; en op de zevende dag zal hij hem ontzondigen; en hij zal zijn kleren wassen, en zichzelf met water baden, en op de avond rein zijn.", "Num 9:6": "Toen waren er mannen geweest, die over het dode lichaam van een mens onrein waren, en op diezelfde dag het pascha niet hadden kunnen houden; daarom naderden zij voor het aangezicht van Mozes, en voor het aangezicht van Aäron op diezelfde dag.", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "Lev 6:9-13": "Gebied Aäron en zijn zonen en zeg: Dit is de wet van het brandoffer: het is het brandoffer dat door de branding op het altaar de hele nacht tot aan de morgen opgaat; en het vuur van het altaar zal daarbij brandend gehouden worden. En de priester zal zijn linnen kleed aantrekken, en de linnen onderbroek over zijn vlees aantrekken, en zal de as opnemen als het vuur het brandoffer op het altaar verteerd zal hebben, en zal die bij het altaar leggen. Daarna zal hij zijn kleren uittrekken, en andere kleren aandoen, en zal de as tot buiten het leger naar een reine plaats brengen.", "Ex 12:15": "Zeven dagen moet u ongezuurde broden eten; maar op de eerste dag moet u het zuurdeeg wegdoen uit uw huizen; want wie het gedesemde eet, van de eerste dag af tot de zevende dag, die ziel zal uitgeroeid worden uit Israël.", "Dan 8:11": "Ja
