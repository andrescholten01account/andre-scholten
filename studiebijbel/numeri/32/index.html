 Eleale, en Schebam, en Nebo, en Behon;","4":"Dit land, dat de HEERE voor de ogen van de vergadering van Israël verslagen heeft, is een land geschikt voor vee; en uw knechten hebben vee.","5":"Verder zeiden zij: Als wij genade gevonden hebben in uw ogen, laat dan dit land aan uw knechten gegeven worden tot een bezitting; en laat ons niet over de Jordaan trekken.","6":"Maar Mozes zei tegen de kinderen van Gad en tegen de kinderen van Ruben: Zullen uw broeders ten strijde gaan, en zullen u hier blijven?","7":"Waarom toch zult u het hart van de kinderen van Israël ontmoedigen, zodat zij niet oversteken naar het land dat de HEERE hun gegeven heeft?","8":"Zo deden uw vaders, toen ik hen van Kades-Barnea zond om dit land te bezien.","9":"Toen zij opgekomen waren tot aan het dal Eskol, en dit land bezagen, ontmoedigden zij het hart van de kinderen van Israël, zodat zij niet gingen naar het land dat de HEERE hun gegeven had.","10":"Toen ontstak de toorn van de HEERE op die dag, en Hij zwoer en zei:","11":"Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;","12":"Behalve Kaleb, de zoon van Jefunne, de Keniziet, en Jozua, de zoon van Nun; want zij hebben de HEERE volledig gevolgd.","13":"Zo ontstak de toorn van de HEERE tegen Israël, en Hij liet hen ronddwalen in de woestijn, veertig jaar lang, totdat heel het geslacht verteerd was dat gedaan had wat kwaad was in de ogen van de HEERE.","14":"En zie, u bent opgestaan in de plaats van uw vaders, een menigte van zondige mensen, om de gloed van de toorn van de HEERE tegen Israël nog te vermeerderen.","15":"Wanneer u zich van achter Hem afkeert, zal Hij verder doorgaan hen te laten in de woestijn; en u zult dit hele volk te gronde richten.","16":"Toen traden zij naar hem toe en zeiden: Wij zullen hier schaapskooien bouwen voor ons vee, en steden voor onze kinderen.","17":"Maar wij zelf zullen ons toerusten en vooroplopen voor de kinderen van Israël, totdat wij hen naar hun plaats gebracht zullen hebben; en onze kinderen zullen blijven in de versterkte steden, vanwege de inwoners van het land.","18":"Wij zullen niet terugkeren naar onze huizen, totdat de kinderen van Israël elk hun erfdeel in bezit genomen hebben.","19":"Want wij zullen met hen niet erven aan de andere zijde van de Jordaan en verder weg, omdat onze erfenis ons toegekomen is aan deze zijde van de Jordaan, naar het oosten.","20":"Toen zei Mozes tegen hen: Als u deze zaak doen zult, als u zich voor het aangezicht van de HEERE toerust ten strijde,","21":"en ieder van u die toegerust is, over de Jordaan trekt voor het aangezicht van de HEERE, totdat Hij Zijn vijanden voor Zijn aangezicht uit de bezitting verdreven heeft,","22":"en het land voor het aangezicht van de HEERE onderworpen is, dan zult u daarna terugkeren en onschuldig zijn voor de HEERE en voor Israël, en dit land zal u ter bezitting zijn voor het aangezicht van de HEERE.","23":"Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!","24":"Bouw u steden voor uw kinderen, en kooien voor uw schapen; en doe wat uit uw mond gekomen is.","25":"Toen spraken de kinderen van Gad en de kinderen van Ruben tot Mozes en zeiden: Uw knechten zullen doen zoals mijn heer gebiedt.","26":"Onze kinderen, onze vrouwen, ons vee en al onze beesten zullen daar zijn in de steden van Gilead;","27":"maar uw knechten zullen oversteken, ieder die toegerust is voor het leger, voor het aangezicht van de HEERE ten strijde, zoals mijn heer gesproken heeft.","28":"Toen gebood Mozes vanwege hen, de priester Eleazar, en Jozua, de zoon van Nun, en de hoofden van de vaderlijke huizen van de stammen van de kinderen van Israël;","29":"en Mozes zei tegen hen: Als de kinderen van Gad en de kinderen van Ruben, met u over de Jordaan trekken, ieder die toegerust is ten oorlog, voor het aangezicht van de HEERE, en het land voor uw aangezicht onderworpen zal zijn, dan zult u hun het land Gilead ter bezitting geven.","30":"Maar als zij niet toegerust met u oversteken, dan zullen zij tot bezitters gesteld worden te midden van u in het land Kanaän.","31":"En de kinderen van Gad en de kinderen van Ruben antwoordden en zeiden: Wat de HEERE tot uw knechten gesproken heeft, zullen wij zo doen.","32":"Wij zullen toegerust oversteken voor het aangezicht van de HEERE naar het land Kanaän; en de bezitting van onze erfenis zullen wij hebben aan deze zijde van de Jordaan.","33":"Zo gaf Mozes hun, de kinderen van Gad, en de kinderen van Ruben, en de halve stam van Manasse, de zoon van Jozef, het koninkrijk van Sihon, koning van de Amorieten, en het koninkrijk van Og, koning van Bazan; het land met de steden ervan, binnen de grenzen, de steden van het land rondom.","34":"En de kinderen van Gad bouwden Dibon, en Ataroth, en Aroer,","35":"en Atroth-Sofan, en Jaezer, en Jogbeha,","36":"en Beth-Nimra, en Beth-Haran, versterkte steden en schaapskooien.","37":"En de kinderen van Ruben bouwden Hezbon, en Eleale, en Kirjathaïm,","38":"en Nebo, en Baäl-Meon, waarvan de naam veranderd was, en Sibma; en zij noemden de steden die zij bouwden met *andere* namen.","39":"En de kinderen van Machir, de zoon van Manasse, gingen naar Gilead, en namen het in, en zij verdreven de Amorieten die daarin waren, uit hun bezit.","40":"Zo gaf Mozes Gilead aan Machir, de zoon van Manasse; en hij woonde daarin.","41":"Jaïr nu, de zoon van Manasse, ging op weg en nam hun dorpen in, en hij noemde die Havvoth-Jaïr.","42":"En Nobah ging op weg en nam Kenath in, met de bijbehorende plaatsen, en noemde het Nobah naar zijn eigen naam."},"SV":{"1":"De kinderen van Ruben nu hadden veel vee, en de kinderen van Gad hadden machtig veel; en zij bezagen het land Jaezer, en het land van Gilead, en ziet, deze plaats was een plaats voor vee.","2":"Zo kwamen de kinderen van Gad en de kinderen van Ruben, en spraken tot Mozes, en tot Eleazar, den priester, en tot de oversten der vergadering, zeggende:","3":"Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon, en Eleale, en Schebam, en Nebo, en Behon;","4":"Dit land, hetwelk de HEERE voor het aangezicht der vergadering van Israël geslagen heeft, is een land voor vee; en uw knechten hebben vee.","5":"Voorts zeiden zij: Indien wij genade in uw ogen gevonden hebben, dat ditzelve land aan uw knechten gegeven worde tot een bezitting; *en* doe ons niet trekken over de Jordaan.","6":"Maar Mozes zeide tot de kinderen van Gad en tot de kinderen van Ruben: Zullen uw broeders ten strijde gaan, en zult gijlieden hier blijven?","7":"Waarom toch zult gij het hart der kinderen Israëls breken , dat zij niet overtrekken naar het land, dat de HEERE hun gegeven heeft?","8":"Zo deden uw vaders, als ik hen van Kades-barnea zond, om dit land te bezien.","9":"Als zij opgekomen waren tot aan het dal Eskol, en dit land bezagen, zo braken zij het hart der kinderen Israëls, dat zij niet gingen naar het land, dat de HEERE hun gegeven had.","10":"Toen ontstak de toorn des HEEREN te dien dage, en Hij zwoer, zeggende:","11":"Indien deze mannen, die uit Egypte opgetogen zijn, van twintig jaren oud en daarboven, het land zullen zien, dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben niet volhard Mij na te volgen;","12":"Behalve Kaleb, de zoon van Jefunne, den Keniziet, en Jozua, de zoon van Nun; want zij hebben volhard den HEERE na te volgen.","13":"Alzo ontstak des HEEREN toorn tegen Israël, en Hij deed hen omzwerven in de woestijn, veertig jaren, totdat verteerd was het ganse geslacht, hetwelk gedaan had, wat kwaad was in de ogen des HEEREN.","14":"En ziet, gijlieden zijt opgestaan in stede van uw vaderen, een menigte van zondige mensen, om de hittigheid van des HEEREN toorn tegen Israël te vermeerderen.","15":"Wanneer gij van achter Hem u zult afkeren, zo zal Hij wijders voortvaren het te laten in de woestijn; en gij zult al dit volk verderven.","16":"Toen traden zij toe tot hem, en zeiden: Wij zullen hier schaapskooien bouwen voor ons vee, en steden voor onze kinderen.","17":"Maar wij zelven zullen ons toerusten, haastende voor het aangezicht der kinderen Israëls, totdat wij hen aan hun plaats zullen gebracht hebben; en onze kinderen zullen blijven in de vaste steden, vanwege de inwoners des lands.","18":"Wij zullen niet wederkeren tot onze huizen, totdat zich de kinderen Israëls tot erfelijke bezitters zullen gesteld hebben, een ieder van zijn erfenis.","19":"Want wij zullen met hen niet erven aan gene zijde van de Jordaan, en verder heen, als onze erfenis ons toegekomen zal zijn aan deze zijde van de Jordaan, tegen den opgang.","20":"Toen zeide Mozes tot hen: Indien gij deze zaak doen zult, indien gij u voor het aangezicht des HEEREN zult toerusten ten strijde.","21":"En een ieder van u, die toegerust is, over de Jordaan zal trekken voor het aangezicht des HEEREN, totdat Hij Zijn vijanden voor Zijn aangezicht uit de bezitting zal verdreven hebben.","22":"En het land voor het aangezicht des HEEREN ten ondergebracht zij; zo zult gij daarna wederkeren, en onschuldig zijn voor den HEERE en voor Israël, en dit land zal u ter bezitting zijn voor het aangezicht des HEEREN.","23":"Indien gij daarentegen alzo niet zult doen, ziet, zo hebt gij tegen den HEERE gezondigd; doch gij zult uw zonde gewaar worden, als zij u vinden zal!","24":"Bouwt u steden voor uw kinderen, en kooien voor uw schapen; en doet, wat uit uw mond uitgegaan is.","25":"Toen spraken de kinderen van Gad en de kinderen van Ruben tot Mozes, zeggende: Uw knechten zullen doen, gelijk als mijn heer gebiedt.","26":"Onze kinderen, onze vrouwen, onze have en al onze beesten zullen aldaar zijn in de steden van Gilead;","27":"Maar uw knechten zullen overtrekken, al wie ten heire toegerust is, voor het aangezicht des HEEREN tot den strijd, gelijk als mijn heer gesproken heeft.","28":"Toen gebood Mozes, hunnenthalve, den priester Eleazar, en Jozua, den zoon van Nun, en den hoofden der vaderen van de stammen der kinderen Israëls;","29":"En Mozes zeide tot hen: Indien de kinderen van Gad, en de kinderen van Ruben, met ulieden over de Jordaan zullen trekken, een ieder, die toegerust is ten oorlog, voor het aangezicht des HEEREN, als het land voor uw aangezicht zal ten ondergebracht zijn; zo zult gij hun het land Gilead ter bezitting geven.","30":"Maar indien zij niet toegerust met u zullen overtrekken, zo zullen zij tot bezitters gesteld worden in het midden van ulieden in het land Kanaän.","31":"En de kinderen van Gad en de kinderen van Ruben antwoordden, zeggende: Wat de HEERE tot uw knechten gesproken heeft, zullen wij alzo doen.","32":"Wij zullen toegerust overtrekken voor het aangezicht des HEEREN naar het land Kanaän; en de bezitting onzer erfenis zullen wij hebben aan deze zijde van de Jordaan.","33":"Alzo gaf Mozes hunlieden, den kinderen van Gad, en de kinderen van Ruben, en den halven stam van Manasse, den zoon van Jozef, het koninkrijk van Sihon, koning der Amorieten, en het koninkrijk van Og, koning van Bazan; het land met de steden van hetzelve in de landpalen, de steden des lands rondom.","34":"En de kinderen van Gad bouwden Dibon, en Ataroth, en Aroer,","35":"En Atroth-sofan, en Jaezer, en Jogbeha,","36":"En Beth-nimra, en Beth-haran, vaste steden en schaapskooien.","37":"En de kinderen van Ruben bouwden Hezbon, en Eleale, en Kirjathaim,","38":"En Nebo, en Baäl-meon, veranderd zijnde van naam, en Sibma; en zij noemden de namen der steden, die zij bouwden, met *andere* namen.","39":"En de kinderen van Machir, den zoon van Manasse, gingen naar Gilead, en namen dat in, en zij verdreven de Amorieten, die daarin waren, uit de bezitting.","40":"Zo gaf Mozes Gilead aan Machir, den zoon van Manasse; en hij woonde daarin.","41":"Jaïr nu, de zoon van Manasse, ging heen en nam hunlieder dorpen in, en hij noemde die Havvoth-jair.","42":"En Nobah ging heen, en nam Kenath in, met haar onderhorige plaatsen, en noemde ze Nobah naar zijn naam."},"KJV":{"1":"Now the children of Reuben and the children of Gad had a very great multitude of cattle: and when they saw the land of Jazer, and the land of Gilead, that, behold, the place *was* a place for cattle;","2":"The children of Gad and the children of Reuben came and spake unto Moses, and to Eleazar the priest, and unto the princes of the congregation, saying,","3":"Ataroth, and Dibon, and Jazer, and Nimrah, and Heshbon, and Elealeh, and Shebam, and Nebo, and Beon,","4":"*Even* the country which the LORD smote before the congregation of Israel, *is* a land for cattle, and thy servants have cattle:","5":"Wherefore, said they, if we have found grace in thy sight, let this land be given unto thy servants for a possession, *and* bring us not over Jordan.","6":"And Moses said unto the children of Gad and to the children of Reuben, Shall your brethren go to war, and shall ye sit","7":"And wherefore discourage ye the heart of the children of Israel from going over into the land which the LORD hath given","8":"Thus did your fathers, when I sent them from Kadeshbarnea to see the land.","9":"For when they went up unto the valley of Eshcol, and saw the land, they discouraged the heart of the children of Israel, that they should not go into the land which the LORD had given","10":"And the LORD'S anger was kindled the same time, and he sware, saying,","11":"Surely none of the men that came up out of Egypt, from twenty years old and upward, shall see the land which I sware unto Abraham, unto Isaac, and unto Jacob; because they have not wholly followed","12":"Save Caleb the son of Jephunneh the Kenezite, and Joshua the son of Nun: for they have wholly followed the LORD.","13":"And the LORD'S anger was kindled against Israel, and he made them wander in the wilderness forty years, until all the generation, that had done evil in the sight of the LORD, was consumed.","14":"And, behold, ye are risen up in your fathers' stead, an increase of sinful men, to augment yet the fierce anger of the LORD toward Israel.","15":"For if ye turn away from after him, he will yet again leave them in the wilderness; and ye shall destroy all this people.","16":"And they came near unto him, and said, We will build sheepfolds here for our cattle, and cities for our little ones:","17":"But we ourselves will go ready armed before the children of Israel, until we have brought them unto their place: and our little ones shall dwell in the fenced cities because of the inhabitants of the land.","18":"We will not return unto our houses, until the children of Israel have inherited every man his inheritance.","19":"For we will not inherit with them on yonder side Jordan, or forward; because our inheritance is fallen to us on this side Jordan eastward.","20":"And Moses said unto them, If ye will do this thing, if ye will go armed before the LORD to war,","21":"And will go all of you armed over Jordan before the LORD, until he hath driven out his enemies from before","22":"And the land be subdued before the LORD: then afterward ye shall return, and be guiltless before the LORD, and before Israel; and this land shall be your possession before the LORD.","23":"But if ye will not do so, behold, ye have sinned against the LORD: and be sure your sin will find you out.","24":"Build you cities for your little ones, and folds for your sheep; and do that which hath proceeded out of your mouth.","25":"And the children of Gad and the children of Reuben spake unto Moses, saying, Thy servants will do as my lord commandeth.","26":"Our little ones, our wives, our flocks, and all our cattle, shall be there in the cities of Gilead:","27":"But thy servants will pass over, every man armed for war, before the LORD to battle, as my lord saith.","28":"So concerning them Moses commanded Eleazar the priest, and Joshua the son of Nun, and the chief fathers of the tribes of the children of Israel:","29":"And Moses said unto them, If the children of Gad and the children of Reuben will pass with you over Jordan, every man armed to battle, before the LORD, and the land shall be subdued before you; then ye shall give them the land of Gilead for a possession:","30":"But if they will not pass over with you armed, they shall have possessions among you in the land of Canaan.","31":"And the children of Gad and the children of Reuben answered, saying, As the LORD hath said unto thy servants, so will we do.","32":"We will pass over armed before the LORD into the land of Canaan, that the possession of our inheritance on this side Jordan","33":"And Moses gave unto them, *even* to the children of Gad, and to the children of Reuben, and unto half the tribe of Manasseh the son of Joseph, the kingdom of Sihon king of the Amorites, and the kingdom of Og king of Bashan, the land, with the cities thereof in the coasts, *even* the cities of the country round about.","34":"And the children of Gad built Dibon, and Ataroth, and Aroer,","35":"And Atroth, Shophan, and Jaazer, and Jogbehah,","36":"And Bethnimrah, and Bethharan, fenced cities: and folds for sheep.","37":"And the children of Reuben built Heshbon, and Elealeh, and Kirjathaim,","38":"And Nebo, and Baalmeon, (their names being changed,) and Shibmah: and gave other names unto the cities which they builded.","39":"And the children of Machir the son of Manasseh went to Gilead, and took it, and dispossessed the Amorite","40":"And Moses gave Gilead unto Machir the son of Manasseh; and he dwelt","41":"And Jair the son of Manasseh went and took the small towns thereof, and called them Havothjair.","42":"And Nobah went and took Kenath, and the villages thereof, and called it Nobah, after his own name."}},"tsk":{"1":[{"kopje":"de nakomelingen","refs":["Num 2:10-15","Num 26:5-7","Num 26:15-18","Gen 29:32","Gen 30:10","Gen 30:11"]},{"kopje":"Jaezer","refs":["Num 32:3","Num 32:35","Num 21:32","Joz 13:25","2 Sam 24:5","Jes 16:8","Jes 16:9"]},{"kopje":"deze plaats","refs":["Num 32:26","Gen 13:2","Gen 13:5","Gen 13:10","Gen 13:11"," /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
