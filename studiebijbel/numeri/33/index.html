ren van Israël uit door een hoge hand, voor de ogen van alle Egyptenaren;","4":"Terwijl de Egyptenaren begroeven wie de HEERE onder hen geslagen had, alle eerstgeborenen; ook had de HEERE gerichten voltrokken aan hun goden.","5":"Toen de kinderen van Israël van Rameses vertrokken waren, legerden zij zich te Sukkoth.","6":"En zij vertrokken van Sukkoth, en legerden zich in Etham, dat aan het einde van de woestijn is.","7":"En zij vertrokken van Etham, en keerden weer naar Pi-hachiroth, dat tegenover Baäl-sefon is, en zij legerden zich voor Migdol.","8":"En zij vertrokken van Hachiroth, en gingen midden door de zee, naar de woestijn, en zij gingen drie dagreizen in de woestijn Etham, en legerden zich in Mara.","9":"En zij vertrokken van Mara, en kwamen te Elim; in Elim nu waren twaalf waterbronnen en zeventig palmbomen, en zij legerden zich daar.","10":"En zij vertrokken van Elim, en legerden zich aan de Schelfzee.","11":"En zij vertrokken van de Schelfzee, en legerden zich in de woestijn Sin.","12":"En zij vertrokken uit de woestijn Sin, en zij legerden zich in Dofka.","13":"En zij vertrokken van Dofka, en legerden zich in Aluz.","14":"En zij vertrokken van Aluz, en legerden zich in Rafidim; maar daar was geen water voor het volk om te drinken.","15":"En zij vertrokken van Rafidim, en legerden zich in de woestijn van Sinaï.","16":"En zij vertrokken uit de woestijn van Sinaï, en legerden zich in Kibroth-thaava.","17":"En zij vertrokken van Kibroth-thaava, en legerden zich in Hazeroth.","18":"En zij vertrokken van Hazeroth, en legerden zich in Rithma.","19":"En zij vertrokken van Rithma, en legerden zich in Rimmon-perez.","20":"En zij vertrokken van Rimmon-perez, en legerden zich in Libna.","21":"En zij vertrokken van Libna, en legerden zich in Rissa.","22":"En zij vertrokken van Rissa, en legerden zich in Kehelatha.","23":"En zij vertrokken van Kehelatha, en legerden zich in het gebergte van Safer.","24":"En zij vertrokken van het gebergte Safer, en legerden zich in Harada.","25":"En zij vertrokken van Harada, en legerden zich in Makheloth.","26":"En zij vertrokken van Makheloth, en legerden zich in Tachath.","27":"En zij vertrokken van Tachath, en legerden zich in Tharah.","28":"En zij vertrokken van Tharah, en legerden zich in Mithka.","29":"En zij vertrokken van Mithka, en legerden zich in Hasmona.","30":"En zij vertrokken van Hasmona, en legerden zich in Moseroth.","31":"En zij vertrokken van Moseroth, en legerden zich in Bene-jaakan.","32":"En zij vertrokken van Bene-jaakan, en legerden zich in Hor-gidgad.","33":"En zij vertrokken van Hor-gidgad, en legerden zich in Jotbatha.","34":"En zij vertrokken van Jotbatha, en legerden zich in Abrona.","35":"En zij vertrokken van Abrona, en legerden zich in Ezeon-geber.","36":"En zij vertrokken van Ezeon-geber, en legerden zich in de woestijn Zin, dat is Kades.","37":"En zij vertrokken van Kades, en legerden zich bij de berg Hor, aan de grens van het land Edom.","38":"Toen ging de priester Aäron de berg Hor op, naar het bevel van de HEERE, en stierf daar, in het veertigste jaar na de uittocht van de kinderen van Israël uit het land Egypte, in de vijfde maand, op de eerste dag van de maand.","39":"Aäron nu was honderddrieëntwintig jaar oud, toen hij stierf op de berg Hor.","40":"En de Kanaäniet, de koning van Harad, die in het zuiden woonde in het land Kanaän, hoorde dat de kinderen van Israël aankwamen.","41":"En zij vertrokken van de berg Hor, en legerden zich in Zalmona.","42":"En zij vertrokken van Zalmona, en legerden zich in Funon.","43":"En zij vertrokken van Funon, en legerden zich in Oboth.","44":"En zij vertrokken van Oboth, en legerden zich bij de heuvelen van Abarim, in het gebied van Moab.","45":"En zij vertrokken van de heuvelen van *Abarim*, en legerden zich in Dibon-gad.","46":"En zij vertrokken van Dibon-gad, en legerden zich in Almon-diblathaim.","47":"En zij vertrokken van Almon-diblathaim, en legerden zich in de bergen Abarim, tegenover Nebo.","48":"En zij vertrokken van de bergen Abarim, en legerden zich in de vlakke velden van de Moabieten, aan de Jordaan bij Jericho.","49":"En zij legerden zich aan de Jordaan van Beth-jesimoth, tot aan Abel-sittim, in de vlakke velden van de Moabieten.","50":"En de HEERE sprak tot Mozes, in de vlakke velden van de Moabieten, aan de Jordaan bij Jericho, en zei:","51":"Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer u over de Jordaan gegaan bent naar het land Kanaän,","52":"dan zult u alle inwoners van het land voor uw aangezicht uit hun bezit verdrijven, en al hun afbeeldingen vernietigen; ook zult u al hun gegoten beelden vernietigen, en al hun hoogten met de grond gelijkmaken.","53":"En u zult het land in erfelijk bezit nemen, en daarin wonen; want Ik heb u dat land gegeven, om het erfelijk te bezitten.","54":"En u zult het land in erfelijk bezit nemen door het lot, naar uw geslachten; aan hen die veel zijn, zult u hun erfenis groter maken, en aan hen die weinig zijn, zult u hun erfenis kleiner maken; waar voor iemand het lot ook uitvalt, dat zal hij hebben; naar de stammen van uw vaderen zult u de erfenis ontvangen.","55":"Maar als u de inwoners van het land niet voor uw aangezicht uit hun bezit verdrijft, dan zal het gebeuren dat wie u van hen laat overblijven, tot doornen zullen zijn in uw ogen, en tot prikkels in uw zijden, en u zullen benauwen in het land waarin u woont.","56":"En het zal gebeuren dat Ik u zal doen, zoals Ik dacht hun te doen."},"SV":{"1":"Dit zijn de reizen der kinderen Israëls, die uit Egypteland uitgetogen zijn, naar hun heiren, door de hand van Mozes en Aäron.","2":"En Mozes schreef hun uittochten, naar hun reizen, naar den mond des HEEREN; en dit zijn hun reizen, naar hun uittochten.","3":"Zij reisden dan van Rameses; in de eerste maand, op den vijftienden dag der eerste maand, des anderen daags van het pascha, togen de kinderen Israëls uit door een hoge hand, voor de ogen van alle Egyptenaren;","4":"Als de Egyptenaars begroeven degenen, welke de HEERE onder hen geslagen had, alle eerstgeborenen; ook had de HEERE gerichten geoefend aan hun goden.","5":"Als de kinderen Israëls van Rameses verreisd waren, zo legerden zij zich te Sukkoth.","6":"En zij verreisden van Sukkoth, en legerden zich in Etham, hetwelk aan het einde der woestijn is.","7":"En zij verreisden van Etham, en keerden weder naar Pi-hachiroth, dat tegenover Baäl-sefon is, en zij legerden zich voor Migdol.","8":"En zij verreisden van Hachiroth, en gingen over, door het midden van de zee, naar de woestijn, en zij gingen drie dagreizen in de woestijn Etham, en legerden zich in Mara.","9":"En zij verreisden van Mara, en kwamen te Elim; in Elim nu waren twaalf waterfonteinen en zeventig palmbomen, en zij legerden zich aldaar.","10":"En zij verreisden van Elim, en legerden zich aan de Schelfzee.","11":"En zij verreisden van de Schelfzee, en legerden zich in de woestijn Sin.","12":"En zij verreisden uit de woestijn Sin, en zij legerden zich in Dofka.","13":"En zij verreisden van Dofka, en legerden zich in Aluz.","14":"En zij verreisden van Aluz, en legerden zich in Rafidim; doch daar was geen water voor het volk, om te drinken.","15":"En zij verreisden van Rafidim, en legerden zich in de woestijn van Sinaï.","16":"En zij verreisden uit de woestijn van Sinaï, en legerden zich in Kibroth-thaava.","17":"En zij verreisden van Kibroth-thaava, en legerden zich in Hazeroth.","18":"En zij verreisden van Hazeroth, en legerden zich in Rithma.","19":"En zij verreisden van Rithma, en legerden zich in Rimmon-perez.","20":"En zij verreisden van Rimmon-perez, en legerden zich in Libna.","21":"En zij verreisden van Libna, en legerden zich in Rissa.","22":"En zij verreisden van Rissa, en legerden zich in Kehelatha.","23":"En zij verreisden van Kehelatha, en legerden zich in het gebergte van Safer.","24":"En zij verreisden van het gebergte Safer, en legerden zich in Harada.","25":"En zij verreisden van Harada, en legerden zich in Makheloth.","26":"En zij verreisden van Makheloth, en legerden zich in Tachath.","27":"En zij verreisden van Tachath, en legerden zich in Tharah.","28":"En zij verreisden van Tharah, en legerden zich in Mithka.","29":"En zij verreisden van Mithka, en legerden zich in Hasmona.","30":"En zij verreisden van Hasmona, en legerden zich in Moseroth.","31":"En zij verreisden van Moseroth, en legerden zich in Bene-jaakan.","32":"En zij verreisden van Bene-jaakan, en legerden zich in Hor-gidgad.","33":"En zij verreisden van Hor-gidgad, en legerden zich in Jotbatha.","34":"En zij verreisden van Jotbatha, en legerden zich in Abrona.","35":"En zij verreisden van Abrona, en legerden zich in Ezeon-geber.","36":"En zij verreisden van Ezeon-geber, en legerden zich in de woestijn Zin, dat is Kades.","37":"En zij verreisden van Kades, en legerden zich aan den berg Hor, aan het einde des lands van Edom.","38":"Toen ging de priester Aäron op den berg Hor, naar den mond des HEEREN, en stierf aldaar, in het veertigste jaar na den uittocht van de kinderen Israëls uit Egypteland, in de vijfde maand, op den eersten der maand.","39":"Aäron nu was honderd drie en twintig jaren oud, als hij stierf op den berg Hor.","40":"En de Kanaäniet, de koning van Harad, die in het zuiden woonde in het land Kanaän, hoorde, dat de kinderen Israëls aankwamen.","41":"En zij verreisden van den berg Hor, en legerden zich in Zalmona.","42":"En zij verreisden van Zalmona, en legerden zich in Funon.","43":"En zij verreisden van Funon, en legerden zich in Oboth.","44":"En zij verreisden van Oboth, en legerden zich aan de heuvelen van Abarim, in de landpale van Moab.","45":"En zij verreisden van de heuvelen van *Abarim*, en legerden zich in Dibon-gad.","46":"En zij verreisden van Dibon-gad, en legerden zich in Almon-diblathaim.","47":"En zij verreisden van Almon-diblathaim, en legerden zich in de bergen Abarim, tegen Nebo.","48":"En zij verreisden van de bergen Abarim, en legerden zich in de vlakke velden der Moabieten, aan de Jordaan van Jericho.","49":"En zij legerden zich aan de Jordaan van Beth-jesimoth, tot aan Abel-sittim, in de vlakke velden der Moabieten.","50":"En de HEERE sprak tot Mozes, in de vlakke velden der Moabieten, aan de Jordaan van Jericho, zeggende:","51":"Spreek tot de kinderen Israëls, en zeg tot hen: Wanneer gijlieden over de Jordaan zult gegaan zijn in het land Kanaän;","52":"Zo zult gij alle inwoners des lands voor uw aangezicht uit de bezitting verdrijven, en al hun beeltenissen verderven; ook zult gij al hun gegotene beelden verderven, en al hun hoogten verdelgen.","53":"En gij zult het land in erfelijke bezitting nemen, en daarin wonen; want Ik heb u dat land gegeven, om hetzelve erfelijk te bezitten.","54":"En gij zult het land in erfelijke bezitting nemen door het lot, naar uw geslachten; dengenen, die veel zijn, zult gij hun erfenis meerder maken, en dien, die weinig zijn, zult gij hun erfenis minder maken; waarheen voor iemand het lot zal uitgaan, dat zal hij hebben; naar de stammen uwer vaderen zult gij de erfenis nemen.","55":"Maar indien gij de inwoners des lands niet voor uw aangezicht uit de bezitting zult verdrijven, zo zal het geschieden, dat, die gij van hen zult laten overblijven, tot doornen zullen zijn in uw ogen, en tot prikkelen in uw zijden, en u zullen benauwen op het land, waarin gij woont.","56":"En het zal geschieden, dat Ik u zal doen, gelijk als Ik hun dacht te doen."},"KJV":{"1":"These *are* the journeys of the children of Israel, which went forth out of the land of Egypt with their armies under the hand of Moses and Aaron.","2":"And Moses wrote their goings out according to their journeys by the commandment of the LORD: and these *are* their journeys according to their goings out.","3":"And they departed from Rameses in the first month, on the fifteenth day of the first month; on the morrow after the passover the children of Israel went out with an high hand in the sight of all the Egyptians.","4":"For the Egyptians buried all *their* firstborn, which the LORD had smitten among them: upon their gods also the LORD executed judgments.","5":"And the children of Israel removed from Rameses, and pitched in Succoth.","6":"And they departed from Succoth, and pitched in Etham, which *is* in the edge of the wilderness.","7":"And they removed from Etham, and turned again unto Pihahiroth, which *is* before Baalzephon: and they pitched before Migdol.","8":"And they departed from before Pihahiroth, and passed through the midst of the sea into the wilderness, and went three days' journey in the wilderness of Etham, and pitched in Marah.","9":"And they removed from Marah, and came unto Elim: and in Elim *were* twelve fountains of water, and threescore and ten palm trees; and they pitched","10":"And they removed from Elim, and encamped by the Red sea.","11":"And they removed from the Red sea, and encamped in the wilderness of Sin.","12":"And they took their journey out of the wilderness of Sin, and encamped in Dophkah.","13":"And they departed from Dophkah, and encamped in Alush.","14":"And they removed from Alush, and encamped at Rephidim, where was no water for the people to drink.","15":"And they departed from Rephidim, and pitched in the wilderness of Sinai.","16":"And they removed from the desert of Sinai, and pitched at Kibrothhattaavah.","17":"And they departed from Kibrothhattaavah, and encamped at Hazeroth.","18":"And they departed from Hazeroth, and pitched in Rithmah.","19":"And they departed from Rithmah, and pitched at Rimmonparez.","20":"And they departed from Rimmonparez, and pitched in Libnah.","21":"And they removed from Libnah, and pitched at Rissah.","22":"And they journeyed from Rissah, and pitched in Kehelathah.","23":"And they went from Kehelathah, and pitched in mount Shapher.","24":"And they removed from mount Shapher, and encamped in Haradah.","25":"And they removed from Haradah, and pitched in Makheloth.","26":"And they removed from Makheloth, and encamped at Tahath.","27":"And they departed from Tahath, and pitched at Tarah.","28":"And they removed from Tarah, and pitched in Mithcah.","29":"And they went from Mithcah, and pitched in Hashmonah.","30":"And they departed from Hashmonah, and encamped at Moseroth.","31":"And they departed from Moseroth, and pitched in Benejaakan.","32":"And they removed from Benejaakan, and encamped at Horhagidgad.","33":"And they went from Horhagidgad, and pitched in Jotbathah.","34":"And they removed from Jotbathah, and encamped at Ebronah.","35":"And they departed from Ebronah, and encamped at Eziongaber.","36":"And they removed from Eziongaber, and pitched in the wilderness of Zin, which *is* Kadesh.","37":"And they removed from Kadesh, and pitched in mount Hor, in the edge of the land of Edom.","38":"And Aaron the priest went up into mount Hor at the commandment of the LORD, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt, in the first *day* of the fifth month.","39":"And Aaron *was* an hundred and twenty and three years old when he died in mount Hor.","40":"And king Arad the Canaanite, which dwelt in the south in the land of Canaan, heard of the coming of the children of Israel.","41":"And they departed from mount Hor, and pitched in Zalmonah.","42":"And they departed from Zalmonah, and pitched in Punon.","43":"And they departed from Punon, and pitched in Oboth.","44":"And they departed from Oboth, and pitched in Ijeabarim, in the border of Moab.","45":"And they departed from Iim, and pitched in Dibongad.","46":"And they removed from Dibongad, and encamped in Almondiblathaim.","47":"And they removed from Almondiblathaim, and pitched in the mountains of Abarim, before Nebo.","48":"And they departed from the mountains of Abarim, and pitched in the plains of Moab by Jordan *near* Jericho.","49":"And they pitched by Jordan, from Bethjesimoth *even* unto Abelshittim in the plains of Moab.","50":"And the LORD spake unto Moses in the plains of Moab by Jordan *near* Jericho, saying,","51":"Speak unto the children of Israel, and say unto them, When ye are passed over Jordan into the land of Canaan;","52":"Then ye shall drive out all the inhabitants of the land from before you, and destroy all their pictures, and destroy all their molten images, and quite pluck down all their high places:","53":"And ye shall dispossess *the inhabitants* of the land, and dwell therein: for I have given you the land to possess","54":"And ye shall divide the land by lot for an inheritance among your families: *and* to the more ye shall give the more inheritance, and to the fewer ye shall give the less inheritance: every man's *inheritance* shall be in the place where his lot falleth; according to the tribes of your fathers ye shall inherit.","55":"But if ye will not drive out the inhabitants of the land from before you; then it shall come to pass, that those which ye let remain of them *shall be* pricks in your eyes, and thorns in your sides, and shall vex you in the land wherein ye dwell.","56":"Moreover it shall come to pass, *that* I shall do unto you, as I thought to do"}},"tsk":{"1":[{"kopje":"naar hun legers","refs":["Ex 12:37","Ex 12:51","Ex 13:18"]},{"kopje":"door de hand","refs":["Joz 24:5","1 Sam 12:8","Ps 77:21","Micha 6:4"]}],"2":[{"kopje":"reizen","refs":["Num 9:17-23","Num 10:6","Num 10:13","Deut 1:2","Deut 10:11"]}],"3":[{"kopje":"reisden","refs":["Gen 47:11","Ex 1:11","Ex 12:37"]},{"kopje":"in de eerste","refs":["Ex 12:2","Ex 13:4"]},{"kopje":"door een hoge hand","refs":["Ex 14:8","Ps 105:38","Jes 52:12","Micha 2:13"]}],"4":[{"kopje":"begroeven","refs":["Ex 12:29","Ex 12:30","Ps 105:36"]},{"kopje":"aan hun goden","refs":["Ex 12:12","Ex 18:11","Jes 19:1","Zef 2:11","Openb 12:7-9"]}],"5":[{"kopje":"legerden zij zich","refs":["Ex 12:37"]}],"6":[{"kopje":"vertrokken","refs":["Ex 13:20"]}],"7":[{"kopje":"vertrokken","refs":["Num 33:8","Ex 14:2","Ex 14:9"]}],"8":[{"kopje":"vertrokken","refs":["Ex 14:21","Ex 14:22-31","Ex 15:22-26"]}],"10":[{"kopje":"Elim","refs":["Ex 16 -kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month;</span> on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow</span> after the <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> with an <span class=\"wl wl-kjv\" data-code=\"H7311\">high</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of all the Egyptians.","4":"For the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> all their <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> among them: upon their <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> also the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">executed</span> judgments.","5":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H7486\">Rameses,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Succoth.","6":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H5523\">Succoth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in <span class=\"wl wl-kjv\" data-code=\"H864\">Etham,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H7097\">edge</span> of the wilderness.","7":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H864\">Etham,</span> and turned <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto <span class=\"wl wl-kjv\" data-code=\"H6367\">Pihahiroth,</span> which is before <span class=\"wl wl-kjv\" data-code=\"H1189\">Baalzephon:</span> and they <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Migdol.","8":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6367\">Pihahiroth,</span> and passed <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> into the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days'</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">journey</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H864\">Etham,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Marah.","9":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H4785\">Marah,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H362\">Elim:</span> and in <span class=\"wl wl-kjv\" data-code=\"H362\">Elim</span> were <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">fountains</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> palm <span class=\"wl wl-kjv\" data-code=\"H8558\">trees;</span> and they pitched","10":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H362\">Elim,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> by the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> sea.","11":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of Sin.","12":"And they took their <span class=\"wl wl-kjv\" data-code=\"H5265\">journey</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H5512\">Sin,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in Dophkah.","13":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H1850\">Dophkah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in Alush.","14":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H442\">Alush,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at <span class=\"wl wl-kjv\" data-code=\"H7508\">Rephidim,</span> where was no <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to drink.","15":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H7508\">Rephidim,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of Sinai.","16":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from the <span class=\"wl wl-kjv\" data-code=\"H4057\">desert</span> of <span class=\"wl wl-kjv\" data-code=\"H5514\">Sinai,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> at Kibrothhattaavah.","17":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H6914\">Kibrothhattaavah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Hazeroth.","18":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H2698\">Hazeroth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Rithmah.","19":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H7575\">Rithmah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> at Rimmonparez.","20":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H7428\">Rimmonparez,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Libnah.","21":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H3841\">Libnah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> at Rissah.","22":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed</span> from <span class=\"wl wl-kjv\" data-code=\"H7446\">Rissah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Kehelathah.","23":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">went</span> from <span class=\"wl wl-kjv\" data-code=\"H6954\">Kehelathah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Shapher.","24":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H8234\">Shapher,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in Haradah.","25":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H2732\">Haradah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Makheloth.","26":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H4722\">Makheloth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Tahath.","27":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H8480\">Tahath,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> at Tarah.","28":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H8646\">Tarah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Mithcah.","29":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">went</span> from <span class=\"wl wl-kjv\" data-code=\"H4989\">Mithcah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Hashmonah.","30":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H2832\">Hashmonah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Moseroth.","31":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H4149\">Moseroth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Benejaakan.","32":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H1142\">Benejaakan,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Horhagidgad.","33":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">went</span> from <span class=\"wl wl-kjv\" data-code=\"H2735\">Horhagidgad,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Jotbathah.","34":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H3193\">Jotbathah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Ebronah.","35":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H5684\">Ebronah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Eziongaber.","36":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H6100\">Eziongaber,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H6790\">Zin,</span> which is Kadesh.","37":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H6946\">Kadesh,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H2023\">Hor,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7097\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Edom.","38":"And <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H2023\">Hor</span> at the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> there, in the <span class=\"wl wl-kjv\" data-code=\"H705\">fortieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> after the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> in the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> month.","39":"And <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> was an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> when he <span class=\"wl wl-kjv\" data-code=\"H4194\">died</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Hor.","40":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6166\">Arad</span> the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanite,</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of the <span class=\"wl wl-kjv\" data-code=\"H935\">coming</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","41":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H2023\">Hor,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Zalmonah.","42":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H6758\">Zalmonah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Punon.","43":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H6325\">Punon,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Oboth.","44":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H88\">Oboth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in <span class=\"wl wl-kjv\" data-code=\"H5863\">Ijeabarim,</span> in the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> of Moab.","45":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H5864\">Iim,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Dibongad.","46":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H1769\">Dibongad,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in Almondiblathaim.","47":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H5963\">Almondiblathaim,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H5682\">Abarim,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Nebo.","48":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H5682\">Abarim,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in the <span class=\"wl wl-kjv\" data-code=\"H6160\">plains</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> by <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> near Jericho.","49":"And they <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> by <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> from <span class=\"wl wl-kjv\" data-code=\"H1020\">Bethjesimoth</span> even unto <span class=\"wl wl-kjv\" data-code=\"H63\">Abelshittim</span> in the <span class=\"wl wl-kjv\" data-code=\"H6160\">plains</span> of Moab.","50":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> in the <span class=\"wl wl-kjv\" data-code=\"H6160\">plains</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> by <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> near <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho,</span> saying,","51":"<span class=\"wl wl-kjv\" data-code=\"H1696\">Speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, When ye are passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Canaan;","52":"Then ye shall drive <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you, and <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> all their <span class=\"wl wl-kjv\" data-code=\"H4906\">pictures,</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> all their <span class=\"wl wl-kjv\" data-code=\"H4541\">molten</span> <span class=\"wl wl-kjv\" data-code=\"H6754\">images,</span> and quite pluck <span class=\"wl wl-kjv\" data-code=\"H8045\">down</span> all their high places:","53":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H3423\">dispossess</span> the inhabitants of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein: for I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> to possess","54":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H5157\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> by <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> for an <span class=\"wl wl-kjv\" data-code=\"H5157\">inheritance</span> among your <span class=\"wl wl-kjv\" data-code=\"H4940\">families:</span> and to the <span class=\"wl wl-kjv\" data-code=\"H7227\">more</span> ye shall give the <span class=\"wl wl-kjv\" data-code=\"H7235\">more</span> <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4592\">fewer</span> ye shall give the <span class=\"wl wl-kjv\" data-code=\"H4591\">less</span> <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance:</span> every man's inheritance shall be in the place where his <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">falleth;</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribes</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> ye shall inherit.","55":"But if ye will not drive <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you; then it shall come to pass, that those which ye let <span class=\"wl wl-kjv\" data-code=\"H3498\">remain</span> of them shall be <span class=\"wl wl-kjv\" data-code=\"H7899\">pricks</span> in your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H6796\">thorns</span> in your <span class=\"wl wl-kjv\" data-code=\"H6654\">sides,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6887\">vex</span> you in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> wherein ye dwell.","56":"Moreover it shall come to pass, that I shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto you, as I <span class=\"wl wl-kjv\" data-code=\"H1819\">thought</span> to do"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Mozes en Aäron","tekst":"Dat is, door het beleid."}],"2":[{"catchword":"naar den mond des HEEREN;","tekst":"Dat is, op des HEEREN bevel."}],"3":[{"catchword":"eerste maand,","tekst":"Genaamd Abib, anders Nisan. Zie Exo 12:2, en Exo 13:4; Deu 1:3."},{"catchword":"door een hoge hand,","tekst":"Zie Exo 14:8."}],"4":[{"catchword":"Als de Egyptenaars begroeven","tekst":"Alhoewel de Egyptenaar door deze begrafenissen hunner eerstgeborenen ten hoogste mochten vertoornd en verbitterd zijn geworden tegen de Israëlieten, die zij voor hun ogen zagen vertrekken, heeft hen God nochtans alzo verslagen en versaagd gemaakt, dat zij het hart niet hebben gehad om den kinderen Israëls enig leed te doen, of hun vrediglijk vertrek te verhinderen."},{"catchword":"gerichten geoefend","tekst":"Zie Exo 12:12, en vergelijk Isa 19:1."}],"5":[{"catchword":"Raméses verreisd waren,","tekst":"Zie Gen 47:11."}],"7":[{"catchword":"Pi-hachirôth,","tekst":"Zie Exo 15:27."}],"11":[{"catchword":"Sin","tekst":"Waar zij, tegen den HEERE murmurerende, eerst het manna bekomen hebben. Deze woestijn is te onderscheiden van de andere woestijn Zin, of Tsin, onder, vs.36."}],"16":[{"catchword":"Kibrôth-tháäva","tekst":"Dat is, lustgraven."}],"36":[{"catchword":"Zin,","tekst":"Zie boven, Num 13:21."}],"38":[{"catchword":"naar den mond des HEEREN,","tekst":"Dat is, naar Gods ordinantie en bevel."},{"catchword":"vijfde maand,","tekst":"Bij de Joden genaamd Ab, pssende op onze Juli en Augustus."}],"39":[{"catchword":"was honderd drie en twintig jaren oud,","tekst":"Hebreeuws, was een zoon van honderd en drie en twintig jaar."}],"40":[{"catchword":"Harad,","tekst":"Of, de koning Harad. Zie de historie van dezen, boven, Num 21:1-3, en de aantekeningen aldaar."}],"44":[{"catchword":"Abárim,","tekst":"Zijnde bergen in het land der Moabieten gelegen, en hetzelve scheidende van het land der Ammonieten; zie onder, vs.47."}],"45":[{"catchword":"Dibon-gad","tekst":"Tot onderscheid van een ander Dibon, dat den kinderen van Ruben toegedeeld is; Jos 13:15, Jos 13:17."}],"47":[{"catchword":"Abárim,","tekst":"Strekkende van bij de Dode zee, of het zuidelijke einde van Arnon tot aan Nebo."},{"catchword":"Nebo","tekst":"Zie Deu 34:1."}],"48":[{"catchword":"Jericho","tekst":"Dat is, waar deze rivier tegenover Jericho is lopende; alzo elders meer."}],"49":[{"catchword":"sittim,","tekst":"Eenigen menen dat dit gezelfde plaats is, die boven alleenlijk Sittim genoemd is, Num 25:1, en hier genoemd Abel-Sittim, ten aanzien van de klacht en rouw, die de kinderen Israëls aldaar bedreven over de plaag des Heeren."}],"52":[{"catchword":"gegotene beelden verderven,","tekst":"Hebreeuws, beelden van gieting, of, gegoten dingen"},{"catchword":"hoogten verdelgen","tekst":"Zie Lev 26:30."}],"54":[{"catchword":"die veel zijn,","tekst":"Zie boven, Num 26:54."},{"catchword":"voor iemand het lot zal uitgaan,","tekst":"Hebreeuws, hem."}],"55":[{"catchword":"doornen zullen zijn","tekst":"Dat is, zij zullen u een gedurige kwelling en verdriet zijn, zij zullen u lust en rust benemen, mitsgaders u verleiden tot zonden, om welker wil mijn toorn jegens u ontsteken zal. Zie Jos 23:13; Jdg 2:3; vergelijk Exo 23:33, en Exo 34:12; Deu 7:16. De waarheid van dit goddelijk dreigement hebben de Israëlieten doorgaans ondervonden, tot Davids tijden toe."},{"catchword":"benauwen op het land,","tekst":"Of, vijandiglijk handelen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"These are the journeys of the children of Israel which went forth out the land of Egypt, according to their host, by the hand [i.e. conduct] of Moseh and Aaron."}],"3":[{"catchword":null,"tekst":"They journeyed then from Rahmeses in the first month, [Called Abib, otherwise Nisan. See ex.12. verse 2. And 13.4. Deut.1.on verse 3] on the fifteenth day of the first month; the second day of the Passover the children of Israel marched forth, by an high hand [see Ex.14on verse 8] before the eyes of all the Egyptians."}],"4":[{"catchword":null,"tekst":"When the Egyptians buried those, whom the LORD had smitten among them, every first-born; [Notwithstanding that the Egyptians, by reason of this burial, could not but be highly and bitterly incensed against the Israelites, whom they saw marching away before their eyes; yet God so daunted and disheartened them, that they had not the courage to offend the children of Israel in the least degree, or to stop and hinder their peaceable departure] also the LORD had exercised judgments upon their Gods. [see Ex.12.on verse 12. And compare Isa.19 verse 1.]"}],"5":[{"catchword":null,"tekst":"When the children of Israel were departed from Rahmeses, [See Gen.47.on verse 11] they camped themselves at Succoth."}],"6":[{"catchword":null,"tekst":"And they removed from Succoth and camped in Etham, which is at the end of the Wilderness."}],"7":[{"catchword":null,"tekst":"And they removed from Etham, and turned again to Pi-hachiroth, [See Ex.14.on verse 2] which is over against Baal-Zephon: and they encamped before Migdol."}],"8":[{"catchword":null,"tekst":"And they removed from Hachiroth, and went through the midst of the sea towards the wilderness, and they went three days journey in the wilderness of Etham, and encamped in Marah."}],"9":[{"catchword":null,"tekst":"And they removed from Marah, and came to Elim: now in Elim ther // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},

  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

    return label + refChips(nd.refs) + kids;
  };

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
