, en legerden zich in Kibroth-thaava.", "17": "En zij vertrokken van Kibroth-thaava, en legerden zich in Hazeroth.", "18": "En zij vertrokken van Hazeroth, en legerden zich in Rithma.", "19": "En zij vertrokken van Rithma, en legerden zich in Rimmon-perez.", "20": "En zij vertrokken van Rimmon-perez, en legerden zich in Libna.", "21": "En zij vertrokken van Libna, en legerden zich in Rissa.", "22": "En zij vertrokken van Rissa, en legerden zich in Kehelatha.", "23": "En zij vertrokken van Kehelatha, en legerden zich in het gebergte van Safer.", "24": "En zij vertrokken van het gebergte Safer, en legerden zich in Harada.", "25": "En zij vertrokken van Harada, en legerden zich in Makheloth.", "26": "En zij vertrokken van Makheloth, en legerden zich in Tachath.", "27": "En zij vertrokken van Tachath, en legerden zich in Tharah.", "28": "En zij vertrokken van Tharah, en legerden zich in Mithka.", "29": "En zij vertrokken van Mithka, en legerden zich in Hasmona.", "30": "En zij vertrokken van Hasmona, en legerden zich in Moseroth.", "31": "En zij vertrokken van Moseroth, en legerden zich in Bene-jaakan.", "32": "En zij vertrokken van Bene-jaakan, en legerden zich in Hor-gidgad.", "33": "En zij vertrokken van Hor-gidgad, en legerden zich in Jotbatha.", "34": "En zij vertrokken van Jotbatha, en legerden zich in Abrona.", "35": "En zij vertrokken van Abrona, en legerden zich in Ezeon-geber.", "36": "En zij vertrokken van Ezeon-geber, en legerden zich in de woestijn Zin, dat is Kades.", "37": "En zij vertrokken van Kades, en legerden zich bij de berg Hor, aan de grens van het land Edom.", "38": "Toen ging de priester Aäron de berg Hor op, naar het bevel van de HEERE, en stierf daar, in het veertigste jaar na de uittocht van de kinderen van Israël uit het land Egypte, in de vijfde maand, op de eerste dag van de maand.", "39": "Aäron nu was honderddrieëntwintig jaar oud, toen hij stierf op de berg Hor.", "40": "En de Kanaäniet, de koning van Harad, die in het zuiden woonde in het land Kanaän, hoorde dat de kinderen van Israël aankwamen.", "41": "En zij vertrokken van de berg Hor, en legerden zich in Zalmona.", "42": "En zij vertrokken van Zalmona, en legerden zich in Funon.", "43": "En zij vertrokken van Funon, en legerden zich in Oboth.", "44": "En zij vertrokken van Oboth, en legerden zich bij de heuvelen van Abarim, in het gebied van Moab.", "45": "En zij vertrokken van de heuvelen van *Abarim*, en legerden zich in Dibon-gad.", "46": "En zij vertrokken van Dibon-gad, en legerden zich in Almon-diblathaim.", "47": "En zij vertrokken van Almon-diblathaim, en legerden zich in de bergen Abarim, tegenover Nebo.", "48": "En zij vertrokken van de bergen Abarim, en legerden zich in de vlakke velden van de Moabieten, aan de Jordaan bij Jericho.", "49": "En zij legerden zich aan de Jordaan van Beth-jesimoth, tot aan Abel-sittim, in de vlakke velden van de Moabieten.", "50": "En de HEERE sprak tot Mozes, in de vlakke velden van de Moabieten, aan de Jordaan bij Jericho, en zei:", "51": "Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer u over de Jordaan gegaan bent naar het land Kanaän,", "52": "dan zult u alle inwoners van het land voor uw aangezicht uit hun bezit verdrijven, en al hun afbeeldingen vernietigen; ook zult u al hun gegoten beelden vernietigen, en al hun hoogten met de grond gelijkmaken.", "53": "En u zult het land in erfelijk bezit nemen, en daarin wonen; want Ik heb u dat land gegeven, om het erfelijk te bezitten.", "54": "En u zult het land in erfelijk bezit nemen door het lot, naar uw geslachten; aan hen die veel zijn, zult u hun erfenis groter maken, en aan hen die weinig zijn, zult u hun erfenis kleiner maken; waar voor iemand het lot ook uitvalt, dat zal hij hebben; naar de stammen van uw vaderen zult u de erfenis ontvangen.", "55": "Maar als u de inwoners van het land niet voor uw aangezicht uit hun bezit verdrijft, dan zal het gebeuren dat wie u van hen laat overblijven, tot doornen zullen zijn in uw ogen, en tot prikkels in uw zijden, en u zullen benauwen in het land waarin u woont.", "56": "En het zal gebeuren dat Ik u zal doen, zoals Ik dacht hun te doen."}, "SV": {"1": "Dit zijn de reizen der kinderen Israëls, die uit Egypteland uitgetogen zijn, naar hun heiren, door de hand van Mozes en Aäron.", "2": "En Mozes schreef hun uittochten, naar hun reizen, naar den mond des HEEREN; en dit zijn hun reizen, naar hun uittochten.", "3": "Zij reisden dan van Rameses; in de eerste maand, op den vijftienden dag der eerste maand, des anderen daags van het pascha, togen de kinderen Israëls uit door een hoge hand, voor de ogen van alle Egyptenaren;", "4": "Als de Egyptenaars begroeven degenen, welke de HEERE onder hen geslagen had, alle eerstgeborenen; ook had de HEERE gerichten geoefend aan hun goden.", "5": "Als de kinderen Israëls van Rameses verreisd waren, zo legerden zij zich te Sukkoth.", "6": "En zij verreisden van Sukkoth, en legerden zich in Etham, hetwelk aan het einde der woestijn is.", "7": "En zij verreisden van Etham, en keerden weder naar Pi-hachiroth, dat tegenover Baäl-sefon is, en zij legerden zich voor Migdol.", "8": "En zij verreisden van Hachiroth, en gingen over, door het midden van de zee, naar de woestijn, en zij gingen drie dagreizen in de woestijn Etham, en legerden zich in Mara.", "9": "En zij verreisden van Mara, en kwamen te Elim; in Elim nu waren twaalf waterfonteinen en zeventig palmbomen, en zij legerden zich aldaar.", "10": "En zij verreisden van Elim, en legerden zich aan de Schelfzee.", "11": "En zij verreisden van de Schelfzee, en legerden zich in de woestijn Sin.", "12": "En zij verreisden uit de woestijn Sin, en zij legerden zich in Dofka.", "13": "En zij verreisden van Dofka, en legerden zich in Aluz.", "14": "En zij verreisden van Aluz, en legerden zich in Rafidim; doch daar was geen water voor het volk, om te drinken.", "15": "En zij verreisden van Rafidim, en legerden zich in de woestijn van Sinaï.", "16": "En zij verreisden uit de woestijn van Sinaï, en legerden zich in Kibroth-thaava.", "17": "En zij verreisden van Kibroth-thaava, en legerden zich in Hazeroth.", "18": "En zij verreisden van Hazeroth, en legerden zich in Rithma.", "19": "En zij verreisden van Rithma, en legerden zich in Rimmon-perez.", "20": "En zij verreisden van Rimmon-perez, en legerden zich in Libna.", "21": "En zij verreisden van Libna, en legerden zich in Rissa.", "22": "En zij verreisden van Rissa, en legerden zich in Kehelatha.", "23": "En zij verreisden van Kehelatha, en legerden zich in het gebergte van Safer.", "24": "En zij verreisden van het gebergte Safer, en legerden zich in Harada.", "25": "En zij verreisden van Harada, en legerden zich in Makheloth.", "26": "En zij verreisden van Makheloth, en legerden zich in Tachath.", "27": "En zij verreisden van Tachath, en legerden zich in Tharah.", "28": "En zij verreisden van Tharah, en legerden zich in Mithka.", "29": "En zij verreisden van Mithka, en legerden zich in Hasmona.", "30": "En zij verreisden van Hasmona, en legerden zich in Moseroth.", "31": "En zij verreisden van Moseroth, en legerden zich in Bene-jaakan.", "32": "En zij verreisden van Bene-jaakan, en legerden zich in Hor-gidgad.", "33": "En zij verreisden van Hor-gidgad, en legerden zich in Jotbatha.", "34": "En zij verreisden van Jotbatha, en legerden zich in Abrona.", "35": "En zij verreisden van Abrona, en legerden zich in Ezeon-geber.", "36": "En zij verreisden van Ezeon-geber, en legerden zich in de woestijn Zin, dat is Kades.", "37": "En zij verreisden van Kades, en legerden zich aan den berg Hor, aan het einde des lands van Edom.", "38": "Toen ging de priester Aäron op den berg Hor, naar den mond des HEEREN, en stierf aldaar, in het veertigste jaar na den uittocht van de kinderen Israëls uit Egypteland, in de vijfde maand, op den eersten der maand.", "39": "Aäron nu was honderd drie en twintig jaren oud, als hij stierf op den berg Hor.", "40": "En de Kanaäniet, de koning van Harad, die in het zuiden woonde in het land Kanaän, hoorde, dat de kinderen Israëls aankwamen.", "41": "En zij verreisden van den berg Hor, en legerden zich in Zalmona.", "42": "En zij verreisden van Zalmona, en legerden zich in Funon.", "43": "En zij verreisden van Funon, en legerden zich in Oboth.", "44": "En zij verreisden van Oboth, en legerden zich aan de heuvelen van Abarim, in de landpale van Moab.", "45": "En zij verreisden van de heuvelen van *Abarim*, en legerden zich in Dibon-gad.", "46": "En zij verreisden van Dibon-gad, en legerden zich in Almon-diblathaim.", "47": "En zij verreisden van Almon-diblathaim, en legerden zich in de bergen Abarim, tegen Nebo.", "48": "En zij verreisden van de bergen Abarim, en legerden zich in de vlakke velden der Moabieten, aan de Jordaan van Jericho.", "49": "En zij legerden zich aan de Jordaan van Beth-jesimoth, tot aan Abel-sittim, in de vlakke velden der Moabieten.", "50": "En de HEERE sprak tot Mozes, in de vlakke velden der Moabieten, aan de Jordaan van Jericho, zeggende:", "51": "Spreek tot de kinderen Israëls, en zeg tot hen: Wanneer gijlieden over de Jordaan zult gegaan zijn in het land Kanaän;", "52": "Zo zult gij alle inwoners des lands voor uw aangezicht uit de bezitting verdrijven, en al hun beeltenissen verderven; ook zult gij al hun gegotene beelden verderven, en al hun hoogten verdelgen.", "53": "En gij zult het land in erfelijke bezitting nemen, en daarin wonen; want Ik heb u dat land gegeven, om hetzelve erfelijk te bezitten.", "54": "En gij zult het land in erfelijke bezitting nemen door het lot, naar uw geslachten; dengenen, die veel zijn, zult gij hun erfenis meerder maken, en dien, die weinig zijn, zult gij hun erfenis minder maken; waarheen voor iemand het lot zal uitgaan, dat zal hij hebben; naar de stammen uwer vaderen zult gij de erfenis nemen.", "55": "Maar indien gij de inwoners des lands niet voor uw aangezicht uit de bezitting zult verdrijven, zo zal het geschieden, dat, die gij van hen zult laten overblijven, tot doornen zullen zijn in uw ogen, en tot prikkelen in uw zijden, en u zullen benauwen op het land, waarin gij woont.", "56": "En het zal geschieden, dat Ik u zal doen, gelijk als Ik hun dacht te doen."}, "KJV": {"1": "These *are* the journeys of the children of Israel, which went forth out of the land of Egypt with their armies under the hand of Moses and Aaron.", "2": "And Moses wrote their goings out according to their journeys by the commandment of the LORD: and these *are* their journeys according to their goings out.", "3": "And they departed from Rameses in the first month, on the fifteenth day of the first month; on the morrow after the passover the children of Israel went out with an high hand in the sight of all the Egyptians.", "4": "For the Egyptians buried all *their* firstborn, which the LORD had smitten among them: upon their gods also the LORD executed judgments.", "5": "And the children of Israel removed from Rameses, and pitched in Succoth.", "6": "And they departed from Succoth, and pitched in Etham, which *is* in the edge of the wilderness.", "7": "And they removed from Etham, and turned again unto Pihahiroth, which *is* before Baalzephon: and they pitched before Migdol.", "8": "And they departed from before Pihahiroth, and passed through the midst of the sea into the wilderness, and went three days' journey in the wilderness of Etham, and pitched in Marah.", "9": "And they removed from Marah, and came unto Elim: and in Elim *were* twelve fountains of water, and threescore and ten palm trees; and they pitched", "10": "And they removed from Elim, and encamped by the Red sea.", "11": "And they removed from the Red sea, and encamped in the wilderness of Sin.", "12": "And they took their journey out of the wilderness of Sin, and encamped in Dophkah.", "13": "And they departed from Dophkah, and encamped in Alush.", "14": "And they removed from Alush, and encamped at Rephidim, where was no water for the people to drink.", "15": "And they departed from Rephidim, and pitched in the wilderness of Sinai.", "16": "And they removed from the desert of Sinai, and pitched at Kibrothhattaavah.", "17": "And they departed from Kibrothhattaavah, and encamped at Hazeroth.", "18": "And they departed from Hazeroth, and pitched in Rithmah.", "19": "And they departed from Rithmah, and pitched at Rimmonparez.", "20": "And they departed from Rimmonparez, and pitched in Libnah.", "21": "And they removed from Libnah, and pitched at Rissah.", "22": "And they journeyed from Rissah, and pitched in Kehelathah.", "23": "And they went from Kehelathah, and pitched in mount Shapher.", "24": "And they removed from mount Shapher, and encamped in Haradah.", "25": "And they removed from Haradah, and pitched in Makheloth.", "26": "And they removed from Makheloth, and encamped at Tahath.", "27": "And they departed from Tahath, and pitched at Tarah.", "28": "And they removed from Tarah, and pitched in Mithcah.", "29": "And they went from Mithcah, and pitched in Hashmonah.", "30": "And they departed from Hashmonah, and encamped at Moseroth.", "31": "And they departed from Moseroth, and pitched in Benejaakan.", "32": "And they removed from Benejaakan, and encamped at Horhagidgad.", "33": "And they went from Horhagidgad, and pitched in Jotbathah.", "34": "And they removed from Jotbathah, and encamped at Ebronah.", "35": "And they departed from Ebronah, and encamped at Eziongaber.", "36": "And they removed from Eziongaber, and pitched in the wilderness of Zin, which *is* Kadesh.", "37": "And they removed from Kadesh, and pitched in mount Hor, in the edge of the land of Edom.", "38": "And Aaron the priest went up into mount Hor at the commandment of the LORD, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt, in the first *day* of the fifth month.", "39": "And Aaron *was* an hundred and twenty and three years old when he died in mount Hor.", "40": "And king Arad the Canaanite, which dwelt in the south in the land of Canaan, heard of the coming of the children of Israel.", "41": "And they departed from mount Hor, and pitched in Zalmonah.", "42": "And they departed from Zalmonah, and pitched in Punon.", "43": "And they departed from Punon, and pitched in Oboth.", "44": "And they departed from Oboth, and pitched in Ijeabarim, in the border of Moab.", "45": "And they departed from Iim, and pitched in Dibongad.", "46": "And they removed from Dibongad, and encamped in Almondiblathaim.", "47": "And they removed from Almondiblathaim, and pitched in the mountains of Abarim, before Nebo.", "48": "And they departed from the mountains of Abarim, and pitched in the plains of Moab by Jordan *near* Jericho.", "49": "And they pitched by Jordan, from Bethjesimoth *even* unto Abelshittim in the plains of Moab.", "50": "And the LORD spake unto Moses in the plains of Moab by Jordan *near* Jericho, saying,", "51": "Speak unto the children of Israel, and say unto them, When ye are passed over Jordan into the land of Canaan;", "52": "Then ye shall drive out all the inhabitants of the land from before you, and destroy all their pictures, and destroy all their molten images, and quite pluck down all their high places:", "53": "And ye shall dispossess *the inhabitants* of the land, and dwell therein: for I have given you the land to possess", "54": "And ye shall divide the land by lot for an inheritance among your families: *and* to the more ye shall give the more inheritance, and to the fewer ye shall give the less inheritance: every man's *inheritance* shall be in the place where his lot falleth; according to the tribes of your fathers ye shall inherit.", "55": "But if ye will not drive out the inhabitants of the land from before you; then it shall come to pass, that those which ye let remain of them *shall be* pricks in your eyes, and thorns in your sides, and shall vex you in the land wherein ye dwell.", "56": "Moreover it shall come to pass, *that* I shall do unto you, as I thought to do"}}, "tsk": { God, en zij dienden de Baäls en de gewijde palen.", "Spr 2:19": "Allen die tot haar ingaan, zullen niet terugkomen, en zullen de paden van het leven niet bereiken;", "1 Kor 10:1": "Ik wil niet, broeders, dat u onwetend bent van het volgende: onze vaders waren allen onder de wolk, en gingen allen door de zee heen;", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Deut 9:22": "Ook vertoornde u de HEERE zeer te Thab-era en te Massa, en te Kibroth-thaava.", "Ps 66:6": "Hij heeft de zee veranderd in droog land; zij zijn te voet door de rivier gegaan; daar hebben wij ons in Hem verblijd.", "Spr 17:12": "Beter dat een berin die van haar jongen beroofd is, een man tegemoetkomt, dan een dwaas in zijn dwaasheid.", "Ps 139:22": "Ik haat hen met volkomen haat, tot vijanden zijn zij mij.", "Num 21:12": "Van daar reisden zij, en legerden zich bij de beek Zered.", "Num 34:7": "Verder zal dit voor u de noordgrens zijn: vanaf de grote zee zult u de berg Hor voor uzelf aftekenen.", "Ex 12:51": "En het gebeurde op diezelfde dag, dat de HEERE de kinderen van Israël uit Egypteland leidde, naar hun legers.", "Ex 15:22-25": "Hierna liet Mozes de Israëlieten verder trekken vanaf de Schelfzee; en zij trokken uit naar de woestijn Sur, en zij gingen drie dagen in de woestijn, en vonden geen water. Toen kwamen zij bij Mara; maar zij konden het water van Mara niet drinken, want het was bitter; daarom werd het Mara genoemd. Toen morde het volk tegen Mozes, en zei: Wat zullen wij drinken?", "Num 21:1": "Toen de Kanaäniet, de koning van Harad, die woonde in het zuiden, hoorde dat Israël door de weg van de verspieders kwam, streed hij tegen Israël, en hij voerde enige gevangenen uit hen gevankelijk weg.", "Joz 4:23": "Want de HEERE, uw God, heeft de wateren van de Jordaan voor uw ogen doen uitdrogen, totdat u erdoorheen gegaan was; zoals de HEERE, uw God, aan de Schelfzee gedaan heeft, die Hij voor ons aangezicht heeft doen uitdrogen, totdat wij daardoor gegaan waren;", "Num 21:20": "En van Bamoth tot het dal, dat in het veld van Moab is, bij de hoogte van Pisga, en dat uitziet over de wildernis.", "Ps 78:13": "Hij kliefde de zee, en liet hen erdoorheen gaan; en de wateren liet Hij staan als een hoop.", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "1 Tim 6:5": "verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Deut 7:2-4": "en de HEERE, uw God, hen aan u zal hebben overgegeven, zodat u hen verslaat, dan moet u hen helemaal met de ban vernietigen; u zult geen verbond met hen maken, en hun ook niet genadig zijn. U zult zich ook niet met hen verzwageren; uw dochters zult u niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen. Want zij zouden uw zonen van Mij doen afwijken, zodat zij andere goden zouden dienen; en de toorn van de HEERE zou tegen u ontsteken, en u snel verdelgen.", "2 Petr 2:18": "Want zij spreken zeer opgeblazen, holle woorden, en verleiden door de begeerten van het vlees en door losbandigheid hen die net ontkomen waren aan degenen die in dwaling wandelen;", "Ex 25:5": "En roodgeverfde ramsvellen, en dassenvellen; en acaciahout;", "Num 25:1": "Israël verbleef te Sittim, en het volk begon te hoereren met de dochters van de Moabieten.", "Deut 7:25": "De gesneden beelden van hun goden zult u met vuur verbranden; het zilver en goud dat daaraan is, zult u niet begeren, en ook niet voor uzelf nemen, opdat u daardoor niet verstrikt wordt; want dat is voor de HEERE, uw God, een afschuwelijke gruwel.", "Ex 15:22-26": "Hierna liet Mozes de Israëlieten verder trekken vanaf de Schelfzee; en zij trokken uit naar de woestijn Sur, en zij gingen drie dagen in de woestijn, en vonden geen water. Toen kwamen zij bij Mara; maar zij konden het water van Mara niet drinken, want het was bitter; daarom werd het Mara genoemd. Toen morde het volk tegen Mozes, en zei: Wat zullen wij drinken?", "Gen 49:6": "Mijn ziel, kom niet in hun verborgen raad; mijn eer, wordt niet verenigd met hun vergadering! Want in hun toorn hebben zij de mannen doodgeslagen, en in hun moedwil hebben zij de ossen verlamd.", "Hos 7:9": "Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid over hem verspreid, en hij merkt het niet.", "1 Kor 5:9-11": "Ik heb u in de brief geschreven dat u zich niet moet inlaten met de hoereerders; Maar niet geheel met de hoereerders van deze wereld, of met de gierigaards, of met de rovers, of met de afgodendienaars; want dan zou u wel uit de wereld moeten gaan. Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten.", "Ex 14:8": "Want de HEERE verstokte het hart van Farao, de koning van Egypte, zodat hij de kinderen van Israël najaagde; maar de kinderen van Israël waren door een hoge hand uitgegaan.", "Deut 12:1-4": "Dit zijn de inzettingen en de rechten, die u zult onderhouden om te doen, in dat land dat de HEERE, de God van uw vaderen, u gegeven heeft om het in bezit te nemen; al de dagen die u op de aarde leeft. U zult volledig vernielen al de plaatsen waar de volken, die u zult verdrijven, hun goden gediend hebben; op de hoge bergen, en op de heuvels, en onder elke groene boom. En u zult hun altaren afbreken, en hun opgerichte beelden verbrijzelen, en hun gewijde bomen met vuur verbranden, en de gesneden beelden van hun goden omhakken; en u zult hun naam uitroeien uit die plaats.", "1 Tim 5:22": "Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.", "Ps 106:34": "Zij hebben die volken niet verdelgd, die de HEERE hun gezegd had;", "Num 27:14": "Omdat u tegen Mijn bevel opstandig bent geweest in de woestijn Zin, bij de twist van de vergadering, toen u Mij bij het water voor hun ogen had moeten heiligen. Dat is het water van Meriba, bij Kades, in de woestijn Zin.", "Num 34:13": "En Mozes gebood de kinderen van Israël en zei: Dit is het land dat u door het lot in erfbezit zult nemen, dat de HEERE aan de negen stammen en de halve stam van Manasse te geven geboden heeft.", "Hos 7:8": "Efraïm, die vermengt zich met de volken; Efraïm is een koek die niet is omgekeerd;", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "Ex 23:24": "U zult zich voor hun goden niet buigen, hen ook niet dienen; ook zult u niet doen naar hun werken; maar u zult ze geheel afbreken, en hun opgerichte beelden helemaal vermorzelen.", "Matt 24:12": "En omdat de ongerechtigheid zal toenemen, zal de liefde van velen verkillen.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "2 Petr 2:7": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft;", "Joz 15:32": "en Lebaoth, en Silhim, en Aïn, en Rimmon. Al deze steden zijn negenentwintig, met haar dorpen.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Num 9:1": "En de HEERE sprak tot Mozes in de woestijn van Sinaï, in het tweede jaar, nadat zij uit Egypteland uitgetogen waren, in de eerste maand, en Hij zei:", "Jes 15:2": "Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden.", "Ezra 9:7": "Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag.", "Num 11:4": "En het gemengde volk, dat in hun midden was, werd bevangen met lust; daarom weenden ook de kinderen van Israël weer, en zeiden: Wie zal ons vlees te eten geven?", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Jer 48:18": "Daal neer uit uw heerlijkheid, en woon in dorst, u inwoonster, u dochter van Dibon! Want de verwoester van Moab is tegen u opgetrokken, hij heeft uw vestingen verwoest.", "Spr 25:11": "Een woord, op zijn tijd gesproken, is als gouden appels in zilveren gebeelde schalen.", "Joz 17:1-13": "De stam van Manasse had ook een lot, omdat hij de eerstgeborene van Jozef was: te weten Machir, de eerstgeborene van Manasse, de vader van Gilead; omdat hij een krijgsman was, had hij Gilead en Bazan. Ook hadden de overgebleven kinderen van Manasse een lot, naar hun huisgezinnen: te weten de kinderen van Abiëzer, en de kinderen van Helek, en de kinderen van Asriël, en de kinderen van Sechem, en de kinderen van Hefer, en de kinderen van Semida. Dit zijn de mannelijke kinderen van Manasse, de zoon van Jozef, naar hun huisgezinnen. Zelafead nu, de zoon van Hefer, de zoon van Gilead, de zoon van Machir, de zoon van Manasse, had geen zonen, maar dochters; en dit zijn de namen van zijn dochters: Machla en Noa, Hogla, Milka en Tirza.", "Spr 5:8": "Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "Ex 25:10": "Zo zullen zij een ark van acaciahout maken; twee el en een halve zal haar lengte zijn, en anderhalve el haar breedte, en anderhalve el haar hoogte.", "Ezech 43:7-9": "En Hij zei tegen mij: Mensenkind! dit is de plaats van Mijn troon, en de plaats van de zolen van Mijn voeten, waar Ik wonen zal in het midden van de kinderen van Israël, in eeuwigheid; en zij van het huis van Israël zullen Mijn heilige Naam niet meer verontreinigen, zij noch hun koningen, met hun hoererij en met de dode lichamen van hun koningen, op hun hoogten; Als zij hun drempel stelden aan Mijn drempel, en hun post naast Mijn post, zodat er maar een wand tussen Mij en tussen hen was, en verontreinigden Mijn heilige Naam met hun gruwelen die zij deden; daarom heb Ik ze verteerd in Mijn toorn. Nu zullen zij hun hoererij en de dode lichamen van hun koningen ver van Mij wegdoen; en Ik zal in het midden van hen wonen in eeuwigheid.", "Spr 20:19": "Wie als een achterklapper rondgaat, openbaart het geheime; vermeng u dan niet met hem die met zijn lippen verlokt.", "Num 22:1": "Daarna reisden de kinderen van Israël, en legerden zich in de vlakke velden van Moab, aan deze zijde van de Jordaan tegenover Jericho.", "Joz 18:11-28": "En het lot van de stam van de kinderen van Benjamin kwam op, naar hun huisgezinnen; en het gebied van hun lot ging uit tussen de kinderen van Juda, en tussen de kinderen van Jozef. En hun gebied was aan de kant noordwaarts van de Jordaan; en dit gebied gaat omhoog aan de zijde van Jericho vanuit het noorden, en gaat omhoog door het gebergte westwaarts, en de uiteinden ervan zijn aan de woestijn van Beth-aven. En vandaar gaat het gebied door naar Luz, aan de zijde van Luz (dat is Beth-el), zuidwaarts; en dit gebied gaat af naar Atroth-addar, aan de berg, die aan de zuidzijde van het benedenste Beth-horon is.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Jes 19:1": "De last van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste.", "Jes 17:7": "Op die dag zal de mens zien naar Hem, Die hem gemaakt heeft, en zijn ogen zullen op de Heilige van Israël zien.", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Num 11:34": "Daarom noemt men de naam van die plaats Kibroth-Thaava; want daar begroeven zij het volk dat belust was geweest.", "Num 10:13": "Zo trokken zij als eerste op, naar het bevel van de HEERE, door de hand van Mozes.", "Num 12:16": "Maar daarna trok het volk verder van Hazeroth, en zij sloegen hun kamp op in de woestijn van Paran.", "Joz 16:1-4": "Daarna kwam het lot van de kinderen van Jozef uit: vanaf de Jordaan bij Jericho, aan het water van Jericho, oostwaarts, de woestijn opgaande van Jericho, door het gebergte van Beth-el; En het komt van Beth-el uit naar Luz; en het gaat door tot het gebied van de Archiet, tot Ataroth toe; En het gaat af tegen het westen naar het gebied van Jafleti, tot aan het gebied van het benedenste Beth-horon, en tot Gezer; en de uiteinden ervan zijn aan de zee.", "Ex 15:23": "Toen kwamen zij bij Mara; maar zij konden het water van Mara niet drinken, want het was bitter; daarom werd het Mara genoemd.", "Jer 10:15": "Ijdelheid zijn zij, een werk van verleidingen; ten tijde van hun bezoeking zullen zij vergaan.", "Joz 19:7": "Ain, Rimmon, en Ether, en Asan; vier steden en hun dorpen;", "Ex 1:11": "En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses.", "Ezech 25:9": "Daarom, zie, Ik zal de zijde van Moab openen, vanaf de steden, vanaf zijn steden die aan zijn grenzen liggen, het sieraad van het land, Beth-Jesimoth, Baäl-Meon, en tot Kirjathaïm toe;", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Jer 9:2": "Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop.", "Jes 1:23": "Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet.", "Ps 77:21": "U leidde Uw volk als een kudde door de hand van Mozes en Aäron.", "Spr 2:12": "Om u te redden van de kwade weg, van de man die verkeerdheden spreekt;", "Deut 32:51": "Omdat u zich tegen Mij vergrepen hebt, te midden van de kinderen van Israël, aan het twistwater bij Kades, in de woestijn Zin; omdat u Mij niet geheiligd hebt te midden van de kinderen van Israël.", "Ex 15:22": "Hierna liet Mozes de Israëlieten verder trekken vanaf de Schelfzee; en zij trokken uit naar de woestijn Sur, en zij gingen drie dagen in de woestijn, en vonden geen water.", "Num 13:21": "Zo trokken zij op, en verspiedden het land, van de woestijn Zin af tot Rechob toe, waar men komt bij Hamath.", "Ezech 6:14": "Daarom zal Ik Mijn hand over hen uitstrekken, en zal het land woest maken, ja, woester dan de woestijn, tot Diblath toe, in al hun woonplaatsen; en zij zullen bevinden dat Ik de HEERE ben.", "Ps 31:7": "Ik haat hen die op valse ijdelheden acht slaan, en ik vertrouw op de HEERE.", "Ef 5:7": "Wees dan geen medegenoten met hen.", "Ex 12:29": "En het gebeurde te middernacht, dat de HEERE alle eerstgeborenen in Egypteland sloeg, van de eerstgeborene van Farao af, die op zijn troon zou zitten, tot de eerstgeborene van de gevangene, die in de gevangenis was, en alle eerstgeborenen van het vee.", "Ex 14:22-31": "En de kinderen van Israël gingen het midden van de zee in, op het droge; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand. En de Egyptenaren vervolgden hen, en gingen achter hen aan, in het midden van de zee, met alle paarden van Farao, zijn wagens en zijn ruiters. En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "Lev 26:30": "En Ik zal uw hoogten verderven, en uw zonnebeelden uitroeien, en Ik zal uw dode lichamen op de dode lichamen van uw drekgoden werpen; en Mijn ziel zal van u walgen.", "Ex 40:17": "En het gebeurde in de eerste maand, in het tweede jaar, op de eerste van de maand, dat de tabernakel opgericht werd.", "Deut 10:11": "Maar de HEERE zei tegen mij: Sta op, ga verder op reis, voor het aangezicht van het volk, zodat zij binnengaan en het land in bezit nemen, dat Ik hun vaderen gezworen heb hun te geven.", "Jes 52:12": "Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.", "Ps 15:4": "In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Gal 5:9": "Een beetje zuurdesem verzuurt het hele deeg.", "Ex 13:4": "Vandaag gaat u uit, in de maand Abib.", "Deut 11:4": "En wat Hij gedaan heeft aan het leger van de Egyptenaren, aan hun paarden en aan hun wagens; dat Hij het water van de Schelfzee over hun aangezicht liet stromen, toen zij u van achteren vervolgden; en de HEERE hen wegvaagde, tot op deze dag;", "Ps 119:115": "Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.", "Ps 106:22": "wonderdaden in het land van Cham; ontzagwekkende dingen aan de Schelfzee.", "Deut 34:1": "Toen ging Mozes op vanaf de vlakke velden van Moab, naar de berg Nebo, op de hoogten van Pisga, die recht tegenover Jericho ligt; en de HEERE liet hem het hele land zien: Gilead tot Dan toe;", "Joz 15:1-12": "Het lot voor de stam van de kinderen van Juda, naar hun huisgezinnen, was: aan het gebied van Edom, de woestijn Zin, zuidwaarts, was het uiterste tegen het zuiden; zodat hun grens, tegen het zuiden, het uiterste van de Zoutzee was; van de tong af, die tegen het zuiden ziet; en zij gaat uit naar het zuiden tot de opgang van Akrabbim, en gaat door naar Zin, en gaat op van het zuiden naar Kades-barnea, en gaat door Hezron, en gaat op naar Adar, en gaat om Karkaa;", "Joz 23:6-13": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links; Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet; Maar de HEERE, uw God, zult u aanhangen, zoals u tot op deze dag gedaan hebt.", "Ps 106:42": "En hun vijanden hebben hen verdrukt, en zij zijn vernederd onder hun hand.", "Richt 2:1-3": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid. En wat u aangaat, u zult geen verbond maken met de inwoners van dit land; hun altaren zult u afbreken. Maar u bent Mijn stem niet gehoorzaam geweest; waarom hebt u dit gedaan? Daarom heb Ik ook gezegd: Ik zal hen voor uw aangezicht niet verdrijven; maar zij zullen u aan de zijden zijn, en hun goden zullen u tot een strik zijn.", "Deut 1:40": "U daarentegen, keer u om, en reis naar de woestijn, de weg van de Schelfzee.", "Spr 28:19": "Wie zijn land bouwt, zal met brood verzadigd worden; maar wie nietige mensen volgt, zal met armoede verzadigd worden.", "Joz 13:20": "En Beth-peor, en Asdoth-pisga, en Beth-jesimoth;", "Num 21:11": "Daarna reisden zij van Oboth, en legerden zich bij de heuvels van Abarim in de woestijn, die tegenover Moab is, tegen de opgang van de zon.", "Num 26:54": "Aan degenen die veel zijn, zult u hun erfenis meer maken, en aan hen die weinig zijn, zult u hun erfenis minder maken; aan ieder zal, naar zijn getelden, zijn erfenis gegeven worden.", "Micha 2:13": "De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits.", "Num 20:29": "Toen de hele vergadering zag dat Aäron overleden was, beweenden zij Aäron dertig dagen lang, het hele huis van Israël.", "Deut 7:5": "Maar zo zult u met hen doen: hun altaren zult u afbreken, en hun opgerichte beelden verbrijzelen, en hun gewijde bomen zult u omhakken, en hun gesneden beelden met vuur verbranden.", "Zef 2:11": "Vreselijk zal de HEERE tegen hen zijn, want Hij zal al de goden van de aarde doen uitteren; en ieder uit zijn plaats zal Hem aanbidden, alle eilanden van de heidenvolken.", "Deut 32:50": "En sterf op die berg, waarheen u zult opklimmen, en word verzameld tot uw volken; zoals uw broeder Aäron stierf op de berg Hor, en werd verzameld tot zijn volken.", "Jer 10:11": "(Zo zult u tegen hen zeggen: De goden, die de hemel en de aarde niet gemaakt hebben, zullen vergaan van de aarde, en van onder deze hemel.)", "Ex 23:32": "U zult met hen, noch met hun goden, een verbond sluiten.", "Ps 101:4": "Het verkeerde hart zal van mij wijken; de boze zal ik niet kennen.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Deut 7:26": "U zult dan de gruwel niet in uw huis brengen, anders wordt u zelf net zo verbannen als dat is; u zult het helemaal verafschuwen, en er volledig een gruwel van hebben, want het is verbannen.", "Ps 105:38": "Egypte was blij toen zij uittrokken, want hun verschrikking was op hen gevallen.", "Spr 1:14": "U zult uw lot midden onder ons werpen; wij zullen allen één buidel hebben.", "Richt 11:16": "want toen zij uit Egypte optrokken, wandelde Israël door de woestijn tot aan de Schelfzee, en kwam bij Kades.", "Deut 1:6": "De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.", "Jer 51:6": "Vlucht uit het midden van Babel, en red ieder zijn ziel; word niet uitgeroeid in haar ongerechtigheid; want dit is de tijd van de wraak van de HEERE, Die haar de verdienste betaalt.", "Jer 51:44": "En Ik zal bezoeking doen over Bel te Babel, en Ik zal uit zijn muil uithalen wat hij verslonden heeft; en de heidenvolken zullen niet meer naar hem toestromen; want ook Babels muur is gevallen.", "Ex 7:7": "En Mozes was tachtig jaar oud, en Aäron was drieëntachtig jaar oud, toen zij tegen Farao spraken.", "Num 20:28": "En Mozes trok Aäron zijn kleren uit, en hij trok ze zijn zoon Eleazar aan; en Aäron stierf daar, op de top van die berg. Toen kwamen Mozes en Eleazar van die berg af.", "Deut 12:30": "Wacht u ervoor dat u niet verstrikt raakt door hen te volgen, nadat zij voor uw aangezicht zullen verdelgd zijn; en dat u niet vraagt naar hun goden, en zegt: Zoals deze volken hun goden gediend hebben, zo zal ik ook doen.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Num 11:31-35": "Toen kwam er een wind van de HEERE, en die bracht kwakkels vanaf de zee, en strooide ze bij het leger, ongeveer een dagreis hierheen en ongeveer een dagreis daarheen, rondom het leger; en zij lagen ongeveer twee el boven de aarde. Toen maakte het volk zich op, die hele dag, en die hele nacht, en de hele volgende dag, en verzamelde de kwakkels; wie het minst had, had tien homers verzameld; en zij spreidden ze voor zichzelf uit rondom het leger. Dat vlees was nog tussen hun tanden, voordat het gekauwd was, toen ontstak de toorn van de HEERE tegen het volk, en de HEERE sloeg het volk met een zeer grote plaag.", "Richt 2:2": "En wat u aangaat, u zult geen verbond maken met de inwoners van dit land; hun altaren zult u afbreken. Maar u bent Mijn stem niet gehoorzaam geweest; waarom hebt u dit gedaan?", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Spr 14:7": "Ga weg van het gezicht van een dwaze man; want u zou bij hem geen lippen van kennis merken.", "Ex 13:18": "Maar God leidde het volk om, langs de weg van de woestijn bij de Schelfzee. De kinderen van Israël trokken nu gewapend op uit Egypteland.", "Ps 28:3": "Trek mij niet weg met de goddelozen, en met de werkers van de ongerechtigheid, die van vrede spreken met hun naasten, maar kwaad is er in hun hart.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Gen 47:11": "En Jozef zorgde voor woningen voor Jakob en zijn broers, en gaf hun een bezitting in Egypteland, in het beste deel van het land, in het land Rameses, zoals Farao geboden had.", "Num 20:22-29": "Toen braken zij op vanuit Kades; en de kinderen van Israël kwamen, de hele vergadering, aan de berg Hor. De HEERE nu sprak tot Mozes en tot Aäron, aan de berg Hor, aan de grens van het land van Edom, en zei: Aäron zal tot zijn volken verzameld worden; want hij zal niet komen in het land, dat Ik aan de kinderen van Israël gegeven heb, omdat u tegen Mijn mond opstandig geweest bent bij de wateren van Meriba.", "Ex 14:21": "Toen Mozes zijn hand uitstrekte over de zee, liet de HEERE de zee weggaan, door een sterke oostenwind, die hele nacht, en maakte de zee droog, en de wateren werden gekliefd.", "1 Sam 12:8": "Nadat Jakob in Egypte gekomen was, riepen uw vaders tot de HEERE; en de HEERE zond Mozes en Aäron, en zij leidden uw vaders uit Egypte, en lieten hen op deze plaats wonen.", "Num 34:4": "En deze grens zal voor u omgaan van het zuiden naar de opgang van Akrabbim, en doorgaan naar Zin; en haar uiteinden zullen zijn, vanaf het zuiden naar Kades-Barnea; en zij zal uitgaan naar Hazar-Addar, en doorgaan naar Azmon.", "Gen 19:15": "En toen de dageraad opging, drongen de engelen bij Lot aan en zeiden: Maak u klaar, neem uw vrouw, en uw twee dochters die hier zijn, opdat u niet omkomt door de ongerechtigheid van deze stad.", "Num 26:53-56": "Aan dezen zal het land uitgedeeld worden als erfenis, naar het getal van de namen. Aan degenen die veel zijn, zult u hun erfenis meer maken, en aan hen die weinig zijn, zult u hun erfenis minder maken; aan ieder zal, naar zijn getelden, zijn erfenis gegeven worden. Het land zal echter door het lot verdeeld worden; naar de namen van de stammen van hun vaderen zullen zij erven.", "Jes 43:17": "Die wagens en paarden, leger en macht voortbracht; samen zijn zij neergelegen, zij zullen niet weer opstaan, zij zijn uitgeblust, als een vlaswiek zijn zij uitgegaan.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "Ex 15:27": "Toen kwamen zij bij Elim, en daar waren twaalf waterbronnen, en zeventig palmbomen; en zij legerden zich daar aan de wateren.", "Deut 10:6": "(En de kinderen van Israël reisden van Beeroth-Bene-jaakan naar Mosera. Daar stierf Aäron, en werd daar begraven; en zijn zoon Eleazar bediende het priesterambt in zijn plaats.", "Openb 12:7-9": "En er kwam strijd in de hemel: Michaël en zijn engelen streden tegen de draak, en de draak streed, ook zijn engelen; En zij hebben het niet gewonnen, en hun plaats werd niet meer gevonden in de hemel. En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen.", "1 Kon 22:49": "En Josafat maakte schepen van Tharsis, om naar Ofir te gaan voor goud; maar zij gingen niet, want de schepen werden gebroken bij Ezeon-Geber.", "Num 20:23": "De HEERE nu sprak tot Mozes en tot Aäron, aan de berg Hor, aan de grens van het land van Edom, en zei:", "Ex 25:23": "U zult ook een tafel maken van acaciahout; twee el zal haar lengte zijn, en een el haar breedte, en een el en een halve zal haar hoogte zijn.", "Ps 106:7-11": "Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee. Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte. En Hij bestrafte de Schelfzee, zodat zij verdroogde, en Hij deed hen wandelen door de afgronden, als door een woestijn.", "Num 20:22": "Toen braken zij op vanuit Kades; en de kinderen van Israël kwamen, de hele vergadering, aan de berg Hor.", "Joz 15:3": "en zij gaat uit naar het zuiden tot de opgang van Akrabbim, en gaat door naar Zin, en gaat op van het zuiden naar Kades-barnea, en gaat door Hezron, en gaat op naar Adar, en gaat om Karkaa;", "Ex 19:1": "In de derde maand na het uittrekken van de kinderen van Israël uit Egypteland, op diezelfde dag kwamen zij in de woestijn Sinaï.", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "Num 34:3": "De zuiderkant nu zal voor u zijn vanaf de woestijn Zin, langs de zijden van Edom; en de zuidergrens zal voor u zijn vanaf het einde van de Zoutzee, in het oosten;", "2 Petr 2:8": "(want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden);", "Spr 12:11": "Wie zijn land bewerkt, zal met brood verzadigd worden; maar wie nutteloze mensen volgt, is verstandeloos.", "Jer 15:17": "Ik heb in de raad van de spotters niet gezeten, en ben ook niet van vreugde opgesprongen; vanwege Uw hand heb ik alleen gezeten, want U hebt mij met gramschap vervuld.", "Num 21:10": "Toen vertrokken de kinderen van Israël, en zij legerden zich te Oboth.", "Ex 23:33": "Zij zullen in uw land niet wonen, opdat zij u niet tegen Mij laten zondigen; als u hun goden dient, zal het u zeker tot een valstrik zijn.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Num 13:26": "En zij gingen heen, en kwamen tot Mozes en tot Aäron, en tot de hele vergadering van de kinderen van Israël, in de woestijn van Paran, naar Kades; en brachten hun bescheid terug, aan hen en aan de hele vergadering, en lieten hun de vrucht van het land zien.", "Joz 2:1": "Jozua, de zoon van Nun, had twee mannen die stiekem zouden verspieden, gestuurd vanuit Sittim, en hij zei: Ga op weg, bekijk het land en Jericho. Zij dan gingen op weg en kwamen bij het huis van een vrouw, een hoer, wier naam was Rachab, en zij sliepen daar.", "Num 16:21-26": "Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren! Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden? En de HEERE sprak tot Mozes, en zei:", "Spr 4:14": "Kom niet op het pad van de goddelozen, en betreed niet de weg van de bozen.", "Spr 12:26": "De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.", "Ex 15:11": "O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet?", "Spr 16:29": "Een man van geweld verlokt zijn naaste, en hij leidt hem op een weg die niet goed is.", "Jes 2:18": "En elk van de afgoden zal helemaal vergaan.", "Jer 48:22": "En over Dibon, en over Nebo, en over Beth-diblathaïm,", "Joz 23:13": "Weet voorzeker, dat de HEERE, uw God, niet zal voortgaan deze volken van voor uw aangezicht te verdrijven; maar zij zullen u zijn tot een strik, en tot een net, en tot een gesel aan uw zijden, en tot doornen in uw ogen, totdat u omkomt van dit goede land, dat de HEERE, uw God, u gegeven heeft.", "1 Kon 6:1": "Het gebeurde nu in het vierhonderdtachtigste jaar, na de uittocht van de kinderen van Israël uit Egypte, in het vierde jaar van het koninkrijk van Salomo over Israël, in de maand Ziv (dat is de tweede maand), dat hij het huis van de HEERE bouwde.", "Num 32:8": "Zo deden uw vaders, toen ik hen van Kades-Barnea zond om dit land te bezien.", "Ex 11:5": "En alle eerstgeborenen in Egypteland zullen sterven, van Farao's eerstgeborene af, die op zijn troon zitten zou, tot de eerstgeborene van de dienstmaagd, die achter de molen is, en alle eerstgeborenen van het vee.", "Deut 2:8": "Toen wij nu doorgetrokken waren van onze broeders, de kinderen van Ezau, die in Seir woonden, van de weg van het vlakke veld, van Elath en van Ezeon-Geber, keerden wij ons om en trokken de weg van de woestijn van Moab door.", "Deut 1:19": "Toen vertrokken wij van Horeb, en trokken door die hele grote en vreselijke woestijn, die u gezien hebt, op de weg van het gebergte van de Amorieten, zoals de HEERE, onze God, ons geboden had; en wij kwamen bij Kades-Barnea.", "Spr 2:16": "Om u te redden van de vreemde vrouw, van de onbekende, die met haar woorden vleit;", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Ex 12:2": "Deze maand zal voor u het begin van de maanden zijn; zij zal voor u de eerste van de maanden van het jaar zijn.", "Richt 1:21-36": "Doch de Benjaminieten hebben de Jebusieten, die in Jeruzalem woonden, niet verdreven; maar de Jebusieten woonden met de Benjaminieten in Jeruzalem, tot op deze dag. En het huis van Jozef trok ook op naar Beth-el. En de HEERE was met hen. En het huis van Jozef stuurde verspieders naar Beth-el; de naam van deze stad was voorheen Luz.", "2 Kor 6:14": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis?", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Deut 1:1": "Dit zijn de woorden die Mozes tot heel Israël gesproken heeft, aan deze kant van de Jordaan, in de woestijn, op het vlakke veld tegenover Suf, tussen Paran en Tofel, en Laban, en Hazeroth, en Dizahab.", "Ps 26:5": "Ik haat de vergadering van de boosdoeners, en bij de goddelozen zit ik niet.", "Num 25:1-9": "Israël verbleef te Sittim, en het volk begon te hoereren met de dochters van de Moabieten. En zij nodigden het volk tot de offers van hun goden; en het volk at, en boog zich neer voor hun goden. Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Deut 7:16": "U zult dan al die volken verteren, die de HEERE, uw God, u geven zal; uw oog zal hen niet ontzien, en u zult hun goden niet dienen; want dat zou u een valstrik zijn.", "Jes 2:16": "En tegen alle schepen van Tarsis, en tegen alle gewenste schilderijen.", "Ezech 29:7": "Toen zij u bij uw hand grepen, werd u gebroken, en spleet u al hun zijden; en toen zij op u leunden, werd u verbroken, en liet u al hun lenden stilstaan.", "Ex 12:37": "Zo reisden de kinderen van Israël uit van Rameses naar Sukkoth, ongeveer zeshonderdduizend te voet, alleen de mannen, behalve de kinderen.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Ps 136:13-15": "Hem, Die de Schelfzee in stukken deelde; want Zijn goedertierenheid is voor eeuwig. En Israël erdoorheen liet gaan; want Zijn goedertierenheid is voor eeuwig. Farao met zijn leger stortte Hij in de Schelfzee; want Zijn goedertierenheid is voor eeuwig.", "Num 26:56": "Naar het lot zal ieders erfenis verdeeld worden tussen de velen en de weinigen.", "Num 14:25": "De Amalekieten nu en de Kanaänieten wonen in het dal; keer u morgen om, en vertrek naar de woestijn, op de weg naar de Schelfzee.", "Jer 50:2": "Verkondig het onder de heidenvolken, en laat het horen, en steek een banier op, laat het horen, verberg het niet; zeg: Babel is ingenomen, Bel is beschaamd, Merodach is verpletterd, haar afgoden zijn beschaamd, haar drekgoden zijn verpletterd!", "Num 26:55": "Het land zal echter door het lot verdeeld worden; naar de namen van de stammen van hun vaderen zullen zij erven.", "Openb 2:16": "Bekeer u; en zo niet, Ik zal u haastig bij komen, en zal tegen hen strijd voeren met het zwaard van Mijn mond.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Ps 26:4": "Ik zit niet bij nietswaardige mensen, en met huichelaars ga ik niet om.", "Ps 78:53": "Ja, Hij leidde hen zeker, zodat zij niet vreesden; want de zee had hun vijanden overdekt.", "Num 10:11-13": "En het gebeurde in het tweede jaar, in de tweede maand, op de twintigste van de maand, dat de wolk omhoog gebracht werd van boven de tabernakel van de getuigenis. En de kinderen van Israël trokken op naar hun tochten, uit de woestijn Sinaï; en de wolk bleef in de woestijn Paran. Zo trokken zij als eerste op, naar het bevel van de HEERE, door de hand van Mozes.", "Lev 20:23": "En wandel niet in de gewoonten van het volk, dat Ik voor uw aangezicht wegjaag; want al deze dingen hebben zij gedaan; daarom ben Ik verdrietig op hen geworden.", "Spr 1:15": "Mijn zoon! wandel niet met hen op de weg; weer uw voet van hun pad.", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "Ex 14:9": "En de Egyptenaren joegen hen na en achterhaalden hen, terwijl zij zich gelegerd hadden aan de zee; met alle paarden, de wagens van Farao en zijn ruiters, en zijn leger; bij Pi-hachiroth, voor Baäl-zefon.", "Ex 14:2": "Spreek tot de kinderen van Israël, dat zij terugkeren en zich legeren voor Pi-hachiroth, tussen Migdol en de zee, voor Baäl-zefon; daar tegenover zult u zich legeren aan de zee.", "Jes 43:16": "Zo zegt de HEERE, Die in de zee een weg, en in de sterke wateren een pad maakte;", "Hos 4:17": "Efraïm is met de afgoden verbonden; laat hem begaan.", "1 Kon 9:26": "De koning Salomo maakte ook schepen te Ezeon-geber, dat bij Eloth is, aan de oever van de Schelfzee, in het land van Edom.", "Joz 19:1-48": "Daarna kwam het tweede lot uit voor Simeon, voor de stam van de kinderen van Simeon, naar hun huisgezinnen; en hun erfdeel was in het midden van het erfdeel van de kinderen van Juda. En zij hadden in hun erfdeel: Beer-seba, en Seba, en Molada, En Hazar-sual, en Bala, en Azem,", "Ex 16:1": "Toen zij van Elim vertrokken waren, kwam de hele gemeenschap van de Israëlieten in de woestijn Sin, die tussen Elim en Sinaï ligt, op de vijftiende dag van de tweede maand nadat zij uit Egypte weggegaan waren.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Gen 36:27": "Dit zijn de zonen van Ezer: Bilhan, en Zaävan, en Akan.", "Micha 5:12": "En Ik zal uw gesneden beelden en uw opgerichte beelden uit uw midden uitroeien, zodat u zich niet meer zult neerbuigen voor het werk van uw handen.", "Deut 32:49": "Klim op de berg Abarim (dit is de berg Nebo, die in het land van Moab is, tegenover Jericho), en zie het land Kanaän, dat Ik de kinderen van Israël tot een bezitting geven zal;", "Spr 22:25": "opdat u zijn paden niet leert, en een strik over uw ziel haalt.", "Ps 141:4": "Neig mijn hart niet tot een kwade zaak, om enige handel in goddeloosheid te bedrijven, met mannen die ongerechtigheid bedrijven; en laat mij niet eten van hun lekkernijen.", "Spr 24:1": "Wees niet jaloers op de slechte mensen, en laat u niet drijven om bij hen te zijn.", "Spr 23:20": "Wees niet onder de wijnzuipers, ook niet onder de vleesvreters;", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Joz 24:7": "Zij nu riepen tot de HEERE, en Hij bracht duisternis tussen u en de Egyptenaars, en Hij liet de zee over hen komen en bedekte hen; en uw ogen hebben gezien wat Ik in Egypte gedaan heb. Daarna hebt u lange tijd in de woestijn gewoond.", "Ps 101:7": "Wie bedrog pleegt, zal binnen mijn huis niet blijven; die leugens spreekt, zal voor mijn ogen niet bevestigd worden.", "Joz 24:6": "Toen Ik uw vaders uit Egypte geleid had, kwam u bij de zee, en de Egyptenaars achtervolgden uw vaders met wagens en met ruiters, tot aan de Schelfzee.", "Richt 4:2": "Zo verkocht de HEERE hen in de hand van Jabin, koning van de Kanaänieten, die te Hazor regeerde; en zijn legeraanvoerder was Sisera; hij woonde in Haroseth der heidenen.", "Ex 34:13": "Maar hun altaren zult u omverwerpen, en hun opgerichte beelden zult u verbreken, en hun gewijde palen zult u afhouwen.", "Neh 9:9-11": "En U hebt de ellende van onze vaderen in Egypte gezien, en U hebt hun geroep gehoord aan de Schelfzee; En U hebt tekenen en wonderen gedaan aan Farao, en aan al zijn knechten, en aan al het volk van zijn land; want U wist, dat zij trots tegen hen handelden; en U hebt U een Naam gemaakt, zoals het is op deze dag. En U hebt de zee voor hun aangezicht gekliefd, zodat zij in het midden van de zee op het droge zijn doorgegaan; en hun vervolgers hebt U in de diepten geworpen, als een steen in sterk water.", "Ex 15:4": "Hij heeft Farao's wagens en zijn leger in de zee geworpen; en de keur van zijn hoofdlieden zijn verdronken in de Schelfzee.", "Spr 4:15": "Verwerp die, ga er niet doorheen; wijk ervan af, en ga voorbij.", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Num 33:30-32": "En zij vertrokken van Hasmona, en legerden zich in Moseroth. En zij vertrokken van Moseroth, en legerden zich in Bene-jaakan. En zij vertrokken van Bene-jaakan, en legerden zich in Hor-gidgad.", "Num 9:17-23": "Maar nadat de wolk werd opgeheven van boven de tent, zo trokken daarna ook de kinderen van Israël verder; en op de plaats waar de wolk bleef, daar legerden de kinderen van Israël zich. Naar het bevel van de HEERE trokken de kinderen van Israël verder, en naar het bevel van de HEERE legerden zij zich; al de dagen dat de wolk over de tabernakel bleef, legerden zij zich. En als de wolk veel dagen over de tabernakel verbleef, dan namen de kinderen van Israël de wacht van de HEERE waar, en trokken niet verder.", "Ps 106:41": "En Hij gaf hen in de hand van de heidenen, en hun haters heersten over hen.", "Joz 23:12": "Want als u enigszins afkeert, en het overige van deze volken aanhangt, van deze, die bij u overgebleven zijn, en u met hen verzwagert, en u tot hen ingaat, en zij tot u;", "Hos 10:2": "Hij heeft hun hart verdeeld, nu zullen zij schuldig bevonden worden; Hij zal hun altaren afbreken, Hij zal hun opgerichte beelden vernielen.", "Ex 17:1-8": "Daarna trok de hele gemeenschap van de kinderen van Israël, volgens hun dagreizen, uit de woestijn Sin, op bevel van de HEERE, en zij legerden zich bij Rafidim. Daar was echter geen water voor het volk om te drinken. Toen maakte het volk ruzie met Mozes, en zei: Geef ons water, zodat wij kunnen drinken! Mozes zei tegen hen: Waarom maakt u ruzie met mij? Waarom stelt u de HEERE op de proef? Toen het volk daar dorstte naar water, morde het volk tegen Mozes, en het zei: Waarom hebt u ons nu uit Egypte laten wegtrekken, om mij, en mijn kinderen, en mijn vee, van dorst te laten sterven?", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Deut 10:5": "En ik keerde mij om, en ging van de berg af, en legde de platen in de kist die ik gemaakt had; en daar zijn ze, zoals de HEERE mij geboden heeft.", "Ezech 28:24": "En het huis van Israël zal geen pijnlijke doorn meer hebben, en geen pijn veroorzakende distel, van allen die rondom hen zijn, die hen beroven; en zij zullen weten dat Ik de Heere HEERE ben.", "Num 10:6": "Maar als u ten tweeden male met geschal van alarm blazen zult, zullen de legers die tegen het zuiden legeren, optrekken; met geschal van alarm zullen zij blazen tot hun tochten.", "2 Kron 20:36": "En hij verbond zich met hem om schepen te maken, om naar Tharsis te gaan; en zij maakten de schepen in Ezeon-Geber.", "Ps 106:34-36": "Zij hebben die volken niet verdelgd, die de HEERE hun gezegd had; maar zij vermengden zich met de heidenen, en leerden daarvan de werken. En zij dienden hun afgoden, en die werden hun tot een strik.", "Spr 22:24": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;", "Jes 2:20": "Op die dag zal de mens zijn zilveren afgoden, en zijn gouden afgoden, die zij zich gemaakt hadden, om zich daarvoor neer te buigen, wegwerpen voor de mollen en de vleermuizen;", "Joz 15:1": "Het lot voor de stam van de kinderen van Juda, naar hun huisgezinnen, was: aan het gebied van Edom, de woestijn Zin, zuidwaarts, was het uiterste tegen het zuiden;", "Spr 29:24": "Wie met een dief deelt, haat zijn eigen leven; hij hoort een vervloeking, en geeft het niet te kennen.", "2 Tim 3:5": "met een schijn van godzaligheid, maar de kracht daarvan verloochenend. Heb ook een afkeer van hen.", "2 Kron 19:2": "En Jehu, de zoon van Hanani, de ziener, ging naar buiten, hem tegemoet, en zei tegen koning Josafat: Zou u de goddeloze helpen, en hen liefhebben die de HEERE haten? Daarom is er nu van het aangezicht van de HEERE grote toorn over u.", "Ps 139:21": "Zou ik niet haten, HEERE, wie U haten? En verdriet hebben over wie tegen U opstaan?", "Ex 12:12": "Want Ik zal in deze nacht door Egypteland gaan, en alle eerstgeborenen in Egypteland slaan, van de mensen af tot de dieren toe; en Ik zal gerichten oefenen aan al de goden van de Egyptenaren, Ik, de HEERE!", "Joz 2:10": "Want wij hebben gehoord dat de HEERE het water van de Schelfzee heeft laten opdrogen voor u, toen u uit Egypte trok; en wat u gedaan hebt aan de twee koningen van de Amorieten, Sihon en Og, die aan de overkant van de Jordaan waren, die u met de ban geslagen hebt.", "Num 34:8": "Vanaf de berg Hor zult u de grens aftekenen tot waar men bij Hamath komt; en de uiteinden van deze grens zullen bij Zedad zijn.", "Zach 13:2": "En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen.", "Num 21:4": "Toen reisden zij van de berg Hor, op de weg naar de Schelfzee, om het land van de Edomieten heen te trekken; maar de ziel van het volk werd verdrietig op deze weg.", "Richt 2:3": "Daarom heb Ik ook gezegd: Ik zal hen voor uw aangezicht niet verdrijven; maar zij zullen u aan de zijden zijn, en hun goden zullen u tot een strik zijn.", "Ps 105:36": "Hij versloeg ook alle eerstgeborenen in hun land, de eerstelingen van al hun krachten.", "Deut 7:4": "Want zij zouden uw zonen van Mij doen afwijken, zodat zij andere goden zouden dienen; en de toorn van de HEERE zou tegen u ontsteken, en u snel verdelgen.", "Spr 22:10": "Jaag de spotter weg, en het gekijf zal weggaan, en het geschil met de schande zal ophouden.", "Ex 34:12-15": "Wacht u ervoor dat u toch geen verbond maakt met de inwoner van het land, waarin u komen zult; dat hij misschien niet tot een valstrik wordt in uw midden. Maar hun altaren zult u omverwerpen, en hun opgerichte beelden zult u verbreken, en hun gewijde palen zult u afhouwen. (Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!)", "Ex 17:1": "Daarna trok de hele gemeenschap van de kinderen van Israël, volgens hun dagreizen, uit de woestijn Sin, op bevel van de HEERE, en zij legerden zich bij Rafidim. Daar was echter geen water voor het volk om te drinken.", "Num 32:34": "En de kinderen van Gad bouwden Dibon, en Ataroth, en Aroer,", "Ex 15:19": "Want Farao's paard, met zijn wagen, met zijn ruiters, is in de zee gekomen, en de HEERE heeft de wateren van de zee over hen laten terugkeren; maar de kinderen van Israël zijn op het droge midden door de zee gegaan.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "Lev 26:1": "U zult voor uzelf geen afgoden maken; ook geen gesneden beeld of opgericht beeld zult u zich stellen, en geen gebeelde steen zult u in uw land zetten, om u daarvoor te buigen; want Ik ben de HEERE, uw God!", "Ex 12:30": "En Farao stond 's nachts op, hij en al zijn dienaren, en alle Egyptenaren; en er was een groot geschreeuw in Egypte; want er was geen huis waarin niet een dode was.", "Jes 31:7": "Want op die dag zullen zij verwerpen, ieder zijn zilveren afgoden en zijn gouden afgoden, die uw eigen handen tot zonde gemaakt hadden;", "1 Kron 1:43": "Dit nu zijn de koningen die geregeerd hebben in het land van Edom, voordat er een koning regeerde over de kinderen van Israël: Bela, de zoon van Beor; en de naam van zijn stad was Dinhaba.", "Jes 17:8": "En hij zal niet meer aanschouwen de altaren, het werk van zijn handen, ook wat zijn vingers gemaakt hebben, zal hij niet meer aanzien, noch de bossen, noch de zonnebeelden.", "Ps 120:5-7": "O, wee mij, dat ik een vreemdeling ben in Mesech, dat ik in de tenten van Kedar woont. Mijn ziel heeft lang gewoond bij hen die de vrede haten. Ik ben vreedzaam; maar als ik spreek, zijn zij uit op oorlog.", "Spr 2:11": "Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden;", "Jer 51:47": "Daarom zie, de dagen komen dat Ik bezoeking zal doen over de gesneden beelden van Babel; en haar hele land zal beschaamd worden, en al haar verslagenen zullen in haar midden liggen.", "Pred 9:18": "De wijsheid is beter dan oorlogswapens, maar één zondaar verderft veel goeds.", "Spr 13:20": "Die met de wijzen omgaat, zal wijs worden; maar die de metgezel van de dwazen is, zal verbroken worden.", "Ex 15:1": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen.", "Jer 51:52": "Daarom zie, de dagen komen, spreekt de HEERE, dat Ik bezoeking doen zal over haar gesneden beelden; en de dodelijk gewonde zal kermen in haar hele land.", "Jes 21:9": "En zie nu, daar komt een wagen mannen, met een span ruiters! Toen antwoordde hij en zei: Babel is gevallen, zij is gevallen! En al de gesneden beelden van haar goden heeft Hij tegen de grond verbrijzeld.", "2 Tess 3:6": "En wij bevelen u, broeders, in de Naam van onze Heere Jezus Christus, dat u zich onttrekt van iedere broeder die ongeregeld wandelt, en niet naar de overlevering die hij van ons ontvangen heeft.", "1 Kor 10:2": "en zij zijn allen in Mozes gedoopt in de wolk en in de zee;", "Ps 26:9": "Raap mijn ziel niet weg met de zondaars, en mijn leven niet met de mannen van het bloed;", "Jer 2:25": "Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ex 17:8": "Toen kwam Amalek en streed tegen Israël bij Rafidim.", "2 Sam 22:16": "En de diepe kolken van de zee werden gezien, de bodems van de wereld werden ontdekt, door het schelden van de HEERE, van het geblaas van de wind van Zijn neus.", "Micha 6:4": "Zeker heb Ik u uit Egypteland opgevoerd, en u uit het diensthuis verlost; en Ik heb voor uw aangezicht Mozes, Aäron en Mirjam heen gezonden.", "Ex 13:15": "Want het gebeurde, toen de farao zich verhardde om ons te laten gaan, dat de HEERE alle eerstgeborenen in Egypteland doodde, van de eerstgeborene van de mens af tot de eerstgeborene van het vee; daarom offer ik aan de HEERE de mannetjes van alles wat de baarmoeder opent; maar alle eerstgeborenen van mijn zonen koop ik vrij.", "Joz 24:5": "Toen zond Ik Mozes en Aäron, en Ik trof Egypte met plagen, zoals Ik in hun midden gedaan heb; en daarna leidde Ik u daaruit.", "Jes 27:9": "Daarom zal daardoor de ongerechtigheid van Jakob verzoend worden, en dit is de hele vrucht, dat Hij zijn zonde zal wegdoen: wanneer Hij alle stenen van het altaar maakt als verstrooide kalkstenen, zullen de bossen en de zonnebeelden niet blijven bestaan.", "Ex 19:2": "Want zij vertrokken uit Rafidim, en kwamen in de woestijn Sinaï, en zij legerden zich in de woestijn; Israël nu legerde zich daar tegenover die berg.", "Num 11:35": "Van Kibroth-Thaava trok het volk verder naar Hazeroth; en zij bleven in Hazeroth.", "Spr 1:10": "Mijn zoon! als de zondaars u aanlokken, stem er niet mee in;", "2 Kor 6:15": "En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige?", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Ps 106:35": "maar zij vermengden zich met de heidenen, en leerden daarvan de werken.", "Ex 13:20": "Zo braken zij op uit Sukkoth; en zij sloegen hun kamp op in Etham, aan de rand van de woestijn.", "Deut 2:1-3": "Daarna keerden wij ons, en reisden naar de woestijn, de weg van de Schelfzee, zoals de HEERE tot mij gesproken had, en wij trokken om het gebergte Seir, veel dagen. Toen zei de HEERE tegen mij: U hebt dit gebergte lang genoeg omgetrokken; keer u naar het noorden;", "Spr 23:6": "Eet niet het brood van hem die boos is van oog, en wees niet belust op zijn smakelijke gerechten;", "Ex 23:2": "U zult de menigte niet volgen tot boze zaken; en u zult niet spreken in een geschil om u naar de menigte te neigen, om het recht te buigen.", "Lev 18:3": "U zult niet doen naar de werken van het Egyptische land, waarin u gewoond hebt; en naar de werken van het land Kanaän, waarheen Ik u breng, zult u niet doen, en u zult in hun inzettingen niet wandelen.", "Hebr 11:29": "Door het geloof zijn zij door de Rode Zee getrokken, als over droog land; en toen de Egyptenaren dat ook probeerden, zijn zij verdronken.", "Num 21:1-3": "Toen de Kanaäniet, de koning van Harad, die woonde in het zuiden, hoorde dat Israël door de weg van de verspieders kwam, streed hij tegen Israël, en hij voerde enige gevangenen uit hen gevankelijk weg. Toen beloofde Israël de HEERE een gelofte en zei: Als U dit volk geheel in mijn hand geeft, zal ik hun steden verbannen. De HEERE dan verhoorde de stem van Israël, en gaf de Kanaänieten over; en Israël verbande hen en hun steden; en men noemde de naam van die plaats Horma."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H4550\">Dit</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4550\">zijn</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4550\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4550\">reizen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4550\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3478\">Israël</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H776\">die</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H776\">uit</span> het land Egypte <span class=\"wl\" data-l=\"L5\" data-code=\"H3318\">uitgetogen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3318\">zijn</span>, naar <span class=\"wl\" data-l=\"L6 \"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> with their <span class=\"wl wl-kjv\" data-code=\"H6635\">armies</span> under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and Aaron.", "2": "And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> their goings <span class=\"wl wl-kjv\" data-code=\"H4161\">out</span> according to their <span class=\"wl wl-kjv\" data-code=\"H4550\">journeys</span> by the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and these are their <span class=\"wl wl-kjv\" data-code=\"H4550\">journeys</span> according to their goings out.", "3": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H7486\">Rameses</span> in the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> on the <span class=\"wl wl-kjv\" data-code=\"H6240\">fifteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month;</span> on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow</span> after the <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> with an <span class=\"wl wl-kjv\" data-code=\"H7311\">high</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of all the Egyptians.", "4": "For the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> all their <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> among them: upon their <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> also the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">executed</span> judgments.", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H7486\">Rameses,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Succoth.", "6": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H5523\">Succoth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in <span class=\"wl wl-kjv\" data-code=\"H864\">Etham,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H7097\">edge</span> of the wilderness.", "7": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H864\">Etham,</span> and turned <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto <span class=\"wl wl-kjv\" data-code=\"H6367\">Pihahiroth,</span> which is before <span class=\"wl wl-kjv\" data-code=\"H1189\">Baalzephon:</span> and they <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Migdol.", "8": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6367\">Pihahiroth,</span> and passed <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H8432
