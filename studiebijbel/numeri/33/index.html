t of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H5512\">Sin,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in Dophkah.", "13": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H1850\">Dophkah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in Alush.", "14": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H442\">Alush,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at <span class=\"wl wl-kjv\" data-code=\"H7508\">Rephidim,</span> where was no <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to drink.", "15": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H7508\">Rephidim,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of Sinai.", "16": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from the <span class=\"wl wl-kjv\" data-code=\"H4057\">desert</span> of <span class=\"wl wl-kjv\" data-code=\"H5514\">Sinai,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> at Kibrothhattaavah.", "17": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H6914\">Kibrothhattaavah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Hazeroth.", "18": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H2698\">Hazeroth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Rithmah.", "19": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H7575\">Rithmah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> at Rimmonparez.", "20": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H7428\">Rimmonparez,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Libnah.", "21": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H3841\">Libnah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> at Rissah.", "22": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed</span> from <span class=\"wl wl-kjv\" data-code=\"H7446\">Rissah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Kehelathah.", "23": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">went</span> from <span class=\"wl wl-kjv\" data-code=\"H6954\">Kehelathah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Shapher.", "24": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H8234\">Shapher,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in Haradah.", "25": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H2732\">Haradah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Makheloth.", "26": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H4722\">Makheloth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Tahath.", "27": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H8480\">Tahath,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> at Tarah.", "28": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H8646\">Tarah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Mithcah.", "29": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">went</span> from <span class=\"wl wl-kjv\" data-code=\"H4989\">Mithcah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Hashmonah.", "30": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H2832\">Hashmonah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Moseroth.", "31": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H4149\">Moseroth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Benejaakan.", "32": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H1142\">Benejaakan,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Horhagidgad.", "33": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">went</span> from <span class=\"wl wl-kjv\" data-code=\"H2735\">Horhagidgad,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Jotbathah.", "34": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H3193\">Jotbathah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Ebronah.", "35": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H5684\">Ebronah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> at Eziongaber.", "36": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H6100\">Eziongaber lass=\"wl wl-kjv\" data-code=\"H1366\">border</span> of Moab.", "45": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H5864\">Iim,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in Dibongad.", "46": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H1769\">Dibongad,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in Almondiblathaim.", "47": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> from <span class=\"wl wl-kjv\" data-code=\"H5963\">Almondiblathaim,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H5682\">Abarim,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Nebo.", "48": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H5682\">Abarim,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in the <span class=\"wl wl-kjv\" data-code=\"H6160\">plains</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> by <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> near Jericho.", "49": "And they <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> by <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> from <span class=\"wl wl-kjv\" data-code=\"H1020\">Bethjesimoth</span> even unto <span class=\"wl wl-kjv\" data-code=\"H63\">Abelshittim</span> in the <span class=\"wl wl-kjv\" data-code=\"H6160\">plains</span> of Moab.", "50": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> in the <span class=\"wl wl-kjv\" data-code=\"H6160\">plains</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> by <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> near <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho,</span> saying,", "51": "<span class=\"wl wl-kjv\" data-code=\"H1696\">Speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, When ye are passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Canaan;", "52": "Then ye shall drive <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you, and <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> all their <span class=\"wl wl-kjv\" data-code=\"H4906\">pictures,</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> all their <span class=\"wl wl-kjv\" data-code=\"H4541\">molten</span> <span class=\"wl wl-kjv\" data-code=\"H6754\">images,</span> and quite pluck <span class=\"wl wl-kjv\" data-code=\"H8045\">down</span> all their high places:", "53": "And ye shall <span class=\"wl wl-kjv\" data-code=\"H3423\">dispossess</span> the inhabitants of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein: for I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> to possess", "54": "And ye shall <span class=\"wl wl-kjv\" data-code=\"H5157\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> by <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> for an <span class=\"wl wl-kjv\" data-code=\"H5157\">inheritance</span> among your <span class=\"wl wl-kjv\" data-code=\"H4940\">families:</span> and to the <span class=\"wl wl-kjv\" data-code=\"H7227\">more</span> ye shall give the <span class=\"wl wl-kjv\" data-code=\"H7235\">more</span> <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4592\">fewer</span> ye shall give the <span class=\"wl wl-kjv\" data-code=\"H4591\">less</span> <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance:</span> every man's inheritance shall be in the place where his <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">falleth;</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribes</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> ye shall inherit.", "55": "But if ye will not drive <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you; then it shall come to pass, that those which ye let <span class=\"wl wl-kjv\" data-code=\"H3498\">remain</span> of them shall be <span class=\"wl wl-kjv\" data-code=\"H7899\">pricks</span> in your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H6796\">thorns</span> in your <span class=\"wl wl-kjv\" data-code=\"H6654\">sides,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6887\">vex</span> you in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> wherein ye dwell.", "56": "Moreover it shall come to pass, that I shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto you, as I <span class=\"wl wl-kjv\" data-code=\"H1819\">thought</span> to do"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
