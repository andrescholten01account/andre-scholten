ten het leger; zoals de HEERE tot Mozes gesproken had, zo deden de kinderen van Israël.","5":"Verder sprak de HEERE tot Mozes en zei:","6":"Spreek tot de kinderen van Israël: Wanneer een man of een vrouw iets van enige menselijke zonden gedaan zal hebben, door overtreding tegen de HEERE overtreden hebbend, dan is die ziel schuldig.","7":"En zij zullen hun zonde die zij gedaan hebben belijden; daarna zal hij zijn schuld weer uitkeren, naar de hoofdsom daarvan, en het vijfde deel daarvan zal hij daarboven toevoegen, en zal het geven aan degene aan wie hij zich schuldig gemaakt heeft.","8":"Maar als die man geen losser zal hebben om de schuld aan hem weer uit te keren, zal die schuld, die aan de HEERE weer uitgekeerd wordt, van de priester zijn; behalve de ram van de verzoening, waarmee hij voor hem verzoening doen zal.","9":"Evenzo zal alle heffing van alle geheiligde dingen van de kinderen van Israël, die zij tot de priester brengen, van hem zijn.","10":"En ieders geheiligde dingen zullen van hem zijn; wat iemand de priester zal gegeven hebben, zal van hem zijn.","11":"Verder sprak de HEERE tot Mozes en zei:","12":"Spreek tot de kinderen van Israël, en zeg tot hen: Wanneer de vrouw van iemand afgeweken zal zijn, en door overtreding tegen hem overtreden zal hebben,","13":"Doordat een man gemeenschap met haar gehad heeft, en het voor de ogen van haar man verborgen zal zijn, en zij zich verheeld zal hebben, terwijl zij toch onrein geworden is; en er geen getuige tegen haar is, en zij niet op heterdaad betrapt is;","14":"En de ijvergeest over hem gekomen is, zodat hij ijvert over zijn huisvrouw, omdat zij onrein geworden is; of dat over hem de ijvergeest gekomen is, zodat hij over zijn huisvrouw ijvert, hoewel zij niet onrein geworden is;","15":"Dan zal die man zijn huisvrouw tot de priester brengen, en zal haar offerande voor haar meebrengen, een tiende deel van een efa[1] gerstemeel; hij zal geen olie daarop gieten, en geen wierook daarop leggen, omdat het een spijsoffer van de ijveringen is, een spijsoffer van de gedachtenis, dat de ongerechtigheid in gedachtenis brengt.","16":"En de priester zal haar doen naderen; hij zal haar stellen voor het aangezicht van de HEERE.","17":"En de priester zal heilig water in een aarden vat nemen; en van het stof dat op de vloer van de tabernakel is, zal de priester nemen, en in het water doen.","18":"Daarna zal de priester de vrouw voor het aangezicht van de HEERE stellen, en zal het hoofd van de vrouw ontbloten, en zal het spijsoffer van de gedachtenis op haar handen leggen, dat het spijsoffer van de ijveringen is; en in de hand van de priester zal dat bittere water zijn, dat de vloek meebrengt.","19":"En de priester zal haar beëdigen, en zal tegen die vrouw zeggen: Als niemand bij u gelegen heeft, en als u, onder uw man zijnde, niet afgeweken bent tot onreinheid, wees vrij van dit bittere water dat de vloek meebrengt!","20":"Maar als u, onder uw man zijnde, afgeweken bent, en als u onrein geworden bent, doordat een man bij u gelegen heeft, behalve uw man:","21":"(Dan zal de priester die vrouw met de eed van de vervloeking beëdigen, en de priester zal tegen die vrouw zeggen:) De HEERE stelt u tot een vloek en tot een eed, in het midden van uw volk, doordat de HEERE uw heup laat vervallen, en uw buik laat zwellen;","22":"Dat dit water, dat de vervloeking meebrengt, in uw ingewand ingaat, om de buik te doen zwellen, en de heup te doen vervallen! Dan zal die vrouw zeggen: Amen, amen!","23":"Daarna zal de priester deze vervloekingen op een briefje schrijven, en hij zal het met het bittere water uitwissen.","24":"En hij zal die vrouw dat bittere water, dat de vervloeking meebrengt, te drinken geven, zodat het water, dat de vervloeking meebrengt, in haar tot bitterheid ingaat.","25":"En de priester zal uit de hand van die vrouw het spijsoffer van de ijveringen nemen, en hij zal dat spijsoffer voor het aangezicht van de HEERE bewegen, en zal dat op het altaar offeren.","26":"De priester zal ook van dat spijsoffer, het gedenkoffer ervan, een handvol grijpen, en zal het op het altaar in rook doen opgaan; en daarna zal hij dat water die vrouw te drinken geven.","27":"Als hij haar nu dat water te drinken gegeven zal hebben, zal het gebeuren, indien zij onrein geworden is, en tegen haar man door overtreding overtreden zal hebben, dat het water dat de vervloeking meebrengt tot bitterheid in haar ingaan zal, en haar buik zwellen, en haar heup vervallen zal; en die vrouw zal in het midden van haar volk tot een vloek zijn.","28":"Maar indien de vrouw niet onrein geworden is, maar rein is, dan zal zij vrij zijn, en zal met kinderen gezegend worden.","29":"Dit is de wet van de ijveringen, wanneer een vrouw, onder haar man zijnde, afwijkt en onrein wordt;","30":"Of wanneer over een man die ijvergeest zal gekomen zijn, en hij over zijn huisvrouw geijverd zal hebben, dat hij de vrouw voor het aangezicht van de HEERE stelt, en de priester aan haar deze hele wet volbrengt.","31":"En de man zal van de ongerechtigheid onschuldig zijn; maar die vrouw zal haar ongerechtigheid dragen."},"SV":{"1":"En de HEERE sprak tot Mozes, zeggende:","2":"Gebied den kinderen Israëls, dat zij uit het leger wegzenden alle melaatsen, en alle vloeienden, en allen, die onrein *zijn* van een dode.","3":"Van den man tot de vrouw toe zult gij hen wegzenden; tot buiten het leger zult gij hen wegzenden; opdat zij niet verontreinigen hun legers, in welker midden Ik wone.","4":"En de kinderen Israëls deden alzo, en zonden hen tot buiten het leger; gelijk de HEERE tot Mozes gesproken had, alzo deden de kinderen Israëls.","5":"Verder sprak de HEERE tot Mozes, zeggende:","6":"Spreek tot de kinderen Israëls: Wanneer een man of een vrouw iets van enige menselijke zonden gedaan zullen hebben, overtreden hebbende door overtreding tegen den HEERE, zo is diezelve ziel schuldig.","7":"En zij zullen hun zonde, welke zij gedaan hebben, belijden; daarna zal hij zijn schuld weder uitkeren, naar de hoofdsom daarvan, en derzelfder vijfde deel zal hij daarboven toedoen, en zal het dien geven, aan wien hij zich verschuldigd heeft.","8":"Maar zo die man geen losser zal hebben, om de schuld aan hem weder uit te keren, zal die schuld, welken den HEERE weder uitgekeerd wordt, des priesters zijn; behalve den ram der verzoening, met welken hij voor hem verzoening doen zal.","9":"Desgelijks zal alle heffing van alle geheiligde dingen der kinderen Israëls, welke zij tot den priester brengen, zijne zijn.","10":"En een ieders geheiligde dingen zullen zijne zijn; wat iemand den priester zal gegeven hebben, zal zijne zijn.","11":"Wijders sprak de HEERE tot Mozes, zeggende:","12":"Spreek tot de kinderen Israëls, en zeg tot hen: Wanneer van iemand zijn huisvrouw zal afgeweken zijn, en door overtreding tegen hem overtreden zal hebben;","13":"Dat een man bij haar door bijligging des zaads zal gelegen hebben, en het voor de ogen haars mans zal verborgen zijn, en zij zich verheeld zal hebben, zijnde nochtans onrein geworden; en geen getuige tegen haar is, en zij niet betrapt is;","14":"En de ijvergeest over hem gekomen is, dat hij ijvert over zijn huisvrouw, dewijl zij onrein geworden is; of dat over hem de ijvergeest gekomen is, dat hij over zijn huisvrouw ijvert, hoewel zij niet onrein geworden is;","15":"Dan zal die man zijn huisvrouw tot den priester brengen, en zal haar offerande voor haar medebrengen, een tiende deel van een efa gerstemeel; hij zal geen olie daarop gieten, noch wierook daarop leggen, dewijl het een spijsoffer der ijveringen is, een spijsoffer der gedachtenis, dat de ongerechtigheid in gedachtenis brengt.","16":"En de priester zal haar doen naderen; hij zal haar stellen voor het aangezicht des HEEREN.","17":"En de priester zal heilig water in een aarden vat nemen; en van het stof, hetwelk op den vloer des tabernakels is, zal de priester nemen, en in het water doen.","18":"Daarna zal de priester de vrouw voor het aangezicht des HEEREN stellen, en zal het hoofd van de vrouw ontbloten, en zal het spijsoffer der gedachtenis op haar handen leggen, hetwelk het spijsoffer der ijveringen is; en in de hand des priesters zal dat bitter water zijn, hetwelk den vloek medebrengt.","19":"En de priester zal haar beedigen, en zal tot die vrouw zeggen: Indien iemand bij u gelegen heeft, en indien gij, onder uw man zijnde, niet afgeweken zijt tot onreinigheid, wees vrij van dit bitter water, hetwelk den vloek medebrengt!","20":"Maar zo gij, onder uw man zijnde, afgeweken zijt, en zo gij onrein geworden zijt, dat een man bij u gelegen heeft, behalve uw man:","21":"(Dan zal de priester die vrouw met den eed der vervloeking beedigen, en de priester zal tot die vrouw zeggen:) De HEERE zette u tot een vloek, en tot een eed, in het midden uws volks, mits dat de HEERE uw heup vervallende, en uw buik zwellende make;","22":"Dat ditzelve water, hetwelk de vervloeking medebrengt, in uw ingewand inga, om den buik te doen zwellen, en de heup te doen vervallen! Dan zal die vrouw zeggen: Amen, amen!","23":"Daarna zal de priester deze zelfde vloeken op een cedeltje schrijven, en hij zal het met het bitter water uitdoen.","24":"En hij zal die vrouw dat bitter water, hetwelk de vervloeking medebrengt, te drinken geven, dat het water, hetwelk de vervloeking medebrengt, in haar tot bitterheden inga.","25":"En de priester zal uit de hand van die vrouw het spijsoffer der ijveringen nemen, en hij zal datzelve spijsoffer voor het aangezicht des HEEREN bewegen, en zal dat op het altaar offeren.","26":"De priester zal ook van dat spijsoffer, deszelfs gedenkoffer, een handvol grijpen, en zal het op het altaar aansteken; en daarna zal hij dat water die vrouw te drinken geven.","27":"Als hij haar nu dat water zal te drinken gegeven hebben, het zal geschieden, indien zij onrein geworden is, en tegen haar man door overtreding zal overtreden hebben, dat het water, hetwelk vervloeking medebrengt, tot bitterheid in haar ingaan zal, en haar buik zwellen, en haar heup vervallen zal; en die vrouw zal in het midden van haar volk tot een vloek zijn.","28":"Doch indien de vrouw niet onrein geworden is, maar rein is, zo zal zij vrij zijn, en zal met zaad bezadigd worden.","29":"Dit is de wet der ijveringen, als een vrouw, onder haar man zijnde, zal afgeweken en onrein geworden zijn;","30":"Of als over een man die ijvergeest zal gekomen zijn, en hij over zijn huisvrouw zal geijverd hebben, dat hij de vrouw voor het aangezicht des HEEREN stelle, en de priester aan haar deze ganse wet volbrenge.","31":"En de man zal van de ongerechtigheid onschuldig zijn; maar diezelve vrouw zal haar ongerechtigheid dragen."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Command the children of Israel, that they put out of the camp every leper, and every one that hath an issue, and whosoever is defiled by the dead:","3":"Both male and female shall ye put out, without the camp shall ye put them; that they defile not their camps, in the midst whereof I dwell.","4":"And the children of Israel did so, and put them out without the camp: as the LORD spake unto Moses, so did the children of Israel.","5":"And the LORD spake unto Moses, saying,","6":"Speak unto the children of Israel, When a man or woman shall commit any sin that men commit, to do a trespass against the LORD, and that person be guilty;","7":"Then they shall confess their sin which they have done: and he shall recompense his trespass with the principal thereof, and add unto it the fifth *part* thereof, and give *it* unto *him* against whom he hath trespassed.","8":"But if the man have no kinsman to recompense the trespass unto, let the trespass be recompensed unto the LORD, *even* to the priest; beside the ram of the atonement, whereby an atonement shall be made","9":"And every offering of all the holy things of the children of Israel, which they bring unto the priest,","10":"And every man's hallowed things shall be his: whatsoever any man giveth the priest,","11":"And the LORD spake unto Moses, saying,","12":"Speak unto the children of Israel, and say unto them, If any man's wife go aside, and commit a trespass","13":"And a man lie with her carnally, and it be hid from the eyes of her husband, and be kept close, and she be defiled, and *there be* no witness against her, neither she be taken","14":"And the spirit of jealousy come upon him, and he be jealous of his wife, and she be defiled: or if the spirit of jealousy come upon him, and he be jealous of his wife, and she be not defiled:","15":"Then shall the man bring his wife unto the priest, and he shall bring her offering for her, the tenth *part* of an ephah of barley meal; he shall pour no oil upon it, nor put frankincense thereon; for it *is* an offering of jealousy, an offering of memorial, bringing iniquity to remembrance.","16":"And the priest shall bring her near, and set her before the LORD:","17":"And the priest shall take holy water in an earthen vessel; and of the dust that is in the floor of the tabernacle the priest shall take, and put *it* into the water:","18":"And the priest shall set the woman before the LORD, and uncover the woman's head, and put the offering of memorial in her hands, which *is* the jealousy offering: and the priest shall have in his hand the bitter water that causeth the curse:","19":"And the priest shall charge her by an oath, and say unto the woman, If no man have lain with thee, and if thou hast not gone aside to uncleanness *with another* instead of thy husband, be thou free from this bitter water that causeth the curse:","20":"But if thou hast gone aside *to another* instead of thy husband, and if thou be defiled, and some man have lain with thee beside thine husband:","21":"Then the priest shall charge the woman with an oath of cursing, and the priest shall say unto the woman, The LORD make thee a curse and an oath among thy people, when the LORD doth make thy thigh to rot, and thy belly to swell;","22":"And this water that causeth the curse shall go into thy bowels, to make *thy* belly to swell, and *thy* thigh to rot: And the woman shall say, Amen, amen.","23":"And the priest shall write these curses in a book, and he shall blot *them* out with the bitter water:","24":"And he shall cause the woman to drink the bitter water that causeth the curse: and the water that causeth the curse shall enter into her, *and become* bitter.","25":"Then the priest shall take the jealousy offering out of the woman's hand, and shall wave the offering before the LORD, and offer it upon the altar:","26":"And the priest shall take an handful of the offering, *even* the memorial thereof, and burn *it* upon the altar, and afterward shall cause the woman to drink the water.","27":"And when he hath made her to drink the water, then it shall come to pass, *that*, if she be defiled, and have done trespass against her husband, that the water that causeth the curse shall enter into her, *and become* bitter, and her belly shall swell, and her thigh shall rot: and the woman shall be a curse among her people.","28":"And if the woman be not defiled, but be clean; then she shall be free, and shall conceive seed.","29":"This *is* the law of jealousies, when a wife goeth aside *to another* instead of her husband, and is defiled;","30":"Or when the spirit of jealousy cometh upon him, and he be jealous over his wife, and shall set the woman before the LORD, and the priest shall execute upon her all this law.","31":"Then shall the man be guiltless from iniquity, and this woman shall bear her iniquity."}},"tsk":{"2":[{"kopje":"uit het leger wegzenden","refs":["Num 12:14","Lev 13:46","Deut 24:8","Deut 24:9","2 Kon 7:3"]},{"kopje":"en alle","refs":["Lev 15:2-27"]},{"kopje":"en allen","refs":["Num 9:6-10","Num 19:11-16","Num 31:19","Lev 21:1"]}],"3":[{"kopje":"tot buiten","refs":["1 Kon 7:3","1 Kor 5:7-13","2 Kor 6:17","2 Tess 3:6","Tit 3:10","Hebr 12:15","Hebr 12:16","2 Joh 1:10","2 Joh 1:11","Openb 21:27"]},{"kopje":"niet verontreinigen","refs":["Num 19:22","Hagg 2:14","Hagg 2:1 \"H3409\">thigh</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">rot:</span> and the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H423\">curse</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> her people.","28":"And if the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> be not <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled,</span> but be <span class=\"wl wl-kjv\" data-code=\"H2889\">clean;</span> then she shall be <span class=\"wl wl-kjv\" data-code=\"H5352\">free,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H2232\">conceive</span> seed.","29":"This is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousies,</span> when a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> goeth <span class=\"wl wl-kjv\" data-code=\"H7847\">aside</span> to another instead of her <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> and is defiled;","30":"Or when the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousy</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">cometh</span> upon <span class=\"wl wl-kjv\" data-code=\"H376\">him,</span> and he be <span class=\"wl wl-kjv\" data-code=\"H7065\">jealous</span> over his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> upon her all this law.","31":"Then shall the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> be <span class=\"wl wl-kjv\" data-code=\"H5352\">guiltless</span> from <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> and <span class=\"wl wl-kjv\" data-code=\"H1931\">this</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> her iniquity."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"vloeienden,","tekst":"Vergelijk Lev 15:2."},{"catchword":"een dode","tekst":"Hebreeuws, ziel. Zie Lev 19:28."}],"3":[{"catchword":"Van den man tot de vrouw toe","tekst":"Dat is, hetzij man of vrouw."},{"catchword":"zij niet","tekst":"Te weten, de andere Israëlieten."},{"catchword":"verontreinigen","tekst":"Te weten, door enigen van zulke onreinen onder hen te laten wonen."},{"catchword":"hun legers,","tekst":"Er waren [naar de mening van sommigen] drie legers: het leger des Heeren, hetwelk was de tabernakel; het leger der Levieten; het leger der Israëlieten. De melaatsen werden uit allen gesloten, de vloeienden uit de twee eersten."},{"catchword":"in welker midden Ik wone","tekst":"Dat is, wie Ik door mijn genade bijblijve, door mijn speciale voorzienigheid bewaar en bescherm, mitsgaders door mijn Geest en woord regeer en ter eeuwige zaligheid geleid. Vergelijk Lev 26:11-12, met de aantekeningen en Eze 37:28; 2Co 6:16."}],"6":[{"catchword":"menselijke zonden","tekst":"Hebreeuws, zonden des mensen. Versta, de zonde, die de mensen begaan uit menselijke zwakheid, voortkomende uit de aanklevende verdorvenheid der natuur. Vergelijk Lev 5:2-3; en wordt dit vergrijp gesteld tegen de zonde, die uit moedwil geschiedt en met opgeheven hand, onder, Num 15:30; of, versta, de zonde, die geschiedt naar de wijze der mensen, die van nature zeer tot de zonde genegen zijn. Anders, zonden des mensen; dat is, tegen enig mens of den naaste begaan."},{"catchword":"ziel schuldig","tekst":"Dat is, persoon. Zie Gen 12:5."}],"7":[{"catchword":"belijden;","tekst":"Te weten, voor den priester, als die de offerande doen moest en het goed van des Heeren wege mocht tot zich trekken, geen losser voorhanden zijnde, vs.8, en vergelijk Lev 5:5-6, Lev 5:10-13."},{"catchword":"hij","tekst":"Te weten, de schuldige."},{"catchword":"schuld weder uitkeren,","tekst":"Dat is, hetgeen hij zijn naaste ontvreemd heeft, waarmede hij zich schuldig heeft gemaakt."},{"catchword":"derzelver vijfde deel","tekst":"Te weten, om daarmede te vergelden de schade, die de eigenaar geleden heeft, zijnde beroofd geweest van het gebruik van zijn goed."}],"8":[{"catchword":"die man geen losser zal hebben,","tekst":"Te weten, aan welken het onrecht geschied is, zijnde dood, of geen bloedvriend, noch erfgenaam, noch iemand anders hebbende, die het goed zou mogen aanslaan, en wien men hetzelve zou wedergeven. In zulk een geval kwam het goed den Heere en in zijn plaats den priester toe."}],"9":[{"catchword":"heffing van alle geheiligde dingen","tekst":"Dit woord is hier niet in het bijzonder genomen, gesteld zijnde tegen beweegoffer, gelijk Exo 29:27, maar in het algemeen voor de dingen, die door iemand den priester gegeven en alzo Gode toegeheiligd worden, en daarna niet tot enig ander gebruik mogen besteed worden dan gelijk bevolen is. Alzo Exo 25:2; Num 15:19; Neh 10:39."},{"catchword":"zijne zijn","tekst":"Namelijk, van den priester; alzo in vs.10. Zie Lev 6:16."}],"12":[{"catchword":"iemand zijn huisvrouw","tekst":"Hebreeuws, man man; boven Num 4:19, enz."},{"catchword":"zal afgeweken zijn,","tekst":"Te weten, naar het vermoeden en nadenken van haar man, die haar beschuldigt den band des huwelijks door overspel gebroken te hebben, en daarover met jaloersheid zo bevangen is, dat hij zich niet in zijn gemoed kan geruststellen."}],"13":[{"catchword":"door bijligging des zaads","tekst":"Zie deze zelfde manier van spreken Lev 15:18, en Lev 19:20."},{"catchword":"onrein geworden;","tekst":"Te weten, door overspel."}],"14":[{"catchword":"de ijvergeest over hem gekomen is,","tekst":"Hebreeuws, de geest der ijvering; en zo in het volgende. Versta, de beweging der jaloezie van een man, over de eerbaarheid van zijn vrouw, hebbende kwaad vermoeden van dezelve. Het woordje geest betekent dikwijls de affecten en bewegingen, waardoor de mensen tot enige, òf zonden en zwakheden, òf deugden en goede werken, inwendiglijk genegen zijn, of ook uiterlijk gedreven worden. Zie Isa 19:14; Hos 4:12; 1Co 4:21; Gal 6:1; 2Ti 1:7."}],"15":[{"catchword":"een efa gerstemeel;","tekst":"Zie Exo 16:36."},{"catchword":"geen olie daarop gieten,","tekst":"De reden is, naar sommiger mening, omdat de olie een teken was der genade en geestelijke gaven, en de wierook een teken van den aangenamen en lieflijken reuk, welke beiden in deze gelegenheid niet pasten."}],"16":[{"catchword":"voor het aangezicht des HEEREN","tekst":"Dat is, voor den tabernakel, in welken was de ark, als een teken van Gods tegenwoordigheid. Zie Lev 1:3."}],"17":[{"catchword":"heilig water in een aarden vat nemen;","tekst":"Te weten, wat uit het heilige wasvat genomen werd, staande bij het brandofferaltaar, waarin het water was, hetwelk in den heiligen godsdienst gebruikt moest worden. Zie Exo 30:18, en Exo 40:30."}],"18":[{"catchword":"zal het hoofd van de vrouw ontbloten,","tekst":"Dit geschiedde:&lt;i&gt;I.&lt;/i&gt; om te verklaren, dat de vrouw vrij en haar zelve was, hebbende de macht om een eed te doen; gelijk daarentegen de dekking haars hoofds een teken is, dat zij staat onder de macht van haar man, 1Co 11:5, 1Co 11:10;&lt;i&gt;II.&lt;/i&gt; omdat zij bekwamelijk gezien en onderkend mocht worden, en alzo haar woorden en gebaren door de gehele vergadering te beter mochten waargenomen worden;&lt;i&gt;III.&lt;/i&gt; opdat zij te meer schaamte en vrees zou hebben iets anders dan de rechte waarheid te verklaren, als staande ontdekt voor het aanschijn van God en de ganse vergadering."},{"catchword":"bitter water zijn,","tekst":"Het wordt zo genaamd, omdat de vrouw zichzelve, zich veel bittere smarten toebracht, indien zij schuldig was. Zie vs.24, 27. Vergelijk Exo 32:20."},{"catchword":"den vloek medebrengt","tekst":"Dat is, de straf van God, gemeld vs.22. Zie ook onder, vs.24."}],"19":[{"catchword":"beëdigen,","tekst":"Dat is, hij zal haar met ede doen verklaren, of zij overspel gedaan heeft of niet. Anders, bezweren"},{"catchword":"onder uw man zijnde,","tekst":"Anders, in stede uws mans; dat is, met hem in de plaats uws mans gelegen hebbende, alzo vs.20, 29."},{"catchword":"vrij van dit bitter water,","tekst":"Dat is, onschuldig en onstrafbaar, zodat dit water u niet zal beschadigen."}],"20":[{"catchword":"bij u gelegen heeft,","tekst":"Zie van de Hebreeuwse manier van spreken Lev 18:20, Lev 18:23, en Lev 20:15."}],"21":[{"catchword":"der vervloeking beëdigen,","tekst":"De Heere heeft deze wet drieledig willen bevestigd hebben:&lt;i&gt;I.&lt;/i&gt; Met een eed der vervloeking, die door de beschuldigde vrouw gedaan moest zijn, in dit vs. en het volgende;&lt;i&gt;II.&lt;/i&gt; Met het beschrijven van dezen handel, hetwelk door den priester geschieden moest, hoewel alzo dat het briefje of perkament in het water gedoopt en afgespoeld werd, vs.23;&lt;i&gt;III.&lt;/i&gt; Met het bittere water [in hetwelk de geschreven vloek als ingespoeld was] in te drinken, hetwelk de vrouwen ook doen moesten, vs.24."},{"catchword":"tot een vloek,","tekst":"Dat is, tot een formulier van den vloek en van den valsen eed, opdat andere mensen u zullen nemen tot een exempel van een vervloekt persoon, die niet alleen zulk een zonde begaan heeft, maar ook met een plechtigen eed stoutelijk heeft geloochend."}],"22":[{"catchword":"Amen, amen","tekst":"Amen is een woord, hetwelk de Hebreëen gebruiken:&lt;i&gt;I.&lt;/i&gt; In het toestemmen van enige zaken, Deu 27:15-16; Neh 8:7; Rev 5:14;&lt;i&gt;II.&lt;/i&gt; In het bevestigen en verzekeren van enig verhaal, Mat 5:18, en Mat 6:2, enz.;&lt;i&gt;III.&lt;/i&gt; In het wensen van enig goed, Jer 11:5, en Jer 28:6; Rev 22:20;&lt;i&gt;IV.&lt;/i&gt; In het aannemen en verwachten van enig kwaad, wat bedreigd wordt, gelijk hier. Het wordt somtijds verdubbeld om de betekenis te vermeerderen en te versterken, gelijk vs.22 en Psa 89:53; Joh 3:3, Joh 3:11, en Joh 5:19, enz. Het woord betekent eigenlijk: het zij waar, of, het is waar of, het geschiede alzo."}],"23":[{"catchword":"cedeltje schrijven,","tekst":"Of, briefje"},{"catchword":"uitdoen","tekst":"Of, uitwissen, afwissen."}],"24":[{"catchword":"de vervloeking medebrengt,","tekst":"Zie boven, vs.18."},{"catchword":"tot bitterheden inga","tekst":"Dat is, opdat zij de bittere straf van God krijge, zo zij schuldig is."}],"26":[{"catchword":"deszelfs gedenkoffer,","tekst":"Versta, een deel van dat offer, hetwelk moest aangestoken worden; vergelijk Lev 2:2, en de aantekeningen."}],"27":[{"catchword":"het water,","tekst":"Dit water had deze werking niet uit zijn natuurlijke kracht, maar uit de ordinantie des Heeren, die door hetzelve, als door een teken, òf zijn rechtvaardig oordeel uitvoerde tegen de schuldige, òf zijn beloftenis aan de onschuldige."},{"catchword":"tot een vloek zijn","tekst":"Zie boven, vs.21."}],"28":[{"catchword":"met zaad bezadigd worden","tekst":"Dat is, zal vruchtbaar zijn."}],"30":[{"catchword":"voor het aangezicht des HEEREN stelle,","tekst":"Zie boven, vs.16."}],"31":[{"catchword":"onschuldig zijn;","tekst":"Dat is, ofschoon de man op een kwaad vermoeden zijn huisvrouw beschuldigd heeft, zo zal hij nochtans daarom niet gestraft worden; of, de man dit gedaan hebbende, zal onschuldig zijn aan het overspel zijner huisvrouw, daar hij anders zou schuldig zijn indien hij het door de vingers zag."},{"catchword":"ongerechtigheid dragen","tekst":"Zie Lev 5:1."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the LORD spoke to Moseh."}],"2":[{"catchword":null,"tekst":"Command the Children of Israel, that they dismiss out of the camp all Leprous, and all running (persons,) [comp. Lev. 15. 2.] and all those that are unclean of a dead (body) [Heb. of a soul, see Lev. 19. On vers. 28.]"}],"3":[{"catchword":null,"tekst":"From the man to the woman [i.e. whether it be a man or woman] thou shalt dismiss them, thou shalt dismiss them without the Camp; that they [viz. the rest of the Israelites] do not pollute their camps [viz. by suffering such unclean persons to have their abode amongst them. There were (as some do hold) three Camps; the Camp of the LORD, which was the Tabernacle, the Camp of the Levites, and the Camp of the Israelites: the leprous persons were excluded out of them all; but those with running issues, out of the two former] in the midst of whom I dwell. [i.e. among whom I continue with my grace and favour, whom I do keep and protect by my special providence, and whom withal I guide and govern by my word and spirit, guiding and conducting them to everlasting Salvation, comp. Lev. 26. 11, 12. With the annotate. and Ezech. 37. 28. 2 Cor. 6. 16.]"}],"4":[{"catchword":null,"tekst":"And the children of Israel did so, and sent them without the Camp, according as the LORD had spoken to Moseh, so did the children of Israel."}],"5":[{"catchword":null,"tekst":"Moreover the LORD spoke to Moseh, saying; Speak unto the children of Israel, when a man or woman shall have done ought of any human sins, [Heb. sins of man; understand such sins as men commit of human frailty, proceeding from the inherent corruption of Nature, comp. Lev, 5. 2, 3. And this kind of trespass is opposed to sin which is committed after the manner of men, who by nature are very propense and much inclined to them. Otherwise sins of men, i.e. committed against such and such men, or our Neighbour] have transgressed by transgression against the LORD, then that some soul is guilty [soul, i.e. person, see Ger. 12. On verse 5.]"}],"6":[{"catchword":null,"tekst":"No text on verse."}],"7":[{"catchword":null,"tekst":"And they shall confess their sin which they have done: (viz. before the Priest, as who was to offer in the LORD&acirc;&euro;&trade;s behalf, there being no redeemer at hand, verse 8. And comp. vers. 5. 6, 21, 22, 23, 24.] after that he shall [viz. the guilty] turn out his guilt again, [i.e. that which made himself guilty] according to the capital sum (or the principal) thereof, and shall add thereunto the fifth part of the same above it, [thereby to requite the damage which the owner sustained the whiles of having been deprived of the use of his goods] and shall give it to him, on whom he made himself guilty."}],"8":[{"catchword":null,"tekst":"But if that man shall have no Redeemer, [viz. he to whom the wrong was done, he being dead, or having lest no kindred, nor special heir, nor any one else that might lawfully own and claim the goods, and to whom it might be restored: In such a case the goods fell to the LORD, and by that means unto the Priests] for to turn out the guilt back unto him (then) that guilt which is returned unto the LORD shall be the Priests, except the ram of the expiation, wherewith he shall make expiation for him."}],"9":[{"catchword":null,"tekst":"Besides all the hearing [This word is not taken here in particular, as opposed to the wave-offering, Exod. 29. 27. But in general for the things which are given by any to the Priest, and thereby are consecrated to the LORD, and may thenceforth be designated to no other use, than is commanded, See Exod. 25. 2. Num. 15. 19. Neh. 10. 39.] of all hallowed things of the Children of Israel, which they bring unto the Priest shall be his [namely the Priests, and so in the next verse, see Lev. 6. On vers. 16.]"}],"10":[{"catchword":null,"tekst":"And every one&acirc;&euro;&trade;s hallowed things shall be his, whatsoever any shall have given to the Priest shall be his."}],"11":[{"catchword":null,"tekst":"Moreover the LORD spoke to Moseh, saying."}],"12":[{"catchword":null,"tekst":"Speak to the children of Israel, and say to them; When ever any one&acirc;&euro;&trade;s [Heb. man, as above chap. 4. 19. Etc.] wife, shall have turned aside; [in the opinion or suspicious conceit of her husband, he charging her of breach of Wedlock by Adultery, and being so possessed with jealousy in that behalf, that he cannot he at rest in his mind] and by trespass shall have trespassed against him."}],"13":[{"catchword":null,"tekst":"That a man shall have lain with her by copulation of seed, [See of this same phrase, Lev. 15. 18, 19, 20.] and it shall be hid before the eyes of her husband, and she shall have concealed her self, being nevertheless become unclean, [viz. by Adultery] and there is no witness against her, and she is not surprised."}],"14":[{"catchword":null,"tekst":"And the spirit of Jealousy is come upon him, [Understand hereby the passion of Jealousy in a man doubting his wives honesty, and entertaining very ill opinions of the same: The word Spirit doth often signify the affections or passions, whereby a man is either inwardly inclined, or outwardly instigated to the commiting of some sins or infirmities, or to the performance of some virtues and good works , see Isa. 19. 14. Hos. 4. 12. 1 Cor. 4. 21. Gal. 6. 1. 2 Tim. 1. 7. ] that he is jealous of his wife, she being become defiled, or that the spirit of jealousy is come upon him, that he is jealous of his wife although she be not defiled."}],"15":[{"catchword":null,"tekst":"Then shall that man bring his wife unto the Priest, and shall bring her sacrifice along for her, a tenth part of an Epha, [see Exod. 16. 36.] of barley meat, he shall power no oil upon it, nor lay frankincense upon it, [the reason is as some conjecture, that the oil was a token of a pleasing and acceptable smell, neither of which agreed with this case] because it is a meat-offering of jealousy, a meat-offering of remembrance, which bringeth iniquity to remembrance."}],"16":[{"catchword":null,"tekst":"And the Priest shall make her approach, and shall put (or place) her before the face of the LORD. [i.e. before the Tabernacle wherein the Ark was, as a token of the presence of God, see Lev. 1. On vers. 3.]"}],"17":[{"catchword":null,"tekst":"And the Priest shall take holy water [which was taken forth out of the holy Laver, standing by the Altar of burn-offering wherein the water was kept, which they were to make use of about any holy service there. See Exo. 30. 18. And 40. 30.] into an earthen Vessel: the Priest shall take of the dust, which is upon the floor of the Tabernacle, and put (it) into the water."}],"18":[{"catchword":null,"tekst":"After that shall the Priest place the woman before the face of the LORD, and shall uncover the head of the woman, [This was done. 1. To declare that the woman power to take an oath: as on the contrary, the covering of her head was a token, that she stood under the power of her husband, 1 Cor, 11. 5, 10. 2. That she might be the better seen and known, and her words and behavior the better observed by the whole Congregation. 3. That she might be so much the more ashamed and afraid, to utter and declare anything but the very truth, as standing bare and uncovered there before the presence of God and all the Assembly] and shall lay the meat-offering of remembrance upon her hands, which is the meat-offering of bitter water [so called, by reason of the many and bitter (or grievous) pains the woman was bringing upon her self by the heavy curse and imprecation she made against her self, in case of being guilty, see vers. 24. And 27. Comp. Exod. 32. 20.] which bringeth the curse with it [i.e. the punishment of God mentioned verse 22. See likewise below. Vers. 24.]"}],"19":[{"catchword":null,"tekst":"And the Priest shall swear her, [i.e. he shall make her to declay by oath, whether she committed Adultery, yea or no, Otherw. Adjure her] and shall say to that woman; if none have lain with thee, and if, being under thy husband [Otherw. Instead of thy husband, i.e. those having lain with him instead of thy husband, and so ver. 20. And 29.] thou have not turned aside to uncleaness: (then) be free from this bitter water, which doth bring the curse with it. [i.e. thou shalt be guiltless and free from the punishment, which would otherwise light upon thee, by the drinking of this water.]"}],"20":[{"catchword":null,"tekst":"But if being under this husband thou be turned aside, and if thou he become unclean, that a man have lain with thee [see of the Hebrew phrase here used, Lev.18. 20, 23. And chap. 20. 15.] besides thy Husband."}],"21":[{"catchword":null,"tekst":"(Then shall the Priest swear (or adjure) that woman with the oath of a cursing (or imprecation,) [The LORD would have this Law confirmed three manner of ways. 1. By an oath of imprecation, to be made by the woman accused, in this verse and the next. 2. By the writing down or this act, which was to be done by the Priest, yet so nevertheless, that the note or parchment, was to be dipt and washed in the water, vers. 23. 3. By the drinking of the bitter water (into which the written note or schedule, containing the curse and imprecation was washed off as it were) which was likewise to be performed by the woman, whose case it concerned, verse 24.] and the Priest shall say to the woman) the LORD set thee for a curse, and for an oath in the midst of the People, [i.e. he make thee become a pattern of cursing and perjury; that other people shall take thee for an example of an accursed person, having not only committed so foul a sin, but likewise denied it so stoutly with a solemn oath and imprecation] the LORD causing thy thigh to fall away, and thy belly to swell."}],"22":[{"catchword":null,"tekst":"That this same water, which bringeth the accursing with it enter into thy bowels, to make thy belly to swell, and thy thigh to fall away, then the woman shall say, Amen, Amen. [Amen is a word, which the Hebrews use, 1. In assenting to any thing, Deut. 27. 15, 16. Neh. 8. 7. Rev. 5. 14. 2. In confirming and assevering of any relation, Mat. 5. 18. And 6. 21, etc. 3. In wishing for any good, Jer. 11. 5. And chap. 28. 8. Rev. 22. 20. 4. In receiving and expecting of any evil threatened as here; it is doubled sometimes to increase and strengthen the signification; as here, and Psal. 89. 53. John 3. 3, 11. And c. 5. 10. Etc. The Word doth properly signify, be it true, or, it is true, or be it thus, so be it done.]"}],"23":[{"catchword":null,"tekst":"After that shall the Priest write these same curses into a schedule, [Or small note paper] and he shall blot it out, [or, wipe it off, wash it out] with the bitter water."}],"24":[{"catchword":null,"tekst":"And he shall give that bitter water, which bringeth the accursing with it, unto that woman to drink, that the water which bringeth the accursing with it [See above on verse 18.] enter into her for bitterness. [i.e. that the bitter punishments of God may seize upon her, being guilty.]"}],"25":[{"catchword":null,"tekst":"And the Priest shall take out of the hand of that woman the meat-offering of jealousies, and he shall wave the same meat-offering before the face of the LORD, and shall offer the same upon the Altar."}],"26":[{"catchword":null,"tekst":"The Priest shall likewise gripe a handful of that meat-offering, the same offering, which was to be kindled and burnt, comp. Lev. 2. 2. And the Annot.] and shall kindle it upon the Altar, and after the shall he give that woman, that water to drink."}],"29":[{"catchword":null,"tekst":"That is the law of the jealousies; when a woman being under her husband shall have turned aside and become unclean."}],"30":[{"catchword":null,"tekst":"Or when the Spirit of jealousy shall have come upon a man, and he shall have been jealous of his wife, that he put the woman before the face of the LORD. [See above on verse 16.] the Priest fulfill his whole Law on her."}],"31":[{"catchword":null,"tekst":"And the husband shall be guiltless of the iniquity, [i.e. although the husband shall have accused his wife upon wrong surmising, yet shall not he be punished for it; or the husband having performed this, shall be guiltless of the Adultery of his wife; whereas on the contrary, if he should connive and wink at it, he should be guilty] but that same woman shall bear her iniquity. [See Lev. 5. On verse 1.]"}]}}};

  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
