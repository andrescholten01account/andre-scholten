t van de HEERE de geest gaven!","4":"Waarom toch hebt u de gemeente van de HEERE in deze woestijn gebracht, dat wij daar zouden sterven, wij en onze beesten?","5":"En waarom hebt u ons laten optrekken uit Egypte, om ons te brengen in deze slechte plaats? Het is geen plaats met zaad, of vijgen, of wijnstokken, of granaatappels; ook is er geen water om te drinken.","6":"Toen gingen Mozes en Aäron van het aangezicht van de gemeente naar de deur van de tent van de samenkomst, en zij vielen op hun aangezicht; en de heerlijkheid van de HEERE verscheen hun.","7":"En de HEERE sprak tot Mozes en zei:","8":"Neem die staf, en verzamel de vergadering, u en Aäron, uw broeder, en spreek u tot de steenrots voor hun ogen, dan zal zij hun water geven; zo zult u hun water laten voortkomen uit de steenrots, en u zult de vergadering en haar beesten laten drinken.","9":"Toen nam Mozes de staf van voor het aangezicht van de HEERE, zoals Hij hem geboden had.","10":"En Mozes en Aäron verzamelden de gemeente voor de steenrots, en hij zei tot hen: Hoor toch, u opstandigen, zullen wij water voor u uit deze steenrots laten voortkomen?","11":"Toen hief Mozes zijn hand op, en hij sloeg de steenrots tweemaal met zijn staf; en er kwam veel water uit, zodat de vergadering dronk, en haar beesten.","12":"Daarom zei de HEERE tot Mozes en tot Aäron: Omdat u Mij niet geloofd hebt, door Mij te heiligen voor de ogen van de kinderen van Israël, daarom zult u deze gemeente niet brengen in het land, dat Ik hun gegeven heb.","13":"Dit zijn de wateren van Meriba, waar de kinderen van Israël met de HEERE getwist hebben; en Hij werd aan hen geheiligd.","14":"Daarna zond Mozes boden uit Kades tot de koning van Edom, *die zeiden*: Zo zegt uw broeder Israël: U weet al de moeite, die ons overkomen is;","15":"Dat onze vaders naar Egypte afgetrokken zijn, en wij in Egypte veel dagen gewoond hebben; en dat de Egyptenaars ons en onze vaders kwaad gedaan hebben.","16":"Toen riepen wij tot de HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en zie, wij zijn te Kades, een stad aan de rand van uw gebied.","17":"Laat ons toch door uw land trekken; wij zullen niet trekken door de akker, of door de wijngaarden, en wij zullen het water van de putten niet drinken; wij zullen de koninklijke weg gaan, wij zullen niet afwijken naar rechts of naar links, totdat wij door uw gebied getrokken zijn.","18":"Doch Edom zei tot hem: U zult niet door mij trekken, anders trek ik misschien met het zwaard tegen u uit!","19":"Toen zeiden de kinderen van Israël tot hem: Wij zullen over de gebaande weg optrekken, en als wij van uw water drinken, ik en mijn vee, dan zal ik daarvoor de prijs geven; ik zal alleen, zonder iets anders, te voet doortrekken.","20":"Doch hij zei: U zult niet doortrekken! En Edom trok tegen hem uit, met een zwaar volk, en met een sterke hand.","21":"Zo weigerde Edom Israël toe te laten door zijn gebied te trekken; daarom week Israël van hem af.","22":"Toen braken zij op vanuit Kades; en de kinderen van Israël kwamen, de hele vergadering, aan de berg Hor.","23":"De HEERE nu sprak tot Mozes en tot Aäron, aan de berg Hor, aan de grens van het land van Edom, en zei:","24":"Aäron zal tot zijn volken verzameld worden; want hij zal niet komen in het land, dat Ik aan de kinderen van Israël gegeven heb, omdat u tegen Mijn mond opstandig geweest bent bij de wateren van Meriba.","25":"Neem Aäron, en Eleazar, zijn zoon, en laat hen opklimmen naar de berg Hor.","26":"En trek Aäron zijn kleren uit, en trek ze Eleazar, zijn zoon, aan; want Aäron zal verzameld worden, en daar sterven.","27":"Mozes nu deed zoals de HEERE geboden had; want zij klommen op naar de berg Hor, voor de ogen van de hele vergadering.","28":"En Mozes trok Aäron zijn kleren uit, en hij trok ze zijn zoon Eleazar aan; en Aäron stierf daar, op de top van die berg. Toen kwamen Mozes en Eleazar van die berg af.","29":"Toen de hele vergadering zag dat Aäron overleden was, beweenden zij Aäron dertig dagen lang, het hele huis van Israël."},"SV":{"1":"Als de kinderen Israëls, de ganse vergadering, in de woestijn Zin gekomen waren, in de eerste maand, zo bleef het volk te Kades. En Mirjam stierf aldaar, en zij werd aldaar begraven.","2":"En er was geen water voor de vergadering; toen vergaderden zij zich tegen Mozes en tegen Aäron.","3":"En het volk twistte met Mozes, en zij spraken, zeggende: Och, of of wij den geest gegeven hadden, toen onze broeders voor het aangezicht des HEEREN den geest gaven!","4":"Waarom toch hebt gijlieden de gemeente des HEEREN in deze woestijn gebracht, dat wij daar sterven zouden, wij en onze beesten?","5":"En waarom hebt gijlieden ons doen optrekken uit Egypte, om ons te brengen in deze kwade plaats? Het is geen plaats van zaad, noch van vijgen, noch van wijnstokken, noch van granaatappelen; ook is er geen water om te drinken.","6":"Toen gingen Mozes en Aäron van het aangezicht der gemeente tot de deur van de tent der samenkomst, en zij vielen op hun aangezichten; en de heerlijkheid des HEEREN verscheen hun.","7":"En de HEERE sprak tot Mozes, zeggende:","8":"Neem dien staf, en verzamel de vergadering, gij en Aäron, uw broeder, en spreekt gijlieden tot de steenrots voor hun ogen, zo zal zij hun water geven; alzo zult gij hun water voortbrengen uit de steenrots, en gij zult de vergadering en haar beesten drenken.","9":"Toen nam Mozes den staf van voor het aangezicht des HEEREN, gelijk als Hij hem geboden had.","10":"En Mozes en Aäron vergaderden de gemeente voor de steenrots, en hij zeide tot hen: Hoort toch, gij wederspannigen, zullen wij water voor ulieden uit deze steenrots hervoorbrengen?","11":"Toen hief Mozes zijn hand op, en hij sloeg de steenrots tweemaal met zijn staf; en er kwam veel waters uit, zodat de vergadering dronk, en haar beesten.","12":"Derhalve zeide de HEERE tot Mozes en tot Aäron: Omdat gijlieden Mij niet geloofd hebt, dat gij Mij heiligdet voor de ogen der kinderen van Israël, daarom zult gijlieden deze gemeente niet inbrengen in het land, hetwelk Ik hun gegeven heb.","13":"Dit zijn de wateren van Meriba, daar de kinderen Israëls met den HEERE om getwist hebben; en Hij werd aan hen geheiligd.","14":"Daarna zond Mozes boden uit Kades tot den koning van Edom, *welke* *zeiden*: Alzo zegt uw broeder Israël: Gij weet al de moeite, die ons ontmoet is;","15":"Dat onze vaders naar Egypte afgetogen zijn, en wij in Egypte vele dagen gewoond hebben; en dat de Egyptenaars aan ons en onze vaderen kwaad gedaan hebben.","16":"Toen riepen wij tot den HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en ziet, wij zijn te Kades, en stad aan het uiterste uwer landpale.","17":"Laat ons toch door uw land trekken; wij zullen niet trekken door den akker, noch door de wijngaarden, noch zullen het water der putten drinken; wij zullen den koninklijken weg gaan, wij zullen niet afwijken ter rechter *hand* noch ter linkerhand, totdat wij door uw landpalen zullen getrokken zijn.","18":"Doch Edom zeide tot hem: Gij zult door mij niet trekken, opdat ik niet misschien met het zwaard uitga u tegemoet!","19":"Toen zeiden de kinderen Israëls tot hem: Wij zullen door den gebaanden weg optrekken, en indien wij van uw water drinken, ik en mijn vee, zo zal ik deszelfs prijs daarvoor geven; ik zal alleenlijk, zonder iets anders, te voet doortrekken.","20":"Doch hij zeide: Gij zult niet doortrekken! En Edom is hem tegemoet uitgetrokken, met een zwaar volk, en met een sterke hand.","21":"Alzo weigerde Edom Israël toe te laten door zijn landpale te trekken; daarom week Israël van hem af.","22":"Toen reisden zij van Kades; en de kinderen Israëls kwamen, de ganse vergadering, aan den berg Hor.","23":"De HEERE nu sprak tot Mozes, en tot Aäron, aan den berg Hor, aan de pale van het land van Edom, zeggende:","24":"Aäron zal tot zijn volken verzameld worden; want hij zal niet komen in het land, hetwelk Ik aan de kinderen Israëls gegeven heb, omdat gijlieden Mijn mond wederspannig geweest zijt bij de wateren van Meriba.","25":"Neem Aäron, en Eleazar, zijn zoon, en doe hen opklimmen tot den berg Hor.","26":"En trek Aäron zijn klederen uit, en trek ze Eleazar, zijn zoon, aan; want Aäron zal verzameld worden, en daar sterven.","27":"Mozes nu deed, gelijk als de HEERE geboden had; want zij klommen op tot den berg Hor, voor de ogen der ganse vergadering.","28":"En Mozes trok Aäron zijn klederen uit, en hij trok ze zijn zoon Eleazar aan; en Aäron stierf aldaar, op de hoogte diens bergs. Toen kwam Mozes en Eleazar van dien berg af.","29":"Toen de ganse vergadering zag, dat Aäron overleden was, zo beweenden zij Aäron dertig dagen, het ganse huis van Israël."},"KJV":{"1":"Then came the children of Israel, *even* the whole congregation, into the desert of Zin in the first month: and the people abode in Kadesh; and Miriam died there, and was buried","2":"And there was no water for the congregation: and they gathered themselves together against Moses and against Aaron.","3":"And the people chode with Moses, and spake, saying, Would God that we had died when our brethren died before the LORD!","4":"And why have ye brought up the congregation of the LORD into this wilderness, that we and our cattle should die","5":"And wherefore have ye made us to come up out of Egypt, to bring us in unto this evil place? it *is* no place of seed, or of figs, or of vines, or of pomegranates; neither *is* there any water to drink.","6":"And Moses and Aaron went from the presence of the assembly unto the door of the tabernacle of the congregation, and they fell upon their faces: and the glory of the LORD appeared","7":"And the LORD spake unto Moses, saying,","8":"Take the rod, and gather thou the assembly together, thou, and Aaron thy brother, and speak ye unto the rock before their eyes; and it shall give forth his water, and thou shalt bring forth to them water out of the rock: so thou shalt give the congregation and their beasts drink.","9":"And Moses took the rod from before the LORD, as he commanded","10":"And Moses and Aaron gathered the congregation together before the rock, and he said unto them, Hear now, ye rebels; must we fetch you water out of this rock?","11":"And Moses lifted up his hand, and with his rod he smote the rock twice: and the water came out abundantly, and the congregation drank, and their beasts","12":"And the LORD spake unto Moses and Aaron, Because ye believed me not, to sanctify me in the eyes of the children of Israel, therefore ye shall not bring this congregation into the land which I have given","13":"This *is* the water of Meribah; because the children of Israel strove with the LORD, and he was sanctified","14":"And Moses sent messengers from Kadesh unto the king of Edom, Thus saith thy brother Israel, Thou knowest all the travail that hath befallen","15":"How our fathers went down into Egypt, and we have dwelt in Egypt a long time; and the Egyptians vexed us, and our fathers:","16":"And when we cried unto the LORD, he heard our voice, and sent an angel, and hath brought us forth out of Egypt: and, behold, we *are* in Kadesh, a city in the uttermost of thy border:","17":"Let us pass, I pray thee, through thy country: we will not pass through the fields, or through the vineyards, neither will we drink *of* the water of the wells: we will go by the king's *high* way, we will not turn to the right hand nor to the left, until we have passed thy borders.","18":"And Edom said unto him, Thou shalt not pass by me, lest I come out against thee with the sword.","19":"And the children of Israel said unto him, We will go by the high way: and if I and my cattle drink of thy water, then I will pay for it: I will only, without *doing* any thing *else*, go through on my feet.","20":"And he said, Thou shalt not go through. And Edom came out against him with much people, and with a strong hand.","21":"Thus Edom refused to give Israel passage through his border: wherefore Israel turned away","22":"And the children of Israel, *even* the whole congregation, journeyed from Kadesh, and came unto mount Hor.","23":"And the LORD spake unto Moses and Aaron in mount Hor, by the coast of the land of Edom, saying,","24":"Aaron shall be gathered unto his people: for he shall not enter into the land which I have given unto the children of Israel, because ye rebelled against my word at the water of Meribah.","25":"Take Aaron and Eleazar his son, and bring them up unto mount Hor:","26":"And strip Aaron of his garments, and put them upon Eleazar his son: and Aaron shall be gathered *unto his people*, and shall die","27":"And Moses did as the LORD commanded: and they went up into mount Hor in the sight of all the congregation.","28":"And Moses stripped Aaron of his garments, and put them upon Eleazar his son; and Aaron died there in the top of the mount: and Moses and Eleazar came down from the mount.","29":"And when all the congregation saw that Aaron was dead, they mourned for Aaron thirty days, *even* all the house of Israel."}},"tsk":{"1":[{"kopje":"En","refs":["Num 33:38","Num 20:28","Deut 1:3","Num 13:1","Deut 1:22","Deut 1:23","Deut 2:14"]},{"kopje":"in","refs":["Num 13:21","Num 27:14","Num 33:36","Deut 32:51"]},{"kopje":"Zin","refs":["Num 34:3","Num 34:4","Joz 15:1","Joz 15:3","Num 20:16","Ps 29:8"]},{"kopje":"Mirjam","refs":["Num 12:1","Num 12:10","Num 12:15","Num 26:59","Ex 2:4","Ex 2:7","Ex 15:20","Micha 6:4"]}],"2":[{"kopje":"geen","refs":["Ex 15:23","Ex 15:24","Ex 17:1-4"]},{"kopje":"verzamelden zij zich","refs":["Num 11:1-6","Num 16:3","Num 16:19","Num 16:42","Num 21:5","Ex 16:2","Ex 16:7","Ex 16:12","1 Kor 10:10","1 Kor 10:11"]}],"3":[{"kopje":"de HEERE","refs":["Num 14:1","Num 14:2","Ex 16:2","Ex 16:3","Ex 17:2","Job 3:10","Job 3:11"]},{"kopje":"toen","refs":["Num 11:1","Num 11:33","Num 11:34","Num 14:36","Num 14:37","Num 16:31-35","Num 16:49","Klaagl 4:9"]}],"4":[{"kopje":"Waarom","refs":["Num 11:5","Ex 5:21","Ex 17:3","Ps 106:21","Hand 7:35","Hand 7:39","Hand 7:40"]},{"kopje":"dat wij" ss=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> therefore ye shall not <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> this <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I have given","13":"This <span class=\"wl wl-kjv\" data-code=\"H1992\">is</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of <span class=\"wl wl-kjv\" data-code=\"H4809\">Meribah;</span> because the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7378\">strove</span> with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and he was sanctified","14":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> from <span class=\"wl wl-kjv\" data-code=\"H6946\">Kadesh</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> all the <span class=\"wl wl-kjv\" data-code=\"H8513\">travail</span> that hath befallen","15":"How our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and we have <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> a <span class=\"wl wl-kjv\" data-code=\"H7227\">long</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">time;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H7489\">vexed</span> us, and our fathers:","16":"And when we <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> our <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel,</span> and hath brought us <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> and, behold, we are in <span class=\"wl wl-kjv\" data-code=\"H6946\">Kadesh,</span> a <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> in the <span class=\"wl wl-kjv\" data-code=\"H7097\">uttermost</span> of thy border:","17":"Let us <span class=\"wl wl-kjv\" data-code=\"H5674\">pass,</span> I pray thee, through thy <span class=\"wl wl-kjv\" data-code=\"H776\">country:</span> we will not <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> through the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields,</span> or through the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> neither will we <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of the <span class=\"wl wl-kjv\" data-code=\"H875\">wells:</span> we will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> by the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> high <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> we will not <span class=\"wl wl-kjv\" data-code=\"H5186\">turn</span> to the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> nor to the <span class=\"wl wl-kjv\" data-code=\"H8040\">left,</span> until we have <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> thy borders.","18":"And <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> by me, lest I come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> thee with the sword.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, We will <span class=\"wl wl-kjv\" data-code=\"H5927\">go</span> by the high <span class=\"wl wl-kjv\" data-code=\"H4546\">way:</span> and if I and my <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of thy <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> then I will <span class=\"wl wl-kjv\" data-code=\"H5414\">pay</span> for it: I will only, without doing any <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> else, go <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> on my feet.","20":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou shalt not go <span class=\"wl wl-kjv\" data-code=\"H5674\">through.</span> And <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> him with <span class=\"wl wl-kjv\" data-code=\"H3515\">much</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H2389\">strong</span> hand.","21":"Thus <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passage</span> through his <span class=\"wl wl-kjv\" data-code=\"H1366\">border:</span> wherefore <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> turned away","22":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> even the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed</span> from <span class=\"wl wl-kjv\" data-code=\"H6946\">Kadesh,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Hor.","23":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H2023\">Hor,</span> by the <span class=\"wl wl-kjv\" data-code=\"H1366\">coast</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> saying,","24":"<span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> shall be <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> for he shall not <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> because ye rebelled <span class=\"wl wl-kjv\" data-code=\"H4784\">against</span> my <span class=\"wl wl-kjv\" data-code=\"H6310\">word</span> at the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of Meribah.","25":"<span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and bring them <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Hor:","26":"And <span class=\"wl wl-kjv\" data-code=\"H6584\">strip</span> <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> of his <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and <span class=\"wl wl-kjv\" data-code=\"H3847\">put</span> them upon <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> shall be <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> unto his people, and shall die","27":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded:</span> and they went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H2023\">Hor</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of all the congregation.","28":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6584\">stripped</span> <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> of his <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and <span class=\"wl wl-kjv\" data-code=\"H3847\">put</span> them upon <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> there in the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount:</span> and <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from the mount.","29":"And when all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> was <span class=\"wl wl-kjv\" data-code=\"H1478\">dead,</span> they <span class=\"wl wl-kjv\" data-code=\"H1058\">mourned</span> for <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> even all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"eerste maand,","tekst":"Te weten, van het veertigste jaar na den uitgang uit Egypte, onder, Num 33:38."},{"catchword":"Kades","tekst":"Dit Kades was gelegen aan de landpalen der Edomieten, vs.16, onderscheiden van Kades-Barnea, Deu 1:19."},{"catchword":"Mirjam stierf aldaar,","tekst":"De zuster van Mozes en Aäron, een profetes. Zie Exo 15:20. In dit veertigste jaar na den uitgang der Israëlieten is ook Aäron, onder, Num 33:38, en Mozes, Deu 34:5, gestorven."}],"3":[{"catchword":"Och,","tekst":"Dit woord och, drukt uit de smart huns harten, hun uitpersende dezen wens."}],"5":[{"catchword":"in deze kwade plaats?","tekst":"Zie Jer 2:6."}],"6":[{"catchword":"van het aangezicht der gemeente","tekst":"Te weten, vrezende voor het geweld en den overlast des volks."},{"catchword":"zij vielen op hun aangezichten;","tekst":"Te weten, Mozes en Aäron, God den HEERE aanroepende, gelijk Exo 17:4."},{"catchword":"heerlijkheid des HEEREN verscheen hun","tekst":"Verschijnende in de wolkkolom."}],"8":[{"catchword":"dien staf,","tekst":"Te weten, den staf van Aäron, die voor de ark des verbonds bewaard werd. Zie boven, Num 17:10. Sommigen verstaan den staf van Mozes, met welken hij de wonderwerken gedaan had."}],"9":[{"catchword":"voor het aangezicht des HEEREN,","tekst":"Dat is, uit den tabernakel."}],"10":[{"catchword":"zeide","tekst":"Te weten, Mozes."},{"catchword":"hen","tekst":"Het was Mozes niet bevolen het volk aan te spreken, maar dat hij de steenrots aanspreken zou, vs.8."},{"catchword":"zullen wij","tekst":"Hieraan hadden zij niet behoren te twijfelen, want God had het hun beloofd, vs.8."}],"11":[{"catchword":"steenrots","tekst":"Van de geestelijke betekenis dezer steenrots, zie 1Co 10:4."},{"catchword":"tweemaal met zijn staf;","tekst":"Dit was ook een teken van Mozes haastigen toorn."}],"12":[{"catchword":"Mij niet geloofd hebt,","tekst":"Dat is, omdat gij mijn woorden niet geloofd hebt, doende wat Ik u bevolen had, twijfelende of Ik machtig genoeg was uit te voeren wat Ik ulieden te doen bevolen had."},{"catchword":"gij Mij heiligdet","tekst":"Mits op mijn woord den steen vrijmoediglijk bevelende dat hij water voortbrengen zou; het volk alzo een goed exempel gevende, om mijn woorden te geloven."},{"catchword":"daarom zult gijlieden","tekst":"Gelijk God hier bedreigt, alzo is het geschied; want Aäron is gestorven op den berg Hor, onder, vs.28, en Mozes op en berg Nebo, Deu 34."}],"13":[{"catchword":"van Meriba,","tekst":"Dat is, twistwateren"},{"catchword":"den HEERE om getwist hebben;","tekst":"Met Mozes, den dienaar des HEEREN, vs.3. Zie Exo 16:8."},{"catchword":"aan hen geheiligd","tekst":"Te weten, aan Mozes en Aäron, want straffende hun ongehoorzaamheid, heeft Hij zichzelven geheiligd. Zie Lev 10:3, en Lev 22:32. Anderen passen dit op de Israëlieten, aan welke God zijn heilig woord heeft waar gemaakt, toen Hij hun water uit de steenrots gegeven heeft."}],"14":[{"catchword":"Edom . . . broeder Israël","tekst":"Edom, of Ezau, en Jakob, of Israël, zijn gebroeders geweest; die hier tot elkander spreken, zijn derzelver nakomelingen geweest."},{"catchword":"die ons ontmoet is;","tekst":"Hebreeuws, die ons gevonden heeft."}],"15":[{"catchword":"vele dagen gewoond hebben;","tekst":"Dat is, lange tijd."}],"17":[{"catchword":"uw land trekken;","tekst":"Dit was hun toen de naaste weg naar het land Kanaän."},{"catchword":"putten niet drinken;","tekst":"Te weten, zonder dat te betalen gelijk vs.19."},{"catchword":"koninklijken weg gaan,","tekst":"Hebreeuws, des konings weg. Anders, de landstraat, of, den herenweg."}],"18":[{"catchword":"tot hem","tekst":"Te weten, tot Mozes, of tot Israël."},{"catchword":"door mij niet trekken,","tekst":"Dat is, door mijn land, gelijk er vs.17 staat. Zie dergelijke manier van spreken, Deu 2:30; Rom 15:28."},{"catchword":"met het zwaard uitga","tekst":"Dat is, gewapender Hand."}],"19":[{"catchword":"zo zal ik deszelfs prijs daarvoor geven;","tekst":"Dit heeft God te doen bevolen, Deu 2:6-7."}],"21":[{"catchword":"Israël","tekst":"De Israëlieten."},{"catchword":"daarom week Israël van hem af","tekst":"Dit deden de Israëlieten op het bevel Gods, Deu 2:4-5, onaangezien de weg, dien zij daarna door de woestijn passeerden, hun zeer moeilijk en zwaar viel; Num 21:4-5."}],"24":[{"catchword":"Aäron zal tot zijn volken verzameld worden;","tekst":"Dat is, Aäron zal sterven."},{"catchword":"mond wederspannig geweest zijt","tekst":"Dat is, mijn bevel."}],"26":[{"catchword":"zijn klederen uit,","tekst":"Te weten, zijn priesterlijke klederen, van welke zie Exo 28:2."},{"catchword":"zal verzameld worden,","tekst":"Te weten, tot zijne volken, gelijk vs.24."}],"27":[{"catchword":"zij klommen op tot den berg Hor,","tekst":"Te weten, Mozes, Aäron en Eleazar."}],"29":[{"catchword":"zag,","tekst":"Dat is, vernam; te weten, uit den mond van Mozes en Eleazar, en ziende dat hij niet wederkwam. Zie dergelijke manier van spreken Gen 42:1, vergelijk met Act 7:12."},{"catchword":"Aäron overleden was,","tekst":"Aäron is gestorven in het 123ste jaar zijns ouderdoms, Num 33:38-39, op den eersten dag der vijfde maand, in het veertigste jaar na den uittocht uit Egypte. Van zijn begrafenis wordt gesproken Deu 10:6."},{"catchword":"beweenden zij Aäron","tekst":"Dat is, zij droegen een rouw over Aäron."},{"catchword":"dertig dagen,","tekst":"Zolang beweenden zij Mozes ook; Deu 34:8."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"When the children of Israel, the whole Congregation, were come into the wilderness of Zin, in the first month, [viz. of the fourtieth year after their coming forth out of Egypt, below, ch.33.38.] the people abode at Kades: [this Kades lay on the borders of Edom, v.16. and is a distinct place from Kades Barnea, Deut.1.19.] and Miriam [the fester of Moseh and Aaron, a Prophetess; see Exo 15:20.] died there, [and so did, in this same fourtieth year since the Israelites coming out of Egypt, Aaron likewise: below, chapter 33.38. and Moseh himself also, Deu 34:5.] and she was buried there."}],"2":[{"catchword":null,"tekst":"And there was no water for the Congregation: then they gathered themselves against Moseh, and against Aaron."}],"3":[{"catchword":null,"tekst":"and the people contended with Moseh; and they spake, saying; ah, [This particle sets forth the greatness of their hearts-grief, making the same to break out into the ensuing wish, or imprecation] that we had given (up) the ghost when our brethren gave up the ghost, before the face of the LORD! [see above, chapter.16, 32, 49.]"}],"4":[{"catchword":null,"tekst":"Wherefore have ye brought the Congregation of the LORD into this wilderness? That we should die there? we and our cattle?"}],"5":[{"catchword":null,"tekst":"And wherefore have ye made us come up out of Egypt, for to bring us into this evil place? [See Jer 2:6.] it is no place of seed, nor of Figs, nor of Vines, nor of Pomegranates; nor is there any water to drink."}],"6":[{"catchword":null,"tekst":"Then Moseh and Aaron went from the face of the Congregation, [viz.being struck with an apprehension of fear, what violence and trouble they might be put to by the people] unto the door of the Tent of the Congregation, and they fell upon their faces: [they viz. Moseh and Aaron, calling upon the LORD, as Exo 17:14.] and the glory of the LORD appeared unto them. [viz. in the pillar of Cloud.]"}],"7":[{"catchword":null,"tekst":"And the LORD spake to Moseh, saying;"}],"8":[{"catchword":null,"tekst":"Take that staff [viz. the staff of Aaron, which was kept before the Ark of the Covenant. See above chap.17.10. Some understand Moseh his staff here, wherewith he had wrought so many wonders formerly] and gather the Congregation, thou and Aaron thy brother, and speak ye to the rock before their eyes; so he shall give them water. Thus shall ye bring them forth water out of the rock. [Psalm 78. 15,16. And 105.41. nd 114.8. Nehem.9.15.] and thou shalt make the Congregation and their beasts to drink."}],"9":[{"catchword":null,"tekst":"Then Moseh took the staff from before the face of the LORD, [i.e. out of the Tabernacle] according as he had commanded him."}],"10":[{"catchword":null,"tekst":"And Moseh and Aaron assembled the Congregation before the rock: and he [viz. Moseh] said unto them [he had received no command to address his speech unto the people, but to speak unto the rock, v. 8.] Hear now, ye rebellious, shall we bring forth water for you out of this rock? [of this they needed not to have doubted, God having promised it, v.8.]"}],"11":[{"catchword":null,"tekst":"Then Moseh lifted up his hand, and he smote the rock [of the spiritual signification of this rock, see 1 Cor.10.4.] twice [which likewise sheweth Moseh his hastiness and anger] with his staff: and there came forth much water, so that the Congregation drank and their beasts."}],"12":[{"catchword":null,"tekst":"Therefore the LORD said to Moseh and to Aaron; because ye have not believed me, [i.e. because ye did not believe my words, to do and perform // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
