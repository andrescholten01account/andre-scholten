her gezwegen, Ik heb Mij stil gehouden en Mij ingehouden; Ik zal uitschreeuwen als een barende vrouw, Ik zal ze verwoesten en tegelijk opslokken.", "Luk 8:15": "En wat in de goede aarde valt, dat zijn zij die het Woord gehoord hebben en het in een eerlijk en goed hart bewaren, en met volharding vruchten voortbrengen.", "2 Kron 13:12": "Zie daarom, God is met ons aan het hoofd, en Zijn priesters met de trompetten van het geschal, om alarm tegen u te laten klinken; o kinderen van Israël, strijd niet tegen de HEERE, de God van uw vaderen, want u zult geen voorspoed hebben.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Num 6:27": "Zo zullen zij Mijn Naam op de kinderen van Israël leggen; en Ik zal hen zegenen.", "Ef 1:6-8": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde; In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade, Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "Jes 24:5": "Want het land is bevlekt vanwege zijn inwoners; want zij overtreden de wetten, zij veranderen de inzettingen, zij vernietigen het eeuwige verbond."}, "noten": {"1": "D.i.: tot het derde en vierde nageslacht."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H5375\">Toen</span> kwam de hele <span class=\"wl\" data-l=\"L2\" data-code=\"H5712\">vergadering</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5712\">in</span> opstand, <span class=\"wl\" data-l=\"L3\" data-code=\"H5414\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5414\">zij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5375\">verhieven</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H537 ed;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> that night.", "2": "And all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">murmured</span> against <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and against <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron:</span> and the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Would <span class=\"wl wl-kjv\" data-code=\"H3863\">God</span> that we had <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt!</span> or would <span class=\"wl wl-kjv\" data-code=\"H3863\">God</span> we had <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> in this wilderness!", "3": "And wherefore hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> us unto this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> to <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> that our <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> and our <span class=\"wl wl-kjv\" data-code=\"H2945\">children</span> should be a <span class=\"wl wl-kjv\" data-code=\"H957\">prey?</span> were it not <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> for us to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into Egypt?", "4": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H251\">another,</span> Let us <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H7218\">captain,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into Egypt.", "5": "Then <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> on their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> all the <span class=\"wl wl-kjv\" data-code=\"H6951\">assembly</span> of the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.", "6": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5126\">Nun,</span> and <span class=\"wl wl-kjv\" data-code=\"H3612\">Caleb</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3312\">Jephunneh,</span> which were of them that <span class=\"wl wl-kjv\" data-code=\"H8446\">searched</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> their clothes:", "7": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5712\">company</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which we <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> through to <span class=\"wl wl-kjv\" data-code=\"H8446\">search</span> it, is an <span class=\"wl wl-kjv\" data-code=\"H3966\">exceeding</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> land.", "8": "If the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2654\">delight</span> in us, then he will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> us into this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it us; a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which <span class=\"wl wl-kjv\" data-code=\"H2100\">floweth</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> and honey.", "9": "Only <span class=\"wl wl-kjv\" data-code=\"H4775\">rebel</span> not ye against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> neither <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> ye the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> for they are <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> for us: their <span class=\"wl wl-kjv\" data-code=\"H6738\">defence</span> is <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> from them, and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is with us: fear", "10": "But all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H559\">bade</span> <span class=\"wl wl-kjv\" data-code=\"H7275\">stone</span> them with <span class=\"wl wl-kjv\" data-code=\"H68\">stones.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation</span> before all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.", "11": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> How long will this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5006\">provoke</span> me? and how long will it be <span class=\"wl wl-kjv\" data-code=\"H3808\">ere</span> they <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> me, for all the <span class=\"wl wl-kjv\" data-code=\"H226\">signs</span> which I have <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> among", "12": "I will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> them with the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> and <span class=\"wl wl-kjv\" data-code=\"H3423\">disinherit</span> them, and will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> of thee a <span class=\"wl wl-kjv\" data-code=\"H1419\">greater</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> and mightier", "13": "And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Then the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> it, (for thou broughtest <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in thy <span class=\"wl wl-kjv\" data-code=\"H3581\">might</span> from among", "14": "And they will <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> it to the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of this <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> for they have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that thou <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> art <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> art <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">face</span> to <span class=\"wl wl-kjv\" data-code=\"H5869\">face,</span> and that thy <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">standeth</span> over them, and that thou <span class=\"wl wl-kjv\" data-code=\"H1980\">goest</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, by day <span class=\"wl wl-kjv\" data-code=\"H3119\">time</span> in a <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> of a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> and in a <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> by night.", "15": "Now if thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> all this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> then the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> which have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H8088\">fame</span> of thee will <span class=\"wl wl-kjv\" data-code=\"H559\">speak,</span> saying,", "16": "Because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H1115\">not</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which he <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto them, therefore he hath <span class=\"wl wl-kjv\" data-code=\"H7819\">slain</span> them in the wilderness.", "17": "And now, I beseech thee, let the <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> of my <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> be <span class=\"wl wl-kjv\" data-code=\"H1431\">great,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">according</span> as thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken,</span> saying,", "18": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H750\">longsuffering,</span> and of <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">forgiving</span> <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> and <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression,</span> and by no <span class=\"wl wl-kjv\" data-code=\"H5352\">means</span> <span class=\"wl wl-kjv\" data-code=\"H5352\">clearing</span> the guilty, <span class=\"wl wl-kjv\" data-code=\"H6485\">visiting</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8029\">third</span> and fourth", "19": "<span class=\"wl wl-kjv\" data-code=\"H5545\">Pardon,</span> I beseech thee, the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> according unto the <span class=\"wl wl-kjv\" data-code=\"H1433\">greatness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy,</span> and as thou hast <span class=\"wl wl-kjv\" data-code=\"H5375\">forgiven</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> from <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> even until now.", "20": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5545\">pardoned</span> according to thy word:", "21": "But as <span class=\"wl wl-kjv\" data-code=\"H199\">truly</span> as I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> with the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the LORD.", "22": "Because all those <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> which have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> my <span class=\"wl wl-kjv\" data-code=\"H3519\">glory,</span> and my <span class=\"wl wl-kjv\" data-code=\"H226\">miracles,</span> which I <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> and in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and have <span class=\"wl wl-kjv\" data-code=\"H5254\">tempted</span> me now these <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times,</span> and have not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> to my voice;", "23": "Surely they shall <span class=\"wl wl-kjv\" data-code=\"H518\">not</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> neither shall any of them that <span class=\"wl wl-kjv\" data-code=\"H5006\">provoked</span> me see", "24": "But my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3612\">Caleb,</span> <span class=\"wl wl-kjv\" data-code=\"H6118\">because</span> he had <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> with him, and hath <span class=\"wl wl-kjv\" data-code=\"H310\">followed</span> me <span class=\"wl wl-kjv\" data-code=\"H4390\">fully,</span> him will I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> whereinto he <span class=\"wl wl-kjv\" data-code=\"H935\">went;</span> and his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall possess", "25": "(Now the <span class=\"wl wl-kjv\" data-code=\"H6003\">Amalekites</span> and the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley.)</span> To <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">turn</span> you, and <span class=\"wl wl-kjv\" data-code=\"H5265\">get</span> you into the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> sea.", "26": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> saying,", "27": "How long shall I bear with this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> which <span class=\"wl wl-kjv\" data-code=\"H3885\">murmur</span> against me? I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H8519\">murmurings</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which they murmur", "28": "<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> unto them, As truly <span class=\"wl wl-kjv\" data-code=\"H3808\">as</span> I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as ye have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> in mine <span class=\"wl wl-kjv\" data-code=\"H241\">ears,</span> so will I do", "29": "Your <span class=\"wl wl-kjv\" data-code=\"H6297\">carcases</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in this <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness;</span> and all that were <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> of you, according to your whole <span class=\"wl wl-kjv\" data-code=\"H4557\">number,</span> from <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> which have murmured", "30": "Doubtless ye shall <span class=\"wl wl-kjv\" data-code=\"H518\">not</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> concerning which I <span class=\"wl wl-kjv\" data-code=\"H3027\">sware</span> to make you <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> therein, save <span class=\"wl wl-kjv\" data-code=\"H3612\">Caleb</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3312\">Jephunneh,</span> and <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Nun.", "31": "But your little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> which ye <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> should be a <span class=\"wl wl-kjv\" data-code=\"H957\">prey,</span> them will I bring <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which ye have despised.", "32": "But as for you, your <span class=\"wl wl-kjv\" data-code=\"H6297\">carcases,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in this wilderness.", "33": "And your <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> shall <span class=\"wl wl-kjv\" data-code=\"H7462\">wander</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> your <span class=\"wl wl-kjv\" data-code=\"H2184\">whoredoms,</span> until your <span class=\"wl wl-kjv\" data-code=\"H6297\">carcases</span> be <span class=\"wl wl-kjv\" data-code=\"H8552\">wasted</span> in the wilderness.", "34": "After the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> in which ye <span class=\"wl wl-kjv\" data-code=\"H8446\">searched</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> even <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> each <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> for a <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> your <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities,</span> even <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> my breach of promise.", "35": "I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have <span class=\"wl wl-kjv\" data-code=\"H1696\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H518\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H2063\">it</span> unto all this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> that are gathered <span class=\"wl wl-kjv\" data-code=\"H3259\">together</span> against me: in this <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> they shall be <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed,</span> and there they shall die.", "36": "And the <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> which <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H8446\">search</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> who <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and made all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> to <span class=\"wl wl-kjv\" data-code=\"H3885\">murmur</span> against him, by bringing <span class=\"wl wl-kjv\" data-code=\"H3318\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H1681\">slander</span> upon the land,", "37": "Even <span class=\"wl wl-kjv\" data-code=\"H582\">those</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that did bring <span class=\"wl wl-kjv\" data-code=\"H3318\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1681\">report</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> by the <span class=\"wl wl-kjv\" data-code=\"H4046\">plague</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD.", "38": "But <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5126\">Nun,</span> and <span class=\"wl wl-kjv\" data-code=\"H3612\">Caleb</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3312\">Jephunneh,</span> which were of the <span class=\"wl wl-kjv\" data-code=\"H1992\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H8446\">search</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> lived", "39": "And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">sayings</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H56\">mourned</span> greatly.", "40": "And they rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and gat them <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H2009\">Lo,</span> we be here, and will go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">promised:</span> for we have sinned.", "41": "And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore now do ye <span class=\"wl wl-kjv\" data-code=\"H5674\">transgress</span> the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span> but it shall not prosper.", "42": "Go not <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is not <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> you; that ye be not <span class=\"wl wl-kjv\" data-code=\"H5062\">smitten</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> your enemies.", "43": "For the <span class=\"wl wl-kjv\" data-code=\"H6003\">Amalekites</span> and the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites</span> are there <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you, and ye shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> because ye are <span class=\"wl wl-kjv\" data-code=\"H7725\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H310\">away</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> therefore the LORD", "44": "But they <span class=\"wl wl-kjv\" data-code=\"H6075\">presumed</span> to go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">top:</span> nevertheless the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H4185\">departed</span> not <span class=\"wl wl-kjv\" data-code=\"H7130\">out</span> of the camp.", "45": "Then the <span class=\"wl wl-kjv\" data-code=\"H6003\">Amalekites</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in that <span class=\"wl wl-kjv\" data-code=\"H2022\">hill,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them, and <span class=\"wl wl-kjv\" data-code=\"H3807\">discomfited</span> them, even unto Hormah."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
