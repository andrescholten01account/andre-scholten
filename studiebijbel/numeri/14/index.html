en en onze kinderen tot roof te worden? Zou het voor ons niet beter zijn om naar Egypte terug te keren?","4":"En zij zeiden de een tegen de ander: Laat ons een leider aanstellen, en terugkeren naar Egypte!","5":"Toen vielen Mozes en Aäron op hun gezicht, voor het aangezicht van de hele gemeente van de vergadering van de kinderen van Israël.","6":"En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren.","7":"En zij spraken tot de hele vergadering van de kinderen van Israël en zeiden: Het land waar wij doorheen getrokken zijn om het te verspieden, is een buitengewoon goed land.","8":"Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.","9":"Wees alleen niet opstandig tegen de HEERE! En vrees het volk van dit land niet; want zij zijn ons brood! Hun bescherming is van hen geweken, en de HEERE is met ons; vrees hen niet!","10":"Toen zei de hele vergadering dat men hen met stenen zou stenigen. Maar de heerlijkheid van de HEERE verscheen in de tent van de samenkomst, voor al de kinderen van Israël.","11":"En de HEERE zei tegen Mozes: Hoelang zal dit volk Mij tergen? En hoelang zullen zij niet aan Mij geloven, ondanks alle tekenen die Ik onder hen gedaan heb?","12":"Ik zal het met pest treffen, en Ik zal het onterven; en Ik zal u tot een groter en sterker volk maken dan dit is.","13":"En Mozes zei tegen de HEERE: Dan zullen de Egyptenaren het horen; want U hebt door Uw kracht dit volk uit hun midden doen optrekken;","14":"en zij zullen het zeggen tegen de inwoners van dit land, *die* gehoord hebben dat U, HEERE, in het midden van dit volk bent; dat U, HEERE, oog in oog gezien wordt, dat Uw wolk over hen staat, en U voor hun aangezicht gaat in een wolkkolom overdag, en in een vuurkolom 's nachts.","15":"En zou U dit volk als één man doden, dan zouden de heidenvolken, die het bericht over U gehoord hebben, zeggen:","16":"Omdat de HEERE dit volk niet in dat land kon brengen dat Hij hun gezworen had, heeft Hij hen daarom gedood in de woestijn!","17":"Nu dan, laat toch de kracht van de Heere groot worden, zoals U gesproken hebt, toen U zei:","18":"De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht.[1]","19":"Vergeef toch de ongerechtigheid van dit volk, naar de grootte van Uw goedertierenheid, en zoals U dit volk vergeven hebt, van Egypteland af tot hiertoe!","20":"En de HEERE zei: Ik heb hun vergeven naar uw woord.","21":"Maar zeker, zo waarachtig als Ik leef, zal de hele aarde met de heerlijkheid van de HEERE vervuld worden!","22":"Want al de mannen die Mijn heerlijkheid gezien hebben, en Mijn tekenen, die Ik in Egypte en in de woestijn gedaan heb, en Mij nu tien keer beproefd hebben, en niet gehoorzaam zijn geweest aan Mijn stem;","23":"zij zullen het land dat Ik hun vaderen gezworen heb, zeker niet zien. Ja, niemand van hen die Mij getergd hebben, zal dat zien!","24":"Maar Mijn dienaar Kaleb, omdat een andere geest met hem geweest is, en hij Mij trouw is blijven volgen, zal Ik hem brengen tot het land waarin hij gekomen was, en zijn nageslacht zal het erfelijk bezitten.","25":"De Amalekieten nu en de Kanaänieten wonen in het dal; keer u morgen om, en vertrek naar de woestijn, op de weg naar de Schelfzee.","26":"Daarna sprak de HEERE tot Mozes en tot Aäron en zei:","27":"Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren.","28":"Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de HEERE, zoals u in Mijn oren gesproken hebt, zo zal Ik u doen!","29":"Uw dode lichamen zullen in deze woestijn vallen; en al uw getelden, naar uw hele aantal, van twintig jaar oud en daarboven, u die tegen Mij gemord hebt.","30":"U zult in dat land niet komen, waarover Ik Mijn hand opgeheven heb, om u daarin te laten wonen, behalve Kaleb, de zoon van Jefunne, en Jozua, de zoon van Nun.","31":"En uw kinderen, van wie u zei: Zij zullen tot roof worden! die zal Ik daarin brengen, en zij zullen dat land kennen dat u smadelijk verworpen hebt.","32":"Maar wat u betreft, uw dode lichamen zullen in deze woestijn vallen!","33":"En uw kinderen zullen als herders rondtrekken in deze woestijn, veertig jaar, en zullen uw hoererijen dragen, totdat uw dode lichamen verteerd zijn in deze woestijn.","34":"Naar het getal van de dagen waarin u dat land verspied hebt, veertig dagen, elke dag voor elk jaar, zult u uw ongerechtigheden dragen, veertig jaar, en u zult Mijn tegenwerking ervaren.","35":"Ik, de HEERE, heb gesproken: zo zal Ik zeker doen aan deze hele slechte vergadering van hen die zich tegen Mij verzameld hebben; zij zullen in deze woestijn omkomen, en zullen daar sterven!","36":"En die mannen die Mozes gezonden had om het land te verspieden, en die teruggekomen waren en de hele vergadering tegen hem hadden laten morren, doordat zij een kwaad bericht over dat land verspreidden,","37":"diezelfde mannen die een kwaad bericht over dat land verspreid hadden, stierven door een plaag, voor het aangezicht van de HEERE.","38":"Maar Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, bleven in leven, van de mannen die weggegaan waren om het land te verspieden.","39":"En Mozes sprak deze woorden tot al de kinderen van Israël. Toen treurde het volk zeer.","40":"En zij stonden 's morgens vroeg op, en klommen op de top van de berg, en zeiden: Zie, hier zijn wij, en wij zullen optrekken naar de plaats die de HEERE gezegd heeft; want wij hebben gezondigd!","41":"Maar Mozes zei: Waarom overtreedt u zo het bevel van de HEERE? Want dat zal niet voorspoedig zijn.","42":"Trek niet op, want de HEERE zal niet in uw midden zijn; anders wordt u verslagen voor het aangezicht van uw vijanden.","43":"Want de Amalekieten en de Kanaänieten zijn daar vóór u, en u zult door het zwaard vallen; want omdat u zich hebt afgekeerd van de HEERE, zal de HEERE niet met u zijn.","44":"Toch waagden zij het roekeloos, om de top van de berg te beklimmen; maar de ark van het verbond van de HEERE en Mozes weken niet uit het midden van het leger.","45":"Toen kwamen de Amalekieten en de Kanaänieten, die in dat gebergte woonden, naar beneden, en sloegen hen, en versloegen hen, tot Horma toe."},"SV":{"1":"Toen verhief zich de gehele vergadering, en zij hieven hun stem op, en het volk weende in dienzelven nacht.","2":"En al de kinderen Israëls murmureerden tegen Mozes en tegen Aäron; en de gehele vergadering zeide tot hen: Och, of wij in Egypteland gestorven waren! of, och, of wij in deze woestijn gestorven waren!","3":"En waarom brengt ons de HEERE naar dat land, dat wij door het zwaard vallen, *en* onze vrouwen, en onze kinderkens ten roof worden? Zou het ons niet goed zijn naar Egypte weder te keren?","4":"En zij zeiden de een tot den ander: Laat ons een hoofd opwerpen, en wederkeren naar Egypte!","5":"Toen vielen Mozes en Aäron op hun aangezichten, voor het aangezicht van de ganse gemeente der vergadering van de kinderen Israëls.","6":"En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, zijnde van degenen, die dat land verspied hadden, scheurden hun klederen.","7":"En zij spraken tot de ganse vergadering der kinderen Israëls, zeggende: Het land, door hetwelk wij getrokken zijn, om hetzelve te verspieden, is een uitermate goed land.","8":"Indien de HEERE een welgevallen aan ons heeft, zo zal Hij ons in dat land brengen, en zal ons dat geven; een land, hetwelk van melk en honig is vloeiende.","9":"Alleen zijt tegen den HEERE niet wederspannig! en vreest gij niet het volk dezes lands; want zij zijn ons brood! hun schaduw is van hen geweken, en de HEERE is met ons; vreest hen niet!","10":"Toen zeide de ganse vergadering, dat men hen met stenen stenigen zoude. Maar de heerlijkheid des HEEREN verscheen in de tent der samenkomst, voor al de kinderen Israëls.","11":"En de HEERE zeide tot Mozes: Hoe lang zal mij dit volk tergen? En hoe lang zullen zij aan Mij niet geloven, door alle tekenen, die Ik in het midden van hen gedaan heb?","12":"Ik zal het met pestilentie slaan, en Ik zal het verstoten; en Ik zal u tot een groter en sterker volk maken, dan dit is.","13":"En Mozes zeide tot den HEERE: Zo zullen het de Egyptenaars horen; want Gij hebt door Uw kracht dit volk uit het midden van hen doen optrekken;","14":"En zij zullen zeggen tot de inwoners van dit land, *die* gehoord hebben, dat Gij, HEERE! in het midden van dit volk zijt; dat Gij, HEERE! oog aan oog gezien wordt, dat Uw wolk over hen staat, en Gij in een wolkkolom voor hun aangezicht gaat des daags, en in een vuurkolom des nachts.","15":"En zoudt Gij dit volk als een enigen man doden, zo zouden de heidenen, die Uw gerucht gehoord hebben, spreken, zeggende:","16":"Omdat de HEERE dit volk niet kon brengen in dat land, hetwelk Hij hun gezworen had, zo heeft Hij hen geslacht in de woestijn!","17":"Nu dan, laat toch de kracht des Heeren groot worden, gelijk als Gij gesproken hebt, zeggende:","18":"De HEERE is lankmoedig en groot van weldadigheid, vergevende de ongerechtigheid en overtreding, die *den* *schuldige* geenszins onschuldig houdt, bezoekende de ongerechtigheid der vaderen aan de kinderen, in het derde en in het vierde *lid*.","19":"Vergeef toch de ongerechtigheid dezes volks, naar de grootte Uwer goedertierenheid, en gelijk Gij ze aan dit volk, van Egypteland af tot hiertoe, vergeven hebt!","20":"En de HEERE zeide: Ik heb hun vergeven naar uw woord.","21":"Doch zekerlijk, *zo* *waarachtig* *als* Ik leef, zo zal de ganse aarde met de heerlijkheid des HEEREN vervuld worden!","22":"Want al de mannen, die gezien hebben Mijn heerlijkheid, en Mijn tekenen, die Ik in Egypte en in de woestijn gedaan heb, en Mij nu tienmaal verzocht hebben, en Mijner stem niet zijn gehoorzaam geweest;","23":"Zo zij het land, hetwelk Ik aan hun vaderen gezworen heb, zien zullen. Ja, geen van die Mij getergd hebben, zullen dat zien!","24":"Doch Mijn knecht Kaleb, omdat een andere geest met hem geweest is, en hij volhard heeft Mij na te volgen, zo zal Ik hem brengen tot het land, in hetwelk hij gekomen was, en zijn zaad zal het erfelijk bezitten.","25":"De Amalekieten nu en de Kanaänieten wonen in het dal; wendt u morgen, en maakt uw reize naar de woestijn, op den weg naar de Schelfzee.","26":"Daarna sprak de HEERE tot Mozes en tot Aäron, zeggende:","27":"Hoe lang zal *Ik* bij deze boze vergadering zijn, die tegen Mij zijn murmurerende? Ik heb gehoord de murmureringen van de kinderen Israëls, waarmede zij tegen Mij zijn murmurerende.","28":"Zeg tot hen: *Zo* *waarachtig* *als* Ik leef, spreekt de HEERE, indien Ik ulieden zo niet doe, gelijk als gij in Mijn oren gesproken hebt!","29":"Uw dode lichamen zullen in deze woestijn vallen; en al uw getelden, naar uw gehele getal, van twintig jaren oud en daarboven, gij, die tegen Mij gemurmureerd hebt.","30":"Zo gij in dat land komt, over hetwelk Ik Mijn hand opgeheven heb, dat Ik u daarin zou doen wonen, behalve Kaleb, de zoon van Jefunne, en Jozua, de zoon van Nun.","31":"En uw kinderkens, waarvan gij zeidet: Zij zullen ten roof worden! die zal Ik daarin brengen, en die zullen bekennen dat land, hetwelk gij smadelijk verworpen hebt.","32":"Maar u aangaande, uw dode lichamen zullen in deze woestijn vallen!","33":"En uw kinderen zullen gaan weiden in deze woestijn, veertig jaren, en zullen uw hoererijen dragen, totdat uw dode lichamen verteerd zijn in deze woestijn.","34":"Naar het getal der dagen, in welke gij dat land verspied hebt, veertig dagen, elken dag voor elk jaar, zult gij uw ongerechtigheden dragen, veertig jaren, en gij zult gewaar worden Mijn afbreking.","35":"Ik, de HEERE, heb gesproken: zo Ik dit aan deze ganse boze vergadering dergenen, die zich tegen Mij verzameld hebben, niet doe, zij zullen in deze woestijn te niet worden, en zullen daar sterven!","36":"En die mannen, die Mozes gezonden had, om het land te verspieden, en wedergekomen zijnde, de ganse vergadering tegen hem hadden doen murmureren , een kwaad gerucht over dat land voortbrengende;","37":"Diezelfde mannen, die een kwaad gerucht van dat land voortgebracht hadden, stierven door een plaag, voor het aangezicht des HEEREN.","38":"Maar Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, bleven levende van de mannen, die heengegaan waren, om het land te verspieden.","39":"En Mozes sprak deze woorden tot al de kinderen Israëls. Toen treurde het volk zeer.","40":"En zij stonden des morgens vroeg op, en klommen op de hoogte des bergs, zeggende: Ziet, hier zijn wij, en wij zullen optrekken tot de plaats, die de HEERE gezegd heeft; want wij hebben gezondigd!","41":"Maar Mozes zeide: Waarom overtreedt gij alzo het bevel des HEEREN? Want dat zal geen voorspoed hebben.","42":"Trekt niet op, want de HEERE zal in het midden van u niet zijn; opdat gij niet geslagen wordt, voor het aangezicht uwer vijanden.","43":"Want de Amalekieten, en de Kanaänieten zijn daar voor uw aangezicht, en gij zult door het zwaard vallen; want, omdat gij u afgekeerd hebt van den HEERE, zo zal de HEERE met u niet zijn.","44":"Nochtans poogden zij vermetel, om op de hoogte des bergs te klimmen; maar de ark des verbonds des HEEREN en Mozes scheidden niet uit het midden des legers.","45":"Toen kwamen af de Amalekieten en de Kanaänieten, die in dat gebergte woonden, en sloegen hen, en versmeten hen, tot Horma toe."},"KJV":{"1":"And all the congregation lifted up their voice, and cried; and the people wept that night.","2":"And all the children of Israel murmured against Moses and against Aaron: and the whole congregation said unto them, Would God that we had died in the land of Egypt! or would God we had died in this wilderness!","3":"And wherefore hath the LORD brought us unto this land, to fall by the sword, that our wives and our children should be a prey? were it not better for us to return into Egypt?","4":"And they said one to another, Let us make a captain, and let us return into Egypt.","5":"Then Moses and Aaron fell on their faces before all the assembly of the congregation of the children of Israel.","6":"And Joshua the son of Nun, and Caleb the son of Jephunneh, *which were* of them that searched the land, rent their clothes:","7":"And they spake unto all the company of the children of Israel, saying, The land, which we passed through to search it, *is* an exceeding good land.","8":"If the LORD delight in us, then he will bring us into this land, and give it us; a land which floweth with milk and honey.","9":"Only rebel not ye against the LORD, neither fear ye the people of the land; for they *are* bread for us: their defence is departed from them, and the LORD *is* with us: fear","10":"But all the congregation bade stone them with stones. And the glory of the LORD appeared in the tabernacle of the congregation before all the children of Israel.","11":"And the LORD said unto Moses, How long will this people provoke me? and how long will it be ere they believe me, for all the signs which I have shewed among","12":"I will smite them with the pestilence, and disinherit them, and will make of thee a greater nation and mightier","13":"And Moses said unto the LORD, Then the Egyptians shall hear *it*, (for thou broughtest up this people in thy might from among","14":"And they will tell *it* to the inhabitants of this land: *for* they have heard that thou LORD *art* among this people, that thou LORD art seen face to face, and *that* thy cloud standeth over them, and *that* thou goest before them, by day time in a pillar of a cloud, and in a pillar of fire by night.","15":"Now *if* thou shalt kill *all* this people as one man, then the nations which have heard the fame of thee will speak, saying,","16":"Because the LORD was not able to bring this people into the land which he sware unto them, therefore he hath slain them in the wilderness.","17":"And now, I beseech thee, let the power of my Lord be great, according as thou hast spoken, saying,","18":"The LORD *is* longsuffering, and of great mercy, forgiving iniquity and transgression, and by no means clearing *the guilty*, visiting the iniquity of the fathers upon the children unto the third and fourth","19":"Pardon, I beseech thee, the iniquity of this people according unto the greatness of thy mercy, and as thou hast forgiven this people, from Egypt even until now.","20":"And the LORD said, I have pardoned according to thy word:","21":"But *as* truly *as* I live, all the earth shall be filled with the glory of the LORD.","22":"Because all those men which have seen my glory, and my miracles, which I did in Egypt and in the wilderness, and have tempted me now these ten times, and have not hearkened to my voice;","23":"Surely they shall not see the land which I sware unto their fathers, neither shall any of them that provoked me see","24":"But my servant Caleb, because he had another spirit with him, and hath followed me fully, him will I bring into the land whereinto he went; and his seed shall possess","25":"(Now the Amalekites and the Canaanites dwelt in the valley.) To morrow turn you, and get you into the wilderness by the way of the Red sea.","26":"And the LORD spake unto Moses and unto Aaron, saying,","27":"How long *shall I bear with* this evil congregation, which murmur against me? I have heard the murmurings of the children of Israel, which they murmur","28":"Say unto them, *As truly as* I live, saith the LORD, as ye have spoken in mine ears, so will I do","29":"Your carcases shall fall in this wilderness; and all that were numbered of you, according to your whole number, from twenty years old and upward, which have murmured","30":"Doubtless ye shall not come into the land, *concerning* which I sware to make you dwell therein, save Caleb the son of Jephunneh, and Joshua the son of Nun.","31":"But your little ones, which ye said should be a prey, them will I bring in, and they shall know the land which ye have despised.","32":"But *as for* you, your carcases, they shall fall in this wilderness.","33":"And your children shall wander in the wilderness forty years, and bear your whoredoms, until your carcases be wasted in the wilderness.","34":"After the number of the days in which ye searched the land, *even* forty days, each day for a year, shall ye bear your iniquities, *even* forty years, and ye shall know my breach of promise.","35":"I the LORD have said, I will surely do it unto all this evil congregation, that are gathered together against me: in this wilderness they shall be consumed, and there they shall die.","36":"And the men, which Moses sent to search the land, who returned, and made all the congregation to murmur against him, by bringing up a slander upon the land,","37":"Even those men that did bring up the evil report upon the land, died by the plague before the LORD.","38":"But Joshua the son of Nun, and Caleb the son of Jephunneh, *which were* of the men that went to search the land, lived","39":"And Moses told these sayings unto all the children of Israel: and the people mourned greatly.","40":"And they rose up early in the morning, and gat them up into the top of the mountain, saying, Lo, we *be here*, and will go up unto the place which the LORD hath promised: for we have sinned.","41":"And Moses said, Wherefore now do ye transgress the commandment of the LORD? but it shall not prosper.","42":"Go not up, for the LORD *is* not among you; that ye be not smitten before your enemies.","43":"For the Amalekites and the Canaanites *are* there before you, and ye shall fall by the sword: because ye are turned away from the LORD, therefore the LORD","44":"But they presumed to go up unto the hill top: nevertheless the ark of the covenant of the LORD, and Moses, departed not out of the camp.","45":"Then the Amalekites came down, and the Canaanites which dwelt in t gainst <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron:</span> and the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Would <span class=\"wl wl-kjv\" data-code=\"H3863\">God</span> that we had <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt!</span> or would <span class=\"wl wl-kjv\" data-code=\"H3863\">God</span> we had <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> in this wilderness!","3":"And wherefore hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> us unto this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> to <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> that our <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> and our <span class=\"wl wl-kjv\" data-code=\"H2945\">children</span> should be a <span class=\"wl wl-kjv\" data-code=\"H957\">prey?</span> were it not <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> for us to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into Egypt?","4":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H251\">another,</span> Let us <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H7218\">captain,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into Egypt.","5":"Then <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> on their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> all the <span class=\"wl wl-kjv\" data-code=\"H6951\">assembly</span> of the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","6":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5126\">Nun,</span> and <span class=\"wl wl-kjv\" data-code=\"H3612\">Caleb</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3312\">Jephunneh,</span> which were of them that <span class=\"wl wl-kjv\" data-code=\"H8446\">searched</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> their clothes:","7":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5712\">company</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which we <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> through to <span class=\"wl wl-kjv\" data-code=\"H8446\">search</span> it, is an <span class=\"wl wl-kjv\" data-code=\"H3966\">exceeding</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> land.","8":"If the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2654\">delight</span> in us, then he will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> us into this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it us; a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which <span class=\"wl wl-kjv\" data-code=\"H2100\">floweth</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> and honey.","9":"Only <span class=\"wl wl-kjv\" data-code=\"H4775\">rebel</span> not ye against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> neither <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> ye the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> for they are <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> for us: their <span class=\"wl wl-kjv\" data-code=\"H6738\">defence</span> is <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> from them, and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is with us: fear","10":"But all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H559\">bade</span> <span class=\"wl wl-kjv\" data-code=\"H7275\">stone</span> them with <span class=\"wl wl-kjv\" data-code=\"H68\">stones.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation</span> before all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> How long will this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5006\">provoke</span> me? and how long will it be <span class=\"wl wl-kjv\" data-code=\"H3808\">ere</span> they <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> me, for all the <span class=\"wl wl-kjv\" data-code=\"H226\">signs</span> which I have <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> among","12":"I will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> them with the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> and <span class=\"wl wl-kjv\" data-code=\"H3423\">disinherit</span> them, and will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> of thee a <span class=\"wl wl-kjv\" data-code=\"H1419\">greater</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> and mightier","13":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Then the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> it, (for thou broughtest <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in thy <span class=\"wl wl-kjv\" data-code=\"H3581\">might</span> from among","14":"And they will <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> it to the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of this <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> for they have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that thou <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> art <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> art <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">face</span> to <span class=\"wl wl-kjv\" data-code=\"H5869\">face,</span> and that thy <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">standeth</span> over them, and that thou <span class=\"wl wl-kjv\" data-code=\"H1980\">goest</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, by day <span class=\"wl wl-kjv\" data-code=\"H3119\">time</span> in a <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> of a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> and in a <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> by night.","15":"Now if thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> all this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> then the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> which have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H8088\">fame</span> of thee will <span class=\"wl wl-kjv\" data-code=\"H559\">speak,</span> saying,","16":"Because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H1115\">not</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which he <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto them, therefore he hath <span class=\"wl wl-kjv\" data-code=\"H7819\">slain</span> them in the wilderness.","17":"And now, I beseech thee, let the <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> of my <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> be <span class=\"wl wl-kjv\" data-code=\"H1431\">great,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">according</span> as thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken,</span> saying,","18":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H750\">longsuffering,</span> and of <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">forgiving</span> <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> and <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression,</span> and by no <span class=\"wl wl-kjv\" data-code=\"H5352\">means</span> <span class=\"wl wl-kjv\" data-code=\"H5352\">clearing</span> the guilty, <span class=\"wl wl-kjv\" data-code=\"H6485\">visiting</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8029\">third</span> and fourth","19":"<span class=\"wl wl-kjv\" data-code=\"H5545\">Pardon,</span> I beseech thee, the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> according unto the <span class=\"wl wl-kjv\" data-code=\"H1433\">greatness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy,</span> and as thou hast <span class=\"wl wl-kjv\" data-code=\"H5375\">forgiven</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> from <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> even until now.","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5545\">pardoned</span> according to thy word:","21":"But as <span class=\"wl wl-kjv\" data-code=\"H199\">truly</span> as I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> with the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the LORD.","22":"Because all those <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> which have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> my <span class=\"wl wl-kjv\" data-code=\"H3519\">glory,</span> and my <span class=\"wl wl-kjv\" data-code=\"H226\">miracles,</span> which I <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> and in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and have <span class=\"wl wl-kjv\" data-code=\"H5254\">tempted</span> me now these <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times,</span> and have not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> to my voice;","23":"Surely they shall <span class=\"wl wl-kjv\" data-code=\"H518\">not</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> neither shall any of them that <span class=\"wl wl-kjv\" data-code=\"H5006\">provoked</span> me see","24":"But my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3612\">Caleb,</span> <span class=\"wl wl-kjv\" data-code=\"H6118\">because</span> he had <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> with him, and hath <span class=\"wl wl-kjv\" data-code=\"H310\">followed</span> me <span class=\"wl wl-kjv\" data-code=\"H4390\">fully,</span> him will I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> whereinto he <span class=\"wl wl-kjv\" data-code=\"H935\">went;</span> and his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall possess","25":"(Now the <span class=\"wl wl-kjv\" data-code=\"H6003\">Amalekites</span> and the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley.)</span> To <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">turn</span> you, and <span class=\"wl wl-kjv\" data-code=\"H5265\">get</span> you into the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> sea.","26":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> saying,","27":"How long shall I bear with this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> which <span class=\"wl wl-kjv\" data-code=\"H3885\">murmur</span> against me? I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H8519\">murmurings</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which they murmur","28":"<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> unto them, As truly <span class=\"wl wl-kjv\" data-code=\"H3808\">as</span> I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as ye have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> in mine <span class=\"wl wl-kjv\" data-code=\"H241\">ears,</span> so will I do","29":"Your <span class=\"wl wl-kjv\" data-co d":"tegen Mozes en tegen Aäron;","tekst":"En dienvolgens tegen God zelven, wiens dienaars zij waren."}],"3":[{"catchword":"waarom brengt ons de HEERE naar dat land,","tekst":"Het schijnt dat zij God beschuldigen willen van onbedachtzaamheid, alsof Hij niet verzon wat Hij voorgenomen had, òf van ontrouw, alsof Hij niet wilde doen wat Hij voorgenomen had, òf van onvermogen, alsof Hij niet Kon."},{"catchword":"door het zwaard vallen,","tekst":"Zie Lev 26:7."},{"catchword":"ten roof worden?","tekst":"Te weten, aan onze vijanden, de Kanaänieten."}],"4":[{"catchword":"de een tot den ander","tekst":"Hebreeuws, de man tot zijn broeder"},{"catchword":"opwerpen,","tekst":"Hebreeuws, zetten, stellen, maken."}],"5":[{"catchword":"vielen Mozes en Aäron op hun aangezichten,","tekst":"Te weten, om het volk te bidden, dat het van hun kwaad voornemen zou afstand doen en niet wederkeren naar Egypte; of, om God aan te roepen, zowel voor het volk, dat Hij het bekeren zou, als voor henzelven, dat Hij hen uit het tegenwoordig gevaar verlossen wilde."}],"6":[{"catchword":"scheurden hun klederen","tekst":"Zie van de verscheuring der klederen, in tijd van grote droefenis en verslagenheid; Gen 37:29."}],"7":[{"catchword":"uitermate goed land","tekst":"Hebreeuws, zeer zeer goed. Zie de verdubbeling van het woord zeer ook Gen 17:2, Gen 17:6, Gen 17:20; Eze 16:13."}],"8":[{"catchword":"Indien de HEERE een welgevallen aan ons heeft,","tekst":"Dat is, zo wij de gunst des HEEREN door een goddeloos en wederspannig wezen van ons niet afkeren. Zie het begin van vs.9."}],"9":[{"catchword":"zij zijn ons brood","tekst":"Dat is, zo lichtelijk zullen zij door ons verdaan worden, als het brood door een gezond mens in den mond gekauwd en in de maag verteerd wordt. Vergelijk Deu 31:17."},{"catchword":"schaduw is van hen geweken,","tekst":"Dat is, beschutting. Alzo Psa 91:1; Isa 25:4; Jer 48:45, enz."},{"catchword":"de HEERE is met ons;","tekst":"Te weten, met zijn vaderlijke gunst, vlijtige voorzienigheid en krachtigen bijstand. Zie Gen 21:22, en Gen 26:24."}],"10":[{"catchword":"heerlijkheid des HEEREN verscheen","tekst":"Te weten, door het teken van de wolk, in welke God gewoon was den Israëlieten zeer heerlijk te verschijnen; Exo 16:7, Exo 16:10, en Exo 24:15-16, en Exo 40:34, en Lev 9:6; 2Ch 5:14."}],"11":[{"catchword":"aan Mij niet geloven,","tekst":"Dat is, op Mij niet vertrouwen, geen acht gevende op al de wonderwerken, met welke Ik mijn kracht en weldadigheid onder hen overvloediglijk bewezen heb."}],"12":[{"catchword":"verstoten;","tekst":"Versta dit niet als een volle besloten sententie maar als een conditioneel dreigement hetwelk de Heere zijnen knecht Mozes heeft willen voorhouden, om zijn ijver en zijn voorbidding, tot het welvaren des volks, te ontsteken; zodat deze woorden niet betekenen wat God in zijn onveranderlijken raad besloten had, maar de straf, die de Israëlieten verdiend hadden."}],"13":[{"catchword":"de Egyptenaars horen;","tekst":"De redenen, die Mozes gebruikt om voor het volk te bidden, zijn drie. De eerste is genomen van de vijanden Gods en zijns volks, die de ere Gods, zo Hij zijn volk uitroeide, zouden schenden, in vs.13-16. De tweede van de natuur en het genadige verbond Gods, vs.17,18. De derde van de voorgaande weldaden en exempelen der goddelijke genade, aan dit volk zeer dikwijls bewezen, vs.19."}],"14":[{"catchword":"die gehoord hebben,","tekst":"Dit woordje wordt hier ingevoegd uit vs.15."},{"catchword":"oog aan oog gezien wordt,","tekst":"Dat is, ogenschijnlijk en zeer gemeenzaam. Vergelijk Gen 32:30; Exo 33:11; boven, Num 12:8; Deu 5:4; 1Ki 22:19."}],"15":[{"catchword":"als een enigen man doden,","tekst":"Dat is, het gehele volk, alsof het slechts één mens ware. Alzo Jdg 6:16."},{"catchword":"Uw gerucht gehoord hebben,","tekst":"Hebreeuws, uw gehoor gehoord hebben."}],"17":[{"catchword":"kracht des HEEREN groot worden,","tekst":"Om bij zijn gerechtigheid ook zijn barmhartigheid te voegen."}],"18":[{"catchword":"lankmoedig en groot van weldadigheid,","tekst":"Hebreeuws, lang van toornigheden. Zie Exo 34:6."},{"catchword":"die den schuldige","tekst":"Bij de barmhartigheid Gods wordt ook zijn gerechtigheid gevoegd, omdat zij in Hem onafscheidelijk zijn; om welke oorzaak Mozes niet enkel begeert genade, maar alzo dat Gods gerechtigheid ook een plaats zou hebben, opdat Hij in het oordelen en straffen zijner barmhartigheid zou gedachtig wezen. Zie Exo 34:7; Jer 30:11; Nah 1:3."},{"catchword":"bezoekende de ongerechtigheid der vaderen aan de kinderen,","tekst":"Zie Gen 21:1, en Exo 20:5."},{"catchword":"derde en in het vierde lid.","tekst":"Hebreeuws, aan de derde en aan de vierde; te weten, nakomelingen van den stam af gerekend zijnde."}],"21":[{"catchword":"heerlijkheid des HEEREN","tekst":"Versta, de gerechtigheid en kracht des HEEREN, die tot zijn eer op den gansen aardbodem voor alle mensen zouden bekend gemaakt worden."}],"22":[{"catchword":"tienmaal verzocht hebben,","tekst":"Dat is, dikwijls; een zeker getal voor een onzeker. Zie Gen 21:7, en Lev 26:8."}],"23":[{"catchword":"Zo zij het land,","tekst":"Dat is, zij zullen het niet zien, gelijk de laatste woorden van dit vs. uitdrukkelijk verklaren; versta dan hierbij, om den zin aan te vullen: Ik zal niet leven, of iets anders. Want hier wordt door God menselijker wijze gesproken, omdat het bij de Hebreën gebruikelijk was, in het eedzweren de uitkomst of den wens, zo men kwalijk zwoer, te verzwijgen. Vergelijk Gen 14:23. Zulk een manier van zweren wordt elders ook Gode toegeschreven, gelijk onder, vs.28, 35, en Num 32:11-12; Deu 1:35; 2Ki 9:26; Psa 89:36."}],"24":[{"catchword":"mijn knecht Kaleb,","tekst":"Jozua wordt hier niet genoemd, omdat God deze sententie uitspreekt over het volk, dat in het leger was waar Kaleb zich ophield, maar Jozua was bij Mozes en Aäron, bij de tent der samenkomst; daarom wordt hij ook niet gerekend, noch verwezen met het volk, dat in het leger was, [gelijk hij ook uitdrukkelijk genoemd wordt vs.30]. Alzo zijn ook hier Mozes en Aäron uitgenomen, overmits zij met dat volk niet gezondigd hadden, hoewel zij om een andere particuliere oorzaak die hierna verklaard wordt, Num 20:12, mede buiten het land gestorven zijn."},{"catchword":"en hij volhard heeft Mij na te volgen,","tekst":"Hebreeuws, en heeft vervuld achter Mij [te gaan], dat is, heeft Mij gestadiglijk, trouwelijk en met een oprecht hart gehoorzaamheid bewezen. Alzo Deu 1:36; 1Ki 11:6."}],"25":[{"catchword":"in het dal;","tekst":"Te weten, op de andere zijde van dat gebergte in de laagte. Hiermede werden de Israëlieten gewaarschuwd voor het gevaar, dat hun aanstaande was, zo zij voorttrokken, omdat zij aan de grenzen van hun vijanden gekomen waren, die op hen wachtten, en die zij niet zouden kunnen overwinnen, omdat God met hen niet was. Zie onder, vs.43."},{"catchword":"Schelfzee","tekst":"Anders, biezenzee, of rietzee. Versta, de Rode zee, die alzo genoemd wordt om de menigte der biezen, die daarin en voornamelijk aan den oever derzelve wiessen. Zie van deze zee ook onder, Num 21:4; Psa 106:7, Psa 106:9, Psa 106:22, en Psa 136:13. Hebreeuws, der Schelfzee."}],"27":[{"catchword":"Hoe lang zal Ik","tekst":"Zie gelijke manier van spreken Mat 17:17. Anders, hoelang zal Ik deze boze vergadering [verdragen of vergeven] die tegen Mij, enz. Of, hoelang zal Ik deze boze vergadering die tegen Mij is murmurerende, [en] de murmurering der kinderen Israëls, waarmede, enz. horen?"}],"28":[{"catchword":"indien Ik ulieden zo niet doe,","tekst":"Zie boven, vs.23."},{"catchword":"gesproken hebt","tekst":"Wat zij gesproken hebben, toen zij murmureerden; zie boven, vs.2."}],"29":[{"catchword":"getelden,","tekst":"Zie van dezen, boven, Num 1:1-2, enz."}],"30":[{"catchword":"Mijn hand opgeheven heb,","tekst":"De manier van zweren, die de mensen gebruiken, God tot getuige nemende, naar wien zij de hand opsteken, wordt Gode menselijker wijze toegeschreven. Zie van deze manier van zweren Gen 14:22."}],"33":[{"catchword":"weiden in deze woestijn,","tekst":"Hebreeuws, zullen zijn weidende. Het Hebreeuwse woord betekent schaapherders te zijn, of als schaapherders met de kudde herwaarts en derwaarts om te zweven om goede weiden te zoeken. Waarmede verstaan wordt een onzeker en ongestadig leven op de aarde. Vergelijk Isa 38:12."},{"catchword":"veertig jaren,","tekst":"Te weten, hierin begrepen zijnde den tijd van hun uittocht uit Egypte, gelijk blijkt onder, Num 33:38, en Deu 1:3, en Deu 2:14."},{"catchword":"uw hoererijen dragen,","tekst":"Dat is, de straffen, die gij door uw velerlei geestelijke hoererij en afvalligheid verdiend hebt. De geestelijke hoererij is afgodendienst, van welken zie Exo 34:15-16; en alhoewel deze kinderen de straf hunner ouders leden, aldus vele jaren door de woestijn dwalende, nochtans was God niet onrechtvaardig, overmits zij ook hun menigvuldige zonden hadden, die straf verdienden."}],"34":[{"catchword":"ongerechtigheden dragen,","tekst":"Dat is, de straf uwer ongerechtigheden. Zie Gen 4:13."},{"catchword":"veertig jaren,","tekst":"Zijnde er onder begrepen de tijd, die nu voorbij was, sedert zij uit Egypte getogen waren. Zie boven, vs.33."},{"catchword":"Mijn afbreking","tekst":"Dit kan men verstaan ten aanzien van God, die om hun langdurige wederspannigheid van hen zou wijken, of ten aanzien van het volk, dat, van God afwijkende, dezelfde straf verdiend had."}],"35":[{"catchword":"zo Ik dit aan deze ganse boze vergadering","tekst":"Zie boven, vs.23."}],"37":[{"catchword":"stierven","tekst":"Anders, zullen sterven"},{"catchword":"een plaag,","tekst":"Sommigen verstaan deze plaag van de pestilentie, bedreigd boven, vs.12; anderen van een haastigen en snellen dood, uit de tegenstelling van Jozua en Kaleb, welke levend bleven, onder, vs.38."},{"catchword":"voor het aangezicht des HEEREN","tekst":"Dat is, God de Heere had op een zeldzame manier zijn oordeel tegen hen uitgevoerd, alsof Hij tot dit einde openlijk op den rechterstoel gezeten had."}],"40":[{"catchword":"de hoogte des bergs,","tekst":"Hebreeuws, hoofd"},{"catchword":"wij hebben gezondigd","tekst":"Dit is geen oprechte belijdenis noch berouw geweest, dewijl die zich niet recht bekeren, welke van één kwaad ophoudende, in een ander vervallen, gelijk deze Israëlieten deden, want zij hielden wel op van murmureren, maar wilden daarna, tegen het bevel des HEEREN, het land Kanaän innemen."}],"41":[{"catchword":"het bevel des HEEREN?","tekst":"Hebreeuws, mond. Versta, het bevel Gods, van hetwelk zie boven, vs.25."}],"42":[{"catchword":"het midden van u niet zijn;","tekst":"Te weten, met zijn hulp en bijstand."}],"44":[{"catchword":"poogden zij vermetel,","tekst":"Het Hebreeuwse woord betekent met een stouten moed en grote woeling iets lichtvaardiglijk aan te gaan, en bijzonderlijk in het trachten naar enige hoogte."}],"45":[{"catchword":"Horma toe","tekst":"De naam van een plaats, naderhand zo genoemd vanwege deze nederlaag. Zie Num 21:3."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then all the Congregation raised themselves, and lifted up their voice: [Hebrew then all the Congregation raised, and gave their voice] and the people wept in that night."}],"2":[{"catchword":null,"tekst":"And all the children of Israel murmured against Moseh, and against Aaron: [And consequently against God himself, whose Ministers they were] and the whole Congregation said to him; O that we had died in the Land of Egypt, or, O that we had died in this wilderness!"}],"3":[{"catchword":null,"tekst":"And wherefore doth God bring us to that Land, [They seem to charge God with unadvisedness, as if he had not considered, what he had undertaken; with unfaithfulness, as if he had no mind or intent to perform what he promised; or, with weakness and insufficiency, as if he were not able to effect it] that we fall by the sword [see Levit. 26. On verse 7.] (and) our wives, and our little ones become a prey? [viz. to our enemies the Canaanites] should it not be good for us to return to Egypt?"}],"4":[{"catchword":null,"tekst":"And they said the one to the other; [Hebrew the man to his brother] Let us cast up [Hebrew set put, make] a Head, and return to Egypt."}],"5":[{"catchword":null,"tekst":"Then Moses and Aaron fell upon their faces, before the face of the whole assembly of the Congregation of the children of Israel. [viz. for to pray and entreat the people, to desist from their evil purpose and designs of returning into Egypt: or for to call upon God, as well in the peoples behalf, that he would convert them, as in their own, that he would preserve and rescue them, from the imminent danger.]"}],"6":[{"catchword":null,"tekst":"And Joshua the son of Nun, and Caleb the son of Jephunne, being of those, which had spied that Land, rent their garments. [Of rending their clothes in time of great trouble and distress, see Genesis 37. On verse 29.]"}],"7":[{"catchword":null,"tekst":"And they spake to the whole Congregation of the children of Israel, saying; The Land through which we went, to spy the same, is an exceeding good Land. [Hebrew. very, wise Genesis.17.v.2,6 .20. and Ezech.16.13.]"}],"8":[{"catchword":null,"tekst":"If the LORD take pleasure in us, [i.e. if we do not turn away Gods favourableness from us by our wicked and rebellious courses: see the beginning of the next verse] he shall bring us into that Land, and shall give us the same; a Land that floweth with milk and honey."}],"9":[{"catchword":null,"tekst":"Onely be not rebellious against the LORD, and fear not ye the people of this Land, for they are bread to us: [i.e. they shall be as easily subdued by us, as bread is chewed in a sound mans mouth, and consumed in his stomach. Compare, Deut.31.on v.17.] their shadow, i.e. their defense and protection. See Psalm 91. 1. Isa 25:4. Jer 48:45, etc.] is withdrawn from them, and the LORD is with us, [viz. with his fatherly grace and favour, watchful providence, and powerful assistance. See Genesis 21. on verse 22. and chapter 26. on v. 24.] fear them not."}],"10":[{"catchword":null,"tekst":"Then all the Congregation said, they ought to be stoned with stones: but the glory the LORD appeared in the Tent of the Congregation, before all the children of Israel. [viz. by the outward token of the Cloud, wherein God used to appear now and then unto the Israelites in a very glorious manner, Exod. 16. 7. 10. and chapter 24.15, 16. and chapter 40.34. and Lev.9.on v. 6. 2 Chron.5 14.]"}],"11":[{"catchword":null,"tekst":"And the LORD said to Moseh; How long shall that people provoked me? And how long will they not believe on me through all the tokens, which I did in the Middest of them? [i.e. will they never trust and rely on me, and leave quite unregarded those manifold and wonderful works, which through my power and goodness I have from time to time, wrought so abundantly among them.]"}],"12":[{"catchword":null,"tekst":"I will smite them with pestilence, and I will cast them off: [Understand this, not as a full Decree and Determination, but as a conditional threatening, which the LORD was present to present to Moseh, to kindle his zeal, and stir up his intercession for the peoples welfare; in so much, that these words do not betoken what God determined by his unalterable Decree, but onely what punishments the Israelites had well deserved] and I will make thee a great and stronger people then this is."}],"14":[{"catchword":null,"tekst":"And they shall say to the Inhabitants of this land, (who) [This word is inserted here out of the next verse] heard, that LORD art in the midst of this people: that thou LORD art seen eye to eye: [i.e. most apparently, manifestly and familiarly. Compare Genesis 32. On v.30. Exod.33.on v.11. above chapter.12. on v.8. Deut.5.on v. 4. 1 Kings 22. On v.19.] that thy cloud stands over them, and thou goest before their face in a cloud-pillar by day, and in a fire-pillar by night?"}],"15":[{"catchword":null,"tekst":"And if thou shouldest put this people to death as a single man, [i.e. all the people, as if they were but one man. So Jud.6 16.] then would the heathen, which heard thy fame, [Hebrew hearing] speak saying:"}],"16":[{"catchword":null,"tekst":"Because the LORD was not able to bring this people into that land, which he had sworn to them, therefore did he slay them in the wilderness."}],"17":[{"catchword":null,"tekst":"Now then let the power of the LORD wax great (I pray;) [by joining his Mercy to his justice] according as thou hast spoken, saying;"}],"18":[{"catchword":null,"tekst":"The Lord is long-suffering [Hebrew long of wrathfulness, see Exodus, 34. On verse 6.] and great of bounty, (or Bounteousness, beneficence,) forgiving the iniquity and transgression, holding (the Guilty) in on wise guiltless, [unto the mercy of God, his Justice likewise is added, they being inseparably in him: which regard Moseh doth not simply desire and beg for mercy here, but so, as that the Justine of God, should likewise have some place; and onely that in judging and punishing of his people, he would remember Mercy. See Exo 34:7. Jer 30:11. Nah.1.3.] visiting the iniquity of the Fathers on the children [see Genesis.21. on v.1. and Exod. 20. 5.] in the third and in the fourth (generation.) [Hebrew on the third and on the fourth. (in the plural super tertios etc super quartos) to wit, descendents, or off-springs from the stock.]"}],"19":[{"catchword":null,"tekst":"Forgive (I Pray) the iniquity of this people, according to the greatness of thy tenderness: and according as thou hast forgiven the same unto this people, from the Land of Egypt hitherto."}],"20":[{"catchword":null,"tekst":"And the LORD, said; I have forgiven them according to thy word."}],"21":[{"catchword":null,"tekst":"Yet assuredly (as true as I Live:) all the earth shall be filled with the glory of the LORD. [Understand the Justice and power of the LORD, Which should be made known throughout all the earth before all men.]"}],"22":[{"catchword":null,"tekst":"For all the men, which saw my glory and my tokens, which I did in Egypt, and in the wilderness; and have tempted me ten times now, [i.e. oft times; a certain number for an uncertain. See Genesis 31. On v.7. and Lev. 26.on v.8. and were not obedient to my voice."}],"23":[{"catchword":null,"tekst":"If they shall see the Land, which I sware unto their Fathers, [i.e. they shall never see it, as the following words of this verse do plainly declare: understand therefore hereupon to perfect the sense, then I shall not live, or, the like. For here God is introduced speaking after the manner of men, it being usual among the Hebrews, when they took an oath to conceal the issue or imprecation, in case of swearing falsely. Compare Genesis 41. On verse 23. The like kind of swearing is likewise attributed to God elsewhere, as below, v 28. and 35. and chapter 32. Verse 11. 12. Deuteronomy, 1. 35. 2 Kings 9. 26. Psalm 89. 36.] Nay, none that provoked me shall see the same."}],"24":[{"catchword":null,"tekst":"Yet my servant Caleb, [Joshua is not named here, God pronouncing this sentence over the people, that were in the Camp, where Caleb had his abode, but Joshua was with Moseh and Aaron, at the Tent of the Congregation; therefore also he is not reckoned nor sentenced with the people, which was in the Camp (Wherefore also he is expressly named afterwards, v.30.) and thus Moseh and Aaron likewise are excepted, having not sinned with the people; although for another particular default related below, chapter 20. V.12. they likewise died without entering into the land of Canaan] because there was another spirit with him, and he held on to follow after me: [Hebrew and hath fulfilled (to go) after me, i.e. he hath showed his obedience constantly, faithly, and with an upright heart. So Deuteronomy, 1. 36. And 1 Kings 11. 6.] therefore shall I bring him to the Land, into which he was come, and his seed shall hereditarily possess it."}],"25":[{"catchword":null,"tekst":"The Amalekites now, and the Canaanites dwell in that vale: [viz. on the other side of that mountain, in the bottom. Hereby the Israelites were warned of the danger of advancing further, they being come to the Borders of their Enemies, who stood upon their guard against them, and whom they should not be able to subdue, God going not along with them: See below, v.43.] turn your selves tomorrow, and take your journey toward the wilderness, on the way to the Reed-Sea. [Understand the red-sea, called thus, by reason of the abundance of Reeds and Bul-rushes, which grew in and especially about, or at the shore of it. See further of this sea below, Chapter. 21. v.4. Psa 106:7, 19.22. and 136.13. Hebrew of the reed-sea.]"}],"26":[{"catchword":null,"tekst":"After that, the lord spake to Moseh and to Aaron, saying:"}],"27":[{"catchword":null,"tekst":"How long shall (I) be with this evil Congregation, which are murmuring against me? [See the like expressions, Mat 17:17. otherwise, how long shall I (for bear, or forgive) this evil congregation, which are, etc. or, how long shall I hear this evil congregation, which is murmuring of the children of Israel, whereby they, etc.?] I have heard the murmurings of the children of Israel, whereby they are murmuring against me."}],"28":[{"catchword":null,"tekst":"Saying unto them; (As true as) I live, saith the LORD, if I do not unto you, [See above, on verse 23.] as ye have spoken in my ears: [What they spake when they murmured. See above, verse 2.]"}],"29":[{"catchword":null,"tekst":"Your dead bodies shall fall in this wilderness, and all your numbered (ones,) [Of whom see above, chapter 1. Verse 1, 2, &c.] according to your whole number, from twenty years old and upwards, ye that murmured against me;"}],"30":[{"catchword":null,"tekst":"If ye come into that Land, over which lifted up my hand; [The manner of sweating used among men calling God to witness, by lifting up their hand, is attributed to God here, by the usual phrase among men, of this manner of sweating, see Genesis 14 on v22.] that I would cause you to dwell therein, except Caleb the son of Jephunne, and Joshua the son of Nun."}],"31":[{"catchword":null,"tekst":"And your little ones, of whom ye said; They shall become a prey, them I will bring therein, and they shall know that Land, which ye reproachfully have rejected."}],"32":[{"catchword":null,"tekst":"But as for you, your dead bodies shall fall in the wilderness."}],"33":[{"catchword":null,"tekst":"And your children shall go feeding etc. The Hebrew word implieth, to be shepherds, or, to remove to and fro with the flock, to find out good Pasture; whereby is understood any uncertain and unsettled kind of life here on earth. Compare Isa 38:12.] fourty year, [counting from the time of their coming forth out of Egypt, as it appeareth below, chapter,33.38. and Deuteronomy, 1.3. and chapter 2.14.] and shall bear your whoredomes: [i.e. the punishments due to your manifold spiritual whoredomes, and revolts; spiritual whoredome is Idolatry, whereof see Exodus, 34.15, 16. and Howbeit, those children suffered the punishment of their parents, wandering so many years in the wilderness, yet was not God unjust, they having likewise committed, and committing manifold sins deserving punishment.] until your dead bodies shall be consumed in this wilderness."}],"34":[{"catchword":null,"tekst":"According to the number of thy days, in which ye spyed that land, fourty days; each day for each year shall ye bear your iniquities, [i.e. the punishments of them, see Genesis.4.on.v.13.] fourty year: [the time since their departure out of Egypt, being comprehended in the number; see above verse 33.] and shall perceive (or, be sensible of) my breach. [this may be understood in respect of God, who, by reason of their continual rebellion would separate himself from among them; or, in regard of the people, deserving this punishment by their withdrawing from God.]"}],"35":[{"catchword":null,"tekst":"I the LORD have spoken; if I do not this [See above on v. 23.] to all this evil Congregation of them which gathered themselves against me! They shall be reduced to nothing in this wildernesses, and shall die there."}],"36":[{"catchword":null,"tekst":"And those men whom God sent, for to spy out that land; and, being returned did cause all the Congregation to murmur against him, bringing forth a bad report over that land;"}],"37":[{"catchword":null,"tekst":"Those very men, that had brought forth a bad report of that Land, died [Others, shall die] by a Plague: [some do understand this plague of the pestilence threatened above, verse 12. Others, of a hasty and sudden death, by comparing their case with that of Joshua and Caleb, who are said to have remained alive, in the very next verse] before the face of the LORD. [that is to say; God hath executed his judgement upon them in a very remarkable manner, as if for that end and purpose he had been visibly sitting in the seat of judgement against them.]"}],"38":[{"catchword":null,"tekst":"But Joshua the son of Nun, and Caleb the son of Jephunne remained alive of the men that were gone to spy out the land."}],"39":[{"catchword":null,"tekst":"And Moseh spake these words to all the children of Israel: Then the people mourned greatly."}],"40":[{"catchword":null,"tekst":"And they rose up early in the morning, and got up on the top [Hebrew head] of the mount, saying; behold, here we are, and we will march up to the place, which the LORD said; for we have sinned. [this was no true sorrow for, nor confession of their sins; they cannot be said truly to repent, who ceasing from one kind of evil, fall to the committing of another, as these Israelites here did: for they ceased indeed to murmur against the LORD, but immediately resolve to go on and invade the Land of Canaan, against the express command of God.]"}],"41":[{"catchword":null,"tekst":"But Moseh said; Why transgress ye thus the command of the LORD? [Hebrew the mouth of the LORD, i.e. Gods express command, whereof see above, v.25.] for that shall have no success."}],"42":[{"catchword":null,"tekst":"Do not go up; for the LORD shall not be in the midst of you [viz.with his favourable help and assistance,] left ye be smitten before the face of your Enemies."}],"43":[{"catchword":null,"tekst":"For the Amalekites and the Canaanites are there before your face, and ye shall fall by the sword: for because ye have turned your selves away from the LORD, therefore the LORD shall not be with you."}],"44":[{"catchword":null,"tekst":"Nevertheless, they starve presumptuously, [The Hebrew verb here used doth properly signify to rush upon a business with a great deal of ill grounded daring and impetuosity, especially striving to get upward] for to get up to the top of the hill: but the Ark of the Covenant of the LORD, and Moseh, departed not out of the midst of the camp."}],"45":[{"catchword":null,"tekst":"Then the Amalekites came down, and the Canaanites, which dwelt in that mountain, and smote them, and defeated them (down) to Herma. [The name of a place afterwards so called by reason of this defeat. See Numbers, 21. Verse 3.]"}]}}};

  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
