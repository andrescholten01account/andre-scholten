gen, ze zijn allemaal van u. Doch u bent van Christus, en Christus is van God.", "Ps 37:37": "Schin. Let op de vrome, en zie naar de oprechte; want het einde van die man zal vrede zijn.", "Spr 12:21": "De rechtvaardigen zal geen leed overkomen; maar de goddelozen zullen met kwaad vervuld worden.", "Num 22:37": "En Balak zei tegen Bileam: Heb ik niet ernstig naar u gestuurd om u te roepen? Waarom bent u niet naar mij gekomen? Kan ik u niet werkelijk eren?", "Ps 118:16": "De rechterhand van de HEERE is verhoogd; de rechterhand van de HEERE doet krachtige daden.", "Ex 6:6": "En Ik zal u tot Mijn volk aannemen, en Ik zal u tot een God zijn; en u zult weten dat Ik de HEERE uw God ben, Die u uitleidt van onder de lasten van de Egyptenaren.", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Ef 2:13": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus.", "Ex 13:22": "Hij nam de wolkkolom overdag, en de vuurkolom 's nachts, niet weg van voor het aangezicht van het volk.", "Jes 63:12": "Die de arm van Zijn heerlijkheid heeft laten gaan aan de rechterhand van Mozes; Die de wateren voor hun aangezicht kliefde, opdat Hij Zich een eeuwige Naam maakte?", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Ex 27:1-8": "U moet ook een altaar maken van acaciahout; vijf el zal de lengte zijn, en vijf el de breedte (vierkant zal dit altaar zijn), en drie el zijn hoogte. En u moet zijn hoorns maken op zijn vier hoeken; uit hetzelfde stuk zullen zijn hoorns zijn, en u moet het met koper overtrekken. U moet het ook potten maken, om zijn as te ontvangen, ook zijn schoffels, en zijn besprengbekkens, en zijn krauwels, en zijn koolpannen; al zijn gereedschap moet u van koper maken.", "Openb 19:1": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God.", "Ezech 8:1": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.", "Ex 12:13": "En dat bloed zal voor u een teken zijn aan de huizen waarin u zich bevindt; wanneer Ik het bloed zie, zal Ik u voorbijgaan; en er zal geen plaag onder u zijn tot verderf, wanneer Ik Egypteland zal slaan.", "Ps 61:4": "Want U bent mij een Toevlucht geweest, een sterke Toren voor de vijand.", "1 Kor 15:53-57": "Want dit vergankelijke moet onvergankelijkheid aandoen, en dit sterfelijke moet onsterfelijkheid aandoen. En wanneer dit vergankelijke onvergankelijkheid zal hebben aangedaan, en dit sterfelijke onsterfelijkheid zal hebben aangedaan, dan zal het woord gebeuren dat geschreven is: De dood is verslonden tot overwinning. Dood, waar is uw prikkel? Graf, waar is uw overwinning?", "Ps 106:8": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "2 Kon 20:6": "En Ik zal vijftien jaar aan uw dagen toevoegen, en Ik zal u uit de hand van de koning van Assyrië verlossen, alsook deze stad; en Ik zal deze stad beschermen, omwille van Mijzelf en omwille van Mijn dienaar David.", "Ps 33:11": "Maar de raad van de HEERE bestaat in eeuwigheid, de gedachten van Zijn hart van geslacht tot geslacht.", "Ezech 17:2": "Mensenkind, stel een raadsel voor, en gebruik een gelijkenis tegen het huis van Israël,", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Ps 57:4": "Hij zal vanuit de hemel zenden, en mij verlossen, en te schande maken hem die mij zoekt te verslinden. Sela. God zal Zijn goedertierenheid en Zijn waarheid zenden.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Zach 9:14-16": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden. De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar. En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Openb 22:6": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.", "Jes 14:3": "En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,", "Ps 74:13": "U hebt door Uw sterkte de zee gespleten; U hebt de koppen van de draken in het water verbroken.", "Hand 5:12": "En door de handen van de apostelen gebeurden veel tekenen en wonderen onder het volk; en zij waren allen eendrachtig in de zuilengang van Salomo.", "Ex 6:28": "Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.", "Ps 89:18": "Want Gij zijt de heerlijkheid van hun sterkte; en door Uw welbehagen zal onze hoorn verhoogd worden.", "Num 9:17-23": "Maar nadat de wolk werd opgeheven van boven de tent, zo trokken daarna ook de kinderen van Israël verder; en op de plaats waar de wolk bleef, daar legerden de kinderen van Israël zich. Naar het bevel van de HEERE trokken de kinderen van Israël verder, en naar het bevel van de HEERE legerden zij zich; al de dagen dat de wolk over de tabernakel bleef, legerden zij zich. En als de wolk veel dagen over de tabernakel verbleef, dan namen de kinderen van Israël de wacht van de HEERE waar, en trokken niet verder.", "Num 14:14": "en zij zullen het zeggen tegen de inwoners van dit land, die gehoord hebben dat U, HEERE, in het midden van dit volk bent; dat U, HEERE, oog in oog gezien wordt, dat Uw wolk over hen staat, en U voor hun aangezicht gaat in een wolkkolom overdag, en in een vuurkolom 's nachts.", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "Rom 4:7": "En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Ps 35:26": "Laat hen beschaamd worden en samen schaamrood, die zich in mijn kwaad verblijden; laat hen met schaamte en schande bekleed worden, die zich tegen mij groot maken.", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Dan 7:16": "Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.", "Openb 21:3": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn.", "Num 22:4": "Daarom zei Moab tegen de oudsten van Midian: Nu zal deze menigte alles om ons heen opeten, zoals de os het groen van het veld opeet. Balak, de zoon van Zippor, was in die tijd koning van de Moabieten.", "Job 22:27": "U zult ernstig tot Hem bidden, en Hij zal u verhoren; en u zult uw geloften betalen.", "Num 22:5": "Hij stuurde boden naar Bileam, de zoon van Beor, naar Pethor, dat aan de rivier ligt, in het land van de kinderen van zijn volk, om hem te roepen, en zei: Zie, er is een volk uit Egypte getrokken; zie, het bedekt het gezicht van het land, en het blijft recht tegenover mij liggen.", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Jer 2:6": "En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde?", "Matt 20:12": "en zeiden: Deze laatsten hebben maar één uur gewerkt, en u hebt hen gelijk aan ons gemaakt, die de last van de dag en de hitte gedragen hebben.", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Luk 11:20": "Maar als Ik door de vinger van God de demonen uitdrijf, dan is het Koninkrijk van God tot u gekomen.", "Rom 11:29": "Want de genadegiften en de roeping van God zijn onberouwelijk.", "Ps 44:2-4": "O God! Wij hebben het met onze oren gehoord, onze vaders hebben het ons verteld: Wat een werk hebt U gedaan in hun dagen, in de dagen van vroeger. U hebt de heidenvolken met Uw hand uit de bezitting verdreven, maar hen geplant; U hebt de volken geplaagd, hen daarentegen doen voortschieten. Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Job 26:11": "De pilaren van de hemel sidderen, en schrikken op van Zijn bestraffing.", "Joz 23:10": "Eén man onder u zal er duizend opjagen; want het is de HEERE, uw God, Zelf, Die voor u strijdt, zoals Hij tot u gesproken heeft.", "Ex 9:26": "Alleen in het land Gosen, waar de kinderen van Israël waren, daar was geen hagel.", "Neh 5:13": "Ook schudde ik mijn boezem uit, en zei: Zo schudde God uit iedere man die dit woord niet zal nakomen, uit zijn huis en uit zijn arbeid, en hij worde zo uitgeschud en leeg. En de hele gemeente zei: Amen! En zij prezen de HEERE. En het volk deed volgens dit woord.", "Ps 102:20": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;", "Deut 5:31": "Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.", "Ex 6:5": "Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "Ex 29:46": "En zij zullen weten, dat Ik de HEERE hun God ben, Die hen uit het land Egypte uitgevoerd heb, opdat Ik in het midden van hen wonen zou; Ik ben de HEERE, hun God.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Gen 22:2": "En Hij zei: Neem toch uw zoon, uw enige, die u liefhebt, Izak, en ga naar het land Moria, en offer hem daar tot een brandoffer, op een van de bergen die Ik u zeggen zal.", "Ex 33:14-16": "Hij dan zei: Zou Mijn aangezicht met u meegaan, om u rust te geven? Toen zei hij tegen Hem: Als Uw aangezicht niet meegaat, laat ons dan van hier niet optrekken! Want waaraan zou nu bekend worden dat ik genade gevonden heb in Uw ogen, ik en Uw volk? Is het niet daaraan, dat U met ons meegaat? Zo zullen wij afgezonderd worden, ik en Uw volk, van alle volk dat op de aardbodem is.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "Jes 63:9-12": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds. Maar zij zijn opstandig geworden, en zij hebben Zijn Heilige Geest smarten aangedaan; daarom is Hij hun in een vijand veranderd, Hij Zelf heeft tegen hen gestreden. Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "Ezech 39:29": "En Ik zal Mijn aangezicht niet meer voor hen verbergen, wanneer Ik Mijn Geest over het huis van Israël zal hebben uitgegoten, spreekt de Heere HEERE.", "Ps 104:9": "U hebt een grens gesteld, die zij niet zullen overgaan; zij zullen de aarde niet weer bedekken.", "1 Sam 17:26": "Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?", "Jes 46:11": "Die een roofvogel roept van het oosten, een man van Mijn raad uit een ver land; ja, Ik heb het gesproken, Ik zal het ook doen komen; Ik heb het geformeerd, Ik zal het ook doen.", "Ps 31:20": "O, hoe groot is Uw goed, dat U weggelegd hebt voor hen die U vrezen; dat U gewrocht hebt voor hen die op U vertrouwen, in de tegenwoordigheid van de mensenkinderen!", "Jes 54:16": "Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.", "Luk 2:29": "Nu laat U, Heere, Uw dienstknecht gaan in vrede, naar Uw woord;", "Ex 34:24": "Wanneer Ik de volken voor uw aangezicht uit hun bezit zal verdrijven, en uw grenzen verruimen, dan zal niemand uw land begeren, terwijl u erheen optrekt, om te verschijnen voor het aangezicht van de HEERE, uw God, driemaal in het jaar.", "Gal 1:9": "Zoals wij al eerder gezegd hebben, zeg ik het nu ook weer: als iemand u een evangelie verkondigt naast wat u ontvangen hebt, laat hij vervloekt zijn.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Ezech 20:49": "En ik zei: Ach, Heere HEERE, zij zeggen van mij: Spreekt hij niet in gelijkenissen?", "Deut 33:20": "En van Gad zei hij: Gezegend zij hij die aan Gad ruimte maakt! hij woont als een oude leeuw, en verscheurt de arm, ja ook de schedel.", "Gen 49:27": "Benjamin zal als een wolf verscheuren; 's morgens zal hij roof eten, en 's avonds zal hij buit uitdelen.", "Gen 13:16": "En Ik zal uw nageslacht stellen als het stof van de aarde, zodat als iemand het stof van de aarde zal kunnen tellen, ook uw nageslacht geteld zal worden.", "Ps 103:12": "Zo ver het oosten is van het westen, zo ver doet Hij onze overtredingen van ons.", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Ezech 29:20": "Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.", "Jer 30:17": "Want Ik zal u de gezondheid doen terugkeren, en u van uw plagen genezen, spreekt de HEERE; omdat zij u noemen: De verdrevene. Het is Sion, zeggen zij; niemand vraagt naar haar.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Ps 78:43-51": "Hoe Hij Zijn tekenen stelde in Egypte, en Zijn wonderen in het veld van Zoan; En hun stromen in bloed veranderde, en hun waterlopen, zodat zij niet konden drinken. Hij zond een vermenging van ongedierte onder hen, dat hen verteerde, en vorsen, die hen verdierven.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Ps 79:12": "En geef onze buren zevenvoudig terug in hun schoot hun smaad, waarmee zij U, o Heere, gesmaad hebben.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "Openb 11:17": "en zeiden: Wij danken U, Heere God, Almachtige, Die is, en Die was, en Die komen zal! dat U Uw grote kracht hebt aangenomen, en als Koning hebt geheerst;", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Richt 16:28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "Ps 49:16": "Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "1 Kor 6:14": "En God heeft ook de Heere opgewekt, en zal ons opwekken door Zijn kracht.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "Rom 1:20": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Ps 104:32": "Als Hij de aarde aanschouwt, dan beeft zij; als Hij de bergen aanraakt, dan roken zij.", "Jer 10:6": "Omdat niemand U gelijk is, o HEERE! zo bent U groot, en groot is Uw Naam in macht.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Ezra 5:5": "Doch het oog van hun God was over de oudsten van de Joden, zodat men hen niet kon tegenhouden, totdat de zaak bij Darius kwam, en zij daarna daarover een brief terugbrachten.", "Ps 68:34-36": "Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken. O God! U bent ontzagwekkend vanuit Uw heiligdommen; de God van Israël, Die aan het volk sterkte en krachten geeft. Geloofd zij God!", "Deut 11:29": "En het zal gebeuren, als de HEERE, uw God, u zal hebben binnengebracht in het land, waar u naartoe gaat, om dat te erven; dan zult u de zegen uitspreken op de berg Gerizim, en de vloek op de berg Ebal.", "Amos 1:2": "En hij zei: De HEERE zal brullen uit Sion, en Zijn stem verheffen uit Jeruzalem; en de woningen van de herders zullen treuren, en de top van Karmel zal verdorren.", "Ps 148:5": "Laat hen de Naam van de HEERE loven; want toen Hij het beval, werden zij geschapen.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "1 Tess 1:8": "Want vanuit u heeft het Woord van de Heere weerklonken, niet alleen in Macedonië en Achaje; maar ook op elke plaats is uw geloof, dat u op God hebt, bekend geworden, zodat wij het niet nodig hebben daar iets over te zeggen.", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "Ex 12:17": "Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "Ps 93:4": "Maar de HEERE in de hoogte is machtiger dan het bruisen van veel water, dan de machtige golven van de zee.", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "Ex 14:30": "Zo verloste de HEERE Israël op die dag uit de hand van de Egyptenaren; en Israël zag de Egyptenaren dood aan de oever van de zee.", "Gen 10:22": "Sems zonen waren Elam, en Assur, en Arfachsad, en Lud, en Aram.", "Joh 17:19": "En Ik heilig Mijzelf voor hen, opdat ook zij geheiligd mogen zijn in waarheid.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Hebr 6:18": "opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Spr 14:9": "Elke dwaas maakt de schuld belachelijk; maar onder de oprechten is goedwilligheid.", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "Amos 9:5": "Want de Heere HEERE van de heerscharen is het, Die het land aanraakt, zodat het versmelt, en allen die daarin wonen treuren; en heel het land stijgt op als een rivier, en wordt verdronken als door de rivier van Egypte.", "Jes 37:32": "Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.", "Job 36:7": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "2 Kor 5:19": "Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd.", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "Ex 15:3": "De HEERE is een krijgsman; HEERE is Zijn Naam!", "1 Kor 15:51-57": "Zie, ik zeg u een geheimenis: wij zullen wel niet allen ontslapen, maar wij zullen allen veranderd worden; in een ondeelbaar ogenblik, in een oogwenk, bij de laatste bazuin; want de bazuin zal klinken, en de doden zullen onvergankelijk opgewekt worden, en wij zullen veranderd worden. Want dit vergankelijke moet onvergankelijkheid aandoen, en dit sterfelijke moet onsterfelijkheid aandoen.", "Rom 16:20": "En de God van de vrede zal de satan spoedig onder uw voeten verpletteren. De genade van onze Heere Jezus Christus zij met u. Amen.", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Job 39:13": "Zult u de eenhoorn met zijn touw aan de voren binden? Zal hij de laagten achter u eggen?", "Deut 2:30": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.", "1 Sam 2:6-9": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Micha 7:18-20": "Wie is een God gelijk U, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel van Zijn erfenis voorbijgaat? Hij houdt Zijn toorn niet voor eeuwig vast; want Hij heeft lust aan goedertierenheid. Hij zal Zich weer over ons ontfermen; Hij zal onze ongerechtigheden dempen; ja, U zult al hun zonden in de diepten van de zee werpen. U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Rom 15:8-10": "En ik zeg dat Jezus Christus een dienaar van de besnijdenis geworden is, vanwege de waarheid van God, opdat Hij de beloften aan de vaderen zou bevestigen; en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen. En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk!", "Ps 115:10": "U, huis van Aäron! vertrouw op de HEERE; Hij is hun Hulp en hun Schild.", "Jes 58:4": "Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "2 Kor 13:4": "Want al is Hij gekruisigd door zwakheid, toch leeft Hij door de kracht van God. Want ook wij zijn zwak in Hem, maar zullen met Hem leven door de kracht van God, tot u.", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Num 22:20": "God kwam toen 's nachts tot Bileam, en zei tegen hem: Omdat die mannen gekomen zijn om u te roepen, sta op, ga met hen; en toch zult u datgene doen wat Ik tot u spreken zal.", "2 Petr 1:14": "Want ik weet dat het afleggen van mijn tent spoedig zal zijn, zoals ook onze Heere Jezus Christus mij heeft geopenbaard.", "Gen 28:14": "En uw nageslacht zal zijn als het stof van de aarde, en u zult uitbreiden in menigte, westwaarts en oostwaarts, en noordwaarts en zuidwaarts; en in u, en in uw nageslacht zullen alle geslachten van de aardbodem gezegend worden.", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "Gen 6:8": "Maar Noach vond genade in de ogen van de HEERE.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Ps 91:4": "Hij zal u dekken met Zijn vlerken, en onder Zijn vleugels zult u vertrouwen; Zijn waarheid is een schild en beukelaar.", "Micha 5:8": "Uw hand zal verhoogd zijn boven uw tegenstanders, en al uw vijanden zullen uitgeroeid worden.", "Jer 10:12": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid heeft door Zijn verstand.", "Ps 54:7": "Hij zal dit kwaad aan mijn belagers vergelden; roei hen uit door Uw waarheid.", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Luk 18:27": "En Hij zei: De dingen die onmogelijk zijn bij de mensen, zijn mogelijk bij God.", "Num 24:2": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Ps 5:11": "Verklaar hen schuldig, o God; laat hen vervallen van hun raadslagen; drijf hen weg om de veelheid van hun overtredingen, want zij zijn opstandig tegen U.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Ps 37:17": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Ps 62:12": "God heeft één ding gesproken, dit heb ik tweemaal gehoord: dat de sterkte van God is.", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Hand 10:38": "namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem.", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Deut 34:1": "Toen ging Mozes op vanaf de vlakke velden van Moab, naar de berg Nebo, op de hoogten van Pisga, die recht tegenover Jericho ligt; en de HEERE liet hem het hele land zien: Gilead tot Dan toe;", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Spr 19:21": "In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.", "Joh 14:16-21": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid; Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn. Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Jer 11:4": "Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;", "Ps 78:26": "Hij dreef de oostenwind voort aan de hemel, en voerde de zuidenwind aan door Zijn sterkte;", "Ps 146:8": "De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Spr 3:35": "De wijzen zullen eer beërven; maar de dwazen dragen schande.", "Num 24:17": "Ik zal hem zien, maar nu niet; ik zal hem aanschouwen, maar niet van dichtbij. Er zal een ster voortkomen uit Jakob, en er zal een scepter uit Israël opkomen; die zal de gebieden van de Moabieten verslaan, en al de kinderen van Seth verstoren.", "2 Kron 29:21": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren.", "Spr 20:22": "Zeg niet: Ik zal het kwaad vergelden; wacht op de HEERE, en Hij zal u verlossen.", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Jer 52:3": "Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "Micha 2:13": "De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits.", "Gen 28:7": "en dat Jakob zijn vader en zijn moeder gehoorzaam geweest was, en naar Paddan-aram getrokken was;", "2 Petr 1:13-15": "En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken; Want ik weet dat het afleggen van mijn tent spoedig zal zijn, zoals ook onze Heere Jezus Christus mij heeft geopenbaard. Maar ik zal er ook mijn best voor doen, dat u bij elke gelegenheid, na mijn heengaan, hieraan kunt terugdenken.", "Ps 14:5": "Daar zijn zij door grote angst overvallen; want God is bij het geslacht van de rechtvaardige.", "Ps 33:9": "Want Hij spreekt, en het is er; Hij gebiedt, en het staat er.", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "Ps 17:12": "Hij is als een leeuw, die begeert te roven, en als een jonge leeuw, zittend in verborgen plaatsen.", "Job 42:8": "Daarom neemt nu voor u zeven jonge stieren en zeven rammen, en gaat heen naar Mijn knecht Job, en offert een brandoffer voor u, en laat Mijn knecht Job voor u bidden; want zeker, Ik zal zijn aangezicht aannemen, opdat Ik aan u niet doe naar uw dwaasheid; want u hebt niet recht van Mij gesproken, zoals Mijn knecht Job.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Ps 109:9-20": "Laat zijn kinderen wezen worden, en zijn vrouw weduwe. En laat zijn kinderen hier en daar omzwerven, en bedelen, en de nooddruft uit hun verwoeste plaatsen zoeken. Laat de schuldeiser aanslaan al wat hij heeft, en laat de vreemden zijn arbeid roven.", "Deut 3:27": "Klim op de top van de Pisga, en sla uw ogen op naar het westen, en naar het noorden, en naar het zuiden, en naar het oosten, en bekijk het met uw ogen; want u zult niet over deze Jordaan gaan.", "Num 24:10-13": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend! En nu, pak u weg naar uw plaats! Ik had gezegd dat ik u hoog zou eren; maar zie, de HEERE heeft u die eer onthouden! Toen zei Bileam tegen Balak: Heb ik ook niet tegen uw boden, die u naar mij gezonden hebt, gesproken en gezegd:", "Ps 104:30": "Zendt U Uw Geest uit, dan worden zij geschapen, en U vernieuwt het gelaat van het aardrijk.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Deut 23:4": "Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken.", "Deut 1:31": "En in de woestijn, waar u gezien hebt dat de HEERE, uw God, u gedragen heeft, zoals een man zijn zoon draagt, op heel de weg die u gegaan bent, totdat u kwam bij deze plaats.", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.", "Ps 25:9": "Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren.", "Num 16:15": "Toen ontstak Mozes zeer, en hij zei tegen de HEERE: Zie hun offer niet aan! Ik heb niet één ezel van hen genomen, en niemand van hen kwaad gedaan.", "Gen 12:2": "En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!", "Job 27:4": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Jer 26:12": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "Jes 49:25": "Doch zo zegt de HEERE: Ja, de gevangenen van de machtige zullen hem ontnomen worden, en de vangst van de tiran zal ontkomen; want met hen die u bestrijden zal Ik strijden, en uw kinderen zal Ik verlossen.", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Jes 31:5": "Zoals vliegende vogels, zo zal de HEERE van de heerscharen Jeruzalem beschutten, beschuttend zal Hij haar ook verlossen, voorbijgaand zal Hij haar ook uithelpen.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Jes 49:9": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn.", "Jer 27:5": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Joz 11:20": "Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "Rom 2:29": "Maar die is een Jood, die het in het verborgen is, en de besnijdenis van het hart, in de geest, niet in de letter, dat is de besnijdenis; wiens lof niet is uit de mensen, maar uit God.", "Matt 16:18": "En Ik zeg u ook, dat u Petrus bent, en op deze petra zal Ik Mijn gemeente bouwen, en de poorten van de hel zullen haar niet overweldigen.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "2 Tess 3:3": "Maar de Heere is getrouw, Die u zal versterken en bewaren van de boze.", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Jer 31:10": "Hoort het woord van de HEERE, heidenvolken! En verkondigt het in de eilanden die ver weg zijn, en zegt: Hij, Die Israël verstrooid heeft, zal hem weer verzamelen, en hem bewaren zoals een herder zijn kudde.", "Job 4:7": "Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd?", "Num 22:12-18": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend. Toen stond Bileam 's morgens op, en zei tegen de vorsten van Balak: Ga naar uw land; want de HEERE weigert mij toe te staan met u mee te gaan. Toen stonden de vorsten van Moab op, en kwamen bij Balak, en zij zeiden: Bileam heeft geweigerd met ons mee te gaan.", "Ps 126:3": "De HEERE heeft grote dingen bij ons gedaan; daarom zijn wij verblijd.", "Jes 35:9": "Er zal geen leeuw zijn, en geen verscheurend gedierte zal daarop komen, en het zal daar niet gevonden worden; maar de verlosten zullen daarop wandelen.", "Joël 3:21": "En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion.", "Ps 31:18": "HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Ps 18:18": "Hij verloste mij van mijn sterke vijand, en van mijn haters, omdat zij machtiger waren dan ik.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Jer 31:28": "En het zal gebeuren, zoals Ik over hen gewaakt heb om uit te rukken, en af te breken, en te verstoren, en te verderven, en kwaad aan te doen; zo zal Ik over hen waken om te bouwen en te planten, spreekt de HEERE.", "Judas 1:11": "Wee hen, want zij zijn de weg van Kaïn ingegaan, en door de verleiding van het loon van Balaäm zijn zij weggestort, en zijn door de tegenspraak van Korach vergaan.", "Hand 5:38": "En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden;", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Ps 50:8": "Om uw offers zal Ik u niet straffen, want uw brandoffers zijn steeds voor Mij.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Ps 103:2-5": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "Jes 30:26": "En het licht van de maan zal zijn als het licht van de zon, en het licht van de zon zal zevenvoudig zijn als het licht van zeven dagen; op de dag dat de HEERE de breuk van Zijn volk zal verbinden, en de wond waarmee het geslagen is, genezen.", "Dan 12:13": "Maar u, ga heen tot het einde, want u zult rusten, en u zult opstaan in uw lot, aan het einde van de dagen.", "Luk 23:43": "En Jezus zei tegen hem: Voorwaar, Ik zeg u: Vandaag zult u met Mij in het Paradijs zijn.", "Luk 18:8": "Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?", "Richt 6:13": "Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven.", "Deut 33:23": "En van Naftali zei hij: O Naftali! wees verzadigd van de goedgunstigheid, en vol van de zegen van de HEERE; bezit erfelijk het westen en het zuiden.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Richt 9:24": "opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.", "Hab 3:6": "Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "Zach 9:16": "En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "Ps 136:13-20": "Hem, Die de Schelfzee in stukken deelde; want Zijn goedertierenheid is voor eeuwig. En Israël erdoorheen liet gaan; want Zijn goedertierenheid is voor eeuwig. Farao met zijn leger stortte Hij in de Schelfzee; want Zijn goedertierenheid is voor eeuwig.", "Spr 11:20": "De verkeerden van hart zijn de HEERE een gruwel; maar de oprechten van weg zijn Zijn welgevallen.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "2 Tim 4:14": "Alexander, de kopersmid, heeft mij veel kwaad aangedaan; de Heere zal hem vergelden naar zijn werken.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Ps 41:2-4": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads. De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden. De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "Ex 13:21": "En de HEERE ging voor hun aangezicht uit, overdag in een wolkkolom om hen de weg te leiden, en 's nachts in een vuurkolom om hen licht te geven, zodat zij dag en nacht konden voortgaan.", "Deut 2:31": "En de HEERE zei tegen mij: Zie, Ik heb begonnen Sihon en zijn land aan u over te geven; begin het dan te bezitten, om zijn land in erfelijk bezit te nemen.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Ps 89:14": "Gij hebt een arm met macht; Uw hand is sterk, Uw rechterhand is hoog.", "2 Kor 5:8": "Maar wij hebben goede moed, en hebben er meer behagen in om uit het lichaam weg te gaan en bij de Heere te wonen.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Hab 2:6": "Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk!", "Num 22:12": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend.", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Jes 58:3": "En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid.", "Spr 8:35": "Want die Mij vindt, vindt het leven, en verkrijgt een welgevallen van de HEERE.", "Ps 65:7": "Die de bergen vastzet door Zijn kracht, omgord met macht.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Ps 104:7": "Van Uw dreigen vluchtten zij, zij haastten zich weg voor de stem van uw donder.", "Job 38:11": "En zei: Tot hiertoe zult u komen, en niet verder, en hier zal hij zich stellen tegen de hoogmoed van uw golven.", "Jes 33:13": "Hoort, u die ver weg bent, wat Ik gedaan heb; en u, die nabij bent, erken Mijn macht!", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Spr 19:23": "De vreze van de HEERE is ten leven; want men zal verzadigd zijnde overnachten; met het kwaad zal men niet bezocht worden.", "Zach 10:4": "Uit hem zal de hoeksteen voortkomen, uit hem de nagel, uit hem de strijdboog, samen zullen uit hem alle drijvers voortkomen.", "Job 9:19": "Als het op kracht aankomt, zie, Hij is sterk; en als het op recht aankomt, wie zal mij dagvaarden?", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Jes 33:17": "Uw ogen zullen de Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.", "Ps 77:19": "Het geluid van uw donder was rondom; de bliksemen verlichtten de wereld; de aarde werd beroerd en daverde.", "Ps 119:84": "Hoeveel zullen de dagen van Uw knecht zijn? Wanneer zult U recht doen over mijn vervolgers?", "Ps 64:10": "En alle mensen zullen vrezen, en Gods werk verkondigen, en Zijn doen verstandig overwegen.", "Ps 31:21": "U verbergt hen in het verborgene van Uw aangezicht voor de hoogmoedigheden van de man; U versteekt hen in een hut voor de twist van de tongen.", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Rom 4:8": "Gelukkig is de man, aan wie de Heere de zonden niet toerekent.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Ex 12:23": "Want de HEERE zal doorgaan, om de Egyptenaren te slaan; doch wanneer Hij het bloed zien zal aan de bovendorpel en aan de twee zijposten, zal de HEERE de deur voorbijgaan, en de verderver niet toelaten in uw huizen te komen om te slaan.", "1 Sam 17:25": "En de mannen van Israël zeiden: Hebt u die man wel gezien, die is opgekomen? Want hij is opgekomen om Israël te honen; en het zal gebeuren dat de koning de man die hem verslaat, met grote rijkdom zal verrijken, en hij zal hem zijn dochter geven, en hij zal het huis van zijn vader vrijmaken in Israël.", "Ps 29:3-9": "De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid. De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Ex 23:20-31": "Zie, Ik zend een Engel voor uw aangezicht, om u te behoeden op deze weg, en om u te brengen naar de plaats die Ik voorbereid heb. Wees op uw hoede voor Zijn aangezicht, en wees Zijn stem gehoorzaam, en verbitter Hem niet; want Hij zal uw overtredingen niet vergeven; want Mijn Naam is in Hem. Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ex 19:4": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Job 14:20": "U overweldigt hem voor altijd, en hij gaat heen; U verandert zijn gelaat, en zendt hem weg.", "Ps 89:36": "Ik heb eens gezworen bij Mijn heiligheid: Zeker zal Ik aan David niet liegen!", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Jes 49:17": "Uw zonen zullen zich haasten; maar uw verstoorders en uw verwoesters zullen van u uitgaan.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Jes 43:16": "Zo zegt de HEERE, Die in de zee een weg, en in de sterke wateren een pad maakte;", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "Jak 3:9": "Door haar loven wij God en de Vader, en door haar vervloeken wij de mensen, die naar de gelijkenis van God gemaakt zijn.", "Zach 9:8": "En Ik zal Mij rondom Mijn huis legeren, vanwege het leger, vanwege de doorgaande, en vanwege de wederkerende, opdat de drijver niet meer door hen doorga; want nu heb Ik het met Mijn ogen aangezien.", "Job 5:18-24": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen. In zes benauwdheden zal Hij u verlossen, en in de zevende zal het kwaad u niet aanraken. In de honger zal Hij u verlossen van de dood, en in de oorlog van het geweld van het zwaard.", "Ex 15:10-12": "U hebt met Uw wind geblazen; de zee heeft hen gedekt, zij zonken onder als lood in geweldige wateren! O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet? U hebt Uw rechterhand uitgestrekt, de aarde heeft hen verslonden!", "Ex 8:23": "En Ik zal een verlossing zetten tussen Mijn volk en uw volk; tegen morgen zal dit teken gebeuren!", "Gen 10:23": "En Arams zonen waren Uz, en Hul, en Gether, en Maz.", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Ps 50:9": "Ik zal uit uw huis geen stier nemen, noch bokken uit uw kooien;", "Openb 12:9": "En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen.", "Ps 9:10": "En de HEERE zal een Hoog Vertrek zijn voor de verdrukte, een Hoog Vertrek in tijden van benauwdheid.", "1 Kon 6:13": "En Ik zal in het midden van de kinderen van Israël wonen; en Ik zal Mijn volk Israël niet verlaten.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Jes 37:35": "Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.", "Ps 12:8": "U, HEERE, zult hen bewaren; U zult hen behoeden voor dit geslacht, tot in eeuwigheid.", "Ex 3:12": "Hij dan zei: Ik zal zeker met u zijn, en dit zal u een teken zijn dat Ik u gezonden heb: wanneer u dit volk uit Egypte geleid hebt, zult u God dienen op deze berg.", "Jes 1:10": "Hoor het woord van de HEERE, leiders van Sodom! Neem de wet van onze God ter oor, volk van Gomorra!", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "Ps 41:12": "Hierbij weet ik, dat U lust aan mij hebt, dat mijn vijand over mij niet zal juichen.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Ezra 9:2": "Want zij hebben van hun dochters genomen voor zichzelf en voor hun zonen, zodat het heilig zaad zich vermengd heeft met de volken van deze landen; ja, de hand van de vorsten en overheden is de eerste geweest in deze overtreding.", "Ps 109:28": "Laat hen vloeken, maar zegen Ú; laat hen opstaan, maar laat hen beschaamd worden; maar laat Uw knecht zich verblijden.", "Jes 26:4": "Vertrouw op de HEERE tot in eeuwigheid; want in de HEERE HEERE is een eeuwige rots.", "Spr 3:32": "Want de afwijker is de HEERE een gruwel; maar Zijn verborgenheid is met de oprechte.", "Ps 25:14": "Samech. De verborgenheid van de HEERE is voor hen die Hem vrezen; en Zijn verbond, om het hun bekend te maken.", "Deut 30:4": "Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.", "Ps 55:16": "Laat de dood hen overvallen als een schuldeiser, laat hen levend in het dodenrijk neerdalen; want boosheden zijn in hun woning, in hun binnenste.", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Job 40:4": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen?", "Gen 6:9": "Dit zijn de afstammelingen van Noach. Noach was een rechtvaardig, oprecht man onder zijn tijdgenoten. Noach wandelde met God.", "Jes 50:3": "Ik bekleed de hemel met zwartheid, en maak een zak tot zijn bedekking.", "Ps 147:2": "De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Jer 5:22": "Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Ex 20:21": "En het volk bleef op een afstand staan; maar Mozes naderde tot de donkerheid waar God was.", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "Ps 71:13": "Laat hen beschaamd worden, laat hen verteerd worden, die mijn ziel tegenstaan; laat hen met smaad en schande overdekt worden, die mijn kwaad zoeken.", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "Spr 30:4": "Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "Jer 51:20": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Ps 144:6": "Bliksem met bliksem, en verstrooi hen; zend Uw pijlen uit, en vernietig hen.", "Klaagl 3:64-66": "Thau. HEERE! geef hun de vergelding terug, naar het werk van hun handen. Thau. Geef hun een verharding van het hart; Uw vloek zij over hen! Thau. Vervolg hen met toorn, en verdelg hen van onder de hemel van de HEERE.", "Num 29:32": "En op de zevende dag: zeven varren, twee rammen, veertien volkomen eenjarige lammeren;", "Deut 33:25-29": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen! Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken. De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Ex 33:21": "De HEERE zei verder: Zie, er is een plaats bij Mij; daar zult u zich op de steenrots stellen.", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Num 24:9": "Hij heeft zich gekromd, hij heeft zich neergelegd, als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? Wie u zegent, die zij gezegend, en vervloekt zij wie u vervloekt!", "Deut 23:14": "Want de HEERE, uw God, wandelt in het midden van uw leger, om u te verlossen, en om uw vijanden aan u over te geven; daarom zal uw leger heilig zijn, opdat Hij niets schandelijks onder u ziet, en Zich niet van u afkeert.", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Spr 3:24": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Ps 3:9": "Het heil is van de HEERE; Uw zegen is over Uw volk. Sela.", "Ps 58:8": "Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Dan 9:13": "Zoals geschreven is in de wet van Mozes, zo is al dat kwaad over ons gekomen; en wij smeekten het aangezicht van de HEERE, onze God, niet, door ons af te keren van onze ongerechtigheden en verstandig acht te geven op Uw waarheid.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Ex 33:17": "Toen zei de HEERE tegen Mozes: Ook deze zaak, die u gesproken hebt, zal Ik doen, omdat u genade gevonden hebt in Mijn ogen, en Ik u bij naam ken.", "Ezech 37:27": "En Mijn tabernakel zal bij hen zijn, en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Ps 68:17": "Waarom springt u op, u bultige bergen? Deze berg heeft God begeerd tot Zijn woning; ook zal de HEERE er wonen in eeuwigheid.", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Job 38:8": "Of wie heeft de zee met deuren toegesloten, toen zij uitbrak, en uit de baarmoeder voortkwam?", "1 Sam 15:22": "Doch Samuël zei: Heeft de HEERE evenveel behagen in brandoffers en slachtoffers, als in het gehoorzamen aan de stem van de HEERE? Zie, gehoorzamen is beter dan slachtoffer, opmerken beter dan het vet van rammen.", "Jes 45:1-6": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "2 Kron 13:12": "Zie daarom, God is met ons aan het hoofd, en Zijn priesters met de trompetten van het geschal, om alarm tegen u te laten klinken; o kinderen van Israël, strijd niet tegen de HEERE, de God van uw vaderen, want u zult geen voorspoed hebben.", "Num 6:27": "Zo zullen zij Mijn Naam op de kinderen van Israël leggen; en Ik zal hen zegenen.", "Jes 60:16": "En u zult de melk van de heidenen zuigen, en u zult de borsten van de koningen zuigen; en u zult weten dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige van Jakob."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">Toen</span> zei <span class=\"wl\" data-l=\"L2\" data-code=\"H1109\">Bileam</span> tegen <span class=\"wl\" data-l=\"L3\" data-code=\"H1111\">Balak</span>: <span class=\"wl\" data-l=\"L4\" data-code=\"H1129\">Bouw</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">hier</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">zeven</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4196\">altaren</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">voor</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">mij</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">en</span> maak <span class=\"wl\" data-l=\"L5\" data-co
