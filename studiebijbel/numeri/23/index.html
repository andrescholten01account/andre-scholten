 Toen ging hij naar de hoogte.","4":"Toen God Bileam ontmoette, zei hij tegen Hem: Ik heb zeven altaren klaargemaakt, en ik heb een stier en een ram op elk altaar geofferd.","5":"Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.","6":"Toen hij naar hem terugkeerde, zie, daar stond hij bij zijn brandoffer, hij en alle vorsten van de Moabieten.","7":"Toen begon hij zijn spreuk, en zei: Uit Syrië heeft Balak, de koning van de Moabieten, mij laten halen, van het gebergte in het oosten, en zei: Kom, vervloek Jakob voor mij, en kom, scheld Israël uit!","8":"Wat zal ik vervloeken, wie God niet vervloekt; en wat zal ik uitschelden, wie de HEERE niet uitscheldt?","9":"Want vanaf de top van de rotsen zie ik hem, en vanaf de heuvels aanschouw ik hem; zie, dat volk zal alleen wonen, en het zal niet bij de heidenvolken gerekend worden.","10":"Wie zal het stof van Jakob tellen, en het getal, ja, het vierde deel van Israël? Laat mijn ziel de dood van de oprechten sterven, en laat mijn einde net zo zijn als het zijne!","11":"Toen zei Balak tegen Bileam: Wat hebt u mij aangedaan? Ik heb u gehaald om mijn vijanden te vervloeken; maar zie, u hebt hen alleen maar gezegend!","12":"Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?","13":"Toen zei Balak tegen hem: Kom toch met mij mee naar een andere plaats, vanwaar u hem zult zien; u zult alleen zijn uiterste deel zien, maar hem niet helemaal zien; en vervloek hem daarvandaan voor mij!","14":"Zo nam hij hem mee naar het veld Zofim, op de top van Pisga; en hij bouwde zeven altaren, en hij offerde een stier en een ram op elk altaar.","15":"Toen zei hij tegen Balak: Blijf hier bij uw brandoffer staan, en ik zal Hem daar ontmoeten.","16":"Toen de HEERE Bileam ontmoette, legde Hij het woord in zijn mond, en Hij zei: Keer terug naar Balak, en spreek zo.","17":"Toen hij naar hem toe kwam, zie, daar stond hij bij zijn brandoffer, en de vorsten van de Moabieten bij hem. Balak zei tegen hem: Wat heeft de HEERE gesproken?","18":"Toen begon hij zijn spreuk, en zei: Sta op, Balak, en hoor! Neig uw oren naar mij, u, zoon van Zippor!","19":"God is geen man, dat Hij zou liegen, en ook geen mensenkind, dat het Hem berouwen zou; zou Hij het zeggen, en het niet doen, of spreken, en het niet waarmaken?","20":"Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.","21":"Hij ziet geen ongerechtigheid in Jakob; ook ziet Hij geen boosheid in Israël. De HEERE, zijn God, is met hem, en het geschal van de Koning is bij hem.","22":"God heeft hen uit Egypte geleid; zijn krachten zijn als die van een eenhoorn.","23":"Want er is geen toverij tegen Jakob, en geen waarzeggerij tegen Israël. Op dit moment zal van Jakob gezegd worden, en van Israël, wat God tot stand gebracht heeft.","24":"Zie, het volk zal opstaan als een oude leeuw, en het zal zich verheffen als een leeuw; het zal niet neerliggen, totdat het de roof gegeten en het bloed van de gedoden gedronken zal hebben!","25":"Toen zei Balak tegen Bileam: U zult hen helemaal niet vervloeken, en ook niet zegenen.","26":"Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?","27":"Verder zei Balak tegen Bileam: Kom toch, ik zal u meenemen naar een andere plaats; misschien zal het goed zijn in de ogen van die God, dat u het daarvandaan voor mij vervloekt.","28":"Toen nam Balak Bileam mee naar de top van Peor, die uitziet over de woestijn.","29":"En Bileam zei tegen Balak: Bouw hier zeven altaren voor mij, en maak hier zeven stieren en zeven rammen voor mij klaar.","30":"Balak deed wat Bileam gezegd had; en hij offerde een stier en een ram op elk altaar."},"SV":{"1":"Toen zeide Bileam tot Balak: Bouw mij hier zeven altaren, en bereid mij hier zeven varren en zeven rammen.","2":"Balak nu deed, gelijk als Bileam gesproken had; en Balak en Bileam offerden een var en een ram, op elk altaar.","3":"Toen zeide Bileam tot Balak: Blijf staan bij uw brandoffer, en ik zal heengaan; misschien zal de HEERE mij tegemoet komen; en hetgeen Hij wijzen zal, dat zal ik u bekend maken. Toen ging hij op de hoogte.","4":"Als God Bileam ontmoet was, zo zeide hij tot Hem: Zeven altaren heb ik toegericht, en heb een var en een ram op elk altaar geofferd.","5":"Toen leide de HEERE het woord in den mond van Bileam, en zeide: Keer weder tot Balak, en spreek aldus.","6":"Als hij nu tot hem wederkeerde, ziet, zo stond hij bij zijn brandoffer, hij en al de vorsten der Moabieten.","7":"Toen hief hij zijn spreuk op, en zeide: Uit Syrië heeft mij Balak, de koning der Moabieten, laten halen, van het gebergte tegen het oosten, *zeggende*: Kom, vervloek mij Jakob, en kom, scheld Israël!","8":"Wat zal ik vloeken, dien God niet vloekt; en wat zal ik schelden, waar de HEERE niet scheldt?","9":"Want van de hoogte der steenrotsen zie ik hem, en van de heuvelen aanschouw ik hem; ziet, dat volk zal alleen wonen, en het zal onder de heidenen niet gerekend worden.","10":"Wie zal het stof van Jakob tellen, en het getal, *ja*, het vierde deel van Israël? Mijn ziel sterve den dood der oprechten, en mijn uiterste zij gelijk het zijne!","11":"Toen zeide Balak tot Bileam: Wat hebt gij mij gedaan? Ik heb u genomen, om mijn vijanden te vloeken; maar zie, gij hebt hen doorgaans gezegend!","12":"Hij nu antwoordde en zeide: Zal ik dat niet waarnemen te spreken, wat de HEERE in mijn mond gelegd heeft?","13":"Toen zeide Balak tot hem: Kom toch met mij aan een andere plaats, van waar gij hem zult zien; gij zult niet dan zijn einde zien, maar hem niet ganselijk zien; en vervloek hem mij van daar!","14":"Alzo nam hij hem mede tot het veld Zofim, op de hoogte van Pisga; en hij bouwde zeven altaren, en hij offerde een var en een ram op elk altaar.","15":"Toen zeide hij tot Balak: Blijf hier staan bij uw brandoffer, en ik zal *Hem* aldaar ontmoeten.","16":"Als de HEERE Bileam ontmoet was, zo leide Hij het woord in zijn mond, en Hij zeide: Keer weder tot Balak, en spreek alzo.","17":"Toen hij tot hem kwam, ziet, zo stond hij bij zijn brandoffer, en de vorsten der Moabieten bij hem. Balak nu zeide tot hem: Wat heeft de HEERE gesproken?","18":"Toen hief hij zijn spreuk op, en zeide: Sta op, Balak, en hoor! Neig uw oren tot mij, gij, zoon van Zippor!","19":"God is geen man, dat Hij liegen zou, noch eens mensen kind, dat het Hem berouwen zou; zou Hij het zeggen, en niet doen, of spreken, en niet bestendig maken?","20":"Zie, ik heb ontvangen te zegenen; dewijl Hij zegent, zo zal ik het niet keren.","21":"Hij schouwt niet aan de ongerechtigheid in Jakob; ook ziet Hij niet aan de boosheid in Israël. De HEERE, zijn God, is met hem, en het geklank des Konings is bij hem.","22":"God heeft hen uit Egypte uitgevoerd; zijn krachten zijn als van een eenhoorn.","23":"Want er is geen toverij tegen Jakob noch waarzeggerij tegen Israël. Te dezer tijd zal van Jakob gezegd worden, en van Israël, wat God gewrocht heeft.","24":"Zie, het volk zal opstaan als een oude leeuw, en het zal zich verheffen als een leeuw; het zal zich niet neerleggen, totdat het den roof gegeten, en het bloed der verslagenen gedronken zal hebben!","25":"Toen zeide Balak tot Bileam: Gij zult het ganselijk noch vloeken, noch geenszins zegenen.","26":"Doch Bileam antwoordde en zeide tot Balak: Heb ik niet tot u gesproken, zeggende: Al wat de HEERE spreken zal, dat zal ik doen?","27":"Verder zeide Balak tot Bileam: Kom toch, ik zal u aan een ander plaats medenemen; misschien zal het recht zijn in de ogen van dien God, dat gij het mij van daar vervloekt.","28":"Toen nam Balak Bileam mede tot de hoogte van Peor, die tegen de woestijn ziet.","29":"En Bileam zeide tot Balak: Bouw mij hier zeven altaren, en bereid mij hier zeven varren en zeven rammen.","30":"Balak nu deed, gelijk als Bileam gezegd had; en hij offerde een var en een ram op elk altaar."},"KJV":{"1":"And Balaam said unto Balak, Build me here seven altars, and prepare me here seven oxen and seven rams.","2":"And Balak did as Balaam had spoken; and Balak and Balaam offered on *every* altar a bullock and a ram.","3":"And Balaam said unto Balak, Stand by thy burnt offering, and I will go: peradventure the LORD will come to meet me: and whatsoever he sheweth me I will tell thee. And he went to an high place.","4":"And God met Balaam: and he said unto him, I have prepared seven altars, and I have offered upon *every* altar a bullock and a ram.","5":"And the LORD put a word in Balaam's mouth, and said, Return unto Balak, and thus thou shalt speak.","6":"And he returned unto him, and, lo, he stood by his burnt sacrifice, he, and all the princes of Moab.","7":"And he took up his parable, and said, Balak the king of Moab hath brought me from Aram, out of the mountains of the east, *saying*, Come, curse me Jacob, and come, defy Israel.","8":"How shall I curse, whom God hath not cursed? or how shall I defy, *whom* the LORD hath not defied?","9":"For from the top of the rocks I see him, and from the hills I behold him: lo, the people shall dwell alone, and shall not be reckoned among the nations.","10":"Who can count the dust of Jacob, and the number of the fourth *part* of Israel? Let me die the death of the righteous, and let my last","11":"And Balak said unto Balaam, What hast thou done unto me? I took thee to curse mine enemies, and, behold, thou hast blessed *them* altogether.","12":"And he answered and said, Must I not take heed to speak that which the LORD hath put in my mouth?","13":"And Balak said unto him, Come, I pray thee, with me unto another place, from whence thou mayest see them: thou shalt see but the utmost part of them, and shalt not see them all: and curse","14":"And he brought him into the field of Zophim, to the top of Pisgah, and built seven altars, and offered a bullock and a ram on *every* altar.","15":"And he said unto Balak, Stand here by thy burnt offering, while I meet *the LORD* yonder.","16":"And the LORD met Balaam, and put a word in his mouth, and said, Go again unto Balak, and say","17":"And when he came to him, behold, he stood by his burnt offering, and the princes of Moab with him. And Balak said unto him, What hath the LORD spoken?","18":"And he took up his parable, and said, Rise up, Balak, and hear; hearken unto me, thou son of Zippor:","19":"God *is* not a man, that he should lie; neither the son of man, that he should repent: hath he said, and shall he not do *it*? or hath he spoken, and shall he not make it good?","20":"Behold, I have received *commandment* to bless: and he hath blessed; and I cannot reverse","21":"He hath not beheld iniquity in Jacob, neither hath he seen perverseness in Israel: the LORD his God *is* with him, and the shout of a king","22":"God brought them out of Egypt; he hath as it were the strength of an unicorn.","23":"Surely *there is* no enchantment against Jacob, neither *is there* any divination against Israel: according to this time it shall be said of Jacob and of Israel, What hath God wrought!","24":"Behold, the people shall rise up as a great lion, and lift up himself as a young lion: he shall not lie down until he eat *of* the prey, and drink the blood of the slain.","25":"And Balak said unto Balaam, Neither curse them at all, nor bless them at all.","26":"But Balaam answered and said unto Balak, Told not I thee, saying, All that the LORD speaketh, that I must do?","27":"And Balak said unto Balaam, Come, I pray thee, I will bring thee unto another place; peradventure it will please God that thou mayest curse","28":"And Balak brought Balaam unto the top of Peor, that looketh toward Jeshimon.","29":"And Balaam said unto Balak, Build me here seven altars, and prepare me here seven bullocks and seven rams.","30":"And Balak did as Balaam had said, and offered a bullock and a ram on *every* altar."}},"tsk":{"1":[{"kopje":"Bouw hier","refs":["Num 23:29","Ezech 33:31","Judas 1:11"]},{"kopje":"zeven altaren","refs":["Ex 20:24","Ex 27: 51\">mij</span> klaar.","30":"<span class=\"wl\" data-l=\"L1\" data-code=\"H1111\">Balak</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6213\">deed</span> wat <span class=\"wl\" data-l=\"L3\" data-code=\"H1109\">Bileam</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H559\">gezegd</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H559\">had</span>; <span class=\"wl\" data-l=\"L5\" data-code=\"H5927\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5927\">hij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5927\">offerde</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5927\">een</span> stier <span class=\"wl\" data-l=\"L6\" data-code=\"H352\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H352\">een</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H352\">ram</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H352\">op</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4196\">elk</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4196\">altaar</span>."},"koppeling_kjv":{"1":"And <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">Build</span> me here <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> me here <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">oxen</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> rams.","2":"And <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken;</span> and <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> and <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> on every <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> a <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> and a ram.","3":"And <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> <span class=\"wl wl-kjv\" data-code=\"H3320\">Stand</span> by thy burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3212\">go:</span> peradventure the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H7136\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> me: and <span class=\"wl wl-kjv\" data-code=\"H1697\">whatsoever</span> he <span class=\"wl wl-kjv\" data-code=\"H7200\">sheweth</span> me I will <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> thee. And he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to an high place.","4":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7136\">met</span> <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I have <span class=\"wl wl-kjv\" data-code=\"H6186\">prepared</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and I have <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> upon every <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> a <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> and a ram.","5":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> in <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> unto <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> and thus thou shalt speak.","6":"And he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto him, and, lo, he <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> by his burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">sacrifice,</span> he, and all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of Moab.","7":"And he took <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H4912\">parable,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> hath <span class=\"wl wl-kjv\" data-code=\"H5148\">brought</span> me from <span class=\"wl wl-kjv\" data-code=\"H758\">Aram,</span> out of the <span class=\"wl wl-kjv\" data-code=\"H2042\">mountains</span> of the <span class=\"wl wl-kjv\" data-code=\"H6924\">east,</span> saying, <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> <span class=\"wl wl-kjv\" data-code=\"H779\">curse</span> me <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H2194\">defy</span> Israel.","8":"<span class=\"wl wl-kjv\" data-code=\"H4100\">How</span> shall I <span class=\"wl wl-kjv\" data-code=\"H5344\">curse,</span> whom <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> hath not <span class=\"wl wl-kjv\" data-code=\"H6895\">cursed?</span> or how shall I <span class=\"wl wl-kjv\" data-code=\"H2194\">defy,</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath not defied?","9":"For from the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H6697\">rocks</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> him, and from the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills</span> I <span class=\"wl wl-kjv\" data-code=\"H7789\">behold</span> him: lo, the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H910\">alone,</span> and shall not be <span class=\"wl wl-kjv\" data-code=\"H2803\">reckoned</span> among the nations.","10":"Who can <span class=\"wl wl-kjv\" data-code=\"H4487\">count</span> the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the <span class=\"wl wl-kjv\" data-code=\"H7255\">fourth</span> part of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> Let me <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> the <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> of the <span class=\"wl wl-kjv\" data-code=\"H3477\">righteous,</span> and let my last","11":"And <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam,</span> What hast thou <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto me? I <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> thee to <span class=\"wl wl-kjv\" data-code=\"H6895\">curse</span> mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and, behold, thou hast <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> them altogether.","12":"And he <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Must I not take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> that which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> in my mouth?","13":"And <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> I pray thee, with me unto <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> from whence thou mayest <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> them: thou shalt <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> <span class=\"wl wl-kjv\" data-code=\"H657\">but</span> the <span class=\"wl wl-kjv\" data-code=\"H7097\">utmost</span> part of them, and shalt not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> them all: and curse","14":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">brought</span> him into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H6839\">Zophim,</span> to the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of <span class=\"wl wl-kjv\" data-code=\"H6449\">Pisgah,</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> a <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> and a <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> on every altar.","15":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> <span class=\"wl wl-kjv\" data-code=\"H3320\">Stand</span> <span class=\"wl wl-kjv\" data-code=\"H3541\">here</span> by thy burnt <s im; thou shalt see nothing but his end (or utmost part,) but not see him altogether, and curse me him from thence. [As if he had said; Thou maist perhaps have been daunted before, with the sight of such a multitude, and therefore didst not dare to curse them in that place; others, read it thus; Whence thou shalt see him, [thou sawest onely his end but thou hast not wholly seen him, &c.]"}],"14":[{"catchword":null,"tekst":"Thus he took him along to field of Zophim, on the top of Pisga: and he built seven Altars, and he offered a bullock and a ram upon each Altar."}],"15":[{"catchword":null,"tekst":"Then he said to Balak, abide standing here by thy burnt-offering: and I will meet him [viz. the LORD, to enquire of him] there."}],"16":[{"catchword":null,"tekst":"When the LORD met Bileam, he put the word into his mouth; [See above, ch.22.35.] and he said; return to Balak, and speak thus:"}],"17":[{"catchword":null,"tekst":"When he came to him, behold, he stood by his burnt-offering, and the Princes of the Moabites by him: Balak now said unto him, what hath the LORD spoken?"}],"18":[{"catchword":null,"tekst":"Then he lifted up his sentence, [See above, v.7.] and said: arise Balak and hear [viz. to receive the Word of the Lord with due reverence. See Jud 3:20.] incline thine ears to thou son of Zippor."}],"19":[{"catchword":null,"tekst":"God is no man that he should lie, nor a child of man, that it should repent him; should he say, and not do it? or speak, and not make it steadfast? [Heb. to stand.]"}],"20":[{"catchword":null,"tekst":"Behold, I have received to bliss: [viz. this people of Israel; for this he saith he received Gods command, and could not but obey the same] because he blesseth, I shall not reverse it. [he, viz. the LORD.]"}],"21":[{"catchword":null,"tekst":"He, [viz. the LORD] regardeth not the iniquity in Jacob, [The meaning is, God is so kind and gracious to the Israelites, that he doth in a manner not see or heed, at least not impute their sins unto them] nor doth he look upon the malice [oth. Perverseness, or, toil, trouble, labour] in Israel: the LORD his God is with him, and the sound [viz. of Trumpets, having regard to the silver Trumpets, whereof see ab. Ch.10.9. Jos.6.16, 20. Jud 7:20. and 2 Chr.13.12.] of the king [i.e. of God the King of all kings. This passage may well be applied to the preaching of the word of God.] is with him. [viz. with Jacob, or Israel.]"}],"22":[{"catchword":null,"tekst":"God hath carried (or led, brought) them forth out of Egypt: his powers are as an Unicorns. [The Unicorn is especially commended for his strength in the Scriptures, below, ch.24.8. Deut.33.17. Job 39:12. Psal.22.22. and 92.11. This creature was known in those days, but what it was properly, is now unknown.]"}],"24":[{"catchword":null,"tekst":"Loe, the people shall rise up like an old Lion, and they shall exalt, themselves like a Lion: they will not lied down, till they have eaten the prey and drunk the blood of the slain."}],"25":[{"catchword":null,"tekst":"Then Balak said to Bileam; Thou shalt neither curse it wholly, nor bless it in any kind. [Heb. cursing, not curse, and blessing, not bless.]"}],"26":[{"catchword":null,"tekst":"But Bileam answered, and said to Balak: did I not speak unto thee, saying, Whatsoever the LORD shall peak, the same I shall do?"}],"27":[{"catchword":null,"tekst":"Further, Balak said to Bileam, Come, I pray, I will take thee along to another place: peradventure shall it be right in the eyes of that God, that thou curse it [viz. the people of Israel] me thence."}],"28":[{"catchword":null,"tekst":"Then Balak took Bileam along, to the top of Peor, [The name of a mountain, called Phogor by the Greeks, whereon the Moabites used to offer sacrifices to their Idol, called Baal-Peor, below ch.25.2, 3, 18. and where they had a Temple, called Beth Peor, Deut.3.29. also there was a City of that name, which afterwards fell to the share of the Reubenites, jos.13.15, 20.] which looketh towards the wilderness."}],"29":[{"catchword":null,"tekst":"And Bileam said to Balak; build me here seven altars, and prepare me here seven Bullocks, and seven rams."}],"30":[{"catchword":null,"tekst":"Balak now did, according as Bileam had said: and he offered a Bullock and a ram upon each altar."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
