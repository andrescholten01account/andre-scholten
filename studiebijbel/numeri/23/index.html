 data-l=\"L8\" data-code=\"H5869\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H5869\">ogen</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H5869\">van</span> die <span class=\"wl\" data-l=\"L9\" data-code=\"H430\">God</span>, <span class=\"wl\" data-l=\"L10\" data-code=\"H6895\">dat</span> u het daarvandaan <span class=\"wl\" data-l=\"L10\" data-code=\"H6895\">voor</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H6895\">mij</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H6895\">vervloekt</span>.", "28": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3947\">Toen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3947\">nam</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1111\">Balak</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1109\">Bileam</span> mee naar de top <span class=\"wl\" data-l=\"L4\" data-code=\"H6465\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6465\">Peor</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H6440\">die</span> uitziet over <span class=\"wl\" data-l=\"L6\" data-code=\"H3452\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3452\">woestijn</span>.", "29": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1109\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1109\">Bileam</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H559\">zei</span> tegen <span class=\"wl\" data-l=\"L3\" data-code=\"H1111\">Balak</span>: <span class=\"wl\" data-l=\"L4\" data-code=\"H1129\">Bouw</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">hier</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">zeven</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4196\">altaren</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">voor</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">mij</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">en</span> maak <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">hier</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">zeven</span> stieren <span class=\"wl\" data-l=\"L7\" data-code=\"H3559\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">zeven</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H352\">rammen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">voor</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7651\">mij</span> klaar.", "30": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1111\">Balak</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6213\">deed</span> wat <span class=\"wl\" data-l=\"L3\" data-code=\"H1109\">Bileam</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H559\">gezegd</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H559\">had</span>; <span class=\"wl\" data-l=\"L5\" data-code=\"H5927\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5927\">hij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5927\">offerde</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5927\">een</span> stier <span class=\"wl\" data-l=\"L6\" data-code=\"H352\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H352\">een</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H352\">ram</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H352\">op</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4196\">elk</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4196\">altaar</span>."}, "koppeling_kjv": {"1": "And <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">Build</span> me here <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> me here <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">oxen</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> rams.", "2": "And <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken;</span> and <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> and <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> on every <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> a <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> and a ram.", "3": "And <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> <span class=\"wl wl-kjv\" data-code=\"H3320\">Stand</span> by thy burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3212\">go:</span> peradventure the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H7136\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> me: and <span class=\"wl wl-kjv\" data-code=\"H1697\">whatsoever</span> he <span class=\"wl wl-kjv\" data-code=\"H7200\">sheweth</span> me I will <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> thee. And he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to an high place.", "4": "And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7136\">met</span> <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I have <span class=\"wl wl-kjv\" data-code=\"H6186\">prepared</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and I have <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> upon every <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> a <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> and a ram.", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> in <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> unto <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> and thus thou shalt speak.", "6": "And he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto him, and, lo, he <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> by his burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">sacrifice,</span> he, and all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of Moab.", "7": "And he took <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H4912\">parable,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> hath <span class=\"wl wl-kjv\" data-code=\"H5148\">brought</span> me from <span class=\"wl wl-kjv\" data-code=\"H758\">Aram,</span> out of the <span class=\"wl wl-kjv\" data-code=\"H2042\">mountains</span> of the <span class=\"wl wl-kjv\" data-code=\"H6924\">east,</span> saying, <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> <span class=\"wl wl-kjv\" data-code=\"H779\">curse</span> me <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H2194\">defy</span> Israel.", "8": "<span class=\"wl wl-kjv\" data-code=\"H4100\">How</span> shall I <span class=\"wl wl-kjv\" data-code=\"H5344\">curse,</span> whom <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> hath not <span class=\"wl wl-kjv\" data-code=\"H6895\">cursed?</span> or how shall I <span class=\"wl wl-kjv\" data-code=\"H2194\">defy,</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath not defied?", "9": "For from the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H6697\">rocks</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> him, and from the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills</span> I <span class=\"wl wl-kjv\" data-code=\"H7789\">behold</span> him: lo, the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H910\">alone,</span> and shall not be <span class=\"wl wl-kjv\" data-code=\"H2803\">reckoned</span> among the nations.", "10": "Who can <span class=\"wl wl-kjv\" data-code=\"H4487\">count</span> the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the <span class=\"wl wl-kjv\" data-code=\"H7255\">fourth</span> part of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> Let me <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> the <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> of the <span class=\"wl wl-kjv\" data-code=\"H3477\">righteous,</span> and let my last", "11": "And <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam,</span> What hast thou <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto me? I <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> thee to <span class=\"wl wl-kjv\" data-code=\"H6895\">curse</span> mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and, behold, thou hast <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> them altogether.", "12": "And he <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Must I not take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> that which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> in my mouth?", "13": "And <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> I pray thee, with me unto <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> from whence thou mayest <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> them: thou shalt <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> <span class=\"wl wl-kjv\" data-code=\"H657\">but</span> the <span class=\"wl wl-kjv\" data-code=\"H7097\">utmost</span> part of them, and shalt not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> them all: and curse", "14": "And he <span class=\"wl wl-kjv\" data-code=\"H3947\">brought</span> him into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H6839\">Zophim,</span> to the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of <span class=\"wl wl-kjv\" data-code=\"H6449\">Pisgah,</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> a <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> and a <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> on every altar.", "15": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> <span class=\"wl wl-kjv\" data-code=\"H3320\">Stand</span> <span class=\"wl wl-kjv\" data-code=\"H3541\">here</span> by thy burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> while I <span class=\"wl wl-kjv\" data-code=\"H7136\">meet</span> the LORD yonder.", "16": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7136\">met</span> <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> in his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Go <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> and say", "17": "And when he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to him, behold, he <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> by his burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> with him. And <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, What hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> spoken?", "18": "And he took <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H4912\">parable,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear;</span> <span class=\"wl wl-kjv\" data-code=\"H238\">hearken</span> unto me, thou <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Zippor:", "19": "<span class=\"wl wl-kjv\" data-code=\"H410\">God</span> is not a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> that he should <span class=\"wl wl-kjv\" data-code=\"H3576\">lie;</span> neither the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> that he should <span class=\"wl wl-kjv\" data-code=\"H5162\">repent:</span> hath he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> and shall he not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it? or hath he <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken,</span> and shall he not make it good?", "20": "Behold, I have <span class=\"wl wl-kjv\" data-code=\"H3947\">received</span> commandment to <span class=\"wl wl-kjv\" data-code=\"H1288\">bless:</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed;</span> and I cannot reverse", "21": "He hath not <span class=\"wl wl-kjv\" data-code=\"H5027\">beheld</span> <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity</span> in <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> neither hath he <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H5999\">perverseness</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is with him, and the <span class=\"wl wl-kjv\" data-code=\"H8643\">shout</span> of a king", "22": "<span class=\"wl wl-kjv\" data-code=\"H410\">God</span> brought them <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> he hath as it were the <span class=\"wl wl-kjv\" data-code=\"H (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>

).join('');

function paneelInhoud(n, tab) {

    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;

        `<div class="gw-detail" style="margin-top:.5rem"></div>`;

      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');

    if (!refs || !refs.length) return '';

    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;

    const kids = nd.kinderen && nd.kinderen.length ?

  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?

      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];

  return `<div class="ntabs">

function toggle(n) {

  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
