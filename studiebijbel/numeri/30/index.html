s", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En Mozes sprak tot de hoofden van de stammen van de kinderen van Israël, en zei: Dit is de zaak die de HEERE geboden heeft:", "2": "Wanneer een man de HEERE een gelofte belooft, of een eed zweert, om zijn ziel met een verbintenis te verbinden, zal hij zijn woord niet schenden; hij zal doen naar alles wat uit zijn mond gegaan is.", "3": "Maar als een vrouw de HEERE een gelofte belooft, en zich met een verbintenis in het huis van haar vader in haar jeugd verbindt;", "4": "en haar vader haar gelofte, en haar verbintenis waarmee zij haar ziel verbonden heeft, hoort, en haar vader daarover tegen haar zwijgt, dan blijven al haar geloften gelden, en elke verbintenis waarmee zij haar ziel verbonden heeft, blijft gelden.", "5": "Maar als haar vader dat verbreekt, op de dag dat hij het hoort, dan blijven al haar geloften en haar verbintenissen, waarmee zij haar ziel verbonden heeft, niet gelden; en de HEERE zal het haar vergeven, want haar vader heeft ervoor gezorgd dat ze verbroken worden.", "6": "Maar als zij inderdaad een man heeft, en haar geloften op haar zijn, of de onbedachte uitspraak van haar lippen waarmee zij haar ziel verbonden heeft;", "7": "en haar man dat hoort, en op de dag dat hij het hoort tegen haar zwijgt, dan blijven haar geloften gelden, en haar verbintenissen, waarmee zij haar ziel verbonden heeft, blijven gelden.", "8": "Maar als haar man op de dag dat hij het hoorde dat verbreekt, en haar gelofte die op haar was, teniet doet, alsook de onbedachte uitspraak van haar lippen waarmee zij haar ziel verbonden heeft, dan zal de HEERE het haar vergeven.", "9": "Aangaande de gelofte van een weduwe, of van een verstotene: alles waarmee zij haar ziel verbonden heeft, blijft voor haar gelden.", "10": "Maar als zij in het huis van haar man een gelofte gedaan heeft, of met een eed door een verbintenis haar ziel verbonden heeft;", "11": "en haar man dat gehoord heeft, en tegen haar gezwegen heeft, het niet verbrekend, dan blijven al haar geloften gelden, alsook elke verbintenis waarmee zij haar ziel verbonden heeft, blijft gelden.", "12": "Maar als haar man die dingen helemaal teniet doet, op de dag dat hij het hoort, dan blijft niets gelden van alles wat uit haar lippen gegaan is, van haar gelofte, en van de verbintenis van haar ziel; haar man heeft ze teniet gedaan, en de HEERE zal het haar vergeven.", "13": "Elke gelofte, en elke eed van verbintenis, om de ziel te verootmoedigen, die kan haar man bevestigen, of die kan haar man teniet doen.", "14": "Maar als haar man tegen haar van dag tot dag helemaal zwijgt, dan bevestigt hij al haar geloften, of al haar verbintenissen die op haar zijn; hij heeft ze bevestigd, omdat hij tegen haar gezwegen heeft, op de dag dat hij het hoorde.", "15": "Maar als hij ze helemaal teniet doet, nadat hij het gehoord heeft, dan zal hij haar ongerechtigheid dragen.", "16": "Dat zijn de inzettingen die de HEERE Mozes geboden heeft, tussen een man en zijn vrouw, tussen een vader en zijn dochter, die nog in haar jeugd in het huis van haar vader is."}, "SV": {"1": "En Mozes sprak tot de hoofden der stammen van de kinderen Israëls, zeggende: Dit is de zaak, die de HEERE geboden heeft:", "2": "Wanneer een man den HEERE een gelofte zal beloofd, of een eed zal gezworen hebben, zijn ziel met een verbintenis verbindende, zijn woord zal hij niet ontheiligen; naar alles, wat uit zijn mond gegaan is, zal hij doen.", "3": "Maar als een vrouw den HEERE een gelofte zal beloofd hebben, en zich met een verbintenis in het huis haars vaders in haar jonkheid zal verbonden hebben;", "4": "En haar vader haar gelofte, en haar verbintenis, waarmede zij haar ziel verbonden heeft, zal horen, en haar vader tegen haar zal stilzwijgen, zo zullen al haar geloften bestaan, en alle verbintenis, waarmede zij haar ziel verbonden heeft, zal bestaan.", "5": "Maar indien haar vader dat zal breken, ten dage als hij het hoort, al haar geloften, en haar verbintenissen, waarmede zij haar ziel verbonden heeft, zullen niet bestaan; maar de HEERE zal het haar vergeven; want haar vader heeft ze haar doen breken.", "6": "Doch indien zij immers een man heeft, en haar geloften op haar zijn, of de uitspraak harer lippen, waarmede zij haar ziel verbonden heeft;", "7": "En haar man *dat* zal horen, en ten dage als hij het hoort, tegen haar zal stilzwijgen, zo zullen haar geloften bestaan, en haar verbintenissen, waarmede zij haar ziel verbonden heeft, zullen bestaan.", "8": "Maar indien haar man ten dage, als hij het hoorde, dat zal breken, en haar gelofte, die op haar was, zal te niet maken, mitsgaders de uitspraak harer lippen, waarmede zij haar ziel verbonden heeft, zo zal het de HEERE haar vergeven.", "9": "Aangaande de gelofte ener weduwe, of ener verstotene: alles, waarmede zij haar ziel verbonden heeft, zal over haar bestaan.", "10": "Maar indien zij ten huize haars mans gelofte gedaan heeft, of met een eed door verbintenis haar ziel verbonden heeft;", "11": "En haar man *dat* gehoord, en tegen haar stil zal gezwegen hebben, dat niet brekende; zo zullen al haar geloften bestaan, mitsgaders alle verbintenis, waarmede zij haar ziel verbonden heeft, zal bestaan.", "12": "Maar indien haar man die dingen ganselijk te niet maakt, ten dage als hij het hoort, niets van al wat uit haar lippen gegaan is, van haar gelofte, en van de verbintenis harer ziel, zal bestaan; haar man heeft ze te niet gemaakt, en de HEERE zal het haar vergeven.", "13": "Alle gelofte, en allen eed der verbintenis, om de ziel te verootmoedigen, die zal haar man bevestigen, of die zal haar man te niet maken.", "14": "Maar zo haar man tegen haar van dag tot dag ganselijk stilzwijgt, zo bevestigt hij al haar geloften, of al haar verbintenissen, dewelke op haar zijn; hij heeft ze bevestigd, omdat hij tegen haar stilgezwegen heeft, ten dage als hij het hoorde.", "15": "Doch zo hij ze ganselijk te niet maken zal, nadat hij het gehoord zal hebben, zo zal hij haar ongerechtigheid dragen.", "16": "Dat zijn de inzettingen, die de HEERE Mozes geboden heeft, tussen een man en zijn huisvrouw, tussen een vader en zijn dochter, zijnde in haar jonkheid, ten huize haars vaders."}, "KJV": {"1": "And Moses spake unto the heads of the tribes concerning the children of Israel, saying, This *is* the thing which the LORD hath commanded.", "2": "If a man vow a vow unto the LORD, or swear an oath to bind his soul with a bond; he shall not break his word, he shall do according to all that proceedeth out of his mouth.", "3": "If a woman also vow a vow unto the LORD, and bind herself by a bond, *being* in her father's house in her youth;", "4": "And her father hear her vow, and her bond wherewith she hath bound her soul, and her father shall hold his peace at her: then all her vows shall stand, and every bond wherewith she hath bound her soul shall stand.", "5": "But if her father disallow her in the day that he heareth; not any of her vows, or of her bonds wherewith she hath bound her soul, shall stand: and the LORD shall forgive her, because her father disallowed", "6": "And if she had at all an husband, when she vowed, or uttered ought out of her lips, wherewith she bound her soul;", "7": "And her husband heard *it,* and held his peace at her in the day that he heard *it*: then her vows shall stand, and her bonds wherewith she bound her soul shall stand.", "8": "But if her husband disallowed her on the day that he heard *it*; then he shall make her vow which she vowed, and that which she uttered with her lips, wherewith she bound her soul, of none effect: and the LORD shall forgive", "9": "But every vow of a widow, and of her that is divorced, wherewith they have bound their souls, shall stand", "10": "And if she vowed in her husband's house, or bound her soul by a bond with an oath;", "11": "And her husband heard *it*, and held his peace at her, *and* disallowed her not: then all her vows shall stand, and every bond wherewith she bound her soul shall stand.", "12": "But if her husband hath utterly made them void on the day he heard *them; then* whatsoever proceeded out of her lips concerning her vows, or concerning the bond of her soul, shall not stand: her husband hath made them void; and the LORD shall forgive", "13": "Every vow, and every binding oath to afflict the soul, her husband may establish it, or her husband may make it void.", "14": "But if her husband altogether hold his peace at her from day to day; then he establisheth all her vows, or all her bonds, which *are* upon her: he confirmeth them, because he held his peace at her in the day that he heard", "15": "But if he shall any ways make them void after that he hath heard *them*; then he shall bear her iniquity.", "16": "These *are* the statutes, which the LORD commanded Moses, between a man and his wife, between the father and his daughter, *being yet* in her youth in her father's house."}}, "tsk": {"2": [{"kopje": "gelofte belooft", "refs": ["Num 21:2", "Gen 28:20-22", "Lev 27:2-34", "Deut 23:21", "Deut 23:22", "Richt 11:11", "Richt 11:30", "Richt 11:31", "Richt 11:35", "Richt 11:36", "Richt 11:39", "Ps 15:3", "Ps 56:13", "Ps 76:12", "Ps 119:106", "Spr 20:25"]}, {"kopje": "zweert", "refs": ["Ex 20:7", "Lev 5:4", "Matt 5:33", "Matt 5:34", "Matt 14:7-9", "Hand 23:12", "2 Kor 1:23", "2 Kor 9:9-11"]}, {"kopje": "verbinden", "refs": ["Num 30:3", "Num 30:4", "Num 30:10", "Matt 23:16", "Matt 23:18", "Hand 23:12", "Hand 23:14", "Hand 23:21"]}, {"kopje": "schenden", "refs": ["Ps 55:21"]}, {"kopje": "hij zal doen", "refs": ["Job 22:27", "Ps 22:26", "Ps 50:14", "Ps 66:13", "Ps 66:14", "Ps 116:14", "Ps 116:18", "Pred 5:3", "Pred 5:4", "Nahum 1:15"]}], "6": [{"kopje": "haar geloften", "refs": ["Ps 56:13"]}], "12": [{"kopje": "haar man heeft ze teniet gedaan", "refs": ["1 Kor 11:3"]}, {"kopje": "en de HEERE", "refs": ["Num 30:5", "Num 30:8", "Num 15:25", "Num 15:28 , "href": "../../torrey/v/?hl=Num.30.9#i22677", "refs": [{"disp": "Num 30:9", "href": "../../numeri/30/#v9", "ref": "Num 30:9", "svLabel": null}], "kinderen": []}]}, {"topic": "Widows", "href": "../../torrey/w/#t-widows", "kinderen": [{"label": "Laws Respecting", "href": "../../torrey/w/?hl=Num.30.9#i23235", "refs": [], "kinderen": [{"label": "Bound to perform their vows", "href": "../../torrey/w/?hl=Num.30.9#i23238", "refs": [{"disp": "Num 30:9", "href": "../../numeri/30/#v9", "ref": "Num 30:9", "svLabel": null}], "kinderen": []}]}]}]}, "10": {"torrey": [{"topic": "Vows", "href": "../../torrey/v/#t-vows", "kinderen": [{"label": "Of married women void without consent of husbands", "href": "../../torrey/v/?hl=Num.30.10#i22676", "refs": [{"disp": "Num 30:6-8", "href": "../../numeri/30/#v6", "ref": "Num 30:6-8", "svLabel": null}, {"disp": "Num 30:10-13", "href": "../../numeri/30/#v10", "ref": "Num 30:10-13", "svLabel": null}], "kinderen": []}]}]}, "13": {"torrey": [{"topic": "Vows", "href": "../../torrey/v/#t-vows", "kinderen": [{"label": "Were Made In Reference To", "href": "../../torrey/v/?hl=Num.30.13#i22665", "refs": [], "kinderen": [{"label": "Afflicting the soul", "href": "../../torrey/v/?hl=Num.30.13#i22670", "refs": [{"disp": "Num 30:13", "href": "../../numeri/30/#v13", "ref": "Num 30:13", "svLabel": null}], "kinderen": []}]}]}]}, "14": {"torrey": [{"topic": "Vows", "href": "../../torrey/v/#t-vows", "kinderen": [{"label": "Of wives, could only be objected to at the time of making", "href": "../../torrey/v/?hl=Num.30.14#i22678", "refs": [{"disp": "Num 30:14", "href": "../../numeri/30/#v14", "ref": "Num 30:14", "svLabel": null}, {"disp": "Num 30:15", "href": "../../numeri/30/#v15", "ref": "Num 30:15", "svLabel": null}], "kinderen": []}]}]}, "15": {"torrey": [{"topic": "Vows", "href": "../../torrey/v/#t-vows", "kinderen": [{"label": "Of wives, could only be objected to at the time of making", "href": "../../torrey/v/?hl=Num.30.15#i22678", "refs": [{"disp": "Num 30:14", "href": "../../numeri/30/#v14", "ref": "Num 30:14", "svLabel": null}, {"disp": "Num 30:15", "href": "../../numeri/30/#v15", "ref": "Num 30:15", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ps 61:9": "Zo zal ik Uw Naam psalmzingen in eeuwigheid; opdat ik mijn geloften betaal, dag bij dag.", "Matt 5:33": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden.", "Num 15:28": "En de priester zal de verzoening doen over de dwalende ziel, wanneer zij gezondigd heeft door afdwaling, voor het aangezicht van de HEERE, door de verzoening over haar te doen; en het zal haar vergeven worden.", "Hand 23:12": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben.", "Num 30:10-13": "Maar als zij in het huis van haar man een gelofte gedaan heeft, of met een eed door een verbintenis haar ziel verbonden heeft; en haar man dat gehoord heeft, en tegen haar gezwegen heeft, het niet verbrekend, dan blijven al haar geloften gelden, alsook elke verbintenis waarmee zij haar ziel verbonden heeft, blijft gelden. Maar als haar man die dingen helemaal teniet doet, op de dag dat hij het hoort, dan blijft niets gelden van alles wat uit haar lippen gegaan is, van haar gelofte, en van de verbintenis van haar ziel; haar man heeft ze teniet gedaan, en de HEERE zal het haar vergeven.", "Lev 16:29": "En dit zal voor u een eeuwige inzetting zijn: u zult in de zevende maand, op de tiende van de maand, uzelf verootmoedigen, en geen enkel werk doen, of het nu een geboren Israëliet is of een vreemdeling die te midden van u verblijft.", "Ps 61:6": "Want U, o God! hebt gehoord naar mijn geloften; U hebt mij gegeven de erfenis van hen die Uw Naam vrezen.", "Gen 28:20": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken;", "Num 30:3-5": "Maar als een vrouw de HEERE een gelofte belooft, en zich met een verbintenis in het huis van haar vader in haar jeugd verbindt; en haar vader haar gelofte, en haar verbintenis waarmee zij haar ziel verbonden heeft, hoort, en haar vader daarover tegen haar zwijgt, dan blijven al haar geloften gelden, en elke verbintenis waarmee zij haar ziel verbonden heeft, blijft gelden. Maar als haar vader dat verbreekt, op de dag dat hij het hoort, dan blijven al haar geloften en haar verbintenissen, waarmee zij haar ziel verbonden heeft, niet gelden; en de HEERE zal het haar vergeven, want haar vader heeft ervoor gezorgd dat ze verbroken worden.", "Ps 116:14-19": "Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk. Kostbaar is in de ogen van de HEERE de dood van Zijn gunstgenoten. Och HEERE, zeker, ik ben Uw knecht, ik ben Uw knecht, een zoon van Uw dienstmaagd; U hebt mijn banden losgemaakt.", "Num 30:6-16": "Maar als zij inderdaad een man heeft, en haar geloften op haar zijn, of de onbedachte uitspraak van haar lippen waarmee zij haar ziel verbonden heeft; en haar man dat hoort, en op de dag dat hij het hoort tegen haar zwijgt, dan blijven haar geloften gelden, en haar verbintenissen, waarmee zij haar ziel verbonden heeft, blijven gelden. Maar als haar man op de dag dat hij het hoorde dat verbreekt, en haar gelofte die op haar was, teniet doet, alsook de onbedachte uitspraak van haar lippen waarmee zij haar ziel verbonden heeft, dan zal de HEERE het haar vergeven.", "2 Kor 9:9-11": "Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid. Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid; Zodat u in alles rijk wordt tot alle goeddadigheid, die door ons dankzegging aan God bewerkt.", "Gen 31:13": "Ik ben die God van Bethel, waar u het opgerichte teken gezalfd hebt, waar u Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer terug naar het land van uw familie.", "Ps 66:14": "Die mijn lippen hebben geuit, en mijn mond heeft uitgesproken, toen het mij bang te moede was.", "Richt 11:39": "En het gebeurde, aan het einde van twee maanden, dat zij naar haar vader terugkwam, die met haar deed naar zijn gelofte die hij beloofd had; en zij had geen man bekend. Verder werd het een gewoonte in Israël,", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Ps 50:14": "Offert God dank, en betaalt de Allerhoogste uw geloften.", "Deut 23:21": "Wanneer u de HEERE, uw God, een gelofte beloofd hebt, zult u niet talmen die te betalen; want de HEERE, uw God, zal die zeker van u eisen, en er zou zonde in u zijn.", "Lev 23:27": "Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren.", "1 Kor 7:5": "Onttrek u niet aan elkaar, tenzij met wederzijdse instemming voor een tijd, opdat u zich aan vasten en bidden kunt wijden; en kom weer bijeen, opdat de satan u niet verzoekt, omdat u zich niet kunt onthouden.", "Lev 5:4-13": "Of als een mens zal hebben gezworen, onbedacht met zijn lippen uitsprekend om kwaad te doen of om goed te doen, wat de mens ook onbedacht uitspreekt in een eed; en het is voor hem verborgen geweest, maar hij komt erachter, dan is hij aan een van die dingen schuldig. Het zal dan gebeuren, als hij aan een van die dingen schuldig is, dat hij zal belijden waarin hij gezondigd heeft; En hij zal zijn schuldoffer aan de HEERE brengen voor zijn zonde die hij gezondigd heeft: een wijfje van het kleinvee, een lam of een jonge geit, als zondoffer; en de priester zal voor hem verzoening doen vanwege zijn zonde.", "Job 22:27": "U zult ernstig tot Hem bidden, en Hij zal u verhoren; en u zult uw geloften betalen.", "Hand 23:21": "Geloof hen dan niet; want meer dan veertig mannen van hen leggen hem een hinderlaag, die zichzelf met een vervloeking verbonden hebben om niet te eten of te drinken totdat zij hem gedood zullen hebben; en zij zijn nu gereed en wachten op uw toezegging.", "1 Petr 3:1-6": "Evenzo, u vrouwen, wees uw eigen mannen onderdanig; opdat ook, als er sommigen zijn die het Woord ongehoorzaam zijn, zij door de wandel van de vrouwen zonder Woord gewonnen mogen worden; Als zij uw kuise wandel in vreze zullen hebben gezien. Laat uw versiering niet zijn de uiterlijke, bestaande in het vlechten van het haar, en het omhangen van goud, of het aantrekken van klederen;", "Ps 35:13": "Mij aangaande daarentegen, toen zij ziek waren, was een zak mijn kleed; ik kwelde mijn ziel met vasten, en mijn gebed keerde weer in mijn boezem.", "Num 30:1-16": "En Mozes sprak tot de hoofden van de stammen van de kinderen van Israël, en zei: Dit is de zaak die de HEERE geboden heeft: Wanneer een man de HEERE een gelofte belooft, of een eed zweert, om zijn ziel met een verbintenis te verbinden, zal hij zijn woord niet schenden; hij zal doen naar alles wat uit zijn mond gegaan is. Maar als een vrouw de HEERE een gelofte belooft, en zich met een verbintenis in het huis van haar vader in haar jeugd verbindt;", "Num 30:6-8": "Maar als zij inderdaad een man heeft, en haar geloften op haar zijn, of de onbedachte uitspraak van haar lippen waarmee zij haar ziel verbonden heeft; en haar man dat hoort, en op de dag dat hij het hoort tegen haar zwijgt, dan blijven haar geloften gelden, en haar verbintenissen, waarmee zij haar ziel verbonden heeft, blijven gelden. Maar als haar man op de dag dat hij het hoorde dat verbreekt, en haar gelofte die op haar was, teniet doet, alsook de onbedachte uitspraak van haar lippen waarmee zij haar ziel verbonden heeft, dan zal de HEERE het haar vergeven.", "Neh 10:29": "hielden zich aan hun broeders, hun voortreffelijken, en kwamen onder de vloek en de eed, dat zij zouden wandelen in de wet van God, die gegeven is door de hand van de knecht van God, Mozes; en dat zij zouden houden, en dat zij zouden doen al de geboden van de HEERE, onze Heere, en Zijn rechten en Zijn inzettingen;", "Richt 11:30": "En Jeftha beloofde de HEERE een gelofte, en zei: Als U de kinderen van Ammon werkelijk in mijn hand geeft,", "Ps 116:14": "Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk.", "Gen 28:21": "en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn!", "Richt 11:36": "En zij zei tegen hem: Mijn vader! Hebt u uw mond opengedaan tegen de HEERE, doe met mij zoals uit uw mond is gekomen; aangezien de HEERE u volkomen wraak gegeven heeft op uw vijanden, op de kinderen van Ammon.", "Ps 55:21": "Hij slaat zijn handen aan hen die vrede met Hem hadden; hij ontheiligt Zijn verbond.", "Matt 23:18": "En wie zweert bij het altaar, dat is niets; maar wie zweert bij de gave die daarop ligt, die is verplicht zijn eed te houden.", "Num 15:25": "En de priester zal de verzoening doen voor de hele vergadering van de kinderen van Israël, en het zal hun vergeven worden; want het was een afdwaling, en zij hebben hun offerande gebracht, een vuuroffer voor de HEERE, en hun zondoffer, voor het aangezicht van de HEERE, over hun afdwaling.", "Ezra 8:21": "Toen riep ik daar een vasten uit bij de rivier Ahava, opdat wij ons zouden verootmoedigen voor het aangezicht van onze God, om van Hem te verzoeken een rechte weg, voor ons, en voor onze kinderen, en voor al onze have.", "Ps 22:26": "Van U zal mijn lof zijn in een grote gemeente; ik zal mijn geloften betalen in de tegenwoordigheid van hen die Hem vrezen.", "Deut 23:21-23": "Wanneer u de HEERE, uw God, een gelofte beloofd hebt, zult u niet talmen die te betalen; want de HEERE, uw God, zal die zeker van u eisen, en er zou zonde in u zijn. Maar als u nalaat te beloven, zal het geen zonde in u zijn. Wat uit uw lippen komt, zult u houden en doen; zoals u de HEERE, uw God, een vrijwillig offer beloofd hebt, dat u met uw mond gesproken hebt.", "Ps 66:13": "Ik zal met brandoffers Uw huis binnengaan; ik zal U mijn geloften betalen,", "Jes 58:5": "Zou dit zulk een vasten zijn dat Ik verkiezen zou, dat de mens zijn ziel een dag kwelt, dat hij zijn hoofd kromt zoals een bieze, en een zak en as onder zich spreidt? Zou u dat een vasten noemen, en een dag die de HEERE aangenaam is?", "Pred 5:3": "Wanneer u een gelofte aan God zult hebben beloofd, stel het niet uit om die te betalen; want Hij heeft geen behagen in dwazen; wat u zult hebben beloofd, betaal het.", "Deut 23:22": "Maar als u nalaat te beloven, zal het geen zonde in u zijn.", "Gen 28:20-22": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken; en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn! En deze steen, die ik als opgericht teken gezet heb, zal een huis van God zijn; en van alles wat U mij geven zult, zal ik U zeker de tienden geven!", "Richt 11:11": "Zo ging Jeftha met de oudsten van Gilead, en het volk stelde hem tot hoofd en aanvoerder over zich. En Jeftha sprak al zijn woorden voor het aangezicht van de HEERE te Mizpa.", "Ps 132:2": "dat hij de HEERE gezworen heeft, de Machtige van Jakob een gelofte gedaan heeft, en zei:", "Gal 3:28": "Daarin is geen Jood en geen Griek; daarin is geen slaaf en geen vrije; daarin is geen man en vrouw; want u bent allen één in Christus Jezus.", "Lev 5:4": "Of als een mens zal hebben gezworen, onbedacht met zijn lippen uitsprekend om kwaad te doen of om goed te doen, wat de mens ook onbedacht uitspreekt in een eed; en het is voor hem verborgen geweest, maar hij komt erachter, dan is hij aan een van die dingen schuldig.", "Lev 27:2-34": "Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer iemand een gelofte gedaan heeft om iemand af te zonderen, zullen de zielen naar uw schatting van de HEERE zijn. Als uw schatting van een man geldt, van twintig jaar oud tot iemand die zestig jaar oud is, dan zal uw schatting vijftig sikkel zilver zijn, naar de sikkel van het heiligdom. Maar is het een vrouw, dan zal uw schatting dertig sikkel zijn.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Nahum 1:15": "Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid.", "Jona 2:9": "Maar ik zal U offeren met de stem van de dankzegging; wat ik beloofd heb, zal ik betalen. Het heil is van de HEERE.", "Num 15:2-16": "Spreek tot de kinderen van Israël en zeg tot hen: Wanneer u gekomen bent in het land van uw woningen, dat Ik u geven zal; En u de HEERE een vuuroffer zult doen, een brandoffer of slachtoffer, om een gelofte af te zonderen, of in een vrijwillig offer, of op uw vastgestelde hoogtijden, om de HEERE een liefelijke reuk te maken, van runderen of van klein vee; Zo zal hij, die zijn offerande de HEERE offert, een spijsoffer offeren van een tiende meelbloem, gemengd met een vierendeel van een hin olie.", "2 Kron 15:14": "En zij zwoeren de HEERE met luide stem en met gejuich, en ook met trompetten en met bazuinen.", "Pred 5:4": "Het is beter dat u niet belooft, dan dat u belooft en niet betaalt.", "1 Kor 11:3": "Maar ik wil dat u weet, dat Christus het Hoofd is van iedere man, en de man het hoofd van de vrouw, en God het Hoofd van Christus.", "Richt 11:35": "En het gebeurde, toen hij haar zag, dat hij zijn kleren scheurde, en zei: Ach, mijn dochter! U hebt mij helemaal terneergeslagen, en u bent onder degenen die mij in het ongeluk storten; want ik heb mijn mond opengedaan tegen de HEERE, en ik kan niet terug.", "Matt 23:16": "Wee u, blinde leidslieden, die zeggen: Wie ook zweert bij de tempel, dat is niets; maar wie zweert bij het goud van de tempel, die is verplicht zijn eed te houden.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Ps 119:106": "Ik heb gezworen, en zal het bevestigen, dat ik onderhouden zal de rechten van Uw gerechtigheid.", "2 Kron 15:15": "En heel Juda was verblijd over deze eed; want zij hadden met hun hele hart gezworen, en met hun hele wil Hem gezocht; en Hij werd door hen gevonden, en de HEERE gaf hun rust van rondom.", "Richt 11:31": "dan zal het zo zijn, dat wat uit de deur van mijn huis mij tegemoet komt, wanneer ik in vrede terugkeer van de kinderen van Ammon, dat zal van de HEERE zijn, en ik zal het offeren als brandoffer.", "Hand 23:14": "Zij gingen naar de overpriesters en de oudsten en zeiden: Wij hebben onszelf met een vervloeking vervloekt om niets te nuttigen totdat wij Paulus gedood zullen hebben.", "Ps 76:12": "Doe geloften en betaal ze de HEERE, uw God, u allen, die rondom Hem zijn! Laat men Hem, Die te vrezen is, geschenken brengen;", "Lev 23:32": "Het zal u een sabbat van de rust zijn; dan zult u uw zielen verootmoedigen; op de negende van de maand in de avond, van de avond tot de avond, zult u uw sabbat rusten.", "Lev 5:1": "Als een mens gezondigd zal hebben, doordat hij een stem van de vloek gehoord heeft, waarvan hij getuige is, hetzij dat hij het gezien of geweten heeft; als hij het niet bekendmaakt, dan zal hij zijn ongerechtigheid dragen.", "Spr 20:25": "Het is een strik voor de mens, dat hij het heilige verslindt, en na gedane geloften onderzoek te doen.", "1 Kor 11:9": "Want de man is ook niet geschapen om de vrouw, maar de vrouw om de man.", "Lev 22:18-25": "Spreek tot Aäron, en tot zijn zonen, en tot al de kinderen van Israël, en zeg tegen hen: Wie ook maar uit het huis van Israël, en uit de vreemdelingen in Israël is, die zijn offergave zal offeren voor al hun geloften, en voor al hun vrijwillige offers, die zij de HEERE als brandoffer zullen offeren; Het zal naar uw welgevallen zijn: een volkomen mannetje, van de runderen, van de lammeren, of van de geiten. U zult niets offeren waarin een gebrek is; want het zou niet aangenaam zijn voor u.", "Ps 15:3": "Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "Num 30:3-16": "Maar als een vrouw de HEERE een gelofte belooft, en zich met een verbintenis in het huis van haar vader in haar jeugd verbindt; en haar vader haar gelofte, en haar verbintenis waarmee zij haar ziel verbonden heeft, hoort, en haar vader daarover tegen haar zwijgt, dan blijven al haar geloften gelden, en elke verbintenis waarmee zij haar ziel verbonden heeft, blijft gelden. Maar als haar vader dat verbreekt, op de dag dat hij het hoort, dan blijven al haar geloften en haar verbintenissen, waarmee zij haar ziel verbonden heeft, niet gelden; en de HEERE zal het haar vergeven, want haar vader heeft ervoor gezorgd dat ze verbroken worden.", "Matt 5:34": "Maar Ik zeg u: zweer helemaal niet, noch bij de hemel, omdat hij de troon van God is;", "Ps 56:13": "O God! Op mij zijn Uw geloften; ik zal U dankzeggingen vergelden;", "Pred 5:3-5": "Wanneer u een gelofte aan God zult hebben beloofd, stel het niet uit om die te betalen; want Hij heeft geen behagen in dwazen; wat u zult hebben beloofd, betaal het. Het is beter dat u niet belooft, dan dat u belooft en niet betaalt. Laat uw mond niet toe dat hij uw lichaam laat zondigen; en zeg niet voor het aangezicht van de engel dat het een vergissing was; waarom zou God erg toornen om wat u zegt, en het werk van uw handen te gronde richten?", "Num 21:2": "Toen beloofde Israël de HEERE een gelofte en zei: Als U dit volk geheel in mijn hand geeft, zal ik hun steden verbannen.", "Num 29:7": "En op de tiende dag van deze zevende maand zult u een heilige samenkomst hebben, en u zult uw zielen verootmoedigen; geen werk zult u doen;", "2 Kor 1:23": "Maar ik roep God aan tot Getuige over mijn ziel, dat ik, om u te sparen, nog niet naar Korinthe gekomen ben.", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "Ps 116:18": "Ik zal mijn gelofte de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk,", "Ps 65:2": "De lofzang is in stilte tot U, o God! in Sion; en U zal de gelofte betaald worden.", "Matt 14:7-9": "Daarom beloofde hij haar met een eed te geven wat zij ook zou vragen. En zij, van tevoren door haar moeder onderricht, zei: Geef mij hier op een schotel het hoofd van Johannes de Doper. En de koning werd bedroefd; maar vanwege de eden, en degenen die met hem aanzaten, gebood hij dat het haar gegeven zou worden;"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H4872\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4872\">Mozes</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1696\">sprak</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1696\">tot</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7218\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7218\">hoofden</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7218\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4294\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4294\">stammen</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4294\">van</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3478\">Israël</span>, en zei: <span class=\"wl\" data-l=\"L7\" data-code=\"H1697\">Dit</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1697\">is</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1697\">de</span> <span class=\"wl\" data-l=\"L7\" data- usband</span> <span class=\"wl wl-kjv\" data-code=\"H5106\">disallowed</span> her on the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it; then he shall make her vow which she <span class=\"wl wl-kjv\" data-code=\"H5088\">vowed,</span> and that which she <span class=\"wl wl-kjv\" data-code=\"H4008\">uttered</span> with her <span class=\"wl wl-kjv\" data-code=\"H8193\">lips,</span> wherewith she <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> of none <span class=\"wl wl-kjv\" data-code=\"H6565\">effect:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall forgive", "9": "But every <span class=\"wl wl-kjv\" data-code=\"H5088\">vow</span> of a <span class=\"wl wl-kjv\" data-code=\"H490\">widow,</span> and of her that is <span class=\"wl wl-kjv\" data-code=\"H1644\">divorced,</span> wherewith they have <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> their <span class=\"wl wl-kjv\" data-code=\"H5315\">souls,</span> shall stand", "10": "And if she <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed</span> in her <span class=\"wl wl-kjv\" data-code=\"H376\">husband's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> or <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> by a <span class=\"wl wl-kjv\" data-code=\"H632\">bond</span> with an oath;", "11": "And her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, and held his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace</span> at her, and <span class=\"wl wl-kjv\" data-code=\"H5106\">disallowed</span> her not: then all her <span class=\"wl wl-kjv\" data-code=\"H5088\">vows</span> shall <span class=\"wl wl-kjv\" data-code=\"H6965\">stand,</span> and every <span class=\"wl wl-kjv\" data-code=\"H632\">bond</span> wherewith she <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall stand.", "12": "But if her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> hath <span class=\"wl wl-kjv\" data-code=\"H6565\">utterly</span> made them <span class=\"wl wl-kjv\" data-code=\"H6565\">void</span> on the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> them; then whatsoever <span class=\"wl wl-kjv\" data-code=\"H4161\">proceeded</span> out of her <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> concerning her <span class=\"wl wl-kjv\" data-code=\"H5088\">vows,</span> or concerning the <span class=\"wl wl-kjv\" data-code=\"H632\">bond</span> of her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> shall not <span class=\"wl wl-kjv\" data-code=\"H6965\">stand:</span> her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> hath made them <span class=\"wl wl-kjv\" data-code=\"H6565\">void;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall forgive", "13": "Every <span class=\"wl wl-kjv\" data-code=\"H5088\">vow,</span> and every <span class=\"wl wl-kjv\" data-code=\"H632\">binding</span> <span class=\"wl wl-kjv\" data-code=\"H7621\">oath</span> to <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> may <span class=\"wl wl-kjv\" data-code=\"H6965\">establish</span> it, or her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> may make it void.", "14": "But if her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H2790\">altogether</span> hold his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace</span> at her from <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> then he <span class=\"wl wl-kjv\" data-code=\"H6965\">establisheth</span> all her <span class=\"wl wl-kjv\" data-code=\"H5088\">vows,</span> or all her <span class=\"wl wl-kjv\" data-code=\"H632\">bonds,</span> which are upon her: he <span class=\"wl wl-kjv\" data-code=\"H6965\">confirmeth</span> them, because he held his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace</span> at her in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he heard", "15": "But if he shall any <span class=\"wl wl-kjv\" data-code=\"H6565\">ways</span> make them <span class=\"wl wl-kjv\" data-code=\"H6565\">void</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> them; then he shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> her iniquity.", "16": "These are the <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> between a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> between the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> being yet in her <span class=\"wl wl-kjv\" data-code=\"H5271\">youth</span> in her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> house."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
