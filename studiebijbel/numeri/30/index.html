tenis in het huis van haar vader in haar jeugd verbindt;","4":"en haar vader haar gelofte, en haar verbintenis waarmee zij haar ziel verbonden heeft, hoort, en haar vader daarover tegen haar zwijgt, dan blijven al haar geloften gelden, en elke verbintenis waarmee zij haar ziel verbonden heeft, blijft gelden.","5":"Maar als haar vader dat verbreekt, op de dag dat hij het hoort, dan blijven al haar geloften en haar verbintenissen, waarmee zij haar ziel verbonden heeft, niet gelden; en de HEERE zal het haar vergeven, want haar vader heeft ervoor gezorgd dat ze verbroken worden.","6":"Maar als zij inderdaad een man heeft, en haar geloften op haar zijn, of de onbedachte uitspraak van haar lippen waarmee zij haar ziel verbonden heeft;","7":"en haar man dat hoort, en op de dag dat hij het hoort tegen haar zwijgt, dan blijven haar geloften gelden, en haar verbintenissen, waarmee zij haar ziel verbonden heeft, blijven gelden.","8":"Maar als haar man op de dag dat hij het hoorde dat verbreekt, en haar gelofte die op haar was, teniet doet, alsook de onbedachte uitspraak van haar lippen waarmee zij haar ziel verbonden heeft, dan zal de HEERE het haar vergeven.","9":"Aangaande de gelofte van een weduwe, of van een verstotene: alles waarmee zij haar ziel verbonden heeft, blijft voor haar gelden.","10":"Maar als zij in het huis van haar man een gelofte gedaan heeft, of met een eed door een verbintenis haar ziel verbonden heeft;","11":"en haar man dat gehoord heeft, en tegen haar gezwegen heeft, het niet verbrekend, dan blijven al haar geloften gelden, alsook elke verbintenis waarmee zij haar ziel verbonden heeft, blijft gelden.","12":"Maar als haar man die dingen helemaal teniet doet, op de dag dat hij het hoort, dan blijft niets gelden van alles wat uit haar lippen gegaan is, van haar gelofte, en van de verbintenis van haar ziel; haar man heeft ze teniet gedaan, en de HEERE zal het haar vergeven.","13":"Elke gelofte, en elke eed van verbintenis, om de ziel te verootmoedigen, die kan haar man bevestigen, of die kan haar man teniet doen.","14":"Maar als haar man tegen haar van dag tot dag helemaal zwijgt, dan bevestigt hij al haar geloften, of al haar verbintenissen die op haar zijn; hij heeft ze bevestigd, omdat hij tegen haar gezwegen heeft, op de dag dat hij het hoorde.","15":"Maar als hij ze helemaal teniet doet, nadat hij het gehoord heeft, dan zal hij haar ongerechtigheid dragen.","16":"Dat zijn de inzettingen die de HEERE Mozes geboden heeft, tussen een man en zijn vrouw, tussen een vader en zijn dochter, die nog in haar jeugd in het huis van haar vader is."},"SV":{"1":"En Mozes sprak tot de hoofden der stammen van de kinderen Israëls, zeggende: Dit is de zaak, die de HEERE geboden heeft:","2":"Wanneer een man den HEERE een gelofte zal beloofd, of een eed zal gezworen hebben, zijn ziel met een verbintenis verbindende, zijn woord zal hij niet ontheiligen; naar alles, wat uit zijn mond gegaan is, zal hij doen.","3":"Maar als een vrouw den HEERE een gelofte zal beloofd hebben, en zich met een verbintenis in het huis haars vaders in haar jonkheid zal verbonden hebben;","4":"En haar vader haar gelofte, en haar verbintenis, waarmede zij haar ziel verbonden heeft, zal horen, en haar vader tegen haar zal stilzwijgen, zo zullen al haar geloften bestaan, en alle verbintenis, waarmede zij haar ziel verbonden heeft, zal bestaan.","5":"Maar indien haar vader dat zal breken, ten dage als hij het hoort, al haar geloften, en haar verbintenissen, waarmede zij haar ziel verbonden heeft, zullen niet bestaan; maar de HEERE zal het haar vergeven; want haar vader heeft ze haar doen breken.","6":"Doch indien zij immers een man heeft, en haar geloften op haar zijn, of de uitspraak harer lippen, waarmede zij haar ziel verbonden heeft;","7":"En haar man *dat* zal horen, en ten dage als hij het hoort, tegen haar zal stilzwijgen, zo zullen haar geloften bestaan, en haar verbintenissen, waarmede zij haar ziel verbonden heeft, zullen bestaan.","8":"Maar indien haar man ten dage, als hij het hoorde, dat zal breken, en haar gelofte, die op haar was, zal te niet maken, mitsgaders de uitspraak harer lippen, waarmede zij haar ziel verbonden heeft, zo zal het de HEERE haar vergeven.","9":"Aangaande de gelofte ener weduwe, of ener verstotene: alles, waarmede zij haar ziel verbonden heeft, zal over haar bestaan.","10":"Maar indien zij ten huize haars mans gelofte gedaan heeft, of met een eed door verbintenis haar ziel verbonden heeft;","11":"En haar man *dat* gehoord, en tegen haar stil zal gezwegen hebben, dat niet brekende; zo zullen al haar geloften bestaan, mitsgaders alle verbintenis, waarmede zij haar ziel verbonden heeft, zal bestaan.","12":"Maar indien haar man die dingen ganselijk te niet maakt, ten dage als hij het hoort, niets van al wat uit haar lippen gegaan is, van haar gelofte, en van de verbintenis harer ziel, zal bestaan; haar man heeft ze te niet gemaakt, en de HEERE zal het haar vergeven.","13":"Alle gelofte, en allen eed der verbintenis, om de ziel te verootmoedigen, die zal haar man bevestigen, of die zal haar man te niet maken.","14":"Maar zo haar man tegen haar van dag tot dag ganselijk stilzwijgt, zo bevestigt hij al haar geloften, of al haar verbintenissen, dewelke op haar zijn; hij heeft ze bevestigd, omdat hij tegen haar stilgezwegen heeft, ten dage als hij het hoorde.","15":"Doch zo hij ze ganselijk te niet maken zal, nadat hij het gehoord zal hebben, zo zal hij haar ongerechtigheid dragen.","16":"Dat zijn de inzettingen, die de HEERE Mozes geboden heeft, tussen een man en zijn huisvrouw, tussen een vader en zijn dochter, zijnde in haar jonkheid, ten huize haars vaders."},"KJV":{"1":"And Moses spake unto the heads of the tribes concerning the children of Israel, saying, This *is* the thing which the LORD hath commanded.","2":"If a man vow a vow unto the LORD, or swear an oath to bind his soul with a bond; he shall not break his word, he shall do according to all that proceedeth out of his mouth.","3":"If a woman also vow a vow unto the LORD, and bind herself by a bond, *being* in her father's house in her youth;","4":"And her father hear her vow, and her bond wherewith she hath bound her soul, and her father shall hold his peace at her: then all her vows shall stand, and every bond wherewith she hath bound her soul shall stand.","5":"But if her father disallow her in the day that he heareth; not any of her vows, or of her bonds wherewith she hath bound her soul, shall stand: and the LORD shall forgive her, because her father disallowed","6":"And if she had at all an husband, when she vowed, or uttered ought out of her lips, wherewith she bound her soul;","7":"And her husband heard *it,* and held his peace at her in the day that he heard *it*: then her vows shall stand, and her bonds wherewith she bound her soul shall stand.","8":"But if her husband disallowed her on the day that he heard *it*; then he shall make her vow which she vowed, and that which she uttered with her lips, wherewith she bound her soul, of none effect: and the LORD shall forgive","9":"But every vow of a widow, and of her that is divorced, wherewith they have bound their souls, shall stand","10":"And if she vowed in her husband's house, or bound her soul by a bond with an oath;","11":"And her husband heard *it*, and held his peace at her, *and* disallowed her not: then all her vows shall stand, and every bond wherewith she bound her soul shall stand.","12":"But if her husband hath utterly made them void on the day he heard *them; then* whatsoever proceeded out of her lips concerning her vows, or concerning the bond of her soul, shall not stand: her husband hath made them void; and the LORD shall forgive","13":"Every vow, and every binding oath to afflict the soul, her husband may establish it, or her husband may make it void.","14":"But if her husband altogether hold his peace at her from day to day; then he establisheth all her vows, or all her bonds, which *are* upon her: he confirmeth them, because he held his peace at her in the day that he heard","15":"But if he shall any ways make them void after that he hath heard *them*; then he shall bear her iniquity.","16":"These *are* the statutes, which the LORD commanded Moses, between a man and his wife, between the father and his daughter, *being yet* in her youth in her father's house."}},"tsk":{"2":[{"kopje":"gelofte belooft","refs":["Num 21:2","Gen 28:20-22","Lev 27:2-34","Deut 23:21","Deut 23:22","Richt 11:11","Richt 11:30","Richt 11:31","Richt 11:35","Richt 11:36","Richt 11:39","Ps 15:3","Ps 56:13","Ps 76:12","Ps 119:106","Spr 20:25"]},{"kopje":"zweert","refs":["Ex 20:7","Lev 5:4","Matt 5:33","Matt 5:34","Matt 14:7-9","Hand 23:12","2 Kor 1:23","2 Kor 9:9-11"]},{"kopje":"verbinden","refs":["Num 30:3","Num 30:4","Num 30:10","Matt 23:16","Matt 23:18","Hand 23:12","Hand 23:14","Hand 23:21"]},{"kopje":"schenden","refs":["Ps 55:21"]},{"kopje":"hij zal doen","refs":["Job 22:27","Ps 22:26","Ps 50:14","Ps 66:13","Ps 66:14","Ps 116:14","Ps 116:18","Pred 5:3","Pred 5:4","Nahum 1:15"]}],"6":[{"kopje":"haar geloften","refs":["Ps 56:13"]}],"12":[{"kopje":"haar man heeft ze teniet gedaan","refs":["1 Kor 11:3"]},{"kopje":"en de HEERE","refs":["Num 30:5","Num 30:8","Num 15:25","Num 15:28"]}],"13":[{"kopje":"en elke","refs":["1 Kor 11:3","1 Kor 11:9","1 Petr 3:1-6"]},{"kopje":"verootmoedigen","refs":["Num 29:7","Lev 16:29","Lev 23:27","Lev 23:32","Ezra 8:21","Ps 35:13","Jes 58:5","1 Kor 7:5"]}],"15":[{"kopje":"zal hij haar ongerechtigheid dragen","refs":["Num 30:5","Num 30:8","Num 30:12","Lev 5:1","Gal 3:28"]}]},"tsk_kjv":{"2":[{"kopje":"vow a vow","refs":[{"disp":"Num 21:2","ref":"Num 21:2"},{"disp":"Gen 28:20-22","ref":"Gen 28:20-22"},{"disp":"Lev 27:2-34","ref":"Lev 27:2-34"},{"disp":"Deu 23:21","ref":"Deut 23:21"},{"disp":"Deu 23:22","ref":"Deut 23:22"},{"disp":"Jdg 11:11","ref":"Richt 11:11"},{"disp":"Jdg 11:30","ref":"Richt 11:30"},{"disp":"Jdg 11:31","ref":"Richt 11:31"},{"disp":"Jdg 11:35","ref":"Richt 11:35"},{"d 32\">bonds</span> wherewith she hath <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> shall <span class=\"wl wl-kjv\" data-code=\"H6965\">stand:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5545\">forgive</span> her, because her <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> disallowed","6":"And if she had at all an <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> when she <span class=\"wl wl-kjv\" data-code=\"H5088\">vowed,</span> or <span class=\"wl wl-kjv\" data-code=\"H4008\">uttered</span> ought out of her <span class=\"wl wl-kjv\" data-code=\"H8193\">lips,</span> wherewith she <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> her soul;","7":"And her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, and held his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace</span> at her in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it: then her <span class=\"wl wl-kjv\" data-code=\"H5088\">vows</span> shall <span class=\"wl wl-kjv\" data-code=\"H6965\">stand,</span> and her <span class=\"wl wl-kjv\" data-code=\"H632\">bonds</span> wherewith she <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall stand.","8":"But if her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H5106\">disallowed</span> her on the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it; then he shall make her vow which she <span class=\"wl wl-kjv\" data-code=\"H5088\">vowed,</span> and that which she <span class=\"wl wl-kjv\" data-code=\"H4008\">uttered</span> with her <span class=\"wl wl-kjv\" data-code=\"H8193\">lips,</span> wherewith she <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> of none <span class=\"wl wl-kjv\" data-code=\"H6565\">effect:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall forgive","9":"But every <span class=\"wl wl-kjv\" data-code=\"H5088\">vow</span> of a <span class=\"wl wl-kjv\" data-code=\"H490\">widow,</span> and of her that is <span class=\"wl wl-kjv\" data-code=\"H1644\">divorced,</span> wherewith they have <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> their <span class=\"wl wl-kjv\" data-code=\"H5315\">souls,</span> shall stand","10":"And if she <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed</span> in her <span class=\"wl wl-kjv\" data-code=\"H376\">husband's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> or <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> by a <span class=\"wl wl-kjv\" data-code=\"H632\">bond</span> with an oath;","11":"And her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, and held his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace</span> at her, and <span class=\"wl wl-kjv\" data-code=\"H5106\">disallowed</span> her not: then all her <span class=\"wl wl-kjv\" data-code=\"H5088\">vows</span> shall <span class=\"wl wl-kjv\" data-code=\"H6965\">stand,</span> and every <span class=\"wl wl-kjv\" data-code=\"H632\">bond</span> wherewith she <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall stand.","12":"But if her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> hath <span class=\"wl wl-kjv\" data-code=\"H6565\">utterly</span> made them <span class=\"wl wl-kjv\" data-code=\"H6565\">void</span> on the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> them; then whatsoever <span class=\"wl wl-kjv\" data-code=\"H4161\">proceeded</span> out of her <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> concerning her <span class=\"wl wl-kjv\" data-code=\"H5088\">vows,</span> or concerning the <span class=\"wl wl-kjv\" data-code=\"H632\">bond</span> of her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> shall not <span class=\"wl wl-kjv\" data-code=\"H6965\">stand:</span> her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> hath made them <span class=\"wl wl-kjv\" data-code=\"H6565\">void;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall forgive","13":"Every <span class=\"wl wl-kjv\" data-code=\"H5088\">vow,</span> and every <span class=\"wl wl-kjv\" data-code=\"H632\">binding</span> <span class=\"wl wl-kjv\" data-code=\"H7621\">oath</span> to <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> may <span class=\"wl wl-kjv\" data-code=\"H6965\">establish</span> it, or her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> may make it void.","14":"But if her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H2790\">altogether</span> hold his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace</span> at her from <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> then he <span class=\"wl wl-kjv\" data-code=\"H6965\">establisheth</span> all her <span class=\"wl wl-kjv\" data-code=\"H5088\">vows,</span> or all her <span class=\"wl wl-kjv\" data-code=\"H632\">bonds,</span> which are upon her: he <span class=\"wl wl-kjv\" data-code=\"H6965\">confirmeth</span> them, because he held his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace</span> at her in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he heard","15":"But if he shall any <span class=\"wl wl-kjv\" data-code=\"H6565\">ways</span> make them <span class=\"wl wl-kjv\" data-code=\"H6565\">void</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> them; then he shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> her iniquity.","16":"These are the <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> between a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> between the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> being yet in her <span class=\"wl wl-kjv\" data-code=\"H5271\">youth</span> in her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> house."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"hoofden der stammen","tekst":"Welke waren een overste uit elken stam. Zie boven, Num 1:4, Num 1:16, en de aantekeningen er op."},{"catchword":"van de kinderen Israëls,","tekst":"Wien elk hoofd in zijn stam de volgende ordinantie moest aandienen."}],"2":[{"catchword":"zal beloofd,","tekst":"Te weten, simpelijk zonder eedzweren, van iets vrijwilliglijk te zullen geven, of te doen ter ere Gods. Wat ene gelofte is, zie Lev 7:16."},{"catchword":"een eed zal gezworen hebben,","tekst":"Te weten, zich door deze verplichtende en schuldig makende, van het te willen doen of laten."},{"catchword":"zijn ziel met een verbintenis","tekst":"Hebreeuws, een band op zijn ziel bindende; dat is, zichzelven of zijn persoon; alzo in het volgende. Gelijk de lichamen gebonden worden met touwen en zelen, om in een zekere plaats te blijven, alzo worden de zielen der mensen gebonden door belofte aan den HEERE gedaan, om aan hetgeen, wat zij beloofd hebben, zich vast te houden."},{"catchword":"ontheiligen;","tekst":"Dat is, tot schande en oorzaak van lastering maken, met zijn belofte te breken."},{"catchword":"naar alles, wat uit zijn mond gegaan is,","tekst":"Welverstaande, wat in zijn vermogen is en geoorloofd, niet strijdende tegen de wet des HEEREN; hoedanig de belofte was dergenen, die Paulus, voorgenomen hadden te vermoorden, Act 23:14."}],"3":[{"catchword":"vrouw den HEERE","tekst":"Versta hier, niet een getrouwde vrouw, gelijk onder, vs.6,7,8, maar een vrouwelijke persoon, gelijk een jonge dochter, die nog onder het gebied van haar vader is, gelijk uit vs.3 en vs.16 kan afgenomen worden; alzo wordt Maria, de moeder des HEEREN, onder de vrouwen en een vrouw genaamd; Luk 1:42; Gal 4:4."}],"4":[{"catchword":"zal horen,","tekst":"Dat is, of openlijk inwilligen, of door stilzwijgen toelaten, want [gelijk men zegt] wie zwijgt, schijnt te consenteren of toe te stemmen."},{"catchword":"al haar geloften bestaan,","tekst":"Dat is, zij zal moeten, al wat zij den HEERE beloofd heeft, zonder nalaten volbrengen."}],"5":[{"catchword":"den dage als hij het hoort,","tekst":"Versta hieruit twee dingen:&lt;i&gt;I.&lt;/i&gt; Dat de vader, vernomen hebbende de geloften zijner dochter, zich niet lang mocht bedenken van die in te willigen of af te zeggen;&lt;i&gt;II.&lt;/i&gt; Dat de dochter, zo haast haar vader haar geloften afgesproken had, noodzakelijk van dezelve moest afstand doen. Vergelijk onder, vs.7,8."},{"catchword":"zal het haar vergeven;","tekst":"Te weten:&lt;i&gt;I.&lt;/i&gt; Dat zij zo onvoorzichtiglijk een gelofte gedaan had, zonder haar vader te kennen;&lt;i&gt;II.&lt;/i&gt; Dat zij gedwongen was haar gelofte na te laten. Alzo onder, vs.8."}],"6":[{"catchword":"immers een man heeft,","tekst":"Hebreeuws, van een man zijnde zijn zal; dat is, met een man vastelijk beloofd of getrouwd, en dienvolgens onder zijn gebied staande. Zie deze manier van spreken ook onder, Num 36:3."},{"catchword":"haar geloften op haar zijn,","tekst":"Dat is, als zij enige geloften tot haar last zal hebben, die zij beloofd heeft te volbrengen, of simpelijk met solemnele woorden, of met bijvoeging van een eed; gelijk boven, vs.2, zo ook onder, vs.8, 10."}],"7":[{"catchword":"en ten dage als hij het hoort,","tekst":"Vergelijk boven, de aantekeningen op vs.5, en zie vs.8."}],"9":[{"catchword":"weduwe,","tekst":"Wier man, toen zij haar gelofte deed, overleden was, zodat zij, haarzelve geworden zijnde, de macht had gelofte te doen, zonder iemand er over te kennen."},{"catchword":"verstotene","tekst":"Versta, een vrouw, die, een scheidbrief ontvangen hebbende, van haar man verlaten is; alzo Lev 21:7. Deze was ook haarzelve, omdat de man haar van het recht en gebied, hetwelk hij over haar had gehad, door de scheiding ontslagen had. Hierom moesten zulke geloften standgrijpen."}],"12":[{"catchword":"ganselijk te niet maakt,","tekst":"Hebreeuws, teniet makende teniet maakt. Alzo onder, vs.5."}],"14":[{"catchword":"ganselijk stilzwijgt,","tekst":"Hebreeuws, stilzwijgende stilzwijgt."}],"15":[{"catchword":"ganselijk te niet maken zal,","tekst":"Hebreeuws, teniet makende zal teniet gemaakt hebben; te weten, niet op denzelfden dag, toen hij ze hoorde, maar een dag of meer daarna."},{"catchword":"zal hij haar ongerechtigheid dragen","tekst":"Dat is, zal hij schuldig zijn aan de straf, welke verdiend is door het verbreken der voorgemelde beloften. Zie van deze manier van spreken Lev 5:1. Anderen vertalen hier het Hebreeuwse woord wegnemen; te weten, de ongerechtigheid der vrouw, dat zij door het verbreken van haar gelofte geen schuld zal hebben, noch strafbaar zijn. Gelijk vs.5, 8, 12 vermeld wordt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Moseh spake unto the heads of the Tribes, [Which were out of each tribe one, the Ruler or Governor thereof; See above, ch.1.v.4. and 16. with their Annot.] of the children of Israel, [unto whom these Heads or Rulers were to impart the ensuing Ordinance, each one to his Tribe] saying: This is the thing which the LORD hath commanded."}],"2":[{"catchword":null,"tekst":"When a man shall have vowed a vow, [viz. barely, without an oath, either to give or do something freely for the honour of God. Of vows, what they be; see Rev. 7.on v.16.] or sworn an oath, [viz. thereby engaging and binding himself to do or leave such a thing] binding his soul with a bond, [Heb. binding a bond upon his soul, i.e. on himself, or his person; and so in the sequel, as bodies are tied with ropes and cords to abide in certain place, so the souls of men are tied by vows, made unto the LORD to keep firm and steadfast to what they vowed unto him] he shall not unhallow his word: [i.e. not cause the same to become a reproach, and matter of blasphemy, and reviling by breaking of his vow] he shall doe according to all that proceeded out of his mouth. [provided the same be in his power to perform, and lawful, not contrary to the Law of the LORD, such as was the vow of those that resolved to take away the life of Paul, Act 23:14.]"}],"3":[{"catchword":null,"tekst":"But when a woman shall have vowed a vow unto the LORD: [Understand here, not a married woman, as below, 6.7, 8. But a woman-like person, as a young daughter, being yet under the command of her father, as appeareth by this verse, and the last of this Chapter; Thus Mary the mother of the LORD, is called among women, and a woman, Luk 1:42. Gal 4:4.] and shall have bound her self with a bond, in her fathers house, in her youth."}],"4":[{"catchword":null,"tekst":"And her father shall hear her vow and her bond, wherewith she bound her soul, and her father shall hold his peace towards her; [viz. either openly approving of it, or silently giving way to it, for (as the saying goeth) He that holds his peace, seemeth to assent and approve of what he heareth] then all her vows shall stand, and every binding wherewith she shall have bound her soul, shall stand. [id est., she shall be bound to perform that which she vowed unto the LORD without intermission."}],"5":[{"catchword":null,"tekst":"But if her father shall break the same in the day when he heareth it, all her vows and her bonds, where with she bound her soul; shall not stand: [Understand hereby two things; first that the father having understood his daughters vows, he was not to take into any long deliberation, what he should approve, or disannul: secondly, that the daughter was to desist of her vows immediately upon the fathers disapproving of the same. Compare below, verse 7. And 8.] but the LORD shall forgive it her, [to wit, that she did vow so unadvisedly without her fathers knowledge. Secondly, that she was forced to abandon her vow. So below, v.8.] for her father made her to break it."}],"6":[{"catchword":null,"tekst":"But if indeed she have a husband, [Heb. being a husbands, shall be, i.e. being firmly betrothed, or married to a man, and consequently made subject to his Authority. See the like expressions likewise below, Chapter 36.3.] and her vows be upon her; [id est, when she stands engaged by any vow, which she promised to perform, either simply by solemn words, or, with the addition of an Oath: as above, verse 2. and below also, verse 8.10.] or the utterance of her lips, whereby she bound her soul:"}],"7":[{"catchword":null,"tekst":"And her husband shall hear the (same,) and in the day when he heareth it, shall hold his peace towards her; then her vows shall stand, and her bonds, wherewith she hath bound her soul, shall stand: [Compare above the note on verse 5. and see the verse following.]"}],"8":[{"catchword":null,"tekst":"But if her husband, on that day, when he heard it, shall break the same, and shall disannul her vow that was upon her, together with the utterance of her lips, wherewith she bound her soul; then the LORD shall forgive it her."}],"9":[{"catchword":null,"tekst":"As for the vow of a widow, [whose husband was dead, when she made her vow; so that being at her own disposing, she had power to make vows, without being, accountable thereof to others] or of a divorced (woman): [understand such a one, as having received a letter of divorce is abandoned by her husband. See Levit.21.7. Such a one was likewise at her own free disposing, because the husband resigned all the right and command he had over her, into her , into her own hands back again, by the Act of Divorce. And therefore their vows were to stand] all she bound her soul with, shall stand over her."}],"10":[{"catchword":null,"tekst":"But if in her husband house she made a vow; or bound her soul with an oath by a bond."}],"11":[{"catchword":null,"tekst":"And her husband shall have heard (the same,) and shall have held his peace towards her, not breaking the same; then all her vows shall stand, and all the binding wherewith she bound her soul, shall stand."}],"13":[{"catchword":null,"tekst":"Every vow, and every oath of obligation, for the humbling of the Soul; her husband shall establish the same, or the same her husband shall disannul."}],"14":[{"catchword":null,"tekst":"But if her husband altogether hold his peace towards her from day to day, [Hebr. holding his peace, hold his peace, etc.] Then he confirmeth all her vows, or all her bonds, which are upon her; he hath confirmed them, for having held his peace towards her, in that day he heard it."}],"15":[{"catchword":null,"tekst":"Yet, if he shall wholly disannul the same: [Heb. disannulling, shall have disannulled them, viz.not on the same day when he heard them, but one or more days after] then he shall bear her iniquity. [i.e. he shall be guilty of the punishment, deserved, by the breach of the foresaid vows. See of this kind of speaking, Lev.5. on v.1. others render the Hebrew Verb here, take away; viz. the iniquity of the woman, that by the breach of her vow, she shall not be held guilty, or punishable; as v.5, 8, and 12. is intimated.]"}],"16":[{"catchword":null,"tekst":"These are the institution which the LORD commanded Moseh betwixt a man and his wife; betwixt a father and his daughter, being in her youth, at the house of her father."}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const concordCache = {};

  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);

  } catch (e) { cache[code] = null; }

}

const popupCache = {};

  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

document.addEventListener('mouseover', e => {

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>

</html>
