l hun dieren,","4":"En de voorsteden van de steden, die u aan de Levieten zult geven, zullen van de stadsmuur af, naar buiten toe, duizend el zijn, rondom.","5":"En u zult meten van buiten de stad, aan de kant van het oosten, tweeduizend el, en aan de kant van het zuiden, tweeduizend el, en aan de kant van het westen, tweeduizend el, en aan de kant van het noorden, tweeduizend el; en de stad zal in het midden zijn. Dit zullen zij hebben tot voorsteden van de steden.","6":"De steden nu, die u aan de Levieten zult geven, zullen zes vrijsteden zijn, die u aanwijzen zult, opdat de doodslager daarheen vlucht; en daarboven zult u hun tweeënveertig steden geven.","7":"Al de steden die u aan de Levieten geven zult, zullen achtenveertig steden zijn, deze met hun voorsteden.","8":"De steden die u van de bezitting van de Israëlieten geven zult, zult u van hem die veel heeft, veel nemen, en van hem die weinig heeft, weinig nemen; ieder zal naar zijn erfenis, die zij zullen erven, van zijn steden aan de Levieten geven.","9":"Vervolgens sprak de HEERE tot Mozes:","10":"Spreek tot de Israëlieten, en zeg tegen hen: Wanneer u de Jordaan overgaat naar het land Kanaän,","11":"Dan zult u steden voor u aanwijzen, die u tot vrijsteden zullen zijn, opdat de doodslager daarheen vlucht, die iemand *bij ongeluk* doodgeslagen heeft.","12":"En deze steden zullen u tot een toevlucht zijn voor de bloedwreker; opdat de doodslager niet sterft, totdat hij voor de vergadering voor het gericht heeft gestaan.","13":"En van deze steden die u geven zult, zullen zes vrijsteden voor u zijn.","14":"Drie van deze vrijsteden zult u geven aan deze kant van de Jordaan, en drie van deze steden zult u geven in het land Kanaän; vrijsteden zullen het zijn.","15":"Deze zes steden zullen voor de Israëlieten, en voor de vreemdeling, en de bijwoner in hun midden, tot een toevlucht zijn; opdat daarheen vlucht wie iemand *bij ongeluk* doodslaat.","16":"Maar als hij hem met een ijzeren voorwerp geslagen heeft, zodat hij sterft, is hij een doodslager; deze doodslager zal zeker gedood worden.","17":"Of als hij hem met een handsteen, waardoor men zou kunnen sterven, geslagen heeft, zodat hij sterft, is hij een doodslager; deze doodslager zal zeker gedood worden.","18":"Of als hij hem met een houten handwapen, waardoor men zou kunnen sterven, geslagen heeft, zodat hij sterft, is hij een doodslager; deze doodslager zal zeker gedood worden.","19":"De bloedwreker zal de doodslager doden; wanneer hij hem ontmoet, zal hij hem doden.","20":"Als hij hem ook uit haat gestoten heeft, of met opzet iets naar hem gegooid heeft, zodat hij sterft;","21":"Of hem uit vijandschap met zijn hand geslagen heeft, zodat hij sterft; dan zal degene die sloeg zeker gedood worden, hij is een doodslager; de bloedwreker zal deze doodslager doden, wanneer hij hem ontmoet.","22":"Maar als hij hem onverwachts, zonder vijandschap, gestoten heeft, of zonder opzet enig voorwerp naar hem gegooid heeft;","23":"Of zonder hem te zien met enige steen, waardoor men zou kunnen sterven, en hij die op hem heeft laten vallen, zodat hij sterft, terwijl hij toch geen vijand van hem was, en ook geen kwaad zocht;","24":"Dan zal de vergadering rechtspreken tussen degene die sloeg en de bloedwreker, volgens deze regels.","25":"En de vergadering zal de doodslager redden uit de hand van de bloedwreker, en de vergadering zal hem laten terugkeren naar zijn vrijstad, waarheen hij gevlucht was; en hij zal daarin blijven tot de dood van de hogepriester, die met de heilige olie gezalfd is.","26":"Maar als de doodslager op enig moment gaat buiten de grens van zijn vrijstad, waarheen hij gevlucht was,","27":"En de bloedwreker hem vindt buiten de grens van zijn vrijstad; als de bloedwreker de doodslager dan doodt, zal het hem geen bloedschuld zijn.","28":"Want hij had in zijn vrijstad moeten blijven tot de dood van de hogepriester; maar na de dood van de hogepriester zal de doodslager terugkeren naar het land van zijn bezitting.","29":"En deze dingen zullen voor u zijn tot een inzetting van recht, voor uw geslachten, in al uw woonplaatsen.","30":"Ieder die iemand doodslaat, moet men op grond van de verklaring van getuigen doden; maar één enkele getuige mag niet tegen iemand getuigen, zodat hij sterft.","31":"En u zult geen losgeld nemen voor het leven van de doodslager, die schuldig is te sterven; want hij zal zeker gedood worden.","32":"Ook zult u geen losgeld nemen voor hem die naar zijn vrijstad gevlucht is, zodat hij zou terugkeren om te wonen in het land, voor de dood van de hogepriester.","33":"Zo zult u het land niet ontheiligen waarin u woont; want het bloed ontheiligt het land; en voor het land kan geen verzoening gedaan worden voor het bloed dat daarin vergoten is, dan door het bloed van hem die het vergoten heeft.","34":"Verontreinig dan het land niet, waarin u gaat wonen, in het midden waarvan Ik wonen zal; want Ik ben de HEERE, die woont in het midden van de Israëlieten."},"SV":{"1":"En de HEERE sprak tot Mozes, in de vlakke velden der Moabieten, aan de Jordaan van Jericho, zeggende:","2":"Gebied den kinderen Israëls, dat zij van de erfenis hunner bezitting aan de Levieten steden zullen geven om te bewonen; daartoe zult gijlieden aan de Levieten voorsteden geven, aan de steden rondom dezelve.","3":"En die steden zullen zij hebben om te bewonen; maar hun voorsteden zullen zijn voor hun beesten, en voor hun have, en voor al hun gedierte,","4":"En de voorsteden der steden, die gij aan de Levieten zult geven, zullen van den stadsmuur af, en naar buiten, van duizend ellen zijn rondom.","5":"En gij zult meten van buiten de stad, aan den hoek tegen het oosten, twee duizend ellen, en aan den hoek van het zuiden, twee duizend ellen, en aan den hoek van het westen, twee duizend ellen, en aan den hoek van het noorden, twee duizend ellen; dat de stad in het midden zij. Dit zullen zij hebben tot voorsteden van de steden.","6":"De steden nu, die gij aan de Levieten zult geven, zullen zijn zes vrijsteden, die gij geven zult, opdat de doodslager daarheen vliede; en boven dezelve zult gij *hun* twee en veertig steden geven.","7":"Al de steden, die gij aan de Levieten geven zult, zullen zijn acht en veertig steden, deze met haar voorsteden.","8":"De steden, die gij van de bezitting der kinderen Israëls geven zult, zult gij van dien, die vele heeft, vele nemen, en van dien, die weinig heeft, weinige nemen; een ieder zal naar zijn erfenis, die zij zullen erven, van zijn steden aan de Levieten geven.","9":"Voorts sprak de HEERE tot Mozes, zeggende:","10":"Spreek tot de kinderen Israëls, en zeg tot hen: Wanneer gij over de Jordaan gaat naar het land Kanaän.","11":"Zo zult gij maken, dat u steden tegemoet liggen, *die* u tot vrijsteden zullen zijn; opdat de doodslager daarheen vliede, die een ziel onwetend geslagen heeft.","12":"En deze steden zullen u tot een toevlucht zijn voor den *bloed* wreker; opdat de doodslager niet sterve, totdat hij voor de vergadering aan het gericht gestaan hebbe.","13":"En deze steden, die gij geven zult, zullen zes vrijsteden voor u zijn.","14":"Drie dezer vrijsteden zult gij geven op deze zijde van de Jordaan, en drie dezer steden zult gij geven in het land Kanaän; vrijsteden zullen het zijn.","15":"Die zes steden zullen voor de kinderen Israëls, en voor den vreemdeling, en den bijwoner in het midden van hen, tot een toevlucht zijn; opdat daarheen vliede, wie een ziel onvoorziens slaat.","16":"Maar indien hij hem met een ijzeren instrument geslagen heeft, dat hij gestorven zij, een doodslager is hij; deze doodslager zal zekerlijk gedood worden.","17":"Of indien hij hem met een handsteen, waarvan met zoude kunnen sterven, geslagen heeft, dat hij gestorven zij, een doodslager is hij; deze doodslager zal zekerlijk gedood worden.","18":"Of indien hij hem met een houten handinstrument, waarvan men zoude kunnen sterven, geslagen heeft, dat hij gestorven zij, een doodslager is hij; deze doodslager zal zekerlijk gedood worden.","19":"De wreker des bloeds, die zal den doodslager doden; als hij hem ontmoet, zal hij hem doden.","20":"Indien hij hem ook door haat zal gestoten hebben, of met opzet op hem geworpen heeft, dat hij gestorven zij;","21":"Of hem door vijandschap met zijn hand geslagen heeft, dat hij gestorven zij; de slager zal zekerlijk gedood worden, een doodslager is hij; de bloedwreker zal dezen doodslager doden, als hij hem ontmoet.","22":"Maar indien hij hem met der haast zonder vijandschap gestoten heeft, of enig instrument zonder opzet op hem geworpen heeft;","23":"Of onvoorziens met enigen steen, waarvan men zoude kunnen sterven, en hij dien op hem heeft doen vallen, dat hij gestorven zij, zo hij hem toch geen vijand was, noch zijn kwaad zoekende;","24":"Zo zal de vergadering richten tussen den slager, en tussen den bloedwreker, naar deze zelve rechten.","25":"En de vergadering zal den doodslager redden uit den hand des bloedwrekers, en de vergadering zal hem doen wederkeren tot zijn vrijstad, waarheen hij gevloden was; en hij zal daarin blijven tot den dood des hogepriesters, dien men met de heilige olie gezalfd heeft.","26":"Doch indien de doodslager enigszins zal gaan uit de palen zijner vrijstad, waarheen hij gevloden was,","27":"En de bloedwreker hem zal vinden buiten de palen zijner vrijstad; zo de bloedwreker den doodslager zal doden, het zal hem geen bloedschuld zijn.","28":"Want hij zou in zijn vrijstad gebleven zijn tot den dood des hogepriesters; maar na de dood des hogepriesters zal de doodslager wederkeren tot het land zijner bezitting.","29":"En deze dingen zullen ulieden zijn tot een inzetting van recht, bij uw geslachten, in al uw woningen.","30":"Al wie de ziel slaat, naar den mond der getuigen zal men den doodslager doden, maar een enig getuige zal niet getuigen tegen een ziel, dat zij sterve.","31":"En gij zult geen verzoening nemen voor de ziel des doodslagers, die schuldig is te sterven; want hij zal zekerlijk gedood worden.","32":"Ook zult gij geen verzoening nemen voor dien, die gevlucht is naar zijn vrijstad, dat hij zou wederkeren, om te wonen in het land, tot den dood des *hoge* priesters.","33":"Zo zult gij niet ontheiligen het land, waarin gij zijt; want het bloed ontheiligt het land; en voor het land zal geen verzoening gedaan worden over het bloed, dat daarin vergoten is, dan door het bloed desgenen, die dat vergoten heeft.","34":"Verontreinigt dan het land niet, waarin gij gaat wonen, in welks midden Ik wonen zal; want Ik ben de HEERE, wonende in het midden der kinderen Israëls."},"KJV":{"1":"And the LORD spake unto Moses in the plains of Moab by Jordan *near* Jericho, saying,","2":"Command the children of Israel, that they give unto the Levites of the inheritance of their possession cities to dwell in; and ye shall give *also* unto the Levites suburbs for the cities round about","3":"And the cities shall they have to dwell in; and the suburbs of them shall be for their cattle, and for their goods, and for all their beasts.","4":"And the suburbs of the cities, which ye shall give unto the Levites, *shall reach* from the wall of the city and outward a thousand cubits round about.","5":"And ye shall measure from without the city on the east side two thousand cubits, and on the south side two thousand cubits, and on the west side two thousand cubits, and on the north side two thousand cubits; and the city *shall be* in the midst: this shall be to them the suburbs of the cities.","6":"And among the cities which ye shall give unto the Levites *there shall be* six cities for refuge, which ye shall appoint for the manslayer, that he may flee thither: and to them ye shall add forty and two cities.","7":"*So* all the cities which ye shall give to the Levites *shall be* forty and eight cities: them *shall ye give* with their suburbs.","8":"And the cities which ye shall give *shall be* of the possession of the children of Israel: from *them that have* many ye shall give many; but from *them that have* few ye shall give few: every one shall give of his cities unto the Levites according to his inheritance which he inheriteth.","9":"And the LORD spake unto Moses, saying,","10":"Speak unto the children of Israel, and say unto them, When ye be come over Jordan into the land of Canaan;","11":"Then ye shall appoint you cities to be cities of refuge for you; that the slayer may flee thither, which killeth any person at unawares.","12":"And they shall be unto you cities for refuge from the avenger; that the manslayer die not, until he stand before the congregation in judgment.","13":"And of these cities which ye shall give six cities shall ye have for refuge.","14":"Ye shall give three cities on this side Jordan, and three cities shall ye give in the land of Canaan, *which* shall be cities of refuge.","15":"These six cities shall be a refuge, *both* for the children of Israel, and for the stranger, and for the sojourner among them: that every one that killeth any person unawares may flee","16":"And if he smite him with an instrument of iron, so that he die, he *is* a murderer: the murderer shall surely be put to death.","17":"And if he smite him with throwing a stone, wherewith he may die, and he die, he *is* a murderer: the murderer shall surely be put to death.","18":"Or *if* he smite him with an hand weapon of wood, wherewith he may die, and he die, he *is* a murderer: the murderer shall surely be put to death.","19":"The revenger of blood himself shall slay the murderer: when he meeteth him, he shall slay","20":"But if he thrust him of hatred, or hurl at him by laying of wait, that he die;","21":"Or in enmity smite him with his hand, that he die: he that smote *him* shall surely be put to death; *for* he *is* a murderer: the revenger of blood shall slay the murderer, when he meeteth","22":"But if he thrust him suddenly without enmity, or have cast upon him any thing without laying of wait,","23":"Or with any stone, wherewith a man may die, seeing *him* not, and cast *it* upon him, that he die, and *was* not his enemy, neither sought his harm:","24":"Then the congregation shall judge between the slayer and the revenger of blood according to these judgments:","25":"And the congregation shall deliver the slayer out of the hand of the revenger of blood, and the congregation shall restore him to the city of his refuge, whither he was fled: and he shall abide in it unto the death of the high priest, which was anointed with the holy oil.","26":"But if the slayer shall at any time come without the border of the city of his refuge, whither he was fled;","27":"And the revenger of blood find him without the borders of the city of his refuge, and the revenger of blood kill the slayer; he shall not be guilty of blood:","28":"Because he should have remained in the city of his refuge until the death of the high priest: but after the death of the high priest the slayer shall return into the land of his possession.","29":"So these *things* shall be for a statute of judgment unto you throughout your generations in all your dwellings.","30":"Whoso killeth any person, the murderer shall be put to death by the mouth of witnesses: but one witness shall not testify against any person *to cause him* to die.","31":"Moreover ye shall take no satisfaction for the life of a murderer, which *is* guilty of death: but he shall be surely put to death.","32":"And ye shall take no satisfaction for him that is fled to the city of his refuge, that he should come again to dwell in the land, until the death of the priest.","33":"So ye shall not pollute the land wherein ye *are*: for blood it defileth the land: and the land cannot be cleansed of the blood that is shed therein, but by the blood of him that shed","34":"Defile not therefore the land which ye shall inhabit, wherein I dwell: for I the LORD dwell among the children of Israel."}},"tsk":{"6":[{"kopje":"zes vrijsteden","refs":["Num 35:13","Num 35:14","Deut 4:41-43","Joz 20:2-9","Joz 21:3","Joz 21:13","Joz 21:21","Joz 21:27","Joz 21:32","Joz 21:36" // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
