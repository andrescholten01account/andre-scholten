 de gloed van de toorn van de HEERE gekeerd worden van Israël.","5":"Toen zei Mozes tot de rechters van Israël: Elk van u dode zijn mannen, die zich aan Baäl-peor gekoppeld hebben!","6":"En zie, een man uit de kinderen van Israël kwam, en bracht een Midianietische vrouw naar zijn broeders, voor de ogen van Mozes en voor de ogen van de hele vergadering van de kinderen van Israël, terwijl zij weenden voor de deur van de tent van de samenkomst.","7":"Toen Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, dat zag, stond hij op uit het midden van de vergadering, en nam een spies in zijn hand;","8":"en hij ging de Israëlitische man achterna, de tent in, en doorstak hen beiden, de Israëlitische man en de vrouw, door hun buik. Toen hield de plaag over de kinderen van Israël op.","9":"Degenen nu die aan de plaag stierven, waren vierentwintigduizend.","10":"Toen sprak de HEERE tot Mozes en zei:","11":"Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, heeft Mijn grimmigheid van over de kinderen van Israël afgewend, omdat hij Mijn ijver geijverd heeft in hun midden, zodat Ik de kinderen van Israël in Mijn ijver niet vernietigd heb.","12":"Zeg daarom: Zie, Ik geef hem Mijn verbond van vrede.","13":"En hij zal hebben, en zijn nageslacht na hem, het verbond van het eeuwige priesterschap, omdat hij voor zijn God geijverd heeft, en verzoening gedaan heeft voor de kinderen van Israël.","14":"De naam nu van de gedode Israëlitische man, die gedood werd met de Midianietische vrouw, was Zimri, de zoon van Salu, een leider van een vaderlijk huis van de Simeonieten.","15":"En de naam van de gedode Midianietische vrouw was Kozbi, een dochter van Zur, die een hoofd was van de volken van een vaderlijk huis onder de Midianieten.","16":"Verder sprak de HEERE tot Mozes en zei:","17":"Handel vijandig met de Midianieten, en versla hen;","18":"want zij hebben vijandig tegen u gehandeld door hun listen, waarmee zij u listig bedrogen hebben in de zaak van Peor, en in de zaak van Kozbi, de dochter van de leider van de Midianieten, hun zuster, die gedood is ten dage van de plaag, om de zaak van Peor."},"SV":{"1":"En Israël verbleef te Sittim, en het volk begon te hoereren met de dochteren der Moabieten.","2":"En zij nodigden het volk tot de slachtofferen harer goden; en het volk at, en boog zich voor haar goden.","3":"Als nu Israël zich koppelde aan Baäl-peor, ontstak de toorn des HEEREN tegen Israël.","4":"En de HEERE zeide tot Mozes: Neem al de hoofden des volks, en hang ze den HEERE tegen de zon, zo zal de hittigheid van des HEEREN toorn gekeerd worden van Israël.","5":"Toen zeide Mozes tot de rechters van Israël: Een iedere dode zijn mannen, die zich aan Baäl-peor gekoppeld hebben!","6":"En ziet, een man uit de kinderen Israëls kwam, en bracht een Midianietin tot zijn broederen voor de ogen van Mozes, en voor de ogen van de ganse vergadering der kinderen Israëls, toen zij weenden voor de deur van de tent der samenkomst.","7":"Toen Pinehas, de zoon van Eleazar, den zoon van Aäron, den priester, *dat* zag, zo stond hij op uit het midden der vergadering, en nam een spies in zijn hand;","8":"En hij ging den Israëlietischen man na in de hoerenwinkel, en doorstak hen beiden, den Israëlietischen man en de vrouw, door hun buik. Toen werd de plaag van over de kinderen Israëls opgehouden.","9":"Degenen nu, die aan de plaag stierven, waren vier en twintig duizend.","10":"Toen sprak de HEERE tot Mozes, zeggende:","11":"Pinehas, de zoon van Eleazar, den zoon van Aäron, den priester, heeft Mijn grimmigheid van over de kinderen Israëls afgewend, dewijl hij Mijn ijver geijverd heeft in het midden derzelve, zodat Ik de kinderen Israëls in Mijn ijver niet vernield heb.","12":"Daarom spreek: Zie, Ik geef hem Mijn verbond des vredes.","13":"En hij zal hebben, en zijn zaad na hem, het verbond des eeuwigen priesterdoms, daarom dat hij voor zijn God geijverd, en verzoening gedaan heeft voor de kinderen Israëls.","14":"De naam nu des verslagenen Israëlietischen mans, die verslagen was met de Midianietin, was Zimri, de zoon van Salu, een overste van een vaderlijk huis der Simeonieten.","15":"En de naam der verslagene Midianietische vrouw was Kozbi, een dochter van Zur, die een hoofd was der volken van een vaderlijk huis onder de Midianieten.","16":"Verder sprak de HEERE tot Mozes, zeggende:","17":"Handel vijandelijk met de Midianieten, en versla hen;","18":"Want zij hebben vijandelijk tegen ulieden gehandeld door hun listen, die zij listig tegen u bedacht hebben in de zaak van Peor, en in de zaak van Kozbi, de dochter van den overste der Midianieten, hun zuster, die verslagen is, ten dage der plaag, om de zaak van Peor."},"KJV":{"1":"And Israel abode in Shittim, and the people began to commit whoredom with the daughters of Moab.","2":"And they called the people unto the sacrifices of their gods: and the people did eat, and bowed down to their gods.","3":"And Israel joined himself unto Baalpeor: and the anger of the LORD was kindled against Israel.","4":"And the LORD said unto Moses, Take all the heads of the people, and hang them up before the LORD against the sun, that the fierce anger of the LORD may be turned away from Israel.","5":"And Moses said unto the judges of Israel, Slay ye every one his men that were joined unto Baalpeor.","6":"And, behold, one of the children of Israel came and brought unto his brethren a Midianitish woman in the sight of Moses, and in the sight of all the congregation of the children of Israel, who *were* weeping *before* the door of the tabernacle of the congregation.","7":"And when Phinehas, the son of Eleazar, the son of Aaron the priest, saw *it*, he rose up from among the congregation, and took a javelin in his hand;","8":"And he went after the man of Israel into the tent, and thrust both of them through, the man of Israel, and the woman through her belly. So the plague was stayed from the children of Israel.","9":"And those that died in the plague were twenty and four thousand.","10":"And the LORD spake unto Moses, saying,","11":"Phinehas, the son of Eleazar, the son of Aaron the priest, hath turned my wrath away from the children of Israel, while he was zealous for my sake among them, that I consumed not the children of Israel in my jealousy.","12":"Wherefore say, Behold, I give unto him my covenant of peace:","13":"And he shall have it, and his seed after him, *even* the covenant of an everlasting priesthood; because he was zealous for his God, and made an atonement for the children of Israel.","14":"Now the name of the Israelite that was slain, *even* that was slain with the Midianitish woman, *was* Zimri, the son of Salu, a prince of a chief house among the Simeonites.","15":"And the name of the Midianitish woman that was slain *was* Cozbi, the daughter of Zur; he *was* head over a people, *and* of a chief house in Midian.","16":"And the LORD spake unto Moses, saying,","17":"Vex the Midianites, and smite","18":"For they vex you with their wiles, wherewith they have beguiled you in the matter of Peor, and in the matter of Cozbi, the daughter of a prince of Midian, their sister, which was slain in the day of the plague for Peor's sake."}},"tsk":{"1":[{"kopje":"Sittim","refs":["Num 33:49","Joz 2:1","Joz 3:1","Micha 6:5"]},{"kopje":"het volk","refs":["Num 31:15","Num 31:16","Pred 7:26","1 Kor 10:8"]}],"2":[{"kopje":"nodigden","refs":["Ex 34:15","Ex 34:16","Joz 22:17","1 Kon 11:1-8","Ps 106:28","Hos 9:10","1 Kor 10:20","1 Kor 10:27","1 Kor 10:28","2 Kor 6:16","2 Kor 6:17","Openb 2:14"]},{"kopje":"boog zich neer","refs":["Ex 20:5","Ex 23:24","Joz 23:7","Joz 23:16","1 Kon 19:18"]}],"3":[{"kopje":"koppelde","refs":["Num 25:5","Deut 4:3","Deut 4:4","Joz 22:17","Ps 106:28","Ps 106:29","Hos 9:10"]},{"kopje":"de toorn","refs":["Joz 22:17","Richt 2:14","Richt 2:20","Ps 90:11","Jer 17:4"]}],"4":[{"kopje":"alle hoofden","refs":["Num 25:14","Num 25:15","Num 25:18","Ex 18:25","Deut 4:3","Joz 22:17","Joz 23:2"]},{"kopje":"hang","refs":["Deut 13:6-9","Deut 13: span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> did <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and bowed <span class=\"wl wl-kjv\" data-code=\"H7812\">down</span> to their gods.","3":"And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6775\">joined</span> himself unto <span class=\"wl wl-kjv\" data-code=\"H1187\">Baalpeor:</span> and the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against Israel.","4":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> all the <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and hang them <span class=\"wl wl-kjv\" data-code=\"H3363\">up</span> <span class=\"wl wl-kjv\" data-code=\"H5048\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> against the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun,</span> that the <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> may be turned <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> from Israel.","5":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">Slay</span> ye <span class=\"wl wl-kjv\" data-code=\"H376\">every</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> his <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that were <span class=\"wl wl-kjv\" data-code=\"H6775\">joined</span> unto Baalpeor.","6":"And, behold, <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> unto his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> a Midianitish <span class=\"wl wl-kjv\" data-code=\"H4084\">woman</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> who were <span class=\"wl wl-kjv\" data-code=\"H1058\">weeping</span> before the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.","7":"And when <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> it, he rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H7420\">jav span> <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> from the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> while he was <span class=\"wl wl-kjv\" data-code=\"H7065\">zealous</span> for my <span class=\"wl wl-kjv\" data-code=\"H7068\">sake</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> them, that I <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> not the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in my jealousy.","12":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Behold, I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto him my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of peace:","13":"And he shall have it, and his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, even the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H3550\">priesthood;</span> <span class=\"wl wl-kjv\" data-code=\"H834\">because</span> he was <span class=\"wl wl-kjv\" data-code=\"H7065\">zealous</span> for his <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and made an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","14":"Now the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">Israelite</span> that was <span class=\"wl wl-kjv\" data-code=\"H5221\">slain,</span> even that was <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> with the Midianitish <span class=\"wl wl-kjv\" data-code=\"H4084\">woman,</span> was <span class=\"wl wl-kjv\" data-code=\"H2174\">Zimri,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5543\">Salu,</span> a <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> of a <span class=\"wl wl-kjv\" data-code=\"H1\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> among the Simeonites.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H4084\">Midianitish</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that was <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> was <span class=\"wl wl-kjv\" data-code=\"H3579\">Cozbi,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6698\">Zur;</span> he was <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> over a <span class=\"wl wl-kjv\" data-code=\"H523\">people,</span> and of a <span class=\"wl wl-kjv\" data-code=\"H1\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in Midian.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","17":"<span class=\"wl wl-kjv\" data-code=\"H6887\">Vex</span> the <span class=\"wl wl-kjv\" data-code=\"H4084\">Midianites,</span> and smite","18":"For they <span class=\"wl wl-kjv\" data-code=\"H6887\">vex</span> you with their <span class=\"wl wl-kjv\" data-code=\"H5231\">wiles,</span> wherewith they have <span class=\"wl wl-kjv\" data-code=\"H5230\">beguiled</span> you in the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> of <span class=\"wl wl-kjv\" data-code=\"H6465\">Peor,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> of <span class=\"wl wl-kjv\" data-code=\"H3579\">Cozbi,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of a <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> their <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> which was <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H4046\">plague</span> for <span class=\"wl wl-kjv\" data-code=\"H6465\">Peor's</span> sake."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Sittim,","tekst":"Een plaats in de woestijn, in de lage landen der Moabieten, bij de Jordaan. Num 33:48-49 wordt deze genoemd Abel Sittim; hier bleef Israël tot na den dood van Mozes; toen heeft Jozua het vandaar gebracht tot aan de Jordaan, waar zij te Gilgal over passeerden; Jos 2:1, en Jos 3:1."},{"catchword":"het volk begon te hoereren","tekst":"Te weten, velen onder de Israëlieten 1Co 10:8, want al wie deze zonde begingen, zijn omgekomen, maar wie den HEERE aanhingen, bleven in het leven; Deu 4:3,4."},{"catchword":"Moabieten","tekst":"Versta hierbij, ook der Midianieten, gelijk blijkt uit vs.6, 17,18."}],"2":[{"catchword":"zij nodigden het volk","tekst":"Te weten, de dochters der Moabieten."},{"catchword":"harer goden;","tekst":"Anders, van haren God; te weten, Baäl-Peor."},{"catchword":"het volk","tekst":"Te weten, een deel des Israëlietischen volks."},{"catchword":"at,","tekst":"Alzo gemeenschap hebbende met hare afgoderij, 1Co 10:18, hiervoor had God de HEERE hen gewaarschuwd; Exo 34:14."}],"4":[{"catchword":"alle hoofden des volks,","tekst":"Te weten, wie aan deze zonde schuld hebben. Zie een exempel vs.14. Sommigen verstaan dat deze hoofden des volks genomen zijn geweest als rechters, om de schuldigen op te hangen."},{"catchword":"den HEERE","tekst":"Anders, voor den HEERE. [Den HEERE]; dat is, ter ere Gods, den rechtvaardige, die de zonden haat en straft."},{"catchword":"zon,","tekst":"Dat is, in het openbaar, voor allemans ogen, zolang de zon deze dag schijnen zal."}],"5":[{"catchword":"zijn mannen,","tekst":"Die onder hem behoren, naar de order daarvan gegeven Exo 18:25."}],"6":[{"catchword":"zijn broederen","tekst":"Te weten, tot de Israëlieten, die in het leger waren."}],"9":[{"catchword":"vier en twintig duizend","tekst":"De apostel, 1Co 10:8, zegt drie en twintig duizend. Het is te vermoeden dat de rechters er een duizend gestraft hebben, 1Co 10:5, en dat God er drie en twintig duizend geslagen heeft, of, een duizend is er gehangen, de rest is door Gods hand geslagen."}],"12":[{"catchword":"Ik geef hem","tekst":"Dat is, Ik geef hem het priesterdom, dat hij dat vrediglijk en voorspoediglijk erve en bezitte, hij en zijn nakomelingen, omdat hij Mij door zijn ijver heeft tevreden gesteld."},{"catchword":"des vredes","tekst":"Of, [te weten] den vrede."}],"13":[{"catchword":"verbond des eeuwigen priesterdoms,","tekst":"Dat is, een eeuwig priesterdom, met een eeuwig verbond bevestigd. Doch versta door eeuwig, totdat de Messias komt. Zie Heb 7:11."}],"15":[{"catchword":"hoofd was der volken","tekst":"Ja, hij wordt onder de koningen der Midianieten gesteld, Num 31:8."}],"18":[{"catchword":"zuster,","tekst":"Dat is, die van hun natie was."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Israel abode at Sittim, [A place in the wilderness, in the lower country of the Moabites, by Jordan, Num 33:48, 49. It is called Abel Sittim here Israel made their abode till after the death of Moseh, when Joshua brought them thence to Jordan, which they passed at Gilgal, Josua.2.1. and 3 1.] and the people began to whore [viz. many of the people of Israel; (1 Cor.10.8.) for all these that committed this sin, were destroyed; but those that cleaved to the LORD were kept alive, Deut.4.3.4.] with the Daughter of the Moabites. [understand likewise, and of the Midianites; as appears by v.6 and 17,18.]"}],"2":[{"catchword":null,"tekst":"And they [viz. the daughters of the Moabites] invited the people to the slaying-offerings of their Gods; [others, of their God, viz. Baal-Peor] and the people [i.e. some, or a part of the people of Israel] did eat, and bowed themselves before their Gods. [participating thus with their idolatry, 1 Cor.10.18. notwithstanding, that God had warned them of the like, Exo 34:14.]"}],"3":[{"catchword":null,"tekst":"Now when Israel coupled themselves to Baal-Peor, the anger of the LORD kindled against Israel."}],"4":[{"catchword":null,"tekst":"And the LORD said unto Moseh; Take all the heads of the people; [viz. those which are guilty of this sin; see an example verse 14. Some understand, as if these heads of the people were taken, or appointed to be Judges, and to see the execution done upon the guilty] and hang them to the LORD, [others, before the LORD, to the LORD; i.e. to the honour of the righteous God, that hates and punisheth sin] against the Sun, [i.e. publicly, openly, before all the world, as long as the Sun shall be above the Horizon that day] thus shall the fervency of the LORDS wrath be turned away from Israel."}],"5":[{"catchword":null,"tekst":"Then said Moseh to the judges of Israel; every one put his men to death, those that coupled themselves to Baal-Peor. [His men, i.e. such as belonged to, or were under his government, according to the orders given, Exo 18:25.]"}],"6":[{"catchword":null,"tekst":"And behold, a man came out of the children of Israel, and bought a Midianitish (woman) to his brethren, [viz. to the Israelites that were in the Camp] before the eyes of Moseh, and before the eyes of all the Congregation of the children of Israel, as they wept, before the door of the Tent of the Congregation."}],"7":[{"catchword":null,"tekst":"When Phineas, the son of Eleazar, the son of Aaron the Priest saw (that:) he arose out of the midst of the Congregation, and took a spear in his hand:"}],"9":[{"catchword":null,"tekst":"Those now that died of the plague, were twenty and four thousand. [The Apostle, 1 Cor.10.8. sets but twenty three thousand. It is to be supposed that the Judges executed one thousand, according to v.5. and that God smote twenty three thousand with the plague; or one thousand were hang&acirc;&euro;&trade;d up, the rest were smitten by Gods own hand.]"}],"10":[{"catchword":null,"tekst":"Then the LORD spake unto Moseh, saying;"}],"11":[{"catchword":null,"tekst":"Phineas the son of Eleazar, the son of Aaron the Priest, hath turned away my fierce anger from over the children of Israel, having been jealous (with) my jealousie, in the midst of them, so that I have not destroyed the children of Israel in my jealousy."}],"12":[{"catchword":null,"tekst":"Therefore speak; Behold, I give him my covenant of peace, [Or, (to wit) peace: the sense is, I give him the Priest-hood to posses it peaceably and prosperously he and his posterity, he having pacified my wrath by his zeal.]"}],"13":[{"catchword":null,"tekst":"and he shall have, and his seed after him, the Covenant of the everlasting Priest-hood: [i.e. an everlasting Priest-hood established by an everlasting Covenant; but understand by everlasting, to the coming of the Messiah; see Heb 7:11.] therefore because he hath been jealous for his God, and made expiation for the children of Israel."}],"14":[{"catchword":null,"tekst":"Now the name of the slain Israelitish man, that was slain with the Midianitish (woman,) was Zimri, the son of Salu, a chief of a fatherly house of the Simeonites."}],"15":[{"catchword":null,"tekst":"And the name of the slain Midianitish woman, was Cozbi, a daughter of Zur, who was a head of the people of a fatherly house among the Midianites; [This Zur is reckoned among the kings of the Midianites, bel.c.31.8.]"}],"16":[{"catchword":null,"tekst":"Moreover, the LORD spake to Moseh saying:"}],"17":[{"catchword":null,"tekst":"Deal hostile-like with the Midianites, etc smite them."}],"18":[{"catchword":null,"tekst":"For they have dealt hostile-like with you, by their wiles, which they devised guilefully against you in the matter of Peor, and in the matter of Cozbi, the daughter of the chiefly of the Midianites, their sister, [Being of their own Nation and Parentage] which was slain in the day of the plague, for the matter of Peor; [or Peors sake.]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {

  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {

}

// popup positioneren bij een element
function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {

        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }

}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

        if (kortCw) {

function paneelInhoud(n, tab) {

      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +

    return label + refChips(nd.refs) + kids;

      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

function toggle(n) {
  const paneel = document.getElementById('p' + n);

    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');

  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */

// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
