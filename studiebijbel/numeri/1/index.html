"1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "2": "Neem het aantal op van de gehele vergadering van de kinderen van Israël, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van al wat mannelijk is, hoofd voor hoofd.", "3": "Van twintig jaar oud en daarboven, allen die in Israël uittrekken ten leger; die zult u tellen naar hun legers, u en Aäron.", "4": "En met u zullen er zijn van elke stam een man, die hoofd is over het huis van zijn vaderen.", "5": "Dit zijn nu de namen van de mannen die bij u zullen staan: van Ruben, Elizur, de zoon van Sedeur.", "6": "Van Simeon, Selumiël, de zoon van Zurisaddai.", "7": "Van Juda, Nahesson, de zoon van Amminadab.", "8": "Van Issaschar, Nethaneel, de zoon van Zuar.", "9": "Van Zebulon, Eliab, de zoon van Helon.", "10": "Van de kinderen van Jozef: van Efraïm, Elisama, de zoon van Ammihud; van Manasse, Gamaliël, de zoon van Pedazur.", "11": "Van Benjamin, Abidan, de zoon van Gideoni.", "12": "Van Dan, Ahiëzer, de zoon van Ammisaddai.", "13": "Van Aser, Pagiel, de zoon van Ochran.", "14": "Van Gad, Eljasaf, de zoon van Dehuël.", "15": "Van Nafthali, Ahira, de zoon van Enan.", "16": "Dezen waren de geroepenen van de vergadering, de leiders van de stammen van hun vaderen; zij waren de hoofden van de duizenden van Israël.", "17": "Toen namen Mozes en Aäron deze mannen, die met namen zijn aangeduid.", "18": "En zij verzamelden de gehele vergadering, op de eerste dag van de tweede maand; en die verklaarden hun afkomst, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van wie twintig jaar oud was en daarboven, hoofd voor hoofd.", "19": "Zoals de HEERE Mozes geboden had, zo heeft hij hen geteld in de woestijn van Sinaï.", "20": "Zo waren de zonen van Ruben, de eerstgeborene van Israël, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaar oud en daarboven, allen die ten leger uittrokken;", "21": "Hun getelden van de stam van Ruben waren zesenveertigduizend vijfhonderd.", "22": "Van de zonen van Simeon, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, hun getelden, in het getal van de namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaar oud en daarboven, allen die ten leger uittrokken;", "23": "Hun getelden van de stam van Simeon waren negenenvijftigduizend driehonderd.", "24": "Van de zonen van Gad, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken.", "25": "Waren hun getelden van de stam van Gad vijfenveertigduizend zeshonderdvijftig.", "26": "Van de zonen van Juda, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,", "27": "Waren hun getelden van de stam van Juda vierenzeventigduizend zeshonderd.", "28": "Van de zonen van Issaschar, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen van twintig jaar oud en daarboven, allen die ten leger uittrokken,", "29": "Waren hun getelden van de stam van Issaschar vierenvijftigduizend vierhonderd.", "30": "Van de zonen van Zebulon, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,", "31": "Waren hun getelden van de stam van Zebulon zevenenvijftigduizend vierhonderd.", "32": "Van de zonen van Jozef: van de zonen van Efraïm, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,", "33": "Waren hun getelden van de stam van Efraïm veertigduizend vijfhonderd;", "34": "Van de zonen van Manasse, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,", "35": "Waren hun getelden van de stam van Manasse tweeëndertigduizend tweehonderd.", "36": "Van de zonen van Benjamin, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,", "37": "Waren hun getelden van de stam van Benjamin vijfendertigduizend vierhonderd.", "38": "Van de zonen van Dan, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,", "39": "Waren hun getelden van de stam van Dan tweeënzestigduizend zevenhonderd.", "40": "Van de zonen van Aser, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,", "41": "Waren hun getelden van de stam van Aser eenenveertigduizend vijfhonderd.", "42": "*Van* de zonen van Nafthali, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,", "43": "Waren hun getelden van de stam van Nafthali drieënvijftigduizend vierhonderd.", "44": "Dezen zijn de getelden, die Mozes geteld heeft, en Aäron, en de leiders van Israël; twaalf mannen waren het, elk over het huis van zijn vaderen.", "45": "Zo waren alle getelden van de zonen van Israël, naar het huis van hun vaderen, van twintig jaar oud en daarboven, allen die in Israël ten leger uittrokken,", "46": "Al de getelden dan waren zeshonderddrieduizend vijfhonderdvijftig.", "47": "Maar de Levieten werden naar de stam van hun vaderen niet onder hen geteld.", "48": "Want de HEERE had tot Mozes gesproken en gezegd:", "49": "Alleen de stam van Levi zult u niet tellen, en hun aantal niet opnemen onder de zonen van Israël.", "50": "Maar u, stel de Levieten aan over de tabernakel van de getuigenis, en over al zijn gereedschap, en over alles wat daarbij hoort; zij zullen de tabernakel dragen, en al zijn gereedschap; en zij zullen die verzorgen, en zij zullen zich rondom de tabernakel legeren.", "51": "En als de tabernakel zal optrekken, zullen de Levieten hem afbreken; en wanneer de tabernakel neergezet moet worden, zullen de Levieten hem oprichten; en de vreemde die daarbij komt, zal gedood worden.", "52": "En de kinderen van Israël zullen zich legeren, ieder bij zijn eigen leger, en ieder bij zijn eigen banier, naar hun legers.", "53": "Maar de Levieten zullen zich legeren rondom de tabernakel van de getuigenis, opdat er geen verbolgenheid over de vergadering van de kinderen van Israël komt; daarom zullen de Levieten de wacht van de tabernakel van de getuigenis waarnemen.", "54": "Zo deden de kinderen van Israël; naar alles wat de HEERE Mozes geboden had, zo deden zij."}, "SV": {"1": "Voorts sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent der samenkomst, op den eersten der tweede maand, in het tweede jaar, nadat zij uit Egypteland uitgetogen ware, zeggende:", "2": "Neem op de som van de gehele vergadering der kinderen Israëls, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van al wat mannelijk is, hoofd voor hoofd.", "3": "Van twintig jaren oud en daarboven, allen, die ten heire in Israël uittrekken; die zult gij tellen naar hun heiren, gij en Aäron.", "4": "En met ulieden zullen zijn van elken stam een man, die een hoofdman is over het huis zijner vaderen.", "5": "Deze zijn nu de namen der mannen, die bij u staan zullen: van Ruben, Elizur, de zoon van Sedeur.", "6": "Van Simeon, Selumiël, de zoon van Zurisaddai.", "7": "Van Juda, Nahesson, de zoon van Amminadab.", "8": "Van Issaschar, Nethaneel, de zoon van Zuar.", "9": "Van Zebulon, Eliab, de zoon van Helon.", "10": "Van de kinderen van Jozef: van Efraïm, Elisama, de zoon van Ammihud; van Manasse, Gamaliël, de zoon van Pedazur.", "11": "Van Benjamin, Abidan, de zoon van Gideoni.", "12": "Van Dan, Ahiëzer, de zoon van Ammisaddai.", "13": "Van Aser, Pagiel, de zoon van Ochran.", "14": "Van Gad, Eljasaf, de zoon van Dehuël.", "15": "Van Nafthali, Ahira, de zoon van Enan.", "16": "Dezen waren de geroepenen der vergadering, de oversten der stammen hunner vaderen; zij waren de hoofden der duizenden van Israël.", "17": "Toen namen Mozes en Aäron die mannen, welken met namen uitgedrukt zijn.", "18": "En zij verzamelden de gehele vergadering, op den eersten dag der tweede maand; en die verklaarden hun afkomst, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van die twintig jaren oud was en daarboven, hoofd voor hoofd.", "19": "Gelijk als de HEERE Mozes geboden had, zo heeft hij hen geteld in de woestijn van Sinaï.", "20": "Zo waren de zonen van Ruben, den eerstgeborene van Israël, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaren oud en daarboven, allen, die ten heire uittrokken;", "21": "Hun getelden van den stam van Ruben waren zes en veertig duizend en vijfhonderd.", "22": "Van de zonen van Simeon, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, zijn getelden, in het getal der namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaren oud en daarboven, allen, die ten heire uittrokken;", "23": "Hun getelden van den stam van Simeon waren negen en vijftig duizend en driehonderd.", "24": "Van de zonen van Gad, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken.", "25": "Waren hun getelden van den stam van Gad vijf en veertig duizend zeshonderd en vijftig.", "26": "Van de zonen van Juda, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,", "27": "Waren hun getelden van den stam van Juda vier en zeventig duizend en zeshonderd.", "28": "Van de zonen van Issaschar, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen van twintig jaren oud en daarboven, allen, die ten heire uittrokken,", "29": "Waren hun getelden van den stam van Issaschar vier en vijftig duizend en vierhonderd.", "30": "Van de zonen van Zebulon, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,", "31": "Waren hun getelden van den stam van Zebulon zeven en vijftig duizend en vierhonderd.", "32": "Van de zonen van Jozef: van de zonen van Efraïm, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,", "33": "Waren hun getelden van den stam van Efraïm veertig duizend en vijfhonderd;", "34": "Van de zonen van Manasse, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,", "35": "Waren hun getelden van den stam van Manasse twee en dertig duizend en tweehonderd.", "36": "Van de zonen van Benjamin, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,", "37": "Waren hun getelden van den stam van Benjamin vijf en dertig duizend en vierhonderd.", "38": "Van de zonen van Dan, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,", "39": "Waren hun getelden van den stam van Dan twee en zestig duizend en zevenhonderd.", "40": "Van de zonen van Aser, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,", "41": "Waren hun getelden van den stam van Aser een en veertig duizend en vijfhonderd.", "42": "*Van* de zonen van Nafthali, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,", "43": "Waren hun getelden van den stam van Nafthali drie en vijftig duizend en vierhonderd.", "44": "Dezen zijn de getelden, welke Mozes geteld heeft, en Aäron, en de oversten van Israël; twaalf mannen waren zij, elk over het huis zijner vaderen.", "45": "Alzo waren al de getelden der zonen van Israël, naar het huis hunner vaderen, van twintig jaren oud en daarboven, allen, die in Israël ten heire uittrokken,", "46": "Al de getelden dan waren zeshonderd drie duizend vijfhonderd en vijftig.", "47": "Maar de Levieten, naar den stam hunner vaderen, werden onder hen niet geteld.", "48": "Want de HEERE had tot Mozes gesproken, zeggende:", "49": "Alleen den stam van Levi zult gij niet tellen, noch hun som opnemen, onder de zonen van Israël.", "50": "Maar gij, stel de Levieten over den tabernakel der getuigenis, en over al zijn gereedschap, en over alles, wat daartoe behoort; zij zullen den tabernakel dragen, en al zijn gereedschap; en zij zullen dien bedienen, en zij zullen zich rondom den tabernakel legeren.", "51": "En als de tabernakel zal optrekken, de Levieten zullen denzelven afnemen; en wanneer de tabernakel zich legeren zal, zullen de Levieten denzelven oprichten; en de vreemde, die daarbij komt, zal gedood worden.", "52": "En de kinderen Israëls zullen zich legeren, een iegelijk bij zijn leger, en een iegelijk bij zijn banier, naar hun heiren.", "53": "Maar de Levieten zullen zich legeren rondom den tabernakel der getuigenis, opdat geen verbolgenheid over de vergadering van de kinderen Israëls zij; daarom zullen de Levieten de wacht van den tabernakel der getuigenis waarnemen.", "54": "Zo deden de kinderen Israëls; naar alles, wat de HEERE Mozes geboden had, zo deden zij."}, "KJV": {"1": "And the LORD spake unto Moses in the wilderness of Sinai, in the tabernacle of the congregation, on the first *day* of the second month, in the second year after they were come out of the land of Egypt, saying,", "2": "Take ye the sum of all the congregation of the children of Israel, after their families, by the house of their fathers, with the number of *their* names, every male by their polls;", "3": "From twenty years old and upward, all that are able to go forth to war in Israel: thou and Aaron shall number them by their armies.", "4": "And with you there shall be a man of every tribe; every one head of the house of his fathers.", "5": "And these *are* the names of the men that shall stand with you: of *the tribe of* Reuben; Elizur the son of Shedeur.", "6": "Of Simeon; Shelumiel the son of Zurishaddai.", "7": "Of Judah; Nahshon the son of Amminadab.", "8": "Of Issachar; Nethaneel the son of Zuar.", "9": "Of Zebulun; Eliab the son of Helon.", "10": "Of the children of Joseph: of Ephraim; Elishama the son of Ammihud: of Manasseh; Gamaliel the son of Pedahzur.", "11": "Of Benjamin; Abidan the son of Gideoni.", "12": "Of Dan; Ahiezer the son of Ammishaddai.", "13": "Of Asher; Pagiel the son of Ocran.", "14": "Of Gad; Eliasaph the son of Deuel.", "15": "Of Naphtali; Ahira the son of Enan.", "16": "These *were* the renowned of the congregation, princes of the tribes of their fathers, heads of thousands in Israel.", "17": "And Moses and Aaron took these men which are expressed by *their* names:", "18": "And they assembled all the congregation together on the first *day* of the second month, and they declared their pedigrees after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, by their polls.", "19": "As the LORD commanded Moses, so he numbered them in the wilderness of Sinai.", "20": "And the children of Reuben, Israel's eldest son, by their generations, after their families, by the house of their fathers, according to the number of the names, by their polls, every male from twenty years old and upward, all that were able to go forth to war;", "21": "Those that were numbered of them, *even* of the tribe of Reuben, *were* forty and six thousand and five hundred.", "22": "Of the children of Simeon, by their generations, after their families, by the house of their fathers, those that were numbered of them, according to the number of the names, by their polls, every male from twenty years old and upward, all that were able to go forth to war;", "23": "Those that were numbered of them, *even* of the tribe of Simeon, *were* fifty and nine thousand and three hundred.", "24": "Of the children of Gad, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;", "25": "Those that were numbered of them, *even* of the tribe of Gad, *were* forty and five thousand six hundred and fifty.", "26": "Of the children of Judah, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;", "27": "Those that were numbered of them, *even* of the tribe of Judah, *were* threescore and fourteen thousand and six hundred.", "28": "Of the children of Issachar, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;", "29": "Those that were numbered of them, *even* of the tribe of Issachar, *were* fifty and four thousand and four hundred.", "30": "Of the children of Zebulun, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;", "31": "Those that were numbered of them, *even* of the tribe of Zebulun, *were* fifty and seven thousand and four hundred.", "32": "Of the children of Joseph, *namely*, of the children of Ephraim, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;", "33": "Those that were numbered of them, *even* of the tribe of Ephraim, *were* forty thousand and five hundred.", "34": "Of the children of Manasseh, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;", "35": "Those that were numbered of them, *even* of the tribe of Manasseh, *were* thirty and two thousand and two hundred.", "36": "Of the children of Benjamin, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;", "37": "Those that were numbered of them, *even* of the tribe of Benjamin, *were* thirty and five thousand and four hundred.", "38": "Of the children of Dan, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;", "39": "Those that were numbered of them, *even* of the tribe of Dan, *were* threescore and two thousand and seven hundred.", "40": "Of the children of Asher, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;", "41": "Those that were numbered of them, *even* of the tribe of Asher, *were* forty and one thousand and five hundred.", "42": "Of the children of Naphtali, throughout their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;", "43": "Those that were numbered of them, *even* of the tribe of Naphtali, *were* fifty and three thousand and four hundred.", "44": "These *are* those that were numbered, which Moses and Aaron numbered, and the princes of Israel, *being* twelve men: each one was for the house of his fathers.", "45": "So were all those that were numbered of the children of Israel, by the house of their fathers, from twenty years old and upward, all that were able to go forth to war in Israel;", "46": "Even all they that were numbered were six hundred thousand and three thousand and five hundred and fifty.", "47": "But the Levites after the tribe of their fathers were not numbered among", "48": "For the LORD had spoken unto Moses, saying,", "49": "Only thou shalt not number the tribe of Levi, neither take the sum of them among the children of Israel:", "50": "But thou shalt appoint the Levites over the tabernacle of testimony, and over all the vessels thereof, and over all things that *belong* to it: they shall bear the tabernacle, and all the vessels thereof; and they shall minister unto it, and shall encamp round about the tabernacle.", "51": "And when the tabernacle setteth forward, the Levites shall take it down: and when the tabernacle is to be pitched, the Levites shall set it up: and the stranger that cometh nigh shall be put to death.", "52": "And the children of Israel shall pitch their tents, every man by his own camp, and every man by his own standard, throughout their hosts.", "53": "But the Levites shall pitch round about the tabernacle of testimony, that there be no wrath upon the congregation of the children of Israel: and the Lev an Levi naderen, en stel hem voor het aangezicht van de priester Aäron, opdat zij hem dienen; En dat zij zijn wacht waarnemen, en de wacht van de hele vergadering, voor de tent der samenkomst, om de dienst van de tabernakel te bedienen; En dat zij al het gereedschap van de tent der samenkomst, en de wacht van de kinderen van Israël waarnemen, om de dienst van de tabernakel te bedienen.", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Jona 1:1": "Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Ex 6:13-18": "Dit zijn de hoofden van ieder huis van hun vaderen: de zonen van Ruben, de eerstgeborene van Israël, zijn Hanoch en Pallu, Hezron en Charmi; dit zijn de huisgezinnen van Ruben. En de zonen van Simeon: Jemuël, en Jamin, en Ohad, en Jachin, en Zohar, en Saul, de zoon van een Kanaänitische vrouw; dit zijn de huisgezinnen van Simeon. Dit nu zijn de namen van de zonen van Levi, naar hun geboorten: Gerson, en Kehath, en Merari. En de jaren van het leven van Levi waren honderdzevenendertig jaren.", "Num 1:1-46": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei: Neem het aantal op van de gehele vergadering van de kinderen van Israël, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van al wat mannelijk is, hoofd voor hoofd. Van twintig jaar oud en daarboven, allen die in Israël uittrekken ten leger; die zult u tellen naar hun legers, u en Aäron.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "1 Tim 4:13-16": "Houd aan met het voorlezen, met het vermanen, met het onderwijzen, totdat ik kom. Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap. Denk na over deze dingen, wijd u eraan, opdat uw vooruitgang voor allen zichtbaar wordt.", "Num 26:43": "Al de geslachten der Suhamieten, naar hun getelden, waren vierenzestigduizend vierhonderd.", "Num 16:2": "En zij stonden op voor het aangezicht van Mozes, alsook tweehonderd en vijftig mannen uit de kinderen van Israël, leiders van de vergadering, de geroepenen van de samenkomst, mannen van naam.", "Deut 1:15": "Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Num 2:3-31": "Die zich nu oostwaarts, naar de opgang, legeren zullen, zal zijn de banier van het leger van Juda, naar hun legers; en Nahesson, de zoon van Amminadab, zal de leider van de zonen van Juda zijn. Zijn leger nu, en zijn getelden, waren vierenzeventigduizend zeshonderd. En ernaast zal zich legeren de stam van Issaschar; en Nethaneel, de zoon van Zuar, zal de leider van de zonen van Issaschar zijn.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "Joz 7:14": "U zult dan in de morgen aankomen naar uw stammen; en het zal gebeuren: de stam die de HEERE aanwijst, die zal aankomen naar de geslachten, en welk geslacht de HEERE aanwijst, dat zal aankomen bij huisgezinnen, en welk huisgezin de HEERE aanwijst, dat zal aankomen man voor man.", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Deut 3:18": "Verder gebood ik u in die tijd: De HEERE, uw God, heeft u dit land gegeven om het in bezit te nemen; laat dan al degenen onder u die strijdbare mannen zijn, gewapend voor uw broeders, de kinderen van Israël, doortrekken.", "Num 1:20-54": "Zo waren de zonen van Ruben, de eerstgeborene van Israël, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaar oud en daarboven, allen die ten leger uittrokken; Hun getelden van de stam van Ruben waren zesenveertigduizend vijfhonderd. Van de zonen van Simeon, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, hun getelden, in het getal van de namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaar oud en daarboven, allen die ten leger uittrokken;", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Neh 3:19": "Aan zijn hand verbeterde Ezer, de zoon van Jesua, de leider van Mizpa, een ander stuk; tegenover de opgang naar het wapenhuis, aan de hoek.", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Num 7:65": "En als dankoffer: twee runderen, vijf rammen, vijf bokken, vijf eenjarige lammeren. Dit was de offergave van Abidan, de zoon van Gideoni.", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Deut 33:17": "Hij heeft de heerlijkheid van de eerstgeborene van zijn os, en zijn horens zijn horens van de eenhoorn; daarmee zal hij de volken samen stoten tot aan de einden van het land. Dezen nu zijn de tienduizenden van Efraïm, en dezen zijn de duizenden van Manasse!", "Lev 22:10-13": "Ook zal geen vreemde het heilige eten; een bijwoner van de priester, en een dagloner, zullen het heilige niet eten. Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten. Maar als de dochter van de priester aan een vreemde man zal toebehoren, zal zij van het hefoffer van de heilige dingen niet eten.", "Ex 32:26-29": "bleef Mozes staan in de poort van het kamp en zei: Wie de HEERE toebehoort, kom bij mij! Toen verzamelden alle zonen van Levi zich bij hem. En hij zei tegen hen: Zo zegt de HEERE, de God van Israël: Ieder doe zijn zwaard om zijn heup; ga heen en weer, van poort tot poort in het kamp, en ieder dode zijn broeder, en elk zijn vriend, en elk zijn naaste! En de zonen van Levi deden naar het woord van Mozes; en er vielen van het volk, op die dag, ongeveer drieduizend man.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Num 2:29": "Daartoe de stam van Nafthali; en Ahira, de zoon van Enan, zal de leider van de zonen van Nafthali zijn.", "Num 2:3": "Die zich nu oostwaarts, naar de opgang, legeren zullen, zal zijn de banier van het leger van Juda, naar hun legers; en Nahesson, de zoon van Amminadab, zal de leider van de zonen van Juda zijn.", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "Neh 12:8": "En de Levieten waren: Jesua, Binnui, Kadmiel, Serebja, Juda, Matthanja; hij en zijn broeders waren over de dankzeggingen.", "Ex 12:17": "Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "1 Sam 3:20": "En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "Num 18:2-4": "En ook zult u uw broeders, de stam van Levi, de stam van uw vader, met u laten naderen, zodat zij u worden bijgevoegd, en u dienen; maar u, en uw zonen met u, zult voor de tent der getuigenis zijn. En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u. Maar zij zullen u bijgevoegd worden, en de wacht van de tent der samenkomst waarnemen, in alle dienst van de tent; en een vreemde zal u niet naderen.", "Num 10:15": "En over het leger van de stam van de kinderen van Issaschar was Nethaneel, de zoon van Zuar.", "Num 2:26": "Zijn leger nu, en zijn getelden, waren tweeënzestigduizend zevenhonderd.", "Num 10:4": "Maar als zij met de ene zullen blazen, dan zullen tot u verzameld worden de leiders, de hoofden van de duizenden van Israël.", "Gen 30:8": "Toen zei Rachel: Ik heb worstelingen van God met mijn zuster geworsteld; ook heb ik de overhand gehad; en zij noemde zijn naam Nafthali.", "Num 12:6-8": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Neh 3:18": "Na hem verbeterden hun broeders, Bavai, de zoon van Henadad, de leider van het andere halve deel van Kehila.", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Num 27:2": "En zij gingen staan voor Mozes, en voor Eleazar, de priester, en voor de leiders, en de hele vergadering, bij de deur van de tent van de samenkomst, en zeiden:", "Gen 48:1": "Het gebeurde nu na deze dingen, dat men Jozef vertelde: Zie, uw vader is ziek! Toen nam hij zijn twee zonen met zich, Manasse en Efraïm.", "Num 10:27": "En over het leger van de stam van de kinderen van Nafthali was Ahira, de zoon van Enan.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "1 Kron 7:27": "Zijn zoon was Non; zijn zoon Jozua.", "Num 7:18": "Op de tweede dag offerde Nethaneel, de zoon van Zuar, de leider van Issaschar.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Num 2:9": "Al de getelden van het leger van Juda waren honderdzesentachtigduizend vierhonderd, naar hun legers. Zij zullen vooraan optrekken.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "Num 26:5-50": "Ruben was de eerstgeborene van Israël. De zonen van Ruben waren: Hanoch, van wie het geslacht der Hanochieten was; van Pallu het geslacht der Palluieten; Van Hezron het geslacht der Hezronieten; van Karmi het geslacht der Karmieten. Dit zijn de geslachten der Rubenieten; en hun getelden waren drieënveertigduizend zevenhonderddertig.", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "Ezech 3:14": "Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.", "Num 7:35": "En als dankoffer: twee runderen, vijf rammen, vijf bokken, vijf eenjarige lammeren. Dit was de offergave van Elizur, de zoon van Sedeur.", "Richt 7:3": "Nu dan, roep nu voor de oren van het volk, en zeg: Wie bang en angstig is, die keert terug en spoedt zich weg van het gebergte van Gilead! Toen keerden er van het volk tweeëntwintigduizend terug, zodat er tienduizend overbleven.", "Num 3:23": "De geslachten van de Gersonieten zullen zich legeren achter de tabernakel, westwaarts.", "Num 10:16": "En over het leger van de stam van de kinderen van Zebulon was Eliab, de zoon van Helon.", "Gen 46:24": "En de zonen van Nafthali: Jahzeel, en Guni, en Jezer, en Sillem.", "Num 9:1": "En de HEERE sprak tot Mozes in de woestijn van Sinaï, in het tweede jaar, nadat zij uit Egypteland uitgetogen waren, in de eerste maand, en Hij zei:", "Num 1:44-46": "Dezen zijn de getelden, die Mozes geteld heeft, en Aäron, en de leiders van Israël; twaalf mannen waren het, elk over het huis van zijn vaderen. Zo waren alle getelden van de zonen van Israël, naar het huis van hun vaderen, van twintig jaar oud en daarboven, allen die in Israël ten leger uittrokken, Al de getelden dan waren zeshonderddrieduizend vijfhonderdvijftig.", "Num 18:22": "En de kinderen van Israël zullen niet meer tot de tent der samenkomst naderen, om zonde te dragen en te sterven.", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Num 1:50-53": "Maar u, stel de Levieten aan over de tabernakel van de getuigenis, en over al zijn gereedschap, en over alles wat daarbij hoort; zij zullen de tabernakel dragen, en al zijn gereedschap; en zij zullen die verzorgen, en zij zullen zich rondom de tabernakel legeren. En als de tabernakel zal optrekken, zullen de Levieten hem afbreken; en wanneer de tabernakel neergezet moet worden, zullen de Levieten hem oprichten; en de vreemde die daarbij komt, zal gedood worden. En de kinderen van Israël zullen zich legeren, ieder bij zijn eigen leger, en ieder bij zijn eigen banier, naar hun legers.", "Num 2:33": "Maar de Levieten werden niet geteld onder de Israëlieten, zoals de HEERE Mozes geboden had.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Num 7:12": "Hij nu die op de eerste dag zijn offergave bracht, was Nahesson, de zoon van Amminadab, voor de stam van Juda.", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Num 26:57-62": "Dit zijn nu de getelden van Levi, naar hun geslachten: van Gerson het geslacht der Gersonieten; van Kohath het geslacht der Kohathieten; van Merari het geslacht der Merarieten. Dit zijn de geslachten van Levi: het geslacht der Libnieten, het geslacht der Hebronieten, het geslacht der Machlieten, het geslacht der Muzieten, het geslacht der Korachieten. En Kohath verwekte Amram. En de naam van de vrouw van Amram was Jochebed, de dochter van Levi, die de vrouw van Levi baarde in Egypte; en deze baarde aan Amram, Aäron, en Mozes, en Mirjam, hun zuster.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Num 7:36": "Op de vijfde dag offerde de leider van de kinderen van Simeon, Selumiël, de zoon van Zurisaddai.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "Num 1:47-50": "Maar de Levieten werden naar de stam van hun vaderen niet onder hen geteld. Want de HEERE had tot Mozes gesproken en gezegd: Alleen de stam van Levi zult u niet tellen, en hun aantal niet opnemen onder de zonen van Israël.", "Ezech 37:1": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.", "Deut 34:9-11": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;", "Num 1:1-50": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei: Neem het aantal op van de gehele vergadering van de kinderen van Israël, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van al wat mannelijk is, hoofd voor hoofd. Van twintig jaar oud en daarboven, allen die in Israël uittrekken ten leger; die zult u tellen naar hun legers, u en Aäron.", "Num 17:2": "Spreek tot de kinderen van Israël, en neem van hen voor elk vaderlijk huis een staf, van al hun leiders, naar het huis van hun vaderen, twaalf staven; ieders naam zult u schrijven op zijn staf.", "Num 7:42": "Op de zesde dag offerde de leider van de kinderen van Gad, Eljasaf, de zoon van Dehuël.", "Ezech 3:10-12": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Joz 22:13-32": "En de kinderen van Israël zonden naar de kinderen van Ruben, en naar de kinderen van Gad, en naar de halve stam van Manasse, in het land Gilead, Pinehas, de zoon van Eleazar, de priester; En tien leiders met hem, van elk vaderlijk huis één leider, uit al de stammen van Israël; en zij waren elk een hoofd van het huis van hun vaderen over de duizenden van Israël. Toen zij bij de kinderen van Ruben, en bij de kinderen van Gad, en bij de halve stam van Manasse aankwamen, in het land Gilead, spraken zij met hen, en zeiden:", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Num 16:9": "Is het u te weinig, dat de God van Israël u van de vergadering van Israël heeft afgescheiden, om u tot Zich te laten naderen; om de dienst van de tabernakel van de HEERE te verrichten, en te staan voor het aangezicht van de vergadering, om hen te dienen?", "Neh 3:12": "En aan zijn hand verbeterde Sallum, de zoon van Lohes, leider van het andere halve deel van Jeruzalem, hij en zijn dochters.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Num 7:2": "Dat de leiders van Israël, de hoofden van het huis van hun vaderen, offerden; dit waren de leiders van de stammen, die over de getelden stonden.", "1 Kon 20:15": "Toen telde hij de jongens van de leiders van de landschappen, en zij waren tweehonderdtwee en dertig; en na hen telde hij al het volk, alle kinderen van Israël, zevenduizend.", "Num 12:4-10": "Toen sprak de HEERE haastig tot Mozes, en tot Aäron, en tot Mirjam: Kom u drie naar buiten, naar de tent van de samenkomst! En zij drieën kwamen naar buiten. Toen kwam de HEERE af in de wolkkolom, en stond bij de deur van de tent; daarna riep Hij Aäron en Mirjam; en zij beiden kwamen naar buiten. En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken.", "Deut 31:15": "Toen verscheen de HEERE in de tent, in de wolkkolom; en de wolkkolom stond boven de deur van de tent.", "Num 10:26": "En over het leger van de stam van de kinderen van Aser was Pagiel, de zoon van Ochran.", "1 Kron 25:1": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst.", "Ex 19:3": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:", "Lev 27:34": "Dit zijn de geboden die de HEERE Mozes geboden heeft, aan de kinderen van Israël, op de berg Sinaï.", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "Ps 122:4": "waarheen de stammen opgaan, de stammen van de HEERE, tot de getuigenis van Israël, om de Naam van de HEERE te danken.", "Num 10:14": "Want als eerste trok op de banier van het leger van de kinderen van Juda, naar hun legers; en over zijn leger was Nahesson, de zoon van Amminadab.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Num 14:29": "Uw dode lichamen zullen in deze woestijn vallen; en al uw getelden, naar uw hele aantal, van twintig jaar oud en daarboven, u die tegen Mij gemord hebt.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Ex 30:14": "Ieder die overgaat tot de getelden, van twintig jaar oud en daarboven, zal het hefoffer van de HEERE geven.", "Num 26:7": "Dit zijn de geslachten der Rubenieten; en hun getelden waren drieënveertigduizend zevenhonderddertig.", "Neh 7:61": "Ook trokken dezen op vanuit Thel-Melah, Thel-Harsa, Cherub, Addon en Immer; maar zij konden het huis van hun vaderen, en hun nageslacht, niet aantonen, of zij uit Israël waren;", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "1 Kron 2:11": "En Nahesson verwekte Salma, en Salma verwekte Boaz,", "Num 26:37": "Dat zijn de geslachten der zonen van Efraïm, naar hun getelden: tweeëndertigduizend vijfhonderd. Dat zijn de zonen van Jozef, naar hun geslachten.", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ezra 2:59": "Dezen trokken ook op van Tel-melah, Tel-harsa, Cherub, Addan en Immer; maar zij konden van het huis van hun vaderen en hun nageslacht niet bewijzen of zij uit Israël waren.", "2 Sam 12:1": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.", "Num 22:18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "Num 7:78": "Op de twaalfde dag offerde de leider van de kinderen van Nafthali, Ahira, de zoon van Enan.", "2 Kron 25:5": "En Amazia verzamelde Juda, en stelde hen, naar de families van hun vaderen, aan tot leiders van duizenden en tot leiders van honderden, door heel Juda en Benjamin; en hij monsterde hen, van twintig jaar oud en daarboven, en vond hen driehonderdduizend uitgelezen mannen, die uit konden trekken ten strijde, en die speer en schild konden hanteren.", "Num 3:8": "En dat zij al het gereedschap van de tent der samenkomst, en de wacht van de kinderen van Israël waarnemen, om de dienst van de tabernakel te bedienen.", "Num 10:21": "Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.", "Num 7:77": "En als dankoffer: twee runderen, vijf rammen, vijf bokken, vijf eenjarige lammeren. Dit was de offergave van Pagiel, de zoon van Ochran.", "Joz 4:12": "En de kinderen van Ruben, en de kinderen van Gad, alsook de halve stam van Manasse, trokken gewapend voor de ogen van de kinderen van Israël, zoals Mozes tegen hen gesproken had.", "1 Kron 15:2": "Toen zei David: Niemand mag de ark van God dragen, dan de Levieten; want die heeft de HEERE uitgekozen, om de ark van God te dragen, en om Hem te dienen tot in eeuwigheid.", "Jer 24:4": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "1 Sam 3:21": "En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "1 Sam 10:6": "En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Num 26:44-47": "De zonen van Aser, naar hun geslachten, waren: van Imna het geslacht der Imnaieten; van Isvi het geslacht der Isvieten; van Beria het geslacht der Beriieten. Van de zonen van Beria waren: van Heber het geslacht der Heberieten; van Malchiël het geslacht der Malchiëlieten. En de naam van de dochter van Aser was Serah.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "Num 26:63": "Dat zijn de getelden van Mozes en Eleazar, de priester, die de kinderen van Israël telden in de vlakke velden van Moab, aan de Jordaan bij Jericho.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Neh 3:9": "En aan hun hand verbeterde Refaja, de zoon van Hur, leider van het halve deel van Jeruzalem.", "Ex 40:17": "En het gebeurde in de eerste maand, in het tweede jaar, op de eerste van de maand, dat de tabernakel opgericht werd.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "Neh 7:5": "Zo gaf mijn God het in mijn hart, dat ik de edelen, en de overheden, en het volk verzamelde, om de geslachten te tellen; en ik vond het geslachtsregister van hen die het eerst waren opgetrokken, en vond daarin geschreven het volgende:", "Num 31:47": "Van die helft van de kinderen van Israël nam Mozes één gevangene van elke vijftig, van mensen en van beesten; en hij gaf ze aan de Levieten, die de wacht over de tabernakel van de HEERE waarnamen, zoals de HEERE Mozes geboden had.", "Num 2:25": "De banier van het leger van Dan zal tegen het noorden zijn, naar hun legers; en Ahiëzer, de zoon van Ammisaddai, zal de leider van de zonen van Dan zijn.", "Num 2:2": "De Israëlieten zullen zich legeren, ieder onder zijn banier, naar de tekenen van het huis van zijn vaderen; rondom, tegenover de tent van de samenkomst, zullen zij zich legeren.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Num 34:18-29": "Verder zult u uit elke stam één leider nemen, om het land ter erfenis uit te delen. En dit zijn de namen van deze mannen: van de stam van Juda, Kaleb, zoon van Jefunne; En van de stam der kinderen van Simeon, Semuël, zoon van Ammihud;", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "1 Kon 21:11-13": "En de mannen van zijn stad, die oudsten en die edelen, die in zijn stad woonden, deden zoals Izebel hun gezonden had; zoals geschreven was in de brieven die zij hun gezonden had. Zij riepen een vasten uit; en zij zetten Naboth vooraan onder het volk. Toen kwamen de twee mannen, zonen van Belial, en gingen tegenover hem zitten; en de mannen van Belial getuigden tegen hem, tegen Naboth, voor het volk, en zeiden: Naboth heeft God en de koning gevloekt. En zij voerden hem de stad uit, en stenigden hem met stenen, zodat hij stierf.", "Num 24:16": "Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.", "Num 2:17": "Daarna zal de tent van de samenkomst optrekken, met het leger van de Levieten, in het midden van de legers; zoals zij zich legeren zullen, zo zullen zij optrekken, ieder op zijn plaats, naar hun banieren.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Ex 18:25": "En Mozes koos bekwame mannen, uit heel Israël, en stelde hen aan tot hoofden over het volk; leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien;", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "Num 7:17": "En als dankoffer: twee runderen, vijf rammen, vijf bokken, vijf eenjarige lammeren. Dit was de offergave van Nahesson, de zoon van Amminadab.", "Num 32:2": "Toen kwamen de kinderen van Gad en de kinderen van Ruben en spraken tot Mozes, tot Eleazar de priester, en tot de leiders van de vergadering, en zeiden:", "Lev 10:6": "En Mozes zei tegen Aäron, en tegen Eleazar en tegen Ithamar, zijn zonen: U mag uw hoofden niet ontbloten, en uw kleren niet scheuren, zodat u niet sterft, en er grote toorn over de hele gemeenschap komt; maar laat uw broeders, het hele huis van Israël, deze brand bewenen, die de HEERE aangestoken heeft.", "Gen 50:23": "En Jozef zag van Efraïm kinderen, van het derde geslacht; ook werden de zonen van Machir, de zoon van Manasse, op de knieën van Jozef geboren.", "Num 7:30": "Op de vierde dag offerde de leider van de kinderen van Ruben, Elizur, de zoon van Sedeur.", "Jer 23:15": "Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "Deut 20:5-9": "Dan zullen de opzichters tot het volk spreken en zeggen: Wie is de man die een nieuw huis heeft gebouwd, en het niet heeft ingewijd? Die ga heen en keert terug naar zijn huis, opdat hij niet misschien sterft in de strijd, en iemand anders dat inwijdt. En wie is de man die een wijngaard geplant heeft, en de vrucht ervan nog niet heeft genoten? Die ga heen en keert terug naar zijn huis, opdat hij niet misschien in de strijd sterft en iemand anders die geniet. En wie is de man die een vrouw ondertrouwd heeft, en haar nog niet tot zich heeft genomen? Die ga heen en keert terug naar zijn huis; opdat hij niet misschien in die strijd sterft, en een andere man haar neemt.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Num 7:3": "En zij brachten hun offergave voor het aangezicht van de HEERE: zes overdekte wagens en twaalf runderen; een wagen voor twee leiders, en een os voor ieder een; en zij brachten ze voor de tabernakel.", "Num 33:1": "Dit zijn de reizen van de kinderen van Israël, die uit het land Egypte uitgetogen zijn, naar hun legers, door de hand van Mozes en Aäron.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Num 7:41": "En als dankoffer: twee runderen, vijf rammen, vijf bokken, vijf eenjarige lammeren. Dit was de offergave van Selumiël, de zoon van Zurisaddai.", "Num 3:21-37": "Van Gerson was het geslacht van de Libnieten, en het geslacht van de Simeïeten; dit zijn de geslachten van de Gersonieten. Hun getelden in getal waren van al wat mannelijk was, van een maand oud en daarboven; hun getelden waren zevenduizend vijfhonderd. De geslachten van de Gersonieten zullen zich legeren achter de tabernakel, westwaarts.", "Ezra 8:34": "Naar het getal en naar het gewicht van dat alles; en het hele gewicht werd op datzelfde moment opgeschreven.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "1 Kon 17:24": "Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "Num 26:2-4": "Neem de som op van de hele vergadering van de kinderen van Israël, van twintig jaar oud en daarboven, naar het huis van hun vaderen, ieder die in Israël voor het leger uittrekt. Mozes dan en Eleazar, de priester, spraken hen aan, in de vlakke velden van Moab, aan de Jordaan bij Jericho, en zeiden: Dat men opneemt van twintig jaar oud en daarboven; zoals de HEERE Mozes geboden had, en de kinderen van Israël, die uit Egypteland uitgetrokken waren.", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Gen 46:8-24": "En dit zijn de namen van de zonen van Israël die naar Egypte kwamen: Jakob en zijn zonen. De eerstgeborene van Jakob: Ruben. En de zonen van Ruben: Hanoch, en Pallu, en Hezron, en Karmi. En de zonen van Simeon: Jemuël, en Jamin, en Ohad, en Jachin, en Zohar, en Saul, de zoon van een Kanaänitische vrouw.", "Num 8:19": "En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.", "2 Kon 3:11": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.", "Gen 30:5-20": "En Bilha werd zwanger, en baarde Jakob een zoon. Toen zei Rachel: God heeft mij recht gedaan, en heeft ook mijn stem verhoord, en heeft mij een zoon gegeven; daarom noemde zij zijn naam Dan. En Bilha, Rachels dienstmaagd, werd opnieuw zwanger, en baarde Jakob een tweede zoon.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Amos 3:8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "Num 2:12": "En naast hem zal zich legeren de stam van Simeon; en Selumiël, de zoon van Zurisaddai, zal de leider van de zonen van Simeon zijn.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Luk 3:32": "de zoon van Isaï, de zoon van Obed, de zoon van Boaz, de zoon van Salmon, de zoon van Nahasson,", "Zach 1:7": "Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 7:11": "En de HEERE zei tegen Mozes: Elke leider zal, ieder op zijn dag, zijn offergave brengen ter inwijding van het altaar.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "Amos 7:7": "Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "1 Kron 23:3-5": "En de Levieten werden geteld, van dertig jaar af en daarboven; en hun aantal was, naar hun hoofden, aan mannen, achtendertigduizend. Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters; En vierduizend poortwachters, en vierduizend lofzangers van de HEERE, met instrumenten die ik gemaakt heb, zei David, om lof te zingen.", "Joz 17:4": "Dezen dan traden toe voor Eleazar, de priester, en voor Jozua, de zoon van Nun, en voor de leiders, en zeiden: De HEERE heeft Mozes geboden dat men ons een erfdeel geven zou te midden van onze broeders. Daarom gaf hij haar, naar het woord van de HEERE, een erfdeel te midden van de broeders van hun vader.", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Joh 1:6": "Er was een mens door God gezonden, wiens naam Johannes was.", "Ex 31:18": "En Hij gaf aan Mozes, toen Hij met hem op de berg Sinaï geëindigd had te spreken, de twee tafelen van de getuigenis, tafelen van steen, beschreven met de vinger van God.", "Deut 24:5": "Wanneer een man een nieuwe vrouw genomen heeft, zal die niet uittrekken in het leger, en men zal hem geen last opleggen; één jaar lang zal hij vrij zijn in zijn huis, en zijn vrouw, die hij genomen heeft, verheugen.", "2 Kron 18:27": "En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Deut 1:6": "De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.", "Hos 1:2": "Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Num 31:14": "En Mozes werd zeer boos op de aanvoerders van het leger, de hoofdlieden over de duizenden, en de hoofdlieden over de honderden, die uit de strijd van die oorlog kwamen.", "Jer 26:12": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "1 Sam 22:7": "Toen zei Saul tegen zijn knechten die bij hem stonden: Hoor toch, u, zonen van Jemini, zal ook de zoon van Isaï u allemaal akkers en wijngaarden geven? Zal hij u allemaal tot aanvoerders van duizenden en aanvoerders van honderden stellen?", "Num 16:46": "En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen.", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Num 23:12": "Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Richt 13:25": "En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.", "2 Kon 4:27": "Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Ezech 11:1": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.", "Num 7:29": "En als dankoffer: twee runderen, vijf rammen, vijf bokken, vijf eenjarige lammeren. Dit was de offergave van Eliab, de zoon van Helon.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Num 3:7": "En dat zij zijn wacht waarnemen, en de wacht van de hele vergadering, voor de tent der samenkomst, om de dienst van de tabernakel te bedienen;", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Num 10:22": "Daarna trok de banier van het leger van de kinderen van Efraïm op, naar hun legers; en over het leger was Elisama, de zoon van Ammihud.", "1 Kron 27:24": "Joab, de zoon van Zeruja, had begonnen te tellen, maar hij maakte het niet af, omdat er vanwege deze telling grote toorn over Israël gekomen was; daarom is het getal niet opgenomen in de rekening van de kronieken van koning David.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Num 2:6": "Zijn leger nu, en zijn getelden, waren vierenvijftigduizend vierhonderd.", "Num 7:48": "Op de zevende dag offerde de leider van de kinderen van Efraïm, Elisama, de zoon van Ammihud.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Num 4:2": "Neem de som op van de zonen van Kohath, uit het midden van de zonen van Levi, naar hun geslachten, naar het huis van hun vaderen.", "Num 24:2-4": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Num 26:2": "Neem de som op van de hele vergadering van de kinderen van Israël, van twintig jaar oud en daarboven, naar het huis van hun vaderen, ieder die in Israël voor het leger uittrekt.", "Neh 13:5": "En hij had hem een grote kamer gemaakt, waar zij tevoren het spijsoffer, de wierook en de vaten heenleidden, en de tienden van koren, van most en van olie, die bevolen waren voor de Levieten, en de zangers, en de poortwachters, alsook het hefoffer van de priesters.", "Num 26:34": "Dat zijn de geslachten van Manasse: en hun getelden waren tweeënvijftigduizend zevenhonderd.", "Gen 48:5": "Nu dan, uw twee zonen, die u in Egypteland geboren zijn, voordat ik naar u toe in Egypte gekomen ben, zijn van mij; Efraïm en Manasse zullen van mij zijn, zoals Ruben en Simeon.", "Num 3:1-10": "Dit nu zijn de geboorten van Aäron en Mozes; ten dage dat de HEERE met Mozes gesproken heeft op de berg Sinaï. En dit zijn de namen van de zonen van Aäron: de eerstgeborene, Nadab, daarna Abihu, Eleazar, en Ithamar. Dit zijn de namen van de zonen van Aäron, de priesters, die gezalfd waren, wier hand men gevuld had, om het priesterambt te bedienen.", "Ex 38:26": "Een beka voor elk hoofd, dat is een halve sikkel, naar de sikkel van het heiligdom, van ieder die overging tot de getelden, van twintig jaar oud en daarboven, namelijk zeshonderddrieduizend vijfhonderdvijftig.", "Num 4:5-33": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken. En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen. Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "Num 3:6-9": "Laat de stam van Levi naderen, en stel hem voor het aangezicht van de priester Aäron, opdat zij hem dienen; En dat zij zijn wacht waarnemen, en de wacht van de hele vergadering, voor de tent der samenkomst, om de dienst van de tabernakel te bedienen; En dat zij al het gereedschap van de tent der samenkomst, en de wacht van de kinderen van Israël waarnemen, om de dienst van de tabernakel te bedienen.", "Deut 33:1-29": "Dit nu is de zegen, waarmee Mozes, de man Gods, de kinderen Israëls gezegend heeft, voor zijn dood. Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen. Zeker bemint Hij de volken! Al Zijn heiligen zijn in Uw hand; zij zullen in het midden tussen Uw voeten gezet worden; ieder zal ontvangen van Uw woorden.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "Num 18:3-6": "En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u. Maar zij zullen u bijgevoegd worden, en de wacht van de tent der samenkomst waarnemen, in alle dienst van de tent; en een vreemde zal u niet naderen. U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Neh 3:16": "Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden.", "Num 1:26-54": "Van de zonen van Juda, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken, Waren hun getelden van de stam van Juda vierenzeventigduizend zeshonderd. Van de zonen van Issaschar, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen van twintig jaar oud en daarboven, allen die ten leger uittrokken,", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Neh 13:22": "Vervolgens zei ik tegen de Levieten dat zij zich zouden reinigen, en de poorten komen bewaken, om de sabbatdag te heiligen. Denk ook hierin aan mij, mijn God! en spaar mij naar de overvloed van Uw goedertierenheid.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "Num 32:11": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;", "Num 3:35": "De aanvoerder nu van het vaderlijke huis van de geslachten van Merari zal zijn Zuriël, de zoon van Abihaïl; zij zullen zich legeren aan de zijde van de tabernakel, noordwaarts.", "Num 18:3": "En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "2 Sam 18:1": "En David monsterde het volk dat bij hem was, en hij stelde over hen leiders van duizend, en leiders van honderd aan.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Ex 19:1": "In de derde maand na het uittrekken van de kinderen van Israël uit Egypteland, op diezelfde dag kwamen zij in de woestijn Sinaï.", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "1 Kron 12:26": "Van de kinderen van Levi, vierduizend zeshonderd;", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Num 7:23": "En als dankoffer: twee runderen, vijf rammen, vijf bokken, vijf eenjarige lammer
