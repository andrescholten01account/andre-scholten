oor hoofd.","3":"Van twintig jaar oud en daarboven, allen die in Israël uittrekken ten leger; die zult u tellen naar hun legers, u en Aäron.","4":"En met u zullen er zijn van elke stam een man, die hoofd is over het huis van zijn vaderen.","5":"Dit zijn nu de namen van de mannen die bij u zullen staan: van Ruben, Elizur, de zoon van Sedeur.","6":"Van Simeon, Selumiël, de zoon van Zurisaddai.","7":"Van Juda, Nahesson, de zoon van Amminadab.","8":"Van Issaschar, Nethaneel, de zoon van Zuar.","9":"Van Zebulon, Eliab, de zoon van Helon.","10":"Van de kinderen van Jozef: van Efraïm, Elisama, de zoon van Ammihud; van Manasse, Gamaliël, de zoon van Pedazur.","11":"Van Benjamin, Abidan, de zoon van Gideoni.","12":"Van Dan, Ahiëzer, de zoon van Ammisaddai.","13":"Van Aser, Pagiel, de zoon van Ochran.","14":"Van Gad, Eljasaf, de zoon van Dehuël.","15":"Van Nafthali, Ahira, de zoon van Enan.","16":"Dezen waren de geroepenen van de vergadering, de leiders van de stammen van hun vaderen; zij waren de hoofden van de duizenden van Israël.","17":"Toen namen Mozes en Aäron deze mannen, die met namen zijn aangeduid.","18":"En zij verzamelden de gehele vergadering, op de eerste dag van de tweede maand; en die verklaarden hun afkomst, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van wie twintig jaar oud was en daarboven, hoofd voor hoofd.","19":"Zoals de HEERE Mozes geboden had, zo heeft hij hen geteld in de woestijn van Sinaï.","20":"Zo waren de zonen van Ruben, de eerstgeborene van Israël, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaar oud en daarboven, allen die ten leger uittrokken;","21":"Hun getelden van de stam van Ruben waren zesenveertigduizend vijfhonderd.","22":"Van de zonen van Simeon, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, hun getelden, in het getal van de namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaar oud en daarboven, allen die ten leger uittrokken;","23":"Hun getelden van de stam van Simeon waren negenenvijftigduizend driehonderd.","24":"Van de zonen van Gad, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken.","25":"Waren hun getelden van de stam van Gad vijfenveertigduizend zeshonderdvijftig.","26":"Van de zonen van Juda, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,","27":"Waren hun getelden van de stam van Juda vierenzeventigduizend zeshonderd.","28":"Van de zonen van Issaschar, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen van twintig jaar oud en daarboven, allen die ten leger uittrokken,","29":"Waren hun getelden van de stam van Issaschar vierenvijftigduizend vierhonderd.","30":"Van de zonen van Zebulon, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,","31":"Waren hun getelden van de stam van Zebulon zevenenvijftigduizend vierhonderd.","32":"Van de zonen van Jozef: van de zonen van Efraïm, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,","33":"Waren hun getelden van de stam van Efraïm veertigduizend vijfhonderd;","34":"Van de zonen van Manasse, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,","35":"Waren hun getelden van de stam van Manasse tweeëndertigduizend tweehonderd.","36":"Van de zonen van Benjamin, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,","37":"Waren hun getelden van de stam van Benjamin vijfendertigduizend vierhonderd.","38":"Van de zonen van Dan, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,","39":"Waren hun getelden van de stam van Dan tweeënzestigduizend zevenhonderd.","40":"Van de zonen van Aser, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,","41":"Waren hun getelden van de stam van Aser eenenveertigduizend vijfhonderd.","42":"*Van* de zonen van Nafthali, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,","43":"Waren hun getelden van de stam van Nafthali drieënvijftigduizend vierhonderd.","44":"Dezen zijn de getelden, die Mozes geteld heeft, en Aäron, en de leiders van Israël; twaalf mannen waren het, elk over het huis van zijn vaderen.","45":"Zo waren alle getelden van de zonen van Israël, naar het huis van hun vaderen, van twintig jaar oud en daarboven, allen die in Israël ten leger uittrokken,","46":"Al de getelden dan waren zeshonderddrieduizend vijfhonderdvijftig.","47":"Maar de Levieten werden naar de stam van hun vaderen niet onder hen geteld.","48":"Want de HEERE had tot Mozes gesproken en gezegd:","49":"Alleen de stam van Levi zult u niet tellen, en hun aantal niet opnemen onder de zonen van Israël.","50":"Maar u, stel de Levieten aan over de tabernakel van de getuigenis, en over al zijn gereedschap, en over alles wat daarbij hoort; zij zullen de tabernakel dragen, en al zijn gereedschap; en zij zullen die verzorgen, en zij zullen zich rondom de tabernakel legeren.","51":"En als de tabernakel zal optrekken, zullen de Levieten hem afbreken; en wanneer de tabernakel neergezet moet worden, zullen de Levieten hem oprichten; en de vreemde die daarbij komt, zal gedood worden.","52":"En de kinderen van Israël zullen zich legeren, ieder bij zijn eigen leger, en ieder bij zijn eigen banier, naar hun legers.","53":"Maar de Levieten zullen zich legeren rondom de tabernakel van de getuigenis, opdat er geen verbolgenheid over de vergadering van de kinderen van Israël komt; daarom zullen de Levieten de wacht van de tabernakel van de getuigenis waarnemen.","54":"Zo deden de kinderen van Israël; naar alles wat de HEERE Mozes geboden had, zo deden zij."},"SV":{"1":"Voorts sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent der samenkomst, op den eersten der tweede maand, in het tweede jaar, nadat zij uit Egypteland uitgetogen ware, zeggende:","2":"Neem op de som van de gehele vergadering der kinderen Israëls, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van al wat mannelijk is, hoofd voor hoofd.","3":"Van twintig jaren oud en daarboven, allen, die ten heire in Israël uittrekken; die zult gij tellen naar hun heiren, gij en Aäron.","4":"En met ulieden zullen zijn van elken stam een man, die een hoofdman is over het huis zijner vaderen.","5":"Deze zijn nu de namen der mannen, die bij u staan zullen: van Ruben, Elizur, de zoon van Sedeur.","6":"Van Simeon, Selumiël, de zoon van Zurisaddai.","7":"Van Juda, Nahesson, de zoon van Amminadab.","8":"Van Issaschar, Nethaneel, de zoon van Zuar.","9":"Van Zebulon, Eliab, de zoon van Helon.","10":"Van de kinderen van Jozef: van Efraïm, Elisama, de zoon van Ammihud; van Manasse, Gamaliël, de zoon van Pedazur.","11":"Van Benjamin, Abidan, de zoon van Gideoni.","12":"Van Dan, Ahiëzer, de zoon van Ammisaddai.","13":"Van Aser, Pagiel, de zoon van Ochran.","14":"Van Gad, Eljasaf, de zoon van Dehuël.","15":"Van Nafthali, Ahira, de zoon van Enan.","16":"Dezen waren de geroepenen der vergadering, de oversten der stammen hunner vaderen; zij waren de hoofden der duizenden van Israël.","17":"Toen namen Mozes en Aäron die mannen, welken met namen uitgedrukt zijn.","18":"En zij verzamelden de gehele vergadering, op den eersten dag der tweede maand; en die verklaarden hun afkomst, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van die twintig jaren oud was en daarboven, hoofd voor hoofd.","19":"Gelijk als de HEERE Mozes geboden had, zo heeft hij hen geteld in de woestijn van Sinaï.","20":"Zo waren de zonen van Ruben, den eerstgeborene van Israël, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaren oud en daarboven, allen, die ten heire uittrokken;","21":"Hun getelden van den stam van Ruben waren zes en veertig duizend en vijfhonderd.","22":"Van de zonen van Simeon, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, zijn getelden, in het getal der namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaren oud en daarboven, allen, die ten heire uittrokken;","23":"Hun getelden van den stam van Simeon waren negen en vijftig duizend en driehonderd.","24":"Van de zonen van Gad, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken.","25":"Waren hun getelden van den stam van Gad vijf en veertig duizend zeshonderd en vijftig.","26":"Van de zonen van Juda, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,","27":"Waren hun getelden van den stam van Juda vier en zeventig duizend en zeshonderd.","28":"Van de zonen van Issaschar, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen van twintig jaren oud en daarboven, allen, die ten heire uittrokken,","29":"Waren hun getelden van den stam van Issaschar vier en vijftig duizend en vierhonderd.","30":"Van de zonen van Zebulon, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,","31":"Waren hun getelden van den stam van Zebulon zeven en vijftig duizend en vierhonderd.","32":"Van de zonen van Jozef: van de zonen van Efraïm, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,","33":"Waren hun getelden van den stam van Efraïm veertig duizend en vijfhonderd;","34":"Van de zonen van Manasse, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,","35":"Waren hun getelden van den stam van Manasse twee en dertig duizend en tweehonderd.","36":"Van de zonen van Benjamin, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,","37":"Waren hun getelden van den stam van Benjamin vijf en dertig duizend en vierhonderd.","38":"Van de zonen van Dan, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,","39":"Waren hun getelden van den stam van Dan twee en zestig duizend en zevenhonderd.","40":"Van de zonen van Aser, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,","41":"Waren hun getelden van den stam van Aser een en veertig duizend en vijfhonderd.","42":"*Van* de zonen van Nafthali, hun geboorten, naar hun geslachten, naar het huis hunner vaderen, in het getal der namen, van twintig jaren oud en daarboven, allen, die ten heire uittrokken,","43":"Waren hun getelden van den stam van Nafthali drie en vijftig duizend en vierhonderd.","44":"Dezen zijn de getelden, welke Mozes geteld heeft, en Aäron, en de oversten van Israël; twaalf mannen waren zij, elk over het huis zijner vaderen.","45":"Alzo waren al de getelden der zonen van Israël, naar het huis hunner vaderen, van twintig jaren oud en daarboven, allen, die in Israël ten heire uittrokken,","46":"Al de getelden dan waren zeshonderd drie duizend vijfhonderd en vijftig.","47":"Maar de Levieten, naar den stam hunner vaderen, werden onder hen niet geteld.","48":"Want de HEERE had tot Mozes gesproken, zeggende:","49":"Alleen den stam van Levi zult gij niet tellen, noch hun som opnemen, onder de zonen van Israël.","50":"Maar gij, stel de Levieten over den tabernakel der getuigenis, en over al zijn gereedschap, en over alles, wat daartoe behoort; zij zullen den tabernakel dragen, en al zijn gereedschap; en zij zullen dien bedienen, en zij zullen zich rondom den tabernakel legeren.","51":"En als de tabernakel zal optrekken, de Levieten zullen denzelven afnemen; en wanneer de tabernakel zich legeren zal, zullen de Levieten denzelven oprichten; en de vreemde, die daarbij komt, zal gedood worden.","52":"En de kinderen Israëls zullen zich legeren, een iegelijk bij zijn leger, en een iegelijk bij zijn banier, naar hun heiren.","53":"Maar de Levieten zullen zich legeren rondom den tabernakel der getuigenis, opdat geen verbolgenheid over de vergadering van de kinderen Israëls zij; daarom zullen de Levieten de wacht van den tabernakel der getuigenis waarnemen.","54":"Zo deden de kinderen Israëls; naar alles, wat de HEERE Mozes geboden had, zo deden zij."},"KJV":{"1":"And the LORD spake unto Moses in the wilderness of Sinai, in the tabernacle of the congregation, on the first *day* of the second month, in the second year after they were come out of the land of Egypt, saying,","2":"Take ye the sum of all the congregation of the children of Israel, after their families, by the house of their fathers, with the number of *their* names, every male by their polls;","3":"From twenty years old and upward, all that are able to go forth to war in Israel: thou and Aaron shall number them by their armies.","4":"And with you there shall be a man of every tribe; every one head of the house of his fathers.","5":"And these *are* the names of the men that shall stand with you: of *the tribe of* Reuben; Elizur the son of Shedeur.","6":"Of Simeon; Shelumiel the son of Zurishaddai.","7":"Of Judah; Nahshon the son of Amminadab.","8":"Of Issachar; Nethaneel the son of Zuar.","9":"Of Zebulun; Eliab the son of Helon.","10":"Of the children of Joseph: of Ephraim; Elishama the son of Ammihud: of Manasseh; Gamaliel the son of Pedahzur.","11":"Of Benjamin; Abidan the son of Gideoni.","12":"Of Dan; Ahiezer the son of Ammishaddai.","13":"Of Asher; Pagiel the son of Ocran.","14":"Of Gad; Eliasaph the son of Deuel.","15":"Of Naphtali; Ahira the son of Enan.","16":"These *were* the renowned of the congregation, princes of the tribes of their fathers, heads of thousands in Israel.","17":"And Moses and Aaron took these men which are expressed by *their* names:","18":"And they assembled all the congregation together on the first *day* of the second month, and they declared their pedigrees after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, by their polls.","19":"As the LORD commanded Moses, so he numbered them in the wilderness of Sinai.","20":"And the children of Reuben, Israel's eldest son, by their generations, after their families, by the house of their fathers, according to the number of the names, by their polls, every male from twenty years old and upward, all that were able to go forth to war;","21":"Those that were numbered of them, *even* of the tribe of Reuben, *were* forty and six thousand and five hundred.","22":"Of the children of Simeon, by their generations, after their families, by the house of their fathers, those that were numbered of them, according to the number of the names, by their polls, every male from twenty years old and upward, all that were able to go forth to war;","23":"Those that were numbered of them, *even* of the tribe of Simeon, *were* fifty and nine thousand and three hundred.","24":"Of the children of Gad, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;","25":"Those that were numbered of them, *even* of the tribe of Gad, *were* forty and five thousand six hundred and fifty.","26":"Of the children of Judah, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;","27":"Those that were numbered of them, *even* of the tribe of Judah, *were* threescore and fourteen thousand and six hundred.","28":"Of the children of Issachar, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;","29":"Those that were numbered of them, *even* of the tribe of Issachar, *were* fifty and four thousand and four hundred.","30":"Of the children of Zebulun, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;","31":"Those that were numbered of them, *even* of the tribe of Zebulun, *were* fifty and seven thousand and four hundred.","32":"Of the children of Joseph, *namely*, of the children of Ephraim, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;","33":"Those that were numbered of them, *even* of the tribe of Ephraim, *were* forty thousand and five hundred.","34":"Of the children of Manasseh, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;","35":"Those that were numbered of them, *even* of the tribe of Manasseh, *were* thirty and two thousand and two hundred.","36":"Of the children of Benjamin, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;","37":"Those that were numbered of them, *even* of the tribe of Benjamin, *were* thirty and five thousand and four hundred.","38":"Of the children of Dan, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;","39":"Those that were numbered of them, *even* of the tribe of Dan, *were* threescore and two thousand and seven hundred.","40":"Of the children of Asher, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;","41":"Those that were numbered of them, *even* of the tribe of Asher, *were* forty and one thousand and five hundred.","42":"Of the children of Naphtali, throughout their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;","43":"Those that were numbered of them, *even* of the tribe of Naphtali, *were* fifty and three thousand and four hundred.","44":"These *are* those that were numbered, which Moses and Aaron numbered, and the princes of Israel, *being* twelve men: each one was for the house of his fathers.","45":"So were all those that were numbered of the children of Israel, by the house of their fathers, from twenty years old and upward, all that were able to go forth to war in Israel;","46":"Even all they that were numbered were six hund (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
