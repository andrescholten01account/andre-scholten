les om ons heen opeten, zoals de os het groen van het veld opeet. Balak, de zoon van Zippor, was in die tijd koning van de Moabieten.","5":"Hij stuurde boden naar Bileam, de zoon van Beor, naar Pethor, dat aan de rivier ligt, in het land van de kinderen van zijn volk, om hem te roepen, en zei: Zie, er is een volk uit Egypte getrokken; zie, het bedekt het gezicht van het land, en het blijft recht tegenover mij liggen.","6":"En nu, kom toch, vervloek voor mij dit volk, want het is machtiger dan ik; misschien kan ik het dan verslaan, of uit het land verdrijven; want ik weet dat wie u zegent, gezegend is, en wie u vervloekt, vervloekt is.","7":"Toen gingen de oudsten van Moab en de oudsten van Midian, met het loon voor de waarzeggerij in hun hand; zo kwamen zij bij Bileam, en spraken tot hem de woorden van Balak.","8":"Hij zei toen tegen hen: Overnacht hier deze nacht, dan zal ik u een antwoord terugbrengen, zoals de HEERE tot mij zal gesproken hebben. Toen bleven de vorsten van Moab bij Bileam.","9":"En God kwam tot Bileam en zei: Wie zijn die mannen die bij u zijn?","10":"Toen zei Bileam tegen God: Balak, de zoon van Zippor, de koning van Moab, heeft hen naar mij gestuurd, met de woorden:","11":"Zie, er is een volk uit Egypte getrokken, dat het gezicht van het land bedekt; kom nu, vervloek het voor mij; misschien kan ik dan tegen hen strijden, of hen verdrijven.","12":"Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend.","13":"Toen stond Bileam 's morgens op, en zei tegen de vorsten van Balak: Ga naar uw land; want de HEERE weigert mij toe te staan met u mee te gaan.","14":"Toen stonden de vorsten van Moab op, en kwamen bij Balak, en zij zeiden: Bileam heeft geweigerd met ons mee te gaan.","15":"Doch Balak ging door met het sturen van vorsten, meer en aanzienlijker dan die er waren;","16":"Zij kwamen bij Bileam, en zeiden tegen hem: Zo zegt Balak, de zoon van Zippor: Laat u toch niet weerhouden om naar mij te komen!","17":"Want ik zal u zeer hoog eren, en al wat u tegen mij zult zeggen, dat zal ik doen; kom toch, vervloek voor mij dit volk!","18":"Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.","19":"En nu, blijft u toch ook hier deze nacht, zodat ik weet wat de HEERE verder tot mij zal spreken.","20":"God kwam toen 's nachts tot Bileam, en zei tegen hem: Omdat die mannen gekomen zijn om u te roepen, sta op, ga met hen; en toch zult u datgene doen wat Ik tot u spreken zal.","21":"Toen stond Bileam 's morgens op, en zadelde zijn ezelin, en hij trok heen met de vorsten van Moab.","22":"Doch de toorn van God ontstak, omdat hij heenging; en de Engel van de HEERE stelde Zich in de weg, als tegenpartij tegen hem; hij reed op zijn ezelin, en twee van zijn knechten waren bij hem.","23":"De ezelin nu zag de Engel van de HEERE staan in de weg, met Zijn getrokken zwaard in Zijn hand; daarom week de ezelin van de weg af, en ging het veld in. Toen sloeg Bileam de ezelin, om haar weer op de weg te laten gaan.","24":"Maar de Engel van de HEERE stond op een pad tussen de wijngaarden, met een muur aan deze en een muur aan de andere zijde.","25":"Toen de ezelin de Engel van de HEERE zag, klemde zij zichzelf tegen de wand, en klemde Bileams voet tegen de wand; daarom ging hij door met haar te slaan.","26":"Toen ging de Engel van de HEERE nog verder, en Hij stond op een nauwe plaats, waar geen weg was om uit te wijken naar rechts of naar links.","27":"Toen de ezelin de Engel van de HEERE zag, ging zij liggen onder Bileam; en de toorn van Bileam ontstak, en hij sloeg de ezelin met een stok.","28":"De HEERE opende toen de mond van de ezelin, die tegen Bileam zei: Wat heb ik u gedaan, dat u mij nu al driemaal geslagen hebt?","29":"Toen zei Bileam tegen de ezelin: Omdat u mij bespot hebt; had ik maar een zwaard in mijn hand! dan zou ik u nu doden.","30":"De ezelin zei toen tegen Bileam: Ben ik niet uw ezelin, waarop u gereden hebt vanaf toen u mijn heer werd, tot op deze dag? Ben ik ooit gewend geweest u zo te doen? Hij zei toen: Nee!","31":"Toen opende de HEERE de ogen van Bileam, zodat hij de Engel van de HEERE zag staan in de weg, met Zijn getrokken zwaard in Zijn hand; daarom boog hij het hoofd en boog zich neer op zijn gezicht.","32":"Toen zei de Engel van de HEERE tegen hem: Waarom hebt u uw ezelin nu al driemaal geslagen? Zie, Ik ben uitgegaan als tegenpartij tegen u, omdat deze weg van Mij afwijkt.","33":"Maar de ezelin heeft Mij gezien, en is nu al driemaal voor Mijn aangezicht geweken; als zij voor Mijn aangezicht niet geweken was, dan had Ik u nu zeker gedood, en haar in leven gelaten.","34":"Toen zei Bileam tegen de Engel van de HEERE: Ik heb gezondigd, want ik heb niet geweten dat U mij tegemoet op deze weg stond; en nu, als het kwaad is in Uw ogen, zal ik terugkeren.","35":"De Engel van de HEERE zei toen tegen Bileam: Ga met deze mannen mee; maar alleen dat woord dat Ik tot u spreken zal, dat zult u spreken. Zo ging Bileam met de vorsten van Balak mee.","36":"Toen Balak hoorde dat Bileam kwam, ging hij hem tegemoet, naar de stad van Moab, die aan het gebied van de Arnon ligt, aan de uiterste grens.","37":"En Balak zei tegen Bileam: Heb ik niet ernstig naar u gestuurd om u te roepen? Waarom bent u niet naar mij gekomen? Kan ik u niet werkelijk eren?","38":"Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.","39":"En Bileam ging met Balak mee; en zij kwamen te Kirjath-huzoth.","40":"Toen offerde Balak runderen en schapen; en hij stuurde ervan naar Bileam, en naar de vorsten die bij hem waren.","41":"En het gebeurde 's morgens, dat Balak Bileam meenam, en hem bracht naar de hoogten van Baäl, zodat hij vandaar het uiterste deel van het volk kon zien."},"SV":{"1":"Daarna reisden de kinderen van Israël, en legerden zich in de vlakke velden van Moab, aan deze zijde van de Jordaan van Jericho.","2":"Toen Balak, de zoon van Zippor, zag al wat Israël aan de Amorieten gedaan had;","3":"Zo vreesde Moab zeer voor het aangezicht dezes volks, want het was veel; en Moab was beangstigd voor het aangezicht van de kinderen Israëls.","4":"Derhalve zeide Moab tot de oudsten der Midianieten: Nu zal deze gemeente oplikken al wat rondom ons is, gelijk de os de groente des velds oplikt. Te dier tijd nu was Balak, de zoon van Zippor, koning der Moabieten.","5":"Die zond boden aan Bileam, den zoon van Beor, te Pethor, hetwelk aan de rivier is, in het land der kinderen zijns volks, om hem te roepen, zeggende: Zie, er is een volk uit Egypte getogen; zie, het heeft het gezicht des lands bedekt, en het blijft liggen recht tegenover mij.","6":"En nu, kom toch, vervloek mij dit volk, want het is machtiger dan ik; misschien zal ik het kunnen slaan, of het uit het land verdrijven; want ik weet, dat, wien gij zegent, die zal gezegend zijn, en wien gij vervloekt, die zal vervloekt zijn.","7":"Toen gingen de oudsten der Moabieten, en de oudsten der Midianieten, en hadden het *loon* *der* waarzeggingen in hun hand; alzo kwamen zij tot Bileam, en spraken tot hem de woorden van Balak.","8":"Hij dan zeide tot hen: Vernacht hier dezen nacht, zo zal ik ulieden een antwoord wederbrengen, gelijk als de HEERE tot mij zal gesproken hebben. Toen bleven de vorsten der Moabieten bij Bileam.","9":"En God kwam tot Bileam en zeide: Wie zijn die mannen, die bij u zijn?","10":"Toen zeide Bileam tot God: Balak, de zoon van Zippor, de koning der Moabieten, heeft hen tot mij gezonden, *zeggende*:","11":"Zie, er is een volk uit Egypte getogen, en het heeft het gezicht des lands bedekt; kom nu, vervloek het mij; misschien zal ik tegen hetzelve kunnen strijden, of het uitdrijven.","12":"Toen zeide God tot Bileam: Gij zult met hen niet trekken; gij zult dat volk niet vloeken, want het is gezegend.","13":"Toen stond Bileam des morgens op, en zeide tot de vorsten van Balak: Gaat naar uw land; want de HEERE weigert mij toe te laten met ulieden te gaan.","14":"Zo stonden dan de vorsten der Moabieten op, en kwamen tot Balak, en zij zeiden: Bileam heeft geweigerd met ons te gaan.","15":"Doch Balak voer nog voort vorsten te zenden, meer en eerlijker, dan die waren;","16":"Die tot Bileam kwamen, en hem zeiden: Alzo zegt Balak, de zoon van Zippor: Laat u toch niet beletten tot mij te komen!","17":"Want ik zal u zeer hoog vereren, en al wat gij tot mij zeggen zult, dat zal ik doen; zo kom toch, vervloek mij dit volk!","18":"Toen antwoordde Bileam, en zeide tot de dienaren van Balak: Wanneer Balak mij zijn huis vol zilver en goud gave, zo vermocht ik niet het bevel des HEEREN mijns Gods te overtreden, om te doen klein of groot.","19":"En nu, blijft gijlieden toch ook hier dezen nacht, opdat ik wete, wat de HEERE tot mij verder spreken zal.","20":"God nu kwam tot Bileam des nachts, en zeide tot hem: Dewijl die mannen gekomen zijn, om u te roepen, sta op, ga met hen; en nochtans zult gij dat doen, hetwelk Ik tot u spreken zal.","21":"Toen stond Bileam des morgens op, en zadelde zijn ezelin, en hij trok heen met de vorsten van Moab.","22":"Doch de toorn van God werd ontstoken, omdat hij heentoog; en de Engel des HEEREN stelde Zich in den weg, hem tot een tegenpartij; hij reed nu op zijn ezelin, en twee zijner jongeren waren bij hem.","23":"De ezelin nu zag den Engel des HEEREN staande in den weg, met Zijn uitgetrokken zwaard in Zijn hand; daarom week de ezelin uit den weg, en ging in het veld. Toen sloeg Bileam de ezelin, om dezelve naar den weg te doen wenden.","24":"Maar de Engel des HEEREN stond in een pad der wijngaarden, zijnde een muur aan deze, en een muur aan gene zijde.","25":"Toen de ezelin den Engel des HEEREN zag, zo klemde zij zichzelve aan den wand, en klemde Bileams voet aan den wand; daarom voer hij voort haar te slaan.","26":"Toen ging de Engel des HEEREN noch verder, en Hij stond in een enge plaats, waar geen weg was om te wijken ter rechter *hand* noch ter linkerhand.","27":"Als de ezelin den Engel des HEEREN zag, zo leide zij zich neder onder Bileam; en de toorn van Bileam ontstak, en hij sloeg de ezelin met een stok.","28":"De HEERE nu opende den mond der ezelin, die tot Bileam zeide: Wat heb ik u gedaan, dat gij mij nu driemaal geslagen hebt?","29":"Toen zeide Bileam tot de ezelin: Omdat gij mij bespot hebt; och, of ik een zwaard in mijn hand had! want ik zoude u nu doden.","30":"De ezelin nu zeide tot Bileam: Ben ik niet uw ezelin, op welke gij gereden hebt van toen af, dat gij *mijn* *heer* geweest zijt, tot op dezen dag? Ben ik ooit gewend geweest u alzo te doen? Hij dan zeide: Neen!","31":"Toen ontdekte de HEERE de ogen van Bileam, zodat hij den Engel des HEEREN zag, staande in den weg, en Zijn uitgetrokken zwaard in Zijn hand; daarom neigde hij het hoofd en boog zich op zijn aangezicht.","32":"Toen zeide de Engel des HEEREN tot hem: Waarom hebt gij uw ezelin nu driemaal geslagen? Zie, Ik ben uitgegaan *u* tot een tegenpartij, dewijl deze weg van Mij afwijkt.","33":"Maar de ezelin heeft Mij gezien, en zij is nu driemaal voor Mijn aangezicht geweken; indien zij voor Mijn aangezicht niet geweken ware, zekerlijk Ik zoude u nu ook gedood, en haar bij het leven behouden hebben.","34":"Toen zeide Bileam tot den Engel des HEEREN: Ik heb gezondigd, want ik heb niet geweten, dat Gij mij tegemoet op dezen weg stond; en nu, is het kwaad in Uw ogen, ik zal wederkeren.","35":"De Engel des HEEREN nu zeide tot Bileam: Ga heen met deze mannen; maar alleenlijk dat woord, wat Ik tot u spreken zal, dat zult gij spreken. Alzo toog Bileam met de vorsten van Balak.","36":"Als Balak hoorde, dat Bileam kwam, zo ging hij uit, hem tegemoet, tot de stad der Moabieten, welke aan de landpale van de Arnon *ligt*, die aan het uiterste der landpale is.","37":"En Balak zeide tot Bileam: Heb ik niet ernstiglijk tot u gezonden, om u te roepen? Waarom zijt gij niet tot mij gekomen? Kan ik u niet te recht vereren?","38":"Toen zeide Bileam tot Balak: Zie, ik ben tot u gekomen; zal ik nu enigszins iets kunnen spreken? Het woord, hetwelk God in mijn mond leggen zal, dat zal ik spreken.","39":"En Bileam ging met Balak; en zij kwamen te Kirjath-huzzoth.","40":"Toen slachtte Balak runderen en schapen; en hij zond aan Bileam, en aan de vorsten, die bij hem waren.","41":"En het geschiedde des morgens, dat Balak Bileam nam, en voerde hem op de hoogten van Baäl, dat hij van daar zag het uiterste des volks."},"KJV":{"1":"And the children of Israel set forward, and pitched in the plains of Moab on this side Jordan *by* Jericho.","2":"And Balak the son of Zippor saw all that Israel had done to the Amorites.","3":"And Moab was sore afraid of the people, because they *were* many: and Moab was distressed because of the children of Israel.","4":"And Moab said unto the elders of Midian, Now shall this company lick up all *that are* round about us, as the ox licketh up the grass of the field. And Balak the son of Zippor *was* king of the Moabites at that time.","5":"He sent messengers therefore unto Balaam the son of Beor to Pethor, which *is* by the river of the land of the children of his people, to call him, saying, Behold, there is a people come out from Egypt: behold, they cover the face of the earth, and they abide over against","6":"Come now therefore, I pray thee, curse me this people; for they *are* too mighty for me: peradventure I shall prevail, *that* we may smite them, and *that* I may drive them out of the land: for I wot that he whom thou blessest *is* blessed, and he whom thou cursest is cursed.","7":"And the elders of Moab and the elders of Midian departed with the rewards of divination in their hand; and they came unto Balaam, and spake unto him the words of Balak.","8":"And he said unto them, Lodge here this night, and I will bring you word again, as the LORD shall speak unto me: and the princes of Moab abode with Balaam.","9":"And God came unto Balaam, and said, What men","10":"And Balaam said unto God, Balak the son of Zippor, king of Moab, hath sent","11":"Behold, *there is* a people come out of Egypt, which covereth the face of the earth: come now, curse me them; peradventure I shall be able to overcome them, and drive them out.","12":"And God said unto Balaam, Thou shalt not go with them; thou shalt not curse the people: for they *are* blessed.","13":"And Balaam rose up in the morning, and said unto the princes of Balak, Get you into your land: for the LORD refuseth to give me leave to go","14":"And the princes of Moab rose up, and they went unto Balak, and said, Balaam refuseth to come","15":"And Balak sent yet again princes, more, and more honourable","16":"And they came to Balaam, and said to him, Thus saith Balak the son of Zippor, Let nothing, I pray thee, hinder thee from coming","17":"For I will promote thee unto very great honour, and I will do whatsoever thou sayest unto me: come therefore, I pray thee, curse me this people.","18":"And Balaam answered and said unto the servants of Balak, If Balak would give me his house full of silver and gold, I cannot go beyond the word of the LORD my God, to do less or more.","19":"Now therefore, I pray you, tarry ye also here this night, that I may know what the LORD will say unto me more.","20":"And God came unto Balaam at night, and said unto him, If the men come to call thee, rise up, *and* go with them; but yet the word which I shall say unto thee, that shalt thou do.","21":"And Balaam rose up in the morning, and saddled his ass, and went with the princes of Moab.","22":"And God's anger was kindled because he went: and the angel of the LORD stood in the way for an adversary against him. Now he was riding upon his ass, and his two servants","23":"And the ass saw the angel of the LORD standing in the way, and his sword drawn in his hand: and the ass turned aside out of the way, and went into the field: and Balaam smote the ass, to turn her into the way.","24":"But the angel of the LORD stood in a path of the vineyards, a wall *being* on this side, and a wall","25":"And when the ass saw the angel of the LORD, she thrust herself unto the wall, and crushed Balaam's foot against the wall: and he smote her again.","26":"And the angel of the LORD went further, and stood in a narrow place, where *was* no way to turn either to the right hand or to the left.","27":"And when the ass saw the angel of the LORD, she fell down under Balaam: and Balaam's anger was kindled, and he smote the ass with a staff.","28":"And the LORD opened the mouth of the ass, and she said unto Balaam, What have I done unto thee, that thou hast smitten me these three times?","29":"And Balaam said unto the ass, Because thou hast mocked me: I would there were a sword in mine hand, for now would I kill","30":"And the ass said unto Balaam, *Am* not I thine ass, upon which thou hast ridden ever since *I was* thine unto this day? was I ever wont to do so unto thee? And he said,","31":"Then the LORD opened the eyes of Balaam, and he saw the angel of the LORD standing in the way, and his sword drawn in his hand: and he bowed down his head, and fell flat on his face.","32":"And the angel of the LORD said unto him, Wherefore hast thou smitten thine ass these three times? behold, I went out to withstand thee, because *thy* way is perverse","33":"And the ass saw me, and turned from me these three times: unless she had turned from me, surely now also I had slain thee, and saved her alive.","34":"And Balaam said unto the angel of the LORD, I have sinned; for I knew not that thou stoodest in the way against me: now therefore, if it displease thee, I will get me back again.","35":"And the angel of the LORD said unto Balaam, Go with the men: but only the word that I shall speak unto thee, that thou shalt speak. So Balaam went with the princes of Balak.","36":"And when Balak heard that Balaam was come, he went out to meet him unto a l-kjv\" data-code=\"H6213\">done</span> to the Amorites.","3":"And <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H1481\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> because they were <span class=\"wl wl-kjv\" data-code=\"H7227\">many:</span> and <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> was <span class=\"wl wl-kjv\" data-code=\"H6973\">distressed</span> because <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","4":"And <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> Now shall this <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> lick <span class=\"wl wl-kjv\" data-code=\"H3897\">up</span> all that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> us, as the <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> licketh <span class=\"wl wl-kjv\" data-code=\"H3897\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H3418\">grass</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field.</span> And <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6834\">Zippor</span> was <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H4124\">Moabites</span> at that time.","5":"He <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> therefore unto <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1160\">Beor</span> to <span class=\"wl wl-kjv\" data-code=\"H6604\">Pethor,</span> which is by the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> to <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, there is a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> behold, they <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> over against","6":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> now therefore, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H779\">curse</span> me this <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> for they are too <span class=\"wl wl-kjv\" data-code=\"H6099\">mighty</span> for me: peradventure I shall <span class=\"wl wl-kjv\" data-code=\"H3201\">prevail,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> them, and that I may drive them <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> for I <span class=\"wl wl-kjv\" data-code=\"H3045\">wot</span> that he whom thou <span class=\"wl wl-kjv\" data-code=\"H1288\">blessest</span> is <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed,</span> and he whom thou <span class=\"wl wl-kjv\" data-code=\"H779\">cursest</span> is cursed.","7":"And the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> with the rewards of <span class=\"wl wl-kjv\" data-code=\"H7081\">divination</span> in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto him the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of Balak.","8":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H3885\">Lodge</span> here this <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> you <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto me: and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> with Balaam.","9":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What men","10":"And <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6834\">Zippor,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> hath sent","11":"Behold, there is a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> which <span class=\"wl wl-kjv\" data-code=\"H3680\">covereth</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">come</span> now, <span class=\"wl wl-kjv\" data-code=\"H6895\">curse</span> me them; peradventure I shall be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">overcome</span> them, and drive them out.","12":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with them; thou shalt not <span class=\"wl wl-kjv\" data-code=\"H779\">curse</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> for they are blessed.","13":"And <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Get</span> you into your <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3985\">refuseth</span> to give me <span class=\"wl wl-kjv\" data-code=\"H5414\">leave</span> to go","14":"And the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> unto <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> <span class=\"wl wl-kjv\" data-code=\"H3985\">refuseth</span> to come","15":"And <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> yet <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">more,</span> and more honourable","16":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6834\">Zippor,</span> Let nothing, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H4513\">hinder</span> thee from coming","17":"For I will <span class=\"wl wl-kjv\" data-code=\"H3513\">promote</span> thee unto <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">honour,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> whatsoever thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest</span> unto me: <span class=\"wl wl-kjv\" data-code=\"H3212\">come</span> therefore, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H6895\">curse</span> me this people.","18":"And <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak,</span> If <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> would <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H4393\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> go <span class=\"wl wl-kjv\" data-code=\"H5674\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H6310\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H6996\">less</span> or more.","19":"Now therefore, I pray you, <span class=\"wl wl-kjv\" data-code=\"H3427\">tarry</span> ye also here this <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> what the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> unto me more.","20":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> at <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, If the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> thee, rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with them; but <span class=\"wl wl-kjv\" data-code=\"H389\">yet</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> which I shall <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> unto thee, that shalt thou do.","21":"And <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled</span> his <span class=\"wl wl-kjv\" data-code=\"H860\">ass,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of Moab.","22":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God's</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> because he <span class=\"wl wl-kjv\" data-code=\"H1980\">went:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3320\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> for an <span class=\"wl wl-kjv\" data-code=\"H7854\">adversary</span> against him. Now he was <span class=\"wl wl-kjv\" data-code=\"H7392\">riding</span> upon his <span class=\"wl wl-kjv\" data-code=\"H860\">ass,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> servants","23":"And the <span class=\"wl wl-kjv\" data-code=\"H860\">ass</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5324\">standing</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H8025\">drawn</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and the <span class=\"wl wl-kjv\" data-code=\"H860\">ass</span> turned <span class=\"wl wl-kjv\" data-code=\"H5186\">aside</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field:</span> and <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H860\">ass,</span> to <span class=\"wl wl-kjv\" data-code=\"H5186\">turn</span> her into the way.","24":"But the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in a <span class=\"wl wl-kjv\" data-code=\"H4934\">path</span> of the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> a <span class=\"wl wl-kjv\" data-code=\"H1447\">wall</span> being on this side, and a wall","25":"And when the <span class=\"wl wl-kjv\" data-code=\"H860\">ass</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> she <span class=\"wl wl-kjv\" data-code=\"H3905\">thrust</span> herself unto the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall,</span> and <span class=\"wl wl-kjv\" data-code=\"H3905\">crushed</span> <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam's</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> against the <span class=\"wl wl-kjv\" data-code=\"H7023\">wa // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
