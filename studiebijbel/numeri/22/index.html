s", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Daarna reisden de kinderen van Israël, en legerden zich in de vlakke velden van Moab, aan deze zijde van de Jordaan tegenover Jericho.", "2": "Toen Balak, de zoon van Zippor, zag al wat Israël aan de Amorieten gedaan had;", "3": "Vreesde Moab zeer voor het volk, want het was talrijk; en Moab was beangstigd voor de kinderen van Israël.", "4": "Daarom zei Moab tegen de oudsten van Midian: Nu zal deze menigte alles om ons heen opeten, zoals de os het groen van het veld opeet. Balak, de zoon van Zippor, was in die tijd koning van de Moabieten.", "5": "Hij stuurde boden naar Bileam, de zoon van Beor, naar Pethor, dat aan de rivier ligt, in het land van de kinderen van zijn volk, om hem te roepen, en zei: Zie, er is een volk uit Egypte getrokken; zie, het bedekt het gezicht van het land, en het blijft recht tegenover mij liggen.", "6": "En nu, kom toch, vervloek voor mij dit volk, want het is machtiger dan ik; misschien kan ik het dan verslaan, of uit het land verdrijven; want ik weet dat wie u zegent, gezegend is, en wie u vervloekt, vervloekt is.", "7": "Toen gingen de oudsten van Moab en de oudsten van Midian, met het loon voor de waarzeggerij in hun hand; zo kwamen zij bij Bileam, en spraken tot hem de woorden van Balak.", "8": "Hij zei toen tegen hen: Overnacht hier deze nacht, dan zal ik u een antwoord terugbrengen, zoals de HEERE tot mij zal gesproken hebben. Toen bleven de vorsten van Moab bij Bileam.", "9": "En God kwam tot Bileam en zei: Wie zijn die mannen die bij u zijn?", "10": "Toen zei Bileam tegen God: Balak, de zoon van Zippor, de koning van Moab, heeft hen naar mij gestuurd, met de woorden:", "11": "Zie, er is een volk uit Egypte getrokken, dat het gezicht van het land bedekt; kom nu, vervloek het voor mij; misschien kan ik dan tegen hen strijden, of hen verdrijven.", "12": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend.", "13": "Toen stond Bileam 's morgens op, en zei tegen de vorsten van Balak: Ga naar uw land; want de HEERE weigert mij toe te staan met u mee te gaan.", "14": "Toen stonden de vorsten van Moab op, en kwamen bij Balak, en zij zeiden: Bileam heeft geweigerd met ons mee te gaan.", "15": "Doch Balak ging door met het sturen van vorsten, meer en aanzienlijker dan die er waren;", "16": "Zij kwamen bij Bileam, en zeiden tegen hem: Zo zegt Balak, de zoon van Zippor: Laat u toch niet weerhouden om naar mij te komen!", "17": "Want ik zal u zeer hoog eren, en al wat u tegen mij zult zeggen, dat zal ik doen; kom toch, vervloek voor mij dit volk!", "18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "19": "En nu, blijft u toch ook hier deze nacht, zodat ik weet wat de HEERE verder tot mij zal spreken.", "20": "God kwam toen 's nachts tot Bileam, en zei tegen hem: Omdat die mannen gekomen zijn om u te roepen, sta op, ga met hen; en toch zult u datgene doen wat Ik tot u spreken zal.", "21": "Toen stond Bileam 's morgens op, en zadelde zijn ezelin, en hij trok heen met de vorsten van Moab.", "22": "Doch de toorn van God ontstak, omdat hij heenging; en de Engel van de HEERE stelde Zich in de weg, als tegenpartij tegen hem; hij reed op zijn ezelin, en twee van zijn knechten waren bij hem.", "23": "De ezelin nu zag de Engel van de HEERE staan in de weg, met Zijn getrokken zwaard in Zijn hand; daarom week de ezelin van de weg af, en ging het veld in. Toen sloeg Bileam de ezelin, om haar weer op de weg te laten gaan.", "24": "Maar de Engel van de HEERE stond op een pad tussen de wijngaarden, met een muur aan deze en een muur aan de andere zijde.", "25": "Toen de ezelin de Engel van de HEERE zag, klemde zij zichzelf tegen de wand, en klemde Bileams voet tegen de wand; daarom ging hij door met haar te slaan.", "26": "Toen ging de Engel van de HEERE nog verder, en Hij stond op een nauwe plaats, waar geen weg was om uit te wijken naar rechts of naar links.", "27": "Toen de ezelin de Engel van de HEERE zag, ging zij liggen onder Bileam; en de toorn van Bileam ontstak, en hij sloeg de ezelin met een stok.", "28": "De HEERE opende toen de mond van de ezelin, die tegen Bileam zei: Wat heb ik u gedaan, dat u mij nu al driemaal geslagen hebt?", "29": "Toen zei Bileam tegen de ezelin: Omdat u mij bespot hebt; had ik maar een zwaard in mijn hand! dan zou ik u nu doden.", "30": "De ezelin zei toen tegen Bileam: Ben ik niet uw ezelin, waarop u gereden hebt vanaf toen u mijn heer werd, tot op deze dag? Ben ik ooit gewend geweest u zo te doen? Hij zei toen: Nee!", "31": "Toen opende de HEERE de ogen van Bileam, zodat hij de Engel van de HEERE zag staan in de weg, met Zijn getrokken zwaard in Zijn hand; daarom boog hij het hoofd en boog zich neer op zijn gezicht.", "32": "Toen zei de Engel van de HEERE tegen hem: Waarom hebt u uw ezelin nu al driemaal geslagen? Zie, Ik ben uitgegaan als tegenpartij tegen u, omdat deze weg van Mij afwijkt.", "33": "Maar de ezelin heeft Mij gezien, en is nu al driemaal voor Mijn aangezicht geweken; als zij voor Mijn aangezicht niet geweken was, dan had Ik u nu zeker gedood, en haar in leven gelaten.", "34": "Toen zei Bileam tegen de Engel van de HEERE: Ik heb gezondigd, want ik heb niet geweten dat U mij tegemoet op deze weg stond; en nu, als het kwaad is in Uw ogen, zal ik terugkeren.", "35": "De Engel van de HEERE zei toen tegen Bileam: Ga met deze mannen mee; maar alleen dat woord dat Ik tot u spreken zal, dat zult u spreken. Zo ging Bileam met de vorsten van Balak mee.", "36": "Toen Balak hoorde dat Bileam kwam, ging hij hem tegemoet, naar de stad van Moab, die aan het gebied van de Arnon ligt, aan de uiterste grens.", "37": "En Balak zei tegen Bileam: Heb ik niet ernstig naar u gestuurd om u te roepen? Waarom bent u niet naar mij gekomen? Kan ik u niet werkelijk eren?", "38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "39": "En Bileam ging met Balak mee; en zij kwamen te Kirjath-huzoth.", "40": "Toen offerde Balak runderen en schapen; en hij stuurde ervan naar Bileam, en naar de vorsten die bij hem waren.", "41": "En het gebeurde 's morgens, dat Balak Bileam meenam, en hem bracht naar de hoogten van Baäl, zodat hij vandaar het uiterste deel van het volk kon zien."}, "SV": {"1": "Daarna reisden de kinderen van Israël, en legerden zich in de vlakke velden van Moab, aan deze zijde van de Jordaan van Jericho.", "2": "Toen Balak, de zoon van Zippor, zag al wat Israël aan de Amorieten gedaan had;", "3": "Zo vreesde Moab zeer voor het aangezicht dezes volks, want het was veel; en Moab was beangstigd voor het aangezicht van de kinderen Israëls.", "4": "Derhalve zeide Moab tot de oudsten der Midianieten: Nu zal deze gemeente oplikken al wat rondom ons is, gelijk de os de groente des velds oplikt. Te dier tijd nu was Balak, de zoon van Zippor, koning der Moabieten.", "5": "Die zond boden aan Bileam, den zoon van Beor, te Pethor, hetwelk aan de rivier is, in het land der kinderen zijns volks, om hem te roepen, zeggende: Zie, er is een volk uit Egypte getogen; zie, het heeft het gezicht des lands bedekt, en het blijft liggen recht tegenover mij.", "6": "En nu, kom toch, vervloek mij dit volk, want het is machtiger dan ik; misschien zal ik het kunnen slaan, of het uit het land verdrijven; want ik weet, dat, wien gij zegent, die zal gezegend zijn, en wien gij vervloekt, die zal vervloekt zijn.", "7": "Toen gingen de oudsten der Moabieten, en de oudsten der Midianieten, en hadden het *loon* *der* waarzeggingen in hun hand; alzo kwamen zij tot Bileam, en spraken tot hem de woorden van Balak.", "8": "Hij dan zeide tot hen: Vernacht hier dezen nacht, zo zal ik ulieden een antwoord wederbrengen, gelijk als de HEERE tot mij zal gesproken hebben. Toen bleven de vorsten der Moabieten bij Bileam.", "9": "En God kwam tot Bileam en zeide: Wie zijn die mannen, die bij u zijn?", "10": "Toen zeide Bileam tot God: Balak, de zoon van Zippor, de koning der Moabieten, heeft hen tot mij gezonden, *zeggende*:", "11": "Zie, er is een volk uit Egypte getogen, en het heeft het gezicht des lands bedekt; kom nu, vervloek het mij; misschien zal ik tegen hetzelve kunnen strijden, of het uitdrijven.", "12": "Toen zeide God tot Bileam: Gij zult met hen niet trekken; gij zult dat volk niet vloeken, want het is gezegend.", "13": "Toen stond Bileam des morgens op, en zeide tot de vorsten van Balak: Gaat naar uw land; want de HEERE weigert mij toe te laten met ulieden te gaan.", "14": "Zo stonden dan de vorsten der Moabieten op, en kwamen tot Balak, en zij zeiden: Bileam heeft geweigerd met ons te gaan.", "15": "Doch Balak voer nog voort vorsten te zenden, meer en eerlijker, dan die waren;", "16": "Die tot Bileam kwamen, en hem zeiden: Alzo zegt Balak, de zoon van Zippor: Laat u toch niet beletten tot mij te komen!", "17": "Want ik zal u zeer hoog vereren, en al wat gij tot mij zeggen zult, dat zal ik doen; zo kom toch, vervloek mij dit volk!", "18": "Toen antwoordde Bileam, en zeide tot de dienaren van Balak: Wanneer Balak mij zijn huis vol zilver en goud gave, zo vermocht ik niet het bevel des HEEREN mijns Gods te overtreden, om te doen klein of groot.", "19": "En nu, blijft gijlieden toch ook hier dezen nacht, opdat ik wete, wat de HEERE tot mij verder spreken zal.", "20": "God nu kwam tot Bileam des nachts, en zeide tot hem: Dewijl die mannen gekomen zijn, om u te roepen, sta op, ga met hen; en nochtans zult gij dat doen, hetwelk Ik tot u spreken zal.", "21": "Toen stond Bileam des morgens op, en zadelde zijn ezelin, en hij trok heen met de vorsten van Moab.", "22": "Doch de toorn van God werd ontstoken, omdat hij heentoog; en de Engel des HEEREN stelde Zich in den weg, hem tot een tegenpartij; hij reed nu op zijn ezelin, en twee zijner jongeren waren bij hem.", "23": "De ezelin nu zag den Engel des HEEREN staande in den weg, met Zijn uitgetrokken zwaard in Zijn hand; daarom week de ezelin uit den weg, en ging in het veld. Toen sloeg Bileam de ezelin, om dezelve naar den weg te doen wenden.", "24": "Maar de Engel des HEEREN stond in een pad der wijngaarden, zijnde een muur aan deze, en een muur aan gene zijde.", "25": "Toen de ezelin den Engel des HEEREN zag, zo klemde zij zichzelve aan den wand, en klemde Bileams voet aan den wand; daarom voer hij voort haar te slaan.", "26": "Toen ging de Engel des HEEREN noch verder, en Hij stond in een enge plaats, waar geen weg was om te wijken ter rechter *hand* noch ter linkerhand.", "27": "Als de ezelin den Engel des HEEREN zag, zo leide zij zich neder onder Bileam; en de toorn van Bileam ontstak, en hij sloeg de ezelin met een stok.", "28": "De HEERE nu opende den mond der ezelin, die tot Bileam zeide: Wat heb ik u gedaan, dat gij mij nu driemaal geslagen hebt?", "29": "Toen zeide Bileam tot de ezelin: Omdat gij mij bespot hebt; och, of ik een zwaard in mijn hand had! want ik zoude u nu doden.", "30": "De ezelin nu zeide tot Bileam: Ben ik niet uw ezelin, op welke gij gereden hebt van toen af, dat gij *mijn* *heer* geweest zijt, tot op dezen dag? Ben ik ooit gewend geweest u alzo te doen? Hij dan zeide: Neen!", "31": "Toen ontdekte de HEERE de ogen van Bileam, zodat hij den Engel des HEEREN zag, staande in den weg, en Zijn uitgetrokken zwaard in Zijn hand; daarom neigde hij het hoofd en boog zich op zijn aangezicht.", "32": "Toen zeide de Engel des HEEREN tot hem: Waarom hebt gij uw ezelin nu driemaal geslagen? Zie, Ik ben uitgegaan *u* tot een tegenpartij, dewijl deze weg van Mij afwijkt.", "33": "Maar de ezelin heeft Mij gezien, en zij is nu driemaal voor Mijn aangezicht geweken; indien zij voor Mijn aangezicht niet geweken ware, zekerlijk Ik zoude u nu ook gedood, en haar bij het leven behouden hebben.", "34": "Toen zeide Bileam tot den Engel des HEEREN: Ik heb gezondigd, want ik heb niet geweten, dat Gij mij tegemoet op dezen weg stond; en nu, is het kwaad in Uw ogen, ik zal wederkeren.", "35": "De Engel des HEEREN nu zeide tot Bileam: Ga heen met deze mannen; maar alleenlijk dat woord, wat Ik tot u spreken zal, dat zult gij spreken. Alzo toog Bileam met de vorsten van Balak.", "36": "Als Balak hoorde, dat Bileam kwam, zo ging hij uit, hem tegemoet, tot de stad der Moabieten, welke aan de landpale van de Arnon *ligt*, die aan het uiterste der landpale is.", "37": "En Balak zeide tot Bileam: Heb ik niet ernstiglijk tot u gezonden, om u te roepen? Waarom zijt gij niet tot mij gekomen? Kan ik u niet te recht vereren?", "38": "Toen zeide Bileam tot Balak: Zie, ik ben tot u gekomen; zal ik nu enigszins iets kunnen spreken? Het woord, hetwelk God in mijn mond leggen zal, dat zal ik spreken.", "39": "En Bileam ging met Balak; en zij kwamen te Kirjath-huzzoth.", "40": "Toen slachtte Balak runderen en schapen; en hij zond aan Bileam, en aan de vorsten, die bij hem waren.", "41": "En het geschiedde des morgens, dat Balak Bileam nam, en voerde hem op de hoogten van Baäl, dat hij van daar zag het uiterste des volks."}, "KJV": {"1": "And the children of Israel set forward, and pitched in the plains of Moab on this side Jordan *by* Jericho.", "2": "And Balak the son of Zippor saw all that Israel had done to the Amorites.", "3": "And Moab was sore afraid of the people, because they *were* many: and Moab was distressed because of the children of Israel.", "4": "And Moab said unto the elders of Midian, Now shall this company lick up all *that are* round about us, as the ox licketh up the grass of the field. And Balak the son of Zippor *was* king of the Moabites at that time.", "5": "He sent messengers therefore unto Balaam the son of Beor to Pethor, which *is* by the river of the land of the children of his people, to call him, saying, Behold, there is a people come out from Egypt: behold, they cover the face of the earth, and they abide over against", "6": "Come now therefore, I pray thee, curse me this people; for they *are* too mighty for me: peradventure I shall prevail, *that* we may smite them, and *that* I may drive them out of the land: for I wot that he whom thou blessest *is* blessed, and he whom thou cursest is cursed.", "7": "And the elders of Moab and the elders of Midian departed with the rewards of divination in their hand; and they came unto Balaam, and spake unto him the words of Balak.", "8": "And he said unto them, Lodge here this night, and I will bring you word again, as the LORD shall speak unto me: and the princes of Moab abode with Balaam.", "9": "And God came unto Balaam, and said, What men", "10": "And Balaam said unto God, Balak the son of Zippor, king of Moab, hath sent", "11": "Behold, *there is* a people come out of Egypt, which covereth the face of the earth: come now, curse me them; peradventure I shall be able to overcome them, and drive them out.", "12": "And God said unto Balaam, Thou shalt not go with them; thou shalt not curse the people: for they *are* blessed.", "13": "And Balaam rose up in the morning, and said unto the princes of Balak, Get you into your land: for the LORD refuseth to give me leave to go", "14": "And the princes of Moab rose up, and they went unto Balak, and said, Balaam refuseth to come", "15": "And Balak sent yet again princes, more, and more honourable", "16": "And they came to Balaam, and said to him, Thus saith Balak the son of Zippor, Let nothing, I pray thee, hinder thee from coming", "17": "For I will promote thee unto very great honour, and I will do whatsoever thou sayest unto me: come therefore, I pray thee, curse me this people.", "18": "And Balaam answered and said unto the servants of Balak, If Balak would give me his house full of silver and gold, I cannot go beyond the word of the LORD my God, to do less or more.", "19": "Now therefore, I pray you, tarry ye also here this night, that I may know what the LORD will say unto me more.", "20": "And God came unto Balaam at night, and said unto him, If the men come to call thee, rise up, *and* go with them; but yet the word which I shall say unto thee, that shalt thou do.", "21": "And Balaam rose up in the morning, and saddled his ass, and went with the princes of Moab.", "22": "And God's anger was kindled because he went: and the angel of the LORD stood in the way for an adversary against him. Now he was riding upon his ass, and his two servants", "23": "And the ass saw the angel of the LORD standing in the way, and his sword drawn in his hand: and the ass turned aside out of the way, and went into the field: and Balaam smote the ass, to turn her into the way.", "24": "But the angel of the LORD stood in a path of the vineyards, a wall *being* on this side, and a wall", "25": "And when the ass saw the angel of the LORD, she thrust herself unto the wall, and crushed Balaam's foot against the wall: and he smote her again.", "26": "And the angel of the LORD went further, and stood in a narrow place, where *was* no way to turn either to the right hand or to the left.", "27": "And when the ass saw the angel of the LORD, she fell down under Balaam: and Balaam's anger was kindled, and he smote the ass with a staff.", "28": "And the LORD opened the mouth of the ass, and she said unto Balaam, What have I done unto thee, that thou hast smitten me these three times?", "29": "And Balaam said unto the ass, Because thou hast mocked me: I would there were a sword in mine hand, for now would I kill", "30": "And the ass said unto Balaam, *Am* not I thine ass, upon which thou hast ridden ever since *I was* thine unto this day? was I ever wont to do so unto thee? And he said,", "31": "Then the LORD opened the eyes of Balaam, and he saw the angel of the LORD standing in the way, and his sword drawn in his hand: and he bowed down his head, and fell flat on his face.", "32": "And the angel of the LORD said unto him, Wherefore hast thou smitten thine ass these three times? behold, I went out to withstand thee, because *thy* way is perverse", "33": "And the ass saw me, and turned from me these three times: unless she had turned from me, surely now also I had slain thee, and saved her alive.", "34": "And Balaam said unto the angel of the LORD, I have sinned; for I knew not that thou stoodest in the way against me: now therefore, if it displease thee, I will get me back again.", "35": "And the angel of the LORD said unto Balaam, Go with the men: but only the word that I shall speak unto thee, that thou shalt speak. So Balaam went with the princes of Balak.", "36": "And when Balak heard that Balaam was come, he went out to meet him unto a city of Moab, which *is* in the border of Arnon, which *is* in the utmost coast.", "37": "And Balak said unto Balaam, Did I not earnestly send unto thee to call thee? wherefore camest thou not unto me? am I not able indeed to promote thee to honour?", "38": "And Balaam said unto Balak, Lo, I am come unto thee: have I now any power at all to say any thing? the word that God putteth in my mouth, that shall I speak.", "39": "And Balaam went with Balak, and they came unto Kirjathhuzoth.", "40": "And Balak offered oxen and sheep, and sent to Balaam, and to the princes", "41": "And it came to pass on the morrow, that Balak took Balaam, and brought him up into the high places of Baal, that thence he might see the utmost *part* of the people."}}, "tsk": {"1": [{"kopje": "de kinderen", "refs": ["Num 21:20", "Num 33:48-50", "Num 36:13", "Deut 34:1", "Deut 34:8"]}, {"kopje": "aan deze zijde", "refs": ["Num 32:19", "Num 34:15", "Deut 1:5", "Deut 3:8", "Joz 3:16"]}], "4": [{"kopje": "oudsten", "refs": ["Num 22:7", "Num 25:15-18", "Num 31:8", "Joz 13:21", "Joz 13:22"]}, {"kopje": "Nu zal", "refs": ["Num 24:17", "Jer 48:38"]}, {"kopje": "Balak", "refs": ["Num 22:2", "Richt 11:25"]}], ing/22/#v6", "ref": "Openb 22:6", "svLabel": null}, {"disp": "Openb 22:8", "href": "../../openbaring/22/#v8", "ref": "Openb 22:8", "svLabel": null}], "kinderen": []}]}]}, "39": {"nave": [{"topic": "Kirjath-huzoth", "href": "../../nave/k/#t-kirjath-huzoth", "kinderen": [{"label": "A residence of Balak", "href": "../../nave/k/?hl=Num.22.39#i12238", "refs": [{"disp": "Num 22:39", "href": "../../numeri/22/#v39", "ref": "Num 22:39", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Cities", "href": "../../torrey/c/#t-cities", "kinderen": [{"label": "Arranged in streets and lanes", "href": "../../torrey/c/?hl=Num.22.39#i3158", "refs": [{"disp": "Num 22:39", "href": "../../numeri/22/#v39", "ref": "Num 22:39", "svLabel": null}, {"disp": "Zach 8:5", "href": "../../zacharia/8/#v5", "ref": "Zach 8:5", "svLabel": null}, {"disp": "Luk 14:21", "href": "../../lukas/14/#v21", "ref": "Luk 14:21", "svLabel": null}], "kinderen": []}]}]}, "40": {"torrey": [{"topic": "Idolatry", "href": "../../torrey/i/#t-idolatry", "kinderen": [{"label": "Objects Of, Worshipped", "href": "../../torrey/i/?hl=Num.22.40#i9784", "refs": [], "kinderen": [{"label": "With sacrifices", "href": "../../torrey/i/?hl=Num.22.40#i9785", "refs": [{"disp": "Num 22:40", "href": "../../numeri/22/#v40", "ref": "Num 22:40", "svLabel": null}, {"disp": "2 Kon 10:24", "href": "../../2-koningen/10/#v24", "ref": "2 Kon 10:24", "svLabel": null}], "kinderen": []}]}]}]}, "41": {"nave": [{"topic": "High Places", "href": "../../nave/h/#t-high-places", "kinderen": [{"label": "Signify a place of idolatrous worship", "href": "../../nave/h/?hl=Num.22.41#i8839", "refs": [{"disp": "Num 22:41", "href": "../../numeri/22/#v41", "ref": "Num 22:41", "svLabel": null}, {"disp": "1 Kon 11:7", "href": "../../1-koningen/11/#v7", "ref": "1 Kon 11:7", "svLabel": null}, {"disp": "1 Kon 12:31", "href": "../../1-koningen/12/#v31", "ref": "1 Kon 12:31", "svLabel": null}, {"disp": "1 Kon 14:23", "href": "../../1-koningen/14/#v23", "ref": "1 Kon 14:23", "svLabel": null}, {"disp": "1 Kon 15:14", "href": "../../1-koningen/15/#v14", "ref": "1 Kon 15:14", "svLabel": null}, {"disp": "1 Kon 22:43", "href": "../../1-koningen/22/#v44", "ref": "1 Kon 22:44", "svLabel": "SV 44"}, {"disp": "2 Kon 17:9", "href": "../../2-koningen/17/#v9", "ref": "2 Kon 17:9", "svLabel": null}, {"disp": "2 Kon 17:29", "href": "../../2-koningen/17/#v29", "ref": "2 Kon 17:29", "svLabel": null}, {"disp": "Jer 7:31", "href": "../../jeremia/7/#v31", "ref": "Jer 7:31", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "High Places", "href": "../../torrey/h/#t-high-places", "kinderen": [{"label": "Mentioned In Scripture", "href": "../../torrey/h/?hl=Num.22.41#i8752", "refs": [], "kinderen": [{"label": "Baal", "href": "../../torrey/h/?hl=Num.22.41#i8755", "refs": [{"disp": "Num 22:41", "href": "../../numeri/22/#v41", "ref": "Num 22:41", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Idolatry", "href": "../../torrey/i/#t-idolatry", "kinderen": [{"label": "Objects Of, Worshipped", "href": "../../torrey/i/?hl=Num.22.41#i9784", "refs": [], "kinderen": [{"label": "On high places", "href": "../../torrey/i/?hl=Num.22.41#i9796", "refs": [{"disp": "Num 22:41", "href": "../../numeri/22/#v41", "ref": "Num 22:41", "svLabel": null}, {"disp": "Jer 2:20", "href": "../../jeremia/2/#v20", "ref": "Jer 2:20", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Zach 6:5": "En de Engel antwoordde, en zei tegen mij: Deze zijn de vier winden van de hemel, die uitgaan van waar zij stonden voor de Heere van de hele aarde.", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Jona 1:1": "Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Ps 59:16": "Laat hen zelfs omzwerven om eten; en laat hen vernachten, ook al zijn zij niet verzadigd.", "Num 23:1-24": "Toen zei Bileam tegen Balak: Bouw hier zeven altaren voor mij, en maak hier zeven stieren en zeven rammen voor mij klaar. Balak deed wat Bileam had gezegd; en Balak en Bileam offerden een stier en een ram op elk altaar. Toen zei Bileam tegen Balak: Blijf bij uw brandoffer staan, en ik zal weggaan; misschien zal de HEERE mij tegemoetkomen; en wat Hij mij laat zien, dat zal ik u bekendmaken. Toen ging hij naar de hoogte.", "Neh 13:1": "Op die dag werd er gelezen in het boek van Mozes, voor de oren van het volk; en daarin werd geschreven gevonden, dat de Ammonieten en Moabieten niet zouden komen in de gemeente van God, tot in eeuwigheid;", "Richt 16:28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "Openb 18:1-3": "En hierna zag ik een andere engel uit de hemel neerdalen, die grote macht had, en de aarde werd verlicht door zijn heerlijkheid. En hij riep met kracht, met een grote stem, en zei: Zij is gevallen, zij is gevallen, het grote Babylon, en is een woonplaats van duivels geworden, en een bewaarplaats van alle onreine geesten, en een bewaarplaats van alle onrein en gehaat gevogelte; Omdat alle volken hebben gedronken van de wijn van de toorn van haar hoererij, en de koningen van de aarde met haar gehoereerd hebben, en de kooplieden van de aarde rijk zijn geworden uit de kracht van haar weelde.", "Num 23:2": "Balak deed wat Bileam had gezegd; en Balak en Bileam offerden een stier en een ram op elk altaar.", "Jer 6:25": "Gaat niet uit in het veld, en wandelt niet op de weg; want het zwaard van de vijand is er, schrik van rondom!", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "Hand 3:17": "En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.", "Gen 18:30": "Verder zei hij: Laat de Heere toch niet boos worden, dat ik spreek; misschien zullen daar dertig gevonden worden! En Hij zei: Ik zal het niet doen, als Ik daar dertig zal vinden.", "Num 5:3": "Van de man tot de vrouw toe zult u hen wegzenden; tot buiten het leger zult u hen wegzenden; zodat zij hun legers niet verontreinigen, in welker midden Ik woon.", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Job 29:3-5": "Toen Hij Zijn lamp deed schijnen over mijn hoofd, en ik bij Zijn licht door de duisternis liep; Zoals ik was in de dagen van mijn jeugd, toen Gods vertrouwelijke omgang over mijn tent was; Toen de Almachtige nog met mij was, en mijn jongens rondom mij;", "Rom 8:22": "Want wij weten dat de hele schepping samen zucht en samen als in barensnood is, tot nu toe.", "1 Kon 13:7": "En de koning zei tegen de man van God: Kom met mij mee naar huis, en sterk u, en ik zal u een geschenk geven.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Ex 4:11": "En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE?", "Num 23:11": "Toen zei Balak tegen Bileam: Wat hebt u mij aangedaan? Ik heb u gehaald om mijn vijanden te vervloeken; maar zie, u hebt hen alleen maar gezegend!", "1 Tim 5:21": "Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Jer 17:18": "Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.", "Ps 109:29": "Laat mijn tegenstanders met schande bekleed worden, en laat hen zich met hun schande bedekken, als met een mantel.", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Gen 46:4": "Ik zal met u aftrekken naar Egypte, en Ik zal u ook weer laten optrekken; en Jozef zal zijn hand op uw ogen leggen.", "Ps 69:29": "Laat hen uitgedelgd worden uit het boek van het leven, en met de rechtvaardigen niet aangeschreven worden.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Ezra 5:5": "Doch het oog van hun God was over de oudsten van de Joden, zodat men hen niet kon tegenhouden, totdat de zaak bij Darius kwam, en zij daarna daarover een brief terugbrachten.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Joh 15:15": "Ik noem u niet meer dienstknechten; want de dienstknecht weet niet wat zijn heer doet; maar Ik heb u vrienden genoemd; want alles wat Ik van Mijn Vader gehoord heb, dat heb Ik u bekendgemaakt.", "Num 22:5-7": "Hij stuurde boden naar Bileam, de zoon van Beor, naar Pethor, dat aan de rivier ligt, in het land van de kinderen van zijn volk, om hem te roepen, en zei: Zie, er is een volk uit Egypte getrokken; zie, het bedekt het gezicht van het land, en het blijft recht tegenover mij liggen. En nu, kom toch, vervloek voor mij dit volk, want het is machtiger dan ik; misschien kan ik het dan verslaan, of uit het land verdrijven; want ik weet dat wie u zegent, gezegend is, en wie u vervloekt, vervloekt is. Toen gingen de oudsten van Moab en de oudsten van Midian, met het loon voor de waarzeggerij in hun hand; zo kwamen zij bij Bileam, en spraken tot hem de woorden van Balak.", "Num 21:20": "En van Bamoth tot het dal, dat in het veld van Moab is, bij de hoogte van Pisga, en dat uitziet over de wildernis.", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "1 Kon 19:7": "En de engel van de HEERE kwam voor de tweede keer terug, en raakte hem aan, en zei: Sta op, eet, want de weg zou te zwaar voor u zijn.", "Deut 11:29": "En het zal gebeuren, als de HEERE, uw God, u zal hebben binnengebracht in het land, waar u naartoe gaat, om dat te erven; dan zult u de zegen uitspreken op de berg Gerizim, en de vloek op de berg Ebal.", "Hand 8:9": "En er was een zekere man, met de naam Simon, die van tevoren in de stad toverij bedreef en het volk van Samaria versteld deed staan, terwijl hij van zichzelf zei dat hij iets groots was.", "2 Kon 1:15": "Toen sprak de Engel van de HEERE tot Elia: Ga met hem naar beneden; wees niet bang voor hem. En hij stond op, en ging met hem naar beneden naar de koning.", "1 Kor 1:19": "Want er is geschreven: Ik zal de wijsheid van de wijzen doen vergaan, en het verstand van de verstandigen zal Ik tenietdoen.", "Ex 3:2": "En de Engel van de HEERE verscheen hem in een vuurvlam uit het midden van een braambos; en hij zag, en zie, het braambos brandde in het vuur, en het braambos werd niet verteerd.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Ex 9:27": "Toen stuurde Farao mensen, en riep Mozes en Aäron, en zei tegen hen: Ik heb ditmaal gezondigd; de HEERE is rechtvaardig; ik daarentegen en mijn volk zijn goddelozen!", "1 Joh 4:18": "Er is in de liefde geen vrees, maar de volmaakte liefde drijft de vrees naar buiten; want de vrees heeft pijn, en die vreest, is niet volmaakt in de liefde.", "Dan 4:30": "Sprak de koning, en zei: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis van het koninkrijk, door de sterkte van mijn macht, en tot eer van mijn heerlijkheid!", "Ezech 29:19": "Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "1 Sam 3:20": "En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.", "Luk 1:37": "Want geen ding zal bij God onmogelijk zijn.", "Deut 33:2": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Num 21:6": "Toen zond de HEERE vurige slangen onder het volk, die het volk beten; en er stierf veel volk van Israël.", "Deut 11:30": "Zijn zij niet aan de overkant van de Jordaan, achter de weg van de ondergang van de zon, in het land van de Kanaänieten, die in het vlakke veld wonen, tegenover Gilgal, bij de eikenbossen van More?", "Hand 8:10": "Hem hingen zij allen aan, van klein tot groot, en zeiden: Deze man is de grote kracht van God.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "Jer 15:20": "Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE.", "Ex 4:24": "En het gebeurde onderweg, in de herberg, dat de HEERE hem tegenkwam, en zocht hem te doden.", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "Deut 33:29": "Gelukkig bent u, o Israël! wie is u gelijk? u bent een volk, verlost door de HEERE, het Schild van uw hulp, en Die een Zwaard is van uw hoogheid; daarom zullen uw vijanden zich geveinsd aan u onderwerpen, en u zult op hun hoogten treden!", "Num 12:6-8": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Ps 55:10": "Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.", "2 Kon 17:29": "Maar elk volk maakte zijn eigen goden; en zij zetten ze in de huizen van de hoogten, die de Samaritanen gemaakt hadden, elk volk in hun steden waar zij woonden.", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "1 Joh 1:3": "Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Hand 10:35": "maar in ieder volk is hij die Hem vreest en gerechtigheid doet, Hem aangenaam.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Jes 60:10": "En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Num 26:3": "Mozes dan en Eleazar, de priester, spraken hen aan, in de vlakke velden van Moab, aan de Jordaan bij Jericho, en zeiden:", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "2 Kron 36:23": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Ex 33:22": "En het zal gebeuren, wanneer Mijn heerlijkheid voorbijgaat, dat Ik u in een kloof van de steenrots zal zetten; en Ik zal u met Mijn hand overdekken, totdat Ik voorbijgegaan zal zijn.", "Gen 18:32": "Nog zei hij: Laat de Heere toch niet boos worden, dat ik alleen deze keer nog spreek: misschien zullen er tien gevonden worden. En Hij zei: Ik zal haar niet verwoesten omwille van de tien.", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "Spr 27:3": "Een steen is zwaar, en het zand gewichtig; maar de toorn van de dwaas is zwaarder dan die beide.", "Jer 18:21-23": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd. Laat er een geschrei uit hun huizen gehoord worden, wanneer U snel een bende over hen brengt; omdat zij een kuil gegraven hebben om mij te vangen, en strikken verborgen hebben voor mijn voeten. Doch U, HEERE, weet al hun plannen tegen mij, om mij te doden; maak geen verzoening over hun ongerechtigheid, en delg hun zonde niet uit van voor Uw aangezicht; maar laat hen neergeveld worden voor Uw aangezicht; handel zo met hen, in de tijd van Uw toorn.", "Spr 14:9": "Elke dwaas maakt de schuld belachelijk; maar onder de oprechten is goedwilligheid.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "Ezech 3:14": "Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.", "Ps 10:2": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben.", "Ex 20:24": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "Richt 13:13-21": "En de Engel van de HEERE zei tegen Manoach: Van alles wat Ik tegen de vrouw gezegd heb, moet zij zich weerhouden. Zij mag niets eten van wat van de wijnstok voortkomt; en wijn en sterke drank mag zij niet drinken, en ook niets van het onreine eten; alles wat Ik haar geboden heb, moet zij houden. Toen zei Manoach tegen de Engel van de HEERE: Laat ons U toch ophouden, en een geitenbokje voor U bereiden.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "Hos 12:6": "Namelijk, de Heere, de God van de heerscharen; Heere is Zijn gedenknaam.", "Hand 13:10": "O kind van de duivel, vol van alle bedrog en van alle arglistigheid, vijand van alle gerechtigheid, zult u niet ophouden de rechte wegen van de Heere te verdraaien?", "Luk 2:52": "En Jezus nam toe in wijsheid en grootte, en in genade bij God en de mensen.", "Gen 24:64": "Rebekka hief ook haar ogen op, en zij zag Izak; en zij liet zich van de kameel af glijden.", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Spr 28:8": "Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.", "Deut 31:6": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "1 Kon 22:6": "Toen verzamelde de koning van Israël de profeten, ongeveer vierhonderd man, en hij zei tegen hen: Zal ik tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want de Heere zal ze in de hand van de koning geven.", "Joz 12:1": "Dit zijn nu de koningen van het land, die de kinderen van Israël verslagen hebben, en van wie zij het land erfelijk in bezit namen, aan de overkant van de Jordaan, naar de zonsopgang toe; vanaf de beek Arnon tot de berg Hermon, en de hele vlakte naar het oosten:", "Ps 105:17": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf.", "Luk 15:10": "Zo, zeg Ik u, is er blijdschap voor de engelen van God over één zondaar die zich bekeert.", "Ps 109:18": "En laat hij bekleed zijn met de vloek, als met zijn kleed, en laat die gaan tot in zijn binnenste als het water, en als de olie in zijn beenderen.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Job 34:31": "Zeker heeft hij tot God gezegd: Ik heb Uw straf verdragen, ik zal het niet verderven.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Jes 54:8": "In een kleine toorn heb Ik Mijn aangezicht van u een ogenblik verborgen; maar met eeuwige goedertierenheid zal Ik Mij over u ontfermen, zegt de HEERE, uw Verlosser.", "Ps 78:31": "Toen Gods toorn tegen hen opging, zodat Hij van hun vetste doodde, en de uitgelezen mannen van Israël neervelde.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Ps 78:30": "Zij waren nog niet vervreemd van hun lust; hun spijs was nog in hun mond,", "Gen 22:16-18": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt; Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten. En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "Ps 148:2": "Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen!", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Ps 115:15": "U bent door de HEERE gezegend, Die de hemel en de aarde gemaakt heeft.", "Ex 18:7": "Toen ging Mozes naar buiten, zijn schoonvader tegemoet, en hij boog zich, en kuste hem; en zij vroegen elkaar naar hun welstand, en zij gingen naar de tent.", "Joz 8:34": "En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.", "Jes 47:13": "U bent moe geworden van de veelheid van uw raadslagen; laat nu opstaan die de hemel waarnemen, die naar de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen die over u komen zullen.", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Ef 2:16": "en opdat Hij die beiden met God in één lichaam zou verzoenen door het kruis, nadat Hij de vijandschap daaraan gedood had.", "Deut 2:30": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.", "Ps 35:4": "Laat hen beschaamd worden en te schande, die mijn ziel zoeken; laat hen achterwaarts gedreven worden en schaamrood, die kwaad tegen mij bedenken.", "1 Sam 2:6-9": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Num 24:4": "Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Deut 2:36": "Van Aroer af, dat aan de oever van de beek Arnon is, en de stad die aan de beek is, tot Gilead toe, was er geen stad die voor ons te sterk was; de HEERE, onze God, gaf dat alles aan ons over.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "Neh 6:16": "En het gebeurde, toen al onze vijanden dit hoorden, dat alle heidenvolken die rondom ons waren, bevreesd werden en zeer in aanzien daalden in hun eigen ogen; want zij begrepen dat dit werk door onze God tot stand gebracht was.", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Ezech 37:1": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.", "Num 33:48-50": "En zij vertrokken van de bergen Abarim, en legerden zich in de vlakke velden van de Moabieten, aan de Jordaan bij Jericho. En zij legerden zich aan de Jordaan van Beth-jesimoth, tot aan Abel-sittim, in de vlakke velden van de Moabieten. En de HEERE sprak tot Mozes, in de vlakke velden van de Moabieten, aan de Jordaan bij Jericho, en zei:", "Hos 13:11": "Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.", "Deut 34:9-11": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "Num 24:11": "En nu, pak u weg naar uw plaats! Ik had gezegd dat ik u hoog zou eren; maar zie, de HEERE heeft u die eer onthouden!", "Ezech 3:10-12": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Ps 18:20": "En Hij voerde mij uit in de ruimte, Hij rukte mij eruit, want Hij had lust aan mij.", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Openb 5:2": "En ik zag een sterke engel, die met een luide stem uitriep: Wie is waard het boek te openen en zijn zegels te verbreken?", "Ps 8:6": "En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Gen 32:28": "Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.", "2 Tess 2:9-12": "hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden. En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven;", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "1 Kor 1:28": "En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken;", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Num 23:16": "Toen de HEERE Bileam ontmoette, legde Hij het woord in zijn mond, en Hij zei: Keer terug naar Balak, en spreek zo.", "Ps 25:3": "Gimel. Ja, allen die U verwachten, zullen niet beschaamd worden; zij zullen beschaamd worden, die trouweloos handelen zonder oorzaak.", "Ex 19:3": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:", "Zach 8:5": "En de straten van die stad zullen vol worden met jongens en meisjes, spelend op haar straten.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Ex 1:7-10": "werden de kinderen van Israël vruchtbaar en namen ze sterk in aantal toe, en zij vermeerderden, en werden buitengewoon machtig, zodat het land met hen vervuld werd. Daarna kwam er een nieuwe koning over Egypte aan de macht, die Jozef niet gekend had; die tegen zijn volk zei: Zie, het volk van de kinderen van Israël is talrijk, ja, machtiger dan wij.", "Spr 26:2": "Zoals de mus wegzweeft, zoals een zwaluw wegvliegt, zo zal een vloek die zonder oorzaak is, niet komen.", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "1 Kor 1:27": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen;", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Gen 6:8": "Maar Noach vond genade in de ogen van de HEERE.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Dan 7:2": "Daniël antwoordde en zei: Ik zag in mijn gezicht bij nacht, en zie, de vier winden van de hemel braken los op de grote zee.", "Matt 4:8": "Opnieuw nam de duivel Hem mee, op een zeer hoge berg, en toonde Hem al de koninkrijken van de wereld, en hun heerlijkheid;", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "Ef 2:18": "Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Ps 54:7": "Hij zal dit kwaad aan mijn belagers vergelden; roei hen uit door Uw waarheid.", "Richt 13:3": "En een Engel van de HEERE verscheen aan deze vrouw, en Hij zei tegen haar: Zie toch, u bent onvruchtbaar en hebt geen kinderen gebaard; maar u zult zwanger worden en een zoon baren.", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Openb 17:17": "Want God heeft hun in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn.", "1 Kon 12:31": "Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren.", "2 Tim 4:15": "Wees ook u voor hem op uw hoede, want hij heeft onze woorden sterk tegengestaan.", "Ps 70:4": "Laat hen terugkeren tot loon van hun beschaming, die daar zeggen: Ha, ha!", "Num 21:14": "(Daarom wordt gezegd in het boek van de oorlogen van de HEERE: Tegen Waheb, in een wervelwind, en tegen de beken van Arnon,", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Jes 44:28": "Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "1 Sam 25:23": "Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde.", "Job 5:12": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.", "Tit 1:11": "hun moet men de mond snoeren, want zij brengen hele huizen in verwarring, en leren wat niet behoort, om het schandelijke gewin.", "Num 23:13": "Toen zei Balak tegen hem: Kom toch met mij mee naar een andere plaats, vanwaar u hem zult zien; u zult alleen zijn uiterste deel zien, maar hem niet helemaal zien; en vervloek hem daarvandaan voor mij!", "2 Sam 12:1": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.", "Ps 132:13": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:", "Gen 4:9": "En de HEERE zei tegen Kaïn: Waar is Abel, uw broeder? En hij zei: Ik weet het niet; ben ik de hoeder van mijn broeder?", "Gen 3:9-11": "En de HEERE God riep Adam, en zei tegen hem: Waar bent u? En hij zei: Ik hoorde Uw stem in de hof, en ik werd bang, want ik ben naakt; daarom verborg ik mij. En Hij zei: Wie heeft u verteld dat u naakt bent? Hebt u van die boom gegeten, waarvan Ik u geboden had daarvan niet te eten?", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "Ezech 21:27": "Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.", "Num 23:3": "Toen zei Bileam tegen Balak: Blijf bij uw brandoffer staan, en ik zal weggaan; misschien zal de HEERE mij tegemoetkomen; en wat Hij mij laat zien, dat zal ik u bekendmaken. Toen ging hij naar de hoogte.", "Ps 36:7": "Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.", "1 Joh 3:19": "En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.", "Deut 3:8": "Zo namen wij in die tijd het land uit de hand van de twee koningen van de Amorieten, die aan deze kant van de Jordaan waren, van de beek Arnon tot de berg Hermon toe;", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Ps 94:19": "Toen mijn gedachten in mij talrijk werden, hebben Uw vertroostingen mijn ziel verkwikt.", "Micha 7:11": "Ten dage dat Hij uw muren zal herbouwen, te dien dage zal het besluit ver heengaan.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Jer 24:4": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Ps 5:11": "Verklaar hen schuldig, o God; laat hen vervallen van hun raadslagen; drijf hen weg om de veelheid van hun overtredingen, want zij zijn opstandig tegen U.", "1 Sam 3:21": "En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "1 Sam 10:6": "En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "Luk 12:9": "Maar wie Mij verloochenen zal voor de mensen, die zal verloochend worden voor de engelen van God.", "Num 26:63": "Dat zijn de getelden van Mozes en Eleazar, de priester, die de kinderen van Israël telden in de vlakke velden van Moab, aan de Jordaan bij Jericho.", "1 Kron 5:26": "Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag.", "1 Sam 9:8": "En de knecht antwoordde Saul verder en zei: Zie, ik heb bij me het vierde deel van een zilveren sikkel; dat zal ik de man van God geven, opdat hij ons onze weg wijst.", "Num 24:1": "Toen Bileam zag dat het goed was in de ogen van de HEERE dat hij Israël zegende, ging hij ditmaal niet, zoals de andere keren, op zoek naar toverijen; maar hij richtte zijn gezicht naar de woestijn.", "Ex 10:1-20": "Daarna zei de HEERE tegen Mozes: Ga naar Farao; want Ik heb zijn hart verzwaard, ook het hart van zijn knechten, opdat Ik deze Mijn tekenen in hun midden zou stellen; En opdat u voor de oren van uw kinderen en uw kleinkinderen kunt vertellen wat Ik in Egypte gedaan heb, en Mijn tekenen, die Ik onder hen gedaan heb; opdat u weet dat Ik de HEERE ben. Zo gingen Mozes en Aäron naar Farao, en zeiden tegen hem: Zo zegt de HEERE, de God van de Hebreeën: Hoe lang weigert u zich voor Mijn aangezicht te verootmoedigen? Laat Mijn volk gaan, dat zij Mij dienen.", "Ps 35:8": "De verwoesting overkomt hem, zodat hij het niet weet, en zijn net, dat hij verborgen heeft, vangt hemzelf; hij valt daarin met verwoesting.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Openb 19:10": "En ik viel neer voor zijn voeten, om hem te aanbidden, en hij zei tegen mij: Zie toe dat u dat niet doet; ik ben uw mededienstknecht, en uw broeder, die de getuigenis van Jezus hebben; aanbid God. Want de getuigenis van Jezus is de geest van de profetie.", "Deut 34:8": "En de kinderen van Israël beweenden Mozes, in de vlakke velden van Moab, dertig dagen; en de dagen van het wenen, van de rouw over Mozes, kwamen ten einde.", "Joz 24:9": "Ook maakte Balak zich op, de zoon van Zippor, de koning van de Moabieten, en hij streed tegen Israël; en hij zond heen, en liet Bileam, de zoon van Beor, roepen, opdat hij u vervloeken zou.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "Gen 18:26": "Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen.", "Gen 18:2": "En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Dan 5:17": "Toen antwoordde Daniël, en zei voor de koning: Houd uw gaven voor uzelf, en geef uw beloningen aan een ander; ik zal toch het schrift voor de koning lezen, en de uitleg zal ik hem bekendmaken.", "Num 31:8": "Daarbij doodden zij, behalve hun overige gesneuvelden, de koningen van de Midianieten: Evi, en Rekem, en Zur, en Hur, en Reba, vijf koningen van de Midianieten; ook doodden zij met het zwaard Bileam, de zoon van Beor.", "Num 22:15-17": "Doch Balak ging door met het sturen van vorsten, meer en aanzienlijker dan die er waren; Zij kwamen bij Bileam, en zeiden tegen hem: Zo zegt Balak, de zoon van Zippor: Laat u toch niet weerhouden om naar mij te komen! Want ik zal u zeer hoog eren, en al wat u tegen mij zult zeggen, dat zal ik doen; kom toch, vervloek voor mij dit volk!", "Dan 4:31": "Dit woord was nog in de mond van de koning, toen er een stem uit de hemel viel: U, koning Nebukadnezar, wordt gezegd: Het koninkrijk is van u weggegaan.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Spr 3:4": "En vind gunst en goed verstand, in de ogen van God en van de mensen.", "Num 22:23-30": "De ezelin nu zag de Engel van de HEERE staan in de weg, met Zijn getrokken zwaard in Zijn hand; daarom week de ezelin van de weg af, en ging het veld in. Toen sloeg Bileam de ezelin, om haar weer op de weg te laten gaan. Maar de Engel van de HEERE stond op een pad tussen de wijngaarden, met een muur aan deze en een muur aan de andere zijde. Toen de ezelin de Engel van de HEERE zag, klemde zij zichzelf tegen de wand, en klemde Bileams voet tegen de wand; daarom ging hij door met haar te slaan.", "Est 5:11": "En Haman vertelde hun over de heerlijkheid van zijn rijkdom, en de veelheid van zijn zonen, en alles waarin de koning hem groot gemaakt had, en waarin hij hem verheven had boven de vorsten en dienaren van de koning.", "Num 22:21-33": "Toen stond Bileam 's morgens op, en zadelde zijn ezelin, en hij trok heen met de vorsten van Moab. Doch de toorn van God ontstak, omdat hij heenging; en de Engel van de HEERE stelde Zich in de weg, als tegenpartij tegen hem; hij reed op zijn ezelin, en twee van zijn knechten waren bij hem. De ezelin nu zag de Engel van de HEERE staan in de weg, met Zijn getrokken zwaard in Zijn hand; daarom week de ezelin van de weg af, en ging het veld in. Toen sloeg Bileam de ezelin, om haar weer op de weg te laten gaan.", "Jes 5:2": "En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht.", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Spr 28:6": "De arme, die in zijn oprechtheid wandelt, is beter dan wie verkeerd is van wegen, al is hij rijk.", "Num 24:16": "Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.", "Gen 13:2": "En Abram was zeer rijk, in vee, in zilver, en in goud.", "Jes 47:12": "Sta nu met uw bezweringen, en met de veelheid van uw toverijen, waarin u gearbeid hebt van uw jeugd af; misschien kunt u voordeel doen, misschien kunt u zich sterken.", "Matt 7:22": "Velen zullen op die dag tegen Mij zeggen: Heere, Heere! Hebben wij niet in Uw Naam geprofeteerd, en in Uw Naam demonen uitgeworpen, en in Uw Naam veel krachten gedaan?", "Matt 4:11": "Toen liet de duivel Hem los; en zie, de engelen kwamen naar Hem toe, en dienden Hem.", "Mark 1:13": "En Hij was daar in de woestijn veertig dagen, beproefd door de satan; en Hij was bij de wilde dieren; en de engelen dienden Hem.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Luk 9:31": "die in heerlijkheid verschenen en spraken over Zijn heengaan, dat Hij te Jeruzalem zou volbrengen.", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Jer 12:3": "Maar U, HEERE, kent mij, U ziet mij, en proeft mijn hart, dat het met U is. Ruk hen uit als schapen ter slachting, en heilig hen tot de dag van de doding.", "Num 36:13": "Dat zijn de geboden en de rechten die de HEERE door de dienst van Mozes aan de kinderen van Israël geboden heeft, in de vlakke velden van de Moabieten, aan de Jordaan bij Jericho.", "Matt 24:24": "Want er zullen valse christussen en valse profeten opstaan, en zij zullen grote tekenen en wonderen doen, zodat zij, als het mogelijk was, ook de uitverkorenen zouden misleiden.", "Ef 1:6": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Ps 103:20": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord.", "Gen 22:11": "Maar de Engel van de HEERE riep tot hem vanuit de hemel, en zei: Abraham, Abraham! En hij zei: Zie, hier ben ik!", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Deut 34:1": "Toen ging Mozes op vanaf de vlakke velden van Moab, naar de berg Nebo, op de hoogten van Pisga, die recht tegenover Jericho ligt; en de HEERE liet hem het hele land zien: Gilead tot Dan toe;", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Dan 10:7": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "Joh 18:6": "Toen Hij dan tegen hen zei: Ik ben het, gingen zij achteruit en vielen op de grond.", "Rom 4:6": "Zoals ook David de mens gelukkig noemt, aan wie God de rechtvaardigheid toerekent zonder werken:", "Jes 37:29": "Om uw woede tegen Mij, en dat uw onrust voor Mijn oren is opgekomen, zal Ik Mijn haak in uw neus leggen, en Mijn bit in uw lippen, en Ik zal u laten terugkeren langs de weg waarlangs u gekomen bent.", "1 Sam 2:26": "En de jongen Samuël nam toe, en werd groot en aangenaam, zowel bij de HEERE als ook bij de mensen.", "Spr 21:18": "De goddeloze is een rantsoen voor de rechtvaardigen, en de trouweloze voor de oprechten.", "1 Petr 1:12": "Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Spr 19:21": "In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.", "Joh 14:16-21": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid; Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn. Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Job 33:15-17": "In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding; Opdat Hij de mens afwendt van zijn werk, en van de man de hoogmoed verbergt;", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "Joh 11:51": "En dit zei hij niet uit zichzelf; maar omdat hij dat jaar hogepriester was, profeteerde hij dat Jezus zou sterven voor het volk;", "Openb 5:9-11": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie; en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde. En ik zag, en ik hoorde een stem van veel engelen rondom de troon, en van de dieren, en van de oudsten; en hun aantal was tienduizend maal tienduizend, en duizend maal duizend;", "Ps 81:13": "Daarom heb Ik hen overgegeven aan het goeddunken van hun hart, zodat zij wandelden in hun eigen raadslagen.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning
