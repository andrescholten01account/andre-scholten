edroogde druiven eten.","4":"Al de dagen van zijn Nazireeërschap zal hij niets eten van wat van de wijnstok van de wijn gemaakt is, van de kernen af tot de basten toe.","5":"Al de dagen van de gelofte van zijn Nazireeërschap zal het scheermes over zijn hoofd niet gaan; totdat die dagen vervuld zullen zijn, die hij zich voor de HEERE zal hebben afgezonderd, zal hij heilig zijn, en de lokken van het haar van zijn hoofd laten groeien.","6":"Al de dagen die hij zich voor de HEERE zal hebben afgezonderd, zal hij bij het lichaam van een dode niet komen.","7":"Om zijn vader of om zijn moeder, om zijn broeder of om zijn zuster, om hen zal hij zich niet verontreinigen, als zij dood zijn; want het Nazireeërschap van zijn God is op zijn hoofd.","8":"Al de dagen van zijn Nazireeërschap is hij voor de HEERE heilig.","9":"En als degene onvoorziens, snel bij hem gestorven is, waardoor hij het hoofd van zijn Nazireeërschap zou hebben verontreinigd, dan zal hij op de dag van zijn reiniging zijn hoofd scheren; op de zevende dag zal hij het scheren.","10":"En op de achtste dag zal hij twee tortelduiven of twee jonge duiven brengen tot de priester, tot de deur van de tent der samenkomst.","11":"De priester nu zal er een bereiden tot zondoffer, en een tot brandoffer, en zal voor hem verzoening doen, omdat hij aan het dode lichaam gezondigd heeft; zo zal hij zijn hoofd op diezelfde dag heiligen.","12":"Daarna zal hij de dagen van zijn Nazireeërschap voor de HEERE afzonderen, en een eenjarig lam brengen als schuldoffer; en de vorige dagen zullen vervallen, omdat zijn Nazireeërschap verontreinigd was.","13":"En dit is de wet van de Nazireeër: op de dag dat de dagen van zijn Nazireeërschap vervuld zullen zijn, zal hij dit brengen tot de deur van de tent der samenkomst.","14":"Hij dan zal als zijn offer aan de HEERE offeren een volkomen eenjarig lam als brandoffer, en een volkomen eenjarig ooilam als zondoffer, en een volkomen ram als dankoffer.","15":"En een korf ongezuurde koeken, koeken van meelbloem, met olie gemengd, en ongezuurde vladen, met olie bestreken, alsook hun spijsoffer en hun drankoffers;","16":"En de priester zal het voor het aangezicht van de HEERE brengen, en zal zijn zondoffer en zijn brandoffer bereiden.","17":"Hij zal ook de ram als dankoffer voor de HEERE bereiden, met de korf ongezuurde koeken; en de priester zal zijn spijsoffer en zijn drankoffer bereiden.","18":"Dan zal de Nazireeër, aan de deur van de tent der samenkomst, het hoofd van zijn Nazireeërschap scheren; en hij zal het hoofdhaar van zijn Nazireeërschap nemen, en het leggen op het vuur dat onder het dankoffer is.","19":"Daarna zal de priester een gekookte schouder nemen van de ram, en een ongezuurde koek uit de korf, en een ongezuurde vlade; en hij zal ze op de handen van de Nazireeër leggen, nadat hij zijn Nazireeërschap afgeschoren heeft.","20":"En de priester zal die bewegen als beweegoffer, voor het aangezicht van de HEERE; het is een heilig deel voor de priester, met de borst van het beweegoffer en met de schouder van het hefoffer; en daarna zal die Nazireeër wijn drinken.","21":"Dit is de wet van de Nazireeër, die zijn offer aan de HEERE voor zijn Nazireeërschap zal hebben beloofd, naast wat zijn hand nog meer verkrijgen zal; naar zijn gelofte, die hij beloofd zal hebben, zo zal hij doen, naar de wet van zijn Nazireeërschap.","22":"En de HEERE sprak tot Mozes en zei:","23":"Spreek tot Aäron en zijn zonen en zeg: Zo zult u de kinderen van Israël zegenen, door tot hen te zeggen:","24":"De HEERE zegent u, en behoedt u!","25":"De HEERE doet Zijn aangezicht over u lichten, en is u genadig!","26":"De HEERE verheft Zijn aangezicht over u, en geeft u vrede!","27":"Zo zullen zij Mijn Naam op de kinderen van Israël leggen; en Ik zal hen zegenen."},"SV":{"1":"En de HEERE sprak tot Mozes, zeggende:","2":"Spreek tot de kinderen Israëls, en zeg tot hen: Wanneer een man of een vrouw zich afgescheiden zal hebben, belovende de gelofte eens Nazireërs, om zich den HEERE af te zonderen;","3":"Van wijn en sterken drank zal hij zich afzonderen; wijnedik, en edik van sterken drank zal hij niet drinken, noch enige vochtigheid van druiven zal hij drinken, noch verse of gedroogde druiven eten.","4":"Al de dagen van zijn Nazireërschap zal hij niet eten van iets, dat van den wijnstok des wijns gemaakt is, van de kernen af tot de basten toe.","5":"Al de dagen der gelofte van zijn Nazireërschap zal het scheermes over zijn hoofd niet gaan; totdat die dagen vervuld zullen zijn, die hij zich den HEERE zal afgezonderd hebben, zal hij heilig zijn, latende de lokken van het haar zijns hoofds wassen.","6":"Al de dagen, die hij zich den HEERE zal afgezonderd hebben, zal hij tot het lichaam eens doden niet gaan.","7":"Om zijn vader of om zijn moeder, om zijn broeder of om zijn zuster, om hen zal hij zich niet verontreinigen, als zij dood *zijn*; want het Nazireërschap zijns Gods is op zijn hoofd.","8":"Al de dagen van zijn Nazireërschap is hij den HEERE heilig.","9":"En zo de gestorvene bij hem onvoorziens haastelijk gestorven ware, dat hij het hoofd van zijn Nazireërschap zou verontreinigd hebben, zo zal hij op den dag zijner reiniging zijn hoofd bescheren; op den zevenden dag zal hij het bescheren.","10":"En op den achtsten dag zal hij twee tortelduiven, of twee jonge duiven brengen tot den priester, tot de deur van de tent der samenkomst.","11":"De priester nu zal een bereiden ten zondoffer, en een ten brandoffer, en zal voor hem verzoening doen, van dat hij aan het dode lichaam gezondigd heeft; alzo zal hij zijn hoofd op dienzelfden dag heiligen.","12":"Daarna zal hij de dagen van zijn Nazireërschap den HEERE afzonderen, en zal een lam, dat eenjarig is, brengen ten schuldoffer; en de vorige dagen zullen vallen, omdat zijn Nazireërschap verontreinigd was.","13":"En dit is de wet des Nazireërs: op den dag, als de dagen van zijn Nazireërschap zullen vervuld zijn, zal hij dit brengen tot de deur van de tent der samenkomst.","14":"Hij dan zal tot zijn offerande den HEERE offeren een volkomen eenjarig lam ten brandoffer, en een volkomen eenjarig ooilam ten zondoffer, en een volkomen ram ten dankoffer.","15":"En een korf ongezuurde *koeken*, koeken van meelbloem, met olie gemengd, en ongezuurde vladen, met olie bestreken, mitsgaders hun spijsoffer, en hun drankofferen;","16":"En de priester zal het voor het aangezicht des HEEREN brengen, en zal zijn zondoffer en zijn brandoffer bereiden.","17":"Hij zal ook den ram ten dankoffer den HEERE bereiden, met den korf der ongezuurde *koeken*; en de priester zal zijn spijsoffer en zijn drankoffer bereiden.","18":"Alsdan zal de Nazireër, aan de deur van de tent der samenkomst, het hoofd van zijn Nazireërschap bescheren; en hij zal het hoofdhaar van zijn Nazireërschap nemen, en hij zal het leggen op het vuur, dat onder het dankoffer is.","19":"Daarna zal de priester een gezoden schouder nemen van den ram, en een ongezuurden koek uit den korf, en een ongezuurde vlade; en hij zal ze op de handen des Nazireërs leggen, nadat hij zijn Nazireërschap afgeschoren heeft.","20":"En de priester zal die bewegen ten beweegoffer, voor het aangezicht des HEEREN; het is een heilig ding voor den priester, met de borst des beweegoffers, en met den schouder des hefoffers; en daarna zal die Nazireër wijn drinken.","21":"Dit is de wet des Nazireërs, die zijn offerande den HEERE voor zijn Nazireërschap zal beloofd hebben, behalve wat zijn hand bekomen zal; naar zijn gelofte, welke hij beloofd zal hebben, alzo zal hij doen, naar de wet van zijn Nazireërschap.","22":"En de HEERE sprak tot Mozes, zeggende:","23":"Spreek tot Aäron en zijn zonen, zeggende: Alzo zult gijlieden de kinderen Israëls zegenen, zeggende tot hen:","24":"De HEERE zegene u, en behoede u!","25":"De HEERE doe Zijn aangezicht over u lichten, en zij u genadig!","26":"De HEERE verheffe Zijn aangezicht over u, en geve u vrede!","27":"Alzo zullen zij Mijn Naam op de kinderen Israëls leggen; en Ik zal hen zegenen."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Speak unto the children of Israel, and say unto them, When either man or woman shall separate *themselves* to vow a vow of a Nazarite, to separate *themselves* unto the LORD:","3":"He shall separate *himself* from wine and strong drink, and shall drink no vinegar of wine, or vinegar of strong drink, neither shall he drink any liquor of grapes, nor eat moist grapes, or dried.","4":"All the days of his separation shall he eat nothing that is made of the vine tree, from the kernels even to the husk.","5":"All the days of the vow of his separation there shall no razor come upon his head: until the days be fulfilled, in the which he separateth *himself* unto the LORD, he shall be holy, *and* shall let the locks of the hair of his head grow.","6":"All the days that he separateth *himself* unto the LORD he shall come at no dead body.","7":"He shall not make himself unclean for his father, or for his mother, for his brother, or for his sister, when they die: because the consecration of his God *is* upon his head.","8":"All the days of his separation he *is* holy unto the LORD.","9":"And if any man die very suddenly by him, and he hath defiled the head of his consecration; then he shall shave his head in the day of his cleansing, on the seventh day shall he shave","10":"And on the eighth day he shall bring two turtles, or two young pigeons, to the priest, to the door of the tabernacle of the congregation:","11":"And the priest shall offer the one for a sin offering, and the other for a burnt offering, and make an atonement for him, for that he sinned by the dead, and shall hallow his head that same day.","12":"And he shall consecrate unto the LORD the days of his separation, and shall bring a lamb of the first year for a trespass offering: but the days that were before shall be lost, because his separation was defiled.","13":"And this *is* the law of the Nazarite, when the days of his separation are fulfilled: he shall be brought unto the door of the tabernacle of the congregation:","14":"And he shall offer his offering unto the LORD, one he lamb of the first year without blemish for a burnt offering, and one ewe lamb of the first year without blemish for a sin offering, and one ram without blemish for peace offerings,","15":"And a basket of unleavened bread, cakes of fine flour mingled with oil, and wafers of unleavened bread anointed with oil, and their meat offering, and their drink offerings.","16":"And the priest shall bring *them* before the LORD, and shall offer his sin offering, and his burnt offering:","17":"And he shall offer the ram *for* a sacrifice of peace offerings unto the LORD, with the basket of unleavened bread: the priest shall offer also his meat offering, and his drink offering.","18":"And the Nazarite shall shave the head of his separation *at* the door of the tabernacle of the congregation, and shall take the hair of the head of his separation, and put *it* in the fire which *is* under the sacrifice of the peace offerings.","19":"And the priest shall take the sodden shoulder of the ram, and one unleavened cake out of the basket, and one unleavened wafer, and shall put *them* upon the hands of the Nazarite, after *the hair of* his separation is shaven:","20":"And the priest shall wave them *for* a wave offering before the LORD: this *is* holy for the priest, with the wave breast and heave shoulder: and after that the Nazarite may drink wine.","21":"This *is* the law of the Nazarite who hath vowed, *and of* his offering unto the LORD for his separation, beside *that* that his hand shall get: according to the vow which he vowed, so he must do after the law of his separation.","22":"And the LORD spake unto Moses, saying,","23":"Speak unto Aaron and unto his sons, saying, On this wise ye shall bless the children of Israel, saying","24":"The LORD bless thee, and keep","25":"The LORD make his face shine upon thee, and be gracious","26":"The LORD lift up his countenance upon thee, and give thee peace.","27":"And they shall put my name upon the children of Israel; and I will bless"}},"tsk":{"2":[{"kopje":"Wanneer","refs":["Num 6:5","Num 6:6","Ex 33:16","Lev 20:26","Spr 18:1","Rom 1:1","2 Kor 6:16","Gal 1:15","Hebr 7:27"]},{"kopje":"zich afgescheiden zal hebben","refs":["Lev 27:2"]},{"kopje":"te beloven","refs":["Lev 27:2","Richt 13:5","1 Sam 1:28","Amos 2:11","Amos 2:12","Luk 1:15","Hand 21:23","Hand 21:24"]}],"4":[{"kopje":"Nazireeërschap","refs":["Num 6:5","Num 6:8","Num 6:9","Num 6:12","Num 6:13","Num 6:18","Num 6:19","Num 6:21"]}],"5":[{"kopje":"scheermes","refs":["Richt 13:5","Richt 16:17","Richt 16:19","1 Sam 1:11","Klaagl 4:7","Klaagl 4:8","1 Kor 11:10-15"]}],"6":[{"kopje":"zal hij komen","refs":["Num 19:11-16","Lev 19:28","Jer 16:5","Jer 16:6","Ezech 24:16-18","Matt 8:21","Matt 8:22","Luk 9:59","Luk 9:60","2 Kor 5:16"]}],"7":[{"kopje":"verontreinigen","refs":["Num 9:6","Lev 21:1","Lev 21:2","Lev 21:10-12","Ezech 44:25"]},{"kopje":"Nazireeërschap","refs":["1 Kor 11:10"]}],"9":[{"kopje":"dan zal hij","refs":["Num 19:14-19"]},{"kopje":"scheren","refs":["Num 6:18","Hand 18:18","Hand 21:23","Hand 21:24","Fil 3:8","Fil 3:9"]}],"11":[{"kopje":"bereiden","refs":["Lev 5:8-10","Lev 14:30","Lev 14:31"]},{"kopje":"en zal","refs":["Num 6:5"]}],"12":[{"kopje":"schuldoffer","refs":["Lev 5:6","Lev 14:24"]},{"kopje":"en de vorige dagen","refs":["Ezech 18:24","Matt 3:15","Matt 24:13","Joh 8:29-31","Jak 2:10","2 Joh 1:8"]}],"13":[{"kopje":"vervuld zullen zijn","refs":["Hand 21:26"]}],"14":[{"kopje":"een volkomen eenjarig lam","refs":["Lev 1:10-13","1 Kron 15:26","1 Kron 15:28","1 Kron 15:29"]},{"kopje":"een volkomen eenjarig ooilam","refs":["Lev 4:2","Lev 4:3","Lev 4:27","Lev 4:32","Mal 1:13","Mal 1:14","1 Petr 1:19"]},{"kopje":"een volkomen ram","refs":["Lev 3:6"]}],"15":[{"kopje":"een korf","refs":["Lev 2:4","Lev 8:2","Lev 9:4","Joh 6:50-59"]},{"kopje":"bestreken","refs":["Ex 29:2"]},{"kopje":"drankoffers","refs":["Num 15:5","Num 15:7","Num 15:10","Jes 62:9","Joë n> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, When either <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> or <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> shall <span class=\"wl wl-kjv\" data-code=\"H6381\">separate</span> themselves to <span class=\"wl wl-kjv\" data-code=\"H5087\">vow</span> a <span class=\"wl wl-kjv\" data-code=\"H5088\">vow</span> of a <span class=\"wl wl-kjv\" data-code=\"H5139\">Nazarite,</span> to <span class=\"wl wl-kjv\" data-code=\"H5144\">separate</span> themselves unto the LORD:","3":"He shall <span class=\"wl wl-kjv\" data-code=\"H5144\">separate</span> himself from <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> and strong <span class=\"wl wl-kjv\" data-code=\"H7941\">drink,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> no <span class=\"wl wl-kjv\" data-code=\"H2558\">vinegar</span> of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> or <span class=\"wl wl-kjv\" data-code=\"H2558\">vinegar</span> of strong <span class=\"wl wl-kjv\" data-code=\"H7941\">drink,</span> neither shall he <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> any <span class=\"wl wl-kjv\" data-code=\"H4952\">liquor</span> of <span class=\"wl wl-kjv\" data-code=\"H6025\">grapes,</span> nor <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3892\">moist</span> <span class=\"wl wl-kjv\" data-code=\"H6025\">grapes,</span> or dried.","4":"All the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H5145\">separation</span> shall he <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> nothing that is <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> of the <span class=\"wl wl-kjv\" data-code=\"H3196\">vine</span> <span class=\"wl ta-code=\"H6213\">offer</span> the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> and make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for him, for <span class=\"wl wl-kjv\" data-code=\"H834\">that</span> he <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> by the <span class=\"wl wl-kjv\" data-code=\"H5315\">dead,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6942\">hallow</span> his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> that same day.","12":"And he shall <span class=\"wl wl-kjv\" data-code=\"H5144\">consecrate</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H5145\">separation,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> a <span class=\"wl wl-kjv\" data-code=\"H3532\">lamb</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">first</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> for a trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering:</span> but the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that were <span class=\"wl wl-kjv\" data-code=\"H7223\">before</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5307\">lost,</span> because his <span class=\"wl wl-kjv\" data-code=\"H5145\">separation</span> was defiled.","13":"And this is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H5139\">Nazarite,</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">when</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H5145\">separation</span> are <span class=\"wl wl-kj e <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of his <span class=\"wl wl-kjv\" data-code=\"H5145\">separation,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> it in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> which is under the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of the peace offerings.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H1311\">sodden</span> <span class=\"wl wl-kjv\" data-code=\"H2220\">shoulder</span> of the <span class=\"wl wl-kjv\" data-code=\"H352\">ram,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H4682\">unleavened</span> <span class=\"wl wl-kjv\" data-code=\"H2471\">cake</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5536\">basket,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H4682\">unleavened</span> <span class=\"wl wl-kjv\" data-code=\"H7550\">wafer,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> them upon the <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> of the <span class=\"wl wl-kjv\" data-code=\"H5139\">Nazarite,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the hair of his <span class=\"wl wl-kjv\" data-code=\"H5145\">separation</span> is shaven:","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5130\">wave</span> them for a wave <span class=\"wl wl-kjv\" data-code=\"H8573\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> this is <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> for the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> with the <span class=\"wl wl-kjv\" data-code=\"H8573\">wave</span> <span class=\"wl wl-kjv\" data-code=\"H2373\">breast</span> and <span class=\"wl wl-kjv\" data-code=\"H8641\">heave</span> <span class=\"wl wl-kjv\" data-code=\"H7785\">shoulder:</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that the <span class=\"wl wl-kjv\" data-code=\"H5139\">Nazarite</span> may <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> wine.","21":"This is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H5139\">Nazarite</span> who hath <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed,</span> and of his <span class=\"wl wl-kjv\" data-code=\"H7133\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for his <span class=\"wl wl-kjv\" data-code=\"H5145\">separation,</span> beside that that his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> shall <span class=\"wl wl-kjv\" data-code=\"H5381\">get:</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> to the <span class=\"wl wl-kjv\" data-code=\"H5088\">vow</span> which he <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed,</span> so he must <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> after the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of his separation.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","23":"<span class=\"wl wl-kjv\" data-code=\"H1696\">Speak</span> unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and unto his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> On this <span class=\"wl wl-kjv\" data-code=\"H3541\">wise</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> saying","24":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thee, and keep","25":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> make his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> <span class=\"wl wl-kjv\" data-code=\"H215\">shine</span> upon thee, and be gracious","26":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance</span> upon thee, and <span class=\"wl wl-kjv\" data-code=\"H7760\">give</span> thee peace.","27":"And they shall <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and I will bless"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Nazireërs,","tekst":"Het Hebreeuwse woord Nazir, geschreven met de letter zain, betekent een afgezonderde, te weten, van de wereld, om zich ganselijk tot de overdenking van goddelijke dingen en de waarneming van den heiligen godsdienst over te geven. De nazireërs waren een figuur, die in Christus niet letterlijk, maar geestelijk vervuld is. Zie ook van deze Jdg 13:5; Lam 4:7; Amo 2:11. Zij zijn te onderscheiden van degenen, die met de letter Tsade geschreven worden, en genaamd Natsareën, van de stad Natsareth, alzo ook de Heere Christus een Nazarener genoemd wordt, Mat 2:23, en de Christenen Nazareën, Act 24:5. De nazireërs nu waren tweeërlei:&lt;i&gt;I.&lt;/i&gt; Die God daartoe expresselijk verkoos, gelijk Simson, Jdg 13:5, en [zoals enigen houden] Johannes de Doper, Luk 1:15.&lt;i&gt;II.&lt;/i&gt; Die door vrijwillige gelofte zodanige werden, van welken hier gesproken wordt."}],"3":[{"catchword":"drank zal hij niet drinken,","tekst":"Zie Lev 10:9."},{"catchword":"vochtigheid van druiven","tekst":"Of, sap."}],"4":[{"catchword":"wijnstok des wijns gemaakt is,","tekst":"Alzo Jdg 13:14; dat is, die wijndruiven draagt en wijn voortbrengt. Het tegendeel is een wijnstok, die dat niet doet; Hag 2:20."},{"catchword":"basten toe","tekst":"Of, pelletJes."}],"5":[{"catchword":"heilig zijn,","tekst":"Dat is, den Heere geheiligd en toegeëigend."}],"6":[{"catchword":"lichaam eens doden niet gaan","tekst":"Hebreeuws, ziel. Zie Lev 19:28, en hieronder, vs.11."}],"7":[{"catchword":"het Nazireërschap zijns Gods","tekst":"Dat is, het teken zijns nazireërschaps of afzondering; te weten, het lange haar, hetwelk hij, zolang zijn belofte duurde, moest ongeschoren laten. Vergelijk onder, vs.9, 19."}],"9":[{"catchword":"het hoofd van zijn nazireërschap","tekst":"Zie boven, vs.7."},{"catchword":"bescheren;","tekst":"Dat is, zijn haar tot de huid toe met een scheermes afnemen."},{"catchword":"den zevenden dag","tekst":"Zolang moest een mens, die een dode aangeroerd had, voor onrein gehouden worden. Zie Lev 15:13. Vergelijk onder, Num 12:14."}],"10":[{"catchword":"jonge duiven","tekst":"Hebreeuws, zonen der duiven."}],"11":[{"catchword":"aan het","tekst":"Of, bij, omtrent"},{"catchword":"dode lichaam","tekst":"Hebreeuws, ziel"},{"catchword":"gezondigd heeft;","tekst":"Versta, deze zonde van de ceremoniëele onreinheid, welke hij verkregen had door aangeroerd te zijn van het dode lichaam of er bij geweest te zijn, hoewel tegen zijn weten en wil."},{"catchword":"heiligen","tekst":"Zie Lev 8:30."}],"12":[{"catchword":"afzonderen,","tekst":"Te weten, opnieuw zich onthoudende van de dingen, welke vermeld zijn boven, vs.3-7, wederom aanvangende zijn nazireërschap, alsof hij tevoren niets gedaan had, om daarin zoveel dagen, als hij beloofd had, te volharden."},{"catchword":"een lam,","tekst":"Hebreeuws, een zoon zijns jaars"},{"catchword":"vallen,","tekst":"Dat is, voor niet en tevergeefs zijn en in geen rekening komen."}],"13":[{"catchword":"des Nazireërs","tekst":"Dat is, van het offer des nazireërs."},{"catchword":"dit brengen","tekst":"Te weten, dit offer, hetwelk gemeld wordt in vs.14,15."}],"14":[{"catchword":"eenjarig lam","tekst":"Hebreeuws, een zoon zijns jaars"},{"catchword":"eenjarig ooilam","tekst":"Hebreeuws, een dochter van haar jaar."}],"15":[{"catchword":"hun spijsoffer,","tekst":"Spijsoffer en drankoffer worden zo onderscheiden, dat het eerste is geweest van droge, het andere van vochtige dingen. Zie van het spijsoffer Lev 2:1, en van het drankoffer, Lev 23:37, en van beide onderscheidenlijk genoemd, gelijk hier; Joe 1:9, Joe 1:13."}],"16":[{"catchword":"brengen,","tekst":"Of, offeren."}],"17":[{"catchword":"zijn drankoffer bereiden","tekst":"Vergelijk den aantekeningen op Gen 35:14."}],"18":[{"catchword":"het hoofd van zijn nazireërschap","tekst":"Zie boven, vs.9."}],"19":[{"catchword":"nazireërschap afgeschoren heeft","tekst":"Dat is, het haar, hetwelk hem in zijn nazireërschap gewassen is."}],"20":[{"catchword":"beweegoffer,","tekst":"Hoe het beweegoffer van het hefoffer te onderscheiden is, zie Lev 7:30."},{"catchword":"schouder des hefoffers;","tekst":"Of, achterbout."}],"21":[{"catchword":"behalve wat zijn hand bekomen zal;","tekst":"Dat is, uitgenomen hetgeen hij boven de voorgemelde offerande nog vrijwilliglijk, naar zijn vermogen, beloven en offeren wilde. Meer mocht hij wel doen, maar niet minder, zijnde de offerande, die in deze wet voorgeschreven wordt, zowel den armen als den rijken opgelegd."},{"catchword":"naar de wet van zijn Nazireërschap","tekst":"Anders, boven, of behalve."}],"23":[{"catchword":"zegenen,","tekst":"Dat is, als priesters en dienaars Gods in de algemene bijeenkomst, alles goeds, welvaren en zaligheid aan de gemeente van God toewensen."}],"24":[{"catchword":"zegene u, en behoede u","tekst":"Zie Gen 12:2."}],"25":[{"catchword":"doe Zijn aangezicht over u lichten,","tekst":"Het aangezicht Gods betekent zijn voorzienigheid en tegenwoordigheid, om te straffen of te zegenen. Van het aangezicht der straf, of wraak, zie Lev 17:10; Psa 34:17, en Psa 51:11. Van het aangezicht der gunst en zegening is hier gesproken, als ook 2Ch 30:9; Psa 13:2, enz. God wordt gezegd zijn aangezicht te doen lichten, als Hij zijn genade, zegen en weldadigheid dadelijk bewijst, Psa 31:17, en Psa 80:4, Psa 80:8, Psa 80:20, en Psa 119:135, en Dan 9:17."}],"26":[{"catchword":"verheffe Zijn aangezicht over u,","tekst":"Dat is, hebbe geduriglijk de ogen zijner genadige voorzienigheid over u, om uw ingang en uitgang te bewaren, tot uw best, hetwelk God niet doet wanneer Hij gezegd wordt zijn aangezicht te verbergen, of af te keren; Deu 32:20; Eze 7:22."},{"catchword":"geve u","tekst":"Hebreeuws, zette; dat is, voege u vrede toe of geve u vrede."},{"catchword":"vrede","tekst":"Zie Gen 37:14."}],"27":[{"catchword":"Mijn Naam op de kinderen Israëls leggen;","tekst":"Dit geschiedde eensdeels met aanroeping van den goddelijken naam, anderdeels met uitstrekking hunner handen over de gemeente, alsof zij den zegen des Heeren, om welken zij baden, het gehele volk, van Gods wege, dadelijk hadden willen toebrengen en overgeven."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the LORD spoke to Moseh, saying;"}],"2":[{"catchword":null,"tekst":"Speak unto the Children of Israel, and say to them; when a man or woman shall have separated (themselves) vowing the vow of a Nazarite, [The Hebr. Word Nazir, written with the letter Zain doth signify one separated, viz. from the world, to give himself wholly up to the meditation of the holy and heavenly things, and the observation of God&acirc;&euro;&trade;s worship and service: These Nazarites were a sign which was spiritually, though not literally fulfilled in Christ. Of these see likewise, Jud. 13. 5. Lam. 4. 7. And Amos 2. 11. They are to be distinguished from Nazarites, written with the Letter Tzade, as called so from the City of Nazareth, whence Christ also was called a Nazarite, Mat. 2. 23. And the Christians also Nazarites, Act. 24. 5. Of the Nazarites there were two sorts: 1. Those whom God expressly chose and appointed to be such, as Samson, Jud. 13. 5. And (as some do hold) John the Baptist, Luk. 1. 15. 2. Such as of their own accord became such, as those here spoken of ] for to separate themselves to the LORD."}],"3":[{"catchword":null,"tekst":"He shall separate himself from wine and strong drink, wine-vinegar, and vinegar of strong drink [See Lev. 10., on verse 7.] he shall not drink, neither shall he drink any moisture (or sap, juice) of grapes, nor eat fresh or dried grapes."}],"4":[{"catchword":null,"tekst":"All the days of his Nazarite ship shall he eat nothing of ought that is made of the Vine of Wine, [So Jud. 13. 14. i.e. which beareth grapes and bringeth forth none, Hag. 2. 20.] from the kernels unto the husks."}],"5":[{"catchword":null,"tekst":"All the days of the Vow of his Nazarite-ship, the razor shall not go over his head; until these days shall be fulfilled, which he shall have separated himself unto the LORD, shall he be holy [i.e. dedicated and consecrated to the LORD] letting the locks of his hair to grow."}],"6":[{"catchword":null,"tekst":"All the days he shall have separated himself to the LORD, shall not he go to the corps [Heb. Soul, See Lev. 19. On verse 28. And here below verse 11.] of a dead (person)."}],"7":[{"catchword":null,"tekst":"For his Father or for his mother, for his brother, or for his sister, for them he shall not defile himself, they being dead; for the Nazarite-ship of his God is upon his head. [i.e. the token of his Nazarite-ship or separation, to wit, the long hair, which during his vow, he was not to cut or shorten, comp. below vers. 9. And 19.]"}],"8":[{"catchword":null,"tekst":"All the days of his Nazarite-ship is he holy unto the LORD."}],"9":[{"catchword":null,"tekst":"And if the dead (person) were (or had) died unawares suddenly by him, that he should have defiled the head of on of his year] for a burnt-offering, and a perfect Ewe-lamb of one year; [Heb. an Ewe-lamb, a daughter of her year] for a sin-offering, and a perfect Ram for a thank-offering."}],"15":[{"catchword":null,"tekst":"And a basket of unleavened (Cakes) Cakes of meal-flower, mixed with oil and unleavened Wafers stricken with oil: together with their meat-offering, and their drink offering. [Meat-offerings and drink-offerings, are thus distinguished. The former was of dry things, the latter of moist of the meat-offerings, see Levit. 2. On verse 1. And of the drink-offerings, Levit. 23. On verse 37. And of both distinctly named, as here Joel 1. V. 9. 13.]"}],"16":[{"catchword":null,"tekst":"And the Priest shall bring [i.e. offer] it before the face of the LORD; and shall prepare his sin-offering and his burnt-offering."}],"17":[{"catchword":null,"tekst":"He shall likewise prepare the Ram for a thank-offering to the LORD, with the basket of the unleavened (Cakes) and the Priest shall prepare his meat-offering, and his drink offering. [Compare Genesis 35. The Annot. On v. 14.]"}],"18":[{"catchword":null,"tekst":"Then shall the Nazarite shave the head of his Nazarite-ship [See above on v.9.] at the door of the Tent of the Congregation; and he shall take the hair of his Nazarite-ship, and he shall lay it upon the fire, that is under the thank-offering."}],"19":[{"catchword":null,"tekst":"After that shall the Priest take a boiled shoulder of the Ram, and an unleavened wafer; and he shall lay it upon the hands of the Nazarite, after that he hath shaved off his Nazarite-ship. [i.e. the hair which was grown in his head, during his Nazarite-ship.]"}],"20":[{"catchword":null,"tekst":"And the Priest shall wave the same for a wave-offering, [How the wave-offering is to be distinguished from the heave-offering. See Levit. 7. On v. 30.] before the face of the LORD; it is a holy thing for the Priest; with the breast of the wave-offering, and with the shoulder (or leg) of the heave-offerin // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;

      const items = lijst.map((it, i) => {

        if (kortCw) {

      }).join('');

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;

function toggle(n) {
  const paneel = document.getElementById('p' + n);

    document.getElementById('v' + openVers).classList.remove('open');

  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
