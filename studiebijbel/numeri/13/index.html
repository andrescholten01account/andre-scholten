s", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En de HEERE sprak tot Mozes en zei:", "2": "Zend mannen uit, die het land Kanaän verspieden, dat Ik de kinderen van Israël geven zal; van elke stam van hun vaderen zullen jullie een man zenden, ieder een leider onder hen.", "3": "Mozes dan zond hen uit de woestijn van Paran, op bevel van de HEERE; al die mannen waren hoofden van de kinderen van Israël.", "4": "En dit zijn hun namen: van de stam van Ruben, Sammua, de zoon van Zaccur.", "5": "Van de stam van Simeon, Safat, de zoon van Hori.", "6": "Van de stam van Juda, Kaleb, de zoon van Jefunne.", "7": "Van de stam van Issaschar, Jigeal, de zoon van Jozef.", "8": "Van de stam van Efraïm, Hosea, de zoon van Nun.", "9": "Van de stam van Benjamin, Palti, de zoon van Rafu.", "10": "Van de stam van Zebulon, Gaddiël, de zoon van Sodi.", "11": "Van de stam van Jozef, namelijk voor de stam van Manasse, Gaddi, de zoon van Susi.", "12": "Van de stam van Dan, Ammiël, de zoon van Gemalli.", "13": "Van de stam van Aser, Sethur, de zoon van Michaël.", "14": "Van de stam van Nafthali, Nachbi, de zoon van Wofsi.", "15": "Van de stam van Gad, Guël, de zoon van Machi.", "16": "Dit zijn de namen van de mannen, die Mozes zond om dat land te verspieden; en Mozes noemde Hosea, de zoon van Nun, Jozua.", "17": "Mozes dan zond hen om het land Kanaän te verspieden; en hij zei tegen hen: Trek hierlangs op, naar het zuiden, en klim op het gebergte;", "18": "En bekijk het land, hoe het is, en het volk dat daarin woont, of het sterk is of zwak, of het weinig is of veel;", "19": "En hoe het land is, waarin het woont, of het goed is of slecht; en hoe de steden zijn, waarin het woont, of in legerplaatsen, of in vestingen;", "20": "Ook hoe het land is, of het vet is of mager, of er bomen in zijn of niet; en wees sterk, en neem van de vrucht van het land. Die dagen nu waren de dagen van de eerste vruchten van de wijndruiven.", "21": "Zo trokken zij op, en verspiedden het land, van de woestijn Zin af tot Rechob toe, waar men komt bij Hamath.", "22": "En zij trokken op in het zuiden, en kwamen tot Hebron toe, en daar waren Ahiman, Sesai en Talmai, kinderen van Enak; Hebron nu was zeven jaar eerder gebouwd dan Zoan in Egypte.", "23": "Daarna kwamen zij tot het dal Eskol, en sneden daar een rank af met één tros wijndruiven, die zij met zijn tweeën droegen, op een draagstok; ook van de granaatappels en van de vijgen.", "24": "Die plaats noemde men het dal Eskol, vanwege de tros die de kinderen van Israël daar afgesneden hadden.", "25": "Daarna keerden zij terug van het verspieden van het land, na veertig dagen.", "26": "En zij gingen heen, en kwamen tot Mozes en tot Aäron, en tot de hele vergadering van de kinderen van Israël, in de woestijn van Paran, naar Kades; en brachten hun bescheid terug, aan hen en aan de hele vergadering, en lieten hun de vrucht van het land zien.", "27": "En zij vertelden hem en zeiden: Wij zijn gekomen tot dat land, waarheen u ons gezonden hebt; en werkelijk, het vloeit van melk en honing, en dit is zijn vrucht.", "28": "Behalve dat het een sterk volk is, dat in dat land woont, en de steden zijn vast en zeer groot; en ook hebben wij daar kinderen van Enak gezien.", "29": "De Amalekieten wonen in het land van het zuiden; maar de Hethieten, en de Jebusieten, en de Amorieten wonen op het gebergte; en de Kanaänieten wonen aan de zee, en aan de oever van de Jordaan.", "30": "Toen bracht Kaleb het volk tot rust voor Mozes, en zei: Laat ons vrijmoedig optrekken, en het in bezit nemen; want wij zullen het zeker kunnen overweldigen!", "31": "Maar de mannen die met hem opgetrokken waren, zeiden: Wij zullen tegen dat volk niet kunnen optrekken, want het is sterker dan wij.", "32": "Zo brachten zij een kwaad gerucht over het land dat zij verspied hadden, aan de kinderen van Israël, en zeiden: Dat land, waar wij doorheen gegaan zijn om het te verspieden, is een land dat zijn inwoners verteert; en al het volk dat wij daarin gezien hebben, zijn mannen van grote lengte.", "33": "Wij hebben daar ook de reuzen gezien, en de kinderen van Enak, van de reuzen; en wij waren als sprinkhanen in onze ogen, en zo waren wij ook in hun ogen."}, "SV": {"1": "En de HEERE sprak tot Mozes, zeggende:", "2": "Zend u mannen uit: die het land Kanaän verspieden, hetwelk Ik den kinderen Israëls geven zal; van elken stam zijner vaderen zult gijlieden een man zenden, zijnde ieder een overste onder hen.", "3": "Mozes dan zond hen uit de woestijn van Paran, naar den mond des HEEREN; al die mannen waren hoofden der kinderen Israëls.", "4": "En dit zijn hun namen: van den stam van Ruben, Sammua, de zoon van Zaccur.", "5": "Van den stam van Simeon, Safat, de zoon van Hori.", "6": "Van den stam van Juda, Kaleb, de zoon van Jefunne.", "7": "Van den stam van Issaschar, Jigeal, de zoon van Jozef.", "8": "Van den stam van Efraïm, Hosea, de zoon van Nun.", "9": "Van den stam van Benjamin, Palti, de zoon van Rafu.", "10": "Van den stam van Zebulon, Gaddiel, de zoon van Sodi.", "11": "Van den stam van Jozef, voor den stam van Manasse, Gaddi, de zoon van Susi.", "12": "Van den stam van Dan, Ammiël, de zoon van Gemalli.", "13": "Van den stam van Aser, Sethur, de zoon van Michaël.", "14": "Van den stam van Nafthali, Nachbi, de zoon van Wofsi.", "15": "Van den stam van Gad, Guël, de zoon van Machi.", "16": "Dit zijn de namen der mannen, die Mozes zond, om dat land te verspieden; en Mozes noemde Hosea, den zoon van Nun, Jozua.", "17": "Mozes dan zond hen, om het land Kanaän te verspieden; en hij zeide tot hen: Trekt dit henen op tegen het zuiden, en klimt op het gebergte;", "18": "En beziet het land, hoedanig het zij, en het volk, dat daarin woont, of het sterk zij of zwak, of het weinig zij of veel;", "19": "En hoedanig het land zij, waarin hetzelve woont, of het goed zij of kwaad; en hoedanig de steden zijn, in dewelke hetzelve woont, of in legers, of in sterkten;", "20": "Ook hoedanig het land zij, of het vet zij of mager, of er bomen in zijn of niet; en versterkt u, en neemt van de vrucht des lands. Die dagen nu waren de dagen der eerste vruchten van de wijndruiven.", "21": "Alzo trokken zij op, en verspiedden het land, van de woestijn Zin af tot Rechob toe, waar men gaat naar Hamath.", "22": "En zij trokken op in het zuiden, en kwamen tot Hebron toe, en daar waren Ahiman, Sesai en Talmai, kinderen van Enak; Hebron nu was zeven jaren gebouwd voor Zoan in Egypte.", "23": "Daarna kwamen zij tot het dal Eskol, en sneden van daar een rank af met een tros wijndruiven, dien zij droegen met tweeën, op een draagstok; ook van de granaatappelen en van de vijgen.", "24": "Diezelve plaats noemde men het dal Eskol, ter oorzake van den tros, dien de kinderen Israëls van daar afgesneden hadden.", "25": "Daarna keerden zij weder van het verspieden des lands, ten einde van veertig dagen.", "26": "En zij gingen heen, en kwamen tot Mozes en tot Aäron, en tot de gehele vergadering der kinderen Israëls, in de woestijn van Paran, naar Kades; en brachten bescheid weder aan hen, en aan de gehele vergadering, en lieten hun de vrucht des lands zien.", "27": "En zij vertelden hem, en zeiden: Wij zijn gekomen tot dat land, waarheen gij ons gezonden hebt; en voorwaar, het is van melk en honig vloeiende, en dit is zijn vrucht.", "28": "Behalve dat het een sterk volk is, hetwelk in dat land woont, en de steden zijn vast, *en* zeer groot; en ook hebben wij daar kinderen van Enak gezien.", "29": "De Amalekieten wonen in het land van het zuiden; maar de Hethieten, en de Jebusieten, en de Amorieten wonen op het gebergte; en de Kanaänieten wonen aan de zee, en aan den oever van de Jordaan.", "30": "Toen stilde Kaleb het volk voor Mozes, en zeide: Laat ons vrijmoedig optrekken, en dat erfelijk bezitten; want wij zullen dat voorzeker overweldigen!", "31": "Maar de mannen, die met hem opgetrokken waren, zeiden: Wij zullen tot dat volk niet kunnen optrekken, want het is sterker dan wij.", "32": "Alzo brachten zij een kwaad gerucht voort van het land, dat zij verspied hadden, aan de kinderen Israëls, zeggende: Dat land, door hetwelk wij doorgegaan zijn, om het te verspieden, is een land, dat zijn inwoners verteert; en al het volk, hetwelk wij in het midden van hetzelve gezien hebben, zijn mannen van grote lengte.", "33": "Wij hebben ook daar de reuzen gezien, en de kinderen van Enak, van de reuzen; en wij waren als sprinkhanen in onze ogen, alzo waren wij ook in hun ogen."}, "KJV": {"1": "And the LORD spake unto Moses, saying,", "2": "Send thou men, that they may search the land of Canaan, which I give unto the children of Israel: of every tribe of their fathers shall ye send a man, every one a ruler", "3": "And Moses by the commandment of the LORD sent them from the wilderness of Paran: all those men *were* heads of the children of Israel.", "4": "And these *were* their names: of the tribe of Reuben, Shammua the son of Zaccur.", "5": "Of the tribe of Simeon, Shaphat the son of Hori.", "6": "Of the tribe of Judah, Caleb the son of Jephunneh.", "7": "Of the tribe of Issachar, Igal the son of Joseph.", "8": "Of the tribe of Ephraim, Oshea the son of Nun.", "9": "Of the tribe of Benjamin, Palti the son of Raphu.", "10": "Of the tribe of Zebulun, Gaddiel the son of Sodi.", "11": "Of the tribe of Joseph, *namely*, of the tribe of Manasseh, Gaddi the son of Susi.", "12": "Of the tribe of Dan, Ammiel the son of Gemalli.", "13": "Of the tribe of Asher, Sethur the son of Michael.", "14": "Of the tribe of Naphtali, Nahbi the son of Vophsi.", "15": "Of the tribe of Gad, Geuel the son of Machi.", "16": "These *are* the names of the men which Moses sent to spy out the land. And Moses called Oshea the son of Nun Jehoshua.", "17": "And Moses sent them to spy out the land of Canaan, and said unto them, Get you up this *way* southward, and go up into the mountain:", "18": "And see the land, what it *is*; and the people that dwelleth therein, whether they *be* strong or weak, few or many;", "19": "And what the land *is* that they dwell in, whether it *be* good or bad; and what cities *they be* that they dwell in, whether in tents, or in strong holds;", "20": "And what the land *is*, whether it *be* fat or lean, whether there be wood therein, or not. And be ye of good courage, and bring of the fruit of the land. Now the time *was* the time of the firstripe grapes.", "21": "So they went up, and searched the land from the wilderness of Zin unto Rehob, as men come to Hamath.", "22": "And they ascended by the south, and came unto Hebron; where Ahiman, Sheshai, and Talmai, the children of Anak, *were*. (Now Hebron was built seven years before Zoan in Egypt.)", "23": "And they came unto the brook of Eshcol, and cut down from thence a branch with one cluster of grapes, and they bare it between two upon a staff; and *they brought* of the pomegranates, and of the figs.", "24": "The place was called the brook Eshcol, because of the cluster of grapes which the children of Israel cut down", "25": "And they returned from searching of the land after forty days.", "26": "And they went and came to Moses, and to Aaron, and to all the congregation of the children of Israel, unto the wilderness of Paran, to Kadesh; and brought back word unto them, and unto all the congregation, and shewed them the fruit of the land.", "27": "And they told him, and said, We came unto the land whither thou sentest us, and surely it floweth with milk and honey; and this *is* the fruit", "28": "Nevertheless the people *be* strong that dwell in the land, and the cities *are* walled, *and* very great: and moreover we saw the children of Anak", "29": "The Amalekites dwell in the land of the south: and the Hittites, and the Jebusites, and the Amorites, dwell in the mountains: and the Canaanites dwell by the sea, and by the coast of Jordan.", "30": "And Caleb stilled the people before Moses, and said, Let us go up at once, and possess it; for we are well able to overcome", "31": "But the men that went up with him said, We be not able to go up against the people; for they *are* stronger", "32": "And they brought up an evil report of the land which they had searched unto the children of Israel, saying, The land, through which we have gone to search it, *is* a land that eateth up the inhabitants thereof; and all the people that we saw in it *are* men of a great stature.", "33": "And there we saw the giants, the sons of Anak, *which come* of the giants: and we were in our own sight as grasshoppers, and so we were in their sight."}}, "tsk": {"2": [{"kopje": "Zend", "refs": ["Num 32:8", "Deut 1:22-25", "Joz 2:1-24"]}, {"kopje": "van elke", "refs": ["Num 1:4", "Num 34:18"]}, {"kopje": "een leider", "refs": ["Num 11:16", "Ex 18:25", "Deut 1:15"]}], "6": [{"kopje": "Kaleb", "refs": ["Num 13:30", "Num 14:6", "Num 14:24", "Num 14:30", "Num 14:38", "Num 26:65", "Num 27:15-23", "Num 34:19", "Deut 31:7-17", "Joz 14:6-15", "Joz 15:13-19", "Luk 1:10-15", "1 Kron 4:15"]}], "8": [{"kopje": "Hosea", "refs": ["Num 13:16", "Num 11:28", "Num 27:18-22", "Ex 17:9-13", "Ex 24:13", "Ex 32:17", "Deut 31:7", "Deut 31:8", "Deut 31:14", "Deut 31:23", "Deut 34:9", "Joz 1:1-9", "Joz 1:16", "Joz 24:1-33"]}], "16": [{"kopje": "Hosea", "refs": ["Hos 1:1", "Rom 9:25"]}, {"kopje": "Jozua", "refs": ["Num 13:8", "Num 14:6", "Num 14:30", "Ex 17:9", "Matt 1:21-23", "Hand 7:45", "Hebr 4:8"]}], "17": [{"kopje": "naar het zuiden", "refs": ["Num 13:21", "Num 13:22", "Gen 12:9", "Gen 13:1", "Joz 15:3", "Richt 1:15"]}, {"kopje": "het gebergte", "refs": ["Num 14:40", "Gen 14:10", "Deut 1:44", "Richt 1:9", "Richt 1:19"]}], "20": [{"kopje": "of het", "refs": ["Neh 9:25", "Neh 9:35", "Ezech 34:14"]}, {"kopje": "sterk", "refs": ["Num 13:30", "Num 13:31", "Deut 31:6-8", "Deut 31:23", "Joz 1:6", "Joz 1:9", "Joz 2:3", "Joz 2:22", "Joz 2:23", "1 Kron 22:11", "Hebr 13:6"]}, {"kopje": "de eerste vruchten", "refs": ["Num 13:23", "Num 13:24" jn Zin, en het volk bleef te Kades. En Mirjam stierf daar, en zij werd daar begraven.", "1 Kor 3:2": "Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet.", "Deut 31:23": "En Hij gebood Jozua, de zoon van Nun, en zei: Wees sterk en heb goede moed, want u zult de kinderen van Israël brengen in het land, dat Ik hun gezworen heb; en Ik zal met u zijn.", "Deut 1:22-25": "Toen kwam u allen dichterbij mij, en zei: Laten wij mannen voor ons uit sturen, die het land voor ons verkennen, en ons bericht terugbrengen, welke weg wij daarin op moeten trekken, en tot welke steden wij zullen komen. Deze zaak nu was goed in mijn ogen; zo nam ik uit u twaalf mannen, van elke stam een man. Die keerden zich om, en trokken op naar het gebergte, en kwamen bij het dal Eskol, en verkenden dat.", "Num 24:20": "Toen hij de Amalekieten zag, hief hij zijn spreuk op en zei: Amalek is de eersteling van de heidenvolken; maar zijn einde loopt uit op de ondergang!", "Deut 6:11": "En huizen, vol van alle goeds, die u niet gevuld hebt, en uitgehouwen putten, die u niet uitgehouwen hebt, wijngaarden en olijfgaarden, die u niet geplant hebt, en u gegeten hebt en verzadigd bent;", "Joz 21:13": "Zo gaven zij aan de kinderen van de priester Aäron de vrijstad voor de doodslager, Hebron en haar voorsteden, en Libna en haar voorsteden;", "Num 13:26-30": "En zij gingen heen, en kwamen tot Mozes en tot Aäron, en tot de hele vergadering van de kinderen van Israël, in de woestijn van Paran, naar Kades; en brachten hun bescheid terug, aan hen en aan de hele vergadering, en lieten hun de vrucht van het land zien. En zij vertelden hem en zeiden: Wij zijn gekomen tot dat land, waarheen u ons gezonden hebt; en werkelijk, het vloeit van melk en honing, en dit is zijn vrucht. Behalve dat het een sterk volk is, dat in dat land woont, en de steden zijn vast en zeer groot; en ook hebben wij daar kinderen van Enak gezien.", "Num 14:6-9": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren. En zij spraken tot de hele vergadering van de kinderen van Israël en zeiden: Het land waar wij doorheen getrokken zijn om het te verspieden, is een buitengewoon goed land. Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.", "Deut 2:21": "Een groot en talrijk volk, en lang van gestalte, zoals de Enakieten; en de HEERE verdelgde hen voor hun aangezicht, zodat zij hen uit hun bezit verdreven, en in hun plaats woonden;", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "Num 14:30": "U zult in dat land niet komen, waarover Ik Mijn hand opgeheven heb, om u daarin te laten wonen, behalve Kaleb, de zoon van Jefunne, en Jozua, de zoon van Nun.", "Num 34:18": "Verder zult u uit elke stam één leider nemen, om het land ter erfenis uit te delen.", "Ex 17:8-16": "Toen kwam Amalek en streed tegen Israël bij Rafidim. Mozes zei toen tegen Jozua: Kies mannen voor ons uit, en trek eropuit, strijd tegen Amalek; morgen zal ik op de top van de heuvel staan, met de staf van God in mijn hand. Jozua deed zoals Mozes hem gezegd had, en streed tegen Amalek; maar Mozes, Aäron en Hur klommen op de top van de heuvel.", "2 Sam 21:20": "Ook was er nog een oorlog te Gath; en er was een zeer lange man, die zes vingers had aan zijn handen, en zes tenen aan zijn voeten, vierentwintig in getal, en deze was ook aan Rafa geboren.", "Num 20:16": "Toen riepen wij tot de HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en zie, wij zijn te Kades, een stad aan de rand van uw gebied.", "Deut 1:4": "nadat hij Sihon, de koning van de Amorieten, die in Hesbon woonde, verslagen had, en Og, de koning van Bazan, die in Astharoth woonde, bij Edreï.", "Deut 8:8": "Een land van tarwe en gerst, en wijnstokken, en vijgenbomen, en granaatappels; een land van olierijke olijfbomen, en van honing;", "Joz 10:5": "Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar.", "Ezech 47:16": "Hamath, Berotha, Sibraim, dat tussen het gebied van Damaskus en het gebied van Hamath ligt; Hazar-Hattichon, dat bij het gebied van Havran ligt.", "Joz 15:3": "en zij gaat uit naar het zuiden tot de opgang van Akrabbim, en gaat door naar Zin, en gaat op van het zuiden naar Kades-barnea, en gaat door Hezron, en gaat op naar Adar, en gaat om Karkaa;", "Deut 1:15": "Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen.", "Gen 21:21": "En hij woonde in de woestijn Paran; en zijn moeder nam voor hem een vrouw uit Egypteland.", "Joz 1:4": "Van de woestijn en deze Libanon af tot aan de grote rivier, de rivier Frath, het hele land van de Hethieten, en tot aan de grote zee tegen de ondergang van de zon, zal uw gebied zijn.", "Ps 78:43": "Hoe Hij Zijn tekenen stelde in Egypte, en Zijn wonderen in het veld van Zoan;", "Deut 1:28": "Waarheen zouden wij optrekken? Onze broeders hebben ons hart doen smelten, en zeiden: Het is een volk, groter en langer dan wij; de steden zijn groot, en versterkt tot aan de hemel toe; ook hebben wij daar kinderen van de Enakieten gezien.", "Num 27:15-23": "Toen sprak Mozes tot de HEERE, en zei: Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering, Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Deut 9:1": "Hoor, Israël! U zult vandaag over de Jordaan gaan, om binnen te komen bij volken om die te erven, die groter en sterker zijn dan u; steden die groot zijn en tot in de hemel versterkt;", "1 Kron 11:23": "Hij versloeg ook een Egyptische man, een man van grote lengte, van vijf ellen; en die Egyptenaar had een speer in de hand, als een weversboom; maar hij ging naar hem af met een staf, en rukte de speer uit de hand van de Egyptenaar, en hij doodde hem met zijn eigen speer.", "Joz 14:6-15": "Toen naderden de kinderen van Juda tot Jozua, te Gilgal, en Kaleb, de zoon van Jefunne, de Keneziet, zei tegen hem: U weet het woord dat de HEERE tot Mozes, de man van God, gesproken heeft te Kades-Barnea, vanwege mij, en vanwege u. Ik was veertig jaar oud, toen Mozes, de dienaar van de HEERE, mij uitgezonden heeft van Kades-Barnea om het land te verkennen, en ik hem antwoord bracht, zoals het in mijn hart was. Maar mijn broeders, die met mij opgegaan waren, deden het hart van het volk smelten; maar ik volhardde erin de HEERE, mijn God, na te volgen.", "Hebr 4:8": "Want als Jozua hen in de rust gebracht had, zou Hij daarna niet gesproken hebben van een andere dag.", "Deut 11:10-12": "Want het land, waar u naartoe gaat, om dat te erven, is niet als Egypteland, van waar u uitgegaan bent, waar u uw zaad zaaide, en bewaterde met uw voet, als een kruidhof. Maar het land, waarheen u overtrekt, om dat te erven, is een land van bergen en van dalen; het drinkt water van de regen van de hemel; Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar.", "Gen 15:18": "Op dezelfde dag maakte de HEERE een verbond met Abram, en Hij zei: Aan uw nageslacht heb Ik dit land gegeven, van de rivier van Egypte af, tot aan die grote rivier, de rivier de Eufraat:", "Ex 18:25": "En Mozes koos bekwame mannen, uit heel Israël, en stelde hen aan tot hoofden over het volk; leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien;", "Num 34:3": "De zuiderkant nu zal voor u zijn vanaf de woestijn Zin, langs de zijden van Edom; en de zuidergrens zal voor u zijn vanaf het einde van de Zoutzee, in het oosten;", "Neh 9:35": "Want zij hebben U niet gediend in hun koninkrijk, en in Uw overvloedige goed, dat U hun gaf, en in dat wijde en dat vette land, dat U voor hun aangezicht gegeven had; en zij hebben zich niet bekeerd van hun slechte werken.", "Gen 10:19": "En het gebied van de Kanaänieten was van Sidon, in de richting van Gerar tot aan Gaza toe; in de richting van Sodom en Gomorra, en Adama, en Zoboim, tot aan Lasa toe.", "Deut 31:14": "En de HEERE zei tegen Mozes: Zie, uw dagen zijn genaderd om te sterven; roep Jozua, en stel u op in de tent van de samenkomst, zodat Ik hem een opdracht geef. Zo ging Mozes, en Jozua, en zij stelden zich op in de tent van de samenkomst.", "Ex 33:3": "Naar het land dat overvloeit van melk en honing; want Ik zal in uw midden niet optrekken, want u bent een hardnekkig volk; anders zou Ik u onderweg verteren.", "Joz 14:6": "Toen naderden de kinderen van Juda tot Jozua, te Gilgal, en Kaleb, de zoon van Jefunne, de Keneziet, zei tegen hem: U weet het woord dat de HEERE tot Mozes, de man van God, gesproken heeft te Kades-Barnea, vanwege mij, en vanwege u.", "1 Sam 27:8": "David nu trok op met zijn mannen, en zij overvielen de Gesurieten, en de Girzieten, en de Amalekieten (want dezen zijn van oude tijden af de inwoners van het land geweest), op de weg naar Sur, tot aan Egypteland.", "Joz 2:22": "Zij dan gingen weg, en kwamen op het gebergte, en bleven daar drie dagen, totdat de achtervolgers teruggekeerd waren; want de achtervolgers hadden hen op heel de weg gezocht, maar niet gevonden.", "Hebr 5:13": "Want ieder die nog melk krijgt, is onervaren in het woord van de gerechtigheid; want hij is een kind.", "Num 34:19": "En dit zijn de namen van deze mannen: van de stam van Juda, Kaleb, zoon van Jefunne;", "Ex 13:5": "En het zal gebeuren, als de HEERE u in het land van de Kanaänieten, de Hethieten, de Amorieten, de Hevieten en de Jebusieten gebracht zal hebben, dat Hij uw vaderen gezworen heeft u te geven, een land dat overvloeit van melk en honing; dan moet u deze dienst houden in deze maand.", "Ex 34:28": "En hij was daar met de HEERE, veertig dagen en veertig nachten; hij at geen brood, en hij dronk geen water; en Hij schreef op de tafelen de woorden van het verbond, de tien woorden.", "Richt 1:35": "Ook wilden de Amorieten wonen op het gebergte van Heres, te Ajalon, en te Saalbim; maar de hand van het huis van Jozef werd zwaar, zodat zij dienstbaar werden.", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "Num 14:6-12": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren. En zij spraken tot de hele vergadering van de kinderen van Israël en zeiden: Het land waar wij doorheen getrokken zijn om het te verspieden, is een buitengewoon goed land. Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.", "Deut 26:9": "En Hij heeft ons gebracht naar deze plaats; en Hij heeft ons dit land gegeven, een land vloeiend van melk en honing.", "Num 32:9": "Toen zij opgekomen waren tot aan het dal Eskol, en dit land bezagen, ontmoedigden zij het hart van de kinderen van Israël, zodat zij niet gingen naar het land dat de HEERE hun gegeven had.", "Num 13:17-29": "Mozes dan zond hen om het land Kanaän te verspieden; en hij zei tegen hen: Trek hierlangs op, naar het zuiden, en klim op het gebergte; En bekijk het land, hoe het is, en het volk dat daarin woont, of het sterk is of zwak, of het weinig is of veel; En hoe het land is, waarin het woont, of het goed is of slecht; en hoe de steden zijn, waarin het woont, of in legerplaatsen, of in vestingen;", "Joz 12:3": "En over de vlakte tot aan de zee van Cinneroth naar het oosten, en tot aan de zee van de vlakte, de Zoutzee, naar het oosten, op de weg naar Beth-jesimoth; en vanuit het zuiden, beneden Asdoth-pisga.", "Num 14:33": "En uw kinderen zullen als herders rondtrekken in deze woestijn, veertig jaar, en zullen uw hoererijen dragen, totdat uw dode lichamen verteerd zijn in deze woestijn.", "Joz 24:13": "Dus heb Ik u een land gegeven, waarvoor u niet gewerkt hebt, en steden die u niet gebouwd hebt, en u woont erin; u eet van de wijngaarden en olijfbomen die u niet geplant hebt.", "Richt 1:10": "En Juda was heengetrokken tegen de Kanaänieten die in Hebron woonden (de naam van Hebron was voorheen Kirjath-arba), en zij versloegen Sesai, Ahiman, en Thalmai.", "Matt 23:13": "Maar wee u, Schriftgeleerden en Farizeeën, huichelaars! Want u sluit het Koninkrijk der hemelen voor de mensen, want u gaat er zelf niet in, en degenen die er in willen gaan, laat u niet ingaan.", "Num 13:31-33": "Maar de mannen die met hem opgetrokken waren, zeiden: Wij zullen tegen dat volk niet kunnen optrekken, want het is sterker dan wij. Zo brachten zij een kwaad gerucht over het land dat zij verspied hadden, aan de kinderen van Israël, en zeiden: Dat land, waar wij doorheen gegaan zijn om het te verspieden, is een land dat zijn inwoners verteert; en al het volk dat wij daarin gezien hebben, zijn mannen van grote lengte. Wij hebben daar ook de reuzen gezien, en de kinderen van Enak, van de reuzen; en wij waren als sprinkhanen in onze ogen, en zo waren wij ook in hun ogen.", "Deut 26:15": "Zie neer vanuit Uw heilige woning, vanuit de hemel, en zegen Uw volk Israël, en het land dat U ons gegeven hebt, zoals U onze vaderen gezworen hebt, een land van melk en honing vloeiend.", "Num 14:6": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren.", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "Joz 14:7": "Ik was veertig jaar oud, toen Mozes, de dienaar van de HEERE, mij uitgezonden heeft van Kades-Barnea om het land te verkennen, en ik hem antwoord bracht, zoals het in mijn hart was.", "Matt 1:21-23": "en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden. En dit alles is gebeurd, opdat vervuld zou worden wat door de Heere gesproken is door de profeet, die zei: Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Luk 1:10-15": "En heel de menigte van het volk was buiten aan het bidden, op het uur van het reukoffer. En aan hem verscheen een engel van de Heere, die stond aan de rechterkant van het reukofferaltaar. En Zacharias, die hem zag, schrok hevig, en er viel vrees op hem.", "Gen 12:9": "Daarna vertrok Abram, verder trekkend naar het zuiden.", "Deut 8:7-9": "Want de HEERE, uw God, brengt u in een goed land, een land van waterbeken, bronnen en diepe wateren, die in dalen en op bergen ontspringen; Een land van tarwe en gerst, en wijnstokken, en vijgenbomen, en granaatappels; een land van olierijke olijfbomen, en van honing; Een land waarin u brood zult eten zonder gebrek, waarin u niets ontbreken zal; een land waarvan de stenen ijzer zijn, en uit welks bergen u koper zult uithouwen.", "Richt 6:3": "Want het gebeurde, als Israël gezaaid had, dan kwamen de Midianieten op, en de Amalekieten, en zij die uit het oosten kwamen, kwamen ook tegen hen op.", "Num 14:1-4": "Toen kwam de hele vergadering in opstand, en zij verhieven hun stem, en het volk weende diezelfde nacht. En al de kinderen van Israël morden tegen Mozes en tegen Aäron; en de hele vergadering zei tegen hen: Och, waren wij toch in Egypteland gestorven! Of, och, waren wij toch in deze woestijn gestorven! En waarom brengt de HEERE ons naar dat land, om door het zwaard te vallen, en onze vrouwen en onze kinderen tot roof te worden? Zou het voor ons niet beter zijn om naar Egypte terug te keren?", "Rom 9:25": "Zoals Hij ook bij Hosea zegt: Ik zal hen die Mijn volk niet waren, Mijn volk noemen, en haar die niet bemind was, Mijn beminde.", "Num 13:28-33": "Behalve dat het een sterk volk is, dat in dat land woont, en de steden zijn vast en zeer groot; en ook hebben wij daar kinderen van Enak gezien. De Amalekieten wonen in het land van het zuiden; maar de Hethieten, en de Jebusieten, en de Amorieten wonen op het gebergte; en de Kanaänieten wonen aan de zee, en aan de oever van de Jordaan. Toen bracht Kaleb het volk tot rust voor Mozes, en zei: Laat ons vrijmoedig optrekken, en het in bezit nemen; want wij zullen het zeker kunnen overweldigen!", "Joz 12:2": "Sihon, de koning van de Amorieten, die in Hesbon woonde; die heerste vanaf Aroer, dat aan de oever van de beek Arnon ligt, en over het midden van de beek, en de helft van Gilead, tot aan de beek Jabbok, het grensgebied van de kinderen van Ammon;", "Num 32:8": "Zo deden uw vaders, toen ik hen van Kades-Barnea zond om dit land te bezien.", "Deut 1:20": "Toen zei ik tot u: U bent gekomen bij het gebergte van de Amorieten, dat de HEERE, onze God, ons geven zal.", "Deut 1:7": "Keer u om, vertrek, en ga naar het gebergte van de Amorieten, en naar al hun buren, in het vlakke veld, op het gebergte, en in de laagte, en in het zuiden, en aan de kust van de zee; het land van de Kanaänieten, en de Libanon, tot aan die grote rivier, de rivier de Eufraat.", "Joz 1:6": "Wees sterk en heb goede moed! Want u zult dit volk dat land als erfelijk bezit doen verkrijgen, dat Ik hun vaderen gezworen heb hun te geven.", "Joz 15:1": "Het lot voor de stam van de kinderen van Juda, naar hun huisgezinnen, was: aan het gebied van Edom, de woestijn Zin, zuidwaarts, was het uiterste tegen het zuiden;", "Deut 1:19": "Toen vertrokken wij van Horeb, en trokken door die hele grote en vreselijke woestijn, die u gezien hebt, op de weg van het gebergte van de Amorieten, zoals de HEERE, onze God, ons geboden had; en wij kwamen bij Kades-Barnea.", "Joz 2:3": "Daarom stuurde de koning van Jericho mensen naar Rachab, en zei: Breng de mannen naar buiten die naar u toe gekomen zijn, die bij u in huis gekomen zijn; want zij zijn gekomen om het hele land te doorzoeken.", "Ezech 36:13": "Zo zegt de Heere HEERE: Omdat zij tot u zeggen: U bent een land dat mensen opeet, en u bent een land dat uw volken berooft;", "Nahum 3:17": "Uw gekroonde zijn als de sprinkhanen, en uw krijgsoversten als de grote kevers, die zich in de heiningmuren legeren in de koude van de dagen; wanneer de zon opgaat, zo vliegen zij weg, zodat hun plaats onbekend is, waar zij geweest zijn.", "Joz 15:14": "En Kaleb verdreef vandaar de drie zonen van Enak, Sesai, en Ahiman, en Talmai, geboren uit Enak.", "Ex 32:17": "Toen Jozua het geroep van het volk hoorde, terwijl het juichte, zei hij tegen Mozes: Er is een geluid van oorlog in het kamp.", "Pred 12:5": "Ook wanneer zij bang zullen zijn voor de hoogte, en er verschrikkingen zullen zijn op de weg, en de amandelboom zal bloeien, en de sprinkhaan zichzelf een last zal zijn, en het verlangen zal vergaan; want de mens gaat naar zijn eeuwig huis, en de rouwklagers zullen in de straat rondgaan.", "Num 1:4": "En met u zullen er zijn van elke stam een man, die hoofd is over het huis van zijn vaderen.", "Num 27:14": "Omdat u tegen Mijn bevel opstandig bent geweest in de woestijn Zin, bij de twist van de vergadering, toen u Mij bij het water voor hun ogen had moeten heiligen. Dat is het water van Meriba, bij Kades, in de woestijn Zin.", "Num 26:65": "Want de HEERE had van hen gezegd, dat zij in de woestijn zeker zouden sterven; en er was niemand van hen overgebleven, dan Kaleb, de zoon van Jefunne, en Jozua, de zoon van Nun.", "Richt 1:36": "En het gebied van de Amorieten liep van de pas van Akrabbim, van de rots, en verder omhoog.", "Gen 13:18": "En Abram sloeg zijn tenten op, en kwam en woonde bij de eikenbossen van Mamre, die bij Hebron zijn; en hij bouwde daar de HEERE een altaar.", "1 Kron 7:27": "Zijn zoon was Non; zijn zoon Jozua.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Ps 83:8": "Gebal, en Ammon, en Amalek, Palestina met de inwoners van Tyrus.", "Jes 40:22": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen;", "Num 11:16": "En de HEERE zei tegen Mozes: Verzamel voor Mij zeventig mannen uit de oudsten van Israël, van wie u weet dat zij de oudsten van het volk en zijn opzichters zijn; en u zult hen brengen naar de tent van de samenkomst, en zij zullen zich daar bij u opstellen.", "Num 34:8": "Vanaf de berg Hor zult u de grens aftekenen tot waar men bij Hamath komt; en de uiteinden van deze grens zullen bij Zedad zijn.", "Num 14:6-10": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren. En zij spraken tot de hele vergadering van de kinderen van Israël en zeiden: Het land waar wij doorheen getrokken zijn om het te verspieden, is een buitengewoon goed land. Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.", "Deut 3:9": "(De Sidoniërs noemen Hermon Sirjon; maar de Amorieten noemen hem Senir.)", "Gen 13:1": "Zo trok Abram op uit Egypte naar het zuiden, hij en zijn vrouw, en alles wat hij had, en Lot met hem.", "Deut 1:1": "Dit zijn de woorden die Mozes tot heel Israël gesproken heeft, aan deze kant van de Jordaan, in de woestijn, op het vlakke veld tegenover Suf, tussen Paran en Tofel, en Laban, en Hazeroth, en Dizahab.", "Joz 15:13-19": "Doch Kaleb, de zoon van Jefunne, had hij een deel gegeven te midden van de kinderen van Juda, naar het bevel van de HEERE tot Jozua, de stad van Arba, vader van Enak, dat is Hebron. En Kaleb verdreef vandaar de drie zonen van Enak, Sesai, en Ahiman, en Talmai, geboren uit Enak. En vandaar trok hij op naar de inwoners van Debir (de naam van Debir was voorheen Kirjath-sefer).", "1 Sam 15:7": "Toen sloeg Saul de Amalekieten van Havila af, tot daar waar u komt bij Sur, dat voor Egypte ligt.", "1 Sam 15:3-9": "Ga nu heen, en sla Amalek, en verban alles wat hij heeft, en verschoon hem niet; maar dood van de man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kamelen tot de ezels toe. Dit verkondigde Saul aan het volk, en hij telde hen te Telaïm, tweehonderdduizend man van het voetvolk, en tienduizend man van Juda. Toen Saul tot aan de stad Amalek kwam, legde hij een hinderlaag in het dal.", "Joz 2:23": "Zo keerden die twee mannen terug, en gingen van het gebergte af, en staken over, en kwamen bij Jozua, de zoon van Nun; en zij vertelden hem alles wat hun overkomen was.", "Gen 12:6": "En Abram trok door dat land, tot aan de plaats Sichem, tot aan het eikenbos More; en de Kanaänieten waren toen in dat land.", "Joël 3:18": "En het zal op die dag gebeuren dat de bergen zullen druipen van zoete wijn, en de heuvels zullen stromen van melk, en alle stromen van Juda vol water zullen gaan; en er zal een bron uit het huis van de HEERE uitgaan, en die zal het dal van Sittim bewateren.", "Num 13:3-16": "Mozes dan zond hen uit de woestijn van Paran, op bevel van de HEERE; al die mannen waren hoofden van de kinderen van Israël. En dit zijn hun namen: van de stam van Ruben, Sammua, de zoon van Zaccur. Van de stam van Simeon, Safat, de zoon van Hori.", "Deut 7:1": "Wanneer de HEERE, uw God, u gebracht zal hebben in het land waar u naar toe gaat om het te erven, en Hij vele volken voor uw aangezicht zal hebben uitgeworpen, de Hethieten, en de Girgasieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, en de Hevieten, en de Jebusieten, zeven volken, die groter en machtiger zijn dan u,", "Deut 31:6-8": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten. En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven. De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Gen 14:7": "Daarna keerden zij terug en kwamen bij En-mispat, dat is Kades, en versloegen heel het land van de Amalekieten, en ook de Amoriet, die te Hazezon-thamar woonde.", "Num 13:26-33": "En zij gingen heen, en kwamen tot Mozes en tot Aäron, en tot de hele vergadering van de kinderen van Israël, in de woestijn van Paran, naar Kades; en brachten hun bescheid terug, aan hen en aan de hele vergadering, en lieten hun de vrucht van het land zien. En zij vertelden hem en zeiden: Wij zijn gekomen tot dat land, waarheen u ons gezonden hebt; en werkelijk, het vloeit van melk en honing, en dit is zijn vrucht. Behalve dat het een sterk volk is, dat in dat land woont, en de steden zijn vast en zeer groot; en ook hebben wij daar kinderen van Enak gezien.", "Ex 24:18": "En Mozes ging het midden van de wolk in, nadat hij de berg opgeklommen was; en Mozes was op die berg veertig dagen en veertig nachten.", "Deut 1:25": "En zij namen van de vrucht van het land in hun hand, en brachten die naar ons toe, en brachten ons bericht terug, en zeiden: Het land, dat de HEERE, onze God, ons geven zal, is goed.", "Richt 1:9": "En daarna waren de Judeeërs afgetrokken, om te strijden tegen de Kanaänieten die woonden in het gebergte, in het zuiden, en in de laagte.", "Ps 78:12": "Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan.", "Amos 2:9": "Ik heb daarentegen de Amoriet voor hun aangezicht verdelgd, wiens hoogte was als de hoogte van de ceders, en hij was sterk als de eiken; maar Ik heb zijn vrucht van boven, en zijn wortels van beneden verdelgd.", "Num 11:28": "En Jozua, de zoon van Nun, de dienaar van Mozes, één van zijn uitgelezen jongemannen, antwoordde en zei: Mijn heer Mozes, verbied hun dat!", "2 Sam 2:1": "Daarna gebeurde het, dat David de HEERE vroeg en zei: Zal ik optrekken in een van de steden van Juda? En de HEERE zei tegen hem: Trek op. En David zei: Waarheen zal ik optrekken? En Hij zei: Naar Hebron.", "Joz 5:1": "En het gebeurde, toen alle koningen van de Amorieten, die aan deze zijde van de Jordaan naar het westen woonden, en alle koningen van de Kanaänieten, die aan de zee woonden, hoorden dat de HEERE de wateren van de Jordaan had uitgedroogd voor de kinderen van Israël, totdat wij daardoor gegaan waren, dat hun hart versmolt, en er was geen moed meer in hen, vanwege de kinderen van Israël.", "Num 14:37": "diezelfde mannen die een kwaad bericht over dat land verspreid hadden, stierven door een plaag, voor het aangezicht van de HEERE.", "Num 13:17-20": "Mozes dan zond hen om het land Kanaän te verspieden; en hij zei tegen hen: Trek hierlangs op, naar het zuiden, en klim op het gebergte; En bekijk het land, hoe het is, en het volk dat daarin woont, of het sterk is of zwak, of het weinig is of veel; En hoe het land is, waarin het woont, of het goed is of slecht; en hoe de steden zijn, waarin het woont, of in legerplaatsen, of in vestingen;", "Num 14:1": "Toen kwam de hele vergadering in opstand, en zij verhieven hun stem, en het volk weende diezelfde nacht.", "Num 33:36": "En zij vertrokken van Ezeon-geber, en legerden zich in de woestijn Zin, dat is Kades.", "Deut 2:11": "Ook zij werden voor reuzen gehouden, zoals de Enakieten; en de Moabieten noemden hen Emieten.", "Num 14:43": "Want de Amalekieten en de Kanaänieten zijn daar vóór u, en u zult door het zwaard vallen; want omdat u zich hebt afgekeerd van de HEERE, zal de HEERE niet met u zijn.", "Num 14:25": "De Amalekieten nu en de Kanaänieten wonen in het dal; keer u morgen om, en vertrek naar de woestijn, op de weg naar de Schelfzee.", "Ex 23:31": "En Ik zal uw grenzen vaststellen van de Schelfzee tot aan de zee van de Filistijnen, en van de woestijn tot aan de rivier; want Ik zal de inwoners van dat land in uw hand geven, zodat u hen voor uw aangezicht wegjaagt.", "2 Sam 21:20-22": "Ook was er nog een oorlog te Gath; en er was een zeer lange man, die zes vingers had aan zijn handen, en zes tenen aan zijn voeten, vierentwintig in getal, en deze was ook aan Rafa geboren. En hij hoonde Israël; maar Jonathan, de zoon van Simea, Davids broer, sloeg hem. Deze vier waren aan Rafa geboren te Gath; en zij vielen door de hand van David, en door de hand van zijn knechten.", "Deut 34:9": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had.", "Jer 32:22": "En U hebt hun dit land gegeven, dat U hun vaderen gezworen had hun te zullen geven, een land dat overvloeit van melk en honing;", "Ezech 34:14": "Op een goede weide zal Ik ze weiden, en op de hoge bergen van Israël zal hun kooi zijn; daar zullen zij neerliggen in een goede kooi, en zullen weiden in een vette weide, op de bergen van Israël.", "Joz 11:21": "In diezelfde tijd nu kwam Jozua, en roeide de Enakieten uit, van het gebergte, van Hebron, van Debir, van Anab, en van heel het gebergte van Juda, en van heel het gebergte van Israël; Jozua trof hen met de ban, met hun steden.", "2 Sam 2:11": "Het getal nu van de dagen dat David koning geweest is te Hebron, over het huis van Juda, is zeven jaar en zes maanden.", "Num 27:18-22": "Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem; En stel hem voor Eleazar, de priester, en voor de hele vergadering; en geef hem opdracht voor hun ogen; En leg iets van uw waardigheid op hem, opdat zij luisteren, namelijk de hele vergadering van de kinderen van Israël.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Num 14:38": "Maar Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, bleven in leven, van de mannen die weggegaan waren om het land te verspieden.", "Hand 7:45": "die onze vaders ook ontvangen hebben, en met Jozua meegenomen hebben naar het land dat de heidenvolken bezaten, die God verdreven heeft voor het aangezicht van onze vaders, tot de dagen van David toe;", "Joz 24:1-33": "Daarna verzamelde Jozua al de stammen van Israël te Sichem, en hij riep de oudsten van Israël, en hun hoofden, en hun rechters, en hun opzichters; en zij stelden zich voor het aangezicht van God. Toen zei Jozua tegen het hele volk: Zo zegt de HEERE, de God van Israël: Aan de overkant van de rivier hebben uw vaders vanouds gewoond, namelijk Terah, de vader van Abraham, en de vader van Nahor; en zij hebben andere goden gediend. Toen nam Ik uw vader Abraham van de overkant van de rivier, en liet hem door heel het land Kanaän trekken; Ik vermeerderde ook zijn nageslacht en gaf hem Izak.", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "Num 14:24": "Maar Mijn dienaar Kaleb, omdat een andere geest met hem geweest is, en hij Mij trouw is blijven volgen, zal Ik hem brengen tot het land waarin hij gekomen was, en zijn nageslacht zal het erfelijk bezitten.", "Joz 13:5": "Daarbij het land van de Giblieten, en de hele Libanon naar de opgang van de zon toe, van Baäl-gad af, onder aan de berg Hermon, tot aan de ingang van Hamath toe.", "Deut 3:11": "Want Og, de koning van Bazan, was als enige van de overgeblevenen van de reuzen overgebleven; zie, zijn bed, een bed van ijzer, staat dat niet in Rabba van de kinderen van Ammon? Negen el is zijn lengte, en vier el zijn breedte, naar de elleboogsmaat van een man.", "Ex 17:9-13": "Mozes zei toen tegen Jozua: Kies mannen voor ons uit, en trek eropuit, strijd tegen Amalek; morgen zal ik op de top van de heuvel staan, met de staf van God in mijn hand. Jozua deed zoals Mozes hem gezegd had, en streed tegen Amalek; maar Mozes, Aäron en Hur klommen op de top van de heuvel. En het gebeurde: terwijl Mozes zijn hand ophief, was Israël de sterkste; maar terwijl hij zijn hand neerliet, was Amalek de sterkste.", "Joz 1:1": "Het gebeurde nu, na de dood van Mozes, de knecht van de HEERE, dat de HEERE tegen Jozua, de zoon van Nun, de dienaar van Mozes, sprak en zei:", "Joz 1:16": "Toen antwoordden zij Jozua: Alles wat u ons geboden hebt, zullen wij doen, en overal waar u ons zenden zult, zullen wij gaan.", "Deut 32:44": "En Mozes kwam, en sprak al de woorden van dit lied voor de oren van het volk, hij en Hosea, de zoon van Nun.", "Num 12:16": "Maar daarna trok het volk verder van Hazeroth, en zij sloegen hun kamp op in de woestijn van Paran.", "Deut 31:7": "En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven.", "Joz 15:13": "Doch Kaleb, de zoon van Jefunne, had hij een deel gegeven te midden van de kinderen van Juda, naar het bevel van de HEERE tot Jozua, de stad van Arba, vader van Enak, dat is Hebron.", "Num 14:36": "En die mannen die Mozes gezonden had om het land te verspieden, en die teruggekomen waren en de hele vergadering tegen hem hadden laten morren, doordat zij een kwaad bericht over dat land verspreidden,", "1 Sam 17:42": "Toen de Filistijn opkeek en David zag, verachtte hij hem; want hij was een jongeman, roodachtig, en daarbij mooi om te zien.", "1 Petr 2:2": "En verlang als pasgeboren kinderen naar de zuivere melk van het Woord, opdat u daardoor mag groeien;", "Num 14:7": "En zij spraken tot de hele vergadering van de kinderen van Israël en zeiden: Het land waar wij doorheen getrokken zijn om het te verspieden, is een buitengewoon goed land.", "Joz 11:22": "Er bleef niemand van de Enakieten over in het land van de kinderen van Israël; alleen bleven zij over in Gaza, in Gath, en in Asdod.", "Richt 18:28": "En er was niemand die hen bevrijdde; want zij lag ver van Sidon, en zij hadden met niemand iets te maken; en zij lag in het dal dat bij Beth-rechob is. Daarna herbouwden zij de stad, en woonden daarin.", "Neh 9:25": "En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.", "Jer 11:5": "Opdat Ik de eed bevestig, die Ik uw vaderen gezworen heb, hun een land te geven vloeiende van melk en honing, zoals het is op deze dag. Toen antwoordde ik en zei: Amen, o HEERE!", "Deut 9:2": "Een groot en lang volk, kinderen van de Enakieten, die u kent, en waarvan u gehoord hebt: Wie zou standhouden voor het aangezicht van de kinderen van Enak?", "Joz 2:1-24": "Jozua, de zoon van Nun, had twee mannen die stiekem zouden verspieden, gestuurd vanuit Sittim, en hij zei: Ga op weg, bekijk het land en Jericho. Zij dan gingen op weg en kwamen bij het huis van een vrouw, een hoer, wier naam was Rachab, en zij sliepen daar. Toen werd aan de koning in Jericho gemeld: Kijk, in deze nacht zijn hier mannen gekomen van de kinderen van Israël, om dit land te doorzoeken. Daarom stuurde de koning van Jericho mensen naar Rachab, en zei: Breng de mannen naar buiten die naar u toe gekomen zijn, die bij u in huis gekomen zijn; want zij zijn gekomen om het hele land te doorzoeken.", "Richt 1:26": "Toen trok deze man naar het land van de Hethieten, en hij bouwde een stad, en noemde die Luz; dit is haar naam tot op deze dag.", "Ex 16:1": "Toen zij van Elim vertrokken waren, kwam de hele gemeenschap van de Israëlieten in de woestijn Sin, die tussen Elim en Sinaï ligt, op de vijftiende dag van de tweede maand nadat zij uit Egypte weggegaan waren.", "Richt 11:22": "En zij namen het hele gebied van de Amorieten in erfelijk bezit, van de Arnon af tot aan de Jabbok, en van de woestijn tot aan de Jordaan.", "Deut 3:5": "Al die steden waren met hoge muren, poorten en grendels versterkt, behalve heel veel onbemuurde steden.", "Num 13:1-33": "En de HEERE sprak tot Mozes en zei: Zend mannen uit, die het land Kanaän verspieden, dat Ik de kinderen van Israël geven zal; van elke stam van hun vaderen zullen jullie een man zenden, ieder een leider onder hen. Mozes dan zond hen uit de woestijn van Paran, op bevel van de HEERE; al die mannen waren hoofden van de kinderen van Israël.", "Num 14:34": "Naar het getal van de dagen waarin u dat land verspied hebt, veertig dagen, elke dag voor elk jaar, zult u uw ongerechtigheden dragen, veertig jaar, en u zult Mijn tegenwerking ervaren.", "Num 21:13": "Van daar reisden zij, en legerden zich aan deze zijde van de Arnon, die in de woestijn is, uitgaande uit het gebied van de Amorieten; want de Arnon is de grens van Moab, tussen Moab en de Amorieten.", "Deut 32:51": "Omdat u zich tegen Mij vergrepen hebt, te midden van de kinderen van Israël, aan het twistwater bij Kades, in de woestijn Zin; omdat u Mij niet geheiligd hebt te midden van de kinderen van Israël.", "Deut 31:7-17": "En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven. De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld. En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël.", "Micha 7:1": "Ai mij! Want ik ben als wanneer de zomervruchten zijn ingezameld; als wanneer de nalezingen in de wijnoogst gebeurd zijn; er is geen druif om te eten; mijn ziel begeert vroegrijpe vrucht.", "Jes 30:4": "Wanneer zijn vorsten in Zoan zullen zijn geweest, en zijn gezanten tot dichtbij Chanes zullen zijn gekomen;", "Richt 1:31": "Aser verdreef de inwoners van Acco niet, noch de inwoners van Sidon, noch Achlab, noch Achsib, noch Chelba, noch Afik, noch Rechob;", "Deut 2:10": "De Emieten woonden hiervoor daarin, een groot en talrijk volk, en lang van gestalte, zoals de Enakieten.", "Gen 14:10": "Het dal Siddim nu was vol lijmputten; en de koningen van Sodom en Gomorra vluchtten en vielen daar; en de overgeblevenen vluchtten naar het gebergte.", "Richt 16:4": "En daarna gebeurde het, dat hij een vrouw lief kreeg, bij de beek Sorek, wier naam Delila was.", "1 Sam 14:48": "En hij handelde dapper, en hij versloeg de Amalekieten, en hij redde Israël uit de hand van hem die hen beroofde.", "Gen 15:19-21": "De Kenieten, en de Kenizzieten, en de Kadmonieten, En de Hethieten, en de Ferezieten, en de Refaïeten, En de Amorieten, en de Kanaänieten, en de Girgazieten, en de Jebusieten.", "Num 34:4": "En deze grens zal voor u omgaan van het zuiden naar de opgang van Akrabbim, en doorgaan naar Zin; en haar uiteinden zullen zijn, vanaf het zuiden naar Kades-Barnea; en zij zal uitgaan naar Hazar-Addar, en doorgaan naar Azmon.", "1 Kron 4:15": "De kinderen van Kaleb nu, de zoon van Jefunne, waren Iru, Ela en Naäm; en de kinderen van Ela, te weten Kenaz.", "Joz 1:1-9": "Het gebeurde nu, na de dood van Mozes, de knecht van de HEERE, dat de HEERE tegen Jozua, de zoon van Nun, de dienaar van Mozes, sprak en zei: Mijn knecht Mozes is gestorven; maak u nu op, trek deze Jordaan over, u en al dit volk, naar het land dat Ik hun, de kinderen van Israël, geef. Elke plaats waarop uw voetzool treden zal, heb Ik u gegeven, zoals Ik tegen Mozes gesproken heb.", "2 Sam 8:9": "Toen nu Thoi, de koning van Hamath, hoorde dat David het hele leger van Hadad-Ezer geslagen had,", "Num 10:12": "En de kinderen van Israël trokken op naar hun tochten, uit de woestijn Sinaï; en de wolk bleef in de woestijn Paran.", "1 Kon 8:65": "Op diezelfde tijd hield Salomo ook het feest, en heel Israël met hem, een grote gemeente, vanaf de ingang van Hamath tot de rivier van Egypte, voor het aangezicht van de HEERE, onze God, zeven dagen en zeven dagen, dat is veertien dagen.", "Richt 1:20": "En zij gaven Hebron aan Kaleb, zoals Mozes gesproken had; en hij verdreef vandaar de drie zonen van Enak.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Num 14:40": "En zij stonden 's morgens vroeg op, en klommen op de top van de berg, en zeiden: Zie, hier zijn wij, en wij zullen optrekken naar de plaats die de HEERE gezegd heeft; want wij hebben gezondigd!", "Joz 19:28": "En Ebron, en Rehob, en Hammon, en Kana, tot aan het grote Sidon.", "1 Sam 17:4-7": "Toen ging er een kampvechter uit het leger van de Filistijnen naar buiten; zijn naam was Goliath, uit Gath; zijn hoogte was zes ellen en een span. En hij had een koperen helm op zijn hoofd, en hij had een schubachtig pantser aan; en het gewicht van het pantser was vijfduizend sikkel koper. En een koperen scheenharnas boven zijn voeten, en een koperen schild tussen zijn schouders.", "Gen 23:17-20": "Zo werd de akker van Efron, die in Machpela was, tegenover Mamre lag, de akker en de spelonk die daarin was, en al het geboomte dat op de akker stond, dat rondom in zijn hele gebied lag, aan Abraham toegewezen, Tot een bezitting, voor de ogen van de zonen van Heth, bij allen die de poort van zijn stad binnengingen. En daarna begroef Abraham zijn vrouw Sara in de spelonk van de akker van Machpela, tegenover Mamre, dat is Hebron, in het land Kanaän.", "1 Sam 30:1": "Het gebeurde nu, toen David en zijn mannen op de derde dag in Ziklag kwamen, dat de Amalekieten in het zuiden en bij Ziklag waren binnengevallen, en Ziklag hadden verslagen, en het met vuur verbrand hadden;", "Jes 19:11": "Zeker, de vorsten van Zoan zijn dwazen, de raad van de wijzen, van de raadgevers van Farao, is redeloos geworden; hoe kunt u dan tegen Farao zeggen: Ik ben een zoon van de wijzen, een zoon van de oude koningen?", "Num 14:8": "Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.", "Deut 1:24": "Die keerden zich om, en trokken op naar het gebergte, en kwamen bij het dal Eskol, en verkenden dat.", "Ex 17:9": "Mozes zei toen tegen Jozua: Kies mannen voor ons uit, en trek eropuit, strijd tegen Amalek; morgen zal ik op de top van de heuvel staan, met de staf van God in mijn hand.", "Deut 3:8": "Zo namen wij in die tijd het land uit de hand van de twee koningen van de Amorieten, die aan deze kant van de Jordaan waren, van de beek Arnon tot de berg Hermon toe;", "Num 34:2-12": "Gebied de kinderen van Israël, en zeg tegen hen: Wanneer u in het land Kanaän komt, dan zal dit het land zijn dat u ter erfenis toevalt, het land Kanaän, met zijn grenzen. De zuiderkant nu zal voor u zijn vanaf de woestijn Zin, langs de zijden van Edom; en de zuidergrens zal voor u zijn vanaf het einde van de Zoutzee, in het oosten; En deze grens zal voor u omgaan van het zuiden naar de opgang van Akrabbim, en doorgaan naar Zin; en haar uiteinden zullen zijn, vanaf het zuiden naar Kades-Barnea; en zij zal uitgaan naar Hazar-Addar, en doorgaan naar Azmon.", "Richt 1:19": "En de HEERE was met Juda, zodat hij de inwoners van het gebergte verdreef; maar hij kon niet doorgaan om de inwoners van het dal te verdrijven, omdat zij ijzeren wagens hadden.", "Gen 23:2": "Sara stierf te Kiriath-arba, dat is Hebron, in het land Kanaän; en Abraham kwam om Sara te beklagen en haar te bewenen.", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Richt 1:15": "En zij zei tegen hem: Geef mij een zegen; omdat u mij een dor land gegeven hebt, geef mij ook waterbronnen. Toen gaf Kaleb haar hoger gelegen bronnen en lager gelegen bronnen.", "1 Kron 20:6": "Daarna was er nog een oorlog bij Gath; en daar was een zeer lange man, en zijn vingers en tenen waren zes en zes, vierentwintig, en hij was ook geboren uit Rafa;", "Jer 2:7": "En Ik bracht u in een vruchtbaar land, om de vrucht ervan en het goede ervan te eten; maar toen u daarin kwam, verontreinigde u Mijn land, en maakte u Mijn erfenis tot een gruwel.", "Ezech 20:6": "Op diezelfde dag hief Ik Mijn hand tot hen op, om hen uit Egypteland uit te leiden, naar een land dat Ik voor hen had uitgezocht, vloeiend van melk en honing, het sieraad van alle landen.", "Jes 60:16": "En u zult de melk van de heidenen zuigen, en u zult de borsten van de koningen zuigen; en u zult weten dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige van Jakob.", "Ex 24:13": "Toen maakte Mozes zich op, met Jozua, zijn dienaar; en Mozes klom op de berg van God.", "Joz 14:13-15": "Toen zegende Jozua hem, en hij gaf Kaleb, de zoon van Jefunne, Hebron als erfdeel. Daarom werd Hebron aan Kaleb, de zoon van Jefunne, de Keneziet, tot erfdeel tot op deze dag; omdat hij had volhard in het navolgen van de HEERE, de God van Israël. De naam van Hebron was vroeger Kirjath-Arba; die Arba een groot man geweest is onder de Enakieten. En het land had rust van de oorlog.", "Amos 6:2": "Ga over naar Kalne, en zie toe; en ga vandaar naar Hamath, de grote stad, en trek af naar Gath van de Filistijnen; zijn zij beter dan deze koninkrijken, of is hun gebied groter dan uw gebied?"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">HEERE</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">sprak</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">tot</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4872\">Mozes</span> en zei:", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H7971\">Zend</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H582\">mannen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H582\">uit</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H776\">die</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H776\">het</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H776\">land</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3667\">Kanaän</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8446\">verspieden</span>, dat <span class=\"wl\" data-l=\"L6\" data-code=\"H589\">Ik</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H589\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5414\">geven</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5414\">zal</span>; <span class=\"wl\" data-l=\"L10\" data-code=\"H259\">van</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H259\">elke</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H4294\">stam</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H4294\">van</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H1\">hun</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H1\">vaderen</span> zullen jullie <span c s=\"wl wl-kjv\" data-code=\"H776\">land</span> is that they dwell <span class=\"wl wl-kjv\" data-code=\"H3427\">in,</span> whether it be <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> or <span class=\"wl wl-kjv\" data-code=\"H7451\">bad;</span> and what <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> they be that they <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H2007\">in,</span> whether in <span class=\"wl wl-kjv\" data-code=\"H4264\">tents,</span> or in strong holds;", "20": "And what the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is, whether it be <span class=\"wl wl-kjv\" data-code=\"H8082\">fat</span> or <span class=\"wl wl-kjv\" data-code=\"H7330\">lean,</span> whether there <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> therein, or not. And be ye of good <span class=\"wl wl-kjv\" data-code=\"H2388\">courage,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">bring</span> of the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span> Now the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> was the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H1061\">firstripe</span> grapes.", "21": "So they went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H8446\">searched</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> from the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H6790\">Zin</span> unto <span class=\"wl wl-kjv\" data-code=\"H7340\">Rehob,</span> as men <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to Hamath.", "22": "And they <span class=\"wl wl-kjv\" data-code=\"H5927\">ascended</span> by the <span class=\"wl wl-kjv\" data-code=\"H const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
