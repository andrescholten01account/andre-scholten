ammua, de zoon van Zaccur.","5":"Van de stam van Simeon, Safat, de zoon van Hori.","6":"Van de stam van Juda, Kaleb, de zoon van Jefunne.","7":"Van de stam van Issaschar, Jigeal, de zoon van Jozef.","8":"Van de stam van Efraïm, Hosea, de zoon van Nun.","9":"Van de stam van Benjamin, Palti, de zoon van Rafu.","10":"Van de stam van Zebulon, Gaddiël, de zoon van Sodi.","11":"Van de stam van Jozef, namelijk voor de stam van Manasse, Gaddi, de zoon van Susi.","12":"Van de stam van Dan, Ammiël, de zoon van Gemalli.","13":"Van de stam van Aser, Sethur, de zoon van Michaël.","14":"Van de stam van Nafthali, Nachbi, de zoon van Wofsi.","15":"Van de stam van Gad, Guël, de zoon van Machi.","16":"Dit zijn de namen van de mannen, die Mozes zond om dat land te verspieden; en Mozes noemde Hosea, de zoon van Nun, Jozua.","17":"Mozes dan zond hen om het land Kanaän te verspieden; en hij zei tegen hen: Trek hierlangs op, naar het zuiden, en klim op het gebergte;","18":"En bekijk het land, hoe het is, en het volk dat daarin woont, of het sterk is of zwak, of het weinig is of veel;","19":"En hoe het land is, waarin het woont, of het goed is of slecht; en hoe de steden zijn, waarin het woont, of in legerplaatsen, of in vestingen;","20":"Ook hoe het land is, of het vet is of mager, of er bomen in zijn of niet; en wees sterk, en neem van de vrucht van het land. Die dagen nu waren de dagen van de eerste vruchten van de wijndruiven.","21":"Zo trokken zij op, en verspiedden het land, van de woestijn Zin af tot Rechob toe, waar men komt bij Hamath.","22":"En zij trokken op in het zuiden, en kwamen tot Hebron toe, en daar waren Ahiman, Sesai en Talmai, kinderen van Enak; Hebron nu was zeven jaar eerder gebouwd dan Zoan in Egypte.","23":"Daarna kwamen zij tot het dal Eskol, en sneden daar een rank af met één tros wijndruiven, die zij met zijn tweeën droegen, op een draagstok; ook van de granaatappels en van de vijgen.","24":"Die plaats noemde men het dal Eskol, vanwege de tros die de kinderen van Israël daar afgesneden hadden.","25":"Daarna keerden zij terug van het verspieden van het land, na veertig dagen.","26":"En zij gingen heen, en kwamen tot Mozes en tot Aäron, en tot de hele vergadering van de kinderen van Israël, in de woestijn van Paran, naar Kades; en brachten hun bescheid terug, aan hen en aan de hele vergadering, en lieten hun de vrucht van het land zien.","27":"En zij vertelden hem en zeiden: Wij zijn gekomen tot dat land, waarheen u ons gezonden hebt; en werkelijk, het vloeit van melk en honing, en dit is zijn vrucht.","28":"Behalve dat het een sterk volk is, dat in dat land woont, en de steden zijn vast en zeer groot; en ook hebben wij daar kinderen van Enak gezien.","29":"De Amalekieten wonen in het land van het zuiden; maar de Hethieten, en de Jebusieten, en de Amorieten wonen op het gebergte; en de Kanaänieten wonen aan de zee, en aan de oever van de Jordaan.","30":"Toen bracht Kaleb het volk tot rust voor Mozes, en zei: Laat ons vrijmoedig optrekken, en het in bezit nemen; want wij zullen het zeker kunnen overweldigen!","31":"Maar de mannen die met hem opgetrokken waren, zeiden: Wij zullen tegen dat volk niet kunnen optrekken, want het is sterker dan wij.","32":"Zo brachten zij een kwaad gerucht over het land dat zij verspied hadden, aan de kinderen van Israël, en zeiden: Dat land, waar wij doorheen gegaan zijn om het te verspieden, is een land dat zijn inwoners verteert; en al het volk dat wij daarin gezien hebben, zijn mannen van grote lengte.","33":"Wij hebben daar ook de reuzen gezien, en de kinderen van Enak, van de reuzen; en wij waren als sprinkhanen in onze ogen, en zo waren wij ook in hun ogen."},"SV":{"1":"En de HEERE sprak tot Mozes, zeggende:","2":"Zend u mannen uit: die het land Kanaän verspieden, hetwelk Ik den kinderen Israëls geven zal; van elken stam zijner vaderen zult gijlieden een man zenden, zijnde ieder een overste onder hen.","3":"Mozes dan zond hen uit de woestijn van Paran, naar den mond des HEEREN; al die mannen waren hoofden der kinderen Israëls.","4":"En dit zijn hun namen: van den stam van Ruben, Sammua, de zoon van Zaccur.","5":"Van den stam van Simeon, Safat, de zoon van Hori.","6":"Van den stam van Juda, Kaleb, de zoon van Jefunne.","7":"Van den stam van Issaschar, Jigeal, de zoon van Jozef.","8":"Van den stam van Efraïm, Hosea, de zoon van Nun.","9":"Van den stam van Benjamin, Palti, de zoon van Rafu.","10":"Van den stam van Zebulon, Gaddiel, de zoon van Sodi.","11":"Van den stam van Jozef, voor den stam van Manasse, Gaddi, de zoon van Susi.","12":"Van den stam van Dan, Ammiël, de zoon van Gemalli.","13":"Van den stam van Aser, Sethur, de zoon van Michaël.","14":"Van den stam van Nafthali, Nachbi, de zoon van Wofsi.","15":"Van den stam van Gad, Guël, de zoon van Machi.","16":"Dit zijn de namen der mannen, die Mozes zond, om dat land te verspieden; en Mozes noemde Hosea, den zoon van Nun, Jozua.","17":"Mozes dan zond hen, om het land Kanaän te verspieden; en hij zeide tot hen: Trekt dit henen op tegen het zuiden, en klimt op het gebergte;","18":"En beziet het land, hoedanig het zij, en het volk, dat daarin woont, of het sterk zij of zwak, of het weinig zij of veel;","19":"En hoedanig het land zij, waarin hetzelve woont, of het goed zij of kwaad; en hoedanig de steden zijn, in dewelke hetzelve woont, of in legers, of in sterkten;","20":"Ook hoedanig het land zij, of het vet zij of mager, of er bomen in zijn of niet; en versterkt u, en neemt van de vrucht des lands. Die dagen nu waren de dagen der eerste vruchten van de wijndruiven.","21":"Alzo trokken zij op, en verspiedden het land, van de woestijn Zin af tot Rechob toe, waar men gaat naar Hamath.","22":"En zij trokken op in het zuiden, en kwamen tot Hebron toe, en daar waren Ahiman, Sesai en Talmai, kinderen van Enak; Hebron nu was zeven jaren gebouwd voor Zoan in Egypte.","23":"Daarna kwamen zij tot het dal Eskol, en sneden van daar een rank af met een tros wijndruiven, dien zij droegen met tweeën, op een draagstok; ook van de granaatappelen en van de vijgen.","24":"Diezelve plaats noemde men het dal Eskol, ter oorzake van den tros, dien de kinderen Israëls van daar afgesneden hadden.","25":"Daarna keerden zij weder van het verspieden des lands, ten einde van veertig dagen.","26":"En zij gingen heen, en kwamen tot Mozes en tot Aäron, en tot de gehele vergadering der kinderen Israëls, in de woestijn van Paran, naar Kades; en brachten bescheid weder aan hen, en aan de gehele vergadering, en lieten hun de vrucht des lands zien.","27":"En zij vertelden hem, en zeiden: Wij zijn gekomen tot dat land, waarheen gij ons gezonden hebt; en voorwaar, het is van melk en honig vloeiende, en dit is zijn vrucht.","28":"Behalve dat het een sterk volk is, hetwelk in dat land woont, en de steden zijn vast, *en* zeer groot; en ook hebben wij daar kinderen van Enak gezien.","29":"De Amalekieten wonen in het land van het zuiden; maar de Hethieten, en de Jebusieten, en de Amorieten wonen op het gebergte; en de Kanaänieten wonen aan de zee, en aan den oever van de Jordaan.","30":"Toen stilde Kaleb het volk voor Mozes, en zeide: Laat ons vrijmoedig optrekken, en dat erfelijk bezitten; want wij zullen dat voorzeker overweldigen!","31":"Maar de mannen, die met hem opgetrokken waren, zeiden: Wij zullen tot dat volk niet kunnen optrekken, want het is sterker dan wij.","32":"Alzo brachten zij een kwaad gerucht voort van het land, dat zij verspied hadden, aan de kinderen Israëls, zeggende: Dat land, door hetwelk wij doorgegaan zijn, om het te verspieden, is een land, dat zijn inwoners verteert; en al het volk, hetwelk wij in het midden van hetzelve gezien hebben, zijn mannen van grote lengte.","33":"Wij hebben ook daar de reuzen gezien, en de kinderen van Enak, van de reuzen; en wij waren als sprinkhanen in onze ogen, alzo waren wij ook in hun ogen."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Send thou men, that they may search the land of Canaan, which I give unto the children of Israel: of every tribe of their fathers shall ye send a man, every one a ruler","3":"And Moses by the commandment of the LORD sent them from the wilderness of Paran: all those men *were* heads of the children of Israel.","4":"And these *were* their names: of the tribe of Reuben, Shammua the son of Zaccur.","5":"Of the tribe of Simeon, Shaphat the son of Hori.","6":"Of the tribe of Judah, Caleb the son of Jephunneh.","7":"Of the tribe of Issachar, Igal the son of Joseph.","8":"Of the tribe of Ephraim, Oshea the son of Nun.","9":"Of the tribe of Benjamin, Palti the son of Raphu.","10":"Of the tribe of Zebulun, Gaddiel the son of Sodi.","11":"Of the tribe of Joseph, *namely*, of the tribe of Manasseh, Gaddi the son of Susi.","12":"Of the tribe of Dan, Ammiel the son of Gemalli.","13":"Of the tribe of Asher, Sethur the son of Michael.","14":"Of the tribe of Naphtali, Nahbi the son of Vophsi.","15":"Of the tribe of Gad, Geuel the son of Machi.","16":"These *are* the names of the men which Moses sent to spy out the land. And Moses called Oshea the son of Nun Jehoshua.","17":"And Moses sent them to spy out the land of Canaan, and said unto them, Get you up this *way* southward, and go up into the mountain:","18":"And see the land, what it *is*; and the people that dwelleth therein, whether they *be* strong or weak, few or many;","19":"And what the land *is* that they dwell in, whether it *be* good or bad; and what cities *they be* that they dwell in, whether in tents, or in strong holds;","20":"And what the land *is*, whether it *be* fat or lean, whether there be wood therein, or not. And be ye of good courage, and bring of the fruit of the land. Now the time *was* the time of the firstripe grapes.","21":"So they went up, and searched the land from the wilderness of Zin unto Rehob, as men come to Hamath.","22":"And they ascended by the south, and came unto Hebron; where Ahiman, Sheshai, and Talmai, the children of Anak, *were*. (Now Hebron was built seven years before Zoan in Egypt.)","23":"And they came unto the brook of Eshcol, and cut down from thence a branch with one cluster of grapes, and they bare it between two upon a staff; and *they brought* of the pomegranates, and of the figs.","24":"The place was called the brook Eshcol, because of the cluster of grapes which the children of Israel cut down","25":"And they returned from searching of the land after forty days.","26":"And they went and came to Moses, and to Aaron, and to all the congregation of the children of Israel, unto the wilderness of Paran, to Kadesh; and brought back word unto them, and unto all the congregation, and shewed them the fruit of the land.","27":"And they told him, and said, We came unto the land whither thou sentest us, and surely it floweth with milk and honey; and this *is* the fruit","28":"Nevertheless the people *be* strong that dwell in the land, and the cities *are* walled, *and* very great: and moreover we saw the children of Anak","29":"The Amalekites dwell in the land of the south: and the Hittites, and the Jebusites, and the Amorites, dwell in the mountains: and the Canaanites dwell by the sea, and by the coast of Jordan.","30":"And Caleb stilled the people before Moses, and said, Let us go up at once, and possess it; for we are well able to overcome","31":"But the men that went up with him said, We be not able to go up against the people; for they *are* stronger","32":"And they brought up an evil report of the land which they had searched unto the children of Israel, saying, The land, through which we have gone to search it, *is* a land that eateth up the inhabitants thereof; and all the people that we saw in it *are* men of a great stature.","33":"And there we saw the giants, the sons of Anak, *which come* of the giants: and we were in our own sight as grasshoppers, and so we were in their sight."}},"tsk":{"2":[{"kopje":"Zend","refs":["Num 32:8","Deut 1:22-25","Joz 2:1-24"]},{"kopje":"van elke","refs":["Num 1:4","Num 34:18"]},{"kopje":"een leider"," g grapes, or, a cluster of grapes] which the children of Israel cut off thence."}],"25":[{"catchword":null,"tekst":"Then they returned from spying of the Land, at the end of fourty days;"}],"26":[{"catchword":null,"tekst":"And they went (their way) and came to Moseh and to Aaron, and to the whole Congregation of the children of Israel in the Wilderness of Paran, [See Genesis.14. on verse 6.] unto Kades: [understand Kades Barnea, which lays in the wilderness of Paran, by the camping place of Rithma, and is to be distinguished from Kades in the wilderness of zin. Whereof see Genesis 14. On verse 7.] and brought report again unto them, and unto the whole congregation, and caused them to see the fruit of the land."}],"27":[{"catchword":null,"tekst":"And they related to him, [viz. to Moseh, as the chief of the Congregation, yet in the presence and audience, not onely of Aaron, but also of the whole Congregation, whence arose the uproar or mutiny described in the sequel here] and said: We came to that land, whither thou didst send us, and verily, it is flowing with milk and honey; [see Exodus 3. On v.8.] and this is the fruit thereof."}],"28":[{"catchword":null,"tekst":"Besides that it is a strong people, [viz. in bodies, means and number] which dwell in the Land, and the cities are fenced, (and) very great, and we likewise, saw the children of Enak there. [see above, verse 22.]"}],"29":[{"catchword":null,"tekst":"The Amalekites, [Of which people see Gen 14:17.] inhabit in the South-country: but the Hethites [of these see Genesis 10. On verse 15. And of the rest together, Genesis.15. on v.19.] and the Jebulites, and the Amorites dwell on the hills; and the Canaanites dwell at the Sea, and at the bank of Jordan. [Hebrew at the hand.]"}],"30":[{"catchword":null,"tekst":"Then Caleb quieted the people, [i.e. he made them hold their peace that he might be heard. There is no mention made here of Joshua, not that he fainted through fear, or that he was not like affected with Cal const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
