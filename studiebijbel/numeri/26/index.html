 Jericho, en zeiden:","4":"Dat men opneemt van twintig jaar oud en daarboven; zoals de HEERE Mozes geboden had, en de kinderen van Israël, die uit Egypteland uitgetrokken waren.","5":"Ruben was de eerstgeborene van Israël. De zonen van Ruben waren: Hanoch, van wie het geslacht der Hanochieten was; van Pallu het geslacht der Palluieten;","6":"Van Hezron het geslacht der Hezronieten; van Karmi het geslacht der Karmieten.","7":"Dit zijn de geslachten der Rubenieten; en hun getelden waren drieënveertigduizend zevenhonderddertig.","8":"En de zonen van Pallu waren Eliab.","9":"En de zonen van Eliab waren Nemuël, en Dathan, en Abiram; deze Dathan en Abiram waren de geroepenen van de vergadering, die geschil maakten tegen Mozes en tegen Aäron, in de groep van Korach, toen zij geschil maakten tegen de HEERE.","10":"En de aarde opende haar mond, en verslond hen met Korach, toen die groep stierf, toen het vuur tweehonderdvijftig mannen verteerde, en zij werden tot een teken.","11":"Maar de kinderen van Korach stierven niet.","12":"De zonen van Simeon, naar hun geslachten: van Nemuël, het geslacht der Nemuëlieten; van Jamin het geslacht der Jaminieten; van Jachin het geslacht der Jachinieten;","13":"Van Zerah het geslacht der Zerahieten; van Saul het geslacht der Saulieten.","14":"Dat zijn de geslachten der Simeonieten: tweeëntwintigduizend tweehonderd.","15":"De zonen van Gad, naar hun geslachten: van Zefon het geslacht der Zefonieten; van Haggi het geslacht der Haggieten; van Suni het geslacht der Sunieten.","16":"Van Ozni het geslacht der Oznieten; van Heri het geslacht der Herieten;","17":"Van Arod het geslacht der Arodieten; van Areli het geslacht der Arelieten.","18":"Dat zijn de geslachten der zonen van Gad, naar hun getelden: veertigduizend vijfhonderd.","19":"De zonen van Juda waren Er en Onan; maar Er en Onan stierven in het land Kanaän.","20":"Zo waren de zonen van Juda naar hun geslachten: van Sela het geslacht der Selanieten; van Perez het geslacht der Perezieten; van Zerah het geslacht der Zerahieten.","21":"En de zonen van Perez waren: van Hezron het geslacht der Hezronieten; van Hamul het geslacht der Hamulieten.","22":"Dat zijn de geslachten van Juda, naar hun getelden: zesenzeventigduizend vijfhonderd.","23":"De zonen van Issaschar, naar hun geslachten, waren: van Tola het geslacht der Tolaieten; van Puva het geslacht der Punieten;","24":"Van Jasub het geslacht der Jasubieten; van Simron het geslacht der Simronieten.","25":"Dat zijn de geslachten van Issaschar, naar hun getelden: vierenzestigduizend driehonderd.","26":"De zonen van Zebulon, naar hun geslachten, waren: van Sered het geslacht der Seredieten; van Elon het geslacht der Elonieten; van Jahleel het geslacht der Jahleelieten.","27":"Dat zijn de geslachten der Zebulonieten, naar hun getelden: zestigduizend vijfhonderd.","28":"De zonen van Jozef, naar hun geslachten, waren Manasse en Efraïm.","29":"De zonen van Manasse waren: van Machir het geslacht der Machirieten; Machir nu verwekte Gilead; van Gilead was het geslacht der Gileadieten.","30":"Dit zijn de zonen van Gilead: van Jezer het geslacht der Jezerieten; van Helek het geslacht der Helekieten.","31":"En van Asriël het geslacht der Asriëlieten; en van Sechem het geslacht der Sechemieten;","32":"En van Semida het geslacht der Semidaieten; en van Hefer het geslacht der Heferieten.","33":"Doch Zelafead, de zoon van Hefer, had geen zonen, maar dochters; en de namen van de dochters van Zelafead waren: Machla en Noa, Hogla, Milka en Tirza.","34":"Dat zijn de geslachten van Manasse: en hun getelden waren tweeënvijftigduizend zevenhonderd.","35":"Dit zijn de zonen van Efraïm, naar hun geslachten: van Sutelah het geslacht der Sutelahieten; van Becher het geslacht der Becherieten; van Tahan het geslacht der Tahanieten.","36":"En dit zijn de zonen van Sutelah; van Eran het geslacht der Eranieten.","37":"Dat zijn de geslachten der zonen van Efraïm, naar hun getelden: tweeëndertigduizend vijfhonderd. Dat zijn de zonen van Jozef, naar hun geslachten.","38":"De zonen van Benjamin, naar hun geslachten: van Bela het geslacht der Belaieten; van Asbel het geslacht der Asbelieten; van Ahiram het geslacht der Ahiramieten;","39":"Van Sefufam het geslacht der Sufamieten; van Hufam het geslacht der Hufamieten.","40":"En de zonen van Bela waren Ard en Naäman; van Ard het geslacht der Ardieten; van Naäman het geslacht der Naamieten.","41":"Dat zijn de zonen van Benjamin, naar hun geslachten; en hun getelden waren vijfenveertigduizend zeshonderd.","42":"Dit zijn de zonen van Dan, naar hun geslachten: van Suham het geslacht der Suhamieten; dat zijn de geslachten van Dan, naar hun geslachten.","43":"Al de geslachten der Suhamieten, naar hun getelden, waren vierenzestigduizend vierhonderd.","44":"De zonen van Aser, naar hun geslachten, waren: van Imna het geslacht der Imnaieten; van Isvi het geslacht der Isvieten; van Beria het geslacht der Beriieten.","45":"Van de zonen van Beria waren: van Heber het geslacht der Heberieten; van Malchiël het geslacht der Malchiëlieten.","46":"En de naam van de dochter van Aser was Serah.","47":"Dat zijn de geslachten der zonen van Aser, naar hun getelden: drieënvijftigduizend vierhonderd.","48":"De zonen van Nafthali, naar hun geslachten: van Jahzeel het geslacht der Jahzeelieten; van Guni het geslacht der Gunieten;","49":"Van Jezer het geslacht der Jezerieten; van Sillem het geslacht der Sillemieten.","50":"Dat zijn de geslachten van Nafthali, naar hun geslachten; en hun getelden waren vijfenveertigduizend vierhonderd.","51":"Dat zijn de getelden van de zonen van Israël: zeshonderdéénduizend zevenhonderddertig.","52":"En de HEERE sprak tot Mozes en zei:","53":"Aan dezen zal het land uitgedeeld worden als erfenis, naar het getal van de namen.","54":"Aan degenen die veel zijn, zult u hun erfenis meer maken, en aan hen die weinig zijn, zult u hun erfenis minder maken; aan ieder zal, naar zijn getelden, zijn erfenis gegeven worden.","55":"Het land zal echter door het lot verdeeld worden; naar de namen van de stammen van hun vaderen zullen zij erven.","56":"Naar het lot zal ieders erfenis verdeeld worden tussen de velen en de weinigen.","57":"Dit zijn nu de getelden van Levi, naar hun geslachten: van Gerson het geslacht der Gersonieten; van Kohath het geslacht der Kohathieten; van Merari het geslacht der Merarieten.","58":"Dit zijn de geslachten van Levi: het geslacht der Libnieten, het geslacht der Hebronieten, het geslacht der Machlieten, het geslacht der Muzieten, het geslacht der Korachieten. En Kohath verwekte Amram.","59":"En de naam van de vrouw van Amram was Jochebed, de dochter van Levi, die *de vrouw* van Levi baarde in Egypte; en deze baarde aan Amram, Aäron, en Mozes, en Mirjam, hun zuster.","60":"En aan Aäron werden geboren Nadab en Abihu, Eleazar en Ithamar.","61":"Nadab nu en Abihu waren gestorven, toen zij vreemd vuur brachten voor het aangezicht van de HEERE.","62":"En hun getelden waren drieëntwintigduizend, al wat mannelijk is, van een maand oud en daarboven; want dezen werden niet geteld onder de kinderen van Israël, omdat hun geen erfenis gegeven werd onder de kinderen van Israël.","63":"Dat zijn de getelden van Mozes en Eleazar, de priester, die de kinderen van Israël telden in de vlakke velden van Moab, aan de Jordaan bij Jericho.","64":"En onder dezen was niemand uit de getelden van Mozes en Aäron, de priester, toen zij de kinderen van Israël telden in de woestijn van Sinaï.","65":"Want de HEERE had van hen gezegd, dat zij in de woestijn zeker zouden sterven; en er was niemand van hen overgebleven, dan Kaleb, de zoon van Jefunne, en Jozua, de zoon van Nun."},"SV":{"1":"Het geschiedde nu na die plaag, dat de HEERE sprak tot Mozes, en tot Eleazar, den zoon van Aäron, den priester, zeggende:","2":"Neem de som van de gehele vergadering der kinderen Israëls op, van twintig jaren oud en daarboven, naar het huis hunner vaderen, al wie ten heire in Israël uittrekt.","3":"Mozes dan en Eleazar, de priester, spraken hen aan, in de vlakke velden van Moab, aan de Jordaan van Jericho, zeggende:","4":"*Dat* *men* *opneme* van twintig jaren oud en daarboven; gelijk als de HEERE Mozes geboden had, en den kinderen Israëls, die uit Egypteland uitgetogen waren.","5":"Ruben was de eerstgeborene van Israël. De zonen van Ruben waren: Hanoch, *van* *welken* was het geslacht der Hanochieten; van Pallu het geslacht der Palluieten;","6":"Van Hezron het geslacht der Hezronieten; van Karmi het geslacht der Karmieten.","7":"Dit zijn de geslachten der Rubenieten; en hun getelden waren drie en veertig duizend zevenhonderd en dertig.","8":"En de zonen van Pallu waren Eliab.","9":"En de zonen van Eliab waren Nemuël, en Dathan, en Abiram; deze Dathan en Abiram waren de geroepenen der vergadering, die gekijf maakten tegen Mozes en tegen Aäron, in de vergadering van Korach, als zij gekijf tegen den HEERE maakten.","10":"En de aarde haar mond opendeed, en verslond hen met Korach, als die vergadering stierf, toen het vuur tweehonderd en vijftig mannen verteerde, en werden tot een teken.","11":"Maar de kinderen van Korach stierven niet.","12":"De zonen van Simeon, naar hun geslachten: van Nemuël, het geslacht der Nemuëlieten; van Jamin het geslacht der Jaminieten; van Jachin het geslacht der Jachinieten;","13":"Van Zerah het geslacht der Zerahieten; van Saul het geslacht der Saulieten.","14":"Dat zijn de geslachten der Simeonieten: twee en twintig duizend en tweehonderd.","15":"De zonen van Gad, naar hun geslachten: van Zefon het geslacht der Zefonieten; van Haggi het geslacht der Haggieten; van Suni het geslacht der Sunieten.","16":"Van Ozni het geslacht der Oznieten; van Heri het geslacht der Herieten;","17":"Van Arod het geslacht der Arodieten; van Areli het geslacht der Arelieten.","18":"Dat zijn de geslachten der zonen van Gad, naar hun getelden: veertig duizend en vijfhonderd.","19":"De zonen van Juda waren Er en Onan; maar Er en Onan stierven in het land Kanaän.","20":"Alzo waren de zonen van Juda naar hun geslachten: van Sela het geslacht der Selanieten; van Perez het geslacht der Perezieten; van Zerah het geslacht der Zerahieten.","21":"En de zonen van Perez waren: van Hezron het geslacht der Hezronieten; van Hamul het geslacht der Hamulieten.","22":"Dat zijn de geslachten van Juda, naar hun getelden: zes en zeventig duizend en vijfhonderd.","23":"De zonen van Issaschar, naar hun geslachten, waren: *van* Tola het geslacht der Tolaieten; van Puva het geslacht der Punieten;","24":"Van Jasub het geslacht der Jasubieten; van Simron het geslacht der Simronieten.","25":"Dat zijn de geslachten van Issaschar, naar hun getelden: vier en zestig duizend en driehonderd.","26":"De zonen van Zebulon, naar hun geslachten, waren: van Sered het geslacht der Seredieten; van Elon het geslacht der Elonieten; van Jahleel het geslacht der Jahleelieten.","27":"Dat zijn de geslachten der Zebulonieten, naar hun getelden: zestig duizend en vijfhonderd.","28":"De zonen van Jozef, naar hun geslachten, waren Manasse en Efraïm.","29":"De zonen van Manasse waren: van Machir het geslacht der Machirieten; Machir nu gewon Gilead; van Gilead was het geslacht der Gileadieten.","30":"Dit zijn de zonen van Gilead: *van* Jezer het geslacht der Jezerieten; van Helek het geslacht der Helekieten.","31":"En *van* Asriël het geslacht der Asriëlieten; en *van* Sechem het geslacht der Sechemieten;","32":"En *van* Semida het geslacht der Semidaieten; en *van* Hefer het geslacht der Heferieten.","33":"Doch Zelafead, de zoon van Hefer, had geen zonen, maar dochters; en de namen der dochteren van Zelafead waren: Machla en Noa, Hogla, Milka en Tirza.","34":"Dat zijn de geslachten van Manasse: en hun getelden waren twee en vijftig duizend en zevenhonderd.","35":"Dit zijn de zonen van Efraïm, naar hun geslachten: van Sutelah het geslacht der Sutelahieten; van Becher het geslacht der Becherieten; van Tahan het geslacht der Tahanieten.","36":"En dit zijn de zonen van Sutelah; van Eran het geslacht der Eranieten.","37":"Dat zijn de geslachten der zonen van Efraïm, naar hun getelden: twee en dertig duizend en vijfhonderd. Dat zijn de zonen van Jozef, naar hun geslachten.","38":"De zonen van Benjamin, naar hun geslachten: van Bela het geslacht der Belaieten; van Asbel het geslacht der Asbelieten; van Ahiram het geslacht der Ahiramieten;","39":"Van Sefufam het geslacht der Sufamieten; van Hufam het geslacht der Hufamieten.","40":"En de zonen van Bela waren Ard en Naäman; *van* Ard het geslacht der Ardieten; van Naäman het geslacht der Naamieten.","41":"Dat zijn de zonen van Benjamin, naar hun geslachten; en hun getelden waren vijf en veertig duizend en zeshonderd.","42":"Dit zijn de zonen van Dan, naar hun geslachten: van Suham het geslacht der Suhamieten; dat zijn de geslachten van Dan, naar hun geslachten.","43":"Al de geslachten der Suhamieten, naar hun getelden, waren vier en zestig duizend en vierhonderd.","44":"De zonen van Aser, naar hun geslachten, waren: van Imna het geslacht der Imnaieten; van Isvi het geslacht der Isvieten; van Beria het geslacht der Beriieten.","45":"Van de zonen van Beria waren: van Heber het geslacht der Heberieten; van Malchiël het geslacht der Malchiëlieten.","46":"En de naam der dochter van Aser was Serah.","47":"Dat zijn de geslachten der zonen van Aser, naar hun getelden: drie en vijftig duizend en vierhonderd.","48":"De zonen van Nafthali, naar hun geslachten: van Jahzeel het geslacht der Jahzeelieten; van Guni het geslacht der Gunieten;","49":"Van Jezer het geslacht der Jezerieten; van Sillem het geslacht der Sillemieten.","50":"Dat zijn de geslachten van Nafthali, naar hun geslachten; en hun getelden waren vijf en veertig duizend en vierhonderd.","51":"Dat zijn de getelden van de zonen Israëls: zeshonderd een duizend zevenhonderd en dertig.","52":"En de HEERE sprak tot Mozes, zeggende:","53":"Aan dezen zal het land uitgedeeld worden ter erfenis, naar het getal der namen.","54":"Aan degenen, die veel zijn, zult gij hun erfenis meerder maken, en aan hen, die weinig zijn, zult gij hun erfenis minder maken; aan een iegelijk zal, naar zijn getelden, zijn erfenis gegeven worden.","55":"Het land nochtans zal door het lot gedeeld worden; naar de namen der stammen hunner vaderen zullen zij erven.","56":"Naar het lot zal elks erfenis gedeeld worden tussen de velen en de weinigen.","57":"Dit zijn nu de getelden van Levi, naar hun geslachten: van Gerson het geslacht der Gersonieten; van Kohath het geslacht der Kohathieten; van Merari het geslacht der Merarieten.","58":"Dit zijn de geslachten van Levi: het geslacht der Libnieten, het geslacht der Hebronieten, het geslacht der Machlieten, het geslacht der Muzieten, het geslacht der Korachieten. En Kohath gewon Amram.","59":"En de naam der huisvrouw van Amram was Jochebed, de dochter van Levi, welke *de* *huisvrouw* van Levi baarde in Egypte; en deze baarde aan Amram, Aäron, en Mozes, en Mirjam, hun zuster.","60":"En aan Aäron werden geboren Nadab en Abihu, Eleazar en Ithamar.","61":"Nadab nu en Abihu waren gestorven, toen zij vreemd vuur brachten voor het aangezicht des HEEREN.","62":"En hun getelden waren drie en twintig duizend, al wat mannelijk is, van een maand oud en daarboven; want dezen werden niet geteld onder de kinderen Israëls, omdat hun geen erfenis gegeven werd onder de kinderen Israëls.","63":"Dat zijn de getelden van Mozes en Eleazar, den priester, die de kinderen Israëls telden in de vlakke velden van Moab, aan de Jordaan van Jericho.","64":"En onder dezen was niemand uit de getelden van Mozes en Aäron, den priester, als zij de kinderen Israëls telden in de woestijn van Sinaï.","65":"Want de HEERE had van die gezegd, dat zij in de woestijn gewisselijk zouden sterven; en er was niemand van hen overgebleven, dan Kaleb, de zoon van Jefunne, en Jozua, de zoon van Nun."},"KJV":{"1":"And it came to pass after the plague, that the LORD spake unto Moses and unto Eleazar the son of Aaron the priest, saying,","2":"Take the sum of all the congregation of the children of Israel, from twenty years old and upward, throughout their fathers' house, all that are able to go to war in Israel.","3":"And Moses and Eleazar the priest spake with them in the plains of Moab by Jordan *near* Jericho, saying,","4":"*Take the sum of the people*, from twenty years old and upward; as the LORD commanded Moses and the children of Israel, which went forth out of the land of Egypt.","5":"Reuben, the eldest son of Israel: the children of Reuben; Hanoch, *of whom cometh* the family of the Hanochites: of Pallu, the family of the Palluites:","6":"Of Hezron, the family of the Hezronites: of Carmi, the family of the Carmites.","7":"These *are* the families of the Reubenites: and they that were numbered of them were forty and three thousand and seven hundred and thirty.","8":"And the sons of Pallu; Eliab.","9":"And the sons of Eliab; Nemuel, and Dathan, and Abiram. This *is that* Dathan and Abiram, *which were* famous in the congregation, who strove against Moses and against Aaron in the company of Korah, when they strove against the LORD:","10":"And the earth opened her mouth, and swallowed them up together with Korah, when that company died, what time the fire devoured two hundred and fifty men: and they became a sign.","11":"Notwithstanding the children of Korah died","12":"The sons of Simeon after their families: of Nemuel, the family of the Nemuelites: of Jamin, the family of the Jaminites: of Jachin, the family of the Jachinites:","13":"Of Zerah, the family of the Zarhites: of Shaul, the family of the Shaulites.","14":"These *are* the families of the Simeonites, twenty and two thousand and two hundred.","15":"The children of Gad after their families: of Zephon, the family of the Zephonites: of Haggi, the family of the Haggites: of Shuni, the family of the Shunites:","16":"Of Ozni, the family of the Oznites: of Eri, the family of the Erites:","17":"Of Arod, the family of the Arodites: of Areli, the family of the Arelites.","18":"These *are* the families of the children of Gad according to those that were numbered of them, forty thousand and five hundred.","19":"The sons of Judah *were* Er and Onan: and Er and Onan died in the land of Canaan.","20":"And the sons of Judah after their families were; of Shelah, the family of the Shelanites: of Pharez, the family of the Pharzites: of Zerah, the family of the Zarhites.","21":"And the sons of Pharez were; of Hezron, the family of the Hezronites: of Hamul, the family of the Hamulites.","22":"These *are* the families of Judah according to those that were numbered of them, threescore and sixteen thousand and five hundred.","23":"*Of* the sons of Issachar after their families: *of* Tola, the family of the Tolaites: of Pua, the family of the Punites:","24":"Of Jashub, the family of the Jashubites: of Shimron, the family of the Shimronites.","25":"These *are* the families of Issachar according to those that were numbered of them, threescore and four thousand and three hundred.","26":"*Of* the sons of Zebulun after their families: of Sered, the family of the Sardites: of Elon, the family of the Elonites: of Jahleel, the family of the Jahleelites.","27":"These *are* the families of the Zebulunites according to those that were numbered of them, threescore thousand and five hundred.","28":"The sons of Joseph after their families *were* Manasseh and Ephraim.","29":"Of the sons of Manasseh: of Machir, the family of the Machirites: and Machir begat Gilead: of Gilead *come* the family of the Gileadites.","30":"These *are* the sons of Gilead: *of* Jeezer, the family of the Jeezerites: of Helek, the family of the Helekites:","31":"And *of* Asriel, the family of the Asrielites: and *of* Shechem, the family of the Shechemites:","32":"And *of* Shemida, the family of the Shemidaites: and *of* Hepher, the family of the Hepherites.","33":"And Zelophehad the son of Hepher had no sons, but daughters: and the names of the daughters of Zelophehad *were* Mahlah, and Noah, Hoglah, Milcah, and Tirzah.","34":"These *are* the families of Manasseh, and those that were numbered of them, fifty and two thousand and seven hundred.","35":"These *are* the sons of Ephraim after their families: of Shuthelah, the family of the Shuthalhites: of Becher, the family of the Bachrites: of Tahan, the family of the Tahanites.","36":"And these *are* the sons of Shuthelah: of Eran, the family of the Eranites.","37":"These *are* the families of the sons of Ephraim according to those that were numbered of them, thirty and two thousand and five hundred. These *are* the sons of Joseph after their families.","38":"The sons of Benjamin after their families: of Bela, the family of the Belaites: of Ashbel, the family of the Ashbelites: of Ahiram, the family of the Ahiramites:","39":"Of Shupham, the family of the Shuphamites: of Hupham, the family of the Huphamites.","40":"And the sons of Bela were Ard and Naaman: *of Ard*, the family of the Ardites: *and* of Naaman, the family of the Naamites.","41":"These *are* the sons of Benjamin after their families: and they that were numbered of them *were* forty and five thousand and six hundred.","42":"These *are* the sons of Dan after their families: of Shuham, the family of the Shuhamites. These *are* the families of Dan after their families.","43":"All the families of the Shuhamites, according to those that were numbered of them, *were* threescore and four thousand and four hundred.","44":"*Of* the children of Asher after their families: of Jimna, the family of the Jimnites: of Jesui, the family of the Jesuites: of Beriah, the family of the Beriites.","45":"Of the sons of Beriah: of Heber, the family of the Heberites: of Malchiel, the family of the Malchielites.","46":"And the name of the daughter of Asher *was* Sarah.","47":"These *are* the families of the sons of Asher according to those that were numbered of them; *who were* fifty and three thousand and four hundred.","48":"*Of* the sons of Naphtali after their families: of Jahzeel, the family of the Jahzeelites: of Guni, the family of the Gunites:","49":"Of Jezer, the family of the Jezerites: of Shillem, the family of the Shillemites.","50":"These *are* the families of Naphtali according to their families: and they that were numbered of them *were* forty and five thousand and four hundred.","51":"These *were* the numbered of the children of Israel, six hundred thousand and a thousand seven hundred and thirty.","52":"And the LORD spake unto Moses, saying,","53":"Unto these the land shall be divided for an inheritance according to the number of names.","54":"To many thou shalt give the more inheritance, and to few thou shalt give the less inheritance: to every one shall his inheritance be given according to those that were numbered","55":"Notwithstanding the land shall be divided by lot: according to the names of the tribes of their fathers they shall inherit.","56":"According to the lot shall the possession thereof be divided between many and few.","57":"And these *are* they that were numbered of the Levites after their families: of Gershon, the family of the Gershonites: of Kohath, the family of the Kohathites: of Merari, the family of the Merarites.","58":"These *are* the families of the Levites: the family of the Libnites, the family of the Hebronites, the family of the Mahlites, the family of the Mushites, the family of the Korathites. And Kohath begat Amram.","59":"And the name of Amram's wife *was* Jochebed, the daughter of Levi, whom *her mother* bare to Levi in Egypt: and she bare unto Amram Aaron and Moses, and Miriam their sister.","60":"And unto Aaron was born Nadab, and Abihu, Eleazar, and Ithamar.","61":"And Nadab and Abihu died, when they offered strange fire before the LORD.","62":"And those that were numbered of them were twenty and three thousand, all males from a month old and upward: for they were not numbered among the children of Israel, because there was no inheritance given them among the children of Israel.","63":"These " data-code=\"H4191\">die</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness.</span> And there was not <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of them, save <span class=\"wl wl-kjv\" data-code=\"H3612\">Caleb</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3312\">Jephunneh,</span> and <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Nun."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"na die plaag,","tekst":"Versta, de plaag vermeld in het voorgaande hoofdstuk Num 25, door welke vier en twintig duizend Israëlieten omgekomen zijn, ter oorzaak van hun hoererij met de Moabietische vrouwen en afgoderij met Baäl-Peor bedreven. Na deze plagen waren er geen meer [dan Jozua en Kaleb] overig van degenen, die, boven de twintig jaren oud zijnde, om hun murmurering, waren veroordeeld in de woestijn te moeten sterven, eer de kinderen Israëls in het bezit des beloofden lands treden zouden. Zie boven, Num 14:33-35; zie in vs.63,64,65; Deu 2:14."}],"2":[{"catchword":"Neem de som","tekst":"Deze telling van de kinderen Israëls wordt gehouden voor de derde, nadat zij uit Egypte gescheiden waren. De eerste was in hetzelfde jaar toen zij uitlogen, Exo 30:12, enz. De tweede was in het begin des tweeden jaars, Num 1:2. De derde deze, van welke vs.2 gesproken wordt."},{"catchword":"jaren oud en daarboven,","tekst":"Hebreeuws, een zoon van twintig jaren oud. Alzo in het volgende."},{"catchword":"al wie ten heire in Israël uittrekt","tekst":"Zie boven, Num 1:3."}],"3":[{"catchword":"vlakke velden van Moab,","tekst":"Zie boven, Num 22:1, en onder in vs.63, en Num 33:48."},{"catchword":"de Jordaan van Jericho,","tekst":"Waar deze rivier zich nabij de stad Jericho wendt. Alzo boven, Num 22:1, en onder, vs.63."}],"4":[{"catchword":"Dat men opneme","tekst":"Dit woord is hier tot aanvulling ingevoegd uit vs.2. Evenwel, het kan nagelaten woren, de overzetting aldus gesteld zijnde: Van twintig jaren oud, en daarboven, enz., zodat dit het begin zou zijn van de rol, de Mozes gemaakt en het volk voorgelezen heeft."},{"catchword":"die uit Egypteland uitgetogen waren","tekst":"Zie boven, Num 1:2, en vergelijk Exo 30:12."}],"5":[{"catchword":"van welken was","tekst":"Het woordje van is hier ingevoegd, naar gelijkheid der volgende manier van spreken. Alzo ook onder, vs.23, enz. Het andere moet dikwijls, naar de eigenschap der Hebreeuwse taal, tot aanvulling van den zin, als een bijvoegsel, er in gelaten worden."}],"6":[{"catchword":"Hezron het geslacht der Hezronieten;","tekst":"Hebreeuws, Chetsron."}],"8":[{"catchword":"zonen van Pallu waren Eliab","tekst":"Het getal van velen, voor het getal van een. Zie Gen 21:7, en Gen 46:7."}],"9":[{"catchword":"geroepenen der vergadering,","tekst":"Zie boven, Num 1:16, en Num 16:2."},{"catchword":"in de vergadering van Korach,","tekst":"Versta, die muitige en oproerige samenrotting, waarvan Korach het hoofd geweest was. Zie boven, Num 16:1-3."}],"10":[{"catchword":"opendeed,","tekst":"Dat is, openspleet, zeer wijde en diepe kloven makende."},{"catchword":"met Korach,","tekst":"Versta, met Korachs huisgezin, wat toen bij hem was; boven, Num 16:32. Want Korach zelf was met de twee honderd vijftig mannen verbrand; in hetzelfde hoofdstuk, Num 16:35."},{"catchword":"tot een teken","tekst":"Hebreeuws, tot een banier; dat is, tot een opmerkelijk exempel van een rechtvaardige straf Gods over degenen, die oproer en scheuring aanrichten tegen de orde, die God in zijn kerk en de republiek gesteld heeft."}],"11":[{"catchword":"stierven niet","tekst":"Te weten, noch door het vuur, dat hun vader en zijn rot verteerd had, noch door de verzinking in de aarde, met het huisgezin huns vaders. Hetwelk geschied is omdat zij in die muiterij niet hadden bewilligd, en in den dienst des tabernakels mochten bezig zijn."}],"12":[{"catchword":"Nemuël,","tekst":"Anders genoemd Jemuel; Gen 46:10."}],"13":[{"catchword":"Zerah","tekst":"Die ook Zochar genoemd wordt, Gen 46:10."}],"14":[{"catchword":"twee en twintig duizend en tweehonderd","tekst":"Merk op, dat hun getal zeer verminderd was van hetgeen verhaald wordt boven, Num 1:23; mogelijk omdat zij Zimri, den zoon van Salu, die een overste der Simeonieten was, in het stukje zijner boze daad, vermeld boven, Num 25:14, waren toegedaan geweest, ja daarin hem nagevolgd hadden."}],"15":[{"catchword":"Zefon","tekst":"Hebreeuws, Tsephon; die ook Ziphjon genoemd wordt, Gen 46:16. Vergelijk verder deze namen met het voorgemelde Gen 46; idem, met 1Ch 1, 1Ch 2, 1Ch 3, 1Ch 4, 1Ch 5, 1Ch 6, 1Ch 7, 1Ch 8, enz."}],"16":[{"catchword":"Ozni","tekst":"Die ook Ezbon schijnt genaamd te zijn, Gen 46:16."}],"17":[{"catchword":"Arod","tekst":"Genaamd Arodi; Gen 46:16."}],"19":[{"catchword":"stierven in het land Kanaän","tekst":"Te weten, door een rechtvaardig oordeel Gods, hetwelk ging over hun grote en grove zonden. Zie Gen 38:7."}],"20":[{"catchword":"Perez","tekst":"Hebreeuws, Perets."}],"23":[{"catchword":"van Tola","tekst":"Zie boven, vs.5."}],"24":[{"catchword":"Jasub","tekst":"Ook Job-genaamd ; Gen 46:13."}],"30":[{"catchword":"van","tekst":"Dit woordje is hier en in de twee volgende verzen bijgevoegd uit de voorgaande en navolgende manier van spreken in dit hfdst. Zie boven, vs.5."},{"catchword":"Jezer","tekst":"Anders genoemd Abiëzer, Jos 17:2, en elders."}],"33":[{"catchword":"Zeláfead,","tekst":"Hebreeuws, Tselophchad."}],"38":[{"catchword":"Ahiram","tekst":"Die ook Ehi schijnt genaamd te zijn, Gen 46:21, en Achrach, 1Ch 8:1."}],"42":[{"catchword":"Suham","tekst":"Die ook Chuschim schijnt genoemd te zijn; Gen 46:23."}],"45":[{"catchword":"Heber","tekst":"Hebreeuws, Cheber, met de letter Chet."}],"48":[{"catchword":"Jáhzeël","tekst":"Hebreeuws, Jachtseël, of Jachtsiël, gelijk 1Ch 7:13."}],"49":[{"catchword":"Sillem","tekst":"Die ook Schallum genoemd wordt, 1Ch 7:13."}],"51":[{"catchword":"de getelden van de zonen Israëls","tekst":"Merk hier op de gewisse waarheid en almogende kracht Gods, in de beloofde vermenigvuldiging van Abrahams zaad. Want alzo in 38 jaren meer dan zes honderd duizend en drie duizend Israëlieten gestorven waren, zo heeft nochtans God teweeggebracht, dat hetzelfde getal hetwelk verhaald wordt boven, Num 1:46, gebleven is, uitgenomen een duizend en enige honderden."}],"53":[{"catchword":"Aan dezen zal het land","tekst":"Te weten, geslachten der stammen."},{"catchword":"naar het getal der namen","tekst":"Dat is, naardat een geslacht klein of groot is; dat is, uit weinige of uit veel mensen bestaande, wier namen in een register waren opgetekend. Vergelijk vs.54."}],"54":[{"catchword":"gij hun erfenis meerder maken,","tekst":"Hetwelk door Mozes geschied is op deze zijde van de Jordaan, onder de stammen van Ruben en Gad en den halven stam van Manasse, onder, Num 32:33, maar door Jozua, naar het bevel van Mozes, onder de andere stammen, en den anderen halven stam van Manasse; Jos 14, enz."}],"55":[{"catchword":"lot gedeeld worden;","tekst":"Het land werd eerst door het lot gedeeld in twaalf stammen, en de stammen daarna in huisgezinnen, en dat door het oordeel der oversten en des hogepriesters."},{"catchword":"zij erven","tekst":"Te weten, de huisgezinnen van elken stam zullen naar de wijze in vs.54 voorgeschreven, in hun erf treden."}],"56":[{"catchword":"het lot zal","tekst":"Hebreeuws, naar den mond des lots. Want het lot is des HEEREN, verklarende zijn wil."},{"catchword":"erfenis gedeeld worden","tekst":"Versta, ten aanzien van de deling der stammen."}],"58":[{"catchword":"Libnieten,","tekst":"Die van Gerson afkomstig waren. Zie boven, Num 3:18."},{"catchword":"Hebronieten,","tekst":"Van Kahath afkomstig, boven Num 3:19."},{"catchword":"Machlieten,","tekst":"Dezen en de Musieten hadden hun afkomst van Merari; boven, Num 3:20."},{"catchword":"Korachieten","tekst":"De nakomelingen Kahaths; boven, Num 16:1."}],"59":[{"catchword":"de huisvrouw van Levi","tekst":"Hebreeuws, welke zij den Levi baarde. Versta door deze barende, niet Jochebed [die de geboren persoon is], maar de huisvrouw van Levi, de moeder van Jochebed en de moei van Amram, wiens grootvader Levi was."}],"62":[{"catchword":"van een maand oud en daarboven;","tekst":"Hebreeuws, zonen ener maagd"},{"catchword":"onder de kinderen Israëls,","tekst":"Hebreeuws, in het midden; alzo in het volgende van dit vers."}],"63":[{"catchword":"telden","tekst":"Zie boven, Num 1:1-2, enz."}],"64":[{"catchword":"als zij de kinderen Israëls","tekst":"Zie van deze telling, Exo 30:12-14."}],"65":[{"catchword":"gewisselijk zouden sterven;","tekst":"Hebreeuws, stervende sterven; dat is, zekerlijk sterven; te weten, òf door plagen, òf hun natuurlijken dood, en dat vanwege hun wederspannigheid. Zie boven, Num 14:28-30, en onder, Num 27:3."},{"catchword":"Kaleb,","tekst":"Deze twee waren God getrouw gebleven, en hadden het volk mede daartoe vermaand; boven, Num 14:6, enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now it came to pass after that plague, [Understand the plague mentioned in the precedent Chapter, whereby twenty four thousand Israelites perished, by reason of their committed whoredome with the Moabitish women, and idolatry with Baal Peor. After this plague there were none (but Joshua and Caleb) left of those above twenty years old, that for their murmurings sake were condemned to die in the Wilderness, before the children of Israel should enter into the possession of the land of promise; see above ch.14.33,34.35. Item, in this chapter v.63 64, 65. And Deut.2.14.] that the LORD spake to Moseh, and to Eleazar, the son of Aaron the Priest; saying;"}],"2":[{"catchword":null,"tekst":"Take up the sum of the whole Congregation of the children of Israel; [This numbering is held to be the Third, after their coming out of Egypt. The first was in the same year of their coming forth, Exo 30:12.&c. the second in the beginning of the second year, Num 1:2: The third is here spoken of] from twenty year old. [Heb. a son of twenty year, and so in the sequel] and upward: according to the of their fathers: all 9or every one) that goeth to the host, [see above, c.1.on.v.3.] in Israel."}],"3":[{"catchword":null,"tekst":"Moseh then, and Eleazar the Priest, spake to them, in the plains of Moab, [See above, ch.22.v.1. and below in this chapter, v.63. and ch.33.48.] at the Jordan of Jericho, [where this rivers turneth it self near to Jericho; so above, ch.22. and below here,v.63.] saying:"}],"4":[{"catchword":null,"tekst":"(Let the sum be taken up) from twenty year old and upward; [The parenthesis is inserted to complete the sense out of verse 2. Nevertheless it may be remitted, the words being rendered and read in this manner; From twenty year old and upward, etc. so that this should be the beginning of the muster-roll it self, which Moseh made, and showed unto the people] according as the Lord had commanded Moseh, and the children of Israel, that were come forth out of Egypt. [see above, chap.1.v.2. and compare Exo 30:12.]"}],"5":[{"catchword":null,"tekst":"Rueben was the first-born of Israel: the son of Rueben, were Hanoch; of whom was the family of the Hanochites; [The particle of or from, are inserted here, to hold an answerableness to the Phrase following; so likewise below, v.23. &c. the other word, them, must often be admitted and added to complete the sense, according to the property of the Hebrew Language] of Pallu, the family of the Palluites:"}],"6":[{"catchword":null,"tekst":"Of Hezron, [Heb. Chetsron] the Family of the Hezronites; of Carmi, the Family of the Carmites."}],"7":[{"catchword":null,"tekst":"These are the Families of the Ruebenites: and their number (ones) were fourty and three thousand, and seven hundred and thirty."}],"8":[{"catchword":null,"tekst":"And the sons of Pallu were Eliab. [The Plurall for the singular, see Gen.21.on v.7. and 46.on v.7.]"}],"9":[{"catchword":null,"tekst":"And the sons of Eliab, were Nemuel, and Dathan, and Abiram: these Dathan and Abiram were the called (ones) [Numb.1.on v.16. and chap.16.2.] of the Congregation, that made contention against Moseh and against Aaron, in the Congregation of Korah, [understand that mutinous and rebellious assembly, whereof assembly, whereof Korah was the ring-leader; see above chap.16.1.2, 3.] when they made contention against the LORD."}],"10":[{"catchword":null,"tekst":"And the earth opened her mouth, [i.e. did split asunder, making a very broad and deep gap] and swallowed them up with Korah, [Understand with Korahs family, which was with them then, above, ch.16.33. for as for Korah himself he was burnt together with the two hundred & fifty men; see the same cha. v. 35.] when the Congregation died: when the fire consumed two hundred and fifties men, and because a token. [Heb. a banner, i.e. a remarkable example of the righteous judgement of God upon those which cause uproar, division and sedition, against the order established by God, in Church and Commonwealth.]"}],"11":[{"catchword":null,"tekst":"But the children of Korah died not. [viz. neither by the fire, which consumed their father and his company; nor by the sinking into the earth, with their fathers family; which happened, because they consented not to their fathers mutiny, and peradventure were the whiles employed in the service of the Tabernacle.]"}],"12":[{"catchword":null,"tekst":"The sons of Simeon, according to their families; of Nemeul, [Otherwise called Jemuel, Gen 46:10.] the family of the Nemuelites of Jamin, the family of the Jaminites: of Jachin, the family of the Jachinites:"}],"13":[{"catchword":null,"tekst":"Of Zerah, [Called also Zochar, Gen.46. 10.] the family of the Zerahites: of Saul, the family of the Saulites."}],"14":[{"catchword":null,"tekst":"These are the families of the Simeonites: twenty two thousand and two hundred. [Observer that their number is much diminished here, from what it was above, ch. 1.23. possibly because they were addicted much to Simei, the Son of Sallu, who was a chief ruler of the Simeonites, and consequently, they may have both approved of his lewd fast, mentioned above, chap. 25.14, and were as ready to follow his example.]"}],"16":[{"catchword":null,"tekst":"Of Ozni, [Who seemeth likewise to be called Ezbon, Gen 46:16.] the family of the Oznites: of Heri, the family of the Herites:"}],"17":[{"catchword":null,"tekst":"Of Arod, [Gen 46:16. called Arodi] The family of the Arodites: of Areli, the family of the Arelites."}],"18":[{"catchword":null,"tekst":"These are the families of the sons of Gad, according to their numbred ones, fourty thousand, and five hundred."}],"19":[{"catchword":null,"tekst":"The sons of Judah were, Er and Onan: but Er and Onan died in the land of Canaan, [viz. by a just judgement of God, upon their gross and enomous sins. See Gen.38.on v.7.]"}],"20":[{"catchword":null,"tekst":"Thus the sons of Judge were, according to their families; of Sela, the family of the Selanites: of Perez, [Heb. Perets] the family of the Perezites: of Zerah, the family of the Zerahites."}],"21":[{"catchword":null,"tekst":"And the sons of Perez were; of Hezron, the family of the Hezronites: of Hamul, the family of the Hamulites."}],"22":[{"catchword":null,"tekst":"These are the families of Juda, according to their numbered ones, seventy and six thousand and five hundred."}],"23":[{"catchword":null,"tekst":"The sons of Issaschar, according to their families, were; (of) [see above, on verse 5.] Tola the families of the Tolaites; of Puva of the family of the Puvites."}],"24":[{"catchword":null,"tekst":"Of Jasub [Called Job, Gen 45:13.] the families of the Jasubites: of Simeon, the family of the Simeonites."}],"25":[{"catchword":null,"tekst":"These are the families of Issaachar, according to their numbred (one) sixtie and foure thousand, and were; of Sered, the family of the Seredites: of Elon, the Family of the Elonites: of Jahleel, the Family of the Jahleelites."}],"26":[{"catchword":null,"tekst":"The sons of Zebulon, according to their families, were: of Sered, the family of the Seredites, of Elon, the family of the Elonites, of Jahleel, the family of the Jahleetites."}],"27":[{"catchword":null,"tekst":"These are the families of the Zebulonites, according to their numbered (one): sixty thousand and five hundred."}],"28":[{"catchword":null,"tekst":"The sons of Joseph according to their Families, were Manasseh, and Ephraim."}],"29":[{"catchword":null,"tekst":"The sons of Manasseh were; of Machir, the family of the Machirites: Machir now begat Gilead: of Gilead was the family of the Gileadites."}],"30":[{"catchword":null,"tekst":"These are the sons of Gilead; (of) [This particle is inserted here and in the two following verse out of the foregoing and ensuing manner of speaking in this Chapter. See above, on v.5.] Jezer, [otherwise called Abiezer, Jos.17. 1. and elsewhere] the Family of the Jezrites: of Helek, the Family of the Helekites."}],"31":[{"catchword":null,"tekst":"And of Asriel, the Family of the Asrielites: and of Sechem the Family of the Sechemites."}],"32":[{"catchword":null,"tekst":"And (of) Semida, the family of the Semidaites: and (of) Hepher, the Family of the Hepherites."}],"33":[{"catchword":null,"tekst":"Yet Zelaphead [Heb.Tselophehad] the son of Hepher had no sons, but daughters; and the names of the daughters of Zelaphead, were, Machla, and Noa, Hogla, Milca and Tizra."}],"34":[{"catchword":null,"tekst":"These are the Families of Manasseh: and their numbered (one) were fifty and two thousand and seven hundred."}],"35":[{"catchword":null,"tekst":"These are the sons of Ephraim, according to their Families; of Sutelah, the family of the Sutelahites: of Becher, the Family of the Becherites: of Tahan, the Family of the Tahanites."}],"36":[{"catchword":null,"tekst":"And these are the sons of Sutelah: of Eran, the family of the Eranites."}],"37":[{"catchword":null,"tekst":"These are the Families of the sons of Ephraim, according to their numbered (ones) thirty and two thousand and five hundred. These are the sons of Joseph, according to their Families."}],"38":[{"catchword":null,"tekst":"The sons of Benjamin, according to their Families; of Bela, the Family of the Belaites: of Asbel the Family of the Asbelites: of Ahiram, the Family of the Ahiramites. [Ahiram seemeth to be likewise called Ehi, Gen 46:21. and Achrach, 1 Chron.8.1.]"}],"39":[{"catchword":null,"tekst":"Of Sephupham, the Family of the Sephuphamites: of Hupham, the Family of the Huphamites."}],"40":[{"catchword":null,"tekst":"And the sons of Bela,were Ard, and Naaman: (of Ard) the Family of the Ardites: of Naaman, the Family of the Naamites."}],"41":[{"catchword":null,"tekst":"These are the sons of Benjamin, according to their Families, and their numbered (ones) were fourty five thousand and six hundred."}],"42":[{"catchword":null,"tekst":"These are the sons of Dan, according o their Families; of Sucham, [Gen 46:23. called Chushim] the Family of the Suhamites; These are the families of Dan, according to their families."}],"43":[{"catchword":null,"tekst":"All the Families of the Suhamites, according to their numbered (ones) were sixty four thousand and four hundred."}],"44":[{"catchword":null,"tekst":"The sons of Aser, according to their families, were of Imna, the Family of the Imnaits: of Isvi, the Family of the Isvites: of Beria, the Family of the Berites."}],"45":[{"catchword":null,"tekst":"Of the sons of Beria were; of Heber, [Heb. Cheber with the letter Chet] the Family of the Hebrites; of Malchiel, the Family of the Malchielites."}],"46":[{"catchword":null,"tekst":"And the name of the daughter of Aser was Serah."}],"47":[{"catchword":null,"tekst":"These are the Families of the sons of Aser, according to their numbered (ones,) fifty and three thousand, and four hundred."}],"48":[{"catchword":null,"tekst":"The sons of Naphtali, according to their Families; of Jahzeel [Heb. Jachtzeel, or Jachtsiel. 1 Chronicles 7.13.] the Families of the Jahzeelites: of Guni, the family of the Gunites."}],"49":[{"catchword":null,"tekst":"Of Jezer, the Family of the Jezerites: of Sillem, [1 Chron. 7.13. Schallun] the families of the Scillemites."}],"50":[{"catchword":null,"tekst":"These are the families of Naphatali, according to their families, and their numbered (ones) were fourty five thousand and four hundred."}],"51":[{"catchword":null,"tekst":"These are the numbered (ones) of the sons of Israel, six hundred thousand, one thousand seven hundred and thirty. [Mark here the unsayling truth, and mighty power of God; in the promised multiplication of Abrahams seed: for there having died, within the space of thirty eight yeeres, more then Six Millions & three thousand Israelites in the wildernesse, yet God brought it about, that the sane number remained, which was formerly rehersed Numbers, 1.46, onely a thousand and od hundreds excepted.]"}],"52":[{"catchword":null,"tekst":"And the LORD spake unto Moses, saying:"}],"53":[{"catchword":null,"tekst":"Unto these [viz. families of the Tribes] the land shall be distributed for an inhabitance, according to the number of the names. [i.e. proportionably according as the families be great or small, consisting of many or few men, whose names were all enrolled, compare the next verse.]"}],"54":[{"catchword":null,"tekst":"To them that are many, thou shalt make their inheritance more, and to them that are few, shalt thou make their inheritance less: unto every one his inheritance shall be given, according to his numbered (ones). [All this was performed accordingly, on this side Jordan, by Moses, among the tribes of Rueben, and Gad, and half the tribe of Manasseh. Bel.ch.32.v.35. and beyond Jordan among the rest of the Tribes, and the other half of Manasseh, by Joshua, Jos.14.&c.]"}],"55":[{"catchword":null,"tekst":"Nevertheless, the land shall be divided by lot: [the land was first divided by lot into twelve tribes, and the Tribes afterwards into their families, and that according to the Judgement of their respective ruling Heads, and the high priest] they shall inherit, according to the names of the tribes of their fathers. [i.e. the families of each Tribe shall step into their possessions, according to the manner prescribed in the former verse.]"}],"56":[{"catchword":null,"tekst":"The inheritance of every one [Understand in regard of the division to be made among the Tribes] shall be divided according to the lot, [Heb. according to the mouth of the lot, for the lot is the LORD, declaring his pleasure] between the many and the few."}],"57":[{"catchword":null,"tekst":"These now are the numbered ones of Levi, according to their families; of Gerson the family of the Gersonites; of Kehath, the family of the Kehathites, of Merari the family of the Merarites."}],"58":[{"catchword":null,"tekst":"These are the families of Levi; the family of the Libnites [Descending from Gerson] the Family of the Hebronites, [issuing from Kahath. ab. Ch.3.19.] the Family of the Mahlites, the Family of the Musites; [these two had their descent from Merari; ab. Ch.3.20.] the Family of the Korhites; [of the posterity of Kahath ab. Chap: 16.1.] and Kehath begat Amram."}],"59":[{"catchword":null,"tekst":"And the name of Amrams wife was Jochebed the daughter of Levi (his wife) [Heb. when she i.e. Levi his wife, not Jochebed (the person born) but her mother, Aunt to Amram who was the grandson of Levi,] brought forth in Egypt, and this (woman) bare Amram, Aaron, Moseh and Miriam their sister."}],"60":[{"catchword":null,"tekst":"And unto Aaron were born, Nadab, Abihu, Eleazar, and Ithamar."}],"61":[{"catchword":null,"tekst":"Nadab now and Abihu died; when they brought strange fire before the face of the LORD."}],"62":[{"catchword":null,"tekst":"And their numbred (ones) were twenty and three thousand, all that were male from a moneth old, [Hebr. the sons of a moneth.] and upward: for these were not told among [Heb. in the midst, and so in the sequel of this verse] the children of Israel, there being no inheritance given them, among the children of Israel:"}],"63":[{"catchword":null,"tekst":"These are the numbered ones of Moseh etc Eleazar the priest who numbered [See ab.chap.1.v.112,&c.] the children of Israel, in the plains of Moab, by Jordan of Jericho;"}],"64":[{"catchword":null,"tekst":"And among these there was none of the numbred (ones) of Moseh, and Aaron the Priest, when they numbred the children of Israel in the wildernesse of Sinai. [See of this numbering. Exo 30:12, 13, 14.]"}],"65":[{"catchword":null,"tekst":"For the LORD had said of them, that they should surely die in the wildernesse, [Hebr. dying dye. i.e. assuredly depart this life, either by some plague, or their naturall death, and that by reason of their rebellion and stiff-neckednesse, see ab. Chap. 14. 28, 29, 30. and bel. chap.27.3.] and there was none remained, but Caleb the son of Jephunneh, and Joshua the son of Nun. [these two remained faithfull to God themselves, and exhorted the people to the like; ab.chap 14.6. &c.]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
