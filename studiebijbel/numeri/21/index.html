en Israël verbande hen en hun steden; en men noemde de naam van die plaats Horma.","4":"Toen reisden zij van de berg Hor, op de weg naar de Schelfzee, om het land van de Edomieten heen te trekken; maar de ziel van het volk werd verdrietig op deze weg.","5":"En het volk sprak tegen God en tegen Mozes: Waarom hebt u ons laten optrekken uit Egypte, opdat wij zouden sterven in de woestijn? Want hier is geen brood, ook geen water, en onze ziel walgt van dit zeer lichte brood.","6":"Toen zond de HEERE vurige slangen onder het volk, die het volk beten; en er stierf veel volk van Israël.","7":"Daarom kwam het volk tot Mozes, en zij zeiden: Wij hebben gezondigd, omdat wij tegen de HEERE en tegen u gesproken hebben; bid tot de HEERE, dat Hij deze slangen van ons wegneemt. Toen bad Mozes voor het volk.","8":"En de HEERE zei tegen Mozes: Maak u een vurige slang, en zet die op een stang; en het zal gebeuren, dat ieder die gebeten is, als hij haar aanziet, zal leven.","9":"En Mozes maakte een koperen slang, en zette die op een stang; en het gebeurde, als een slang iemand beet, dat hij de koperen slang aanzag, en hij bleef in leven.","10":"Toen vertrokken de kinderen van Israël, en zij legerden zich te Oboth.","11":"Daarna reisden zij van Oboth, en legerden zich bij de heuvels van Abarim in de woestijn, die tegenover Moab is, tegen de opgang van de zon.","12":"Van daar reisden zij, en legerden zich bij de beek Zered.","13":"Van daar reisden zij, en legerden zich aan deze zijde van de Arnon, die in de woestijn is, uitgaande uit het gebied van de Amorieten; want de Arnon is de grens van Moab, tussen Moab en de Amorieten.","14":"(Daarom wordt gezegd in het boek van de oorlogen van de HEERE: Tegen Waheb, in een wervelwind, en tegen de beken van Arnon,","15":"En het aflopen van de beken, dat zich richt naar de ligging van Ar, en aanleunt tegen de grens van Moab.)","16":"En van daar reisden zij naar Beer. Dit is de put, waarvan de HEERE tot Mozes zei: Verzamel het volk, dan zal Ik hun water geven.","17":"(Toen zong Israël dit lied: Spring op, put, zing daarvan bij beurte!","18":"Put, die de vorsten gegraven hebben, die de edelen van het volk gedolven hebben, door de wetgever, met hun staven.) En van de woestijn reisden zij naar Mattana;","19":"En van Mattana tot Nahaliël; en van Nahaliël tot Bamoth;","20":"En van Bamoth tot het dal, dat in het veld van Moab is, bij de hoogte van Pisga, en dat uitziet over de wildernis.","21":"Toen zond Israël boden tot Sihon, de koning van de Amorieten, en zei:","22":"Laat mij door uw land trekken. Wij zullen niet afwijken naar de akkers, noch naar de wijngaarden; wij zullen het water van de putten niet drinken; wij zullen op de koninklijke weg gaan, totdat wij uw grondgebied doorgetrokken zijn.","23":"Doch Sihon liet Israël niet toe door zijn gebied te trekken; maar Sihon verzamelde al zijn volk, en hij ging uit, Israël tegemoet, naar de woestijn, en hij kwam te Jahza, en streed tegen Israël;","24":"Maar Israël sloeg hem met de scherpte van het zwaard, en nam zijn land in erfelijk bezit, van de Arnon af tot de Jabbok toe, tot aan de kinderen van Ammon; want het gebied van de kinderen van Ammon was sterk.","25":"Zo nam Israël al deze steden in; en Israël woonde in al de steden van de Amorieten, te Hesbon, en in al haar onderhorige plaatsen.","26":"Want Hesbon was de stad van Sihon, de koning van de Amorieten; en hij had gestreden tegen de vorige koning van de Moabieten, en hij had al zijn land uit zijn hand genomen, tot aan de Arnon.","27":"Daarom zeggen zij die spreekwoorden gebruiken: Komt tot Hesbon; men bouwt en bevestigt de stad van Sihon!","28":"Want er is een vuur uitgegaan uit Hesbon; een vlam uit de stad van Sihon; het heeft Ar der Moabieten verteerd, *en* de heren van de hoogten van de Arnon.","29":"Wee u, Moab! U, volk van Kamoz, bent verloren! Hij heeft zijn zonen, die ontkwamen, en zijn dochters in de gevangenschap geleverd aan Sihon, de koning van de Amorieten.","30":"En wij hebben hen neergeveld! Hesbon is verloren tot Dibon toe; en wij hebben hen verwoest tot Nofat toe, dat tot Medeba toe *reikt*.","31":"Zo woonde Israël in het land van de Amoriet.","32":"Daarna zond Mozes om Jaezer te verspieden; en zij namen haar onderhorige plaatsen in; en hij dreef de Amorieten die er waren uit hun bezit.","33":"Toen wendden zij zich en trokken op naar de weg van Basan; en Og, de koning van Basan, ging uit hun tegemoet, hij en al zijn volk, tot de strijd, en naar Edrei.","34":"De HEERE nu zei tegen Mozes: Vrees hem niet; want Ik heb hem in uw hand gegeven, en al zijn volk, ook zijn land; en u zult hem doen, zoals u Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.","35":"En zij sloegen hem, en zijn zonen, en al zijn volk, zodat hem niemand overbleef; en zij namen zijn land in erfelijk bezit."},"SV":{"1":"Als de Kanaäniet, de koning van Harad, wonende tegen het zuiden, hoorde, dat Israël door den weg der verspieders kwam, zo streed hij tegen Israël, en hij voerde enige gevangenen uit denzelven gevankelijk weg.","2":"Toen beloofde Israël den HEERE een gelofte, en zeide: Indien Gij dit volk geheel in mijn hand geeft, zo zal ik hun steden verbannen.","3":"De HEERE dan verhoorde de stem van Israël, en gaf de Kanaänieten over; en hij verbande hen en hun steden; en hij noemde den naam dier plaats Horma.","4":"Toen reisden zij van den berg Hor, op den weg der Schelfzee, dat zij om het land der Edomieten heentogen; doch de ziel des volks werd verdrietig op dezen weg.","5":"En het volk sprak tegen God en tegen Mozes: Waarom hebt gijlieden ons doen optrekken uit Egypte, opdat wij sterven zouden in de woestijn? Want hier is geen brood, ook geen water, en onze ziel walgt over dit zeer lichte brood.","6":"Toen zond de HEERE vurige slangen onder het volk, die beten het volk; en er stierf veel volks van Israël.","7":"Daarom kwam het volk tot Mozes, en zij zeiden: Wij hebben gezondigd, omdat wij tegen den HEERE en tegen u gesproken hebben; bid den HEERE, dat Hij deze slangen van ons wegneme. Toen bad Mozes voor het volk.","8":"En de HEERE zeide tot Mozes: Maak u een vurige slang, en stel ze op een stang; en het zal geschieden, dat al wie gebeten is, als hij haar aanziet, zo zal hij leven.","9":"En Mozes maakte een koperen slang, en stelde ze op een stang; en het geschiedde, als een slang iemand beet, zo zag hij de koperen slang aan, en hij bleef levend.","10":"Toen verreisden de kinderen Israëls, en zij legerden zich te Oboth.","11":"Daarna reisden zij van Oboth, en legerden zich aan de heuvelen van Abarim in de woestijn, die tegenover Moab is, tegen den opgang der zon.","12":"Van daar reisden zij, en legerden zich bij de beek Zered.","13":"Van daar reisden zij, en legerden zich aan deze zijde van de Arnon, welke in de woestijn is, uitgaande uit de landpalen der Amorieten; want de Arnon is de landpale van Moab, tussen Moab en tussen de Amorieten.","14":"(Daarom wordt gezegd in het boek van de oorlogen des HEEREN: Tegen Waheb, in een wervelwind, en tegen de beken Arnon,","15":"En den afloop der beken, die zich naar de gelegenheid van Ar wendt, en leent aan de landpale van Moab.)","16":"En van daar *reisden* *zij* naar Beer. Dit is de put, van welken de HEERE tot Mozes zeide: Verzamel het volk, zo zal Ik hun water geven.","17":"(Toen zong Israël dit lied: Spring op, gij put, zingt daarvan bij beurte!","18":"Gij put, dien de vorsten gegraven hebben, dien de edelen des volks gedolven hebben, door den wetgever, met hun staven.) En van de woestijn *reisden* *zij* naar Mattana;","19":"En van Mattana tot Nahaliel; en van Nahaliel tot Bamoth;","20":"En van Bamoth tot het dal, dat in het veld van Moab is, aan de hoogte van Pisga, en dat tegen de wildernis ziet.","21":"Toen zond Israël boden tot Sihon, den koning der Amorieten, zeggende:","22":"Laat mij door uw land trekken. Wij zullen niet afwijken in de akkers, noch in de wijngaarden; wij zullen het water der putten niet drinken; wij zullen op den koninklijken weg gaan, totdat wij uw landpale doorgetogen zijn.","23":"Doch Sihon liet Israël niet toe, door zijn landpale door te trekken; maar Sihon vergaderde al zijn volk, en hij ging uit, Israël tegemoet, naar de woestijn, en hij kwam te Jahza, en streed tegen Israël;","24":"Maar Israël sloeg hem met de scherpte des zwaards, en nam zijn land in erfelijke bezitting, van de Arnon af tot de Jabbok toe, tot aan de kinderen Ammons; want de landpale der kinderen Ammons was vast.","25":"Alzo nam Israël al deze steden in; en Israël woonde in al de steden der Amorieten, te Hesbon, en in al haar onderhorige plaatsen.","26":"Want Hesbon was de stad van Sihon, den koning der Amorieten; en hij had gestreden tegen den vorigen koning der Moabieten, en hij had al zijn land uit zijn hand genomen, tot aan de Arnon.","27":"Daarom zeggen zij, die spreekwoorden gebruiken: Komt tot Hesbon; men bouwe en bevestige de stad van Sihon!","28":"Want er is een vuur uitgegaan uit Hesbon; een vlam uit de stad van Sihon; zij heeft verteerd Ar der Moabieten, *en* de heren der hoogten van de Arnon.","29":"Wee u, Moab! Gij, volk Kamoz zijt verloren! Hij heeft zijn zonen, die ontliepen, en zijn dochters in de gevangenis geleverd aan Sihon, den koning der Amorieten.","30":"En wij hebben hen nedergeveld! Hesbon is verloren tot Dibon toe; en wij hebben hen verwoest tot Nofat toe, welke tot Medeba toe *reikt*.","31":"Alzo woonde Israël in het land van den Amoriet.","32":"Daarna zond Mozes om Jaezer te verspieden; en zij namen haar onderhorige plaatsen in; en hij dreef de Amorieten, die er waren, uit de bezitting .","33":"Toen wendden zij zich en trokken op den weg van Basan; en Og, de koning van Basan, ging uit hun tegemoet, hij en al zijn volk, tot den strijd, en Edrei.","34":"De HEERE nu zeide tot Mozes: Vrees hem niet; want Ik heb hem in uw hand gegeven, en al zijn volk, ook zijn land; en gij zult hem doen, gelijk als gij Sihon, den koning der Amorieten, die te Hesbon woonde, gedaan hebt.","35":"En zij sloegen hem, en zijn zonen, en al zijn volk, alzo dat hem niemand overbleef; en zij namen zijn land in erfelijke bezitting."},"KJV":{"1":"And *when* king Arad the Canaanite, which dwelt in the south, heard tell that Israel came by the way of the spies; then he fought against Israel, and took *some* of them prisoners.","2":"And Israel vowed a vow unto the LORD, and said, If thou wilt indeed deliver this people into my hand, then I will utterly destroy their cities.","3":"And the LORD hearkened to the voice of Israel, and delivered up the Canaanites; and they utterly destroyed them and their cities: and he called the name of the place Hormah.","4":"And they journeyed from mount Hor by the way of the Red sea, to compass the land of Edom: and the soul of the people was much discouraged because of the way.","5":"And the people spake against God, and against Moses, Wherefore have ye brought us up out of Egypt to die in the wilderness? for *there is* no bread, neither *is there any* water; and our soul loatheth this light bread.","6":"And the LORD sent fiery serpents among the people, and they bit the people; and much people of Israel died.","7":"Therefore the people came to Moses, and said, We have sinned, for we have spoken against the LORD, and against thee; pray unto the LORD, that he take away the serpents from us. And Moses prayed for the people.","8":"And the LORD said unto Moses, Make thee a fiery serpent, and set it upon a pole: and it shall come to pass, that every one that is bitten, when he looketh upon it, shall live.","9":"And Moses made a serpent of brass, and put it upon a pole, and it came to pass, that if a serpent had bitten any man, when he beheld the serpent of brass, he lived.","10":"And the children of Israel set forward, and pitched in Oboth.","11":"And they journeyed from Oboth, and pitched at Ijeabarim, in the wilderness which *is* before Moab, toward the sunrising.","12":"From thence they removed, and pitched in the valley of Zared.","13":"From thence they removed, and pitched on the other side of Arnon, which *is* in the wilderness that cometh out of the coasts of the Amorites: for Arnon *is* the border of Moab, between Moab and the Amorites.","14":"Wherefore it is said in the book of the wars of the LORD, What he did in the Red sea, and in the brooks of Arnon,","15":"And at the stream of the brooks that goeth down to the dwelling of Ar, and lieth upon the border of Moab.","16":"And from thence *they went* to Beer: that *is* the well whereof the LORD spake unto Moses, Gather the people together, and I will give them water.","17":"Then Israel sang this song, Spring up, O well; sing","18":"The princes digged the well, the nobles of the people digged it, by *the direction of* the lawgiver, with their staves. And from the wilderness *they went* to Mattanah:","19":"And from Mattanah to Nahaliel: and from Nahaliel to Bamoth:","20":"And from Bamoth *in* the valley, that *is* in the country of Moab, to the top of Pisgah, which looketh toward Jeshimon.","21":"And Israel sent messengers unto Sihon king of the Amorites, saying,","22":"Let me pass through thy land: we will not turn into the fields, or into the vineyards; we will not drink *of* the waters of the well: *but* we will go along by the king's *high* way, until we be past thy borders.","23":"And Sihon would not suffer Israel to pass through his border: but Sihon gathered all his people together, and went out against Israel into the wilderness: and he came to Jahaz, and fought against Israel.","24":"And Israel smote him with the edge of the sword, and possessed his land from Arnon unto Jabbok, even unto the children of Ammon: for the border of the children of Ammon *was* strong.","25":"And Israel took all these cities: and Israel dwelt in all the cities of the Amorites, in Heshbon, and in all the villages","26":"For Heshbon *was* the city of Sihon the king of the Amorites, who had fought against the former king of Moab, and taken all his land out of his hand, even unto Arnon.","27":"Wherefore they that speak in proverbs say, Come into Heshbon, let the city of Sihon be built and prepared:","28":"For there is a fire gone out of Heshbon, a flame from the city of Sihon: it hath consumed Ar of Moab, *and* the lords of the high places of Arnon.","29":"Woe to thee, Moab! thou art undone, O people of Chemosh: he hath given his sons that escaped, and his daughters, into captivity unto Sihon king of the Amorites.","30":"We have shot at them; Heshbon is perished even unto Dibon, and we have laid them waste even unto Nophah, which *reacheth* unto Medeba.","31":"Thus Israel dwelt in the land of the Amorites.","32":"And Moses sent to spy out Jaazer, and they took the villages thereof, and drove out the Amorites","33":"And they turned and went up by the way of Bashan: and Og the king of Bashan went out against them, he, and all his people, to the battle at Edrei.","34":"And the LORD said unto Moses, Fear him not: for I have delivered him into thy hand, and all his people, and his land; and thou shalt do to him as thou didst unto Sihon king of the Amorites, which dwelt at Heshbon.","35":"So they smote him, and his sons, and all his people, until there was none left him alive: and they possessed his land."}},"tsk":{"1":[{"kopje":"Harad","refs":["Num 33:40","Joz 12:14","Richt 1:16"]},{"kopje":"de weg van de verspieders","refs":["Num 13:21","Num 13:22","Num 14:45"]},{"kopje":"toen","refs":["Deut 2:32","Joz 7:5","Joz 11:19","Joz 11:20","Ps 44:4","Ps 44:5"]}],"2":[{"kopje":"beloofde","refs":["Gen 28:20","Richt 11:30","1 Sam 1:11","2 Sam 15:7","2 Sam 15:8","Ps 56:13","Ps 56:14","Ps 116:18","Ps 132:2"]},{"kopje":"zal ik","refs":["Lev 27:28","Lev 27:29","Deut 13:15","Joz 6:17","Joz 6:26","1 Kor 16:22"]}],"3":[{"kopje":"verhoorde","refs":["Ps 10:17","Ps 91:15","Ps 102:18"]},{"kopje":"verbande hen","refs":["Joz 12:14"]},{"kopje":"de naam","refs":["Num 14:45","Deut 1:44","1 Sam 30:30"]}],"4":[{"kopje":"berg Hor","refs":["Num 20:22","Num 20:23","Num 20:27","Num 33:41"]},{"kopje":"op pan> and delivered <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites;</span> and they utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> them and their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> Hormah.","4":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed</span> from <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H2023\">Hor</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> to <span class=\"wl wl-kjv\" data-code=\"H5437\">compass</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> was much <span class=\"wl wl-kjv\" data-code=\"H7114\">discouraged</span> because of the way.","5":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> against <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and against <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Wherefore have ye brought us <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness?</span> for there is no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> neither is there any <span class=\"wl wl-kjv\" data-code=\"H4325\">wat [{"catchword":"volk Kamoz zijt verloren","tekst":"Dat is, gij volk, dat den Chamos eert en dient. Aldus werd genoemd de afgod der Moabieten, 1Ki 11:33."},{"catchword":"Hij heeft","tekst":"Te weten, Chamos."},{"catchword":"zijn zonen,","tekst":"Te weten, van Moab; dat is, de Moabieten."},{"catchword":"die ontliepen,","tekst":"Dat is, Chamos heeft hen gevankelijk laten wegvoeren, zonder dat hij hen heeft kunnen beschermen."}],"30":[{"catchword":"nedergeveld","tekst":"Of, geschoten; te weten, met pijlen. Anders, hun lamp is vergaan; dat is, hun heerlijkheid."},{"catchword":"Dibon toe;","tekst":"Een van de hoge plaatsen of steden in het land Moab; Isa 14:2; Jer 48:18, Jer 48:22."},{"catchword":"Médeba toe reikt.","tekst":"Een stad in het land Moab; Isa 15:2."}],"32":[{"catchword":"Jáëzer te verspieden;","tekst":"De naam ener stad, die eertijds den Moabieten had toebehoord, van welke gesproken wordt Num 32:1, Num 32:3, Num 32:35, en Jer 48:32."},{"catchword":"onderhorige plaatsen in;","tekst":"Zie boven, vs.25."}],"33":[{"catchword":"Basan;","tekst":"Dit was een goed, vet weiland, van hetwelk gesproken wordt Deu 32:14; Psa 22:13; Jer 50:19; Amo 4:1; Mic 7:14."},{"catchword":"Og,","tekst":"Deze Og is ook een koning der Amorieten geweest, een reus. Zie van hem Deu 3:1, Deu 3:11."},{"catchword":"Edreï","tekst":"Een stad in het koninkrijk van Og gelegen; Deu 3:10."}],"35":[{"catchword":"niemand overbleef;","tekst":"Hebreeuws, geen overige overbleEf"},{"catchword":"zijn land in erfelijke bezitting","tekst":"Te weten, het land van den koning Og."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"When the Canaanite the King of Harad; [This seemeth to be the name of the City where this King had his residence, see jos.12.14. Others are of opinion, that the King himself was called Harad] inhabiting toward the south, [viz.of the Land of Canaan, whither the spies went, numb.13.17. see also Num 33:40.] heard that Israel came by the way of the spies: [i.e. the same way, which the spies had sent forth. Some conceive the word Atharim (rendred spy here) to be the name of a certain place] he fought against Israel, and he carried away some captives of them away captives."}],"2":[{"catchword":null,"tekst":"Then Israel vowed a vow unto the LORD, and said: if thou dost give this people wholly into my hand, then I will banne their cities. [i.e. I will not keep the same for my own use and advantage, but hallow them unto thee, or destroy them for thine honour; see Isa. Chap.6.17, 19, 21, 24. And Lev.27.28, 29.]"}],"3":[{"catchword":null,"tekst":"The LORD then heard the voice of Israel, and gave the Canaanites over, [viz. into his hands, as v. 2.] and he banned them, and their Cities: [this was not completely performed in Moseh&acirc;&euro;&trade;s time, but by Joshua afterwards Jos.12.14. and Jud 1:16,17.] and he, [viz. Israel, i.e. the Israelites] called the name of that place Horma. [i.e. banning, utter destruction.]"}],"4":[{"catchword":null,"tekst":"Then they journeyed from mount Hor, on the way of the reed-sea, [See Exo 13:18.] that they might march about the Land of the Edomites: yet the peoples soul grew vexed, [Hebr. Perverted, see Jud.10.on v.16.] upon this way [or, by reason of this way.]"}],"5":[{"catchword":null,"tekst":"And the people spake against God, and against Moseh; wherefore have ye made us to come up out of Egypt? That we should die in this Wilderness? For here is no bread nor water, and our soul loatheth this very light bread. [Thus they call the bread of heaven, or the Manna which was still continued to them]"}],"6":[{"catchword":null,"tekst":"Then the LORD sent fieries Serpents [Heb. Burning Serpents, thus called from the effect of their biting, which caused a mortall burning, and conse6. Then the LORD sent fieries Serpents [Heb. Burning Serpents, thus called from the effect of their biting, which caused a mortall burning, and consequently an excessive thirst] among the people: and there died much people of Israel."}],"7":[{"catchword":null,"tekst":"Therefore the people came to Moseh, and said: We have sinned, for having spoken against the LORD, and against thee; pray to the LORD that he take away these Serpents from us; then Moseh prayed for the people."}],"8":[{"catchword":null,"tekst":"And the LORD said to Moseh, make thee a fierie Serpent, [Verse 9. It is called a copper Serpent; the meaning here is make a copper Serpent like unto one of these fiery ones] and put it upon a pole, [Or, stake, spear; others, for a sign, or upon a banner] and it shall come to pass, that every one that is bitten, when he looketh on it, he shall live. [i.e. recover and remain alive.]"}],"9":[{"catchword":null,"tekst":"And Moseh made a copper Serpent, and put it upon a pole; and it came to pass, when a Serpent did bite any one, he looked upon the copper Serpent, and he remained alive."}],"10":[{"catchword":null,"tekst":"Then the children of Israel journeyed, and they camped themselves at Oboth."}],"11":[{"catchword":null,"tekst":"After that, they journeyed from Oboth, and camped themselves by the hills of Abarim, in the Wilderness, which is over against Moab, towards the rising of the Sunne."}],"12":[{"catchword":null,"tekst":"From thence they journeyed and camped themselves by the brook Zered:"}],"13":[{"catchword":null,"tekst":"From thence they journeyed and camped themselves on this side of Arnon, at the terry of Arnon] which is in the Wilderness coming forth out of the border of the Amorites; for Arnon is the border of Moab, between Moab, and between the Amorites; [of Arnon, see Jud 12:18.]"}],"14":[{"catchword":null,"tekst":"Therefore it is said [Others, it shall be said, viz. in future ages, or time to come] in the book of the Wars of the LORD: [i.e. of such Wars as were made by the appointment and manifest power of the LORD: this Book, or Writing, or Relation; is no more extant now, though without any prejudice or detriment of the Canonicall Scriptures] against Vaheb [viz. (as it may be understood,) were those Wars of the LORD,] or (fighting) against Vaheb, etc, or the like. The words following, as also of verse 15. are hard to be understood, and are variously interpreted; We set them down here, as they are rendred by the most Learned. Vaheb is thought to have been the King of the Moabites, whom Sihon subdued, verse 26.] in a whirle-winde, [Hebr. Besupha. Some take this to be the name of ascertain place; otherwise called Suph, Deut.1.1. others, the red Sea] and against the brooks of Arnon."}],"15":[{"catchword":null,"tekst":"And the descent of the brooks, turning it self toward the situation of Ar, [a City so called in the Land of the Moabites, v. 28.] and Leaneth, [or bordereth, toucheth, is situated] on the borders of Moab."}],"16":[{"catchword":null,"tekst":"And from thence (they journeyed) to Beer: This is the Well, whereof the LORD said unto Moseh; gather the people, and I will give them water."}],"17":[{"catchword":null,"tekst":"(Then Israel sang this song, [Praising the goodness of God in providing this good Well, or Fountain for them] Spring up thou Well, sing thereof by turns; [or sing it by turns; See exodus 15.21. and 1 Sam.18.7. and Psa 147:7.]"}],"18":[{"catchword":null,"tekst":"Thou well, which the Princes digged, which the Nobles of the people delved by the Law-giver, [i.e. by his advise and direction; understand the Law-giver Moseh, as also Deut.33.21. or, by the Law-giver, God himself may be understood here, as Isa.33 22.] with their states:) [understand this of the staves of Moseh and Aaron; or, of the staves of authority, which the Princes and Governours did usually bear in their hands in token of their office, place and authoritie, wherein God had put them, and from the Wilderness (they Journeyed) to Mattana."}],"19":[{"catchword":null,"tekst":"And from Mattana to Nahaliel: and from Nahaliel to Bamoth."}],"23":[{"catchword":null,"tekst":"But Sihon did not let Israel pass through his borders; but Sihon gathered all his people, and he went forth to meet Israel, to the wilderness and he came to Jahza, [The name of a City likewise mentioned, Deuteronomy .32. Jud 21:20. Jer 48:21.34.] and fought against Israel."}],"24":[{"catchword":null,"tekst":"But Israel smote him with the edge [Heb.mouth] of the sword; and took his Land in hereditary possession, even from arnon unto Jabbok, [these are names of rivers in those parts] even unto the children of Ammon; (for the border of the children of Ammon was strong) [this is the reason why Sihon could not take the border as he had taken the Land of the Moabites.]"}],"25":[{"catchword":null,"tekst":"Thus Israel took in all these Cities: and Israel dwelt in all the Cities of the Amorites, at Hesbon, and in all her dependant places. [Hebr. Daughters, i.e. small Cities, Towns and villages resorting under and subjected to Hebron, as their Metropolis. Or chief Cities. Moseh calleth them elsewhere unwalled Cities, or Towns, Deut.3.5.]"}],"26":[{"catchword":null,"tekst":"For Hesbon was the City of Sihon the King of the Amorites, and they had fought against the former King of the Moabites: [i.e. with him that was King there, immediately before Balak] and he had taken all his land out of his hand, even to Arnon."}],"27":[{"catchword":null,"tekst":"Therefore those that use Proverbs, say; Come to Hesbon, let them build and fortify the City of Sihon. [i.e. greater and stronger then she was before.]"}],"28":[{"catchword":null,"tekst":"For there is a fire gone forth from Hesbon; a flame out of the City of Sihon: [i.e. Sihon after that he had subdued Hesbon brake forth thence, and like a fire, over-run and embraced all the Land of Moab] it hath devoured Are of the Moabites, [viz. their Metropolis, from which the whole land got its Denomination] (and) the LORDS of the high places (or heights) of Anon; [understand the priest and Princes, which were not able to save or defend the City by their idol. See Jer 48:7. others, the Citizens of Bamoth, at Anon.]"}],"29":[{"catchword":null,"tekst":"Woe unto thee Moab, thou people of Chamoz art undone: [i.e. thou people which serve and worship Chamoz: thus the Idol of the Moabites was called, 1 Kings 11.33.] He [viz. Chamoz] hath delivered his sons [i.e. Moabs sons, or the Moabites , which ran away] and his daughter into captivity, [i.e. Chamoz, in stead of protecting and defending them, hath suffered them to be led away captive] to Sthon the King of the Ammorites."}],"30":[{"catchword":null,"tekst":"And we have fled (or thrown) them down: [Or shot them, viz. with arrows, others, their lamp, i.e. glory is perished] Hesbon is loft even unto Dibon, [one of the high places or Cities in the Land of Moab, Isa 15:2. Jer 48:18.22.] and we have laid it waste, even unto Nophan, which (reacheth) unto Medeba. [likewise a City in the Land of Moab, Isa 15:2.]"}],"31":[{"catchword":null,"tekst":"Thus Israel dwelled in the land of the Ammorites."}],"32":[{"catchword":null,"tekst":"After that Moseh sent to spy out Jaezer, [The name of a City having formerly appertained to the Moabites, spoken of Num 32:1, 3, 34, 35. and Jer 48:32.] and they took in their dependant places: [See above verse 25] and he drove the Amorites, that were there out of the possession."}],"33":[{"catchword":null,"tekst":"Then they turned themselves, and marched up, the way of Basan: [This was a good fat pasture-country, spoken of Deut.32.14. Psa 22:13. Jer 50:19. Amos 4.1. mich.7. 14.] and Og the King of Basan went forth to meet (or encounter) them, and all his people, to the battell, in Esdrei. [Og was likewise a King of the Amorites, a Giant, of whom see further, Deut.3.1, 11. Esdrei, was a City situated in Ogs Kingdome, Deu 3:10.]"}],"34":[{"catchword":null,"tekst":"The LORD now said to Moseh; Fear him not; for I have given him into thine hand, and all his people, also his Country: and thou shalt do to him, according as thou hast done to Sihon, the King of the Amorites, that dwelt at Hesbon."}],"35":[{"catchword":null,"tekst":"And they smote him, and his sons, and all his people, so that none was left him over: [Hebr. No remaining (ones) remained] and they took his [viz. King Ogs] land into hereditary possession."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;

  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

    toast.classList.add('zichtbaar');

});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
