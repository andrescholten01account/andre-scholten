 de HEERE onder hen gebrand had.","4":"En het gemengde volk*, dat in hun midden was, werd bevangen met lust; daarom weenden ook de kinderen van Israël weer, en zeiden: Wie zal ons vlees te eten geven?","5":"Wij denken aan de vissen die wij in Egypte voor niets aten; aan de komkommers, en aan de meloenen, en aan het look, en aan de uien, en aan het knoflook.","6":"Maar nu is onze ziel dor, er is helemaal niets, behalve dit manna voor onze ogen!","7":"Het manna nu was als korianderzaad, en zijn kleur was als de kleur van de bedolach[1].","8":"Het volk liep hier en daar, en verzamelde het, en maalde het met molens, of stampte het in vijzels, en kookte het in potten, en maakte er koeken van; en zijn smaak was als de smaak van de beste vochtigheid van de olie.","9":"En wanneer de dauw 's nachts op het leger neerviel, viel het manna daarop neer.","10":"Toen hoorde Mozes het volk wenen door hun huisgezinnen, ieder aan de deur van zijn tent; en de toorn van de HEERE ontstak zeer; ook was dat kwaad in de ogen van Mozes.","11":"En Mozes zei tegen de HEERE: Waarom hebt U Uw knecht kwaad gedaan, en waarom heb ik geen genade in Uw ogen gevonden, dat U de last van dit hele volk op mij legt?","12":"Heb ik dan al dit volk ontvangen? Heb ik het gebaard? Dat U tegen mij zou zeggen: Draag het in uw schoot, zoals een voedstervader de zuigeling draagt, naar dat land dat U hun vaderen gezworen hebt?","13":"Waar zou ik het vlees vandaan halen, om al dit volk te geven? Want zij wenen tegen mij en zeggen: Geef ons vlees, dat wij eten!","14":"Ik alleen kan al dit volk niet dragen; want het is mij te zwaar!","15":"En als U zo met mij doet, dood mij dan toch maar meteen, als ik genade in Uw ogen gevonden heb; en laat mij mijn ongeluk niet aanzien!","16":"En de HEERE zei tegen Mozes: Verzamel voor Mij zeventig mannen uit de oudsten van Israël, van wie u weet dat zij de oudsten van het volk en zijn opzichters zijn; en u zult hen brengen naar de tent van de samenkomst, en zij zullen zich daar bij u opstellen.","17":"Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen[2], en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.","18":"En tegen het volk zult u zeggen: Heilig u tegen morgen, en u zult vlees eten; want u hebt voor de oren van de HEERE geweend en gezegd: Wie zal ons vlees te eten geven? Want het ging ons goed in Egypte! Daarom zal de HEERE u vlees geven, en u zult eten.","19":"U zult niet één dag eten, niet twee dagen, niet vijf dagen, niet tien dagen, niet twintig dagen;","20":"maar een hele maand lang, totdat het uit uw neus uitkomt en u tot walging is; omdat u de HEERE, Die in uw midden is, verworpen hebt, en voor Zijn aangezicht geweend hebt en gezegd: Waarom zijn wij toch uit Egypte weggetrokken?","21":"En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten!","22":"Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is?","23":"Maar de HEERE zei tegen Mozes: Zou dan de hand van de HEERE verkort zijn? U zult nu zien of Mijn woord u zal overkomen, of niet.","24":"En Mozes ging naar buiten, en sprak de woorden van de HEERE tot het volk; en hij verzamelde zeventig mannen uit de oudsten van het volk, en stelde hen rondom de tent.","25":"Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.","26":"Maar twee mannen waren in het leger overgebleven; de naam van de één was Eldad, en de naam van de ander Medad; en de Geest rustte op hen (want zij waren onder de ingeschrevenen, hoewel zij niet naar de tent waren uitgegaan), en zij profeteerden in het leger.","27":"Toen liep een jongen heen, en berichtte het aan Mozes, en zei: Eldad en Medad profeteren in het leger.","28":"En Jozua, de zoon van Nun, de dienaar van Mozes, één van zijn uitgelezen jongemannen, antwoordde en zei: Mijn heer Mozes, verbied hun dat!","29":"Maar Mozes zei tegen hem: Bent u ijverzuchtig voor mij? Och, was al het volk van de HEERE maar profeten, zodat de HEERE Zijn Geest over hen zou geven!","30":"Daarna verzamelde Mozes zich met het leger, hij en de oudsten van Israël.","31":"Toen kwam er een wind van de HEERE, en die bracht kwakkels vanaf de zee, en strooide ze bij het leger, ongeveer een dagreis hierheen en ongeveer een dagreis daarheen, rondom het leger; en zij lagen ongeveer twee el boven de aarde.","32":"Toen maakte het volk zich op, die hele dag, en die hele nacht, en de hele volgende dag, en verzamelde de kwakkels; wie het minst had, had tien homers verzameld; en zij spreidden ze voor zichzelf uit rondom het leger.","33":"Dat vlees was nog tussen hun tanden, voordat het gekauwd was, toen ontstak de toorn van de HEERE tegen het volk, en de HEERE sloeg het volk met een zeer grote plaag.","34":"Daarom noemt men de naam van die plaats Kibroth-Thaava; want daar begroeven zij het volk dat belust was geweest.","35":"Van Kibroth-Thaava trok het volk verder naar Hazeroth; en zij bleven in Hazeroth."},"SV":{"1":"En het geschiedde, als het volk zich was beklagende, *dat* het kwaad was in de oren des HEEREN; want de HEERE hoorde het, zodat Zijn toorn ontstak, en het vuur des HEEREN onder hen ontbrandde, en verteerde, in het uiterste des legers.","2":"Toen riep het volk tot Mozes; en Mozes bad tot den HEERE; en het vuur werd gedempt.","3":"Daarom noemde hij den naam dier plaats Thab-era, omdat het vuur des HEEREN onder hen gebrand had.","4":"En het gemene volk, dat in het midden van hen was, werd met lust bevangen; daarom zo weenden ook de kinderen Israëls wederom, en zeiden: Wie zal ons vlees te eten geven?","5":"Wij gedenken aan de vissen, die wij in Egypte om niet aten; aan de komkommers, en aan de pompoenen, en aan het look, en aan de ajuinen, en aan het knoflook.","6":"Maar nu is onze ziel dor, er is niet met al, behalve dit Man voor onze ogen!","7":"Het Man nu was als korianderzaad, en zijn verf was als de verf van den bedolah.","8":"Het volk liep hier en daar, en verzamelde *het*, en maalde het met molens, of stiet het in mortieren, en zood het in potten, en maakte daarvan koeken; en zijn smaak was als de smaak van de beste vochtigheid der olie.","9":"En wanneer de dauw des nachts op het leger nederviel, viel het Man op hetzelve neder.","10":"Toen hoorde Mozes het volk wenen door hun huisgezinnen, een ieder aan de deur zijner hut; en de toorn des HEEREN ontstak zeer; ook was het kwaad in de ogen van Mozes.","11":"En Mozes zeide tot de HEERE: Waarom hebt Gij aan Uw knecht kwalijk gedaan, en waarom heb ik geen genade in Uw ogen gevonden, dat Gij den last van dit ganse volk op mij legt?","12":"Heb ik dan al dit volk ontvangen? heb ik het gebaard? dat Gij tot mij zoudt zeggen: Draag het in uw schoot, gelijk als een voedstervader den zuigeling draagt, tot dat land, hetwelk Gij hun vaderen gezworen hebt?","13":"Van waar zou ik het vlees hebben, om al dit volk te geven? Want zij wenen tegen mij, zeggende: Geef ons vlees, dat wij eten!","14":"Ik alleen kan al dit volk niet dragen; want het is mij te zwaar!","15":"En indien Gij alzo aan mij doet, dood mij toch slechts, indien ik genade in Uw ogen gevonden heb; en laat mij mijn ongeluk niet aanzien!","16":"En de HEERE zeide tot Mozes: Verzamel Mij zeventig mannen uit de oudsten van Israël, dewelke gij weet, dat zij de oudsten des volks en deszelfs ambtlieden zijn; en gij zult hen brengen voor de tent der samenkomst, en zij zullen zich daar bij u stellen.","17":"Zo zal Ik afkomen en met u aldaar spreken; en van den Geest, die op u is, zal Ik afzonderen, en op hen leggen; en zij zullen met u den last van dit volk dragen, opdat gij *dien* alleen niet draagt.","18":"En tot het volk zult gij zeggen: Heiligt u tegen morgen, en gij zult vlees eten; want gij hebt voor de oren des HEEREN geweend, zeggende: Wie zal ons vlees te eten geven? want het ging ons wel in Egypte! Daarom zal de HEERE u vlees geven, en gij zult eten.","19":"Gij zult niet een dag, noch twee dagen eten, noch vijf dagen, noch tien dagen, noch twintig dagen;","20":"Tot een gehele maand toe, totdat het uit uw neus uitga, en u tot walging zij; overmits gij den HEERE, Die in het midden van u is, verworpen hebt, en hebt voor Zijn aangezicht geweend, zeggende: Waarom nu zijn wij uit Egypte getogen?","21":"En Mozes zeide: Zeshonderd duizend te voet is dit volk, in welks midden ik ben; en Gij hebt gezegd: Ik zal hun vlees geven, en zij zullen een gehele maand eten!","22":"Zullen dan voor hen schapen en runderen geslacht worden, dat voor hen genoeg zij? zullen al de vissen der zee voor hen verzameld worden, dat voor hen genoeg zij?","23":"Doch de HEERE zeide tot Mozes: Zou dan des HEEREN hand verkort zijn? Gij zult nu zien, of Mijn woord u wedervaren zal, of niet.","24":"En Mozes ging uit, en sprak de woorden des HEEREN tot het volk; en hij verzamelde zeventig mannen uit de oudsten des volks, en stelde hen rondom de tent.","25":"Toen kwam de HEERE af in de wolk, en sprak tot hem, en afzonderende van den Geest, die op hem was, legde *Hem* op de zeventig mannen, die oudsten; en het geschiedde, als de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.","26":"Maar twee mannen waren in het leger overgebleven; des enen naam was Eldad, en des anderen naam Medad; en die Geest rustte op hen (want zij waren onder de aangeschrevenen, hoewel zij tot de tent niet uitgegaan waren), en zij profeteerden in het leger.","27":"Toen liep een jongen heen, en boodschapte aan Mozes, en zeide: Eldad en Medad profeteren in het leger.","28":"En Jozua, de zoon van Nun, de dienaar van Mozes, een van zijn uitgelezen jongelingen, antwoordde en zeide: Mijn heer Mozes, verbied hun!","29":"Doch Mozes zeide tot hem: Zijt gij voor mij ijverende? Och, of al het volk des HEEREN profeten waren, dat de HEERE Zijn Geest over hen gave!","30":"Daarna verzamelde zich Mozes tot het leger, hij en de oudsten van Israël.","31":"Toen voer een wind uit van den HEERE, en raapte kwakkelen van de zee, en strooide ze bij het leger, omtrent een dagreize herwaarts, en omtrent een dagreize derwaarts, rondom het leger; en zij waren omtrent twee ellen boven de aarde.","32":"Toen maakte zich het volk op, dien gehelen dag, en dien gansen nacht, en den gansen anderen dag, en verzamelden de kwakkelen; die het minst had, had tien homers verzameld; en zij spreidden ze voor zich van elkander rondom het leger.","33":"Dat vlees was nog tussen hun tanden, eer het gekauwd was, zo ontstak de toorn des HEEREN tegen het volk, en de HEERE sloeg het volk met een zeer grote plaag.","34":"Daarom heet men den naam derzelver plaats Kibroth Thaava; want daar begroeven zij het volk, dat belust was geweest.","35":"Van Kibroth Thaava verreisde het volk naar Hazeroth; en zij bleven in Hazeroth."},"KJV":{"1":"And *when* the people complained, it displeased the LORD: and the LORD heard *it*; and his anger was kindled; and the fire of the LORD burnt among them, and consumed *them that were* in the uttermost parts of the camp.","2":"And the people cried unto Moses; and when Moses prayed unto the LORD, the fire was quenched.","3":"And he called the name of the place Taberah: because the fire of the LORD burnt","4":"And the mixt multitude that *was* among them fell a lusting: and the children of Israel also wept again, and said, Who shall give us flesh to eat?","5":"We remember the fish, which we did eat in Egypt freely; the cucumbers, and the melons, and the leeks, and the onions, and the garlick:","6":"But now our soul *is* dried away: *there is* nothing at all, beside this manna, *before* our eyes.","7":"And the manna *was* as coriander seed, and the colour thereof as the colour of bdellium.","8":"*And* the people went about, and gathered *it*, and ground *it* in mills, or beat *it* in a mortar, and baked *it* in pans, and made cakes of it: and the taste of it was as the taste of fresh oil.","9":"And when the dew fell upon the camp in the night, the manna fell","10":"Then Moses heard the people weep throughout their families, every man in the door of his tent: and the anger of the LORD was kindled greatly; Moses also was displeased.","11":"And Moses said unto the LORD, Wherefore hast thou afflicted thy servant? and wherefore have I not found favour in thy sight, that thou layest the burden of all this people","12":"Have I conceived all this people? have I begotten them, that thou shouldest say unto me, Carry them in thy bosom, as a nursing father beareth the sucking child, unto the land which thou swarest unto their fathers?","13":"Whence should I have flesh to give unto all this people? for they weep unto me, saying, Give us flesh, that we may eat.","14":"I am not able to bear all this people alone, because *it is* too heavy","15":"And if thou deal thus with me, kill me, I pray thee, out of hand, if I have found favour in thy sight; and let me not see my wretchedness.","16":"And the LORD said unto Moses, Gather unto me seventy men of the elders of Israel, whom thou knowest to be the elders of the people, and officers over them; and bring them unto the tabernacle of the congregation, that they may stand","17":"And I will come down and talk with thee there: and I will take of the spirit which *is* upon thee, and will put *it* upon them; and they shall bear the burden of the people with thee, that thou bear","18":"And say thou unto the people, Sanctify yourselves against to morrow, and ye shall eat flesh: for ye have wept in the ears of the LORD, saying, Who shall give us flesh to eat? for *it was* well with us in Egypt: therefore the LORD will give you flesh, and ye shall eat.","19":"Ye shall not eat one day, nor two days, nor five days, neither ten days, nor twenty days;","20":"*But* even a whole month, until it come out at your nostrils, and it be loathsome unto you: because that ye have despised the LORD which *is* among you, and have wept before him, saying, Why came we forth out of Egypt?","21":"And Moses said, The people, among whom I *am*, *are* six hundred thousand footmen; and thou hast said, I will give them flesh, that they may eat a whole month.","22":"Shall the flocks and the herds be slain for them, to suffice them? or shall all the fish of the sea be gathered together for them, to suffice","23":"And the LORD said unto Moses, Is the LORD'S hand waxed short? thou shalt see now whether my word shall come to pass","24":"And Moses went out, and told the people the words of the LORD, and gathered the seventy men of the elders of the people, and set them round about the tabernacle.","25":"And the LORD came down in a cloud, and spake unto him, and took of the spirit that *was* upon him, and gave *it* unto the seventy elders: and it came to pass, *that*, when the spirit rested upon them, they prophesied, and did not cease.","26":"But there remained two *of the* men in the camp, the name of the one *was* Eldad, and the name of the other Medad: and the spirit rested upon them; and they *were* of them that were written, but went not out unto the tabernacle: and they prophesied in the camp.","27":"And there ran a young man, and told Moses, and said, Eldad and Medad do prophesy in the camp.","28":"And Joshua the son of Nun, the servant of Moses, *one* of his young men, answered and said, My lord Moses, forbid","29":"And Moses said unto him, Enviest thou for my sake? would God that all the LORD'S people were prophets, *and* that the LORD would put his spirit","30":"And Moses gat him into the camp, he and the elders of Israel.","31":"And there went forth a wind from the LORD, and brought quails from the sea, and let *them* fall by the camp, as it were a day's journey on this side, and as it were a day's journey on the other side, round about the camp, and as it were two cubits *high* upon the face of the earth.","32":"And the people stood up all that day, and all *that* night, and all the next day, and they gathered the quails: he that gathered least gathered ten homers: and they spread *them* all abroad for themselves round about the camp.","33":"And while the flesh *was* yet between their teeth, ere it was chewed, the wrath of the LORD was kindled against the people, and the LORD smote the people with a very great plague.","34":"And he called the name of that place Kibrothhattaavah: because there they buried the people that lusted.","35":"*And* the people journeyed from Kibrothhattaavah unto Hazeroth; and abode at Hazeroth."}},"tsk":{"1":[{"kopje":"En het gebeurde","refs":["Num 10:33","Num 20:2-5","Num 21:5","Ex 15:23","Ex 15:24","Ex 16:2","Ex 16:3","Ex 16:7","Ex 16:9","Ex 17:2","Ex 17:3","Deut 9:22","Klaagl 3:39","1 Kor 10:10","Judas 1:16"]},{"kopje":"dat was kwaad in de oren van de HEERE","refs":["Gen 38:10","2 Sam 11:27","Jak 5:4"]},{"kopje":"en het vuur","refs":["Num 16:35","Lev 10:2","Deut 32:22","2 Kon 1:12","Job 1:16","Ps 78:21","Ps 106:18","Jes 30:33","Jes 33:14","Nahum 1:5","Mark 9:43-49","Hebr 12:29"]},{"kopje":"het uiterste","refs":["Deut 25:18"]}],"2":[{"kopje":"riep","refs":["Num 21:7","Ps 78:34","Ps 78:35","Jer 37:3","Jer 42:2","Hand 8:24"]},{"kopje":"bad","refs":["Num 14:13-20","Gen 18:23-33","Ex 32:10-14","Ex 32:31","Ex 32:32","Ex 34:9","Deut 9:19","Deut 9:20","Ps 106:23","Jes 37:4","Jer 15:1","Amos 7:2-6","Jak 5:16","1 Joh 5:16"]},{"kopje":"het vuur","refs":["Num 16:45-48","Hebr 7:26","1 Joh 2:1","1 Joh 2:2"]}],"3":[{"kopje":"Thabera","refs":["Deut 9:22"]}],"4":[{"kopje":"het gemengde","refs":["Ex 12:38","Lev 24:10","Lev 24:11","Neh 13:3"]},{"kopje":"de kinderen","refs":["1 Kor 15:33"]},{"kopje":"Wie zal","refs":["Ps 78:18-20","Ps 106:14","Rom 13:14","1 Kor 10:6"]}],"5":[{"kopje":"de vissen","refs":["Ex 16:3","Ps 17:14","Fil 3:19"]}],"7":[{"kopje":"het manna","refs":["Ex 16:14","Ex 16:15","Ex 16:3 \">het</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5971\">volk</span> verder <span class=\"wl\" data-l=\"L3\" data-code=\"H2698\">naar</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2698\">Hazeroth</span>; <span class=\"wl\" data-l=\"L3\" data-code=\"H2698\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2698\">zij</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2698\">bleven</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2698\">in</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2698\">Hazeroth</span>."},"koppeling_kjv":{"1":"And when the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H596\">complained,</span> it <span class=\"wl wl-kjv\" data-code=\"H7451\">displeased</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it; and his <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled;</span> and the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">burnt</span> among them, and <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> them that were in the uttermost <span class=\"wl wl-kjv\" data-code=\"H7097\">parts</span> of the camp.","2":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses;</span> and when <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> was quenched.","3":"And he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H1931\">the</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H8404\">Taberah:</span> because the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> burnt","4":"And the mixt <span class=\"wl wl-kjv\" data-code=\"H628\">multitude</span> that was <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> them fell a <span class=\"wl wl-kjv\" data-code=\"H183\">lusting:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> also <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who shall give us <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> to eat?","5":"We <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> the <span class=\"wl wl-kjv\" data-code=\"H1710\">fish,</span> which we did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H2600\">freely;</span> the <span class=\"wl wl-kjv\" data-code=\"H7180\">cucumbers,</span> and the <span class=\"wl wl-kjv\" data-code=\"H20\">melons,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2682\">leeks,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1211\">onions,</span> and the garlick:","6":"But now our <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> is dried <span class=\"wl wl-kjv\" data-code=\"H3002\">away:</span> there is nothing at all, <span class=\"wl wl-kjv\" data-code=\"H1115\">beside</span> this <span class=\"wl wl-kjv\" data-code=\"H4478\">manna,</span> before our eyes.","7":"And the <span class=\"wl wl-kjv\" data-code=\"H4478\">manna</span> was as <span class=\"wl wl-kjv\" data-code=\"H1407\">coriander</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5869\">colour</span> thereof as the <span class=\"wl wl-kjv\" data-code=\"H5869\">colour</span> of bdellium.","8":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> went <span class=\"wl wl-kjv\" data-code=\"H7751\">about,</span> and <span class=\"wl wl-kjv\" data-code=\"H3950\">gathered</span> it, and <span class=\"wl wl-kjv\" data-code=\"H2912\">ground</span> it in <span class=\"wl wl-kjv\" data-code=\"H7347\">mills,</span> or <span class=\"wl wl-kjv\" data-code=\"H1743\">beat</span> it in a <span class=\"wl wl-kjv\" data-code=\"H4085\">mortar,</span> and <span class=\"wl wl-kjv\" data-code=\"H1310\">baked</span> it in <span class=\"wl wl-kjv\" data-code=\"H6517\">pans,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H5692\">cakes</span> of it: and the <span class=\"wl wl-kjv\" data-code=\"H2940\">taste</span> of it was as the <span class=\"wl wl-kjv\" data-code=\"H2940\">taste</span> of <span class=\"wl wl-kjv\" data-code=\"H3955\">fresh</span> oil.","9":"And when the <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">fell</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> the <span class=\"wl wl-kjv\" data-code=\"H4478\">manna</span> fell","10":"Then <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> throughout their <span class=\"wl wl-kjv\" data-code=\"H4940\">families,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of his <span class=\"wl wl-kjv\" data-code=\"H168\">tent:</span> and the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly;</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> also was <span class=\"wl wl-kjv\" data-code=\"H7489\">displeased.</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Wherefore hast thou <span class=\"wl wl-kjv\" data-code=\"H7489\">afflicted</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant?</span> and wherefore have I not <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H7760\">layest</span> the <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> of all this people","12":"Have I <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived</span> all this <span class=\"wl wl-kjv\" data-code=\"H5971\">people?</span> have I <span class=\"wl wl-kjv\" data-code=\"H3205\">begotten</span> them, that thou shouldest <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H5375\">Carry</span> them in thy <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom,</span> as a nursing <span class=\"wl wl-kjv\" data-code=\"H539\">father</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">beareth</span> the sucking <span class=\"wl wl-kjv\" data-code=\"H3243\">child,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which thou <span class=\"wl wl-kjv\" data-code=\"H7650\">swarest</span> unto their fathers?","13":"<span class=\"wl wl-kjv\" data-code=\"H370\">Whence</span> should I have <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto all this <span class=\"wl wl-kjv\" data-code=\"H5971\">people?</span> for they <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> us <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> that we may eat.","14":"I am not <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> all this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H905\">alone,</span> because it is too heavy","15":"And if thou <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> thus with me, <span class=\"wl wl-kjv\" data-code=\"H2026\">kill</span> me, I pray thee, out of <span class=\"wl wl-kjv\" data-code=\"H2026\">hand,</span> if I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight;</span> and let me not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my wretchedness.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H622\">Gather</span> unto me <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> whom thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> to be the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H7860\">officers</span> over them; and <span class=\"wl wl-kjv\" data-code=\"H3947\">bring</span> them unto the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> that they may stand","17":"And I will come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">talk</span> with thee there: and I will <span class=\"wl wl-kjv\" data-code=\"H680\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> which is upon thee, and will <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> it upon them; and they shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> the <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with thee, that thou bear","18":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> thou unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">Sanctify</span> yourselves against to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow,</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh:</span> for ye have <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Who shall give us <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat?</span> for it was <span class=\"wl wl-kjv\" data-code=\"H2895\">well</span> with us in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and ye shall eat.","19":"Ye shall not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> nor two <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> nor <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> neither <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> nor <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> days;","20":"But even a whole <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> until it come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> at your <span class=\"wl wl-kjv\" data-code=\"H639\">nostrils,</span> and it be <span class=\"wl wl-kjv\" data-code=\"H2214\">loathsome</span> unto you: <span class=\"wl wl-kjv\" data-code=\"H3282\">because</span> that ye have <span class=\"wl wl-kjv\" data-code=\"H3988\">despised</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which is <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> you, and have <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Why came we <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of Egypt?","21":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> whom I am, are <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H7273\">footmen;</span> and thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">whole</span> month.","22":"Shall the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> and the <span class=\"wl wl-kjv\" data-code=\"H1241\">herds</span> be <span class=\"wl wl-kjv\" data-code=\"H7819\">slain</span> for them, to <span class=\"wl wl-kjv\" data-code=\"H4672\">suffice</span> them? or shall all the <span class=\"wl wl-kjv\" data-code=\"H1709\">fish</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> be gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> for them, to suffice","23":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> waxed <span class=\"wl wl-kjv\" data-code=\"H7114\">short?</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> now whether my <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> shall come to pass","24":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> the <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> them round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the tabernacle.","25":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> in a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H680\">took</span> of the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> that was upon him, and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it unto the <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H2205\">elders:</span> and it came to pass, that, when the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> <span class=\"wl wl-kjv\" data-code=\"H5117\">rested</span> upon them, they <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied,</span> and did not cease.","26":"But there <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> in the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> was <span class=\"wl wl-kjv\" data-code=\"H419\">Eldad,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H8145\">other</span> <span class=\"wl wl-kjv\" data-code=\"H4312\">Medad:</span> and the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> <span class=\"wl wl-kjv\" data-code=\"H5117\">rested</span> upon them; and they were of them that were <span class=\"wl wl-kjv\" data-code=\"H3789\">written,</span> but went not <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> unto the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> in the camp.","27":"And there <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> a young <span class=\"wl wl-kjv\" data-code=\"H5288\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H419\">Eldad</span> and <span class=\"wl wl-kjv\" data-code=\"H4312\">Medad</span> do <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> in the camp.","28":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5126\">Nun,</span> the <span class=\"wl wl-kjv\" data-code=\"H8334\">servant</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> one of his young <span class=\"wl wl-kjv\" data-code=\"H979\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> forbid","29":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7065\">Enviest</span> thou for my sake? would God that all <span class=\"wl wl-kjv\" data-code=\"H5414\">the</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> and that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> would <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> his spirit","30":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H622\">gat</span> him into the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> he and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of Israel.","31":"And there went <span class=\"wl wl-kjv\" data-code=\"H5265\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H1468\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H7958\">quails</span> from the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and let them <span class=\"wl wl-kjv\" data-code=\"H5203\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> as it were a <span class=\"wl wl-kjv\" data-code=\"H3117\">day's</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">journey</span> on this <span class=\"wl wl-kjv\" data-code=\"H3541\">side,</span> and as it were a <span class=\"wl wl-kjv\" data-code=\"H3117\">day's</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">journey</span> on the other <span class=\"wl wl-kjv\" data-code=\"H3541\">side,</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> and as it were two <span class=\"wl wl-kjv\" data-code=\"H520\">cubits</span> high upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the earth.","32":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> stood <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> all that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and all that <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4283\">next</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and they <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> the <span class=\"wl wl-kjv\" data-code=\"H7958\">quails:</span> he that gathered <span class=\"wl wl-kjv\" data-code=\"H4591\">least</span> <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H2563\">homers:</span> and they <span class=\"wl wl-kjv\" data-code=\"H7849\">spread</span> them all <span class=\"wl wl-kjv\" data-code=\"H7849\">abroad</span> for themselves round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the camp.","33":"And while the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> was <span class=\"wl wl-kjv\" data-code=\"H2962\">yet</span> between their <span class=\"wl wl-kjv\" data-code=\"H8127\">teeth,</span> ere it was <span class=\"wl wl-kjv\" data-code=\"H3772\">chewed,</span> the <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> plague.","34":"And he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of that <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H6914\">Kibrothhattaavah:</span> because there they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that lusted.","35":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed</span> from <span class=\"wl wl-kjv\" data-code=\"H6914\">Kibrothhattaavah</span> unto <span class=\"wl wl-kjv\" data-code=\"H2698\">Hazeroth;</span> and abode at Hazeroth."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"als het volk zich was beklagende,","tekst":"Anders, en het volk was als zich beklagende; dat is, zeer klagend; of, zich treurig, moeilijk, ongezind, met veel tegenspreken aanstellende. De oorzaak hiervan schijnt geweest te zijn het ongemak en de moeilijkheid der reis."},{"catchword":"dat het kwaad was","tekst":"Dat is, mishaagde den Heere. Alzo wordt iemand gezegd kwaad te zijn in des Heeren ogen, voor degenen, die Hem mishaagt. Zie Gen 38:7. Vergelijk onder, vs.10, en de aantekeningen."},{"catchword":"het vuur des HEEREN onder hen ontbrandde,","tekst":"Hetwelk de Heere uit den hemel over hen wonderbaarlijk had doen vallen, hetzij door den bliksem of anderszins, zodat zij wel bemerkten dat het van den Heere voortkwam, om hen over hun boos en verkeerd klagen te straffen. Vergelijk 2Ki 1:10, en zie de aantekeningen."}],"3":[{"catchword":"Thab-éra,","tekst":"Dit woord betekent aansteking, of brand. Hier is geweest een legerplaats der kinderen Israëls, anders genoemd Kibroth-Taäva; onder, vs.34,35, en Num 33:16. De verscheidenheid der namen geeft ons te kennen de verscheidene gelegenheden der legerplaatsen, zijnde Tab-era bij Egypte, en Kibroth-Taäva bij Kanaän gelegen. In de telling der legerplaatsen wordt Tab-era verzwegen en Kibroth-Taäva alleen genoemd; onder, Num 33:16."}],"4":[{"catchword":"het gemene volk,","tekst":"Of, de samenroepende, of bijeen rottende menigte. Versta door dezen, die met de Israëlieten uit Egypte gekomen en aan het voedsel van dat land gewoon waren, en nu aan de Israëlieten oorzaak tot murmurering gaven. Zie van dezen Exo 12:38."},{"catchword":"werd met lust bevangen;","tekst":"Hebreeuws, zij waren met lust belust, of belustten den lust; dat is, zij waren zeer belust om vlees te eten. Zie 2Ch 36:14."},{"catchword":"zo weenden ook de kinderen Israëls","tekst":"Hebreeuws, daarom keerden en weenden ook de kinderen Israëls; dat is, weenden wederom. Het woord keren, bij een ander werkwoord gesteld zijnde, betekent dikwijls anders niet dan het vernieuwen en weder doen van hetzelfde werk."}],"6":[{"catchword":"ziel","tekst":"Dat is, leven. Zie Gen 19:17."},{"catchword":"dor,","tekst":"Dat is versmacht door gebrek aan verversing en vernieuwing van spijs."},{"catchword":"behalve dit Man voor onze ogen","tekst":"Hebreeuws, behalve onze ogen tot het man; dat is, onze ogen zien niets dan het man."}],"7":[{"catchword":"verf was als de verf van den bedolah","tekst":"Hebreeuws, oog; want de verf wordt met het oog gezien. De zin is, dat het man in zijn uiterlijke gedaante de kleur had van bedolah; zie daarvan Gen 2:12. Het is gelooflijk, dat de naam bedolah hier betekent de gom, die uit den boom van dezen naam droop en zeer doorzichtig was."}],"8":[{"catchword":"potten,","tekst":"Of, ketels"},{"catchword":"koeken;","tekst":"Zie Gen 18:6."},{"catchword":"smaak van de beste vochtigheid der olie","tekst":"Dat is, het bovenste der olie, hetwelk van den droesem vrij was en zekere zoetigheid had. Zie Exo 16:31."}],"10":[{"catchword":"was het kwaad in de ogen van Mozes","tekst":"Dat is, het mishaagde hem. Zie van de manier van spreken Gen 21:11, en vergelijk boven de aantekeningen vs.1."}],"11":[{"catchword":"genade in Uw ogen gevonden,","tekst":"Zie Gen 6:8; alzo onder, vs.15."}],"12":[{"catchword":"gebaard?","tekst":"Of, gegenereerd."}],"14":[{"catchword":"al dit volk niet dragen;","tekst":"Dat is, al den last van dit volk. Zie vs.11."}],"15":[{"catchword":"dood mij toch slechts,","tekst":"Hebreeuws, dood mij toch dodende; dat is, laat mij maar ten eerste sterven, opdat ik van dezen last ontslagen zij."},{"catchword":"ongeluk niet aanzien","tekst":"Hebreeuws, mijn kwaad; dat is, mijn verdriet en kwalijk varen. Vergelijk de aantekeningen Gen 19:19."}],"16":[{"catchword":"de oudsten van Israël,","tekst":"Zie van dezen Exo 3:16, en Lev 4:15."},{"catchword":"dat zij de oudsten des volks","tekst":"Dat is, die in hun beroeping niet alleen den naam, maar ook de daad hebben."},{"catchword":"ambtlieden zijn;","tekst":"Versta, officieren en bevelhebbers. Vergelijk Exo 5:6; Deu 16:18."},{"catchword":"brengen voor de tent der samenkomst,","tekst":"Hebreeuws, nemen; dat is, genomen, of uitgekoren hebbende, brengen."}],"17":[{"catchword":"afkomen","tekst":"Menselijkerwijze van God gesproken; zie Gen 11:5, en Gen 35:13, met de aantekeningen; alzo onder, vs.25, en Num 12:5."},{"catchword":"van den Geest,","tekst":"Dat is, van dezelfde gaven des Geestes, en dat zonder verkorting van de gaven van Mozes. Het woord Geest wordt dikwijls voor de gaven des Geestes gebruikt; gelijk onder, Num 27:18; Psa 51:14; Joe 2:28; Joh 7:39, enz."}],"18":[{"catchword":"Heiligt u tegen morgen,","tekst":"Zie Lev 11:44."},{"catchword":"ging ons wel in Egypte","tekst":"Hebreeuws, ons was wel, of goed."}],"20":[{"catchword":"gehele maand toe,","tekst":"Hebreeuws, maand der dagen; dat is, een volle maand, hebbende al haar dagen. Zie Gen 29:14, en alzo in vs.21."},{"catchword":"nu zijn wij uit Egypte getogen?","tekst":"Anders, dus, of herwaarts."}],"21":[{"catchword":"Zeshonderd duizend te voet","tekst":"Boven, Num 1:46, worden bij dit getal nog gevoegd drie duizend vijf honderd en vijftig. Waaruit het schijnt, dat van die telling af het getal nu verminderd was, of dat het Mozes hier genoeg is geweest, het even getal voor het oneven te gebruiken; gelijk men hetzelfde ook vindt Exo 12:37. Vergelijk Gen 15:13, en zie de aantekeningen."},{"catchword":"een gehele maand eten","tekst":"Hebreeuws, een maand der dagen."}],"22":[{"catchword":"genoeg zij?","tekst":"Hebreeuws, opdat het voor hen vinde; te weten vlees, waarmede het verzaligd worde. Het Hebreeuwse woord betekent eigenlijk vinden, maar voor genoeg zijn wordt het hier genomen, als ook Jos 17:16; Jdg 21:14."}],"23":[{"catchword":"hand verkort zijn?","tekst":"Dat is, zijn vermogen te klein, dat Hij niet zou kunnen volbrengen hetgeen Hij gesproken heeft."}],"24":[{"catchword":"verzamelde zeventig mannen","tekst":"Gelijk God bevolen had boven, vs.16, hoewel twee hunner achterbleven; onder, vs.26."},{"catchword":"tent","tekst":"Te weten, der samenkomst. Zie boven, vs.16."}],"25":[{"catchword":"in de wolk,","tekst":"Te weten, die den tabernakel bedekte; Exo 40:38. Anders, in een wolk. Deze was een teken van Gods majesteit en tegenwoordige verschijning. Alzo onder, Num 12:5."},{"catchword":"Geest, die op hem was,","tekst":"Zie boven, vs.17."},{"catchword":"zij profeteerden,","tekst":"Dit woord betekent hier, door de ingeving des Heiligen Geestes, de grote deugden en daden Gods uitspreken en verkondigen. Zie dit woord in zulk een zin 1Sa 10:5-6; Joe 2:28; Act 2:17."},{"catchword":"daarna niet meer","tekst":"Te weten, profeteerden zij niet meer, zijnde dit zichtbaar teken voor eens genoeg, om in den dienst, waartoe zij geroepen waren, in zichzelven verzekerd en voor het volk bevestigd te worden: gelijk ook daarna aan Saul geschied is; 1Sa 10:6, 1Sa 10:10, 1Sa 10:13. Anderen: en hielden niet op, te weten, te profeteren; dat is, van dien dag aan begaf hun de Geest de profetie niet."}],"26":[{"catchword":"aangeschrevenen,","tekst":"Dat is, uit het getal der zeventig, die Mozes tot zich samengeroepen had; gelijk te zien is boven, vs.24,25."}],"28":[{"catchword":"van zijn uitgelezen jongelingen,","tekst":"Anders, van zijn jeugd op."}],"29":[{"catchword":"Zijt gij voor mij ijverende?","tekst":"Dat is, zijt gij met nijdigheid bevangen of misgunt gij iemand, dat hij de gaven des Heiligen Geestes heeft gelijk ik? Vergelijk hiermede de jaloezie der discipelen van Johannes de Doper, Joh 3:26."},{"catchword":"Och, of al het volk des HEEREN profeten waren,","tekst":"Hebreeuws, wie zal geven? een manier van wensen bij de Hebreën. Zie van dezelve Deu 5:29."}],"32":[{"catchword":"homers verzameld;","tekst":"Van het woord homer, betekenende een maat, zie Lev 27:16. Anders, hopen"},{"catchword":"spreidden ze voor zich","tekst":"Hebreeuws, spreidende spreidden zij."}],"33":[{"catchword":"eer het gekauwd was,","tekst":"Uit vs.20 wordt afgenomen, dat dit geschied is ten einde van den maand. Zolang hebben zij hun lust geboet met vlees te eten."}],"34":[{"catchword":"Kibrôth Tháäva;","tekst":"Dat is, lustgraven. Een legerplaats zo genaamd, omdat daar begraven waren degenen, die de walg hadden gehad van het man, en hun lusten met vlees verzadigd hadden, hetwelk de HEERE hun wel gegeven had, maar in zijn toorn."}],"35":[{"catchword":"Hazerôth;","tekst":"Een andere legerplaats der Israëlieten in de woestijn. Zie van deze ook Num 33:17, en Deu 1:1."},{"catchword":"bleven in Hazerôth","tekst":"Hebreeuws, zij waren."}]},"kanttekeningen_en":{"2":[{"catchword":null,"tekst":"Then the people cried to Moseh, and Moseh prayed to the LORD, and the fire was quenched."}],"3":[{"catchword":null,"tekst":"Therefore he called the name of that place Tabeera: [This word doth signify a kindling, or brand. In this place the Israelites had pitched their Camp, and it was otherwise called Kibroth-Taava, below verse 34, and 35. And Numb. 33. 16. The diversity of the names implieth the diversity of the situations Tabera, lying nearer to Egypt, and Kibroth Taava nearer unto Canaan. In the rehearsal of the camping-places, Tabara nearer unto Canaan. In the rehearsal of the camping places, Tbara is past over, and Kibroth Taava only mentioned, below chapter 33. 16.] because that the fire of the LORD had burned among them."}],"4":[{"catchword":null,"tekst":"And the common people [Or the concourse, or gathering root of the multitude, understand hereby such as were come forth with the Israelites out of Egypt, and used to the diet of the Country, continually talking of it, whereby they had caused the Israelites to murmur now. See of these, Exod. 12. 38.] which was in the middest of them, was seized with lusting; [Hebr. Were lusted with lusting, or, lusted the lusting, i.e. they lusted exceedingly to eat flesh again, see 2 Chron. 36. On v. 14.] therefore the children of Israel also turned and wept, i.e. wept again. The Verb to turn, being joined to another active Verb, doth often signify but a renewing and repeating of the same action] and said, who shall give us flesh to eat?"}],"5":[{"catchword":null,"tekst":"We remember the fishes which we did eat in Egypt for nothing; the Cucumbers and the Pompions, and the Leeks, and the Onions, and the Garlic."}],"6":[{"catchword":null,"tekst":"But now our soul [i.e. our life. See Gen. 19. On v. 7. Is dry (or withered) [i.e. faint through want of that refreshing we had by change and variety of diet] there is nothing at all, besides this Man, i.e. our eyes see nothing but Man.]"}],"7":[{"catchword":null,"tekst":"The Man now was like Coriander-seed, and its colour [Heb. eye for the colour is discerned by the eye] was as the colour of the Bedelah. [the meaning is, that the Man in its outward shape and hue, had the colour of the Bedelah; whereof see Gen. 2. On v. 12. It is probable, that the Bedolah here signifieth the gum dropping from the tree of that name, and being very transparent.]"}],"8":[{"catchword":null,"tekst":"The people ran to and fro, and gathered (it) and ground it with mills, or pounded it in morters, and boiled it in pots, [Or kettles] and made cakes of it; [see Gen. 18. On v. 6.] and the taste of it was as the taste of the best moisture of Oil. [i.e. the uppermost part of the Oil, which was altogether free from dregs, and had a sweet savour. See Exod. 16. On v. 31.]"}],"9":[{"catchword":null,"tekst":"And when the Dew fell down by night upon the Camp, the man did fall down upon the same."}],"10":[{"catchword":null,"tekst":"Then Moseh heard the people weep by their households and every one at the door of his Tent: and the anger of the LORD was much incensed, also it was evil in the eyes of Moseh. [i.e. it much displeased him. See of this manner of speaking, Gen. 21. On v. 11. And compare above the Annot. On v. 1.]"}],"11":[{"catchword":null,"tekst":"And Moseh said to the LORD; why hast thou done, (dealt) ill by thy servant, and why have I found no grace in thine eyes, [See Gen. 6. On v. 8. As also below, v. 15.] that thou layest the burthen of all this people upon me?"}],"12":[{"catchword":null,"tekst":"Have I then conceived all this people I have brought them forth? [Or, begotten (engendred) them] that thou shouldest say to me: Bear them in thy bosom, like as a foster-father beareth the suckling, unto the land, which thou hast sworn unto their fathers?"}],"13":[{"catchword":null,"tekst":"Whence should I have the flesh, to give unto all this people? For they weep against (or toward) me, saying, Give us flesh that we may eat."}],"14":[{"catchword":null,"tekst":"I alone am not able to bear all this people: [i.e. the whole burthen of all this people. See above v. 4.] for it is too heavy for me."}],"15":[{"catchword":null,"tekst":"And if thou do (deal) thus by me, kill me outright [Hebr. Killing, kill me, or, putting to death, put me to death, i.e let me die rather forthwith, that I may be rid of this burthen] if I have found grace in thine eyes: and let me not behold my misfortune. [Hebr. My evil, i.e. my vexation, and continual grievous trouble, compare Gen. 19. The Annot. On v. 19.]"}],"16":[{"catchword":null,"tekst":"And the LORD said to Moseh: gather me seventy men out of the ancientest of Israel. [Of those see Exod. 3. On v. 16. And Lev. 4. On v. 15.] whom thou knowest to be [viz. not onely by name and calling, but in deed and practice] the Ancientest of the people, and the Governours of them: [understand the chief Officers and Commanders. Compare Exod. 5. 6. Deut. 16. 18.] and thou shalt bring [Hebr. Take, i.e. having taken or made choice of, and bring] them before the Tent of the Con // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {

}
document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
