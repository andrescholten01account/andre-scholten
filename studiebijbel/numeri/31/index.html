an ten strijde zenden.","5":"Zo werden geleverd uit de duizenden van Israël, duizend van elke stam, twaalfduizend toegeruste strijders.","6":"En Mozes zond hen ten strijde, duizend van elke stam, hen en Pinehas, de zoon van Eleazar, de priester, ten strijde, met de heilige voorwerpen en de trompetten om te schallen in zijn hand.","7":"En zij streden tegen de Midianieten, zoals de HEERE Mozes geboden had, en zij doodden alles wat mannelijk was.","8":"Daarbij doodden zij, behalve hun overige gesneuvelden, de koningen van de Midianieten: Evi, en Rekem, en Zur, en Hur, en Reba, vijf koningen van de Midianieten; ook doodden zij met het zwaard Bileam, de zoon van Beor.","9":"Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit.","10":"Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur.","11":"En zij namen alle buit en alle roof, van mensen en van beesten.","12":"Daarna brachten zij de gevangenen, en de buit, en de roof, tot Mozes en tot Eleazar, de priester, en tot de vergadering van de kinderen van Israël, in het leger, in de vlakke velden van Moab, die aan de Jordaan bij Jericho liggen.","13":"Maar Mozes en Eleazar, de priester, en alle leiders van de vergadering, gingen naar buiten, hun tegemoet, tot buiten voor het leger.","14":"En Mozes werd zeer boos op de aanvoerders van het leger, de hoofdlieden over de duizenden, en de hoofdlieden over de honderden, die uit de strijd van die oorlog kwamen.","15":"En Mozes zei tegen hen: Hebt u dan alle vrouwen laten leven?","16":"Zie, dezen waren het, die door de raad van Bileam de kinderen van Israël ertoe brachten trouweloos te handelen tegen de HEERE, in de zaak van Peor; waardoor die plaag kwam onder de vergadering van de HEERE.","17":"Nu dan, dood alles wat mannelijk is onder de kinderen; en dood elke vrouw die door gemeenschap met een man, een man heeft gekend.","18":"Maar laat al de kinderen van vrouwelijk geslacht, die geen gemeenschap met een man hebben gehad, voor u leven.","19":"En u, legert u buiten het leger, zeven dagen; ieder die een mens gedood heeft, en ieder die een gesneuvelde heeft aangeraakt, moet zich op de derde dag en op de zevende dag ontzondigen[1], u en uw gevangenen.","20":"Ook moet u alle kleding, en alle voorwerpen van vellen, en alle werk van geitenhaar, en voorwerpen van hout, ontzondigen.","21":"En Eleazar, de priester, zei tegen de krijgslieden die ten strijde getrokken waren: Dit is de inzetting van de wet, die de HEERE Mozes geboden heeft.","22":"Alleen het goud en het zilver, het koper, het ijzer, het tin en het lood;","23":"Alles wat tegen het vuur bestand is, moet u door het vuur laten gaan, zodat het rein wordt; toch zal het ook met het water der afzondering ontzondigd moeten worden; maar alles wat niet tegen het vuur bestand is, moet u door het water laten gaan.","24":"U moet ook uw kleren op de zevende dag wassen, zodat u rein wordt; en daarna zult u in het leger komen.","25":"Verder sprak de HEERE tot Mozes en zei:","26":"Neem de som op van de buit die gevangen is, van mensen en van beesten; u en Eleazar, de priester, en de hoofden van de families van de vergadering.","27":"En verdeel de buit in twee helften, tussen hen die de strijd op zich genomen hebben, die ten strijde uitgegaan zijn, en de hele vergadering.","28":"Daarna moet u een schatting voor de HEERE heffen, van de oorlogslieden die tot deze strijd uitgetrokken zijn: één ziel van elke vijfhonderd, uit de mensen en uit de runderen, en uit de ezels, en uit de schapen.","29":"Van hun helft moet u het nemen, en aan Eleazar, de priester, geven, als een heffing voor de HEERE.","30":"Maar van de helft van de kinderen van Israël moet u één gevangene van elke vijftig nemen, uit de mensen, uit de runderen, uit de ezels, en uit de schapen, uit al de beesten; en u moet ze geven aan de Levieten, die de wacht over de tabernakel van de HEERE waarnemen.","31":"En Mozes en Eleazar, de priester, deden zoals de HEERE Mozes geboden had.","32":"De buit nu, het overschot van de roof die het krijgsvolk geroofd had, was zeshonderdvijfenzeventigduizend schapen;","33":"En tweeënzeventigduizend runderen;","34":"En eenenzestigduizend ezels;","35":"En van de mensen, de zielen uit de vrouwen die geen gemeenschap met een man hadden gehad, waren alle zielen tezamen tweeëndertigduizend.","36":"En de helft, namelijk het deel van hen die ten strijde getrokken waren, was in getal driehonderdzevenendertigduizend vijfhonderd schapen.","37":"En de schatting voor de HEERE van schapen was zeshonderdvijfenzeventig.","38":"En de runderen waren zesendertigduizend, en hun schatting voor de HEERE tweeënzeventig.","39":"En de ezels waren dertigduizend vijfhonderd, en hun schatting voor de HEERE eenenzestig.","40":"En de mensenzielen waren zestienduizend, en hun schatting voor de HEERE tweeëndertig zielen.","41":"En Mozes gaf Eleazar, de priester, de schatting van de heffing van de HEERE, zoals de HEERE Mozes geboden had.","42":"En van de helft van de kinderen van Israël, die Mozes afgedeeld had van de mannen die gestreden hadden;","43":"(De helft nu van de vergadering was, van de schapen, driehonderdzevenendertigduizend vijfhonderd;","44":"En de runderen waren zesendertigduizend;","45":"En de ezels dertigduizend vijfhonderd;","46":"En de mensenzielen zestienduizend;)","47":"Van die helft van de kinderen van Israël nam Mozes één gevangene van elke vijftig, van mensen en van beesten; en hij gaf ze aan de Levieten, die de wacht over de tabernakel van de HEERE waarnamen, zoals de HEERE Mozes geboden had.","48":"Toen kwamen de aanvoerders die over de duizenden van het leger waren, de hoofdlieden der duizenden en de hoofdlieden der honderden, tot Mozes;","49":"En zij zeiden tegen Mozes: Uw dienaren hebben de som opgenomen van de krijgslieden die onder ons gezag geweest zijn; en van ons ontbreekt niet één man.","50":"Daarom hebben wij een offergave voor de HEERE gebracht, ieder wat hij gekregen heeft: een gouden voorwerp, een keten, of een armring, een vingerring, een oorring, of een hangende sieraad, om voor onze zielen verzoening te doen voor het aangezicht van de HEERE.","51":"Zo namen Mozes en Eleazar, de priester, van hen het goud, allerlei kunstig gemaakte voorwerpen.","52":"En al het goud van de heffing dat zij de HEERE offerden, was zestienduizend zevenhonderdvijftig sikkels, van de hoofdlieden der duizenden en van de hoofdlieden der honderden.","53":"Wat de krijgslieden betreft, ieder had voor zichzelf geroofd.","54":"Zo namen Mozes en Eleazar, de priester, dat goud van de hoofdlieden der duizenden en der honderden, en zij brachten het in de tent der samenkomst, ter gedachtenis voor de kinderen van Israël, voor het aangezicht van de HEERE."},"SV":{"1":"En de HEERE sprak tot Mozes, zeggende:","2":"Neem de wraak der kinderen Israëls van de Midianieten; daarna zult gij verzameld worden tot uw volken.","3":"Mozes dan sprak tot het volk, zeggende: Dat zich mannen uit u ten strijde toerusten, en dat zij tegen de Midianieten zijn, om de wraak des HEEREN te doen aan de Midianieten.","4":"Van elken stam onder alle stammen Israëls zult gij een duizend ten strijde zenden.","5":"Alzo werden geleverd uit de duizenden van Israël, duizend van elken stam, twaalf duizend toegerusten ten strijde.","6":"En Mozes zond hen ten strijde, duizend van elken stam, hen en Pinehas, den zoon van Eleazar, den priester, ten strijde, met de heilige vaten, en de trompetten des geklanks in zijn hand.","7":"En zij streden tegen de Midianieten, gelijk als de HEERE Mozes geboden had, en zij doodden al wat mannelijk was.","8":"Daartoe doodden zij boven hun verslagenen, de koningen der Midianieten, Evi, en Rekem, en Zur, en Hur, en Reba, vijf koningen der Midianieten; ook doodden zij met het zwaard Bileam, den zoon van Beor.","9":"Maar de kinderen Israëls namen de vrouwen der Midianieten, en hun kinderkens gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun vermogen.","10":"Voorts al hun steden met hun woonplaatsen, en al hun burchten verbrandden zij met vuur.","11":"En zij namen al den roof, en al den buit, van mensen en van beesten.","12":"Daarna brachten zij de gevangenen, en den buit, en den roof, tot Mozes en tot Eleazar, den priester, en tot de vergadering der kinderen Israëls, in het leger, in de vlakke velden van Moab, dewelke zijn aan de Jordaan van Jericho.","13":"Maar Mozes en Eleazar, de priester, en alle oversten der vergadering, gingen uit hen tegemoet, tot buiten voor het leger.","14":"En Mozes werd grotelijks vertoornd tegen de bevelhebbers des heirs, de hoofdlieden der duizenden, en de hoofdlieden der honderden, die uit den strijd van dien oorlog kwamen.","15":"En Mozes zeide tot hen: Hebt gij dan alle vrouwen laten leven?","16":"Ziet, deze waren, door den raad van Bileam, den kinderen Israëls, om oorzake der overtreding tegen den HEERE te geven, in de zaak van Peor; waardoor die plaag werd onder de vergadering des HEEREN.","17":"Nu dan, doodt al wat mannelijk is onder de kinderkens; en doodt alle vrouw, die door bijligging des mans een man bekend heeft.","18":"Doch al de kinderen van vrouwelijk geslacht, die de bijligging des mans niet bekend hebben, laat voor ulieden leven.","19":"En gijlieden, legert u buiten het leger zeven dagen; een ieder, die een mens gedood, en een ieder, die een verslagene zult aangeroerd hebben, zult u op den derden dag en op den zevenden dag ontzondigen, gij en uw gevangenen.","20":"Ook zult gij alle kleding, en alle gereedschap van vellen, en alle geiten *haren* werk, en gereedschap van hout, ontzondigen.","21":"En Eleazar, de priester, zeide tot de krijgslieden, die tot dien strijd getogen waren: Dit is de inzetting der wet, die de HEERE Mozes geboden heeft.","22":"Alleen het goud en het zilver, en het koper, het ijzer, het tin en het lood;","23":"Alle ding, dat het vuur lijdt, zult gij door het vuur laten doorgaan, dat het rein worde; evenwel zal het door het water der afzondering ontzondigd worden; maar al wat het vuur niet lijdt, zult gij door het water laten doorgaan.","24":"Gij zult ook uw klederen op den zevenden dag wassen, dat gij rein wordt; en daarna zult gij in het leger komen.","25":"Verder sprak de HEERE tot Mozes, zeggende:","26":"Neem op de som van den buit der gevangenen van mensen en van beesten; gij en Eleazar, de priester, en de hoofden van de vaderen der vergadering.","27":"En deel den buit in twee helften tussen degenen, die den strijd aangegrepen hebben, die tot den strijd uitgegaan zijn, en tussen de ganse vergadering.","28":"Daarna zult gij een schatting voor den HEERE heffen, van de oorlogsmannen, die tot dezen krijg uitgetogen zijn, van vijfhonderd een ziel, uit de mensen en uit de runderen, en uit de ezelen, en uit de schapen.","29":"Van hun helft zult gij het nemen, en den priester Eleazar geven tot een heffing des HEEREN.","30":"Maar van de helft der kinderen Israëls zult gij een gevangene van vijftig nemen, uit de mensen, uit de runderen, uit de ezelen, en uit de schapen, uit al de beesten; en gij zult ze aan de Levieten geven, die de wacht van de tabernakel des HEEREN waarnemen.","31":"En Mozes en Eleazar, de priester, deden, gelijk als de HEERE Mozes geboden had.","32":"De buit nu, het overschot van den roof, dat het krijgsvolk geroofd had, was zeshonderd vijf en zeventig duizend schapen;","33":"En twee en zeventig duizend runderen;","34":"En een en zestig duizend ezelen;","35":"En der mensen zielen, uit de vrouwen, die geen bijligging des mans bekend hadden, alle zielen waren twee en dertig duizend.","36":"En de helft, *te* *weten* het deel dergenen, die tot dezen krijg uitgetogen waren, was in getal driehonderd zeven en dertig duizend en vijfhonderd schapen.","37":"En de schatting voor den HEERE van schapen was zeshonderd vijf en zeventig.","38":"En de runderen waren zes en dertig duizend, en hun schatting voor den HEERE twee en zeventig.","39":"En de ezelen waren dertig duizend en vijfhonderd, en hun schatting voor den HEERE was een en zestig.","40":"En der mensen zielen waren zestien duizend, en hun schatting voor den HEERE twee en dertig zielen.","41":"En Mozes gaf Eleazar, den priester, de schatting van de heffing des HEEREN, gelijk als de HEERE Mozes geboden had.","42":"En van de helft der kinderen Israëls, welke Mozes afgedeeld had, van de mannen, die gestreden hadden;","43":"(Het halve deel nu der vergadering was, uit de schapen, driehonderd zeven en dertig duizend en vijfhonderd;","44":"En de runderen waren zes en dertig duizend;","45":"En de ezelen dertig duizend en vijfhonderd;","46":"En der mensen zielen zestien duizend;)","47":"Van die helft der kinderen Israëls nam Mozes een gevangene uit vijftig, van mensen en van beesten; en hij gaf ze aan de Levieten, die de wacht van den tabernakel des HEEREN waarnamen, gelijk als de HEERE Mozes geboden had.","48":"Toen traden tot Mozes de bevelhebbers, die over de duizenden des heirs waren, de hoofdlieden der duizenden, en de hoofdlieden der honderden;","49":"En zij zeiden tot Mozes: Uw knechten hebben opgenomen de som der krijgslieden, die onder onze hand geweest zijn; en uit ons ontbreekt niet een man.","50":"Daarom hebben wij een offerande des HEEREN gebracht, een ieder wat hij gekregen heeft, een gouden vat, een keten, of een armring, een vingerring, een oorring, of een afhangenden gordel, om voor onze zielen verzoening te doen voor het aangezicht des HEEREN.","51":"Zo nam Mozes en Eleazar, de priester, van hen het goud, alle welgewrochte vaten.","52":"En al het goud der heffing, dat zij den HEERE offerden, was zestien duizend zevenhonderd en vijftig sikkelen, van de hoofdlieden der duizenden, en van de hoofdlieden der honderden.","53":"Aangaande de krijgslieden, een iegelijk had geroofd voor zichzelven.","54":"Zo nam Mozes en Eleazar, de priester, dat goud van de hoofdlieden der duizenden en der honderden, en zij brachten het in de tent der samenkomst, ter gedachtenis voor de kinderen Israëls, voor het aangezicht des HEEREN."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Avenge the children of Israel of the Midianites: afterward shalt thou be gathered unto thy people.","3":"And Moses spake unto the people, saying, Arm some of yourselves unto the war, and let them go against the Midianites, and avenge the LORD of Midian.","4":"Of every tribe a thousand, throughout all the tribes of Israel, shall ye send to the war.","5":"So there were delivered out of the thousands of Israel, a thousand of *every* tribe, twelve thousand armed for war.","6":"And Moses sent them to the war, a thousand of *every* tribe, them and Phinehas the son of Eleazar the priest, to the war, with the holy instruments, and the trumpets to blow in his hand.","7":"And they warred against the Midianites, as the LORD commanded Moses; and they slew all the males.","8":"And they slew the kings of Midian, beside the rest of them that were slain; *namely*, Evi, and Rekem, and Zur, and Hur, and Reba, five kings of Midian: Balaam also the son of Beor they slew with the sword.","9":"And the children of Israel took *all* the women of Midian captives, and their little ones, and took the spoil of all their cattle, and all their flocks, and all their goods.","10":"And they burnt all their cities wherein they dwelt, and all their goodly castles, with fire.","11":"And they took all the spoil, and all the prey, *both* of men and of beasts.","12":"And they brought the captives, and the prey, and the spoil, unto Moses, and Eleazar the priest, and unto the congregation of the children of Israel, unto the camp at the plains of Moab, which *are* by Jordan *near* Jericho.","13":"And Moses, and Eleazar the priest, and all the princes of the congregation, went forth to meet them without the camp.","14":"And Moses was wroth with the officers of the host, *with* the captains over thousands, and captains over hundreds, which came from the battle.","15":"And Moses said unto them, Have ye saved all the women alive?","16":"Behold, these caused the children of Israel, through the counsel of Balaam, to commit trespass against the LORD in the matter of Peor, and there was a plague among the congregation of the LORD.","17":"Now therefore kill every male among the little ones, and kill every woman that hath known man by lying with him.","18":"But all the women children, that have not known a man by lying with him, keep alive","19":"And do ye abide without the camp seven days: whosoever hath killed any person, and whosoever hath touched any slain, purify *both* yourselves and your captives on the third day, and on the seventh day.","20":"And purify all *your* raiment, and all that is made of skins, and all work of goats' *hair*, and all things made of wood.","21":"And Eleazar the priest said unto the men of war which went to the battle, This *is* the ordinance of the law which the LORD commanded Moses;","22":"Only the gold, and the silver, the brass, the iron, the tin, and the lead,","23":"Every thing that may abide the fire, ye shall make *it* go through the fire, and it shall be clean: nevertheless it shall be purified with the water of separation: and all that abideth not the fire ye shall make go through the water.","24":"And ye shall wash your clothes on the seventh day, and ye shall be clean, and afterward ye shall come into the camp.","25":"And the LORD spake unto Moses, saying,","26":"Take the sum of the prey that was taken, *both* of man and of beast, thou, and Eleazar the priest, and the chief fathers of the congregation:","27":"And divide the prey into two parts; between them that took the war upon them, who went out to battle, and between all the congregation:","28":"And levy a tribute unto the LORD of the men of war which went out to battle: one soul of five hundred, *both* of the persons, and of the beeves, and of the asses, and of the sheep:","29":"Take *it* of their half, and give it unto Eleazar the priest, *for* an heave offering of the LORD.","30":"And of the children of Israel's half, thou shalt take one portion of fifty, of the persons, of the beeves, of the asses, and of the flocks, of all manner of beasts, and give them unto the Levites, which keep the charge of the tabernacle of the LORD.","31":"And Moses and Eleazar the priest did as the LORD commanded Moses.","32":"And the booty, *being* the rest of the prey which the men of war had caught, was six hundred thousand and seventy thousand and five thousand sheep,","33":"And threescore and twelve thousand beeves,","34":"And threescore and one thousand asses,","35":"And thirty and two thousand persons in all, of women that had not known man by lying","36":"And the half, *which was* the portion of them that went out to war, was in number three hundred thousand and seven and thirty thousand and five hundred sheep:","37":"And the LORD'S tribute of the sheep was six hundred and threescore and fifteen.","38":"And the beeves *were* thirty and six thousand; of which the LORD'S tribute *was* threescore and twelve.","39":"And the asses *were* thirty thousand and five hundred; of which the LORD'S tribute *was* threescore and one.","40":"And the persons *were* sixteen thousand; of which the LORD'S tribute *was* thirty and two persons.","41":"And Moses gave the tribute, *which was* the LORD'S heave offering, unto Eleazar the priest, as the LORD commanded Moses.","42":"And of the children of Israel's half, which Moses divided from the men that warred,","43":"(Now the half *that pertained unto* the congregation was three hundred thousand and thirty thousand *and* seven thousand and five hundred sheep,","44":"And thirty and six thousand beeves,","45":"And thirty thousand asses and five hundred,","46":"And sixteen thousand persons;)","47":"Even of the children of Israel's half, Moses took one portion of fifty, *both* of man and of beast, and gave them unto the Levites, which kept the charge of the tabernacle of the LORD; as the LORD commanded Moses.","48":"And the officers wh aying,","2":"<span class=\"wl wl-kjv\" data-code=\"H5358\">Avenge</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> of the <span class=\"wl wl-kjv\" data-code=\"H4084\">Midianites:</span> <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> shalt thou be <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> unto thy people.","3":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H2502\">Arm</span> <span class=\"wl wl-kjv\" data-code=\"H582\">some</span> of yourselves unto the <span class=\"wl wl-kjv\" data-code=\"H6635\">war,</span> and let them go against the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">avenge</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of Midian.","4":"Of every <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> to the war.","5":"So there were <span class=\"wl wl-kjv\" data-code=\"H4560\">delivered</span> out of the <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> of every <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe,</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H2502\">armed</span> for war.","6":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> them to the <span class=\"wl wl-kjv\" data-code=\"H6635\">war,</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> of every <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe,</span> them and <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> to the <span class=\"wl wl-kjv\" data-code=\"H6635\">war,</span> with the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets</span> to <span class=\"wl wl-kjv\" data-code=\"H8643\">blow</span> in his hand.","7":"And they <span class=\"wl wl-kjv\" data-code=\"H6633\">warred</span> against the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses;</span> and they <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> all the males.","8":"And they <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">beside</span> the rest of them that were <span class=\"wl wl-kjv\" data-code=\"H2491\">slain;</span> namely, <span class=\"wl wl-kjv\" data-code=\"H189\">Evi,</span> and <span class=\"wl wl-kjv\" data-code=\"H7552\">Rekem,</span> and <span class=\"wl wl-kjv\" data-code=\"H6698\">Zur,</span> and <span class=\"wl wl-kjv\" data-code=\"H2354\">Hur,</span> and <span class=\"wl wl-kjv\" data-code=\"H7254\">Reba,</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian:</span> <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> also the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1160\">Beor</span> they <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> with the sword.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> took all the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian</span> <span class=\"wl wl-kjv\" data-code=\"H7617\">captives,</span> and their little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> and took the <span class=\"wl wl-kjv\" data-code=\"H962\">spoil</span> of all their <span class=\"wl wl-kjv\" data-code=\"H929\">cattle,</span> and all their <span class=\"wl wl-kjv\" data-code=\"H4735\">flocks,</span> and all their goods.","10":"And they <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> all their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> wherein they <span class=\"wl wl-kjv\" data-code=\"H4186\">dwelt,</span> and all their goodly <span class=\"wl wl-kjv\" data-code=\"H2918\">castles,</span> with fire.","11":"And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> all the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4455\">prey,</span> both of <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> and of beasts.","12":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H7628\">captives,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4455\">prey,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil,</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> and <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and unto the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> at the <span class=\"wl wl-kjv\" data-code=\"H6160\">plains</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> which are by <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> near Jericho.","13":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> and <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5387\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> them <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the camp.","14":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> was <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth</span> with the <span class=\"wl wl-kjv\" data-code=\"H6485\">officers</span> of the <span class=\"wl wl-kjv\" data-code=\"H2428\">host,</span> with the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> over <span class=\"wl wl-kjv\" data-code=\"H505\">thousands,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> over <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds,</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H6635\">from</span> the battle.","15":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Have ye <span class=\"wl wl-kjv\" data-code=\"H2421\">saved</span> all the <span class=\"wl wl-kjv\" data-code=\"H5347\">women</span> alive?","16":"Behold, <span class=\"wl wl-kjv\" data-code=\"H2007\">these</span> <span class=\"wl wl-kjv\" data-code=\"H1961\">caused</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> through the <span class=\"wl wl-kjv\" data-code=\"H1697\">counsel</span> of <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam,</span> to <span class=\"wl wl-kjv\" data-code=\"H4560\">commit</span> <span class=\"wl wl-kjv\" data-code=\"H4604\">trespass</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> of <span class=\"wl wl-kjv\" data-code=\"H6465\">Peor,</span> and there was a <span class=\"wl wl-kjv\" data-code=\"H4046\">plague</span> among the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the LORD.","17":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H2026\">kill</span> every <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> among the little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">kill</span> every <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that hath <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> by <span class=\"wl wl-kjv\" data-code=\"H4904\">lying</span> with him.","18":"But all the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> <span class=\"wl wl-kjv\" data-code=\"H2945\">children,</span> that have not <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> a <span class=\"wl wl-kjv\" data-code=\"H2145\">man</span> by <span class=\"wl wl-kjv\" data-code=\"H4904\">lying</span> with him, keep alive","19":"And do ye <span class=\"wl wl-kjv\" data-code=\"H2583\">abide</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> whosoever hath <span class=\"wl wl-kjv\" data-code=\"H2026\">killed</span> any <span class=\"wl wl-kjv\" data-code=\"H5315\">person,</span> and whosoever hath <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> any <span class=\"wl wl-kjv\" data-code=\"H2491\">slain,</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">purify</span> both yourselves and your <span class=\"wl wl-kjv\" data-code=\"H7628\">captives</span> on the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> day.","20":"And <span class=\"wl wl-kjv\" data-code=\"H2398\">purify</span> all your <span class=\"wl wl-kjv\" data-code=\"H899\">raiment,</span> and all that is <span class=\"wl wl-kjv\" data-code=\"H3627\">made</span> of <span class=\"wl wl-kjv\" data-code=\"H5785\">skins,</span> and all <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H5795\">goats'</span> hair, and all things <span class=\"wl wl-kjv\" data-code=\"H3627\">made</span> of wood.","21":"And <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">war</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> to the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> This is the <span class=\"wl wl-kjv\" data-code=\"H2708\">ordinance</span> of the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses;","22":"Only the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> the <span class=\"wl wl-kjv\" data-code=\"H5178\">brass,</span> the <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> the <span class=\"wl wl-kjv\" data-code=\"H913\">tin,</span> and the lead,","23":"Every <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> that may <span class=\"wl wl-kjv\" data-code=\"H935\">abide</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> ye shall make it go <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H2891\">clean:</span> nevertheless it shall be <span class=\"wl wl-kjv\" data-code=\"H2398\">purified</span> with the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of <span class=\"wl wl-kjv\" data-code=\"H5079\">separation:</span> and all that <span class=\"wl wl-kjv\" data-code=\"H935\">abideth</span> not the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> ye shall make go <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the water.","24":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> your <span class=\"wl wl-kjv\" data-code=\"H899\">clothes</span> on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H2891\">clean,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the camp.","25":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","26":"<span class=\"wl wl-kjv\" data-code=\"H5375\">Take</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">sum</span> of the <span class=\"wl wl-kjv\" data-code=\"H4455\">prey</span> that was <span class=\"wl wl-kjv\" data-code=\"H7628\">taken,</span> both of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and of <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> thou, and <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> of the congregation:","27":"And <span class=\"wl wl-kjv\" data-code=\"H2673\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H4455\">prey</span> into two <span class=\"wl wl-kjv\" data-code=\"H2673\">parts;</span> between them that <span class=\"wl wl-kjv\" data-code=\"H8610\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> upon them, who went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H6635\">battle,</span> and between all the congregation:","28":"And <span class=\"wl wl-kjv\" data-code=\"H7311\">levy</span> a <span class=\"wl wl-kjv\" data-code=\"H4371\">tribute</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> which went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H6635\">battle:</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> of <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> both of the <span class=\"wl wl-kjv\" data-code=\"H120\">persons,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1241\">beeves,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H2543\">asses,</span> and of the sheep:","29":"<span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> it of their <span class=\"wl wl-kjv\" data-code=\"H4276\">half,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it unto <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> for an heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> of the LORD.","30":"And of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel's</span> <span class=\"wl wl-kjv\" data-code=\"H4276\">half,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H270\">portion</span> of <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty,</span> of the <span class=\"wl wl-kjv\" data-code=\"H120\">persons,</span> of the <span class=\"wl wl-kjv\" data-code=\"H1241\">beeves,</span> of the <span class=\"wl wl-kjv\" data-code=\"H2543\">asses,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> of all manner of <span class=\"wl wl-kjv\" data-code=\"H929\">beasts,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them unto the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> which <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> of the LORD.","31":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses.","32":"And the <span class=\"wl wl-kjv\" data-code=\"H4455\">booty,</span> being the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H957\">prey</span> which the men <span class=\"wl wl-kjv\" data-code=\"H5971\">of</span> <span class=\"wl wl-kjv\" data-code=\"H6635\">war</span> had <span class=\"wl wl-kjv\" data-code=\"H962\">caught,</span> was <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> sheep,","33":"And threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> beeves,","34":"And <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> asses,","35":"And <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">persons</span> in <span class=\"wl wl-kjv\" data-code=\"H3605\">all,</span> of <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> that had not <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> <span class=\"wl wl-kjv\" data-code=\"H2145\">man</span> by lying","36":"And the <span class=\"wl wl-kjv\" data-code=\"H4275\">half,</span> which was the <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> ">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> and of <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it into the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> for a <span class=\"wl wl-kjv\" data-code=\"H2146\">memorial</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"wraak der kinderen","tekst":"Hebreeuws, wreek de wraak der kinderen Israëls van de Midianieten; te weten, over het kwaad, hetwelk zij onder de Israëlieten listiglijk veroorzaakt hebben, toen zij dezelve gebracht hebben tot lichamelijke en geestelijke hoererij, vermeld hier boven Num 25:1-2, enz. en onder, vs.15,16."},{"catchword":"daarna zult gij verzameld worden","tekst":"Dat is, gij zult sterven en uit deze wereld verhuizen. Zie van deze manier van spreken Gen 15:15, en Gen 25:8, en boven Num 20:24, Num 20:26."}],"3":[{"catchword":"ten strijde toerusten,","tekst":"Of, ten heir; en zo in het volgende."},{"catchword":"des HEEREN te doen","tekst":"Te weten, die de HEERE geboden had tegen de Midianieten te zullen gedaan worden. Zie boven, Num 25:17-18, waarmede God verklaarde dat de vijandschap, tegen zijn volk bewezen, zoveel als Hem aangedaan was. Vergelijk Zec 2:8, en Act 9:4. aan de Midianieten."}],"4":[{"catchword":"Van elken stam","tekst":"Hebreeuws, duizend van een stam, duizend van een stam. Zie deze manier van spreken ook Lev 24:8 /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
