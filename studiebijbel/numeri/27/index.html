 ernaar verlangt opziener te worden, begeert hij een voortreffelijk werk. Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren; niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "Spr 17:2": "Een verstandige knecht zal heersen over een zoon die beschaamd maakt, en in het midden van de broeders zal hij erfenis delen.", "2 Tim 2:7": "Bedenk wat ik zeg; en de Heere geeft u inzicht in alle dingen.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Klaagl 3:38": "Mem. Gaat niet uit de mond van de Allerhoogste het kwade en het goede?", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Ezech 36:27": "En Ik zal Mijn Geest geven in het binnenste van u; en Ik zal maken dat u in Mijn inzettingen zult wandelen, en Mijn rechten zult bewaren en doen.", "Openb 4:5": "En van de troon gingen bliksemflitsen uit, en donderslagen, en stemmen; en zeven vurige lampen waren brandend voor de troon, welke de zeven Geesten van God zijn.", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "Jer 23:4": "En Ik zal herders over hen doen opstaan, die ze weiden zullen; en zij zullen niet meer vrezen, noch verschrikt worden, noch gemist worden, spreekt de HEERE.", "Mark 6:11": "En als iemand u niet ontvangt, en niet naar u luistert, schud dan, wanneer u vandaar vertrekt, het stof van uw voeten af, hun tot een getuigenis. Voorwaar, Ik zeg u: Het zal voor Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Num 31:14": "En Mozes werd zeer boos op de aanvoerders van het leger, de hoofdlieden over de duizenden, en de hoofdlieden over de honderden, die uit de strijd van die oorlog kwamen.", "Ezech 17:24": "Zo zullen alle bomen van het veld weten dat Ik, de HEERE, de hoge boom vernederd heb, de nederige boom verheven heb, de groene boom verdroogd heb, en de droge boom bloeiend gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen.", "Openb 5:6": "En ik zag, en zie, in het midden van de troon, en van de vier dieren, en in het midden van de oudsten, een Lam, dat stond als geslacht, met zeven horens en zeven ogen; dat zijn de zeven Geesten van God, die uitgezonden zijn over de hele aarde.", "2 Kron 19:7": "Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Mal 2:10": "Hebben wij niet allen één Vader? Heeft niet één God ons geschapen? Waarom handelen wij dan trouweloos, de één tegen de ander, door het verbond van onze vaders te ontheiligen?", "1 Petr 3:18": "Want Christus heeft ook eenmaal voor de zonden geleden, Hij, de Rechtvaardige, voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Hij is wel gedood in het vlees, maar levend gemaakt door de Geest;", "Matt 10:6": "Maar ga veel meer heen naar de verloren schapen van het huis van Israël.", "Num 27:18-23": "Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem; En stel hem voor Eleazar, de priester, en voor de hele vergadering; en geef hem opdracht voor hun ogen; En leg iets van uw waardigheid op hem, opdat zij luisteren, namelijk de hele vergadering van de kinderen van Israël.", "1 Kron 2:23": "En hij nam Gesur en Aram, met de vlekken van Jaïr, van hen, met Kenath en haar onderhorige plaatsen, zestig steden. Deze allen zijn zonen van Machir, de vader van Gilead.", "Hand 1:8": "maar u zult de kracht van de Heilige Geest ontvangen, Die over u komen zal; en u zult Mijn getuigen zijn, zowel in Jeruzalem als in heel Judea en Samaria, en tot aan het uiterste van de aarde.", "1 Kron 29:18": "O HEERE, God van onze vaders, Abraham, Izak en Israël, bewaar dit voor eeuwig in de gedachten van het hart van Uw volk, en richt hun hart op U.", "2 Tim 4:1-6": "Ik roep u dus dringend op, voor het aangezicht van God en de Heere Jezus Christus, Die de levenden en doden zal oordelen bij Zijn verschijning en in Zijn Koninkrijk: Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs. Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;", "1 Sam 30:8": "Toen vroeg David de HEERE: Zal ik deze bende achternajagen? Zal ik ze inhalen? En Hij zei tegen hem: Jaag na, want u zult zeker inhalen, en u zult zeker verlossen.", "Zach 10:2": "Want de terafim² spreken onwaarheid, en de waarzeggers zien bedrog, en zij spreken loze dromen, zij troosten met leegte; daarom zijn zij weggetrokken als schapen, zij zijn onderdrukt geworden, want er was geen herder.", "Ps 51:14": "Geef mij de vreugde van het heil weer; en de vrijmoedige geest ondersteunt mij.", "2 Sam 5:23": "En David vroeg de HEERE, Die zei: U zult niet optrekken; maar trek om, tot achter hen, zodat u bij hen komt van tegenover de moerbeibomen;", "Ps 25:22": "O God! verlos Israël uit al zijn benauwdheden.", "2 Kon 3:11-19": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot. En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom. Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.", "Ezech 9:8": "Het gebeurde nu, toen zij hen geslagen hadden en ik overgebleven was, dat ik op mijn aangezicht viel, en riep, en zei: Ach, Heere HEERE, zult U het hele overblijfsel van Israël verderven, door Uw grimmigheid uit te gieten over Jeruzalem?", "1 Sam 10:9": "Het gebeurde nu, toen hij zich omkeerde om van Samuël weg te gaan, dat God hem een ander hart gaf; en al die tekenen kwamen die dag uit.", "Hebr 10:15": "En de Heilige Geest getuigt ons dit ook;", "Gen 5:1": "Dit is het boek van Adams geslacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God.", "Joz 7:7-26": "En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan! Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd? Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?", "Jer 27:5": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Hebr 3:2": "Die trouw is aan Hem Die Hem aangesteld heeft, zoals ook Mozes trouw was in heel Zijn huis.", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Jes 48:16": "Kom nader tot Mij, hoor dit: Ik heb van het begin af niet in het verborgene gesproken, maar van de tijd af, dat het gebeurd is, ben Ik daar; en nu, de Heere HEERE, en Zijn Geest heeft Mij gezonden.", "Joz 8:8": "En het zal gebeuren, wanneer u de stad ingenomen hebt, dat u de stad met vuur aansteekt; naar het woord van de HEERE zult u doen; kijk, ik heb het u geboden.", "Ps 97:1": "De HEERE regeert, de aarde verheugt zich; laat veel eilanden zich verblijden.", "2 Kor 3:3": "omdat u openbaar geworden bent als een brief van Christus, door onze bediening opgesteld, geschreven niet met inkt, maar door de Geest van de levende God, niet op stenen tafels, maar op tafels van vlees, van het hart.", "Kol 2:1-3": "Want ik wil dat u weet hoe zware strijd ik voor u heb, en voor hen die in Laodicea zijn, en voor allen die mijn gezicht in het vlees niet gezien hebben; Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus; In Wie al de schatten van de wijsheid en van de kennis verborgen zijn.", "Joz 17:1-6": "De stam van Manasse had ook een lot, omdat hij de eerstgeborene van Jozef was: te weten Machir, de eerstgeborene van Manasse, de vader van Gilead; omdat hij een krijgsman was, had hij Gilead en Bazan. Ook hadden de overgebleven kinderen van Manasse een lot, naar hun huisgezinnen: te weten de kinderen van Abiëzer, en de kinderen van Helek, en de kinderen van Asriël, en de kinderen van Sechem, en de kinderen van Hefer, en de kinderen van Semida. Dit zijn de mannelijke kinderen van Manasse, de zoon van Jozef, naar hun huisgezinnen. Zelafead nu, de zoon van Hefer, de zoon van Gilead, de zoon van Machir, de zoon van Manasse, had geen zonen, maar dochters; en dit zijn de namen van zijn dochters: Machla en Noa, Hogla, Milka en Tirza.", "2 Sam 24:17": "En David, toen hij de engel zag die het volk sloeg, sprak tot de HEERE, en zei: Zie, ik, ik heb gezondigd, en ik, ik heb onrecht gehandeld, maar wat hebben deze schapen gedaan? Laat toch Uw hand tegen mij zijn en tegen het huis van mijn vader.", "Ef 4:3": "En u inspant om de eenheid van de Geest te bewaren door de band van de vrede.", "Job 31:15": "Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Job 34:32": "Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "Hebr 3:7": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort,", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Jes 44:6": "Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE van de heerscharen: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.", "Spr 24:21": "Mijn zoon! vrees de HEERE en de koning; vermeng u niet met hen, die naar verandering staan;", "Ezech 46:16-18": "Zo zegt de Heere HEERE: Wanneer de vorst aan iemand van zijn zonen een geschenk zal geven van zijn erfenis, dan zullen zijn zonen dat hebben; het zal hun bezitting zijn in erfenis. Maar wanneer hij van zijn erfenis een geschenk zal geven aan een van zijn knechten, dan zal die dat hebben tot het vrijjaar toe; dan zal het naar de vorst terugkeren; het is immers zijn erfenis, zijn zonen zullen het hebben. En de vorst zal niets nemen van de erfenis van het volk, door hen van hun bezitting te beroven; van zijn eigen bezitting zal hij zijn zonen erfenis nalaten; opdat niet Mijn volk, ieder uit zijn bezitting, verstrooid wordt.", "Num 14:35": "Ik, de HEERE, heb gesproken: zo zal Ik zeker doen aan deze hele slechte vergadering van hen die zich tegen Mij verzameld hebben; zij zullen in deze woestijn omkomen, en zullen daar sterven!", "2 Kor 9:14": "En door hun gebed voor u, die naar u verlangen, om de uitnemende genade van God over u.", "Num 27:1-8": "Toen kwamen de dochters van Zelafead naar voren, de zoon van Hefer, de zoon van Gilead, de zoon van Machir, de zoon van Manasse, onder de geslachten van Manasse, de zoon van Jozef (en dit zijn de namen van zijn dochters: Machla, Noa, en Hogla, en Milka, en Tirza); En zij gingen staan voor Mozes, en voor Eleazar, de priester, en voor de leiders, en de hele vergadering, bij de deur van de tent van de samenkomst, en zeiden: Onze vader is gestorven in de woestijn, en hij is niet geweest onder hen die zich tegen de HEERE verzameld hebben, in de groep van Korach; maar hij is in zijn eigen zonde gestorven, en had geen zonen.", "1 Kon 21:3": "Maar Naboth zei tegen Achab: Dat de HEERE ver van mij houde, dat ik u de erfenis van mijn vaderen zou geven!", "Gal 1:3": "Genade zij u en vrede van God de Vader, en onze Heere Jezus Christus;", "Zach 12:1": "De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Num 34:4": "En deze grens zal voor u omgaan van het zuiden naar de opgang van Akrabbim, en doorgaan naar Zin; en haar uiteinden zullen zijn, vanaf het zuiden naar Kades-Barnea; en zij zal uitgaan naar Hazar-Addar, en doorgaan naar Azmon.", "Ef 4:4": "Eén lichaam is het, en één Geest, zoals u ook geroepen bent tot één hoop van uw roeping;", "Hand 13:3": "Toen vastten en baden zij, en nadat zij hun de handen opgelegd hadden, lieten zij hen gaan.", "2 Kron 6:40": "Nu, mijn God, laat toch Uw ogen open zijn en Uw oren opmerkzaam op het gebed van deze plaats.", "Num 33:48": "En zij vertrokken van de bergen Abarim, en legerden zich in de vlakke velden van de Moabieten, aan de Jordaan bij Jericho.", "Rom 15:19": "door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb.", "1 Sam 18:13": "Daarom stuurde Saul hem van zich weg, en hij stelde hem aan tot leider van duizend; en hij ging uit en hij ging in voor het aangezicht van het volk.", "Ps 12:2": "Behoud, o HEERE; want de goedertierene ontbreekt, want de getrouwen zijn weinig geworden onder de mensenkinderen.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Ex 23:9": "U zult ook de vreemdeling niet onderdrukken; want u kent het gemoed van de vreemdeling, omdat u vreemdelingen geweest bent in het land Egypte.", "Mark 13:11": "Maar wanneer zij u zullen wegleiden om u over te leveren, maak u dan niet vooraf bezorgd over wat u zult spreken, en bedenk het niet van tevoren; maar wat u in dat uur gegeven zal worden, spreek dat; want u bent het niet die spreekt, maar de Heilige Geest.", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "1 Sam 16:14": "En de Geest van de HEERE week van Saul; en een boze geest van de HEERE verschrikte hem.", "Gal 4:6": "En omdat u kinderen bent, heeft God de Geest van Zijn Zoon uitgezonden in uw harten, Die roept: Abba, Vader!", "Jes 45:18": "Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, maar heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.", "2 Tim 1:3": "Ik dank God, aan Wie ik dien vanaf mijn voorouders met een rein geweten, zoals ik zonder ophouden aan u denk in mijn gebeden, nacht en dag;", "Ex 17:9": "Mozes zei toen tegen Jozua: Kies mannen voor ons uit, en trek eropuit, strijd tegen Amalek; morgen zal ik op de top van de heuvel staan, met de staf van God in mijn hand.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Deut 10:6": "(En de kinderen van Israël reisden van Beeroth-Bene-jaakan naar Mosera. Daar stierf Aäron, en werd daar begraven; en zijn zoon Eleazar bediende het priesterambt in zijn plaats.", "Jer 27:5-7": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.", "Richt 5:31": "Zo moeten omkomen al Uw vijanden, o HEERE! Die Hem daarentegen liefhebben, moeten zijn, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren.", "Ezra 7:25": "En u, Ezra, stel naar de wijsheid van uw God, die in uw hand is, regeerders en rechters aan, die al het volk rechtspreken dat aan de overkant van de rivier is, allen die de wetten van God kennen; en wie ze niet kent, moet u het bekendmaken.", "2 Kron 23:3": "En heel de gemeente sloot een verbond in het huis van God, met de koning; en hij zei tegen hen: Zie, de zoon van de koning zal koning zijn, zoals de HEERE over de zonen van David gesproken heeft.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Ps 82:1": "Een psalm van Asaf. God staat in de vergadering van God; Hij oordeelt in het midden van de goden;", "Neh 3:16": "Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden.", "2 Kon 2:10": "En hij zei: U hebt een moeilijke zaak gevraagd; als u mij zult zien wanneer ik van bij u weggenomen word, zal het u zo gebeuren; maar zo niet, dan zal het niet gebeuren.", "Ps 119:135": "Doe Uw aangezicht lichten over Uw knecht, en leer mij Uw inzettingen.", "Gal 5:5": "Want wij verwachten door de Geest, uit het geloof, de hoop van de rechtvaardigheid.", "1 Sam 2:6-8": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Dan 6:27": "Van mij is een bevel uitgegaan, dat men in de hele heerschappij van mijn koninkrijk moet beven en sidderen voor het aangezicht van de God van Daniël; want Hij is de levende God, en blijvend in eeuwigheid, en Zijn koninkrijk gaat niet te gronde, en Zijn heerschappij duurt tot het einde toe.", "Spr 16:14": "De woede van de koning is als de boden van de dood; maar een wijs man zal die verzoenen.", "Num 15:34": "En zij stelden hem in bewaring; want het was niet duidelijk gemaakt wat hem gedaan moest worden.", "Ex 32:31": "Zo keerde Mozes terug tot de HEERE, en zei: Och, dit volk heeft een grote zonde gezondigd, doordat zij zich gouden goden gemaakt hebben.", "2 Kor 3:8": "hoe zal dan niet veel meer de bediening van de Geest in heerlijkheid zijn?", "Ps 39:5": "HEERE, maak mij mijn einde bekend, en welke de mate van mijn dagen is; dat ik weet, hoe vergankelijk ik ben.", "1 Kon 8:44": "Wanneer Uw volk in de oorlog tegen zijn vijand uittrekken zal, langs de weg die U hen zenden zult, en tot de HEERE bidden zullen in de richting van deze stad, die U verkoren hebt, en van dit huis, dat ik voor Uw Naam gebouwd heb;", "Num 31:16": "Zie, dezen waren het, die door de raad van Bileam de kinderen van Israël ertoe brachten trouweloos te handelen tegen de HEERE, in de zaak van Peor; waardoor die plaag kwam onder de vergadering van de HEERE.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "1 Kron 29:11": "Van U, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles wat in de hemel en op aarde is, is van U: van U, o HEERE, is het Koninkrijk, en U hebt Uzelf verhoogd tot een Hoofd boven alles.", "Joz 15:3": "en zij gaat uit naar het zuiden tot de opgang van Akrabbim, en gaat door naar Zin, en gaat op van het zuiden naar Kades-barnea, en gaat door Hezron, en gaat op naar Adar, en gaat om Karkaa;", "Ps 119:80": "Laat mijn hart oprecht zijn tot Uw inzettingen, opdat ik niet beschaamd word.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Num 27:1-5": "Toen kwamen de dochters van Zelafead naar voren, de zoon van Hefer, de zoon van Gilead, de zoon van Machir, de zoon van Manasse, onder de geslachten van Manasse, de zoon van Jozef (en dit zijn de namen van zijn dochters: Machla, Noa, en Hogla, en Milka, en Tirza); En zij gingen staan voor Mozes, en voor Eleazar, de priester, en voor de leiders, en de hele vergadering, bij de deur van de tent van de samenkomst, en zeiden: Onze vader is gestorven in de woestijn, en hij is niet geweest onder hen die zich tegen de HEERE verzameld hebben, in de groep van Korach; maar hij is in zijn eigen zonde gestorven, en had geen zonen.", "1 Kron 14:14": "En David vroeg God nog een keer; en God zei tegen hem: U zult niet achter hen aan optrekken; maar omsingel hen van boven, en kom op hen af tegenover de moerbeibomen.", "Matt 12:28": "Maar als Ik door de Geest van God de duivels uitwerp, dan is het Koninkrijk van God tot u gekomen.", "Num 36:1-5": "En de familiehoofden van het geslacht van de kinderen van Gilead, de zoon van Machir, de zoon van Manasse, uit de geslachten van de kinderen van Jozef, traden naar voren en spraken voor Mozes en voor de leiders, de familiehoofden van de kinderen van Israël. En zij zeiden: De HEERE heeft mijn heer geboden dat land door het lot aan de kinderen van Israël in erfenis te geven; en mijn heer is door de HEERE geboden de erfenis van onze broeder Zelafead te geven aan zijn dochters. Wanneer zij aan een van de zonen van de andere stammen van de kinderen van Israël tot vrouw zouden worden, dan zou hun erfenis van de erfenis van onze vaderen afgetrokken worden, en toegevoegd worden aan de erfenis van die stam waaraan zij zouden komen; zo zou van het lot van onze erfenis worden afgetrokken.", "Num 27:15-23": "Toen sprak Mozes tot de HEERE, en zei: Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering, Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Ps 83:19": "opdat zij weten dat U alleen met Uw Naam de HEERE bent, de Allerhoogste over de hele aarde.", "Num 34:3": "De zuiderkant nu zal voor u zijn vanaf de woestijn Zin, langs de zijden van Edom; en de zuidergrens zal voor u zijn vanaf het einde van de Zoutzee, in het oosten;", "Openb 11:11": "En na die drie dagen en een halve is een geest van leven uit God in hen gegaan; en zij stonden op op hun voeten; en er is grote vrees gevallen op hen die hen aanschouwden.", "Lev 25:45": "U zult ze ook kopen van de kinderen van de bijwoners, die als vreemdelingen bij u verblijven, uit hen en uit hun geslachten, die bij u zullen zijn, die zij in uw land verwekt zullen hebben; en zij zullen u tot een bezitting zijn.", "Joh 3:34": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.", "Deut 31:14": "En de HEERE zei tegen Mozes: Zie, uw dagen zijn genaderd om te sterven; roep Jozua, en stel u op in de tent van de samenkomst, zodat Ik hem een opdracht geef. Zo ging Mozes, en Jozua, en zij stelden zich op in de tent van de samenkomst.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "Dan 2:47": "De koning antwoordde Daniël en zei: Het is werkelijk waar dat uw God een God der goden is, en een Heere der koningen, en Iemand Die geheimen openbaart, omdat u dit geheim hebt kunnen openbaren.", "Ps 148:13": "Laat hen de Naam van de HEERE loven; want Zijn Naam alleen is hoog verheven; Zijn majesteit is over de aarde en de hemel.", "Rom 15:16": "opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest.", "Ezech 37:9": "En Hij zei tot mij: Profeteer tot de geest; profeteer, mensenkind! En zeg tot de geest: Zo zegt de Heere HEERE: Geest! Kom van de vier winden, en blaas in deze gedoden, zodat zij levend worden.", "Ps 119:66": "Leer mij een goede zin en wetenschap, want ik heb aan Uw geboden geloofd.", "Ps 113:4": "De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.", "Ps 80:3": "Wek Uw macht op voor het aangezicht van Efraïm, en Benjamin, en Manasse, en kom tot onze verlossing.", "Hand 10:19": "En terwijl Petrus over dat gezicht nadacht, zei de Geest tegen hem: Zie, drie mannen zoeken u;", "Hand 4:8": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël!", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Neh 9:20": "En U hebt Uw goede Geest gegeven om hen te onderwijzen; en Uw Manna hebt U niet geweerd van hun mond, en water hebt U hun gegeven voor hun dorst.", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "1 Kor 12:25": "opdat er geen verdeeldheid in het lichaam zou zijn, maar de leden voor elkaar dezelfde zorg zouden dragen.", "Deut 3:23-29": "Ook smeekte ik de HEERE om genade in die tijd: Heere HEERE! U bent begonnen Uw dienaar Uw grootheid en Uw sterke hand te tonen; want welke God is er in de hemel of op de aarde, die kan doen naar Uw werken en naar Uw machtige daden! Laat mij toch oversteken, en dat goede land bezien, dat aan de overkant van de Jordaan is, dat goede gebergte, en de Libanon!", "Gen 25:8": "En Abraham gaf de geest en stierf, in goede ouderdom, oud en verzadigd van het leven, en hij werd verzameld tot zijn volk.", "Ps 80:16": "en de stam die Uw rechterhand geplant heeft, en dat om de zoon die U voor Uzelf gesterkt hebt!", "1 Tim 4:1": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Dan 5:26-28": "Dit is de uitleg van deze woorden: MENE; God heeft uw koninkrijk geteld, en Hij heeft het beëindigd. TEKEL; u bent op een weegschaal gewogen, en u bent te licht bevonden. PERES; uw koninkrijk is verdeeld, en het is aan de Meden en de Perzen gegeven.", "2 Kron 18:16": "En hij zei: Ik zag heel Israël verstrooid op de bergen, als schapen die geen herder hebben; en de HEERE zei: Dezen hebben geen heer; ieder keert terug naar zijn huis in vrede.", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Deut 32:8": "Toen de Allerhoogste aan de volken de erfenis uitdeelde, toen Hij Adams kinderen van elkaar scheidde, heeft Hij de grenzen van de volken vastgesteld naar het getal van de kinderen van Israël.", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Luk 15:12": "En de jongste van hen zei tegen de vader: Vader, geef mij het deel van het bezit, dat mij toekomt. En hij verdeelde onder hen het bezit.", "Hand 15:28": "Want het heeft de Heilige Geest en ons goed gedacht, u geen grotere last op te leggen dan deze noodzakelijke dingen:", "Ps 82:2-4": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela. Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme. Verlos de arme en de behoeftige, ruk hem uit de hand van de goddelozen.", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Num 15:35": "Toen zei de HEERE tot Mozes: Die man zal zeker gedood worden; de hele vergadering zal hem met stenen stenigen buiten het leger.", "Hand 16:6": "En toen zij Frygië en het land Galatië doorgereisd hadden, werden zij door de Heilige Geest verhinderd het Woord in Azië te spreken.", "2 Tess 3:5": "Doch de Heere richte uw harten op de liefde van God, en op de lijdzaamheid van Christus.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Lev 25:49": "Of zijn oom, of de zoon van zijn oom, zal hem lossen, of wie uit de naaste verwanten van zijn vlees uit zijn geslacht is, zal hem lossen; of heeft zijn hand iets verkregen, dan kan hij zichzelf lossen.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Joh 1:33": "En ik kende Hem niet; maar Die mij gezonden heeft om te dopen met water, Die had mij gezegd: Op Wie u de Geest zult zien neerdalen en op Hem blijven, Deze is het, Die met de Heilige Geest doopt.", "1 Kron 7:15": "Machir nu nam tot een vrouw de zuster van Huppim en Suppim, en haar naam was Maächa; en de naam van de tweede was Zelafead. Zelafead nu had dochters.", "Num 16:19": "En Korach liet de hele vergadering tegen hen verzamelen bij de deur van de tent van de samenkomst. Toen verscheen de heerlijkheid van de HEERE aan deze hele vergadering.", "Num 27:12-22": "Daarna zei de HEERE tegen Mozes: Klim op deze berg Abarim, en zie dat land, dat Ik de kinderen van Israël gegeven heb. Wanneer u dat gezien zult hebben, dan zult u met uw volk verenigd worden, u ook, zoals uw broer Aäron daarmee verenigd is; Omdat u tegen Mijn bevel opstandig bent geweest in de woestijn Zin, bij de twist van de vergadering, toen u Mij bij het water voor hun ogen had moeten heiligen. Dat is het water van Meriba, bij Kades, in de woestijn Zin.", "Deut 3:28": "Draag het dan op aan Jozua, en bemoedig hem, en sterk hem; want hij zal voor dit volk uit overgaan, en hij zal hun dat land, dat u zien zult, doen erven.", "1 Kor 15:38": "Maar God geeft het een lichaam zoals Hij wil, en aan ieder zaad zijn eigen lichaam.", "Zach 7:9": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander;", "Dan 5:14": "Ik heb toch van u gehoord, dat de geest van de goden in u is, en dat er licht, en verstand, en voortreffelijke wijsheid in u gevonden wordt.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Num 36:1": "En de familiehoofden van het geslacht van de kinderen van Gilead, de zoon van Machir, de zoon van Manasse, uit de geslachten van de kinderen van Jozef, traden naar voren en spraken voor Mozes en voor de leiders, de familiehoofden van de kinderen van Israël.", "Hebr 9:17": "want een testament is van kracht bij de doden, omdat het geen kracht heeft zolang hij die het testament maakte leeft.", "1 Sam 22:10": "Die de HEERE voor hem raadpleegde, en hem teerkost gaf; hij gaf hem ook het zwaard van Goliath, de Filistijn.", "Hagg 2:9": "Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen.", "Dan 9:3-19": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as. Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden. Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten.", "Kol 4:12": "U groet Epafras, die één van u is, een dienstknecht van Christus, die altijd voor u strijdt in de gebeden, opdat u volmaakt en volkomen mag staan in heel de wil van God.", "Hand 19:35-41": "En toen de stadsschrijver de menigte tot bedaren had gebracht, zei hij: Mannen van Efeze, welk mens is er toch die niet weet dat de stad van de Efezeërs de tempelbewaarster is van de grote godin Diana, en van het beeld dat uit de hemel gevallen is? Omdat dan deze dingen onweersprekelijk zijn, is het behoorlijk dat u stil bent, en niets van het onbedacht doet. Want u hebt deze mannen hier gebracht, die geen tempelrovers zijn, en ook uw godin niet lasteren.", "Jes 64:8": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen.", "Num 26:30": "Dit zijn de zonen van Gilead: van Jezer het geslacht der Jezerieten; van Helek het geslacht der Helekieten.", "2 Kron 19:6": "En hij zei tegen de rechters: Kijk uit wat u doet, want u spreekt geen recht voor de mens, maar voor de HEERE; en Hij is bij u in de rechtszaak.", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "Ps 33:15": "Hij vormt hun aller hart; Hij let op al hun werken.", "Ezech 18:4": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Ps 139:13": "Want U bezit mijn nieren; U hebt mij in de buik van mijn moeder bedekt.", "Hebr 2:4": "terwijl God erbij getuigde door tekenen en wonderen, en allerlei krachten en gaven van de Heilige Geest, naar Zijn wil.", "1 Tim 6:1-21": "Alle dienstknechten die onder het juk zijn, moeten hun eigen heren alle eer waardig achten, opdat de Naam van God en de leer niet gelasterd wordt. En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen. Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "1 Kon 3:9": "Geef dan Uw knecht een verstandig hart om Uw volk te richten, en om onderscheid te kunnen maken tussen goed en kwaad; want wie zou dit zware volk van U kunnen richten?", "1 Sam 1:17": "Toen antwoordde Eli en zei: Ga heen in vrede, en de God van Israël geeft u wat u van Hem gebeden hebt.", "Luk 3:22": "en dat de Heilige Geest op Hem neerdaalde in lichamelijke gedaante, zoals een duif; en dat er een stem uit de hemel kwam, die zei: U bent Mijn geliefde Zoon, in U heb Ik Mijn welbehagen!", "Ps 103:19": "De HEERE heeft Zijn troon in de hemelen bevestigd, en Zijn Koninkrijk heerst over alles.", "Ps 86:9": "Al de heidenen, Heere! die Gij gemaakt hebt, zullen komen, en zullen zich voor Uw aangezicht neerbuigen, en Uw Naam eren.", "Jer 18:1-23": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei: Maak u op en ga naar het huis van de pottenbakker, en daar zal Ik u Mijn woorden doen horen. Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven.", "1 Tess 3:10": "Nacht en dag zeer overvloedig biddend, om uw gezicht te mogen zien en te volmaken wat er aan uw geloof ontbreekt.", "Hand 1:2": "tot op de dag waarop Hij opgenomen is, nadat Hij door de Heilige Geest de apostelen die Hij uitverkoren had, bevelen had gegeven.", "Ps 106:33": "Want zij verbitterden zijn geest, zodat hij iets onbedacht uitsprak met zijn lippen.", "Hebr 13:20": "De God nu van de vrede, Die de grote Herder van de schapen, door het bloed van het eeuwige testament, uit de doden heeft teruggebracht, namelijk onze Heere Jezus Christus,", "1 Sam 16:18": "Toen antwoordde een van de jongens, en zei: Zie, ik heb een zoon van Isaï gezien, de Bethlehemiet, die kan spelen, en hij is een dapper held en een krijgsman, en verstandig in zaken, en een knappe man, en de HEERE is met hem.", "Num 26:29": "De zonen van Manasse waren: van Machir het geslacht der Machirieten; Machir nu verwekte Gilead; van Gilead was het geslacht der Gileadieten.", "Openb 1:4": "Johannes aan de zeven gemeenten die in Azië zijn: genade zij u en vrede van Hem, Die is, en Die was, en Die komen zal; en van de zeven geesten die voor Zijn troon zijn;", "Deut 1:37": "Ook werd de HEERE toornig op mij vanwege u, en zei: Ook u zult daar niet ingaan.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Ps 51:20": "Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.", "Spr 20:21": "Als een erfenis in het begin gehaast verkregen wordt, zal het einde ervan niet gezegend worden.", "Gal 3:28": "Daarin is geen Jood en geen Griek; daarin is geen slaaf en geen vrije; daarin is geen man en vrouw; want u bent allen één in Christus Jezus.", "Num 26:64": "En onder dezen was niemand uit de getelden van Mozes en Aäron, de priester, toen zij de kinderen van Israël telden in de woestijn van Sinaï.", "Num 11:28": "En Jozua, de zoon van Nun, de dienaar van Mozes, één van zijn uitgelezen jongemannen, antwoordde en zei: Mijn heer Mozes, verbied hun dat!", "Deut 21:15-17": "Wanneer een man twee vrouwen heeft, een geliefde en een gehate, en de geliefde en de gehate hem zonen gebaard hebben, en de eerstgeboren zoon van de gehate is; Dan zal het gebeuren, op de dag dat hij zijn zonen laat erven wat hij heeft, dat hij niet het eerstgeboorterecht mag geven aan de zoon van de geliefde, ten koste van de zoon van de gehate, die de eerstgeborene is. Maar de eerstgeborene, de zoon van de gehate, zal hij erkennen, door hem het dubbele deel te geven van alles wat bij hem gevonden wordt; want hij is het begin van zijn kracht, het recht van de eerstgeboorte komt hem toe.", "1 Sam 22:10-15": "Die de HEERE voor hem raadpleegde, en hem teerkost gaf; hij gaf hem ook het zwaard van Goliath, de Filistijn. Toen zond de koning heen om de priester Achimelech, de zoon van Ahitub, te laten roepen, en het hele huis van zijn vader, de priesters die te Nob waren; en zij kwamen allemaal naar de koning. En Saul zei: Hoor nu, u, zoon van Ahitub! En hij zei: Zie, hier ben ik, mijn heer!", "Jes 63:10": "Maar zij zijn opstandig geworden, en zij hebben Zijn Heilige Geest smarten aangedaan; daarom is Hij hun in een vijand veranderd, Hij Zelf heeft tegen hen gestreden.", "Ps 22:29": "Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen.", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "2 Sam 5:19": "Toen vroeg David de HEERE: Zal ik optrekken tegen de Filistijnen? Zult U hen in mijn hand geven? En de HEERE zei tegen David: Trek op, want Ik zal de Filistijnen zeker in uw hand geven.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Hebr 12:9": "Verder, wij hebben de vaders van ons vlees wel als kastijders gehad, en wij hadden ontzag voor hen; zullen wij dan niet veel meer onderworpen zijn aan de Vader van de geesten, en leven?", "Job 16:19": "Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.", "1 Joh 5:6-8": "Deze is het Die gekomen is door water en bloed, namelijk Jezus, de Christus; niet door het water alleen, maar door het water en het bloed. En de Geest is het Die getuigt, dat de Geest de waarheid is. Want Drie zijn er, Die getuigen in de hemel: de Vader, het Woord en de Heilige Geest; en deze Drie zijn Eén. En drie zijn er die getuigen op de aarde: de Geest, en het water, en het bloed; en die drie zijn tot een.", "Jer 21:12": "O huis van David! zo zegt de HEERE: Spreek 's morgens recht, en bevrijd de beroofde uit de hand van de verdrukker; anders zal Mijn gramschap uitvaren als een vuur, en branden, zodat niemand het blussen kan, vanwege de slechtheid van uw daden.", "Matt 17:24-27": "En toen zij in Kapernaüm gekomen waren, kwamen zij die de tempelbelasting inden naar Petrus toe en zeiden: Betaalt uw Meester de tempelbelasting niet? Hij zei: Ja. En toen hij het huis binnenkwam, sprak Jezus hem voor en zei: Wat denkt u, Simon? Van wie innen de koningen van de aarde tol of belasting: van hun eigen zonen, of van vreemden? Petrus zei tegen Hem: Van vreemden. Jezus zei tegen hem: Dan zijn de zonen dus vrij.", "1 Kor 2:10-14": "Maar God heeft het ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten van God. Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God. Maar wij hebben niet de geest van de wereld ontvangen, maar de Geest Die uit God is, opdat wij zouden weten de dingen die ons door God geschonken zijn;", "Ef 1:17": "Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Jer 32:8": "Zo kwam Hanameel, de zoon van mijn oom, naar het woord van de HEERE, tot mij, in het voorhof van de bewaking, en zei tegen mij: Koop toch mijn veld, dat bij Anathoth is, dat in het land van Benjamin is; want u hebt het erfrecht, en u hebt de lossing, koop het voor uzelf. Toen merkte ik dat het woord van de HEERE was.", "Hand 13:9": "Doch Saulus (die ook Paulus genoemd wordt), vervuld met de Heilige Geest, en de ogen op hem gericht houdend, zei:", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "1 Sam 10:24": "Toen zei Samuël tegen heel het volk: Ziet u wie de HEERE gekozen heeft? Want er is niemand zoals hij onder heel het volk. Toen juichte heel het volk, en zij zeiden: Leve de koning!", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "2 Tim 1:18": "De Heere geve hem, dat hij barmhartigheid vindt bij de Heere, op die dag; en hoezeer hij mij in Efeze gediend heeft, weet u zeer goed.", "Num 36:1-11": "En de familiehoofden van het geslacht van de kinderen van Gilead, de zoon van Machir, de zoon van Manasse, uit de geslachten van de kinderen van Jozef, traden naar voren en spraken voor Mozes en voor de leiders, de familiehoofden van de kinderen van Israël. En zij zeiden: De HEERE heeft mijn heer geboden dat land door het lot aan de kinderen van Israël in erfenis te geven; en mijn heer is door de HEERE geboden de erfenis van onze broeder Zelafead te geven aan zijn dochters. Wanneer zij aan een van de zonen van de andere stammen van de kinderen van Israël tot vrouw zouden worden, dan zou hun erfenis van de erfenis van onze vaderen afgetrokken worden, en toegevoegd worden aan de erfenis van die stam waaraan zij zouden komen; zo zou van het lot van onze erfenis worden afgetrokken.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Matt 1:18": "De geboorte van Jezus Christus was nu als volgt. Toen Maria, Zijn moeder, met Jozef in ondertrouw was, bleek zij, voordat zij samengekomen waren, zwanger te zijn uit de Heilige Geest.", "Num 16:49": "Zij die aan die plaag gestorven waren, waren veertienduizend zevenhonderd, behalve zij die gestorven waren om de zaak van Korach.", "Rom 1:9": "Want God is mijn Getuige, Die ik dien in mijn geest, in het Evangelie van Zijn Zoon, hoe ik zonder ophouden aan u denk;", "Hand 17:28": "Want in Hem leven wij, en bewegen wij ons, en zijn wij; zoals ook enkelen van uw eigen dichters gezegd hebben: Want wij zijn ook Zijn geslacht.", "Jes 64:8-12": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen. HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting.", "Gal 3:15": "Broeders, ik spreek naar de mens: zelfs bij het verbond van een mens, dat bevestigd is, doet niemand het teniet, en niemand voegt er iets aan toe.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Matt 3:17": "En zie, een stem uit de hemelen zei: Deze is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "Ps 125:4": "HEERE! doe het goede aan hen die goed zijn, en aan hen die oprecht zijn in hun hart.", "2 Kor 13:14": "De genade van de Heere Jezus Christus, en de liefde van God, en de gemeenschap van de Heilige Geest, zij met u allen. Amen. De tweede brief aan de Korinthiërs werd door Titus en Lukas geschreven vanuit Filippi, een stad in Macedonië.", "Job 10:11": "Met huid en vlees hebt U mij bekleed; met beenderen ook en pezen hebt U mij samengevlochten;", "Job 12:9": "Wie weet niet, uit al deze dingen, dat de hand van de HEERE dit doet?", "Deut 31:7": "En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven.", "Num 33:38": "Toen ging de priester Aäron de berg Hor op, naar het bevel van de HEERE, en stierf daar, in het veertigste jaar na de uittocht van de kinderen van Israël uit het land Egypte, in de vijfde maand, op de eerste dag van de maand.", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Gal 4:1": "Maar ik zeg: zolang de erfgenaam een kind is, verschilt hij niets van een dienstknecht, hoewel hij een heer is van alles;", "Openb 11:4": "Dezen zijn de twee olijfbomen en de twee kandelaars, die voor de God van de aarde staan.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "1 Kron 7:14": "De kinderen van Manasse waren Asriël, die de vrouw van Gilead baarde; maar zijn bijvrouw, de Syrische, baarde Machir, de vader van Gilead.", "Ps 10:16": "De HEERE is Koning eeuwig en altijd; de heidenen zijn vergaan uit Zijn land.", "Deut 19:18": "En de rechters zullen zorgvuldig onderzoek doen; en zie, de getuige is een valse getuige, hij heeft een valse verklaring afgelegd tegen zijn broeder;", "Matt 9:36": "En Hij zag de menigten, en werd innerlijk met ontferming bewogen over hen, omdat zij vermoeid en verstrooid waren, zoals schapen die geen herder hebben.", "2 Tim 1:14": "Bewaar het goede pand, dat u toevertrouwd is, door de Heilige Geest, Die in ons woont.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Num 27:1-7": "Toen kwamen de dochters van Zelafead naar voren, de zoon van Hefer, de zoon van Gilead, de zoon van Machir, de zoon van Manasse, onder de geslachten van Manasse, de zoon van Jozef (en dit zijn de namen van zijn dochters: Machla, Noa, en Hogla, en Milka, en Tirza); En zij gingen staan voor Mozes, en voor Eleazar, de priester, en voor de leiders, en de hele vergadering, bij de deur van de tent van de samenkomst, en zeiden: Onze vader is gestorven in de woestijn, en hij is niet geweest onder hen die zich tegen de HEERE verzameld hebben, in de groep van Korach; maar hij is in zijn eigen zonde gestorven, en had geen zonen.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Ps 31:4": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "Ezech 37:14": "En Ik zal Mijn Geest in u geven, en u zult leven, en Ik zal u in uw land zetten; en u zult weten dat Ik, de HEERE, dit gesproken en gedaan heb, spreekt de HEERE.", "Job 34:24": "Hij vermorzelt de geweldigen, dat men het niet doorzoeken kan, en stelt anderen in hun plaats.", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Ruth 2:12": "De HEERE vergeldt u uw daad, en uw loon zij volkomen, vanwege de HEERE, de God van Israël, onder Wiens vleugels u gekomen bent om toevlucht te nemen!", "1 Tim 2:2": "voor koningen en allen die in hoge positie zijn, opdat wij een rustig en stil leven kunnen leiden in alle godsvrucht en eerbaarheid.", "Hand 19:2-6": "zei hij tegen hen: Hebt u de Heilige Geest ontvangen, toen u tot geloof kwam? En zij zeiden tegen hem: Wij hebben zelfs niet gehoord of er een Heilige Geest is. En hij zei tegen hen: Waarin bent u dan gedoopt? En zij zeiden: In de doop van Johannes. Maar Paulus zei: Johannes heeft wel gedoopt met de doop van bekering, en zei tegen het volk dat zij geloven zouden in Hem Die na hem kwam, dat is, in Christus Jezus.", "Gen 25:6": "Maar aan de zonen van de bijvrouwen die Abraham had, gaf Abraham geschenken; en zond hen weg van zijn zoon Izak, terwijl hij nog leefde, oostwaarts naar het land van het Oosten.", "Num 7:84": "Dit was de inwijding van het altaar door de leiders van Israël, op de dag dat het gezalfd werd: twaalf zilveren schotels, twaalf zilveren sprenkelschalen, twaalf gouden reukschalen.", "Jes 6:8": "Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Num 20:8-13": "Neem die staf, en verzamel de vergadering, u en Aäron, uw broeder, en spreek u tot de steenrots voor hun ogen, dan zal zij hun water geven; zo zult u hun water laten voortkomen uit de steenrots, en u zult de vergadering en haar beesten laten drinken. Toen nam Mozes de staf van voor het aangezicht van de HEERE, zoals Hij hem geboden had. En Mozes en Aäron verzamelden de gemeente voor de steenrots, en hij zei tot hen: Hoor toch, u opstandigen, zullen wij water voor u uit deze steenrots laten voortkomen?", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Joh 16:7-14": "Doch Ik zeg u de waarheid: het is nuttig voor u dat Ik wegga; want als Ik niet wegga, zal de Trooster niet tot u komen; maar als Ik heenga, zal Ik Hem tot u zenden. En als Hij gekomen is, zal Hij de wereld overtuigen van zonde, en van gerechtigheid, en van oordeel: Van zonde, omdat zij in Mij niet geloven;", "Ps 86:11": "Leer mij, HEERE! Uw weg; ik zal in Uw waarheid wandelen; verenig mijn hart tot de vreze van uw Naam.", "2 Kor 3:18": "En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Ezra 2:63": "En Hattirsatha zei tegen hen dat zij van de heiligste dingen niet mochten eten, totdat er een priester stond met Urim en met Tummim.", "Ps 136:3": "Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Ex 23:6": "U zult het recht van uw arme niet buigen in zijn geschil.", "Deut 32:49": "Klim op de berg Abarim (dit is de berg Nebo, die in het land van Moab is, tegenover Jericho), en zie het land Kanaän, dat Ik de kinderen van Israël tot een bezitting geven zal;", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Matt 4:1": "Toen werd Jezus door de Geest weggeleid naar de woestijn, om beproefd te worden door de duivel.", "Jer 32:27": "Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?", "Ef 6:17": "En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.", "Pred 11:5": "Zoals u niet weet wat de weg van de wind is, of hoe de beenderen zijn in de buik van een zwangere vrouw, zo weet u het werk van God niet, Die het alles maakt.", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Lev 24:22": "Eén recht zult u hebben; zo zal het gelden voor de vreemdeling als voor de geboren Israëliet; want Ik ben de HEERE, uw God!", "Num 27:5-11": "En Mozes bracht hun rechtszaak voor de HEERE. En de HEERE zei tegen Mozes: De dochters van Zelafead spreken terecht; u zult hun zeker een bezitting geven als erfenis, onder de broers van hun vader; en u zult de erfenis van hun vader op hen laten overgaan.", "Gen 1:2": "De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren.", "Hand 20:28-31": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed. Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen. En uit uzelf zullen mannen opstaan, die verkeerde dingen spreken, om de discipelen achter zich aan te trekken.", "Ps 145:11-13": "Caph. Zij zullen de heerlijkheid van Uw Koninkrijk vermelden, en Uw macht zullen zij uitspreken. Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk. Mem. Uw Koninkrijk is een Koninkrijk van alle eeuwen, en Uw heerschappij is in alle geslacht en geslacht.", "1 Kron 29:23": "Zo zat Salomo op de troon van de HEERE, als koning in de plaats van zijn vader David, en hij was voorspoedig; en heel Israël luisterde naar hem.", "1 Tim 4:1-16": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen, door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid; die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "1 Kon 8:45": "hoor dan in de hemel hun gebed en hun smeking, en voer hun recht uit.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Ruth 4:3-6": "Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht. En ik heb gezegd: Ik zal het voor uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen. Maar Boaz zei: Op de dag dat u het land aanvaardt van de hand van Naomi, zult u het ook aanvaarden van Ruth, de Moabitische, de vrouw van de gestorvene, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel.", "Ps 59:14": "Verteer hen in grimmigheid; verteer hen, zodat zij er niet meer zijn, en laat hen weten dat God Heerser is in Jakob, ja, tot aan de einden van de aarde. Sela.", "Matt 15:24": "Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Fil 2:1": "Als er dan enige vertroosting is in Christus, als er enige troost van de liefde is, als er enige gemeenschap van de Geest is, als er enige innerlijke bewegingen en ontfermingen zijn;", "Num 7:54": "Op de achtste dag offerde de leider van de kinderen van Manasse, Gamaliël, de zoon van Pedazur.", "Ex 18:16": "Wanneer zij een zaak hebben, komt het tot mij, zodat ik oordeel tussen de man en zijn naaste; en dat ik hun de instellingen van God en Zijn wetten bekendmaak.", "Tit 3:1": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn;", "Jes 43:1": "Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij.", "Rom 13:1-3": "Ieder mens moet onderworpen zijn aan de machten die over hem gesteld zijn; want er is geen macht dan van God, en de machten die er zijn, zijn door God aangesteld. Zodat hij die zich tegen de macht stelt, de instelling van God weerstaat; en zij die weerstaan, zullen over zichzelf een oordeel halen. Want de leiders zijn niet tot een schrik voor de goede werken, maar voor de kwade. Wilt u nu de macht niet vrezen? Doe het goede, en u zult lof van haar hebben;", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "1 Sam 14:37-41": "Toen vroeg Saul God: Zal ik de Filistijnen achterna trekken? Zult U ze in de hand van Israël overgeven? Maar Hij antwoordde hem die dag niet. Toen zei Saul: Kom hierheen, alle hoofden van het volk, en onderzoek en kijk waarin deze zonde vandaag gebeurd is. Want zo waarachtig als de HEERE leeft, Die Israël verlost: al was het bij mijn zoon Jonathan, dan zal hij zeker sterven; en niemand uit heel het volk antwoordde hem.", "Hand 16:7": "En toen zij bij Mysië gekomen waren, probeerden zij naar Bithynië te reizen; maar de Geest liet het hun niet toe.", "Ef 4:6": "Eén God en Vader van allen, Die boven allen is, en door allen, en in u allen.", "Ps 139:24": "En zie, of er bij mij een schadelijke weg is; en leid mij op de eeuwige weg.", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Jes 42:1": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen.", "Joz 17:1": "De stam van Manasse had ook een lot, omdat hij de eerstgeborene van Jozef was: te weten Machir, de eerstgeborene van Manasse, de vader van Gilead; omdat hij een krijgsman was, had hij Gilead en Bazan.", "2 Kron 1:10": "Geef mij nu wijsheid en kennis, zodat ik voor het aangezicht van dit volk uitga en inga; want wie zou dit Uw grote volk kunnen richten?", "Gen 24:36": "En Sara, de vrouw van mijn heer, heeft mijn heer een zoon gebaard, nadat zij oud geworden was; en hij heeft hem gegeven alles wat hij heeft.", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Joz 17:3-7": "Zelafead nu, de zoon van Hefer, de zoon van Gilead, de zoon van Machir, de zoon van Manasse, had geen zonen, maar dochters; en dit zijn de namen van zijn dochters: Machla en Noa, Hogla, Milka en Tirza. Dezen dan traden toe voor Eleazar, de priester, en voor Jozua, de zoon van Nun, en voor de leiders, en zeiden: De HEERE heeft Mozes geboden dat men ons een erfdeel geven zou te midden van onze broeders. Daarom gaf hij haar, naar het woord van de HEERE, een erfdeel te midden van de broeders van hun vader. En aan Manasse vielen tien snoeren toe, behalve het land Gilead en Bazan, dat aan de overkant van de Jordaan is.", "Jer 3:15": "En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand.", "Pred 8:2-4": "Ik zeg: let op de mond van de koning; maar houd rekening met de eed van God. Haast u niet om van zijn aangezicht weg te gaan; blijf niet staan bij een kwade zaak; want al wat hem lust, doet hij. Waar het woord van de koning is, daar is macht; en wie zal tegen hem zeggen: Wat doet u?", "Joz 17:14": "Toen spraken de kinderen van Jozef tot Jozua en zeiden: Waarom hebt u ons als erfdeel maar één lot en één snoer gegeven, terwijl wij toch een groot volk zijn, aangezien de HEERE ons tot nu toe zo gezegend heeft?", "Ezra 7:26": "En ieder die de wet van uw God en de wet van de koning niet zal doen, over hem moet spoedig recht gedaan worden, hetzij ter dood, of tot verbanning, of tot boete van goederen, of tot gevangenschap.", "Num 31:13": "Maar Mozes en Eleazar, de priester, en alle leiders van de vergadering, gingen naar buiten, hun tegemoet, tot buiten voor het leger.", "Ps 119:125": "Ik ben Uw knecht, maak mij verstandig, en ik zal Uw getuigenissen kennen.", "Ps 119:33": "He. HEERE! leer mij de weg van Uw inzettingen, en ik zal hem houden tot het einde toe.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "1 Kon 8:36": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt.", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Ps 47:9": "God regeert over de heidenen; God zit op de troon van Zijn heiligheid.", "Num 1:4-16": "En met u zullen er zijn van elke stam een man, die hoofd is over het huis van zijn vaderen. Dit zijn nu de namen van de mannen die bij u zullen staan: van Ruben, Elizur, de zoon van Sedeur. Van Simeon, Selumiël, de zoon van Zurisaddai.", "Mark 6:34": "En Jezus, naar buiten gaand, zag een grote menigte, en werd innerlijk met ontferming bewogen over hen; want zij waren als schapen die geen herder hebben; en Hij begon hun veel dingen te onderwijzen.", "1 Kor 1:3": "Genade zij u en vrede van God onze Vader, en van de Heere Jezus Christus.", "Luk 24:49": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.", "Rom 8:1-27": "Er is dan nu geen veroordeling voor hen die in Christus Jezus zijn, die niet naar het vlees wandelen, maar naar de Geest. Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood. Want wat voor de wet onmogelijk was, omdat zij door het vlees krachteloos was, dat heeft God gedaan: Hij heeft Zijn eigen Zoon gezonden in de gelijkenis van het zondige vlees, en dat voor de zonde, en Hij heeft de zonde veroordeeld in het vlees.", "Rom 1:4": "Die met kracht bewezen is de Zoon van God te zijn, naar de Geest van de heiligmaking, uit de opstanding van de doden), namelijk Jezus Christus, onze Heere:", "Ps 95:6": "Komt, laat ons aanbidden en neerbukken; laat ons knielen voor de HEERE, Die ons gemaakt heeft.", "1 Sam 12:23": "Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.", "Kol 1:10": "opdat u mag wandelen op een manier die de Heere waardig is, tot alle behagelijkheid, terwijl u in alle goede werken vrucht draagt en meer wordt in de kennis van God;", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Jes 51:13": "En u vergeet de HEERE, Die u gemaakt heeft, Die de hemelen heeft uitgebreid, en de aarde gegrond heeft, en u vreest voortdurend de hele dag, vanwege de grimmigheid van de benauwer, wanneer hij zich bereidt om te verderven? Waar is dan de grimmigheid van de benauwer?", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Ef 2:22": "op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.", "Rom 15:30": "En ik bid u, broeders, door onze Heere Jezus Christus, en door de liefde van de Geest, dat u met mij strijdt in de gebeden tot God voor mij;", "Luk 10:2-11": "Hij zei dan tegen hen: De oogst is wel groot, maar de arbeiders zijn weinige; bid daarom de Heere van de oogst, dat Hij arbeiders in Zijn oogst uitstuurt. Ga heen; zie, Ik zend u als lammeren te midden van de wolven. Neem geen buidel mee, geen reistas, geen schoenen; en groet niemand onderweg.", "Ps 75:7": "Want het verhogen komt niet uit het oosten, noch uit het westen, noch uit de woestijn;", "Kol 2:2": "Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Deut 10:14": "Zie, van de HEERE, van uw God, is de hemel, en de hemel der hemelen, de aarde, en al wat daarin is.", "Gal 6:16": "En zovelen als er naar deze regel zullen wandelen, over hen zij vrede en barmhartigheid, en over het Israël van God.", "Deut 33:8": "En van Levi zei hij: Uw Tummim en Uw Urim zijn bij de man, Uw gunstgenoot, die Gij beproefd hebt in Massa, met wie Gij getwist hebt aan de wateren van Meriba.", "Hebr 3:3": "Want Deze is zoveel meer heerlijkheid waard geacht dan Mozes, zoals degene die het huis gebouwd heeft, meer eer heeft dan het huis.", "2 Tess 3:16": "De Heere nu van de vrede Zelf geeft u vrede te allen tijde, op allerlei wijze. De Heere zij met u allen.", "Ezra 10:8": "En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Ezech 34:23": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn.", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "Num 26:9": "En de zonen van Eliab waren Nemuël, en Dathan, en Abiram; deze Dathan en Abiram waren de geroepenen van de vergadering, die geschil maakten tegen Mozes en tegen Aäron, in de groep van Korach, toen zij geschil maakten tegen de HEERE.", "Ps 119:169": "Thau. O HEERE! laat mijn geschrei voor Uw aanschijn genaken, maak mij verstandig naar Uw woord.", "Jer 22:1-3": "Zo zegt de HEERE: Ga naar het huis van de koning van Juda, en spreek daar dit woord. En zeg: Hoor het woord van de HEERE, koning van Juda, u die zit op de troon van David, u, en uw dienaren, en uw volk, die door deze poorten binnengaan! Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "Deut 31:3": "De HEERE, uw God, Die zal voor u overtrekken; Die zal deze volken van voor u wegvagen, zodat u hen erfelijk bezit. Jozua zal voor u overtrekken, zoals de HEERE gesproken heeft.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "Ps 36:11": "Strek Uw goedertierenheid uit over degenen, die U kennen, en Uw gerechtigheid over de oprechten van hart.", "Joh 6:63": "De Geest is het Die levend maakt; het vlees heeft geen nut. De woorden die Ik tot u spreek, zijn geest en zijn leven.", "Num 13:16": "Dit zijn de namen van de mannen, die Mozes zond om dat land te verspieden; en Mozes noemde Hosea, de zoon van Nun, Jozua.", "Kol 1:8": "die ons ook uw liefde in de Geest verklaard heeft.", "Joz 1:7": "Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Dan 4:25": "Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil.", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "Ps 122:7": "Vrede zij binnen uw vesting, welvaart in uw paleizen.", "Gal 5:17": "Want het vlees begeert tegen de Geest, en de Geest tegen het vlees; en die staan tegenover elkaar, zodat u niet doet wat u zou willen.", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Joz 15:1": "Het lot voor de stam van de kinderen van Juda, naar hun huisgezinnen, was: aan het gebied van Edom, de woestijn Zin, zuidwaarts, was het uiterste tegen het zuiden;", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Dan 5:23": "Maar u hebt uzelf verheven tegen de Heere van de hemel, en men heeft de vaten van Zijn huis voor u gebracht, en u, en uw leiders, uw vrouwen, en uw bijvrouwen hebben daaruit wijn gedronken, en de goden van zilver en goud, koper, ijzer, hout en steen, die niet zien, niet horen, en niet weten, hebt u geprezen; maar die God, in Wiens hand uw adem is, en aan Wie al uw wegen toebehoren, hebt u niet verheerlijkt.", "Gal 3:3": "Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "1 Tess 1:6": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest;", "Ps 149:2": "Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning.", "Ezech 3:4": "En Hij zei tot mij: Mensenkind, ga heen, kom tot het huis Israëls, en spreek tot hen met Mijn woorden.", "Gal 5:23": "Tegen zulke mensen is de wet niet.", "Hand 19:6": "En toen Paulus hun de handen opgelegd had, kwam de Heilige Geest op hen; en zij spraken met vreemde talen, en profeteerden.", "Jer 32:6-8": "Jeremia dan zei: Het woord van de HEERE is tot mij gekomen, en het zei: Zie, Hanameel, de zoon van Sallum, uw oom, zal naar u toe komen en zeggen: Koop voor uzelf mijn veld dat bij Anathoth is, want u hebt het recht van lossing, om het te kopen. Zo kwam Hanameel, de zoon van mijn oom, naar het woord van de HEERE, tot mij, in het voorhof van de bewaking, en zei tegen mij: Koop toch mijn veld, dat bij Anathoth is, dat in het land van Benjamin is; want u hebt het erfrecht, en u hebt de lossing, koop het voor uzelf. Toen merkte ik dat het woord van de HEERE was.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Tit 3:6": "Die Hij over ons rijkelijk heeft uitgegoten door Jezus Christus, onze Zaligmaker;", "Ps 119:124": "Doe bij Uw knecht naar Uw goedertierenheid, en leer mij Uw inzettingen.", "Num 32:1-5": "De nakomelingen van Ruben en de nakomelingen van Gad hadden veel vee, heel veel; en zij bekeken het land Jaezer en het land Gilead, en zie, deze plaats was een plaats geschikt voor vee. Toen kwamen de kinderen van Gad en de kinderen van Ruben en spraken tot Mozes, tot Eleazar de priester, en tot de leiders van de vergadering, en zeiden: Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon, en Eleale, en Schebam, en Nebo, en Behon;", "Hand 13:2": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.", "Gal 3:14": "Opdat de zegening van Abraham tot de heidenen komen zou in Christus Jezus, en opdat wij de belofte van de Geest zouden verkrijgen door het geloof.", "Num 17:6": "Mozes dan sprak tot de kinderen van Israël, en al hun leiders gaven hem een staf, voor elke leider één staf, naar het huis van hun vaderen, twaalf staven; Aärons staf was ook onder hun staven.", "1 Petr 4:14": "Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.", "Num 26:32": "En van Semida het geslacht der Semidaieten; en van Hefer het geslacht der Heferieten.", "Ps 93:2": "Van toen af is Uw troon bevestigd, U bent van eeuwigheid af.", "1 Tim 6:13-17": "Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd, dat u dit gebod houdt, onbevlekt en onberispelijk, tot de verschijning van onze Heere Jezus Christus; die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Ef 3:5": "die in andere eeuwen aan de kinderen van de mensen niet bekendgemaakt is, zoals zij nu geopenbaard is aan Zijn heilige apostelen en profeten, door de Geest;", "Ps 50:10-12": "Want al het gedierte van het woud is Mijn, de dieren op duizend bergen. Ik ken al het gevogelte van de bergen, en het wild van het veld is bij Mij. Zo Mij hongerde, Ik zou het u niet zeggen; want Mijn is de wereld en haar volheid.", "Hand 23:5": "En Paulus zei: Ik wist niet, broeders, dat hij de hogepriester was; want er is geschreven: De leider van uw volk zult u niet vervloeken.", "Deut 32:18": "De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Jes 40:22": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen;", "1 Kron 29:12": "En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "Ezech 34:11-16": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Ezech 11:13": "Het gebeurde nu, toen ik profeteerde, dat Pelatja, de zoon van Benaja, stierf. Toen viel ik neer op mijn gezicht, en riep met luide stem, en zei: Ach, Heere HEERE! Zult U een volledig einde maken met het overblijfsel van Israël?", "Rom 9:1": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest),", "Ps 119:144": "De gerechtigheid van Uw getuigenissen is in de eeuwigheid; doe mij ze verstaan, zo zal ik leven.", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "Deut 16:18-20": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen
