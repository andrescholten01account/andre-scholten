 de samenkomst, en zeiden:","3":"Onze vader is gestorven in de woestijn, en hij is niet geweest onder hen die zich tegen de HEERE verzameld hebben, in de groep van Korach; maar hij is in zijn eigen zonde gestorven, en had geen zonen.","4":"Waarom zou de naam van onze vader verdwijnen uit zijn geslacht, omdat hij geen zoon heeft? Geef ons een bezitting onder de broers van onze vader.","5":"En Mozes bracht hun rechtszaak voor de HEERE.","6":"En de HEERE zei tegen Mozes:","7":"De dochters van Zelafead spreken terecht; u zult hun zeker een bezitting geven als erfenis, onder de broers van hun vader; en u zult de erfenis van hun vader op hen laten overgaan.","8":"En tegen de kinderen van Israël zult u zeggen: Wanneer iemand sterft, en geen zoon heeft, dan zult u zijn erfenis op zijn dochter laten overgaan.","9":"En als hij geen dochter heeft, dan zult u zijn erfenis aan zijn broers geven.","10":"Als hij nu geen broers heeft, dan zult u zijn erfenis aan de broers van zijn vader geven.","11":"Als zijn vader ook geen broers heeft, dan zult u zijn erfenis geven aan zijn naaste bloedverwant, die hem het naast van zijn geslacht is, zodat hij het erft. Dit zal voor de kinderen van Israël een wettelijk voorschrift zijn, zoals de HEERE Mozes geboden heeft.","12":"Daarna zei de HEERE tegen Mozes: Klim op deze berg Abarim, en zie dat land, dat Ik de kinderen van Israël gegeven heb.","13":"Wanneer u dat gezien zult hebben, dan zult u met uw volk verenigd worden, u ook, zoals uw broer Aäron daarmee verenigd is;","14":"Omdat u tegen Mijn bevel opstandig bent geweest in de woestijn Zin, bij de twist van de vergadering, toen u Mij bij het water voor hun ogen had moeten heiligen. Dat is het water van Meriba, bij Kades, in de woestijn Zin.","15":"Toen sprak Mozes tot de HEERE, en zei:","16":"Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,","17":"Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.","18":"Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem;","19":"En stel hem voor Eleazar, de priester, en voor de hele vergadering; en geef hem opdracht voor hun ogen;","20":"En leg iets van uw waardigheid op hem, opdat zij luisteren, namelijk de hele vergadering van de kinderen van Israël.","21":"En hij zal voor Eleazar, de priester, staan, die voor hem om raad zal vragen, volgens de wijze van Urim, voor de HEERE; naar zijn woord zullen zij uitgaan, en naar zijn woord zullen zij ingaan, hij, en alle kinderen van Israël met hem, en de hele vergadering.","22":"En Mozes deed zoals de HEERE hem geboden had; want hij nam Jozua, en stelde hem voor Eleazar, de priester, en voor de hele vergadering.","23":"En hij legde zijn handen op hem, en gaf hem opdracht; zoals de HEERE door de hand van Mozes gesproken had."},"SV":{"1":"Toen naderden de dochteren van Zelafead, den zoon van Hefer, den zoon van Gilead, den zoon van Machir, den zoon van Manasse, onder de geslachten van Manasse, den zoon van Jozef (en dit zijn de namen zijner dochteren: Machla, Noa, en Hogla, en Milka, en Tirza);","2":"En zij stonden voor het aangezicht van Mozes, en voor het aangezicht van Eleazar, den priester, en voor het aangezicht van de oversten, en van de ganse vergadering, aan de deur van de tent der samenkomst, zeggende:","3":"Onze vader is gestorven in de woestijn, en hij is niet geweest in het midden der vergadering dergenen, die zich tegen den HEERE vergaderd hebben in de vergadering van Korach; maar hij is in zijn zonde gestorven, en had geen zonen.","4":"Waarom zou de naam onzes vaders uit het midden van zijn geslacht weggenomen worden, omdat hij geen zoon heeft? Geef ons een bezitting in het midden der broederen van onzen vader.","5":"En Mozes bracht haar rechtzaak voor het aangezicht des HEEREN.","6":"En de HEERE sprak tot Mozes, zeggende:","7":"De dochteren van Zelafead spreken recht; gij zult haar ganselijk geven de bezitting ener erfenis, in het midden van de broederen haars vaders; en gij zult de erfenis haars vaders op haar doen komen.","8":"En tot de kinderen Israëls zult gij spreken, zeggende: Wanneer iemand sterft, en geen zoon heeft, zo zult gij zijn erfenis op zijn dochter doen komen.","9":"En indien hij geen dochter heeft, zo zult gij zijn erfenis aan zijn broederen geven.","10":"Indien hij nu geen broederen heeft, zo zult gij zijn erfenis aan de broederen zijns vaders geven.","11":"Indien ook zijn vader geen broeders heeft, zo zult gij zijn erfenis geven aan zijn naastbestaande, die hem de naaste van zijn geslacht is, dat hij het erfelijk bezitte. Dit zal den kinderen Israëls tot een inzetting des rechts zijn, gelijk als de HEERE Mozes geboden heeft.","12":"Daarna zeide de HEERE tot Mozes: Klim op dezen berg Abarim, en zie dat land, hetwelk Ik den kinderen Israëls gegeven heb.","13":"Wanneer gij dat gezien zult hebben, dan zult gij tot uw volken verzameld worden, gij ook, gelijk als uw broeder Aäron verzameld geworden is;","14":"Naardien gijlieden Mijn mond wederspannig zijt geweest in de woestijn Zin, in de twisting der vergadering, om Mij aan de wateren voor hun ogen te heiligen. Dat zijn de wateren van Meriba, van Kades, in de woestijn Zin.","15":"Toen sprak Mozes tot den HEERE, zeggende:","16":"Dat de HEERE, de God der geesten van alle vlees, een man stelle over deze vergadering.","17":"Die voor hun aangezicht uitga, en die voor hun aangezicht inga, en die hen uitleide, en die hen inleide; opdat de vergadering des HEEREN niet zij als schapen, die geen herder hebben.","18":"Toen zeide de HEERE tot Mozes: Neem tot u Jozua, den zoon van Nun, een man, in wien de Geest is; en leg uw hand op hem;","19":"En stel hem voor het aangezicht van Eleazar, den priester, en voor het aangezicht der ganse vergadering; en geef hem bevel voor hun ogen;","20":"En leg op hem van uw heerlijkheid, opdat zij horen, *te* *weten* de ganse vergadering der kinderen Israëls.","21":"En hij zal voor het aangezicht van Eleazar, den priester, staan, die voor hem raad vragen zal, naar de wijze van Urim, voor het aangezicht des HEEREN; naar zijn mond zullen zij uitgaan, en naar zijn mond zullen zij ingaan, hij, en al de kinderen Israëls met hem, en de ganse vergadering.","22":"En Mozes deed, gelijk als de HEERE hem geboden had; want hij nam Jozua, en stelde hem voor het aangezicht van Eleazar, den priester, en voor het aangezicht der ganse vergadering.","23":"En hij leide zijn handen op hem, en gaf hem bevel; gelijk als de HEERE door den dienst van Mozes gesproken had."},"KJV":{"1":"Then came the daughters of Zelophehad, the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh, of the families of Manasseh the son of Joseph: and these *are* the names of his daughters; Mahlah, Noah, and Hoglah, and Milcah, and Tirzah.","2":"And they stood before Moses, and before Eleazar the priest, and before the princes and all the congregation, *by* the door of the tabernacle of the congregation, saying,","3":"Our father died in the wilderness, and he was not in the company of them that gathered themselves together against the LORD in the company of Korah; but died in his own sin, and had no sons.","4":"Why should the name of our father be done away from among his family, because he hath no son? Give unto us *therefore* a possession among the brethren of our father.","5":"And Moses brought their cause before the LORD.","6":"And the LORD spake unto Moses, saying,","7":"The daughters of Zelophehad speak right: thou shalt surely give them a possession of an inheritance among their father's brethren; and thou shalt cause the inheritance of their father to pass","8":"And thou shalt speak unto the children of Israel, saying, If a man die, and have no son, then ye shall cause his inheritance to pass unto his daughter.","9":"And if he have no daughter, then ye shall give his inheritance unto his brethren.","10":"And if he have no brethren, then ye shall give his inheritance unto his father's brethren.","11":"And if his father have no brethren, then ye shall give his inheritance unto his kinsman that is next to him of his family, and he shall possess it: and it shall be unto the children of Israel a statute of judgment, as the LORD commanded Moses.","12":"And the LORD said unto Moses, Get thee up into this mount Abarim, and see the land which I have given unto the children of Israel.","13":"And when thou hast seen it, thou also shalt be gathered unto thy people, as Aaron thy brother was gathered.","14":"For ye rebelled against my commandment in the desert of Zin, in the strife of the congregation, to sanctify me at the water before their eyes: that *is* the water of Meribah in Kadesh in the wilderness of Zin.","15":"And Moses spake unto the LORD, saying,","16":"Let the LORD, the God of the spirits of all flesh, set a man over the congregation,","17":"Which may go out before them, and which may go in before them, and which may lead them out, and which may bring them in; that the congregation of the LORD be not as sheep which have no shepherd.","18":"And the LORD said unto Moses, Take thee Joshua the son of Nun, a man in whom *is* the spirit, and lay thine hand","19":"And set him before Eleazar the priest, and before all the congregation; and give him a charge in their sight.","20":"And thou shalt put *some* of thine honour upon him, that all the congregation of the children of Israel may be obedient.","21":"And he shall stand before Eleazar the priest, who shall ask *counsel* for him after the judgment of Urim before the LORD: at his word shall they go out, and at his word they shall come in, *both* he, and all the children of Israel with him, even all the congregation.","22":"And Moses did as the LORD commanded him: and he took Joshua, and set him before Eleazar the priest, and before all the congregation:","23":"And he laid his hands upon him, and gave him a charge, as the LORD commanded by the hand of Moses."}},"tsk":{"1":[{"kopje":"Zelafead","refs":["Num 26:33","Num 36:1-12","Joz 17:3-6","1 Kron 7:15","Gal 3:28"]}],"3":[{"kopje":"is gestorven in de","refs":["Num 14:35","Num 26:64","Num 26:65"]},{"kopje":"in de groep","refs":["Num 16:1-3","Num 16:19","Num 16:32-35","Num 16:49","Num 26:9","Num 26:10"]},{"kopje":"in zijn eigen zonde gestorven","refs":["Ezech 18:4","Joh 8:21","Joh 8:24","Rom 5:12","Rom 5:21","Rom 6:23"]}],"4":[{"kopje":"Waarom","refs":["Ex 32:11","Ps 109:13","Spr 13:9"]},{"kopje":"Geef","refs":["Joz 17:4"]}],"11":[{"kopje":"bloedverwant","refs":["Lev 25:25","Lev 25:49","Ruth 4:3-6","Jer 32:8"]},{"kopje":"een wettelijk voorschrift","refs":["Num 35:29","1 Sam 30:25"]}],"12":[{"kopje":"berg","refs":["Num 33:47","Num 33:48","Deut 3:27","Deut 32:49","Deut 34:1-4"]}],"13":[{"kopje":"u ook","refs":["Num 31:2","Gen 25:8","Gen 25:17"]},{"kopje":"zoals uw broer Aäron","refs":["Num 20:24-28","Num 33:38","Deut 10:6","Deut 32:50"]}],"14":[{"kopje":"opstandig bent geweest","refs":["Num 20:8-13","Deut 1:37","Deut 32:51","Deut 32:52","Ps 106:32","Ps 106:33"]},{"kopje":"Meriba","refs":["Num 20:1","Num 20:13","Num 20:24","Ex 17:7"]}],"16":[{"kopje":"de HEERE","refs":["Num 16:22","Job 12:10"]},{"kopje":"de God","refs":["Num 16:22","Hebr 12:9"]},{"kopje":"een man aanstellen","refs":["Deut 31:14","1 Sam 12:13","1 Kon 5:5","Jer 3:15","Jer 23:4","Jer 23:5","Ezech 34:11-16","Ezech 34:23","Ezech 37:24","Matt 9:38","Joh 10:11","Hand 20:28","1 Petr 5:2-4"]}],"17":[{"kopje":"uitgaat","refs":["Deut 31:2","1 Sam 8:20","1 Sam 18:13","2 Sam 5:2","1 Kon 3:7","2 Kron 1:10","Joh 10:3","Joh 10:4","Joh 10:9"]},{"kopje":"als schapen","refs":["1 Kon 22:17","2 Kron 18:16","Ezech 34:5","Zach 10:2","Zach 13:7","Matt 9:36","Matt 10:6","Matt 15:24","Mark 6:34","1 Petr 2:25"]}],"18":[{"kopje":"Neem","refs":["Num 11:28","Num 13:8","Num 13:16","Ex 17:9","Deut 3:28","Deut 31:7","Deut 31:8","Deut 31:23","Deut 34:9"]},{"kopje":"een man","refs":["Num 11:17","Ge -kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H5387\">princes</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> by the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> saying,","3":"Our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and he was not <span class=\"wl wl-kjv\" data-code=\"H8432\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H5712\">company</span> of them that gathered themselves <span class=\"wl wl-kjv\" data-code=\"H3259\">together</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H5712\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H7141\">Korah;</span> but <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> in his own <span class=\"wl wl-kjv\" data-code=\"H2399\">sin,</span> and had no sons.","4":"Why should the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> be done <span class=\"wl wl-kjv\" data-code=\"H1639\">away</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> his <span class=\"wl wl-kjv\" data-code=\"H4940\">family,</span> because he hath no <span class=\"wl wl-kjv\" data-code=\"H1121\">son?</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> unto us therefore a <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> of our father.","5":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> their <span class=\"wl wl-kjv\" data-code=\"H4941\">cause</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD.","6":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","7":"The <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H6765\">Zelophehad</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H3651\">right:</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them a <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> of an <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brethren;</span> and thou shalt cause the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> to pass","8":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> and have no <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> then ye shall cause his <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> to <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> unto his daughter.","9":"And if he have no <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> then ye shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> his <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> unto his brethren.","10":"And if he have no <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> then ye shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> his <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> brethren.","11":"And if his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> have no <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> then ye shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> his <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> unto his <span class=\"wl wl-kjv\" data-code=\"H7607\">kinsman</span> that is <span class=\"wl wl-kjv\" data-code=\"H7138\">next</span> to him of his <span class=\"wl wl-kjv\" data-code=\"H4940\">family,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it: and it shall be unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> a <span class=\"wl wl-kjv\" data-code=\"H2708\">statute</span> of <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Get thee <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into this <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H5682\">Abarim,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","13":"And when thou hast <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> it, thou also shalt be <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> as <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> was gathered.","14":"For ye <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled</span> against my <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">desert</span> of <span class=\"wl wl-kjv\" data-code=\"H6790\">Zin,</span> in the <span class=\"wl wl-kjv\" data-code=\"H4808\">strife</span> of the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> to <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> me at the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> before their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> that is the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of <span class=\"wl wl-kjv\" data-code=\"H4809\">Meribah</span> in <span class=\"wl wl-kjv\" data-code=\"H6946\">Kadesh</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of Zin.","15":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> saying,","16":"Let the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirits</span> of all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> over the congregation,","17":"Which may go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and which may go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and which may lead them <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and which may bring them <span class=\"wl wl-kjv\" data-code=\"H935\">in;</span> that the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be not as <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> which have no shepherd.","18":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> thee <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5126\">Nun,</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in whom is the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> and <span class=\"wl wl-kjv\" data-code=\"H5564\">lay</span> thine hand","19":"And <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation;</span> and give him a <span class=\"wl wl-kjv\" data-code=\"H6680\">charge</span> in their sight.","20":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> some of thine <span class=\"wl wl-kjv\" data-code=\"H1935\">honour</span> upon him, that all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> may be obedient.","21":"And he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> who shall <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> counsel for him after the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> of <span class=\"wl wl-kjv\" data-code=\"H224\">Urim</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> at his <span class=\"wl wl-kjv\" data-code=\"H6310\">word</span> shall they go <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and at his <span class=\"wl wl-kjv\" data-code=\"H6310\">word</span> they shall come <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> both he, and all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with him, even all the congregation.","22":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him: and he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> all the congregation:","23":"And he <span class=\"wl wl-kjv\" data-code=\"H5564\">laid</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> upon him, and gave him a <span class=\"wl wl-kjv\" data-code=\"H6680\">charge,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">commanded</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of Moses."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"geslachten van Manasse,","tekst":"Tot welke, omdat zij er mede toe behoorden, zo verschijnen zij onder dezelve voor Mozes, om het erfdeel van haar vader, die gestorven was, te verzoeken."},{"catchword":"zijner dochteren","tekst":"Namelijk van Zelafead."}],"3":[{"catchword":"niet geweest","tekst":"Dat is, niet gemengd in hun samenrotting, zodat hij met hun boze daad gene gemeenschap heeft gehad."},{"catchword":"vergaderd hebben in de vergadering van Korach;","tekst":"Te weten, door de samenrotting en muiterij, van welke wij lezen boven, Num 16:1-3, enz."},{"catchword":"in zijn zonde gestorven,","tekst":"Hoewel hij niet schuldig was aan de conspiratie van Korach, zo is hij nochtans mede schuldig geweest aan de algemene murmurering des volks, waarom God hun gedreigd had dat zij in de woestijn zouden omkomen. Zie Num 14."}],"4":[{"catchword":"weggenomen worden,","tekst":"Hebreeuws, verminderd."}],"5":[{"catchword":"rechtzaak","tekst":"Hebreeuws, het oordeel, of, gericht; dat is, zaak, different of geschil, hetwelk door de uitspraak van God gewezen moest worden. Want het was nog in twijfel of de dochters, als er geen mannelijke erfgenaam was, zouden mogen delen, dan of, met een bruidsgift uit de erfenis zouden moeten scheiden."},{"catchword":"het aangezicht des HEEREN","tekst":"Dat is, in de tent der samenkomst, waar Mozes de stem des HEEREN van boven het verzoendeksel der ark, uit het midden der twee cherubim, hoorde tot het spreken. Zie Exo 25:22, en boven, Num 7:89. Of versta, dat Mozes door het middel der tekenen urim en thummim, die aan den borstlap des hogepriesters waren, den wil van God vernomen heeft. Vergelijk onder, vs.21."}],"7":[{"catchword":"ganselijk geven","tekst":"Hebreeuws, gevende zult gij haar geven; te weten, het erfgoed dat haar vader zou moeten hebben zo hij leefde."}],"9":[{"catchword":"erfenis aan zijn broederen geven","tekst":"Welverstaande, na het overlijden des mans, die geen dochters heeft. Zo is ook te nemen het einde van vs.10."}],"11":[{"catchword":"zijn geslacht is,","tekst":"Te weten, van zijn vader, van welken de zonen hun benaming hebben."},{"catchword":"des rechts zijn,","tekst":"Dat is, waarnaar de rechters in het gericht over dusdanige zaken zullen moeten oordelen en uitspraak doen."}],"12":[{"catchword":"Abárim,","tekst":"De HEERE wijst hem een berg van het gebergte Abarim. Aan dit gebergte is geweest de een en veertigste en de voorlaatste rustplaats van de kinderen Israëls reizende naar het beloofde land, mitsgaders de berg Nebo, op welken Mozes stierf; Deu 32:49-50, en Deu 34:1, Deu 34:5."}],"13":[{"catchword":"tot uw volken verzameld worden,","tekst":"Zie Gen 15:5, en Gen 25:8."}],"14":[{"catchword":"Zin,","tekst":"Hebreeuws, Tsin"},{"catchword":"heiligen","tekst":"Wij heiligen God als wij van Zijn heiligheid en al Zijn goddelijke deugden en werken recht gevoelen, met eerbied spreken, en met onze werken oorzaak geven, dat Zijn naam geprezen en groot gemaakt wordt; Lev 22:2, alzo boven, Num 20:12; Isa 8:13, en Isa 29:23."},{"catchword":"Meriba,","tekst":"Dat is, der twisting, en worden door aanwijzing der plaatsen onderscheiden van het twistwater te Rafidim, waar zij door ongeloof tegen den HEERE niet gezondigd hadden; Exo 17:7."}],"16":[{"catchword":"de God der geesten van alle vlees,","tekst":"Dat is, die de zielen aller mensen geschapen heeft en daarin de gaven uitstort, zowel der natuur als der genade, die hun nodig zijn tot uitvoering hunner beroeping. Zie boven, Num 16:22."}],"17":[{"catchword":"voor hun aangezicht uitga,","tekst":"Dat is, die de werken zijner beroeping in huis en buitenshuis in alle gelegenheid trouwelijk waarneme en kloekelijk uitvoere. Zie Deu 28:6, en Deu 31:2 met de aantekeningen."},{"catchword":"uitleide,","tekst":"Dat is, die de gemeente door zijn autoriteit gebiede en geleide, en trouwelijk regere, en voorsta, ten einde ieder, naar zijn beroeping, zijn behoorlijken plicht doe, en zo in het geestelijke als in het lichamelijke welvare."}],"18":[{"catchword":"de Geest is;","tekst":"Te weten, die hem nodig is in zulk een zware regering, als de Geest van de vreze des HEEREN, der wijsheid, der sterkte, der gerechtigheid, des gedulds, der matigheid; welke gaven van mijn Geest voortkomen."},{"catchword":"leg uw hand op hem;","tekst":"Door deze ceremonie moest hij Gode toegeheiligd en overgegeven zijn, om zijn ambt getrouwelijk te bedienen, en daartoe de nodige gaven ontvangen. Zie van het onderscheiden gebruik dezer ceremonie Gen 48:14; Lev 1:4; Num 8:10."}],"19":[{"catchword":"bevel voor hun ogen;","tekst":"Te weten, van hetgeen hij in de uitvoering van zijn ambt doen of laten moet."}],"20":[{"catchword":"leg op hem","tekst":"Vergelijk boven, Num 11:17, en de aantekeningen er op."},{"catchword":"heerlijkheid,","tekst":"Versta hierdoor, niet alleen den uiterlijken luister der hoogheid en des aanziens, maar inzonderheid de inwendige versiering en waardigheid van het ambt."},{"catchword":"horen,","tekst":"Dat is, hem gehoorzaam zijn."}],"21":[{"catchword":"van Urim,","tekst":"Zie hiervan Exo 28:30; Lev 8:8. Hierdoor werd God over twijfelachtige en zeer gewichtige zaken extra-ordinair raad gevraagd. Zie boven de aantekeningen vs.5; maar anders moesten ordinairlijk de oversten zich houden aan het geschreven woord en den geopenbaarden wil van God, Deu 17:19; Jos 1:7-8."},{"catchword":"naar zijn mond","tekst":"Dat is, naar het bevel en voorschrift des HEEREN zullen zij ook in hun beroeping hun schuldigen plicht doen. Vergelijk boven de aantekeningen op vs.17."}],"23":[{"catchword":"hij legde zijn handen op hem,","tekst":"Zie boven, vs.18."},{"catchword":"den dienst van Mozes","tekst":"Hebreeuws, door de hand."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then drew near the daughters of Zelaphead, the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh, among the families of Manasseh, [To whom appertaining, they appear among them, before Moseh for to sue for their deceased fathers inheritance] the son of Joseh: 9and these are the names of his [viz Zelapheads daughters] Machla, Noa, and Hogla, and Milka, and Tirza.)"}],"2":[{"catchword":null,"tekst":"And they stood before the face of Moseh, and before the face of Eleazar the priest, and before the face of the chief (Rulers) and of all the Congregation, at the door of the Tent of the Congregation, saying,"}],"3":[{"catchword":null,"tekst":"Our father died in the wilderness, and he hath not been in the midst of the Congregation of those which gathered themselves against the LORD, in the congregation of Korah: [i.e. they were not mixt with them, nor had any hand in, or communion with their evil enterprise and doings, in that mutiny and insurrection, described ab.chap.16.1.2, 3,&c i.e. but ne died in his (own) sin, [though he was not guilty of partaking in the conspiracy of Korah, yet he] people, for which God had threatened them, they should all die and perish in the wilderness: see Numbers 14.] and had no sons."}],"4":[{"catchword":null,"tekst":"Why should our fathers name be taken away [Hebr. lessened] out of the midst of his family, because he hath no son? give us a possession in the midst of the brethren of our father."}],"5":[{"catchword":null,"tekst":"And Moseh brought their case [Heb. the judgement i.e. their case, plea, business, being to be brought before, and determined by Gods own sentence, it being then a doubtful matter yet, whether daughters in case of the male-line failing, might be admitted to inherit, or, by onely receiving a dowry quit the inheritance to others] before the face of the LORD. [i.e. in the tent of the congregation where Moses heard the voice of the LORD speaking to him from above the Expiation-cover, between the Cherubims, see Exo 25:22. and Num 7:89. or else it may be, that Moses understood the mind and will of God in such like cases, by certain signs and tokens of the Urim and Thummim, that was in the brest-plate of the high-priest; comp.bel.v.21.]"}],"6":[{"catchword":null,"tekst":"And the LORD spake to Moses, saying:"}],"7":[{"catchword":null,"tekst":"The daughters of Zelaphead speak aright; thou shalt wholly give them [Heb. giving give them] the possession of an inheritance in the midst of the brethren of their father; [understand, that part or portion of inheritance, which should have fallen to their fathers share if he had lived] and thou shall cause the inheritance of their father to come upon them."}],"8":[{"catchword":null,"tekst":"And unto the children of Israel thou shalt speak, saying: when any dyeth, and hath no son, then ye shall cause his inheritance to come upon his daughter."}],"9":[{"catchword":null,"tekst":"And if he have no daughter, then shall ye give his inheritance to his brethren. [viz. after the decease of him that hath no son nor daughters; and so also in the latter end of the next verse.]"}],"10":[{"catchword":null,"tekst":"Now if he have no brethren, then shall ye give his inheritance to the brethren of his father."}],"11":[{"catchword":null,"tekst":"If his father also have no brethren, then shall ye give his inheritance to his nearest kindred, to him that is the nearest to his family, [viz. his fathers, from whom the sons are denominated.] that he may hereditarily possess:"}],"12":[{"catchword":null,"tekst":"After that the LORD said to Moseh: ascend on this mount Abarim: [The LORD sheweth him a certain hill from mount Abarim: at this mount there was the one and fourtieth (i.e. the last saving one) resting, or camping-place of the children o // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';

    }).join('');
}
function bijbeluitlegHtml(n) {

    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

    } else {

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
