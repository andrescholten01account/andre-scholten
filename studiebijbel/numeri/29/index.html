or de ram.","4":"En een tiende voor een lam, tot al die zeven lammeren toe;","5":"En een geitenbok tot een zondoffer, om voor u verzoening te doen;","6":"Behalve het brandoffer van de maand, en zijn spijsoffer, en het gedurige brandoffer, en zijn spijsoffer, met hun drankoffers, naar hun wijze, tot een liefelijke reuk, een vuuroffer voor de HEERE.","7":"En op de tiende dag van deze zevende maand zult u een heilige samenkomst hebben, en u zult uw zielen verootmoedigen; geen werk zult u doen;","8":"Maar u zult een brandoffer, tot een liefelijke reuk, aan de HEERE aanbieden: een jonge var, een ram, zeven eenjarige lammeren; volkomen zullen zij voor u zijn.","9":"En hun spijsoffer van meelbloem, met olie gemengd: drie tienden voor de var, twee tienden voor de ene ram;","10":"Voor elk een tiende voor een lam, tot al die zeven lammeren toe;","11":"Een geitenbok tot een zondoffer, behalve het zondoffer van de verzoeningen, en het gedurige brandoffer; en zijn spijsoffer, met hun drankoffers.","12":"Evenzo, op de vijftiende dag van deze zevende maand zult u een heilige samenkomst hebben; geen dienstwerk zult u doen; maar zeven dagen zult u de HEERE een feest vieren.","13":"En u zult een brandoffer als vuuroffer aanbieden, tot een liefelijke reuk voor de HEERE: dertien jonge varren, twee rammen, veertien eenjarige lammeren; zij zullen volkomen zijn;","14":"En hun spijsoffer van meelbloem, met olie gemengd: drie tienden voor elke var, van die dertien varren; twee tienden voor elke ram, van die twee rammen;","15":"En voor elk een tiende voor een lam, tot al die veertien lammeren toe;","16":"En een geitenbok tot een zondoffer; behalve het gedurige brandoffer, zijn spijsoffer, en zijn drankoffer.","17":"Daarna, op de tweede dag: twaalf jonge varren, twee rammen, veertien volkomen eenjarige lammeren;","18":"En hun spijsoffer, en hun drankoffers voor de varren, voor de rammen, en voor de lammeren, naar hun aantal, volgens de wijze;","19":"En een geitenbok tot een zondoffer; behalve het gedurige brandoffer, en zijn spijsoffer, met hun drankoffers.","20":"En op de derde dag: elf varren, twee rammen, veertien volkomen eenjarige lammeren;","21":"En hun spijsoffers, en hun drankoffers voor de varren, voor de rammen, en voor de lammeren, naar hun aantal, volgens de wijze;","22":"En een bok tot een zondoffer; behalve het gedurige brandoffer, en zijn spijsoffer, en zijn drankoffer.","23":"Verder, op de vierde dag: tien varren, twee rammen, veertien volkomen eenjarige lammeren;","24":"Hun spijsoffer, en hun drankoffers voor de varren, voor de rammen, en voor de lammeren, naar hun aantal, volgens de wijze;","25":"En een geitenbok tot een zondoffer; behalve het gedurige brandoffer, zijn spijsoffer, en zijn drankoffer.","26":"En op de vijfde dag: negen varren, twee rammen, en veertien volkomen eenjarige lammeren;","27":"En hun spijsoffer, en hun drankoffers voor de varren, voor de rammen, en voor de lammeren, naar hun aantal, volgens de wijze;","28":"En een bok tot een zondoffer; behalve het gedurige brandoffer, en zijn spijsoffer, en zijn drankoffer.","29":"Daarna, op de zesde dag: acht varren, twee rammen, veertien volkomen eenjarige lammeren;","30":"En hun spijsoffer, en hun drankoffers voor de varren, voor de rammen, en voor de lammeren, naar hun aantal, volgens de wijze;","31":"En een bok tot een zondoffer; behalve het gedurige brandoffer, zijn spijsoffer, en zijn drankoffers.","32":"En op de zevende dag: zeven varren, twee rammen, veertien volkomen eenjarige lammeren;","33":"En hun spijsoffer, en hun drankoffers voor de varren, voor de rammen, en voor de lammeren, naar hun aantal, volgens hun wijze;","34":"En een bok tot een zondoffer; behalve het gedurige brandoffer, zijn spijsoffer, en zijn drankoffer.","35":"Op de achtste dag zult u een verbodsdag hebben; geen dienstwerk zult u doen.","36":"En u zult een brandoffer als vuuroffer aanbieden, tot een liefelijke reuk voor de HEERE; een var, een ram, zeven volkomen eenjarige lammeren;","37":"Hun spijsoffer, en hun drankoffers voor de var, voor de ram, en voor de lammeren, naar hun aantal, volgens de wijze;","38":"En een bok tot een zondoffer; behalve het gedurige brandoffer, en zijn spijsoffer, en zijn drankoffer.","39":"Deze dingen zult u de HEERE doen op uw vastgestelde hoogtijden; behalve uw geloften, en uw vrijwillige offers, met uw brandoffers, en met uw spijsoffers, en met uw drankoffers, en met uw dankoffers.","40":"En Mozes sprak tot de kinderen van Israël naar alles wat de HEERE Mozes geboden had."},"SV":{"1":"Desgelijks in de zevende maand, op den eersten der maand, zult gij een heilige samenroeping hebben; geen dienstwerk zult gij doen; het zal u een dag des geklanks zijn.","2":"Dan zult gij een brandoffer, ten liefelijken reuk, den HEERE bereiden: een jongen var, een ram, zeven volkomen eenjarige lammeren;","3":"En hun spijsoffer van meelbloem, met olie gemengd; drie tienden tot den var, twee tienden tot den ram.","4":"En een tiende tot een lam, tot die zeven lammeren toe;","5":"En een geitenbok ten zondoffer, om over ulieden verzoening te doen;","6":"Behalve het brandoffer der maand, en zijn spijsoffer, en het gedurig brandoffer, en zijn spijsoffer, met hun drankofferen, naar hun wijze, ten liefelijken reuk, ten vuuroffer den HEERE.","7":"En op den tienden dezer zevende maand zult gij een heilige samenroeping hebben, en gij zult uw zielen verootmoedigen; geen werk zult gij doen;","8":"Maar gij zult brandoffer, ten liefelijken reuk, den HEERE offeren: een jongen var, een ram, zeven eenjarige lammeren; volkomen zullen zij u zijn.","9":"En hun spijsoffer van meelbloem, met olie gemengd: drie tienden tot den var, twee tienden tot den enen ram;","10":"Tot elk een tiende tot een lam, tot die zeven lammeren toe;","11":"Een geitenbok ten zondoffer, behalve het zondoffer der verzoeningen, en het gedurig brandoffer; en zijn spijsoffer, met hun drankofferen.","12":"Insgelijks op den vijftienden dag dezer zevende maand, zult gij een heilige samenroeping hebben; geen dienstwerk zult gij doen; maar zeven dagen zult gij den HEERE een feest vieren.","13":"En gij zult een brandoffer ten vuuroffer offeren, ten liefelijken reuk den HEERE: dertien jonge varren, twee rammen, veertien eenjarige lammeren; zij zullen volkomen zijn;","14":"En hun spijsoffer van meelbloem, met olie gemengd: drie tienden tot een var, tot die dertien varren toe; twee tienden tot een ram, onder die twee rammen;","15":"En tot elke een tiende tot een lam, tot die veertien lammeren toe;","16":"En een geitenbok ten zondoffer; behalve het gedurig brandoffer, zijn spijsoffer, en zijn drankoffer.","17":"Daarna op den tweeden dag: twaalf jonge varren, twee rammen, veertien volkomen eenjarige lammeren;","18":"En hun spijsoffer, en hun drankofferen tot de varren, tot de rammen, en tot de lammeren, in hun getal, naar de wijze;","19":"En een geitenbok ten zondoffer; behalve het gedurig brandoffer, en zijn spijsoffer, met hun drankofferen.","20":"En op den derden dag: elf varren, twee rammen, veertien volkomen eenjarige lammeren;","21":"En hun spijsofferen, en hun drankofferen tot de varren, tot de rammen, en tot de lammeren, in hun getal, naar de wijze;","22":"En een bok ten zondoffer; behalve het gedurig brandoffer, en zijn spijsoffer, en zijn drankoffer.","23":"Verder op den vierden dag: tien varren, twee rammen, veertien volkomen eenjarige lammeren;","24":"Hun spijsoffer, en hun drankofferen tot de varren, tot de rammen, en tot de lammeren, in hun getal, naar de wijze;","25":"En een geitenbok ten zondoffer; behalve het gedurig brandoffer, zijn spijsoffer, en zijn drankoffer.","26":"En op den vijfden dag: negen varren, twee rammen, en veertien volkomen eenjarige lammeren;","27":"En hun spijsoffer, en hun drankofferen tot de varren, tot de rammen, en tot de lammeren, in hun getal, naar de wijze;","28":"En een bok ten zondoffer; behalve het gedurig brandoffer, en zijn spijsoffer, en zijn drankoffer.","29":"Daarna op den zesden dag: acht varren, twee rammen, veertien volkomen eenjarige lammeren;","30":"En hun spijsoffer, en hun drankofferen tot de varren, tot de rammen, en tot de lammeren, in hun getal, naar de wijze;","31":"En een bok ten zondoffer; behalve het gedurig brandoffer, zijn spijsoffer, en zijn drankofferen.","32":"En op den zevenden dag: zeven varren, twee rammen, veertien volkomen eenjarige lammeren;","33":"En hun spijsoffer, en hun drankofferen tot de varren, tot de rammen, en tot de lammeren, in hun getal, naar hun wijze;","34":"En een bok ten zondoffer; behalve het gedurig brandoffer, zijn spijsoffer, en zijn drankoffer.","35":"Op den achtsten dag zult gij een verbodsdag hebben; geen dienstwerk zult gij doen.","36":"En gij zult een brandoffer ten vuuroffer offeren, *ten* liefelijken reuk den HEERE; een var, een ram, zeven volkomen eenjarige lammeren;","37":"Hun spijsoffer, en hun drankofferen tot den var, tot den ram, en tot de lammeren, in hun getal, naar de wijze;","38":"En een bok ten zondoffer; behalve het gedurig brandoffer, en zijn spijsoffer, en zijn drankoffer.","39":"Deze dingen zult gij den HEERE doen op uw gezette hoogtijden; behalve uw geloften, en uw vrijwillige offeren, met uw brandofferen, en met uw spijsofferen en met uw drankofferen, en met uw dankofferen.","40":"En Mozes sprak tot de kinderen Israëls naar al wat de HEERE Mozes geboden had."},"KJV":{"1":"And in the seventh month, on the first *day* of the month, ye shall have an holy convocation; ye shall do no servile work: it is a day of blowing","2":"And ye shall offer a burnt offering for a sweet savour unto the LORD; one young bullock, one ram, *and* seven lambs of the first year without blemish:","3":"And their meat offering *shall be of* flour mingled with oil, three tenth deals for a bullock, *and* two tenth deals for a ram,","4":"And one tenth deal for one lamb, throughout the seven lambs:","5":"And one kid of the goats *for* a sin offering, to make an atonement","6":"Beside the burnt offering of the month, and his meat offering, and the daily burnt offering, and his meat offering, and their drink offerings, according unto their manner, for a sweet savour, a sacrifice made by fire unto the LORD.","7":"And ye shall have on the tenth *day* of this seventh month an holy convocation; and ye shall afflict your souls: ye shall not do any work","8":"But ye shall offer a burnt offering unto the LORD *for* a sweet savour; one young bullock, one ram, *and* seven lambs of the first year; they shall be unto you without blemish:","9":"And their meat offering *shall be of* flour mingled with oil, three tenth deals to a bullock, *and* two tenth deals to one ram,","10":"A several tenth deal for one lamb, throughout the seven lambs:","11":"One kid of the goats *for* a sin offering; beside the sin offering of atonement, and the continual burnt offering, and the meat offering of it, and their drink offerings.","12":"And on the fifteenth day of the seventh month ye shall have an holy convocation; ye shall do no servile work, and ye shall keep a feast unto the LORD seven days:","13":"And ye shall offer a burnt offering, a sacrifice made by fire, of a sweet savour unto the LORD; thirteen young bullocks, two rams, *and* fourteen lambs of the first year; they shall be without blemish:","14":"And their meat offering *shall be of* flour mingled with oil, three tenth deals unto every bullock of the thirteen bullocks, two tenth deals to each ram of the two rams,","15":"And a several tenth deal to each lamb of the fourteen lambs:","16":"And one kid of the goats *for* a sin offering; beside the continual burnt offering, his meat offering, and his drink offering.","17":"And on the second day *ye shall offer* twelve young bullocks, two rams, fourteen lambs of the first year without spot:","18":"And their meat offering and their drink offerings for the bullocks, for the rams, and for the lambs, *shall be* according to their number, after the manner:","19":"And one kid of the goats *for* a sin offering; beside the continual burnt offering, and the meat offering thereof, and their drink offerings.","20":"And on the third day eleven bullocks, two rams, fourteen lambs of the first year without blemish;","21":"And their meat offering and their drink offerings for the bullocks, for the rams, and for the lambs, *shall be* according to their number, after the manner:","22":"And one goat *for* a sin offering; beside the continual burnt offering, and his meat offering, and his drink offering.","23":"And on the fourth day ten bullocks, two rams, *and* fourteen lambs of the first year without blemish:","24":"Their meat offering and their drink offerings for the bullocks, for the rams, and for the lambs, *shall be* according to their number, after the manner:","25":"And one kid of the goats *for* a sin offering; beside the continual burnt offering, his meat offering, and his drink offering.","26":"And on the fifth day nine bullocks, two rams, *and* fourteen lambs of the first year without spot:","27":"And their meat offering and their drink offerings for the bullocks, for the rams, and for the lambs, *shall be* according to their number, after the manner:","28":"And one goat *for* a sin offering; beside the continual burnt offering, and his meat offering, and his drink offering.","29":"And on the sixth day eight bullocks, two rams, *and* fourteen lambs of the first year without blemish:","30":"And their meat offering and their drink offerings for the bullocks, for the rams, and for the lambs, *shall be* according to their number, after the manner:","31":"And one goat *for* a sin offering; beside the continual burnt offering, his meat offering, and his drink offering.","32":"And on the seventh day seven bullocks, two rams, *and* fourteen lambs of the first year without blemish:","33":"And their meat offering and their drink offerings for the bullocks, for the rams, and for the lambs, *shall be* according to their number, after the manner:","34":"And one goat *for* a sin offering; beside the continual bu function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const concordCache = {};

  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);

  } catch (e) { cache[code] = null; }

}

const popupCache = {};

  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

document.addEventListener('mouseover', e => {

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
