leiders, de hoofden van de duizenden van Israël.","5":"Als u met geschal van alarm blazen zult, dan zullen de legers die tegen het oosten gelegerd zijn, optrekken.","6":"Maar als u ten tweeden male met geschal van alarm blazen zult, zullen de legers die tegen het zuiden legeren, optrekken; met geschal van alarm zullen zij blazen tot hun tochten.","7":"Maar bij het verzamelen van de gemeente zult u blazen, maar geen alarmgeschal maken.","8":"En de zonen van Aäron, de priesters, zullen met die trompetten blazen; en zij zullen u zijn tot een eeuwige inzetting bij uw geslachten.","9":"En wanneer u in uw land ten strijde zult trekken tegen de vijand die u benauwt, zult u ook met die trompetten alarm maken; zo zal aan u gedacht worden voor het aangezicht van de HEERE, uw God, en u zult van uw vijanden verlost worden.","10":"Ook op de dag van uw vrolijkheid, en op uw vastgestelde hoogtijden, en aan de begin van uw maanden, zult u ook met de trompetten blazen over uw brandoffers en over uw dankoffers; en zij zullen u ter gedachtenis zijn voor het aangezicht van uw God; Ik ben de HEERE, uw God!","11":"En het gebeurde in het tweede jaar, in de tweede maand, op de twintigste van de maand, dat de wolk omhoog gebracht werd van boven de tabernakel van de getuigenis.","12":"En de kinderen van Israël trokken op naar hun tochten, uit de woestijn Sinaï; en de wolk bleef in de woestijn Paran.","13":"Zo trokken zij als eerste op, naar het bevel van de HEERE, door de hand van Mozes.","14":"Want als eerste trok op de banier van het leger van de kinderen van Juda, naar hun legers; en over zijn leger was Nahesson, de zoon van Amminadab.","15":"En over het leger van de stam van de kinderen van Issaschar was Nethaneel, de zoon van Zuar.","16":"En over het leger van de stam van de kinderen van Zebulon was Eliab, de zoon van Helon.","17":"Toen werd de tabernakel afgenomen, en de zonen van Gerson en de zonen van Merari trokken op, dragend de tabernakel.","18":"Daarna trok de banier van het leger van Ruben op, naar hun legers; en over zijn leger was Elizur, de zoon van Sedeur.","19":"En over het leger van de stam van de kinderen van Simeon was Selumiël, de zoon van Zurisaddai.","20":"En over het leger van de stam van de kinderen van Gad was Eljasaf, de zoon van Dehuël.","21":"Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.","22":"Daarna trok de banier van het leger van de kinderen van Efraïm op, naar hun legers; en over het leger was Elisama, de zoon van Ammihud.","23":"En over het leger van de stam van de kinderen van Manasse was Gamaliël, de zoon van Pedazur.","24":"En over het leger van de stam van de kinderen van Benjamin was Abidan, de zoon van Gideoni.","25":"Toen trok de banier van het leger van de kinderen van Dan op, als achterhoede van al de legers, naar hun legers; en over zijn leger was Ahiëzer, de zoon van Ammisaddai.","26":"En over het leger van de stam van de kinderen van Aser was Pagiel, de zoon van Ochran.","27":"En over het leger van de stam van de kinderen van Nafthali was Ahira, de zoon van Enan.","28":"Dit waren de tochten van de kinderen van Israël, naar hun legers, toen zij reisden.","29":"Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.","30":"Maar hij zei tegen hem: Ik zal niet gaan; maar ik zal naar mijn land en naar mijn familie gaan.","31":"En hij zei: Verlaat ons toch niet; want omdat u weet dat wij ons legeren in de woestijn, zult u ons tot ogen zijn.","32":"En het zal gebeuren, als u met ons zult gaan, en het goede gebeuren zal waarmee de HEERE ons goed zal doen, dat wij u ook goed zullen doen.","33":"Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.","34":"En de wolk van de HEERE was overdag over hen, als zij uit het leger vertrokken.","35":"Het gebeurde nu bij het optrekken van de ark, dat Mozes zei: Sta op, HEERE! En laat Uw vijanden verstrooid worden, en laat Uw haters van Uw aangezicht vluchten!","36":"En als zij rustte, zei hij: Kom terug, HEERE, tot de tienduizenden van de duizenden van Israël!"},"SV":{"1":"Verder sprak de HEERE tot Mozes, zeggende:","2":"Maak u twee zilveren trompetten; van dicht werk zult gij ze maken; en zij zullen u zijn tot de samenroeping der vergadering, en tot den optocht der legers.","3":"Als zij met dezelve blazen zullen, dan zal de gehele vergadering tot u vergaderd worden, aan de deur van de tent der samenkomst.","4":"Maar als zij met de ene zullen blazen, dan zullen tot u vergaderd worden de oversten, de hoofden der duizenden van Israël.","5":"Als gij met een gebroken geklank blazen zult, dan zullen de legers, die tegen het oosten gelegerd zijn, optrekken.","6":"Maar als gij ten tweeden male met een gebroken klank blazen zult, zullen de legers, die tegen het zuiden legeren, optrekken; met een gebroken klank zullen zij blazen tot hun optochten.","7":"Maar in het verzamelen van de gemeente, zult gij blazen, doch geen gebroken geklank maken.","8":"En de zonen van Aäron, de priesters, zullen met die trompetten blazen; en zij zullen ulieden zijn tot een eeuwige inzetting bij uw geslachten.","9":"En wanneer gijlieden in uw land ten strijde zult trekken tegen den vijand, die u benauwt, zult gij ook met die trompetten een gebroken klank maken; zo zal uwer gedacht worden voor het aangezicht des HEEREN, uws Gods, en gij zult van uw vijanden verlost worden.","10":"Desgelijks ten dage uwer vrolijkheid, en in uw gezette hoogtijden, en in de beginselen uwer maanden, zult gij ook met de trompetten blazen over uw brandofferen, en over uw dankofferen; en zij zullen u ter gedachtenis zijn voor het aangezicht uws Gods; Ik ben de HEERE, uw God!","11":"En het geschiedde in het tweede jaar, in de tweede maand, op den twintigsten van de maand, dat de wolk verheven werd van boven den tabernakel der getuigenis.","12":"En de kinderen Israëls togen op, naar hun tochten, uit de woestijn Sinaï; en de wolk bleef in de woestijn Paran.","13":"Alzo togen zij vooreerst op, naar den mond des HEEREN, door de hand van Mozes.","14":"Want vooreerst toog op de banier van het leger der kinderen van Juda, naar hun heiren; en over zijn heir was Nahesson, de zoon van Amminadab.","15":"En over het heir van den stam der kinderen van Issaschar was Nethaneel, den zoon van Zuar.","16":"En over het heir van den stam der kinderen van Zebulon was Eliab, de zoon van Helon.","17":"Toen werd de tabernakel afgenomen, en de zonen van Gerson, en de zonen van Merari togen op, dragende den tabernakel.","18":"Daarna toog de banier van het leger van Ruben, naar hun heiren; en over zijn heir was Elizur, de zoon van Sedeur.","19":"En over het heir van den stam der kinderen van Simeon was Selumiël, de zoon van Zurisaddai.","20":"En over het heir van den stam der kinderen van Gad was Eljasaf, de zoon van Dehuël.","21":"Toen togen op de Kohathieten, dragende het heiligdom; en *de* *anderen* richtten den tabernakel op, tegen dat dezen kwamen.","22":"Daarna toog op de banier van het leger der kinderen van Efraïm, naar hun heiren; en over het heir was Elisama, de zoon van Ammihud.","23":"En over het heir van den stam der kinderen van Manasse was Gamaliël, de zoon van Pedazur.","24":"En over het heir van den stam der kinderen van Benjamin was Abidan, de zoon van Gideoni.","25":"Toen toog op de banier van het leger der kinderen van Dan, samensluitende al de legers, naar hun heiren; en over zijn heir was Ahiëzer de zoon van Ammisaddai.","26":"En over het heir van den stam der kinderen van Aser was Pagiel, de zoon van Ochran.","27":"En over het heir van den stam der kinderen van Nafthali was Ahira, de zoon van Enan.","28":"Dit waren de tochten der kinderen Israëls, naar hun heiren, als zij reisden.","29":"Mozes nu zeide tot Hobab, den zoon van Rehuël, den Midianiet, den schoonvader van Mozes: Wij reizen naar die plaats, van welke de HEERE gezegd heeft: Ik zal u die geven; ga met ons, en wij zullen u weldoen, want de HEERE heeft over Israël het goede gesproken.","30":"Doch hij zeide tot hem: Ik zal niet gaan; maar ik zal naar mijn land en naar mijn maagschap gaan.","31":"En hij zeide: Verlaat ons toch niet; want dewijl gij weet, dat wij ons legeren in de woestijn, zo zult gij ons tot ogen zijn.","32":"En het zal geschieden, als gij met ons zult gaan, en het goede geschieden zal, waarmede de HEERE bij ons weldoen zal, dat wij u ook weldoen zullen.","33":"Zo togen zij drie dagreizen van den berg des HEEREN; en de ark des verbonds des HEEREN reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.","34":"En de wolk des HEEREN was des daags over hen, als zij uit het leger verreisden.","35":"Het geschiedde nu in het optrekken van de ark, dat Mozes zeide: Sta op, HEERE! en laat Uw vijanden verstrooid worden, en Uw haters van Uw aangezicht vlieden!","36":"En als zij rustte, zeide hij: Kom weder, HEERE! *tot* de tien duizenden der duizenden van Israël!"},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Make thee two trumpets of silver; of a whole piece shalt thou make them: that thou mayest use them for the calling of the assembly, and for the journeying of the camps.","3":"And when they shall blow with them, all the assembly shall assemble themselves to thee at the door of the tabernacle of the congregation.","4":"And if they blow *but* with one *trumpet*, then the princes, *which are* heads of the thousands of Israel, shall gather","5":"When ye blow an alarm, then the camps that lie on the east parts shall go forward.","6":"When ye blow an alarm the second time, then the camps that lie on the south side shall take their journey: they shall blow an alarm for their journeys.","7":"But when the congregation is to be gathered together, ye shall blow, but ye shall not sound an alarm.","8":"And the sons of Aaron, the priests, shall blow with the trumpets; and they shall be to you for an ordinance for ever throughout your generations.","9":"And if ye go to war in your land against the enemy that oppresseth you, then ye shall blow an alarm with the trumpets; and ye shall be remembered before the LORD your God, and ye shall be saved from your enemies.","10":"Also in the day of your gladness, and in your solemn days, and in the beginnings of your months, ye shall blow with the trumpets over your burnt offerings, and over the sacrifices of your peace offerings; that they may be to you for a memorial before your God: I *am* the LORD your God.","11":"And it came to pass on the twentieth *day* of the second month, in the second year, that the cloud was taken up from off the tabernacle of the testimony.","12":"And the children of Israel took their journeys out of the wilderness of Sinai; and the cloud rested in the wilderness of Paran.","13":"And they first took their journey according to the commandment of the LORD by the hand of Moses.","14":"In the first *place* went the standard of the camp of the children of Judah according to their armies: and over his host *was* Nahshon the son of Amminadab.","15":"And over the host of the tribe of the children of Issachar *was* Nethaneel the son of Zuar.","16":"And over the host of the tribe of the children of Zebulun *was* Eliab the son of Helon.","17":"And the tabernacle was taken down; and the sons of Gershon and the sons of Merari set forward, bearing the tabernacle.","18":"And the standard of the camp of Reuben set forward according to their armies: and over his host *was* Elizur the son of Shedeur.","19":"And over the host of the tribe of the children of Simeon *was* Shelumiel the son of Zurishaddai.","20":"And over the host of the tribe of the children of Gad *was* Eliasaph the son of Deuel.","21":"And the Kohathites set forward, bearing the sanctuary: and *the other* did set up the tabernacle against they came.","22":"And the standard of the camp of the children of Ephraim set forward according to their armies: and over his host *was* Elishama the son of Ammihud.","23":"And over the host of the tribe of the children of Manasseh *was* Gamaliel the son of Pedahzur.","24":"And over the host of the tribe of the children of Benjamin *was* Abidan the son of Gideoni.","25":"And the standard of the camp of the children of Dan set forward, *which was* the rereward of all the camps throughout their hosts: and over his host *was* Ahiezer the son of Ammishaddai.","26":"And over the host of the tribe of the children of Asher *was* Pagiel the son of Ocran.","27":"And over the host of the tribe of the children of Naphtali *was* Ahira the son of Enan.","28":"Thus *were* the journeyings of the children of Israel according to their armies, when they set forward.","29":"And Moses said unto Hobab, the son of Raguel the Midianite, Moses' father in law, We are journeying unto the place of which the LORD said, I will give it you: come thou with us, and we will do thee good: for the LORD hath spoken good concerning Israel.","30":"And he said unto him, I will not go; but I will depart to mine own land, and to my kindred.","31":"And he said, Leave us not, I pray thee; forasmuch as thou knowest how we are to encamp in the wilderness, and thou mayest be to us instead of eyes.","32":"And it shall be, if thou go with us, yea, it shall be, that what goodness the LORD shall do unto us, the same will we do","33":"And they departed from the mount of the LORD three days' journey: and the ark of the covenant of the LORD went before them in the three days' journey, to search out a resting place","34":"And the cloud of the LORD *was* upon them by day, when they went out of the camp.","35":"And it came to pass, when the ark set forward, that Moses said, Rise up, LORD, and let thine enemies be scattered; and let them that hate thee fle ss=\"wl wl-kjv\" data-code=\"H2708\">ordinance</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> throughout your generations.","9":"And if ye <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> in your <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H6862\">against</span> the enemy that <span class=\"wl wl-kjv\" data-code=\"H6887\">oppresseth</span> you, then ye shall blow an <span class=\"wl wl-kjv\" data-code=\"H7321\">alarm</span> with the <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets;</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> from your enemies.","10":"Also in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of your <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness,</span> and in your solemn <span class=\"wl wl-kjv\" data-code=\"H4150\">days,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H7218\">beginnings</span> of your <span class=\"wl wl-kjv\" data-code=\"H2320\">months,</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H8628\">blow</span> with the <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets</span> over your burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and over the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> of your peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings;</span> that they may be to you for a <span class=\"wl wl-kjv\" data-code=\"H2146\">memorial</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","11":"And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> in the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> that the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> was taken <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from off the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> of the testimony.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">took</span> their <span class=\"wl wl-kjv\" data-code=\"H4550\">journeys</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H5514\">Sinai;</span> and the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> <span class=\"wl wl-kjv\" data-code=\"H7931\">rested</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of Paran.","13":"And they <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> took their <span class=\"wl wl-kjv\" data-code=\"H5265\">journey</span> according to the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of Moses.","14":"In the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> place <span class=\"wl wl-kjv\" data-code=\"H5265\">went</span> the <span class=\"wl wl-kjv\" data-code=\"H1714\">standard</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> according to their <span class=\"wl wl-kjv\" data-code=\"H6635\">armies:</span> and over his host was <span class=\"wl wl-kjv\" data-code=\"H5177\">Nahshon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Amminadab.","15":"And over the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3485\">Issachar</span> was <span class=\"wl wl-kjv\" data-code=\"H5417\">Nethaneel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Zuar.","16":"And over the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H2074\">Zebulun</span> was <span class=\"wl wl-kjv\" data-code=\"H446\">Eliab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Helon.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> was taken <span class=\"wl wl-kjv\" data-code=\"H3381\">down;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1648\">Gershon</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4847\">Merari</span> set <span class=\"wl wl-kjv\" data-code=\"H5265\">forward,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bearing</span> the tabernacle.","18":"And the <span class=\"wl wl-kjv\" data-code=\"H1714\">standard</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> set <span class=\"wl wl-kjv\" data-code=\"H5265\">forward</span> according to their <span class=\"wl wl-kjv\" data-code=\"H6635\">armies:</span> and over his <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> was <span class=\"wl wl-kjv\" data-code=\"H468\">Elizur</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Shedeur.","19":"And over the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H8095\">Simeon</span> was <span class=\"wl wl-kjv\" data-code=\"H8017\">Shelumiel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Zurishaddai.","20":"And over the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad</span> was <span class=\"wl wl-kjv\" data-code=\"H460\">Eliasaph</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Deuel.","21":"And the <span class=\"wl wl-kjv\" data-code=\"H6956\">Kohathites</span> set <span class=\"wl wl-kjv\" data-code=\"H5265\">forward,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bearing</span> the <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary:</span> and the other did set <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> against they came.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H1714\">standard</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> set <span class=\"wl wl-kjv\" data-code=\"H5265\">forward</span> according to their <span class=\"wl wl-kjv\" data-code=\"H6635\">armies:</span> and over his <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> was <span class=\"wl wl-kjv\" data-code=\"H476\">Elishama</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Ammihud.","23":"And over the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> was <span class=\"wl wl-kjv\" data-code=\"H1583\">Gamaliel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Pedahzur.","24":"And over the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> was <span class=\"wl wl-kjv\" data-code=\"H27\">Abidan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Gideoni.","25":"And the <span class=\"wl wl-kjv\" data-code=\"H1714\">standard</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan</span> set <span class=\"wl wl-kjv\" data-code=\"H5265\">forward,</span> which was the <span class=\"wl wl-kjv\" data-code=\"H622\">rereward</span> of all the <span class=\"wl wl-kjv\" data-code=\"H4264\">camps</span> throughout their <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts:</span> and over his <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> was <span class=\"wl wl-kjv\" data-code=\"H295\">Ahiezer</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Ammishaddai.","26":"And over the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H836\">Asher</span> was <span class=\"wl wl-kjv\" data-code=\"H6295\">Pagiel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Ocran.","27":"And over the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali</span> was <span class=\"wl wl-kjv\" data-code=\"H299\">Ahira</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Enan.","28":"Thus <span class=\"wl wl-kjv\" data-code=\"H428\">were</span> the <span class=\"wl wl-kjv\" data-code=\"H4550\">journeyings</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> according to their <span class=\"wl wl-kjv\" data-code=\"H6635\">armies,</span> when they set forward.","29":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H2246\">Hobab,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7467\">Raguel</span> the <span class=\"wl wl-kjv\" data-code=\"H4084\">Midianite,</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses'</span> father in <span class=\"wl wl-kjv\" data-code=\"H2859\">law,</span> We are <span class=\"wl wl-kjv\" data-code=\"H5265\">journeying</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it you: <span class=\"wl wl-kjv\" data-code=\"H3212\">come</span> thou with us, and we will do thee <span class=\"wl wl-kjv\" data-code=\"H2895\">good:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> concerning Israel.","30":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I will not <span class=\"wl wl-kjv\" data-code=\"H3212\">go;</span> but I will <span class=\"wl wl-kjv\" data-code=\"H3212\">depart</span> to mine own <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and to my kindred.","31":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">Leave</span> us not, I pray thee; forasmuch as thou <span class=\"wl wl-kjv\" data-code=\"H3651\">knowest</span> how we are to <span class=\"wl wl-kjv\" data-code=\"H2583\">encamp</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and thou mayest be to us instead of eyes.","32":"And it shall be, if thou <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with us, yea, it shall be, that what <span class=\"wl wl-kjv\" data-code=\"H2896\">goodness</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H3190\">do</span> unto us, the same will we do","33":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days'</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">journey:</span> and the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them in the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days'</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">journey,</span> to search <span class=\"wl wl-kjv\" data-code=\"H8446\">out</span> a resting place","34":"And the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was upon them by <span class=\"wl wl-kjv\" data-code=\"H3119\">day,</span> when they went <span class=\"wl wl-kjv\" data-code=\"H5265\">out</span> of the camp.","35":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> set <span class=\"wl wl-kjv\" data-code=\"H5265\">forward,</span> that <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and let thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> be <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered;</span> and let them that <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> thee <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> before","36":"And when it <span class=\"wl wl-kjv\" data-code=\"H5117\">rested,</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Return,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7233\">many</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> of Israel."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"twee zilveren trompetten;","tekst":"Welker gebruik drieërlei was:&lt;i&gt;I.&lt;/i&gt; Om de vergadering samen te roepen, vs.2; te weten, de kerkelijke, vs.3, 7, 10; en de burgerlijke, vs.4;&lt;i&gt;II.&lt;/i&gt; Om het leger te doen verreizen, vs.2, 5,6;&lt;i&gt;III.&lt;/i&gt; Om de krijgslieden te doen wapenen en op te maken ten strijde tegen de vijanden, vs.9."},{"catchword":"dicht werk zult gij ze maken;","tekst":"Of, geslagen w roken sound, [understand such a one as doth not make a steady, plain unison, but a differing, interchanging, quavering and uneven tune; and thus the Hebrew word is taken in the following verses, 6, 7, 9.] then the Camps which are camped Eastwards, shall march."}],"6":[{"catchword":null,"tekst":"But when ye shall blow the second time, with a broken sound, then the Camps, which Camp Southward shall march: they shall blow with a broken sound for their marches."}],"7":[{"catchword":null,"tekst":"But in assembling the Congregation, ye shall blow, yet make no broken sound."}],"8":[{"catchword":null,"tekst":"And the sons of Aaron the Priest, shall blow with these Trumpets: and they shall be unto you for a perpetual institution, [Hebr. Institution of eternity. See Gen.13. on v. 15.] by your generations."}],"9":[{"catchword":null,"tekst":"And when you shall march in your land to fight against your Enemy that distresseth you, ye shall likewise make a broken sound with these Trumpets: then shall ye he had in remembrance before the face of the LORD your God, and ye shall be delivered from your enemies: [Understand, not as if the deliverance and good success of the people of God depended on the blowing of those Trumpets; but that they were not to blow or sound the same, or march forth to battle, but according to God&acirc;&euro;&trade;s command, and relying on him alone for help: in which cases, the sounding of the Trumpets was a token to them of God&acirc;&euro;&trade;s assistance. How remembrance is attributed unto God, See Gen. 8. On v. 1.]"}],"10":[{"catchword":null,"tekst":"Likewise on the day of your rejoicing, [i.e. when the LORD shall have removed any notable judgement from, or bestowed any extraordinary mercy upon you; over which they were wont to rejoice, and to give God public and solemn thanks in the Assembly. See Psalm 48. And 118.] and in your set high times [wherein honest rejoicing and cheerfulness was not onely allowed, but also enjoyed them, Deut. 16. 14.] and 24":[{"catchword":null,"tekst":"And over the host of the Tribe of the children of Benjamin, (there) was Abidan the son of Gideoni."}],"25":[{"catchword":null,"tekst":"Then (there) marched the Banner of the Camp of the children of Dan, concluding all the Camps together by their hosts: (Hebr. Gathering all the Camps. This is set down thus, in regard that Dan with the two other Tribes joined to his Banner, did bring up the Rear, and so concluded all the rest that marched before, that none should tarry behind. Thus the Rear is likewise spoken of Jos. Chap. 6. 13.] and over his host was Ahiezer the son of Ammisaddai."}],"26":[{"catchword":null,"tekst":"And over the host of the Tribe of the children of Aser, (there) was Pagiel the son of Ochran."}],"27":[{"catchword":null,"tekst":"And over the host of the Tribe of the children of Naphtali, (there) was Abira the son of Enan."}],"28":[{"catchword":null,"tekst":"These were the marches of the children of Israel, by their hosts when they journeyed. [i.e. these were the Orders, according to which the Israelites did march, when they removed and journeyed.]"}],"29":[{"catchword":null,"tekst":"Moseh now said, [Or, had said, for some hold that this happened when he was first come to him in wilderness, Exod. 18. 27.] to Hobab [this is held to be the same, that Exod. 18. 1. Was called Jethro] the son of Reguel, [Heb. Reuel, or Rebuel.] the Midianite Moseh&acirc;&euro;&trade;s father in Law: We journey toward that place, whereof the LORD said, I will give thee that: go with us, and we shall do well to thee, for the LORD hath spoken the good (or, that which is good) over Israel. [compare Gen. 18. 19.]"}],"30":[{"catchword":null,"tekst":"But he said to him, I will not go: but I will go to my Country, and to my Kindred. [Some are of opinion, that this absolute refusal was but for that time, and that he would first return homewards, but came again afterwards unto the Israelites, seeing the Scripture maketh mention of his posterities dwelling among them, Jud. 1. 16. And chap. 4. 11, 17. 1 sam. 15. On v. 6. 2 Kings 10. V. 15. 1 Chron. 2. 55. Jer. 35. 2.]"}],"31":[{"catchword":null,"tekst":"And he said: forsake us not (I Pray) for since thou knowest, that we camp in the wilderness, thou shalt be eyes to us. [Heb. two eyes; i.e. a good guide and leader, to conduct us most conveniently through these untrodden, unknown, and over-grown ways, which thou art better acquinted with then any of us. Oth. And thou hast been our eyes.]"}],"32":[{"catchword":null,"tekst":"And it shall come to pass when thou shalt go with us; and that same good shall happen, whereby the LORD shall do well by us, that we shall likewise do well unto thee."}],"33":[{"catchword":null,"tekst":"So they marched three days journey from the mount of the LORD; [Understand Mount Sinai, and Horeb, called the Mount of the LORD, because that there the LORD had revealed himself, and given his Law upon the same. See Exod. 3. 1. And 33. 6. Deut. 1. 2. 1King 19. 8.] and the ark of the Covenant of the LORD [so called, because that therein were laid up the two stone, Tables by Moseh, when the LORD had made a Covenant with the children of Israel, as they were coming out of Egypt, and marching towards the land of Canaan, Exod. 25. 16. 1 Kings 8. 9. 2 Chron. 5. 10.] journeyed [viz. being carried by the Priests, Deut. 31. 9.] three days journeys to spy out a resting place of them."}],"34":[{"catchword":null,"tekst":"And the cloud of the LORD was over them by day, when they marched forth out of the Camp."}],"35":[{"catchword":null,"tekst":"Now it came to pass in the marching of the Ark, that Moseh said; Arise, LORD, and let thine enemies be scattered, [Hebr. Thine enemies shall be scattered, & c.] and thy haters flee from thy face."}],"36":[{"catchword":null,"tekst":"And when it rested, he said; Return, LORD (to) [Oth. With, by] the ten thousands of the thousands of Israel. [i.e. to the great number of the children of Israel, being almost numberless."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
