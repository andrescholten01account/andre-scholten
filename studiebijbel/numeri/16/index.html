 tegen Aäron, en zeiden tegen hen: Het is te veel voor u, want deze hele vergadering, zij allen, zijn heilig, en de HEERE is in hun midden; waarom verheft u zich dan boven de gemeente van de HEERE?","4":"Toen Mozes dit hoorde, viel hij op zijn aangezicht.","5":"En hij sprak tot Korach en tot zijn hele vergadering, en zei: Morgenvroeg zal de HEERE bekendmaken wie van Hem is, en wie de heilige is, die Hij tot Zich zal laten naderen; en wie Hij verkoren zal hebben, die zal Hij tot Zich laten naderen.","6":"Doe dit: neem wierookvaten, Korach en uw hele vergadering;","7":"En doe morgen vuur daarin, leg reukwerk daarop voor het aangezicht van de HEERE; en het zal gebeuren dat de man die de HEERE verkiezen zal, die zal heilig zijn. Het is te veel voor u, kinderen van Levi!","8":"Verder zei Mozes tegen Korach: Hoor toch, kinderen van Levi!","9":"Is het u te weinig, dat de God van Israël u van de vergadering van Israël heeft afgescheiden, om u tot Zich te laten naderen; om de dienst van de tabernakel van de HEERE te verrichten, en te staan voor het aangezicht van de vergadering, om hen te dienen?","10":"Terwijl Hij u, en al uw broeders, de kinderen van Levi, met u, heeft laten naderen; zoekt u nu ook het priesterambt?","11":"Daarom, u en uw hele vergadering, u bent verzameld tegen de HEERE, want Aäron, wat is hij, dat u tegen hem morde?","12":"En Mozes stuurde iemand om Dathan en Abiram, de zonen van Eliab, te roepen; maar zij zeiden: Wij zullen niet komen!","13":"Is het te weinig, dat u ons uit een land dat overvloeit van melk en honing hebt weggehaald, om ons te doden in de woestijn, dat u zichzelf ook nog helemaal tot heerser over ons maakt?","14":"Bovendien hebt u ons niet gebracht in een land dat overvloeit van melk en honing, en ook geen akkers en wijngaarden als erfdeel gegeven. Zult u de ogen van deze mannen uitsteken? Wij zullen niet komen!","15":"Toen ontstak Mozes zeer, en hij zei tegen de HEERE: Zie hun offer niet aan! Ik heb niet één ezel van hen genomen, en niemand van hen kwaad gedaan.","16":"Verder zei Mozes tegen Korach: U, en uw hele vergadering, wees voor het aangezicht van de HEERE; u, en zij, ook Aäron, morgen.","17":"En neem ieder zijn wierookvat, en leg reukwerk daarin, en breng het voor het aangezicht van de HEERE, ieder zijn wierookvat, tweehonderd en vijftig wierookvaten; ook u, en Aäron, ieder zijn wierookvat.","18":"Zo nam ieder zijn wierookvat, en deed vuur daarin, en legde reukwerk daarin; en zij stonden voor de deur van de tent van de samenkomst, ook Mozes en Aäron.","19":"En Korach liet de hele vergadering tegen hen verzamelen bij de deur van de tent van de samenkomst. Toen verscheen de heerlijkheid van de HEERE aan deze hele vergadering.","20":"En de HEERE sprak tot Mozes en tot Aäron, en zei:","21":"Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren!","22":"Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?","23":"En de HEERE sprak tot Mozes, en zei:","24":"Spreek tot deze vergadering en zeg: Ga weg van rondom de woning van Korach, Dathan en Abiram.","25":"Toen stond Mozes op, en ging naar Dathan en Abiram; en achter hem gingen de oudsten van Israël.","26":"En hij sprak tot de vergadering en zei: Ga toch weg van de tenten van deze goddeloze mannen, en raak niets aan van wat van hen is, anders wordt u misschien meegesleurd in al hun zonden.","27":"Zo gingen zij weg van rondom de woning van Korach, Dathan en Abiram; maar Dathan en Abiram gingen naar buiten, en stonden in de deur van hun tenten, met hun vrouwen, hun zonen en hun kinderen.","28":"Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn *eigen* hart komen.","29":"Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.","30":"Maar als de HEERE iets nieuws schept, en het aardrijk zijn mond opendoet en hen verslindt met alles wat van hen is, en zij levend in het dodenrijk neerdalen, dan zult u weten dat deze mannen de HEERE getergd hebben.","31":"En het gebeurde, toen hij geëindigd had al deze woorden te spreken, dat het aardrijk dat onder hen was, gekloofd werd;","32":"En de aarde opende haar mond, en verslond hen met hun huizen, en alle mensen die bij Korach hoorden, en al hun bezit.","33":"En zij daalden neer, zij en alles wat van hen was, levend in het dodenrijk; en de aarde overdekte hen, en zij kwamen om uit het midden van de gemeente.","34":"En heel Israël dat rondom hen was, vluchtte voor hun geschreeuw; want zij zeiden: De aarde zou ons misschien ook kunnen verslinden!","35":"Daarbij kwam er een vuur uit van de HEERE, en het verteerde die tweehonderd en vijftig mannen die reukwerk offerden.","36":"En de HEERE sprak tot Mozes, en zei:","37":"Zeg tegen Eleazar, de zoon van Aäron, de priester, dat hij de wierookvaten uit de brand opneemt; en strooi het vuur ver weg; want zij zijn heilig;","38":"*Namelijk* de wierookvaten van hen die tegen hun eigen leven gezondigd hebben; dat men daarvan uitgehamerde platen maakt, als overdekking voor het altaar; want zij hebben ze gebracht voor het aangezicht van de HEERE, daarom zijn ze heilig; en zij zullen voor de kinderen van Israël tot een teken zijn.","39":"En Eleazar, de priester, nam de koperen wierookvaten die de verbrande mannen gebracht hadden, en men hamerde ze uit tot een overdekking voor het altaar;","40":"Ter herinnering voor de kinderen van Israël, opdat geen vreemdeling, die niet uit het nageslacht van Aäron is, nadert om reukwerk aan te steken voor het aangezicht van de HEERE; opdat hij niet wordt als Korach en zijn vergadering, zoals de HEERE hem door de hand van Mozes gezegd had.","41":"Maar de volgende dag morde de hele vergadering van de kinderen van Israël tegen Mozes en tegen Aäron, en zei: U hebt het volk van de HEERE gedood!","42":"En het gebeurde, toen de vergadering zich verzamelde tegen Mozes en Aäron, en zich wendde naar de tent van de samenkomst, zie, dat de wolk haar bedekte; en de heerlijkheid van de HEERE verscheen.","43":"Mozes nu en Aäron kwamen tot voor de tent van de samenkomst.","44":"Toen sprak de HEERE tot Mozes, en zei:","45":"Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.","46":"En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen.","47":"En Aäron nam het, zoals Mozes gesproken had, en liep midden in de gemeente, en zie, de plaag was al begonnen onder het volk; en hij legde reukwerk daarin, en deed verzoening over het volk.","48":"En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.","49":"Zij die aan die plaag gestorven waren, waren veertienduizend zevenhonderd, behalve zij die gestorven waren om de zaak van Korach.","50":"En Aäron keerde terug naar Mozes bij de deur van de tent van de samenkomst; en de plaag was tot stilstand gebracht."},"SV":{"1":"Korach nu, de zoon van Jizhar, zoon van Kohath, zoon van Levi, nam tot zich zo Dathan als Abiram, zonen van Eliab, en On, den zoon van Peleth, zonen van Ruben.","2":"En zij stonden op voor het aangezicht van Mozes, mitsgaders tweehonderd en vijftig mannen uit de kinderen Israëls, oversten der vergadering, de geroepenen der samenkomst, mannen van naam.","3":"En zij vergaderden zich tegen Mozes, en tegen Aäron, en zeiden tot hen: Het is te veel voor u, want deze ganse vergadering, zij allen, zijn heilig, en de HEERE is in het midden van hen; waarom dan verheft gijlieden u over de gemeente des HEEREN?","4":"Als Mozes dit hoorde, zo viel hij op zijn aangezicht.","5":"En hij sprak tot Korach, en tot zijn ganse vergadering, zeggende: Morgen vroeg dan zal de HEERE bekend maken, wie de Zijne, en de heilige is, dien Hij tot Zich zal doen naderen; en wien Hij verkoren zal hebben, dien zal Hij tot Zich doen naderen.","6":"Doet dit: neemt u wierookvaten, Korach en zijn ganse vergadering;","7":"En doet morgen vuur daarin, legt reukwerk daarop voor het aangezicht des HEEREN; en het zal geschieden, dat de man, dien de HEERE verkiezen zal, die zal heilig zijn. Het is te veel voor u, gij, kinderen van Levi!","8":"Voorts zeide Mozes tot Korach: Hoort toch, gij, kinderen van Levi!","9":"Is het u te weinig, dat de God van Israël u van de vergadering van Israël heeft afgescheiden, om ulieden tot Zich te doen naderen; om den dienst van des HEEREN tabernakel te bedienen, en te staan voor het aangezicht der vergadering, om hen te dienen?","10":"Daar Hij u, en al uw broederen, de kinderen van Levi, met u, heeft doen naderen; zoekt gij nu ook het priesterambt?","11":"Daarom gij, en uw ganse vergadering, gij zijt vergaderd tegen den HEERE, want Aäron, wat is hij, dat gij tegen hem murmureert ?","12":"En Mozes schikte heen, om Dathan en Abiram, de zonen van Eliab, te roepen; maar zij zeiden: Wij zullen niet opkomen!","13":"Is het te weinig, dat gij ons uit een land, van melk en honig vloeiende, hebt opgevoerd, om ons te doden in de woestijn, dat gij ook uzelven ten enenmaal over ons tot een overheer maakt?","14":"Ook hebt gij ons niet gebracht in een land, dat van melk en honig vloeit, noch ons akkers en wijngaarden ten erfdeel gegeven. Zult gij de ogen dezer mannen uitgraven? Wij zullen niet opkomen!","15":"Toen ontstak Mozes zeer, en hij zeide tot den HEERE: Zie hun offer niet aan! Ik heb niet een ezel van hen genomen, en niet een van hen kwaad gedaan.","16":"Voorts zeide Mozes tot Korach: Gij, en uw ganse vergadering, weest voor het aangezicht des HEEREN; gij, en zij, ook Aäron, op morgen.","17":"En neemt een ieder zijn wierookvat, en legt reukwerk daarin, en brengt voor het aangezicht des HEEREN, een ieder zijn wierookvat, tweehonderd en vijftig wierookvaten; ook gij, en Aäron, een ieder zijn wierookvat.","18":"Zo namen zij een ieder zijn wierookvat, en deden vuur daarin, en leiden reukwerk daarin; en zij stonden voor de deur van de tent der samenkomst, ook Mozes en Aäron.","19":"En Korach deed de ganse vergadering tegen hen verzamelen, aan de deur van de tent der samenkomst. Toen verscheen de heerlijkheid des HEEREN aan deze ganse vergadering.","20":"En de HEERE sprak tot Mozes en tot Aäron, zeggende:","21":"Scheidt u af uit het midden van deze vergadering, en Ik zal hen als in een ogenblik verteren!","22":"Maar zij vielen op hun aangezichten, en zeiden: O God! God der geesten van alle vlees! een enig man zal gezondigd hebben, en zult Gij U over deze ganse vergadering grotelijks vertoornen?","23":"En de HEERE sprak tot Mozes, zeggende:","24":"Spreek tot deze vergadering, zeggende: Gaat op van rondom de woning van Korach, Dathan en Abiram.","25":"Toen stond Mozes op, en ging tot Dathan en Abiram; en achter hem gingen de oudsten van Israël.","26":"En hij sprak tot de vergadering, zeggende: Wijkt toch af van de tenten dezer goddeloze mannen, en roert niets aan van hetgeen hunner is, opdat gij niet misschien verdaan wordt in al hun zonden.","27":"Zo gingen zij op van de woning van Korach, Dathan en Abiram, van rondom; maar Dathan en Abiram gingen uit, staande in de deur hunner tenten, met hun vrouwen, en hun zonen, en hun kinderkens.","28":"Toen zeide Mozes: Hieraan zult gij bekennen, dat de HEERE mij gezonden heeft, om al deze daden te doen, dat zij niet uit mijn *eigen* hart zijn.","29":"Indien deze zullen sterven, gelijk alle mensen sterven, en over hen een bezoeking zal gedaan worden, naar aller mensen bezoeking, zo heeft mij de HEERE niet gezonden.","30":"Maar indien de HEERE wat nieuws zal scheppen, en het aardrijk zijn mond zal opendoen, en verslinden hen met alles wat hunner is, en zij levend ter helle zullen nedervaren; alsdan zult gij bekennen, dat deze mannen de HEERE getergd hebben.","31":"En het geschiedde, als hij geëindigd had al deze woorden te spreken, zo werd het aardrijk, dat onder hen was, gekloofd;","32":"En de aarde opende haar mond, en verslond hen met hun huizen, en allen mensen, die Korach toebehoorden, en al de have.","33":"En zij voeren neder, zij en alles wat hunner was, levend ter helle; en de aarde overdekte hen, en zij kwamen om uit het midden der gemeente.","34":"En het ganse Israël, dat rondom hen was, vlood voor hun geschrei; want zij zeiden: Dat ons de aarde misschien niet verslinde!","35":"Daartoe ging een vuur uit van den HEERE, en verteerde die tweehonderd en vijftig mannen, die reukwerk offerden.","36":"En de HEERE sprak tot Mozes, zeggende:","37":"Zeg tot Eleazar, den zoon van Aäron, den priester, dat hij de wierookvaten uit den brand opneme; en strooi het vuur verre weg; want zij zijn heilig;","38":"*Te* *weten* de wierookvaten van dezen, die tegen hun zielen gezondigd hebben; dat men uitgerekte platen daarvan make, tot een overdeksel voor het altaar; want zij hebben ze gebracht voor het aangezicht des HEEREN, daarom zijn zij heilig; en zij zullen den kinderen Israëls tot een teken zijn.","39":"En Eleazar, de priester, nam de koperen wierookvaten, die de verbranden gebracht hadden, en zij rekten ze uit tot een overtreksel voor het altaar;","40":"Ter nagedachtenis voor de kinderen Israëls, opdat niemand vreemds, die niet uit het zaad van Aäron is, nadere om reukwerk aan te steken voor het aangezicht des HEEREN; opdat hij niet worde als Korach, en zijn vergadering, gelijk als hem de HEERE door den dienst van Mozes gesproken had.","41":"Maar des anderen daags murmureerde de ganse vergadering der kinderen Israëls tegen Mozes en tegen Aäron, zeggende: Gijlieden hebt des HEEREN volk gedood!","42":"En het geschiedde, als de vergadering zich verzamelde tegen Mozes en Aäron, en zich wendde naar de tent der samenkomst, ziet, zo bedekte haar die wolk; en de heerlijkheid des HEEREN verscheen.","43":"Mozes nu en Aäron kwamen tot voor de tent der samenkomst.","44":"Toen sprak de HEERE tot Mozes, zeggende:","45":"Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, als in een ogenblik! Toen vielen zij op hun aangezichten.","46":"En Mozes zeide tot Aäron: Neem het wierookvat, en doe vuur daarin van het altaar, en leg reukwerk daarop, haastelijk gaande tot de vergadering, doe over hen verzoening; want een grote toorn is van voor het aangezicht des HEEREN uitgegaan, de plaag heeft aangevangen.","47":"En Aäron nam het, gelijk als Mozes gesproken had, en liep in het midden der gemeente, en ziet, de plaag had aangevangen onder het volk; en hij leide reukwerk daarin, en deed verzoening over het volk.","48":"En hij stond tussen de doden en tussen de levenden; alzo werd de plaag opgehouden.","49":"Die nu aan die plaag gestorven zijn, waren veertien duizend en zevenhonderd, behalve die gestorven waren om de zaak van Korach.","50":"En Aäron keerde weder tot Mozes aan de deur van de tent der samenkomst; en de plaag was opgehouden."},"KJV":{"1":"Now Korah, the son of Izhar, the son of Kohath, the son of Levi, and Dathan and Abiram, the sons of Eliab, and On, the son of Peleth, sons of Reuben, took","2":"And they rose up before Moses, with certain of the children of Israel, two hundred and fifty princes of the assembly, famous in the congregation, men of renown:","3":"And they gathered themselves together against Moses and against Aaron, and said unto them, *Ye take* too much upon you, seeing all the congregation *are* holy, every one of them, and the LORD *is* among them: wherefore then lift ye up yourselves above the congregation of the LORD?","4":"And when Moses heard *it*, he fell upon his face:","5":"And he spake unto Korah and unto all his company, saying, Even to morrow the LORD will shew who *are* his, and *who is* holy; and will cause *him* to come near unto him: even *him* whom he hath chosen will he cause to come near","6":"This do; Take you censers, Korah, and all his company;","7":"And put fire therein, and put incense in them before the LORD to morrow: and it shall be *that* the man whom the LORD doth choose, he *shall be* holy: *ye take* too much upon you, ye sons of Levi.","8":"And Moses said unto Korah, Hear, I pray you, ye sons of Levi:","9":"*Seemeth it but* a small thing unto you, that the God of Israel hath separated you from the congregation of Israel, to bring you near to himself to do the service of the tabernacle of the LORD, and to stand before the congregation to minister","10":"And he hath brought thee near *to him*, and all thy brethren the sons of Levi with thee: and seek ye the priesthood","11":"For which cause *both* thou and all thy company *are* gathered together against the LORD: and what *is* Aaron, that ye murmur","12":"And Moses sent to call Dathan and Abiram, the sons of Eliab: which said, We will not come up:","13":"*Is it* a small thing that thou hast brought us up out of a land that floweth with milk and honey, to kill us in the wilderness, except thou make thyself altogether a prince","14":"Moreover thou hast not brought us into a land that floweth with milk and honey, or given us inheritance of fields and vineyards: wilt thou put out the eyes of these men? we will not come up.","15":"And Moses was very wroth, and said unto the LORD, Respect not thou their offering: I have not taken one ass from them, neither have I hurt one","16":"And Moses said unto Korah, Be thou and all thy company before the LORD, thou, and they, and Aaron, to morrow:","17":"And take every man his censer, and put incense in them, and bring ye before the LORD every man his censer, two hundred and fifty censers; thou also, and Aaron, each *of you* his censer.","18":"And they took every man his censer, and put fire in them, and laid incense thereon, and stood in the door of the tabernacle of the congregation with Moses and Aaron.","19":"And Korah gathered all the congregation against them unto the door of the tabernacle of the congregation: and the glory of the LORD appeared unto all the congregation.","20":"And the LORD spake unto Moses and unto Aaron, saying,","21":"Separate yourselves from among this congregation, that I may consume them in a moment.","22":"And they fell upon their faces, and said, O God, the God of the spirits of all flesh, shall one man sin, and wilt thou be wroth with all the congregation?","23":"And the LORD spake unto Moses, saying,","24":"Speak unto the congregation, saying, Get you up from about the tabernacle of Korah, Dathan, and Abiram.","25":"And Moses rose up and went unto Dathan and Abiram; and the elders of Israel followed him.","26":"And he spake unto the congregation, saying, Depart, I pray you, from the tents of these wicked men, and touch nothing of theirs, lest ye be consumed in all their sins.","27":"So they gat up from the tabernacle of Korah, Dathan, and Abiram, on every side: and Dathan and Abiram came out, and stood in the door of their tents, and their wives, and their sons, and their little children.","28":"And Moses said, Hereby ye shall know that the LORD hath sent me to do all these works; for *I have* not *done them* of mine own mind.","29":"If these men die the common death of all men, or if they be visited after the visitation of all men; *then* the LORD hath not sent","30":"But if the LORD make a new thing, and the earth open her mouth, and swallow them up, with all that *appertain* unto them, and they go down quick into the pit; then ye shall understand that these men have provoked the LORD.","31":"And it came to pass, as he had made an end of speaking all these words, that the ground clave asunder","32":"And the earth opened her mouth, and swallowed them up, and their houses, and all the men that *appertained* unto Korah, and all *their* goods.","33":"They, and all that *appertained* to them, went down alive into the pit, and the earth closed upon them: and they perished from among the congregation.","34":"And all Israel that *were* round about them fled at the cry of them: for they said, Lest the earth swallow us up","35":"And there came out a fire from the LORD, and consumed the two hundred and fifty men that offered incense.","36":"And the LORD spake unto Moses, saying,","37":"Speak unto Eleazar the son of Aaron the priest, that he take up the censers out of the burning, and scatter thou the fire yonder; for they are hallowed.","38":"The censers of these sinners against their own souls, let them make them broad plates *for* a covering of the altar: for they offered them before the LORD, therefore they are hallowed: and they shall be a sign unto the children of Israel.","39":"And Eleazar the priest took the brasen censers, wherewith they that were burnt had offered; and they were made broad *plates for* a covering of the altar:","40":"*To be* a memorial unto the children of Israel, that no stranger, which *is* not of the seed of Aaron, come near to offer incense before the LORD; that he be not as Korah, and as his company: as the LORD said to him by the hand of Moses.","41":"But on the morrow all the congregation of the children of Israel murmured against Moses and against Aaron, saying, Ye have killed the people of the LORD.","42":"And it came to pass, when the congregation was gathered against Moses and against Aaron, that they looked toward the tabernacle of the congregation: and, behold, the cloud covered it, and the glory of the LORD appeared.","43":"And Moses and Aaron came before the tabernacle of the congregation.","44":"And the LORD spake unto Moses, saying,","45":"Get you up from among this congregation, that I may consume them as in a moment. And they fell upon their faces.","46":"And Moses said unto Aaron, Take a censer, and put fire therein from off the altar, and put on incense, and go quickly unto the congregation, and make an atonement for them: for there is wrath gone out from the LORD; the plague is begun.","47":"And Aaron took as Moses commanded, and ran 6\">man</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> doth <span class=\"wl wl-kjv\" data-code=\"H977\">choose,</span> he shall be <span class=\"wl wl-kjv\" data-code=\"H6918\">holy:</span> ye take too <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> upon you, ye <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of Levi.","8":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7141\">Korah,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear,</span> I pray you, ye <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of Levi:","9":"Seemeth it but a small <span class=\"wl wl-kjv\" data-code=\"H4592\">thing</span> unto you, that the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> hath <span class=\"wl wl-kjv\" data-code=\"H914\">separated</span> you from the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to bring you <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> to himself to <span class=\"wl wl-kjv\" data-code=\"H5647\">do</span> the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and to <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> to minister","10":"And he hath brought thee <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> to him, and all thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi</span> with thee: and <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> ye the priesthood","11":"For which <span class=\"wl wl-kjv\" data-code=\"H3651\">cause</span> both thou and all thy <span class=\"wl wl-kjv\" data-code=\"H5712\">company</span> are gathered <span class=\"wl wl-kjv\" data-code=\"H3259\">together</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and what is <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> that ye <span class=\"wl wl-kjv\" data-code=\"H3885\">murmur</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> <span class=\"wl wl-kjv\" data-code=\"H1885\">Dathan</span> and <span class=\"wl wl-kjv\" data-code=\"H48\">Abiram,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H446\">Eliab:</span> which <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We will not come up:","13":"Is it a small <span class=\"wl wl-kjv\" data-code=\"H4592\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">that</span> thou hast brought us <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that <span class=\"wl wl-kjv\" data-code=\"H2100\">floweth</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> us in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> except thou <span class=\"wl wl-kjv\" data-code=\"H8323\">make</span> thyself <span class=\"wl wl-kjv\" data-code=\"H8323\">altogether</span> a prince","14":"<span class=\"wl wl-kjv\" data-code=\"H637\">Moreover</span> thou hast not <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> us into a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that <span class=\"wl wl-kjv\" data-code=\"H2100\">floweth</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> or <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> us <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of <span class=\"wl wl-kjv\" data-code=\"H7704\">fields</span> and <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards:</span> wilt thou put <span class=\"wl wl-kjv\" data-code=\"H5365\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of these <span class=\"wl wl-kjv\" data-code=\"H582\">men?</span> we will not come up.","15":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">wroth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">Respect</span> not thou their <span class=\"wl wl-kjv\" data-code=\"H4503\">offering:</span> I have not <span class=\"wl wl-kjv\" data-code=\"H5375\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H2543\">ass</span> from them, neither have I <span class=\"wl wl-kjv\" data-code=\"H7489\">hurt</span> one","16":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7141\">Korah,</span> Be thou and all thy <span class=\"wl wl-kjv\" data-code=\"H5712\">company</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thou, and they, and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> to morrow:","17":"And <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H4289\">censer,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> in them, and <span class=\"wl wl-kjv\" data-code=\"H7126\">bring</span> ye <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H4289\">censer,</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H4289\">censers;</span> thou also, and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> <span class=\"wl wl-kjv\" data-code=\"H376\">each</span> of you his censer.","18":"And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H4289\">censer,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in them, and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> thereon, and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation</span> with <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and Aaron.","19":"And <span class=\"wl wl-kjv\" data-code=\"H7141\">Korah</span> <span class=\"wl wl-kjv\" data-code=\"H6950\">gathered</span> all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> against them unto the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> unto all the congregation.","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> saying,","21":"<span class=\"wl wl-kjv\" data-code=\"H914\">Separate</span> yourselves from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> this <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> them in a moment.","22":"And they <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirits</span> of all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> shall <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> and wilt thou be <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth</span> with all the congregation?","23":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","24":"<span class=\"wl wl-kjv\" data-code=\"H1696\">Speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Get you <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> of <span class=\"wl wl-kjv\" data-code=\"H7141\">Korah,</span> <span class=\"wl wl-kjv\" data-code=\"H1885\">Dathan,</span> and Abiram.","25":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> unto <span class=\"wl wl-kjv\" data-code=\"H1885\">Dathan</span> and <span class=\"wl wl-kjv\" data-code=\"H48\">Abiram;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">followed</span> him.","26":"And he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">Depart,</span> I pray you, from the <span class=\"wl wl-kjv\" data-code=\"H168\">tents</span> of these <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H5060\">touch</span> nothing of theirs, lest ye be <span class=\"wl wl-kjv\" data-code=\"H5595\">consumed</span> in all their sins.","27":"So they gat <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> of <span class=\"wl wl-kjv\" data-code=\"H7141\">Korah,</span> <span class=\"wl wl-kjv\" data-code=\"H1885\">Dathan,</span> and <span class=\"wl wl-kjv\" data-code=\"H48\">Abiram,</span> on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side:</span> and <span class=\"wl wl-kjv\" data-code=\"H1885\">Dathan</span> and <span class=\"wl wl-kjv\" data-code=\"H48\">Abiram</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of their <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and their <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and their little children.","28":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Hereby ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all these <span class=\"wl wl-kjv\" data-code=\"H4639\">works;</span> for I have not done them of mine own mind.","29":"If these men <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> the common <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> of all <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> or if they be <span class=\"wl wl-kjv\" data-code=\"H6485\">visited</span> after the <span class=\"wl wl-kjv\" data-code=\"H6486\">visitation</span> of all <span class=\"wl wl-kjv\" data-code=\"H120\">men;</span> then the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath not sent","30":"But if the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1254\">make</span> a new <span class=\"wl wl-kjv\" data-code=\"H1278\">thing,</span> and the <span class=\"wl wl-kjv\" data-code=\"H127\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H6475\">open</span> her <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and swallow them <span class=\"wl wl-kjv\" data-code=\"H1104\">up,</span> with all that appertain unto them, and they go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">quick</span> into the <span class=\"wl wl-kjv\" data-code=\"H7585\">pit;</span> then ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">understand</span> that these <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> have <span class=\"wl wl-kjv\" data-code=\"H5006\">provoked</span> the LORD.","31":"And it came to pass, as he had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> that the <span class=\"wl wl-kjv\" data-code=\"H127\">ground</span> clave asunder","32":"And the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> her <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and swallowed them <span class=\"wl wl-kjv\" data-code=\"H1104\">up,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> that appertained unto <span class=\"wl wl-kjv\" data-code=\"H7141\">Korah,</span> and all their goods.","33":"They, and all that appertained to them, went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">alive</span> into the <span class=\"wl wl-kjv\" data-code=\"H7585\">pit,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H3680\">closed</span> upon them: and they <span class=\"wl wl-kjv\" data-code=\"H6\">perished</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the congregation.","34":"And all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that were round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> them <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> at the <span class=\"wl wl-kjv\" data-code=\"H6963\">cry</span> of them: for they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Lest the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> swallow us up","35":"And there came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> the two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H7126\">offered</span> incense.","36":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","37":"<span class=\"wl wl-kjv\" data-code=\"H559\">Speak</span> unto <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> that he take <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4289\">censers</span> <span class=\"wl wl-kjv\" data-code=\"H996\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H8316\">burning,</span> and <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> thou the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> <span class=\"wl wl-kjv\" data-code=\"H1973\">yonder;</span> for they are hallowed.","38":"The <span class=\"wl wl-kjv\" data-code=\"H4289\">censers</span> of these <span class=\"wl wl-kjv\" data-code=\"H2400\">sinners</span> against their own <span class=\"wl wl-kjv\" data-code=\"H5315\">souls,</span> let them <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> them <span class=\"wl wl-kjv\" data-code=\"H7555\">broad</span> <span class=\"wl wl-kjv\" data-code=\"H6341\">plates</span> for a <span class=\"wl wl-kjv\" data-code=\"H6826\">covering</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar:</span> for they <span class=\"wl wl-kjv\" data-code=\"H7126\">offered</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> therefore they are <span class=\"wl wl-kjv\" data-code=\"H6942\">hallowed:</span> and they shall be a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","39":"And <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H4289\">censers,</span> wherewith they that were <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> had <span class=\"wl wl-kjv\" data-code=\"H7126\">offered;</span> and they were made <span class=\"wl wl-kjv\" data-code=\"H7554\">broad</span> plates for a <span class=\"wl wl-kjv\" data-code=\"H6826\">covering</span> of the altar:","40":"To be a <span class=\"wl wl-kjv\" data-code=\"H2146\">memorial</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">that</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">stranger,</span> which is not of the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> come <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H6999\">offer</span> <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> that he be not as <span class=\"wl wl-kjv\" data-code=\"H7141\">Korah,</span> and as his <span class=\"wl wl-kjv\" data-code=\"H5712\">company:</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> to him by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of Moses.","41":"But on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow</span> all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">murmured</span> against <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and against <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye have <span class=\"wl wl-kjv\" data-code=\"H4191\">killed</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the LORD.","42":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> was <span class=\"wl wl-kjv\" data-code=\"H6950\">gathered</span> against <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and against <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> that they <span class=\"wl wl-kjv\" data-code=\"H6437\">looked</span> toward the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation:</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> it, and the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> appeared.","43":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.","44":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","45":"Get you <span class=\"wl wl-kjv\" data-code=\"H7426\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> this <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> them as in a <span class=\"wl wl-kjv\" data-code=\"H7281\">moment.</span> And they <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon their faces.","46":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> a <span class=\"wl wl-kjv\" data-code=\"H4289\">censer,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> therein from <span class=\"wl wl-kjv\" data-code=\"H6440\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> on <span class=\"wl wl-kjv\" data-code=\"H7004\">incense,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H4120\">quickly</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> and make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for them: for there is <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> the <span class=\"wl wl-kjv\" data-code=\"H5063\">plague</span> is begun.","47":"And <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> as <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">commanded,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> into the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation;</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H5063\">plague</span> was <span class=\"wl wl-kjv\" data-code=\"H2490\">begun</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> on <span class=\"wl wl-kjv\" data-code=\"H7004\">incense,</span> and made an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for the people.","48":"And he <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> between the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> and the <span class=\"wl wl-kjv\" data-code=\"H2416\">living;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4046\">plague</span> was stayed.","49":"Now they that <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> in the <span class=\"wl wl-kjv\" data-code=\"H4046\">plague</span> were <span class=\"wl wl-kjv\" data-code=\"H702\">fourteen</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> beside them that <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> about the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> of Korah.","50":"And <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4046\">plague</span> was stayed."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Korach nu,","tekst":"Deze was het hoofd van de samenrotting en beroerte, [ vs.22, 49], wien het nochtans het minst betaamde, als zijnde een Leviet, gelijk hier en onder, vs.5,6 te zien is."},{"catchword":"On,","tekst":"Die hierna niet meer werd genoemd; waaruit sommigen afnemen dat hij zich beter bedacht en bekeerd heeft."},{"catchword":"zonen van Ruben","tekst":"Of, kinderen; dat is, nakomelingen van Ruben. Dit is te verstaan van Dathan, Abiram en On, Ruben was wel de eerstgeborene, maar had het recht der eerstgeboorte door zijn schandelijke misdaad verloren; hoewel dezen [zoals het schijnt] daarop te moediger zijn geweest, gelijk Korach op de afkomst van Levi."}],"2":[{"catchword":"stonden op","tekst":"Dat is, zij stonden op tegen Mozes, samenspannende als onder zijn ogen, of in zijn tegenwoordigheid."},{"catchword":"oversten der vergadering,","tekst":"Zodanigen hadden zij aan zich getrokken, om hun voornemen bij de gemeente aanzienlijk te maken."},{"catchword":"de geroepenen der samenkomst,","tekst":"Zie Num 1:16."},{"catchword":"mannen van naam","tekst":"Zie Gen 6:4."}],"3":[{"catchword":"Het is te veel voor u,","tekst":"Hebreeuws, veel voor ulieden, of ulieden veel; dat is, het is genoeg, of, te veel voor u beiden [vergelijk Eze 44:6 ] , want de andere Israëlieten zijn even goed en even na tot het priesterdom en de regering als gij beiden."},{"catchword":"gijlieden u over de gemeente","tekst":"Mozes [willen zij zeggen] in de politie en Aäron in het priesterdom."}],"4":[{"catchword":"viel hij op zijn aangezicht","tekst":"Zeer ontsteld en bedroefd zijnde, en zuchtende tot God, dat Hij dit gruwelijk oproer wilde stillen."}],"5":[{"catchword":"sprak tot Korach,","tekst":"Door Gods ingeven en besturing, met een vast vertrouwen van een goede uitkomst in deze zaak, gesterkt en welberaden zijnde."},{"catchword":"vergadering,","tekst":"Allen, die bij hem vergaderd waren, zijn ganse rot."},{"catchword":"wie de Zijne,","tekst":"Wien Hij tot het priesterdom verkoren heeft."},{"catchword":"verkoren zal hebben,","tekst":"Hebreeuws, verkiezen zal; dat is, betonen zal verkoren te hebben; alzo in het volgende."}],"7":[{"catchword":"morgen vuur daarin,","tekst":"Te weten, vroeg, gelijk vs.5 gezegd is."},{"catchword":"Het is te veel voor u,","tekst":"Dat is, gij behoort met uw deel [waarvan in de volgende verzen gesproken wordt] wel tevreden te zijn; of, het is hoog en ver genoeg, houdt op en staat af van dit kwade voornemen."}],"9":[{"catchword":"doen naderen;","tekst":"Zie boven, Num 3:6-8, Num 3:11-12, enz."}],"12":[{"catchword":"te roepen;","tekst":"Willende beproeven of hij hen met redenen, vermaningen en bestraffingen [gelijk aan Korach en de anderen, hoewel tevergeefs, geschied was] mocht bewegen tot afstand."},{"catchword":"zeiden","tekst":"Lieten Mozes voor antwoord wederzeggen."}],"13":[{"catchword":"land,","tekst":"Egypteland."},{"catchword":"ten enenmaal","tekst":"Hebreeuws, uzelven tot een overheer of vorst maakt, ook uzelven tot een overheer makende."}],"14":[{"catchword":"dat van melk en honig vloeit,","tekst":"Waarvan gij zoveel gesproken hebt, willen zij zeggen. Zie Exo 13:5; Lev 20:24, enz."},{"catchword":"ogen dezer mannen uitgraven?","tekst":"Dat is, blinddoeken, gelijk men zegt, verstand en oordeel bedwelmen, dat zij uw bedrog niet zouden merken."}],"15":[{"catchword":"ontstak Mozes zeer,","tekst":"Hebreeuws, ontstak den Mozes; te weten, den toorn. Versta, een heilige toornigheid, uit groten ijver voor Gods eer, tegen deze vijanden Gods en zijn instelling. Vergelijk Gen 4:5."},{"catchword":"Zie hun offer niet aan","tekst":"Vergelijk Gen 4:4. Anders, spijsoffer"},{"catchword":"een ezel van hen genomen,","tekst":"Hij wil zeggen: ik heb niemand van hen in het minst verkort of enig leed aangedaan, maar ter contrarie hen niet dan alles goeds gewild en gedaan. Vergelijk 1Sa 12:3."}],"19":[{"catchword":"hen verzamelen,","tekst":"Mozes en Aäron."},{"catchword":"de heerlijkheid des HEEREN","tekst":"In de wolkkolom, die een wonderlijk teken was van de bijzondere tegenwoordigheid Gods. Alzo onder, vs.42."}],"21":[{"catchword":"ogenblik verteren","tekst":"Dat is, zeer haast; alzo onder, vs.45."}],"22":[{"catchword":"geesten","tekst":"Dat is, der zielen, die Gij geschapen hebt, zijnde alzo de auteur des levens. Alzo wordt geest voor ziel genomen, Psa 31:6, en Psa 146:4; Ecc 12:7; Luk 8:55, en Luk 23:46; Act 7:59; Heb 12:9."},{"catchword":"vlees","tekst":"Dat is, aller mensen. Zie Gen 6:12."},{"catchword":"een enig man zal gezondigd hebben,","tekst":"Namelijk, Korach. Zie boven, vs.1, en onder, vs.49."}],"26":[{"catchword":"in al hun zonden","tekst":"Dat is, in de straf, die hun vanwege al hun zonden overkomen zal. Zie Gen 4:13."}],"27":[{"catchword":"met hun vrouwen,","tekst":"Dat is, met hun ganse huisgezinnen."}],"28":[{"catchword":"dat zij niet uit mijn eigen hart zijn","tekst":"Dat is, dat ik die niet van mijzelven versierd en uit eigen wil, of op mijn eigen autoriteit gedaan heb. Vergelijk onder, Num 24:13; Eze 13:2, met de aantekeningen."}],"29":[{"catchword":"gelijk alle mensen sterven,","tekst":"Dat is, op een algemene, bekende, gewone wijze."},{"catchword":"bezoeking zal gedaan worden,","tekst":"Dat is, indien zij met een algemene, bekende of gewone plaag van God gestraft worden."},{"catchword":"zo heeft mij de HEERE niet gezonden","tekst":"Dat is, zo zal daaruit blijken dat mij de HEERE niet gezonden heeft."}],"30":[{"catchword":"nieuws zal scheppen,","tekst":"Hebreeuws, een schepping zal scheppen; dat is, door zijn goddelijke almacht een nieuw en tevoren ongehoord wonderwerk zal doen. Zie Gen 1:1."},{"catchword":"helle zullen nedervaren;","tekst":"Of, in het graf, in de groef, kuil, put, enz. Dat is, in de kloof, die door Gods kracht in het aardrijk gescheurd zou worden. Van het Hebreeuwse woord Scheol zie Gen 37:35, en vergelijk Psa 55:16."}],"32":[{"catchword":"alle mensen,","tekst":"Uitgezonderd de zonen van Korach, welke niet zijn omgekomen, als dienende misschien te dezer tijd in de tent der samenkomst, en van huns vaders oproerig voornemen niet wetende, of immers hetzelve niet toestemmende. Zie onder, Num 26:11; 1Ch 6:22, 1Ch 6:37."}],"33":[{"catchword":"alles wat hunner was,","tekst":"Of, allen die hun toebehoorden"},{"catchword":"helle;","tekst":"Zie vs.30."}],"35":[{"catchword":"tweehonderd en vijftig mannen,","tekst":"Zie boven, vs.2, 16, 18."}],"37":[{"catchword":"verre weg;","tekst":"Of, ginds, ginderheen; dat is, doe het strooien, geef last dat men het strooie buiten het leger aan de plaats, waar men de as stortte, gelijk sommigen verstaan."},{"catchword":"zij zijn heilig;","tekst":"Te weten, de wierookvaten [gelijk volgt] in welke deze mannen, op Mozes' bevel, vuur en reukwerk voor den HEERE hadden gebracht."}],"38":[{"catchword":"die tegen hun zielen gezondigd hebben;","tekst":"Dat is, die door de gruwelijke zonde het verderf zichzelven op den hals gehaald hebben. Vergelijk 1Ki 2:23; Pro 20:2."},{"catchword":"uitgerekte platen daarvan make,","tekst":"Hebreeuws, uittrekking van platen. Versta, dat men die door slaan uitrekken zou, om alzo brede platen er van te maken."},{"catchword":"teken zijn","tekst":"Tot een gedenkteken van deze goddelijke wraak over zodanige oproermakers, die zich tegen Gods ordinantie gesteld hadden, opdat een ieder zich voor zulk kwaad lere wachten. Zie vs.40."}],"40":[{"catchword":"worde als Korach,","tekst":"Dat is, dat het hem niet ga gelijk Korach, enz."},{"catchword":"dienst van Mozes"," such he had drawn in unto him, to make their design the more taking and authorized among the commons] the called (ones) of the Assembly; [see Numb.4.on v. 16.] men of name. [see Genesis.6.4.]"}],"3":[{"catchword":null,"tekst":"And they gathered themselves together against Moseh, and against Aaron, and said unto them; It is too much for you; [Hebrew much for you: or, you much, i.e. it is enough, or too much for you both: (Compare Ezek. 44.6.) for the rest of the Israelites are as good, and have as good a right and interest in the priesthood and interest in the priesthood and Government, as you two can have, which the sense of the following, words in the Text] for this whole Congregation, they all, are holy, and the LORD is in the LORD is in the midst of them: wherefore then do ye exalt your selves over the Congregation if the LORD? [meaning, that Moseh took upon him the Government, and Aaron the Priesthood.]"}],"4":[{"catchword":null,"tekst":"When Moseh heard this, he fell down upon his face. [As being much troubled and grieved here at, and signing to God, for the appeasing of this dreadful sedition.]"}],"5":[{"catchword":null,"tekst":"And he spake to Korah, [Inspired and encouraged by God, with a strong confidence of a good issue in this affair, and being thereupon well advised, and resolved how to carry himself] and to his whole Congregation, [i.e. to all that had gathered themselves to and about him, the whole fray of them] saying, tomorrow morning the LORD shall make it known, who is his, and the holy one, whom he shall cause to approach unto himself, [i.e. he whom God hath chosen for the Priesthood] and him whom he shall have chosen, [Hebrew shall choose, i.e. shew and manifest to have chosen: and so in the sequel] him be shall cause to approach to himself."}],"6":[{"catchword":null,"tekst":"Do this: take ye censers of Frankincense, Korah and all his Congregation:"}],"7":[{"catchword":null,"tekst":"And put fire therein tomorrow, [viz. in the morning, as was said (function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>

  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
