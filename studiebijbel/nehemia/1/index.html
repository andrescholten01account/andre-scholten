en zijn met vuur verbrand.", "4": "En het gebeurde, toen ik deze woorden hoorde, dat ik neerzat, en huilde, en rouw bedreef, enkele dagen; en ik vastte en bad voor het aangezicht van de God van de hemel.", "5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "6": "Laat toch Uw oor opmerkzaam, en Uw ogen open zijn, om te horen naar het gebed van Uw dienaar, dat ik vandaag voor Uw aangezicht bid, dag en nacht, voor de kinderen van Israël, Uw dienaren; en ik doe belijdenis over de zonden van de kinderen van Israël, die wij tegen U gezondigd hebben; ook ik en het huis van mijn vader, wij hebben gezondigd.", "7": "Wij hebben het helemaal tegen U verdorven; en wij hebben niet gehouden de geboden, noch de inzettingen, noch de rechten, die U Uw dienaar Mozes geboden hebt.", "8": "Denk toch aan het woord, dat U Uw dienaar Mozes geboden hebt, en zei: Als u ontrouw wordt, zal Ik u onder de volken verstrooien.", "9": "Maar als u zich tot Mij bekeert, en Mijn geboden houdt, en die doet; al waren uw verdrevenen aan het einde van de hemel, Ik zal hen vandaar verzamelen, en zal ze brengen naar de plaats die Ik gekozen heb om Mijn Naam daar te doen wonen.", "10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "11": "Och, Heere, laat toch Uw oor opmerkzaam zijn op het gebed van Uw dienaar, en op het gebed van Uw dienaren, die ernaar verlangen Uw Naam te vrezen; en laat het Uw dienaar vandaag toch goed lukken, en geef hem barmhartigheid voor het aangezicht van deze man. Ik was namelijk de schenker van de koning."}, "SV": {"1": "De geschiedenissen van Nehemia, zoon van Hachalja. En het geschiedde in de maand Chisleu, in het twintigste jaar, als ik te Susan in het paleis was;", "2": "Zo kwam Hanani, een van mijn broederen, hij en *sommige* mannen uit Juda, en ik vraagde hen naar de Joden, die ontkomen waren (die overgebleven waren van de gevangenis), en naar Jeruzalem.", "3": "En zij zeiden tot mij: De overgeblevenen, die van de gevangenis aldaar in het landschap zijn overgebleven, zijn in grote ellende en in versmaadheid; en Jeruzalems muur is verscheurd, en haar poorten zijn met vuur verbrand.", "4": "En het geschiedde, als ik deze woorden hoorde, zo zat ik neder, en weende, en bedreef rouw, *enige* dagen; en ik was vastende en biddende voor het aangezicht van den God des hemels.", "5": "En ik zeide: Och, HEERE, God des hemels, Gij, grote en vreselijke God! Die het verbond en de goedertierenheid houdt dien, die Hem liefhebben, en Zijn geboden houden.", "6": "Laat toch Uw oor opmerkende, en Uw ogen open zijn, om te horen naar het gebed Uws knechts, dat ik heden voor Uw aangezicht bid, dag en nacht, voor de kinderen Israëls, Uw knechten; en ik doe belijdenis over de zonden der kinderen Israëls, die wij tegen U gezondigd hebben; ook ik en mijns vaders huis, wij hebben gezondigd.", "7": "Wij hebben het ganselijk tegen U verdorven; en wij hebben niet gehouden de geboden, noch de inzettingen, noch de rechten, die Gij Uw knecht Mozes geboden hebt.", "8": "Gedenk toch des woords, dat Gij Uw knecht Mozes geboden hebt, zeggende: Gijlieden zult overtreden, Ik zal u onder de volken verstrooien.", "9": "En gij zult u tot Mij bekeren, en Mijn geboden houden, en die doen; al waren uw verdrevenen aan het einde des hemels, Ik zal hen vandaar verzamelen, en zal ze brengen tot de plaats, die Ik verkoren heb, om Mijn Naam aldaar te doen wonen.", "10": "Zij zijn toch Uw knechten en Uw volk, dat Gij verlost hebt door Uw grote kracht en door Uw sterke hand.", "11": "Och, Heere, laat toch Uw oor opmerkende zijn op het gebed Uws knechts, en op het gebed Uwer knechten, die lust hebben Uw Naam te vrezen; en doe het toch Uw knecht heden wel gelukken, en geef hem barmhartigheid voor het aangezicht dezes mans. Ik nu was des konings schenker."}, "KJV": {"1": "The words of Nehemiah the son of Hachaliah. And it came to pass in the month Chisleu, in the twentieth year, as I was in Shushan the palace,", "2": "That Hanani, one of my brethren, came, he and *certain* men of Judah; and I asked them concerning the Jews that had escaped, which were left of the captivity, and concerning Jerusalem.", "3": "And they said unto me, The remnant that are left of the captivity there in the province *are* in great affliction and reproach: the wall of Jerusalem also *is* broken down, and the gates thereof are burned with fire.", "4": "And it came to pass, when I heard these words, that I sat down and wept, and mourned *certain* days, and fasted, and prayed before the God of heaven,", "5": "And said, I beseech thee, O LORD God of heaven, the great and terrible God, that keepeth covenant and mercy for them that love him and observe his commandments:", "6": "Let thine ear now be attentive, and thine eyes open, that thou mayest hear the prayer of thy servant, which I pray before thee now, day and night, for the children of Israel thy servants, and confess the sins of the children of Israel, which we have sinned against thee: both I and my father's house have sinned.", "7": "We have dealt very corruptly against thee, and have not kept the commandments, nor the statutes, nor the judgments, which thou commandedst thy servant Moses.", "8": "Remember, I beseech thee, the word that thou commandedst thy servant Moses, saying, *If* ye transgress, I will scatter you abroad among the nations:", "9": "But *if* ye turn unto me, and keep my commandments, and do them; though there were of you cast out unto the uttermost part of the heaven, *yet* will I gather them from thence, and will bring them unto the place that I have chosen to set my name", "10": "Now these *are* thy servants and thy people, whom thou hast redeemed by thy great power, and by thy strong hand.", "11": "O Lord, I beseech thee, let now thine ear be attentive to the prayer of thy servant, and to the prayer of thy servants, who desire to fear thy name: and prosper, I pray thee, thy servant this day, and grant him mercy in the sight of this man. For I was the king's cupbearer."}}, "tsk": {"2": [{"kopje": "Hanani", "refs": ["Neh 7:2"]}, {"kopje": "ik vroeg", "refs": ["Ps 122:6-9", "Ps 137:5", "Ps 137:6"]}, {"kopje": "die ontkomen waren", "refs": ["Ezra 9:8", "Ezra 9:9", "Ezra 9:14", "Jer 44:14", "Ezech 6:9", "Ezech 7:16", "Ezech 24:26", "Ezech 24:27"]}], "3": [{"kopje": "het gebied", "refs": ["Neh 7:6", "Neh 11:3", "Ezra 2:1", "Ezra 5:8", "Est 1:1"]}, {"kopje": "in grote", "refs": ["Neh 9:36", "Neh 9:37", "Ps 44:12-15", "Ps 137:1-3", "Jes 32:9-14", "Klaagl 1:7", "Klaagl 3:61", "Klaagl 5:1"]}, {"kopje": "smaad", "refs": ["1 Kon 9:7", "Ps 79:4", "Jes 43:28", "Jer 24:9", "Jer 29:18", "Jer 42:18", "Jer 44:8-12"]}, {"kopje": "de muur", "refs": ["Neh 2:17", "2 Kon 25:10", "Jes 5:5", "Jes 64:10", "Jes 64:11", "Jer 5:10", "Jer 39:8", "Jer 52:14"]}], "4": [{"kopje": "ik neerzat", "refs": ["1 Sam 4:17-22", "Ezra 10:1", "Ps 69:10", "Ps 69:11", "Ps 102:14", "Ps 102:15", "Ps 137:1", "Dan 9:3", "Zef 3:18", "Rom 12:15"]}, {"kopje": "de God", "refs": ["Neh 2:4", "Ezra 5:11", "Ezra 5:12", "Dan 2:18", "Jona 1:9"]}], "5": [{"kopje": "grote", "refs": ["Neh 4:14", "Deut 7:21", "1 Kron 17:21", "Ps 47:3", "Dan 9:4-19"]}, {"kopje": "houdt", "refs": ["Ex 20:6", "Deut 7:9", "1 Kon 8:23", "Hebr 6:13-18"]}], "6": [{"kopje": "Uw oor", "refs": ["1 Kon 8:28", "1 Kon 8:29", "2 Kron 6:40", "Ps 34:16", "Ps 130:2", "Dan 9:17", "Dan 9:18"]}, {"kopje": "dag en nacht", "refs": ["1 Sam 15:11", "Ps 55:18", "Ps 88:2", "Luk 2:37", "Luk 18:7", "1 Tim 5:5", "2 Tim 1:3"]}, {"kopje": "doe belijdenis", "refs": ["Ezra 9:6", "Ezra 9:7", "Ezra 10:11", "Ps 32:5", "Jes 64:6", "Jes 64:7", "Klaagl 3:39-42", "Dan 9:4", "Dan 9:20", "1 Joh 1:9"]}, {"kopje": "ook ik", "refs": ["2 Kron 28:10", "2 Kron 29:6", "Ps 106:6", "Jes 6:5", "Klaagl 5:7", "Ef 2:3"]}], "7": [{"kopje": "verdorven", "refs": ["Neh 9:29-35", "Ps 106:6", "Dan 9:5", "Dan 9:6"]}, {"k  "href": "../../nehemia/2/#v1", "ref": "Neh 2:1", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ps 119:60": "Ik heb gehaast, en niet vertraagd Uw geboden te onderhouden.", "1 Kon 8:56": "Geloofd zij de HEERE, Die aan Zijn volk Israël rust gegeven heeft, naar alles wat Hij gesproken heeft! Niet één woord is er gevallen van al Zijn goede woorden, die Hij gesproken heeft door de dienst van Mozes, Zijn dienaar.", "Jer 50:5": "Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten.", "Mal 3:6": "Want Ik, de HEERE, word niet veranderd; daarom zijn u, kinderen van Jakob, niet verteerd.", "Ps 93:1": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Ps 62:6-8": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Ex 32:11": "Doch Mozes smeekte de HEERE zijn God, en zei: O HEERE, waarom zou Uw toorn ontsteken tegen Uw volk, dat Gij met grote kracht en met een sterke hand uit Egypteland hebt uitgevoerd?", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Hos 14:2": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.", "Gen 32:9-12": "Verder zei Jakob: O, God van mijn vader Abraham, en God van mijn vader Izak, o HEERE! Die tegen mij gezegd hebt: Keer terug naar uw land en naar uw familie, en Ik zal u goeddoen! Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden! Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "2 Kor 7:9-11": "Nu verblijd ik mij, niet omdat u bedroefd bent geweest, maar omdat u bedroefd bent geweest tot bekering; want u bent bedroefd geweest naar God, zodat u in geen ding schade van ons geleden hebt. Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood. Want zie, ditzelfde, dat u naar God bedroefd bent geworden, hoe grote naarstigheid heeft dat in u gewerkt? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt u uzelf bewezen rein te zijn in deze zaak.", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "Ex 32:15": "En Mozes keerde zich om, en klom van de berg af, met de twee tafelen van de getuigenis in zijn hand; deze tafelen waren aan beide kanten beschreven, aan de ene en aan de andere kant beschreven.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "Jer 33:25": "Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld;", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Ps 106:7": "Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee.", "Joh 10:27": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij.", "Dan 9:5": "Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten.", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "2 Kron 20:6": "En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Ps 18:2-4": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Luk 18:10-14": "Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar. Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Ef 2:3": "onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen;", "Neh 8:2": "verzamelde het hele volk zich als één man op het plein voor de Waterpoort; en zij zeiden tegen Ezra, de schriftgeleerde, dat hij het boek van de wet van Mozes zou halen, die de HEERE aan Israël geboden had.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Gen 40:21": "En hij liet de leider van de schenkers terugkeren tot zijn schenkambt, zodat hij de beker in Farao's hand gaf.", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Ps 111:6": "Caph. Hij heeft de kracht van Zijn werken aan Zijn volk bekendgemaakt; Lamed. door hun de erve van de heidenen te geven.", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "Luk 13:1-5": "En er waren in diezelfde tijd enigen aanwezig, die Hem vertelden van de Galileeërs, van wie Pilatus het bloed met hun offers gemengd had. En Jezus antwoordde en zei tegen hen: Denkt u dat deze Galileeërs meer zondaars zijn geweest dan alle andere Galileeërs, omdat zij zulke dingen hebben geleden? Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Ex 20:22": "Toen zei de HEERE tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: U hebt gezien dat Ik met u vanuit de hemel gesproken heb.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Ezra 9:7": "Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag.", "Lev 5:5": "Het zal dan gebeuren, als hij aan een van die dingen schuldig is, dat hij zal belijden waarin hij gezondigd heeft;", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "Job 7:20": "Heb ik gezondigd, wat zal ik U doen, o Mensenhoeder? Waarom hebt U mij tot een mikpunt voor Uzelf gesteld, dat ik mijzelf tot een last ben?", "Joz 24:24": "En het volk zei tegen Jozua: Wij zullen de HEERE, onze God, dienen, en wij zullen Zijn stem gehoorzamen.", "Jona 1:9": "En hij zei tegen hen: Ik ben een Hebreeër; en ik vrees de HEERE, de God van de hemel, Die de zee en het droge gemaakt heeft.", "Deut 30:2-5": "En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had. Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "1 Kon 8:25": "En nu, HEERE, God van Israël, houd Uw dienaar, mijn vader David, wat U tot hem gesproken hebt, en zei: Er zal u geen man van voor Mijn aangezicht afgesneden worden, die op de troon van Israël zit; alleen als uw zonen hun weg bewaren, om te wandelen voor Mijn aangezicht, zoals u gewandeld hebt voor Mijn aangezicht.", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "1 Joh 5:2": "Hieraan weten wij, dat wij de kinderen van God liefhebben, wanneer wij God liefhebben, en Zijn geboden bewaren.", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "Ps 144:5": "Buig Uw hemelen, HEERE, en daal neer; raak de bergen aan, zodat ze roken.", "Est 2:5": "Er was een Joodse man op de burg Susan, wiens naam was Mordechai, een zoon van Jaïr, de zoon van Simeï, de zoon van Kis, een man van Jemini;", "Amos 9:6": "Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Ps 119:97": "Mem. Hoe lief heb ik Uw wet! Zij is mijn betrachting de hele dag.", "Ps 119:56": "Dat is mij gebeurd, omdat ik Uw bevelen bewaard heb.", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "Jes 59:12-15": "Want onze overtredingen zijn talrijk voor U, en onze zonden getuigen tegen ons; want onze overtredingen zijn bij ons, en onze ongerechtigheden kennen wij; het overtreden en het liegen tegen de HEERE, en het achterwaarts wijken van onze God; het spreken van onderdrukking en afval, het ontvangen en het uitspreken van valse woorden uit het hart. Daarom is het recht achterwaarts geweken, en de gerechtigheid staat ver weg; want de waarheid struikelt op de straat, en wat recht is, kan er niet ingaan.", "Hebr 6:13-19": "Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren, en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken. En zo heeft hij, nadat hij geduldig volhard had, de belofte verkregen.", "Jes 38:15": "Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Neh 2:17": "Toen zei ik tegen hen: U ziet de ellende waarin wij zijn, dat Jeruzalem woest is, en haar poorten met vuur verbrand zijn; komt, laten wij Jeruzalems muur opbouwen, zodat wij niet langer een smaad zijn.", "Mark 3:35": "Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "1 Kon 9:6": "Maar als u zich helemaal afkeert, u en uw kinderen, van Mij, om Mij niet meer te volgen, en Mijn geboden en Mijn inzettingen, die Ik voor uw aangezicht gegeven heb, niet houdt, maar heengaat en andere goden dient, en u voor hen neerbuigt;", "Jer 52:14": "En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "Ps 88:3": "Laat mijn gebed voor Uw aangezicht komen; neig Uw oor tot mijn geschrei.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Est 4:16": "Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.", "Lev 26:33-46": "Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn. Dan zal het land aan zijn sabbatten een welgevallen hebben, al de dagen van de verwoesting, terwijl u in het land van uw vijanden bent; dan zal het land rusten, en aan zijn sabbatten een welgevallen hebben. Al de dagen van de verwoesting zal het rusten, omdat het niet rustte in uw sabbatten, toen u daarin woonde.", "Deut 4:30": "Wanneer u in angst zult zijn, en al deze dingen u zullen treffen, in de laatste dagen, dan zult u terugkeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn.", "Ezech 18:23": "Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "Job 33:26-28": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven. Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat; Maar God heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet.", "Dan 2:18": "opdat zij van de God van de hemel barmhartigheid zouden vragen over dit geheim, zodat Daniël en zijn metgezellen niet zouden omkomen met de overige wijzen van Babel.", "Dan 9:18": "Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "1 Kon 8:26": "Nu dan, o God van Israël, laat toch Uw woord waar worden, dat U gesproken hebt tot Uw dienaar, mijn vader David.", "Jes 40:24": "Ja, zij worden niet geplant, ja, zij worden niet gezaaid, ja, hun afgehouwen stam wortelt niet in de aarde; ook als Hij op hen waait, zullen zij verdorren, en een stormwind zal hen als een stoppel wegnemen.", "Job 39:37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Ps 122:6-9": "Bid om de vrede van Jeruzalem; het moet goed gaan met hen die u liefhebben. Vrede zij binnen uw vesting, welvaart in uw paleizen. Om mijn broeders en mijn vrienden zal ik nu zeggen: Vrede zij in u!", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "Ps 107:25": "Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.", "Ps 77:15": "U bent die God, Die wonderen doet; U hebt Uw sterkte bekendgemaakt onder de volken.", "Ezech 18:19": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "Hab 3:17-19": "Alhoewel de vijgenboom niet bloeien zal, en er geen vrucht aan de wijnstok zal zijn, dat het werk van de olijfboom liegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn; Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil. De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als die van de hinden, en Hij zal mij doen treden op mijn hoogten. Voor de koorleider, op mijn Neginoth.", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Ps 103:20": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord.", "Neh 2:1-20": "Toen gebeurde het in de maand Nisan, in het twintigste jaar van koning Arthahsasta, als er wijn voor hem was, dat ik de wijn opnam en aan de koning gaf; nu was ik nooit eerder treurig geweest voor hem. Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd, en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn?", "Ps 141:8": "Doch op U zijn mijn ogen, HEERE, Heere; op U vertrouw ik, ontbloot mijn ziel niet.", "Ps 77:17": "De wateren zagen U, o God! De wateren zagen U, zij beefden; ook waren de afgronden beroerd.", "1 Kon 8:20": "Zo heeft de HEERE Zijn woord bevestigd, dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op de troon van Israël, zoals de HEERE gesproken heeft; en ik heb een huis gebouwd voor de Naam van de HEERE, de God van Israël.", "Jer 12:15": "En het zal gebeuren, nadat Ik hen zal hebben uitgerukt, dat Ik zal terugkeren, en Mij over hen zal ontfermen; en Ik zal hen terugbrengen, ieder tot zijn erfenis, en ieder tot zijn land.", "Joël 2:17": "Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Gen 32:11": "Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Jes 1:27": "Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Deut 9:5": "Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft.", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "Lev 26:39-42": "En de overgeblevenen onder u zullen om hun ongerechtigheid in de landen van uw vijanden wegteren; ja, ook om de ongerechtigheden van hun vaderen zullen zij met hen wegteren. Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden;", "Amos 5:6": "Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Dan 9:9": "Bij de Heere, onze God, zijn de barmhartigheden en vergevingen, hoewel wij tegen Hem gerebelleerd hebben.", "Matt 5:19": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen.", "Rom 6:17": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;", "Ps 119:114": "U bent mijn Schuilplaats en mijn Schild; op Uw Woord heb ik gehoopt.", "Ps 18:19": "Zij hadden mij bejegend ten dage van mijn ongeval; maar de HEERE was mij tot een Steunsel.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Ezech 24:27": "Op diezelfde dag zal uw mond geopend worden tegenover hem die ontkomen is, en u zult spreken, en niet langer stom zijn; zo zult u voor hen tot een wonderteken zijn, en zij zullen weten, dat Ik de HEERE ben.", "Lev 26:40-42": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Joz 14:6-14": "Toen naderden de kinderen van Juda tot Jozua, te Gilgal, en Kaleb, de zoon van Jefunne, de Keneziet, zei tegen hem: U weet het woord dat de HEERE tot Mozes, de man van God, gesproken heeft te Kades-Barnea, vanwege mij, en vanwege u. Ik was veertig jaar oud, toen Mozes, de dienaar van de HEERE, mij uitgezonden heeft van Kades-Barnea om het land te verkennen, en ik hem antwoord bracht, zoals het in mijn hart was. Maar mijn broeders, die met mij opgegaan waren, deden het hart van het volk smelten; maar ik volhardde erin de HEERE, mijn God, na te volgen.", "Ps 73:28": "Maar wat mij aangaat, het is mij goed om dicht bij God te zijn; ik stel mijn vertrouwen op de Heere HEERE, om al Uw werken te vertellen.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Rom 11:32": "Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "Ex 2:25": "En God zag de kinderen van Israël aan, en God kende hen.", "Num 14:9": "Wees alleen niet opstandig tegen de HEERE! En vrees het volk van dit land niet; want zij zijn ons brood! Hun bescherming is van hen geweken, en de HEERE is met ons; vrees hen niet!", "Jer 44:14": "Zodat het overblijfsel van Juda, dat in Egypteland gekomen is om daar als vreemdelingen te verblijven, niemand zal hebben die ontkomt of overblijft; namelijk om terug te keren in het land van Juda, waarnaar hun ziel verlangt terug te keren, om daar te wonen; maar zij zullen er niet terugkeren, behalve wie ontkomen zullen.", "Zef 3:18": "De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.", "Joël 2:11": "En de HEERE verheft Zijn stem voor Zijn leger uit; want Zijn leger is zeer groot, want Hij is machtig, Hij die Zijn woord uitvoert; want de dag van de HEERE is groot en zeer vreselijk, en wie zal hem kunnen verdragen?", "Hand 13:32": "En wij verkondigen u de belofte, die aan de vaderen gedaan is,", "Hebr 11:16-39": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt. Door het geloof heeft Abraham, toen hij beproefd werd, Izak geofferd, en hij die de beloften ontvangen had, heeft zijn enige zoon geofferd, (tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Job 9:10": "Die grote dingen doet, die men niet doorzoeken kan; en wonderen, die men niet tellen kan.", "Jer 33:8": "En Ik zal hen reinigen van al hun ongerechtigheid, waarmee zij tegen Mij gezondigd hebben; en Ik zal al hun ongerechtigheden vergeven, waarmee zij tegen Mij gezondigd en waarmee zij tegen Mij overtreden hebben.", "Ps 90:1": "Een gebed van Mozes, de man van God. Heere! U bent ons geweest een Toevlucht van geslacht tot geslacht.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Ps 92:3": "Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten;", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Est 1:1": "Dit gebeurde in de dagen van Ahasveros (dit is de Ahasveros die regeerde van Indië tot aan Morenland toe, honderdzevenentwintig landschappen),", "Ps 38:4": "Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "Luk 12:38": "En als hij komt in de tweede nachtwake, of komt in de derde nachtwake, en hen zo aantreft, zalig zijn die dienstknechten.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Hab 3:15": "U betrad met Uw paarden de zee; het geweldige water werd een hoop.", "Ps 130:4": "Maar bij U is vergeving, opdat U gevreesd wordt.", "Ps 34:16": "Ain. De ogen van de HEERE zijn op de rechtvaardigen, en Zijn oren gericht op hun geroep.", "Ps 89:35": "Ik zal Mijn verbond niet ontheiligen, en wat uit Mijn lippen gegaan is, zal Ik niet veranderen.", "Jes 17:6": "Toch zal er een nalezing in overblijven, zoals bij het afschudden van de olijfboom, twee of drie bezien in de top van de opperste twijg, en vier of vijf aan zijn vruchtbare takken, spreekt de HEERE, de God van Israël.", "Ps 119:145": "Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren.", "Klaagl 3:42": "Nun. Wij hebben overtreden, en wij zijn opstandig geweest, daarom hebt U niet gespaard.", "Joh 8:51": "Voorwaar, voorwaar, Ik zeg u: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet zien.", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "Ps 145:6": "Vau. En zij zullen vermelden de kracht van Uw ontzagwekkende daden; en Uw grootheid, die zal ik vertellen.", "Ps 92:2": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste!", "Ps 119:89": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.", "Ps 61:2": "O God! hoor mijn geschrei, merk op mijn gebed.", "Jes 43:13": "Ook eer de dag was, ben Ik, en er is niemand, die uit Mijn hand redden kan; Ik zal werken, en wie zal het keren?", "Luk 1:38": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "1 Tim 5:5": "Wie nu echt weduwe is, en alleen achtergelaten, die hoopt op God, en blijft in smekingen en gebeden, nacht en dag.", "Ps 118:1-4": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat Israël nu zeggen, dat Zijn goedertierenheid voor eeuwig is. Laat het huis van Aäron nu zeggen, dat Zijn goedertierenheid voor eeuwig is.", "Klaagl 3:39-42": "Mem. Wat klaagt dan een levend mens? Ieder klaagt vanwege zijn zonden. Nun. Laat ons onze wegen onderzoeken en doorzoeken, en laat ons terugkeren tot de HEERE. Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "Jes 43:17": "Die wagens en paarden, leger en macht voortbracht; samen zijn zij neergelegen, zij zullen niet weer opstaan, zij zijn uitgeblust, als een vlaswiek zijn zij uitgegaan.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Richt 10:16": "En zij deden de vreemde goden uit hun midden weg, en dienden de HEERE. Toen werd Zijn ziel verdrietig over de ellende van Israël.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "1 Kon 3:14": "En als u in Mijn wegen wandelt en Mijn inzettingen en Mijn geboden onderhoudt, zoals uw vader David gewandeld heeft, dan zal Ik ook uw dagen verlengen.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Ps 86:5": "Want Gij, Heere! zijt goed, en vergeeft graag, en van grote goedertierenheid voor allen die U aanroepen.", "2 Sam 22:13": "Van de glans voor Hem heen werden kolen van het vuur aangestoken.", "Ezech 33:11": "Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël?", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "1 Joh 5:3": "Want dit is de liefde van God, dat wij Zijn geboden bewaren; en Zijn geboden zijn niet zwaar.", "Gal 3:19": "Waartoe is dan de wet? Zij is vanwege de overtredingen erbij gevoegd, totdat het nageslacht zou gekomen zijn aan wie het beloofd was; en zij is door de engelen ingesteld, in de hand van de Middelaar.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Deut 5:1-22": "En Mozes riep het hele Israël bijeen en zei tegen hen: Hoor, Israël! De inzettingen en rechten die ik vandaag voor uw oren spreek: leer ze en neem ze in acht, om ze te doen. De HEERE, onze God, heeft een verbond met ons gemaakt bij Horeb. Met onze vaderen heeft de HEERE dit verbond niet gemaakt, maar met ons, wij die hier vandaag allemaal levend zijn.", "Ex 6:3": "En ook heb Ik Mijn verbond met hen opgericht, dat Ik hun het land Kanaän geven zou, het land van hun vreemdelingschap, waarin zij vreemdelingen zijn geweest.", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Job 37:1-23": "Ook hierover beeft mijn hart, en springt op uit zijn plaats. Hoort met aandacht naar de beweging van Zijn stem, en het geluid dat uit Zijn mond uitgaat! Dat zendt Hij rechtuit onder de hele hemel, en Zijn licht over de einden der aarde.", "Deut 28:52": "En het zal u benauwen in al uw poorten, totdat uw hoge en versterkte muren neervallen, waarop u vertrouwde in uw hele land; ja, het zal u benauwen in al uw poorten, in uw hele land, dat de HEERE, uw God, u gegeven heeft.", "Micha 7:19": "Hij zal Zich weer over ons ontfermen; Hij zal onze ongerechtigheden dempen; ja, U zult al hun zonden in de diepten van de zee werpen.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Luk 22:44": "En omdat Hij in zware strijd was, bad Hij des te ernstiger. En Zijn zweet werd als grote druppels bloed, die op de aarde afliepen.", "Hebr 11:13": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren.", "Ps 56:4": "Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Jes 33:3": "Van het geluid van het rumoer zullen de volken wegvluchten; van Uw verhoging zullen de heidenvolken verstrooid worden.", "Mark 4:20": "En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.", "Ps 51:3-6": "Wees mij genadig, o God! naar Uw goedertierenheid; delg mijn overtreding uit, naar de grootheid van Uw barmhartigheden. Was mij goed van mijn ongerechtigheid, en reinig mij van mijn zonde. Want ik ken mijn overtredingen, en mijn zonde staat mij steeds voor ogen.", "Openb 22:7": "Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart.", "Ps 119:149": "Hoor mijn stem naar Uw goedertierenheid, o HEERE! maak mij levend naar Uw recht.", "2 Kon 19:15-19": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt. HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen. Werkelijk, HEERE, de koningen van Assyrië hebben die heidenvolken en hun land verwoest;", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "Ps 31:2": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Ps 103:8-14": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Matt 25:20-23": "En hij die de vijf talenten ontvangen had, kwam, en bracht hem andere vijf talenten, en zei: Heer, vijf talenten hebt u mij gegeven; zie, andere vijf talenten heb ik daarbij gewonnen. En zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht! Over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer. En hij die de twee talenten ontvangen had, kwam ook, en zei: Heer, twee talenten hebt u mij gegeven; zie, twee andere talenten heb ik daarbij gewonnen.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Gen 40:9-13": "Toen vertelde de leider van de schenkers Jozef zijn droom, en zei tegen hem: In mijn droom, zie, was een wijnstok voor mij; en aan de wijnstok waren drie ranken; en het was alsof hij uitbotte, zijn bloesem kwam op, zijn trossen brachten rijpe druiven voort. En Farao's beker was in mijn hand; en ik nam die druiven, en perste ze uit in Farao's beker, en ik gaf de beker in Farao's hand.", "2 Sam 7:25-29": "Nu dan, HEERE God, doe dit woord, dat U over Uw knecht en over zijn huis gesproken hebt, blijven bestaan tot in eeuwigheid, en doe zoals U gesproken hebt. En laat Uw Naam groot gemaakt worden tot in eeuwigheid, zodat men zegt: De HEERE van de heerscharen is God over Israël; en het huis van Uw knecht David zal bestendig zijn voor Uw aangezicht. Want U, HEERE van de heerscharen, God van Israël! U hebt het voor het oor van Uw knecht geopenbaard, en gezegd: Ik zal u een huis bouwen; daarom heeft Uw knecht in zijn hart gevonden, dit gebed tot U te bidden.", "Jes 43:28": "Daarom zal Ik de leiders van het heiligdom ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen.", "Jer 51:5": "Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.", "Ex 22:27": "want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!", "Rom 15:29": "En ik weet dat ik, wanneer ik tot u kom, met volle zegen van het Evangelie van Christus komen zal.", "Ps 104:29": "Verbergt U Uw gezicht, zij worden angstig; neemt U hun adem weg, zij sterven, en zij keren terug tot hun stof.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Ps 89:2": "Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht.", "Ps 41:13": "Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "Joh 8:26": "Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld.", "2 Kron 25:9": "En Amazia zei tegen de man van God: Maar wat moet men doen met de honderd talenten, die ik aan de troepen van Israël gegeven heb? En de man van God zei: De HEERE heeft meer dan dit, om u te geven.", "Num 5:5-7": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël: Wanneer een man of een vrouw iets van enige menselijke zonden gedaan zal hebben, door overtreding tegen de HEERE overtreden hebbend, dan is die ziel schuldig. En zij zullen hun zonde die zij gedaan hebben belijden; daarna zal hij zijn schuld weer uitkeren, naar de hoofdsom daarvan, en het vijfde deel daarvan zal hij daarboven toevoegen, en zal het geven aan degene aan wie hij zich schuldig gemaakt heeft.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "2 Sam 24:10": "En het hart van David sloeg hem, nadat hij het volk geteld had; en David zei tegen de HEERE: Ik heb zwaar gezondigd in wat ik gedaan heb; maar neem nu toch, o HEERE, de misdaad van uw knecht weg, want ik heb heel dwaas gedaan.", "Ps 3:7": "Ik zal niet bang zijn voor tienduizenden van het volk, die zich rondom tegen mij opstellen.", "Neh 5:1-18": "Maar het geroep van het volk en van hun vrouwen was groot, tegen hun broeders, de Joden. Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven. Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Mark 6:12": "En zij gingen uit, en predikten dat de mensen zich moesten bekeren.", "Ps 54:6": "Zie, God is mij een Helper; de Heere is onder hen die mijn ziel ondersteunen.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Hebr 5:7": "Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Ps 9:20": "Sta op, HEERE, laat de mens zich niet versterken; laat de heidenen voor Uw aangezicht geoordeeld worden.", "Jer 29:10": "Want zo zegt de HEERE: Zeker, als er zeventig jaren te Babel vervuld zullen zijn, zal Ik u bezoeken, en Ik zal Mijn goede woord over u waarmaken, door u terug te brengen naar deze plaats.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Jer 26:3": "Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Ps 119:45": "En ik zal wandelen in de ruimte, omdat ik Uw bevelen gezocht heb.", "Dan 9:20": "Terwijl ik nog sprak, en bad, en mijn zonde beleed, en de zonde van mijn volk Israël, en mijn smeking neerwierp voor het aangezicht van de HEERE, mijn God, om de heilige berg van mijn God;", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "Ps 147:16": "Hij geeft sneeuw als wol; Hij strooit de rijp als as.", "Richt 2:1": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid.", "Job 23:14": "Want Hij zal volbrengen wat over mij bepaald is; en dergelijke dingen zijn er veel bij Hem.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Jer 50:19": "En Ik zal Israël terugbrengen naar zijn woning, en hij zal weiden op de Karmel en op de Basan; en zijn ziel zal op het gebergte van Efraïm en Gilead verzadigd worden.", "Jer 17:17": "Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Ps 141:1": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Jer 6:8": "Laat u tuchtigen, Jeruzalem! Opdat Mijn ziel niet van u afgetrokken wordt, opdat Ik u niet stel tot een woestheid, tot een onbewoond land.", "Jer 32:27": "Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?", "Hand 7:53": "U, die de wet ontvangen hebt door bemiddeling van engelen, en die niet gehouden hebt!", "1 Kron 16:35": "En zegt: Verlos ons, o God van ons heil, en verzamel ons, en red ons van de heidenen, opdat wij Uw heilige Naam loven, en opdat wij ons in Uw lof roemen.", "Mark 2:14": "En terwijl Hij voorbijging, zag Hij Levi, de zoon van Alfeüs, in het tolhuis zitten, en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Ps 78:12-16": "Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan. Hij kliefde de zee, en liet hen erdoorheen gaan; en de wateren liet Hij staan als een hoop. En Hij leidde hen overdag met een wolk, en de hele nacht met een licht van het vuur.", "Num 16:48": "En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Jer 51:15": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid door Zijn verstand;", "2 Kon 14:27": "En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.", "Job 36:27-33": "Want Hij trekt de druppels van het water op, die als regen neerdruppelen door zijn damp; Die de wolken uitgieten, en over de mens overvloedig afdruipen. Kan iemand ook verstaan de uitbreidingen van de wolken, en de donderslagen van Zijn tent?", "Ps 25:20": "Schin. Bewaar mijn ziel, en red mij; laat mij niet beschaamd worden, want ik vertrouw op U.", "Dan 4:22-27": "Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk. Dat nu de koning een wachter, namelijk een heilige, gezien heeft, uit de hemel neerkomend, die zei: Houwt deze boom om, en verderf hem; maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld, en in de dauw van de hemel nat gemaakt worden, en dat zijn deel zij met het gedierte van het veld, totdat er zeven tijden over hem voorbijgaan; Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal:", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "2 Petr 3:13": "Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, waarin gerechtigheid woont.", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Hebr 10:37": "want: Nog een heel klein tijdje en Hij, Die komen zal, zal komen, en niet uitblijven.", "Jes 62:7": "En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "1 Kon 9:3": "En de HEERE zei tegen hem: Ik heb uw gebed en uw smeking gehoord, die u voor Mijn aangezicht smekend gedaan hebt; Ik heb dit huis geheiligd, dat u gebouwd hebt, om Mijn Naam daar tot in eeuwigheid te vestigen; en Mijn ogen en Mijn hart zullen daar alle dagen zijn.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Hand 4:19": "Maar Petrus en Johannes antwoordden hun: Oordeelt u zelf, of het recht is voor God, meer naar u te luisteren dan naar God.", "Est 1:2": "in die dagen, toen de koning Ahasveros op de troon van zijn koninkrijk zat, die op de burcht Susan was,", "Neh 9:36": "Zie, wij zijn heden knechten; ja, het land, dat U onze vaderen gegeven hebt, om de vrucht daarvan, en het goede daarvan te eten, zie, daarin zijn wij knechten.", "Jer 3:13": "Erken alleen uw ongerechtigheid, dat u tegen de HEERE, uw God, overtreden hebt, en uw wegen verspreid hebt naar de vreemden, onder elke groene boom, maar u bent Mijn stem niet gehoorzaam geweest, spreekt de HEERE.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Rom 8:18": "Want ik houd het ervoor, dat het lijden van deze tegenwoordige tijd niet opweegt tegen de heerlijkheid die aan ons geopenbaard zal worden.", "Ex 24:7": "En hij nam het boek van het verbond, en hij las het voor de oren van het volk; en zij zeiden: Al wat de HEERE gesproken heeft, zullen wij doen en gehoorzamen.", "1 Kon 8:59": "En dat deze mijn woorden, waarmee ik voor de HEERE gesmeekt heb, nabij mogen zijn bij de HEERE, onze God, dag en nacht; opdat Hij het recht van Zijn dienaar uitvoert, en het recht van Zijn volk Israël, elke dag opnieuw.", "Ps 97:3-5": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand. Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft. De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.", "Ps 119:65": "Teth. U hebt bij Uw knecht goed gedaan, HEERE, naar Uw woord.", "Matt 24:31": "En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het ene uiterste van de hemel tot het andere uiterste daarvan.", "2 Kron 24:19": "Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "Ezech 18:27": "Maar als de goddeloze zich bekeert van zijn goddeloosheid, die hij gedaan heeft, en recht en gerechtigheid doet, die zal zijn ziel in het leven behouden;", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Mark 10:27": "Maar Jezus keek hen aan, en zei: Bij de mensen is het onmogelijk, maar niet bij God; want bij God zijn alle dingen mogelijk.", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "Ps 105:8": "Hij gedenkt Zijn verbond tot in eeuwigheid, het woord dat Hij ingesteld heeft, tot in duizend geslachten;", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "1 Sam 1:10": "Zij dan, bitter bedroefd zijnde, bad tot de HEERE, en zij weende zeer.", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Hos 14:4": "Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Dan 9:15": "En nu, o Heere, onze God! Die Uw volk uit Egypteland gevoerd hebt, met een sterke hand, en U een Naam gemaakt hebt, zoals hij is op deze dag; wij hebben gezondigd, wij zijn goddeloos geweest.", "Ps 42:9": "Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.", "Neh 11:3": "En dit zijn de hoofden van het landschap, die te Jeruzalem woonden; (maar in de steden van Juda woonden, ieder op zijn bezitting, in hun steden, Israël, de priesters, en de Levieten, en de Nethinim, en de kinderen van de knechten van Salomo).", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Est 7:7": "En de koning stond op in zijn grimmigheid van het maaltijd van de wijn, en ging naar de tuin van het paleis. En Haman bleef staan, om bij de koningin Esther aangaande zijn leven verzoek te doen; want hij zag dat het kwaad van de koning over hem ten volle besloten was.", "2 Tim 2:11-13": "Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven; als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen; als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Ezech 37:23": "En zij zullen zich niet meer verontreinigen met hun drekgoden, en met hun afschuwelijkheden, en met al hun overtredingen; en Ik zal ze verlossen uit al hun woonplaatsen, waarin zij gezondigd hebben, en zal ze reinigen; zo zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Deut 12:5": "Maar naar de plaats die de HEERE, uw God, uit al uw stammen zal uitkiezen om Zijn Naam daar te vestigen, naar Zijn woning zult u vragen, en daarheen zult u komen;", "Ps 76:7": "Van Uw schelden, o God van Jakob! zijn samen wagen en paard in slaap gezonken.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Hand 8:22": "Bekeer u dan van deze slechtheid van u, en bid tot God, of misschien deze overweging van uw hart u vergeven wordt.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "Ex 20:2": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Hebr 11:7-11": "Door het geloof heeft Noach, door God gewaarschuwd over de dingen die nog niet gezien werden, en bevreesd geworden, de ark gebouwd tot redding van zijn huisgezin; door dit geloof heeft hij de wereld veroordeeld, en is hij een erfgenaam geworden van de rechtvaardigheid die naar het geloof is. Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou. Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Ezra 7:6": "Deze Ezra trok op uit Babel; en hij was een vaardig schriftgeleerde in de wet van Mozes, die de HEERE, de God van Israël, gegeven heeft; en de koning gaf hem, naar de hand van de HEERE, zijn God, over hem, al zijn verzoek.", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Ezra 9:15": "O HEERE, God van Israël! U bent rechtvaardig; want wij zijn overgelaten ter ontkoming, zoals het is op deze dag. Zie, wij zijn voor Uw aangezicht in onze schuld; want er is niemand die voor Uw aangezicht zou kunnen bestaan, om hiervan.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Ps 46:2-4": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden. Daarom zullen wij niet vrezen, al veranderde de aarde haar plaats, en al werden de bergen verzet in het hart van de zeeën; Laat haar water bruisen, laat het beroerd worden; laat de bergen daveren, door de verheffing daarvan! Sela.", "Ps 74:12": "Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.", "Ps 86:1-5": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Jes 64:7": "En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden.", "Neh 2:1": "Toen gebeurde het in de maand Nisan, in het twintigste jaar van koning Arthahsasta, als er wijn voor hem was, dat ik de wijn opnam en aan de koning gaf; nu was ik nooit eerder treurig geweest voor hem.", "Klaagl 3:40": "Nun. Laat ons onze wegen onderzoeken en doorzoeken, en laat ons terugkeren tot de HEERE.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Jes 17:13": "De naties zullen wel ruisen, zoals grote wateren ruisen; maar Hij zal het bestraffen, zo zal het ver wegvluchten, ja, het zal opgejaagd worden als het kaf van de bergen voor de wind, en als een bal voor de wervelwind.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Ps 147:18": "Hij zendt Zijn woord, en doet ze smelten; Hij laat Zijn wind waaien, de wateren stromen weg.", "Ps 60:12": "Zult U het niet zijn, o God! Die ons verstoten had, en niet uittrok, o God! met onze legers?", "Job 23:2-6": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "Ps 69:7": "Laat hen door mij niet beschaamd worden, die U verwachten, o Heere, HEERE van de heerscharen, laat hen door mij niet te schande worden, die U zoeken, o God van Israël!", "Jes 44:27": "Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen.", "Deut 33:2-4": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen. Zeker bemint Hij de volken! Al Zijn heiligen zijn in Uw hand; zij zullen in het midden tussen Uw voeten gezet worden; ieder zal ontvangen van Uw woorden. Mozes heeft ons de wet geboden, een erfenis van Jakobs gemeente;", "Ps 89:19": "Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.", "Luk 6:21": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen.", "Hand 20:21": "Terwijl ik zowel Joden als Grieken heb betuigd de bekering tot God en het geloof in onze Heere Jezus Christus.", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Jer 29:18": "En Ik zal hen achtervolgen met het zwaard, met de honger en met de pest; en Ik zal hen overgeven aan een verschrikking, in al de koninkrijken van de aarde, tot een vloek, en tot een schrik, en tot een aanfluiting, en tot een smaad, onder al de volken waarheen Ik hen zal hebben verdreven;", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Gen 6:22": "En Noach deed het; naar alles wat God hem geboden had, zo deed hij.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Jak 2:10-12": "Want wie de hele wet houdt, en in één ding struikelt, die is schuldig geworden aan alle geboden. Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden. Spreek zo, en doe zo, als mensen die door de wet van de vrijheid geoordeeld zullen worden.", "Ps 147:5": "Onze Heere is groot en heeft veel kracht; van Zijn verstand is geen aantal te noemen.", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "1 Kon 18:37": "Antwoord mij, HEERE, antwoord mij; opdat dit volk erkent dat U, HEERE, die God bent, en dat U hun hart weer terug hebt gebracht.", "Gen 32:24-29": "Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging. En toen Hij zag dat Hij niet de overhand over hem kreeg, raakte Hij zijn heupgewricht aan, zodat het heupgewricht van Jakob verwrongen raakte, terwijl Hij met hem worstelde. En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Ps 103:21": "Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet!", "Ps 56:5": "In God zal ik Zijn woord prijzen; ik vertrouw op God, ik zal niet vrezen; wat zou vlees mij doen?", "Ps 19:9": "De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Ps 119:81": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt.", "Neh 9:7": "U bent die HEERE, de God, Die Abram hebt verkoren, en hem uit Ur der Chaldeeën uitgevoerd; en U hebt zijn naam gesteld Abraham.", "Jer 39:8": "En de Chaldeeën verbrandden het huis van de koning en de huizen van het volk met vuur; en zij braken de muren van Jeruzalem af.", "Ezra 7:27": "Geloofd zij de HEERE, de God van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.", "Hebr 6:1": "Laten wij daarom het beginsel van de leer van Christus achterlaten en doorgaan tot de volmaaktheid; niet opnieuw het fundament leggend van de bekering van dode werken en van het geloof in God,", "Ex 12:41": "En het gebeurde aan het einde van de vierhonderd en dertig jaren, op diezelfde dag gebeurde het, dat alle legers van de HEERE uit Egypteland gegaan zijn.", "Gen 19:16": "Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.", "2 Kron 29:6": "Want onze vaders hebben overtreden, en gedaan wat kwaad was in de ogen van de HEERE, onze God, en hebben Hem verlaten, en zij hebben hun gezicht van de tabernakel van de HEERE afgewend, en hebben Hem de rug toegekeerd.", "Jes 44:22": "Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "Ps 105:42": "Want Hij dacht aan Zijn heilig woord, aan Abraham, Zijn knecht.", "Ezra 5:8": "De koning zij bekend, dat wij naar het landschap Juda getrokken zijn, naar het huis van de grote God, dat gebouwd wordt met grote stenen, en het hout wordt gelegd in de wanden; en dat werk wordt snel gedaan en gaat voorspoedig door hun handen voort.", "Ps 119:168": "Ik onderhoud Uw bevelen en Uw getuigenissen, want al mijn wegen zijn voor U.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "Jer 29:11-14": "Want Ik weet de gedachten die Ik over u koester, spreekt de HEERE, gedachten van vrede en niet van kwaad, om u het einde en de verwachting te geven. Dan zult u Mij aanroepen, en heengaan, en tot Mij bidden; en Ik zal naar u horen. En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Lev 26:40-45": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Ps 17:6": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden.", "Ex 34:1-4": "Toen zei de HEERE tegen Mozes: Houw u twee stenen tafelen, gelijk de eerste waren, zo zal Ik op de tafelen dezelfde woorden schrijven, die op de eerste tafelen geweest zijn, die u gebroken hebt. En wees bereid tegen de morgen; dat u in de morgen op de berg Sinaï klimt, en u daar voor Mij stelt, op de top van de berg. En niemand zal met u opklimmen; dat er ook niemand gezien wordt op de hele berg; ook het kleine vee, noch de runderen zullen tegenover deze berg niet weiden.", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Ps 92:15": "In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "Jes 33:22": "Want de HEERE is onze Rechter,
