vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "Ezra 9:7-14": "Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag. En nu is er, als een klein ogenblik, een genade gebeurd van de HEERE, onze God, om ons een ontkoming over te laten, en ons een nagel te geven in Zijn heilige plaats, om onze ogen te verlichten, o onze God, en om ons een weinig leven te geven in onze dienstbaarheid. Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.", "Ps 32:7": "U bent mij een schuilplaats; U behoedt mij voor benauwdheid; U omringt mij met vrolijke gezangen van bevrijding. Sela.", "Ex 33:13": "Nu dan, ik bid U, als ik genade gevonden heb in Uw ogen, laat mij dan nu Uw weg weten, en ik zal U kennen, opdat ik genade vind in Uw ogen; en zie aan dat dit volk Uw volk is!", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Jer 33:20": "Zo zegt de HEERE: Als u Mijn verbond met de dag, en Mijn verbond met de nacht zou kunnen verbreken, zodat er geen dag en nacht meer zijn op hun tijd;", "Ps 73:22": "Toen was ik redeloos, en wist niets; ik was een groot dier bij U.", "Ps 59:11": "De God van mijn goedertierenheid zal mij voor zijn; God zal mij op mijn verspieders doen zien.", "Ezra 9:10": "En nu, wat zullen wij zeggen, o onze God, na dit alles? Want wij hebben Uw geboden verlaten,", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Deut 9:25": "En ik wierp mij neer voor het aangezicht van de HEERE, die veertig dagen en veertig nachten waarin ik mij neerwierp, omdat de HEERE gezegd had dat Hij u verdelgen zou.", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Jer 27:5": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Jer 36:22": "(De koning nu zat in het winterhuis, in de negende maand; en er was een vuur voor zijn aangezicht op de haard aangestoken.)", "2 Sam 24:17": "En David, toen hij de engel zag die het volk sloeg, sprak tot de HEERE, en zei: Zie, ik, ik heb gezondigd, en ik, ik heb onrecht gehandeld, maar wat hebben deze schapen gedaan? Laat toch Uw hand tegen mij zijn en tegen het huis van mijn vader.", "Ps 119:49": "Zain. Gedenk het woord, tot Uw knecht gesproken, waarop U mij hebt doen hopen.", "Jer 31:10": "Hoort het woord van de HEERE, heidenvolken! En verkondigt het in de eilanden die ver weg zijn, en zegt: Hij, Die Israël verstrooid heeft, zal hem weer verzamelen, en hem bewaren zoals een herder zijn kudde.", "Ex 34:27": "Verder zei de HEERE tegen Mozes: Schrijf u deze woorden; want naar de inhoud van deze woorden heb Ik een verbond met u en met Israël gemaakt.", "Ps 55:3": "Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier;", "Ps 44:9": "In God roemen wij de hele dag, en Uw Naam zullen wij loven tot in eeuwigheid. Sela.", "Ps 119:31": "Ik kleef vast aan Uw getuigenissen; o HEERE! beschaam mij niet.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Ps 73:21": "Toen mijn hart verbitterd was, en ik in mijn nieren geprikkeld werd,", "Joël 3:21": "En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion.", "Gen 40:1": "En het gebeurde na deze dingen, dat de schenker van de koning van Egypte en de bakker zondigden tegen hun heer, tegen de koning van Egypte.", "Ps 41:5": "Ik zei: O HEERE! wees mij genadig; genees mijn ziel, want ik heb tegen U gezondigd.", "Ps 27:6": "Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "Jes 55:7-9": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig. Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE. Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.", "Ps 22:6": "Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.", "Jona 3:10": "En God zag hun werken, dat zij zich bekeerden van hun boze weg; en het berouwde God over het kwaad, dat Hij gesproken had hun te zullen doen, en Hij deed het niet.", "2 Kron 6:40": "Nu, mijn God, laat toch Uw ogen open zijn en Uw oren opmerkzaam op het gebed van deze plaats.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Ps 65:4": "Onrechtvaardige dingen hadden de overhand over mij; maar onze overtredingen, die verzoent U.", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "Mal 4:4": "Denk aan de wet van Mozes, Mijn knecht, die Ik hem geboden heb op Horeb voor heel Israël, met de inzettingen en rechten.", "Ps 119:116": "Ondersteun mij naar Uw toezegging, opdat ik leve; en laat mij niet beschaamd worden over mijn hoop.", "Hand 7:38": "Dit is degene die in de samenkomst van het volk in de woestijn was, samen met de engel die tot hem sprak op de berg Sinaï, en met onze vaders; die de levende woorden ontving, om ons die te geven,", "Luk 1:6": "En zij waren beiden rechtvaardig voor God, en wandelden onberispelijk in alle geboden en voorschriften van de Heere.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Ps 115:12-14": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen. Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten. De HEERE zal de zegen over u vermeerderen, over u en over uw kinderen.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Num 9:23": "Naar het bevel van de HEERE legerden zij zich, en naar het bevel van de HEERE trokken zij verder; zij namen de wacht van de HEERE waar, naar het bevel van de HEERE, door de hand van Mozes.", "Hab 3:6": "Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "Jes 11:12": "En Hij zal een banier oprichten onder de heidenen, en Hij zal de verdrevenen van Israël verzamelen, en de verstrooiden uit Juda bijeenbrengen, van de vier hoeken van het aardrijk.", "Ps 119:43": "En ruk het woord van de waarheid van mijn mond niet al te zeer, want ik hoop op Uw rechten.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Ps 83:19": "opdat zij weten dat U alleen met Uw Naam de HEERE bent, de Allerhoogste over de hele aarde.", "Deut 9:10": "En de HEERE gaf mij de twee stenen tafelen, beschreven met Gods vinger; en daarop stonden al de woorden die de HEERE op de berg, uit het midden van het vuur, op de dag van de verzameling, met u gesproken had.", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "Ex 25:17": "U zult ook een verzoendeksel maken van zuiver goud; twee el en een halve zal de lengte daarvan zijn, en anderhalve el de breedte daarvan.", "Deut 32:26-28": "Ik zei: In alle hoeken zou Ik hen verstrooien; Ik zou hun gedachtenis van onder de mensen doen ophouden; Ware het niet, dat Ik de toorn van de vijand vreesde, dat hun tegenpartijen zich niet vreemd zouden houden; dat zij niet zouden zeggen: Onze hand is hoog geweest; de HEERE heeft dit alles niet gedaan. Want zij zijn een volk, dat door raadslagen verloren gaat, en er is geen verstand in hen.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "Ps 119:90": "Uw trouw is van geslacht tot geslacht; U hebt de aarde vastgemaakt, en zij blijft staan;", "2 Kron 9:4": "En het voedsel van zijn tafel, en het zitten van zijn knechten, en het optreden van zijn dienaren, en hun kleding, en zijn schenkers, en hun kleding, en zijn opgang waarmee hij opging in het huis van de HEERE, toen was er geen geest meer in haar.", "Zach 1:17": "Roep nog, en zeg: Zo zegt de HEERE van de heerscharen: Mijn steden zullen nog uitgespreid worden vanwege de voorspoed; want de HEERE zal Sion nog troosten, en Hij zal Jeruzalem nog verkiezen.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Num 14:18-20": "De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht. Vergeef toch de ongerechtigheid van dit volk, naar de grootte van Uw goedertierenheid, en zoals U dit volk vergeven hebt, van Egypteland af tot hiertoe! En de HEERE zei: Ik heb hun vergeven naar uw woord.", "Neh 9:14": "En U hebt Uw heilige sabbat bekendgemaakt; en U hebt hun geboden, en inzettingen en een wet bevolen, door de hand van Uw knecht Mozes.", "Ps 89:14": "Gij hebt een arm met macht; Uw hand is sterk, Uw rechterhand is hoog.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "2 Kron 27:2": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader Uzzia gedaan had, behalve dat hij de tempel van de HEERE niet binnenging; en het volk verdierf zich nog.", "Ps 20:6-8": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens. Nu weet ik, dat de HEERE Zijn Gezalfde behoudt; Hij zal Hem verhoren uit de hemel van Zijn heiligheid; het heil van Zijn rechterhand zal zijn met machten. Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Ezech 36:24": "Want Ik zal u uit de heidenen halen, en zal u uit al de landen bijeenbrengen; en Ik zal u in uw land brengen.", "Ps 91:10": "U zal geen kwaad overkomen, en geen plaag zal uw tent naderen.", "2 Kon 8:19": "Toch wilde de HEERE Juda niet verderven, omwille van David, Zijn dienaar; zoals Hij hem gezegd had dat Hij hem altijd een lamp zou geven voor zijn zonen.", "Ps 111:4": "Zain. Hij heeft Zijn wonderen tot een gedachtenis gemaakt; Cheth. de HEERE is genadig en barmhartig.", "Ps 65:7": "Die de bergen vastzet door Zijn kracht, omgord met macht.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Ps 104:7": "Van Uw dreigen vluchtten zij, zij haastten zich weg voor de stem van uw donder.", "Matt 18:23-27": "Daarom wordt het Koninkrijk der hemelen vergeleken met een zekere koning die met zijn dienstknechten rekening wilde houden. Toen hij nu begon te rekenen, werd er iemand bij hem gebracht die hem tienduizend talenten schuldig was. En omdat hij niet had waarmee hij kon betalen, beval zijn heer dat men hem zou verkopen, en zijn vrouw en kinderen, en alles wat hij had, en dat de schuld zo betaald zou worden.", "Job 38:11": "En zei: Tot hiertoe zult u komen, en niet verder, en hier zal hij zich stellen tegen de hoogmoed van uw golven.", "Jes 33:13": "Hoort, u die ver weg bent, wat Ik gedaan heb; en u, die nabij bent, erken Mijn macht!", "Ps 119:44": "Zo zal ik Uw wet voortdurend onderhouden, eeuwig en altijd.", "Lev 26:46": "Dit zijn de inzettingen, en de rechten, en de wetten, die de HEERE gegeven heeft, tussen Zich en de kinderen van Israël, op de berg Sinaï, door de hand van Mozes.", "Job 9:19": "Als het op kracht aankomt, zie, Hij is sterk; en als het op recht aankomt, wie zal mij dagvaarden?", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Ps 77:19": "Het geluid van uw donder was rondom; de bliksemen verlichtten de wereld; de aarde werd beroerd en daverde.", "Matt 13:23": "Maar die in de goede aarde bezaaid is, dit is degene die het woord hoort en begrijpt, die ook vrucht draagt en voortbrengt, de een honderdvoud, de ander zestigvoud, en de ander dertigvoud.", "Ezra 10:9": "Toen verzamelden alle mannen van Juda en Benjamin zich in Jeruzalem binnen drie dagen; het was de negende maand, op de twintigste van de maand; en al het volk zat op het plein bij het huis van God, sidderend om deze zaak, en vanwege de stromende regens.", "Job 22:23": "Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "Jona 4:11": "En zou Ik dan die grote stad Ninevé niet ontzien? Daarin wonen meer dan honderdtwintigduizend mensen, die geen onderscheid weten te maken tussen hun rechterhand en hun linkerhand; en bovendien nog veel vee?", "Ps 130:1": "Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE!", "Ezech 33:19": "En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "Ps 119:55": "HEERE! 's nachts ben ik Uw Naam indachtig geweest, en heb Uw wet bewaard.", "Jer 31:19": "Zeker, nadat ik bekeerd ben, heb ik berouw gehad, en nadat ik mijzelf ben bekendgemaakt, heb ik op de heup geklopt, ik ben beschaamd, ja, ook schaamrood geworden, omdat ik de smaad van mijn jeugd gedragen heb.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Ps 29:3-9": "De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid. De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "1 Kron 17:21": "En wie is als Uw volk Israël, één enig volk op de aarde, dat God heengegaan is om voor Zich tot een volk te verlossen, om U een Naam te maken van grote en ontzagwekkende dingen, door de heidenvolken te verdrijven voor het aangezicht van Uw volk, dat U uit Egypte verlost hebt?", "Ps 22:5": "Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en U hebt hen uitgeholpen.", "Job 14:20": "U overweldigt hem voor altijd, en hij gaat heen; U verandert zijn gelaat, en zendt hem weg.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Luk 15:1-10": "En alle tollenaars en zondaars kwamen naar Hem toe, om Hem te horen. En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen. En Hij sprak deze gelijkenis tegen hen, en zei:", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "Jes 65:8": "Zo zegt de HEERE: Zoals wanneer men most in een tros druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; zo zal Ik het om Mijn knechten doen, dat Ik hen niet allen verderf.", "Ps 142:3": "Ik stortte mijn klacht uit voor Zijn aangezicht; ik maakte voor Zijn aangezicht mijn benauwdheid bekend.", "Ps 35:22": "HEERE! U hebt het gezien, zwijg niet; Heere! Wees niet ver van mij.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Ps 106:47": "Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij de Naam van Uw heiligheid loven, ons beroemend in Uw lof.", "2 Kor 1:20": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Jes 43:16": "Zo zegt de HEERE, Die in de zee een weg, en in de sterke wateren een pad maakte;", "Ps 79:10-12": "Waarom zouden de heidenen zeggen: Waar is hun God? Laat de wraak van het vergoten bloed van Uw knechten onder de heidenen voor onze ogen bekend worden. Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn. En geef onze buren zevenvoudig terug in hun schoot hun smaad, waarmee zij U, o Heere, gesmaad hebben.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Ps 141:2": "Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer.", "Ps 59:10": "Tegen zijn sterkte zal ik op U wachten; want God is mijn Hoog Vertrek.", "Ps 69:17": "Verhoor mij, o HEERE, want Uw goedertierenheid is goed; zie mij aan naar de grootheid van Uw barmhartigheden.", "Ex 15:10-12": "U hebt met Uw wind geblazen; de zee heeft hen gedekt, zij zonken onder als lood in geweldige wateren! O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet? U hebt Uw rechterhand uitgestrekt, de aarde heeft hen verslonden!", "Gen 18:26-32": "Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen. En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben! Misschien zullen aan de vijftig rechtvaardigen vijf ontbreken; zult U dan om vijf de hele stad verwoesten? En Hij zei: Ik zal haar niet verwoesten, als Ik er vijfenveertig zal vinden.", "Matt 6:14": "Want als u de mensen hun misdaden vergeeft, zal uw hemelse Vader ook u vergeven.", "Ps 106:6": "Wij hebben gezondigd, alsook onze vaderen, wij hebben verkeerd gedaan; wij hebben goddeloos gehandeld.", "Luk 1:72": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken;", "Hab 1:2": "HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet!", "Fil 1:19-21": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus. Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst.", "Ex 24:12-18": "Toen zei de HEERE tegen Mozes: Kom tot Mij op de berg, en wees daar; en Ik zal u stenen tafelen geven, en de wet, en de geboden, die Ik geschreven heb, om hen te onderwijzen. Toen maakte Mozes zich op, met Jozua, zijn dienaar; en Mozes klom op de berg van God. En hij zei tegen de oudsten: Blijft u hier voor ons, totdat wij weer tot u komen; en zie, Aäron en Hur zijn bij u; wie een zaak heeft, moet naar hen toe gaan.", "Ezech 18:28": "Omdat hij toeziet, en zich bekeert van al zijn overtredingen, die hij gedaan heeft, zal hij zeker leven, hij zal niet sterven.", "Luk 12:37": "Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Hos 6:1": "Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden.", "Luk 8:21": "Maar Hij antwoordde en zei tegen hen: Mijn moeder en Mijn broers zijn zij die Gods Woord horen en het doen.", "Est 1:5": "Toen die dagen voorbij waren, gaf de koning een maaltijd voor heel het volk dat zich op de burcht Susan bevond, van de grootste tot de kleinste, zeven dagen lang, in het voorhof van de tuin van het koninklijk paleis.", "Joz 21:45": "Er viel niet één woord weg van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam allemaal uit.", "1 Kon 8:9": "Er was niets in de ark, dan alleen de twee stenen platen, die Mozes bij Horeb daarin gelegd had, toen de HEERE een verbond maakte met de kinderen van Israël, toen zij uit Egypteland waren uitgetrokken.", "Mark 2:17": "En Jezus hoorde dat, en zei tegen hen: Wie gezond zijn, hebben de dokter niet nodig, maar wie ziek zijn. Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars tot bekering.", "Ps 102:15": "Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis.", "Ps 32:3": "Toen ik zweeg, verouderden mijn beenderen, in mijn brullen de hele dag.", "Jes 26:4": "Vertrouw op de HEERE tot in eeuwigheid; want in de HEERE HEERE is een eeuwige rots.", "Dan 3:16": "Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.", "1 Sam 12:23": "Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.", "Jer 24:9": "En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben;", "Luk 1:54": "Hij heeft Israël, Zijn knecht, opgenomen, om Zijn barmhartigheid te gedenken,", "1 Joh 3:22": "en wat wij ook bidden, ontvangen wij van Hem, omdat wij Zijn geboden bewaren en doen wat welgevallig is voor Hem.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "Ps 21:8": "Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Neh 2:3": "en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn?", "Job 40:4": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen?", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "Ps 85:3": "De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela.", "Jes 50:3": "Ik bekleed de hemel met zwartheid, en maak een zak tot zijn bedekking.", "Ezra 2:1": "Dit zijn de kinderen van dat landschap, die optrokken uit de gevangenis, van de weggevoerden, die Nebukadnezar, de koning van Babel, weggevoerd had naar Babel, die naar Jeruzalem en Juda zijn teruggekeerd, ieder naar zijn stad;", "Ps 147:2": "De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Jer 5:22": "Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Jer 7:5": "Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Hos 2:6": "En zij zal haar minnaars nalopen, maar hen niet aantreffen; en zij zal hen zoeken, maar niet vinden; dan zal zij zeggen: Ik zal heengaan, en terugkeren naar mijn vorige Man, want toen ging het mij beter dan nu.", "Ps 119:124": "Doe bij Uw knecht naar Uw goedertierenheid, en leer mij Uw inzettingen.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Job 11:6": "En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Deut 12:21": "Als de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te vestigen, ver van u zal zijn, zo zult u slachten van uw runderen en van uw schapen die de HEERE u gegeven heeft, zoals ik u geboden heb; en u zult eten in uw poorten, naar alle verlangen van uw ziel.", "Est 4:3": "En in elk landschap en elke plaats, waar het woord van de koning en zijn wet aankwam, was er grote rouw onder de Joden, met vasten, geween en misbaar; velen lagen in zakken en as.", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Spr 30:4": "Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "1 Joh 4:16": "En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.", "Ps 60:14": "In God zullen wij kloeke daden doen, en Hij zal onze tegenstanders vertreden.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Ps 102:2": "O HEERE! Hoor mijn gebed, en laat mijn geroep tot U komen.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Openb 2:5": "Bedenk dan waarvan u uitgevallen bent, en bekeer u, en doe de eerste werken; en zo niet, Ik zal u haastig bij komen, en zal uw kandelaar van zijn plaats wegnemen, als u zich niet bekeert.", "Jona 3:8": "Maar mens en dier zullen met zakken bedekt zijn, en zullen sterk tot God roepen; en zij zullen zich bekeren, ieder van zijn boze weg, en van het geweld dat in hun handen is.", "2 Kon 18:5": "Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.", "2 Kron 21:7": "Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven.", "Job 13:23": "Hoeveel misdaden en zonden heb ik? Maak mij mijn overtreding en mijn zonden bekend.", "Ps 74:2": "Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.", "Dan 9:13": "Zoals geschreven is in de wet van Mozes, zo is al dat kwaad over ons gekomen; en wij smeekten het aangezicht van de HEERE, onze God, niet, door ons af te keren van onze ongerechtigheden en verstandig acht te geven op Uw waarheid.", "Ps 91:2": "Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw!", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Luk 6:36": "Wees dan barmhartig, zoals ook uw Vader barmhartig is.", "Ps 86:3": "Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Rom 3:3": "Want wat is het, al zijn sommigen ongelovig geweest? Zal hun ongeloof het geloof van God tenietdoen?", "Jona 2:2-9": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen. En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Jes 50:7-9": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Ezech 20:43": "Daar zult u dan denken aan uw wegen, en aan al uw handelingen waarmee u zich verontreinigd hebt, en u zult van uzelf een afkeer hebben over al uw slechte daden die u gedaan hebt.", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "Neh 1:1-11": "De geschiedenissen van Nehemia, zoon van Hachalja. En het gebeurde in de maand Chisleu, in het twintigste jaar, toen ik in de burcht Susan was, dat Hanani kwam, een van mijn broers, hij en enkele mannen uit Juda, en ik vroeg hen naar de Joden die ontkomen waren, die overgebleven waren van de gevangenschap, en naar Jeruzalem. En zij zeiden tegen mij: De overgeblevenen, die van de gevangenschap daar in het gebied zijn overgebleven, zijn in grote ellende en in smaad; en de muur van Jeruzalem is afgebroken, en haar poorten zijn met vuur verbrand.", "Matt 5:4": "Zalig zijn zij die treuren, want zij zullen vertroost worden.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 119:146": "Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden.", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "2 Sam 12:13": "Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Hand 24:14": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is;", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Hebr 8:12": "Want Ik zal hun ongerechtigheden genadig zijn, en aan hun zonden en hun overtredingen zal Ik geenszins meer denken.", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Job 42:5": "Met het gehoor van het oor heb ik U gehoord; maar nu ziet mijn oog U.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Job 38:8": "Of wie heeft de zee met deuren toegesloten, toen zij uitbrak, en uit de baarmoeder voortkwam?", "Ezra 9:4": "Toen verzamelden zich bij mij allen die voor de woorden van de God van Israël beefden, om de overtreding van de weggevoerden; maar ik bleef verbaasd zitten tot aan het avondoffer.", "Luk 1:73": "en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven", "Ezra 10:1": "Terwijl Ezra zo bad en deze belijdenis deed, huilend en zich voor het huis van God neerwerpend, verzamelde zich bij hem uit Israël een zeer grote gemeente van mannen, vrouwen en kinderen; want het volk huilde met groot geween.", "Jes 56:8": "De Heere HEERE, Die de verdrevenen van Israël bijeenbrengt, spreekt: Ik zal er bij hem nog meer bijeenbrengen, naast hen die al bij hem bijeengebracht zijn.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Luk 8:15": "En wat in de goede aarde valt, dat zijn zij die het Woord gehoord hebben en het in een eerlijk en goed hart bewaren, en met volharding vruchten voortbrengen.", "2 Kron 28:10": "Daartoe denkt u er nu aan om de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; bent u het zelf niet die schuldig staan? Bij u zijn schulden tegen de HEERE, uw God.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Ef 1:6-8": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde; In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade, Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;", "Jes 60:16": "En u zult de melk van de heidenen zuigen, en u zult de borsten van de koningen zuigen; en u zult weten dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige van Jakob.", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">De</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">geschiedenissen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5166\">Nehemia</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2446\">Hachalja</span>. <span class=\"wl\" data-l=\"L5\" data-code=\"H1961\">En</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1961\">het</span> gebeurde in <span class=\"wl\ de=\"H3341\">burned</span> with fire.", "4": "And it came to pass, when I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> that I sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept,</span> and <span class=\"wl wl-kjv\" data-code=\"H56\">mourned</span> certain <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> and <span class=\"wl wl-kjv\" data-code=\"H6684\">fasted,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of heaven,", "5": "And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H577\">beseech</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> that <span class=\"wl wl-kjv\" data-code=\"H8104\">keepeth</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> and <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> for them that <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> him and <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> his commandments:", "6": "Let thine <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> now be <span class=\"wl wl-kjv\" data-code=\"H7183\">attentive,</span> and thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">open,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> of thy <span cl n class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If ye <span class=\"wl wl-kjv\" data-code=\"H4603\">transgress,</span> I will scatter you <span class=\"wl wl-kjv\" data-code=\"H6327\">abroad</span> among the nations:", "9": "But if ye <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> unto me, and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them; though there were of you cast <span class=\"wl wl-kjv\" data-code=\"H5080\">out</span> unto the uttermost <span class=\"wl wl-kjv\" data-code=\"H7097\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> yet will I <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> them from thence, and will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them unto the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> that I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> to <span class=\"wl wl-kjv\" data-code=\"H7931\">set</span> my name", "10": "Now these are thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> and thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> whom thou hast <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> by thy <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">power,</span> and by thy <span class=\"wl wl-kjv\" data-code=\"H2389\">strong</span> hand.", "11": "O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> I <span class=\"wl wl-kjv\" data-code=\"H577\">beseech</span> thee, let now thine <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> be <span class=\"wl wl-kjv\" data-code=\"H7183\">attentive</span> to the <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> who <span class=\"wl wl-kjv\" data-code=\"H2655\">desire</span> to <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> and <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper,</span> I pray thee, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">grant</span> him <span class=\"wl wl-kjv\" data-code=\"H7356\">mercy</span> in the <span class=\"wl wl-kjv\" data-code=\"H6440\">sight</span> of this <span class=\"wl wl-kjv\" data-code=\"H376\">man.</span> For I was the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> cupbearer."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
