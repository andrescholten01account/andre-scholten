lem woonden, waren vierhonderdachtenzestig dappere mannen.","7":"En dit zijn de kinderen van Benjamin: Sallu, de zoon van Mesullam, de zoon van Joed, de zoon van Pedaja, de zoon van Kolaja, de zoon van Maaseja, de zoon van Ithiël, de zoon van Jesaja;","8":"En na hem Gabbai, Sallai; negenhonderdachtentwintig.","9":"En Joël, de zoon van Zichri, was opziener over hen; en Juda, de zoon van Senua, was de tweede over de stad.","10":"Van de priesters: Jedaja, de zoon van Jojarib, Jachin;","11":"Seraja, de zoon van Hilkia, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, was voorganger van Gods huis;","12":"En hun broeders, die het werk in het huis deden, waren achthonderdtweeëntwintig. En Adaja, de zoon van Jeroham, de zoon van Pelalja, de zoon van Amzi, de zoon van Zacharja, de zoon van Pashur, de zoon van Malchia;","13":"En zijn broeders, hoofden van de vaderen, waren tweehonderdtweeënveertig. En Amassai, de zoon van Azareël, de zoon van Achzai, de zoon van Mesillemoth, de zoon van Immer;","14":"En hun broeders, dappere helden, waren honderdachtentwintig; en opziener over hen was Zabdiël, de zoon van Gedolim.","15":"En van de Levieten: Semaja, de zoon van Hassub, de zoon van Azrikam, de zoon van Hasabja, de zoon van Buni.","16":"En Sabbethai, en Jozabad, van de leiders van de Levieten, hadden toezicht over het buitenwerk van het huis van God.","17":"En Matthanja, de zoon van Micha, de zoon van Zabdi, de zoon van Asaf, was het hoofd, die de dankzegging begon in het gebed, en Bakbukja was de tweede van zijn broeders; en Abda, de zoon van Sammua, de zoon van Galal, de zoon van Jeduthun.","18":"Alle Levieten in de heilige stad waren tweehonderdvierentachtig.","19":"En de poortwachters: Akkub, Talmon, met hun broeders, die wacht hielden in de poorten, waren honderdtweeënzeventig.","20":"Het overige nu van Israël, van de priesters *en* de Levieten, was in alle steden van Juda, ieder in zijn erfdeel.","21":"En de Nethinim woonden in Ofel; en Ziha en Gispa waren over de Nethinim.","22":"En de opziener van de Levieten te Jeruzalem was Uzzi, de zoon van Bani, de zoon van Hasabja, de zoon van Matthanja, de zoon van Micha; van de kinderen van Asaf waren de zangers verantwoordelijk voor het werk van Gods huis.","23":"Want er was een gebod van de koning over hen, namelijk dat er een vast onderhoud voor de zangers was, dagelijks op zijn dag.","24":"En Petahja, de zoon van Mesezabeel, van de kinderen van Zerah, de zoon van Juda, stond de koning terzijde in alle zaken die het volk betroffen.","25":"In de dorpen nu, op hun akkers, woonden *sommigen* van de kinderen van Juda, in Kirjath-arba en haar onderhorige plaatsen, en in Dibon en haar onderhorige plaatsen, en in Jekabzeel en haar dorpen;","26":"En te Jesua, en te Molada, en te Beth-pelet,","27":"En te Hazar-sual, en in Berseba, en haar onderhorige plaatsen,","28":"En te Ziklag, en in Mechona en haar onderhorige plaatsen,","29":"En te En-rimmon, en te Zora, en te Jarmuth,","30":"Zanoah, Adullam en haar dorpen, Lachis en haar akkers, Azeka en haar onderhorige plaatsen; en zij legerden zich van Berseba af tot aan het dal Hinnom.","31":"De kinderen van Benjamin nu *woonden*, van Geba af, in Michmas, en Aja, en Beth-el, en haar onderhorige plaatsen,","32":"Anathoth, Nob, Ananja,","33":"Hazor, Rama, Gitthaim,","34":"Hadid, Zeboim, Neballat,","35":"Lod, en Ono, *in* het dal van de werkmeesters.","36":"Van de Levieten nu, *woonden* *sommigen* *in* de verdelingen van Juda, *en* *van* Benjamin."},"SV":{"1":"Voorts woonden de oversten des volks te Jeruzalem; maar het overige des volks wierpen loten, om uit tien een uit te brengen, die in de heilige stad Jeruzalem zou wonen, en negen delen in de *andere* steden.","2":"En het volk zegende al de mannen, die vrijwilliglijk aanboden te Jeruzalem te wonen.","3":"En dit zijn de hoofden van het landschap, die te Jeruzalem woonden; (maar in de steden van Juda woonden, een iegelijk op zijn bezitting, in hun steden, Israël, de priesters, en de Levieten, en de Nethinim, en de kinderen der knechten van Salomo).","4":"Te Jeruzalem dan woonden *sommigen* van de kinderen van Juda, en van de kinderen van Benjamin. Van de kinderen van Juda: Athaja, de zoon van Uzzia, den zoon van Zacharja, den zoon van Amarja, den zoon van Sefatja, den zoon van Mahalaleël, van de kinderen van Perez;","5":"En Maaseja, de zoon van Baruch, den zoon van Kol-hose, den zoon van Hazaja, den zoon van Adaja, den zoon van Jojarib, den zoon van Zacharja, den zoon van Siloni.","6":"Alle kinderen van Perez, die te Jeruzalem woonden, waren vierhonderd acht en zestig dappere mannen.","7":"En dit zijn de kinderen van Benjamin: Sallu, de zoon van Mesullam, den zoon van Joed, den zoon van Pedaja, den zoon van Kolaja, den zoon van Maaseja, den zoon van Ithiel, den zoon van Jesaja;","8":"En na hem Gabbai, Sallai; negenhonderd acht en twintig.","9":"En Joël, de zoon van Zichri, was opziener over hen; en Juda, de zoon van Senua, was de tweede over de stad.","10":"Van de priesteren: Jedaja, de zoon van Jojarib, Jachin;","11":"Seraja, de zoon van Hilkia, den zoon van Mesullam, den zoon van Zadok, den zoon van Merajoth, den zoon van Ahitub, was voorganger van Gods huis;","12":"En hun broederen, die het werk in het huis deden, waren achthonderd twee en twintig. En Adaja, de zoon van Jeroham, den zoon van Pelalja, den zoon van Amzi, den zoon van Zacharja, den zoon van Pashur, den zoon van Malchia;","13":"En zijn broederen, hoofden der vaderen, waren tweehonderd twee en veertig. En Amassai, de zoon van Azareël, den zoon van Achzai, den zoon van Mesillemoth, den zoon van Immer;","14":"En hun broederen, dappere helden, waren honderd acht en twintig; en opziener over hen was Zabdiël, de zoon van Gedolim.","15":"En van de Levieten: Semaja, de zoon van Hassub, den zoon van Azrikam, den zoon van Hasabja, den zoon van Buni.","16":"En Sabbethai, en Jozabad, van de hoofden der Levieten, waren over het buitenwerk van het huis Gods.","17":"En Matthanja, de zoon van Micha, den zoon van Zabdi, den zoon van Asaf, was het hoofd, die de dankzegging begon in het gebed, en Bakbukja was de tweede van zijn broederen; en Abda, de zoon van Sammua, den zoon van Galal, den zoon van Jeduthun.","18":"Al de Levieten in de heilige stad waren tweehonderd vier en tachtig.","19":"En de poortiers: Akkub, Talmon, met hun broederen, die wacht hielden in de poorten, waren honderd twee en zeventig.","20":"Het overige nu van Israël, van de priesters *en* de Levieten, was in alle steden van Juda, een iegelijk in zijn erfdeel.","21":"En de Nethinim woonden in Ofel; en Ziha en Gispa waren over de Nethinim.","22":"En der Levieten opziener te Jeruzalem was Uzzi, de zoon van Bani, den zoon van Hasabja, den zoon van Matthanja, den zoon van Micha; van de kinderen van Asaf waren de zangers tegenover het werk van Gods huis.","23":"Want er was een gebod des konings van hen, te weten, een zeker onderhoud voor de zangers, van elk dagelijks op zijn dag.","24":"En Petahja, de zoon van Mesezabeel, van de kinderen van Zerah, den zoon van Juda, was aan des konings hand, in alle zaken tot het volk.","25":"In de dorpen nu op hun akkers woonden *sommigen* van de kinderen van Juda, in Kirjath-arba en haar onderhorige plaatsen, en in Dibon en haar onderhorige plaatsen, en in Jekabzeel en haar dorpen;","26":"En te Jesua, en te Molada, en te Beth-pelet,","27":"En te Hazar-sual, en in Ber-seba, en haar onderhorige plaatsen,","28":"En te Ziklag, en in Mechona en haar onderhorige plaatsen,","29":"En te En-rimmon, en te Zora, en te Jarmuth,","30":"Zanoah, Adullam en haar dorpen, Lachis en haar akkers, Azeka en haar onderhorige plaatsen; en zij legerden zich van Ber-seba af tot aan het dal Hinnom.","31":"De kinderen van Benjamin nu van Geba *woonden* in Michmas, en Aja, en Beth-el, en haar onderhorige plaatsen,","32":"Anathoth, Nob, Ananja,","33":"Hazor, Rama, Gitthaim,","34":"Hadid, Zeboim, Neballat,","35":"Lod, en Ono, *in* het dal der werkmeesters.","36":"Van de Levieten nu, *woonden* *sommigen* *in* de verdelingen van Juda, *en* *van* Benjamin."},"KJV":{"1":"And the rulers of the people dwelt at Jerusalem: the rest of the people also cast lots, to bring one of ten to dwell in Jerusalem the holy city, and nine parts *to dwell* in *other* cities.","2":"And the people blessed all the men, that willingly offered themselves to dwell at Jerusalem.","3":"Now these *are* the chief of the province that dwelt in Jerusalem: but in the cities of Judah dwelt every one in his possession in their cities, *to wit*, Israel, the priests, and the Levites, and the Nethinims, and the children of Solomon's servants.","4":"And at Jerusalem dwelt *certain* of the children of Judah, and of the children of Benjamin. Of the children of Judah; Athaiah the son of Uzziah, the son of Zechariah, the son of Amariah, the son of Shephatiah, the son of Mahalaleel, of the children of Perez;","5":"And Maaseiah the son of Baruch, the son of Colhozeh, the son of Hazaiah, the son of Adaiah, the son of Joiarib, the son of Zechariah, the son of Shiloni.","6":"All the sons of Perez that dwelt at Jerusalem *were* four hundred threescore and eight valiant men.","7":"And these *are* the sons of Benjamin; Sallu the son of Meshullam, the son of Joed, the son of Pedaiah, the son of Kolaiah, the son of Maaseiah, the son of Ithiel, the son of Jesaiah.","8":"And after him Gabbai, Sallai, nine hundred twenty and eight.","9":"And Joel the son of Zichri *was* their overseer: and Judah the son of Senuah *was* second over the city.","10":"Of the priests: Jedaiah the son of Joiarib, Jachin.","11":"Seraiah the son of Hilkiah, the son of Meshullam, the son of Zadok, the son of Meraioth, the son of Ahitub, *was* the ruler of the house of God.","12":"And their brethren that did the work of the house *were* eight hundred twenty and two: and Adaiah the son of Jeroham, the son of Pelaliah, the son of Amzi, the son of Zechariah, the son of Pashur, the son of Malchiah,","13":"And his brethren, chief of the fathers, two hundred forty and two: and Amashai the son of Azareel, the son of Ahasai, the son of Meshillemoth, the son of Immer,","14":"And their brethren, mighty men of valour, an hundred twenty and eight: and their overseer *was* Zabdiel, the son of *one of* the great men.","15":"Also of the Levites: Shemaiah the son of Hashub, the son of Azrikam, the son of Hashabiah, the son of Bunni;","16":"And Shabbethai and Jozabad, of the chief of the Levites, *had* the oversight of the outward business of the house of God.","17":"And Mattaniah the son of Micha, the son of Zabdi, the son of Asaph, *was* the principal to begin the thanksgiving in prayer: and Bakbukiah the second among his brethren, and Abda the son of Shammua, the son of Galal, the son of Jeduthun.","18":"All the Levites in the holy city *were* two hundred fourscore and four.","19":"Moreover the porters, Akkub, Talmon, and their brethren that kept the gates, *were* an hundred seventy and two.","20":"And the residue of Israel, of the priests, *and* the Levites, *were* in all the cities of Judah, every one in his inheritance.","21":"But the Nethinims dwelt in Ophel: and Ziha and Gispa *were* over the Nethinims.","22":"The overseer also of the Levites at Jerusalem *was* Uzzi the son of Bani, the son of Hashabiah, the son of Mattaniah, the son of Micha. Of the sons of Asaph, the singers *were* over the business of the house of God.","23":"For *it was* the king's commandment concerning them, that a certain portion should be for the singers, due for every day.","24":"And Pethahiah the son of Meshezabeel, of the children of Zerah the son of Judah, *was* at the king's hand in all matters concerning the people.","25":"And for the villages, with their fields, *some* of the children of Judah dwelt at Kirjatharba, and *in* the villages thereof, and at Dibon, and *in* the villages thereof, and at Jekabzeel, and *in* the villages","26":"And at Jeshua, and at Moladah, and at Bethphelet,","27":"And at Hazarshua // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
