s", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Het gebeurde dat Sanballat hoorde dat wij de muur bouwden. Toen ontstak hij in woede en werd erg boos, en hij bespotte de Joden.", "2": "Hij sprak in het bijzijn van zijn broeders en van het leger van Samaria, en zei: Wat doen deze zwakke Joden? Zullen zij zichzelf versterken? Zullen zij offeren? Zullen zij het in één dag afmaken? Zullen zij de stenen uit de puinhopen weer levend maken, terwijl die verbrand zijn?", "3": "En Tobia, de Ammoniet, was bij hem, en zei: Al is het dat zij bouwen, als er een vos opklom, dan zou hij hun stenen muur al kunnen omverhalen.", "4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "5": "Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.", "6": "Wij bouwden dan verder aan de muur, zodat de hele muur tot de helft toe aaneengesloten werd; want het hart van het volk was erop gericht om te werken.", "7": "En het gebeurde, toen Sanballat, Tobia, de Arabieren, de Ammonieten en de Asdodieten hoorden dat het herstel van de muren van Jeruzalem vorderde, dat de scheuren begonnen dichtgemaakt te worden, dat zij erg boos werden.", "8": "En zij maakten allen samen een verbond om te komen strijden tegen Jeruzalem en er verwarring te stichten.", "9": "Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "10": "Toen zei Juda: De kracht van de dragers is uitgeput, en er is veel puin, zodat wij niet aan de muur zullen kunnen bouwen.", "11": "Onze vijanden hadden gezegd: Zij zullen het niet weten, noch zien, totdat wij midden onder hen zijn en hen doodslaan; zo zullen wij het werk stilleggen.", "12": "En het gebeurde, toen de Joden die bij hen woonden kwamen, dat zij het ons wel tien keer zeiden, vanuit alle plaatsen vanwaar zij naar ons terugkwamen.", "13": "Daarom stelde ik het volk op in de lagere plaatsen achter de muur, en op de hoogten, naar hun geslachten, met hun zwaarden, hun speren en hun bogen.", "14": "En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen.", "15": "Daarna gebeurde het, toen onze vijanden hoorden dat het ons bekend was geworden, en dat God hun plan had verijdeld, dat wij allen weer terugkeerden naar de muur, ieder naar zijn werk.", "16": "En het gebeurde van die dag af, dat de helft van mijn knechten bezig was met het werk, en de andere helft van hen de speren, de schilden, de bogen en de pantsers vasthield; en de aanvoerders stonden achter het hele huis van Juda.", "17": "Zij die aan de muur bouwden en zij die de lasten droegen, en zij die inlaadden, waren ieder met de ene hand bezig met het werk, en met de andere hielden zij het wapen vast.", "18": "En de bouwers hadden ieder zijn zwaard aan zijn heup gegord en bouwden; en hij die op de bazuin blies, was bij mij.", "19": "En ik zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Het werk is groot en uitgestrekt, en wij staan verspreid op de muur, de een ver van de ander.", "20": "Op de plaats waar u het geluid van de bazuin zult horen, daarheen moet u zich naar ons toe verzamelen; onze God zal voor ons strijden.", "21": "Zo waren wij bezig met het werk; en de helft van hen hield de speren vast, vanaf het opkomen van het dageraad tot het verschijnen van de sterren toe.", "22": "Ook zei ik in die tijd tegen het volk: Ieder moet met zijn knecht binnen Jeruzalem overnachten, zodat zij ons 's nachts tot wacht zijn, en overdag aan het werk.", "23": "Verder trokken noch ik, noch mijn broeders, noch mijn knechten, noch de mannen van de wacht die achter mij waren, onze kleren uit; ieder had zijn wapen, ook bij het water."}, "SV": {"1": "Maar het geschiedde, als Sanballat gehoord had, dat wij den muur bouwden, zo ontstak hij, en werd zeer toornig; en hij bespotte de Joden.", "2": "En sprak in de tegenwoordigheid zijner broederen en van het heir van Samaria, en zeide: Wat doen deze amechtige Joden? Zal men hen laten geworden? Zullen zij offeren? Zullen zij het in een dag voleinden? Zullen zij de steentjes uit de stofhopen levend maken, daar zij verbrand zijn?", "3": "En Tobia, de Ammoniet, was bij hem, en zeide: Al is het, dat zij bouwen, zo er een vos opkwame, hij zou hun stenen muur wel verscheuren.", "4": "Hoor, o onze God! dat wij zeer veracht zijn, en keer hun versmaadheid weder op hun hoofd, en geef hen over tot een roof in een land der gevangenis.", "5": "En dek hun ongerechtigheid niet toe; en hun zonde worde niet uitgedelgd van voor Uw aangezicht, want zij hebben *U* getergd, *staande* tegenover de bouwlieden.", "6": "Doch wij bouwden den muur, zodat de ganse muur samengevoegd werd tot zijn helft toe; want het hart des volks was om te werken.", "7": "En het geschiedde, als Sanballat, en Tobia, en de Arabiëren, en de Ammonieten, en de Asdodieten hoorden, dat de verbetering aan de muren van Jeruzalem toenam, dat de scheuren begonnen gestopt te worden, zo ontstaken zij zeer;", "8": "En zij maakten allen te zamen een verbintenis, dat zij zouden komen om tegen Jeruzalem te strijden, en een verbijstering daarin te maken.", "9": "Maar wij baden tot onzen God, en zetten wacht tegen hen, dag en nacht, hunnenthalve.", "10": "Toen zeide Juda: De kracht der dragers is vervallen, en des stofs is veel, zodat wij aan den muur niet zullen kunnen bouwen.", "11": "Nu hadden onze vijanden gezegd: Zij zullen het niet weten, noch zien, totdat wij in het midden van hen komen, en slaan hen dood; alzo zullen wij het werk doen ophouden.", "12": "En het geschiedde, als de Joden, die bij hen woonden, kwamen, dat zij het ons *wel* tienmaal zeiden, uit al de plaatsen, *door* dewelke gij tot ons wederkeert.", "13": "Daarom zette ik in de benedenste plaatsen achter den muur, *en* op de hoogten, en ik zette het volk naar de geslachten, met hun zwaarden, hun spiesen en hun bogen.", "14": "En ik zag toe, en maakte mij op, en zeide tot de edelen, en tot de overheden, en tot het overige des volks: Vreest niet voor hun aangezicht; denkt aan dien groten en vreselijken Heere, en strijdt voor uw broederen, uw zonen en uw dochteren, uw vrouwen en uw huizen.", "15": "Daarna geschiedde het, als onze vijanden hoorden, dat het ons bekend was geworden, en God hun raad te niet gemaakt had, zo keerden wij allen weder tot den muur, een iegelijk tot zijn werk.", "16": "En het geschiedde van dien dag af, dat de helft mijner jongens doende waren aan het werk, en de helft van hen hielden de spiesen, en de schilden, en de bogen, en de pantsiers; en de oversten waren achter het ganse huis van Juda.", "17": "Die aan den muur bouwden, en die den last droegen, *en* die oplaadden, waren een ieder met zijn ene hand doende aan het werk, en de andere hield het geweer.", "18": "En de bouwers hadden een iegelijk zijn zwaard aan zijn lenden gegord, en bouwden; maar die met de bazuin blies, was bij mij.", "19": "En ik zeide tot de edelen, en tot de overheden, en tot het overige des volks: Het werk is groot en wijd; en wij zijn op den muur afgezonderd, de een ver van den ander;", "20": "Ter plaatse, waar gij het geluid der bazuin zult horen, daarheen zult gij u tot ons verzamelen; onze God zal voor ons strijden.", "21": "Alzo waren wij doende aan het werk; en de helft van hen hielden de spiesen, van het opgaan des dageraads tot het voortkomen der sterren toe.", "22": "Ook zeide ik te dier tijd tot het volk: Een iegelijk vernachte met zijn jongen binnen Jeruzalem, opdat zij ons des nachts ter wacht zijn, en des daags aan het werk.", "23": "Voorts noch ik, noch mijn broederen, noch mijn jongelingen, noch de mannen van de wacht, die achter mij waren, wij trokken onze klederen niet uit; een iegelijk *had* zijn geweer *en* water."}, "KJV": {"1": "But it came to pass, that when Sanballat heard that we builded the wall, he was wroth, and took great indignation, and mocked the Jews.", "2": "And he spake before his brethren and the army of Samaria, and said, What do these feeble Jews? will they fortify themselves? will they sacrifice? will they make an end in a day? will they revive the stones out of the heaps of the rubbish which are burned?", "3": "Now Tobiah the Ammonite *was* by him, and he said, Even that which they build, if a fox go up, he shall even break down their stone wall.", "4": "Hear, O our God; for we are despised: and turn their reproach upon their own head, and give them for a prey in the land of captivity:", "5": "And cover not their iniquity, and let not their sin be blotted out from before thee: for they have provoked *thee* to anger before the builders.", "6": "So built we the wall; and all the wall was joined together unto the half thereof: for the people had a mind to work.", "7": "But it came to pass, *that* when Sanballat, and Tobiah, and the Arabians, and the Ammonites, and the Ashdodites, heard that the walls of Jerusalem were made up, *and* that the breaches began to be stopped, then they were very wroth,", "8": "And conspired all of them together to come *and* to fight against Jerusalem, and to hinder", "9": "Nevertheless we made our prayer unto our God, and set a watch against them day and night, because", "10": "And Judah said, The strength of the bearers of burdens is decayed, and *there is* much rubbish; so that we are not able to build the wall.", "11": "And our adversaries said, They shall not know, neither see, till we come in the midst among them, and slay them, and cause the work to cease.", "12": "And it came to pass, that when the Jews which dwelt by them came, they said unto us ten times, From all places whence ye shall return", "13": "Therefore set I in the lower places behind the wall, *and* on the higher places, I even set the people after their families with their swords, their spears, and their bows.", "14": "And I looked, and rose up, and said unto the nobles, and to the rulers, and to the rest of the people, Be not ye afraid of them: remember the Lord, *which is* great and terrible, and fight for your brethren, your sons, and your daughters, your wives, and your houses.", "15": "And it came to pass, when our enemies heard that it was known unto us, and God had brought their counsel to nought, that we returned all of us to the wall, every one unto his work.", "16": "And it came to pass from that time forth, *that* the half of my servants wrought in the work, and the other half of them held both the spears, the shields, and the bows, and the habergeons; and the rulers *were* behind all the house of Judah.", "17": "They which builded on the wall, and they that bare burdens, with those that laded, *every one* with one of his hands wrought in the work, and with the other *hand* held a weapon.", "18": "For the builders, every one had his sword girded by his side, and *so* builded. And he that sounded the trumpet *was* by me.", "19": "And I said unto the nobles, and to the rulers, and to the rest of the people, The work *is* great and large, and we are separated upon the wall, one far from another.", "20": "In what place *therefore* ye hear the sound of the trumpet, resort ye thither unto us: our God shall fight", "21": "So we laboured in the work: and half of them held the spears from the rising of the morning till the stars appeared.", "22": "Likewise at the same time said I unto the people, Let every one with his servant lodge within Jerusalem, that in the night they may be a guard to us, and labour on the day.", "23": "So neither I, nor my brethren, nor my servants, nor the men of the guard which followed me, none of us put off our clothes, *saving that* every one put them off for washing."}}, "tsk": {"1": [{"kopje": "Sanballat", "refs": ["Neh 2:10", "Neh 2:19", "Ezra 4:1-5", "Hand 5:17"]}, {"kopje": "bespotte", "refs": ["Ps 35:15", "Ps 35:16", "Ps 44:14", "Ps 44:15", "Matt 27:29", "Hebr 11:36"]}], "2": [{"kopje": "het leger", "refs": ["Ezra 4:9", "Ezra 4:10"]}, {"kopje": "zwakke", "refs": ["1 Sam 14:11", "1 Sam 14:12", "1 Sam 17:43", "1 Sam 17:44", "Zach 12:8", "1 Kor 1:27"]}, {"kopje": "offeren", "refs": ["Neh 12:27", "Neh 12:43"]}, {"kopje": "weer levend maken", "refs": ["Neh 4:10", "Ezech 37:3-13", "Hab 3:2"]}], "3": [{"kopje": "Tobia", "refs": ["Neh 2:10", "Neh 2:19", "Neh 6:1", "1 Kon 20:10", "1 Kon 20:18", "2 Kon 18:23"]}], "4": [{"kopje": "Hoor", "refs": ["Ps 123:3", "Ps 123:4"]}, {"kopje": "keer terug", "re Of Nehemiah", "href": "../../nave/s/?hl=Neh.4.23#i18355", "refs": [{"disp": "Neh 4:16", "href": "../../nehemia/4/#v16", "ref": "Neh 4:16", "svLabel": null}, {"disp": "Neh 4:23", "href": "../../nehemia/4/#v23", "ref": "Neh 4:23", "svLabel": null}], "kinderen": []}]}]}], "torrey": [{"topic": "Servants", "href": "../../torrey/s/#t-servants", "kinderen": [{"label": "Duties Of, To Masters", "href": "../../torrey/s/?hl=Neh.4.23#i19374", "refs": [], "kinderen": [{"label": "To be industrious in labouring for them", "href": "../../torrey/s/?hl=Neh.4.23#i19390", "refs": [{"disp": "Neh 4:16", "href": "../../nehemia/4/#v16", "ref": "Neh 4:16", "svLabel": null}, {"disp": "Neh 4:23", "href": "../../nehemia/4/#v23", "ref": "Neh 4:23", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Zach 14:3": "En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd.", "Spr 15:8": "Het offer van de goddelozen is de HEERE een gruwel; maar het gebed van de oprechten is Zijn welgevallen.", "2 Petr 1:19": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.", "Deut 31:23": "En Hij gebood Jozua, de zoon van Nun, en zei: Wees sterk en heb goede moed, want u zult de kinderen van Israël brengen in het land, dat Ik hun gezworen heb; en Ik zal met u zijn.", "Ps 71:12": "O God, wees niet ver van mij; mijn God! haast U tot mijn hulp.", "Matt 14:30": "Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!", "Jes 44:22": "Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.", "Ps 59:16": "Laat hen zelfs omzwerven om eten; en laat hen vernachten, ook al zijn zij niet verzadigd.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Jes 63:15-17": "Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in. U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam. HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "Ps 37:40": "En de HEERE zal hen helpen, en zal hen bevrijden; Hij zal hen bevrijden van de goddelozen, en zal hen behouden; want zij vertrouwen op Hem.", "Richt 16:28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "Ps 31:15-19": "Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God. Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers. Laat Uw aangezicht over Uw knecht lichten; verlos mij door Uw goedertierenheid.", "Luk 4:1-13": "En Jezus, vol van de Heilige Geest, keerde terug van de Jordaan, en werd door de Geest geleid in de woestijn; En werd veertig dagen beproefd door de duivel; en at helemaal niets in die dagen, en toen ze voorbij waren, kreeg Hij ten laatste honger. En de duivel zei tegen Hem: Als U Gods Zoon bent, zeg tegen deze steen dat hij brood wordt.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Ezra 5:8": "De koning zij bekend, dat wij naar het landschap Juda getrokken zijn, naar het huis van de grote God, dat gebouwd wordt met grote stenen, en het hout wordt gelegd in de wanden; en dat werk wordt snel gedaan en gaat voorspoedig door hun handen voort.", "Jer 14:19-21": "Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "Jes 52:8": "Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Ps 35:16": "Onder spotachtige tafelbroeders die huichelden, knerste men over mij met de tanden.", "2 Sam 12:22": "En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "Ezech 17:17": "Ook zal farao, met een groot leger en een grote menigte van het krijgsvolk, niets voor hem uitrichten in de oorlog, wanneer men een wal zal opwerpen, en wanneer men vestingen zal bouwen, om veel mensenlevens uit te roeien.", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Neh 1:5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Ps 102:3": "Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage van mijn benauwdheid; ten dage als ik roep, verhoor mij haastig.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "Jer 17:18": "Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Ps 109:29": "Laat mijn tegenstanders met schande bekleed worden, en laat hen zich met hun schande bedekken, als met een mantel.", "Ps 69:29": "Laat hen uitgedelgd worden uit het boek van het leven, en met de rechtvaardigen niet aangeschreven worden.", "Gen 32:9-12": "Verder zei Jakob: O, God van mijn vader Abraham, en God van mijn vader Izak, o HEERE! Die tegen mij gezegd hebt: Keer terug naar uw land en naar uw familie, en Ik zal u goeddoen! Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden! Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Jer 14:8": "O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! Waarom zou U zijn als een vreemdeling in het land, en als een reiziger die slechts inkeert om te overnachten?", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Deut 11:29": "En het zal gebeuren, als de HEERE, uw God, u zal hebben binnengebracht in het land, waar u naartoe gaat, om dat te erven; dan zult u de zegen uitspreken op de berg Gerizim, en de vloek op de berg Ebal.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Dan 9:25": "Weet dan, en versta: van het uitgaan van het woord om te doen terugkeren en om Jeruzalem te bouwen, tot op de Messias, de Vorst, zijn zeven weken, en tweeënzestig weken; de straten en de grachten zullen weer gebouwd worden, maar in benauwdheid van de tijden.", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Openb 12:12": "Daarom, verheug u, hemelen, en u die daarin woont! Wee hun die de aarde en de zee bewonen, want de duivel is naar u afgekomen, en heeft grote toorn, wetende dat hij nog maar een korte tijd heeft.", "Ps 77:3": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.", "Deut 20:4": "Want het is de HEERE, uw God, Die met u meegaat, om voor u te strijden tegen uw vijanden, om u te verlossen.", "Neh 11:1": "Verder woonden de leiders van het volk te Jeruzalem; maar het overige van het volk wierp loten, om uit tien er één uit te brengen, die in de heilige stad Jeruzalem zou wonen, en negen delen in de andere steden.", "1 Kor 6:13": "De spijzen zijn voor de buik, en de buik is voor de spijzen; maar God zal beide dit en dat tenietdoen. Maar het lichaam is niet voor de hoererij, maar voor de Heere, en de Heere voor het lichaam.", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Deut 11:30": "Zijn zij niet aan de overkant van de Jordaan, achter de weg van de ondergang van de zon, in het land van de Kanaänieten, die in het vlakke veld wonen, tegenover Gilgal, bij de eikenbossen van More?", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "Joz 22:5": "Neem alleen nauwgezet in acht om te doen het gebod en de wet, die Mozes, de dienaar van de HEERE, u geboden heeft: dat u de HEERE, uw God, liefhebt, en dat u wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat u Hem dient met uw hele hart en met uw hele ziel.", "1 Sam 5:1": "De Filistijnen namen de ark van God, en zij brachten die van Eben-haezer naar Asdod.", "Matt 7:8": "Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden.", "Ps 90:15": "Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.", "Deut 4:9": "Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.", "Ps 55:10": "Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Neh 4:13-18": "Daarom stelde ik het volk op in de lagere plaatsen achter de muur, en op de hoogten, naar hun geslachten, met hun zwaarden, hun speren en hun bogen. En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen. Daarna gebeurde het, toen onze vijanden hoorden dat het ons bekend was geworden, en dat God hun plan had verijdeld, dat wij allen weer terugkeerden naar de muur, ieder naar zijn werk.", "Ps 74:19": "Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.", "Luk 21:36": "Waak dan te allen tijde, en bid, dat u waardig geacht mag worden om al deze dingen die gebeuren zullen te ontvluchten, en te staan voor de Zoon des mensen.", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "1 Tess 5:4": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.", "Neh 10:32-39": "Vervolgens legden wij ons geboden op, waarbij wij ons een derde deel van een sikkel per jaar opgelegd hadden, voor de dienst van het huis van onze God; Voor het brood van de bereiding, en het gedurige spijsoffer, en voor het gedurige brandoffer, van de sabbatten, van de nieuwe maanden, voor de vastgestelde hoogtijden, en voor de heilige dingen, en voor de zondoffers, om verzoening te doen over Israël; en voor al het werk van het huis van onze God. Ook wierpen wij de loten, onder de priesters, de Levieten en het volk, over het offer van het hout, dat men brengen zou naar het huis van onze God, naar het huis van onze vaderen, op bestemde tijden, jaar op jaar, om te branden op het altaar van de HEERE, onze God, zoals het in de wet geschreven is;", "Luk 12:22-32": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "1 Tim 4:16": "Let op uzelf en op de leer; volhard daarin; want als u dat doet, zult u zowel uzelf behouden als hen die u horen.", "Jer 18:21-23": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd. Laat er een geschrei uit hun huizen gehoord worden, wanneer U snel een bende over hen brengt; omdat zij een kuil gegraven hebben om mij te vangen, en strikken verborgen hebben voor mijn voeten. Doch U, HEERE, weet al hun plannen tegen mij, om mij te doden; maak geen verzoening over hun ongerechtigheid, en delg hun zonde niet uit van voor Uw aangezicht; maar laat hen neergeveld worden voor Uw aangezicht; handel zo met hen, in de tijd van Uw toorn.", "Neh 6:3": "Ik echter stuurde boden naar hen om te zeggen: Ik ben bezig met een groot werk, zodat ik niet kan afkomen; waarom zou dit werk stilvallen doordat ik het zou laten liggen en naar u af zou komen?", "Ezech 35:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE: Ik zal ook handelen naar uw toorn en naar uw jaloezie, die u uit uw haat tegen hen hebt uitgevoerd; en Ik zal Mij aan hen bekendmaken, wanneer Ik u geoordeeld zal hebben.", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Ps 10:2": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben.", "Matt 26:40": "En Hij kwam bij de discipelen en vond hen slapend, en zei tegen Petrus: Kunt u dan niet één uur met Mij waken?", "1 Sam 14:12": "Verder antwoordden de mannen van de bezetting Jonathan en zijn wapendrager, en zeiden: Klim op naar ons, en wij zullen u iets duidelijk maken. En Jonathan zei tegen zijn wapendrager: Klim achter mij op, want de HEERE heeft hen gegeven in de hand van Israël.", "2 Kron 13:12-17": "Zie daarom, God is met ons aan het hoofd, en Zijn priesters met de trompetten van het geschal, om alarm tegen u te laten klinken; o kinderen van Israël, strijd niet tegen de HEERE, de God van uw vaderen, want u zult geen voorspoed hebben. Maar Jerobeam liet een hinderlaag omtrekken, om van achteren bij hen te komen; zo stonden zij vóór Juda, en de hinderlaag was achter hen. Toen Juda nu omkeek, zie, toen hadden zij de strijd vóór en achter zich; en zij riepen tot de HEERE, en de priesters bliezen op de trompetten.", "Ps 10:12-15": "Sta op, HEERE God! Hef Uw hand op, vergeet de ellendigen niet. Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken? U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Ps 142:2": "Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.", "Richt 7:19-23": "Zo kwam Gideon, en honderd mannen die met hem waren, aan het uiterste van het leger, aan het begin van de middelste nachtwaak, net toen zij de wachters gesteld hadden; en zij bliezen op de bazuinen, en sloegen de kruiken die in hun hand waren stuk. Zo bliezen de drie groepen op de bazuinen, en braken de kruiken; en zij hielden met de linkerhand de fakkels vast, en met hun rechterhand de bazuinen om te blazen; en zij riepen: Het zwaard van de HEERE, en van Gideon! En zij bleven staan, ieder op zijn plaats, rondom het leger. Toen liep het hele leger uiteen, en zij schreeuwden en vluchtten.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Deut 31:6-8": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten. En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven. De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Ezra 6:14-22": "En de oudsten van de Joden bouwden en gingen voorspoedig verder, door de profetie van de profeet Haggai en Zacharia, de zoon van Iddo; en zij bouwden en voltooiden het, naar het bevel van de God van Israël, en naar het bevel van Kores, en Darius, en Arthahsasta, koning van Perzië. En dit huis werd voltooid op de derde dag van de maand Adar; dat was in het zesde jaar van het koninkrijk van koning Darius. En de kinderen van Israël, de priesters en Levieten, en de overige kinderen van de wegvoering hielden de inwijding van dit huis van God met vreugde.", "2 Kron 11:11": "En hij versterkte deze vestingen, en stelde er leiders in aan, en voorraden voedsel, en olie, en wijn;", "Jer 33:4": "Want zo zegt de HEERE, de God van Israël, van de huizen van deze stad, en van de huizen van de koningen van Juda, die door de wallen en door het zwaard zijn afgebroken:", "Ps 59:6-14": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela. Tegen de avond keren zij terug, zij tieren als een hond, en gaan rond om de stad. Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?", "Neh 13:7-9": "En ik kwam te Jeruzalem, en begreep het kwaad dat Eljasib voor Tobia gedaan had, door hem een kamer te maken in de voorhoven van het huis van God. En het mishaagde mij zeer; zo wierp ik al het huisraad van Tobia buiten, uit de kamer. Vervolgens gaf ik bevel, en zij reinigden de kamers; en ik bracht daar de vaten van het huis van God weer in, met het spijsoffer en de wierook.", "1 Kon 8:36-50": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "1 Kon 20:18": "En hij zei: Of zij nu tot vrede uitgetrokken zijn, grijpt hen levend; of ook, dat zij ten strijde uitgetrokken zijn, grijpt hen levend.", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "Neh 9:32": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.", "Ps 116:4": "Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "Jes 35:3": "Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Richt 5:11": "Van het gedruis van de schutters, tussen de plaatsen waar men water schept, spreekt men daar samen van de gerechtigheid van de HEERE, van de gerechtigheden, bewezen aan Zijn dorpen in Israël; toen ging het volk van de HEERE af naar de poorten.", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Joz 8:34": "En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.", "Mark 9:28": "En toen Hij in huis gegaan was, vroegen Zijn discipelen Hem apart: Waarom konden wij hem niet uitdrijven?", "Hoogl 3:8": "Die allemaal zwaarden vasthouden, geoefend ten oorlog, ieder met zijn zwaard aan zijn heup, vanwege de schrik 's nachts.", "1 Kon 8:25": "En nu, HEERE, God van Israël, houd Uw dienaar, mijn vader David, wat U tot hem gesproken hebt, en zei: Er zal u geen man van voor Mijn aangezicht afgesneden worden, die op de troon van Israël zit; alleen als uw zonen hun weg bewaren, om te wandelen voor Mijn aangezicht, zoals u gewandeld hebt voor Mijn aangezicht.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Ps 74:11": "Waarom trekt U Uw hand, ja, Uw rechterhand terug? Trek haar uit het midden van Uw boezem; maak er een einde aan.", "Ps 35:4": "Laat hen beschaamd worden en te schande, die mijn ziel zoeken; laat hen achterwaarts gedreven worden en schaamrood, die kwaad tegen mij bedenken.", "Rom 12:11": "Wees niet traag in het benaarstigen. Wees vurig van geest. Dien de Heere.", "Luk 6:11": "Maar zij werden vervuld met woede, en overlegden met elkaar wat zij Jezus zouden aandoen.", "Ps 119:39": "Wend mijn smaad af, die ik vrees, want Uw rechten zijn goed.", "Ps 10:1": "HEERE, waarom staat U ver weg? Waarom verbergt U Zich in tijden van benauwdheid?", "Neh 11:2": "En het volk zegende alle mannen, die vrijwillig aanboden te Jeruzalem te wonen.", "Hand 7:59": "En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.", "Ps 62:9": "Vertrouw op Hem te allen tijde, o volk! Stort uw hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Ps 109:1-31": "Een psalm van David, voor de koorleider. O God van mijn lof! Zwijg niet. Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong. En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak.", "2 Sam 1:18": "toen hij gezegd had dat men de kinderen van Juda de boog moest leren; kijk, het is geschreven in het boek van de Oprechten.", "Neh 4:16-22": "En het gebeurde van die dag af, dat de helft van mijn knechten bezig was met het werk, en de andere helft van hen de speren, de schilden, de bogen en de pantsers vasthield; en de aanvoerders stonden achter het hele huis van Juda. Zij die aan de muur bouwden en zij die de lasten droegen, en zij die inlaadden, waren ieder met de ene hand bezig met het werk, en met de andere hielden zij het wapen vast. En de bouwers hadden ieder zijn zwaard aan zijn heup gegord en bouwden; en hij die op de bazuin blies, was bij mij.", "1 Tess 4:11": "En dat u zich beijvert om stil te zijn, en uw eigen zaken te doen, en te werken met uw eigen handen, zoals wij u bevolen hebben;", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "2 Sam 22:7": "Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; en Hij hoorde mijn stem uit Zijn paleis, en mijn geroep kwam in Zijn oren.", "Ps 44:15": "U stelt ons tot een spreekwoord onder de heidenvolken, tot een hoofdschudden onder de volken.", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "Job 16:20": "Mijn vrienden bespotten mij; maar mijn oog druipt tot God.", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Ps 71:4": "Mijn God, bevrijd mij van de hand van de goddeloze, van de hand van hem die verkeerd handelt, en van de opgeblazene.", "Neh 13:31": "Ook voor het offer van het hout, op vastgestelde tijden, en voor de eerstelingen. Denk aan mij, mijn God, ten goede.", "Neh 13:24": "En hun kinderen spraken half Asdodisch, en zij konden geen Joods spreken, maar naar de taal van ieder volk.", "Jer 42:11": "Vrees niet voor het aangezicht van de koning van Babel, voor wie u vreest; vrees niet voor hem, spreekt de HEERE; want Ik zal met u zijn, om u te behouden en u van zijn hand te redden.", "Ps 71:2": "Red mij door Uw gerechtigheid, en bevrijd mij; neig Uw oor tot mij, en verlos mij.", "Ps 119:9": "Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord.", "Ps 77:11-21": "Daarna zei ik: Dit krenkt mij; maar de rechterhand van de Allerhoogste verandert. Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken; En ik zal al Uw werken overdenken, en van Uw daden spreken.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "Matt 25:13": "Waak dan; want u weet de dag niet, en ook het uur niet, waarop de Zoon des mensen komen zal.", "Gen 32:28": "Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Ex 23:13": "In alles wat Ik tegen u gezegd heb, zult u op uw hoede zijn; en de naam van andere goden zult u niet noemen; uit uw mond zal hij niet gehoord worden!", "Richt 10:7-18": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten. Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt. Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "1 Tess 5:6": "Laten wij dan niet slapen, zoals de anderen, maar laten wij waken en nuchter zijn.", "2 Kon 19:6": "En Jesaja zei tegen hen: Zo zult u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bevreesd voor de woorden die u gehoord hebt, waarmee de dienaars van de koning van Assyrië Mij gelasterd hebben.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Ps 38:13": "En die mijn ziel zoeken, leggen mij strikken; en die mijn kwaad zoeken, spreken verderfelijke dingen, en zij overdenken de hele dag listen.", "Mark 13:33-37": "Let op, waak en bid; want u weet niet wanneer de tijd is. Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken; Waak dan (want u weet niet wanneer de heer des huizes zal komen, laat in de avond, of te middernacht, of bij het hanengekraai, of in de ochtend);", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Ps 25:3": "Gimel. Ja, allen die U verwachten, zullen niet beschaamd worden; zij zullen beschaamd worden, die trouweloos handelen zonder oorzaak.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Deut 11:16": "Wacht uzelf, dat uw hart niet verleid wordt, dat u afwijkt, en andere goden dient, en u voor die buigt;", "Ezra 1:6": "Allen nu die rondom hen waren, ondersteunden hen met zilveren voorwerpen, met goud, met bezit, en met vee, en met kostbaarheden; behalve alles wat vrijwillig gegeven werd.", "1 Tess 5:21": "Beproef alle dingen; behoud het goede.", "2 Kron 15:7": "Daarom, wees u sterk, en laat uw handen niet verslappen; want er is loon naar uw werk.", "1 Kor 1:27": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen;", "Ps 2:1-3": "Waarom woeden de heidenen, en bedenken de volken iets zinloos? De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen: Laat ons hun banden verscheuren, en hun touwen van ons afwerpen.", "2 Tim 2:3": "Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Ps 73:2-26": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Neh 5:16": "Daartoe heb ik ook aan het werk van deze muur gewerkt, en wij hebben geen land gekocht; en al mijn knechten zijn daar verzameld geweest tot het werk.", "Ps 143:5": "Ik denk aan de dagen van vroeger; ik overleg al Uw daden; ik spreek bij mijzelf over de werken van Uw handen.", "Neh 7:2": "En ik gaf bevel aan mijn broer Hanani, en aan Hananja, de leider van de burcht in Jeruzalem, want hij was een man van trouw, en godvrezend boven velen.", "Jes 36:12": "Maar Rabsake zei: Heeft mijn heer mij naar uw heer en naar u gezonden om deze woorden te spreken? Is het niet naar de mannen die op de muur zitten, om met u hun eigen drek te eten en hun eigen water te drinken?", "Jes 63:11-13": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde? Die de arm van Zijn heerlijkheid heeft laten gaan aan de rechterhand van Mozes; Die de wateren voor hun aangezicht kliefde, opdat Hij Zich een eeuwige Naam maakte? Die hen leidde door de afgronden; als een paard in de woestijn, struikelden zij niet.", "Ps 119:107": "Ik ben helemaal zeer verdrukt, HEERE! maak mij levend naar Uw woord.", "Neh 12:27": "Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen.", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Ps 115:11": "U die de HEERE vreest! vertrouw op de HEERE; Hij is hun Hulp en hun Schild.", "Gen 32:24-28": "Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging. En toen Hij zag dat Hij niet de overhand over hem kreeg, raakte Hij zijn heupgewricht aan, zodat het heupgewricht van Jakob verwrongen raakte, terwijl Hij met hem worstelde. En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.", "Ps 54:7": "Hij zal dit kwaad aan mijn belagers vergelden; roei hen uit door Uw waarheid.", "2 Petr 3:17": "U dan, geliefden, omdat u dit van tevoren weet, wees op uw hoede, dat u niet mede weggesleept wordt door de dwaling van de verdorven mensen, en afvalt van uw eigen standvastigheid;", "Ex 17:4": "Toen riep Mozes tot de HEERE en zei: Wat moet ik met dit volk doen? Het scheelt niet veel, of zij zullen mij stenigen.", "Ps 141:3": "HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "2 Tim 4:15": "Wees ook u voor hem op uw hoede, want hij heeft onze woorden sterk tegengestaan.", "Ps 70:4": "Laat hen terugkeren tot loon van hun beschaming, die daar zeggen: Ha, ha!", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Job 5:12": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "1 Kon 2:3": "En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "Ps 31:2-5": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid. Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden. Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "Neh 13:12": "Toen bracht heel Juda de tienden van het koren, en van de most, en van de olie, naar de schatkamers.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "2 Sam 18:24": "David nu zat tussen de twee poorten; en de wachter ging op het dak van de poort bij de muur staan, en hief zijn ogen op, en zag, en zie, er liep een man alleen.", "2 Kon 19:7": "Zie, Ik zal een geest in hem geven, zodat hij een gerucht zal horen en weer naar zijn land zal terugkeren; en Ik zal hem door het zwaard vellen in zijn land.", "2 Kron 26:9": "Daartoe bouwde Uzzia torens te Jeruzalem, bij de Hoekpoort en bij de Dalpoort, en bij de hoeken, en hij versterkte ze.", "Joël 2:21": "Vrees niet, o land! verheug u, en wees blijde; want de HEERE heeft grote dingen gedaan.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Ps 94:1-23": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend! Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen. Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?", "Ps 5:11": "Verklaar hen schuldig, o God; laat hen vervallen van hun raadslagen; drijf hen weg om de veelheid van hun overtredingen, want zij zijn opstandig tegen U.", "Ps 27:11": "HEERE, leer mij Uw weg, en leid mij op het rechte pad, omwille van mijn verspieders.", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "Jes 47:11": "Daarom zal er over u een kwaad komen, u zult de dageraad daarvan niet weten; en een verderf zal er op u vallen, dat u niet zult kunnen verzoenen; want er zal snel een onstuimige verwoesting over u komen, zodat u het niet weten zult.", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Ps 66:5": "Komt en ziet de daden van God; Hij is ontzagwekkend van werking voor de mensenkinderen.", "Ezra 1:5": "Toen maakten de hoofden van de families van Juda en Benjamin zich klaar, en de priesters en de Levieten, met ieder wiens geest God opwekte, om op te trekken en het huis van de HEERE te bouwen, dat te Jeruzalem woont.", "Ps 35:8": "De verwoesting overkomt hem, zodat hij het niet weet, en zijn net, dat hij verborgen heeft, vangt hemzelf; hij valt daarin met verwoesting.", "Ps 119:145-149": "Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren. Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden. Ik ben de morgenschemering voorgekomen, en heb geschrei gemaakt; op Uw woord heb ik gehoopt.", "Deut 4:23": "Wacht u ervoor dat u het verbond van de HEERE, uw God, dat Hij met u gesloten heeft, vergeet, zodat u een gesneden beeld zou maken, de gelijkenis van iets dat de HEERE, uw God, u verboden heeft.", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Ps 55:17-23": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen. 's Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen. Hij heeft mijn ziel in vrede verlost van de strijd tegen mij; want met velen zijn zij tegen mij geweest.", "Matt 15:22-28": "En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten. Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na. Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Mark 13:32-37": "Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader. Let op, waak en bid; want u weet niet wanneer de tijd is. Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken;", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "2 Kon 18:23": "Nu dan, wed toch met mijn heer, de koning van Assyrië; en ik zal u tweeduizend paarden geven, als u de ruiters daarop zult kunnen geven.", "Jes 36:11": "Toen zei Eljakim, en Sebna, en Joah tegen Rabsake: Spreek toch tegen uw knechten in het Syrisch, want wij verstaan het wel; en spreek niet met ons in het Joods, ten aanhoren van het volk dat op de muur is.", "Jes 43:25": "Ik, Ik ben het, Die uw overtredingen uitwis, om Mijnentwil, en Ik denk aan uw zonden niet.", "Jes 38:2": "Toen keerde Hizkia zijn gezicht om naar de wand, en hij bad tot de HEERE.", "Klaagl 1:20": "Resch. Zie, HEERE, want mij is bang; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer opstandig geweest; van buiten heeft mij het zwaard van kinderen beroofd, van binnen is het als de dood.", "Matt 4:1-11": "Toen werd Jezus door de Geest weggeleid naar de woestijn, om beproefd te worden door de duivel. En toen Hij veertig dagen en veertig nachten gevast had, kreeg Hij ten laatste honger. En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "Hab 2:1": "Ik stond op mijn wachtpost, en ik ging op de vestingmuur staan, en ik hield wacht om te zien wat Hij tot mij spreken zou, en wat ik antwoorden zou op mijn bestraffing.", "Jes 64:1-3": "Och, dat U de hemelen scheurde, dat U neerkwam, dat de bergen van Uw aangezicht wegsmolten; Zoals een smeltvuur brandt, en het vuur het water doet opborrelen, om Uw Naam aan Uw tegenstanders bekend te maken! Laat zo de heidenen voor Uw aangezicht beven. Toen U vreselijke dingen deed, die wij niet verwachtten; U kwam neer, van Uw aangezicht smolten de bergen weg.", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "1 Sam 17:44": "Daarna zei de Filistijn tegen David: Kom naar mij toe, dan zal ik uw vlees aan de vogels van de hemel geven, en aan de dieren van het veld.", "Ps 119:153": "Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Neh 5:15": "En de vorige landvoogden, die vóór mij geweest zijn, hebben het volk bezwaard en van hen genomen aan brood en wijn, daarna veertig zilveren sikkels; ook heersten hun knechten over het volk; maar ik heb dat niet gedaan, om de vreze van God.", "Richt 11:12-40": "Vervolgens zond Jeftha boden naar de koning van de kinderen van Ammon, en zei: Wat hebben ik en u met elkaar te maken, dat u naar mij toe bent gekomen om tegen mijn land te strijden? En de koning van de kinderen van Ammon zei tegen de boden van Jeftha: Omdat Israël, toen het optrok uit Egypte, mijn land heeft afgenomen, van de Arnon af tot aan de Jabbok, en tot aan de Jordaan; geef mij dat nu dus in vrede terug. Maar Jeftha ging verder, en zond opnieuw boden naar de koning van de kinderen van Ammon.", "Jer 12:3": "Maar U, HEERE, kent mij, U ziet mij, en proeft mijn hart, dat het met U is. Ruk hen uit als schapen ter slachting, en heilig hen tot de dag van de doding.", "Hand 23:13": "En het waren er meer dan veertig die deze eed samen hadden afgelegd.", "2 Kon 19:14-19": "Toen Hizkia de brieven uit de hand van de boden ontvangen had en die gelezen had, ging hij op naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE. En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt. HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.", "Ps 79:9": "Help ons, o God van ons heil! Vanwege de eer van Uw Naam; en red ons, en doe verzoening over onze zonden, om Uw Naam.", "Jes 32:14": "Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.", "Openb 8:3": "En er kwam een andere engel, en hij stond aan het altaar met een gouden wierookvat; en hem werd veel van het reukwerk gegeven, opdat hij dat met de gebeden van alle heiligen zou leggen op het gouden altaar dat voor de troon is.", "Ps 13:2-5": "Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen? Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn? Kijk naar mij, verhoor mij, HEERE, mijn God; verlicht mijn ogen, zodat ik niet in de dood ontslaap;", "2 Kor 6:7": "in het woord van de waarheid, in de kracht van God, door de wapens van de gerechtigheid aan de rechter- en aan de linkerzijde;", "Num 21:34": "De HEERE nu zei tegen Mozes: Vrees hem niet; want Ik heb hem in uw hand gegeven, en al zijn volk, ook zijn land; en u zult hem doen, zoals u Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.", "Spr 3:24-26": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn. Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt. Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "2 Sam 10:1-5": "En het gebeurde daarna, dat de koning van de kinderen Ammons stierf, en zijn zoon Hanun werd koning in zijn plaats. Toen zei David: Ik zal weldadigheid doen aan Hanun, de zoon van Nahas, zoals zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door de dienst van zijn knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons. Toen zeiden de vorsten van de kinderen Ammons tegen hun heer Hanun: Eert u David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Heeft David zijn knechten niet daarom tot u gezonden, dat hij deze stad doorzoekt, en die verspiedt, en die omkeert?", "Ezech 21:22": "De waarzeggerij zal aan zijn rechterhand zijn op Jeruzalem, om hoofdmannen aan te stellen, om de mond te openen tot het doodslaan, om de stem op te heffen met gejuich, om stormrammen op te stellen tegen de poorten, om verhogingen op te werpen, om bolwerken te bouwen.", "Ef 5:15": "Kijk dan goed hoe u voorzichtig wandelt, niet als onwijzen, maar als wijzen,", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "1 Kor 9:12": "Als anderen deze macht over u deelachtig zijn, waarom wij dan niet veel meer? Toch hebben wij deze macht niet gebruikt, maar wij verdragen alles, opdat wij geen enkele verhindering geven aan het Evangelie van Christus.", "Ps 80:4-6": "O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden. HEERE, God van de heerscharen! Hoe lang zult U roken tegen het gebed van Uw volk? U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "Spr 4:26": "Weeg de gang van uw voet, en laat al uw wegen vast staan.", "Gen 32:11": "Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Ps 39:13": "Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.", "Hand 4:29": "En nu dan, Heere, zie op hun dreigingen, en geef Uw dienstknechten met alle vrijmoedigheid Uw woord te spreken;", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Ps 119:110": "De goddelozen hebben mij een strik gelegd; nochtans ben ik niet afgedwaald van Uw bevelen.", "Gen 39:7-10": "En het gebeurde na deze dingen, dat de vrouw van zijn heer haar ogen op Jozef liet vallen; en zij zei: lig bij mij! Maar hij weigerde het, en zei tegen de vrouw van zijn heer: Zie, mijn heer weet niet, met mij hier, wat er in het huis is; en alles wat hij heeft, heeft hij in mijn hand gegeven. Niemand is groter in dit huis dan ik, en hij heeft mij niets onthouden, behalve u, omdat u zijn vrouw bent; hoe zou ik dan dit zo grote kwaad doen, en zondigen tegen God!", "Ezech 4:2": "En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom.", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "2 Kron 32:2-8": "Toen Jehizkia zag dat Sanherib gekomen was, en dat hij van plan was oorlog te voeren tegen Jeruzalem, hield hij raad met zijn vorsten en zijn helden, om de waterbronnen te dichten die buiten de stad waren; en zij hielpen hem. Want er werd veel volk samengebracht, dat alle bronnen dichtte, alsook de beek die door het midden van het land stroomde, en zij zeiden: Waarom zouden de koningen van Assyrië komen en veel water vinden?", "Joh 11:3": "Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.", "Ps 126:4": "O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.", "2 Kron 20:4-13": "En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof. En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "Richt 9:31": "En hij zond in het geheim boden naar Abimelech, en zei: Zie, Gaal, de zoon van Ebed, en zijn broers zijn naar Sichem gekomen, en zie, zij zetten deze stad tegen u op.", "Neh 6:1": "Verder gebeurde het, toen Sanballat, Tobia, Gesem de Arabier en onze andere vijanden hoorden dat ik de muur gebouwd had en dat er geen scheur meer in over was — hoewel ik tot die tijd toe de deuren nog niet in de poorten had opgezet —", "Fil 1:28": "En dat u zich door niets laat verschrikken door hen die tegenstaan; wat voor hen een bewijs is van verderf, maar voor u van zaligheid, en dat van God.", "2 Kon 19:16": "HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.", "Ps 102:8": "Ik waak, en ben geworden als een eenzame mus op het dak.", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Joël 1:19": "Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.", "Ps 143:12": "En roei mijn vijanden uit, om Uw goedertierenheid, en breng hen om, allen die mijn ziel beangstigen; want ik ben Uw knecht.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Jak 5:13-16": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen. Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere. En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Ps 143:1-12": "Een psalm van David. O HEERE, hoor mijn gebed, neig de oren tot mijn smekingen; verhoor mij naar Uw waarheid, naar Uw gerechtigheid. En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn. Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "Hagg 2:19": "Zet er toch uw hart op, vanaf deze dag en verder; vanaf de vierentwintigste dag van de negende maand, vanaf de dag waarop het fundament van de tempel van de HEERE gelegd is, zet er uw hart op.", "Ps 44:14": "U stelt ons tot smaad voor onze naburen, tot spot en schimp voor hen die rondom ons zijn.", "Ps 25:2": "Beth. Mijn God! op U vertrouw ik; laat mij niet beschaamd worden; laat mijn vijanden niet van vreugde opspringen over mij.", "1 Kron 16:11": "Vraagt naar de HEERE en Zijn sterkte, zoekt Zijn aangezicht voortdurend.", "Ps 145:18": "Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid.", "Ezra 3:2-9": "En Jesua, de zoon van Jozadak, maakte zich op, en zijn broeders, de priesters, en Zerubbabel, de zoon van Sealthiël, en zijn broeders, en zij bouwden het altaar van de God van Israël, om daarop brandoffers te offeren, zoals geschreven is in de wet van Mozes, de man Gods. En zij zetten het altaar vast op zijn stelling, hoewel er verschrikking over hen was vanwege de volken van de landen; en zij offerden daarop brandoffers aan de HEERE, brandoffers 's morgens en 's avonds. En zij hielden het feest van de loofhutten, zoals geschreven is; en zij offerden brandoffers dag bij dag in getal, naar het voorschrift, zoals elke dag vereiste.", "Ps 119:173": "Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen.", "Ezech 33:27": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!", "Ps 37:5": "Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Klaagl 2:18": "Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!", "Kol 4:17": "En zeg tegen Archippus: Let op de bediening die u hebt aangenomen in de Heere, dat u die vervult.", "2 Kron 2:18": "En hij maakte daaruit zeventigduizend lastdragers, en tachtigduizend houwers in het gebergte, alsook drieduizend zeshonderd opzieners, om het volk te laten werken.", "Num 24:10": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend!", "Neh 6:15": "De muur nu werd voltooid op de vijfentwintigste van Elul, in tweeënvijftig dagen.", "Ps 56:2-14": "Wees mij genadig, o God! Want de mens zoekt mij op te slokken; de hele dag dringt de bestrijder mij. Mijn verspieders zoeken mij de hele dag op te slokken; want ik heb veel bestrijders, o Allerhoogste! Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Ps 22:2-22": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen? Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte. Doch U bent heilig, wonende onder de lofzangen van Israël.", "Matt 24:4": "En Jezus antwoordde en zei tegen hen: Kijk uit dat niemand u misleidt.", "Jes 22:10": "U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken.", "Ps 43:1-5": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht. Want U bent de God van mijn sterkte; waarom verstoot U mij dan? Waarom ga ik steeds in het zwart, vanwege de onderdrukking van de vijand? Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Matt 6:25-34": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding? Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven? Wie van u kan, door bezorgd te zijn, één el aan zijn lengte toevoegen?", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Spr 3:5": "Vertrouw op de HEERE met heel uw hart, en steun op uw eigen verstand niet.", "1 Kron 29:14": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.", "Ps 109:9-20": "Laat zijn kinderen wezen worden, en zijn vrouw weduwe. En laat zijn kinderen hier en daar omzwerven, en bedelen, en de nooddruft uit hun verwoeste plaatsen zoeken. Laat de schuldeiser aanslaan al wat hij heeft, en laat de vreemden zijn arbeid roven.", "Deut 12:13": "Wacht u ervoor dat u uw brandoffers niet offert op elke plaats die u zien zult.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Ex 14:14": "De HEERE zal voor u strijden, en u zult stil zijn.", "2 Kor 8:17": "Dat hij de vermaning heeft aangenomen, en zeer naarstig zijnde, gewillig naar u toe gereisd is.", "2 Kor 8:16": "Doch God zij dank, Die dezelfde naarstigheid voor u in het hart van Titus gegeven heeft;", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Ps 17:6-9": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden. Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan! Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ps 108:7": "Opdat Uw beminden bevrijd worden; geef heil door Uw rechterhand, en verhoor ons.", "2 Tim 3:3": "zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede,", "1 Sam 14:6-13": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen. Toen zei zijn wapendrager tegen hem: Doe alles wat in uw hart is; ga uw gang, zie, ik ben met u, naar uw hart. Jonathan nu zei: Zie, wij zullen naar die mannen oversteken, en wij zullen ons aan hen laten zien.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "2 Kron 29:36": "Hizkia nu en heel het volk verblijdden zich over wat God voor het volk had voorbereid; want deze zaak gebeurde snel.", "Openb 5:8": "En toen Het dat boek genomen had, vielen de vier dieren en de vierentwintig oudsten voor het Lam neer, elk met een citer en gouden schalen vol reukwerk, dat zijn de gebeden van de heiligen.", "Deut 7:17-21": "Als u in uw hart zei: Deze volken zijn groter dan ik; hoe zou ik hen uit hun bezit kunnen verdrijven? — wees niet bevreesd voor hen; denk goed terug aan wat de HEERE, uw God, aan de farao en aan alle Egyptenaren gedaan heeft; de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.", "Luk 11:1-13": "En het gebeurde, toen Hij op een zekere plaats was en bad, dat, toen Hij ophield, een van Zijn discipelen tegen Hem zei: Heere, leer ons bidden, zoals ook Johannes zijn discipelen geleerd heeft. En Hij zei tegen hen: Wanneer u bidt, zegt dan: Onze Vader, Die in de hemelen bent! Uw Naam worde geheiligd. Laat Uw Koninkrijk komen. Uw wil geschiede, zoals in de hemel, zo ook op de aarde. Geef ons elke dag ons dagelijks brood.", "Ps 4:2": "Als ik roep, verhoor mij, o God van mijn gerechtigheid! In benauwdheid hebt U mij ruimte gemaakt; wees mij genadig, en hoor mijn gebed.", "Job 3:1-10": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Richt 20:29-48": "Toen stelde Israël hinderlagen op tegen Gibea rondom. En de kinderen van Israël trokken op, op de derde dag, tegen de kinderen van Benjamin; en zij schikten de strijd tegen Gibea, zoals de andere keren. Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.", "Neh 4:1-18": "Het gebeurde dat Sanballat hoorde dat wij de muur bouwden. Toen ontstak hij in woede en werd erg boos, en hij bespotte de Joden. Hij sprak in het bijzijn van zijn broeders en van het leger van Samaria, en zei: Wat doen deze zwakke Joden? Zullen zij zichzelf versterken? Zullen zij offeren? Zullen zij het in één dag afmaken? Zullen zij de stenen uit de puinhopen weer levend maken, terwijl die verbrand zijn? En Tobia, de Ammoniet, was bij hem, en zei: Al is het dat zij bouwen, als er een vos opklom, dan zou hij hun stenen muur al kunnen omverhalen.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Jona 1:14": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd.", "Neh 6:2": "dat Sanballat en Gesem naar mij stuurden om te zeggen: Kom, laten wij samen bijeenkomen in de dorpen, in het dal Ono. Maar zij waren van plan mij kwaad te doen.", "1 Kor 7:29-31": "Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden; en zij die wenen, alsof zij niet weenden; en zij die blij zijn, alsof zij niet blij waren; en zij die kopen, alsof zij niet bezaten; en zij die deze wereld gebruiken, alsof zij die niet misbruikten; want de gedaante van deze wereld gaat voorbij.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "2 Sam 20:1": "Toen was daar bij toeval een man van Belial, wiens naam was Seba, een zoon van Bichri, een man van Jemini; die blies op de bazuin, en zei: Wij hebben geen deel aan David, en wij hebben geen erfenis aan de zoon van Isaï, ieder naar zijn tenten, o Israël!", "Klaagl 3:38
