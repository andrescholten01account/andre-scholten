als de verkeerde.", "Mark 4:24": "En Hij zei tegen hen: Let op wat u hoort. Met de maat waarmee u meet, zal u gemeten worden, en aan u die hoort, zal meer gegeven worden.", "Deut 27:9": "Vervolgens sprak Mozes, samen met de Levitische priesters, tot heel Israël: Luister toe en hoor, o Israël! Op deze dag bent u het volk van de HEERE, uw God, geworden.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Mark 13:34": "Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken;", "Ps 141:1-10": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep. Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer. HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Ps 39:2": "Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is.", "Deut 3:2": "Toen zei de HEERE tegen mij: Wees niet bang voor hem, want Ik heb hem, en al zijn volk, en zijn land, in uw hand gegeven; en u zult hem doen, zoals u met Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "1 Kor 11:28": "Maar laat de mens zichzelf beproeven, en laat hij zo van het brood eten, en van de drinkbeker drinken.", "Ps 30:11": "Hoor, HEERE! en wees mij genadig; HEERE! wees mij een Helper.", "Amos 4:12": "Daarom zal Ik u zo doen, ss=\"wl\" data-l=\"L9\" data-code=\"H4929\">wacht</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H4929\">zijn</span>, <span class=\"wl\" data-l=\"L11\" data-code=\"H3117\">en</span> overdag aan <span class=\"wl\" data-l=\"L12\" data-code=\"H4399\">het</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H4399\">werk</span>.", "23": "Verder <span class=\"wl\" data-l=\"L11\" data-code=\"H6584\">trokken</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H369\">noch</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H589\">ik</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H369\">noch</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H369\">mijn</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H251\">broeders</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H369\">noch</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H369\">mijn</span> knechten, <span class=\"wl\" data-l=\"L6\" data-code=\"H369\">noch</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H369\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H582\">mannen</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H582\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4929\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4929\">wacht</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H834\">die</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H310\">achter</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H369\">mij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H369\">waren</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H369\">onze</span> kleren <span class=\"wl\" data-l=\"L12\" data-code=\"H376\">uit</span>; <span class=\"wl\" data-l=\"L12\" data-code=\"H376\">ieder</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H376\">had</span> zijn wapen, ook bij <span class=\"wl\" data-l=\"L13\" data-code=\"H4325\">het</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H4325\">water</span>."}, "koppeling_kjv": {"1": "But it came to pass, that when <span class=\"wl wl-kjv\" data-code=\"H5571\">Sanballat</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that we <span class=\"wl wl-kjv\" data-code=\"H1129\">builded</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> he was <span class=\"wl wl-kjv\" data-code=\"H2734\">wroth,</span> and took <span class=\"wl wl-kjv\" data-code=\"H7235\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3707\">indignation,</span> and <span class=\"wl wl-kjv\" data-code=\"H3932\">mocked</span> the Jews.", "2": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> and the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> these <span class=\"wl wl-kjv\" data-code=\"H537\">feeble</span> <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews?</span> will they <span class=\"wl wl-kjv\" data-code=\"H5800\">fortify</span> themselves? will they <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice?</span> will they make an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> in a <span class=\"wl wl-kjv\" data-code=\"H3117\">day?</span> will they <span class=\"wl wl-kjv\" data-code=\"H2421\">revive</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6194\">heaps</span> of the <span class=\"wl wl-kjv\" data-code=\"H6083\">rubbish</span> which are burned?", "3": "Now <span class=\"wl wl-kjv\" data-code=\"H2900\">Tobiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5984\">Ammonite</span> was by <span class=\"wl wl-kjv\" data-code=\"H681\">him,</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Even that which they <span class=\"wl wl-kjv\" data-code=\"H1129\">build,</span> if a <span class=\"wl wl-kjv\" data-code=\"H7776\">fox</span> go <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> he shall even break <span class=\"wl wl-kjv\" data-code=\"H6555\">down</span> their <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> wall.", "4": "<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear,</span> O our <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> for we are <span class=\"wl wl-kjv\" data-code=\"H939\">despised:</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> their <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> upon their own <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them for a <span class=\"wl wl-kjv\" data-code=\"H961\">prey</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of captivity:", "5": "And <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> not their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> and let not their <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> be blotted <span class=\"wl wl-kjv\" data-code=\"H4229\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee: for they have provoked thee to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger</span> before the builders.", "6": "So <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> we the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> was joined <span class=\"wl wl-kjv\" data-code=\"H7194\">together</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> thereof: for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> had a <span class=\"wl wl-kjv\" data-code=\"H3820\">mind</span> to work.", "7": "But it came to pass, that when <span class=\"wl wl-kjv\" data-code=\"H5571\">Sanballat,</span> and <span class=\"wl wl-kjv\" data-code=\"H2900\">Tobiah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6163\">Arabians,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5984\">Ammonites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H796\">Ashdodites,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> were made <span class=\"wl wl-kjv\" data-code=\"H724\">up,</span> and that the <span class=\"wl wl-kjv\" data-code=\"H6555\">breaches</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> to be <span class=\"wl wl-kjv\" data-code=\"H5640\">stopped,</span> then they were <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> wroth,", "8": "And <span class=\"wl wl-kjv\" data-code=\"H7194\">conspired</span> all of them <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and to <span class=\"wl wl-kjv\" data-code=\"H6213\">hinder</span>", "9": "Nevertheless we made our <span class=\"wl wl-kjv\" data-code=\"H6419\">prayer</span> unto our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H4929\">watch</span> against them <span class=\"wl wl-kjv\" data-code=\"H3119\">day</span> and <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> because", "10": "And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> of the bearers of <span class=\"wl wl-kjv\" data-code=\"H5449\">burdens</span> is <span class=\"wl wl-kjv\" data-code=\"H3782\">decayed,</span> and there is <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H6083\">rubbish;</span> so that we are not <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the wall.", "11": "And our <span class=\"wl wl-kjv\" data-code=\"H6862\">adversaries</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> They shall not <span class=\"wl wl-kjv\" data-code=\"H3045\">know,</span> neither <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> till we <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> them, and <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> them, and cause the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> to cease.", "12": "And it came to pass, that when the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> by <span class=\"wl wl-kjv\" data-code=\"H681\">them</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto us <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times,</span> From all <span class=\"wl wl-kjv\" data-code=\"H4725\">places</span> whence ye shall return", "13": "Therefore <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> I in the <span class=\"wl wl-kjv\" data-code=\"H8482\">lower</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">places</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> and on the higher <span class=\"wl wl-kjv\" data-code=\"H6706\">places,</span> I even <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> after their <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> with their <span class=\"wl wl-kjv\" data-code=\"H2719\">swords,</span> their <span class=\"wl wl-kjv\" data-code=\"H7420\">spears,</span> and their bows.", "14": "And I <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Be not ye <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> of <span class=\"wl wl-kjv\" data-code=\"H6440\">them:</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> which is <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> for your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> your <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and your <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> your <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and your houses.", "15": "And it came to pass, when our <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that it was <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> unto us, and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H6565\">brought</span> their <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> to <span class=\"wl wl-kjv\" data-code=\"H6565\">nought,</span> that we <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> all of us to the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> unto his work.", "16": "And it came to pass from that <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> forth, that the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of my <span class=\"wl wl-kjv\" data-code=\"H5288\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> in the <span class=\"wl wl-kjv\" data-code=\"H4399\">work,</span> and the other <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of them <span class=\"wl wl-kjv\" data-code=\"H2388\">held</span> both the <span class=\"wl wl-kjv\" data-code=\"H7420\">spears,</span> the <span class=\"wl wl-kjv\" data-code=\"H4043\">shields,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7198\">bows,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8302\">habergeons;</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> were <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Judah.", "17": "They which <span class=\"wl wl-kjv\" data-code=\"H1129\">builded</span> on the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H5447\">burdens,</span> with those that <span class=\"wl wl-kjv\" data-code=\"H6006\">laded,</span> every one with <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> in the <span class=\"wl wl-kjv\" data-code=\"H4399\">work,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> hand <span class=\"wl wl-kjv\" data-code=\"H2388\">held</span> a weapon.", "18": "For the <span class=\"wl wl-kjv\" data-code=\"H1129\">builders,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> had his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H631\">girded</span> by his <span class=\"wl wl-kjv\" data-code=\"H4975\">side,</span> and so <span class=\"wl wl-kjv\" data-code=\"H1129\">builded.</span> And he that <span class=\"wl wl-kjv\" data-code=\"H8628\">sounded</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> was by me.", "19": "And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> The <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> is <span class=\"wl wl-kjv\" data-code=\"H7235\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H7342\">large,</span> and we are <span class=\"wl wl-kjv\" data-code=\"H6504\">separated</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> far <span class=\"wl wl-kjv\" data-code=\"H7350\">from</span> another.", "20": "In what <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> therefore ye <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">resort</span> ye thither unto us: our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall fight", "21": "So we <span class=\"wl wl-kjv\" data-code=\"H6213\">laboured</span> in the <span class=\"wl wl-kjv\" data-code=\"H4399\">work:</span> and <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of them <span class=\"wl wl-kjv\" data-code=\"H2388\">held</span> the <span class=\"wl wl- const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

let vertaling = 'SVnu';

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
