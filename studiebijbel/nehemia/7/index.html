n de weggevoerden, die Nebukadnezar, de koning van Babel, weggevoerd had, en die teruggekeerd zijn naar Jeruzalem en naar Juda, ieder naar zijn stad;","7":"Zij kwamen met Zerubbabel, Jesua, Nehemia, Azaria, Raamja, Nahamani, Mordechai, Bilsan, Mispereth, Bigvai, Nehum *en* Baëna. *Dit* is het getal van de mannen van het volk van Israël.","8":"De kinderen van Parhos waren tweeduizend, honderdtweeënzeventig;","9":"De kinderen van Sefatja, driehonderdtweeënzeventig;","10":"De kinderen van Arach, zeshonderdtweeënvijftig;","11":"De kinderen van Pahath-Moab, van de kinderen van Jesua en Joab, tweeduizend achthonderdachttien;","12":"De kinderen van Elam, duizendtweehonderdvierenvijftig;","13":"De kinderen van Zatthu, achthonderdvijfenveertig;","14":"De kinderen van Zakkai, zevenhonderdzestig;","15":"De kinderen van Binnui, zeshonderdachtenveertig;","16":"De kinderen van Bebai, zeshonderdachtentwintig;","17":"De kinderen van Azgad, tweeduizend driehonderdtweeëntwintig;","18":"De kinderen van Adonikam, zeshonderdzevenenzestig;","19":"De kinderen van Bigvai, tweeduizend zevenenzestig;","20":"De kinderen van Adin, zeshonderdvijfenvijftig;","21":"De kinderen van Ater, van Hizkia, achtennegentig;","22":"De kinderen van Hassum, driehonderdachtentwintig;","23":"De kinderen van Bezai, driehonderdvierentwintig;","24":"De kinderen van Harif, honderdtwaalf;","25":"De kinderen van Gibeon, vijfennegentig;","26":"De mannen van Bethlehem en Netofa, honderdachtentachtig;","27":"De mannen van Anathoth, honderdachtentwintig;","28":"De mannen van Beth-Azmaveth, tweeënveertig;","29":"De mannen van Kirjath-Jearim, Cefira en Beëroth, zevenhonderddrieënveertig;","30":"De mannen van Rama en Gaba, zeshonderdeenentwintig;","31":"De mannen van Michmas, honderdtweeëntwintig;","32":"De mannen van Beth-El en Ai, honderddrieëntwintig;","33":"De mannen van het andere Nebo, tweeënvijftig;","34":"De kinderen van de andere Elam, duizendtweehonderdvierenvijftig;","35":"De kinderen van Harim, driehonderdtwintig;","36":"De kinderen van Jericho, driehonderdvijfenveertig;","37":"De kinderen van Lod, Hadid en Ono, zevenhonderdeenentwintig;","38":"De kinderen van Senaa, drieduizend negenhonderddertig;","39":"De priesters: de kinderen van Jedaja, van het huis van Jesua, negenhonderddrieënzeventig;","40":"De kinderen van Immer, duizendtweeënvijftig;","41":"De kinderen van Pashur, duizendtweehonderdzevenenveertig;","42":"De kinderen van Harim, duizendzeventien;","43":"De Levieten: de kinderen van Jesua, van Kadmiël, van de kinderen van Hodeva, vierenzeventig;","44":"De zangers: de kinderen van Asaf, honderdachtenveertig;","45":"De poortwachters: de kinderen van Sallum, de kinderen van Ater, de kinderen van Talmon, de kinderen van Akkub, de kinderen van Hatita, de kinderen van Sobai, honderdachtendertig;","46":"De Nethinim: de kinderen van Ziha, de kinderen van Hasufa, de kinderen van Tabbaoth;","47":"De kinderen van Keros, de kinderen van Sia, de kinderen van Padon;","48":"De kinderen van Lebana, de kinderen van Hagaba, de kinderen van Salmai;","49":"De kinderen van Hanan, de kinderen van Giddel, de kinderen van Gahar;","50":"De kinderen van Reaja, de kinderen van Rezin, de kinderen van Nekoda;","51":"De kinderen van Gazzam, de kinderen van Uzza, de kinderen van Paseah;","52":"De kinderen van Bezai, de kinderen van Meunim, de kinderen van Nefussim;","53":"De kinderen van Bakbuk, de kinderen van Hakufa, de kinderen van Harhur;","54":"De kinderen van Bazlith, de kinderen van Mehida, de kinderen van Harsa;","55":"De kinderen van Barkos, de kinderen van Sisera, de kinderen van Thamah;","56":"De kinderen van Neziah, de kinderen van Hatifa.","57":"De kinderen van de knechten van Salomo: de kinderen van Sotai, de kinderen van Sofereth, de kinderen van Perida;","58":"De kinderen van Jaëla, de kinderen van Darkon, de kinderen van Giddel;","59":"De kinderen van Sefatja, de kinderen van Hattil, de kinderen van Pochereth van Zebaim, de kinderen van Amon;","60":"Alle Nethinim, en de kinderen van de knechten van Salomo, waren driehonderdtweeënnegentig.","61":"Ook trokken dezen op vanuit Thel-Melah, Thel-Harsa, Cherub, Addon en Immer; maar zij konden het huis van hun vaderen, en hun nageslacht, niet aantonen, of zij uit Israël waren;","62":"De kinderen van Delaja, de kinderen van Tobia, de kinderen van Nekoda, zeshonderdtweeënveertig.","63":"En van de priesters: de kinderen van Habaja, de kinderen van Koz, de kinderen van Barzillai, die een vrouw van de dochters van Barzillai, de Gileadiet, genomen had, en naar hun naam genoemd was.","64":"Dezen zochten hun geschrift, en wilden hun geslacht natellen, maar het werd niet gevonden; daarom werden zij als onreinen van het priesterdom geweerd.","65":"En de Hattirsatha[1] zei tegen hen, dat zij van de heiligste dingen niet zouden eten, totdat er een priester stond met Urim en Tummim.","66":"Deze hele gemeente samen was tweeënveertigduizend driehonderdzestig;","67":"Behalve hun knechten en hun dienstmaagden; dezen waren zevenduizend driehonderdzevenendertig; en zij hadden tweehonderdvijfenveertig zangers en zangeressen.","68":"Hun paarden, zevenhonderdzesendertig; hun muildieren, tweehonderdvijfenveertig;","69":"Kamelen, vierhonderdvijfendertig; ezels, zesduizend zevenhonderdtwintig.","70":"Een deel nu van de hoofden van de vaderen gaf tot het werk. De Hattirsatha gaf tot de schat, aan goud, duizend drachmen, vijftig sprenkelschalen, vijfhonderddertig priesterrokken.","71":"En anderen van de hoofden van de vaderen gaven tot de schat van het werk, aan goud, twintigduizend drachmen, en aan zilver, tweeduizend tweehonderd ponden.","72":"En wat de overigen van het volk gaven, was aan goud, twintigduizend drachmen, en aan zilver, tweeduizend mijnen, en zevenenzestig priesterrokken.","73":"En de priesters, en de Levieten, en de poortwachters, en de zangers, en sommigen van het volk, en de Nethinim, en heel Israël, woonden in hun steden."},"SV":{"1":"Voorts geschiedde het, als de muur gebouwd was, dat ik de deuren oprichtte, en de poortiers, en de zangers, en de Levieten werden besteld.","2":"En ik gaf bevel aan mijn broeder Hanani, en aan Hananja, den overste van den burg te Jeruzalem, want hij was als een man van getrouwheid, en godvrezende boven velen.","3":"En ik zeide tot hen: Laat de poorten van Jeruzalem niet geopend worden, totdat de zon heet wordt, en terwijl zij daarbij staan, laat hen de deuren sluiten, betast gij ze dan; en dat men wachten zette, inwoners van Jeruzalem, een iegelijk op zijn wacht, en een iegelijk tegenover zijn huis.","4":"De stad nu was wijd van ruimte en groot; doch des volks was weinig daarbinnen; en de huizen waren niet gebouwd.","5":"Zo gaf mijn God in mijn hart, dat ik de edelen, en de overheden, en het volk verzamelde, om de geslachten te rekenen; en ik vond het geslachtsregister dergenen, die in het eerst waren opgetogen, en vond daarin geschreven *aldus*:","6":"Dit zijn de kinderen van dat landschap, die optogen uit de gevangenis der weggevoerden, die Nebukadnezar, koning van Babel, weggevoerd had, en *die* wedergekeerd zijn naar Jeruzalem en naar Juda, een iegelijk tot zijn stad;","7":"Dewelke kwamen met Zerubbabel, Jesua, Nehemia, Azaria, Raamja, Nahamani, Mordechai, Bilsan, Mispereth, Bigvai, Nehum *en* Baëna. *Dit* is het getal der mannen van het volk van Israël.","8":"De kinderen van Parhos waren twee duizend, honderd twee en zeventig;","9":"De kinderen van Sefatja, driehonderd twee en zeventig;","10":"De kinderen van Arach, zeshonderd twee en vijftig;","11":"De kinderen van Pahath-moab, van de kinderen van Jesua en Joab, twee duizend, achthonderd *en* achttien;","12":"De kinderen van Elam, duizend, tweehonderd vier en vijftig;","13":"De kinderen van Zatthu, achthonderd vijf en veertig;","14":"De kinderen van Zakkai, zevenhonderd en zestig;","15":"De kinderen van Binnui, zeshonderd acht en veertig;","16":"De kinderen van Bebai, zeshonderd acht en twintig;","17":"De kinderen van Azgad, twee duizend, driehonderd twee en twintig;","18":"De kinderen van Adonikam, zeshonderd zeven en zestig;","19":"De kinderen van Bigvai, twee duizend, zeven en zestig;","20":"De kinderen van Adin, zeshonderd vijf en vijftig;","21":"De kinderen van Ater, van Hizkia, acht en negentig;","22":"De kinderen van Hassum, driehonderd acht en twintig;","23":"De kinderen van Bezai, driehonderd vier en twintig;","24":"De kinderen van Harif, honderd *en* twaalf;","25":"De kinderen van Gibeon, vijf en negentig;","26":"De mannen van Bethlehem en Netofa, honderd acht en tachtig;","27":"De mannen van Anathoth, honderd acht en twintig;","28":"De mannen van Beth-azmaveth, twee en veertig;","29":"De mannen van Kirjath-jearim, Cefira en Beeroth, zevenhonderd drie en veertig;","30":"De mannen van Rama en Gaba, zeshonderd en twintig;","31":"De mannen van Michmas, honderd twee en twintig;","32":"De mannen van Beth-el en Ai, honderd drie en twintig;","33":"De mannen van het andere Nebo, twee en vijftig;","34":"De kinderen des anderen Elams, duizend, tweehonderd vier en vijftig;","35":"De kinderen van Harim, driehonderd en twintig;","36":"De kinderen van Jericho, driehonderd vijf en veertig;","37":"De kinderen van Lod, Hadid en Ono, zevenhonderd een en twintig;","38":"De kinderen van Senaa, drie duizend, negenhonderd en dertig;","39":"De priesters: de kinderen van Jedaja, van het huis van Jesua, negenhonderd drie en zeventig;","40":"De kinderen van Immer, duizend twee en vijftig;","41":"De kinderen van Pashur, duizend, tweehonderd zeven en veertig;","42":"De kinderen van Harim, duizend *en* zeventien;","43":"De Levieten: de kinderen van Jesua, van Kadmiel, van de kinderen van Hodeva, vier en zeventig;","44":"De zangers: de kinderen van Asaf, honderd acht en veertig;","45":"De poortiers: de kinderen van Sallum, de kinderen van Ater, de kinderen van Talmon, de kinderen van Akkub, de kinderen van Hatita, de kinderen van Sobai, honderd acht en dertig;","46":"De Nethinim: de kinderen van Ziha, de kinderen van Hasufa, de kinderen van Tabbaoth;","47":"De kinderen van Keros, de kinderen van Sia, de kinderen van Padon;","48":"De kinderen van Lebana, de kinderen van Hagaba, de kinderen van Salmai;","49":"De kinderen van Hanan, de kinderen van Giddel, de kinderen van Gahar;","50":"De kinderen van Reaja, de kinderen van Rezin, de kinderen van Nekoda;","51":"De kinderen van Gazzam, de kinderen van Uzza, de kinderen van Paseah;","52":"De kinderen van Bezai, de kinderen van Meunim, de kinderen van Nefussim;","53":"De kinderen van Bakbuk, de kinderen van Hakufa, de kinderen van Harhur;","54":"De kinderen van Bazlith, de kinderen van Mehida, de kinderen van Harsa;","55":"De kinderen van Barkos, de kinderen van Sisera, de kinderen van Thamah;","56":"De kinderen van Neziah, de kinderen van Hatifa;","57":"De kinderen der knechten van Salomo; de kinderen van Sotai, de kinderen van Sofereth, de kinderen van Perida;","58":"De kinderen van Jaëla, de kinderen van Darkon, de kinderen van Giddel;","59":"De kinderen van Sefatja, de kinderen van Hattil, de kinderen van Pochereth van Zebaim, de kinderen van Amon;","60":"Al de Nethinim, en de kinderen der knechten van Salomo, waren driehonderd twee en negentig.","61":"Ook togen dezen op van Thel-melah, Thel-harsa, Cherub, Addon en Immer; maar zij konden hunner vaderen huis, en hun zaad niet tonen, of zij uit Israël waren;","62":"De kinderen van Delaja, de kinderen van Tobia, de kinderen van Nekoda, zeshonderd twee en veertig.","63":"En van de priesteren, de kinderen van Habaja, de kinderen van Koz, de kinderen van Barzillai, die een vrouw van de dochteren van Barzillai, den Gileadiet, genomen had, en naar hun naam genoemd was.","64":"Dezen zochten hun geschrift, willende hun geslacht rekenen, maar het werd niet gevonden; daarom werden zij als onreinen van het priesterdom geweerd.","65":"En Hattirsatha zeide tot hen, dat zij van de heiligste dingen niet zouden eten, totdat er een priester stond met urim en thummim.","66":"Deze ganse gemeente te zamen was twee en veertig duizend, driehonderd en zestig;","67":"Behalve hun knechten en hun maagden, die waren zeven duizend, driehonderd zeven en dertig; en zij hadden tweehonderd vijf en veertig zangers en zangeressen.","68":"Hun paarden, zevenhonderd zes en dertig; hun muildieren, tweehonderd vijf en veertig;","69":"Kemelen, vierhonderd vijf en dertig; ezelen, zes duizend, zevenhonderd en twintig.","70":"Een deel nu van de hoofden der vaderen gaven tot het werk. Hattirsatha gaf tot den schat, aan goud, duizend drachmen, vijftig sprengbekkens, vijfhonderd en dertig priesterrokken.","71":"En *anderen* van de hoofden der vaderen gaven tot den schat des werks, aan goud, twintig duizend drachmen, en aan zilver, twee duizend en tweehonderd ponden.","72":"En wat de overigen des volks gaven, was aan goud, twintig duizend drachmen, en aan zilver, twee duizend mijnen, en zeven en zestig priesterrokken.","73":"En de priesters, en de Levieten, en de poortiers, en de zangers, en *sommigen* van het volk, en de Nethinim, en gans Israël, woonden in hun steden."},"KJV":{"1":"Now it came to pass, when the wall was built, and I had set up the doors, and the porters and the singers and the Levites were appointed,","2":"That I gave my brother Hanani, and Hananiah the ruler of the palace, charge over Jerusalem: for he *was* a faithful man, and feared God above many.","3":"And I said unto them, Let not the gates of Jerusalem be opened until the sun be hot; and while they stand by, let them shut the doors, and bar *them*: and appoint watches of the inhabitants of Jerusalem, every one in his watch, and every one *to be* over against his house.","4":"Now the city *was* large and great: but the people *were* few therein, and the houses *were* not builded.","5":"And my God put into mine heart to gather together the nobles, and the rulers, and the people, that they might be reckoned by genealogy. And I found a register of the genealogy of them which came up at the first, and found written","6":"These *are* the children of the province, that went up out of the captivity, of those that had been carried away, whom Nebuchadnezzar the king of Babylon had carried away, and came again to Jerusalem and to Judah, every one unto his city;","7":"Who came with Zerubbabel, Jeshua, Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, Baanah. The number, *I say*, of the men of the people of Israel","8":"The children of Parosh, two thousand an hundred seventy and two.","9":"The children of Shephatiah, three hundred seventy and two.","10":"The children of Arah, six hundred fifty and two.","11":"The children of Pahathmoab, of the children of Jeshua and Joab, two thousand and eight hundred *and* eighteen.","12":"The children of Elam, a thousand two hundred fifty and four.","13":"The children of Zattu, eight hundred forty and five.","14":"The children of Zaccai, seven hundred and threescore.","15":"The children of Binnui, six hundred forty and eight.","16":"The children of Bebai, six hundred twenty and eight.","17":"The children of Azgad, two thousand three hundred twenty and two.","18":"The children of Adonikam, six hundred threescore and seven.","19":"The children of Bigvai, two thousand threescore and seven.","20":"The children of Adin, six hundred fifty and five.","21":"The children of Ater of Hezekiah, ninety and eight.","22":"The children of Hashum, three hundred twenty and eight.","23":"The children of Bezai, three hundred twenty and four.","24":"The children of Hariph, an hundred and twelve.","25":"The children of Gibeon, ninety and five.","26":"The men of Bethlehem and Netophah, an hundred fourscore and eight.","27":"The men of Anathoth, an hundred twenty and eight.","28":"The men of Bethazmaveth, forty and two.","29":"The men of Kirjathjearim, Chephirah, and Beeroth, seven hundred forty and three.","30":"The men of Ramah and Geba, six hundred twenty and one.","31":"The men of Michmas, an hundred and twenty and two.","32":"The men of Bethel and Ai, an hundred twenty and three.","33":"The men of the other Nebo, fifty and two.","34":"The children of the other Elam, a thousand two hundred fifty and four.","35":"The children of Harim, three hundred and twenty.","36":"The children of Jericho, three hundred forty and five.","37":"The children of Lod, Hadid, and Ono, seven hundred twenty and one.","38":"The children of Senaah, three thousand nine hundred and thirty.","39":"The priests: the children of Jedaiah, of the house of Jeshua, nine hundred seventy and three.","40":"The children of Immer, a thousand fifty and two.","41":"The children of Pashur, a thousand two hundred forty and seven.","42":"The children of Harim, a thousand and seventeen.","43":"The Levites: the children of Jeshua, of Kadmiel, *and* of the children of Hodevah, seventy and four.","44":"The singers: the children of Asaph, an hundred forty and eight.","45":"The porters: the children of Shallum, the children of Ater, the children of Talmon, the children of Akkub, the children of Hatita, the children of Shobai, an hundred thirty and eight.","46":"The Nethinims: the children of Ziha, the children of Hashupha, the children of Tabbaoth,","47":"The children of Keros, the children of Sia, the children of Padon,","48":"The children of Lebana, the children of Hagaba, the children of Shalmai,","49":"The children of Hanan, the children of Giddel, the children of Gahar,","50":"The children of Reaiah, the children of Rezin, the children of Nekoda,","51":"The children of Gazzam, the children of Uzza, the children of Phaseah,","52":"The children of Besai, the children of Meunim, the children of Nephishesim,","53":"The children of Bakbuk, the children of Hakupha, the children of Harhur,","54":"The children of Bazlith, the children of Mehida, the children of Harsha,","55":"The children of Barkos, the children of Sisera, the children of Tamah,","56":"The children of Neziah, the children of Hatipha.","57":"The children of Solomon's servants: the children of Sotai, the children of Sophereth, the children of Perida,","58":"The children of Jaala, the children of Darkon, the children of Giddel,","59":"The children of Shephatiah, the children of Hattil, the children of Pochereth of Zebaim, the children of Amon.","60":"All the Nethinims, and the children of Solomon's servants, *were* three hundred ninety and two.","61":"And these *were* they which went up *also* from Telmelah, Telharesha, Cherub, Addon, and Immer: but they could not shew their father's house, nor their seed, whether they *were* of Israel.","62":"The children of Delaiah, the children of Tobiah, the children of Nekoda, six hundred forty and two.","63":"And of the priests: the children of Habaiah, the children of Koz, the children of Barzillai, which took *one* of the daughters of Barzillai the Gileadite to wife, and was called after their name.","64":"These sought their register *among* those that were reckoned by genealogy, but it was not found: therefore were they, as polluted, put from the priesthood.","65":"And the Tirshatha said unto them, that they should not eat of the most holy things, till there stood *up* a priest with Urim and Thummim.","66":"The whole congregation together *was* forty and two thousand three hundred and threescore,","67":"Beside their manservants and their maidservants, of whom *there were* seven thousand three hundred thirty and seven: and they had two hundred forty and five singing men and singing women.","68":"Their horses, seven hundred thirty and six: their mules, two hundred forty and five:","69":"*Their* camels, four hundred thirty and five: six thousand seven hundred and twenty asses.","70":"And some of the chief of the fathers gave unto the work. The Tirshatha gave to the treasure a thousand drams of gold, fifty basons, five hundred and thirty priests' garments.","71":"And *some* of the chief of the fathers gave to the treasure of the work twenty thousand drams of gold, and two thousand and two hundred pound of silver.","72":"And *that* which the rest of th function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const popupCache = {};

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {

  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
