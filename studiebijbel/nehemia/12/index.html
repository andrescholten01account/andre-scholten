;","16":"Van Iddo, Zacharia; van Ginnethon, Mesullam;","17":"Van Abia, Zichri; van Minjamin, van Moadja, Piltai;","18":"Van Bilga, Sammua; van Semaja, Jonathan;","19":"En van Jojarib, Matthenai; van Jedaja, Uzzi;","20":"Van Sallai, Kallai; van Amok, Heber;","21":"Van Hilkia, Hasabja; van Jedaja, Nethaneel.","22":"*Van* de Levieten werden in de dagen van Eljasib, Jojada, en Johanan, en Jaddua, de hoofden van de families opgeschreven; alsook de priesters, tot het koninkrijk van Darius, de Pers.","23":"De kinderen van Levi, de hoofden van de families, werden opgeschreven in het boek van de kronieken, tot de dagen van Johanan, de zoon van Eljasib, toe.","24":"De hoofden dan van de Levieten waren Hasabja, Serebja, en Jesua, de zoon van Kadmiel, en hun broeders tegenover hen, om te prijzen *en* te danken, naar het gebod van David, de man van God, wacht tegenover wacht.","25":"Matthanja en Bakbukja, Obadja, Mesullam, Talmon *en* Akkub, waren poortwachters, die de wacht waarnamen bij de schatkamers van de poorten.","26":"Dezen waren er in de dagen van Jojakim, de zoon van Jesua, de zoon van Jozadak, en in de dagen van Nehemia, de landvoogd, en van de priester Ezra, de schriftgeleerde.","27":"Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen.","28":"Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten;","29":"En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.","30":"En de priesters en de Levieten reinigden zichzelf; daarna reinigden zij het volk, en de poorten, en de muur.","31":"Toen liet ik de vorsten van Juda opgaan op de muur; en ik stelde twee grote dankkoren en omgangen aan, *een* aan de rechterhand op de muur, naar de Mestpoort toe.","32":"En achter hen ging Hosaja, en de helft van de vorsten van Juda.","33":"En Azarja, Ezra, en Mesullam,","34":"Juda, en Benjamin, en Semaja, en Jeremia;","35":"En van de kinderen van de priesters met trompetten: Zacharja, de zoon van Jonathan, de zoon van Semaja, de zoon van Matthanja, de zoon van Michaja, de zoon van Zakkur, de zoon van Asaf;","36":"En zijn broeders, Semaja, en Azareël, Milalai, Gilalai, Maai, Nethaneel, en Juda, Hanani, met muziekinstrumenten van David, de man van God; en Ezra, de schriftgeleerde, *ging* voor hen uit.","37":"Vervolgens naar de Fonteinpoort, en tegenover hen, gingen zij op bij de trappen van de stad van David, via de opgang van de muur, boven het huis van David, tot aan de Waterpoort, naar het oosten.","38":"Het tweede dankkoor nu ging in tegenovergestelde richting, en ik erachteraan, met de helft van het volk, op de muur, van boven de Bakoventoren, tot aan de brede muur;","39":"En van boven de poort van Efraïm, en boven de Oude poort, en boven de Vispoort, en de toren Hananeel, en de toren Mea, tot aan de Schaapspoort, en zij bleven staan bij de Gevangenpoort.","40":"Daarna stonden de beide dankkoren in het huis van God; ook ik en de helft van de overheden met mij.","41":"En de priesters, Eljakim, Maaseja, Minjamin, Michaja, Eljoenei, Zacharja, Hananja, met trompetten;","42":"Verder Maaseja, en Semaja, en Eleazar, en Uzzi, en Johanan, en Malchia, en Elam, en Ezer; ook lieten de zangers zich horen, met Jizrahja, de opziener.","43":"En zij offerden op die dag grote slachtoffers, en waren vrolijk; want God had hen vrolijk gemaakt met grote vrolijkheid; en ook de vrouwen en de kinderen waren vrolijk; zodat de vrolijkheid van Jeruzalem tot van verre gehoord werd.","44":"Ook werden op diezelfde dag mannen aangesteld over de kamers, voor de schatten, voor de hefoffers, voor de eerstelingen en voor de tienden, om daarin uit de akkers van de steden de delen van de wet te verzamelen, voor de priesters en voor de Levieten; want Juda was vrolijk over de priesters en over de Levieten, die daar stonden.","45":"En zij namen de wacht van hun God waar, en de wacht van de reiniging, ook de zangers, en de poortwachters, naar het gebod van David *en* zijn zoon Salomo.","46":"Want in de dagen van David en Asaf, van oudsher, waren er hoofden van de zangers, en van het lofgezang, en van de dankzeggingen tot God.","47":"Daarom gaf heel Israël, in de dagen van Zerubbabel, en in de dagen van Nehemia, de delen van de zangers en van de poortwachters, van elke dag op zijn dag; en zij heiligden *gaven* voor de Levieten, en de Levieten heiligden *gaven* voor de kinderen van Aäron."},"SV":{"1":"Dit nu zijn de priesters en de Levieten, die met Zerubbabel, den zoon van Sealthiël, en Jesua, optogen: Seraja, Jeremia, Ezra,","2":"Amarja, Malluch, Hattus,","3":"Sechanja, Rehum, Meremoth,","4":"Iddo, Ginnethoi, Abia,","5":"Mijamin, Maadja, Bilga,","6":"Semaja, en Jojarib, Jedaja,","7":"Sallu, Amok, Hilkia, Jedaja; dat waren de hoofden der priesteren, en hun broederen, in de dagen van Jesua.","8":"En de Levieten waren: Jesua, Binnui, Kadmiel, Serebja, Juda, Matthanja; hij en zijn broederen waren over de dankzeggingen.","9":"En Bakbukja, en Unni, hun broederen, waren tegen hen over in de wachten.","10":"Jesua nu gewon Jojakim, en Jojakim gewon Eljasib, en Eljasib gewon Jojada,","11":"En Jojada gewon Jonathan, en Jonathan gewon Jaddua.","12":"En in de dagen van Jojakim waren priesters, hoofden der vaderen: van Seraja was Meraja; van Jeremia, Hananja;","13":"Van Ezra, Mesullam; van Amarja, Johanan;","14":"Van Melichu, Jonathan; van Sebanja, Jozef;","15":"Van Harim, Adna; van Merajoth, Helkai;","16":"Van Iddo, Zacharia; van Ginnethon, Mesullam;","17":"Van Abia, Zichri; van Minjamin, van Moadja, Piltai;","18":"Van Bilga, Sammua; van Semaja, Jonathan;","19":"En van Jojarib, Matthenai; van Jedaja, Uzzi;","20":"Van Sallai, Kallai; van Amok, Heber;","21":"Van Hilkia, Hasabja; van Jedaja, Nethaneel.","22":"*Van* de Levieten werden in de dagen van Eljasib, Jojada, en Johanan, en Jaddua, de hoofden der vaderen beschreven; mitsgaders de priesteren, tot het koninkrijk van Darius, den Perziaan.","23":"De kinderen van Levi, de hoofden der vaderen, werden beschreven in het boek der kronieken, tot de dagen van Johanan, den zoon van Eljasib, toe.","24":"De hoofden dan der Levieten waren Hasabja, Serebja, en Jesua, de zoon van Kadmiel, en hun broederen tegen hen over, om te prijzen *en* te danken, naar het gebod van David, den man Gods, wacht tegen wacht.","25":"Matthanja en Bakbukja, Obadja, Mesullam, Talmon *en* Akkub, waren poortiers, de wacht waarnemende bij de schatkamers der poorten.","26":"Dezen waren in de dagen van Jojakim, den zoon van Jesua, den zoon van Jozadak, en in de dagen van Nehemia, den landvoogd, en van den priester Ezra, den schriftgeleerde.","27":"In de inwijding nu van Jeruzalems muur, zochten zij de Levieten uit al hun plaatsen, dat zij hen te Jeruzalem brachten, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen.","28":"Alzo werden de kinderen der zangers verzameld, zo uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten;","29":"En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.","30":"En de priesters en de Levieten reinigden zichzelven; daarna reinigden zij het volk, en de poorten, en den muur.","31":"Toen deed ik de vorsten van Juda opgaan op den muur; en ik stelde twee grote dankkoren en omgangen, *een* ter rechterhand op den muur, naar de Mistpoort toe.","32":"En achter hen ging Hosaja, en de helft der vorsten van Juda.","33":"En Azarja, Ezra, en Mesullam,","34":"Juda, en Benjamin, en Semaja, en Jeremia;","35":"En van de priesters kinderen met trompetten: Zacharja, de zoon van Jonathan, den zoon van Semaja, den zoon van Matthanja, den zoon van Michaja, den zoon van Zakkur, den zoon van Asaf;","36":"En zijn broeders, Semaja, en Azareël, Milalai, Gilalai, Maai, Nethaneel, en Juda, Hanani, met muziekinstrumenten van David, den man Gods; en Ezra, de schriftgeleerde, *ging* voor hun aangezicht heen.","37":"Voorts naar de Fonteinpoort, en tegen hen over, gingen zij op bij de trappen van Davids stad, door den opgang des muurs, boven Davids huis, tot aan de Waterpoort, tegen het oosten.","38":"Het tweede dankkoor nu ging tegenover, en ik achter hetzelve, met de helft des volks, op den muur, van boven den Bakoventoren, tot aan den breden muur;","39":"En van boven de poort van Efraïm, en boven de Oude poort, en boven de Vispoort, en den toren Hananeel, en den toren Mea, tot aan de Schaapspoort, en zij bleven staan in de Gevangenpoort.","40":"Daarna stonden de beide dankkoren in Gods huis; ook ik en de helft der overheden met mij.","41":"En de priesters, Eljakim, Maaseja, Minjamin, Michaja, Eljoenei, Zacharja, Hananja, met trompetten;","42":"Voorts Maaseja, en Semaja, en Eleazar, en Uzzi, en Johanan, en Malchia, en Elam, en Ezer; ook lieten zich de zangers horen, met Jizrahja, den opziener.","43":"En zij offerden deszelven daags grote slachtofferen, en waren vrolijk; want God had hen vrolijk gemaakt met grote vrolijkheid; en ook waren de vrouwen en de kinderen vrolijk; zodat de vrolijkheid van Jeruzalem tot van verre gehoord werd.","44":"Ook werden ten zelfden dage mannen gesteld over de kameren, tot de schatten, tot de hefofferen, tot de eerstelingen en tot de tienden, om daarin uit de akkers der steden te verzamelen de delen der wet, voor de priesteren en voor de Levieten; want Juda was vrolijk over de priesteren en over de Levieten, die daar stonden.","45":"En de wacht huns Gods waarnamen, en de wacht der reiniging, ook de zangers, en de poortiers, naar het gebod van David *en* zijn zoon Salomo.","46":"Want in de dagen van David en Asaf, van ouds, waren er hoofden der zangers, en des lofgezangs, en der dankzeggingen tot God.","47":"Daarom gaf gans Israël, in de dagen van Zerubbabel, en in de dagen van Nehemia, de delen der zangers en der poortiers, van elk dagelijks op zijn dag; en zij heiligden voor de Levieten, en de Levieten heiligden voor de kinderen van Aäron."},"KJV":{"1":"Now these *are* the priests and the Levites that went up with Zerubbabel the son of Shealtiel, and Jeshua: Seraiah, Jeremiah, Ezra,","2":"Amariah, Malluch, Hattush,","3":"Shechaniah, Rehum, Meremoth,","4":"Iddo, Ginnetho, Abijah,","5":"Miamin, Maadiah, Bilgah,","6":"Shemaiah, and Joiarib, Jedaiah,","7":"Sallu, Amok, Hilkiah, Jedaiah. These *were* the chief of the priests and of their brethren in the days of Jeshua.","8":"Moreover the Levites: Jeshua, Binnui, Kadmiel, Sherebiah, Judah, *and* Mattaniah, *which was* over the thanksgiving, he and his brethren.","9":"Also Bakbukiah and Unni, their brethren, *were* over against them in the watches.","10":"And Jeshua begat Joiakim, Joiakim also begat Eliashib, and Eliashib begat Joiada,","11":"And Joiada begat Jonathan, and Jonathan begat Jaddua.","12":"And in the days of Joiakim were priests, the chief of the fathers: of Seraiah, Meraiah; of Jeremiah, Hananiah;","13":"Of Ezra, Meshullam; of Amariah, Jehohanan;","14":"Of Melicu, Jonathan; of Shebaniah, Joseph;","15":"Of Harim, Adna; of Meraioth, Helkai;","16":"Of Iddo, Zechariah; of Ginnethon, Meshullam;","17":"Of Abijah, Zichri; of Miniamin, of Moadiah, Piltai;","18":"Of Bilgah, Shammua; of Shemaiah, Jehonathan;","19":"And of Joiarib, Mattenai; of Jedaiah, Uzzi;","20":"Of Sallai, Kallai; of Amok, Eber;","21":"Of Hilkiah, Hashabiah; of Jedaiah, Nethaneel.","22":"The Levites in the days of Eliashib, Joiada, and Johanan, and Jaddua, *were* recorded chief of the fathers: also the priests, to the reign of Darius the Persian.","23":"The sons of Levi, the chief of the fathers, *were* written in the book of the chronicles, even until the days of Johanan the son of Eliashib.","24":"And the chief of the Levites: Hashabiah, Sherebiah, and Jeshua the son of Kadmiel, with their brethren over against them, to praise *and* to give thanks, according to the commandment of David the man of God, ward over against ward.","25":"Mattaniah, and Bakbukiah, Obadiah, Meshullam, Talmon, Akkub, *were* porters keeping the ward at the thresholds of the gates.","26":"These *were* in the days of Joiakim the son of Jeshua, the son of Jozadak, and in the days of Nehemiah the governor, and of Ezra the priest, the scribe.","27":"And at the dedication of the wall of Jerusalem they sought the Levites out of all their places, to bring them to Jerusalem, to keep the dedication with gladness, both with thanksgivings, and with singing, *with* cymbals, psalteries, and with harps.","28":"And the sons of the singers gathered themselves together, both out of the plain country round about Jerusalem, and from the villages of Netophathi;","29":"Also from the house of Gilgal, and out of the fields of Geba and Azmaveth: for the singers had builded them villages round about Jerusalem.","30":"And the priests and the Levites purified themselves, and purified the people, and the gates, and the wall.","31":"Then I brought up the princes of Judah upon the wall, and appointed two great *companies of them that gave* thanks, *whereof one* went on the right hand upon the wall toward the dung gate:","32":"And after them went Hoshaiah, and half of the princes of Judah,","33":"And Azariah, Ezra, and Meshullam,","34":"Judah, and Benjamin, and Shemaiah, and Jeremiah,","35":"And *certain* of the priests' sons with trumpets; *namely*, Zechariah the son of Jonathan, the son of Shemaiah, the son of Mattaniah, the son of Michaiah, the son of Zaccur, the son of Asaph:","36":"And his brethren, Shemaiah, and Azarael, Milalai, Gilalai, Maai, Nethaneel, and Judah, Hanani, with the musical instruments of David the man of God, and Ezra the scribe before","37":"And at the fountain gate, which was over against them, they went up by the stairs of the city of David, at the going up of the wall, above the house of David, even unto the water gate eastward.","38":"And the other *company of them that gave* thanks went over against *them*, and I after them, and the half of the people upon the wall, from beyond the tower of the furnaces even unto the broad wall;","39":"And from above the gate of Ephraim, and above the old gate, and above the fish gate, and the tower of Hananeel, and the tower of Meah, even unto the sheep gate: and they stood still in the prison gate.","40":"So stood the two *companies of them that gave* thanks in the house of God, and I, and the half of the rulers","41":"And the priests; Eliakim, Maaseiah, Miniamin, Michaiah, Elioenai, Zechariah, *and* Hananiah, with trumpets;","42":"And Maaseiah, and Shemaiah, and Eleazar, and Uzzi, and Jehohanan, and Malchijah, and Elam, and Ezer. And the singers sang loud, with Jezrahiah *their* overseer.","43":"Also that day they offered great sacrifices, and rejoiced: for God had made them rejoice with great joy: the wives also and the children rejoiced: so that the joy of Jerusalem was heard even afar off.","44":"And at that time were some appointed over the chambers for the treasures, for the offerings, for the firstfruits, and for the tithes, to gather into them out of the fields of the cities the portions of the law for the priests and Levites: for Judah rejoiced for the priests and for the Levites that waited.","45":"And both the singers and the porters kept the ward of their God, and the ward of the purification, according to the commandment of David, *and* of Solomon his son.","46":"For in the days of David and Asaph of old *there were* chief of the singers, and songs of praise and thanksgiving unto God.","47":"And all Israel in the days of Zerubbabel, and in the days of Nehemiah, gave the portions of the singers and the porters, every day his portion: and they sanctified *holy things* unto the Levites; and the Levites sanctified *them* unto the children of Aaron."}},"tsk":{"1":[{"kopje":"de priesters","refs":["Neh 7:7","Ezra 2:1","E ":[{"catchword":"Jóhanan,","tekst":"Boven, vs.11, genoemd Jonathan, de vader van Jaddua."},{"catchword":"zoon van Eljasib,","tekst":"Dat is, zoonszoon."}],"24":[{"catchword":"den man Gods,","tekst":"Zie Jdg 13:6 ."},{"catchword":"wacht tegen wacht","tekst":"Dat is, zij deden hun dienst bij beurten, de een om den anderen, naar Davids ordinantie. Zie 1Ch 25 alzo boven, vs.8."}],"25":[{"catchword":"schatkamers","tekst":"Zie onder, vs.44, en Neh 13:5 ; idem, 1Ch 26:17 . Hebreeuws, Asuppim."}],"27":[{"catchword":"inwijding","tekst":"Welke geschiedde door gebeden, dankzeggingen, offeranden en uiterlijke tekenen van geestelijke vreugde voor den Heere, gelijk volgt. Vergelijk Exo 40 ; Num 7 ; Deu 20:5 ; 1Ki 8:63 ; Ezr 6:17 , enz.; Joh 10:22 ."},{"catchword":"plaatsen,","tekst":"Waarheen zij nevens anderen weder getogen waren naar de grote vergadering, waarvan boven, Neh 9 , Neh 10 ."}],"28":[{"catchword":"dorpen","tekst":"Of, hoeven. Alzo vs.29."},{"catchword":"Netofathieten;","tekst":"Of, der Netofathieten."}],"29":[{"catchword":"huis van Gilgal,","tekst":"Of, plaats. Hebreeuws, Beth gilgal ; van Gilgal zie Deu 11:30 ; Jos 5:9 ."},{"catchword":"Geba","tekst":"Zie Jos 21:17 ."},{"catchword":"Asmáveth;","tekst":"Boven, Neh 7:28 , is vermeld Beth-Azmaveth."},{"catchword":"gebouwd","tekst":"Omdat alles door de Babylonische oorlogen zeer verwoest was, en opdat zij bij de hand mochten zijn om hun dienst; zie boven, Neh 11:20 , Neh 11:30 ."}],"30":[{"catchword":"reinigden","tekst":"Vergelijk Gen 35:2 ; Exo 19:10 , Exo 19:15 ; Num 19:2 ; 2Ch 29:5 , 2Ch 29:15-16 , enz.; Ezr 6:20-21 ."}],"31":[{"catchword":"een ter rechterhand","tekst":"Van den anderen hoop der dankzeggenden, zie vs.38."},{"catchword":"Mistpoort","tekst":"Vergelijk deze beschrijving van den muur met boven, Neh 2:13-15 , en Neh 3 , en zie de aantekening aldaar."}],"36":[{"catchword":"David,","tekst":"Die van David gevonden, of geordineerd en overgeleverd waren."},{"catchword":"man Gods;","tekst":"Dat is, van den prof t woord, of de zaak, van een dag op zijn dag."},{"catchword":"zij","tekst":"Te weten, het volk, of gans Israël."},{"catchword":"heiligden voor de Levieten,","tekst":"Dat is, zij zonderden af en gaven den Levieten de tienden, enz., die daartoe geheiligd waren, en waardoor de ganse rest, die zij behielden, voor hun particulier gebruik geheiligd werd. Zie Num 18:21 , Num 18:26 ."},{"catchword":"heiligden voor de kinderen van Aäron","tekst":"Dat is, zij zonderden af en gaven den hogepriester tienden van de tienden, die zij hadden ontvangen, naar de wet Gods; Num 18:26 , enz. Zie ook aldaar Num 18:8 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now these are the Priests and the Levites, [Meaning the chief and the rulers of the Priests and Levites, as may be gathered from verse 7.2,23,24.] that went up with Zerubbabel [See Ezra 2.on verse 2.] the son of Seathiel, and Jesua; [Who was the high Priests] Seraja, Jeremia, Ezra."}],"2":[{"catchword":null,"tekst":"Amarja, Maluch, [This man, and some others are named otherways, below from verse 14.to 21. After the manner of the Hebrews] Hattus,"}],"3":[{"catchword":null,"tekst":"Sechanja, Rehun, Merimoth,"}],"4":[{"catchword":null,"tekst":"Iddo, Ginnethoi, Abja,"}],"5":[{"catchword":null,"tekst":"Mijamim, Maadja, Bilga,"}],"6":[{"catchword":null,"tekst":"Semaja, Amok, Hilkja, Jedaja; those were the heads of the Priests, and their brethren in the days of Jesua."}],"7":[{"catchword":null,"tekst":"Sallu, Amok, Hilkja, JEDAJA; those were the heads of the Priests, and their brethren in thedays of Jesua."}],"8":[{"catchword":null,"tekst":"And the Levites were; Jesua, Binnui, Kadmiel, Serebja, Juda, Matthanja; he [Namely Matthanja. See above chap.11.17.] and his brethren were over the thanksgivings. [That is, they were the chief singing-masters in the singing of Psalms of praise and thanksgiving; as ab.chap.11.17.]"}],"9":[{"catchword":null,"tekst":"And Bakbukja, and Unni, their brethren were over against them in the watches. [That is, were present with or about the singers, to wait upon their office or ministry. See ab.chap.11.on verse 22. And concerning the courses of the singers, see the ordinance of David, 1 Chron.25 9,&c. But at this time they were fewer in number. See Ezra 2.verse.39.]"}],"10":[{"catchword":null,"tekst":"Now Jesua begat Jojakim, and Jojakim begat Eljasib, and Elijasib begat Jojada."}],"11":[{"catchword":null,"tekst":"And Jojada begat Jonathan, and Jonathan begat Jaddua, [This Jadua is conceived to have been the high Priest Jaddus of whom Josephus writteth, that Alexander the Great coming in an hostile manner against Jerusalem, he in his high Priests attire went out of the city to meet him, and appeased him. Whence some conjecture, that Nehemia lived to the end of the Persian Empire, and in that regard was able to write this Register of the succession of high Priests till that time, there being as yet not full threescore years expired, from the time of Artaxerxes Mnemon (whose servant some hold Nehemia to have been) unto the end of the Persian, and the beginning of the Grecian Monarchy. Others conceive that Nehemia (who, according to their opinion, dead, this Register was here inserted by another man of God by inspiration of the holy Ghost to preserve the sucession of high Priests in the Church of God.]"}],"12":[{"catchword":null,"tekst":"And in the days of Jojakim, [Who was high Priest after his father Jesua, verse 10.] were Priests the heads of the fathers; [That is, the chiefst among the Priests, as was shewed on verse 1.] of Seraja, was Meraja; [That was, of Seraja was born or descended Meraja succeeding in his room, therefore others render this thus, for Seraja, that is in his stead or room, and so in the sequel] of Jeremja, Hananja;"}],"13":[{"catchword":null,"tekst":"Of Ezra, Mesullam, of Amarja, Johanan,"}],"14":[{"catchword":null,"tekst":"Of Melichu, Jonathan; of Sebanja Joseph:"}],"15":[{"catchword":null,"tekst":"Of Hurim, Adna; of Merajoth, Helki:"}],"16":[{"catchword":null,"tekst":"Of Iddo, Zacharia: Of Ginnethon, Mesullam:"}],"17":[{"catchword":null,"tekst":"Of Abja, Zichri: of Minjamin, and Moadja, Piltai:"}],"18":[{"catchword":null,"tekst":"Of Bilga, Sammua; of Semaja, Jonathan:"}],"19":[{"catchword":null,"tekst":"And of Jorib, Matthenai; of Jedaja, Uzzi:"}],"20":[{"catchword":null,"tekst":"Of Sullai, Kallai; Of Amok, Hobe:"}],"21":[{"catchword":null,"tekst":"Of Hilkia, Hasubja; of Jedaja, Nethaneel:"}],"22":[{"catchword":null,"tekst":"Of the Levites in the days of Eljasib, Jojada, and Johanan, and Jaddua the heads of the fathers were recorded: together with the Priests until the reign of Darius the Persian. [To wit, the last king of Persia called Codamanus, whom Alexander the great conquered: with whom the Persian Monarchy ended, about the year of the creation of the world 36 42. Before Christs incarnation, 3 29. According to the computation of some Chronologies.]"}],"23":[{"catchword":null,"tekst":"The children of Levi, the heads of the fathers, were recorded in the book of the Chronicles [See 1 Chron.9.10, &c.] until the days of Johanan [above vers.13.called Jonathan, the father of Jaddua] the son [That is, is, Grand-son, or Grand-child, the sons son] of Eljasib."}],"24":[{"catchword":null,"tekst":"The heads then of the Levites were Hasabja, Serebja, and Jesua the son of Kadmiel, and their brethren over against them, to praise (and) to give thanks according to the commandment of David the man of God, [See Judg.13.on verse 6.] ward against ward. [That is, they executed their office or ministry by turns, or courses one for another, according to the ordinance of David. See 1 Chron.25.so ab.verse 8.]"}],"25":[{"catchword":null,"tekst":"Matthanja, and Bakbukja, Obabja, Mesullam, Talmon, (and) Akub were Porters, keeping the watch, by the Treasuries [See below verse 43. And chap.13.5. item 1 Chron.26.on verse 17. Hebr. Asuppim] of the gates."}],"26":[{"catchword":null,"tekst":"These were in the days of Jojakim the son of Jesua the son of Jozadak; and in the days of Nehemia the governor, and of Ezra the Priest the Scribe."}],"27":[{"catchword":null,"tekst":"Now at the dedication of the wall of Jerusalem [Which was performed with prayers, thanksgivings, offering, and outward tokens of spiritual Joy before the Lord, as followeth. Compare Exod.40. Numb.7. Deut. 20. On verse 5. And 1 Kings 8 63. Ezra 6 17 &c. Job.10 22.] they sought the Levites out of all their places, [whither they with others were returned to the great congregation, whereof ab.chap.9. and 10.] to bring them to Jerusalem: to perform the dedication with joy, and with thanksgivings, and with singing, cymbals, Lutes, and with harps."}],"28":[{"catchword":null,"tekst":"So the children of the Singers were gathered together, both out of the plain field round about Jerusalem, and from the villages [Or farms, so verse 29.] of Netophau; [Or of the Netophathites.]"}],"29":[{"catchword":null,"tekst":"And from the house of Gilgal, [Or place of Gilgal, Hebr. Beth-Gilgal, see Deut.11.30. Jos.5.9.] and out of the fields of Gebas, [See Jos.21.17.] and Azmaveth; [ab. Chap.7.28. is mentioned Beth-Azmaveth] for the Singers had built them villages round about Jerusalem, [because all was exceedingly wasted and destroyed by the Babylonian wars, and because they may be near hand for to exercise their function and the worship of God. See ab.chap.11.on v.20. and 30.]"}],"30":[{"catchword":null,"tekst":"And the Priests and the Levites purified themselves: [Compare Gen.35.on verse 2. Exo 19:10,15. Numb.19. 2 Chron.29 5,15.16, etc. And Ezra 6.20,21.] after that they purified the people, and the gates, and the wall."}],"31":[{"catchword":null,"tekst":"Then I caused the Princes of Juda to go up upon the wall: and I appointed two great thanksgiving-quires and circuits, (the one) on the right hand upon the wall, [Of the other company of those that gave thanks, see v.38.] toward the dung-gate. [Compare this description of the wall, with ab.chap.2.13,14.15. and chap.3. and see the annotate. There.]"}],"32":[{"catchword":null,"tekst":"And after them went Hosaja, and half of the Princes of Juda."}],"33":[{"catchword":null,"tekst":"And Azarja, Ezra, and Mesullam,"}],"34":[{"catchword":null,"tekst":"Juda, and Benjamin, and Semaja, and Jeremja,"}],"35":[{"catchword":null,"tekst":"And (certain) of the Priests children with trumpets: Zacharja the son Jonathan, the son of Semaja, the son of Matthanja, the son of Michaja, the son of Zacchur, the son of Asaph:"}],"36":[{"catchword":null,"tekst":"And his brethren, Semaja, and Azareel, Milalai, Gilalai, Maai, Nethaneel, and Juda, Hanani, with musical Instruments of David, [That is, which were invented, or ordained and delivered by David] the man of God: [That is, the Prophet, as above verse 24.] and Ezra the Scribe (went) before their face."}],"37":[{"catchword":null,"tekst":"Moreover toward the Fountain-gate, and over against them, they went up by the stairs of the city of David, unto the water-gate, eastward."}],"38":[{"catchword":null,"tekst":"Now the second thanksgiving-quire they went over against (them) [To wit, on the otherside of the city, that both companies might meet one another at last and go together to the Temple. See verse 40.] and after them, with the half of the people upon the all, from above the tower of the Baking-ovens, unto the broad wall."}],"39":[{"catchword":null,"tekst":"And from above the gate of Ephraim, and above, [Oth. toward; and so in the sequel] the Old-gate, and above the Fish-gate, and the tower of Hananeel, and the tower of Mea unto the Sheeps-gate. And they stood still in the Prison-gate. [Hebr. stood in, or by the gate of Custody; that is, the Prison, as Jer 32:2.]"}],"40":[{"catchword":null,"tekst":"Then stood both the thanksgiving quires in the house of God; and I, and the half of the Rulers with me."}],"41":[{"catchword":null,"tekst":"And the Priests, Eljakim, Maaseja, Minjamin,Michaja, Elioenai, Zacharja, Hananja, with trumpets."}],"42":[{"catchword":null,"tekst":"Moreover, Maaseja, and Semaja, and Eliazar, and Uzzi, and Johanan, and Malchia, and Elam, and Ezer, also the Singers caused themselves to be heard, with Jzrahia the overseer."}],"43":[{"catchword":null,"tekst":"And they offered the same day great slay-offerings, and rejoiced; for God had made them rejoice with great joy, the wives also and the children rejoice: so that the joy of Jerusalem was heard afar off."}],"44":[{"catchword":null,"tekst":"Also the same day were men appointed over the chambers, for the treasures, [Compare below cha.13.5,12,13. And ab.ch.10.37.38.] for the heave-offerings, for the first fruits, and for the tithes, to gather into them, out of the fields of the cities, [That is, which lay round about the cities] the portions of the Law, for the Priests and for the Leviets; [That is, which were ordained in the law, for the Priests, &c. To the bringing up of which portions they had bound themselves anew, ab.c.10.35, &c.] for Juda rejoiced for the Priests, and for the Levites, [Hebr. (there was) joy, or gladness of Juda; or the joy of Juda (was) for the etc.] that stood there, [that is, that waited diligently and faithfully on their ministry, and therein intended to proceed, whereas they were formerly scattered up and down the country for want of maintenance, which now was willingly brought in with joy and rejoicing. Compare below ch.13.10.]"}],"45":[{"catchword":null,"tekst":"And also the singers and the porters kept the watch of their God, [Taking care that the worship of God might be well performed in all its circumstances thereto belonging. See Lev.18.on ver.35.] and the watch of the purification: [as above vers.30.] according to the commandment of David, (and) of Salomon his son. [See 1 Chron.25. Meaning that they kept their courses diligently. Oth. and the Singers and the Porters watched, &c.]"}],"46":[{"catchword":null,"tekst":"For in the days of David and Asaph, [Under whom are also Heman and Jeduthun comprehended, 1 Chron.2.5.1, etc.] there were heads of the Singers, and of the song of praise, and of thanksgivings unto God. [That is, chief singers, and tuners of Psalms and songs, and overseers of the chiefest, who took care that the ministry and all the courses of the Singers were rightly observed, etc. See above vers.42. and chap.11.17. and 1 Chron.25.2,3,6.]"}],"47":[{"catchword":null,"tekst":"Therefore all Israel in the days of Zerubbabel, and in the days of Nehemiah, gave the portions of the Singers, and of the porters, [as above vers.44.] every days (portion) on its day: [Hebr. the word, or, the thing of a day on its day] And they [to wit, the people, or all Israel] hallowed for the Levites, [that is, they set apart, and gave the tithes unto the Levites, etc. Which were consecrated for that purpose, and whereby all the rest that they kept, was hallowed for their own particular use. See Num 18:21,26.] and the Levites hallowed for the children of Aaron. [that is, they set apart, and gave tithes of the tithes, which they had received, unto the high Priests, according to the law of God, Num 18:26, etc. See also there v.8.]"}]}}};

(function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
