 alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Est 3:7": "In de eerste maand (dat is de maand Nisan), in het twaalfde jaar van de koning Ahasveros, wierp men het Pur, dat is het lot, voor het aangezicht van Haman, van dag tot dag, en van maand tot maand, tot de twaalfde maand toe; dat is de maand Adar.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "2 Kor 4:9": "Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;", "Klaagl 3:45": "Samech. U hebt ons tot een uitvaagsel en wegwerpsel gesteld, te midden van de volken.", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "Matt 2:14": "Hij stond dan op, nam het Kindje en Zijn moeder 's nachts tot zich, en vertrok naar Egypte;", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Ezech 40:6": "Toen kwam hij bij de poort die naar het oosten keek, en hij ging de trappen ervan op, en mat de drempel van de poort: één riet de breedte, en de andere drempel: één riet de breedte.", "Jes 66:14": "En u zult het zien, en uw hart zal vrolijk zijn, en uw beenderen zullen groeien als het tedere gras; dan zal de hand van de HEERE bekend worden aan Zijn knechten, en Hij zal boos worden op Zijn vijanden.", "Ps 40:4": "En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.", "Mark 10:51": "En Jezus antwoordde en zei tegen hem: Wat wilt u dat Ik voor u doe? En de blinde zei tegen Hem: Rabboni, dat ik weer kan zien.", "Ps 130:6": "Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.", "Fil 1:19-21": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus. Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst.", "Est 5:8": "Als ik genade gevonden heb in de ogen van de koning, en als het de koning goeddunkt om mij mijn bede te geven en mijn verzoek te doen, laat de koning dan met Haman komen naar de maaltijd die ik voor hen zal klaarmaken; dan zal ik morgen doen naar het bevel van de koning.", "2 Kor 5:7": "(Want wij wandelen door geloof en niet door aanschouwen.)", "Neh 3:14": "De Mistpoort nu verbeterde Malchia, de zoon van Rechab, leider van het deel Beth-Cherem; hij bouwde ze, en richtte haar deuren op, met haar sloten en haar grendelen.", "Est 8:5": "En zij zei: Als het de koning goeddunkt, en als ik genade voor zijn ogen gevonden heb, en deze zaak voor de koning juist is, en ik in zijn ogen aangenaam ben, laat er dan geschreven worden dat de brieven en het plan van Haman, de zoon van Hammedatha, de Agagiet, teruggeroepen worden, welke hij geschreven heeft om de Joden om te brengen, die in alle landschappen van de koning zijn.", "2 Sam 14:22": "Toen viel Joab op zijn gezicht ter aarde, en boog zich, en dankte de koning; en Joab zei: Vandaag heeft uw dienaar gemerkt, dat ik genade gevonden heb in uw ogen, mijn heer koning! Omdat de koning gedaan heeft wat zijn dienaar gevraagd heeft.", "Hebr 11:36": "En anderen hebben bespottingen en geselingen ondervonden, en ook boeien en gevangenschap;", "Neh 1:11": "Och, Heere, laat toch Uw oor opmerkzaam zijn op het gebed van Uw dienaar, en op het gebed van Uw dienaren, die ernaar verlangen Uw Naam te vrezen; en laat het Uw dienaar vandaag toch goed lukken, en geef hem barmhartigheid voor het aangezicht van deze man. Ik was namelijk de schenker van de koning.", "Fil 4:6": "Wees over niets bezorgd; maar laat in alles, door bidden en smeken, met dankzegging uw verlangens bekend worden bij God;", "Ps 25:20": "Schin. Bewaar mijn ziel, en red mij; laat mij niet beschaamd worden, want ik vertrouw op U.", "2 Petr 3:13": "Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, waarin gerechtigheid woont.", "Ps 38:10": "Heere! Voor U is al mijn verlangen; en mijn zuchten is voor U niet verborgen.", "Ps 102:15": "Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis.", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "Dan 3:16": "Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.", "Klaagl 2:8": "Cheth. De HEERE heeft gedacht te verderven de muur van de dochter van Sion; Hij heeft het richtsnoer daarover getrokken, Hij heeft Zijn hand niet afgewend, dat Hij ze niet zou verslinden; en Hij heeft de voormuur en de muur samen treurig gemaakt, zij zijn verzwakt.", "Ezra 5:6": "Afschrift van het brief dat Thathnai, de landvoogd aan deze kant van de rivier, met Sthar-boznai, en zijn metgezellen, de Afarsechaieten, die aan deze kant van de rivier waren, aan de koning Darius zond.", "Jes 61:4": "En zij zullen de oude, verwoeste plaatsen bouwen, de vorige verstoringen weer oprichten, en de verwoeste steden vernieuwen, die verstoord waren van geslacht op geslacht.", "Neh 4:2": "Hij sprak in het bijzijn van zijn broeders en van het leger van Samaria, en zei: Wat doen deze zwakke Joden? Zullen zij zichzelf versterken? Zullen zij offeren? Zullen zij het in één dag afmaken? Zullen zij de stenen uit de puinhopen weer levend maken, terwijl die verbrand zijn?", "Jer 24:9": "En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben;", "Ps 86:7": "In de dag van mijn benauwdheid roep ik U aan, want Gij verhoort mij.", "Neh 1:8-10": "Denk toch aan het woord, dat U Uw dienaar Mozes geboden hebt, en zei: Als u ontrouw wordt, zal Ik u onder de volken verstrooien. Maar als u zich tot Mij bekeert, en Mijn geboden houdt, en die doet; al waren uw verdrevenen aan het einde van de hemel, Ik zal hen vandaar verzamelen, en zal ze brengen naar de plaats die Ik gekozen heb om Mijn Naam daar te doen wonen. Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Rom 8:18": "Want ik houd het ervoor, dat het lijden van deze tegenwoordige tijd niet opweegt tegen de heerlijkheid die aan ons geopenbaard zal worden.", "Zach 2:2": "En ik zei: Waar gaat u heen? En hij zei tegen mij: Om Jeruzalem te meten; om te zien, hoe groot haar breedte, en hoe groot haar lengte wezen zal.", "Neh 13:6": "Doch bij dit alles was ik niet in Jeruzalem; want in het tweeëndertigste jaar van Arthahsasta, koning van Babel, kwam ik naar de koning; maar na verloop van enige dagen kreeg ik opnieuw verlof van de koning.", "Pred 7:3": "Het treuren is beter dan het lachen; want door de droefheid van het aangezicht wordt het hart gebeterd.", "Job 23:6": "Zou Hij naar de grootheid van Zijn macht met mij twisten? Nee; maar Hij zou acht op mij slaan.", "Ps 21:8": "Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "Pred 3:7": "Een tijd om te scheuren, en een tijd om toe te naaien; een tijd om te zwijgen, en een tijd om te spreken;", "Joz 18:4-9": "Geeft voor u drie mannen van elke stam, dat ik ze uitzend, en zij zich opmaken, en het land doorwandelen, en het beschrijven naar hun erfdelen, en weer tot mij komen. Zij nu zullen het verdelen in zeven delen; Juda zal blijven op zijn gebied van het zuiden, en het huis van Jozef zal blijven op zijn gebied van het noorden. En u zult het land beschrijven in zeven delen, en het hierheen naar mij toe brengen, dat ik voor u hier het lot werp voor het aangezicht van de HEERE, onze God.", "Dan 6:22": "Toen sprak Daniël tegen de koning: O koning, leef voor eeuwig!", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "Num 22:4": "Daarom zei Moab tegen de oudsten van Midian: Nu zal deze menigte alles om ons heen opeten, zoals de os het groen van het veld opeet. Balak, de zoon van Zippor, was in die tijd koning van de Moabieten.", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "Neh 3:13": "De Dalpoort verbeterden Hanun, en de inwoners van Zanoah; zij bouwden die, en richtten haar deuren op, met haar sloten en haar grendelen; daarbij duizend el aan de muur, tot aan de Mistpoort.", "1 Kon 10:5": "en het voedsel van zijn tafel, en het zitten van zijn knechten, en het staan van zijn dienaren, en hun kleding, en zijn schenkers, en zijn opgang waarlangs hij naar boven ging in het huis van de HEERE, toen was er in haar geen geest meer.", "Jes 36:2": "En de koning van Assyrië zond Rabsake van Lachis naar Jeruzalem, naar koning Hizkia, met een zwaar leger; en hij stond aan de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller.", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Ps 71:5-7": "Want Gij zijt mijn Verwachting, Heere HEERE! mijn Vertrouwen van mijn jeugd af aan. Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U. Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Rom 8:38": "Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal,", "Ezra 4:15": "opdat men zoekt in het boek van de kronieken van uw voorvaderen; dan zult u in het boek van de kronieken vinden en weten dat die stad een opstandige stad geweest is, die de koningen en landstreken schade toebracht, en dat men daarbinnen opstand gesticht heeft, van oude tijden af; daarom is die stad verwoest.", "Neh 4:13-23": "Daarom stelde ik het volk op in de lagere plaatsen achter de muur, en op de hoogten, naar hun geslachten, met hun zwaarden, hun speren en hun bogen. En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen. Daarna gebeurde het, toen onze vijanden hoorden dat het ons bekend was geworden, en dat God hun plan had verijdeld, dat wij allen weer terugkeerden naar de muur, ieder naar zijn werk.", "Ps 16:8": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen.", "Dan 6:17": "Toen beval de koning, en zij brachten Daniël naar voren, en wierpen hem in de kuil van de leeuwen; en de koning antwoordde en zei tegen Daniël: Uw God, Die u voortdurend eert, Die verlost u!", "Ezra 8:18": "En zij brachten ons, naar de goede hand van onze God over ons, een man van verstand, van de kinderen van Mahli, de zoon van Levi, de zoon van Israël; namelijk Serebja, met zijn zonen en broeders, achttien;", "Ps 42:9": "Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.", "Ps 11:1": "Een psalm van David, voor de koorleider. Ik vertrouw op de HEERE; hoe zegt u tegen mijn ziel: Vlucht naar uw gebergte, als een vogel?", "Joh 18:1": "Jezus zei dit en ging met Zijn discipelen naar de overkant van de beek Kedron, waar een hof was, waar Hij inging, en Zijn discipelen.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "2 Sam 15:31": "Toen liet men David weten, en zei: Achitofel is onder degenen die zich met Absalom hebben verbonden. Toen zei David: HEERE, maak toch de raad van Achitofel tot dwaasheid.", "Ezra 7:21": "En van mij, mij, koning Arthahsasta, wordt bevel gegeven aan alle schatmeesters die aan de overkant van de rivier zijn, dat alles wat Ezra, de priester, de schriftgeleerde van de wet van de God van de hemel, van u zal vragen, spoedig gedaan wordt;", "Ezra 5:3": "In die tijd kwam Thathnai, de landvoogd aan deze kant van de rivier, en Sthar-boznai, en hun metgezellen, naar hen toe en zeiden aldus tegen hen: Wie heeft u bevel gegeven dit huis te bouwen en deze muur te voltooien?", "2 Tim 2:11-13": "Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven; als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen; als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Hagg 1:14": "En de HEERE wekte de geest op van Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en de geest van Josua, de zoon van Jozadak, de hogepriester, en de geest van heel het overblijfsel van het volk; en zij kwamen en gingen aan het werk in het huis van de HEERE van de heerscharen, hun God,", "Ruth 2:13": "En zij zei: Laat mij genade vinden in uw ogen, mijn heer, omdat u mij getroost hebt, en omdat u naar het hart van uw dienstmaagd gesproken hebt, hoewel ik niet ben als een van uw dienstmaagden.", "Ps 144:10": "U, Die de koningen overwinning geeft, Die Zijn dienaar David bevrijdt van het boze zwaard;", "2 Kron 32:3": "hield hij raad met zijn vorsten en zijn helden, om de waterbronnen te dichten die buiten de stad waren; en zij hielpen hem.", "Ezra 4:4-23": "Toch maakte het volk van het land de handen van het volk van Juda slap, en joeg hen schrik aan bij het bouwen; en zij huurden tegen hen raadslieden om hun plan tegen te werken, al de dagen van Kores, koning van Perzië, tot aan het koningschap van Darius, de koning van Perzië. En onder het koningschap van Ahasveros, in het begin van zijn koningschap, schreven zij een aanklacht tegen de inwoners van Juda en Jeruzalem.", "Jer 31:38-40": "Zie, de dagen komen, spreekt de HEERE, dat deze stad voor de HEERE herbouwd zal worden, vanaf de toren Hananeel tot aan de Hoekpoort. En het meetsnoer zal verder daarnaast uitgaan tot aan de heuvel Gareb, en zich naar Goath omwenden. En het hele dal van de dode lichamen en van de as, en alle velden tot aan de beek Kidron, tot aan de hoek van de Paardenpoort in het oosten, zal voor de HEERE heilig zijn; er zal niets meer worden uitgerukt, of afgebroken worden, in eeuwigheid.", "Hebr 11:7-11": "Door het geloof heeft Noach, door God gewaarschuwd over de dingen die nog niet gezien werden, en bevreesd geworden, de ark gebouwd tot redding van zijn huisgezin; door dit geloof heeft hij de wereld veroordeeld, en is hij een erfgenaam geworden van de rechtvaardigheid die naar het geloof is. Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou. Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.", "1 Joh 4:16": "En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.", "Ps 60:14": "In God zullen wij kloeke daden doen, en Hij zal onze tegenstanders vertreden.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Ezra 7:6": "Deze Ezra trok op uit Babel; en hij was een vaardig schriftgeleerde in de wet van Mozes, die de HEERE, de God van Israël, gegeven heeft; en de koning gaf hem, naar de hand van de HEERE, zijn God, over hem, al zijn verzoek.", "Ps 102:14": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.", "Ezech 25:6-8": "Want zo zegt de Heere HEERE: Omdat u met de hand geklapt, en met de voet gestampt hebt, en van harte verheugd bent geweest over al uw plundering, over het land van Israël; Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Omdat Moab en Seïr zeggen: Zie, het huis van Juda is gelijk aan al de heidenvolken;", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "2 Kron 32:33": "En Jehizkia ontsliep met zijn vaderen, en zij begroeven hem op de hoogste plaats van de graven van de zonen van David; en heel Juda en de inwoners van Jeruzalem bewezen hem eer bij zijn dood; en zijn zoon Manasse werd koning in zijn plaats.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Dan 6:2-4": "En het leek Darius goed dat hij over het koninkrijk honderdtwintig stadhouders aanstelde, die over het hele koninkrijk zouden zijn; en boven hen drie vorsten, van wie Daniël de eerste zou zijn, aan wie die stadhouders zelf rekenschap moesten geven, zodat de koning geen schade leed. Toen overtrof deze Daniël die vorsten en die stadhouders, omdat er een voortreffelijke geest in hem was; en de koning dacht hem aan te stellen over het hele koninkrijk.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Neh 1:1": "De geschiedenissen van Nehemia, zoon van Hachalja. En het gebeurde in de maand Chisleu, in het twintigste jaar, toen ik in de burcht Susan was,", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "Ps 31:4-7": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam. Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte. In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "Neh 3:13-16": "De Dalpoort verbeterden Hanun, en de inwoners van Zanoah; zij bouwden die, en richtten haar deuren op, met haar sloten en haar grendelen; daarbij duizend el aan de muur, tot aan de Mistpoort. De Mistpoort nu verbeterde Malchia, de zoon van Rechab, leider van het deel Beth-Cherem; hij bouwde ze, en richtte haar deuren op, met haar sloten en haar grendelen. En de Fonteinpoort verbeterde Sallum, de zoon van Kol-Hoze, leider van het deel van Mizpa; hij bouwde ze, en overdekte ze, en richtte haar deuren op, met haar sloten en haar grendelen; daarbij de muur van de vijver Schelah bij de tuin van de koning, en tot aan de trappen, die naar beneden gaan vanaf Davids stad.", "Jer 32:40": "En Ik zal een eeuwig verbond met hen sluiten, dat Ik Mij van achter hen niet zal afkeren, opdat Ik hun goeddoe; en Ik zal Mijn vrees in hun hart geven, zodat zij niet van Mij afwijken.", "1 Kon 2:37": "Want het zal gebeuren op de dag dat u weggaat, wanneer u over de beek Kidron trekt, weet u zeker, dat u zult sterven; uw bloed zal op uw eigen hoofd zijn.", "Ps 46:2-4": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden. Daarom zullen wij niet vrezen, al veranderde de aarde haar plaats, en al werden de bergen verzet in het hart van de zeeën; Laat haar water bruisen, laat het beroerd worden; laat de bergen daveren, door de verheffing daarvan! Sela.", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "2 Kron 21:20": "Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.", "Neh 12:37": "Vervolgens naar de Fonteinpoort, en tegenover hen, gingen zij op bij de trappen van de stad van David, via de opgang van de muur, boven het huis van David, tot aan de Waterpoort, naar het oosten.", "Ps 74:12": "Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.", "Ps 119:74": "Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.", "1 Sam 17:37": "Verder zei David: De HEERE, Die mij gered heeft uit de klauw van de leeuw en uit de klauw van de beer, Die zal mij redden uit de hand van deze Filistijn. Toen zei Saul tegen David: Ga heen, en de HEERE zij met u!", "2 Kon 18:5": "Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Est 5:3": "Toen zei de koning tegen haar: Wat is er, koningin Esther? Of wat is uw verzoek? Het zal u gegeven worden, ook tot de helft van het koninkrijk.", "Ps 60:12": "Zult U het niet zijn, o God! Die ons verstoten had, en niet uittrok, o God! met onze legers?", "Ps 44:6": "Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan.", "Ps 91:2": "Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw!", "Hand 10:31": "en zie, een man stond voor mij, in een blinkend kleed, en zei: Cornelius! Uw gebed is verhoord, en uw aalmoezen zijn voor God in gedachtenis gekomen.", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Ps 89:19": "Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.", "Matt 28:14": "En als dit de stadhouder ter ore komt, zullen wij hem overtuigen, en zorgen dat u zonder zorgen bent.", "Micha 7:10": "En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Jona 2:2-9": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen. En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "1 Kor 9:26": "Ik loop dan zo, niet als op het onzekere; ik strijd zo, niet als iemand die de lucht slaat;", "Gen 6:22": "En Noach deed het; naar alles wat God hem geboden had, zo deed hij.", "Jes 50:7-9": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Micha 7:20": "U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt.", "Klaagl 3:46": "Pe. Al onze vijanden hebben hun mond tegen ons opgesperd.", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "Richt 9:32": "Maak u dus nu klaar in de nacht, u en het volk dat bij u is, en leg een hinderlaag in het veld.", "Neh 1:1-11": "De geschiedenissen van Nehemia, zoon van Hachalja. En het gebeurde in de maand Chisleu, in het twintigste jaar, toen ik in de burcht Susan was, dat Hanani kwam, een van mijn broers, hij en enkele mannen uit Juda, en ik vroeg hen naar de Joden die ontkomen waren, die overgebleven waren van de gevangenschap, en naar Jeruzalem. En zij zeiden tegen mij: De overgeblevenen, die van de gevangenschap daar in het gebied zijn overgebleven, zijn in grote ellende en in smaad; en de muur van Jeruzalem is afgebroken, en haar poorten zijn met vuur verbrand.", "Ezra 6:6": "Nu dan, u Thathnai, landvoogd aan de overkant van de rivier, u Sthar-boznai, met uw gezelschap, u Afarsechaieten, die aan de overkant van de rivier zijn, blijf daar ver vandaan!", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "Ps 56:5": "In God zal ik Zijn woord prijzen; ik vertrouw op God, ik zal niet vrezen; wat zou vlees mij doen?", "Zach 8:13": "En het zal gebeuren: zoals u, huis van Juda, en u, huis van Israël, geweest bent een vloek onder de heidenen, zo zal Ik u behoeden, en u zult een zegen wezen; wees niet bang, laat uw handen sterk zijn.", "Hand 24:14": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is;", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Ps 119:151": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid.", "Ps 112:10": "Resch. De goddeloze zal het zien, en hij zal boos worden; Schin. hij zal met zijn tanden knarsen en wegkwijnen. Thau. de wens van de goddelozen zal vergaan.", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Ezra 7:9": "Want op de eerste dag van de eerste maand was het begin van het optocht uit Babel, en op de eerste dag van de vijfde maand kwam hij in Jeruzalem, naar de goede hand van zijn God over hem.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Neh 6:6": "Daarin stond geschreven: Onder de volken wordt gezegd, en Gasmu bevestigt het, dat u en de Joden van plan zijn in opstand te komen; daarom bouwt u de muur, en zou u hun koning worden — zo luiden de geruchten.", "Dan 6:7": "Zo kwamen deze vorsten en de stadhouders met elkaar bijeen bij de koning, en zeiden zo tegen hem: O koning Darius, leef voor eeuwig!", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Ps 79:12": "En geef onze buren zevenvoudig terug in hun schoot hun smaad, waarmee zij U, o Heere, gesmaad hebben.", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Ps 79:4": "Wij zijn onze buren tot smaad geworden; een spot en schimp voor hen die rondom ons zijn.", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "Job 42:2": "Ik weet, dat U alles vermag, en dat geen van Uw gedachten kan afgesneden worden.", "Ps 119:81": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Ps 119:166": "O HEERE! ik hoop op Uw heil, en doe Uw geboden.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is."}, "noten": {"1": "SV: lusthof"}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">Toen</span> gebeurde het in <span class=\"wl\" data-l=\"L2\" data-code=\"H2320\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2320\">maand</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5212\">Nisan</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H5212\">in</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6242\">het</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6242\">twintigste</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8141\">jaar</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8141\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H783\">Arthahsasta</span>, <em>als</em> er <span class=\"wl\" data-l=\"L8\" data-code=\"H3196\">wijn</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3196\">voor</span> hem <span class=\"wl\" data-l=\"L8\" data-code=\"H3196\">was</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H3196\">dat</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3196\">ik</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3196\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3196\">wijn</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5375\">opnam</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H5414\">en</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H5414\">aan</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4428\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4428\">koning</span> e=\"H7725\">ik</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7725\">hun</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1697\">antwoord</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H559\">en</span> zei tegen <span class=\"wl\" data-l=\"L4\" data-code=\"H430\">hen</span>: <span class=\"wl\" data-l=\"L4\" data-code=\"H430\">De</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H430\">God</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H430\">van</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8064\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8064\">hemel</span>, Hij zal <span class=\"wl\" data-l=\"L6\" data-code=\"H6743\">het</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6743\">ons</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6743\">doen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6743\">gelukken</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H587\">en</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H587\">wij</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H587\">Zijn</span> dienaren, <span class=\"wl\" data-l=\"L8\" data-code=\"H6965\">zullen</span> opstaan <span class=\"wl\" data-l=\"L9\" data-code=\"H1129\">en</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1129\">bouwen</span>; <span class=\"wl\" data-l=\"L10\" data-code=\"H369\">maar</span> u <span class=\"wl\" data-l=\"L10\" data-code=\"H369\">hebt</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H369\">geen</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H2506\">deel</span>, geen recht, en geen aandenken <span class=\"wl\" data-l=\"L12\" data-code=\"H3389\">in</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H3389\">Jeruzalem</span>."}, "koppeling_kjv": {"1": "And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H5212\">Nisan,</span> in the <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H783\">Artaxerxes</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> that <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> was <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: and I took <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> Now I had not been beforetime <span class=\"wl wl-kjv\" data-code=\"H7451\">sad</span> in his presence.", "2": "Wherefore the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, Why is thy <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">sad,</span> seeing thou art not <span class=\"wl wl-kjv\" data-code=\"H2470\">sick?</span> this is nothing else but <span class=\"wl wl-kjv\" data-code=\"H7455\">sorrow</span> of <span class=\"wl wl-kjv\" data-code=\"H3820\">heart.</span> Then I was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">sore</span> afraid,", "3": "And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Let the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">live</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> why should not my <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance</span> be <span class=\"wl wl-kjv\" data-code=\"H3415\">sad,</span> when the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">place</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers'</span> <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchres,</span> lieth <span class=\"wl wl-kjv\" data-code=\"H2720\">waste,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> thereof are <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> with fire?", "4": "Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, For what dost thou make <span class=\"wl wl-kjv\" data-code=\"H1245\">request?</span> So I <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> to the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of heaven.", "5": "And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> If it <span class=\"wl wl-kjv\" data-code=\"H2895\">please</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and if thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> have found <span class=\"wl wl-kjv\" data-code=\"H3190\">favour</span> in thy <span class=\"wl wl-kjv\" data-code=\"H6440\">sight,</span> that thou wouldest <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> me unto <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers'</span> <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchres,</span> that I may build", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, (the <span class=\"wl wl-kjv\" data-code=\"H7694\">queen</span> also <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting</span> by <span class=\"wl wl-kjv\" data-code=\"H681\">him,)</span> For how long shall thy <span class=\"wl wl-kjv\" data-code=\"H4109\">journey</span> be? and when wilt thou <span class=\"wl wl-kjv\" data-code=\"H7725\">return?</span> So it <span class=\"wl wl-kjv\" data-code=\"H3190\">pleased</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> me; and I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> him a time.", "7": "Moreover I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> If it <span class=\"wl wl-kjv\" data-code=\"H2895\">please</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> let <span class=\"wl wl-kjv\" data-code=\"H107\">letters</span> be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> me to the <span class=\"wl wl-kjv\" data-code=\"H6346\">governors</span> <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> that they may convey me <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> till I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into Judah;", "8": "And a <span class=\"wl wl-kjv\" data-code=\"H107\">letter</span> unto <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph</span> the <span class=\"wl wl-kjv\" data-code=\"H8104\">keeper</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H6508\">forest,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> to make <span class=\"wl wl-kjv\" data-code=\"H7136\">beams</span> for the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace</span> which appertained to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> that I shall enter <span class=\"wl wl-kjv\" data-code=\"H935\">into.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">granted</span> me, according to the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of my God", "9": "Then I <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H6346\">governors</span> <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H107\">letters.</span> Now the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> had <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> and horsemen", "10": "When <span class=\"wl wl-kjv\" data-code=\"H5571\">Sanballat</span> the <span class=\"wl wl-kjv\" data-code=\"H2772\">Horonite,</span> and <span class=\"wl wl-kjv\" data-code=\"H2900\">Tobiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> the <span class=\"wl wl-kjv\" data-code=\"H5984\">Ammonite,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of it, it <span class=\"wl wl-kjv\" data-code=\"H3415\">grieved</span> them <span class=\"wl wl-kjv\" data-code=\"H7451\">exceedingly</span> that there was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H2896\">welfare</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.", "11": "So I <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and was there <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> days.", "12": "And I <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> I and <span class=\"wl wl-kjv\" data-code=\"H4592\">some</span> <span class=\"wl wl-kjv\" data-code=\"H4592\">few</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> with me; neither <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> I any <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> what my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> in my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> neither was there any <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> with me, save the <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> that I rode upon.", "13": "And I went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley,</span> even <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H8577\">dragon</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">well,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H830\">dung</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">port,</span> and <span class=\"wl wl-kjv\" data-code=\"H7663\">viewed</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> which were broken <span class=\"wl wl-kjv\" data-code=\"H6555\">down,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> thereof were <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> with fire.", "14": "Then I went <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> to the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H5869\">fountain,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1295\">pool:</span> but there was no <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> for the <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> that was under me to pass.", "15": "Then went I <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> by the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook,</span> and <span class=\"wl wl-kjv\" data-code=\"H7663\">viewed</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> and turned <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley,</span> and so returned.", "16": "And the <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not whither I <span class=\"wl wl-kjv\" data-code=\"H1980\">went,</span> or what I <span class=\"wl wl-kjv\" data-code=\"H6213\">did;</span> neither had I as <span class=\"wl wl-kjv\" data-code=\"H3651\">yet</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it to the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews,</span> nor to the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> nor to the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles,</span> nor to the <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> nor to the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> the "wl wl-kjv\" data-code=\"H5984\">Ammonite,</span> and <span class=\"wl wl-kjv\" data-code=\"H1654\">Geshem</span> the <span class=\"wl wl-kjv\" data-code=\"H6163\">Arabian,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, they laughed us to <span class=\"wl wl-kjv\" data-code=\"H3932\">scorn,</span> and <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> us, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What is this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> that ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do?</span> will ye <span class=\"wl wl-kjv\" data-code=\"H4775\">rebel</span> against the king?", "20": "Then <span class=\"wl wl-kjv\" data-code=\"H7725\">answered</span> I them, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, The <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> he will <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> us; therefore we his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> will <span class=\"wl wl-kjv\" data-code=\"H6965\">arise</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">build:</span> but ye have no <span class=\"wl wl-kjv\" data-code=\"H2506\">portion,</span> nor <span class=\"wl wl-kjv\" data-code=\"H6666\">right,</span> nor <span class=\"wl wl-kjv\" data-code=\"H2146\">memorial,</span> in Jerusalem."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
