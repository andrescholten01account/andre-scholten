: "Ezechiël", "href": "../../ezechiel/1/"}, {"naam": "Daniël", "href": "../../daniel/1/"}, {"naam": "Hosea", "href": "../../hosea/1/"}, {"naam": "Joël", "href": "../../joel/1/"}, {"naam": "Amos", "href": "../../amos/1/"}, {"naam": "Obadja", "href": "../../obadja/1/"}, {"naam": "Jona", "href": "../../jona/1/"}, {"naam": "Micha", "href": "../../micha/1/"}, {"naam": "Nahum", "href": "../../nahum/1/"}, {"naam": "Habakuk", "href": "../../habakuk/1/"}, {"naam": "Zefanja", "href": "../../zefanja/1/"}, {"naam": "Haggaï", "href": "../../haggai/1/"}, {"naam": "Zacharia", "href": "../../zacharia/1/"}, {"naam": "Maleachi", "href": "../../maleachi/1/"}, {"naam": "Mattheüs", "href": "../../mattheus/1/"}, {"naam": "Markus", "href": "../../markus/1/"}, {"naam": "Lukas", "href": "../../lukas/1/"}, {"naam": "Johannes", "href": "../../johannes/1/"}, {"naam": "Handelingen", "href": "../../handelingen/1/"}, {"naam": "Romeinen", "href": "../../romeinen/1/"}, {"naam": "1 Korinthe", "href": "../../1-korinthe/1/"}, {"naam": "2 Korinthe", "href": "../../2-korinthe/1/"}, {"naam": "Galaten", "href": "../../galaten/1/"}, {"naam": "Efeze", "href": "../../efeze/1/"}, {"naam": "Filippenzen", "href": "../../filippenzen/1/"}, {"naam": "Kolossenzen", "href": "../../kolossenzen/1/"}, {"naam": "1 Thessalonicenzen", "href": "../../1-thessalonicenzen/1/"}, {"naam": "2 Thessalonicenzen", "href": "../../2-thessalonicenzen/1/"}, {"naam": "1 Timotheüs", "href": "../../1-timotheus/1/"}, {"naam": "2 Timotheüs", "href": "../../2-timotheus/1/"}, {"naam": "Titus", "href": "../../titus/1/"}, {"naam": "Filemon", "href": "../../filemon/1/"}, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Toen gebeurde het in de maand Nisan, in het twintigste jaar van koning Arthahsasta, *als* er wijn voor hem was, dat ik de wijn opnam en aan de koning gaf; nu was ik nooit eerder treurig geweest voor hem.", "2": "Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd,", "3": "en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn?", "4": "En de koning zei tegen mij: Wat verzoekt u nu? Toen bad ik tot de God van de hemel.", "5": "En ik zei tegen de koning: Als het de koning goeddunkt, en als uw dienaar u aangenaam is, dat u mij zendt naar Juda, naar de stad van de graven van mijn vaderen, om die te herbouwen.", "6": "Toen zei de koning tegen mij, terwijl de koningin naast hem zat: Hoelang zal uw reis duren, en wanneer zult u terugkomen? En het behaagde de koning om mij te zenden, toen ik hem een bepaalde tijd had opgegeven.", "7": "Verder zei ik tegen de koning: Als het de koning goeddunkt, dat men mij brieven geeft aan de landvoogden aan de andere zijde van de rivier, zodat zij mij helpen doorreizen, totdat ik in Juda zal zijn aangekomen;", "8": "ook een brief aan Asaf, de bewaarder van het park[1] van de koning, om mij hout te geven om er balken van te maken voor de poorten van het paleis dat bij het huis behoort, en voor de stadsmuur, en voor het huis waar ik zal intrekken. En de koning gaf ze mij, naar de goede hand van mijn God over mij.", "9": "Toen kwam ik bij de landvoogden aan de andere zijde van de rivier, en gaf hun de brieven van de koning. En de koning had aanvoerders van het leger en ruiters met mij gezonden.", "10": "Toen Sanballat, de Horoniet, en Tobia, de Ammonitische dienaar, dat hoorden, mishaagde het hun ten zeerste, dat er een mens gekomen was om wat goeds te zoeken voor de kinderen van Israël.", "11": "En ik kwam in Jeruzalem, en was daar drie dagen.", "12": "Daarna maakte ik mij 's nachts op, ik en enkele weinig mannen met mij, en ik maakte aan niemand bekend wat mijn God in mijn hart had gegeven om in Jeruzalem te doen; en er was geen dier met mij, dan het dier waarop ik reed.", "13": "En ik trok 's nachts uit door de Dalpoort, en voorbij de Drakenfontein, en naar de Mestpoort, en ik bekeek de muren van Jeruzalem, die waren afgebroken, en haar poorten die met vuur verteerd waren.", "14": "En ik ging verder naar de Fonteinpoort, en naar de vijver van de koning; maar daar was geen plaats voor het dier om onder mij door te gaan.", "15": "Toen ging ik 's nachts omhoog, door de beek, en ik bekeek de muur; en ik keerde terug, en kwam in door de Dalpoort; zo keerde ik terug.", "16": "En de overheden wisten niet waar ik heengegaan was en wat ik deed; want ik had tot dan toe aan de Joden, de priesters, de edelen, de overheden, en de anderen die het werk deden, niets bekendgemaakt.", "17": "Toen zei ik tegen hen: U ziet de ellende waarin wij zijn, dat Jeruzalem woest is, en haar poorten met vuur verbrand zijn; komt, laten wij Jeruzalems muur opbouwen, zodat wij niet langer een smaad zijn.", "18": "En ik maakte hun de hand van mijn God bekend, Die goed over mij geweest was, en ook de woorden van de koning, die hij tegen mij gesproken had. Toen zeiden zij: Laten wij opstaan en bouwen; en zij sterkten hun handen ten goede.", "19": "Toen Sanballat, de Horoniet, en Tobia, de Ammonitische dienaar, en Gesem, de Arabier, dit hoorden, bespotten zij ons en verachtten ons; en zij zeiden: Wat is dit voor iets, dat u doet? Wilt u tegen de koning in opstand komen?", "20": "Toen gaf ik hun antwoord, en zei tegen hen: De God van de hemel, Hij zal het ons doen gelukken, en wij, Zijn dienaren, zullen opstaan en bouwen; maar u hebt geen deel, geen recht, en geen aandenken in Jeruzalem."}, "SV": {"1": "Toen geschiedde het in de maand Nisan, in het twintigste jaar van den koning Arthahsasta, *als* *er* wijn voor zijn aangezicht was, dat ik den wijn opnam, en gaf *hem* den koning; nu was ik nooit treurig geweest voor zijn aangezicht.", "2": "Zo zeide de koning tot mij: Waarom is uw aangezicht treurig, zo gij toch niet krank zijt? Dit is niet dan treurigheid des harten. Toen vreesde ik gans zeer.", "3": "En ik zeide tot de koning: De koning leve in eeuwigheid! Hoe zou mijn aangezicht niet treurig zijn, daar de stad, de plaats der begrafenissen mijner vaderen, woest is, en haar poorten met vuur verteerd zijn?", "4": "En de koning zeide tot mij: Wat verzoekt gij nu? Toen bad ik tot God van den hemel.", "5": "En ik zeide tot den koning: Zo het den koning goeddunkt, en zo uw knecht voor uw aangezicht aangenaam is, dat gij mij zendt naar Juda, naar de stad der begrafenissen mijner vaderen, dat ik ze bouwe.", "6": "Toen zeide de koning tot mij, daar de koningin nevens hem zat: Hoe lang zal uw reis wezen, en wanneer zult gij wederkomen? En het behaagde den koning, dat hij mij zond, als ik hem zekeren tijd gesteld had.", "7": "Voorts zeide ik tot den koning: Zo het den koning goeddunkt, dat men mij brieven geve aan de landvoogden aan gene zijde der rivier, dat zij mij overgeleiden, totdat ik in Juda zal gekomen zijn;", "8": "Ook een brief aan Asaf, den bewaarder van den lusthof, denwelken de koning heeft, dat hij mij hout geve om te zolderen de poorten van het paleis, dat aan het huis is, en tot den stadsmuur, en tot het huis, waar ik intrekken zal. En de koning gaf ze mij, naar de goede hand mijns Gods over mij.", "9": "Toen kwam ik tot de landvoogden aan gene zijde der rivier, en gaf hun de brieven des konings. En de koning had oversten des heirs en ruiteren met mij gezonden.", "10": "Toen nu Sanballat, de Horoniet, en Tobia, de Ammonietische knecht *dat* hoorden, mishaagde het hun met groot mishagen, dat er een mens gekomen was, om wat goeds te zoeken voor de kinderen Israëls.", "11": "En ik kwam te Jeruzalem, en was daar drie dagen.", "12": "Daarna maakte ik mij des nachts op, ik en weinig mannen met mij, en ik gaf geen mens te kennen, wat mijn God in mijn hart gegeven had, om aan Jeruzalem te doen; en er was geen dier met mij, dan het dier, waarop ik reed.", "13": "En ik trok uit bij nacht door de Dalpoort, en voorbij de Drakenfontein, en naar de Mistpoort, en ik brak aan de muren van Jeruzalem, dewelke verscheurd waren, en haar poorten met vuur verteerd.", "14": "En ik ging voort naar de Fonteinpoort, en naar des konings vijver; doch daar was geen plaats voor het dier, om onder mij voort te gaan.", "15": "Toen ging ik op, des nachts, door de beek, en ik brak aan den muur; en ik keerde weder, en kwam in door de Dalpoort; alzo keerde ik wederom.", "16": "En de overheden wisten niet, waar ik heengegaan was, en wat ik deed; want ik had tot nog toe den Joden, en den priesteren, en den edelen, en overheden, en den anderen, die het werk deden, niets te kennen gegeven.", "17": "Toen zeide ik tot hen: Gijlieden ziet de ellende, waarin wij zijn, dat Jeruzalem woest is, en haar poorten met vuur verbrand zijn; komt, en laat ons Jeruzalems muur opbouwen; opdat wij niet meer een versmaadheid zijn.", "18": "En ik gaf hun te kennen de hand mijns Gods, Die goed over mij geweest was, als ook de woorden des konings, die hij tot mij gesproken had. Toen zeiden zij: Laat ons op zijn, dat wij bouwen; en zij sterkten hun handen ten goede.", "19": "Als nu Sanballat, de Horoniet, en Tobia, de Ammonietische knecht, en Gesem, de Arabiër, dit hoorden, zo bespotten zij ons, en verachtten ons; en zij zeiden: Wat is dit voor een ding, dat gijlieden doet? Wilt gijlieden tegen den koning rebelleren?", "20": "Toen gaf ik hun tot antwoord, en zeide tot hen: God van den hemel, Die zal het ons doen gelukken, en wij, Zijn knechten, zullen ons opmaken en bouwen; maar gijlieden hebt geen deel, noch gerechtigheid, noch gedachtenis in Jeruzalem."}, "KJV": {"1": "And it came to pass in the month Nisan, in the twentieth year of Artaxerxes the king, *that* wine *was* before him: and I took up the wine, and gave *it* unto the king. Now I had not been *beforetime* sad in his presence.", "2": "Wherefore the king said unto me, Why *is* thy countenance sad, seeing thou *art* not sick? this *is* nothing *else* but sorrow of heart. Then I was very sore afraid,", "3": "And said unto the king, Let the king live for ever: why should not my countenance be sad, when the city, the place of my fathers' sepulchres, *lieth* waste, and the gates thereof are consumed with fire?", "4": "Then the king said unto me, For what dost thou make request? So I prayed to the God of heaven.", "5": "And I said unto the king, If it please the king, and if thy servant have found favour in thy sight, that thou wouldest send me unto Judah, unto the city of my fathers' sepulchres, that I may build", "6": "And the king said unto me, (the queen also sitting by him,) For how long shall thy journey be? and when wilt thou return? So it pleased the king to send me; and I set him a time.", "7": "Moreover I said unto the king, If it please the king, let letters be given me to the governors beyond the river, that they may convey me over till I come into Judah;", "8": "And a letter unto Asaph the keeper of the king's forest, that he may give me timber to make beams for the gates of the palace which *appertained* to the house, and for the wall of the city, and for the house that I shall enter into. And the king granted me, according to the good hand of my God", "9": "Then I came to the governors beyond the river, and gave them the king's letters. Now the king had sent captains of the army and horsemen", "10": "When Sanballat the Horonite, and Tobiah the servant, the Ammonite, heard *of it*, it grieved them exceedingly that there was come a man to seek the welfare of the children of Israel.", "11": "So I came to Jerusalem, and was there three days.", "12": "And I arose in the night, I and some few men with me; neither told I *any* man what my God had put in my heart to do at Jerusalem: neither *was there any* beast with me, save the beast that I rode upon.", "13": "And I went out by night by the gate of the valley, even before the dragon well, and to the dung port, and viewed the walls of Jerusalem, which were broken down, and the gates thereof were consumed with fire.", "14": "Then I went on to the gate of the fountain, and to the king's pool: but *there was* no place for the beast *that was* under me to pass.", "15": "Then went I up in the night by the brook, and viewed the wall, and turned back, and entered by the gate of the valley, and *so* returned.", "16": "And the rulers knew not whither I went, or what I did; neither had I as yet told *it* to the Jews, nor to the priests, nor to the nobles, nor to the rulers, nor to the rest that did the work.", "17": "Then said I unto them, Ye see the distress that we *are* in, how Jerusalem *lieth* waste, and the gates thereof are burned with fire: come, and let us build up the wall of Jerusalem, that we be no more a reproach.", "18": "Then I told them of the hand of my God which was good upon me; as also the king's words that he had spoken unto me. And they said, Let us rise up and build. So they strengthened their hands for *this* good", "19": "But when Sanballat the Horonite, and Tobiah the servant, the Ammonite, and Geshem the Arabian, heard *it*, they laughed us to scorn, and despised us, and said, What *is* this thing that ye do? will ye rebel against the king?", "20": "Then answered I them, and said unto them, The God of heaven, he will prosper us; therefore we his servants will arise and build: but ye have no portion, nor right, nor memorial, in Jerusalem."}}, "tsk": {"1": [{"kopje": "Nisan", "refs": ["Est 3:7"]}, {"kopje": "het twintigste", "refs": ["Neh 1:1", "Ezra 7:1", "Ezra 7:7"]}, {"kopje": "ik de wijn opnam", "refs": ["Neh 1:11", "Gen 40:11", "Gen 40:21"]}], "2": [{"kopje": "Waarom is uw gezicht", "refs": ["Gen 40:7"]}, {"kopje": "treurigheid", "refs": ["Spr 15:13"]}], "3": [{"kopje": "De koning leve", "refs": ["1 Kon 1:31", "Dan 2:4", "Dan 3:9", "Dan 5:10", "Dan 6:7", "Dan 6:22"]}, {"kopje": "de stad", "refs": ["Neh 1:3", "Ps 102:15", "Ps 137:6", "Klaagl 2:9"]}, {"kopje": "de plaats", "refs": ["2 Kron 21:20", "2 Kron 28:27", "2 Kron 32:33"]}], "4": [{"kopje": "Wat verzoekt u", "refs": ["1 Kon 3:5", "Est 5:3", "Est 5:6", "Est 7:2", "Mark 10:51"]}, {"kopje": "Toen bad ik", "refs": ["Neh 1:4", "Neh 1:11", "2 Sam 15:31", "Spr 3:6", "Fil 4:6"]}], "5": [{"kopje": "Als het de koning goeddunkt", "ref ./../1-johannes/4/#v16", "ref": "1 Joh 4:16", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ezra 7:27": "Geloofd zij de HEERE, de God van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Neh 1:4-11": "En het gebeurde, toen ik deze woorden hoorde, dat ik neerzat, en huilde, en rouw bedreef, enkele dagen; en ik vastte en bad voor het aangezicht van de God van de hemel. En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden. Laat toch Uw oor opmerkzaam, en Uw ogen open zijn, om te horen naar het gebed van Uw dienaar, dat ik vandaag voor Uw aangezicht bid, dag en nacht, voor de kinderen van Israël, Uw dienaren; en ik doe belijdenis over de zonden van de kinderen van Israël, die wij tegen U gezondigd hebben; ook ik en het huis van mijn vader, wij hebben gezondigd.", "Micha 7:9": "Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "2 Kon 20:20": "Het overige nu van de geschiedenis van Hizkia, en al zijn macht, en hoe hij de vijver en de watergang gemaakt heeft, en water in de stad gebracht heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "1 Kron 19:13": "Wees sterk, en laten we sterk zijn voor ons volk, en voor de steden van onze God; de HEERE doe wat goed is in Zijn ogen.", "Neh 13:1": "Op die dag werd er gelezen in het boek van Mozes, voor de oren van het volk; en daarin werd geschreven gevonden, dat de Ammonieten en Moabieten niet zouden komen in de gemeente van God, tot in eeuwigheid;", "Ps 43:5": "Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke Verlossing van mijn aangezicht, en mijn God.", "Ps 62:6-8": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "Neh 12:31": "Toen liet ik de vorsten van Juda opgaan op de muur; en ik stelde twee grote dankkoren en omgangen aan, een aan de rechterhand op de muur, naar de Mestpoort toe.", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Ps 39:8": "En nu, wat verwacht ik, Heere? Mijn hoop is op U.", "2 Kron 33:14": "En hierna bouwde hij de buitenmuur bij de stad van David, aan de westzijde van Gihon in het dal, tot aan de ingang van de Vispoort, en omsingelde Ofel, en verhoogde die zeer; hij legde ook legeroversten in alle vaste steden in Juda.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Ps 138:7": "Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.", "Ps 17:6": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden.", "Ezra 5:5": "Doch het oog van hun God was over de oudsten van de Joden, zodat men hen niet kon tegenhouden, totdat de zaak bij Darius kwam, en zij daarna daarover een brief terugbrachten.", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Ezra 4:8": "Rehum, de kanselier, en Simsai, de schrijver, schreven een brief tegen Jeruzalem aan koning Arthahsasta, op deze manier:", "Richt 6:27": "Toen nam Gideon tien mannen uit zijn knechten, en deed zoals de HEERE tegen hem gesproken had. Doch het gebeurde, omdat hij bang was voor zijn vaders huis en de mannen van die stad om het overdag te doen, dat hij het 's nachts deed.", "Klaagl 2:9": "Teth. Haar poorten zijn in de aarde verzonken; Hij heeft haar grendels verdorven en gebroken; haar koning en haar vorsten zijn onder de heidenen; er is geen wet; haar profeten vinden ook geen gezicht van de HEERE.", "Hand 24:15": "Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.", "Lev 24:7": "En op elke rij zult u zuivere wierook leggen, die het brood tot een gedenkoffer zal zijn; het is een vuuroffer voor de HEERE.", "1 Kon 22:38": "Toen men de wagen in de vijver van Samaria spoelde, likten de honden zijn bloed, waar de hoeren zich wasten, naar het woord van de HEERE, dat Hij gesproken had.", "2 Sam 2:7": "En nu, laat uw handen sterk zijn, en wees dapper, omdat uw heer Saul gestorven is; en ook hebben die van het huis van Juda mij tot koning over zich gezalfd.", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Hand 27:25": "Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.", "Ps 142:6": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden.", "Ps 118:7": "De HEERE is bij mij onder degenen die mij helpen; daarom zal ik mijn lust zien aan degenen die mij haten.", "Gen 40:7": "Toen vroeg hij de hovelingen van Farao, die bij hem in hechtenis waren in het huis van zijn heer: Waarom kijkt u vandaag zo somber?", "Jer 48:34": "Vanwege Hesbons geroep tot Eleale toe, tot Jahaz toe, hebben zij hun stem verheven, van Zoar tot aan Horonaïm, die driejarige vaars; want ook de wateren van Nimrim zullen tot verwoesting worden.", "1 Kron 11:10": "Dezen nu waren de hoofden van de helden die David had, die zich dapper bij hem gedragen hebben in zijn koninkrijk bij heel Israël, om hem koning te maken, naar het woord van de HEERE over Israël.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Job 14:15": "Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.", "Amos 5:13": "Daarom zal de verstandige in die tijd zwijgen, want het zal een slechte tijd zijn.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Neh 4:13-18": "Daarom stelde ik het volk op in de lagere plaatsen achter de muur, en op de hoogten, naar hun geslachten, met hun zwaarden, hun speren en hun bogen. En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen. Daarna gebeurde het, toen onze vijanden hoorden dat het ons bekend was geworden, en dat God hun plan had verijdeld, dat wij allen weer terugkeerden naar de muur, ieder naar zijn werk.", "Ps 18:2-4": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Ezech 22:5": "Wie dichtbij en veraf van u zijn, zullen u bespotten, u onreine van naam en vol van onrust!", "Ps 16:5": "De HEERE is het deel van mijn erfenis en van mijn beker; U onderhoudt mijn lot.", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "Neh 3:7": "En aan hun hand verbeterden Melatja, de Gibeoniet, en Jadon, de Meronothiet, de mannen van Gibeon en van Mizpa; tot aan de zetel van de landvoogd aan deze zijde van de rivier.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Ps 89:27": "Hij zal Mij noemen: Gij zijt mijn Vader! mijn God, en de Rotssteen van mijn heil!", "Ps 18:30": "Want met U loop ik door een bende, en met mijn God spring ik over een muur.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "Hand 8:21": "U hebt geen deel en geen aandeel in dit woord, want uw hart is niet recht voor God.", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Ps 89:52": "Waarmee, o HEERE! Uw vijanden smaden, waarmee zij de voetstappen van Uw gezalfde smaden.", "Gen 40:21": "En hij liet de leider van de schenkers terugkeren tot zijn schenkambt, zodat hij de beker in Farao's hand gaf.", "Dan 5:10": "Vanwege deze woorden van de koning en zijn leiders, ging de koningin het huis van de maaltijd binnen. De koningin sprak en zei: O koning, leef in eeuwigheid! Laat uw gedachten u niet verschrikken, en laat uw gezichtskleur niet veranderen.", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Hand 5:24": "Toen nu de hogepriester en de hoofdman van de tempel, en de overpriesters deze woorden hoorden, werden zij vol twijfel over hen, wat hier toch uit zou worden.", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Neh 1:3": "En zij zeiden tegen mij: De overgeblevenen, die van de gevangenschap daar in het gebied zijn overgebleven, zijn in grote ellende en in smaad; en de muur van Jeruzalem is afgebroken, en haar poorten zijn met vuur verbrand.", "Dan 1:15": "Aan het einde van de tien dagen nu zag men dat hun gedaanten er beter uitzagen, en zij vetter waren van vlees dan alle jongemannen die het voedsel van de koning aten.", "Job 19:25-27": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan; En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen; Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "Ezech 22:4": "Door uw bloed dat u vergoten hebt, bent u schuldig geworden, en met uw drekgoden die u gemaakt hebt, hebt u zich verontreinigd, en hebt u uw dagen doen naderen en bent u tot uw jaren gekomen; daarom heb Ik u aan de heidenvolken overgegeven tot een smaad, en aan alle landen tot een spot.", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Ezech 40:5": "En zie, er was een muur buiten om het huis heen, rondom, en in de hand van de man was een meetriet van zes ellen, elke el een el en een handbreed; en hij mat de breedte van het gebouw: één riet, en de hoogte: één riet.", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "Jes 15:5": "Mijn hart schreeuwt over Moab, zijn vluchtelingen gaan naar Zoar toe, de driejarige vaars. Want hij gaat op met geween naar de bergpas van Luhith, want op de weg naar Horonaim verwekken zij een jammergeschrei over de verwoesting.", "Jes 35:3": "Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Jes 58:12": "En zij die uit u voortkomen, zullen de oude verwoeste plaatsen bouwen; de fundamenten, van geslacht tot geslacht verwoest, zult u oprichten; en u zult genoemd worden: Die de bressen dichtmuurt, die de paden weer opmaakt, om te bewonen.", "Num 10:10": "Ook op de dag van uw vrolijkheid, en op uw vastgestelde hoogtijden, en aan de begin van uw maanden, zult u ook met de trompetten blazen over uw brandoffers en over uw dankoffers; en zij zullen u ter gedachtenis zijn voor het aangezicht van uw God; Ik ben de HEERE, uw God!", "Hebr 11:14": "Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken.", "Jer 5:10": "Beklim haar muren, en verwoest ze (maar maak er geen einde aan); haal haar tinnen weg, want zij zijn niet van de HEERE.", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "Spr 30:22": "Om een knecht, als hij regeert; en een dwaas, als hij verzadigd is met brood;", "Klaagl 3:24-32": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen. Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt. Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Ps 44:15": "U stelt ons tot een spreekwoord onder de heidenvolken, tot een hoofdschudden onder de volken.", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Richt 5:1-31": "Verder zong Debora, en Barak, de zoon van Abinoam, op dezelfde dag, en zei: Looft de HEERE, om het wreken van de wraken in Israël, om dat het volk zich gewillig heeft aangeboden. Hoor, u koningen, neem het ter ore, u vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, de God van Israël, psalmzingen.", "Gen 32:28": "Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.", "2 Kron 32:4": "Want er werd veel volk samengebracht, dat alle bronnen dichtte, alsook de beek die door het midden van het land stroomde, en zij zeiden: Waarom zouden de koningen van Assyrië komen en veel water vinden?", "Tit 3:3": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "2 Kron 32:5": "Zo versterkte hij zich, en bouwde de hele muur weer op waar hij gebroken was, en trok hem op tot aan de torens, met een andere muur daarbuiten, en hij versterkte Millo in de stad van David; en hij maakte wapens en schilden in menigte.", "Ps 140:8": "HEERE, Heere, sterkte van mijn heil! U hebt mijn hoofd bedekt op de dag van de wapening.", "Ezra 8:36": "Daarna gaven zij de wetten van de koning aan de stadhouders van de koning en landvoogden aan deze kant van de rivier; en zij bevorderden het volk en het huis van God.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Ps 6:10": "De HEERE heeft mijn smeking gehoord; de HEERE zal mijn gebed aannemen.", "Gen 24:7": "De HEERE, de God van de hemel, Die mij uit het huis van mijn vader en uit het land van mijn familie genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft en zei: Aan uw nageslacht zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, zodat u voor mijn zoon van daar een vrouw neemt.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Neh 7:2": "En ik gaf bevel aan mijn broer Hanani, en aan Hananja, de leider van de burcht in Jeruzalem, want hij was een man van trouw, en godvrezend boven velen.", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "Ps 121:2": "Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft.", "Openb 17:17": "Want God heeft hun in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Ps 72:8": "En hij zal heersen van de zee tot aan de zee, en van de rivier tot aan de einden van de aarde.", "Dan 5:6": "Toen veranderde de gezichtskleur van de koning, en zijn gedachten verschrikten hem; en de banden van zijn heupen werden los, en zijn knieën stootten tegen elkaar aan.", "Ps 9:4": "Omdat mijn vijanden achterwaarts gekeerd, gevallen en vergaan zijn van Uw aangezicht.", "Matt 27:2": "En nadat zij Hem gebonden hadden, leidden zij Hem weg en gaven Hem over aan Pontius Pilatus, de stadhouder.", "Ps 118:17": "Ik zal niet sterven, maar leven; en ik zal de werken van de HEERE vertellen.", "Ps 118:10": "Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Ps 60:11": "Wie zal mij brengen in een vaste stad? Wie zal mij leiden tot in Edom?", "Hand 19:27": "En wij lopen niet alleen gevaar dat dit onze zaak in verachting komt, maar ook dat de tempel van de grote godin Diana als niets geacht zal worden, en dat ook haar majesteit ten onder zal gaan, zij die geheel Azië en de gehele wereld verering bewijst.", "2 Kron 26:9": "Daartoe bouwde Uzzia torens te Jeruzalem, bij de Hoekpoort en bij de Dalpoort, en bij de hoeken, en hij versterkte ze.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Job 30:1": "Maar nu lachen zij die jonger zijn dan ik, om mij, van wie ik hun vaderen versmaad zou hebben, om ze bij de honden van mijn kudde te zetten.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Ps 35:27": "Laat hen vrolijk zingen en verblijd zijn, die lust hebben tot mijn gerechtigheid; en laat hen voortdurend zeggen: Groot gemaakt zij de HEERE, Die lust heeft tot de vrede van Zijn knecht!", "Ps 33:20-22": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild. Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen. Uw goedertierenheid, HEERE! zij over ons, zoals wij op U hopen.", "Ezech 27:35": "Alle inwoners van de eilanden zijn over u ontzet, en hun koningen staan de haren te berge, zij zijn verbijsterd van gezicht.", "Ps 122:6-9": "Bid om de vrede van Jeruzalem; het moet goed gaan met hen die u liefhebben. Vrede zij binnen uw vesting, welvaart in uw paleizen. Om mijn broeders en mijn vrienden zal ik nu zeggen: Vrede zij in u!", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Ps 71:21": "Gij zult mijn grootheid vermeerderen, en mij rondom vertroosten.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Num 22:3": "Vreesde Moab zeer voor het volk, want het was talrijk; en Moab was beangstigd voor de kinderen van Israël.", "Ps 122:6": "Bid om de vrede van Jeruzalem; het moet goed gaan met hen die u liefhebben.", "Ef 6:10": "Vervolgens, mijn broeders, word krachtig in de Heere, en in de sterkte van Zijn macht.", "Dan 3:9": "Zij antwoordden en zeiden tegen de koning Nebukadnezar: O koning, leef in eeuwigheid!", "Spr 3:4": "En vind gunst en goed verstand, in de ogen van God en van de mensen.", "Ps 89:51": "Gedenk, Heere! aan de smaad van Uw knechten, die ik in mijn boezem draag, van alle grote volken.", "Ex 13:4": "Vandaag gaat u uit, in de maand Abib.", "Est 5:6": "zei de koning tegen Esther bij de maaltijd van de wijn: Wat is uw bede? En zij zal u gegeven worden; en wat is uw verzoek? Het zal gebeuren, ook tot de helft van het koninkrijk.", "Jer 48:5": "Want bij de opgang naar Luhith zal geween bij geween opgaan, want bij de afgang van Horonaïm hebben de tegenstanders van Moab een jammergeschreeuw gehoord.", "Hab 3:17-19": "Alhoewel de vijgenboom niet bloeien zal, en er geen vrucht aan de wijnstok zal zijn, dat het werk van de olijfboom liegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn; Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil. De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als die van de hinden, en Hij zal mij doen treden op mijn hoogten. Voor de koorleider, op mijn Neginoth.", "Neh 3:1-32": "En Eljasib, de hogepriester, maakte zich op met zijn broeders, de priesters, en zij bouwden de Schaapspoort; zij heiligden ze, en richtten haar deuren op; ja, zij heiligden ze tot aan de toren Mea, tot aan de toren Hananeel. En aan zijn hand bouwden de mannen van Jericho; ook bouwde aan zijn hand Zakkur, de zoon van Imri. De Vispoort nu bouwden de kinderen van Senaä; zij zolderde die, en richtten haar deuren op, met haar sloten en haar grendelen.", "Ps 55:17": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.", "2 Kron 28:27": "En Achaz ontsliep met zijn vaderen, en zij begroeven hem in de stad, in Jeruzalem; maar zij brachten hem niet in de graven van de koningen van Israël; en zijn zoon Jehizkia werd koning in zijn plaats.", "Est 1:19": "Als het de koning goeddunkt, laat er dan een koninklijk bevel van hem uitgaan, dat wordt opgeschreven in de wetten van de Perzen en de Meden, en dat niet overtreden mag worden: dat Vasthi niet meer voor het aangezicht van de koning Ahasveros mag komen, en dat de koning haar koningschap geeft aan haar naaste, die beter is dan zij.", "Joz 10:9": "Zo kwam Jozua snel tot hen; de hele nacht door was hij van Gilgal opgetrokken.", "Neh 2:1-20": "Toen gebeurde het in de maand Nisan, in het twintigste jaar van koning Arthahsasta, als er wijn voor hem was, dat ik de wijn opnam en aan de koning gaf; nu was ik nooit eerder treurig geweest voor hem. Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd, en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn?", "Ps 141:8": "Doch op U zijn mijn ogen, HEERE, Heere; op U vertrouw ik, ontbloot mijn ziel niet.", "Ezech 5:14": "Daarbij zal Ik u tot woestheid en tot smaad zetten onder de heidenvolken die rondom u zijn, voor de ogen van ieder die voorbijgaat.", "Ps 143:8": "Doe mij Uw goedertierenheid in de morgenstond horen, want ik vertrouw op U; maak mij de weg bekend die ik moet gaan, want ik hef mijn ziel tot U op.", "Ps 27:10": "Want mijn vader en mijn moeder hebben mij verlaten, maar de HEERE zal mij aannemen.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "Pred 10:7": "Ik heb knechten te paard gezien, en vorsten die als knechten op de aarde gingen.", "Ps 140:7": "Ik heb tegen de HEERE gezegd: U bent mijn God; neem ter ore, HEERE, de stem van mijn smekingen.", "Ps 94:22": "Doch de HEERE is mij geweest tot een Hoog Vertrek, en mijn God tot een Steenrots van mijn toevlucht.", "Jer 20:8": "Want zo vaak ik spreek, roep ik uit, roep ik geweld en verwoesting; omdat het woord van de HEERE mij de hele dag tot smaad en spot is.", "Ps 31:15": "Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God.", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Ps 18:29": "Want U doet mijn lamp lichten; de HEERE, mijn God, doet mijn duisternis opklaren.", "Ps 119:57": "Cheth. De HEERE is mijn deel, ik heb gezegd, dat ik Uw woorden zal bewaren.", "Neh 6:1": "Verder gebeurde het, toen Sanballat, Tobia, Gesem de Arabier en onze andere vijanden hoorden dat ik de muur gebouwd had en dat er geen scheur meer in over was — hoewel ik tot die tijd toe de deuren nog niet in de poorten had opgezet —", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "Ps 86:2": "Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt.", "Ps 108:11-14": "Wie zal mij voeren in een vaste stad? Wie zal mij leiden tot in Edom? Zult U het niet zijn, o God! Die ons verstoten had, en Die niet uittrok, o God! Met onze legers? Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Gen 40:11": "En Farao's beker was in mijn hand; en ik nam die druiven, en perste ze uit in Farao's beker, en ik gaf de beker in Farao's hand.", "Ps 119:114": "U bent mijn Schuilplaats en mijn Schild; op Uw Woord heb ik gehoopt.", "Ps 44:14": "U stelt ons tot smaad voor onze naburen, tot spot en schimp voor hen die rondom ons zijn.", "Ps 18:19": "Zij hadden mij bejegend ten dage van mijn ongeval; maar de HEERE was mij tot een Steunsel.", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "Ps 25:2": "Beth. Mijn God! op U vertrouw ik; laat mij niet beschaamd worden; laat mijn vijanden niet van vreugde opspringen over mij.", "Hand 24:1": "En vijf dagen daarna kwam de hogepriester Ananias af met de oudsten, en een zekere voorspraak, genaamd Tertullus, die zich meldde bij de stadhouder tegen Paulus.", "Ps 31:16": "Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers.", "2 Kor 4:8": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig;", "Ps 143:9": "Red mij, HEERE, van mijn vijanden; bij U schuil ik.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Ps 61:8": "Hij zal eeuwig voor Gods aangezicht zitten; bereid goedertierenheid en waarheid, dat zij hem behoeden.", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "Dan 2:4": "Toen spraken de Chaldeeën tot de koning in het Syrisch: O koning, leef in eeuwigheid! Vertel uw dienaren de droom, dan zullen wij de uitleg bekendmaken.", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "1 Kon 3:5": "Te Gibeon verscheen de HEERE aan Salomo in een droom 's nachts, en God zei: Vraag wat Ik u geven zal.", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Ps 77:11-13": "Daarna zei ik: Dit krenkt mij; maar de rechterhand van de Allerhoogste verandert. Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken; En ik zal al Uw werken overdenken, en van Uw daden spreken.", "Ps 73:28": "Maar wat mij aangaat, het is mij goed om dicht bij God te zijn; ik stel mijn vertrouwen op de Heere HEERE, om al Uw werken te vertellen.", "Ezra 7:28": "En heeft mij goedertierenheid bewezen, voor het aangezicht van de koning en zijn raadsheren, en van alle machtige vorsten van de koning! Zo heb ik mij gesterkt, naar de hand van de HEERE, mijn God, over mij, en de hoofden uit Israël vergaderd, om met mij op te trekken.", "Ps 56:10": "Dan zullen mijn vijanden achterwaarts keren, ten dage dat ik roepen zal; dit weet ik, dat God met mij is.", "Num 14:9": "Wees alleen niet opstandig tegen de HEERE! En vrees het volk van dit land niet; want zij zijn ons brood! Hun bescherming is van hen geweken, en de HEERE is met ons; vrees hen niet!", "Job 5:9": "Die grote dingen doet, die men niet doorzoeken kan; wonderen, die men niet tellen kan;", "Pred 7:18": "Het is goed dat u daaraan vasthoudt, en trek ook uw hand van dit niet af; want wie God vreest, die ontgaat dat allemaal.", "2 Kor 8:16": "Doch God zij dank, Die dezelfde naarstigheid voor u in het hart van Titus gegeven heeft;", "Hebr 11:16-39": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt. Door het geloof heeft Abraham, toen hij beproefd werd, Izak geofferd, en hij die de beloften ontvangen had, heeft zijn enige zoon geofferd, (tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Pred 11:1": "Werp uw brood uit op het water, want u zult het vinden na veel dagen.", "2 Tim 3:3": "zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede,", "Ps 57:2-4": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan. Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien. Hij zal vanuit de hemel zenden, en mij verlossen, en te schande maken hem die mij zoekt te verslinden. Sela. God zal Zijn goedertierenheid en Zijn waarheid zenden.", "Ps 91:9": "Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt u gesteld tot uw Vertrek;", "Ps 32:7": "U bent mij een schuilplaats; U behoedt mij voor benauwdheid; U omringt mij met vrolijke gezangen van bevrijding. Sela.", "Ps 90:1": "Een gebed van Mozes, de man van God. Heere! U bent ons geweest een Toevlucht van geslacht tot geslacht.", "Neh 6:2": "dat Sanballat en Gesem naar mij stuurden om te zeggen: Kom, laten wij samen bijeenkomen in de dorpen, in het dal Ono. Maar zij waren van plan mij kwaad te doen.", "Jes 65:24": "En het zal gebeuren: eer zij roepen, zal Ik antwoorden; terwijl zij nog spreken, zal Ik horen.", "Hand 19:26": "en u ziet en hoort, dat deze Paulus veel volk, niet alleen van Efeze, maar ook bijna van heel Azië, overreed en afgekeerd heeft, en zegt dat het geen goden zijn die met handen gemaakt worden.", "Jes 7:3": "En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;", "Micha 7:7-9": "Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen. Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn. Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "Ps 59:11": "De God van mijn goedertierenheid zal mij voor zijn; God zal mij op mijn verspieders doen zien.", "Jes 22:9-11": "En u zult de scheuren van de stad van David bekijken, omdat ze veel zijn; en u zult het water van de onderste vijver verzamelen. U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken. Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "Ps 142:4": "Toen mijn geest in mij overweldigd was, kende U mijn pad. Zij hebben in het geheim een strik voor mij verborgen op de weg die ik zou gaan.", "Gen 24:40": "En hij zei tegen mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, zodat u voor mijn zoon een vrouw neemt, uit mijn geslacht en uit het huis van mijn vader.", "Est 7:3": "Toen antwoordde de koningin Esther, en zei: Als ik, o koning, genade in uw ogen gevonden heb, en als het de koning goeddunkt, geve men mij mijn leven, om mijn bede, en mijn volk, om mijn verzoek.", "Dan 1:9": "En God gaf Daniël genade en barmhartigheid bij de leider van de kamerlingen.", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Micha 7:16": "De heidenen zullen het zien, en beschaamd zijn, vanwege al hun macht; zij zullen de hand op de mond leggen; hun oren zullen doof worden.", "Zach 6:14": "En die kronen zullen zijn voor Chelem, en voor Tobia, en voor Jedaja, en voor Chen, de zoon van Zefanja, tot een gedachtenis in de tempel van de HEERE.", "2 Kon 18:17": "Evenwel zond de koning van Assyrië Tartan, en Rabsaris, en Rabsake, van Lachis naar de koning Hizkia, met een zwaar leger naar Jeruzalem; en zij trokken op, en kwamen naar Jeruzalem. En toen zij optrokken en gekomen waren, bleven zij staan bij de watergang van de opperste vijver, die bij de hoge weg van het veld der vollers is.", "Joh 19:12": "Van toen af zocht Pilatus Hem los te laten; maar de Joden riepen: Als u Deze loslaat, bent u geen vriend van de keizer; ieder die zichzelf koning maakt, weerspreekt de keizer.", "Ps 92:11": "Maar U zult mijn hoorn verhogen, zoals de hoorn van een eenhoorn; ik ben met verse olie overgoten.", "1 Sam 11:2": "Maar Nahas, de Ammoniet, zei tegen hen: Op deze voorwaarde zal ik een verbond met u sluiten, dat ik bij u allen het rechteroog uitsteek, en dat ik deze schande op heel Israël leg.", "Luk 1:38": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg.", "Jes 35:4": "Zegt tegen de onbedachtzamen van hart: Wees sterk, en vrees niet; zie, uw God zal ter wrake komen met de vergelding van God. Hij zal komen en u verlossen.", "Ps 44:9": "In God roemen wij de hele dag, en Uw Naam zullen wij loven tot in eeuwigheid. Sela.", "Neh 1:2": "dat Hanani kwam, een van mijn broers, hij en enkele mannen uit Juda, en ik vroeg hen naar de Joden die ontkomen waren, die overgebleven waren van de gevangenschap, en naar Jeruzalem.", "Ps 59:18": "Van U, o mijn Sterkte, zal ik psalmzingen; want God is mijn Hoog Vertrek, de God van mijn goedertierenheid.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Neh 3:15": "En de Fonteinpoort verbeterde Sallum, de zoon van Kol-Hoze, leider van het deel van Mizpa; hij bouwde ze, en overdekte ze, en richtte haar deuren op, met haar sloten en haar grendelen; daarbij de muur van de vijver Schelah bij de tuin van de koning, en tot aan de trappen, die naar beneden gaan vanaf Davids stad.", "Neh 2:1-8": "Toen gebeurde het in de maand Nisan, in het twintigste jaar van koning Arthahsasta, als er wijn voor hem was, dat ik de wijn opnam en aan de koning gaf; nu was ik nooit eerder treurig geweest voor hem. Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd, en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn?", "Ps 7:11": "Mijn schild is bij God, Die de oprechten van hart behoudt.", "Ps 27:6": "Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "Ps 22:6": "Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Ps 25:1": "Een psalm van David. Aleph. Tot U, o HEERE! hef ik mijn ziel op.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Neh 6:1-6": "Verder gebeurde het, toen Sanballat, Tobia, Gesem de Arabier en onze andere vijanden hoorden dat ik de muur gebouwd had en dat er geen scheur meer in over was — hoewel ik tot die tijd toe de deuren nog niet in de poorten had opgezet — dat Sanballat en Gesem naar mij stuurden om te zeggen: Kom, laten wij samen bijeenkomen in de dorpen, in het dal Ono. Maar zij waren van plan mij kwaad te doen. Ik echter stuurde boden naar hen om te zeggen: Ik ben bezig met een groot werk, zodat ik niet kan afkomen; waarom zou dit werk stilvallen doordat ik het zou laten liggen en naar u af zou komen?", "Ps 56:9": "U hebt mijn omzwerven geteld; leg mijn tranen in Uw fles; staan zij niet in Uw register?", "Neh 13:28": "Ook was er een van de kinderen van Jojada, de zoon van Eljasib, de hogepriester, schoonzoon geworden van Sanballat, de Horoniet; daarom joeg ik hem van mij weg.", "Job 4:7-21": "Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd? Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook. Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Hand 4:2": "Zeer ontevreden, omdat zij het volk leerden en in Jezus de opstanding uit de doden verkondigden.", "Num 14:8": "Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.", "Hand 16:34": "En hij bracht hen in zijn huis, en zette hun de tafel voor, en verheugde zich dat hij met heel zijn huis gelovig geworden was in God.", "Neh 2:12-17": "Daarna maakte ik mij 's nachts op, ik en enkele weinig mannen met mij, en ik maakte aan niemand bekend wat mijn God in mijn hart had gegeven om in Jeruzalem te doen; en er was geen dier met mij, dan het dier waarop ik reed. En ik trok 's nachts uit door de Dalpoort, en voorbij de Drakenfontein, en naar de Mestpoort, en ik bekeek de muren van Jeruzalem, die waren afgebroken, en haar poorten die met vuur verteerd waren. En ik ging verder naar de Fonteinpoort, en naar de vijver van de koning; maar daar was geen plaats voor het dier om onder mij door te gaan.", "Ps 63:8": "Want U bent mij een hulp geweest; en in de schaduw van Uw vleugels zal ik vrolijk zingen.", "Ps 71:3": "Wees mij tot een Rotssteen, om daarin te wonen, om voortdurend daarin te gaan; Gij hebt bevel gegeven, om mij te verlossen, want Gij zijt mijn Steenrots en mijn Burg.", "Neh 3:16": "Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden.", "2 Sam 22:2-5": "Hij zei dan: De HEERE is mij mijn Steenrots, en mijn Burg, en mijn Uithelper. God is mijn Rots, ik zal op Hem vertrouwen; mijn Schild en de Hoorn van mijn heil, mijn Hoog Vertrek en mijn Toevlucht, mijn Verlosser! Van geweld hebt U mij verlost! Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "Pred 3:17": "Ik zei in mijn hart: God zal de rechtvaardige en de goddeloze oordelen; want daar is de tijd voor alle voornemen, en over alle werk.", "Gal 5:5": "Want wij verwachten door de Geest, uit het geloof, de hoop van de rechtvaardigheid.", "Ezra 4:9": "Toen schreven Rehum, de kanselier, en Simsai, de schrijver, en de overigen van hun gezelschap, de Dinaieten, de Afarsathchieten, de Tarpelieten, de Afarsieten, de Archevieten, de Babyloniërs, de Susanchieten, de Dehavieten, de Elamieten,", "2 Sam 15:23": "En heel het land weende met luide stem, terwijl heel het volk overging; ook ging de koning over de beek Kidron, en heel het volk ging over, recht in de richting van de weg naar de woestijn.", "Ps 3:6": "Ik lag neer en sliep; ik werd wakker, want de HEERE ondersteunde mij.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Ps 115:12-14": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen. Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten. De HEERE zal de zegen over u vermeerderen, over u en over uw kinderen.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Gen 50:24": "En Jozef zei tot zijn broeders: Ik sterf; maar God zal u zeker bezoeken, en Hij zal u doen optrekken uit dit land, naar het land, dat Hij aan Abraham, Izak en Jakob gezworen heeft.", "Ps 119:43": "En ruk het woord van de waarheid van mijn mond niet al te zeer, want ik hoop op Uw rechten.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Gen 32:22-24": "En hij stond in diezelfde nacht op, en nam zijn twee vrouwen, en zijn twee dienstmeisjes, en zijn elf kinderen, en trok over de doorwaadbare plaats van de Jabbok. En hij nam ze, en liet hen de beek oversteken; en hij liet oversteken wat hij had. Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging.", "Neh 4:1-3": "Het gebeurde dat Sanballat hoorde dat wij de muur bouwden. Toen ontstak hij in woede en werd erg boos, en hij bespotte de Joden. Hij sprak in het bijzijn van zijn broeders en van het leger van Samaria, en zei: Wat doen deze zwakke Joden? Zullen zij zichzelf versterken? Zullen zij offeren? Zullen zij het in één dag afmaken? Zullen zij de stenen uit de puinhopen weer levend maken, terwijl die verbrand zijn? En Tobia, de Ammoniet, was bij hem, en zei: Al is het dat zij bouwen, als er een vos opklom, dan zou hij hun stenen muur al kunnen omverhalen.", "Ps 35:10": "Al mijn beenderen zullen zeggen: HEERE, wie is U gelijk! U, Die de ellendige redt van hem die sterker is dan hij, en de ellendige en de nooddruftige van zijn berover.", "Luk 3:1": "En in het vijftiende jaar van de regering van keizer Tiberius, toen Pontius Pilatus stadhouder was over Judea, en Herodes viervorst over Galilea, en Filippus, zijn broer, viervorst over Iturea en over het land Trachonitis, en Lysanias viervorst over Abilene;", "Ps 61:5": "Ik zal in Uw hut verkeren in eeuwigheden; ik zal mijn toevlucht nemen in het verborgene van Uw vleugels. Sela.", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "Deut 28:52": "En het zal u benauwen in al uw poorten, totdat uw hoge en versterkte muren neervallen, waarop u vertrouwde in uw hele land; ja, het zal u benauwen in al uw poorten, in uw hele land, dat de HEERE, uw God, u gegeven heeft.", "Ps 55:18": "'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.", "Gen 16:13": "En zij noemde de Naam van de HEERE, Die tot haar sprak: U bent de God van het aanzien! want zij zei: Heb ik ook hier gezien naar Hem, Die mij aanziet?", "Neh 2:7-9": "Verder zei ik tegen de koning: Als het de koning goeddunkt, dat men mij brieven geeft aan de landvoogden aan de andere zijde van de rivier, zodat zij mij helpen doorreizen, totdat ik in Juda zal zijn aangekomen; ook een brief aan Asaf, de bewaarder van het park van de koning, om mij hout te geven om er balken van te maken voor de poorten van het paleis dat bij het huis behoort, en voor de stadsmuur, en voor het huis waar ik zal intrekken. En de koning gaf ze mij, naar de goede hand van mijn God over mij. Toen kwam ik bij de landvoogden aan de andere zijde van de rivier, en gaf hun de brieven van de koning. En de koning had aanvoerders van het leger en ruiters met mij gezonden.", "Ps 20:6": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens.", "Ps 80:7": "U hebt ons onze buren tot een twist gesteld, en onze vijanden spotten onder elkaar.", "Ezra 7:7": "Ook sommigen van de kinderen van Israël, en van de priesters en de Levieten, en de zangers, en de poortwachters, en de Nethinim, trokken op naar Jeruzalem, in het zevende jaar van koning Arthahsasta.", "Hebr 11:13": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren.", "Ezra 4:16": "Wij maken dan de koning bekend dat, als die stad wordt opgebouwd en haar muren voltooid worden, u daardoor geen deel meer zult hebben aan deze kant van de rivier.", "Ps 56:4": "Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "Neh 2:12-16": "Daarna maakte ik mij 's nachts op, ik en enkele weinig mannen met mij, en ik maakte aan niemand bekend wat mijn God in mijn hart had gegeven om in Jeruzalem te doen; en er was geen dier met mij, dan het dier waarop ik reed. En ik trok 's nachts uit door de Dalpoort, en voorbij de Drakenfontein, en naar de Mestpoort, en ik bekeek de muren van Jeruzalem, die waren afgebroken, en haar poorten die met vuur verteerd waren. En ik ging verder naar de Fonteinpoort, en naar de vijver van de koning; maar daar was geen plaats voor het dier om onder mij door te gaan.", "2 Kron 9:4": "En het voedsel van zijn tafel, en het zitten van zijn knechten, en het optreden van zijn dienaren, en hun kleding, en zijn schenkers, en hun kleding, en zijn opgang waarmee hij opging in het huis van de HEERE, toen was er geen geest meer in haar.", "Micha 7:5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "Klaagl 2:2": "Beth. De Heere heeft al de woningen van Jakob verslonden, en heeft ze niet verschoond; Hij heeft de vestingen van de dochter van Juda afgebroken in Zijn verbolgenheid, Hij heeft gemaakt dat zij de aarde raken; Hij heeft het koninkrijk en zijn vorsten ontheiligd.", "2 Sam 10:12": "Wees sterk, en laten wij sterk zijn voor ons volk, en voor de steden van onze God; de HEERE nu doet, wat goed is in Zijn ogen.", "Ps 137:6": "Mijn tong kleeft aan mijn gehemelte, als ik aan u niet gedenk, als ik Jeruzalem niet verhef boven het hoogste van mijn blijdschap!", "Ezra 7:1": "Na deze geschiedenissen, in het koninkrijk van Arthahsasta, koning van Perzië: Ezra, de zoon van Seraja, de zoon van Azarja, de zoon van Hilkia,", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "Ps 20:6-8": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens. Nu weet ik, dat de HEERE Zijn Gezalfde behoudt; Hij zal Hem verhoren uit de hemel van Zijn heiligheid; het heil van Zijn rechterhand zal zijn met machten. Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Spr 15:13": "Een vrolijk hart maakt het gezicht blij; maar door verdriet in het hart wordt de geest verslagen.", "Neh 4:7": "En het gebeurde, toen Sanballat, Tobia, de Arabieren, de Ammonieten en de Asdodieten hoorden dat het herstel van de muren van Jeruzalem vorderde, dat de scheuren begonnen dichtgemaakt te worden, dat zij erg boos werden.", "2 Kron 32:30": "Deze Jehizkia dichtte ook de bovenste waterloop van Gihon, en leidde die recht naar beneden naar het westen van de stad van David; want Jehizkia had voorspoed in al zijn werk.", "Ps 91:10": "U zal geen kwaad overkomen, en geen plaag zal uw tent naderen.", "1 Sam 1:18": "En zij zei: Laat uw dienstmaagd genade vinden in uw ogen! Zo ging die vrouw haars weegs; en zij at, en haar gezicht was niet meer zo bedroefd.", "Jak 1:16": "Dwaal niet, mijn geliefde broeders!", "Ps 31:2": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Ps 48:15": "Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.", "Ps 118:14": "De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Hand 24:5": "Want wij hebben deze man bevonden een pest te zijn, en iemand die oproer verwekt onder alle Joden, door de hele wereld, en een leidend voorstander van de sekte der Nazarenen.", "Jes 64:8": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen.", "Rom 15:29": "En ik weet dat ik, wanneer ik tot u kom, met volle zegen van het Evangelie van Christus komen zal.", "Ezra 10:2-4": "Toen antwoordde Sechanja, de zoon van Jehiel, een van de zonen van Elam, en zei tegen Ezra: Wij hebben overtreden tegen onze God, en wij hebben vreemde vrouwen van de volken van het land bij ons laten wonen; maar nu is er hoop voor Israël wat dit betreft. Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet. Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het.", "Klaagl 3:51": "Ain. Mijn oog doet mijn ziel moeite aan, vanwege al de dochters van mijn stad.", "Joz 14:12": "En nu, geef mij dit gebergte, waarvan de HEERE op die dag gesproken heeft; want u hebt op diezelfde dag gehoord dat de Enakieten daar waren, en dat er grote versterkte steden waren; misschien is de HEERE met mij, zodat ik hen verdrijf, zoals de HEERE gesproken heeft.", "Jer 31:40": "En het hele dal van de dode lichamen en van de as, en alle velden tot aan de beek Kidron, tot aan de hoek van de Paardenpoort in het oosten, zal voor de HEERE heilig zijn; er zal niets meer worden uitgerukt, of afgebroken worden, in eeuwigheid.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Neh 4:3": "En Tobia, de Ammoniet, was bij hem, en zei: Al is het dat zij bouwen, als er een vos opklom, dan zou hij hun stenen muur al kunnen omverhalen.", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Est 4:11": "Alle knechten van de koning en het volk van de landschappen van de koning weten wel dat ieder die tot de koning ingaat in het binnenste voorhof, zonder geroepen te zijn, of het nu een man of een vrouw is, één vonnis geldt: dat men hem doodt, tenzij de koning hem de gouden scepter toereikt, zodat hij levend blijft; ik nu ben deze dertig dagen niet geroepen om bij de koning te komen.", "Ps 41:13": "Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "Joh 3:33": "Wie Zijn getuigenis aangenomen heeft, die heeft verzegeld dat God waarachtig is.", "Hand 7:10": "en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis.", "Ps 51:20": "Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.", "Jes 56:5": "Ik zal hun ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan van zonen en dan van dochters; een eeuwige naam zal Ik ieder van hen geven, die niet uitgeroeid zal worden.", "Jes 38:16": "Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.", "Ex 15:1-19": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen. De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen! De HEERE is een krijgsman; HEERE is Zijn Naam!", "Neh 4:8": "En zij maakten allen samen een verbond om te komen strijden tegen Jeruzalem en er verwarring te stichten.", "Ex 28:29": "Zo zal Aäron de namen van de zonen van Israël dragen aan de borstlap van het gericht, op zijn hart, als hij in het heilige zal gaan, ter gedachtenis voor het aangezicht van de HEERE, voortdurend.", "1 Kon 1:31": "Toen boog Bathseba met haar gezicht ter aarde, en boog zich neer voor de koning, en zei: Mijn heer de koning David leve in eeuwigheid!", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Est 7:2": "Zei de koning tegen Esther, ook op de tweede dag, op het maaltijd van de wijn: Wat is uw bede, koningin Esther? En zij zal u gegeven worden; en wat is uw verzoek? Het zal gebeuren, ook tot de helft van het koninkrijk.", "Neh 2:13-15": "En ik trok 's nachts uit door de Dalpoort, en voorbij de Drakenfontein, en naar de Mestpoort, en ik bekeek de muren van Jeruzalem, die waren afgebroken, en haar poorten die met vuur verteerd waren. En ik ging verder naar de Fonteinpoort, en naar de vijver van de koning; maar daar was geen plaats voor het dier om onder mij door te gaan. Toen ging ik 's nachts omhoog, door de beek, en ik bekeek de muur; en ik keerde terug, en kwam in door de Dalpoort; zo keerde ik terug.", "Job 16:19": "Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.", "Micha 7:17": "Zij zullen het stof lekken, als de slang; als kruipende dieren van de aarde, zullen zij sidderend tevoorschijn komen uit hun schuilhoeken; zij zullen met vervaardheid komen tot de HEERE, onze God, en zullen voor U vrezen.", "Ps 3:7": "Ik zal niet bang zijn voor tienduizenden van het volk, die zich rondom tegen mij opstellen.", "Ex 23:31": "En Ik zal uw grenzen vaststellen van de Schelfzee tot aan de zee van de Filistijnen, en van de woestijn tot aan de rivier; want Ik zal de inwoners van dat land in uw hand geven, zodat u hen voor uw aangezicht wegjaagt.", "Hand 10:4": "En hij hield de ogen op hem gericht, en werd zeer bevreesd, en zei: Wat is er, Heere? En Hij zei tegen hem: Uw gebeden en uw aalmoezen zijn als gedachtenis opgekomen voor God.", "Neh 5:1-18": "Maar het geroep van het volk en van hun vrouwen was groot, tegen hun broeders, de Joden. Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven. Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Ezra 5:17": "Als het de koning dan nu goeddunkt, laat er gezocht worden in het schathuis van de koning daar, dat te Babel is, of het zo is dat een bevel van de koning Kores gegeven is om dit huis van God te Jeruzalem te bouwen; en dat men ons het believen van de koning hierover laat weten.", "Luk 23:2": "En zij begonnen Hem te beschuldigen en zeiden: Wij hebben bevonden dat Deze het volk verkeerd voorlicht, en verbiedt de keizer schattingen te geven, en zegt dat Hij Zelf Christus, de Koning is.", "Ps 54:6": "Zie, God is mij een Helper; de Heere is onder hen die mijn ziel ondersteunen.", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Pred 3:1": "Alles heeft een vastgestelde tijd, en alle voornemen onder de hemel heeft zijn tijd.", "Ezra 4:3": "Maar Zerubbabel, Jesua en de overige hoofden van de families van Israël zeiden tegen hen: Het past niet dat u en wij samen een huis bouwen voor onze God; maar wij alleen zullen het bouwen voor de HEERE, de God van Israël, zoals koning Kores, de koning van Perzië, ons geboden heeft.", "Ps 22:5": "Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en U hebt hen uitgeholpen.", "Ps 66:9": "Die onze zielen in het leven houdt, en niet toelaat dat onze voet wankelt.", "Ps 26:12": "Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.", "Neh 5:14": "Ook heb ik, van de dag af dat hij mij bevolen heeft hun landvoogd te zijn in het land Juda, van het twintigste jaar af tot het tweeëndertigste jaar van koning Arthahsasta, dat is twaalf jaar, samen met mijn broeders het brood van het landvoogdschap niet gegeten.", "Ps 16:2": "O mijn ziel, u hebt tegen de HEERE gezegd: U bent de Heere, mijn goedheid raakt niet tot U;", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "Mark 5:40": "En zij lachten Hem uit; maar Hij stuurde hen allen naar buiten, en nam de vader en de moeder van het kind mee, en degenen die met Hem waren, en ging naar binnen waar het kind lag.", "Neh 1:4": "En het gebeurde, toen ik deze woorden hoorde, dat ik neerzat, en huilde, en rouw bedreef, enkele dagen; en ik vastte en bad voor het aangezicht van de God van de hemel.", "Lev 2:2": "En hij zal het brengen tot de zonen van Aäron, de priesters, van wie er één daarvan zijn hand vol zal grijpen uit de meelbloem, en uit de olie, met alle wierook; en de priester zal het gedenkoffer daarvan aansteken op het altaar; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Ps 59:10": "Tegen zijn sterkte zal ik op U wachten; want God is mijn Hoog Vertrek.", "Jer 17:17": "Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan
