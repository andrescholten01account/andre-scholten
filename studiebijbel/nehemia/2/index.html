2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen gebeurde het in de maand Nisan, in het twintigste jaar van koning Arthahsasta, *als* er wijn voor hem was, dat ik de wijn opnam en aan de koning gaf; nu was ik nooit eerder treurig geweest voor hem.","2":"Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd,","3":"en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn?","4":"En de koning zei tegen mij: Wat verzoekt u nu? Toen bad ik tot de God van de hemel.","5":"En ik zei tegen de koning: Als het de koning goeddunkt, en als uw dienaar u aangenaam is, dat u mij zendt naar Juda, naar de stad van de graven van mijn vaderen, om die te herbouwen.","6":"Toen zei de koning tegen mij, terwijl de koningin naast hem zat: Hoelang zal uw reis duren, en wanneer zult u terugkomen? En het behaagde de koning om mij te zenden, toen ik hem een bepaalde tijd had opgegeven.","7":"Verder zei ik tegen de koning: Als het de koning goeddunkt, dat men mij brieven geeft aan de landvoogden aan de andere zijde van de rivier, zodat zij mij helpen doorreizen, totdat ik in Juda zal zijn aangekomen;","8":"ook een brief aan Asaf, de bewaarder van het park[1] van de koning, om mij hout te geven om er balken van te maken voor de poorten van het paleis dat bij het huis behoort, en voor de stadsmuur, en voor het huis waar ik zal intrekken. En de koning gaf ze mij, naar de goede hand van mijn God over mij.","9":"Toen kwam ik bij de landvoogden aan de andere zijde van de rivier, en gaf hun de brieven van de koning. En de koning had aanvoerders van het leger en ruiters met mij gezonden.","10":"Toen Sanballat, de Horoniet, en Tobia, de Ammonitische dienaar, dat hoorden, mishaagde het hun ten zeerste, dat er een mens gekomen was om wat goeds te zoeken voor de kinderen van Israël.","11":"En ik kwam in Jeruzalem, en was daar drie dagen.","12":"Daarna maakte ik mij 's nachts op, ik en enkele weinig mannen met mij, en ik maakte aan niemand bekend wat mijn God in mijn hart had gegeven om in Jeruzalem te doen; en er was geen dier met mij, dan het dier waarop ik reed.","13":"En ik trok 's nachts uit door de Dalpoort, en voorbij de Drakenfontein, en naar de Mestpoort, en ik bekeek de muren van Jeruzalem, die waren afgebroken, en haar poorten die met vuur verteerd waren.","14":"En ik ging verder naar de Fonteinpoort, en naar de vijver van de koning; maar daar was geen plaats voor het dier om onder mij door te gaan.","15":"Toen ging ik 's nachts omhoog, door de beek, en ik bekeek de muur; en ik keerde terug, en kwam in door de Dalpoort; zo keerde ik terug.","16":"En de overheden wisten niet waar ik heengegaan was en wat ik deed; want ik had tot dan toe aan de Joden, de priesters, de edelen, de overheden, en de anderen die het werk deden, niets bekendgemaakt.","17":"Toen zei ik tegen hen: U ziet de ellende waarin wij zijn, dat Jeruzalem woest is, en haar poorten met vuur verbrand zijn; komt, laten wij Jeruzalems muur opbouwen, zodat wij niet langer een smaad zijn.","18":"En ik maakte hun de hand van mijn God bekend, Die goed over mij geweest was, en ook de woorden van de koning, die hij tegen mij gesproken had. Toen zeiden zij: Laten wij opstaan en bouwen; en zij sterkten hun handen ten goede.","19":"Toen Sanballat, de Horoniet, en Tobia, de Ammonitische dienaar, en Gesem, de Arabier, dit hoorden, bespotten zij ons en verachtten ons; en zij zeiden: Wat is dit voor iets, dat u doet? Wilt u tegen de koning in opstand komen?","20":"Toen gaf ik hun antwoord, en zei tegen hen: De God van de hemel, Hij zal het ons doen gelukken, en wij, Zijn dienaren, zullen opstaan en bouwen; maar u hebt geen deel, geen recht, en geen aandenken in Jeruzalem."},"SV":{"1":"Toen geschiedde het in de maand Nisan, in het twintigste jaar van den koning Arthahsasta, *als* *er* wijn voor zijn aangezicht was, dat ik den wijn opnam, en gaf *hem* den koning; nu was ik nooit treurig geweest voor zijn aangezicht.","2":"Zo zeide de koning tot mij: Waarom is uw aangezicht treurig, zo gij toch niet krank zijt? Dit is niet dan treurigheid des harten. Toen vreesde ik gans zeer.","3":"En ik zeide tot de koning: De koning leve in eeuwigheid! Hoe zou mijn aangezicht niet treurig zijn, daar de stad, de plaats der begrafenissen mijner vaderen, woest is, en haar poorten met vuur verteerd zijn?","4":"En de koning zeide tot mij: Wat verzoekt gij nu? Toen bad ik tot God van den hemel.","5":"En ik zeide tot den koning: Zo het den koning goeddunkt, en zo uw knecht voor uw aangezicht aangenaam is, dat gij mij zendt naar Juda, naar de stad der begrafenissen mijner vaderen, dat ik ze bouwe.","6":"Toen zeide de koning tot mij, daar de koningin nevens hem zat: Hoe lang zal uw reis wezen, en wanneer zult gij wederkomen? En het behaagde den koning, dat hij mij zond, als ik hem zekeren tijd gesteld had.","7":"Voorts zeide ik tot den koning: Zo het den koning goeddunkt, dat men mij brieven geve aan de landvoogden aan gene zijde der rivier, dat zij mij overgeleiden, totdat ik in Juda zal gekomen zijn;","8":"Ook een brief aan Asaf, den bewaarder van den lusthof, denwelken de koning heeft, dat hij mij hout geve om te zolderen de poorten van het paleis, dat aan het huis is, en tot den stadsmuur, en tot het huis, waar ik intrekken zal. En de koning gaf ze mij, naar de goede hand mijns Gods over mij.","9":"Toen kwam ik tot de landvoogden aan gene zijde der rivier, en gaf hun de brieven des konings. En de koning had oversten des heirs en ruiteren met mij gezonden.","10":"Toen nu Sanballat, de Horoniet, en Tobia, de Ammonietische knecht *dat* hoorden, mishaagde het hun met groot mishagen, dat er een mens gekomen was, om wat goeds te zoeken voor de kinderen Israëls.","11":"En ik kwam te Jeruzalem, en was daar drie dagen.","12":"Daarna maakte ik mij des nachts op, ik en weinig mannen met mij, en ik gaf geen mens te kennen, wat mijn God in mijn hart gegeven had, om aan Jeruzalem te doen; en er was geen dier met mij, dan het dier, waarop ik reed.","13":"En ik trok uit bij nacht door de Dalpoort, en voorbij de Drakenfontein, en naar de Mistpoort, en ik brak aan de muren van Jeruzalem, dewelke verscheurd waren, en haar poorten met vuur verteerd.","14":"En ik ging voort naar de Fonteinpoort, en naar des konings vijver; doch daar was geen plaats voor het dier, om onder mij voort te gaan.","15":"Toen ging ik op, des nachts, door de beek, en ik brak aan den muur; en ik keerde weder, en kwam in door de Dalpoort; alzo keerde ik wederom.","16":"En de overheden wisten niet, waar ik heengegaan was, en wat ik deed; want ik had tot nog toe den Joden, en den priesteren, en den edelen, en overheden, en den anderen, die het werk deden, niets te kennen gegeven.","17":"Toen zeide ik tot hen: Gijlieden ziet de ellende, waarin wij zijn, dat Jeruzalem woest is, en haar poorten met vuur verbrand zijn; komt, en laat ons Jeruzalems muur opbouwen; opdat wij niet meer een versmaadheid zijn.","18":"En ik gaf hun te kennen de hand mijns Gods, Die goed over mij geweest was, als ook de woorden des konings, die hij tot mij gesproken had. Toen zeiden zij: Laat ons op zijn, dat wij bouwen; en zij sterkten hun handen ten goede.","19":"Als nu Sanballat, de Horoniet, en Tobia, de Ammonietische knecht, en Gesem, de Arabiër, dit hoorden, zo bespotten zij ons, en verachtten ons; en zij zeiden: Wat is dit voor een ding, dat gijlieden doet? Wilt gijlieden tegen den koning rebelleren?","20":"Toen gaf ik hun tot antwoord, en zeide tot hen: God van den hemel, Die zal het ons doen gelukken, en wij, Zijn knechten, zullen ons opmaken en bouwen; maar gijlieden hebt geen deel, noch gerechtigheid, noch gedachtenis in Jeruzalem."},"KJV":{"1":"And it came to pass in the month Nisan, in the twentieth year of Artaxerxes the king, *that* wine *was* before him: and I took up the wine, and gave *it* unto the king. Now I had not been *beforetime* sad in his presence.","2":"Wherefore the king said unto me, Why *is* thy countenance sad, seeing thou *art* not sick? this *is* nothing *else* but sorrow of heart. Then I was very sore afraid,","3":"And said unto the king, Let the king live for ever: why should not my countenance be sad, when the city, the place of my fathers' sepulchres, *lieth* waste, and the gates thereof are consumed with fire?","4":"Then the king said unto me, For what dost thou make request? So I prayed to the God of heaven.","5":"And I said unto the king, If it please the king, and if thy servant have found favour in thy sight, that thou wouldest send me unto Judah, unto the city of my fathers' sepulchres, that I may build","6":"And the king said unto me, (the queen also sitting by him,) For how long shall thy journey be? and when wilt thou return? So it pleased the king to send me; and I set him a time.","7":"Moreover I said unto the king, If it please the king, let letters be given me to the governors beyond the river, that they may convey me over till I come into Judah;","8":"And a letter unto Asaph the keeper of the king's forest, that he may give me timber to make beams for the gates of the palace which *appertained* to the house, and for the wall of the city, and for the house that I shall enter into. And the king granted me, according to the good hand of my God","9":"Then I came to the governors beyond the river, and gave them the king's letters. Now the king had sent captains of the army and horsemen","10":"When Sanballat the Horonite, and Tobiah the servant, the Ammonite, heard *of it*, it grieved them exceedingly that there was come a man to seek the welfare of the children of Israel.","11":"So I came to Jerusalem, and was there three days.","12":"And I arose in the night, I and some few men with me; neither told I *any* man what my God had put in my heart to do at Jerusalem: neither *was there any* beast with me, save the beast that I rode upon.","13":"And I went out by night by the gate of the valley, even before the dragon well, and to the dung port, and viewed the walls of Jerusalem, which were broken down, and the gates thereof were consumed with fire.","14":"Then I went on to the gate of the fountain, and to the king's pool: but *there was* no place for the beast *that was* under me to pass.","15":"Then went I up in the night by the brook, and viewed the wall, and turned back, and entered by the gate of the valley, and *so* returned.","16":"And the rulers knew not whither I went, or what I did; neither had I as yet told *it* to the Jews, nor to the priests, nor to the nobles, nor to the rulers, nor to the rest that did the work.","17":"Then said I unto them, Ye see the distress that we *are* in, how Jerusalem *lieth* waste, and the gates thereof are burned with fire: come, and let us build up the wall of Jerusalem, that we be no more a reproach.","18":"Then I told them of the hand of my God which was good upon me; as also the king's words that he had spoken unto me. And they said, Let us rise up and build. So they strengthened their hands for *this* good","19":"But when Sanballat the Horonite, and Tobiah the servant, the Ammonite, and Geshem the Arabian, heard *it*, they laughed us to scorn, and despised us, and said, What *is* this thing that ye do? will ye rebel against the king?","20":"Then answered I them, and said unto them, The God of heaven, he will prosper us; therefore we his servants will arise and build: but ye have no portion, nor right, nor memorial, in Jerusalem."}},"tsk":{"1":[{"kopje":"Nisan","refs":["Est 3:7"]},{"kopje":"het twintigste","refs":["Neh 1:1","Ezra 7:1","Ezra 7:7"]},{"kopje":"ik de wijn opnam","refs":["Neh 1:11","Gen 40:11","Gen 40:21"]}],"2":[{"kopje":"Waarom is uw gezicht","refs":["Gen 40:7"]},{"kopje":"treurigheid","refs":["Spr 15:13"]}],"3":[{"kopje":"De koning leve","refs":["1 Kon 1:31","Dan 2:4","Dan 3:9","Dan 5:10","Dan 6:7","Dan 6:22"]},{"kopje":"de stad","refs":["Neh 1:3","Ps 102:15","Ps 137:6","Klaagl 2:9"]},{"kopje":"de plaats","refs":["2 Kron 21:20","2 Kron 28:27","2 Kron 32:33"]}],"4":[{"kopje":"Wat verzoekt u","refs":["1 Kon 3:5","Est 5:3","Est 5:6","Est 7:2","Mark 10:51"]},{"kopje":"Toen bad ik","refs":["Neh 1:4","Neh 1:11","2 Sam 15:31","Spr 3:6","Fil 4:6"]}],"5":[{"kopje":"Als het de koning goeddunkt","refs":["Ezra 5:17","Est 1:19","Est 5:8","Est 7:3","Est 8:5"]},{"kopje":"en als uw","refs":["Ruth 2:13","2 Sam 14:22","Spr 3:4"]}],"6":[{"kopje":"het behaagde de koning","refs":["Neh 2:4","Neh 1:11","Jes 58:12","Jes 61:4","Jes 65:24"]},{"kopje":"ik hem een bepaalde tijd had opgegeven","refs":["Neh 5:14","Neh 13:6"]}],"7":[{"kopje":"dat men mij brieven geeft","refs":["Neh 2:9","Ezra 6:6","Ezra 7:21"]},{"kopje":"zodat zij mij","refs":["Ezra 8:22"]}],"8":[{"kopje":"de stadsmuur","refs":["Neh 2:17","Neh 3:1-32"]},{"kopje":"het huis","refs":["Neh 3:7","Neh 7:2"]},{"kopje":"de koning","refs":["Neh 2:18","Gen 32:28","Ezra 5:5","Ezra 6:22","Ezra 7:6","Ezra 7:9","Ezra 7:27","E data-l=\"L10\" data-code=\"H559\">en</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H559\">zij</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H559\">zeiden</span>: <span class=\"wl\" data-l=\"L11\" data-code=\"H4100\">Wat</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H4100\">is</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H2088\">dit</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H2088\">voor</span> iets, <span class=\"wl\" data-l=\"L13\" data-code=\"H834\">dat</span> u <span class=\"wl\" data-l=\"L15\" data-code=\"H6213\">doet</span>? <span class=\"wl\" data-l=\"L14\" data-code=\"H859\">Wilt</span> u <span class=\"wl\" data-l=\"L16\" data-code=\"H5921\">tegen</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H5921\">de</span> <span class=\"wl\" data-l=\"L17\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L17\" data-code=\"H4428\">in</span> opstand komen?","20":"<span class=\"wl\" data-l=\"L1\" data-code=\"H7725\">Toen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7725\">gaf</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7725\">ik</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7725\">hun</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1697\">antwoord</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H559\">en</span> zei tegen <span class=\"wl\" data-l=\"L4\" data-code=\"H430\">hen</span>: <span class=\"wl\" data-l=\"L4\" data-code=\"H430\">De</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H430\">God</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H430\">van</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8064\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8064\">hemel</span>, Hij zal <span class=\"wl\" data-l=\"L6\" data-code=\"H6743\">het</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6743\">ons</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6743\">doen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6743\">gelukken</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H587\">en</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H587\">wij</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H587\">Zijn</span> dienaren, <span class=\"wl\" data-l=\"L8\" data-code=\"H6965\">zullen</span> opstaan <span class=\"wl\" data-l=\"L9\" data-code=\"H1129\">en</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1129\">bouwen</span>; <span class=\"wl\" data-l=\"L10\" data-code=\"H369\">maar</span> u <span class=\"wl\" data-l=\"L10\" data-code=\"H369\">hebt</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H369\">geen</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H2506\">deel</span>, geen recht, en geen aandenken <span class=\"wl\" data-l=\"L12\" data-code=\"H3389\">in</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H3389\">Jeruzalem</span>."},"koppeling_kjv":{"1":"And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H5212\">Nisan,</span> in the <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H783\">Artaxerxes</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> that <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> was <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: and I took <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> Now I had not been beforetime <span class=\"wl wl-kjv\" data-code=\"H7451\">sad</span> in his presence.","2":"Wherefore the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, Why is thy <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">sad,</span> seeing thou art not <span class=\"wl wl-kjv\" data-code=\"H2470\">sick?</span> this is nothing else but <span class=\"wl wl-kjv\" data-code=\"H7455\">sorrow</span> of <span class=\"wl wl-kjv\" data-code=\"H3820\">heart.</span> Then I was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">sore</span> afraid,","3":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Let the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">live</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> why should not my <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance</span> be <span class=\"wl wl-kjv\" data-code=\"H3415\">sad,</span> when the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">place</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers'</span> <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchres,</span> lieth <span class=\"wl wl-kjv\" data-code=\"H2720\">waste,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> thereof are <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> with fire?","4":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, For what dost thou make <span class=\"wl wl-kjv\" data-code=\"H1245\">request?</span> So I <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> to the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of heaven.","5":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> If it <span class=\"wl wl-kjv\" data-code=\"H2895\">please</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and if thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> have found <span class=\"wl wl-kjv\" data-code=\"H3190\">favour</span> in thy <span class=\"wl wl-kjv\" data-code=\"H6440\">sight,</span> that thou wouldest <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> me unto <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers'</span> <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchres,</span> that I may build","6":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, (the <span class=\"wl wl-kjv\" data-code=\"H7694\">queen</span> also <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting</span> by <span class=\"wl wl-kjv\" data-code=\"H681\">him,)</span> For how long shall thy <span class=\"wl wl-kjv\" data-code=\"H4109\">journey</span> be? and when wilt thou <span class=\"wl wl-kjv\" data-code=\"H7725\">return?</span> So it <span class=\"wl wl-kjv\" data-code=\"H3190\">pleased</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> me; and I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> him a time.","7":"Moreover I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> If it <span class=\"wl wl-kjv\" data-code=\"H2895\">please</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> let <span class=\"wl wl-kjv\" data-code=\"H107\">letters</span> be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> me to the <span class=\"wl wl-kjv\" data-code=\"H6346\">governors</span> <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> that they may convey me <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> till I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into Judah;","8":"And a <span class=\"wl wl-kjv\" data-code=\"H107\">letter</span> unto <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph</span> the <span class=\"wl wl-kjv\" data-code=\"H8104\">keeper</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H6508\">forest,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> to make <span class=\"wl wl-kjv\" data-code=\"H7136\">beams</span> for the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace</span> which appertained to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> that I shall enter <span class=\"wl wl-kjv\" data-code=\"H935\">into.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">granted</span> me, according to the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of my God","9":"Then I <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H6346\">governors</span> <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H107\">letters.</span> Now the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> had <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> and horsemen","10":"When <span class=\"wl wl-kjv\" data-code=\"H5571\">Sanballat</span> the <span class=\"wl wl-kjv\" data-code=\"H2772\">Horonite,</span> and <span class=\"wl wl-kjv\" data-code=\"H2900\">Tobiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> the <span class=\"wl wl-kjv\" data-code=\"H5984\">Ammonite,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of it, it <span class=\"wl wl-kjv\" data-code=\"H3415\">grieved</span> them <span class=\"wl wl-kjv\" data-code=\"H7451\">exceedingly</span> that there was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H2896\">welfare</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","11":"So I <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and was there <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> days.","12":"And I <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> I and <span class=\"wl wl-kjv\" data-code=\"H4592\">some</span> <span class=\"wl wl-kjv\" data-code=\"H4592\">few</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> with me; neither <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> I any <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> what my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> in my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> neither was there any <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> with me, save the <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> that I rode upon.","13":"And I went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley,</span> even <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H8577\">dragon</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">well,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H830\">dung</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">port,</span> and <span class=\"wl wl-kjv\" data-code=\"H7663\">viewed</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> which were broken <span class=\"wl wl-kjv\" data-code=\"H6555\">down,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> thereof were <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> with fire.","14":"Then I went <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> to the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H5869\">fountain,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1295\">pool:</span> but there was no <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> for the <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> that was under me to pass.","15":"Then went I <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> by the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook,</span> and <span class=\"wl wl-kjv\" data-code=\"H7663\">viewed</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> and turned <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley,</span> and so returned.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not whither I <span class=\"wl wl-kjv\" data-code=\"H1980\">went,</span> or what I <span class=\"wl wl-kjv\" data-code=\"H6213\">did;</span> neither had I as <span class=\"wl wl-kjv\" data-code=\"H3651\">yet</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it to the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews,</span> nor to the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> nor to the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles,</span> nor to the <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> nor to the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> the work.","17":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I unto them, Ye <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">distress</span> that we are in, how <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> lieth <span class=\"wl wl-kjv\" data-code=\"H2720\">waste,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> thereof are <span class=\"wl wl-kjv\" data-code=\"H3341\">burned</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">come,</span> and let us build <span class=\"wl wl-kjv\" data-code=\"H1129\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> that we be no more a reproach.","18":"Then I <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> them of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> which was <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> upon me; as also the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that he had <span class=\"wl wl-kjv\" data-code=\"H559\">spoken</span> unto me. And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let us rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">build.</span> So they <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> for this good","19":"But when <span class=\"wl wl-kjv\" data-code=\"H5571\">Sanballat</span> the <span class=\"wl wl-kjv\" data-code=\"H2772\">Horonite,</span> and <span class=\"wl wl-kjv\" data-code=\"H2900\">Tobiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> the <span class=\"wl wl-kjv\" data-code=\"H5984\">Ammonite,</span> and <span class=\"wl wl-kjv\" data-code=\"H1654\">Geshem</span> the <span class=\"wl wl-kjv\" data-code=\"H6163\">Arabian,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, they laughed us to <span class=\"wl wl-kjv\" data-code=\"H3932\">scorn,</span> and <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> us, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What is this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> that ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do?</span> will ye <span class=\"wl wl-kjv\" data-code=\"H4775\">rebel</span> against the king?","20":"Then <span class=\"wl wl-kjv\" data-code=\"H7725\">answered</span> I them, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, The <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> he will <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> us; therefore we his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> will <span class=\"wl wl-kjv\" data-code=\"H6965\">arise</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">build:</span> but ye have no <span class=\"wl wl-kjv\" data-code=\"H2506\">portion,</span> nor <span class=\"wl wl-kjv\" data-code=\"H6666\">right,</span> nor <span class=\"wl wl-kjv\" data-code=\"H2146\">memorial,</span> in Jerusalem."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Nisan,","tekst":"Anders genoemd Abib; Exo 13:4 ."},{"catchword":"Arthahsasta,","tekst":"Zie Ezr 6:14 ."},{"catchword":"ik den wijn","tekst":"Tot wien de beurt nu weder gekomen was om den koning van den opgedragen wijn te schenken. Hiermede wordt te kennen gegeven de oorzaak, waarom Nehemia dus lang getoefd heeft."},{"catchword":"treurig geweest","tekst":"Hebreeuws, kwaad; dat is hier, droevig, treurig van gelaat, en zo in het volgende; zie Gen 40:7 ."},{"catchword":"voor zijn aangezicht","tekst":"Als ik voor den koning placht te verschijnen; maar nu [wil hij zeggen] was het anders met mij gesteld."}],"2":[{"catchword":"vreesde ik","tekst":"Uit ontzag voor den koning, want men moest voor de Perzische koningen met geen tekenen van rouw en droefenis verschijnen, Est 4:2 ; en mede uit bekommernis over de uitkomst dezer zaak, die zeer gewichtig was."}],"3":[{"catchword":"De koning leve","tekst":"Manier van gelukwensen in die landen gebruikelijk. Zie Dan 2:4 , en Dan 3:9 , en Dan 5:10 , en Dan 6:22 ."},{"catchword":"eeuwigheid","tekst":"Dat is, lang."},{"catchword":"Hoe zou mijn","tekst":"Hebreeuws, waaRom."},{"catchword":"stad,","tekst":"Namelijk, Jeruzalem, die hij aldus beschrijft om zijn droefenis te excuseren, en den koning te meer te bewegen."},{"catchword":"plaats","tekst":"Hebreeuws, huis; hetwelk somtijds voor plaats genomen wordt. Zie Exo 25:27 ; 2Sa 15:17 ; Pro 8:2 met de aantekening."}],"4":[{"catchword":"Wat verzoekt gij","tekst":"Hebreeuws, waarover zijt gij nu verzoekende."},{"catchword":"bad ik","tekst":"Te weten, bij mijzelven, in mijn hart."}],"5":[{"catchword":"Zo het den koning","tekst":"Hebreeuws, zo bij den koning goed [is], alzo vs.7; zie Ezr 5:17 ."},{"catchword":"aangenaam is,","tekst":"Hebreeuws, goed."},{"catchword":"dat gij","tekst":"Versta hierop, zo verzoek ik."}],"6":[{"catchword":"daar","tekst":"Anders, en de koningin, die nevens hem zat."},{"catchword":"koningin","tekst":"Anders, vrouw, bedgenoot."},{"catchword":"behaagde","tekst":"Hebreeuws, was goed voor het aangezicht des konings."},{"catchword":"tijd","tekst":"Te weten, van twaalf jaren; zie onder Neh 5:14 , en Neh 13:6 ."}],"7":[{"catchword":"rivier,","tekst":"Eufraat, en zo in het volgende."}],"8":[{"catchword":"bewaarder","tekst":"Dat is, den houtvester of bosbewaarder. Zie 1Ki 5:6 , Lusthof. Hebreeuws, Pardes; dat is, paradijs, waardoor sommigen verstaan de streek van het gebergte Libanon tot Anti-Libanon toe, alzo genoemd vanwege de zonderlinge lustigheid dezer plaats, zodat er ook een stadje geweest is, genoemd het Paradijs."},{"catchword":"huis is,","tekst":"Versta, het huis Gods, dat is, de tempel, welks voorhof [hier, gelijk enigen menen, het paleis genoemd] tot dezen tijd toe open heeft gelegen. Vergelijk Ezr 10:9 ; 1Ch 29:1 ."},{"catchword":"naar de goede hand","tekst":"Gelijk Ezr 7:6 , Ezr 7:9 , Ezr 7:28 , enz."}],"10":[{"catchword":"Horoniet,","tekst":"Alzo genoemd van Horonaim, een der voornaamste steden van de Moabieten, gelijk te zien is Isa 15:5 ; Jer 48:3 , Jer 48:5 , Jer 48:34 ."},{"catchword":"knecht","tekst":"Dat is, van den Perzischen koning, vazal, officier, of stadhouder. Deze beiden waren vijanden der Israëlieten. Zie 2Sa 8:2 , en 2Sa 12:31 , en hadden hun residentie te dezen tijde binnen Samaria, gelijk afgenomen wordt uit Neh 4:2 ."},{"catchword":"mishaagde","tekst":"Hebreeuws, het was [of doch] hun kwaad, [met, of, ja] een groot kwaad; dat is, het mishaagde hen met groot mishagen."}],"11":[{"catchword":"en was daar","tekst":"Vergelijk Ezr 8:32 ."}],"13":[{"catchword":"Dalpoort,","tekst":"Dat is, waar deze poort tevoren geweest was en naderhand weder opgebouwd is; zie Neh 3:13 , alzo van de volgende."},{"catchword":"Drakenfontein,","tekst":"Of, Slangenfontein. Hierdoor wordt door sommigen verstaan de fontein des waters Siloa, als gaande zeer stillekens en zachtjes, gelijk of een slang kroop. Zie Isa 8:6 , en onder, Neh 3:15 ."},{"catchword":"Mistpoort,","tekst":"Waar men de vuiligheden uitbracht naar de beek Kidron, zo enigen menen."},{"catchword":"brak","tekst":"Om eigenlijk te weten wat er aan schortte, en wat er aan te doen was. Anders, ik lette op de muren, enz., hoe ze gescheurd waren, enz., alzo ook vs.15."},{"catchword":"haar poorten","tekst":"Te weten, van Jeruzalem."}],"14":[{"catchword":"Fonteinpoort,","tekst":"Waar men ging naar de fontein van het water Siloa, gelijk enigen afnemen uit Neh 3:15 ."},{"catchword":"vijver;","tekst":"Zie onder, Neh 3:15-16 ; 2Ki 18:17 , en 2Ki 20:20 ."},{"catchword":"geen plaats","tekst":"Vanwege de steenhopen van den vervallen en gebroken muur, zodat hij te voet moest gaan."}],"15":[{"catchword":"door de","tekst":"Anders, bij."},{"catchword":"beek,","tekst":"Kidron; zie daarvan 2Sa 15:23 , of Gihon, zo anderen menen. Zie daarvan 2Ch 32:30 , en 2Ch 33:14 ."},{"catchword":"brak aan den muur;","tekst":"Zie vs.13."}],"16":[{"catchword":"edelen,","tekst":"Hebreeuws, den witten; dat is, die witte sierlijke klederen droegen, gelijk grote heren in der koningen hoven; zie Est 8:15 . Alzo onder, Neh 5:7 , en Neh 6:17 , en Neh 7:5 , en Neh 13:17 ."},{"catchword":"anderen,","tekst":"Hebreeuws, het overige."},{"catchword":"die het werk deden,","tekst":"Stadsbouwmeester, of wien het opzicht daarvan bevolen was, die het bewind daarvan hadden."}],"18":[{"catchword":"de hand mijns Gods,","tekst":"Vergelijk boven, vs.8."},{"catchword":"sterkten","tekst":"Dat is, zij grepen moed om dit goed en loffelijk werk onbeschroomd bij de hand te nemen."}],"20":[{"catchword":"gijlieden","tekst":"Als ongelovigen en afgodendienaars vanouds af, hebt gij gans geen gemeenschap met Gods kerk, maar zijt vreemd van dezelve, ja hare vijanden, zodat wij ons aan u niet hebben te keren."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then it came to pass in the month Nisan, [Oth. Called Abib, Exo 13:4.] in the twentieth year of king Arthahsasta, [see Ezra 6 1.on v.14.] (when there) was wine before his face; that I [whose turn it was now again, to fill out for the King the wine that was set before him, hereby is intimated the cause why Nehemia tarried so long] took up the wine, and gave (it) unto the king; now I had never been sad [hebr. Evil; that ishere, of a sad or sorrowful countenance: and so in the sequel. See Gen.40.on vers.7.] before his face. [when I was wont to come before the King, or to be in his presence: But (as if he should say) it was otherwise with me now.]"}],"2":[{"catchword":null,"tekst":"Then the king said unto me; why is thy countenance sad, seeing thou art not sick? This is nothing (else) but sorrow of heart: Then I was very sore afraid. [Out of reverence of the Kings Majesty; for none might appear before the Persian Kings in Badges of Mourning and sorrow, Est.4.2. and likewise out of care and trouble about the issue of this matter, which was of great concernment.]"}],"3":[{"catchword":null,"tekst":"And I said unto King; Let the king live for ever; [That is, let him live long, a manner of wishing prosperity and happiness, used in those countries. See Dan.2,4. And 3.9. and 5.10. and 6.22.] how [Hebr. Why] should not my countenance be sad, when the city the place [Heb. The house, which is sometimes taken for place. See Exod. 25 7. 2 Sam.15.17. Pro 8:2. with the annotate.] of the burials of my Fathers lieth waste, and the gates are consumed with fire? [by city here he meaneth Jerusalem, which he thus describeth, to excuse his own sadness, and to move the king the more.]"}],"4":[{"catchword":null,"tekst":"And the king said unto me; what doest thou now request? [Heb. for what art thou now requesting] Then I prayed [to wit, within my self, in mine heart] unto the God of heaven."}],"5":[{"catchword":null,"tekst":"And I said unto the king; if it seem good unto the king, [Hebr. If it (be) good with the king: so vers.7. See Ezra 5.on vers.17.] and if thy servant be acceptable [Hebr. Good] before thy face; that thou wouldest send me unto Juda, [understand withal, I do request] unto the city of the burials of my Fathers, that I may build it."}],"6":[{"catchword":null,"tekst":"Then the king said unto me, when the Queen [oth. Wife, bed fellow] sat by him; [oth. And the Queen that sat by him] how low shall thy journey be, and when shalt thou return? And it pleased the king [Hebr. Was good before the face of the king] when I had set him a certain time. [to wit, the time of twelve years. See below chap.5.14. and 13.6.]"}],"7":[{"catchword":null,"tekst":"Moreover, I said unto the king; if it seem good unto the king, let letters be given me to the Governors beyond the River: [Euphrates; and so in the sequel] that they may convey me over, till I shall be come into Juda."}],"8":[{"catchword":null,"tekst":"Also a letter unto Asaph the keeper of the Garden of pleasure, [That is, the forster or keeper of the Groves. See 1 King.5.6. Garden of pleasure. Heb. Pardesch;that is, Paradiose, whereby some do understand the country from mount Libanus unto Antilibanus, so called by reason of the singular delight and pleasure of that place, so that there was also a little town or city called the Paradise] which the king hath, that he may give me wood to floor the gates of the palace, that is at the house, [meaning the house of God, that is, the Temple, whose court (called here, as some conceive, the palace) lay hitherto open. Compare Ezra 10.on vers.6. 1 Chron.29.1.] and for the wall of the city, and for the house that I shall enter into: And the king granted them unto me, according to the good hand of my God upon me."}],"9":[{"catchword":null,"tekst":"Then I came to the Governors on that side the River, and gave them the king letters: And the king had sent Captains of the army and horsemen with me."}],"10":[{"catchword":null,"tekst":"Now when Saneballet the Horonite, [So called from Horonaim, one of the chiefest cities of the Moabites, as appeareth, Isa 15:5. and Jer 48:3,5,34.] and Tobia the Ammonitish servant [that is, the Persian Kingts Vassal, Officer, or Lieutenant. Both these were Enemies to the Israelites. (See 2 Sa. 8.on v.2. and 12.on v.31.) and had at this time their residence or abode at Samaria, as may be gathered from chapt.4.2.] heard (thereof) it displeased them with great displeasure, [Hebr. It was (or seemed) evil unto them (with, or yea) a great evil: that is, it displeased (or grieved) them exceedingly] that there was come a man to seek some good thing for the children of Israel."}],"11":[{"catchword":null,"tekst":"And I came to Jerusalem, and was there three days. [Compare Ezra 8.v.32.]"}],"12":[{"catchword":null,"tekst":"After that I gat me up in the night, I, and (some) few men with me, neither told I any man, what my God had given in mine heart to do to Jerusalem: neither was there any beast with me, save the beast that I rode upon."}],"13":[{"catchword":null,"tekst":"And I went out by night through the valley-gate, [That is, where this gate had formerly been, and was afterward set up again. See chap.3.13. So of the sequel] and beyond the Dragons Fountain, [or, Serpents Fountain. Some do understand by this, the fountain of the water of Siloa, which run very still and softly, likewise the creeping of the serpent or snake. See Isa.8 6. And below cha.3.16.] and to the dung-gate, [through which they carried forth the soil and filth of the city into the brook Kidron, as some conceive] and I brake off the walls of Jerusalem, which were torn, [to wit, properly to know what they lacked, and what was to be done to them Oth. I viewed the walls, etc. How they were torn, etc. So also, v.15.] and the gates thereof [to wit, of Jerusalem] were consumed with fire."}],"14":[{"catchword":null,"tekst":"And I went on to the Fountain-gate, [Through which they went to the Fountain of the water of Siloa, as some do gather from cha.3.15.] and to the kings pool; [see below chap.3.15,16. And 2 Kings 18.17. and 20.20.] but there was no place for the beast (that was) under me to pass. [by reason of the heaps of stones that lay in the way, occasioned by the wall that was fallen down and broken in pieces; so that he was sain to light, and go on foot.]"}],"15":[{"catchword":null,"tekst":"Then went I up in the night through [Oth. by] the brook, [Kidron. See thereof, 2 Sam.15.on v.23.] or Gihon. As others conceive. See thereof 2 Chron.32.30. and 33.14.] and I brake of the wall: see on vers.13.] and I turned backed, and came in through the valleygate, so I returned."}],"16":[{"catchword":null,"tekst":"And the Rulers knew not whither I was gone, and what I did: For hitherto I had made known nothing to the Jews, nor to the Priests, nor to the Nobles, [Heb. to the white ones; that is, that wore fine white garments, as great Lords did in Kings Courts. See Esth.8.15. So below chap.5.7. and 6.17. and 7.5. and 13.17.] nor to the Rulers, nor to the rest, [Hebr. The remnant] that did the work. [that is, the city-carpenters, or builders, or those to whom the oversight was committed, that had the command and authority over the workmen.]"}],"17":[{"catchword":null,"tekst":"Then said I unto them, ye see the misery that we are in, that Jerusalem lieth waste, and the gates thereof are burnt with fire: Come, and let us build up the wall of Jerusalem, that we be no more a reproach."}],"18":[{"catchword":null,"tekst":"And I acquainted them with the hand of my God, which had been good upon me, [Compare above vers.8.] as also with the words of the king, which he had spoken unto me? Then said they; let us arise that we may build; and they strengthened their hands for good. [that is, they took courage to go undauntedly about this good and commendable work.]"}],"19":[{"catchword":null,"tekst":"Now when Saneballat the Horonite, and Tobia the Ammonitish servant, and Gisem the Arabian heard this, then they mocked us, and despised us; and they said; what is this thing that ye do? Will ye rebel against the king."}],"20":[{"catchword":null,"tekst":"Then I gave them an answer, and said unto them; the God of heaven, he will cause us to prosper, and we his servants will arise and build: But ye have o portion, nor right, nor memorial in Jerusalem. [That is, as unbelieves and idolaters of old, ye have no fellowship or communion at all with the church of God, but are strangers from it, yea their Enemies, so that we have no cause at all to stand in awe of you.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
