eid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "Deut 27:12-26": "Dezen zullen staan om het volk te zegenen op de berg Gerizim, wanneer u over de Jordaan gegaan bent: Simeon, en Levi, en Juda, en Issaschar, en Jozef, en Benjamin. En dezen zullen staan voor de vervloeking op de berg Ebal: Ruben, Gad en Aser, Zebulon, Dan en Naftali. En de Levieten zullen zich uitspreken en zeggen tegen alle mannen van Israël, met verheven stem:", "Jes 57:17": "Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart.", "Zef 1:9": "Ook zal Ik op diezelfde dag bezoeking doen over allen die over de drempel springen; die het huis van hun heren vullen met geweld en bedrog.", "Ps 58:8": "Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren.", "Luk 6:24": "Maar wee u, rijken, want u hebt uw troost al gehad.", "1 Tim 6:19": "en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Ps 109:7": "Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden.", "Neh 5:3-5": "Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen. Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden. Nu is toch ons vlees als het vlees van onze broeders, onze kinderen zijn als hun kinderen; en zie, wij onderwerpen onze zonen en onze dochters tot slaven; ja, er zijn er al enkele van onze dochters onderworpen, zodat het niet in de macht van onze handen is hen vrij te kopen; en anderen hebben onze akkers en onze wijngaarden.", "Luk 18:25": "Want het is gemakkelijker dat een kameel door het oog van een naald gaat, dan dat een rijke het Koninkrijk van God ingaat.", "Gal 1:9": "Zoals wij al eerder gezegd hebben, zeg ik het nu ook weer: als iemand u een evangelie verkondigt naast wat u ontvangen hebt, laat hij vervloekt zijn.", "2 Kron 24:11": "Het gebeurde nu ter tijd, als hij de kist, naar het bevel van de koning, door de hand van de Levieten inbracht, en als zij zagen dat er veel van het geld was, dat de schrijver van de koning kwam, en de gestelde van de hoofdpriester, en de kist leegmaakten, en die opnamen, en die terugbrachten naar haar plaats; zo deden zij van dag tot dag, en verzamelden geld in overvloed;", "Deut 6:25": "En het zal ons gerechtigheid zijn, als wij ernaar streven al deze geboden te doen, voor het aangezicht van de HEERE, onze God, zoals Hij ons geboden heeft.", "Micha 7:4": "De beste van hen is als een doorn; de oprechtste is scherper dan een doornheg; de dag van uw wachters, uw bezoeking, is gekomen; nu zal hun verwarring zijn.", "Spr 17:26": "Het is niet goed, de rechtvaardige te straffen, laat staan dat men vorsten zou slaan om wat recht is.", "Ezech 45:9": "Zo zegt de Heere HEERE: Het is genoeg voor u, vorsten van Israël! Doe geweld en verwoesting weg, en doe recht en gerechtigheid; neem uw uitstotingen weg van Mijn volk, spreekt de Heere HEERE.", "Matt 28:14": "En als dit de stadhouder ter ore komt, zullen wij hem overtuigen, en zorgen dat u zonder zorgen bent.", "Gen 17:27": "En alle mannen van zijn huis, degenen die in het huis geboren waren, en degenen die met geld gekocht waren, van de vreemdeling af, werden met hem besneden.", "1 Sam 2:24": "Nee, mijn zonen; want dit is geen goed gerucht, dat ik hoor; u maakt dat het volk van de HEERE overtreedt.", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Matt 10:42": "En wie een van deze kleinen slechts een beker koud water te drinken geeft, in de naam van een discipel, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "Micha 2:2": "En zij begeren akkers en roven ze, en huizen, en nemen ze weg; zo doen zij de man en zijn huis geweld aan, ja, ieder en zijn erfenis.", "Jes 58:6": "Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt?", "1 Kor 4:2": "En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt.", "2 Kron 15:13": "En ieder die de HEERE, de God van Israël, niet zou zoeken, zou gedood worden, van klein tot groot, en van man tot vrouw toe.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "2 Kor 5:16": "Zo kennen wij van nu af aan niemand meer naar het vlees; en al hebben wij ook Christus naar het vlees gekend, toch kennen wij Hem nu niet meer naar het vlees.", "Gen 37:27": "Komt, laten wij hem aan deze Ismaëlieten verkopen, en onze hand zij niet aan hem; want hij is onze broer, ons vlees. En zijn broers stemden ermee in.", "Matt 19:23": "En Jezus zei tegen Zijn discipelen: Voorwaar, Ik zeg u, dat een rijke moeilijk in het Koninkrijk der hemelen zal ingaan.", "Ex 21:21": "Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.", "1 Petr 3:5": "Want zo versierden zichzelf vroeger ook de heilige vrouwen, die op God hoopten, en die hun eigen mannen onderdanig waren;", "Job 24:3-9": "De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand. Zij doen de behoeftigen wijken van de weg; samen verstoppen zich de ellendigen van het land. Zie, zij zijn woudezels in de woestijn; zij gaan uit tot hun werk, maken zich vroeg op om te roven; het vlakke veld is voedsel voor hem en voor de jongeren.", "Neh 1:1-11": "De geschiedenissen van Nehemia, zoon van Hachalja. En het gebeurde in de maand Chisleu, in het twintigste jaar, toen ik in de burcht Susan was, dat Hanani kwam, een van mijn broers, hij en enkele mannen uit Juda, en ik vroeg hen naar de Joden die ontkomen waren, die overgebleven waren van de gevangenschap, en naar Jeruzalem. En zij zeiden tegen mij: De overgeblevenen, die van de gevangenschap daar in het gebied zijn overgebleven, zijn in grote ellende en in smaad; en de muur van Jeruzalem is afgebroken, en haar poorten zijn met vuur verbrand.", "Ezech 18:17": "Zijn hand van de ellendige afhoudt, geen woeker noch overwinst neemt, Mijn rechten doet, en in Mijn inzettingen wandelt; die zal niet sterven om de ongerechtigheid van zijn vader; hij zal zeker leven.", "Deut 2:6": "Voedsel zult u voor geld van hen kopen, dat u eet; en ook zult u water voor geld van hen kopen, dat u drinkt.", "Ezra 6:6": "Nu dan, u Thathnai, landvoogd aan de overkant van de rivier, u Sthar-boznai, met uw gezelschap, u Afarsechaieten, die aan de overkant van de rivier zijn, blijf daar ver vandaan!", "Jer 15:15": "O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.", "Pred 4:13": "Beter is een arme en wijze jongeman, dan een oude en dwaze koning, die niet meer weet zich te laten vermanen.", "Deut 24:10-13": "Wanneer u aan uw naaste iets te leen geeft, zult u zijn huis niet binnengaan om zijn pand te pand te nemen; buiten zult u staan, en de man aan wie u geleend hebt, zal het pand naar buiten tot u brengen. Maar als hij een arme man is, zult u met zijn pand niet neerliggen.", "Zach 5:4": "Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Jak 3:13": "Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "2 Kron 28:15": "De mannen nu, die met naam genoemd zijn, stonden op en grepen de gevangenen, en kleedden van de roof allen die naakt onder hen waren; en zij kleedden hen, en gaven hun schoeisel, en gaven hun te eten en te drinken, en zalfden hen, en voerden allen die zwak waren op ezels, en brachten hen naar Jericho, de Palmstad, bij hun broeders; daarna keerden zij terug naar Samaria.", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "Rom 14:15": "Maar als uw broeder om het voedsel bedroefd wordt, dan wandelt u niet meer naar liefde. Breng hem niet ten verderve met uw voedsel, voor wie Christus gestorven is.", "2 Kron 28:9-13": "Daar nu was een profeet van de HEERE, wiens naam Oded was; die ging naar buiten, het leger tegemoet dat naar Samaria kwam, en zei tegen hen: Zie, door de grimmigheid van de HEERE, de God van uw vaderen, over Juda, heeft Hij hen in uw hand gegeven, en u hebt hen doodgeslagen in een toorn die tot aan de hemel raakt. Daartoe denkt u er nu aan om de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; bent u het zelf niet die schuldig staan? Bij u zijn schulden tegen de HEERE, uw God. Nu dan, luister naar mij, en breng de gevangenen terug die u van uw broeders gevankelijk hebt weggevoerd; want de hitte van de toorn van de HEERE is over u.", "Gen 13:8": "En Abram zei tegen Lot: Laat er toch geen twist zijn tussen mij en u, en tussen mijn herders en uw herders; want wij zijn broeders.", "1 Kor 5:11": "Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Hagg 2:13": "Zie, iemand draagt heilig vlees in de slip van zijn kleed, en hij raakt met zijn slip het brood aan, of het moes, of de wijn, of de olie, of enig voedsel, zal dat heilig worden? En de priesters antwoordden en zeiden: Nee.", "Matt 25:29": "Want ieder die heeft, aan hem zal gegeven worden, en hij zal overvloed hebben; maar van hem die niet heeft, van hem zal genomen worden ook wat hij heeft.", "Neh 5:10-15": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten. Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste deel van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt. Toen zeiden zij: Wij zullen het teruggeven en niets van hen eisen; wij zullen zo doen als u zegt. En ik riep de priesters en liet hen zweren dat zij zouden doen volgens dit woord.", "Luk 12:15-21": "En Hij zei tegen hen: Kijk uit en wees op uw hoede voor hebzucht; want het leven van iemand hangt niet af van de overvloed van zijn bezittingen. En Hij vertelde hun een gelijkenis: Het land van een rijke man had veel opgebracht; en hij overlegde bij zichzelf en zei: Wat zal ik doen, want ik heb geen plaats waar ik mijn vruchten kan verzamelen.", "Matt 8:9": "Want ik ben ook een mens onder het gezag van anderen, en heb soldaten onder mij; en ik zeg tegen deze: Ga! en hij gaat; en tegen de ander: Kom! en hij komt; en tegen mijn dienstknecht: Doe dit! en hij doet het.", "Luk 19:8": "En Zacheüs stond op en zei tegen de Heere: Zie, Heere, de helft van mijn bezit geef ik aan de armen; en als ik iemand iets door bedrog afhandig gemaakt heb, geef ik dat viervoudig terug.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Gen 17:23": "Toen nam Abraham zijn zoon Ismaël, en alle mannen die in zijn huis geboren waren, en alle die met zijn geld gekocht waren, alles wat mannelijk was onder de mensen van het huis van Abraham, en hij besneed het vlees van hun voorhuid, op diezelfde dag, zoals God met hem gesproken had.", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Lev 25:36": "U zult geen rente noch overwinst van hem nemen; maar u zult vrezen voor uw God, opdat uw broeder bij u leeft.", "Job 29:10": "De stem van de vorsten verstomde, en hun tong kleefde aan hun gehemelte.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Matt 25:34-40": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Richt 16:18": "Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.", "Job 27:7": "Mijn vijand zij als de goddeloze, en die zich tegen mij opmaakt, als de verkeerde.", "Ps 79:12": "En geef onze buren zevenvoudig terug in hun schoot hun smaad, waarmee zij U, o Heere, gesmaad hebben.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "2 Kron 6:22": "Wanneer iemand tegen zijn naaste zal gezondigd hebben, en die hem een eed van de vloek opgelegd zal hebben om zichzelf te vervloeken, en de eed van de vloek voor Uw altaar in dit huis komen zal;", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Luk 8:15": "En wat in de goede aarde valt, dat zijn zij die het Woord gehoord hebben en het in een eerlijk en goed hart bewaren, en met volharding vruchten voortbrengen.", "2 Kron 17:11": "En van de Filistijnen brachten zij Josafat geschenken met het opgelegde geld; ook brachten de Arabieren hem klein vee, zevenduizend en zevenhonderd rammen, en zevenduizend en zevenhonderd bokken.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "2 Petr 2:3": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Jer 32:10": "En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had.", "Mal 1:10": "Wie is er ook onder u, die de deuren voor niets toesluit? En u steekt het vuur niet aan op Mijn altaar voor niets. Ik heb geen behagen in u, zegt de HEERE van de heerscharen, en het spijsoffer is Mij van uw hand niet aangenaam.", "Pred 1:2-8": "Vluchtigheid der vluchtigheden, zegt de prediker; vluchtigheid der vluchtigheden, het is al vluchtig. Wat voordeel heeft de mens van al zijn arbeid, die hij verricht onder de zon? Het ene geslacht gaat, en het andere geslacht komt; maar de aarde blijft staan in eeuwigheid.", "Ex 21:1-11": "Dit zijn de rechtsregels die u hun moet voorstellen. Als u een Hebreeuwse knecht koopt, zal hij zes jaar dienen; maar in het zevende jaar zal hij vrij uitgaan, om niet. Als hij alleen gekomen is, zal hij alleen uitgaan; als hij een getrouwde man was, zal zijn vrouw met hem uitgaan.", "Matt 25:27": "Dan had u mijn geld naar de wisselaars moeten brengen, en zou ik bij mijn komst het mijne met rente teruggekregen hebben."}, "noten": {"1": "SV: dat zij in de macht onzer handen niet zijn (D.i.: dat wij niet in staat zijn hen vrij te kopen)"}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H6818\">Maar</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H6818\">het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H6818\">geroep</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H6818\">van</span> het volk <span class=\"wl\" data-l=\"L2\" data-code=\"H802\">en</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H802\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H802\">hun</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H802\">vrouwen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H802\">was</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1419\">groot</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H413\">tegen</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H413\">hun</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H251\">broeders</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H251\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3064\">Joden</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3426\">Want</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3426\">er</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3426\">waren</span> er <span class=\"wl\" data-l=\"L2\" data-code=\"H834\">die</span> <span class=\"wl\" data-l=\"L3\" data-code ss=\"wl\" data-l=\"L15\" data-code=\"H2088\">dit</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H2088\">het</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H3899\">brood</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H3899\">van</span> het landvoogdschap <span class=\"wl\" data-l=\"L17\" data-code=\"H3808\">niet</span> <span class=\"wl\" data-l=\"L18\" data-code=\"H1245\">gezocht</span>, <span class=\"wl\" data-l=\"L19\" data-code=\"H3588\">omdat</span> <span class=\"wl\" data-l=\"L19\" data-code=\"H3588\">de</span> <span class=\"wl\" data-l=\"L20\" data-code=\"H5656\">dienstbaarheid</span> <span class=\"wl\" data-l=\"L21\" data-code=\"H3513\">zwaar</span> <span class=\"wl\" data-l=\"L21\" data-code=\"H3513\">was</span> <span class=\"wl\" data-l=\"L22\" data-code=\"H5921\">over</span> dit <span class=\"wl\" data-l=\"L23\" data-code=\"H5971\">volk</span>.", "19": "<span class=\"wl\" data-l=\"L1\" data-code=\"H2142\">Gedenk</span> mij, <span class=\"wl\" data-l=\"L2\" data-code=\"H430\">mijn</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H430\">God</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H2896\">ten</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2896\">goede</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H3605\">alles</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H834\">wat</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5921\">ik</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5921\">voor</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H2088\">dit</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H5971\">volk</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H6213\">gedaan</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H6213\">heb</span>."}, "koppeling_kjv": {"1": "And there was a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> and of their <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> against their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the Jews.", "2": "For there <span class=\"wl wl-kjv\" data-code=\"H3426\">were</span> that <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We, our <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and our <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> are <span class=\"wl wl-kjv\" data-code=\"H7227\">many:</span> therefore we take <span class=\"wl wl-kjv\" data-code=\"H3947\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1715\">corn</span> for them, that we may <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and live.", "3": "Some also there <span class=\"wl wl-kjv\" data-code=\"H3426\">were</span> that <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We have <span class=\"wl wl-kjv\" data-code=\"H6148\">mortgaged</span> our <span class=\"wl wl-kjv\" data-code=\"H7704\">lands,</span> <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> and <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> that we might <span class=\"wl wl-kjv\" data-code=\"H3947\">buy</span> <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> because of the dearth.", "4": "There <span class=\"wl wl-kjv\" data-code=\"H3426\">were</span> also that <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We have <span class=\"wl wl-kjv\" data-code=\"H3867\">borrowed</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4060\">tribute,</span> and that upon our <span class=\"wl wl-kjv\" data-code=\"H7704\">lands</span> and vineyards.", "5": "Yet now our <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> is as the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of our <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> our <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> as their <span class=\"wl wl-kjv\" data-code=\"H1121\">children:</span> and, lo, we bring into <span class=\"wl wl-kjv\" data-code=\"H3533\">bondage</span> our <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and our <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> to be <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and some of our <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">are</span> brought unto <span class=\"wl wl-kjv\" data-code=\"H3533\">bondage</span> already: neither is it in our <span class=\"wl wl-kjv\" data-code=\"H410\">power</span> to redeem them; for other <span class=\"wl wl-kjv\" data-code=\"H312\">men</span> have our <span class=\"wl wl-kjv\" data-code=\"H7704\">lands</span> and vineyards.", "6": "And I was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">angry</span> when I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> their <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> and these words.", "7": "Then I <span class=\"wl wl-kjv\" data-code=\"H4427\">consulted</span> with <span class=\"wl wl-kjv\" data-code=\"H3820\">myself,</span> and I <span class=\"wl wl-kjv\" data-code=\"H7378\">rebuked</span> the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Ye <span class=\"wl wl-kjv\" data-code=\"H5378\">exact</span> <span class=\"wl wl-kjv\" data-code=\"H4855\">usury,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of his <span class=\"wl wl-kjv\" data-code=\"H251\">brother.</span> And I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> assembly", "8": "And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, We after our <span class=\"wl wl-kjv\" data-code=\"H1767\">ability</span> have <span class=\"wl wl-kjv\" data-code=\"H7069\">redeemed</span> our <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews,</span> which were <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen;</span> and will ye even <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren?</span> or shall they be <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> unto us? Then held they their <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> nothing", "9": "Also I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is not <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">that</span> ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> ought ye not to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> because of the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> our enemies?", "10": "I likewise, and my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and my <span class=\"wl wl-kjv\" data-code=\"H5288\">servants,</span> might <span class=\"wl wl-kjv\" data-code=\"H5383\">exact</span> of them <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> and <span class=\"wl wl-kjv\" data-code=\"H1715\">corn:</span> I pray you, let us leave <span class=\"wl wl-kjv\" data-code=\"H5800\">off</span> this usury.", "11": "<span class=\"wl wl-kjv\" data-code=\"H7725\">Restore,</span> I pray you, to them, even this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> their <span class=\"wl wl-kjv\" data-code=\"H7704\">lands,</span> their <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> their <span class=\"wl wl-kjv\" data-code=\"H2132\">oliveyards,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> also the <span class=\"wl wl-kjv\" data-code=\"H3967\">hundredth</span> part of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> the <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3323\">oil,</span> that ye exact", "12": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> they, We will <span class=\"wl wl-kjv\" data-code=\"H7725\">restore</span> them, and will <span class=\"wl wl-kjv\" data-code=\"H1245\">require</span> nothing of them; so will we <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> as thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest.</span> Then I <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and took an <span class=\"wl wl-kjv\" data-code=\"H7650\">oath</span> of them, that they should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to this promise.", "13": "Also I <span class=\"wl wl-kjv\" data-code=\"H5287\">shook</span> my <span class=\"wl wl-kjv\" data-code=\"H2684\">lap,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> So <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shake <span class=\"wl wl-kjv\" data-code=\"H5287\">out</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> from his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and from his <span class=\"wl wl-kjv\" data-code=\"H3018\">labour,</span> that <span class=\"wl wl-kjv\" data-code=\"H6965\">performeth</span> not this <span class=\"wl wl-kjv\" data-code=\"H1697\">promise,</span> even thus be he shaken <span class=\"wl wl-kjv\" data-code=\"H5287\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H7386\">emptied.</span> And all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H543\">Amen,</span> and <span class=\"wl wl-kjv\" data-code=\"H1984\">praised</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to this promise.", "14": "Moreover from the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> that I was <span class=\"wl wl-kjv\" data-code=\"H6680\">appointed</span> to be their <span class=\"wl wl-kjv\" data-code=\"H6346\">governor</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> from the <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirtieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H783\">Artaxerxes</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> that is, <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> I and my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> have not <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of the governor.", "15": "But the <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">governors</span> that had been <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me were <span class=\"wl wl-kjv\" data-code=\"H3513\">chargeable</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> of them <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">beside</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver;</span> yea, <span class=\"wl wl-kjv\" data-code=\"H1571\">even</span> their <span class=\"wl wl-kjv\" data-code=\"H5288\">servants</span> bare <span class=\"wl wl-kjv\" data-code=\"H7980\">rule</span> over the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> but so <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> not I, <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of God.", "16": "Yea, also I <span class=\"wl wl-kjv\" data-code=\"H2388\">continued</span> in the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> of this <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> neither <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> we any <span class=\"wl wl-kjv\" data-code=\"H7704\">land:</span> and all my <span class=\"wl wl-kjv\" data-code=\"H5288\">servants</span> were <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> thither unto the work.", "17": "Moreover there were at my <span class=\"wl wl-kjv\" data-code=\"H7979\">table</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> of the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> and <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> beside those that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto us from among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> that are about us.", "18": "Now that which was <span class=\"wl wl-kjv\" data-code=\"H6213\">prepared</span> for me <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> was <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H1305\">choice</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep;</span> also <span class=\"wl wl-kjv\" data-code=\"H6833\">fowls</span> were <span class=\"wl wl-kjv\" data-code=\"H6213\">prepared</span> for me, and once in <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">store</span> of all sorts of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine:</span> yet for <span class=\"wl wl-kjv\" data-code=\"H5973\">all</span> this <span class=\"wl wl-kjv\" data-code=\"H1245\">required</span> not I the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of the <span class=\"wl wl-kjv\" data-code=\"H6346\">governor,</span> because the <span class=\"wl wl-kjv\" data-code=\"H5656\">bondage</span> was <span class=\"wl wl-kjv\" data-code=\"H3513\">heavy</span> upon this people.", "19": "<span class=\"wl wl-kjv\" data-code=\"H2142\">Think</span> upon me, my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> for <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> according to all that I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> for this people."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
