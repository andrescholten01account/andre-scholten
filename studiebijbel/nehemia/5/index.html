2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Maar het geroep van het volk en van hun vrouwen was groot, tegen hun broeders, de Joden.","2":"Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven.","3":"Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.","4":"Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, *op* onze akkers en onze wijngaarden.","5":"Nu is toch ons vlees als het vlees van onze broeders, onze kinderen zijn als hun kinderen; en zie, wij onderwerpen onze zonen en onze dochters tot slaven; ja, er zijn er al enkele van onze dochters onderworpen, zodat het niet in de macht van onze handen is *hen vrij te kopen*[1]; en anderen hebben onze akkers en onze wijngaarden.","6":"Toen ik nu hun geroep en deze woorden hoorde, werd ik zeer boos.","7":"En mijn hart beraadslaagde in mij; daarna berispte ik de edelen en de overheden, en zei tegen hen: U vordert een last, ieder van zijn broeder. Vervolgens riep ik een grote vergadering tegen hen bijeen.","8":"En ik zei tegen hen: Wij hebben onze broeders, de Joden, die aan de heidenen verkocht waren, naar ons vermogen teruggekocht; en zouden u ook uw broeders verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij en vonden geen antwoord.","9":"Verder zei ik: De zaak die u doet, is niet goed; zou u niet wandelen in de vreze van onze God, om de smaad van de heidenen, onze vijanden?","10":"Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.","11":"Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste *deel* van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt.","12":"Toen zeiden zij: Wij zullen het teruggeven en niets van hen eisen; wij zullen zo doen als u zegt. En ik riep de priesters en liet hen zweren dat zij zouden doen volgens dit woord.","13":"Ook schudde ik mijn boezem uit, en zei: Zo schudde God uit iedere man die dit woord niet zal nakomen, uit zijn huis en uit zijn arbeid, en hij worde zo uitgeschud en leeg. En de hele gemeente zei: Amen! En zij prezen de HEERE. En het volk deed volgens dit woord.","14":"Ook heb ik, van de dag af dat hij mij bevolen heeft hun landvoogd te zijn in het land Juda, van het twintigste jaar af tot het tweeëndertigste jaar van koning Arthahsasta, dat is twaalf jaar, samen met mijn broeders het brood van het landvoogdschap niet gegeten.","15":"En de vorige landvoogden, die vóór mij geweest zijn, hebben het volk bezwaard en van hen genomen aan brood en wijn, daarna veertig zilveren sikkels; ook heersten hun knechten over het volk; maar ik heb dat niet gedaan, om de vreze van God.","16":"Daartoe heb ik ook aan het werk van deze muur gewerkt, en wij hebben geen land gekocht; en al mijn knechten zijn daar verzameld geweest tot het werk.","17":"Ook zijn van de Joden en van de overheden honderdvijftig man, en zij die van de heidenen die rondom ons zijn tot ons kwamen, aan mijn tafel geweest.","18":"En wat voor een dag klaargemaakt werd, was één os *en* zes uitgelezen schapen; ook werden voor mij vogels klaargemaakt, en om de tien dagen zeer veel van allerlei wijn; toch heb ik ondanks dit het brood van het landvoogdschap niet gezocht, omdat de dienstbaarheid zwaar was over dit volk.","19":"Gedenk mij, mijn God, ten goede, alles wat ik voor dit volk gedaan heb."},"SV":{"1":"Maar het geroep des volks en hunner vrouwen was groot, tegen hun broederen, de Joden.","2":"Want er waren, die zeiden: Onze zonen, en onze dochteren, wij zijn velen; daarom hebben wij koren opgenomen, opdat wij eten en leven.","3":"Ook waren er, die zeiden: Wij verpanden onze akkers, en onze wijngaarden, en onze huizen, opdat wij in dezen honger koren mogen opnemen.","4":"Desgelijks waren er, die zeiden: Wij hebben geld ontleend tot des konings cijns, *op* onze akkers en onze wijngaarden.","5":"Nu is toch ons vlees als het vlees onzer broederen, onze kinderen zijn als hun kinderen; en ziet, wij onderwerpen onze zonen en onze dochteren tot dienstknechten; ja, er zijn enige van onze dochteren onderworpen, dat zij in de macht onzer handen niet zijn; en anderen hebben onze akkers en onze wijngaarden.","6":"Toen ik nu hun geroep en deze woorden hoorde, ontstak ik zeer.","7":"En mijn hart beraadslaagde in mij; daarna twistte ik met de edelen, en met de overheden, en zeide tot hen: Gijlieden vordert een last, een iegelijk van zijn broeder. Voorts belegde ik een grote vergadering tegen hen.","8":"En ik zeide tot hen: Wij hebben onze broederen, de Joden, die aan de heidenen verkocht waren, naar ons vermogen wedergekocht; en zoudt gijlieden ook uw broederen verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij, en vonden geen antwoord.","9":"Voorts zeide ik: De zaak is niet goed, die gijlieden doet; zoudt gij niet wandelen in de vreze onzes Gods, om de versmading der heidenen, onze vijanden?","10":"Ik, mijn broederen, en mijn jongens, vorderen wij ook geld en koren van hen? Laat ons toch dezen last nalaten.","11":"Geeft hun toch als heden weder hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen; en het honderdste *deel* van het geld, en van het koren, den most en de olie, die gij hun hebt afgevorderd.","12":"Toen zeiden zij: Wij zullen het wedergeven, en van hen niets zoeken; wij zullen alzo doen, als gij zegt. En ik riep de priesteren, en deed hen zweren, dat zij doen zouden naar dit woord.","13":"Ook schudde ik mijn boezem uit, en zeide: Alzo schudde God uit allen man, die dit woord niet zal bevestigen, uit zijn huis en uit zijn arbeid, en hij zij alzo uitgeschud en ledig. En de ganse gemeente zeide: Amen! En zij prezen de HEERE. En het volk deed naar dit woord.","14":"Ook van dien dag af, dat hij mij bevolen heeft hun landvoogd te zijn in het land Juda, van het twintigste jaar af, tot het twee en dertigste jaar van den koning Arthahsasta, zijnde twaalf jaren, heb ik, met mijn broederen, het brood des landvoogds niet gegeten.","15":"En de vorige landvoogden, die voor mij geweest zijn, hebben het volk bezwaard, en van hen genomen aan brood en wijn, daarna veertig zilveren sikkelen; ook heersten hun jongens over het volk; maar ik heb alzo niet gedaan, om der vreze Gods wil.","16":"Daartoe heb ik ook aan het werk dezes muurs verbeterd, en wij hebben geen land gekocht; en al mijn jongens zijn aldaar verzameld geweest tot het werk.","17":"Ook zijn van de Joden en van de overheden honderd en vijftig man, en die van de heidenen, die rondom ons zijn, tot ons kwamen, aan mijn tafel geweest.","18":"En wat voor een dag bereid werd, was een os *en* zes uitgelezen schapen; ook werden mij vogelen bereid, en binnen tien dagen van allen wijn zeer veel; nog heb ik bij dezen het brood des landvoogds niet gezocht, omdat de dienstbaarheid zwaar was over dit volk.","19":"Gedenk mijner, mijn God, ten goede, alles, wat ik aan dit volk gedaan heb."},"KJV":{"1":"And there was a great cry of the people and of their wives against their brethren the Jews.","2":"For there were that said, We, our sons, and our daughters, *are* many: therefore we take up corn *for them*, that we may eat, and live.","3":"*Some* also there were that said, We have mortgaged our lands, vineyards, and houses, that we might buy corn, because of the dearth.","4":"There were also that said, We have borrowed money for the king's tribute, *and that upon* our lands and vineyards.","5":"Yet now our flesh *is* as the flesh of our brethren, our children as their children: and, lo, we bring into bondage our sons and our daughters to be servants, and *some* of our daughters are brought unto bondage *already*: neither *is it* in our power *to redeem them*; for other men have our lands and vineyards.","6":"And I was very angry when I heard their cry and these words.","7":"Then I consulted with myself, and I rebuked the nobles, and the rulers, and said unto them, Ye exact usury, every one of his brother. And I set a great assembly","8":"And I said unto them, We after our ability have redeemed our brethren the Jews, which were sold unto the heathen; and will ye even sell your brethren? or shall they be sold unto us? Then held they their peace, and found nothing","9":"Also I said, It *is* not good that ye do: ought ye not to walk in the fear of our God because of the reproach of the heathen our enemies?","10":"I likewise, *and* my brethren, and my servants, might exact of them money and corn: I pray you, let us leave off this usury.","11":"Restore, I pray you, to them, even this day, their lands, their vineyards, their oliveyards, and their houses, also the hundredth *part* of the money, and of the corn, the wine, and the oil, that ye exact","12":"Then said they, We will restore *them*, and will require nothing of them; so will we do as thou sayest. Then I called the priests, and took an oath of them, that they should do according to this promise.","13":"Also I shook my lap, and said, So God shake out every man from his house, and from his labour, that performeth not this promise, even thus be he shaken out, and emptied. And all the congregation said, Amen, and praised the LORD. And the people did according to this promise.","14":"Moreover from the time that I was appointed to be their governor in the land of Judah, from the twentieth year even unto the two and thirtieth year of Artaxerxes the king, *that is*, twelve years, I and my brethren have not eaten the bread of the governor.","15":"But the former governors that *had been* before me were chargeable unto the people, and had taken of them bread and wine, beside forty shekels of silver; yea, even their servants bare rule over the people: but so did not I, because of the fear of God.","16":"Yea, also I continued in the work of this wall, neither bought we any land: and all my servants *were* gathered thither unto the work.","17":"Moreover *there were* at my table an hundred and fifty of the Jews and rulers, beside those that came unto us from among the heathen that *are* about us.","18":"Now *that* which was prepared *for me* daily *was* one ox *and* six choice sheep; also fowls were prepared for me, and once in ten days store of all sorts of wine: yet for all this required not I the bread of the governor, because the bondage was heavy upon this people.","19":"Think upon me, my God, for good, *according* to all that I have done for this people."}},"tsk":{"1":[{"kopje":"het geroep","refs":["Ex 3:7","Ex 22:25-27","Job 31:38","Job 31:39","Job 34:28","Jes 5:7","Luk 18:7","Jak 5:4"]},{"kopje":"hun broeders","refs":["Lev 25:35-37","Deut 15:7-11","Hand 7:26","1 Kor 6:6-8"]}],"2":[{"kopje":"onze zonen","refs":["Ps 127:3-5","Ps 128:2-4","Mal 2:2"]},{"kopje":"wij koren opgenomen","refs":["Gen 41:57","Gen 42:2","Gen 43:8"]}],"3":[{"kopje":"verpanden","refs":["Gen 47:15-25","Lev 25:35-39","Deut 15:7"]},{"kopje":"opdat","refs":["Mal 3:8-11"]}],"4":[{"kopje":"de belasting van de konin an class=\"wl wl-kjv\" data-code=\"H3947\">buy</span> <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> because of the dearth.","4":"There <span class=\"wl wl-kjv\" data-code=\"H3426\">were</span> also that <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We have <span class=\"wl wl-kjv\" data-code=\"H3867\">borrowed</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4060\">tribute,</span> and that upon our <span class=\"wl wl-kjv\" data-code=\"H7704\">lands</span> and vineyards.","5":"Yet now our <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> is as the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of our <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> our <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> as their <span class=\"wl wl-kjv\" data-code=\"H1121\">children:</span> and, lo, we bring into <span class=\"wl wl-kjv\" data-code=\"H3533\">bondage</span> our <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and our <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> to be <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and some of our <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">are</span> brought unto <span class=\"wl wl-kjv\" data-code=\"H3533\">bondage</span> already: neither is it in our <span class=\"wl wl-kjv\" data-code=\"H410\">power</span> to redeem them; for other <span class=\"wl wl-kjv\" data-code=\"H312\">men</span> have our <span class=\"wl wl-kjv\" data-code=\"H7704\">lands</span> and vineyards.","6":"And I was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">angry</span> when I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> their <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> and these words.","7":"Then I <span class=\"wl wl-kjv\" data-code=\"H4427\">consulted</span> with <span class=\"wl wl-kjv\" data-code=\"H3820\">myself,</span> and I <span class=\"wl wl-kjv\" data-code=\"H7378\">rebuked</span> the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Ye <span class=\"wl wl-kjv\" data-code=\"H5378\">exact</span> <span class=\"wl wl-kjv\" data-code=\"H4855\">usury,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of his <span class=\"wl wl-kjv\" data-code=\"H251\">brother.</span> And I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> assembly","8":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, We after our <span class=\"wl wl-kjv\" data-code=\"H1767\">ability</span> have <span class=\"wl wl-kjv\" data-code=\"H7069\">redeemed</span> our <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews,</span> which were <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen;</span> and will ye even <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren?</span> or shall they be <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> unto us? Then held they their <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> nothing","9":"Also I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is not <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">that</span> ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> ought ye not to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> because of the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> our enemies?","10":"I likewise, and my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and my <span class=\"wl wl-kjv\" data-code=\"H5288\">servants,</span> might <span class=\"wl wl-kjv\" data-code=\"H5383\">exact</span> of them <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> and <span class=\"wl wl-kjv\" data-code=\"H1715\">corn:</span> I pray you, let us leave <span class=\"wl wl-kjv\" data-code=\"H5800\">off</span> this usury.","11":"<span class=\"wl wl-kjv\" data-code=\"H7725\">Restore,</span> I pray you, to them, even this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> their <span class=\"wl wl-kjv\" data-code=\"H7704\">lands,</span> their <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> their <span class=\"wl wl-kjv\" data-code=\"H2132\">oliveyards,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> also the <span class=\"wl wl-kjv\" data-code=\"H3967\">hundredth</span> part of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> the <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3323\">oil,</span> that ye exact","12":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> they, We will <span class=\"wl wl-kjv\" data-code=\"H7725\">restore</span> them, and will <span class=\"wl wl-kjv\" data-code=\"H1245\">require</span> nothing of them; so will we <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> as thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest.</span> Then I <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and took an <span class=\"wl wl-kjv\" data-code=\"H7650\">oath</span> of them, that they should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to this promise.","13":"Also I <span class=\"wl wl-kjv\" data-code=\"H5287\">shook</span> my <span class=\"wl wl-kjv\" data-code=\"H2684\">lap,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> So <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shake <span class=\"wl wl-kjv\" data-code=\"H5287\">out</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> from his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and from his <span class=\"wl wl-kjv\" data-code=\"H3018\">labour,</span> that <span class=\"wl wl-kjv\" data-code=\"H6965\">performeth</span> not this <span class=\"wl wl-kjv\" data-code=\"H1697\">promise,</span> even thus be he shaken <span class=\"wl wl-kjv\" data-code=\"H5287\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H7386\">emptied.</span> And all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H543\">Amen,</span> and <span class=\"wl wl-kjv\" data-code=\"H1984\">praised</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to this promise.","14":"Moreover from the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> that I was <span class=\"wl wl-kjv\" data-code=\"H6680\">appointed</span> to be their <span class=\"wl wl-kjv\" data-code=\"H6346\">governor</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> from the <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirtieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H783\">Artaxerxes</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> that is, <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> I and my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> have not <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of the governor.","15":"But the <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">governors</span> that had been <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me were <span class=\"wl wl-kjv\" data-code=\"H3513\">chargeable</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> of them <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">beside</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver;</span> yea, <span class=\"wl wl-kjv\" data-code=\"H1571\">even</span> their <span class=\"wl wl-kjv\" data-code=\"H5288\">servants</span> bare <span class=\"wl wl-kjv\" data-code=\"H7980\">rule</span> over the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> but so <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> not I, <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of God.","16":"Yea, also I <span class=\"wl wl-kjv\" data-code=\"H2388\">continued</span> in the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> of this <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> neither <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> we any <span class=\"wl wl-kjv\" data-code=\"H7704\">land:</span> and all my <span class=\"wl wl-kjv\" data-code=\"H5288\">servants</span> were <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> thither unto the work.","17":"Moreover there were at my <span class=\"wl wl-kjv\" data-code=\"H7979\">table</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> of the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> and <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> beside those that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto us from among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> that are about us.","18":"Now that which was <span class=\"wl wl-kjv\" data-code=\"H6213\">prepared</span> for me <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> was <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H1305\">choice</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep;</span> also <span class=\"wl wl-kjv\" data-code=\"H6833\">fowls</span> were <span class=\"wl wl-kjv\" data-code=\"H6213\">prepared</span> for me, and once in <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">store</span> of all sorts of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine:</span> yet for <span class=\"wl wl-kjv\" data-code=\"H5973\">all</span> this <span class=\"wl wl-kjv\" data-code=\"H1245\">required</span> not I the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of the <span class=\"wl wl-kjv\" data-code=\"H6346\">governor,</span> because the <span class=\"wl wl-kjv\" data-code=\"H5656\">bondage</span> was <span class=\"wl wl-kjv\" data-code=\"H3513\">heavy</span> upon this people.","19":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Think</span> upon me, my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> for <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> according to all that I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> for this people."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"broederen,","tekst":"Versta, voor het merendeel de rijken en machtigen, die met woekeren en panden de gemeente uitzogen en verdrukten, gelijk volgt."}],"2":[{"catchword":"daarom","tekst":"Anders, laat ons dan koren opnemen, enz."}],"3":[{"catchword":"honger","tekst":"Deze duurte en nood des volks kan eendeels daaruit gesproten zijn, dat zij, gedurende dit bouwen, hun huiszorg hebben moeten nalaten; anderdeels, omdat zij uit vrees van den vijand van buiten niet konden inhalen."}],"4":[{"catchword":"tot des konings cijns,","tekst":"Om dien te mogen betalen; zie daarvan Ezr 4:13 ; hiervan waren alleen de priesters, Levieten en andere bedienaars des tempels vrij, Ezr 7:24 ."}],"5":[{"catchword":"vlees als het vlees","tekst":"Dat is, wij gelden voor God zoveel als zij, want wij, zowel als zij, zijn Abrahams zaad en Gods bondgenoten."},{"catchword":"dienstknechten;","tekst":"Versta daarbij, en dienstmaagden."},{"catchword":"dat zij in de macht","tekst":"Anders, en het is in de macht onzer handen niet [die te lossen], want, enz."}],"6":[{"catchword":"ontstak ik zeer","tekst":"Hebreeuws, mij ontstak zeer; te weten, de toorn."}],"7":[{"catchword":"edelen,","tekst":"Hebreeuws, witten; zie boven, Neh 2:16 ."},{"catchword":"vordert","tekst":"Of, legt op, perst af, overdringt. Anders, gij leent, een ieder zijn broeder, [met] last; en zo in het volgende."},{"catchword":"een last,","tekst":"Versta door dezen last den woeker en de verzetting of verpanding van goederen en mensen."},{"catchword":"belegde ik","tekst":"Hebreeuws eigenlijk, ik gaf; dat is, ik stelde een grote bijeenkomst aan."}],"8":[{"catchword":"verkocht waren,","tekst":"Dit was, vermoedelijk, van de Babyloniërs gedaan."},{"catchword":"naar ons vermogen","tekst":"Hebreeuws, naar de genoegzaamheid in, of bij, of, onder ons, dat is, zoveel, ons mogelijk was."},{"catchword":"wedergekocht;","tekst":"Zie Lev 25:47-49 ."}],"9":[{"catchword":"de versmading","tekst":"Dat is, om den heidenen, die Gods en onze vijanden zijn, geen oorzaak te geven van Gods naam te lasteren, en ons smadelijk te verwijten dat wij aan elkander doen hetgeen wij in hun misprezen en gehaat hebben."}],"10":[{"catchword":"vorderen","tekst":"Zie vs.7. Nehemia wil zeggen dat hij de gemeente in alle manieren verschoonde en dat zij desgelijks behoorden te doen."},{"catchword":"last nalaten","tekst":"Gelijk boven, vs.7."}],"11":[{"catchword":"honderdste","tekst":"Dit hadden zij genomen van hun broeders, tegen de wet; Exo 22:25 ; Lev 25:36 ; Deu 23:19 ."},{"catchword":"die gij","tekst":"Anders, die gij hun geleend hebt."}],"12":[{"catchword":"priesteren,","tekst":"Om den eed hun af te nemen, of om getuigen daarvan te zijn, en door hun tegenwoordigheid de conscientiën te meer voor God te verplichten; zie 1Ki 8:31-32 ; Num 5:19 ."}],"13":[{"catchword":"schudde","tekst":"Eene ceremonie bj den eed en vervloeking te dien tijde gebruikt."},{"catchword":"boezem","tekst":"Anders, mijn arm; dat is, mijn mouw; of, ik schudde mijn mantel uit, mijn arm meteen uitstrekkende."},{"catchword":"arbeid,","tekst":"Dat is, uit zijn goed en have, die hij met zijn arbeid mag hebben verkregen."},{"catchword":"Amen","tekst":"Zie Num 5:22 ."}],"14":[{"catchword":"hij mij","tekst":"De koning Arthasasta, of, God door den koning."},{"catchword":"Arthahsasta,","tekst":"Zie Ezr 6:14 ."},{"catchword":"brood","tekst":"Dat is, het onderhoud, dat de koning den landvoogden heeft toegelegd, en ik zowel als mijn voorzaten had mogen genieten."}],"15":[{"catchword":"daarna","tekst":"Of, benevens, behalve."},{"catchword":"sikkelen;","tekst":"Te weten, voor elken dag. Van sikkelen, zie Gen 20:16 ."}],"16":[{"catchword":"verbeterd,","tekst":"Gelijk boven, Neh 4 doorgaans."},{"catchword":"verzameld","tekst":"De ene helft om te arbeiden, de andere helft om wacht te houden in de wapenen. Zie boven, Neh 4:16 ."}],"17":[{"catchword":"kwamen,","tekst":"Om den godsdienst bij te wonen, of nodige berichten over te brengen."}],"18":[{"catchword":"schapen;","tekst":"Geiten daaronder begrepen."},{"catchword":"van","tekst":"Versta, daarbij werd er provisie gedaan; of, men schonk om den tienden dag wijn, zonder maat, daar men anders denzelven gewoonlijk bij zekere maat gaf."},{"catchword":"allen wijn","tekst":"Dat is, allerlei."},{"catchword":"bij dezen","tekst":"Dat is, aldus doende, niettegenstaande ik zulke onkosten deed."},{"catchword":"brood","tekst":"Gelijk boven, vs.14."}],"19":[{"catchword":"alles,","tekst":"Niet omdat ik daarmede iets verdiend heb, maar omdat Gij genadiglijk en zeer mildelijk beloofd hebt te belonen wat men goeds aan uw volk doet. Vergelijk Neh 13:22 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But the cry of the people, and of their wives was great; against their brethren the jews. [Understand for the most part, the rich and mighty ones, who by usury and pawns, drained out and oppressed the common sort of people, as followeth.]"}],"2":[{"catchword":null,"tekst":"For there were that said, We, our sons, and our daughetsr, we are many: Therefore we have taken up corn that we might eat and live. [Oth. Let us take up corn, that we may, etc.]"}],"3":[{"catchword":null,"tekst":"There were also that said, We morgage our fields, and our vineyards, and our houses, that we may take up corn in this famine. [This deareth and distress of the people may partly have risen from thence, that all the while this building lasted, they were constrained to omit and neglect the taking care to lay up in store for their own families, and partly because through fear of the enemy they could not fetch in provision from abroad.]"}],"4":[{"catchword":null,"tekst":"Likewise there were that said; We have borrowed money for the kings tribute; [That we might pay it. See thereof Ezra 4.13. from this were onely the Priests, Levites, and other ministers of the Temple exempted, Ezra 7.24.] (upon) our fields and our vineyards."}],"5":[{"catchword":null,"tekst":"Yet now our flesh is as the flesh of our brethren, [That is, we are in Gods account as much as they; for we are Abrahams seed, and in covenant with God, as well as they] our children are their children; and lo, we subject our sons and our daughters (to be) bond-men; [Understand withal, and bond-women] yea, there be some of our daughters subject, (so) that they are not in the power of our hands; and others have our fields, and our vineyards. [Oth. and it is not in the power of our hands (to redeem them) for others have, etc.]"}],"6":[{"catchword":null,"tekst":"Now when I heard their cry, and those words, I was kindled greatly. [Hebr. To me kindled greatly, to wit, anger.]"}],"7":[{"catchword":null,"tekst":"And my heart consulted in me; then I contended with the Nobles, [Hebr. White ones. See above chap.2.on verse 16.] and with the Rulers, and said unto them; Ye exact [or, impose, wring from, exort] a burden [Understand by this burden, usury, and the morgaging or pawning of goods and men] every one of his brother: [Oth. the land, every one unto his brother (with a) burden; and so in the sequel] moreover, I laid a great assembly, [Hebr. Properly I gave; that is, I appointed a great assembly] against them."}],"8":[{"catchword":null,"tekst":"And I said unto them, we, after our ability, [Heb. after the sufficiency (that was) in, or by or under us; that is, as much as lay in our power] have redeemed our brethren the jews, [See Levit.25.47,48,49.] that were sold unto the heathen: [This peradventure, was done by the Babylonians] and would ye also sell your brethren, or should they be sold unto us? Then they held their peace, and found no answer."}],"9":[{"catchword":null,"tekst":"I said moreover, the thing is not good which ye do, Ought ye not to walk in the fear of our God, because of the reproach of the heathen, our enemies? [That is, that ye may not give occasion to the heathen, that are both Gods and our enemies, to blaspheme the Name of God, and to upbraid us contumeliously, that we do unto each other, which we hated and discommended in them.]"}],"10":[{"catchword":null,"tekst":"I, my brethren, and my youths, do we also exact, [See on verse 7.] money and corn of them? [Nehemia doth intimate in these words, that he favoured the communalty all manner of ways, and that they ought to do so too] I pray let us leave off this burden. [As above verse 7.]"}],"11":[{"catchword":null,"tekst":"Restore, I pray you, to them this day, their fields, their vineyards, their olive-yards, and their houses; and the hundredth (part) of the money, and of the corn, the wine, and the oil which ye have exacted of them. [They had taken these things from their brethren, contrary to the law, Exo 22:25. Levit.25.36. Deut.23.19. Oth. which ye have lent them.]"}],"12":[{"catchword":null,"tekst":"Then said they, We will restore it, and require nothing of them, we will do so as thou sayest: and I called the priests, [To take the oath of them, or, to be witnesses thereof, and by their presence to oblige their consciences the more in the sight of God. See 1 Kings 8.31,32. Num 5:19.] and made them swear, that they would do according to this word."}],"13":[{"catchword":null,"tekst":"Also I shook out my lap, [Oth. mine arm; that is, my sleeve, or I shook out my mantle, putting out mine arm all under one. This was a kind of ceremony that was used in those times in, or with an oath or curse,] and said, So God shake out all (or every) man from his house, and from // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
