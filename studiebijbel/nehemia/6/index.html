kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Verder gebeurde het, toen Sanballat, Tobia, Gesem de Arabier en onze andere vijanden hoorden dat ik de muur gebouwd had en dat er geen scheur meer in over was — hoewel ik tot die tijd toe de deuren nog niet in de poorten had opgezet —","2":"dat Sanballat en Gesem naar mij stuurden om te zeggen: Kom, laten wij samen bijeenkomen in de dorpen, in het dal Ono. Maar zij waren van plan mij kwaad te doen.","3":"Ik echter stuurde boden naar hen om te zeggen: Ik ben bezig met een groot werk, zodat ik niet kan afkomen; waarom zou dit werk stilvallen doordat ik het zou laten liggen en naar u af zou komen?","4":"Zij stuurden nu wel vier keer op dezelfde manier naar mij, en ik antwoordde hun elke keer op dezelfde manier.","5":"Toen stuurde Sanballat voor de vijfde keer op dezelfde manier zijn knecht naar mij, met een open brief in zijn hand.","6":"Daarin stond geschreven: Onder de volken wordt gezegd, en Gasmu bevestigt het, dat u en de Joden van plan zijn in opstand te komen; daarom bouwt u de muur, en zou u hun koning worden — zo luiden de geruchten.","7":"En dat u ook profeten hebt aangesteld om over u in Jeruzalem uit te roepen: Er is een koning in Juda! Nu zal dit de koning ter ore komen, gezien deze berichten; kom dan nu, en laten wij samen overleggen.","8":"Maar ik stuurde hem het antwoord: Van al zulke dingen als u zegt, is niets gebeurd; u verzint ze zelf, uit uw eigen hart.","9":"Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!","10":"Toen ik in het huis kwam van Semaja, de zoon van Delaja, de zoon van Mehetabeel — hij was namelijk opgesloten — zei hij: Laten wij samenkomen in het huis van God, binnen in de tempel, en laten wij de deuren van de tempel sluiten; want zij zullen komen om u te doden, ja, 's nachts zullen zij komen om u te doden.","11":"Maar ik zei: Zou een man als ik vluchten? En wie zou, in mijn positie, de tempel ingaan om zijn leven te redden? Ik ga er niet in.","12":"Want ik merkte dat God hem niet gestuurd had; hij had deze profetie tegen mij uitgesproken, omdat Tobia en Sanballat hem gehuurd hadden.","13":"Daarom was hij gehuurd, opdat ik bang zou worden en zo zou handelen en zondigen, zodat zij iets zouden hebben voor een kwaad gerucht, om mij te honen.","14":"Denk toch, mijn God, aan Tobia en aan Sanballat, naar deze daden van hen; en ook aan de profetes Noadja en de andere profeten, die mij bang hebben proberen te maken.","15":"De muur nu werd voltooid op de vijfentwintigste van Elul, in tweeënvijftig dagen.","16":"En het gebeurde, toen al onze vijanden dit hoorden, dat alle heidenvolken die rondom ons waren, bevreesd werden en zeer in aanzien daalden in hun eigen ogen; want zij begrepen dat dit werk door onze God tot stand gebracht was.","17":"Ook stuurden in die dagen edelen van Juda veel brieven naar Tobia, en de brieven van Tobia kwamen bij hen aan.","18":"Want velen in Juda hadden hem gezworen trouw te zijn, omdat hij een schoonzoon was van Sechanja, de zoon van Arah; en zijn zoon Johanan had de dochter van Mesullam, de zoon van Berechja, tot vrouw genomen.","19":"Ook vertelden zij mij over zijn goede daden, en mijn woorden brachten zij aan hem over. Tobia dan stuurde brieven om mij bang te maken."},"SV":{"1":"Voorts is het geschied, als van Sanballat, en Tobia, en van Gesem, den Arabiër, en van onze andere vijanden gehoord was, dat ik den muur gebouwd had, en dat geen scheur daarin was overgelaten; ook had ik tot dezen tijd toe de deuren niet opgezet in de poorten;","2":"Zo zond Sanballat, en Gesem, tot mij, om te zeggen: Kom en laat ons te zamen vergaderen in de dorpen, in het dal Ono. Maar zij dachten mij kwaad te doen.","3":"En ik zond boden tot hen, om te zeggen: Ik doe een groot werk, zodat ik niet zal kunnen afkomen; waarom zou dit werk ophouden, terwijl ik het zou nalaten, en tot ulieden afkomen?","4":"Zij zonden nu *wel* viermaal tot mij, op dezelfde wijze. En ik antwoordde hun op dezelfde wijze.","5":"Toen zond Sanballat tot mij op dezelfde wijze, ten vijfden male, zijn jongen, met een open brief in zijn hand.","6":"Daarin was geschreven: Het is onder de volken gehoord, en Gasmu zegt: Gij en de Joden denkt te rebelleren, daarom bouwt gij den muur, en gij zult hun ten koning zijn; naar dat deze zaken zijn.","7":"Dat gij ook profeten hebt besteld, om van u te Jeruzalem uit te roepen, zeggende: Hij is koning in Juda. Nu zal het van den koning gehoord worden, naar dat deze zaken zijn; kom dan nu, en laat ons te zamen raadslaan.","8":"Doch ik zond tot hem, om te zeggen: Er is van al zulke zaken, als gij zegt, niets geschied; maar gij versiert ze uit uw hart.","9":"Want zij allen zochten ons vreesachtig te maken, zeggende: Hun handen zullen van het werk aflaten, dat het niet zal gedaan worden; nu dan, sterk mijn handen!","10":"Als ik nu kwam in het huis van Semaja, den zoon van Delaja, den zoon van Mehetabeel ( hij nu was besloten), zo zeide hij: Laat ons samenkomen in het huis Gods, in het midden des tempels, en laat ons de deuren des tempels toesluiten; want zij zullen komen om u te doden, ja, bij nacht zullen zij komen, om u te doden.","11":"Maar ik zeide: Zou een man, als ik, vlieden? En wie is er, zijnde als ik, die in den tempel zou gaan, dat hij levend bleve? Ik zal er niet ingaan.","12":"Want ik merkte, en ziet, God had hem niet gezonden; maar hij sprak deze profetie tegen mij, omdat Tobia en Sanballat hem gehuurd hadden.","13":"Daarom was hij gehuurd, opdat ik zou vrezen, en alzo doen, en zondigen; opdat zij iets zouden hebben tot een kwaden naam, opdat zij mij zouden honen.","14":"Gedenk, mijn God, aan Tobia en aan Sanballat, naar deze zijn werken; en ook aan de profetes Noadja, en aan de andere profeten, die mij gezocht hebben vreesachtig te maken.","15":"De muur nu werd volbracht, op den vijf en twintigsten van Elul, in twee en vijftig dagen.","16":"En het geschiedde, als al onze vijanden *dit* hoorden, zo vreesden al de heidenen, die rondom ons waren, en zij vervielen zeer in hun ogen; want zij merkten, dat dit werk van onzen God gedaan was.","17":"Ook schreven in die dagen edelen van Juda vele brieven, die naar Tobia gingen; en die van Tobia kwamen tot hen.","18":"Want velen in Juda hadden hem gezworen, omdat hij was een schoonzoon van Sechanja, den zoon van Arah; en zijn zoon Johanan had genomen de dochter van Mesullam, den zoon van Berechja.","19":"Ook verhaalden zij zijn goeddadigheden voor mijn aangezicht, en mijn woorden brachten zij uit tot hem. Tobia *dan* zond brieven, om mij vreesachtig te maken."},"KJV":{"1":"Now it came to pass, when Sanballat, and Tobiah, and Geshem the Arabian, and the rest of our enemies, heard that I had builded the wall, and *that* there was no breach left therein; (though at that time I had not set up the doors upon the gates;)","2":"That Sanballat and Geshem sent unto me, saying, Come, let us meet together in *some one of* the villages in the plain of Ono. But they thought to do me mischief.","3":"And I sent messengers unto them, saying, I *am* doing a great work, so that I cannot come down: why should the work cease, whilst I leave it, and come down","4":"Yet they sent unto me four times after this sort; and I answered them after the same manner.","5":"Then sent Sanballat his servant unto me in like manner the fifth time with an open letter in his hand;","6":"Wherein *was* written, It is reported among the heathen, and Gashmu saith *it, that* thou and the Jews think to rebel: for which cause thou buildest the wall, that thou mayest be their king, according to these words.","7":"And thou hast also appointed prophets to preach of thee at Jerusalem, saying, *There is* a king in Judah: and now shall it be reported to the king according to these words. Come now therefore, and let us take counsel together.","8":"Then I sent unto him, saying, There are no such things done as thou sayest, but thou feignest them out of thine own heart.","9":"For they all made us afraid, saying, Their hands shall be weakened from the work, that it be not done. Now therefore, *O God*, strengthen my hands.","10":"Afterward I came unto the house of Shemaiah the son of Delaiah the son of Mehetabeel, who *was* shut up; and he said, Let us meet together in the house of God, within the temple, and let us shut the doors of the temple: for they will come to slay thee; yea, in the night will they come to slay","11":"And I said, Should such a man as I flee? and who *is there*, that, *being* as I *am*, would go into the temple to save his life? I will not go in.","12":"And, lo, I perceived that God had not sent him; but that he pronounced this prophecy against me: for Tobiah and Sanballat had hired","13":"Therefore *was* he hired, that I should be afraid, and do so, and sin, and *that* they might have *matter* for an evil report, that they might reproach","14":"My God, think thou upon Tobiah and Sanballat according to these their works, and on the prophetess Noadiah, and the rest of the prophets, that would have put me in fear.","15":"So the wall was finished in the twenty and fifth *day* of *the month* Elul, in fifty and two days.","16":"And it came to pass, that when all our enemies heard *thereof*, and all the heathen that *were* about us saw *these things*, they were much cast down in their own eyes: for they perceived that this work was wrought of our God.","17":"Moreover in those days the nobles of Judah sent many letters unto Tobiah, and *the letters* of Tobiah came","18":"For *there were* many in Judah sworn unto him, because he *was* the son in law of Shechaniah the son of Arah; and his son Johanan had taken the daughter of Meshullam the son of Berechiah.","19":"Also they reported his good deeds before me, and uttered my words to him. *And* Tobiah sent letters to put me in fear."}},"tsk":{"1":[{"kopje":"toen Sanballat","refs":["Neh 2:10","Neh 2:19","Neh 4:1","Neh 4:7"]},{"kopje":"Gesem","refs":["Neh 6:6"]},{"kopje":"geen scheur","refs":["Neh 4:6","Neh 4:7","Dan 9:25"]},{"kopje":"tot die tijd toe","refs":["Neh 3:1","Neh 3:3","Neh 3:6"]}],"2":[{"kopje":"Kom","refs":["2 Sam 3:27","2 Sam 20:9","Ps 37:12","Spr 26:24-26","Pred 4:4"]},{"kopje":"Ono","refs":["Neh 11:35","1 Kron 8:12"]},{"kopje":"waren van plan","refs":["Ps 12:3","Ps 37:12","Ps 37:32","Jer 41:2","Ezech 33:31","Micha 7:4","Micha 7:5","Luk 20:19-21"]}],"3":[{"kopje":"ik stuurde","refs":["Spr 14:15","Matt 10:16"]},{"kopje":"Ik ben bezig","refs":["Pred 9:10","Luk 14:30","Joh 9:4","1 Tim 4:15","1 Tim 4:16"]}],"4":[{"kopje":"vier keer","refs":["Richt 16:6","Richt 16:10","Richt 16:15-20","Spr 7:21","Luk 18:5","1 Kor 15:58","Gal 2:5"]},{"kopje":"en ik antwoordde","refs":["Spr 14:15"]}],"5":[{"kopje":"met een open brief","refs":["2 Kon 18:26-28","2 Kor 2:11","2 Kor 11:13-15","Ef 6:11","2 Tess 2:10"]}],"6":[{"kopje":"wordt gezegd","refs":["Jer 9:3-6","Jer 20:10","Matt 5:11","Rom 3:8","2 Kor 6:8","1 Petr 2:12","1 Petr 2:13","1 Petr 3:16"]},{"kopje":"Gasmu","refs":["Neh 6:1","Neh 6:2"]},{"kopje":"dat u en de Joden","refs" H2346\">wall,</span> and that there was no <span class=\"wl wl-kjv\" data-code=\"H6556\">breach</span> <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> therein; <span class=\"wl wl-kjv\" data-code=\"H1571\">(though</span> at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> I had not set <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> upon the gates;)","2":"That <span class=\"wl wl-kjv\" data-code=\"H5571\">Sanballat</span> and <span class=\"wl wl-kjv\" data-code=\"H1654\">Geshem</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> let us <span class=\"wl wl-kjv\" data-code=\"H3259\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> in some one of the <span class=\"wl wl-kjv\" data-code=\"H3715\">villages</span> in the <span class=\"wl wl-kjv\" data-code=\"H1237\">plain</span> of <span class=\"wl wl-kjv\" data-code=\"H207\">Ono.</span> But they <span class=\"wl wl-kjv\" data-code=\"H2803\">thought</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> me mischief.","3":"And I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I am <span class=\"wl wl-kjv\" data-code=\"H6213\">doing</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4399\">work,</span> so that I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> come <span class=\"wl wl-kjv\" data-code=\"H3381\">down:</span> why should the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> <span class=\"wl wl-kjv\" data-code=\"H7673\">cease,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">whilst</span> I <span class=\"wl wl-kjv\" data-code=\"H7503\">leave</span> it, and come down","4":"Yet they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto me <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> after this <span class=\"wl wl-kjv\" data-code=\"H1697\">sort;</span> and I <span class=\"wl wl-kjv\" data-code=\"H7725\">answered</span> them after the same manner.","5":"Then <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H5571\">Sanballat</span> his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> unto me in like <span class=\"wl wl-kjv\" data-code=\"H1697\">manner</span> the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">time</span> with an <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> <span class=\"wl wl-kjv\" data-code=\"H107\">letter</span> in his hand;","6":"Wherein was <span class=\"wl wl-kjv\" data-code=\"H3789\">written,</span> It is <span class=\"wl wl-kjv\" data-code=\"H8085\">reported</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and <span class=\"wl wl-kjv\" data-code=\"H1654\">Gashmu</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> it, that thou and the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> <span class=\"wl wl-kjv\" data-code=\"H2803\">think</span> to <span class=\"wl wl-kjv\" data-code=\"H4775\">rebel:</span> for which <span class=\"wl wl-kjv\" data-code=\"H3651\">cause</span> thou <span class=\"wl wl-kjv\" data-code=\"H1129\">buildest</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H1933\">be</span> their <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> according to these words.","7":"And thou hast also <span class=\"wl wl-kjv\" data-code=\"H5975\">appointed</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> to <span class=\"wl wl-kjv\" data-code=\"H7121\">preach</span> of thee at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> There is a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah:</span> and now shall it be <span class=\"wl wl-kjv\" data-code=\"H8085\">reported</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> according to these <span class=\"wl wl-kjv\" data-code=\"H1697\">words.</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> now therefore, and let us take <span class=\"wl wl-kjv\" data-code=\"H3289\">counsel</span> together.","8":"Then I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> There <span class=\"wl wl-kjv\" data-code=\"H1961\">are</span> no such <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> <span class=\"wl wl-kjv\" data-code=\"H1961\">done</span> as thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest,</span> but thou <span class=\"wl wl-kjv\" data-code=\"H908\">feignest</span> them out of thine own heart.","9":"For they all made us <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7503\">weakened</span> from the <span class=\"wl wl-kjv\" data-code=\"H4399\">work,</span> that it be not <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span> Now therefore, O God, <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthen</span> my hands.","10":"Afterward I <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1806\">Delaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4105\">Mehetabeel,</span> who was shut <span class=\"wl wl-kjv\" data-code=\"H6113\">up;</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let us meet <span class=\"wl wl-kjv\" data-code=\"H3259\">together</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">within</span> the <span class=\"wl wl-kjv\" data-code=\"H1964\">temple,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> of the <span class=\"wl wl-kjv\" data-code=\"H1964\">temple:</span> for they will <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> thee; yea, in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> will they <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to slay","11":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Should <span class=\"wl wl-kjv\" data-code=\"H3644\">such</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> as I <span class=\"wl wl-kjv\" data-code=\"H1272\">flee?</span> and who is there, that, being as I am, would <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into the <span class=\"wl wl-kjv\" data-code=\"H1964\">temple</span> to save his <span class=\"wl wl-kjv\" data-code=\"H2425\">life?</span> I will not go in.","12":"And, lo, I <span class=\"wl wl-kjv\" data-code=\"H5234\">perceived</span> that <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had not <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> him; but that he <span class=\"wl wl-kjv\" data-code=\"H1696\">pronounced</span> this <span class=\"wl wl-kjv\" data-code=\"H5016\">prophecy</span> against me: for <span class=\"wl wl-kjv\" data-code=\"H2900\">Tobiah</span> and <span class=\"wl wl-kjv\" data-code=\"H5571\">Sanballat</span> had hired","13":"Therefore was he <span class=\"wl wl-kjv\" data-code=\"H7936\">hired,</span> that I should be <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid,</span> and do <span class=\"wl wl-kjv\" data-code=\"H6213\">so,</span> and <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> and that they might have matter for an <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">report,</span> that they might reproach","14":"My <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">think</span> thou upon <span class=\"wl wl-kjv\" data-code=\"H2900\">Tobiah</span> and <span class=\"wl wl-kjv\" data-code=\"H5571\">Sanballat</span> according to these their <span class=\"wl wl-kjv\" data-code=\"H4639\">works,</span> and on the <span class=\"wl wl-kjv\" data-code=\"H5031\">prophetess</span> <span class=\"wl wl-kjv\" data-code=\"H5129\">Noadiah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> that would have put me in fear.","15":"So the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> was <span class=\"wl wl-kjv\" data-code=\"H7999\">finished</span> in the <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">fifth</span> day of the month <span class=\"wl wl-kjv\" data-code=\"H435\">Elul,</span> in <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> days.","16":"And it came to pass, that when all our <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> that were about <span class=\"wl wl-kjv\" data-code=\"H5439\">us</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> these things, they were <span class=\"wl wl-kjv\" data-code=\"H3966\">much</span> cast <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> in their own <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> for they <span class=\"wl wl-kjv\" data-code=\"H3045\">perceived</span> that this <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> was <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> of our God.","17":"Moreover in those <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">many</span> <span class=\"wl wl-kjv\" data-code=\"H107\">letters</span> unto <span class=\"wl wl-kjv\" data-code=\"H2900\">Tobiah,</span> and the letters of <span class=\"wl wl-kjv\" data-code=\"H2900\">Tobiah</span> came","18":"For there were <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H1167\">sworn</span> unto him, because he was the son in <span class=\"wl wl-kjv\" data-code=\"H2860\">law</span> of <span class=\"wl wl-kjv\" data-code=\"H7935\">Shechaniah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H733\">Arah;</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H3076\">Johanan</span> had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H4918\">Meshullam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Berechiah.","19":"Also they <span class=\"wl wl-kjv\" data-code=\"H559\">reported</span> his good <span class=\"wl wl-kjv\" data-code=\"H2896\">deeds</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me, and <span class=\"wl wl-kjv\" data-code=\"H3318\">uttered</span> my <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> to him. And <span class=\"wl wl-kjv\" data-code=\"H2900\">Tobiah</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H107\">letters</span> to put me in fear."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"onze andere","tekst":"Hebreeuws, het overige onzer vijanden."},{"catchword":"niet opgezet","tekst":"Vergelijk boven, Neh 3:3 ."}],"2":[{"catchword":"dorpen,","tekst":"Dat is, in een van de dorpen; zie Jdg 12:7 . Anderen Cefirim, houdende het voor een eigennaam van een plaats; gelijk Cefira is, onder, Neh 7:29 ."},{"catchword":"Ono","tekst":"Gelegen in Benjamin, onder, Neh 11:35 ."},{"catchword":"kwaad te doen","tekst":"Dat is, om te brengen."}],"4":[{"catchword":"op dezelfde wijze","tekst":"Hebreeuws, naar ditzelfde woord; en zo in vs.4 en het volgende terstond wedeRom."}],"6":[{"catchword":"Gasmu zegt","tekst":"Boven, vs.1, genoemd Gesem, de Arabier."},{"catchword":"naar dat deze zaken zijn","tekst":"Dat is, naardat deze zaken zich laten inzien. Anders, volgens deze woorden, of naardat men hiervan spreekt. Hebreeuws, naar deze woorden, of zaken, dingen."}],"7":[{"catchword":"Hij is koning","tekst":"Hebreeuws, een koning in Juda; dat is, wij hebben nu een eigen koning onder ons."},{"catchword":"naar deze zaken zijn;","tekst":"Dat is, zoals deze zaken gepasseerd zijn. Anders, achtervolgens deze woorden."},{"catchword":"raadslaan","tekst":"Hoe wij zullen voorkomen dat de koning van Perzië, dit horende, vertoornd wordt en een groot kwaad tegen u en ons allen voorneemt."}],"9":[{"catchword":"zochten","tekst":"Hebreeuws, maakten ons vreesachtig; te weten, zoveel in hen was, het was hun oogmerk in dit alles dat zij ons vrees zochten aan te jagen. Alzo onder, vs.14. Vergelijk Psa 56:2 ; Jer 2:3 ."},{"catchword":"zeggende","tekst":"Te weten, bij zichzelven, dat is denkende."},{"catchword":"sterk mijn handen","tekst":"Dit wordt van velen genomen als een gebed van Nehemia tot God, tegen de aanslagen zijner vijanden. Sommigen nemen het aldus: Maar nu, ik zal mijn handen sterken. Of, het is om mijn handen te sterken; dat is, ik zal niet dan te wakkerder en moediger daartegen zijn."}],"10":[{"catchword":"Als ik nu","tekst":"Het voorgaande hadden de vijanden van buiten gedaan. Hier verhaalt Nehemia wat hem van zijn valse broeders is wedervaren van binnen."},{"catchword":"Delája,","tekst":"1Ch 24:18 wordt vermeld van een Delaja, dat hij de voornaamste priester der drie en twintigste beurt geweest is, van welken sommigen menen dat deze Semaja een nakomeling geweest is."},{"catchword":"besloten","tekst":"Veinzende dat hij zich in zijn kamer aan den tempel [gelijk te vermoeden is, omdat de priesters daar hun kamers hadden] in eenzaamheid hield, vanwege devotie of enige religieuse gelofte, om alzo Nehemia onder schijn van heiligheid met zijn profetie [alsof zij van God kwam] te bekwamer te bedriegen, waarvan in het volgende. Vergelijk 1Sa 21:7 ."},{"catchword":"in het midden","tekst":"Dat is, in den tempel."}],"11":[{"catchword":"als ik,","tekst":"Die een goede conscientie heb, en ten volle verzekerd ben dat mijn beroep en werk van God is. Hieruit kon Nehemia ook afnemen dat zijn profetie niet van God was."},{"catchword":"levend bleve?","tekst":"Gelijk somtijds de misdadigers zich zoeken te behouden in het huis Gods. Zie Exo 21:14 ; 1Ki 1:51 , en 1Ki 2:28 . Ook waren de deuren in de poorten nog niet opgehangen, onder Neh 7:1 , zulks dat er mogelijkheid van gevaar bij nacht voor Nehemia zijnde, deze Semaja veinst, alsof hij Nehemia uit goede genegenheid in den tempel wil bergen. Maar het was bedrog. Anders, en leven, of levend blijven, alsof hij zeide: Ik zou toch den dood hebben te vrezen of te verwachten, zo ik tegen Gods bevel in den tempel ging."}],"12":[{"catchword":"tegen mij,","tekst":"Niet tot mijn best, gelijk hij zich geliet, maar door ingeven mijner vijanden, om mij vreesachtig te maken en in schande te brengen; gelijk volgt."}],"13":[{"catchword":"zondigen;","tekst":"Tegen Gods wet en mijn beroep. Zie boven, vs.11."},{"catchword":"tot een kwaden naam,","tekst":"Dat is, om mij een kwaden naam te maken; of een kwaad gerucht van mij te stooien. Vergelijk Ecc 7:1 ."}],"14":[{"catchword":"zijn werken;","tekst":"Anders, hunne. Hebreeuws, zijne; dat men kan duiden op enen of elk van dezen, of op Semaja, die zich van hen tot deze boze werken had laten huren."},{"catchword":"profetes Noádja,","tekst":"Die dezen titel valselijk aannam."},{"catchword":"de andere profeten,","tekst":"Hebreeuws, het overige der profeten."},{"catchword":"gezocht hebben","tekst":"Gelijk boven, vs.9; zie aldaar."}],"15":[{"catchword":"Elul,","tekst":"De zesde maand der Joden, passende eensdeels op onzen Augustus, anderdeels op September."},{"catchword":"in twee en vijftig dagen","tekst":"Nadat zij begonnen hadden te bouwen. Deze omstandigheid dient tot vergroting van Gods genade, in spijt der vijanden zijn volk bewezen."}],"16":[{"catchword":"vervielen","tekst":"Dat is, hun gelaat verviel van mismoedigheid, of zij dachten dat zij na dezen geen macht meer zouden hebben om de Joden te bestrijden. Vergelijk Job 12:3 met de aantekening."}],"17":[{"catchword":"schreven","tekst":"Hebreeuws, vermenigvuldigden hun brieven."},{"catchword":"edelen van Juda","tekst":"Hebreeuws, witte; zie boven, Neh 2:16 ."},{"catchword":"die van Tobia kwamen","tekst":"Te weten, de brieven, die Tobia weder schreEf."}],"18":[{"catchword":"gezworen,","tekst":"Hebreeuws, heren, of meesters des eeds; dat is, eedgenoten, met ede aan hem verplicht. Dit waren de vruchten van de verboden huwelijken, die hier verhaald worden."},{"catchword":"schoonzoon","tekst":"Anders, zwager."}],"19":[{"catchword":"verhaalden","tekst":"Hebreeuws, zij waren zeggende."},{"catchword":"goeddadigheden","tekst":"Hebreeuws, goedheden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Moreover, it came to pass, when it was heard by Saneballat, and Tobia, and by Gesem the Arabian, and by our other Enemies, [Hebr. The remnant of our Enemies] that I had built the wall, and (that) there was no breach left therein; neither at this time had I set up the doors in the gates: [Compare above chapter 3. On vers.3.]"}],"2":[{"catchword":null,"tekst":"Then Saneballat and Gesem sent unto me, to say; come, and let us gather together in the villages, [That is, in one of the villages. See Judg.12.on vers.7.Others, Cephirim, holding it to be a proper name of a place: as Cephira is, below chap.7.29.] in the valley of Ono, [lying in Benjamin, below chap. 11.35.] but they thought to do me mischief. [That is, to kill, destroy me.]"}],"3":[{"catchword":null,"tekst":"And I sent messengers unto them to say; I do a great work, so that I shall not be able to come down; why should this work cease, whilest I should leave it, and come down to you?"}],"4":[{"catchword":null,"tekst":"Now they sent (well) four times unto me after the same manner: [Heb. after this same word; and so presently again and in the next verse] and I answered them after the same manner."}],"5":[{"catchword":null,"tekst":"Then sent Sanballat his youth unto me in the same manner the fifth time, with an open letter in his hand."}],"6":[{"catchword":null,"tekst":"Wherein was written; it is heard among the nations, and Gasmu [Above verse 1. Called Gesen, the Arabian] saith (that) thou and the jews think to rebel, therefore thou buildest the wall, and thou shalt be their king, according as these things are. [That is, according as these things are carried. Oth. according to these words, or, according as the speech goeth. Hebr. According to these words, or matters, things.]"}],"7":[{"catchword":null,"tekst":"That thou hast also appointed Prophets to proclame of thee at Jerusalem, saying; he is king in Juda; [Hebr. A King in Juda; that is, we have now a king of our own among us] Now it will be heard by the king, according as these things have passed or happened. Oth. according to these words] come now then, and let us take counsel together. [how to prevent that the king of Persia, coming to hear hereof, may not be enraged against us, and intend great mischief both against thee, and against us all.]"}],"8":[{"catchword":null,"tekst":"But I sent unto him to say, There is nothing done of such things as sayest; but thou feignest them out of thine (own) heart."}],"9":[{"catchword":null,"tekst":"For they all sought to make us timorous [Hebr. They all made us timorous; to wit, as much as in them lay, it was their whole aim in all this, that they endeavoured to make us afraid, to put us in fear. See bel. Verse.14. Compare Psal.56.on verse 2. Jer.2.on verse 3.] saying, Their hands shall cease from the work, that it shall not be done: Now then strengthen mine hands. [this is taken by many as Nehemia prayer against the plots and devices of his enemies. Some take it thus; But now, I will strengthen mine hands, or it is to strengthen mine hands: [That is, I will be the more vigilant and couragious against them.]"}],"10":[{"catchword":null,"tekst":"Now when I came into the house of Semaja [The former plot was laid by the enemies from without; here Nehemiah relateth was practised against him by his false brethren within] the son of Delaja, [In 1 Chron.24.16. there is mention made of one Delaja, that was the chiefest Priest of the three and twenty orders or courses, of whose posterity, some are of opinion that this Semaja was] the son of Mehethabeel (now he was shut up) [feigning that he kept himself alone in his chamber, at or in the Temple (as may be suspected, because the Priests had their chambers there) because of devotion, or some religious vow, that so he might the better deceive Nehemia, under a shew and pretence of holiness, with his Prophesy (as if it came from God) whereof mention is made in the sequel. Compare 1 Sam.21.7.] then said he, let us come together into the house of God, into the midst of the temple, [That is into the Temple] and let us shut the doors of the Temple, for they will come to kill thee, yea they will come by night to kill thee."}],"11":[{"catchword":null,"tekst":"But I said, should a man as I, flee? [that have a good conscience, and am fully assured that my work and calling is of God. Hence Nehemia might also gather, that his Prophecy was not of God] and who is there, being as I, that should go into the Temple, that he might remain alive? [as sometimes malefactors seem to save themselves in the house of God. See Exo 21:14. 1 Kings 1.51. and 2.28. neither were the doors in the gates yet hung on, below chap.7.1. so that there being appearance of danger for Nehemia by night, this Semaja feigneth as if he, out of a good affection toward Nehemia, would hide him in the Temple, but it was meer deceit. Oth. and live, or remain alive; as if he had said, I must surely have cause to fear or expect death, if I should go into the Temple against the command of God] I will not go in."}],"12":[{"catchword":null,"tekst":"For I perceived, and lo, God had not sent him; but he pronounced this Prophecy against me, because Tobia and Sanballat had hired him. [That is, he pronounced or uttered this Prophecy, not for my good, as he feigned & dissembled, but by the instigation of mine enemies, to make me afraid, and to bring me to shame, as followeth.]"}],"13":[{"catchword":null,"tekst":"Therefore was he hired that I should be afraid, and do so, and sin; [Against the law of God, and my calling. See above on verse 11.] that they might have something for an evil name, [that is, to make me have an ill name, or to scatter an ill report abroad of me. Compare Eccl.7.on verse 1.] that they might reproach me."}],"14":[{"catchword":null,"tekst":"Remember my God, Tobia and Sa // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
