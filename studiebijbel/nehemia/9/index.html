-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Verder, op de vierentwintigste dag van deze maand verzamelden de kinderen van Israël zich met vasten en met zakken, en aarde was op hen.","2":"En het nageslacht van Israël scheidde zich af van alle vreemden. En zij stonden, en beleden hun zonden en de ongerechtigheden van hun vaderen.","3":"Want toen zij opgestaan waren op hun standplaats, lazen zij in het wetboek van de HEERE, hun God, een vierde deel van de dag; en op een *ander* vierde deel beleden zij, en aanbaden de HEERE, hun God.","4":"Jesua nu, en Bani, Kadmiel, Sebanja, Bunni, Serebja, Bani *en* Chenani, stonden op het hoge gestoelte van de Levieten, en riepen met luide stem tot de HEERE, hun God;","5":"En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!","6":"U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.","7":"U bent die HEERE, de God, Die Abram hebt verkoren, en hem uit Ur der Chaldeeën uitgevoerd; en U hebt zijn naam gesteld Abraham.","8":"En U hebt zijn hart getrouw gevonden voor Uw aangezicht, en hebt een verbond met hem gemaakt, dat U zou geven het land van de Kanaänieten, de Hethieten, de Amorieten, en de Ferezieten, en de Jebusieten, en de Girgasieten, dat U het aan zijn nageslacht zou geven; en U hebt Uw woorden bevestigd, omdat U rechtvaardig bent.","9":"En U hebt de ellende van onze vaderen in Egypte gezien, en U hebt hun geroep gehoord aan de Schelfzee;","10":"En U hebt tekenen en wonderen gedaan aan Farao, en aan al zijn knechten, en aan al het volk van zijn land; want U wist, dat zij trots tegen hen handelden; en U hebt U een Naam gemaakt, zoals het is op deze dag.","11":"En U hebt de zee voor hun aangezicht gekliefd, zodat zij in het midden van de zee op het droge zijn doorgegaan; en hun vervolgers hebt U in de diepten geworpen, als een steen in sterk water.","12":"En U hebt hen overdag geleid met een wolkkolom, en 's nachts met een vuurkolom, om hen licht te geven op de weg waarin zij zouden gaan.","13":"En U bent neergedaald op de berg Sinaï, en hebt met hen gesproken uit de hemel; en U hebt hun rechtmatige rechten gegeven, en getrouwe wetten, goede inzettingen en geboden.","14":"En U hebt Uw heilige sabbat bekendgemaakt; en U hebt hun geboden, en inzettingen en een wet bevolen, door de hand van Uw knecht Mozes.","15":"En U hebt hun brood uit de hemel gegeven voor hun honger, en hun water uit de steenrots voortgebracht voor hun dorst; en U hebt tot hen gezegd, dat zij zouden ingaan om het land te erven, waarover U Uw hand ophief, dat U het hun zou geven.","16":"Maar zij en onze vaders hebben trots gehandeld, en zij hebben hun nek verhard, en niet geluisterd naar Uw geboden;","17":"En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten.","18":"Zelfs, toen zij zich een gegoten kalf gemaakt hadden, en gezegd hadden: Dit is uw God, Die u uit Egypte heeft opgevoerd; en grote lasteringen gedaan hadden;","19":"Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.","20":"En U hebt Uw goede Geest gegeven om hen te onderwijzen; en Uw Manna hebt U niet geweerd van hun mond, en water hebt U hun gegeven voor hun dorst.","21":"Zo hebt U hen veertig jaar onderhouden in de woestijn; zij hebben geen gebrek gehad; hun kleren zijn niet versleten, en hun voeten niet gezwollen.","22":"Verder hebt U hun koninkrijken en volken gegeven, en hebt hen verdeeld in hoeken. Zo hebben zij het land van Sihon erfelijk bezeten, namelijk het land van de koning van Hesbon, en het land van Og, koning van Basan.","23":"U hebt ook hun kinderen vermenigvuldigd, als de sterren van de hemel; en U hebt hen gebracht in het land, waarvan U tot hun vaderen had gezegd, dat zij zouden ingaan om het erfelijk te bezitten.","24":"Zo zijn de kinderen daarin gekomen, en hebben dat land erfelijk ingenomen; en U hebt de inwoners van het land, de Kanaänieten, voor hun aangezicht onderworpen, en hebt hen in hun hand gegeven, alsook hun koningen en de volken van het land, om daarmee te doen naar hun welgevallen.","25":"En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.","26":"Maar zij zijn opstandig geworden, en hebben tegen U gerebelleerd, en Uw wet achter hun rug geworpen, en Uw profeten gedood die tegen hen getuigden, om hen te doen terugkeren tot U; zo hebben zij grote lasteringen gedaan.","27":"Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten.","28":"Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered.","29":"En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.","30":"Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.","31":"Doch door Uw grote barmhartigheden hebt U hen niet volledig vernietigd, noch hen verlaten; want U bent een genadig en barmhartig God.","32":"Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.","33":"Doch U bent rechtvaardig, in alles wat ons overkomen is; want U hebt trouw gehandeld, maar wij hebben goddeloos gehandeld.","34":"En onze koningen, onze vorsten, onze priesters en onze vaders hebben Uw wet niet gedaan; en zij hebben niet geluisterd naar Uw geboden, en naar Uw getuigenissen, waarmee U tegen hen getuigde.","35":"Want zij hebben U niet gediend in hun koninkrijk, en in Uw overvloedige goed, dat U hun gaf, en in dat wijde en dat vette land, dat U voor hun aangezicht gegeven had; en zij hebben zich niet bekeerd van hun slechte werken.","36":"Zie, wij zijn heden knechten; ja, het land, dat U onze vaderen gegeven hebt, om de vrucht daarvan, en het goede daarvan te eten, zie, daarin zijn wij knechten.","37":"En het vermeerdert zijn opbrengst voor de koningen, die U over ons gesteld hebt, om onze zonden; en zij heersen over onze lichamen en over onze dieren, naar hun welgevallen; zo zijn wij in grote benauwdheid.","38":"En om dit alles maken wij een vast *verbond* en schrijven het; en onze vorsten, onze Levieten *en* onze priesters zullen het verzegelen."},"SV":{"1":"Voorts op den vier en twintigsten dag dezer maand verzamelden zich de kinderen Israëls met vasten en met zakken, en aarde was op hen.","2":"En het zaad Israëls scheidde zich af van alle vreemden. En zij stonden, en deden belijdenis van hun zonden en hunner vaderen ongerechtigheden.","3":"Want als zij opgestaan waren op hun standplaats, zo lazen zij in het wetboek des HEEREN, huns Gods, een vierendeel van den dag; en op een *ander* vierendeel deden zij belijdenis, en aanbaden den HEERE, hun God.","4":"Jesua nu, en Bani, Kadmiel, Sebanja, Bunni, Serebja, Bani *en* Chenani, stonden op het hoge gestoelte der Levieten, en riepen met luider stem tot den HEERE, hun God;","5":"En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Staat op, looft den HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love den Naam Uwer heerlijkheid, die verhoogd is boven allen lof en prijs!","6":"Gij zijt die HEERE alleen, Gij hebt gemaakt den hemel, den hemel der hemelen, en al hun heir, de aarde en al wat daarop is, de zeeën en al wat daarin is, en Gij maakt die allen levend; en het heir der hemelen aanbidt U.","7":"Gij zijt die HEERE, de God, Die Abram hebt verkoren, en hem uit Ur der Chaldeen uitgevoerd; en Gij hebt zijn naam gesteld Abraham.","8":"En Gij hebt zijn hart getrouw gevonden voor Uw aangezicht, en hebt een verbond met hem gemaakt, dat Gij zoudt geven het land der Kanaänieten, der Hethieten, der Amorieten, en der Ferezieten, en der Jebusieten, en der Girgasieten, dat Gij het zijn zade zoudt geven; en Gij hebt Uw woorden bevestigd, omdat Gij rechtvaardig zijt.","9":"En Gij hebt aangezien onzer vaderen ellende in Egypte, en Gij hebt hun geroep gehoord aan de Schelfzee;","10":"En Gij hebt tekenen en wonderen gedaan aan Farao, en aan al zijn knechten, en aan al het volk zijns lands; want Gij wist, dat zij trotselijk tegen hen handelden; en Gij hebt U een Naam gemaakt, als het is te dezen dage.","11":"En Gij hebt de zee voor hun aangezicht gekliefd, dat zij in het midden der zee op het droge zijn doorgegaan; en hun vervolgers hebt Gij in de diepten geworpen, als een steen in sterke wateren.","12":"En Gij hebt ze des daags geleid met een wolkkolom, en des nachts met een vuurkolom, om hen te lichten op den weg, waarin zij zouden wandelen.","13":"En Gij zijt neergedaald op den berg Sinaï, en hebt met hen gesproken uit den hemel; en Gij hebt hun gegeven rechtmatige rechten, en getrouwe wetten, goede inzettingen en geboden.","14":"En Gij hebt Uw heiligen sabbat bekend gemaakt; en Gij hebt hun geboden, en inzettingen en een wet bevolen, door de hand van Uw knecht Mozes.","15":"En Gij hebt hun brood uit den hemel gegeven voor hun honger, en hun water uit de steenrots voortgebracht voor hun dorst; en Gij hebt tot hen gezegd, dat zij zouden ingaan om te erven het land, waarover Gij Uw hand ophieft, dat Gij het hun zoudt geven.","16":"Maar zij en onze vaders hebben trotselijk gehandeld, en zij hebben hun nek verhard, en niet gehoord naar Uw geboden;","17":"En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die Gij bij hen gedaan hadt, en hebben hun nek verhard, en in hun wederspannigheid een hoofd gesteld, om weder te keren tot hun dienstbaarheid. Doch Gij, een God van vergevingen, genadig en barmhartig, lankmoedig, en groot van weldadigheid, hebt hen evenwel niet verlaten.","18":"Zelfs, als zij zich een gegoten kalf gemaakt hadden, en gezegd: Dit is uw God, Die u uit Egypte heeft opgevoerd; en grote lasteren gedaan hadden;","19":"Hebt Gij hen nochtans door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen des daags, om hen op den weg te leiden, noch de vuurkolom des nachts, om hen te lichten, en dat, op den weg, waarin zij zouden wandelen.","20":"En Gij hebt Uw goeden Geest gegeven om hen te onderwijzen; en Uw Manna hebt Gij niet geweerd van hun mond, en water hebt Gij hun gegeven voor hun dorst.","21":"Alzo hebt Gij hen veertig jaren onderhouden in de woestijn; zij hebben geen gebrek gehad; hun klederen zijn niet veroud, en hun voeten niet gezwollen.","22":"Voorts hebt Gij hun koninkrijken en volken gegeven, en hebt hen verdeeld in hoeken. Alzo hebben zij erfelijk bezeten het land van Sihon, te weten, het land des konings van Hesbon, en het land van Og, koning van Basan.","23":"Gij hebt ook hun kinderen vermenigvuldigd, als de sterren des hemels; en Gij hebt hen gebracht in het land, waarvan Gij tot hun vaderen hadt gezegd, dat zij zouden ingaan om het erfelijk te bezitten.","24":"Alzo zijn de kinderen daarin gekomen, en hebben dat land erfelijk ingenomen; en Gij hebt de inwoners des lands, de Kanaänieten, voor hun aangezicht ten ondergebracht, en hebt hen in hun hand gegeven, mitsgaders hun koningen en de volken des lands, om daarmede te doen naar hun welgevallen.","25":"En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van alle goed, uitgehouwen bornputten, wijngaarden, olijfgaarden en bomen van spijze, in menigte; en zij hebben gegeten, en zijn zat en vet geworden, en hebben in wellust geleefd, door Uw grote goedigheid.","26":"Maar zij zijn wederspannig geworden, en hebben tegen U gerebelleerd, en Uw wet achter hun rug geworpen, en Uw profeten gedood die tegen hen betuigden, om hen te doen wederkeren tot U; alzo hebben zij grote lasteren gedaan.","27":"Daarom hebt Gij hen gegeven in de hand hunner benauwers, die hen benauwd hebben; maar als zij in den tijd hunner benauwdheid tot U riepen, hebt Gij van den hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand hunner benauwers verlosten.","28":"Maar als zij rust hadden, keerden zij weder om kwaad te doen voor Uw aangezicht; zo verliet Gij hen in de hand hunner vijanden, dat zij over hen heersten; als zij zich dan bekeerden, en U aanriepen, zo hebt Gij hen van den hemel gehoord, en hebt hen naar Uw barmhartigheden tot vele tijden uitgerukt.","29":"En Gij hebt tegen hen betuigd, om hen te doen wederkeren tot Uw wet; maar zij hebben trotselijk gehandeld, en niet gehoord naar Uw geboden, en tegen Uw rechten, tegen dezelve hebben zij gezondigd, door dewelke een mens, die ze doet, leven zal; en zij hebben hun schouder teruggetogen, en hun nek verhard, en niet gehoord.","30":"Doch Gij vertoogt het vele jaren over hen, en betuigdet tegen hen door Uw Geest, door den dienst Uwer profeten, maar zij neigden het oor niet; daarom hebt Gij hen gegeven in de hand van de volken der landen.","31":"Doch door Uw grote barmhartigheden hebt Gij hen niet vernield, noch hen verlaten; want Gij zijt een genadig en barmhartig God.","32":"Nu dan, o onze God, Gij grote, Gij machtige, en Gij vreselijke God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesteren; en onze profeten, en onze vaderen, en Uw ganse volk, van de dagen der koningen van Assur af tot op dezen dag.","33":"Doch Gij zijt rechtvaardig, in alles, wat ons overkomen is; want Gij hebt trouwelijk gehandeld, maar wij hebben goddelooslijk gehandeld.","34":"En onze koningen, onze vorsten, onze priesters en onze vaders hebben Uw wet niet gedaan; en zij hebben niet geluisterd naar Uw geboden, en naar Uw getuigenissen, die Gij tegen hen betuigdet.","35":"Want zij hebben U niet gediend in hun koninkrijk, en in Uw menigvuldig goed, dat Gij hun gaaft, en in dat wijde en dat vette land, dat Gij voor hun aangezicht gegeven hadt; en zij hebben zich niet bekeerd van hun boze werken.","36":"Zie, wij zijn heden knechten; ja, het land, dat Gij onzen vaderen gegeven hebt, om de vrucht daarvan, en het goede daarvan te eten, zie, daarin zijn wij knechten.","37":"En het vermenigvuldigt zijn inkomste voor den koningen, die Gij over ons gesteld hebt, om onzer zonden wil; en zij heersen over onze lichamen en over onze beesten, naar hun welgevallen; alzo zijn wij in grote benauwdheid.","38":"En in dit alles maken wij een vast *verbond* en schrijven het; en onze vorsten, onze Levieten *en* onze priesteren zullen het verzegelen."},"KJV":{"1":"Now in the twenty and fourth day of this month the children of Israel were assembled with fasting, and with sackclothes, and earth","2":"And the seed of Israel separated themselves from all strangers, and stood and confessed their sins, and the iniquities of their fathers.","3":"And they stood up in their place, and read in the book of the law of the LORD their God *one* fourth part of the day; and *another* fourth part they confessed, and worshipped the LORD their God.","4":"Then stood up upon the stairs, of the Levites, Jeshua, and Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, *and* Chenani, and cried with a loud voice unto the LORD their God.","5":"Then the Levites, Jeshua, and Kadmiel, Bani, Hashabniah, Sherebiah, Hodijah, Shebaniah, *and* Pethahiah, said, Stand up *and* bless the LORD your God for ever and ever: and blessed be thy glorious name, which is exalted above all blessing and praise.","6":"Thou, *even* thou, *art* LORD alone; thou hast made heaven, the heaven of heavens, with all their host, the earth, and all *things* that *are* therein, the seas, and all that *is* therein, and thou preservest them all; and the host of heaven worshippeth","7":"Thou *art* the LORD the God, who didst choose Abram, and broughtest him forth out of Ur of the Chaldees, and gavest him the name of Abraham;","8":"And foundest his heart faithful before thee, and madest a covenant with him to give the land of the Canaanites, the Hittites, the Amorites, and the Perizzites, and the Jebusites, and the Girgashites, to give *it, I say*, to his seed, and hast performed thy words; for thou *art* righteous:","9":"And didst see the affliction of our fathers in Egypt, and heardest their cry by the Red sea;","10":"And shewedst signs and wonders upon Pharaoh, and on all his servants, and on all the people of his land: for thou knewest that they dealt proudly against them. So didst thou get thee a name, as *it is* this day.","11":"And thou didst divide the sea before them, so that they went through the midst of the sea on the dry land; and their persecutors thou threwest into the deeps, as a stone into the mighty waters.","12":"Moreover thou leddest them in the day by a cloudy pillar; and in the night by a pillar of fire, to give them light in the way wherein they should go.","13":"Thou camest down also upon mount Sinai, and spakest with them from heaven, and gavest them right judgments, and true laws, good statutes and commandments:","14":"And madest known unto them thy holy sabbath, and commandedst them precepts, statutes, and laws, by the hand of Moses thy servant:","15":"And gavest them bread from heaven for their hunger, and broughtest forth water for them out of the rock for their thirst, and promisedst them that they should go in to possess the land which thou hadst sworn to give","16":"But they and our fathers dealt proudly, and hardened their necks, and hearkened not to thy commandments,","17":"And refused to obey, neither were mindful of thy wonders that thou didst among them; but hardened their necks, and in their rebellion appointed a captain to return to their bondage: but thou *art* a God ready to pardon, gracious and merciful, slow to anger, and of great kindness, and forsookest","18":"Yea, when they had made them a molten calf, and said, This *is* thy God that brought thee up out of Egypt, and had wrought great provocations;","19":"Yet thou in thy manifold mercies forsookest them not in the wilderness: the pillar of the cloud departed not from them by day, to lead them in the way; neither the pillar of fire by night, to shew them light, and the way wherein they should go.","20":"Thou gavest also thy good spirit to instruct them, and withheldest not thy manna from their mouth, and gavest them water for their thirst.","21":"Yea, forty years didst thou sustain them in the wilderness, *so that* they lacked nothing; their clothes waxed not old, and their feet swelled","22":"Moreover thou gavest them kingdoms and nations, and didst divide them into corners: so they possessed the land of Sihon, and the land of the king of Heshbon, and the land of Og king of Bashan.","23":"Their children also multipliedst thou as the stars of heaven, and broughtest them into the land, concerning which thou hadst promised to their fathers, that they should go in to possess","24":"So the children went in and possessed the land, and thou subduedst before them the inhabitants of the land, the Canaanites, and gavest them into their hands, with their kings, and the people of the land, that they might do with them as they would.","25":"And they took strong cities, and a fat land, and possessed houses full of all goods, wells digged, vineyards, and oliveyards, and fruit trees in abundance: so they did eat, and were filled, and became fat, and delighted themselves in thy great goodness.","26":"Nevertheless they were disobedient, and rebelled against thee, and cast thy law behind their backs, and slew thy prophets which testified against them to turn them to thee, and they wrought great provocations.","27":"Therefore thou deliveredst them into the hand of their enemies, who vexed them: and in the time of their trouble, when they cried unto thee, thou heardest *them* from heaven; and according to thy manifold mercies thou gavest them saviours, who saved them out of the hand of their enemies.","28":"But after they had rest, they did evil again before thee: therefore leftest thou them in the hand of their enemies, so that they had the dominion over them: yet when they returned, and cried unto thee, thou heardest *them* from heaven; and many times didst thou deliver them according to thy mercies;","29":"And testifiedst against them, that thou mightest bring them again unto thy law: yet they dealt proudly, and hearkened not unto thy commandments, but sinned against thy judgments, (which if a man do, he shall live in them;) and withdrew the shoulder, and hardened their neck, and would not hear.","30":"Yet many years didst thou forbear them, and testifiedst against them by thy spirit in thy prophets: yet would they not give ear: therefore gavest thou them into the hand of the people of the lands.","31":"Nevertheless for thy great mercies' sake thou didst not utterly consume them, nor forsake them; for thou *art* a gracious and merciful God.","32":"Now therefore, our God, the great, the mighty, and the terrible God, who keepest covenant and mercy, let not all the trouble seem little before thee, that hath come upon us, on our kings, on our princes, and on our priests, and on our prophets, and on our fathers, and on all thy people, since the time of the kings of Assyria unto this day.","33":"Howbeit thou *art* just in all that is brought upon us; for thou hast done right, but we have done wickedly:","34":"Neither have our kings, our princes, our priests, nor our fathers, kept thy law, nor hearkened unto thy commandments and thy testimonies, wherewith thou didst testify","35":"For they have not served thee in their kingdom, and in thy great goodness that thou gavest them, and in the large and fat land which thou gavest before them, neither turned they from their wicked works.","36":"Behold, we *are* servants this day, and *for* the land that thou gavest unto our fathers to eat the fruit thereof and the good thereof, behold, we *are* servants","37":"And it yieldeth much increase unto the kings whom thou hast set over us because of our sins: also they have dominion over our bodies, and over our cattle, at their pleasure, and we *are* in great distress.","38":"And because of all this we make a sure *covenant*, and write *it*; and our princes, Levites, *and* priests, seal"}},"tsk":{"1":[{"kopje":"twintigste","refs":["Lev 23:34","Lev 23:39","2 Kron 7:10"]},{"kopje":"van deze maand","refs":["Neh 8:3"]},{"kopje":"kinderen","refs":["Richt 20:26","2 Kron 20:3","Ezra 8:23","Est 4:3","Est 4:16","Jes 22:12","Joël 1:13","Joël 1:14","Joël 2:15-17","Jona 3:5-8","Hand 13:2","Hand 13:3"]},{"kopje":"aarde","refs":["Joz 7:6","1 Sam 4:12","2 Sam 1:2","Job 2:12"]}],"2":[{"kopje":"het nageslacht","refs":["Neh 13:3","Neh 13:30","Ezra 9:2","Ezra 10:11"]},{"kopje":"vreemden","refs":["Ps 144:7","Ps 144:11","Jes 2:6","Hos 5:7"]},{"kopje":"beleden","refs":["Neh 1:6","Lev 26:39","Lev 26:40","Ezra 9:6","Ezra 9:7","Ezra 9:15","Ps 106:6","Ps 106:7","Dan 9:3-10","Dan 9:20","1 Joh 1:7-9"]}],"3":[{"kopje":"opgestaan waren","refs":["Neh 8:5","Neh 8:8","Neh 8:9"]},{"kopje":"vierde deel","refs":["Neh 8:4"]}],"4":[{"kopje":"Jesua","refs":["Neh 9:5","Neh 8:8","Neh 10:9-13","Neh 12:8"]},{"kopje":"riepen","refs":["2 Kron 20:19","Ps 3:5","Ps 77:2","Ps 130:1","Klaagl 3:8","Joh 11:43","Hand 7:60"]}],"5":[{"kopje":"Sta op","refs":["1 Kon 8:14","1 Kon 8:22","2 Kron 20:13","2 Kron 20:19","Ps 134:1-3","Ps 135:1-3"]},{"kopje":"loof","refs":["1 Kron 29:20","Ezra 3:11","Ps 103:1","Ps 103:2","Ps 117:1","Ps 117:2","Ps 145:2","Ps 146:2","Jer 33:10","Jer 33:11","Matt 11:25","Ef 3:20","E -kjv\" data-code=\"H6963\">voice</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their God.","5":"Then the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> <span class=\"wl wl-kjv\" data-code=\"H3442\">Jeshua,</span> and <span class=\"wl wl-kjv\" data-code=\"H6934\">Kadmiel,</span> <span class=\"wl wl-kjv\" data-code=\"H1137\">Bani,</span> <span class=\"wl wl-kjv\" data-code=\"H2813\">Hashabniah,</span> <span class=\"wl wl-kjv\" data-code=\"H8274\">Sherebiah,</span> <span class=\"wl wl-kjv\" data-code=\"H1941\">Hodijah,</span> <span class=\"wl wl-kjv\" data-code=\"H7645\">Shebaniah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6611\">Pethahiah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Stand <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> and <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> and <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> be thy <span class=\"wl wl-kjv\" data-code=\"H3519\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> which is <span class=\"wl wl-kjv\" data-code=\"H7311\">exalted</span> above all <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> and praise.","6":"Thou, even thou, art <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> alone; thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> with all their <span class=\"wl wl-kjv\" data-code=\"H6635\">host,</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and all things that are therein, the <span class=\"wl wl-kjv\" data-code=\"H3220\">seas,</span> and all that is therein, and thou <span class=\"wl wl-kjv\" data-code=\"H2421\">preservest</span> them all; and the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> worshippeth","7":"Thou art the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> who didst <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> <span class=\"wl wl-kjv\" data-code=\"H87\">Abram,</span> and broughtest him <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H218\">Ur</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldees,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">gavest</span> him the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of Abraham;","8":"And <span class=\"wl wl-kjv\" data-code=\"H4672\">foundest</span> his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H539\">faithful</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H3772\">madest</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with him to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites,</span> the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittites,</span> the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6522\">Perizzites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1622\">Girgashites,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it, I say, to his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H6965\">performed</span> thy <span class=\"wl wl-kjv\" data-code=\"H1697\">words;</span> for thou art righteous:","9":"And didst <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction</span> of our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">heardest</span> their <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> by the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> sea;","10":"And <span class=\"wl wl-kjv\" data-code=\"H5414\">shewedst</span> <span class=\"wl wl-kjv\" data-code=\"H226\">signs</span> and <span class=\"wl wl-kjv\" data-code=\"H4159\">wonders</span> upon <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and on all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and on all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of his <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> for thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knewest</span> that they dealt <span class=\"wl wl-kjv\" data-code=\"H2102\">proudly</span> against them. So didst thou <span class=\"wl wl-kjv\" data-code=\"H6213\">get</span> thee a <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> as it is this day.","11":"And thou didst <span class=\"wl wl-kjv\" data-code=\"H1234\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, so that they went <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> on the dry <span class=\"wl wl-kjv\" data-code=\"H3004\">land;</span> and their <span class=\"wl wl-kjv\" data-code=\"H7291\">persecutors</span> thou <span class=\"wl wl-kjv\" data-code=\"H7993\">threwest</span> into the <span class=\"wl wl-kjv\" data-code=\"H4688\">deeps,</span> as a <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> into the <span class=\"wl wl-kjv\" data-code=\"H5794\">mighty</span> waters.","12":"Moreover thou <span class=\"wl wl-kjv\" data-code=\"H5148\">leddest</span> them in the <span class=\"wl wl-kjv\" data-code=\"H3119\">day</span> by a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloudy</span> <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar;</span> and in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> by a <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> to give them <span class=\"wl wl-kjv\" data-code=\"H215\">light</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> wherein they should go.","13":"Thou camest <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> also upon <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H5514\">Sinai,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spakest</span> with them from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> them <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and <span class=\"wl wl-kjv\" data-code=\"H571\">true</span> <span class=\"wl wl-kjv\" data-code=\"H8451\">laws,</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> and commandments:","14":"And madest <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> unto them thy <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath,</span> and <span class=\"wl wl-kjv\" data-code=\"H6680\">commandedst</span> them <span class=\"wl wl-kjv\" data-code=\"H4687\">precepts,</span> <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> and <span class=\"wl wl-kjv\" data-code=\"H8451\">laws,</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> thy servant:","15":"And <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> them <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> for their <span class=\"wl wl-kjv\" data-code=\"H7458\">hunger,</span> and broughtest <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> for them out of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> for their <span class=\"wl wl-kjv\" data-code=\"H6772\">thirst,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">promisedst</span> them that they should go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which thou hadst <span class=\"wl wl-kjv\" data-code=\"H3027\">sworn</span> to give","16":"But they and our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> dealt <span class=\"wl wl-kjv\" data-code=\"H2102\">proudly,</span> and <span class=\"wl wl-kjv\" data-code=\"H7185\">hardened</span> their <span class=\"wl wl-kjv\" data-code=\"H6203\">necks,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not to thy commandments,","17":"And <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to <span class=\"wl wl-kjv\" data-code=\"H8085\">obey,</span> neither were <span class=\"wl wl-kjv\" data-code=\"H2142\">mindful</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6381\">wonders</span> that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">didst</span> among them; but <span class=\"wl wl-kjv\" data-code=\"H7185\">hardened</span> their <span class=\"wl wl-kjv\" data-code=\"H6203\">necks,</span> and in their <span class=\"wl wl-kjv\" data-code=\"H4805\">rebellion</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">appointed</span> a <span class=\"wl wl-kjv\" data-code=\"H7218\">captain</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to their <span class=\"wl wl-kjv\" data-code=\"H5659\">bondage:</span> but thou art a <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> ready to <span class=\"wl wl-kjv\" data-code=\"H5547\">pardon,</span> <span class=\"wl wl-kjv\" data-code=\"H2587\">gracious</span> and <span class=\"wl wl-kjv\" data-code=\"H7349\">merciful,</span> <span class=\"wl wl-kjv\" data-code=\"H750\">slow</span> to <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and of <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness,</span> and forsookest","18":"Yea, when they had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> them a <span class=\"wl wl-kjv\" data-code=\"H4541\">molten</span> <span class=\"wl wl-kjv\" data-code=\"H5695\">calf,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> that brought thee <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and had <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> provocations;","19":"Yet thou in thy <span class=\"wl wl-kjv\" data-code=\"H7227\">manifold</span> <span class=\"wl wl-kjv\" data-code=\"H7356\">mercies</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">forsookest</span> them not in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness:</span> the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> of the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> not from them by <span class=\"wl wl-kjv\" data-code=\"H3119\">day,</span> to <span class=\"wl wl-kjv\" data-code=\"H5148\">lead</span> them in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way;</span> neither the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> to shew them <span class=\"wl wl-kjv\" data-code=\"H215\">light,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> wherein they should go.","20":"Thou <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> also thy <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> to <span class=\"wl wl-kjv\" data-code=\"H7919\">instruct</span> them, and <span class=\"wl wl-kjv\" data-code=\"H4513\">withheldest</span> not thy <span class=\"wl wl-kjv\" data-code=\"H4478\">manna</span> from their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> them <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> for their thirst.","21":"Yea, <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> didst thou <span class=\"wl wl-kjv\" data-code=\"H3557\">sustain</span> them in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> so that they <span class=\"wl wl-kjv\" data-code=\"H2637\">lacked</span> nothing; their <span class=\"wl wl-kjv\" data-code=\"H8008\">clothes</span> waxed not <span class=\"wl wl-kjv\" data-code=\"H1086\">old,</span> and their <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> swelled","22":"Moreover thou <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> them <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> and <span class=\"wl wl-kjv\" data-code=\"H5971\">nations,</span> and didst <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> them into <span class=\"wl wl-kjv\" data-code=\"H6285\">corners:</span> so they <span class=\"wl wl-kjv\" data-code=\"H3423\">possessed</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H5747\">Og</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Bashan.","23":"Their <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> also <span class=\"wl wl-kjv\" data-code=\"H7235\">multipliedst</span> thou as the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">broughtest</span> them into the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> concerning which thou hadst <span class=\"wl wl-kjv\" data-code=\"H559\">promised</span> to their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> that they should go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to possess","24":"So the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> and <span class=\"wl wl-kjv\" data-code=\"H3423\">possessed</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and thou <span class=\"wl wl-kjv\" data-code=\"H3665\">subduedst</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> them into their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> with their <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> that they might <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> with them as they would.","25":"And they <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> <span class=\"wl wl-kjv\" data-code=\"H1219\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and a <span class=\"wl wl-kjv\" data-code=\"H8082\">fat</span> <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H3423\">possessed</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> of all <span class=\"wl wl-kjv\" data-code=\"H2898\">goods,</span> <span class=\"wl wl-kjv\" data-code=\"H953\">wells</span> <span class=\"wl wl-kjv\" data-code=\"H2672\">digged,</span> <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> and <span class=\"wl wl-kjv\" data-code=\"H2132\">oliveyards,</span> and <span class=\"wl wl-kjv\" data-code=\"H3978\">fruit</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance:</span> so they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and were <span class=\"wl wl-kjv\" data-code=\"H7646\">filled,</span> and became <span class=\"wl wl-kjv\" data-code=\"H8080\">fat,</span> and <span class=\"wl wl-kjv\" data-code=\"H5727\">delighted</span> themselves in thy <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> goodness.","26":"Nevertheless they were <span class=\"wl wl-kjv\" data-code=\"H4784\">disobedient,</span> and <span class=\"wl wl-kjv\" data-code=\"H4775\">rebelled</span> against thee, and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> thy <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> their <span class=\"wl wl-kjv\" data-code=\"H1458\">backs,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> thy <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> which <span class=\"wl wl-kjv\" data-code=\"H5749\">testified</span> against them to <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> them to thee, and they <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> provocations.","27":"Therefore thou <span class=\"wl wl-kjv\" data-code=\"H5414\">deliveredst</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of their <span class=\"wl wl-kjv\" data-code=\"H6862\">enemies,</span> who <span class=\"wl wl-kjv\" data-code=\"H6887\">vexed</span> them: and in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of their <span class=\"wl wl-kjv\" data-code=\"H6869\">trouble,</span> when they <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> unto thee, thou <span class=\"wl wl-kjv\" data-code=\"H8085\">heardest</span> them from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> and according to thy <span class=\"wl wl-kjv\" data-code=\"H7227\">manifold</span> <span class=\"wl wl-kjv\" data-code=\"H7356\">mercies</span> thou <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> them <span class=\"wl wl-kjv\" data-code=\"H3467\">saviours,</span> who <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> them out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of their enemies.","28":"But after they had <span class=\"wl wl-kjv\" data-code=\"H5117\">rest,</span> they <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"w // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
