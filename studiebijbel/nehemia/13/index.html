ken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Op die dag werd er gelezen in het boek van Mozes, voor de oren van het volk; en daarin werd geschreven gevonden, dat de Ammonieten en Moabieten niet zouden komen in de gemeente van God, tot in eeuwigheid;","2":"Omdat zij de kinderen van Israël niet tegemoet waren gekomen met brood en met water, ja, Bileam tegen hen gehuurd hadden om hen te vloeken, hoewel onze God de vloek omkeerde in een zegen.","3":"Zo gebeurde het, toen zij deze wet hoorden, dat zij alle vermenging van Israël afscheidden.","4":"Eljasib nu, de priester, die gesteld was over de kamer van het huis van onze God, was voor deze tijd een nabestaande van Tobia geworden.","5":"En hij had hem een grote kamer gemaakt, waar zij tevoren het spijsoffer, de wierook en de vaten heenleidden, en de tienden van koren, van most en van olie, die bevolen waren voor de Levieten, en de zangers, en de poortwachters, alsook het hefoffer van de priesters.","6":"Doch bij dit alles was ik niet in Jeruzalem; want in het tweeëndertigste jaar van Arthahsasta, koning van Babel, kwam ik naar de koning; maar na verloop van *enige* dagen kreeg ik *opnieuw* verlof van de koning.","7":"En ik kwam te Jeruzalem, en begreep het kwaad dat Eljasib voor Tobia gedaan had, door hem een kamer te maken in de voorhoven van het huis van God.","8":"En het mishaagde mij zeer; zo wierp ik al het huisraad van Tobia buiten, uit de kamer.","9":"Vervolgens gaf ik bevel, en zij reinigden de kamers; en ik bracht daar de vaten van het huis van God weer in, met het spijsoffer en de wierook.","10":"Ook vernam ik dat het deel van de Levieten *hun* niet gegeven was; zodat de Levieten en de zangers, die het werk deden, gevlucht waren, ieder naar zijn akker.","11":"En ik twistte met de overheden, en zei: Waarom is het huis van God verlaten? Doch ik verzamelde hen, en herstelde ze op hun plaats.","12":"Toen bracht heel Juda de tienden van het koren, en van de most, en van de olie, naar de schatkamers.","13":"En ik stelde tot schatmeesters over de schatten Selemja, de priester, en Zadok, de schrijver, en Pedaja, uit de Levieten; en aan hun zijde Hanan, de zoon van Zakkur, de zoon van Matthanja; want zij werden betrouwbaar geacht, en hun werd opgelegd het aan hun broeders uit te delen.","14":"Denk aan mij, mijn God, in dit opzicht; en delg mijn weldaden niet uit, die ik aan het huis van mijn God en aan Zijn wachten gedaan heb.","15":"In diezelfde dagen zag ik in Juda mensen die persen traden op de sabbat, en die garven binnenbrachten, die zij op ezels laadden; alsook wijn, druiven en vijgen, en allerlei last, die zij op de sabbatdag naar Jeruzalem binnenbrachten; en ik waarschuwde *hen* op de dag dat zij eetwaren verkochten.","16":"Daar woonden ook Tyriërs binnen, die vis aanbrachten, en allerlei koopwaren, die zij op de sabbat verkochten aan de kinderen van Juda en in Jeruzalem.","17":"Zo twistte ik met de edelen van Juda, en zei tegen hen: Wat voor een slechte zaak is dit, die u doet, en waarmee u de sabbatdag ontheiligt?","18":"Deden uw vaders niet zo, en bracht onze God niet al dit kwaad over ons en over deze stad? En u maakt de brandende toorn nog groter over Israël, door de sabbat te ontheiligen.","19":"Het gebeurde nu, toen de poorten van Jeruzalem voor de sabbat schaduw begonnen te geven, dat ik bevel gaf dat de deuren gesloten werden; en ik beval dat zij ze niet zouden opendoen tot na de sabbat; en ik stelde enkelen van mijn jongens aan bij de poorten, *opdat* er geen last zou binnenkomen op de sabbatdag.","20":"Toen overnachtten de kramers en de verkopers van allerlei koopwaren buiten voor Jeruzalem, een of twee keer.","21":"Zo waarschuwde ik hen, en zei tegen hen: Waarom overnacht u tegenover de muur? Als u het weer doet, zal ik de hand aan u slaan. Vanaf dat moment kwamen zij niet meer op de sabbat.","22":"Vervolgens zei ik tegen de Levieten dat zij zich zouden reinigen, en de poorten komen bewaken, om de sabbatdag te heiligen. Denk ook hierin aan mij, mijn God! en spaar mij naar de overvloed van Uw goedertierenheid.","23":"Ook zag ik in die dagen Joden die Asdodische, Ammonietische *en* Moabietische vrouwen bij zich hadden laten wonen.","24":"En hun kinderen spraken half Asdodisch, en zij konden geen Joods spreken, maar naar de taal van ieder volk.","25":"Zo twistte ik met hen, en vloekte hen, en sloeg *sommige* mannen van hen, en trok hun het haar uit; en ik liet hen zweren bij God: U zult uw dochters niet aan hun zonen geven, en van hun dochters niet nemen voor uw zonen of voor uzelf!","26":"Heeft Salomo, de koning van Israël, daarin niet gezondigd, hoewel er onder veel heidenvolken geen koning was zoals hij, en hij door zijn God bemind was, en God hem tot koning over heel Israël gesteld had? Ook hem lieten de vreemde vrouwen zondigen.","27":"Zouden wij dan naar u luisteren, dat u al dit grote kwaad zou doen, door tegen onze God te overtreden, door vreemde vrouwen bij u te laten wonen?","28":"Ook was er *een* van de kinderen van Jojada, de zoon van Eljasib, de hogepriester, schoonzoon geworden van Sanballat, de Horoniet; daarom joeg ik hem van mij weg.","29":"Denk aan hen, mijn God, omdat zij het priesterdom hebben verontreinigd, ja, het verbond van het priesterdom en van de Levieten.","30":"Zo reinigde ik hen van alle vreemden; en ik stelde de wachten van de priesters en van de Levieten vast, ieder in zijn werk;","31":"Ook voor het offer van het hout, op vastgestelde tijden, en voor de eerstelingen. Denk aan mij, mijn God, ten goede."},"SV":{"1":"Te dien dage werd er gelezen in het boek van Mozes, voor de oren des volks; en daarin werd geschreven gevonden, dat de Ammonieten en Moabieten niet zouden komen in de gemeente Gods, tot in eeuwigheid;","2":"Omdat zij den kinderen Israëls niet waren tegengekomen met brood en met water, ja, Bileam tegen hen gehuurd hadden, om hen te vloeken, hoewel onze God den vloek omkeerde in een zegen.","3":"Zo geschiedde het, als zij deze wet hoorden, dat zij alle vermengeling van Israël afscheidden.","4":"Eljasib nu, de priester, die gesteld was over de kamer van het huis onzes Gods, was voor dezen nabestaande van Tobia geworden.","5":"En hij had hem een grote kamer gemaakt, alwaar zij te voren henenleiden het spijsoffer, den wierook en de vaten, en de tienden van koren, van most en van olie, die bevolen waren voor de Levieten, en de zangers, en de poortiers, mitsgaders het hefoffer der priesteren.","6":"Doch in dit alles was ik niet te Jeruzalem; want in het twee en dertigste jaar van Arthahsasta, koning van Babel, kwam ik tot den koning; maar ten einde van *sommige* dagen verkreeg ik *weder* verlof van den koning.","7":"En ik kwam te Jeruzalem, en verstond van het kwaad, dat Eljasib voor Tobia gedaan had, makende hem een kamer in de voorhoven van Gods huis.","8":"En het mishaagde mij zeer; zo wierp ik al het huisraad van Tobia buiten, uit de kamer.","9":"Voorts gaf ik bevel, en zij reinigden de kameren; en ik bracht daar weder in de vaten van Gods huis, met het spijsoffer en den wierook.","10":"Ook vernam ik, dat der Levieten deel *hun* niet gegeven was; zodat de Levieten en de zangers, die het werk deden, gevloden waren, een iegelijk naar zijn akker.","11":"En ik twistte met de overheden, en zeide: Waarom is het huis Gods verlaten? Doch ik vergaderde hen, en herstelde ze in hun stand.","12":"Toen bracht gans Juda de tienden van het koren, en van den most, en van de olie, in de schatten.","13":"En ik stelde tot schatmeesters over de schatten, Selemja, den priester, en Zadok, den schrijver, en Pedaja, uit de Levieten; en aan hun hand Hanan, den zoon van Zakkur, den zoon van Matthanja; want zij werden getrouw geacht, en hun werd opgelegd aan hun broederen uit te delen.","14":"Gedenk mijner, mijn God, in dezen; en delg mijn weldadigheden niet uit, die ik aan het huis mijns Gods en aan Zijn wachten gedaan heb.","15":"In dezelfde dagen zag ik in Juda, die persen traden op den sabbat, en die garven inbrachten, die zij op ezels laadden; als ook wijn, druiven en vijgen, en allen last, dien zij te Jeruzalem inbrachten op den sabbatdag; en ik betuigde *tegen* *hen* ten dage, als zij eetwaren verkochten.","16":"Daar waren ook Tyriërs binnen, die vis aanbrachten, en alle koopwaren, die zij op den sabbat verkochten aan de kinderen van Juda en te Jeruzalem.","17":"Zo twistte ik met de edelen van Juda, en zeide tot hen: Wat voor een boos ding is dit, dat gijlieden doet, en ontheiligt den sabbatdag?","18":"Deden niet uw vaders alzo, en onze God bracht al dit kwaad over ons en over deze stad? En gijlieden maakt de hittige gramschap nog meer over Israël, ontheiligende den sabbat.","19":"Het geschiedde nu, als de poorten van Jeruzalem schaduw gaven, voor den sabbat, dat ik bevel gaf, en de deuren werden gesloten; en ik beval, dat zij ze niet zouden opendoen tot na den sabbat; en ik stelde van mijn jongens aan de poorten, *opdat* *er* geen last zou inkomen op den sabbatdag.","20":"Toen vernachtten de kramers, en de verkopers van alle koopwaren, buiten voor Jeruzalem, eens of tweemaal.","21":"Zo betuigde ik tegen hen, en zeide tot hen: Waarom vernacht gijlieden tegenover den muur? Zo gij het weder doet, zal ik de hand aan u slaan. Van dien tijd af kwamen zij niet op den sabbat.","22":"Voorts zeide ik tot de Levieten, dat zij zich zouden reinigen, en de poorten komen wachten, om den sabbatdag te heiligen. Gedenk mijner ook *in* dezen, mijn God! en verschoon mij naar de veelheid Uwer goedertierenheid.","23":"Ook zag ik in die dagen Joden, die Asdodische, Ammonietische *en* Moabietische vrouwen *bij* *zich* hadden doen wonen.","24":"En hun kinderen spraken half Asdodisch, en zij konden geen Joods spreken, maar naar de taal eens iegelijken volks.","25":"Zo twistte ik met hen, en vloekte hen, en sloeg *sommige* mannen van hen, en plukte hun het haar uit; en ik deed hen zweren bij God: Indien gij uw dochteren hun zonen zult geven, en indien gij van hun dochteren voor uw zonen of voor u zult nemen!","26":"Heeft niet Salomo, de koning van Israël, daarin gezondigd, hoewel er onder vele heidenen geen koning was, gelijk hij, en hij zijn God lief was, en God hem ten koning over gans Israël gesteld had? Ook hem deden de vreemde vrouwen zondigen.","27":"Zouden wij dan naar ulieden horen, dat gij al dit grote kwaad zoudt doen, overtredende tegen onzen God, doende vreemde vrouwen *bij* *u* wonen?","28":"Ook was er *een* van de kinderen van Jojada, den zoon van Eljasib, den hogepriester, schoonzoon geworden van Sanballat, den Horoniet; daarom jaagde ik hem van mij weg.","29":"Gedenk aan hen, mijn God, omdat zij het priesterdom hebben verontreinigd, ja, het verbond des priesterdoms en der Levieten.","30":"Alzo reinigde ik hen van alle vreemden; en ik bestelde de wachten der priesteren en der Levieten, elk op zijn werk;","31":"Ook tot het offer des houts, op bestemde tijden, en tot de eerstelingen. Gedenk mijner, mijn God, ten goede."},"KJV":{"1":"On that day they read in the book of Moses in the audience of the people; and therein was found written, that the Ammonite and the Moabite should not come into the congregation of God for ever;","2":"Because they met not the children of Israel with bread and with water, but hired Balaam against them, that he should curse them: howbeit our God turned the curse into a blessing.","3":"Now it came to pass, when they had heard the law, that they separated from Israel all the mixed multitude.","4":"And before this, Eliashib the priest, having the oversight of the chamber of the house of our God, *was* allied unto Tobiah:","5":"And he had prepared for him a great chamber, where aforetime they laid the meat offerings, the frankincense, and the vessels, and the tithes of the corn, the new wine, and the oil, which was commanded *to be given* to the Levites, and the singers, and the porters; and the offerings of the priests.","6":"But in all this *time* was not I at Jerusalem: for in the two and thirtieth year of Artaxerxes king of Babylon came I unto the king, and after certain days obtained I leave of the king:","7":"And I came to Jerusalem, and understood of the evil that Eliashib did for Tobiah, in preparing him a chamber in the courts of the house of God.","8":"And it grieved me sore: therefore I cast forth all the household stuff of Tobiah out of the chamber.","9":"Then I commanded, and they cleansed the chambers: and thither brought I again the vessels of the house of God, with the meat offering and the frankincense.","10":"And I perceived that the portions of the Levites had not been given *them*: for the Levites and the singers, that did the work, were fled every one to his field.","11":"Then contended I with the rulers, and said, Why is the house of God forsaken? And I gathered them together, and set them in their place.","12":"Then brought all Judah the tithe of the corn and the new wine and the oil unto the treasuries.","13":"And I made treasurers over the treasuries, Shelemiah the priest, and Zadok the scribe, and of the Levites, Pedaiah: and next to them *was* Hanan the son of Zaccur, the son of Mattaniah: for they were counted faithful, and their office *was* to distribute unto their brethren.","14":"Remember me, O my God, concerning this, and wipe not out my good deeds that I have done for the house of my God, and for the offices","15":"In those days saw I in Judah *some* treading wine presses on the sabbath, and bringing in sheaves, and lading asses; as also wine, grapes, and figs, and all *manner of* burdens, which they brought into Jerusalem on the sabbath day: and I testified *against them* in the day wherein they sold victuals.","16":"There dwelt men of Tyre also therein, which brought fish, and all manner of ware, and sold on the sabbath unto the children of Judah, and in Jerusalem.","17":"Then I contended with the nobles of Judah, and said unto them, What evil thing *is* this that ye do, and profane the sabbath day?","18":"Did not your fathers thus, and did not our God bring all this evil upon us, and upon this city? yet ye bring more wrath upon Israel by profaning the sabbath.","19":"And it came to pass, that when the gates of Jerusalem began to be dark before the sabbath, I commanded that the gates should be shut, and charged that they should not be opened till after the sabbath: and *some* of my servants set I at the gates, *that* there should no burden be brought in on the sabbath day.","20":"So the merchants and sellers of all kind of ware lodged without Jerusalem once or twice.","21":"Then I testified against them, and said unto them, Why lodge ye about the wall? if ye do *so* again, I will lay hands on you. From that time forth came they no *more* on the sabbath.","22":"And I commanded the Levites that they should cleanse themselves, and *that* they should come *and* keep the gates, to sanctify the sabbath day. Remember me, O my God, *concerning* this also, and spare me according to the greatness of thy mercy.","23":"In those days also saw I Jews *that* had married wives of Ashdod, of Ammon, *and* of Moab:","24":"And their children spake half in the sp d not been <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> them: for the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> and the <span class=\"wl wl-kjv\" data-code=\"H7891\">singers,</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> the <span class=\"wl wl-kjv\" data-code=\"H4399\">work,</span> were <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to his field.","11":"Then <span class=\"wl wl-kjv\" data-code=\"H7378\">contended</span> I with the <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Why is the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken?</span> And I gathered them <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> them in their place.","12":"Then <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithe</span> of the <span class=\"wl wl-kjv\" data-code=\"H1715\">corn</span> and the new <span class=\"wl wl-kjv\" data-code=\"H8492\">wine</span> and the <span class=\"wl wl-kjv\" data-code=\"H3323\">oil</span> unto the treasuries.","13":"And I made <span class=\"wl wl-kjv\" data-code=\"H686\">treasurers</span> over the <span class=\"wl wl-kjv\" data-code=\"H214\">treasuries,</span> <span class=\"wl wl-kjv\" data-code=\"H8018\">Shelemiah</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> <span class=\"wl wl-kjv\" data-code=\"H6305\">Pedaiah:</span> and next to <span class=\"wl wl-kjv\" data-code=\"H3027\">them</span> was <span class=\"wl wl-kjv\" data-code=\"H2605\">Hanan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2139\">Zaccur,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4983\">Mattaniah:</span> for they were <span class=\"wl wl-kjv\" data-code=\"H2803\">counted</span> <span class=\"wl wl-kjv\" data-code=\"H539\">faithful,</span> and their office was to <span class=\"wl wl-kjv\" data-code=\"H2505\">distribute</span> unto their brethren.","14":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> me, O my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> concerning this, and wipe not <span class=\"wl wl-kjv\" data-code=\"H4229\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H2617\">good</span> deeds that I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and for the offices","15":"In those <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> I in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> some <span class=\"wl wl-kjv\" data-code=\"H1869\">treading</span> wine <span class=\"wl wl-kjv\" data-code=\"H1660\">presses</span> on the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath,</span> and bringing <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H6194\">sheaves,</span> and <span class=\"wl wl-kjv\" data-code=\"H6006\">lading</span> <span class=\"wl wl-kjv\" data-code=\"H2543\">asses;</span> as also <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> <span class=\"wl wl-kjv\" data-code=\"H6025\">grapes,</span> and <span class=\"wl wl-kjv\" data-code=\"H8384\">figs,</span> and all manner of <span class=\"wl wl-kjv\" data-code=\"H4853\">burdens,</span> which they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> into <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> on the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> and I <span class=\"wl wl-kjv\" data-code=\"H5749\">testified</span> against them in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> wherein they <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> victuals.","16":"There <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> men of <span class=\"wl wl-kjv\" data-code=\"H6876\">Tyre</span> also therein, which <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H1709\">fish,</span> and all manner of <span class=\"wl wl-kjv\" data-code=\"H4377\">ware,</span> and <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> on the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and in Jerusalem.","17":"Then I <span class=\"wl wl-kjv\" data-code=\"H7378\">contended</span> with the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, What <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> is this that ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> and <span class=\"wl wl-kjv\" data-code=\"H2490\">profane</span> the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> day?","18":"<span class=\"wl wl-kjv\" data-code=\"H6213\">Did</span> not your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> thus, and <span class=\"wl wl-kjv\" data-code=\"H935\">did</span> not our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> all this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon us, and upon this <span class=\"wl wl-kjv\" data-code=\"H5892\">city?</span> yet ye <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> <span class=\"wl wl-kjv\" data-code=\"H2740\">wrath</span> upon <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> by <span class=\"wl wl-kjv\" data-code=\"H2490\">profaning</span> the sabbath.","19":"And it came to pass, that when the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> began to be <span class=\"wl wl-kjv\" data-code=\"H6751\">dark</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath,</span> I <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> that the <span class=\"wl wl-kjv\" data-code=\"H1817\">gates</span> should be <span class=\"wl wl-kjv\" data-code=\"H5462\">shut,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">charged</span> that they should not be <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> till <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath:</span> and some of my <span class=\"wl wl-kjv\" data-code=\"H5288\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> I at the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates,</span> that there should no <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> be brought <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> on the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> day.","20":"So the <span class=\"wl wl-kjv\" data-code=\"H7402\">merchants</span> and <span class=\"wl wl-kjv\" data-code=\"H4376\">sellers</span> of all kind of <span class=\"wl wl-kjv\" data-code=\"H4465\">ware</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">once</span> or twice.","21":"Then I <span class=\"wl wl-kjv\" data-code=\"H5749\">testified</span> against them, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Why <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge</span> ye <span class=\"wl wl-kjv\" data-code=\"H5048\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall?</span> if ye do so <span class=\"wl wl-kjv\" data-code=\"H8138\">again,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7971\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> on you. From that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> forth <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> they no more on the sabbath.","22":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> that they should <span class=\"wl wl-kjv\" data-code=\"H2891\">cleanse</span> themselves, and that they should <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates,</span> to <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> me, O my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> concerning this also, and <span class=\"wl wl-kjv\" data-code=\"H2347\">spare</span> me according to the <span class=\"wl wl-kjv\" data-code=\"H7230\">greatness</span> of thy mercy.","23":"In those <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> also <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> I <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> that had <span class=\"wl wl-kjv\" data-code=\"H3427\">married</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> of <span class=\"wl wl-kjv\" data-code=\"H796\">Ashdod,</span> of <span class=\"wl wl-kjv\" data-code=\"H5984\">Ammon,</span> and of Moab:","24":"And their <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> in the speech of <span class=\"wl wl-kjv\" data-code=\"H797\">Ashdod,</span> and <span class=\"wl wl-kjv\" data-code=\"H5234\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> in the Jews' <span class=\"wl wl-kjv\" data-code=\"H3066\">language,</span> but according to the <span class=\"wl wl-kjv\" data-code=\"H3956\">language</span> of <span class=\"wl wl-kjv\" data-code=\"H5971\">each</span> people.","25":"And I <span class=\"wl wl-kjv\" data-code=\"H7378\">contended</span> with them, and <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H582\">certain</span> of them, and plucked off their <span class=\"wl wl-kjv\" data-code=\"H4803\">hair,</span> and made them <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> by <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> saying, Ye shall not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> your <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> unto their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> their <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> unto your sons,","26":"Did not <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> by these things? yet among <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> was there no <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> like him, who was <span class=\"wl wl-kjv\" data-code=\"H157\">beloved</span> of his <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> him <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> nevertheless even <span class=\"wl wl-kjv\" data-code=\"H1571\">him</span> did <span class=\"wl wl-kjv\" data-code=\"H5237\">outlandish</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> cause to sin.","27":"Shall we then <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto you to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> to <span class=\"wl wl-kjv\" data-code=\"H4603\">transgress</span> against our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in <span class=\"wl wl-kjv\" data-code=\"H3427\">marrying</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> wives?","28":"And one of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3111\">Joiada,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H475\">Eliashib</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">high</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> was son in <span class=\"wl wl-kjv\" data-code=\"H2860\">law</span> to <span class=\"wl wl-kjv\" data-code=\"H5571\">Sanballat</span> the <span class=\"wl wl-kjv\" data-code=\"H2772\">Horonite:</span> therefore I chased","29":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> them, O my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H1352\">defiled</span> the <span class=\"wl wl-kjv\" data-code=\"H3550\">priesthood,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3550\">priesthood,</span> and of the Levites.","30":"Thus <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> I them from all <span class=\"wl wl-kjv\" data-code=\"H5236\">strangers,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">appointed</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">wards</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> in his business;","31":"And for the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> <span class=\"wl wl-kjv\" data-code=\"H7133\">offering,</span> at <span class=\"wl wl-kjv\" data-code=\"H6256\">times</span> <span class=\"wl wl-kjv\" data-code=\"H2163\">appointed,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H1061\">firstfruits.</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> me, O my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> for good."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dien dage","tekst":"Dit verstaan sommigen geschied te zijn, nadat Nehemia ten tweeden male van den koning Artaxerxes weder te Jeruzalem gekomen was. Zie vs.4, 6."},{"catchword":"Ammonieten en Moabieten","tekst":"Hebreeuws, Ammoniet en Moabiet."},{"catchword":"gemeente Gods,","tekst":"Zie Deu 23:1 ."}],"2":[{"catchword":"brood en met water,","tekst":"Dat is, spijs en drank."},{"catchword":"hen gehuurd hadden,","tekst":"Versta, Israël; dat is het volk van Israël."}],"3":[{"catchword":"vermengeling","tekst":"Dat is, allen die van vreemde afgodische, heidense volken waren, en niet van Israël. Vergelijk boven, Neh 9:2 ."}],"4":[{"catchword":"kamer","tekst":"Dat is, kamers; zie onder, vs.9, en Ezr 8:29 ."},{"catchword":"nabestaande","tekst":"Dat is, hij had zich met hem bevriend, of aan hem verzwagerd, niettegenstaande dat hij een bitter vijand van Gods volk was. Zie boven, Neh 6:1 , Neh 6:14 , Neh 6:17 , Neh 6:19 , en vergelijk onder, vs.28."}],"5":[{"catchword":"hem","tekst":"Tobia."},{"catchword":"grote kamer","tekst":"De wanden van enige kamers doorbrekende, had hij voor Tobia een grote ruime kamer daarvan gemaakt, om zijn huisraad daarin te stellen. Zie vs.8."},{"catchword":"die bevolen","tekst":"Hebreeuws, het bevel, of gebod der Levieten, enz.; dat is, waarvan God bevolen had, dat men ze den Levieten, enz. geven zou, of het bevolen of verordineerd [deel] der Levieten, enz. Zie Num 18:24 ."},{"catchword":"het hefoffer","tekst":"Dat is, hetgeen zij den priesters moesten geven, te weten, de tienden van de tienden der Levieten, enz.; zie Num 18:8 , Num 18:26 ."}],"6":[{"catchword":"alle dezen","tekst":"Nehemia wil zeggen dat alles in zijn afwezen binnen korten tijd weder vervallen was."},{"catchword":"twee en dertigste jaar","tekst":"Als ik twaalf jaren met des konings toestemming te Jeruzalem geweest was."},{"catchword":"Arthahsasta,","tekst":"Zie Ezr 6:14 ."},{"catchword":"Babel,","tekst":"Hetwelk nu was onder de Perzische monarchie."},{"catchword":"einde","tekst":"Dat is, na enigen tijd, of [gelijk anderen] na een vol jaar, hetwelk door dagen somtijds wordt verstaan."},{"catchword":"verkreeg ik","tekst":"Of, mij werd verlof verkregen. Het Hebreeuwse woord zou eigenlijk betekenen: Ik werd geëist, verzocht, of, ontboden. Het kan zijn dat Nehemia, zich ontziende om zelf weder verlof te begeren, hetzelve door anderen heeft laten verzoeken, en dat de koning hem daarop ontboden en verlof gegeven heeft. Zonder twijfel hebben ook godvruchtige Joden Nehemia laten weten den vervallen staat van Gods volk en zijn overkomst ernstiglijk verzocht, enz."}],"7":[{"catchword":"voorhoven","tekst":"Gelijk boven, Neh 8:17 ."}],"8":[{"catchword":"mishaagde","tekst":"Hebreeuws, het was mij zeer kwaad; dat is, [gelijk de Schrift elders spreekt] het was zeer kwaad in mijn ogen; dat is, het misviel mij zeer."},{"catchword":"al het huisraad","tekst":"Hebreeuws, alle vaten, of, alle gereedschap des huizes van Tobia."}],"9":[{"catchword":"gaf ik bevel,","tekst":"Hebreeuws, ik zeide; zie 2Ch 29:24 , 2Ch 29:27 ; Job 9:7 ; Est 9:25 , en vergelijk Gen 1:3 ; Jon 2:10 met de aantekening. Of, ik zeide dat zij de kamers zouden reinigen. Alzo onder, vs.19."}],"10":[{"catchword":"deel","tekst":"Dat is, het onderhoud, dat men hun naar Gods wet schuldig was te geven; en waartoe het volk zich met ede verplicht had, boven, Neh 10:37 ."},{"catchword":"werk deden,","tekst":"Te weten, des Heeren, dat is, de gewoonlijke godsdienst."}],"11":[{"catchword":"twistte","tekst":"Dat is, ik bestrafte hen, bekeef hen scherpelijk; alzo vs.17, 25."},{"catchword":"vergaderde hen,","tekst":"Uit de plaatsen, waar zij heen gevlucht en verstrooid waren."},{"catchword":"in hun stand","tekst":"Om den godsdienst, gelijk tevoren, weder waar te nemen."}],"12":[{"catchword":"schatten","tekst":"Dat is, schatkamers. Zie boven, vs.5."}],"13":[{"catchword":"over de schatten,","tekst":"Gelijk boven, Neh 12:44 , en 1Ch 26:20 , enz.; 2Ch 31:12 , enz."},{"catchword":"aan hun hand Hanan,","tekst":"Dat is, tot hun dienst of hulp."},{"catchword":"getrouw geacht,","tekst":"Vergelijk boven, Neh 7:2 ."},{"catchword":"hun werd opgelegd","tekst":"Hebreeuws, [het was] op hen; dat is, het was hun plicht, hun last."}],"14":[{"catchword":"Gedenk mijner,","tekst":"Vergelijk Gen 8:1 ; Heb 6:10 , en onder, vs.22, 31, en zie boven, Neh 5:19 ."},{"catchword":"in dezen;","tekst":"Of, dezen aangaande."},{"catchword":"weldadigheden","tekst":"Gelijk 2Ch 32:32 , en 2Ch 35:26 ."},{"catchword":"wachten","tekst":"Bezorgende dat de godsdienst in uw tempel van een ieder, volgens zijn ambt, wel mocht worden waargenomen; zie Num 3:7 ."}],"15":[{"catchword":"persen","tekst":"Wijnpersen en oliepersen."},{"catchword":"allen last,","tekst":"Dat is, allerlei last."},{"catchword":"betuigde","tekst":"Verklarende bij den Heere dat ik het niet meer zou lijden."},{"catchword":"tegen hen","tekst":"Gelijk onder, vs.21."}],"16":[{"catchword":"Tyriërs","tekst":"Geboortig uit de vermaarde stad Tyrus; zie Jos 19:29 ."},{"catchword":"binnen,","tekst":"Binnen Jeruzalem."},{"catchword":"alle koopwaren,","tekst":"Dat is, allerlei."}],"17":[{"catchword":"edelen van Juda,","tekst":"Hebreeuws, witte; zie boven, Neh 2:16 ."}],"18":[{"catchword":"kwaad","tekst":"Al deze plagen en straffen."},{"catchword":"maakt","tekst":"Hebreeuws, doet hittige gramschap toe."},{"catchword":"gramschap","tekst":"Des Heeren."}],"19":[{"catchword":"schaduw gaven,","tekst":"Of, overschaduwd waren; dat is, tegen den avond, als de zon begon onder te gaan."},{"catchword":"bevel gaf,","tekst":"Hebreeuws, zeide; gelijk boven, vs.9."}],"20":[{"catchword":"alle koopwaren,","tekst":"Dat is, allerlei."}],"22":[{"catchword":"poorten","tekst":"Versta, des tempels, passende op alles, wat tot de heiliging des sabbats diende, zonder iets anders op den sabbat te doen, en in het bijzonder toeziende dat er geen onreinen mochten inkomen; zie Num 3:7 ; 2Ch 23:19 ."},{"catchword":"veelheid","tekst":"Of, grootheid."},{"catchword":"goedertierenheid","tekst":"Of, weldadigheid."}],"23":[{"catchword":"Asdodische,","tekst":"Dat is, heidense vrouwen van allerlei vreemde volken. Asdod was een stad en streek der Filistijnen. Zie 1Sa 5:1-2 , enz."},{"catchword":"doen wonen","tekst":"Dat is, getrouwd. [Zie Ezr 10:2 ] niettegenstaande de reformatie tevoren bij Ezra gedaan, Ezra 9, en Ezra 10, en hun eigen belofte [boven, Neh 10:30 ] met ede verzegeld. Alzo vs.27."}],"24":[{"catchword":"half Asdodisch,","tekst":"Anders, de helft hunner kinderen, of een deel."},{"catchword":"konden","tekst":"Hebreeuws, zij onderkenden niet, of onderscheidden niet."},{"catchword":"eens iegelijken volks","tekst":"Hebreeuws, van volk en volk; dat is, van het ene en het andere volk, elk zo hij van zijne moeder geleerd had, hebbende alzo een verbasterde taal met een verbasterde religie."}],"25":[{"catchword":"vloekte hen,","tekst":"Uit ijver en justitie verklarende dat zij als meinedige verbondbrekers den vloek op zich geladen hadden, en waardig waren verbannen of van Gods volk afgesneden te worden."},{"catchword":"sloeg","tekst":"Tot een openbare straf en versmaadheid. Vergelijk Deu 25:2 ; 2Sa 10:4 ."},{"catchword":"zweren bij God","tekst":"Dezen eed, dien hij hun voorzegt, moesten zij op zich nemen, opdat zij, door deze middelen opgewekt zijnde, hierna in zulke gruwelen niet weder mochten vervallen."},{"catchword":"zult nemen","tekst":"Een afgebroken rede in het eedzweren gebruikelijk, waarop men verstaan kan: Zo zult gij vervloekt zijn, of zo straffe u God. Zie Gen 14:23 ."}],"27":[{"catchword":"Zouden wij dan","tekst":"Dat is, zouden wij dan u zulks toelaten, daar gij veel meer de verleiding onderworpen zijt dan die grote, wijze en van God beminde koning Salomo?"},{"catchword":"bij u wonen?","tekst":"Zie vs.23."}],"28":[{"catchword":"een van de kinderen","tekst":"Josefus beschrijft dat dit geweest is Manasse, de broeder van den hogepriester Jaddua, of Jaddus, van welken zie, boven, Neh 12:11 ."},{"catchword":"Sanballat,","tekst":"Zie boven, Neh 2:10 , en Neh 4:1 , en Neh 6:1 , enz."}],"29":[{"catchword":"Gedenk aan hen,","tekst":"Gelijk boven, Neh 6:14 ."},{"catchword":"verontreinigd,","tekst":"Begaande zulke gruwelen, gelijk boven verhaald is."},{"catchword":"verbond","tekst":"Versta, het bijzonder en nader verbond, dat God met Aäron en zijn zaad, mitsgaders de Levieten, aangaande hun heilige ambten gemaakt had."}],"30":[{"catchword":"alle vreemden;","tekst":"Hebreeuws, allen vreemde; in het enkelvoudig getal. Versta de heidense vrouwen en kinderen, met de aanklevende onreinheid des heidendoms."},{"catchword":"wachten","tekst":"Gelijk boven, vs.14."}],"31":[{"catchword":"offer des houts,","tekst":"Zie boven, Neh 10:34 ."},{"catchword":"Gedenk mijner,","tekst":"Vergelijk boven, Neh 5:19 , en in vs.14, 22."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"On that day there was read in the book of Moseh, before the ears of the people: [Some conceive this to have been done, after that Nehemia was come back the second time from king Artaxerxes to Jerusalem. See verse 4. And 6.] And therein was found written, that the Ammonites, and the Moabites, [Hebr. Ammonite, and Moabite] should not come into the congregation of God forever: [see Deu.23.on v.1.]"}],"2":[{"catchword":null,"tekst":"Because they had not met the children of Israel with bread, and with water; [That is, with meat and drink] yea had hired Bileam against him, [meaning Israel; that is, the people of Israel] to curse him: Howbeit, our God turned the curse into a blessing."}],"3":[{"catchword":null,"tekst":"SO it came to pass, when they heard this law, that they separated from Israel all mixture. [That is, all those that were of strange Idolatrous heathenish nations, and not of Israel. Compare above chap.9.2.]"}],"4":[{"catchword":null,"tekst":"Now Eljasib the Priest, who was set over the chamber, [That is, chambers. See below v.9. and Ezra 8.29.] of the house of our God, was heretofore nigh of kin to Tobia: [that is, was allied unto him, or had joined affinity with him, although he was bitter Enemy to the people of God. See above chap.6.verse 1,14,17,19. And compare below v.28.]"}],"5":[{"catchword":null,"tekst":"And he had made for him [To wit, for Tobia] a great chamber, [breaking down the walls of certain chambers, he had made of them a great large chamberfor Tobia, to put his household stuff in. See verse 8.] where a foretime they laid the meat-offering, the frankincense, and the vessels, and the tithes of corn, of new wine, and of oil, which were commanded for the Levites, and the Singers, and the Porters; [Hebr. the command, or, commandment of the Levites, etc. That is, concerning which God had commanded that they should be given to the Levites, etc. Or, the commanded, or, ordained (portion) of the Levites, etc. See Num 18:24.] together with the heave-offerings of the Priests. [that is, that which they were to give unto the Priests, to wit, the tithes of the tithes of the Levites, etc. See Num 18:8,26.]"}],"6":[{"catchword":null,"tekst":"But in all this (time) was not I at Jerusalem: [Intimating that in a short space of time, while he was absent, all fell to decay again] for in the two and thirtieth year [when I had been twelve years at Jerusalem with the Kings leave or consent] of Arthasasta [see Ezra 6.on verse 14] king of Babel, [which was now under the Persian Monarchy] came I unto the king; but at the end of (certain) days [that is, after a while, or (as others) after full year was expired, which is sometimes understood by days] obtained I leave (again) of the king. [or, leave was obtained for me. The Hebrew word doth properly signify: I was required, summoned, or, set for. It may be that Nehemiah fearing himself to ask leave again, caused the same to be asked or craved by others, and that thereupon the King sent for him, and gave him leave. Yea without doubt some godly Jews did certify Nehemia of the decayed state and condition of Gods people, and earnestly required his coming unto them, etc.]"}],"7":[{"catchword":null,"tekst":"And I came to Jerusalem, and understood of the evil that Eljasib had done for Tobia, making a chamber for him in the Courts of the house of God. [as above chap.8.16.]"}],"8":[{"catchword":null,"tekst":"And it displeased me sore: [Hebr. it was very evil unto me; that is, (as the scripture elsewhere speaketh) it was very evil in mine eyes; that is, it vexed, or grieved me sore] So I cast forth all the household stuff of Tobia out of the chamber. [Hebr. all the vessels, or, all the furniture of the house of Tobia.]"}],"9":[{"catchword":null,"tekst":"Moreover, I gave command, [Hebr. I said. See 2 Chron.29.24,27. Job 9:7. Esth.9.25. and compare Genes.1.3. Jona 2.11. with the annotate.] and they cleansed the chambers: [or, I said that they should cleanse the chambers. So below verse 19.] And I brought in thither again the vessels of the house of God, with the meat-offering and the frankincense."}],"10":[{"catchword":null,"tekst":"Also I perceived that the portion of the Levites had not been given (them): [That is, the maintenance, which they were bound to give and allow them according to the law of God: And whereunto the people had engaged themselves by solemn oath, above chap.10.37.] So that the Levites and the Singers that did the work, [to wit, of the Lord; that is, the usual service of God] were fled every one to his field."}],"11":[{"catchword":null,"tekst":"And I contended with the Rulers, [That is, I reproved them, chid them sharply. So vers.17.25.] and said; why is the house of God forsake? Howbeit, I gathered them together, [to wit, from the places whither they were fled and scattered] and restored them to their station. [to observe again, or wait upon the worship of God, as they had done formerly.]"}],"12":[{"catchword":null,"tekst":"Then all Juda brought the tithes of corn, and of new wine, and of oil, into the Treasures. [That is, Treasures, Store-houses. See above on verse 5.]"}],"13":[{"catchword":null,"tekst":"And I appointed Treasurers over the Treasures, [As above chap.12.44. and 1 Chron.26.20. etc. 2 Chron.31.12, etc.] Selemja the Priest, and Zadok the Scribe, and of the Levites, Pedaja: And at their hand [that is, for their service or help] Hanan the son of Zacchur, the son of Matthanja: For they were counted faithful, [compare above chap.7.2.] and it was imposed upon them [Hebr. (it was) upon them: That is, it was their duty their office, their charge] to distribute unto their brethren."}],"14":[{"catchword":null,"tekst":"Remember me, [compare Genes.8.on vers 1. Heb 6:10. and below verse 22.31. and see above chap. 5. On vers.19.] my God, in this: [or, concerning this] And blot not out my good deeds, [as 2 Chron.32.on vers.32. and 35.on vers.26.] that I have done for the house of my God, and for the watches thereof. [taking care that the service of God in the Temple might be well observed and performed by every one, according to his office and place. See Num.13.on verse 7.]"}],"15":[{"catchword":null,"tekst":"In those days saw I in the Juda, those that trod presses [To wit, wine-presses and oil-presses] on the Sabbath, and those that brought in sheaves, which they laded on asses; as also wine, grapes, and figs, and all (or every) burden, [That is, all manner of burdens] which they brought into Jerusalem on the Sabbath day: And I testified against them [as below verse 21.] in the day wherein they sold victuals. [professing before the Lord, that I would suffer it no longer.]"}],"16":[{"catchword":null,"tekst":"There dwelt also Tyrians [That were born in the famous city of Tyre. See Jodh.19.on vers.29.] therein [to wit, in Jerusalem] who brought in fish, and all [that is, all manner of] provision and merchandise, which they sold on the Sabbath unto the children of Juda and at Jerusalem."}],"17":[{"catchword":null,"tekst":"Then I contended with the Nobles [Hebr. whiteones. See above cha.2.on verse 16.] of Juda, and said utno them; what evil thing is this that ye do, and profane the Sabbath-day?"}],"18":[{"catchword":null,"tekst":"Did not your Fathers thus, and our God brought all this evil [All these plagues and punishments] upon us, and upon this city? And ye make the fierce wrath [to wit, of the Lord] yet more [Hebr. add fierce wrath] upon Israel, profaning the Sabbath."}],"19":[{"catchword":null,"tekst":"Now it came to pas, when the gates of Jerusalem gave shadow, [Or, were over shadowed: That is, towards evening, when the sun began to set] before the Sabbath, that I gave command, [Hebr. said, as above verse 9.] and the doors were shut; and I charged that they should not open them till after the Sabbath: And I set (some) of my youths at the gates, (That there) should no burden come in on the Sabbath day."}],"20":[{"catchword":null,"tekst":"Then the Merchants, and sellers of all [That is, all kind of] saleware, overnighted without Jerusalem once or twice."}],"21":[{"catchword":null,"tekst":"So I testified against them, and said unto them, why overnight ye over against the wall? If ye do so again, I will lay hand on you: From that time forth came they no (more) on the Sabbath."}],"22":[{"catchword":null,"tekst":"Moreover, I said unto the Levites, that they should cleanse themselves, and come and keep the gates, [Meaning of the Temple, observing all that was requisite for the sanctifying of the Sabbath, without doing any thing else on the Sabbath, and in particular, looking and taking care that no unclean persons might come into the Temple. See Num 3:7. and 2 Chron.23.19.] to sanctify the Sabbath day: Remember me also (in) this, my God, and spare me, according to the multitude [or greatness] of thy goodness. [or, loving kindness.]"}],"23":[{"catchword":null,"tekst":"I saw also in those days Jews, that had caused Asdoditish, Ammonitish, and Moabitish wives [That is, heathenish wives of all kind of strange nations. Asdod was a city and country of the Philistines. See 1 Sam.5.1,2, etc.] to dwell (with them). [that is, had married those strange wives, (See Ezra 10.on vers.2.) not with standing the reformation lately made by Ezra, Ezra chapters 9. And 10. And their own vow and promise sealed and confirmed with an oath, above chap.10.30. So verse 27.]"}],"24":[{"catchword":null,"tekst":"And their children psake half in the Asdoditish speech, [Oth. half of their children, or, a part, etc.] and they could not speak in the Jews language: [Hebr. they discerned not, or, distinguished not, etc.] but according to the Language of each people. [Hebr. of people and people; that is, of the one and the other people, every one as he had learnt of his mother, having thus a bastardly mungrell language, with a bastardly mungrell Religion.]"}],"25":[{"catchword":null,"tekst":"Then I contended with them, and cursed them, [Out of zeal unto justice, declaring, that as perjured covenant-breakers, they had brought a curse upon themselves, and had deserved to be banned, or cut off from the people of God] and smote (some) men of them, and plucked off (their) hair: [for an open punishment and disgrace. Compare Deu.25.2. and 2 Sam.10.14.] and Imade them swear by God; if ye shall give your daughters unto their sons, and if ye shall take of their daughters for your sons, or your selves! [an abrupt kind of speech, which was frequently used in oaths or swearing, wherein must be understood, then thou shalt be cursed, or, then let God punish thee. See Gen.14.on vers.23. This oath which he pronounceth before them, they were to take the same upon themselves, that being by this means stirred up, they might not hereafter fall into the same abomination again.]"}],"26":[{"catchword":null,"tekst":"Did not Salomon king of Israel sin therein? [See 1 Kings 11.4.] Howbeit, among many heathens there was no king like him, [See 1 Kings 3.13. 2 Chr.1.12.] and he was beloved of his God, and God had made him king over all Israel: also him did strange women cause to sin."}],"27":[{"catchword":null,"tekst":"Should we then hearken unto you, that ye should do all this great evil, transgressing against God, causing strange wives to dwell (with you)? [See on verse 23. That is, should we then suffer you to commit the like who are much more subject to be seduced, then that great and wise king Solomon was, who was beloved of God?]"}],"28":[{"catchword":null,"tekst":"Also (one) of the children of Jojad // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
