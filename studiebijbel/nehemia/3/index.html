elatja, de Gibeoniet, en Jadon, de Meronothiet, de mannen van Gibeon en van Mizpa; tot aan de zetel van de landvoogd aan deze zijde van de rivier.","8":"Aan zijn hand verbeterde Uzziël, de zoon van Harhoja, *een* van het goudsmid, en aan zijn hand verbeterde Hananja, de zoon van een van de apothekers; en zij lieten Jeruzalem tot aan de brede muur.","9":"En aan hun hand verbeterde Refaja, de zoon van Hur, leider van het halve deel van Jeruzalem.","10":"Verder aan hun hand verbeterde Jedaja, de zoon van Harumaf, en tegenover zijn huis; en aan zijn hand verbeterde Hattus, de zoon van Hasabneja.","11":"Het andere stuk verbeterden Malchia, de zoon van Harim, en Hassub, de zoon van Pahath-Moab; daarbij de Bakoventoren.","12":"En aan zijn hand verbeterde Sallum, de zoon van Lohes, leider van het *andere* halve deel van Jeruzalem, hij en zijn dochters.","13":"De Dalpoort verbeterden Hanun, en de inwoners van Zanoah; zij bouwden die, en richtten haar deuren op, met haar sloten en haar grendelen; daarbij duizend el aan de muur, tot aan de Mistpoort.","14":"De Mistpoort nu verbeterde Malchia, de zoon van Rechab, leider van het deel Beth-Cherem; hij bouwde ze, en richtte haar deuren op, met haar sloten en haar grendelen.","15":"En de Fonteinpoort verbeterde Sallum, de zoon van Kol-Hoze, leider van het deel van Mizpa; hij bouwde ze, en overdekte ze, en richtte haar deuren op, met haar sloten en haar grendelen; daarbij de muur van de vijver Schelah bij de tuin van de koning, en tot aan de trappen, die naar beneden gaan vanaf Davids stad.","16":"Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden.","17":"Na hem verbeterden de Levieten, Rehum, de zoon van Bani; aan zijn hand verbeterde Hasabja, de leider van het halve deel van Kehila, in zijn deel.","18":"Na hem verbeterden hun broeders, Bavai, de zoon van Henadad, de leider van het *andere* halve deel van Kehila.","19":"Aan zijn hand verbeterde Ezer, de zoon van Jesua, de leider van Mizpa, een ander stuk; tegenover de opgang naar het wapenhuis, aan de hoek.","20":"Na hem verbeterde zeer vurig Baruch, de zoon van Zabbai, een ander stuk; van de hoek tot aan de deur van het huis van Eljasib, de hogepriester.","21":"Na hem verbeterde Meremoth, de zoon van Uria, de zoon van Koz, een ander stuk; van de huisdeur van Eljasib af, tot aan het einde van Eljasibs huis.","22":"En na hem verbeterden de priesters, die woonden in de vlakke velden.","23":"Daarna verbeterden Benjamin, en Hassub, tegenover hun huis; na hem verbeterde Azaria, de zoon van Maäseja, de zoon van Hananja, bij zijn huis.","24":"Na hem verbeterde Binnuï, de zoon van Henadad, een ander stuk; van het huis van Azaria tot aan de hoek en tot aan het punt;","25":"Palal, de zoon van Uzai, tegen de hoek, en de hoge toren die uitsteekt vanaf het huis van de koning, die bij het voorhof van de gevangenis is; na hem Pedaja, de zoon van Paros;","26":"De Nethinim nu, die op Ofel woonden, tot tegenover de Waterpoort aan het oosten, en de uitstekende toren.","27":"Daarna verbeterden de Thekoïeten een ander stuk; tegenover de grote uitstekende toren, en tot aan de muur van Ofel.","28":"Van boven de Paardenpoort verbeterden de priesters, ieder tegenover zijn huis.","29":"Daarna verbeterde Zadok, de zoon van Immer, tegenover zijn huis. En na hem verbeterde Semaja, de zoon van Sechanja, de bewaarder van de Oostpoort.","30":"Na hem verbeterden Hananja, de zoon van Selemja, en Hanun, de zoon van Zalaf, de zesde, een ander stuk. Na hem verbeterde Mesullam, de zoon van Berechja, tegenover zijn kamer.","31":"Na hem verbeterde Malchia, de zoon van het goudsmid, tot aan het huis van de Nethinim en van de kruideniers, tegenover de poort van Mifkad, en tot de bovenzaal van het punt.","32":"En tussen de bovenzaal van het punt tot de Schaapspoort toe, verbeterden de goudsmeden en de kruideniers."},"SV":{"1":"En Eljasib, de hogepriester, maakte zich op met zijn broederen, de priesteren, en zij bouwden de Schaapspoort; zij heiligden ze, en richtten haar deuren op; ja, zij heiligden ze tot aan den toren Mea, tot aan den toren Hananeel.","2":"En aan zijn hand bouwden de mannen van Jericho; ook bouwde aan zijn hand Zacchur, de zoon van Imri.","3":"De Vispoort nu bouwden de kinderen van Senaa; zij zolderden die, en richtten haar deuren op, *met* haar sloten en haar grendelen.","4":"En aan hun hand verbeterde Meremoth, de zoon van Uria, den zoon van Koz; en aan hun hand verbeterde Mesullam, de zoon van Berechja, den zoon van Mesezabeel; en aan hun hand verbeterde Zadok, zoon van Baëna.","5":"Voorts aan hun hand verbeterden de Thekoieten; maar hun voortreffelijken brachten hun hals niet tot den dienst huns Heeren.","6":"En de Oude poort verbeterden Jojada, de zoon van Paseah, en Mesullam, de zoon van Besodja; deze zolderden zij, en richtten haar deuren op, met haar sloten en haar grendelen.","7":"En aan hun hand verbeterden Melatja, de Gibeoniet, en Jadon, de Meronothiet, de mannen van Gibeon en van Mizpa; tot aan den stoel des landvoogds aan deze zijde der rivier.","8":"Aan zijn hand verbeterde Uzziël, de zoon van Harhoja, *een* der goudsmeden, en aan zijn hand verbeterde Hananja, de zoon van een der apothekers; en zij lieten Jeruzalem tot aan den breden muur.","9":"En aan hun hand verbeterde Refaja, de zoon van Hur, overste des halven deels van Jeruzalem.","10":"Voorts aan hun hand verbeterde Jedaja, de zoon van Harumaf, en tegenover zijn huis; en aan zijn hand verbeterde Hattus, de zoon van Hasabneja.","11":"De andere mate verbeterden Malchia, de zoon van Harim, en Hassub, de zoon van Pahath-moab; daartoe den Bakoventoren.","12":"En aan zijn hand verbeterde Sallum, de zoon van Lohes, overste van het *andere* halve deel van Jeruzalem, hij en zijn dochteren.","13":"De Dalpoort verbeterden Hanun, en de inwoners van Zanoah; zij bouwden die, en richtten haar deuren op, *met* haar sloten en haar grendelen; daartoe duizend ellen aan den muur, tot aan de Mistpoort.","14":"De Mistpoort nu verbeterde Malchia, de zoon van Rechab, overste van het deel Beth-cherem; hij bouwde ze, en richtte haar deuren op, *met* haar sloten en haar grendelen.","15":"En de Fonteinpoort verbeterde Sallum, de zoon van Kol-hoze, overste van het deel van Mizpa; hij bouwde ze, en overdekte ze, en richtte haar deuren op, *met* haar sloten en haar grendelen; daartoe den muur des vijvers Schelah bij des konings hof, en tot aan de trappen, die afgaan van Davids stad.","16":"Na hem verbeterde Nehemia, de zoon van Azbuk, overste van het halve deel van Beth-zur, tot tegenover Davids graven, en tot aan den gemaakten vijver, en tot aan het huis der helden.","17":"Na hem verbeterden de Levieten, Rehum, de zoon van Bani; aan zijn hand verbeterde Hasabja, de overste van het halve deel van Kehila, in zijn deel.","18":"Na hem verbeterden hun broederen, Bavai, de zoon van Henadad, de overste van het *andere* halve deel van Kehila.","19":"Aan zijn hand verbeterde Ezer, de zoon van Jesua, de overste van Mizpa, een andere maat; tegenover den opgang naar het wapenhuis, aan den hoek.","20":"Na hem verbeterde zeer vuriglijk Baruch, de zoon van Zabbai, een andere maat; van den hoek tot aan de deur van het huis van Eljasib, den hogepriester.","21":"Na hem verbeterde Meremoth, de zoon van Uria, den zoon van Koz, een andere maat; van de huisdeur van Eljasib af, tot aan het einde van Eljasibs huis.","22":"En na hem verbeterden de priesteren, wonende in de vlakke velden.","23":"Daarna verbeterden Benjamin, en Hassub, tegenover hun huis; na hem verbeterde Azaria, de zoon van Maaseja, den zoon van Hananja, bij zijn huis.","24":"Na hem verbeterde Binnui, de zoon van Henadad, een andere maat; van het huis van Azaria tot aan den hoek en tot aan het punt;","25":"Palal, de zoon van Uzai, tegen den hoek, en den hogen toren over, die van des konings huis uitsteekt, die bij den voorhof der gevangenis is; na hem Pedaja, de zoon van Paros;","26":"De Nethinim nu, *die* in Ofel woonden, tot tegenover de Waterpoort aan het oosten, en den uitstekenden toren.","27":"Daarna verbeterden de Thekoieten een andere maat; tegenover den groten uitstekenden toren, en tot aan den muur van Ofel.","28":"Van boven de Paardenpoort verbeterden de priesteren, een iegelijk tegenover zijn huis.","29":"Daarna verbeterde Zadok, de zoon van Immer, tegenover zijn huis. En na hem verbeterde Semaja, de zoon van Sechanja, de bewaarder van de Oostpoort.","30":"Na hem verbeterden Hananja, de zoon van Selemja, en Hanun, de zoon van Zalaf, de zesde, een andere maat. Na hem verbeterde Mesullam, de zoon van Berechja, tegenover zijn kamer.","31":"Na hem verbeterde Malchia, de zoon eens goudsmids, tot aan het huis der Nethinim en der kruideniers, tegenover de poort van Mifkad, en tot de opperzaal van het punt.","32":"En tussen de opperzaal van het punt tot de Schaapspoort toe, verbeterden de goudsmeden en de kruideniers."},"KJV":{"1":"Then Eliashib the high priest rose up with his brethren the priests, and they builded the sheep gate; they sanctified it, and set up the doors of it; even unto the tower of Meah they sanctified it, unto the tower of Hananeel.","2":"And next unto him builded the men of Jericho. And next to them builded Zaccur the son of Imri.","3":"But the fish gate did the sons of Hassenaah build, who *also* laid the beams thereof, and set up the doors thereof, the locks thereof, and the bars","4":"And next unto them repaired Meremoth the son of Urijah, the son of Koz. And next unto them repaired Meshullam the son of Berechiah, the son of Meshezabeel. And next unto them repaired Zadok the son of Baana.","5":"And next unto them the Tekoites repaired; but their nobles put not their necks to the work of their Lord.","6":"Moreover the old gate repaired Jehoiada the son of Paseah, and Meshullam the son of Besodeiah; they laid the beams thereof, and set up the doors thereof, and the locks thereof, and the bars","7":"And next unto them repaired Melatiah the Gibeonite, and Jadon the Meronothite, the men of Gibeon, and of Mizpah, unto the throne of the governor on this side the river.","8":"Next unto him repaired Uzziel the son of Harhaiah, of the goldsmiths. Next unto him also repaired Hananiah the son of *one of* the apothecaries, and they fortified Jerusalem unto the broad wall.","9":"And next unto them repaired Rephaiah the son of Hur, the ruler of the half part of Jerusalem.","10":"And next unto them repaired Jedaiah the son of Harumaph, even over against his house. And next unto him repaired Hattush the son of Hashabniah.","11":"Malchijah the son of Harim, and Hashub the son of Pahathmoab, repaired the other piece, and the tower of the furnaces.","12":"And next unto him repaired Shallum the son of Halohesh, the ruler of the half part of Jerusalem, he and his daughters.","13":"The valley gate repaired Hanun, and the inhabitants of Zanoah; they built it, and set up the doors thereof, the locks thereof, and the bars thereof, and a thousand cubits on the wall unto the dung gate.","14":"But the dung gate repaired Malchiah the son of Rechab, the ruler of part of Bethhaccerem; he built it, and set up the doors thereof, the locks thereof, and the bars","15":"But the gate of the fountain repaired Shallun the son of Colhozeh, the ruler of part of Mizpah; he built it, and covered it, and set up the doors thereof, the locks thereof, and the bars thereof, and the wall of the pool of Siloah by the king's garden, and unto the stairs that go down from the city of David.","16":"After him repaired Nehemiah the son of Azbuk, the ruler of the half part of Bethzur, unto *the place* over against the sepulchres of David, and to the pool that was made, and unto the house of the mighty.","17":"After him repaired the Levites, Rehum the son of Bani. Next unto him repaired Hashabiah, the ruler of the half part of Keilah, in his part.","18":"After him repaired their brethren, Bavai the son of Henadad, the ruler of the half part of Keilah.","19":"And next to him repaired Ezer the son of Jeshua, the ruler of Mizpah, another piece over against the going up to the armoury at the turning","20":"After him Baruch the son of Zabbai earnestly repaired the other piece, from the turning *of the wall* unto the door of the house of Eliashib the high priest.","21":"After him repaired Meremoth the son of Urijah the son of Koz another piece, from the door of the house of Eliashib even to the end of the house of Eliashib.","22":"And after him repaired the priests, the men of the plain.","23":"After him repaired Benjamin and Hashub over against their house. After him repaired Azariah the son of Maaseiah the son of Ananiah by his house.","24":"After him repaired Binnui the son of Henadad another piece, from the house of Azariah unto the turning *of the wall*, even unto the corner.","25":"Palal the son of Uzai, over against the turning *of the wall*, and the tower which lieth out from the king's high house, that *was* by the court of the prison. After him Pedaiah the son of Parosh.","26":"Moreover the Nethinims dwelt in Ophel, unto *the place* over against the water gate toward the east, and the tower that lieth out.","27":"After them the Tekoites repaired another piece, over against the great tower that lieth out, even unto the wall of Ophel.","28":"From above the horse gate repaired the priests, every one over against his house.","29":"After them repaired Zadok the son of Immer over against his house. After him repaired also Shemaiah the son of Shechaniah, the keeper of the east gate.","30":"After him repaired Hananiah the son of Shelemiah, and Hanun the sixth son of Zalaph, another piece. After him repaired Meshullam the son of Berechiah over against his chamber.","31":"After him repaired Malchiah the goldsmith's son unto the place of the Nethinims, and of the merchants, over against the gate Miphkad, and to the going up of the corner.","32":"And between the going up of the corner unto the s da, waarvan Joh 5:2 ; zie ook onder, vs.32, en Neh 12:39 ."},{"catchword":"heiligden","tekst":"Dat is, deden gebeden, offeranden, enz., nadat de poort gemaakt was, eer zij tot het algemene gebruik kwam. Vergelijk Deu 20:5 . Of, heiligden; dat is, verordenden deze plaats tot zaken, die tot den dienst des tempels behoorden, als offervee te kopen, en te wassen door het gerief des bijliggenden vijvers, dien God ook daarom kan hebben gezegend met het mirakel der genezing, Joh 5:4 ; idem, specerijen, reukwerk en kruideniers woonden hier; onder, vs.32. Anders, heiligden; dat is, bereidden, rustten toe. Vergelijk Jer 51:27 , enz."},{"catchword":"richtten","tekst":"Zie vs.3."},{"catchword":"Mea,","tekst":"Of, Honderd toren, staande tussen de Schaapspoort en den toren Hananeël; misschien alzo genoemd, omdat deze toren honderd ellen van beiden afstond."},{"catchword":"Hanáneël","tekst":"Zie Jer 31:38 ."}],"2":[{"catchword":"hand bouwden","tekst":"Of, zijde, dat is, naast hem; en zo in het volgende."}],"3":[{"catchword":"Senáä;","tekst":"Anders, Hassenaä."},{"catchword":"richtten","tekst":"Of, zetten op. Wanneer de deuren in de stadspoorten eigenlijk opgezet en gehangen zijn, zie daarvan onder, Neh 6:1 , en Neh 7:1 , hoewel het ganse werk hier meteen verhaald wordt; tenware, dat de deuren op dezen tijd wel gereed en opgezet zijnde, naderhand ten volle door den last van Nehemia geschikt en opgehangen mochten zijn."}],"4":[{"catchword":"verbeterde","tekst":"Of, versterkte, herstelde, te weten, den vervallen muur; en alzo in het volgende."},{"catchword":"Koz;","tekst":"Of, Hakkoz."},{"catchword":"hun hand","tekst":"Dergenen die in dit en het voorgaande vs.3 genoemd zijn."}],"5":[{"catchword":"Thekoïeten;","tekst":"Zie 2Sa 14:2 ."},{"catchword":"brachten","tekst":"Dat is, de groten of aanzienlijken en machtigen van Thekoa wilden zich niet buigen noch begeven, om dit werk van hun God mede te helpen bevorderen. Deze onwilligheid en hoogmoed wordt tot hunne schande van den Heiligen Geest bestraft."},{"catchword":"dienst","tekst":"Of, tot het werk."},{"catchword":"huns Heeren","tekst":"Anders, hunner heren; verstaande daardoor de commissarissen, die gesteld waren om opzicht te nemen en orde op alles te stellen."}],"7":[{"catchword":"Gibeon","tekst":"Zie van Gibeon, Jos 10 , en van Mizpa, Jdg 10:17 ."},{"catchword":"stoel","tekst":"Dat is, het huis, waar de landvoogd of stadhouder des konings in Judea zijn hof hield, en waar Nehemia nu misschien zelf intrekken zou. Vergelijk boven, Neh 2:8 ."},{"catchword":"der rivier","tekst":"Eufraat; in de Schriftuur Frath genoemd."}],"8":[{"catchword":"van een der apothekers;","tekst":"Hebreeuws, een zoon der apothekers: hetwelk sommigen verstaan zoveel te zijn als apotheker."},{"catchword":"lieten","tekst":"Dat is, zij lieten het volgende deel des muurs zo het was, dewijl het nog goed en sterk genoeg gebleven was. Anderen verstaan dat er een binnenmuur was, de bovenstad van de benedenstad afscheidende, dien zij, als voor het eerst niet nodig, oversloegen, om het nodigste werk te bevorderen. Anders, zij richtten op. Vergelijk Exo 23:5 ."}],"9":[{"catchword":"halven deels","tekst":"Jeruzalem was in verscheidene delen of kwartieren afgedeeld; deze was overste van de helft der stad. Sommigen menen dat er benevens het voornaamste deel, vanwege de uitnemendheid Jeruzalems deel of kwartier genoemd, andere mindere kwartieren geweest zijn, als van Bethcherem, Mizpa, Bethzur en Kegila, hoewel er zijn, die het daarvoor houden dat deze kwartieren of omstreken, in het volgende vermeld, buiten Jeruzalem gelegen waren, gelijk van Bethcherem vermeld onder, vs.14; te zien is Jer 6:1 . Anders, de helft van een deel."}],"11":[{"catchword":"De andere","tekst":"Dat is, het volgende deel, liggende naast aan het deel van Hattus; of, [gelijk anderen] even zulk deel of maat des muurs, gelijk Hattus hersteld had."},{"catchword":"Bakoventoren","tekst":"Zie onder, Neh 12:38 ."}],"12":[{"catchword":"Lohes,","tekst":"Of, Hallohes."}],"13":[{"catchword":"Mistpoort","tekst":"Zie boven, Neh 2:13 ."}],"14":[{"catchword":"Beth-cherem;","tekst":"Zie van dit en enige andere kwartieren, in het volgende vermeld, de aantekening op vs.9, en vergelijk Jer 6:1 ."}],"15":[{"catchword":"Schelah","tekst":"Dit wordt bij sommigen genomen voor Siloam, waarvan Joh 9:7 . Vergelijk boven, Neh 2:13 ; hier begint Nehemia te verhalen het verbouwen van hetgeen tot het paleis en den tempel behoorde."},{"catchword":"trappen,","tekst":"Zie onder, Neh 12:37 ."}],"16":[{"catchword":"gemaakten vijver,","tekst":"Zie 2Ki 18:17 , en 2Ki 20:20 , alzo, naar eniger gevoelen, genoemd, tot onderscheiding van den anderen, vs.15, die een natuurlijke vijver of poel geweest is."},{"catchword":"helden","tekst":"Waar de dapperste krijgslieden, die steeds omtrent den koning waren, hun logement plachten te hebben."}],"17":[{"catchword":"in zijn deel","tekst":"Of, voor, met zijn deel; dat is, voor, of met die inwoners van zijn kwartier."}],"19":[{"catchword":"andere maat;","tekst":"Zie vs.11."},{"catchword":"aan den hoek","tekst":"Zie 2Ch 26:9 ."}],"20":[{"catchword":"vuriglijk","tekst":"Hebreeuws, ontstak, sterkte; dat is, hij verbeterde of herstelde en verbouwde zijn deel met een zonderlingen ijver; zie Psa 45:5 ."},{"catchword":"Zabbaï,","tekst":"Anders, Zakkai."}],"21":[{"catchword":"Koz,","tekst":"Of, Hakkoz, gelijk boven."}],"22":[{"catchword":"vlakke velden","tekst":"Hebreeuws, mannen van het plein; dat is wonende in de vlakke velden, tussen Jeruzalem en Jericho gelegen. Zie 2Sa 2:29 , enz."}],"23":[{"catchword":"Daarna","tekst":"Anders, na hen. Hebreeuws eigenlijk, na hem, hetwelk sommigen verstaan hier genomen te zijn voor het getal van velen; en alzo vs.27, 29."}],"24":[{"catchword":"de punt;","tekst":"Het uiterste van den hoek."}],"25":[{"catchword":"tegenover","tekst":"Versta, verbeterde den muur tegenover den hoek."},{"catchword":"uitsteekt,","tekst":"Hebreeuws, uitgaat; en zo vs.26."},{"catchword":"gevangenis is;","tekst":"Zie onder, Neh 12:39 , en Jer 32:2 ."}],"26":[{"catchword":"Nethinim","tekst":"Zie Ezr 2:48 ."},{"catchword":"Ofel","tekst":"Of, op de hoogte; zie 2Ch 27:3 , en 2Ch 33:14 ."},{"catchword":"tot","tekst":"Hierop kan men verstaan, verbeterden."}],"27":[{"catchword":"Thekoïeten","tekst":"Zie vs.5."}],"28":[{"catchword":"Van boven","tekst":"Of, van de Paardenpoort aan; zie 2Ki 11:16 ."}],"29":[{"catchword":"Oostpoort","tekst":"Vergelijk Jer 19:2 ."}],"30":[{"catchword":"hem verbeterden","tekst":"Anders, naast mij, en zo in het volgende vs.31, verstaande, dat Nehemia hier verhaalt wie aan zijn beide zijden gearbeid hebben, zonder uit te drukken wat hij gedaan heeft om anderen met zijn exempel voor te gaan; tonende alzo zijn nederigheid. Zie onder, Neh 4:16 , Neh 4:23 , en Neh 5:16 ."},{"catchword":"zesde,","tekst":"Te weten, zoon van Zalaf, of, hij zelf de zesde."},{"catchword":"een andere maat","tekst":"Zie vs.11."}],"31":[{"catchword":"Mifkad,","tekst":"Dat is, bevel, opzicht, monstering, of telling. Sommigen menen dat de grote Raad hier bijeenkwam om op de voorkomende zwarigheden te letten en bevelen uit te geven of te publiceren."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Eliasib [The grand-child of Jesua, below chap.12.10.] the high Priest gat him up, with his brethren [that is, kinsmen of Aarons line] the Priests, and they built the sheep-gate; [or, cattle-gate, against the fore-part of the Temple, so called [according to the opinion of some) because the cattle-market had been kept there, for commodiousness sake, to have beasts for sacrifice ready at hand, as lying hard by the Temple: Here was also (as some conceive) the pool of Bethesda, whereof mention is made, Joh 5:2. See also below v.32. and chap.12.39.] they hallowed it, [that is, made prayers, offered sacrifices, etc. After that the gate was made ere it was put to common use. Compare Deut.20.5. Or hallowed, that is, ordained and set apart this place for matters that pertained to the service of the Temple, as to buy cattle for sacrifice, and to wash them, in regard of the commodiousness of the pool that lay near it, which perhaps God did also therefore bless with the miracle of healing, Joh 5:4. Item spices, incense, and changing of money; for the Goldsmiths and Drugsters dwelt here, below vers.32. Oth. hallowed; that is, prepared, made ready. Compare Jer 51:27, etc.] and reared up the doors of it; [see on vers.3.] yea they hallowed it unto the tower Mea, [to hundredth tower, standing between the sheep-gate and the tower of Hananeel: perhaps so called, because this tower was distant an hundred ells from both] unto the tower of Hananeel. [see Jer 31:38. Compare this description of the compass and situation of Jerusalem, with below chap.12.31, etc.]"}],"2":[{"catchword":null,"tekst":"And at his hand [Or side; that is, next unto him: And so in the sequel] builded the men of Jerucho: Also at his hand builded Zaccur the son of Imri."}],"3":[{"catchword":null,"tekst":"Now the Fish-gate did the children of Senaa [Oth.Hassena] build: They floored it, and reared up [or set up] the doors therefore, (with) the locks thereof, and the bars thereof. [when the doors in the city-gates were set up and hung on, see therefore below chap.6.1. and 7.1. though the whole work be related here altogether: Unless it were so, that the doors being well fitted and set up might afterwards by the charge and command of Nehemia, be fully finished and hung on.]"}],"4":[{"catchword":null,"tekst":"And at their hand repaired [Or strengthened, redressed, reformed, to wit, the decayed wall: and so in the sequel] Moremoth the son of Uria, the son of Koz, [or, Hakkoz] and at their hand [to wit, at the hand of those that are mentioned in this and the former verse] repaired Mesullam the son of Berechja, the son of Mesesabeel: and at their hand repaired Zadok the son of Baena."}],"5":[{"catchword":null,"tekst":"Moreover at their hand repaired the Thekonites: [See 2 Sam.14.on ver.2.] but their excellent (ones) brought not their neck to the service [or to the work] of their Lord. [that is, the great and mighty, or honourable ones of Thekoa would not stoop, or give up themselves, to help likewise to further and advance this work of their God. This unwillingness and pride of theirs is here taxed and reproved by the holy Ghost to their shame and disgrace. Oth. to the work, or service of their Lord: Understanding thereby the commissioners that were appointed to have the oversight of the work, and to order all things aright, as they should see fit.]"}],"6":[{"catchword":null,"tekst":"And the old-gate repaired Jojada the son of Pasea, and Mesullam the son of Besodja: These floored them, and reared up the doors thereof, with locks thereof, and the bars thereof."}],"7":[{"catchword":null,"tekst":"And at their hand repaired Melatja the Gibeonite, and Jadon the Merothite, the men of Gibeon and of Mizpa: [see of Gibeon, Josh.10. and of Mizpa, Judg.10.on vers.17.] unto the chair of the Governor on this side the River. [Euphrates, called in the scripture Phrath. That is, unto the house where the Governor or Kings Lieutenant in Juda kept his court, and which peradventure Nehemia himself was now to enter into Compare above chap.2.8.]"}],"8":[{"catchword":null,"tekst":"At his hand repaired Uziel the son of Harhoja, (one) of the Goldsmiths, and at his hand repaired Hananja the son of the Apothecaries: [Hebr. A son of the Apothecaries, which some do understand to be as much as an Apothecary] and they left Jerusalem unto the broad wall. [that is, they left the following part of the wall as it was, because it remained yet good and strong enough. Others understand that there was an inner wall, that parted the upper city from the lower city, which they, as not necessary at first, passed by, to further and advance the most necessary work. Oth. they repaired up, &c. Compare Exod.23.on vers.5.]"}],"9":[{"catchword":null,"tekst":"And at their hand repaired Rephaja the son of Hur, the Ruler of the half part of Jerusalem. [Jerusalem was divided into several parts or quarters: This man was Ruler of the one half of the city. Some conceive that besides the chiefest part of the city, called for its eminency Jerusalems part, or, quarter, that there were also other less parts or quarters, as of Bethcherem, Mizpa, Bethzur and Kegila: although there be some, that hold that these quarters or countries mentioned in the sequel, lay without Jerusalem, as appeareth, Jer.6. concerning Bethcherem, mentioned bel.v.4. Oth. the half of one part.]"}],"10":[{"catchword":null,"tekst":"Moreover, at his hand repaired Jedaja the son of Harumaph, and over against his house: and at his hand repaired Hartus the son of Hasabneja."}],"11":[{"catchword":null,"tekst":"Malchia the son of Harim, and Hazub the son of Pahat-Moab, repaired the other measure: [That is, the following part, lying next to the part of Hattus: Or (as others) even such a part or measure of the wall, as Hattus had repaired] Besides the Tower of the Bakingovens. [see below chap.12.38.]"}],"12":[{"catchword":null,"tekst":"And at his hand repaired Sallum the son of Lobes, [Or, Hallowes] the Ruler of the (other) half part of Jerusalem; he and his daughters."}],"13":[{"catchword":null,"tekst":"The valley-gate repaired Hanun, and the inhabitants of Zanoah, they built it, and reared up the doors thereof, (with) the locks thereof, and the bars thereof: Besides a thousand ells on the wall, unto the dung-gate. [See above ch.2.on v.13.]"}],"14":[{"catchword":null,"tekst":"Now the dung-gate repaired Maichia the son of Rechab, the Ruler of the part of Beth-Cherem: [see concerning this and other parts and quarters mentioned in the sequel, the annotate. On v.9. and compare Jer 6:1.] he built it, and reared up the doors thereof, (with) the locks thereof, and the bars thereof."}],"15":[{"catchword":null,"tekst":"And the fountain-gate repaired Sallun the son of Col-hose, the Ruler of the part of Mizpa, he built it, and covered it over, and reared up the doors thereof, (with) the locks thereof, and the bars thereof: Moreover the wall of the pool Schelach [This is taken by some for Siloe, where of mention is made, Jos.9.7. Compare above c.2.on v.13. Nehemia beginneth here to relate the repairing of that which pertained to the Palace and the Temple] of the kings garden, and unto the stairs, [see bel.chap.12.39.] that go down from the city of David."}],"16":[{"catchword":null,"tekst":"After him repaired Nehemia the son of Azbuk, the Ruler of the half part of Beth-zur, even over against Davids sepulchare, and to the pool that was made, [see 2 Kings 18.17. and 20.20. so called (as some conceive) to distinguish it from the other, mentioned v.15. which was a natural pool or pond] and unto the house of the Champions. [where the valiantest warlike Champions that were about the king, were wont to lodge.]"}],"17":[{"catchword":null,"tekst":"After him repaired the Levites, Rehum the son of Bani: At his hand repaired Hasabja the Ruler of the half part of Kegila in his part. [Or, for with his apart; that is, for, or with those inhabitants of his quarter.]"}],"18":[{"catchword":null,"tekst":"After him repaired their brethren, Bavai the son of Henadad, the Ruler of the (other) half part of Kegila."}],"19":[{"catchword":null,"tekst":"At his hand repaired Ezer the son of Jesua, the Ruler of Mizpa, another measure, [See on v.11.] over against the going up to the armory, at the corner. [see 2 Chron.26.on vers.9.]"}],"20":[{"catchword":null,"tekst":"After him Baruch the son of Rabbai, [Otherwise called Zaccai] most servently repaired another measure, [Hebr. Kindled strengthened; that is, he repaired, or redressed and built up his part with a special zeal and servency of spirit. See Psal.45.on v.5.] from the corner unto the door of the house of Eljasib the high Priests,"}],"21":[{"catchword":null,"tekst":"After him repaired Meremoth the son of Uria, the son of Koz [Or Hakkoa, as above] another measure; from the door of the house of Eljasib, to the end of the house of Eljasib."}],"22":[{"catchword":null,"tekst":"And after him repaired the Priests, dwelling in the plains. [Hebr. Men of the plain; that is, dwelling in the plains, lying between Jerusalem and Jericho. See Sam.2.29, etc.]"}],"23":[{"catchword":null,"tekst":"After that [Oth. after him, Hebr. Properly, after him, which some understand to be taken here for the plural number; and so v.27,29.] repaired Benjamin, and Hasub, over against their house: After him repaired Azarja, the son of Maaseja, the son of Hananja, by his house."}],"24":[{"catchword":null,"tekst":"After him repaired Binnui, the son of Henadad, another measure: from the house of Azarja, unto the corner, and unto the point. [The outermost part of the corner.]"}],"25":[{"catchword":null,"tekst":"Palal the son of Uzai, over against the corner, [Undestand, repaired the wall over against the corner] and the high Tower that sticketh out [Hebr. Goeth out; and so v.26.] from the kings house, which is by the court of the prison: [see below chap..12 39. And Jer 32:2.] After him Pedaja the son of Parbos."}],"26":[{"catchword":null,"tekst":"Now the Nethinims, [See Ezra 2.on vers.43.] (that) dwelt in Ophel, [or on the high place. See Chr.27.3. and 33.14.] even over against the water-gate toward the East, [here may be understood, repaired] and the tower that sticketh out."}],"27":[{"catchword":null,"tekst":"After that the Thekoites [See v.5.] repaired another measure, over against the great Tower that sticketh out, and unto the wall of Ophel."}],"28":[{"catchword":null,"tekst":"From above the horse-gate, [Or, from the horse-gate. See 2 Kings 11.16.] repaired the Priests, every one over against his house."}],"29":[{"catchword":null,"tekst":"After that repaired Zadok the son of Immer, over against his house: And after him repaired Semaja the son of Sechanja, the keeper of the East-gate. [Compare Jer.19.on v.2.]"}],"30":[{"catchword":null,"tekst":"After him repaired [Oth. after me, etc. And so in the following verse, meaning that Nehemiah relateth here, who they were that laboured on both sides of him, without mentioning or expressing what he himself did, to go before others by his own example; shewing thereby his humanity. See bel.cha.4.16,23. And 5.16.] Hananja the son of Selemja, and Hanun the son of Zalaph, the sixth, [to wit, son of Zalaph: Or, he himself the sixth] another measure: [see on v.11.] After him repaired Mesullam the son of Berechja, over against his chamber."}],"31":[{"catchword":null,"tekst":"After him repaired Malchia, a Goldsmiths son, unto the house of the Nethinims and of the Drugsters, over against the gate of Miphkad, [That is, command, oversight, mustering, or numbling. Some conceive that the great Council here met together, to consider of future grievance, and to give out commissions, and publish them abroad] and to the upper room of the point."}],"32":[{"catchword":null,"tekst":"And between the upper room of the point unto the sheep-gate, repairing the Goldsmiths and the Drugster."}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
