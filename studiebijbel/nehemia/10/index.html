  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }

,","27":"Malluch, Harim, Baäna.","28":"En de rest van het volk, de priesters, de Levieten, de poortwachters, de zangers, de Nethinim, en iedereen die zich van de volken van de landen had afgescheiden voor de wet van God, hun vrouwen, hun zonen en hun dochters, iedereen die kennis *en* verstand had;","29":"hielden zich aan hun broeders, hun voortreffelijken, en kwamen onder de vloek en de eed, dat zij zouden wandelen in de wet van God, die gegeven is door de hand van de knecht van God, Mozes; en dat zij zouden houden, en dat zij zouden doen al de geboden van de HEERE, onze Heere, en Zijn rechten en Zijn inzettingen;","30":"En dat wij onze dochters niet zouden geven aan de volken van het land, en ook hun dochters niet zouden nemen voor onze zonen.","31":"Ook als de volken van het land waren en alle koren op de sabbatdag ten verkoop zouden brengen, dat wij op de sabbat, of op een *andere* heilige dag, niets van hen zouden nemen; en dat wij het zevende jaar zouden vrij laten, alsook allerlei[1] bezwaarnis.","32":"Vervolgens legden wij ons geboden op, waarbij wij ons een derde deel van een sikkel per jaar opgelegd hadden, voor de dienst van het huis van onze God;","33":"Voor het brood van de bereiding, en het gedurige spijsoffer, en voor het gedurige brandoffer, van de sabbatten, van de nieuwe maanden, voor de vastgestelde hoogtijden, en voor de heilige dingen, en voor de zondoffers, om verzoening te doen over Israël; en *voor* al het werk van het huis van onze God.","34":"Ook wierpen wij de loten, onder de priesters, de Levieten en het volk, over het offer van het hout, dat men brengen zou naar het huis van onze God, naar het huis van onze vaderen, op bestemde tijden, jaar op jaar, om te branden op het altaar van de HEERE, onze God, zoals het in de wet geschreven is;","35":"Dat wij ook de eerstelingen van ons land en de eerstelingen van alle vrucht van al het geboomte, jaar op jaar, zouden brengen naar het huis van de HEERE;","36":"En de eerstgeborenen van onze zonen en onze dieren, zoals het in de wet geschreven is; en dat wij de eerstgeborenen van onze runderen en onze schapen zouden brengen naar het huis van onze God, tot de priesters, die in het huis van onze God dienen.","37":"En dat wij de eerstelingen van ons deeg, en onze hefoffers, en de vrucht van alle bomen, most en olie, zouden brengen tot de priesters, in de kamers van het huis van onze God, en de tienden van ons land tot de Levieten; en dat diezelfde Levieten de tienden zouden hebben in alle steden van onze landbouw;","38":"En dat er een priester, een zoon van Aäron, bij de Levieten zou zijn, als de Levieten de tienden ontvangen; en dat de Levieten de tienden zouden opbrengen naar het huis van onze God, in de kamers van het schathuis.","39":"Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten."},"SV":{"1":"Tot de verzegelingen nu waren: Nehemia Hattirsatha, zoon van Hachalja, en Zidkia,","2":"Seraja, Azarja, Jeremia,","3":"Pashur, Amarja, Malchia,","4":"Hattus, Sebanja, Malluch,","5":"Harim, Meremoth, Obadja,","6":"Daniël, Ginnethon, Baruch,","7":"Mesullam, Abia, Mijamin,","8":"Maazia, Bilgai, Semaja. Dit waren de priesters.","9":"En de Levieten, namelijk: Jesua, zoon van Azanja, Binnui; van de zonen van Henadad, Kadmiel;","10":"En hun broederen: Sebanja, Hodia, Kelita, Pelaja, Hanan,","11":"Micha, Rehob, Hasabja,","12":"Zakkur, Serebja, Sebanja,","13":"Hodia, Bani, Beninu;","14":"De hoofden des volks: Parhos, Pahath-moab, Elam, Zatthu, Bani,","15":"Bunni, Azgad, Bebai,","16":"Adonia, Bigvai, Adin,","17":"Ater, Hizkia, Azzur,","18":"Hodia, Hasum, Bezai,","19":"Harif, Anathoth, Nebai,","20":"Magpias, Mesullam, Hezir,","21":"Mesezabeel, Zadok, Jaddua,","22":"Pelatja, Hanan, Anaja,","23":"Hosea, Hananja, Hassub,","24":"Hallohes, Pilha, Sobek,","25":"Rehum, Hasabna, Maaseja,","26":"En Ahia, Hanan, Anan,","27":"Malluch, Harim, Baäna.","28":"En het overige des volks, de priesteren, de Levieten, de poortiers, de zangers, de Nethinim, en al wie zich van de volken der landen had afgescheiden tot Gods wet, hun vrouwen, hun zonen en hun dochteren, al wie wetenschap *en* verstand had;","29":"Die hielden zich aan hun broederen, hun voortreffelijken, en kwamen in den vloek en in den eed, dat zij zouden wandelen in de wet Gods, die gegeven is door de hand van den knecht Gods, Mozes; en dat zij zouden houden, en dat zij zouden doen al de geboden des HEEREN, onzes Heeren, en Zijn rechten en Zijn inzettingen;","30":"En dat wij onze dochteren niet zouden geven aan de volken des lands, noch hun dochteren nemen voor onze zonen.","31":"Ook als de volken des lands waren en alle koren op den sabbatdag ten verkoop brengen, dat wij op den sabbat, of op een *anderen* heiligen dag van hen niet zouden nemen; en dat wij het zevende jaar zouden vrij laten, mitsgaders allerhande bezwaarnis.","32":"Voorts zetten wij ons geboden op, ons opleggende een derde deel van een sikkel in het jaar, tot den dienst van het huis onzes Gods;","33":"Tot het brood der toerichting, en het gedurig spijsoffer, en tot het gedurig brandoffer, der sabbatten, der nieuwe maanden, tot de gezette hoogtijden, en tot de heilige dingen, en tot de zondofferen, om verzoening te doen over Israël; en *tot* alle werk van het huis onzes Gods.","34":"Ook wierpen wij de loten, onder de priesters, de Levieten en het volk, over het offer van het hout, dat men brengen zou ten huize onzes Gods, naar het huis onzer vaderen, op bestemde tijden, jaar op jaar, om te branden op het altaar des HEEREN, onzes Gods, gelijk het in de wet geschreven is;","35":"Dat wij ook de eerstelingen onzes lands en de eerstelingen van alle vrucht van al het geboomte, jaar op jaar, zouden brengen ten huize des HEEREN;","36":"En de eerstgeborenen onzer zonen en onzer beesten, gelijk het in de wet geschreven is; en dat wij de eerstgeborenen onzer runderen en onzer schapen zouden brengen ten huize onzes Gods, tot de priesteren, die in het huis onzes Gods dienen.","37":"En dat wij de eerstelingen onzes deegs, en onze hefofferen, en de vrucht aller bomen, most en olie, zouden brengen tot de priesteren, in de kameren van het huis onzes Gods, en de tienden onzes lands tot de Levieten; en dat dezelfde Levieten de tienden zouden hebben in alle steden onzer landbouwerij;","38":"En dat er een priester, een zoon van Aäron, bij de Levieten zou zijn, als de Levieten de tienden ontvangen; en dat de Levieten de tienden zouden opbrengen ten huize onzes Gods, in de kameren van het schathuis.","39":"Want de kinderen Israëls en de kinderen van Levi moeten hefoffer van koren, most en olie in die kameren brengen, omdat aldaar de vaten des heiligdoms zijn, en de priesteren, die dienen, en de poortiers, en de zangers; dat wij alzo het huis onzes Gods niet zouden verlaten."},"KJV":{"1":"Now those that sealed *were*, Nehemiah, the Tirshatha, the son of Hachaliah, and Zidkijah,","2":"Seraiah, Azariah, Jeremiah,","3":"Pashur, Amariah, Malchijah,","4":"Hattush, Shebaniah, Malluch,","5":"Harim, Meremoth, Obadiah,","6":"Daniel, Ginnethon, Baruch,","7":"Meshullam, Abijah, Mijamin,","8":"Maaziah, Bilgai, Shemaiah: these *were* the priests.","9":"And the Levites: both Jeshua the son of Azaniah, Binnui of the sons of Henadad, Kadmiel;","10":"And their brethren, Shebaniah, Hodijah, Kelita, Pelaiah, Hanan,","11":"Micha, Rehob, Hashabiah,","12":"Zaccur, Sherebiah, Shebaniah,","13":"Hodijah, Bani, Beninu.","14":"The chief of the people; Parosh, Pahathmoab, Elam, Zatthu, Bani,","15":"Bunni, Azgad, Bebai,","16":"Adonijah, Bigvai, Adin,","17":"Ater, Hizkijah, Azzur,","18":"Hodijah, Hashum, Bezai,","19":"Hariph, Anathoth, Nebai,","20":"Magpiash, Meshullam, Hezir,","21":"Meshezabeel, Zadok, Jaddua,","22":"Pelatiah, Hanan, Anaiah,","23":"Hoshea, Hananiah, Hashub,","24":"Hallohesh, Pileha, Shobek,","25":"Rehum, Hashabnah, Maaseiah,","26":"And Ahijah, Hanan, Anan,","27":"Malluch, Harim, Baanah.","28":"And the rest of the people, the priests, the Levites, the porters, the singers, the Nethinims, and all they that had separated themselves from the people of the lands unto the law of God, their wives, their sons, and their daughters, every one having knowledge, and having understanding;","29":"They clave to their brethren, their nobles, and entered into a curse, and into an oath, to walk in God's law, which was given by Moses the servant of God, and to observe and do all the commandments of the LORD our Lord, and his judgments and his statutes;","30":"And that we would not give our daughters unto the people of the land, nor take their daughters for our sons:","31":"And *if* the people of the land bring ware or any victuals on the sabbath day to sell, *that* we would not buy it of them on the sabbath, or on the holy day: and *that* we would leave the seventh year, and the exaction of every debt.","32":"Also we made ordinances for us, to charge ourselves yearly with the third part of a shekel for the service of the house of our God;","33":"For the shewbread, and for the continual meat offering, and for the continual burnt offering, of the sabbaths, of the new moons, for the set feasts, and for the holy *things*, and for the sin offerings to make an atonement for Israel, and *for* all the work of the house of our God.","34":"And we cast the lots among the priests, the Levites, and the people, for the wood offering, to bring *it* into the house of our God, after the houses of our fathers, at times appointed year by year, to burn upon the altar of the LORD our God, as *it is* written in the law:","35":"And to bring the firstfruits of our ground, and the firstfruits of all fruit of all trees, year by year, unto the house of the LORD:","36":"Also the firstborn of our sons, and of our cattle, as *it is* written in the law, and the firstlings of our herds and of our flocks, to bring to the house of our God, unto the priests that minister in the house of our God:","37":"And *that* we should bring the firstfruits of our dough, and our offerings, and the fruit of all manner of trees, of wine and of oil, unto the priests, to the chambers of the house of our God; and the tithes of our ground unto the Levites, that the same Levites might have the tithes in all the cities of our tillage.","38":"And the priest the son of Aaron shall be with the Levites, when the Levites take tithes: and the Levites shall bring up the tithe of the tithes unto the house of our God, to the chambers, into the treasure house.","39":"For the children of Israel and the children of Levi shall bring the offering of the corn, of the new wine, and the oil, unto the chambers, where *are* the vessels of the sanctuary, and the priests that minister, and the porters, and the singers: and we will not forsake the house of our God."}},"tsk":{"1":[{"kopje":"verzegelingen","refs":["Neh 9:38"]},{"kopje":"Nehemia","refs":["Neh 8:10"]},{"kopje":"Tirsatha","refs":["Neh 7:70","Ezra 2:63"]},{"kopje":"zoon van Hachalja","refs":["Neh 1:1"]}],"2":[{"kopje":"Seraja","refs":["Neh 3:23","Neh 11:11","Neh 12:1","Neh 12:33","Neh 12:34"]}],"3":[{"kopje":"Pashur","refs":["Neh 11:12"]},{"kopje":"Amarja","refs":["Neh 12:2","Neh 12:13"]},{"kopje":"Malchia","refs":["Neh 3:11","Neh 8:5"]}],"4":[{"kopje":"Hattus","refs":["Neh 3:10"]},{"kopje":"Sebanja","refs":["Neh 12:14"]},{"kopje":"Malluch","refs":["Neh 12:2"]}],"5":[{"kopje":"Harim","refs":["Neh 3:11"]},{"kopje":"Meremoth","refs":["Neh 3:4","Neh 3:21","Neh 12:3"]}],"6":[{"kopje":"Ginnethon","refs":["Neh 12:4"]},{"kopje":"Baruch","refs":["Neh 3:20"]}],"7":[{"kopje":"Mesullam","refs":["Neh 3:6","Neh 8:5","Neh 11:11","Neh 12:13","Neh 12:25-33"]},{"kopje":"Abia","refs":["Neh 12:4"]},{"kopje":"Mijamin","refs":["Neh 12:5","Neh 12:17","Neh 12:41"]}],"8":[{"kopje":"Bilgai","refs":["Neh 12:5"]},{"kopje":"Semaja","refs":["Neh 3:29","Neh 12:6","Neh 12:18","Neh 12: :14 , Deu 29:19 , en vergelijk Jos 24:25 ; 2Ki 23:3 ; 2Ch 15:12 ."}],"30":[{"catchword":"geven","tekst":"Te weten, ten huwelijk aan de heidenen."}],"31":[{"catchword":"alle koren","tekst":"Dat is, allerlei koren, als rogge, tarwe, gerst. Zie Gen 42:1 ."},{"catchword":"zevende jaar","tekst":"Zijnde een vrijjaar, waarin God den akkerbouw en invordering van schulden bevolen had na te laten. Zie Exo 23:10-11 ; Lev 25:4 ; Deu 15:1-2 , enz."},{"catchword":"allerhande","tekst":"Hebreeuws, den last, of bezwaarnis aller hand; dat is allerlei schuld, die wij anderszins macht hadden in te vorderen; of de invordering, inmaning aller schuld. Zie Deu 15:2 , en boven, Neh 5:7 , Neh 5:10 ."}],"32":[{"catchword":"geboden op,","tekst":"Of, ordinantiën, die in het volgende verhaald worden."},{"catchword":"sikkel","tekst":"Versta hier, sikkel des heiligdoms, doende dubbel zoveel als de gemene of burgerlijke sikkel, te weten omtrent een halven rijksdaalder. Dit was een vrijwillige contributie tot onderhoud van den godsdienst, overmits den tegenwoordigen nood opgesteld. Vergelijk 1Ch 26:26-27 , en 2Ch 31:3 . Van de bevolen ordinaire schatting, zie Exo 30:12 ."}],"33":[{"catchword":"brood der toerichting,","tekst":"Dat is, toonbrood; zie Lev 24:6 , enz.; 2Ch 2:4 , en 2Ch 29:18 ."},{"catchword":"spijsoffer,","tekst":"Zie Exo 29:40 ; Num 28:5 ."},{"catchword":"heilige dingen,","tekst":"Die geheiligd zouden worden tot dankoffers voor het volk."}],"34":[{"catchword":"huis onzer vaderen,","tekst":"Dat is, naar de geslachten en huisgezinnen, om te weten hoeveel hout een ieder zou hebben te leveren tot den brand der offeranden."}],"35":[{"catchword":"lands","tekst":"Dat is, der landvruchten, als rogge, tarwe, gerst, enz."},{"catchword":"al het geboomte,","tekst":"Dat is, allerlei."}],"36":[{"catchword":"eerstgeborenen","tekst":"Versta, zekeren prijs, waarmede zij de eerstgeborenen zonen en het onreine vee, als paarden, ezels, kamelen, enz. moesten aflossen. Zie Exo 13:13 ; Lev 27:11-13 , Lev 27:26-27 ."},{"catchword":"runderen","tekst":"Runderen en schapen, dat is, van groot en klein vee."}],"37":[{"catchword":"hefofferen,","tekst":"Of, heffingen."},{"catchword":"en dat dezelfde Levieten","tekst":"Anders, opdat deze Levieten de tienden mochten geven, te weten, aan den hogepriester, waarvan in het volgende. Hebreeuws, de vertienende. Zie Gen 28:22 ; Deu 14:22 , en Deu 26:12 ."}],"38":[{"catchword":"ontvangen;","tekst":"Of, geven; gelijk in vs.37."}],"39":[{"catchword":"omdat aldaar","tekst":"Of, waar ook, enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now for the sealings [Hebr. for the thing sealed, or, sealings; Meaning, those that ratified and confirmed the covenant (whereof was spoken in the end of the former chapter) with their seals, in the name, and in the behalf of all the Congregation] were, Nehemia Hattirsatha, [See Ezra 2.on verse 63.] son of Hathalja, and Zidkia."}],"2":[{"catchword":null,"tekst":"Seraija, Azaria, Jeremia, [Compare this Register with that which followeth below, Chapter 12. 1, &c.]"}],"3":[{"catchword":null,"tekst":"Pashur, Amarja, Malchia,"}],"4":[{"catchword":null,"tekst":"Hattus, Sebanja, Malluch,"}],"5":[{"catchword":null,"tekst":"Harim, Meremoth, Obadja,"}],"6":[{"catchword":null,"tekst":"Daniel, Ginnethon, Baruch,"}],"7":[{"catchword":null,"tekst":"Mesullam, Abja, Mijamin,"}],"8":[{"catchword":null,"tekst":"Maazia, Bilga, Seneja; those were the Priests. [Nehemia (mentioned above vers.1.) not being comprehended among them, who was not (according to the opinion of some) of the tribe of Levi.]"}],"9":[{"catchword":null,"tekst":"And the Levites; namely, Jesua the son of Azanja, Binnai, of the sons of Henadad, Kadmiel."}],"10":[{"catchword":null,"tekst":"and their brethren; Sebanja, Hodia, Kelita, Pelaja, Hanan."}],"11":[{"catchword":null,"tekst":"Micha, Rehib, Hasubja,"}],"12":[{"catchword":null,"tekst":"Zacchur, Serebja, Sebaaja,"}],"13":[{"catchword":null,"tekst":"Hodia, Bani, Beninu,"}],"14":[{"catchword":null,"tekst":"The heads of the people: [Compare above chap.7.8, &c. Ezra 2.3, &c. And 8.3, &c.] Parhos, Pahath-Moab, Elam, Zatthu, Bani,"}],"15":[{"catchword":null,"tekst":"Bunni, Azgad, Bebai,"}],"16":[{"catchword":null,"tekst":"Adonia, Bigvai, Adin,"}],"17":[{"catchword":null,"tekst":"Ater, Hiskia, Azzum,"}],"18":[{"catchword":null,"tekst":"Hodia, Hasum, Bezai,"}],"19":[{"catchword":null,"tekst":"Harish, Anathoth, Nebai,"}],"20":[{"catchword":null,"tekst":"Magpias, Mesullam, Hezir,"}],"21":[{"catchword":null,"tekst":"Mesezabeel, Zadok, Jaddua,"}],"22":[{"catchword":null,"tekst":"Pelatja, Hanan, Anaja,"}],"23":[{"catchword":null,"tekst":"Hosea, Hananja, Hassub,"}],"24":[{"catchword":null,"tekst":"Hallehes, Pilhas, Sobek,"}],"25":[{"catchword":null,"tekst":"Rehum, Hasabna, Maaseja,"}],"26":[{"catchword":null,"tekst":"And Abia, Hanan, Anan,"}],"27":[{"catchword":null,"tekst":"Malluch, Harim, Baana,"}],"28":[{"catchword":null,"tekst":"And the rest of the people, [Compare 2 Chron.23.on verse 5. And Ezra 2. On vers.70.] the Priests, the Levites, the Porters, the Singers, the Nethinims [See Ezra 2.on verse 43.] and who so ever had separated himself from the nations of the lands [as above chap.9.2.] unto the law of God, their wives, their sons, and their daughters, all those that had knowledge (and) understanding;"}],"29":[{"catchword":null,"tekst":"They clave to their brethren, their excellent (ones) [Or, honourable, great (ones) who were appointed to seal this covenant in the name of the whole Congregation. See Psal.8.on verse 2.] and entered into the curse, and into the oath, [That is, they likewise entered into this covenant, which was confirmed with an oath, and cursing of their persons, if they should chance to transgress this covenant. See Deut.29.12,14,19. And compare Jos.24.25. 2 Kings 23.3. 2 Chron.15.12.] to walk in the law of God which was given by the hand of Moseh the servant of God; and to observe and do all the commandments of the LORD our Lord, and his judgements, and his statutes:"}],"30":[{"catchword":null,"tekst":"And that we would not give our daughters unto the nations of the land, [To wit, give them in marriage unto the heathen] nor take their daughters for our sons."}],"31":[{"catchword":null,"tekst":"Also when the nations of the land bring wares, and all corn [That is, all manner of corn, as Rie, Wheat, Barley. See Gen.24.on verse 1.] on the Sabbath day, to sell, that we would not take it of them on the Sabbath, or on (another) holy day; [See Exo 20:10. and 34.21. Levit.23.2, &c. Deut.5.12,13,17, &c.] And that we would release the seventh year [the same being a year of release, wherein God had commanded to omit the tilling of the ground, and the exacting of debts. See Exo 23:10,11. Levit.25.4. Deut.15.1,2, etc.] together with all manner of grievances [Hebr. the burden, or grievance of all (or every) hand: that is, all manner of debt, which we otherwise had power to demand, require, or exact; or the requiring, demanding of all (or every) debt. See Deut.15.on verse 2. And ab. Ch.5,7,10.]"}],"32":[{"catchword":null,"tekst":"Moreover, we set up commandments [Or ordinances, which are related in the following words] for our selves, imposing upon our selves a third part of a shekel [understand here the shekel of the sanctuary, being as much again as the common or civil shekel, to, to wit, about a half Rycks Doller] yearly, for the service of the house of our God; [this was a voluntary contribution towards the maintaining the worship of God, set up for the present necessity. Compare 2 Chr.26.26,27. & 2 Chr.31.3. Of the ordinary tax that was enjoined, see Exo 30:12.]"}],"33":[{"catchword":null,"tekst":"For the bread of disposition [That is, shew-bread. See Levit.24.6, &c. 2 Chron.2.4. and 29.18.] and the continual meat-offering, [See Exod.29 40. Num 28:5.] and for the continual burnt-offering, of the Sabbaths, of the new-moons, [See Numb.28 and 29.] for the set feasts, and for the holy things, [which were to be consecrated for thank-offerings for the people] and for the sin offerings, to make an atonement for Israel; and for all the work of the house of our God."}],"34":[{"catchword":null,"tekst":"Also we cast the lots among the Priests, the Levites, and the People, concerning the wood-offering, to bring it unto the house of our God, after the house of our fathers, [That is, according to the families and households, to know how much wood every one was to bring in toward the burning of the sacrifices] at times appointed, year by year, to burn upon the altar of the LORD our God, as it is written in the Law."}],"35":[{"catchword":null,"tekst":"Also that we should bring in the first-fruits of our land, [That is, the fruits of the ground, as Rie, Wheat, Barley, &c.] and the first-fruits of all fruit of all [That is, all manner of] trees, year by year, unto the house of the LORD."}],"36":[{"catchword":null,"tekst":"And the first-born of our sons, and of our beasts, [Meaning a certain price or sum money wherewith they were to redeem the first-born sons, and the unclean cattle, as horses, asses, camels, &c. See Exo 13:13. Lev.27. verse 11,12,13,26,27.] as it is written in the Law; [See Exo 13:2. Num 3:13. and 8.17.] and that we should bring the first-born of our bullocks, and of our sheep, [That is, of great and small cattle] unto the house of our God, unto the Priests that minister in the house of our God."}],"37":[{"catchword":null,"tekst":"And that we should bring the first-fruits of our dough, and our heave-offerings, [Or, heavings. See Lev.23.17. Num 15:19.] and the fruit of all trees, new wine and oil, [See Num 18:12. Deut.18.4.] unto the Priests into the chambers of the house of our God, and the tenths of our land unto the Levites? [See Num 18:24,25.] and that the same Levites might have the tithes in all the cities of our tillage, [Oth. that the same Levites might give the tithes, etc. To wit unto the high Priests, whereof in the following verse Heb. the tithing. See Gen 28:22. Deu (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
