*zei Hij*, van Mij gehoord hebt.","5":"Want Johannes doopte wel met water, maar u zult met de Heilige Geest gedoopt worden, niet lang na deze dagen.","6":"Zij dan, die samengekomen waren, vroegen Hem: Heere, zult U in deze tijd het Koninkrijk voor Israël weer oprichten?","7":"En Hij zei tegen hen: Het komt u niet toe de tijden of gelegenheden te weten die de Vader in Zijn eigen macht gesteld heeft;","8":"maar u zult de kracht van de Heilige Geest ontvangen, Die over u komen zal; en u zult Mijn getuigen zijn, zowel in Jeruzalem als in heel Judea en Samaria, en tot aan het uiterste van de aarde.","9":"En toen Hij dit gezegd had, werd Hij opgenomen, terwijl zij het zagen, en een wolk nam Hem weg van voor hun ogen.","10":"En terwijl zij hun ogen naar de hemel gericht hielden toen Hij wegvoer, zie, twee mannen stonden bij hen in witte kleding;","11":"die ook zeiden: Galilese mannen, wat staat u naar de hemel te kijken? Deze Jezus, Die van u opgenomen is in de hemel, zal op dezelfde manier komen als u Hem naar de hemel hebt zien gaan.","12":"Toen keerden zij terug naar Jeruzalem, van de berg die de Olijfberg genoemd wordt, die dicht bij Jeruzalem ligt, op een sabbatsreis afstand vandaan.","13":"En toen zij binnengekomen waren, gingen zij naar boven, naar de bovenzaal, waar zij bleven, *namelijk* Petrus en Jakobus, en Johannes en Andreas, Filippus en Thomas, Bartholomeüs en Mattheüs, Jakobus, *de zoon* van Alfeüs, en Simon Zelotes, en Judas, *de broer* van Jakobus.","14":"Deze allen bleven eensgezind volharden in het bidden en smeken, met de vrouwen, en Maria, de moeder van Jezus, en met Zijn broers.","15":"En in diezelfde dagen stond Petrus op te midden van de discipelen, en zei (er was nu een menigte bijeen van ongeveer honderdtwintig personen):","16":"Mannen broeders, deze Schrift moest vervuld worden, die de Heilige Geest bij monde van David voorzegd heeft over Judas, die de leidsman is geweest van hen die Jezus gevangennamen;","17":"want hij werd met ons gerekend, en had het lot van deze bediening verkregen.","18":"Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.","19":"En het is bekend geworden bij allen die in Jeruzalem wonen, zodat die akker in hun eigen taal Akeldama genoemd wordt, dat is: een akker van het bloed.","20":"Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.","21":"Het is dan nodig dat van de mannen die met ons omgegaan hebben al de tijd waarin de Heere Jezus onder ons in- en uitgegaan is,","22":"beginnend vanaf de doop van Johannes, tot de dag toe waarop Hij van ons opgenomen is, één van hen met ons getuige wordt van Zijn opstanding.","23":"En zij stelden er twee voor: Jozef, genaamd Barsabas, die bijgenaamd was Justus, en Matthias.","24":"En zij baden en zeiden: U, Heere! U, Kenner van de harten van allen, wijs van deze twee er één aan, die U uitverkoren hebt,","25":"om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.","26":"En zij wierpen hun loten; en het lot viel op Matthias, en hij werd met algemene instemming bij de elf apostelen gerekend."},"SV":{"1":"Het eerste boek heb ik gemaakt, o Theofilus, van al hetgeen Jezus begonnen heeft beide te doen en te leren;","2":"Tot op den dag, in welken Hij opgenomen is, nadat Hij door den Heiligen Geest aan de apostelen, die Hij uitverkoren had, bevelen had gegeven.","3":"Aan welke Hij ook, nadat Hij geleden had, Zichzelven levend vertoond heeft, met vele gewisse kentekenen, veertig dagen lang, zijnde van hen gezien, en sprekende van de dingen , die het Koninkrijk Gods aangaan.","4":"En als Hij met *hen* vergaderd was, beval Hij hun, dat zij van Jeruzalem niet scheiden zouden, maar verwachten de belofte des Vaders, die gij, *zeide* *Hij*, van Mij gehoord hebt.","5":"Want Johannes doopte wel met water, maar gij zult met den Heiligen Geest gedoopt worden, niet lang na deze dagen.","6":"Zij dan, die samengekomen waren, vraagden Hem, zeggende: Heere, zult Gij in dezen tijd aan Israël het Koninkrijk wederoprichten?","7":"En Hij zeide tot hen: Het komt u niet toe, te weten de tijden of gelegenheden, die de Vader in Zijn eigen macht gesteld heeft;","8":"Maar gij zult ontvangen de kracht des Heiligen Geestes, Die over u komen zal; en gij zult Mijn getuigen zijn, zo te Jeruzalem, als in geheel Judea en Samaria, en tot aan het uiterste der aarde.","9":"En als Hij dit gezegd had, werd Hij opgenomen, daar zij het zagen, en een wolk nam Hem weg van hun ogen.","10":"En alzo zij hun ogen naar den hemel hielden, terwijl Hij heenvoer, ziet, twee mannen stonden bij hen in witte kleding;","11":"Welke ook zeiden: Gij Galilese mannen, wat staat gij en ziet op naar den hemel? Deze Jezus, Die van u opgenomen is in den hemel, zal alzo komen, gelijkerwijs gij Hem naar den hemel hebt zien heenvaren.","12":"Toen keerden zij wederom naar Jeruzalem, van den berg, die genaamd wordt de Olijf *berg*, welke is nabij Jeruzalem, liggende *van* *daar* een sabbatsreize.","13":"En als zij ingekomen waren, gingen zij op in de opperzaal, waar zij bleven, *namelijk* Petrus en Jakobus, en Johannes en Andreas, Filippus en Thomas, Bartholomeüs en Mattheus, Jakobus, *de* *zoon* van Alfeüs, en Simon Zelotes, en Judas, *de* *broeder* van Jakobus.","14":"Deze allen waren eendrachtelijk volhardende in het bidden en smeken, met de vrouwen, en Maria, de moeder van Jezus, en met Zijn broederen.","15":"En in dezelve dagen stond Petrus op in het midden der discipelen, en sprak (er was nu een schare bijeen van omtrent honderd en twintig personen):","16":"Mannen broeders, deze Schrift moest vervuld worden, welke de Heilige Geest door den mond Davids voorzegd heeft van Judas, die de leidsman geweest is dergenen, die Jezus vingen;","17":"Want hij was met ons gerekend, en had het lot dezer bediening verkregen.","18":"Deze dan heeft verworven een akker, door het loon der ongerechtigheid, en voorwaarts overgevallen zijnde, is midden opgeborsten, en al zijn ingewanden zijn uitgestort.","19":"En het is bekend geworden allen, die te Jeruzalem wonen, alzo dat die akker in hun eigen taal genoemd wordt Akeldama, dat is, een akker des bloeds.","20":"Want er staat geschreven in het boek der Psalmen: Zijn woonstede worde woest, en er zij niemand die in dezelve wone. En: Een ander neme zijn opzienersambt.","21":"Het is dan nodig, dat van de mannen, die met ons omgegaan hebben al den tijd, in welken de Heere Jezus onder ons in *gegaan* en uitgegaan is,","22":"Beginnende van den doop van Johannes, tot den dag toe, in welken Hij van ons opgenomen is, een derzelven met ons getuige worde van Zijn opstanding.","23":"En zij stelden er twee, Jozef, genaamd Barsabas, die toegenaamd was Justus, en Matthias.","24":"En zij baden en zeiden: Gij Heere! Gij Kenner der harten van allen, wijs van deze twee een aan, dien Gij uitverkoren hebt;","25":"Om te ontvangen het lot dezer bediening en des apostelschaps, waarvan Judas afgeweken is, dat hij heenging in zijn eigen plaats.","26":"En zij wierpen hun loten; en het lot viel op Matthias, en hij werd met gemene toestemming tot de elf apostelen gekozen."},"KJV":{"1":"The former treatise have I made, O Theophilus, of all that Jesus began both to do and teach,","2":"Until the day in which he was taken up, after that he through the Holy Ghost had given commandments unto the apostles whom he had chosen:","3":"To whom also he shewed himself alive after his passion by many infallible proofs, being seen of them forty days, and speaking of the things pertaining to the kingdom of God:","4":"And, being assembled together with *them*, commanded them that they should not depart from Jerusalem, but wait for the promise of the Father, which, *saith he*, ye have heard of me.","5":"For John truly baptized with water; but ye shall be baptized with the Holy Ghost not many days hence.","6":"When they therefore were come together, they asked of him, saying, Lord, wilt thou at this time restore again the kingdom to Israel?","7":"And he said unto them, It is not for you to know the times or the seasons, which the Father hath put in his own power.","8":"But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judaea, and in Samaria, and unto the uttermost part of the earth.","9":"And when he had spoken these things, while they beheld, he was taken up; and a cloud received him out of their sight.","10":"And while they looked stedfastly toward heaven as he went up, behold, two men stood by them in white apparel;","11":"Which also said, Ye men of Galilee, why stand ye gazing up into heaven? this same Jesus, which is taken up from you into heaven, shall so come in like manner as ye have seen him go into heaven.","12":"Then returned they unto Jerusalem from the mount called Olivet, which is from Jerusalem a sabbath day's journey.","13":"And when they were come in, they went up into an upper room, where abode both Peter, and James, and John, and Andrew, Philip, and Thomas, Bartholomew, and Matthew, James *the son* of Alphaeus, and Simon Zelotes, and Judas *the brother* of James.","14":"These all continued with one accord in prayer and supplication, with the women, and Mary the mother of Jesus, and with his brethren.","15":"And in those days Peter stood up in the midst of the disciples, and said, (the number of names together were about an hundred and twenty,)","16":"Men *and* brethren, this scripture must needs have been fulfilled, which the Holy Ghost by the mouth of David spake before concerning Judas, which was guide to them that took Jesus.","17":"For he was numbered with us, and had obtained part of this ministry.","18":"Now this man purchased a field with the reward of iniquity; and falling headlong, he burst asunder in the midst, and all his bowels gushed out.","19":"And it was known unto all the dwellers at Jerusalem; insomuch as that field is called in their proper tongue, Aceldama, that is to say, The field of blood.","20":"For it is written in the book of Psalms, Let his habitation be desolate, and let no man dwell therein: and his bishoprick let another take.","21":"Wherefore of these men which have companied with us all the time that the Lord Jesus went in and out among us,","22":"Beginning from the baptism of John, unto that same day that he was taken up from us, must one be ordained to be a witness with us of his resurrection.","23":"And they appointed two, Joseph called Barsabas, who was surnamed Justus, and Matthias.","24":"And they prayed, and said, Thou, Lord, which knowest the hearts of all *men*, shew whether of these two thou hast chosen,","25":"That he may take part of this ministry and apostleship, from which Judas by transgression fell, that he might go to his own place.","26":"And they gave forth their lots; and the lot fell upon Matthias; and he was numbered with the eleven apostles."}},"tsk":{"1":[{"kopje":"eerste","refs":["Luk 1:24"]},{"kopje":"o Theofilus","refs":["Luk 1:3"]},{"kopje":"over","refs":["Hand 2:22","Matt 4:23","Matt 4:24","Matt 11:5","Luk 7:21-23","Luk 24:19","Joh 10:32-38","Joh 18:19-21","1 Petr 2:21-23"]}],"2":[{"kopje":"de dag","refs":["Hand 1:9","Mark 16:19","Luk 9:51","Luk 24:51","Joh 6:62","Joh 13:1","Joh 13:3","Joh 16:28","Joh 17:13","Joh 20:17","Ef 4:8-10","1 Tim 3:16","Hebr 6:19","Hebr 6:20","Hebr 9:24","1 Petr 3:22"]},{"kopje":"door","refs":["Hand 10:38","Jes 11:2","Jes 11:3","Jes 42:1","Jes 48:16","Jes 59:20","Jes 59:21","Jes 61:1","Matt 3:16","Matt 12:28","Joh 1:16","Joh 3:34","Openb 1:1","Openb 2:7","Openb 2:11","Openb 2:17","Openb 2:29","Openb 3:16","Openb 3:13","Openb 3:22"]},{"kopje":"gegeven","refs":["Matt 28:19","Mark 16:15-19","Luk 24:45-49"]},{"kopje":"de apostelen","refs":["Hand 1:13","Hand 10:40-42","Matt 10:1-4","Mark 3:1 :"bevelen had","tekst":"Namelijk hoe zij het Evangelie zouden prediken door de gehele wereld; Mat 28:19 ; Mar 16:15 , en te Jeruzalem wachten op de zending des Heiligen Geestes; Luk 24:49 ."}],"3":[{"catchword":"vertoond heeft,","tekst":"Grieks voorgesteld, of tegenwoordig gesteld heeft in velen."},{"catchword":"kentekenen,","tekst":"Namelijk waaruit klaarlijk is gebleken, dat hij waarlijk met hetzelfde lichaam van de doden was opgestaan; als daar zijn geweest, dat hij hun dikwijls is verschenen, met hen dikwijls heeft gesproken en gegeten, en dat zij Zijne littekens gezien en getast hebben; Luk. 24; Joh. 20, 21."}],"4":[{"catchword":"Hij met hen","tekst":"Of, als Hij hen bijeenvergaderd had."},{"catchword":"de belofte","tekst":"Dat is, den Heiligen Geest, dien de Vader door Hem beloofd had hun te zullen zenden; Luk 24:49 ; Joh 14:26 ."}],"5":[{"catchword":"met den Heiligen","tekst":"Grieks in den Heiligen Geest; namelijk dien Ik op den pinksterdag overvloedig als water over u zal uitstorten. Hetzelfde voorzegt ook Johannes de Doper; Mat 3:11 ."},{"catchword":"niet lang na","tekst":"Grieks niet na vele deze dagen; namelijk tien dagen daarna."}],"6":[{"catchword":"aan Israël","tekst":"Dat is, aan het volk of de nakomelingen Israëls."},{"catchword":"het Koninkrijk","tekst":"Namelijk hetwelk de profeten tevoren hebben gezegd, door den Messias te zullen opgericht worden, en zij nog meenden, naar de gemene dwaling, een werelds koninkrijk te zullen zijn."}],"7":[{"catchword":"gelegenheden,","tekst":"Namelijk der tijden, op welke God, hetgeen Hij verordineerd en beloofd heeft, zal willen uitvoeren."}],"8":[{"catchword":"Maar gij zult","tekst":"Of, maar gij zult kracht ontvangen, nadat de Heilige Geest over u zal gekomen zijn."},{"catchword":"Mijn getuigen","tekst":"Grieks mij getuigen zijn; namelijk dat Ik de beloofde Messias en Zaligmaker der wereld ben."}],"9":[{"catchword":"opgenomen,","tekst":"Dat is, is opgeheven lichamelijk en zichtbaar van de aarde naar den hemel; Mar 16:19 ; Heb 1:3 , en Heb 8:1 , welke van Paulus de derde hemel en het paradijs genoemd wordt; 2Co 12:2 , 2Co 12:4 ."},{"catchword":"nam Hem weg","tekst":"Of, nam hem op, en alzo weg van hunne ogen."}],"10":[{"catchword":"twee mannen","tekst":"Dat is, twee engelen in de gedaante van mannen. Zie Gen 18:2 ."},{"catchword":"in witte kleding;","tekst":"Zo plachten de engelen te verschijnen, om daarmede te tonen de reinheid hunner natuur en dat zij kwamen om blijde dingen te verkondigen. Zie Mat 28:3 ; Mar 16:5 ; Joh 20:2 ."}],"11":[{"catchword":"Gij Galilese","tekst":"Zie Act 2:7 ."},{"catchword":"alzo komen,","tekst":"Dat is, in zulke wijze, zichtbaar en in ene wolk; Mar 13:26 ; Luk 21:27 ; Rev 1:7 ."}],"12":[{"catchword":"de Olijf- berg,","tekst":"Grieks oliegaarden; namelijk berg. Van dezen berg zie Mat 21:1 ."},{"catchword":"liggende","tekst":"Grieks hebbende."},{"catchword":"een sabbatsreize","tekst":"Dat is, zover als de Joden mochten gaan op een sabbatdag, op welken het verre reizen verboden was, Exo 16:29 , hetwelk, naar eniger mening, omtrent zeven stadiën is geweest. Zodat [elke stadie gerekend zijnde voor honderd vijf en twintig schreden] het omtrent een kwartier uur gaans zou zijn. En alzo gezegd wordt, Joh 11:18 , dat Bethanië, vanwaar Christus ten hemel is opgevaren, Luk 24:50 , op dezen berg gelegen, vijftien stadiën van Jeruzalem was, zo moet dit verstaan worden van het begin des Olijfbergs, op welken Bethanië nog wat verder lag."}],"13":[{"catchword":"ingekomen waren,","tekst":"Namelijk niet alleen in de stad, maar ook in een huis, hetwelk sommigen menen geweest te zijn het huis van Maria, de moeder van Johannes Markus, waarvan men leest Act 12:12 ."},{"catchword":"Petrus en Jakobus,","tekst":"Van deze apostelen zie Mat 10:2 , enz."},{"catchword":"Judas,","tekst":"Deze Judas werd alzo toegenaamd, om onderscheiden te worden van Judas Iskarioth den verrader; en alzo noemt hij zich ook zelf in zijn Zendbrief, vs.1; was anders toegenaamd Lebbeüs; Mat 10:3 ."}],"14":[{"catchword":"volhardende","tekst":"Dat is, krachtig, standvastig, en met lijdzaamheid aanhoudende."},{"catchword":"de vrouwen,","tekst":"Namelijk die Christus van Galilea waren gevolgd, en Hem hadden gediend, Mat 27:55-56 ; Mar 15:40 ; Luk 23:55 ; Joh 19:25 , en ook met hunne huisvrouwen, die mede van node hadden gesterkt te worden, als zullende metgezelinnen zijn van de reizen harer mannen; 1Co 9:5 ."},{"catchword":"broederen","tekst":"Dat is, neven en bloedverwanten, Mat 12:46 , als daar waren Jakobus en Joses, Simon en Judas, zonen van Maria, Christus' moeders zuster; Mat 13:55 ."}],"15":[{"catchword":"in dezelve","tekst":"Dat is, op een van die dagen."},{"catchword":"personen)","tekst":"Grieks namen; dat is hoofden, of mensen die bij hunne namen geteld worden. Zie Rev 3:4 , en Rev 11:13 ."}],"17":[{"catchword":"gerekend,","tekst":"Of, geteld."},{"catchword":"het lot dezer","tekst":"Zo wordt de dienst van het apostelschap genaamd, omdat deze van God, niet uit verdienste of waardigheid, maar naar Zijn welbehagen gegeven wordt; Act 8:21 ."}],"18":[{"catchword":"heeft verworven","tekst":"Namelijk overmits hij den Joden gelegenheid heeft gegeven, dat die akker door hen gekocht werd voor dat geld, hetwelk hem voor de verraderij gegeven was; Mat 27:6-7 . Zodat dit moet verstaan worden niet van het voornemen van Judas, maar van de uitkomst, die daarop gevolgd is."},{"catchword":"een akker,","tekst":"Namelijk den bloedakker, vs.19."},{"catchword":"door het loon","tekst":"Grieks uit het loon."},{"catchword":"der ongerechtigheid,","tekst":"Dat is, der onrechtvaardige daad der verraderij."},{"catchword":"voorwaarts","tekst":"Dewijl gezegd wordt, Mat 27:5 , dat hij verworgd is, zo is het algemeen gevoelen dat hij zichzelven met een strop verhangen heeft, en dat hij alzo voorwaarts over òf in den strop is gevallen, òf de strop gebroken zijnde, voorover gevallen is en gebarsten, en dat hij alzo zijn ingewanden door een rechtvaardig oordeel Gods uitgestort heeft. Zie dergelijk voorbeeld in Achitofel; 2Sa 17:23 ."},{"catchword":"overgevallen","tekst":"Grieks geworden."}],"19":[{"catchword":"bekend geworden","tekst":"Namelijk dat God den verrader Judas met zulk een dood gestraft had."},{"catchword":"in hun eigen","tekst":"Namelijk in de Syrische of Chaldeeuwse taal, die de Joden na de Babylonische gevangenschap gebruikten."},{"catchword":"een akker des bloeds","tekst":"Namelijk omdat hij gekocht was voor het geld, waar het bloed van Christus voor verkocht was geweest."}],"20":[{"catchword":"woonstede","tekst":"David, als een voorbeeld van Christus in den Psa 69 , spreekt wel in het algemeen van zijne vijanden; doch alzo in denzelfden psalm ook van het lijden van Christus geprofeteerd wordt, zo past het de apostel Petrus in het bijzonder op Judas, die een verrader van Christus geweest is."},{"catchword":"En","tekst":"Namelijk, wordt op een andere plaats in het boek der psalmen nog gezegd."},{"catchword":"Een ander neme","tekst":"David schijnt deze woorden, in den 109den Psa , wel te spreken van Doëg, die een was van de opperste herders van den koning Saul, en hem met de priesters te Nob had verraden; maar overmits David een voorbeeld van Christus geweest is, zo wordt dit ook bekwamelijk op Judas, die den Heere Christus verraden heeft, van Petrus geduid."},{"catchword":"opzienersambt","tekst":"Hoewel het Griekse woord somtijds allerlei opzienersambten betekent, zo wordt het nochtans hier bijzonderlijk genomen voor het apostelambt van Judas, hetwelk alzo genaamd wordt, omdat de dienaars des Evangelies opzicht hebben over de gemeente; Act 20:28 ."}],"21":[{"catchword":"omgegaan hebben","tekst":"Of, vergaderd zijn geweest; namelijk als wij Christus volgden. Onder welken zonder twijfel de zeventig discipelen ook geweest zijn."},{"catchword":"In- en uitgegaan","tekst":"Dat is, met ons gemeenzaam verkeerd heeft, met ons op en neer gegaan heeft, en zijn ambt, als onze Heere en Meester onder ons bediend heeft, Hebreën. Zie Deu 31:2 ; Psa 121:8 ; Joh 10:9 ."}],"22":[{"catchword":"van den doop","tekst":"Dat is, van den tijd, dat Johannes heeft begonnen te leren en te dopen; want toen begon de bediening des Evangelies, en kort daarna begon ook Christus zelf zijn ambt te bedienen."},{"catchword":"Zijn opstanding","tekst":"Namelijk, en ook van alle andere leerlingen en daden van Christus. Doch hier wordt alleen melding gemaakt van Zijne opstanding, omdat Hij daardoor krachtiglijk is bewezen te zijn de Zoon Gods en de ware Messias; Act 2:32 ; Rom 1:4 ."}],"23":[{"catchword":"Jozef,","tekst":"Deze wordt in sommige boeken genaamd Joses, en wordt gehouden een broeder geweest te zijn van Jakobus den Jonge."}],"24":[{"catchword":"Gij Heere","tekst":"Zie de reden hiervan in de aantekeningen Gal 1:1 ."},{"catchword":"Kenner der","tekst":"Dat is, Gij die weet hoe zij inwendig in het hart gesteld zijn."},{"catchword":"wijs van deze","tekst":"Namelijk door het lot, hetwelk van U bestuurd wordt; Pro 16:33 ."}],"25":[{"catchword":"het lot dezer","tekst":"Zie vs.17."},{"catchword":"afgeweken is,","tekst":"Of, afgetreden is; dat is, waar Judas om zijne boosheid uitgevallen is."},{"catchword":"in zijn eigen","tekst":"Namelijk die hem en zijns gelijken, van God naar zijn rechtvaardig oordeel verordineerd is, en de plaats der pijn genaamd wordt; Luk 16:28 ."}],"26":[{"catchword":"wierpen hun","tekst":"Grieks gaven hunne loten; namelijk van Jozef en Matthias, uit welken een door het lot zou verkoren worden, opdat alzo zijne beroeping tot het apostelschap als van God zelf zou komen."},{"catchword":"viel op Matthias,","tekst":"Zie dergelijke in de verkiezing van Saul tot het koningsambt; 1Sa 10:20 ."},{"catchword":"met gemene","tekst":"Dat is zij hebben allen deze goddelijke verkiezing voor goed gekend en aangenomen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The first Book I have made, [Gr.the first speech, whereby he understands his Evangelical History. So that from thence as also from that which followeth it appears, that the Holy Evangelist Luke wrote this Book also] O Thoephilus, [of this Theophilus see the annotation on Luk 1:3.] of all that which Jesus began both to do and to teach."}],"2":[{"catchword":null,"tekst":"Untill the day in which he was taken up, after that he by the holy Ghost, [This in the Greek text may be joined either to the words given commandments, or to the word chosen] had given commandments [namely, how they should preach the Gospel throughout the whole world, Mat. 28. 19. Mark 16. 19 and at Jerusalem wait for this sending of the Holy Ghost, Luke 24.v. 49.] to the Apostles which he had chosen. [namely, to the Apostolical office. See Mat. 10. V. 1. &c.]"}],"3":[{"catchword":null,"tekst":"To whom also after that he had suffered, he shewed himself alive, [Gr.proposed, or presented in many] with many certain evidences; [from whence it cleerly appeared , that he was truely risen from the dead with the same body: such as were his often appearing unto them, often speaking and eating with them, and their seeing his skars, Luke 24. John chap. 20.and 21.] being seen of them for fourty days, and speaking of the things which concern the Kingdome of God."}],"4":[{"catchword":null,"tekst":"And when he was assembled with them, [Or when he had gathered (them) together] he commanded them that they should not part from Jerusalem, but wait for the promise of the Father, [that is, the holy Ghost which the Father had by him promised that he would send unto them, Luke 24. 48. John 14 v. 26.] which ye (said he) have heard of me."}],"5":[{"catchword":null,"tekst":"For John indeed baptized with water, but he shall be baptized with the holy Ghost, [Gr.in the Holy Ghost, namely, which on the day of Pentecost I will abundantly power unto you as water. The same John the Baptist foretells also, Mat. 3. 11.] not long after these daies. [Gr.not after many these daies, namely, ten daies after.]"}],"6":[{"catchword":null,"tekst":"They therefore which were come together, asked him saying, Lord, wilt thou in this time set up again the Kingdome [Namely, which the Prophets have foretold, shall be set up by the Messias, and they yet thought according to the common errour should be a wordly Kingdome] to Israel? [that is, to the people or prosterity of Israel.]"}],"7":[{"catchword":null,"tekst":"And he said unto them, it belongeth not unto you to know the times or opportunities, [namely, of the times in which God will execute that which he hath ordained and promised] which the Father hath put in his own power."}],"8":[{"catchword":null,"tekst":"But ye shall receive the power of the holy Ghost, which shall come upon you; [Or ye shall receive power, after that the Holy Ghost shall be come upon you] and yee shall be my witnesses, [Gr.he witnesses unto me, namely that I am the promised Messias and Saviour of the world] as well at Jerusalem as in all Judea and Samaria, and even unto the utmost (part) of the Earth."}],"9":[{"catchword":null,"tekst":"And when he hath saith this, he was taken up, [That is , lifted up bodily, and invisibly from earth towards heaven, Mark. 16. 19.Heb 1:3.and chap. 8. 1.which is by Paul called the third heaven and paradise, 2 Cor. 12.V. 2, 4.] while they saw it, and a cloud took him away from their eyes. [Or took him up, and so away from their eyes.]"}],"10":[{"catchword":null,"tekst":"And as they held their eyes towards heaven as he went away, behold two man stood by them, [That is, two Angels in the shape of men. See Gen 18. 2.] in white cloathing. [so the Angels used to appear , thereby to shew the purity of their nature, and that they came to declare joyful things. See Mat. 28. 3. Mark 16. 5. John 21. 12.]"}],"11":[{"catchword":null,"tekst":"Which also said ; Te men of Galilee [See Acts 2. 7.] what stand ye and look ye towards heaven? This Jesus that is taken up from you unto heaven, shall so come [that is, in such manner, visibly, in a cloud, Mark 13. 26. Luke 21. 27. Rev. 1. 7.] like as ye have seen him go away towards heaven."}],"12":[{"catchword":null,"tekst":"Then they returned unto Jerusalem from the mount which is called the Olive- (mount,) [Gr. Olive-garden, namely, mountain. Of this mountain see Mat. 21. 1.] which is nigh unto Jerusalem, lying [Gr.having] (from thence) a Sabbaths journey. [that is, as far as the Jews may go on a Sabbath day; for which it was forbidden to travel far; Exod. 16. 29. which according to the opinion some was about seven furlongs. So that (each furlong being reckoned for one hundred twenty and five paces) it should be about a quarter of an hours going. And seeing it is said John 11. 18.that Bethany from whence Christ ascended unto heaven, Luke 24. 50.lying on this mountain, was fifteen furlongs from Jerusalem, so must this be understood of the beginning of the mount of Olives, on which Bethany lay yet somewhat further.]"}],"13":[{"catchword":null,"tekst":"And when they were come in, [Namely, not only into the City, but also into an house, which some think to have been the house of Mary, the Mother of John Mark, of whom we read Acts 12. 12] they went up into the upper room, where they abode, (namely) Peter [of these Apostles see Mt 10. 20.] and James and John and Andrew, Philip and Thomas, Bartholomew and Matthew, James (the son) of Alpheus, and Simon Zelotes, and Judas (the brother) of James. [this Judas was that sirnamed, to be distinguished from Judas Iscariot the Traitor, and so he also names himself in his Epistle, v. 1.and was otherwise sirnamed Lebbeus, Mat. 10. 3."}],"14":[{"catchword":null,"tekst":"These all were persevering [That is, powerfully, stedfastly, and patiently continuing] unanimously in prayer and supplication, with the women [namely, which had followed Christ into Galilee, and had served him Mat. 27. 55, 56. Mark 15. 40. Luke 23. 55. John 19. 25.and also with their wives, who had need to be strengthened, as being to be companions of the Travels of their husbands, 1 Cor. 9. 5.] and Mary the Mother of Jesus, and with his brethren. [that is, Nephews and Kinsmen, Mat. 12. 46.as were James and Joses, Simon and Judas, the sons of Mary the sister of Christs Mother, Mat. 13. 55.]"}],"15":[{"catchword":null,"tekst":"And in the same daies [That is, on one of those daies] Peter stood up in the Disciples, and spake; (now there was together, a company of about an hundred and twenty persons.) [Gr.names, that is, heads, or men which are numbered by their names. See Rev. 3. 4.and 11.v. 13.]"}],"16":[{"catchword":null,"tekst":"Men, Brethren, this Scripture must be fulfilled, which the Holy Ghost by the mouth of David foretold concerning Judas, who was the leader of those that took Jesus."}],"17":[{"catchword":null,"tekst":"For he was reckoned with us [Or numbred,] and had obtained the lot of this ministrey. [so the ministrey of the Apostleship is called, because the same is given by God, not of merit or worthiness, but according to his good pleasure, Acts 8. 21.]"}],"18":[{"catchword":null,"tekst":"This (man) therefore procured [Namely, in as much as he gave the Jews occasion, that that field was bought by them, for that mony which was given to him for that treason, Mat. 27. 6, 7. So that this may be understood not of Judas his intent, but of the event which followed thereupon] a field, [namely, the field of blood ver. 9.] by the reward [Gr.of the reward] of iniquity, [that is, of the unrighteous act of treason] and being fallen [Gr.become] headlong [seeing it is said, Mat 27. 5.that he was strangled, therefore the common opinion is, that he hanged himself with an halter, and that so he fell headlong or into the halter, and that the halter being broken he fell headlong and burst, and that so he powred out his bowels through the righteous judgement of God. See the like example in Achitophel, 2 Sam. 17. 23.] burst up in the midst, and all his bowels were powred out."}],"19":[{"catchword":null,"tekst":"And it became known [Namely, that God had punished the traitor Judas with such a death] to all that dwell at Jerusalem; so that that field in their own tongue, which the Jews used after the Babilonish Caaptivity] is called Akeldama, that is, a field of blood.[namely because it was bought for the mony, for which the blood of Christ had been sold.]"}],"20":[{"catchword":null,"tekst":"For it is written in the Book of Psalmes, Let his habitation be waste, and let there be no man that may dwell in the same; [David as a type of Christ, in the 69 Psalm speaketh indeed in the general of his Enemies: yet seeing in the same Psalm it is also prophecyed of the sufferings of Christ, therefore the Apostle Peter applies it toJudas in particular, who was the betrayer of appliers it to Judas in particular, who was the betrayer of Christ] and [namely, it is again said in another place in the Book of Psalmes] let another take [David seemeth indeed in the 109 Psalm, to speak these words of Doeg, who was one of the chief Herds-men of King Saul, and had betrayed him with the Priests at Nob. But seeing that David was a type of Christ, therefore this was also fitly expounded by Peter, of Judas, who betrayed the Lord Jesus Christ] by Overseers office [howsoever the Greek word sometimes signifies all manner of Overseers offices, yet here it is taken specially for the Apostolical office of Judas which is so called, because the Ministers of the Gospel have oversight of the Church, Acts 20.v.28.]"}],"21":[{"catchword":null,"tekst":"It is needful therefore, that of the men which have conversed with us, [Or have assembled, namely, when we followed Christ; amongst whom without doubt the seventy Disciples also were] all the time in which the Lord Jesus went in and out amongst us, [that is, conversed familiarly with us, went up and down with us, and as our Lord and Master administred his office among us. An Heb. See Deu. 31. 2. Psa. 121. 8. John 10. 9."}],"22":[{"catchword":null,"tekst":"Beginning from the Baptist of John, [That is, from the time that John began to teach and baptize: for then began // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
