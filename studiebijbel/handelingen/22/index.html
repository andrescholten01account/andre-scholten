Ik zeg u, dat zij hun loon al ontvangen hebben. Maar u, wanneer u bidt, ga in uw binnenkamer, en sluit uw deur, en bid tot uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden. En als u bidt, gebruik dan geen zinloze herhaling van woorden, zoals de heidenen; want zij menen dat zij vanwege hun veelheid van woorden verhoord zullen worden.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Deut 11:18-21": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen; En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat; En schrijf ze op de posten van uw huis, en aan uw poorten;", "Jes 8:14": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.", "Matt 26:31-35": "Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden. Maar nadat Ik zal opgestaan zijn, zal Ik u voorgaan naar Galilea. Doch Petrus antwoordde en zei tegen Hem: Al werden zij ook allen aan U geërgerd, ik zal nooit geërgerd worden.", "Hand 27:3": "En de volgende dag kwamen wij aan te Sidon. En Julius, die vriendelijk met Paulus omging, liet hem toe naar zijn vrienden te gaan, om door hen verzorgd te worden.", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Joh 21:15-17": "Toen zij dan de maaltijd gehouden hadden, zei Jezus tegen Simon Petrus: Simon, zoon van Jonas, hebt u Mij meer lief dan dezen? Hij zei tegen Hem: Ja, Heere! U weet dat ik U liefheb. Hij zei tegen hem: Weid Mijn lammeren. Hij zei opnieuw tegen hem, voor de tweede keer: Simon, zoon van Jonas, hebt u Mij lief? Hij zei tegen Hem: Ja, Heere, U weet dat ik U liefheb. Hij zei tegen hem: Hoed Mijn schapen. Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Hand 24:23": "En hij beval de hoofdman over honderd, dat Paulus bewaard zou worden, en verlichting zou hebben, en dat hij niemand van de zijnen zou beletten hem te dienen, of naar hem toe te komen.", "1 Joh 4:3": "en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Hand 16:33": "En hij nam hen op datzelfde uur van de nacht mee, en waste hun striemen; en hij werd meteen gedoopt, en al de zijnen.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Joh 12:37-40": "En hoewel Hij zoveel tekenen voor hen gedaan had, geloofden zij toch niet in Hem; Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard? Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft:", "Mark 13:22": "Want er zullen valse christussen, en valse profeten opstaan, en zij zullen tekenen en wonderen doen, om te misleiden, indien het mogelijk zou zijn, ook de uitverkorenen.", "Ex 13:8-10": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok. En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft. Houd daarom deze inzetting op de vastgestelde tijd, van jaar tot jaar.", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "Joh 8:24-30": "Ik heb u dan gezegd, dat u in uw zonden zult sterven; want als u niet gelooft dat Ik Die ben, zult u in uw zonden sterven. Zij zeiden dan tegen Hem: Wie bent U? En Jezus zei tegen hen: Wat Ik van het begin af aan u al zeg. Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld.", "Hand 26:14-18": "En toen wij allen op de grond neergevallen waren, hoorde ik een stem tot mij spreken, die zei in de Hebreeuwse taal: Saul, Saul, waarom vervolgt u Mij? Het is u hard, tegen de prikkels de hielen te slaan. En ik zei: Wie bent U, Heere? En Hij zei: Ik ben Jezus, Die u vervolgt. Maar richt u op en sta op uw voeten; want hiertoe ben Ik u verschenen, om u aan te stellen tot een dienaar en getuige, zowel van de dingen die u gezien hebt als van de dingen waarin Ik u nog zal verschijnen;", "Hand 26:4": "Mijn leven dan, van mijn jeugd af aan, dat vanaf het begin onder mijn volk in Jeruzalem geweest is, weten alle Joden;", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Hebr 4:6": "Omdat het dan blijft gelden dat sommigen die rust ingaan, en zij aan wie het Evangelie eerst verkondigd was, niet ingegaan zijn vanwege de ongehoorzaamheid,", "Gal 4:1": "Maar ik zeg: zolang de erfgenaam een kind is, verschilt hij niets van een dienstknecht, hoewel hij een heer is van alles;", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Hand 28:24": "En sommigen geloofden wel wat er gezegd werd, maar sommigen geloofden niet.", "Rom 12:3-8": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld. Want zoals wij in één lichaam veel leden hebben, en de leden niet allemaal dezelfde functie hebben, zo zijn wij, hoewel velen, één lichaam in Christus, maar ieder afzonderlijk zijn wij elkaars leden.", "Job 23:14": "Want Hij zal volbrengen wat over mij bepaald is; en dergelijke dingen zijn er veel bij Hem.", "Rom 1:32": "die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.", "Matt 10:40-42": "Wie u ontvangt, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem, Die Mij gezonden heeft. Wie een profeet ontvangt in de naam van een profeet, zal het loon van een profeet ontvangen; en wie een rechtvaardige ontvangt in de naam van een rechtvaardige, zal het loon van een rechtvaardige ontvangen. En wie een van deze kleinen slechts een beker koud water te drinken geeft, in de naam van een discipel, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "Ezech 3:7": "Maar het huis Israëls wil naar u niet horen, omdat zij naar Mij niet willen horen; want het hele huis Israëls is stijf van voorhoofd, en hard van hart zijn zij.", "Openb 2:13": "Ik weet uw werken, en waar u woont; namelijk daar waar de troon van de satan is, en u houdt Mijn Naam vast, en hebt Mijn geloof niet verloochend, ook in die dagen waarin Antipas, Mijn getrouwe getuige, gedood is bij u, daar waar de satan woont.", "Joël 1:13-15": "Omgord u, en rouwklaag, priesters! Huil, dienaars van het altaar! Ga naar binnen, overnacht in zakken, dienaars van mijn God! Want spijsoffer en drankoffer is geweerd van het huis van uw God. Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE. Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Gal 3:24": "Zo dan, de wet is onze leermeester geweest tot Christus, opdat wij uit het geloof gerechtvaardigd zouden worden.", "Luk 7:30-35": "Maar de Farizeeën en de wetgeleerden hebben het raadsbesluit van God tegen zichzelf verworpen, doordat zij zich niet door hem lieten dopen. En de Heere zei: Waarmee zal Ik dan de mensen van dit geslacht vergelijken, en waaraan zijn zij gelijk? Zij zijn gelijk aan de kinderen die op de markt zitten en elkaar toeroepen en zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben klaagliederen voor u gezongen, en u hebt niet gehuild.", "Hand 19:33": "En zij haalden Alexander uit de menigte naar voren, doordat de Joden hem naar voren duwden. En Alexander wenkte met de hand, en wilde zich bij het volk verantwoorden.", "Joh 7:15": "En de Joden verwonderden zich en zeiden: Hoe weet Deze de Schriften, terwijl Hij ze niet geleerd heeft?", "Joh 9:17": "Zij zeiden opnieuw tegen de blinde: U, wat zegt u van Hem, omdat Hij uw ogen geopend heeft? En hij zei: Hij is een Profeet.", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "1 Kron 23:13": "De kinderen van Amram waren Aäron en Mozes. Aäron nu werd afgezonderd om de allerheiligste dingen te heiligen, hij en zijn zonen, tot in eeuwigheid, om te roken voor het aangezicht van de HEERE, om Hem te dienen en om in Zijn Naam tot in eeuwigheid te zegenen.", "3 Joh 1:12": "Aan Demetrius wordt door allen goed getuigenis gegeven, en door de waarheid zelf; en wij getuigen ook, en u weet dat onze getuigenis waar is.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "2 Tim 2:10": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid.", "Joh 4:10": "Jezus antwoordde en zei tegen haar: Als u de gave van God kende, en Wie Hij is, Die tegen u zegt: Geef Mij te drinken, dan zou u van Hem hebben gevraagd, en Hij zou u levend water gegeven hebben.", "Jer 5:12-14": "Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien. Ja, die profeten zullen tot wind worden, want het woord is niet bij hen; hun zelf zal zo gebeuren. Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "Gal 3:27": "Want zovelen als u in Christus gedoopt zijt, hebt u Christus aangedaan.", "Hand 9:3-17": "En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel; en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij? En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "Hand 8:12": "Maar toen zij Filippus geloofden, die het Evangelie van het Koninkrijk van God en van de Naam van Jezus Christus verkondigde, werden zij gedoopt, zowel mannen als vrouwen.", "Luk 11:5-13": "En Hij zei tegen hen: Wie van u zal een vriend hebben, en zal midden in de nacht naar hem toe gaan, en tegen hem zeggen: Vriend! leen mij drie broden; Omdat mijn vriend van de reis bij mij gekomen is, en ik heb niets, dat ik hem kan voorzetten; En dat die van binnen dan zou antwoorden en zeggen: Val mij niet lastig; de deur is al gesloten, en mijn kinderen zijn met mij in de slaapkamer; ik kan niet opstaan om u te geven.", "Hand 9:30": "Maar toen de broeders dit te weten kwamen, brachten zij hem naar Cesarea, en zonden hem weg naar Tarsen.", "Gal 1:13": "Want u hebt gehoord van mijn vroegere levenswandel in het Jodendom, dat ik de Gemeente van God uitermate zwaar vervolgde, en die verwoestte;", "Ex 22:23": "Als u hen op enige manier kwaad doet, en zij roepen dan tot Mij, zal Ik hun geroep zeker verhoren;", "Hand 22:25-28": "En toen zij hem met de riemen vastbonden om hem te geselen, zei Paulus tegen de hoofdman over honderd die daar stond: Is het u geoorloofd een Romeins burger, en dat nog wel iemand die niet veroordeeld is, te geselen? Toen de hoofdman over honderd dat hoorde, ging hij naar de leider en meldde het hem, en zei: Kijk uit wat u doet, want deze man is een Romein. En de leider kwam naar hem toe en zei tegen hem: Zeg mij, bent u een Romein? En hij zei: Ja.", "Ex 3:13-16": "Toen zei Mozes tegen God: Zie, wanneer ik kom tot de kinderen van Israël, en tegen hen zeg: De God van uw vaderen heeft mij tot u gezonden; en zij mij zeggen: Hoe is Zijn naam? wat zal ik tegen hen zeggen? En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden! Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "1 Tess 2:10-12": "U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben. Zoals u weet, hoe wij ieder van u, zoals een vader zijn kinderen, vermaanden en vertroostten, en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Mark 14:66-72": "En terwijl Petrus beneden in de zaal was, kwam een van de dienstmeisjes van de hogepriester; en toen zij Petrus zag zich warmen, keek zij hem aan, en zei: U was ook met Jezus de Nazarener. Maar hij ontkende het, en zei: Ik ken Hem niet, en ik weet niet wat u zegt. En hij ging naar buiten, naar de voorhal, en de haan kraaide.", "Hand 16:22": "En de menigte kwam gezamenlijk tegen hen in opstand; en de aanvoerders scheurden hun de kleren af en gaven bevel hen te geselen.", "Hebr 3:12": "Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "1 Joh 2:22": "Wie is de leugenaar, dan wie loochent, dat Jezus de Christus is? Deze is de antichrist, die de Vader en de Zoon loochent.", "Num 5:11-27": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tot hen: Wanneer de vrouw van iemand afgeweken zal zijn, en door overtreding tegen hem overtreden zal hebben, Doordat een man gemeenschap met haar gehad heeft, en het voor de ogen van haar man verborgen zal zijn, en zij zich verheeld zal hebben, terwijl zij toch onrein geworden is; en er geen getuige tegen haar is, en zij niet op heterdaad betrapt is;", "Hand 7:53": "U, die de wet ontvangen hebt door bemiddeling van engelen, en die niet gehouden hebt!", "Joh 1:44": "De volgende dag wilde Jezus weggaan naar Galilea, en Hij vond Filippus, en zei tegen hem: Volg Mij.", "Mal 2:7": "Want de lippen van de priesters zullen de kennis bewaren, en men zal uit zijn mond de wet zoeken; want hij is een gezant van de HEERE van de heerscharen.", "1 Petr 2:4": "Kom naar Hem toe, als naar een levende Steen, door de mensen wel verworpen, maar bij God uitverkoren en kostbaar;", "Mark 2:14": "En terwijl Hij voorbijging, zag Hij Levi, de zoon van Alfeüs, in het tolhuis zitten, en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "Joh 20:23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "1 Tim 6:4": "is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens,", "Rom 9:32": "Waarom? Omdat zij die niet uit het geloof zochten, maar als het ware uit de werken van de wet; want zij hebben zich gestoten aan de steen des aanstoots;", "Joh 6:60-62": "Velen van Zijn discipelen dan zeiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren? Jezus, die bij Zichzelf wist dat Zijn discipelen daarover morden, zei tegen hen: Ergert dit u? Wat zou het dan zijn, als u de Zoon des mensen zag opvaren naar waar Hij eerder was?", "1 Kon 12:15": "Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Joh 12:29": "De menigte dan, die daar stond en dit hoorde, zei dat het gedonderd had. Anderen zeiden: Een engel heeft tegen Hem gesproken.", "Joh 21:23": "Dit woord ging dan uit onder de broeders, dat deze discipel niet zou sterven. En Jezus had tegen hem niet gezegd dat hij niet zou sterven, maar: Als Ik wil dat hij blijft totdat Ik kom, wat gaat het u aan?", "1 Kon 8:53": "Want U hebt hen voor Uzelf tot een erfdeel afgezonderd, uit alle volken van de aarde; zoals U gesproken hebt door de dienst van Mozes, Uw dienaar, toen U onze vaderen uit Egypte uitvoerde, Heere HEERE!", "2 Kor 6:3-10": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt. Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "1 Petr 3:21": "Waarvan het tegenbeeld, de doop, ons nu ook behoudt — niet als het afleggen van de vuiligheid van het lichaam, maar als de vraag van een goed geweten aan God — door de opstanding van Jezus Christus;", "Joh 10:33": "De Joden antwoordden Hem: Wij stenigen U niet vanwege enig goed werk, maar vanwege godslastering, en omdat U, die een Mens bent, Uzelf God maakt.", "Joh 3:12": "Als Ik u de aardse dingen gezegd heb en u gelooft niet, hoe zult u geloven als Ik u de hemelse dingen zou zeggen?", "Job 33:26": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven.", "Hand 21:27-40": "Toen nu de zeven dagen bijna voleindigd waren, zagen de Joden uit Azië hem in de tempel, en brachten al het volk in opschudding, en sloegen de handen aan hem, En riepen: Israëlitische mannen, kom te hulp! Dit is de man die overal iedereen leert tegen het volk, en de wet, en deze plaats; en bovendien heeft hij ook Grieken de tempel binnengebracht, en heeft deze heilige plaats ontheiligd. Want zij hadden eerder Trofimus, de Efeziër, met hem in de stad gezien, van wie zij dachten dat Paulus hem de tempel had binnengebracht.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Deut 11:19": "En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat;", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Ps 51:9": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.", "Joh 5:46": "Want als u Mozes geloofde, zou u Mij geloven; want hij heeft van Mij geschreven.", "Hand 9:18": "En meteen vielen er van zijn ogen dingen af als schellen, en hij kon meteen weer zien; en hij stond op en werd gedoopt.", "Spr 17:10": "De bestraffing gaat dieper in de verstandige, dan de dwaas honderdmaal te slaan.", "Jes 44:7": "En wie zal, zoals Ik, roepen en het verkondigen, en het op orde voor Mij zetten, sinds Ik een eeuwig volk gesteld heb? En laat ze de toekomstige dingen, en die komen zullen, hun verkondigen.", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Joh 4:2": "(hoewel Jezus zelf niet doopte, maar Zijn discipelen),", "Gen 16:8": "En hij zei: Hagar, dienstmaagd van Sarai, waar komt u vandaan, en waar zult u heengaan? En zij zei: Ik vlucht van het aangezicht van mijn meesteres Sarai!", "Hand 23:6": "En omdat Paulus wist dat het ene deel bestond uit Sadduceeën en het andere uit Farizeeën, riep hij in de raad: Mannen broeders, ik ben een Farizeeër, de zoon van een Farizeeër; ik word beoordeeld om de hoop en opstanding van de doden.", "Hand 27:43": "Maar de hoofdman, die Paulus wilde redden, verhinderde hun dat plan, en beval dat wie kon zwemmen, zich eerst zou afwerpen om aan land te komen;", "Hand 22:5-16": "Zoals ook de hogepriester mij getuige is, en de gehele raad van oudsten; van hen heb ik ook brieven meegekregen naar de broeders, en ben naar Damaskus gereisd om ook hen die daar waren, gebonden naar Jeruzalem te brengen, opdat zij gestraft zouden worden. Maar het gebeurde mij, toen ik reisde en Damaskus naderde, omtrent de middag, dat er snel uit de hemel een groot licht mij rondom omscheen. En ik viel op de grond, en ik hoorde een stem tegen mij zeggen: Saul, Saul, waarom vervolgt u Mij?", "Joh 5:38": "En Zijn woord hebt u niet in u blijven, want u gelooft Hem niet, Die Hij gezonden heeft.", "2 Kor 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, en Timotheüs, de broeder, aan de gemeente van God, die te Korinthe is, met al de heiligen, die in heel Achaje zijn:", "Luk 24:25": "En Hij zei tegen hen: O onverstandigen en tragen van hart om te geloven al wat de profeten gesproken hebben!", "Hand 16:9": "En in de nacht kreeg Paulus een visioen te zien: er stond een Macedonische man, die hem smeekte en zei: Kom over naar Macedonië, en help ons.", "Ps 33:12": "Gelukkig is het volk wiens God de HEERE is; het volk, dat Hij Zich als erfdeel heeft uitgekozen.", "Gen 12:8": "En hij brak vandaar op naar het gebergte, ten oosten van Beth-el, en hij sloeg zijn tent op, met Beth-el naar het westen, en Ai naar het oosten; en hij bouwde daar een altaar voor de HEERE, en riep de Naam van de HEERE aan.", "Hand 9:23-25": "En toen er veel dagen verlopen waren, spanden de Joden samen om hem te doden. Maar hun plan werd Saulus bekend; en zij bewaakten de poorten, zowel overdag als 's nachts, om hem te kunnen doden. Maar de discipelen namen hem 's nachts en lieten hem neer door de muur, door hem in een mand te laten zakken.", "Luk 1:10": "En heel de menigte van het volk was buiten aan het bidden, op het uur van het reukoffer.", "Ezech 2:6-8": "En u, mensenkind! Wees niet bevreesd voor hen, en wees niet bevreesd voor hun woorden, hoewel er wederwillige mensen en doornen bij u zijn, en u bij schorpioenen woont; wees voor hun woorden niet bevreesd, en schrik niet voor hun gezicht, want zij zijn een opstandig huis. Maar u zult Mijn woorden tot hen spreken, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen; want zij zijn opstandig. Doch u, mensenkind, hoor wat Ik tot u spreek; wees u niet opstandig, zoals dat opstandige huis; open uw mond, en eet, wat Ik u geef.", "1 Joh 5:10": "Wie in de Zoon van God gelooft, heeft het getuigenis in zichzelf; wie God niet gelooft, heeft Hem tot een leugenaar gemaakt, omdat hij niet geloofd heeft het getuigenis dat God getuigd heeft van Zijn Zoon.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Hand 23:17": "En Paulus riep een van de hoofdmannen over honderd bij zich en zei: Breng deze jongeman naar de aanvoerder, want hij heeft hem iets mee te delen.", "Dan 12:10": "Velen zullen gereinigd, wit gemaakt en gelouterd worden; maar de goddelozen zullen goddeloos handelen, en geen van de goddelozen zal het begrijpen, maar de verstandigen zullen het begrijpen.", "Rom 1:5": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam;", "Luk 17:25": "Maar eerst moet Hij veel lijden, en verworpen worden door dit geslacht.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "Deut 22:18": "Dan zullen de oudsten van die stad die man meenemen en hem straffen;", "Joh 3:11": "Voorwaar, voorwaar, Ik zeg u: Wij spreken wat Wij weten, en getuigen wat Wij gezien hebben; en u neemt Ons getuigenis niet aan.", "Joh 16:23": "En op die dag zult u Mij niets vragen. Voorwaar, voorwaar, Ik zeg u: alles wat u de Vader zult bidden in Mijn Naam, zal Hij u geven.", "Rom 6:4": "Wij zijn dan met Hem begraven door de doop in de dood, opdat, zoals Christus uit de doden opgewekt is tot de heerlijkheid van de Vader, zo ook wij in nieuwheid van leven zouden wandelen.", "Hand 3:1": "Petrus en Johannes gingen samen op naar de tempel, omtrent het uur van het gebed, het negende uur.", "1 Tim 1:4": "Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "Ef 4:11": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars;", "Jes 62:7": "En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.", "Jes 27:13": "En het zal op die dag gebeuren, dat er met een grote bazuin geblazen zal worden; dan zullen zij komen die verloren dreigden te gaan in het land van Assur, en de weggejaagden in het land van Egypte; en zij zullen de HEERE aanbidden op de heilige berg te Jeruzalem.", "Joh 6:66": "Van toen af gingen velen van Zijn discipelen terug, en liepen niet meer met Hem mee.", "Matt 22:2-13": "Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had; En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen. Opnieuw zond hij andere dienstknechten uit, en zei: Zeg tegen de genode gasten: Zie, ik heb mijn middagmaal bereid; mijn ossen en het gemeste vee zijn geslacht, en alles is gereed; kom naar de bruiloft.", "Luk 12:11": "En wanneer zij u zullen brengen voor de synagogen, en voor de overheden en de machten, wees dan niet bezorgd hoe of wat u ter verantwoording zult zeggen, of wat u zult spreken;", "Ex 3:4": "Toen de HEERE zag dat hij zich daarheen wendde om te kijken, riep God tot hem uit het midden van het braambos, en zei: Mozes, Mozes! En hij zei: Zie, hier ben ik!", "Hand 25:10": "En Paulus zei: Ik sta voor de rechterstoel van de keizer, waar ik geoordeeld moet worden; de Joden heb ik geen onrecht gedaan, zoals u ook zeer goed weet.", "Joh 3:7": "Verwonder u niet dat Ik u gezegd heb: U moet opnieuw geboren worden.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Matt 22:14": "Want velen zijn geroepen, maar weinigen uitverkoren.", "Gal 5:11": "Maar ik, broeders! Als ik nog de besnijdenis predik, waarom word ik dan nog vervolgd? Dan is de ergernis van het kruis verdwenen.", "1 Kor 12:26": "En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.", "Joh 4:1": "Toen de Heere dan begreep dat de Farizeeën gehoord hadden dat Jezus meer discipelen maakte en doopte dan Johannes,", "Hand 19:5": "En die dit hoorden, werden gedoopt in de Naam van de Heere Jezus.", "2 Kor 6:8": "door eer en oneer, door kwaad gerucht en goed gerucht; als verleiders, en toch waarachtig;", "Matt 27:54": "En de hoofdman over honderd, en zij die met hem Jezus bewaakten, zagen de aardbeving en de dingen die gebeurd waren, en werden zeer bevreesd, en zeiden: Waarlijk, Deze was Gods Zoon!", "Hand 23:28": "En omdat ik de zaak wilde weten waarover zij hem beschuldigden, bracht ik hem voor hun raad.", "Jes 19:20": "En het zal zijn tot een teken, en tot een getuigenis voor de HEERE van de heerscharen in Egypteland, want zij zullen tot de HEERE roepen vanwege de verdrukkers, en Hij zal hun een Heiland en Meester zenden, Die hen zal verlossen.", "1 Joh 2:23": "Ieder, die de Zoon loochent, heeft ook de Vader niet; wie de Zoon belijdt, heeft ook de Vader.", "Matt 21:33-41": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland. Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen. En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde.", "1 Joh 3:22": "en wat wij ook bidden, ontvangen wij van Hem, omdat wij Zijn geboden bewaren en doen wat welgevallig is voor Hem.", "Matt 23:34": "Daarom, zie, Ik zend tot u profeten, en wijzen, en schriftgeleerden, en van hen zult u sommigen doden en kruisigen, en sommigen van hen zult u geselen in uw synagogen, en vervolgen van stad tot stad;", "Rom 10:12": "Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Tit 1:1": "Paulus, een dienstknecht van God, en een apostel van Jezus Christus, naar het geloof van de uitverkorenen van God, en de kennis van de waarheid die naar de godzaligheid is;", "1 Kor 15:29": "Anders, wat zullen zij doen die voor de doden gedoopt worden, als de doden helemaal niet opgewekt worden? Waarom worden zij dan voor de doden gedoopt?", "Gal 1:10": "Want predik ik nu de mensen, of God? Of zoek ik mensen te behagen? Want als ik nog mensen behaagde, zou ik geen dienstknecht van Christus zijn.", "Hand 23:1": "En Paulus keek de raad recht aan en zei: Mannen broeders! Ik heb met een geheel goed geweten voor God geleefd tot op deze dag.", "Hand 7:54-60": "Toen zij dit hoorden, brak dit hun harten, en zij knersten met de tanden tegen hem. Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God. En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Spr 5:13": "En heb niet geluisterd naar de stem van mijn onderwijzers, mijn oren niet geneigd tot mijn leraars!", "Gal 1:12": "Want ik heb het ook niet van een mens ontvangen, ook niet geleerd, maar door de openbaring van Jezus Christus.", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Deut 4:7": "Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Hand 16:30": "En hij bracht hen naar buiten en zei: Beste heren, wat moet ik doen om zalig te worden?", "Luk 10:16": "Wie naar u luistert, luistert naar Mij; en wie u verwerpt, verwerpt Mij; en wie Mij verwerpt, verwerpt Hem die Mij gezonden heeft.", "Hand 7:58": "en wierpen hem de stad uit, en stenigden hem; en de getuigen legden hun kleren af aan de voeten van een jongeman, die Saulus heette.", "Hand 21:27-33": "Toen nu de zeven dagen bijna voleindigd waren, zagen de Joden uit Azië hem in de tempel, en brachten al het volk in opschudding, en sloegen de handen aan hem, En riepen: Israëlitische mannen, kom te hulp! Dit is de man die overal iedereen leert tegen het volk, en de wet, en deze plaats; en bovendien heeft hij ook Grieken de tempel binnengebracht, en heeft deze heilige plaats ontheiligd. Want zij hadden eerder Trofimus, de Efeziër, met hem in de stad gezien, van wie zij dachten dat Paulus hem de tempel had binnengebracht.", "Joh 5:40": "En u wilt niet tot Mij komen, opdat u het leven zou hebben.", "Hand 21:36": "Want de menigte van het volk volgde, terwijl zij riepen: Weg met hem!", "Ezech 6:11": "Zo zegt de Heere HEERE: Sla met uw hand, en stamp met uw voet, en zeg: Ach, over alle gruwelen van de slechte daden van het huis van Israël; want zij zullen door het zwaard, door de honger en door de pest vallen.", "Hand 26:16": "Maar richt u op en sta op uw voeten; want hiertoe ben Ik u verschenen, om u aan te stellen tot een dienaar en getuige, zowel van de dingen die u gezien hebt als van de dingen waarin Ik u nog zal verschijnen;", "Hand 3:6": "En Petrus zei: Zilver en goud heb ik niet, maar wat ik heb, dat geef ik u: in de Naam van Jezus Christus de Nazarener, sta op en loop!", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "Job 8:6": "als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "Job 22:27": "U zult ernstig tot Hem bidden, en Hij zal u verhoren; en u zult uw geloften betalen.", "Hand 21:33-40": "Toen kwam de leider dichterbij en greep hem, en beval dat men hem met twee ketenen zou binden; en hij vroeg wie hij was en wat hij gedaan had. En in de menigte riep de één dit, de ander wat anders. En omdat hij vanwege de opschudding niets met zekerheid kon te weten komen, beval hij dat men hem naar de legerplaats zou brengen. En toen hij bij de trappen gekomen was, gebeurde het dat hij door de soldaten gedragen werd, vanwege het geweld van de menigte.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Joh 16:8": "En als Hij gekomen is, zal Hij de wereld overtuigen van zonde, en van gerechtigheid, en van oordeel:", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Hand 16:37": "Maar Paulus zei tegen hen: Zij hebben ons, die Romeinen zijn, zonder vonnis in het openbaar gegeseld en in de gevangenis geworpen, en werpen zij ons er nu heimelijk uit? Nee, zeker niet; maar laat zij zelf komen en ons naar buiten leiden.", "Hebr 4:11": "Laat ons ons dan beijveren om die rust in te gaan, opdat niemand in hetzelfde voorbeeld van ongehoorzaamheid valt.", "Ezech 3:6": "Niet tot veel volken, diep van spraak en zwaar van tong, van wie u de woorden niet kunt verstaan; zouden zij niet, als Ik u tot hen gezonden had, naar u geluisterd hebben?", "Jak 1:6": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "Tit 3:6": "Die Hij over ons rijkelijk heeft uitgegoten door Jezus Christus, onze Zaligmaker;", "Hand 6:4": "Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "Matt 25:45": "Dan zal Hij hun antwoorden: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze minsten niet gedaan hebt, hebt u het Mij ook niet gedaan.", "1 Tim 1:11": "Naar het Evangelie van de heerlijkheid van de zalige God, dat aan mij toevertrouwd is.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "Ps 118:22": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.", "Hand 21:32": "Deze nam meteen soldaten en hoofdmannen over honderd mee, en snelde naar hen toe. Toen zij nu de leider en de soldaten zagen, hielden zij op Paulus te slaan.", "Rom 1:15": "Zo ben ik, voor zover het aan mij ligt, gereed om ook aan u die in Rome bent het Evangelie te verkondigen.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Hand 13:2": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.", "Hebr 12:25": "Zie erop toe dat u Hem, Die spreekt, niet verwerpt; want als dezen niet ontkomen zijn, die hem verwierpen die op aarde Goddelijke antwoorden gaf, hoeveel te meer zullen wij niet ontkomen, als wij ons afkeren van Hem Die van de hemelen is;", "Deut 25:2": "En het zal gebeuren, als de onrechtvaardige slagen verdiend heeft, dat de rechter hem zal laten neervallen, en hem in zijn tegenwoordigheid laten slaan, naar het aantal dat past bij zijn onrechtvaardigheid.", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "Hand 26:9-15": "Ik meende inderdaad bij mijzelf dat ik tegen de Naam van Jezus van Nazareth veel dingen moest doen die ertegen ingingen. Dat heb ik ook gedaan in Jeruzalem, en ik heb velen van de heiligen in de gevangenissen gesloten, nadat ik de macht van de overpriesters ontvangen had; en toen zij omgebracht werden, stemde ik ermee in. En door alle synagogen heen heb ik hen dikwijls gestraft en gedwongen te lasteren; en boven mate tegen hen woedend heb ik hen vervolgd, ook tot in de buitenlandse steden.", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "Hand 14:6-20": "zijn zij, toen zij dit door hadden, gevlucht naar de steden van Lykaonië, namelijk Lystre en Derbe, en het omliggende land; en zij verkondigden daar het Evangelie. En een zeker man te Lystre zat zonder kracht in zijn voeten, kreupel van de moederschoot af, die nooit had gelopen.", "Luk 2:25": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem.", "Openb 1:10": "En ik was in de geest op de dag des Heeren; en ik hoorde achter mij een luide stem, als van een bazuin,", "Jak 1:5-7": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden. Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt. Want laat die mens niet menen dat hij iets ontvangen zal van de Heere.", "Amos 5:4-6": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef. Maar zoek Beth-el niet, en kom niet naar Gilgal, en trek niet over naar Ber-seba; want Gilgal zal zeker in gevangenschap weggevoerd worden, en Beth-el zal tot niets worden. Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Hand 13:17": "De God van dit volk Israël heeft onze vaderen uitverkoren, en het volk verhoogd, toen zij als vreemdelingen in het land Egypte woonden, en heeft hen met een sterke arm daaruit geleid.", "Ex 33:17-20": "Toen zei de HEERE tegen Mozes: Ook deze zaak, die u gesproken hebt, zal Ik doen, omdat u genade gevonden hebt in Mijn ogen, en Ik u bij naam ken. Toen zei hij: Toon mij nu Uw heerlijkheid! Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Ps 78:70-72": "En Hij verkoos Zijn knecht David, en nam hem van de schaapskooien; Van achter de zogende schapen liet Hij hem komen, om Jakob te weiden, Zijn volk, en Israël, Zijn erfenis. Ook heeft hij hen geweid naar de oprechtheid van zijn hart, en heeft hen geleid met een zeer verstandig beleid van zijn handen.", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "Hand 10:33": "Zo heb ik dan meteen naar u gezonden, en u hebt er goed aan gedaan hier te komen. Wij zijn dan nu allen hier aanwezig voor God, om te horen alles wat u door God bevolen is.", "Hand 3:13": "De God van Abraham, en van Izak, en van Jakob, de God van onze vaderen, heeft Zijn Kind Jezus verheerlijkt, Die u hebt overgeleverd en verloochend voor het aangezicht van Pilatus, toen die oordeelde dat men Hem zou loslaten.", "Zach 7:3": "door te zeggen tegen de priesters die in het huis van de HEERE van de heerscharen waren, en tegen de profeten: Moet ik wenen in de vijfde maand, doordat ik mij afzonder, zoals ik nu al zoveel jaren gedaan heb?", "Hand 21:39": "Maar Paulus zei: Ik ben een Joodse man uit Tarsus, burger van een niet onaanzienlijke stad in Cilicië; ik bid u, laat mij toe om tegen het volk te spreken.", "Luk 9:48": "en zei tegen hen: Wie dit kind ontvangt in Mijn Naam, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem Die Mij gezonden heeft. Want wie de minste is onder u allen, die zal groot zijn.", "Richt 21:25": "In die dagen was er geen koning in Israël; ieder deed wat recht was in zijn eigen ogen.", "Mark 11:25": "En wanneer u staat om te bidden, vergeef als u iets tegen iemand hebt; opdat ook uw Vader, Die in de hemelen is, u uw overtredingen vergeeft.", "Hand 22:22-24": "Zij luisterden naar hem tot dit woord toe; en toen verhieven zij hun stem en zeiden: Weg van de aarde met zo iemand, want het is niet behoorlijk dat hij leeft. En terwijl zij riepen, hun kleren van zich afwierpen en stof de lucht in gooiden, beval de leider hen hem naar de legerplaats te brengen, en zei dat men hem met geselen zou ondervragen, opdat hij te weten kon komen om welke reden zij zo tegen hem riepen.", "Ef 2:12": "dat u in die tijd was zonder Christus, vervreemd van het burgerschap van Israël, en vreemdelingen van de verbonden van de belofte, geen hoop hebbend, en zonder God in de wereld.", "Matt 2:23": "En daar aangekomen, vestigde hij zich in de stad die Nazareth heet; opdat vervuld zou worden wat door de profeten gezegd is, dat Hij Nazarener genoemd zal worden.", "Matt 18:5": "En wie zo'n kind ontvangt in Mijn Naam, die ontvangt Mij.", "1 Tim 6:3": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Jes 43:22-26": "Doch u hebt Mij niet aangeroepen, o Jakob! toen u zich tegen Mij vermoeid hebt, o Israël! Mij hebt u niet gebracht het kleinvee van uw brandoffers, en met uw slachtoffers hebt u Mij niet geëerd; Ik heb u Mij niet doen dienen met spijsoffer, en Ik heb u niet vermoeid met wierook. Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Joël 2:19": "En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen.", "Hand 27:31": "zei Paulus tegen de hoofdman en tegen de soldaten: Als dezen niet in het schip blijven, kunt u niet gered worden.", "Mark 1:17-20": "En Jezus zei tegen hen: Volg Mij, en Ik zal maken dat u vissers van mensen wordt. En zij verlieten meteen hun netten en volgden Hem. En van daar iets verder gegaan, zag Hij Jakobus, de zoon van Zebedeüs, en Johannes, zijn broer, en hen in het schip terwijl zij hun netten in orde maakten.", "Jer 29:12": "Dan zult u Mij aanroepen, en heengaan, en tot Mij bidden; en Ik zal naar u horen.", "Hand 27:1": "En toen het besloten was dat wij naar Italië zouden afvaren, leverden zij Paulus en enige andere gevangenen over aan een hoofdman over honderd, met de naam Julius, van de keizerlijke bende.", "Joh 15:7": "Als u in Mij blijft, en Mijn woorden in u blijven, dan zult u vragen wat u wilt, en het zal u gebeuren.", "2 Kor 1:8-10": "Want wij willen niet, broeders, dat u onwetend bent van onze verdrukking, die ons in Azië overkomen is: dat wij uitzonderlijk zwaar belast zijn geweest, boven ons vermogen, zodat wij zeer in twijfel waren, ook aan het leven. Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt; Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Rom 11:5": "Zo is er dan ook in deze tegenwoordige tijd een overblijfsel geworden, naar de verkiezing van de genade.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Hand 22:14-21": "En hij zei: De God van onze vaderen heeft u van tevoren bestemd om Zijn wil te kennen, en de Rechtvaardige te zien, en de stem uit Zijn mond te horen. Want u zult Hem getuige zijn bij alle mensen, van wat u gezien en gehoord hebt. En nu, waarom wacht u nog? Sta op, laat u dopen en uw zonden afwassen, terwijl u de Naam van de Heere aanroept.", "Joh 3:1": "En er was een mens uit de Farizeeën, wiens naam Nicodemus was, een leider van de Joden;", "Hand 27:42": "De soldaten hadden nu het plan om de gevangenen te doden, opdat niemand zou wegzwemmen en ontsnappen.", "Deut 31:9-13": "En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël. En Mozes gebood hun: Aan het einde van elke zeven jaar, op de vastgestelde tijd van het jaar van de vrijlating, op het feest van de loofhutten, wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen;", "Lev 10:8-11": "En de HEERE sprak tegen Aäron: Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties; En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "Hand 28:16": "En toen wij in Rome gekomen waren, droeg de hoofdman de gevangenen over aan de aanvoerder van de wacht; maar aan Paulus werd toegestaan op zichzelf te wonen, met de soldaat die hem bewaakte.", "Hand 9:21": "En allen die het hoorden, waren verbaasd en zeiden: Is dit niet degene die in Jeruzalem verwoestte wie deze Naam aanriepen, en die daarom hierheen gekomen is, opdat hij hen gebonden zou brengen naar de overpriesters?", "2 Kor 11:32": "De stadhouder van koning Aretas bezette in Damaskus de stad van de Damaskenen, met de bedoeling mij te vangen;", "Gal 6:17": "Verder, laat niemand mij moeite aandoen; want ik draag de littekenen van de Heere Jezus in mijn lichaam.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Hand 26:20": "Maar heb eerst aan hen die te Damaskus waren, en te Jeruzalem, en in het gehele land Judea, en aan de heidenen verkondigd dat zij zich zouden bekeren en zich tot God bekeren, en werken zouden doen die de bekering waardig zijn.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Hand 26:1": "En Agrippa zei tegen Paulus: Het is u toegestaan voor uzelf te spreken. Toen strekte Paulus de hand uit en verantwoordde zich aldus:", "Ps 143:8-10": "Doe mij Uw goedertierenheid in de morgenstond horen, want ik vertrouw op U; maak mij de weg bekend die ik moet gaan, want ik hef mijn ziel tot U op. Red mij, HEERE, van mijn vijanden; bij U schuil ik. Leer mij Uw welbehagen doen, want Gij zijt mijn God; Uw goede Geest leidt mij in een effen land.", "2 Kor 10:8": "Want al zou ik nog wat overvloediger roemen over onze macht, die de Heere ons gegeven heeft tot opbouw, en niet tot uw neerwerping, dan zal ik daarover niet beschaamd worden;", "Spr 15:29": "De HEERE is ver van de goddelozen; maar het gebed van de rechtvaardigen zal Hij verhoren.", "Hand 5:21": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen.", "Ps 78:1-8": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Ps 73:13": "Zeker heb ik tevergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Matt 27:19": "En terwijl hij op de rechterstoel zat, stuurde zijn vrouw iemand naar hem toe om te zeggen: Bemoei u toch niet met die Rechtvaardige, want ik heb vandaag in een droom veel geleden om Hem.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Zach 8:22": "Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Matt 17:19": "Toen kwamen de discipelen apart naar Jezus toe en zeiden: Waarom konden wij hem niet uitdrijven?", "2 Kron 12:1-4": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem. Daarom gebeurde het, in het vijfde jaar van koning Rehabeam, dat Sisak, de koning van Egypte, tegen Jeruzalem optrok (want zij hadden tegen de HEERE overtreden), met duizend tweehonderd wagens, en met zestigduizend ruiters; en van het volk dat met hem uit Egypte kwam was geen getal: Libiërs, Sukkieten en Cusjieten.", "Hand 8:3": "En Saulus verwoestte de Gemeente, ging de huizen binnen, en sleepte mannen en vrouwen weg en leverde hen over aan de gevangenis.", "Deut 11:20": "En schrijf ze op de posten van uw huis, en aan uw poorten;", "Matt 16:19": "En Ik zal u de sleutels geven van het Koninkrijk der hemelen; en alles wat u zult binden op de aarde, zal in de hemelen gebonden zijn; en alles wat u zult ontbinden op de aarde, zal in de hemelen ontbonden zijn.", "1 Kon 18:10": "Zo waarachtig als de HEERE, uw God, leeft: er is geen volk of koninkrijk waar mijn heer niet naartoe gezonden heeft om u te zoeken; en als zij zeiden: Hij is hier niet, liet hij dat koninkrijk en dat volk zweren dat zij u niet hadden gevonden.", "Job 12:4": "Ik ben degene die zijn vriend een spot is, maar die tot God roept, Die hem verhoort; de rechtvaardige en oprechte is een spot.", "Ps 18:4": "Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Hand 9:3-22": "En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel; en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij? En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "Joh 5:30": "Ik kan van Mijzelf niets doen. Zoals Ik hoor, oordeel Ik, en Mijn oordeel is rechtvaardig; want Ik zoek niet Mijn eigen wil, maar de wil van de Vader, Die Mij gezonden heeft.", "Rom 9:3": "Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "Matt 24:41": "Er zullen twee vrouwen malen bij de molen: de één zal aangenomen worden, en de ander zal achtergelaten worden.", "Hand 22:12-15": "En een zekere Ananias, een godvruchtig man naar de wet, die goede getuigenis had van al de Joden die daar woonden, kwam naar mij toe, en bij mij staande zei hij tegen mij: Saul, broeder, word weer ziende! En op datzelfde moment kon ik hem weer zien. En hij zei: De God van onze vaderen heeft u van tevoren bestemd om Zijn wil te kennen, en de Rechtvaardige te zien, en de stem uit Zijn mond te horen.", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "2 Petr 1:12-16": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt. En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken; Want ik weet dat het afleggen van mijn tent spoedig zal zijn, zoals ook onze Heere Jezus Christus mij heeft geopenbaard.", "Gal 1:1": "Paulus, een apostel, geroepen niet vanuit mensen, ook niet door een mens, maar door Jezus Christus, en God de Vader, Die Hem uit de doden heeft opgewekt,", "Luk 20:9-18": "En Hij begon tegen het volk deze gelijkenis te vertellen: Een zeker mens plantte een wijngaard, en verhuurde die aan landbouwers, en ging voor lange tijd naar het buitenland. En toen het de tijd was, stuurde hij een dienstknecht naar de landbouwers, opdat zij hem van de vrucht van de wijngaard zouden geven; maar de landbouwers sloegen hem, en stuurden hem met lege handen weg. En opnieuw stuurde hij nog een andere dienstknecht; maar ook die sloegen zij en behandelden hem schandelijk, en stuurden hem met lege handen weg.", "Matt 4:18-22": "En Jezus liep langs de zee van Galilea en zag twee broers, namelijk Simon, genaamd Petrus, en Andreas, zijn broer, die een net in de zee wierpen (want zij waren vissers); en Hij zei tegen hen: Volg Mij, en Ik zal u vissers van mensen maken. Zij lieten meteen de netten achter en volgden Hem na.", "Rom 3:3": "Want wat is het, al zijn sommigen ongelovig geweest? Zal hun ongeloof het geloof van God tenietdoen?", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Joël 1:3": "Vertel uw kinderen daarvan, en laat het uw kinderen hun kinderen vertellen, en van die kinderen aan een ander geslacht.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "1 Joh 5:12": "Wie de Zoon heeft, die heeft het leven; wie de Zoon van God niet heeft, die heeft het leven niet.", "Hand 23:31-33": "De soldaten dan namen Paulus mee, zoals hun bevolen was, en brachten hem 's nachts naar Antipatris. En de volgende dag lieten zij de ruiters met hem verder trekken, en keerden zelf terug naar de legerplaats. Toen dezen in Caesarea gekomen waren en de brief aan de stadhouder overhandigd hadden, hebben zij ook Paulus voor hem gebracht.", "Ef 1:4": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde;", "Ef 1:5": "Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil.", "Luk 23:16": "Ik zal Hem dan kastijden en loslaten.", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "Hand 18:5": "En toen Silas en Timotheüs uit Macedonië gekomen waren, werd Paulus door de Geest gedrongen en betuigde hij de Joden dat Jezus de Christus is.", "Luk 18:10": "Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar.", "Matt 10:27": "Wat Ik u zeg in het duister, zegt dat in het licht; en wat u hoort in het oor, predikt dat op de daken.", "Joh 5:43": "Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.", "Num 20:13": "Dit zijn de wateren van Meriba, waar de kinderen van Israël met de HEERE getwist hebben; en Hij werd aan hen geheiligd.", "Hand 23:27": "Deze man was door de Joden gegrepen en zou door hen gedood zijn, toen ik erbij kwam met het krijgsvolk en hem uit hun handen redde, nadat ik vernomen had dat hij een Romein is.", "Hand 7:2": "En hij zei: Mannen, broeders en vaders, luister: de God van de heerlijkheid verscheen aan onze vader Abraham, toen hij nog in Mesopotamië was, voordat hij in Haran woonde,", "1 Kor 4:2": "En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt.", "Hand 22:4-19": "Ik heb deze weg vervolgd tot de dood toe, mannen en vrouwen bindend en overleverend in de gevangenissen. Zoals ook de hogepriester mij getuige is, en de gehele raad van oudsten; van hen heb ik ook brieven meegekregen naar de broeders, en ben naar Damaskus gereisd om ook hen die daar waren, gebonden naar Jeruzalem te brengen, opdat zij gestraft zouden worden. Maar het gebeurde mij, toen ik reisde en Damaskus naderde, omtrent de middag, dat er snel uit de hemel een groot licht mij rondom omscheen.", "Rom 8:35-37": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Openb 7:14": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam.", "Luk 18:1-8": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven, en Hij zei: Er was een zekere rechter in een stad, die God niet vreesde en geen mens ontzag. En er was een zekere weduwe in dezelfde stad, en zij kwam naar hem toe en zei: Doe mij recht tegenover mijn tegenpartij.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Hand 4:28": "Om te doen alles wat Uw hand en Uw raad van tevoren bepaald hadden dat zou gebeuren.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Hand 26:12": "Waarover ik ook, toen ik naar Damaskus reisde, met macht en opdracht die ik van de overpriesters had,", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "2 Tim 4:5": "Maar u, wees waakzaam in alles, verdraag verdrukkingen, doe het werk van een evangelist, vervul uw dienst ten volle.", "1 Kor 10:2": "en zij zijn allen in Mozes gedoopt in de wolk en in de zee;", "Hand 9:29": "en hij sprak vrijmoedig in de Naam van de Heere Jezus, en hij sprak ook en redetwistte met de Griekssprekende Joden; maar dezen probeerden hem te doden.", "1 Kor 4:9": "Want ik denk dat God ons, de laatste apostelen, ten toon heeft gesteld als tot de dood veroordeeld; want wij zijn een schouwspel geworden voor de wereld, en voor de engelen, en voor de mensen.", "Joh 8:52": "De Joden zeiden dan tegen Hem: Nu weten wij dat U de duivel hebt. Abraham is gestorven, en de profeten ook; en U zegt: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet proeven?", "Rom 8:28-30": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn. Want die Hij van tevoren gekend heeft, die heeft Hij ook van tevoren bestemd om gelijkvormig te zijn aan het beeld van Zijn Zoon, opdat Hij de Eerstgeborene zou zijn onder veel broeders. En die Hij van tevoren bestemd heeft, die heeft Hij ook geroepen; en die Hij geroepen heeft, die heeft Hij ook gerechtvaardigd; en die Hij gerechtvaardigd heeft, die heeft Hij ook verheerlijkt.", "2 Kor 4:1": "Omdat wij deze bediening hebben, naar de barmhartigheid die ons is bewezen, zo worden wij niet moedeloos;", "1 Kor 1:26-29": "Want u ziet uw roeping, broeders, dat u niet veel wijzen bent naar het vlees, niet veel machtigen, niet veel edelen. Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen; En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken;", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 135:4": "Want de HEERE heeft Zich Jakob verkoren, Israël tot Zijn eigendom.", "Luk 19:21": "want ik was bang voor u, omdat u een streng mens bent; u neemt weg wat u niet gelegd hebt, en u oogst wat u niet gezaaid hebt.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Joh 18:15-27": "En Simon Petrus volgde Jezus, en ook een andere discipel. Deze discipel nu was bekend bij de hogepriester en ging met Jezus mee naar binnen, in het paleis van de hogepriester. En Petrus stond buiten bij de deur. De andere discipel dan, die bekend was bij de hogepriester, ging naar buiten en sprak met de deurwachtster, en bracht Petrus naar binnen. De dienstmaagd dan, die de deurwachtster was, zei tegen Petrus: Bent u ook niet een van de discipelen van deze Mens? Hij zei: Ik ben het niet.", "Joh 10:38": "maar als Ik ze doe, en u Mij niet gelooft, geloof dan de werken; opdat u mag weten en geloven dat de Vader in Mij is, en Ik in Hem.", "Hand 9:6": "En hij, bevend en verbaasd, zei: Heere, wat wilt U dat ik doen zal? En de Heere zei tegen hem: Sta op, en ga de stad in, en daar zal u gezegd worden wat u doen moet.", "2 Petr 2:1": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen;", "Joh 8:9": "Maar zij, dit horend, en door hun geweten overtuigd, gingen weg, de een na de ander, te beginnen bij de oudsten tot de laatsten toe; en Jezus bleef alleen achter, met de vrouw die in het midden stond.", "Joh 9:24": "Zij riepen dan voor de tweede maal de man die blind geweest was, en zeiden tegen hem: Geef God de eer; wij weten dat deze Mens een zondaar is.", "Mark 10:43-45": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die zal uw dienaar zijn. En wie van u de eerste wil worden, die zal ieders dienstknecht zijn. Want ook de Zoon des mensen is niet gekomen om gediend te worden, maar om te dienen, en Zijn leven te geven als losprijs voor velen.", "Hand 24:14": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is;", "2 Kor 5:18-20": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft. Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd. Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Luk 22:31-34": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe; maar Ik heb voor u gebeden, dat uw geloof niet ophoudt; en u, als u eens bekeerd bent, versterk dan uw broeders. En hij zei tegen Hem: Heere, ik ben bereid, met U ook in de gevangenis en in de dood te gaan.", "Ps 78:32": "Boven dit alles zondigden zij nog, en geloofden niet, ondanks Zijn wonderen.", "2 Tim 3:11": "mijn vervolgingen, mijn lijden, zoals mij overkomen is in Antiochië, in Ikonium en in Lystre; wat voor vervolgingen ik geleden heb, en de Heere heeft mij uit alle verlost.", "1 Kor 15:8": "En ten laatste van allen is Hij ook door mij gezien, als door iemand die ontijdig geboren is.", "Hand 10:39-41": "En wij zijn getuigen van alles wat Hij gedaan heeft, zowel in het Joodse land als in Jeruzalem; Die zij gedood hebben door Hem aan het hout te hangen. Deze heeft God opgewekt op de derde dag, en gegeven dat Hij openbaar zou worden; niet aan al het volk, maar aan de getuigen die door God van tevoren uitgekozen waren, namelijk aan ons, die met Hem gegeten en gedronken hebben, nadat Hij uit de doden opgestaan was.", "Matt 8:34": "En zie, de hele stad ging Jezus tegemoet; en toen zij Hem zagen, smeekten zij Hem dat Hij uit hun gebied zou vertrekken.", "Deut 31:13": "En opdat hun kinderen, die het niet geweten hebben, horen en leren, om de HEERE, uw God, te vrezen, alle dagen dat u leeft op het land waarheen u de Jordaan overtrekt om het te erven.", "Hand 23:10": "En toen er grote tweedracht ontstond, gaf de aanvoerder, uit vrees dat Paulus door hen verscheurd zou worden, bevel dat het krijgsvolk zou afdalen en hem uit hun midden zou wegrukken en naar de legerplaats brengen.", "Hand 16:11-40": "Van Troas dan vertrokken, voeren wij recht naar Samothrace, en de volgende dag naar Neapolis. En van daar naar Filippi, wat de eerste stad is van dit deel van Macedonië, een kolonie. En wij bleven in die stad enkele dagen. En op de dag van de sabbat gingen wij de stad uit, naar de rivier, waar men gewoonlijk bad; en wij gingen zitten en spraken tot de vrouwen die daar samengekomen waren.", "Hand 9:15": "Maar de Heere zei tegen hem: Ga heen; want deze man is Mij een uitverkoren instrument om Mijn Naam te dragen voor de heidenen, en de koningen, en de kinderen van Israël.", "Gal 4:2": "maar hij staat onder voogden en verzorgers, tot de tijd die de vader van tevoren heeft vastgesteld.", "Rom 8:33": "Wie zal een beschuldiging inbrengen tegen de uitverkorenen van God? God is het Die rechtvaardigt.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Luk 24:36-45": "En terwijl zij over deze dingen spraken, stond Jezus Zelf in hun midden, en zei tegen hen: Vrede zij u! En zij schrokken en werden zeer bevreesd, en meenden dat zij een geest zagen. En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart?", "Rom 10:3": "Want omdat zij de rechtvaardigheid van God niet kennen en hun eigen gerechtigheid proberen op te richten, hebben zij zich aan de rechtvaardigheid van God niet onderworpen.", "1 Kor 12:12": "Want zoals het lichaam één is en veel leden heeft, en al de leden van dit ene lichaam, hoewel het er veel zijn, toch één lichaam zijn, zo is het ook met Christus.", "1 Tim 5:7-11": "En beveel dit, opdat zij onberispelijk zijn. Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige. Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Mark 5:17": "En zij begonnen Hem te smeken dat Hij uit hun gebied zou weggaan.", "Joh 11:46-48": "Maar sommigen van hen gingen naar de Farizeeën, en vertelden hun wat Jezus gedaan had. De overpriesters dan en de Farizeeën riepen de raad bijeen, en zeiden: Wat zullen wij doen? want deze Mens doet veel tekenen. Als wij Hem zo laten begaan, zullen zij allen in Hem geloven, en de Romeinen zullen komen en zowel onze plaats als ons volk wegnemen.", "2 Tim 2:2-7": "en wat u van mij gehoord hebt onder veel getuigen, vertrouw dat toe aan trouwe mensen, die bekwaam zullen zijn om ook anderen te leren. Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus. Niemand die als soldaat dient, wikkelt zich in de zaken van het dagelijks leven, opdat hij hem kan behagen die hem tot soldaat heeft aangenomen.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Matt 9:9": "En toen Jezus vandaar verder ging, zag Hij een man in het tolhuis zitten, genaamd Mattheüs; en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Mark 4:24": "En Hij zei tegen hen: Let op wat u hoort. Met de maat waarmee u meet, zal u gemeten worden, en aan u die hoort, zal meer gegeven worden.", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Jes 49:4": "Doch Ik zei: Ik heb tevergeefs gearbeid, Ik heb Mijn kracht nutteloos en tevergeefs besteed; zeker, Mijn recht is bij de HEERE, en Mijn loon is bij Mijn God.", "Joh 7:12": "En er was veel gemurmel over Hem onder de menigten. Sommigen zeiden: Hij is goed; en anderen zeiden: Nee, maar Hij verleidt de menigte.", "2 Kor 11:24": "Van de Joden heb ik veertig slagen min één, vijfmaal ontvangen.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Gen 21:13": "Maar Ik zal ook de zoon van deze slavin tot een volk maken, omdat hij uw nageslacht is.", "1 Sam 12:22": "Want de HEERE zal Zijn volk niet verlaten, omwille van Zijn grote Naam, omdat het de HEERE behaagd heeft, u tot een volk voor Zichzelf te maken.", "2 Kon 19:14": "Toen Hizkia de brieven uit de hand van de boden ontvangen had en die gelezen had, ging hij op naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Hand 9:3-5": "En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel; en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij? En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "Hand 26:14": "En toen wij allen op de grond neergevallen waren, hoorde ik een stem tot mij spreken, die zei in de Hebreeuwse taal: Saul, Saul, waarom vervolgt u Mij? Het is u hard, tegen de prikkels de hielen te slaan.", "Luk 24:26": "Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?", "1 Kor 9:1": "Ben ik niet een apostel? Ben ik niet vrij? Heb ik niet Jezus Christus, onze Heere, gezien? Bent u niet mijn werk in de Heere?"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"G435\">Mannen</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"G80\">broeders</span> <span class=\"wl\" data-l=\"L3\" data-code=\"G2532\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"G3962\">vaders</span>, hoor <span class=\"wl\" data-l=\"L5\" data-code=\"G3450\">mijn</span> verdediging, <span class=\"wl\" data-l=\"L6\" data-code=\"G3568\">die</span> <span class=\"wl\" data-l=\"L6\" data-code=\"G3568\">ik</span> nu <span class=\"wl\" data-l=\"L6\" data-code=\"G3568\">tegenover</span> <span class=\"wl\" data-l=\"L7\" data-code=\"G5209\">u</span> <span class=\"wl\" data-l=\"L7\" data-code=\"G5209\">zal</span> uitspreken.", "2": "(Toen <span class=\"wl\" data-l=\"L1\" data-code=\"G1161\">zij</span> <span class=\"wl\" data-l=\"L2\" data-code=\"G191\">hoorden</span> <span class=\"wl\" data-l=\"L3\" data-code=\"G3754\">dat</span> <span class=\"wl\" data-l=\"L4\" data-code=\"G1446\">hij</span> <span class=\"wl\" data-l=\"L6\" data-code=\"G846\">hen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"G846\">in</span> <span class=\"wl\" data-l=\"L4\" data-code=\"G1446\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"G1446\">Hebreeuwse</span> <span class=\"wl\" data-l=\"L5\" data-code=\"G1258\">taal</span> <span class=\"wl\" data-l=\"L7\" data-code=\"G4377\">aansprak</span>, werden <span class=\"wl\" data-l=\"L8\" data-code=\"G3930\">zij</span> nog stiller. <span class=\"wl\" data-l=\"L9\" data-code=\"G2532\">En</span> <span class=\"wl\" data-l=\"L10\" data-code=\"G5346\">hij</span> zei:)", "3": "<span class=\"wl\" data-l=\"L1\" data-code=\"G1473\">Ik</span> <span class=\"wl\" data-l=\"L1\" data-code=\"G1473\">ben</span> <span class=\"wl\" data-l=\"L2\" data-code=\"G2453\">een</span> <s wl wl-kjv\" data-code=\"G4334\">came,</span> and <span class=\"wl wl-kjv\" data-code=\"G2036\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> <span class=\"wl wl-kjv\" data-code=\"G3004\">Tell</span> <span class=\"wl wl-kjv\" data-code=\"G3427\">me,</span> <span class=\"wl wl-kjv\" data-code=\"G1488\">art</span> <span class=\"wl wl-kjv\" data-code=\"G4771\">thou</span> a <span class=\"wl wl-kjv\" data-code=\"G4514\">Roman?</span> He <span class=\"wl wl-kjv\" data-code=\"G5346\">said,</span> Yea.", "28": "<span class=\"wl wl-kjv\" data-code=\"G5037\">And</span> the chief <span class=\"wl wl-kjv\" data-code=\"G5506\">captain</span> <span class=\"wl wl-kjv\" data-code=\"G611\">answered,</span> With a <span class=\"wl wl-kjv\" data-code=\"G4183\">great</span> <span class=\"wl wl-kjv\" data-code=\"G2774\">sum</span> <span class=\"wl wl-kjv\" data-code=\"G2932\">obtained</span> <span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> <span class=\"wl wl-kjv\" data-code=\"G5026\">this</span> <span class=\"wl wl-kjv\" data-code=\"G4174\">freedom.</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul</span> <span class=\"wl wl-kjv\" data-code=\"G5346\">said,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> <span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> was free born.", "29": "<span class=\"wl wl-kjv\" data-code=\"G3767\">Then</span> <span class=\"wl wl-kjv\" data-code=\"G2112\">straightway</span> they <span class=\"wl wl-kjv\" data-code=\"G868\">departed</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> <span class=\"wl wl-kjv\" data-code=\"G3195\">should</span> have <span class=\"wl wl-kjv\" data-code=\"G426\">examined</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him:</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">and</span> the chief <span class=\"wl wl-kjv\" data-code=\"G5506\">captain</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> was <span class=\"wl wl-kjv\" data-code=\"G5399\">afraid,</span> after he <span class=\"wl wl-kjv\" data-code=\"G1921\">knew</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> he <span class=\"wl wl-kjv\" data-code=\"G2076\">was</span> a <span class=\"wl wl-kjv\" data-code=\"G4514\">Roman,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">because</span> he <span class=\"wl wl-kjv\" data-code=\"G2258\">had</span> <span class=\"wl wl-kjv\" data-code=\"G1210\">bound</span> him.", "30": "On the <span class=\"wl wl-kjv\" data-code=\"G1887\">morrow,</span> because he <span class=\"wl wl-kjv\" data-code=\"G1014\">would</span> have <span class=\"wl wl-kjv\" data-code=\"G1097\">known</span> the <span class=\"wl wl-kjv\" data-code=\"G804\">certainty</span> <span class=\"wl wl-kjv\" data-code=\"G5101\">wherefore</span> he was <span class=\"wl wl-kjv\" data-code=\"G2723\">accused</span> <span class=\"wl wl-kjv\" data-code=\"G3844\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G2453\">Jews,</span> he <span class=\"wl wl-kjv\" data-code=\"G3089\">loosed</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> his <span class=\"wl wl-kjv\" data-code=\"G1199\">bands,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2753\">commanded</span> the chief <span class=\"wl wl-kjv\" data-code=\"G749\">priests</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3650\">all</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G4892\">council</span> to <span class=\"wl wl-kjv\" data-code=\"G2064\">appear,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span cl
