 raad van oudsten; van hen heb ik ook brieven meegekregen naar de broeders, en ben naar Damaskus gereisd om ook hen die daar waren, gebonden naar Jeruzalem te brengen, opdat zij gestraft zouden worden.","6":"Maar het gebeurde mij, toen ik reisde en Damaskus naderde, omtrent de middag, dat er snel uit de hemel een groot licht mij rondom omscheen.","7":"En ik viel op de grond, en ik hoorde een stem tegen mij zeggen: Saul, Saul, waarom vervolgt u Mij?","8":"En ik antwoordde: Wie bent U, Heere? En Hij zei tegen mij: Ik ben Jezus, de Nazarener, Die u vervolgt.","9":"En zij die met mij waren, zagen wel het licht, en werden zeer bevreesd; maar de stem van Hem Die tot mij sprak, hoorden zij niet.","10":"En ik zei: Heere! Wat zal ik doen? En de Heere zei tegen mij: Sta op en ga naar Damaskus; en daar zal met u gesproken worden over alles wat u opgedragen is te doen.","11":"En toen ik vanwege de heerlijkheid van dat licht niet kon zien, werd ik bij de hand geleid door hen die met mij waren, en kwam ik in Damaskus.","12":"En een zekere Ananias, een godvruchtig man naar de wet, die *goede* getuigenis had van al de Joden die daar woonden,","13":"kwam naar mij toe, en bij *mij* staande zei hij tegen mij: Saul, broeder, word weer ziende! En op datzelfde moment kon ik hem weer zien.","14":"En hij zei: De God van onze vaderen heeft u van tevoren bestemd om Zijn wil te kennen, en de Rechtvaardige te zien, en de stem uit Zijn mond te horen.","15":"Want u zult Hem getuige zijn bij alle mensen, van wat u gezien en gehoord hebt.","16":"En nu, waarom wacht u nog? Sta op, laat u dopen en uw zonden afwassen, terwijl u de Naam van de Heere aanroept.","17":"En het gebeurde mij, toen ik naar Jeruzalem was teruggekeerd en in de tempel bad, dat ik in een geestverrukking raakte,","18":"en dat ik Hem zag, en Hij tegen mij zei: Haast u, en ga snel uit Jeruzalem weg; want zij zullen uw getuigenis over Mij niet aannemen.","19":"En ik zei: Heere, zij weten dat ik hen die in U geloofden, in de gevangenis wierp en in de synagogen geselde;","20":"en toen het bloed van Stefanus, Uw getuige, vergoten werd, stond ik daar ook bij, en had er mede welbehagen in bij zijn dood, en bewaarde de kleren van hen die hem doodden.","21":"En Hij zei tegen mij: Ga heen; want Ik zal u ver weg zenden, naar de heidenen.","22":"Zij luisterden naar hem tot dit woord toe; en toen verhieven zij hun stem en zeiden: Weg van de aarde met zo iemand, want het is niet behoorlijk dat hij leeft.","23":"En terwijl zij riepen, hun kleren van zich afwierpen en stof de lucht in gooiden,","24":"beval de leider hen hem naar de legerplaats te brengen, en zei dat men hem met geselen zou ondervragen, opdat hij te weten kon komen om welke reden zij zo tegen hem riepen.","25":"En toen zij hem met de riemen vastbonden om hem te geselen, zei Paulus tegen de hoofdman over honderd die daar stond: Is het u geoorloofd een Romeins burger, en dat nog wel iemand die niet veroordeeld is, te geselen?","26":"Toen de hoofdman over honderd dat hoorde, ging hij naar de leider en meldde het hem, en zei: Kijk uit wat u doet, want deze man is een Romein.","27":"En de leider kwam naar hem toe en zei tegen hem: Zeg mij, bent u een Romein? En hij zei: Ja.","28":"En de leider antwoordde: Ik heb dit burgerrecht voor een grote som geld verkregen. En Paulus zei: Maar ik ben zelfs als burger geboren.","29":"Meteen dan trokken zij zich terug, zij die hem zouden ondervragen. En ook de leider werd bevreesd, toen hij begreep dat hij een Romein was, en dat hij hem had laten binden.","30":"En de volgende dag, omdat hij zeker wilde weten waarom hij door de Joden beschuldigd werd, maakte hij hem los van de boeien, en beval dat de overpriesters en hun hele raad zouden samenkomen; en hij bracht Paulus naar beneden en stelde hem voor hen."},"SV":{"1":"Mannen broeders en vaders, hoort mijn verantwoording, die ik tegenwoordig tot u *doen* *zal*.","2":"(Als zij nu hoorden, dat hij in de Hebreeuwse taal hen aansprak, hielden zij zich te meer stil. En hij zeide:)","3":"Ik ben een Joods man, en te Tarsen in Cilicië geboren, opgevoed in deze stad, aan de voeten van Gamaliël onderwezen naar de bescheidenste wijze der vaderlijke wet, zijnde een ijveraar Gods, gelijkerwijs gij allen heden zijt;","4":"Die dezen weg vervolgd heb tot den dood, bindende en in de gevangenissen overleverende beiden mannen en vrouwen.","5":"Gelijk mij ook de hogepriester getuige is, en de gehele raad der ouderlingen; van dewelke ik ook brieven genomen hebbende tot de broeders, ben naar Damaskus gereisd, om ook degenen, die daar waren, gebonden te brengen naar Jeruzalem, opdat zij gestraft zouden worden.","6":"Maar het geschiedde mij, als ik reisde, en Damaskus genaakte, omtrent den middag, dat snellijk uit den hemel een groot licht mij rondom omscheen.","7":"En ik viel ter aarde, en ik hoorde een stem, tot mij zeggende: Saul, Saul, wat vervolgt gij Mij?","8":"En ik antwoordde: Wie zijt Gij, Heere? En Hij zeide tot mij: Ik ben Jezus, de Nazarener, Welken gij vervolgt.","9":"En die met mij waren, zagen wel het licht, en werden zeer bevreesd; maar de stem Desgenen, Die tot mij sprak, hoorden zij niet.","10":"En ik zeide: Heere! wat zal ik doen? En de Heere zeide tot mij: Sta op, en ga heen naar Damaskus; en aldaar zal met u gesproken worden, van al hetgeen u geordineerd is te doen.","11":"En als ik vanwege de heerlijkheid deszelven lichts niet zag, zo werd ik bij de hand geleid van degenen, die met mij waren, en kwam te Damaskus.","12":"En een zekere Ananias, een godvruchtig man naar de wet, *goede* getuigenis hebbende van al de Joden, die *daar* woonden,","13":"Kwam tot mij, en bij *mij* staande, zeide tot mij: Saul, broeder, word weder ziende! En ter zelfder ure werd ik ziende op hem.","14":"En hij zeide: De God onzer vaderen heeft u te voren verordineerd, om Zijn wil te kennen, en den Rechtvaardige te zien, en de stem uit Zijn mond te horen.","15":"Want gij zult Hem getuige zijn bij alle mensen, van hetgeen gij gezien en gehoord hebt.","16":"En nu, wat vertoeft gij? Sta op, en laat u dopen, en uw zonden afwassen, aanroepende den Naam des Heeren.","17":"En het gebeurde mij, als ik te Jeruzalem wedergekeerd was, en in den tempel bad, dat ik in een vertrekking van zinnen was;","18":"En dat ik Hem zag, en Hij tot mij zeide: Spoed u, en ga in der haast uit Jeruzalem; want zij zullen uw getuigenis van Mij niet aannemen.","19":"En ik zeide: Heere, zij weten, dat ik in de gevangenis wierp, en in de synagogen geselde, die in U geloofden;","20":"En toen het bloed van Stefanus, Uw getuige, vergoten werd, *dat* ik daar ook bij stond, en mede een welbehagen had in zijn dood, en de klederen bewaarde dergenen, die hem doodden.","21":"En Hij zeide tot mij: Ga heen; want Ik zal u ver tot de heidenen afzenden.","22":"Zij hoorden hem nu tot dit woord toe; en zij verhieven hun stem, zeggende: Weg van de aarde met zulk een, want het is niet behoorlijk, dat hij leve.","23":"En als zij riepen, en de klederen van zich smeten, en stof in de lucht wierpen;","24":"Zo beval de overste, dat men hem in de legerplaats zou brengen, en zeide, dat men hem met geselen onderzoeken zou, opdat hij verstaan mocht, om wat oorzaak zij alzo over hem riepen.","25":"En alzo zij hem met de riemen uitrekten , zeide Paulus tot den hoofdman over honderd, die daar stond: Is het ulieden geoorloofd een Romeinsen mens, en *dien* onveroordeeld, te geselen?","26":"Als nu de hoofdman over honderd *dat* hoorde, ging hij toe, en boodschapte het den overste, zeggende: Zie, wat gij te doen hebt; want deze mens is een Romein.","27":"En de overste kwam toe, en zeide tot hem: Zeg mij, zijt gij een Romein? En hij zeide: Ja.","28":"En de overste antwoordde: Ik heb dit burgerrecht voor een grote som *gelds* verkregen. En Paulus zeide: Maar ik ben ook *een* *burger* geboren.","29":"Terstond dan lieten zij van hem af, die hem zouden onderzocht hebben. En de overste werd ook bevreesd, toen hij verstond, dat hij een Romein was, en dat hij hem had gebonden.","30":"En des anderen *daags*, willende de zekerheid weten, waarom hij van de Joden beschuldigd werd, maakte hij hem los van de banden, en beval, dat de overpriesters en hun gehele raad zouden komen; en Paulus afgebracht hebbende, stelde hij *hem* voor hen."},"KJV":{"1":"Men, brethren, and fathers, hear ye my defence *which I make* now unto you.","2":"(And when they heard that he spake in the Hebrew tongue to them, they kept the more silence: and he saith,)","3":"I am verily a man *which am* a Jew, born in Tarsus, *a city* in Cilicia, yet brought up in this city at the feet of Gamaliel, *and* taught according to the perfect manner of the law of the fathers, and was zealous toward God, as ye all are this day.","4":"And I persecuted this way unto the death, binding and delivering into prisons both men and women.","5":"As also the high priest doth bear me witness, and all the estate of the elders: from whom also I received letters unto the brethren, and went to Damascus, to bring them which were there bound unto Jerusalem, for to be punished.","6":"And it came to pass, that, as I made my journey, and was come nigh unto Damascus about noon, suddenly there shone from heaven a great light round about me.","7":"And I fell unto the ground, and heard a voice saying unto me, Saul, Saul, why persecutest thou me?","8":"And I answered, Who art thou, Lord? And he said unto me, I am Jesus of Nazareth, whom thou persecutest.","9":"And they that were with me saw indeed the light, and were afraid; but they heard not the voice of him that spake to me.","10":"And I said, What shall I do, Lord? And the Lord said unto me, Arise, and go into Damascus; and there it shall be told thee of all things which are appointed for thee to do.","11":"And when I could not see for the glory of that light, being led by the hand of them that were with me, I came into Damascus.","12":"And one Ananias, a devout man according to the law, having a good report of all the Jews which dwelt","13":"Came unto me, and stood, and said unto me, Brother Saul, receive thy sight. And the same hour I looked up upon him.","14":"And he said, The God of our fathers hath chosen thee, that thou shouldest know his will, and see that Just One, and shouldest hear the voice of his mouth.","15":"For thou shalt be his witness unto all men of what thou hast seen and heard.","16":"And now why tarriest thou? arise, and be baptized, and wash away thy sins, calling on the name of the Lord.","17":"And it came to pass, that, when I was come again to Jerusalem, even while I prayed in the temple, I was in a trance;","18":"And saw him saying unto me, Make haste, and get thee quickly out of Jerusalem: for they will not receive thy testimony concerning me.","19":"And I said, Lord, they know that I imprisoned and beat in every synagogue them that believed on thee:","20":"And when the blood of thy martyr Stephen was shed, I also was standing by, and consenting unto his death, and kept the raiment of them that slew him.","21":"And he said unto me, Depart: for I will send thee far hence unto the Gentiles.","22":"And they gave him audience unto this word, and *then* lifted up their voices, and said, Away with such a *fellow* from the earth: for it is not fit that he should live.","23":"And as they cried out, and cast off *their* clothes, and threw dust into the air,","24":"The chief captain commanded him to be brought into the castle, and bade that he should be examined by scourging; that he might know wherefore they cried so against him.","25":"And as they bound him with thongs, Paul said unto the centurion that stood by, Is it lawful for you to scourge a man that is a Roman, and uncondemned?","26":"When the centurion heard *that*, he went and told the chief captain, saying, Take heed what thou doest: for this man is a Roman.","27":"Then the chief captain came, and said unto him, Tell me, art thou a Roman? He said, Yea.","28":"And the chief captain answered, With a great sum obtained I this freedom. And Paul said, But I was *free* born.","29":"Then straightway they departed from him which should have examined him: and the chief captain also was afraid, after he knew that he was a Roman, and because he had bound him.","30":"On the morrow, because he would have known the certainty wherefore he was accused of the Jews, he loosed him from *his* bands, and commanded the chief priests and all their council to appear, and brought Paul down, and set him before them."}},"tsk":{"1":[{"kopje":"broeders","refs":["Hand 7:2","Hand 13:26","Hand 23:1","Hand 23:6","Hand 28:17"]},{"kopje":"mijn","refs":["Hand 19:33","Hand 24:10","Hand 25:8","Hand 25:16","Hand 26:1","Hand 26:2","Hand 26:24","Luk 12:11","Luk 21:14","Rom 2:15","1 Kor 9:3","2 Kor 7:11","2 Kor 12:19","Fil 1:7","Fil 1:17","2 Tim 4:16","1 Petr 3:15"]}],"2":[{"kopje":"in","refs":["Hand 21:40"]}],"3":[{"kopje":"Joodse man","refs":["Hand 21:39","Rom 11:1","2 Kor 11:22","Fil 3:5"]},{"kopje":"te Tarsen","refs":["Hand 9:11","Hand 9:30","Hand 11:25"]},{"kopje":"stad","refs":["Hand 6:9","Hand 15:23","Hand 15:41","Hand 23:34","Gal 1:21"]},{"kopje":"aan","refs":["Deut 33:3","2 Kon 4:38","Luk 2:46","Luk 8:35","Luk 10:39"]},{"kopje":"Gamaliël","refs":["Hand 5:34"]},{"kopje":"onderwezen","refs":["Hand 23:6","Hand 26:5","Gal 1:14","Fil 3:5"]},{"kopje":"was","refs":["Hand 21:20","2 Sam 21:2","Rom 10:2","Rom 10:3","Gal 4:17","Gal 4:18","Fil 3:6"]}],"4":[{"kopje":"vervolgd","refs":["Hand 22:19","Hand 22:20","Hand 7:58","Hand 8:1-4","Hand 9:1","Hand 9:2","Hand 9:13","Hand 9:14","Hand 9:21","Hand 26:9-11","1 Kor 15:9","Fil 3:6","1 Tim 1:13-15"]},{"kopje":"deze","refs":["Hand 16:17","Hand 18:26","Hand 19:9","Hand 19:23","Hand 24:14"]}],"5":[{"kopje":"ook","refs":["Hand 9:1","Hand 9:2","Hand 9:14","Hand 26:10","Hand 26:12"]},{"kopje":"en de gehele","refs":["Hand 4:5","Hand 5:21","Luk 22:66"]},{"kopje":"de broeders","refs":["Hand 22:1","Rom 9:3","Rom 9:4"]}],"6":[{"kopje":"dat","refs":["Hand 9:3-5","Hand 26:12"]},{"kopje":"Damaskus","refs":["Gen 14:15","Gen > the air,","24":"The chief <span class=\"wl wl-kjv\" data-code=\"G5506\">captain</span> <span class=\"wl wl-kjv\" data-code=\"G2753\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> to be <span class=\"wl wl-kjv\" data-code=\"G71\">brought</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> the <span class=\"wl wl-kjv\" data-code=\"G3925\">castle,</span> and <span class=\"wl wl-kjv\" data-code=\"G2036\">bade</span> that <span class=\"wl wl-kjv\" data-code=\"G846\">he</span> should be <span class=\"wl wl-kjv\" data-code=\"G426\">examined</span> by <span class=\"wl wl-kjv\" data-code=\"G3148\">scourging;</span> <span class=\"wl wl-kjv\" data-code=\"G2443\">that</span> he might <span class=\"wl wl-kjv\" data-code=\"G1921\">know</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">wherefore</span> they <span class=\"wl wl-kjv\" data-code=\"G2019\">cried</span> <span class=\"wl wl-kjv\" data-code=\"G3779\">so</span> <span class=\"wl wl-kjv\" data-code=\"G2019\">against</span> him.","25":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> they <span class=\"wl wl-kjv\" data-code=\"G4385\">bound</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> with <span class=\"wl wl-kjv\" data-code=\"G2438\">thongs,</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul</span> <span class=\"wl wl-kjv\" data-code=\"G2036\">said</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">unto</span> the <span class=\"wl wl-kjv\" data-code=\"G1543\">centurion</span> that stood <span class=\"wl wl-kjv\" data-code=\"G2476\">by,</span> Is it <span class=\"wl wl-kjv\" data-code=\"G1487\">lawful</span> for <span class=\"wl wl-kjv\" data-code=\"G5213\">you</span> to <span class=\"wl wl-kjv\" data-code=\"G3147\">scourge</span> a <span class=\"wl wl-kjv\" data-code=\"G444\">man</span> that is a <span class=\"wl wl-kjv\" data-code=\"G4514\">Roman,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> uncondemned?","26":"<span class=\"wl wl-kjv\" data-code=\"G1161\">When</span> the <span class=\"wl wl-kjv\" data-code=\"G1543\">centurion</span> <span class=\"wl wl-kjv\" data-code=\"G191\">heard</span> that, he <span class=\"wl wl-kjv\" data-code=\"G4334\">went</span> and <span class=\"wl wl-kjv\" data-code=\"G518\">told</span> the chief <span class=\"wl wl-kjv\" data-code=\"G5506\">captain,</span> <span class=\"wl wl-kjv\" data-code=\"G3004\">saying,</span> Take <span class=\"wl wl-kjv\" data-code=\"G3708\">heed</span> <span class=\"wl wl-kjv\" data-code=\"G5101\">what</span> thou <span class=\"wl wl-kjv\" data-code=\"G3195\">doest:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> <span class=\"wl wl-kjv\" data-code=\"G3778\">this</span> <span class=\"wl wl-kjv\" data-code=\"G444\">man</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> a Roman.","27":"<span class=\"wl wl-kjv\" data-code=\"G1161\">Then</span> the chief <span class=\"wl wl-kjv\" data-code=\"G5506\">captain</span> <span class=\"wl wl-kjv\" data-code=\"G4334\">came,</span> and <span class=\"wl wl-kjv\" data-code=\"G2036\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> <span class=\"wl wl-kjv\" data-code=\"G3004\">Tell</span> <span class=\"wl wl-kjv\" data-code=\"G3427\">me,</span> <span class=\"wl wl-kjv\" data-code=\"G1488\">art</span> <span class=\"wl wl-kjv\" data-code=\"G4771\">thou</span> a <span class=\"wl wl-kjv\" data-code=\"G4514\">Roman?</span> He <span class=\"wl wl-kjv\" data-code=\"G5346\">said,</span> Yea.","28":"<span class=\"wl wl-kjv\" data-code=\"G5037\">And</span> the chief <span class=\"wl wl-kjv\" data-code=\"G5506\">captain</span> <span class=\"wl wl-kjv\" data-code=\"G611\">answered,</span> With a <span class=\"wl wl-kjv\" data-code=\"G4183\">great</span> <span class=\"wl wl-kjv\" data-code=\"G2774\">sum</span> <span class=\"wl wl-kjv\" data-code=\"G2932\">obtained</span> <span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> <span class=\"wl wl-kjv\" data-code=\"G5026\">this</span> <span class=\"wl wl-kjv\" data-code=\"G4174\">freedom.</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul</span> <span class=\"wl wl-kjv\" data-code=\"G5346\">said,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> <span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> was free born.","29":"<span class=\"wl wl-kjv\" data-code=\"G3767\">Then</span> <span class=\"wl wl-kjv\" data-code=\"G2112\">straightway</span> they <span class=\"wl wl-kjv\" data-code=\"G868\">departed</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> <span class=\"wl wl-kjv\" data-code=\"G3195\">should</span> have <span class=\"wl wl-kjv\" data-code=\"G426\">examined</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him:</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">and</span> the chief <span class=\"wl wl-kjv\" data-code=\"G5506\">captain</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> was <span class=\"wl wl-kjv\" data-code=\"G5399\">afraid,</span> after he <span class=\"wl wl-kjv\" data-code=\"G1921\">knew</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> he <span class=\"wl wl-kjv\" data-code=\"G2076\">was</span> a <span class=\"wl wl-kjv\" data-code=\"G4514\">Roman,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">because</span> he <span class=\"wl wl-kjv\" data-code=\"G2258\">had</span> <span class=\"wl wl-kjv\" data-code=\"G1210\">bound</span> him.","30":"On the <span class=\"wl wl-kjv\" data-code=\"G1887\">morrow,</span> because he <span class=\"wl wl-kjv\" data-code=\"G1014\">would</span> have <span class=\"wl wl-kjv\" data-code=\"G1097\">known</span> the <span class=\"wl wl-kjv\" data-code=\"G804\">certainty</span> <span class=\"wl wl-kjv\" data-code=\"G5101\">wherefore</span> he was <span class=\"wl wl-kjv\" data-code=\"G2723\">accused</span> <span class=\"wl wl-kjv\" data-code=\"G3844\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G2453\">Jews,</span> he <span class=\"wl wl-kjv\" data-code=\"G3089\">loosed</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> his <span class=\"wl wl-kjv\" data-code=\"G1199\">bands,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2753\">commanded</span> the chief <span class=\"wl wl-kjv\" data-code=\"G749\">priests</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3650\">all</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G4892\">council</span> to <span class=\"wl wl-kjv\" data-code=\"G2064\">appear,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2609\">brought</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul</span> <span class=\"wl wl-kjv\" data-code=\"G2609\">down,</span> and set <span class=\"wl wl-kjv\" data-code=\"G2476\">him</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">before</span> them."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"broeders en","tekst":"Hij noemt het gemeen volk, die hem in ouderdom gelijk waren, broeders, en hunne oudsten en oversten vaders, om hen alzo met deze aanspraak tot gunstig gehoor te verwekken. Zie dergelijk voorbeeld in Stefanus; Act 7:2 ."}],"2":[{"catchword":"Hebreeuwse taal","tekst":"Dat is, Syrische die met de Hebreeuwse grote gemeenschap had, en daarom voor eene taal werd gehouden. Want het Joodse volk had na de Babylonische gevangenis, door het gedurig verkeer met de Syriërs en Assyriërs, de zuiverheid van de Hebreeuwse taal met die talen zeer vermengd."}],"3":[{"catchword":"aan de voeten","tekst":"Dat is, onder de onderwijzing en het opzicht van dien vermaarden wetgeleerde Gamaliël, van wiens aanzien onder het volk getuigd wordt Act 5:34 . En is deze wijze van spreken hiervan genomen, dat de leraars hoger in verheven stoelen of zetels zaten, en de discipelen op lager banken voor hunne voeten, gelijk ook van Maria gezegd wordt, Luk 10:39 ."},{"catchword":"de bescheidenste","tekst":"Of, naar de scherpste. Grieks naar de scherpigheid; dat is, de Farizese, die van de Joden voor de beste en scherpste onderhoudster der wet gehouden werd. Zie Act 26:5 ; Phi 3:5 ."},{"catchword":"een ijveraar","tekst":"Dat is, een ijveraar van de wet Gods; doch zonder verstand, gelijk Paulus daarbij voegt, Rom 10:2 ."}],"4":[{"catchword":"dezen weg vervolgd","tekst":"Dat is, deze leer of godsdienst. Zie Act 9:2 , en Act 19:9 , Act 19:23 ."},{"catchword":"tot den dood,","tekst":"Dat is, om hen ter dood te brengen; gelijk aan Stefanus geschied was; Act 7:60 ."}],"5":[{"catchword":"de broeders,","tekst":"Dat is, de Joden en hunne oversten, Act 9:2 , die hij broeders noemt, omdat zij van een geslacht waren, hoewel bittere vijanden der Christenen."}],"6":[{"catchword":"het geschiedde","tekst":"Zie van deze geschiedenis Act 9:3 , en vervolgens met de aantekeningen daarover."}],"9":[{"catchword":"hoorden zij niet","tekst":"Namelijk met verstand der woorden; want anders hoorden zij het geluid. Zie de aantekeningen Act 9:7 ."}],"11":[{"catchword":"vanwege de","tekst":"Dat is, de uitnemende klaarheid van dit licht had mijne ogen alzo verduisterd, dat er gelijk schellen op waren gekomen; Act 9:18 ."}],"13":[{"catchword":"Kwam tot mij,","tekst":"Namelijk van Christus door een gezicht gezonden; Act 9:10 ."},{"catchword":"word weder ziende","tekst":"Of, zie opwaarts."},{"catchword":"werd ik ziende","tekst":"Of, zag ik op hem."}],"14":[{"catchword":"te voren verordineerd,","tekst":"Of, tevoren geschikt. Het Griekse woord betekent zoveel als bij de hand genomen."},{"catchword":"den Rechtvaardige","tekst":"Dat is, Jezus Christus, die geen zonde heeft gekend, hoewel hij als een onrechtvaardige is veroordeeld; Isa 53:11 ; Act 3:14 ; 1Jo 2:1 ."}],"16":[{"catchword":"uw zonden afwassen,","tekst":"Dat is, tot een teken en verzegeling, dat uwe zonden door het bloed en den Geest van Christus afgewassen zijn; ene wijze van spreken, die van de sacramenten dikwijls gebruikt wordt. Zie Mar 1:4 ; Eph 5:26 , hetwelk nader verklaard wordt Mat 3:11 ; 1Pe 3:21 ; 1Jo 1:7 ."}],"17":[{"catchword":"een vertrekking","tekst":"Grieks uitstand; waarvan zie Act 10:10 . Dit schijnt geschied te zijn nadat hij uit Arabië weder naar Jeruzalem gekeerd was, drie jaren na zijne bekering; Gal 1:18 ."}],"18":[{"catchword":"ga in der haast","tekst":"Dit gehele verhaal van Paulus, gelijk ook het vorige, dient daartoe om den Joden te bewijzen dat hij niet uit onwetendheid van de beloften, den Joden geschied, noch uit enige partijschap tegen hen, maar alleen door de stem en den wil gods gedrongen zijnde, tot de heidenen was gegaan, om hun het Evangelie te prediken."}],"20":[{"catchword":"getuige,","tekst":"Grieks martyros; waarvan het woord martelaar komt, omdat zij met hun bloed de waarheid des Evangelies getuigenis geven, van welke Stefanus na de verrijzenis van Christus de eerste is geweest."}],"22":[{"catchword":"tot dit woord toe;","tekst":"Namelijk opdat zij niet konden verdragen dat de heidenen hun gelijk gesteld of boven hen werden verheven, zijn zij daarover zo ontsteld geworden."}],"23":[{"catchword":"klederen van","tekst":"Of, mantels, opperklederen."},{"catchword":"stof in de lucht","tekst":"Namelijk uit onstuimigheid als razende mensen. Anderen menen, dat zij zulks deden om te tonen dat hij naar hunne wet als een lasteraar behoorde gestenigd te worden; waartoe het afwerpen van de klederen diende, Act 7:58 , en het werpen van stof inplaats van stenen, die zij daar niet hadden."}],"24":[{"catchword":"de overste,","tekst":"Namelijk de kolonel of kommandeur van het kasteel Antonia, genaamd Claudius Lysias; Act 23:26 ."},{"catchword":"de legerplaats","tekst":"Zie daarvan Act 21:34 ."}],"25":[{"catchword":"met de riemen","tekst":"Dat is, alzo bonden, dat zijne leden uitgerekt worden aan een staak of pilaar, om gegeseld te worden."},{"catchword":"een Romeinsen mens,","tekst":"Dat is, een die het burgerrecht van de stad Rome heeft. Zie vs.28."},{"catchword":"onveroordeeld,","tekst":"Dat is, zonder behoorlijke kennis van zaken genomen te hebben."}],"28":[{"catchword":"geboren","tekst":"Namelijk niet dat hij in de stad van Rome geboren was, maar in de stad Tarsen in Cilicië, wier burgers van den keizer Augustus verkregen hadden het burgerrecht der stad Rome, doordien zij in den oorlog van denzelven tegen Brutus en Cassius, met hem gehouden en veel geleden hadden, van hunne middelen daardoor beroofd zijnde. Zie Dion. Chrys. in Tars.2, en Dion. Cass. lib.47. Plinius noemt dezelve ook ene vrije stad; Hist. nat. lib.5, cap.27. Zie ook de aantekeningen Act 9:11 ."}],"30":[{"catchword":"afgebracht hebbende,","tekst":"Namelijk uit het kasteel Antonia [hetwelk op ene hoogte lag] naar beneden, ergens in ene plaats van het voorkasteel, of daaromtrent, waar hij den Raad der Joden heeft ontboden. Want het is niet waarschijnlijk, dat hij in den tempel zelf Paulus gebracht heeft, alzo Lysias met de zijnen heidenen waren, en daarom in den tempel zelf niet mochten komen; en nochtans blijkt Act 23:10 , dat hij en zijne soldaten daar tegenwoordig zijn geweest."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Men, Brethren and Fathers, [He calleth the common people who were equal to him in age, Brethren, and their Elders and Rulers, Fathers, that so by this appellation he might stir them up to favourable audience. See the like example in Stephen, Acts 7. 2.] hear ye my defence, which I at present (shall make) unto you."}],"2":[{"catchword":null,"tekst":"(Now when they heard that he spake to them in the Hebrew Tongue, [That is the Syriack, which had great agreement with the Hebrew, and therefore was reckoned for one Tongue: for the people of the Jews after the Babylonish captivity, by their continual converse with the Syrians and Assyrians, had very much mingled the purity of the Hebrew Tongue with those Tongues] they kept themselves the more still.) And he said,"}],"3":[{"catchword":null,"tekst":"I am a man that am a Jew, born at Tarsus in Cilicia, and brought up in this City, at the feet of Gamaliel: [That is under the instruction and oversight of that famous Doctor of the Law Gamaliel, of whose respect among the people is testified, Acts 5, 34. And this phrase is taken from hence, that the Teachers sate higher, in advanced chairs or seats, and the Disciples on lower benches before their feet, as is also said of Mary, Luk 10:39.] instructed according to the exactest manner: [Gr.the sharpness, i.e. the sharpest, or the Pharisaical, which (sect) by the Jews was accounted for the best and strictest observer of the Law. See Acts 26. 5. Phil. 3.v. 5.] of the Law of our Fathers, being a zealot of God, [that is, a zealot for the Law of God, but without understanding as Paul addes, Rom. 10. 2.] like as ye all are at this day."}],"4":[{"catchword":null,"tekst":"Who persecuted this way, [That is, this doctrine or Religion. See Acts 9. 2.and 19.v.9, 23.] even unto death, [that is to bring them to death, as was done to Stephen Acts 7. 60.] binding and delivering over into prison both men and women."}],"5":[{"catchword":null,"tekst":"As the High Priest also is my witness, and the whole Council of Elders: from whom also having received letters unto the Brethren [That is, the Jews and their Rulers, Acts 9. 2.whom he calleth brethren because they were of one race, although bitter Enemies of the Christians] travelled towards Damascus, to bring those that were there also , bound unto Jerusalem, that they might be punished."}],"6":[{"catchword":null,"tekst":"But it happened unto me [See of this event, Act 9:3.and the following (verses) with the annotations thereupon] as I journeyed, and drew neer to Damascus about noon, that suddenly from heaven a great light shined round about me."}],"7":[{"catchword":null,"tekst":"And I fell to the Earth, and I heard a voice saying unto me, Saul, Saul, why persecutes thou me?"}],"8":[{"catchword":null,"tekst":"And I answered, who art thou Lord? And he saidunto me I am Jesus of Nazareth whom thou persecutest."}],"9":[{"catchword":null,"tekst":"And they that were with me, saw indeed the light, and were sore afraid, but the voice of him that spake unto me they heard not. [Namely with understanding of the words: for otherwise they heard the sound. See the annot.on Acts 9. 7.]"}],"10":[{"catchword":null,"tekst":"And I said Lord what shall I do? And the Lord said unto me, arise and go thy way to Damascus, and there thou shalt he spoken with, concerning all that which is ordained thee to do."}],"11":[{"catchword":null,"tekst":"And when I saw not by reason of the glory of that light, [That is, the exceeding brightness of this light had so scorched mine eyes, that as it were scales were come upon them, Acts 9. 18.] I was led by the hand, by those which were with me, and came to Damascus."}],"12":[{"catchword":null,"tekst":"And one Ananias, a Religious man according to the Law, having (good) testimony of all the Jews which dwelt (there.)"}],"13":[{"catchword":null,"tekst":"Came unto me, [Namely, sent by Christ by a vision, Acts 9. 10.] and standing by (mee) said unto mee, Saul, brother, be thou restored to thy sight; [or, look upwards] and the same houre I became looking upon him. [or, I looked upon him.]"}],"14":[{"catchword":null,"tekst":"And he said, The God of our Fathers hath before ordained thee [Or before prepared. The Greek word signifies as much as, taken thee by the hand] to know his will, and to see the righteous one, [that is, Jesus Christ, who knew no sin, although he were condemned as one that was unrighteous, Isa. 53. 11. Acts 3. 14. 1 John 2. // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;

function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

function bijbeluitlegHtml(n) {

}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
