wachtten ons op in Troas.","6":"Wij nu scheepten af van Filippi na de dagen van het ongezuurde *brood*, en kwamen in vijf dagen bij hen in Troas, waar wij ons zeven dagen ophielden.","7":"En op de eerste *dag* van de week, toen de discipelen bijeengekomen waren om brood te breken, sprak Paulus met hen, van plan de volgende dag te vertrekken; en hij zette *zijn* toespraak voort tot middernacht.","8":"En er waren veel lampen in de bovenzaal waar zij bijeen waren.","9":"En een zekere jongeman, met de naam Eutychus, zat in het venster en werd door een diepe slaap overvallen. Terwijl Paulus lang doorsprak, viel hij door de slaap naar beneden van de derde verdieping, en werd dood opgeraapt.","10":"Doch Paulus ging naar beneden, viel over hem heen en omhelsde hem, en zei: Wees niet ontdaan, want zijn leven is in hem.","11":"En toen hij weer boven gekomen was, brood gebroken en *wat* gegeten had, en lang, tot de dageraad toe, met hen gesproken had, vertrok hij zo.","12":"En zij brachten de jongen levend weg, en waren buitengewoon vertroost.","13":"Maar wij gingen vooruit naar het schip en voeren af naar Assus, waar wij Paulus zouden opnemen; want hij had het zo bevolen, en hij zou zelf te voet gaan.","14":"En toen hij zich in Assus bij ons gevoegd had, namen wij hem aan boord en kwamen in Mitylene.","15":"En vandaar afgevaren, kwamen wij de volgende dag tegenover Chios; en de dag daarna legden wij aan te Samos, en bleven in Trogyllion, en de dag daarna kwamen wij in Milete.","16":"Want Paulus had besloten Efeze voorbij te varen, opdat hij geen tijd zou verliezen in Azië; want hij haastte zich om, als het hem mogelijk was, op de pinksterdag in Jeruzalem te zijn.","17":"Maar hij stuurde vanuit Milete iemand naar Efeze en ontbood de oudsten van de gemeente.","18":"En toen zij bij hem gekomen waren, zei hij tegen hen: U weet, van de eerste dag af dat ik in Azië ben aangekomen, hoe ik de hele tijd bij u geweest ben;","19":"Terwijl ik de Heere diende met alle nederigheid, en veel tranen, en beproevingen, die mij overkwamen door de aanslagen van de Joden;","20":"Hoe ik niets heb achtergehouden van wat nuttig was, zodat ik het u niet zou verkondigd en u geleerd hebben, in het openbaar en in de huizen;","21":"Terwijl ik zowel Joden als Grieken heb betuigd de bekering tot God en het geloof in onze Heere Jezus Christus.","22":"En nu, zie, ik, gebonden door de Geest, reis naar Jeruzalem, zonder te weten wat mij daar zal overkomen;","23":"Behalve dat de Heilige Geest van stad tot stad betuigt en zegt dat mij boeien en verdrukkingen te wachten staan.","24":"Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.","25":"En nu, zie, ik weet dat u allen, bij wie ik ben doorgegaan en het Koninkrijk van God heb gepredikt, mijn gezicht niet meer zult zien.","26":"Daarom verklaar ik u op deze huidige dag, dat ik rein ben van het bloed van *u* allen.","27":"Want ik heb niet nagelaten u heel de raad van God te verkondigen.","28":"Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.","29":"Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen.","30":"En uit uzelf zullen mannen opstaan, die verkeerde dingen spreken, om de discipelen achter zich aan te trekken.","31":"Daarom, waak, en bedenk dat ik drie jaar *lang*, nacht en dag, niet heb opgehouden ieder met tranen te vermanen.","32":"En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.","33":"Ik heb niemands zilver, of goud, of kleding begeerd.","34":"En u weet zelf, dat deze handen gediend hebben voor mijn behoeften, en voor die van hen die met mij waren.","35":"Ik heb u in alles getoond, dat men, zo arbeidend, de zwakken moet opnemen, en zich de woorden van de Heere Jezus herinneren, dat Hij gezegd heeft: Het is zaliger te geven dan te ontvangen.","36":"En toen hij dit gezegd had, knielde hij neer en bad met hen allen.","37":"En er ontstond een groot geween bij hen allen; en zij vielen Paulus om de hals en kusten hem;","38":"Zeer bedroefd, vooral over het woord dat hij gezegd had, dat zij zijn gezicht niet meer zouden zien; en zij begeleidden hem naar het schip."},"SV":{"1":"Nadat nu het oproer gestild was, Paulus, de discipelen tot zich geroepen en gegroet hebbende, ging uit om naar Macedonië te reizen.","2":"En als hij die delen doorgereisd, en hen met vele redenen vermaand had, kwam hij in Griekenland.","3":"En als hij *aldaar* drie maanden overgebracht had, en hem van de Joden lagen gelegd werden, als hij naar Syrië zoude varen, zo werd hij van zin weder te keren door Macedonië.","4":"En hem vergezelschapte tot in Azië Sopater van Berea; en van de Thessalonicensen Aristarchus en Sekundus; en Gajus van Derbe, en Timotheüs en van die van Azië Tychikus en Trofimus.","5":"Dezen, vooraf heengegaan zijnde, wachtten ons te Troas.","6":"Wij nu scheepten af van Filippi na de dagen der ongehevelde *broden*, en kwamen in vijf dagen bij hen te Troas, alwaar wij ons zeven dagen onthielden.","7":"En op den eersten *dag* der week, als de discipelen bijeengekomen waren om brood te breken, handelde Paulus met hen, zullende des anderen daags verreizen; en hij strekte *zijne* rede uit tot den middernacht.","8":"En er waren vele lichten in de opperzaal waar zij vergaderd waren.","9":"En een zeker jongeling, met name Eutychus, zat in het venster en met een diepen slaap overvallen zijnde, alzo Paulus lang *tot* *hen* sprak, door den slaap nederstortende, viel van de derde zoldering nederwaarts, en werd dood opgenomen.","10":"Doch Paulus, afgekomen zijnde, viel op hem, en *hem* omvangende, zeide hij: Weest niet beroerd; want zijn ziel is in hem.","11":"En als hij *weder* boven gegaan was, en brood gebroken en *wat* gegeten had, en lang, tot den dageraad toe, met hen gesproken had, vertrok hij alzo.","12":"En zij brachten den knecht levende, en waren bovenmate vertroost.","13":"Maar wij, vooruit naar het schip gegaan zijnde, voeren af naar Assus, waar wij Paulus zouden innemen; want hij had het alzo bevolen, en hij zelf zou te voet gaan.","14":"En als hij zich te Assus bij ons gevoegd had, namen wij hem in, en kwamen te Mitylene.","15":"En van daar afgescheept zijnde, kwamen wij den volgenden *dag* tegen Chios over, en des anderen *daags* legden wij aan te Samos, en bleven te Trogyllion, en den *dag* daaraan kwamen wij te Milete.","16":"Want Paulus had voorgenomen Efeze voorbij te varen, opdat hij niet den tijd in Azië zou verslijten; want hij spoedde zich, om ( zo het hem mogelijk ware) op den pinksterdag te Jeruzalem te zijn.","17":"Maar hij zond van Milete naar Efeze, en hij ontbood de ouderlingen der Gemeente.","18":"En als zij tot hem gekomen waren, zeide hij tot hen: Gijlieden weet, van den eersten dag af, dat ik in Azië ben aangekomen, hoe ik bij u den gansen tijd geweest ben;","19":"Dienende den Heere met alle ootmoedigheid, en vele tranen, en verzoekingen, die mij overkomen zijn door de lagen der Joden;","20":"Hoe ik niets achtergehouden heb van hetgeen nuttig was, dat ik u niet zou verkondigd en u geleerd hebben, in het openbaar en bij de huizen;","21":"Betuigende, beiden Joden en Grieken, de bekering tot God en het geloof in onzen Heere Jezus Christus.","22":"En nu ziet, ik, gebonden zijnde door den Geest, reis naar Jeruzalem, niet wetende, wat mij daar ontmoeten zal;","23":"Dan dat de Heilige Geest van stad tot stad betuigt, zeggende, dat mij banden en verdrukkingen aanstaande zijn.","24":"Maar ik acht op geen ding, noch houde mijn leven dierbaar voor mijzelven, opdat ik mijn loop met blijdschap mag volbrengen, en den dienst, welken ik, van den Heere Jezus ontvangen heb, om te betuigen het Evangelie der genade Gods.","25":"En nu ziet, ik weet, dat gij allen, waar ik doorgegaan ben, predikende het Koninkrijk Gods, mijn aangezicht niet meer zien zult.","26":"Daarom betuig ik ulieden op dezen huidigen dag, dat ik rein ben van het bloed van *u* allen.","27":"Want ik heb niet achtergehouden, dat ik u niet zou verkondigd hebben al den raad Gods.","28":"Zo hebt dan acht op uzelven, en op de gehele kudde, over dewelke u de Heilige Geest tot opzieners gesteld heeft, om de Gemeente Gods te weiden, welke Hij verkregen heeft door Zijn eigen bloed.","29":"Want dit weet ik, dat na mijn vertrek zware wolven tot u inkomen zullen, die de kudde niet sparen.","30":"En uit uzelven zullen mannen opstaan, sprekende verkeerde dingen, om de discipelen af te trekken achter zich.","31":"Daarom waakt, en gedenkt, dat ik drie jaren *lang* nacht en dag, niet opgehouden heb een iegelijk met tranen te vermanen.","32":"En nu, broeders, ik bevele u Gode, en den woorde Zijner genade, Die machtig is u op te bouwen, en u een erfdeel te geven onder al de geheiligden.","33":"Ik heb niemands zilver, of goud, of kleding begeerd.","34":"En gijzelve weet, dat deze handen tot mijn nooddruft, en dergenen, die met mij waren, gediend hebben.","35":"Ik heb u in alles getoond, dat men, alzo arbeidende, de zwakken moet opnemen, en gedenken aan de woorden van den Heere Jezus, dat Hij gezegd heeft: Het is zaliger te geven, dan te ontvangen.","36":"En als hij dit gezegd had, heeft hij nederknielende met hen allen gebeden.","37":"En er werd een groot geween van *hen* allen; en zij, vallende om den hals van Paulus, kusten hem;","38":"Zeer bedroefd zijnde, allermeest over het woord, dat hij gezegd had, dat zij zijn aangezicht niet meer zien zouden; en zij geleidden hem naar het schip."},"KJV":{"1":"And after the uproar was ceased, Paul called unto *him* the disciples, and embraced *them*, and departed for to go into Macedonia.","2":"And when he had gone over those parts, and had given them much exhortation, he came into Greece,","3":"And *there* abode three months. And when the Jews laid wait for him, as he was about to sail into Syria, he purposed to return through Macedonia.","4":"And there accompanied him into Asia Sopater of Berea; and of the Thessalonians, Aristarchus and Secundus; and Gaius of Derbe, and Timotheus; and of Asia, Tychicus and Trophimus.","5":"These going before tarried for us at Troas.","6":"And we sailed away from Philippi after the days of unleavened bread, and came unto them to Troas in five days; where we abode seven days.","7":"And upon the first *day* of the week, when the disciples came together to break bread, Paul preached unto them, ready to depart on the morrow; and continued his speech until midnight.","8":"And there were many lights in the upper chamber, where they were gathered together.","9":"And there sat in a window a certain young man named Eutychus, being fallen into a deep sleep: and as Paul was long preaching, he sunk down with sleep, and fell down from the third loft, and was taken up dead.","10":"And Paul went down, and fell on him, and embracing *him* said, Trouble not yourselves; for his life is in him.","11":"When he therefore was come up again, and had broken bread, and eaten, and talked a long while, even till break of day, so he departed.","12":"And they brought the young man alive, and were not a little comforted.","13":"And we went before to ship, and sailed unto Assos, there intending to take in Paul: for so had he appointed, minding himself to go afoot.","14":"And when he met with us at Assos, we took him in, and came to Mitylene.","15":"And we sailed thence, and came the next *day* over against Chios; and the next *day* we arrived at Samos, and tarried at Trogyllium; and the next *day* we came to Miletus.","16":"For Paul had determined to sail by Ephesus, because he would not spend the time in Asia: for he hasted, if it were possible for him, to be at Jerusalem the day of Pentecost.","17":"And from Miletus he sent to Ephesus, and called the elders of the church.","18":"And when they were come to him, he said unto them, Ye know, from the first day that I came into Asia, after what manner I have been with you at all seasons,","19":"Serving the Lord with all humility of mind, and with many tears, and temptations, which befell me by the lying in wait of the Jews:","20":"*And* how I kept back nothing that was profitable *unto you*, but have shewed you, and have taught you publickly, and from house to house,","21":"Testifying both to the Jews, and also to the Greeks, repentance toward God, and faith toward our Lord Jesus Christ.","22":"And now, behold, I go bound in the spirit unto Jerusalem, not knowing the things that shall befall me there:","23":"Save that the Holy Ghost witnesseth in every city, saying that bonds and afflictions abide me.","24":"But none of these things move me, neither count I my life dear unto myself, so that I might finish my course with joy, and the ministry, which I have received of the Lord Jesus, to testify the gospel of the grace of God.","25":"And now, behold, I know that ye all, among whom I have gone preaching the kingdom of God, shall see my face no more.","26":"Wherefore I take you to record this day, that I *am* pure from the blood of all","27":"For I have not shunned to declare unto you all the counsel of God.","28":"Take heed therefore unto yourselves, and to all the flock, over the which the Holy Ghost hath made you overseers, to feed the church of God, which he hath purchased with his own blood.","29":"For I know this, that after my departing shall grievous wolves enter in among you, not sparing the flock.","30":"Also of your own selves shall men arise, speaking perverse things, to draw away disciples after them.","31":"Therefore watch, and remember, that by the space of three years I ceased not to warn every one night and day with tears.","32":"And now, brethren, I commend you to God, and to the word of his grace, which is able t st":"Grieks in dewelke."},{"catchword":"de Heilige Geest","tekst":"Die de voornaamste oorzaak is van de wettige beroeping der dienaren des Woords, hoewel Hij dat door den dienst der mensen doet; zie Act 13:2-3 ."},{"catchword":"opzieners gesteld","tekst":"Grieks Episkopous; waarvan het woord bisschop gekomen is. Deze worden vs.17 genaamd ouderlingen der gemeente. Waaruit blijkt dat in de Heilige Schrift tussen ouderlingen en bisschoppen geen onderscheid gemaakt wordt; zie Phi 1:1 ."},{"catchword":"te weiden, welke","tekst":"Namelijk met de gezonde leer des goddelijken Woords; door ene gelijkenis genomen van schaapherders, bij welke het ambt van de dienaren des Woords zeer bekwamelijk wordt vergeleken; Jer 23:4 ; Joh 21:15 ; Eph 4:11 ; 1Pe 5:2 ."},{"catchword":"Hij","tekst":"Namelijk God, dat is de Zoon Gods, die onze menselijke natuur aangenomen heeft in enigheid Zijns persoons."},{"catchword":"verkregen heeft","tekst":"Of, verworven, gekocht, zijn eigen gemaakt."},{"catchword":"door Zijn","tekst":"Namelijk door hetwelk Hij ons heeft verlost, en niet door het bloed van enige beesten; Heb 9:12 . Dit bloed wordt Gods eigen bloed genaamd, omdat de Zoon Gods, zijnde en blijvende waarachtig God, menselijk vlees en bloed heeft aangenomen in enigheid des persoons; ene wijze van spreken, waardoor de persoon van Christus, benaamd zijnde van de ene natuur, toegeschreven wordt hetgeen Hem eigen is naar de andere natuur. Zie Joh 3:13 ."}],"29":[{"catchword":"vertrek","tekst":"Namelijk van hier uit deze landen, of ook uit dit leven."},{"catchword":"zware","tekst":"Dat is, gruwelijke, bezwaarlijke."},{"catchword":"wolven tot","tekst":"Dat is, valse leraars, die de schapen met hunne valse leer vernielen; Mat 7:15 ."}],"30":[{"catchword":"uit uzelven","tekst":"Dat is, uit de leraars en opzieners zelf."},{"catchword":"verkeerde dingen,","tekst":"Of, verdraaide; gelijk de Satan alles verdraait om de waarheid te verduisteren."},{"catchword":"achter zich","tekst":"Namelijk om hen en hunne leer te volgen."}],"31":[{"catchword":"drie jaren","tekst":"Vergelijk Act 19:10 ."}],"32":[{"catchword":"den woorde","tekst":"Dat is, het Evangelie, om daarmede uw geloof te versterken en daarin uwen troost te zoeken. Zie Act 14:26 ."},{"catchword":"Die machtig","tekst":"Namelijk God."},{"catchword":"bouwen, en","tekst":"Namelijk de gemeente vermeerderende met gaven en in het getal."},{"catchword":"een erfdeel","tekst":"Namelijk des hemelsen vaderlands."},{"catchword":"geheiligden","tekst":"Namelijk door den Geest der wedergeboorte; of afgezonderd van de wereld door het geloof."}],"35":[{"catchword":"de zwakken moet","tekst":"Namelijk in het geloof en de kennis der Christelijke leer."},{"catchword":"opnemen,","tekst":"Dat is, òf onderstutten dat zij niet vallen, òf, gevallen zijnde, de ahnd bieden om op te helpen; Luk 1:54 ."},{"catchword":"dat Hij gezegd","tekst":"Deze woorden staan in de Evangelische geschiedenis niet beschreven, gelijk niet alle woorden en daden van Christus beschreven zijn, Joh 20:30 , en Joh 21:25 , maar kunnen evenwel afgenomen worden uit sommige spreuken van Christus; Luk 6:38 , en Luk 16:9 ."},{"catchword":"zaliger te","tekst":"Want die den armen geeft, die geeft het den Heere op woeker; Pro 19:17 ."},{"catchword":"geven, dan te","tekst":"Namelijk de tijdelijke goederen tot onderhoud van den kerkedienst of der armen."}],"37":[{"catchword":"geween van","tekst":"Een teken van hartelijke liefde tot hunnen leraar."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now after that the uproar was quieted, Paul having called the Disciples to him and saluted (them) [Namely, by embracing and kissing them according to the custome of those Countries, Gen. 31. 55. 1 Thes. 5. 26.] went forth to travel towards Macedonia."}],"2":[{"catchword":null,"tekst":"And when he had journeyed through those parts, and exhorted them with many speeches, he came into Greece which was called Attica.]"}],"3":[{"catchword":null,"tekst":"And when he had spent [Gr.made. See Acts 15. 33.and 18. 23.] three moneths (there,) and snares were laid for him by the Jews, as he was to sayl towards Syria. [Gr.should be driven into the height or depth, namely, of the Sea.] he was minded [or of purpose, opinion] to return through Macedonia."}],"4":[{"catchword":null,"tekst":"And there accompanied him into Asia [It seems that Paul was not willing that these should accompany him further, excepting Trophimus, Acts 21. 29.] Sopater [otherwise Sofipater, to which some adde the son of Pyrrhus. See of him Rom. 16. 21.] of Berea [Gr. Berean] and of the Thessalonians, Aristarchus, and Secundus, and. Gaius of Derbe, and Timotheus: and of those of Asia, [whence it appears that that which the Apostle saith 2 Tim. 1. 15.must not be understood of all, but of the greatest part] Tychicus."}],"5":[{"catchword":null,"tekst":"These being gone before waited for us at Troas."}],"6":[{"catchword":null,"tekst":"Now we sailed off from Phillippi after the daies of unleavened (bread) [That is, of the Passover, Mat 26. 17.] and came in five daies [or at the end of five daies] unto them at Troas, where we [namely, Paul and his company, amongst whom also Luke here comprehends himself] turned seven daies, [Gr.wore out, namely the time.]"}],"7":[{"catchword":null,"tekst":"And on the first (day) [Gr.one, see Gen 1. 5. Mat. 28. 1.and compare therewith 1 Cor. 16. 2.which day is called the day of the Lord, Revel. 1. 10.] of the week [Gr.of the Sabbaths. See Mat. 28. 1. Luke 18. 12.] when the disciples were come together to break bread [that is, to eat with one another, and to hold the Lords Supper. See Acts 2. 42; 46. 1 Cor. 11. 20, 21, 22.] Paul treated with them [namely, of the doctrine of the Gospell] being to depart the next day: and he extended (his) discourse unto midnight."}],"8":[{"catchword":null,"tekst":"And there were many lights [Gr.many lamps. The faithfull to escape the danger of the persecution, then assembled many times by night: and had lights in their Assemblies, that they might not be slandered (as yet nevertheless they were by the ungodly) that they committed any thing unsitting in the same] in the upper-room, where they were assembled. [otherwise we.]"}],"9":[{"catchword":null,"tekst":"And a certain young man by name Eutychus, sate in the window, and being surprised by a deep sleep, [Or being fallen into a deep sleep, Gr.being taken away, carried away] seeing Paul, spake long (unto them) [Gr.discoursed very much] falling down headlong by sleep [or being cast down headlong] fell from the loft downward, and was taken up dead."}],"10":[{"catchword":null,"tekst":"But Paul being come down fell upon him, and clasping (him) about, he said; be not troubled; for his soul is in him. [The soule was indeed departed from him ver.9.but this Paul speaketh, because he was fully assured that the same should come into him again, as Mat. 9. 24.or because at that instant the same came into him againe.]"}],"11":[{"catchword":null,"tekst":"And when he was gone up (again) and had broken bread [See ver.7.] and eaten (somewhat) [Gr.had tasted, namely, common food, which used to be done together with the use of the (Lords) Supper] and had spoken with them long, untill break of day, so [see the like Joh 4:6.] he departed"}],"12":[{"catchword":null,"tekst":"And they brought the youth alive, and were comforted [That is, joyed and revived] above measure."}],"13":[{"catchword":null,"tekst":"But we being forth before towards the ship, sayled off into Assos, [ACity in Mysia about Troas, otherwise called also Apollonia] where were should take in Paul. For so he commanded it, [Gr.ordained] and he himself would goe a foot. [that is, travel by land, to preach the Gospel here and there by the way.]"}],"14":[{"catchword":null,"tekst":"And when he had joined himself with us at Assos, wee took him in, and came to Mitylene. [An Island with a City of the same name, not far from Assos, lying in the Aegean Sea.]"}],"15":[{"catchword":null,"tekst":"And being shipt away from thence, we came the (day) following over agast Chios, [An Island betwixt Samos and Lesbos in the same Sea] and the next (day) we put in to Samos, [an Island thereabout having a City of the same name] and abode at Trogyllium, [a corner of the mountain Mycales, stretching out into the Sea, flying from Samos forty furlongs] and the (day) following we came to Miletus. [a City by the Sea, on the firm land of Ionia, not far from Ephesus.]"}],"16":[{"catchword":null,"tekst":"For Paul had purposed [Gr.judged, i.e. thought good] to sayl by Ephesus, that he might not spend the time in Asia, For he hasted (if it were possible for him) to be at Jerusalem on the day of Pentecost, [of this Feast day see Acts 2. 1. This the Apostle did, not because he thought that the Jewish Feast must yet be observed Gal. 4. 10. Col. 2. 16.but because by the multitude of people that came to the feast, he should have opportunity the better to spread abroad the Gospell.]"}],"17":[{"catchword":null,"tekst":"But he sent from Miletus to Ephesus, and he called over the Elders of the Church."}],"18":[{"catchword":null,"tekst":"And when they were come unto him he said unto them, ye know, from the first day that I came into Asia, [Namely, properly so called, being a part of Asia the less, of which Ephesus was the chief City] how I was with you the whole time:"}],"19":[{"catchword":null,"tekst":"Serving the Lord with all humility [Or lowliness, of mind, or of condition as Luke 1. 48.] and many tears, [namely, out of compassion towards poor ignorant or seduced persons] and temptations [that is, afflictions. See Jas 1:2.and 1 Pet. 1. 6.] which came upon me by the lyings in wait of the Jews."}],"20":[{"catchword":null,"tekst":"How I have kept back nothing [Gr.withdrawn, i.e. concealed, either for fear of men or for lucre sake, 1 Thes. 2.ver. 3. 4.] of that which was profitable, that I have not declared unto you and have taught you publikly, and by the houses. [That is, in particular.]"}],"21":[{"catchword":null,"tekst":"Testifying both to Jews and Greeks, [Namely, everywhere and very strongly, with firm grounds and testimonies of the holy Scripture ] repentance unto God, and faith in our Lord Jesus Christ."}],"22":[{"catchword":null,"tekst":"And now behold I being bound [That is, being drawn as with bands] by the Spirit, [that is, by strong impulse and command of the Holy Ghost: or by my mind through the inspiration of the Holy Ghost. See Acts 19. 21.] travel to Jerusalem, not knowing [namely particularly] what shall meet with me there."}],"23":[{"catchword":null,"tekst":"Save that the Holy Ghost from City to City [That is, every where, in all Cities which I travel thorow, Luke 8. 4.] witnesseth, [namely, by the Prophets, to whom the Holy Ghost hath revealed this, Acts 21. 4. 11.] saying, that bands and afflictions are ready for me. [Gr.waite for me.]"}],"24":[{"catchword":null,"tekst":"But I regard nothing [Gr. I make no reckoning of any thing] neither hold my life [Gr.my soul] precious to my self, that I may finish my course [namely, of the Christian life, and especially of my ministry 1 Cor. 9. 24. 2 Tim. 4. 7.] with joy, and the ministry which I have received from the Lord Jesus, to testifie the Gospell of the grace of God. [that is, wherein the grace of God is published unto us.]"}],"25":[{"catchword":null,"tekst":"And now behold, I know that ye all where I passed preaching the Kingdome of God, shall see my face no more."}],"26":[{"catchword":null,"tekst":"Therefore I testifie unto you on this present day, that I am pure from the blood of (you) all. [That is, guiltless of your destruction, seeing I have faithfully shewed you the way of salvation. See Ezek. 3. 18, 19. Acts 18. 6.]"}],"27":[{"catchword":null,"tekst":"For I have kept back nothing [See ver. 20.] that I should have declared unto you, all the counsel of God. [That is, all that God hath decreed and revealed concerning the salvation of men; through whom, and how the same is obtained, Luke 7. 30. Eph. 1. 11.]"}],"28":[{"catchword":null,"tekst":"Therefore take heed to your selves, [That is, to your doctrine, life, and office] and to the whole stock, over which [Gr.in which] the Holy Ghost [who is the principall cause of the lawfull calling of the Ministers of the word, although he do it by the ministry of men. See Acts 13.ver. 2. 3.] hath set you Overseers [Gr. Episcopous, from whence the word Bishop is come. These ver.17.are called Elders of the Church, from whence it appears that in the holy Scripture there is no difference made betwixt Elder and Bishops. See Phil. 1. 1.] to feed the Church of God, [Namely, with the sound doctrine of the word of God: by a similitude taken form Sherpeards, to whom the office of the Ministers of the word is very fitly compared, Jer. 23. 4. John 21. 15. Eph. 4. 11. 1 Pet. 5. 2.] which he [namely God i.e. teh Son of God, who hath assumed our humane nature, into the unity of his person] hath gotten [Or purchased bought, made his own] by his own blood. [namely, by which he hath redeemed us, and not by the blood of any beasts. Heb. 9. 12. This blood is called Gods own blood, because the Son of God, being and remaining true God, assumed humane flesh and blood in unity of person. A phrase whereby, is ascribed to the person of Christ, being denominated from the one nature, that which is proper to him according to the other nature. See John 3. V. 13.]"}],"29":[{"catchword":null,"tekst":"For this I know that after my departure [Namely, from hence out of these Countreys, or else out of this life] grievous [that is, abominable, troublesome] wolves [that is, false Teachers, which seek to destroy the sheep by their false doctrine, Mat. 7, 15.] shall come in unto you, which spare not the stock."}],"30":[{"catchword":null,"tekst":"And of your selves [That is, of the Teachers and Overseers themselves] shall men arise, speaking perverse things [or wrested, like as Satan wresteth all things to obscure the truth] to draw away the Disciples after them. [namely, to follow them and their doctrine.]"}],"31":[{"catchword":null,"tekst":"Therefore watch and remember that (for) three years, [Compare Acts 19. 10.] night and day I ceased not to admonish every one with tears."}],"32":[{"catchword":null,"tekst":"And now brethren I commend you to God, and to the word of his grace, [That is, to the Gospel, therewith to confirm the faith, and therein to seek your comfort. See Acts 14. 26.] who is able [namely, God] to build you up [namely, increasing the Church with gifts and in number] and to give you an inheritance [namely, of the heavenly Countrey] among all the sanctified ones. [namely, by the spirit of regeneration: or separated from the world by faith."}],"33":[{"catchword":null,"tekst":"I have desired no mans silver, or gold, or apparell."}],"34":[{"catchword":null,"tekst":"And you your selves know that these hands have ministred to my necessities, and to those that were with me."}],"35":[{"catchword":null,"tekst":"I have shewed you in all (things) that thus labouring we must take up [That is, either support them that they may not fall, or being fallen offer the hand to help them up, Luke 1, 54.] the weak, [namely, in faith and knowledge of Christian doctrine] and remember the words of the Lord Jesus, that he said [these words are not written in the Evangelical History, like as all the words and deeds of Christ are not written, John 20. 30.and 21. 25.but may notwithstanding be gathered from some speeches of Christ, Luke 6. 38.and 16. 9.] it is more blessed [for he that giveth to the poor, he gives it upon usury to the Lord, Prov. 19. 17.] to give, [namely, temporal goods for the maintenance of the ministry of the Church, or of the poor] then to receive."}],"36":[{"catchword":null,"tekst":"And when he had said this, kneeling down he prayed with them all."}],"37":[{"catchword":null,"tekst":"And there was a great weeping of (them) all: [A token of hearty love to their Teacher] and they falling about Pauls neck, kissed him."}],"38":[{"catchword":null,"tekst":"Being greatly grieved, most of all for the word that he said, that they should see his face no more: and they brought him to the ship."}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const concordCache = {};

}

const popupCache = {};

  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

document.addEventListener('mouseover', e => {

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
