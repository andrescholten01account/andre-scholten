  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }

  .kolomkop { display:none; }

aten wordt.","5":"Maar hij schudde het beest af in het vuur, en had er geen kwaad van te lijden.","6":"En zij verwachtten dat hij zou opzwellen, of meteen dood neervallen. Maar toen zij lang gewacht hadden en zagen dat hem geen ongemak overkwam, veranderden zij van gedachten en zeiden dat hij een god was.","7":"En hier, in de omgeving van diezelfde plaats, had de voornaamste man van het eiland, met de naam Publius, zijn landgoederen; hij ontving ons en herbergde ons drie dagen lang vriendelijk.","8":"En het gebeurde dat de vader van Publius met koorts en buikloop te bed lag; Paulus ging naar hem toe, en nadat hij gebeden had, legde hij hem de handen op en maakte hem gezond.","9":"Toen dit dan gebeurd was, kwamen ook de anderen naar hem toe die ziekten hadden op het eiland, en zij werden genezen.","10":"Zij eerden ons ook met veel eer, en toen wij vertrokken, gaven zij ons mee wat nodig was.","11":"En na drie maanden voeren wij af in een schip van Alexandrië, dat op het eiland overwinterd had, met als scheepsteken Kastor en Pollux.","12":"En toen wij in Syracuse aangekomen waren, bleven wij daar drie dagen;","13":"Vandaar voeren wij verder en kwamen aan in Regium; en toen er na één dag zuidenwind opstak, kwamen wij de tweede dag in Puteoli;","14":"Daar vonden wij broeders, en werden gevraagd zeven dagen bij hen te blijven; en zo gingen wij naar Rome.","15":"En vandaar kwamen de broeders, die van onze komst gehoord hadden, ons tegemoet tot aan Appiusmarkt en de Drie Tabernen; toen Paulus hen zag, dankte hij God en greep moed.","16":"En toen wij in Rome gekomen waren, droeg de hoofdman de gevangenen over aan de aanvoerder van de wacht; maar aan Paulus werd toegestaan op zichzelf te wonen, met de soldaat die hem bewaakte.","17":"En het gebeurde na drie dagen dat Paulus de voornaamsten van de Joden bij elkaar riep. En toen zij bijeengekomen waren, zei hij tegen hen: Mannen broeders, ik, die niets gedaan heb tegen het volk of de gewoonten van de voorvaders, ben als gevangene uit Jeruzalem overgeleverd in de handen van de Romeinen;","18":"Die mij, na mij onderzocht te hebben, wilden loslaten, omdat er geen doodschuld in mij was.","19":"Maar toen de Joden zich hiertegen verzetten, werd ik genoodzaakt mij op de keizer te beroepen; niet omdat ik iets had om mijn volk van te beschuldigen.","20":"Om deze reden dan heb ik u bij mij geroepen, om u te zien en aan te spreken; want vanwege de hoop van Israël ben ik met deze keten geboeid.","21":"Maar zij zeiden tegen hem: Wij hebben geen brieven over u uit Judea ontvangen; en er is ook niemand van de broeders hierheen gekomen die iets slechts over u gemeld of gezegd heeft.","22":"Maar wij willen wel van u horen wat u denkt; want wat deze sekte betreft, ons is bekend dat er overal tegen gesproken wordt.","23":"En toen zij hem een dag hadden vastgesteld, kwamen er velen naar hem toe in zijn woonplaats; hij legde hun het Koninkrijk van God uit en getuigde ervan, en probeerde hen te overtuigen aangaande Jezus, zowel uit de wet van Mozes als uit de profeten, van 's morgens vroeg tot 's avonds toe.","24":"En sommigen geloofden wel wat er gezegd werd, maar sommigen geloofden niet.","25":"En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,","26":"Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken.","27":"Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.","28":"Laat het u dan bekend zijn dat de zaligheid van God naar de heidenen gezonden is, en die zullen horen.","29":"En toen hij dit gezegd had, gingen de Joden weg, terwijl zij veel twist met elkaar hadden.","30":"En Paulus bleef twee volle jaren in zijn eigen gehuurde woning; en ontving allen die naar hem toe kwamen;","31":"Hij predikte het Koninkrijk van God, en onderwees over de Heere Jezus Christus, met alle vrijmoedigheid, zonder dat iemand hem daarin hinderde."},"SV":{"1":"En als zij ontkomen waren, toen verstonden zij, dat het eiland Melite heette.","2":"En de barbaren bewezen ons geen gemene vriendelijkheid; want een groot vuur ontstoken hebbende, namen zij ons allen in, om den regen, die overkwam, en om de koude.","3":"En als Paulus een hoop rijzen bijeengeraapt en op het vuur gelegd had, kwam er een adder uit door de hitte, en vatte zijn hand.","4":"En als de barbaren het beest zagen aan zijn hand hangen, zeiden zij tot elkander: Deze mens is gewisselijk een doodslager, welken de wraak niet laat leven, daar hij uit de zee ontkomen is.","5":"Maar hij schudde het beest af in het vuur, en leed niets kwaads.","6":"En zij verwachtten, dat hij zou opzwellen, of terstond dood nedervallen. Maar als zij lang gewacht hadden, en zagen, dat geen ongemak hem overkwam, werden zij veranderd, en zeiden, dat hij een god was.","7":"En hier, omtrent dezelfde plaats, had de voornaamste van het eiland, met name Publius, *zijn* landhoeven, die ons ontving, en drie dagen vriendelijk herbergde.","8":"En het geschiedde, dat de vader van Publius, met koortsen en den roden loop bevangen zijnde, te bed lag; tot denwelken Paulus inging, en als hij gebeden had, legde hij de handen op hem, en maakte hem gezond.","9":"Als dit dan geschied was, kwamen ook tot hem de anderen, die krankheden hadden in het eiland, en werden genezen.","10":"Die ons ook eerden met veel eer, en als wij vertrekken zouden, bestelden zij *ons* hetgeen van node was.","11":"En na drie maanden voeren wij af in een schip van Alexandrië, dat in het eiland overwinterd had, hebbende tot een teken, Kastor en Pollux.","12":"En als wij te Syrakuse aangekomen waren, bleven wij *aldaar* drie dagen;","13":"Van waar wij omvoeren, en kwamen aan te Regium; en alzo, na een dag, de wind zuid werd, kwamen wij den tweeden dag te Puteoli;","14":"Alwaar wij broeders vonden, en werden gebeden, zeven dagen bij hen te blijven; en alzo gingen wij naar Rome.","15":"En vandaar kwamen de broeders, van onze zaken gehoord hebbende, ons tegemoet tot Appiusmarkt, en de drie tabernen; welke Paulus ziende, dankte hij God en greep moed.","16":"En toen wij te Rome gekomen waren, gaf de hoofdman de gevangenen over aan den overste des legers; maar aan Paulus werd toegelaten op zichzelven te wonen met den krijgsknecht, die hem bewaarde.","17":"En het geschiedde na drie dagen dat Paulus samenriep degenen, die de voornaamsten der Joden waren. En als zij samengekomen waren, zeide hij tot hen: Mannen broeders, ik, die niets gedaan heb tegen het volk of de vaderlijke gewoonten, ben gebonden uit Jeruzalem overgeleverd in de handen der Romeinen;","18":"Dewelken, mij onderzocht hebbende, wilden *mij* loslaten, omdat geen schuld des doods in mij was.","19":"Maar als de Joden *zulks* tegenspraken, werd ik genoodzaakt mij op den keizer te beroepen; *doch* niet, alsof ik iets had, mijn volk te beschuldigen.","20":"Om deze oorzaak dan heb ik u bij mij geroepen, om *u* te zien en aan te spreken; want vanwege de hope Israëls ben ik met deze keten omvangen.","21":"Maar zij zeiden tot hem: Wij hebben noch brieven u aangaande van Judea ontvangen; noch iemand van de broeders, hier gekomen zijnde, heeft van u iets kwaads geboodschapt of gesproken.","22":"Maar wij begeren wel van u te horen, wat gij gevoelt; want wat deze sekte aangaat, ons is bekend, dat zij overal tegengesproken wordt.","23":"En als zij hem een dag gesteld hadden, kwamen er velen tot hem in *zijn* woonplaats; denwelken hij het Koninkrijk Gods uitlegde, en betuigde, en poogde hen te bewegen tot het geloof in Jezus, beide uit de wet van Mozes en de profeten, van des morgens vroeg tot den avond toe.","24":"En sommigen geloofden wel, hetgeen gezegd werd, maar sommigen geloofden niet.","25":"En tegen elkander oneens zijnde, scheidden zij; als Paulus *dit* ene woord gezegd had, *namelijk*: Wel heeft de Heilige Geest gesproken door Jesaja, den profeet, tot onze vaderen,","26":"Zeggende: Ga heen tot dit volk, en zeg: Met het gehoor zult gij horen, en geenszins verstaan; en ziende zult gij zien, en geenszins bemerken.","27":"Want het hart dezes volks is dik geworden, en met de oren hebben zij zwaarlijk gehoord, en hun ogen hebben zij toegedaan; opdat zij niet te eniger tijd met de ogen zouden zien, en met de oren horen, en met het hart verstaan, en zij zich bekeren, en Ik hen geneze.","28":"Het zij u dan bekend, dat de zaligheid Gods den heidenen gezonden is, en dezelve zullen horen.","29":"En als hij dit gezegd had, gingen de Joden weg, veel twisting hebbende onder elkander.","30":"En Paulus bleef twee gehele jaren in zijn eigen gehuurde woning; en ontving allen, die tot hem kwamen ;","31":"Predikende het Koninkrijk Gods, en lerende van den Heere Jezus Christus met alle vrijmoedigheid, onverhinderd."},"KJV":{"1":"And when they were escaped, then they knew that the island was called Melita.","2":"And the barbarous people shewed us no little kindness: for they kindled a fire, and received us every one, because of the present rain, and because of the cold.","3":"And when Paul had gathered a bundle of sticks, and laid *them* on the fire, there came a viper out of the heat, and fastened on his hand.","4":"And when the barbarians saw the *venomous* beast hang on his hand, they said among themselves, No doubt this man is a murderer, whom, though he hath escaped the sea, yet vengeance suffereth not to live.","5":"And he shook off the beast into the fire, and felt no harm.","6":"Howbeit they looked when he should have swollen, or fallen down dead suddenly: but after they had looked a great while, and saw no harm come to him, they changed their minds, and said that he was a god.","7":"In the same quarters were possessions of the chief man of the island, whose name was Publius; who received us, and lodged us three days courteously.","8":"And it came to pass, that the father of Publius lay sick of a fever and of a bloody flux: to whom Paul entered in, and prayed, and laid his hands on him, and healed him.","9":"So when this was done, others also, which had diseases in the island, came, and were healed:","10":"Who also honoured us with many honours; and when we departed, they laded *us* with such things as were necessary.","11":"And after three months we departed in a ship of Alexandria, which had wintered in the isle, whose sign was Castor and Pollux.","12":"And landing at Syracuse, we tarried *there* three days.","13":"And from thence we fetched a compass, and came to Rhegium: and after one day the south wind blew, and we came the next day to Puteoli:","14":"Where we found brethren, and were desired to tarry with them seven days: and so we went toward Rome.","15":"And from thence, when the brethren heard of us, they came to meet us as far as Appii forum, and The three taverns: whom when Paul saw, he thanked God, and took courage.","16":"And when we came to Rome, the centurion delivered the prisoners to the captain of the guard: but Paul was suffered to dwell by himself with a soldier that kept him.","17":"And it came to pass, that after three days Paul called the chief of the Jews together: and when they were come together, he said unto them, Men *and* brethren, though I have committed nothing against the people, or customs of our fathers, yet was I delivered prisoner from Jerusalem into the hands of the Romans.","18":"Who, when they had examined me, would have let *me* go, because there was no cause of death in me.","19":"But when the Jews spake against *it*, I was constrained to appeal unto Caesar; not that I had ought to accuse my nation of.","20":"For this cause therefore have I called for you, to see *you*, and to speak with *you*: because that for the hope of Israel I am bound with this chain.","21":"And they said unto him, We neither received letters out of Judaea concerning thee, neither any of the brethren that came shewed or spake any harm of thee.","22":"But we desire to hear of thee what thou thinkest: for as concerning this sect, we know that every where it is spoken against.","23":"And when they had appointed him a day, there came many to him into *his* lodging; to whom he expounded and testified the kingdom of God, persuading them concerning Jesus, both out of the law of Moses, and *out of* the prophets, from morning till evening.","24":"And some believed the things which were spoken, and some believed not.","25":"And when they agreed not among themselves, they departed, after that Paul had spoken one word, Well spake the Holy Ghost by Esaias the prophet unto our fathers,","26":"Saying, Go unto this people, and say, Hearing ye shall hear, and shall not understand; and seeing ye shall see, and not perceive:","27":"For the heart of this people is waxed gross, and their ears are dull of hearing, and their eyes have they closed; lest they should see with *their* eyes, and hear with *their* ears, and understand with *their* heart, and should be converted, and I should heal them.","28":"Be it known therefore unto you, that the salvation of God is sent unto the Gentiles, and *that* they will hear it.","29":"And when he had said these words, the Jews departed, and had great reasoning among themselves.","30":"And Paul dwelt two whole years in his own hired house, and received all that came in unto him,","31":"Preaching the kingdom of God, and teaching those things which concern the Lord Jesus Christ, with all confidence, no man forbidding him."}},"tsk":{"1":[{"kopje":"het eiland","refs":["Hand 27:26","Hand 27:44"]}],"2":[{"kopje":"inwoners","refs":["Hand 28:4","Rom 1:14","1 Kor 14:11","Kol 3:11"]},{"kopje":"bewezen","refs":["Hand 27:3","Lev 19:18","Lev 19:34","Spr 24:11","Spr 24:12","Matt 10:42","Luk 10:30-37","Rom 2:14","Rom 2:15","Rom 2:27","Hebr 13:2" n welk woord gemeend wordt, dat het tegengift, Theriaca genaamd, zijnen naam heeft, òf omdat het ook van het vlees dezer slangen gemaakt wordt, òf omdat het wederstaat het vergift van deze en dergelijke venijnige beesten."},{"catchword":"de wraak niet","tekst":"Of, de justitie; dat is de goddelijke rechtvaardigheid."}],"6":[{"catchword":"opzwellen,","tekst":"Of, ontsteken, ontbranden; namelijk door het vergift."},{"catchword":"geen ongemak","tekst":"Grieks niets ongerijmds, of, onvoegelijks."},{"catchword":"een god was","tekst":"Die namelijk in menselijke gedaante tot hen gekomen was. Zie dergelijk ongestadig oordeel der heidenen van Paulus en Barnabas, Act 14:11 , Act 14:19 ."}],"7":[{"catchword":"de voornaamste","tekst":"Grieks de eerste."},{"catchword":"Publius,","tekst":"Deze naam is een Romeinse naam, waaruit sommigen menen dat hij stadhouder der Romeinen over dit eiland is geweest. Het blijkt altoos dat hij een machtig man is geweest, die twee honderd zes en zeventig mannen drie dagen lang heeft gespijzigd en geherbergd."}],"10":[{"catchword":"van node was","tekst":"Namelijk tot onze verdere reis naar Italië."}],"11":[{"catchword":"na drie maanden","tekst":"Wat Paulus die drie maanden in Melite verder gedaan heeft, wordt hier niet beschreven; dan, het is zeker, dat hij aldaar ene gemeente heeft opgericht, die een van de standvastigste Christelijke gemeenten altijd is geweest, gelijk de kerkelijke geschiedenissen getuigen."},{"catchword":"tot een teken,","tekst":"Namelijk op het voorste of achterste van het schip, waarnaar het genaamd was, gelijk nog hedendaags de grote schepen hunne namen hebben van steden, landen, of personen, die hen zenden, of waar zij uitvaren, om die van de andere te onderscheiden."},{"catchword":"Kastor en Pollux","tekst":"Grieks Dioscourois; dat is, Jupiters zonen. Dit waren twee heidense afgoden, of sterren, alzo genaamd, van welker teken dit schip zijnen naam heeft gehad, omdat het van dezelve te beter bewaard zou worden, gelijk zij meenden; en als nog hedendaags de namen van verstorven heiligen, tot dienzelven einde, van sommigen den schepen gegeven worden."}],"12":[{"catchword":"Syracuse","tekst":"De hoofdstad van Cicilië, tegen de zee gelegen."}],"13":[{"catchword":"omvoeren,","tekst":"Namelijk om den hoek van het eiland van Cicilië naar Italië."},{"catchword":"Regium;","tekst":"Een zeer bekende stad en haven van Italië, tegenover Cicilië; alzo genaamd, gelijk vele ouden menen, omdat Cicilië met dien hoek aan Italië eertijds vast is geweest, en door grote stormen en watervloeden in deze engte van elkanders is gescheurd."},{"catchword":"Puteoli;","tekst":"Eene stad in Campanië, aan de zee gelegen, niet ver van Napels, waar zij langs de kust van Italië zeilende aankwamen; vanwaar een zeer bekwame en gebaande weg was, om te land naar Rome te reizen."}],"14":[{"catchword":"broeders vonden,","tekst":"Dat is, Christenen."},{"catchword":"Rome","tekst":"Deze stad is wel bekend. Zie Rom 1:7 ; Rev 17:18 ."}],"15":[{"catchword":"vandaar kwamen","tekst":"Namelijk van Rome."},{"catchword":"de broeders,","tekst":"Dat is, enigen uit de Christelijke gemeente, die daar alrede was eer Paulus daar kwam, gelijk ook blijkt uit den brief van Paulus aan de Romeinen tevoren geschreven. Van wie dien u opgericht is, zegt de Schrift nergens, dan dat op den pinksterdag te Jeruzalem ook geweest zijn uitlandse Romeinen; Act 2:10 ."},{"catchword":"Appiusmarkt,","tekst":"Eene plaats in Setinervelt, omtrent zestien uren gaans van Rome, alzo genaamd naar enen Appius Claudius, die van Rome af tot daartoe een gestraten weg in zijn leven had doen maken."},{"catchword":"drie tabernen;","tekst":"Een stadje, omtrent vijf of zes uren gaans nader Rome, op denzelfden weg gelegen; alzo dat sommigen der broederen aldaar Paulus verwachtten, andere nog verder tot Appiusmarkt toe, hem tegemoet gegaan waren."},{"catchword":"greep moed","tekst":"Namelijk ziende zo goeden ijver van zovele Christenen, bij wie hij hulp en troost in deze zijne gevangenschap zou vinden."}],"16":[{"catchword":"overste des","tekst":"Deze schijnt geweest te zijn de overste van de garde des keizers, welke niet alleen in het paleis des keizers de wacht hielden, maar ook aan de ene zijde van de stad enige duizenden sterk in een gesterkte plaats lagen, om den keizer in alle voorvallende zwarigheden altijd ten dienste te zijn. De Latijnen noemen hem praefectum praetorio."},{"catchword":"op zichzelven","tekst":"Namelijk in een eigen gehuurde woning. Zie vs.30. Deze vrijheid schijnt hij van dezen overste verkregen te hebben, om de goede berichten door Julius aan hem gedaan, doch zonder twijfel door Gods zonderlinge voorzienigheid, opdat Paulus alzo het Evangelie te beter zou mogen verbreiden, en een ieder toegang tot hem mocht hebben. Zie vs.30,31."},{"catchword":"met den krijgsknecht,","tekst":"Dragende daartoe aan de rechterhand een ijzeren keten, welke hij om zich gordde als hij in huis was, om te vrijer te gaan; maar uitgaande was hij met dezelve aan de linkerhand des krijgsknechts gebonden. Zie vs.20; Act 12:6 ; Eph 6:20 ."}],"17":[{"catchword":"na drie dagen","tekst":"Namelijk als hij vermoeid zijnde van de reis wat tijds gerust had."},{"catchword":"samenriep degenen,","tekst":"Namelijk omdat hij gevangen zijnde in hunne synagoge niet kon gaan."}],"19":[{"catchword":"iets had, mijn","tekst":"Namelijk voorgenomen of besloten. Want hoewel Paulus oorzaak genoeg had om de Joden over hun geweld en onrechtvaardigheid te beschuldigen, nochtans toont hij hiermede voor de Joden dat hij zulk voornemen niet had, maar alleen zichzelven behoorlijk te verdedigen."}],"20":[{"catchword":"de hope Israëls","tekst":"Dat is, de hoop der eeuwige zaligheid, door den Messias aan het volk Israëls beloofd."}],"21":[{"catchword":"geboodschapt","tekst":"Hetwelk een teken is dat de overste der Joden te Jeruzalem niet zeer gezorgd heeft hoe het met de Joden ging, die buiten het Joodse land woonden, als zij maar hunne rust en aanzien in hun land mochten behouden."}],"22":[{"catchword":"deze sekte","tekst":"Zo noemen zij den Christelijken godsdienst. Zie Act 24:5 , Act 24:14 ."},{"catchword":"overal","tekst":"Namelijk zowel bij de Joden als bij de heidenen; Luk 2:34 ."}],"23":[{"catchword":"woonplaats;","tekst":"Namelijk die hij gehuurd had, vs.16, 30."},{"catchword":"het Koninkrijk","tekst":"Dat is, de oprichting van het koninkrijk Gods door den beloofden Messias."},{"catchword":"betuigde, en","tekst":"Dat is, met getuigenissen uit de heilige Schrift zocht hij hen te overtuigen. Zie Act 2:40 , en Act 20:21 ."},{"catchword":"tot het geloof","tekst":"Grieks tot de zaken van Jezus, of Jezus aangaande."}],"25":[{"catchword":"scheidden zij;","tekst":"Of, zij worden van hem gelaten; namelijk met een voornemen van de hardnekkigen bij zich niet meer te roepen, ten ware zij zich beter bedachten."},{"catchword":"dit ene woord","tekst":"Dat is, rede, of waarschuwing; want met deze volgende waarschuwing liet hij hen gaan, om hen dezen prikkel in hun hart te laten, of zij zich daarna mochten bedenken en bekeren."},{"catchword":"de Heilige Geest","tekst":"Die Isa 6:9 deze woorden spreekt, is de Heere der heerlijkheid, gezeten op zijnen troon, omringd zijnde van zijne engelen. Waaruit blijkt dat dan de Heilige Geest deze zelfde Heere der heerlijkheid is; gelijk ook van den Zoon Gods ditzelfde betuigd wordt; Joh 12:41 . Zo zijn dan de Vader, de Zoon en de Heilige Geest, zoveel het wezen aangaat, een enig God, hoewel in personen onderscheiden."}],"26":[{"catchword":"het gehoor zult","tekst":"Zie de verklaring van deze plaats Mat 13:14 ."}],"27":[{"catchword":"dik geworden,","tekst":"Of, vet."}],"28":[{"catchword":"de zaligheid Gods","tekst":"Dat is, de zaligheid die ons volgens Gods belofte door Jezus Christus is verworven en verkondigd; of, Jezus Christus, die de bewerker is van de zaligheid; Luk 2:30 ."},{"catchword":"heidenen gezonden","tekst":"Namelijk achtervolgens het bevel van Christus, Luk 24:47 , dewijl gij Joden denzelven ve /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
