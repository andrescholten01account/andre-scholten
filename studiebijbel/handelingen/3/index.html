 en goud heb ik niet, maar wat ik heb, dat geef ik u: in de Naam van Jezus Christus de Nazarener, sta op en loop!","7":"En hij pakte hem bij de rechterhand en richtte hem op; en meteen werden zijn voeten en enkels stevig.","8":"En hij, opspringend, stond overeind en liep, en ging met hen de tempel in, lopend en springend, en God lovend.","9":"En al het volk zag hem lopen en God loven.","10":"En zij herkenden hem, dat hij het was die om een aalmoes gezeten had bij de Schone poort van de tempel; en zij werden vervuld met verbazing en ontzetting over wat hem gebeurd was.","11":"En terwijl de kreupele, die genezen was, zich vasthield aan Petrus en Johannes, liep al het volk gezamenlijk verbaasd naar hen toe, in de zuilengang die de zuilengang van Salomo genoemd wordt.","12":"En Petrus, die dit zag, antwoordde het volk: Israëlieten, wat verbaast u zich hierover, of wat kijkt u zo strak naar ons, alsof wij door onze eigen kracht of vroomheid deze man hebben laten lopen?","13":"De God van Abraham, en van Izak, en van Jakob, de God van onze vaderen, heeft Zijn Kind Jezus verheerlijkt, Die u hebt overgeleverd en verloochend voor het aangezicht van Pilatus, toen die oordeelde dat men Hem zou loslaten.","14":"Maar u hebt de Heilige en Rechtvaardige verloochend, en gevraagd dat u een moordenaar geschonken zou worden;","15":"En de Vorst van het leven hebt u gedood, Die God heeft opgewekt uit de doden; waarvan wij getuigen zijn.","16":"En door het geloof in Zijn Naam heeft Zijn Naam deze man sterk gemaakt, die u ziet en kent; en het geloof, dat door Hem is, heeft hem deze volmaakte gezondheid gegeven, in aanwezigheid van u allen.","17":"En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.","18":"Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.","19":"Kom dus tot inkeer en bekeer u, opdat uw zonden uitgewist worden, wanneer de tijden van verkwikking gekomen zijn van het aangezicht van de Heere,","20":"En Hij Jezus Christus zal gezonden hebben, Die u van tevoren gepredikt is;","21":"Die de hemel moet ontvangen tot de tijden van het herstel van alle dingen, waarover God gesproken heeft door de mond van al Zijn heilige profeten, van oudsher.","22":"Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.","23":"En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.","24":"En ook al de profeten, van Samuel af, en die daarna gevolgd zijn, zovelen als er gesproken hebben, hebben ook deze dagen van tevoren verkondigd.","25":"U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.","26":"God heeft, na Zijn Kind Jezus te hebben opgewekt, Hem eerst tot u gezonden, om u te zegenen, doordat Hij ieder van u afkeert van zijn slechte daden."},"SV":{"1":"Petrus nu en Johannes gingen te zamen op naar den tempel, omtrent de ure des gebeds, zijnde de negende *ure*;","2":"En een zeker man, die kreupel was van zijner moeders lijf, werd gedragen, welken zij dagelijks zetten aan de deur des tempels, genaamd de Schone, om een aalmoes te begeren van degenen, die in den tempel gingen;","3":"Welke, Petrus en Johannes ziende, als zij in den tempel zouden ingaan, bad, dat hij een aalmoes mocht ontvangen.","4":"En Petrus, sterk op hem ziende, met Johannes, zeide: Zie op ons.","5":"En hij hield *de* *ogen* op hen, verwachtende, dat hij iets van hen zou ontvangen.","6":"En Petrus zeide: Zilver en goud heb ik niet, maar hetgeen ik heb, dat geve ik u; in den Naam van Jezus Christus, den Nazarener, sta op en wandel!","7":"En hem grijpende bij de rechterhand richtte hij *hem* op, en terstond werden zijn voeten en enkelen vast.","8":"En hij, opspringende, stond en wandelde, en ging met hen in den tempel, wandelende en springende, en lovende God.","9":"En al het volk zag hem wandelen en God loven.","10":"En zij kenden hem, dat hij die was, die om een aalmoes gezeten had aan de Schone poort des tempels; en zij werden vervuld met verbaasdheid en ontzetting over hetgeen hem geschied was.","11":"En als de kreupele, die gezond gemaakt was, *aan* Petrus en Johannes vasthield, liep al het volk gezamenlijk tot hen in het voorhof, hetwelk Salomo’s *voorhof* genaamd wordt, verbaasd zijnde.","12":"En Petrus, *dat* ziende, antwoordde tot het volk: Gij Israëlietische mannen, wat verwondert gij u over dit, of wat ziet gij *zo* sterk op ons, alsof wij door onze eigen kracht of godzaligheid dezen hadden doen wandelen?","13":"De God Abrahams, en Izaks, en Jakobs, de God onzer vaderen, heeft Zijn Kind Jezus verheerlijkt, Welken gij overgeleverd hebt, en hebt Hem verloochend, voor het aangezicht van Pilatus, als hij oordeelde, dat men *Hem* zoude loslaten.","14":"Maar gij hebt den Heilige en Rechtvaardige verloochend, en hebt begeerd, dat u een man, die een doodslager was, zou geschonken worden;","15":"En den Vorst des levens hebt gij gedood, Welken God opgewekt heeft uit de doden; waarvan wij getuigen zijn.","16":"En door het geloof in Zijn Naam heeft Zijn Naam dezen gesterkt, dien gij ziet en kent; en het geloof, dat door Hem is, heeft hem deze volmaakte gezondheid gegeven, in uw aller tegenwoordigheid.","17":"En nu, broeders, ik weet, dat gij het door onwetendheid gedaan hebt, gelijk als ook uw oversten.","18":"Maar God heeft alzo vervuld, hetgeen Hij door den mond van al Zijn profeten te voren verkondigd had, dat de Christus lijden zou.","19":"Betert u dan, en bekeert u, opdat uw zonden mogen uitgewist worden; wanneer de tijden der verkoeling zullen gekomen zijn van het aangezicht des Heeren,","20":"En Hij gezonden zal hebben Jezus Christus, Die u tevoren gepredikt is;","21":"Welken de hemel moet ontvangen tot de tijden der wederoprichting aller dingen, die God gesproken heeft door den mond van al Zijn heilige profeten van *alle* eeuw.","22":"Want Mozes heeft tot de vaderen gezegd: De Heere, uw God, zal u een Profeet verwekken, uit uw broederen, gelijk mij; Dien zult gij horen, in alles, wat Hij tot u spreken zal.","23":"En het zal geschieden, dat alle ziel, die dezen Profeet niet zal gehoord hebben, uitgeroeid zal worden uit den volke.","24":"En ook al de profeten, van Samuël aan, en die daarna *gevolgd* *zijn*, zovelen als er hebben gesproken, die hebben ook deze dagen te voren verkondigd.","25":"Gijlieden zijt kinderen der profeten, en des verbonds, hetwelk God met onze vaderen opgericht heeft, zeggende tot Abraham: En in uw zade zullen alle geslachten der aarde gezegend worden.","26":"God, opgewekt hebbende Zijn Kind Jezus, heeft Denzelven eerst tot u gezonden, dat Hij ulieden zegenen zou, daarin dat Hij een iegelijk *van* *u* afkere van uw boosheden."},"KJV":{"1":"Now Peter and John went up together into the temple at the hour of prayer, *being* the ninth","2":"And a certain man lame from his mother's womb was carried, whom they laid daily at the gate of the temple which is called Beautiful, to ask alms of them that entered into the temple;","3":"Who seeing Peter and John about to go into the temple asked an alms.","4":"And Peter, fastening his eyes upon him with John, said, Look on us.","5":"And he gave heed unto them, expecting to receive something of them.","6":"Then Peter said, Silver and gold have I none; but such as I have give I thee: In the name of Jesus Christ of Nazareth rise up and walk.","7":"And he took him by the right hand, and lifted *him* up: and immediately his feet and ankle bones received strength.","8":"And he leaping up stood, and walked, and entered with them into the temple, walking, and leaping, and praising God.","9":"And all the people saw him walking and praising God:","10":"And they knew that it was he which sat for alms at the Beautiful gate of the temple: and they were filled with wonder and amazement at that which had happened unto him.","11":"And as the lame man which was healed held Peter and John, all the people ran together unto them in the porch that is called Solomon's, greatly wondering.","12":"And when Peter saw *it*, he answered unto the people, Ye men of Israel, why marvel ye at this? or why look ye so earnestly on us, as though by our own power or holiness we had made this man to walk?","13":"The God of Abraham, and of Isaac, and of Jacob, the God of our fathers, hath glorified his Son Jesus; whom ye delivered up, and denied him in the presence of Pilate, when he was determined to let *him* go.","14":"But ye denied the Holy One and the Just, and desired a murderer to be granted unto you;","15":"And killed the Prince of life, whom God hath raised from the dead; whereof we are witnesses.","16":"And his name through faith in his name hath made this man strong, whom ye see and know: yea, the faith which is by him hath given him this perfect soundness in the presence of you all.","17":"And now, brethren, I wot that through ignorance ye did *it*, as *did* also your rulers.","18":"But those things, which God before had shewed by the mouth of all his prophets, that Christ should suffer, he hath so fulfilled.","19":"Repent ye therefore, and be converted, that your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord;","20":"And he shall send Jesus Christ, which before was preached unto you:","21":"Whom the heaven must receive until the times of restitution of all things, which God hath spoken by the mouth of all his holy prophets since the world began.","22":"For Moses truly said unto the fathers, A prophet shall the Lord your God raise up unto you of your brethren, like unto me; him shall ye hear in all things whatsoever he shall say unto you.","23":"And it shall come to pass, *that* every soul, which will not hear that prophet, shall be destroyed from among the people.","24":"Yea, and all the prophets from Samuel and those that follow after, as many as have spoken, have likewise foretold of these days.","25":"Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed.","26":"Unto you first God, having raised up his Son Jesus, sent him to bless you, in turning away every one of you from his iniquities."}},"tsk":{"1":[{"kopje":"Petrus","refs":["Hand 4:13","Hand 8:14","Matt 17:1","Matt 26:37","Joh 13:23-25","Joh 20:2-9","Joh 21:7","Joh 21:18-22","Gal 2:9"]},{"kopje":"gingen","refs":["Hand 2:46","Hand 5:25","Luk 24:53"]},{"kopje":"het uur","refs":["Hand 10:3","Hand 10:30","Ex 29:39","Num 28:4","1 Kon 18:36","Ps 55:18","Dan 6:11","Dan 9:21","Luk 1:10","Luk 23:44-46"]}],"2":[{"kopje":"kreupel","refs":["Hand 4:22","Hand 14:8","Joh 1:9-30"]},{"kopje":"die","refs":["Luk 16:20"]},{"kopje":"genaamd","refs":["Hand 3:10"]},{"kopje":"te vragen","refs":["Hand 10:4","Hand 10:31","Luk 18:35","Joh 9:8"]}],"4":[{"kopje":"strak op hem richtte","refs":["Hand 11:6","Hand 14:9","Hand 14:10","Luk 4:20"]},{"kopje":"Kijk","refs":["Hand 3:12","Joh 5:6","Joh 11:40"]}],"6":[{"kopje":"Zilver","refs":["Matt 10:9","1 Kor 4:11","2 Kor 6:10","2 Kor 8:9","Jak 2:5"]},{"kopje":"maar","refs":["Mark 14:8","2 Kor 8:12","1 Petr 4:10"]},{"kopje":"In","refs":["Hand 3:16","Hand 4:7","Hand 9:34","Hand 16:18","Hand 19:13-16","Matt 7:22","Mark 16:17"]},{"kopje":"Jezus","refs":["Hand 2:22","Hand 2:36","Hand 4:10","Hand 10:38","Joh 19:19"]}],"8":[{"kopje":"hij","refs":["Hand 14:10","Jes 35:6","Luk 6:23","Joh 5:8","Joh 5:9","Joh 5:14"]},{"kopje":"lovend","refs":["Ps 103:1","Ps 103:2","Ps 107:20-22","Luk 17:15-18","Luk 18:43"]}],"10":[{"kopje":"zij herkenden","refs":["Hand 3:2","Hand 4:14-16","Hand 4:21","Hand 4:22","Joh 9:3","Joh 9:18-21"]},{"kopje":"zij werden","refs":["Hand 2:7","Hand 2:12","Luk 4:36","Luk 9:43","Joh 5:20"]}],"11":[{"kopje":"vasthield","ref ener,","tekst":"Zie Mat 2:23 ."}],"7":[{"catchword":"voeten en enkelen","tekst":"Grieks baseis; dat is fondamenten. Want de voeten zijn als het fondament, waarop het lichaam rust, staat en gedragen wordt."}],"8":[{"catchword":"opspringende,","tekst":"Dat is, niet alleen opstaande, maar tot een teken van volkomen genezing en van blijdschap opspringende. Zie Isa 35:6 , en Act 14:10 ."}],"11":[{"catchword":"vasthield, liep","tekst":"Dat is, zich vast omtrent hen hield, zonder van hen te wijken."},{"catchword":"Sálomo's","tekst":"Dat is, die eerst door Salomo om den tempel gebouwd was, en daarna, met den tempel verwoest zijnde, wederom op dezelfde plaats opgebouwd was, en daarom den naam van Salomo had behouden. Zie 1Ki 6:3 ; Joh 10:23 ; Act 5:12 ."}],"12":[{"catchword":"antwoordde tot","tekst":"Dat is, sprak."},{"catchword":"godzaligheid","tekst":"Namelijk alsof wij door dezelfde dit zouden verdiend hebben."}],"13":[{"catchword":"De God Abrahams,","tekst":"Dat is, de ware God, die zich aan deze patriarchen en voorvaders geopenbaard, met hen en hunne nakomelingen een verbond gemaakt heeft, en die van hen is gekend en gediend geweest. Zie Act 5:30 ; Phi 2:9 ."},{"catchword":"Kind Jezus","tekst":"Of, knecht, dienaar. Zie Isa 53:11 , en, vs.26, en Act 4:27 ."},{"catchword":"verheerlijkt,","tekst":"Namelijk Hem van de doden opgewekt en in den hemel tot de hoogste eer opgenomen hebbende, en door onzen dienst dusdanige wonderen doende."},{"catchword":"verloochend,","tekst":"Namelijk dat Hij uw koning was; Joh 19:15 ."}],"14":[{"catchword":"den Heilige","tekst":"Zie Act 2:27 ."},{"catchword":"een man, die","tekst":"Namelijk Bar-Abbas. Zie Mar 15:7 ."}],"15":[{"catchword":"den Vorst des","tekst":"Dat is, die enige leidsman is, om de mensen door zijn verdiensten en krachtige werkingen tot het eeuwige leven te brengen. Zie Act 4:12 ."},{"catchword":"waarvan wij getuigen","tekst":"Dat is, van welke zaak, of van welken Christus."}],"16":[{"catchword":"in Zijn Naam","tekst":"Grieks zijns naams; dat is, dewijl hij in den naam van Christus geloofd heeft, gelijk in het volgende verklaard wordt. Zie Mar 11:22 ; Rom 3:22 ."},{"catchword":"Zijn Naam dezen","tekst":"Dat is, deze Jezus Christus zelf, in wiens naam en door wiens kracht dit wonder geschied is."},{"catchword":"gesterkt, dien","tekst":"Dat is, zijne voeten vastgemaakt, dat hij nu op dezelfde staan en gaan kan."},{"catchword":"door Hem is,","tekst":"Of, in Hem."},{"catchword":"volmaakte gezondheid","tekst":"Namelijk van al Zijn leden, die Hij nu ten volle kan gebruiken."}],"17":[{"catchword":"onwetendheid","tekst":"Dit zegt hij om hen te troosten met de hoop van vergeving, alzo zij niet tegen de Heiligen Geest gezondigd hadden. Zie Luk 23:34 ; Joh 16:3 ; 1Co 2:8 ; 1Ti 1:13 ."},{"catchword":"oversten","tekst":"Dit moet verstaan worden van sommigen derzelven, van welken de apostel spreekt 1Co 2:8 ; want van sommigen getuigt Christus dat zij tegen den Heiligen Geest gezondigd hebben; Mat 12:30-32 ."}],"19":[{"catchword":"der verkoeling","tekst":"Dat is, der verkwikking van de gelovigen, die de hitte der vervolgingen in deze wereld onderworpen zijn; Psa 66:12 ; Isa 28:12 ; Jer 6:16 ."}],"20":[{"catchword":"gezonden zal","tekst":"Namelijk voor de tweede reis, of in zijn tweede toekomst ten oordeel."},{"catchword":"tevoren gepredikt","tekst":"Anders, tevoren besteld, geschikt, geordineerd."}],"21":[{"catchword":"ontvangen","tekst":"Dat is, ontvangen hebbende, behouden."},{"catchword":"tot de tijden","tekst":"Dat is, tot den dag des algemenen oordeels, op welken alle dingen, dienu om der zonden wil der ijdelheid onderworpen zijn, weder terecht zullen gebracht en hersteld worden; Rom 8:20 ; 2Pe 3:13 , of, totdat alles volkomen zal vervuld zijn, wat door de profeten is voorzegd geweest."},{"catchword":"van alle eeuw","tekst":"Dat is, eertijds in voortijden; of van het begin der eeuwen; Joh 9:32 . Onder dezen is ook geweest Enoch; Jud 1:14 ."}],"22":[{"catchword":"een Profeet","tekst":"Dat is, een uitnemend leraar, op een bijzondere wijze van God gezonden."},{"catchword":"gelijk mij;","tekst":"Dat is, mij gelijk zijnde naar de menselijke natuur, en in uitnemendheid van bijzondere zending, getrouwheid en wonderen; doch hem in veel ook teboven gaande. Zie Deu 18:15 ; Heb 3:2-5 ."},{"catchword":"in alles, wat","tekst":"Of, naar alles."}],"23":[{"catchword":"uitgeroeid zal","tekst":"Of, verdelgd, vernield; Mozes zegt, Deu 18:19 , van dien wil ik het eisen; dat is, ik zal hem straffen, namelijk gelijk hier verklaard wordt, met uitroeiing uit mijn volk; Heb 2:2-3 ."}],"24":[{"catchword":"van Samuël aan,","tekst":"Hoewel vóór Samuëls tijd na Mozes ook enige profeten geweest zijn, zo wil nochtans Petrus dat men voornamelijk zal zien op Samuël en de profeten, die na hem geweest zijn, ten tijde der koningen en daarna, alzo deze klaarder van Christus hebben geprofeteerd; Act 10:43 ."}],"25":[{"catchword":"kinderen der","tekst":"Dat is, afkomstig van de profeten; of, wien de profeten voornamelijk zijn gezonden geweest."},{"catchword":"verbonds, hetwelk","tekst":"Of, testaments. Zie Gen 17:7 ; Rom 9:4 ."},{"catchword":"met onze vaderen","tekst":"Of, tot onze vaderen."},{"catchword":"geslachten der","tekst":"Dat is, volken. Waarvan zie nadere verklaring Gal 3:8 ; Gen 22:18 ."}],"26":[{"catchword":"opgewekt hebbende","tekst":"Namelijk uit de doden; of verwekt, dat is, in de wereld gezonden; Act 13:22-23 ."},{"catchword":"Kind Jezus,","tekst":"Of, knecht, dienaar. Zie vs.13."},{"catchword":"tot u gezonden,","tekst":"Namelijk Joden en burgers van Jeruzalem; Act 13:46 ."},{"catchword":"zegenen zou,","tekst":"Namelijk met genade in dit leven en met heerlijkheid in het toekomende."},{"catchword":"daarin dat Hij","tekst":"Of, daarin een iegelijk van u zich afkere van zijne boosheden. Doch het eerste komt beter overeen met het woord zegenen, gelijk ook met dergelijke plaats Act 5:31 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now Peter and John went up to the Temple together, about the hour of prayer, [Namely in which besides prayers, the daily Evening-sacrifice was also offered up. See Exod. 29. 38, 39.] being the ninth (hour.) [namely after Sun-rising, to wit, when that hour was now ended, agreeing with our third hour after noon. See John 11. 9. Acts 2. 15.]"}],"2":[{"catchword":null,"tekst":"And a certain man, [Namely, of above fourty years old, Acts 4. 22.] who was a cripple from his mothers womb, was carried, whom they daily set at the door of the Temple called the beautifull, [This was one of the gates of the Court, and as it seems the great gate which stood towards the East, so called for its beauty and costliness. See Joseph.antiq.lib.15.cap. 14.] to desire an alms [to let the poor beg was by God forbidden amongst his people, Deu. 15. 4.so that this also was a sign, that at that time the Laws of God were very much faln to decay amongst the Jews] of those that went into the Temple."}],"3":[{"catchword":null,"tekst":"Who seeing Peter and John, as they were about to enter into the Temple, intreated that he might receive an alms."}],"4":[{"catchword":null,"tekst":"And Peter looking strongly upon him with John, said, look on us."}],"5":[{"catchword":null,"tekst":"And he kept (his eyes) on them, expecting to receive something. [That is, some alms.]"}],"6":[{"catchword":null,"tekst":"And Peter said, silver and gold I have not: but that which I have that I give thee, in the name of Jesus Christ [That is, by Christs command and power, or trusting on the promises and power of Christ] of Nazareth, [see Mat. 2. 23.] arise and walk."}],"7":[{"catchword":null,"tekst":"And taking him by the right hand, he lift (him) up, and straightway hie feet [Gr.baseis, i.e.foundations, for the feet are as the foundation on which the body rests, stands, and is born] and ankles were firm."}],"8":[{"catchword":null,"tekst":"And he leaping up, [That is, not only arising, but for a token of being perfectly cured, and of joy, leaping up. See Esa. 35. 6.and Acts 14. 10.] stood and walked, and went with them into the Temple, walking and leaping, and praising God."}],"9":[{"catchword":null,"tekst":"And all the people saw him walk and praise God."}],"10":[{"catchword":null,"tekst":"And they knew him that it was he, that had sate for an alms at the beautifull gate of the Temple; and they were filled with amazement and astonishment at that which was happened unto him."}],"11":[{"catchword":null,"tekst":"And as the cripple which was healed held fast (on) Peter and John, [Kept him fast about them, without departing from them] all the people ran together unto them into the Court, which is called Solomons (Court) [That is, which was first built about the Temple by Solomon, and afterwards being laid waste with the Temple, was built up again in the same place, and therefore had kept the name of Solomons. See I Kings 6. 3. John 10. 23. Acts 5. 12.] being amazed."}],"12":[{"catchword":null,"tekst":"And Peter seeing (that) answered, [That is, spake] unto the people, ye men of Israel, why wonder ye at this? Or why look ye (so) strongly on us, as if we by our power or godliness, [namely, as if by the same we had deserved this] had made this (man) to walk?"}],"13":[{"catchword":null,"tekst":"The God of Abraham, and of Isaac, and of Jacob, [That is, the true God, who revealed himself to these Patriarchs and fore fathers, made covenant with them and their prosterity, and who was known and served by them. See Acts 5. 30.and Phil. 2. 9.] the God of our Fathers hath glorified, [namely, having raised him from the dead, and taken him unto the highest honour in heaven, and by our ministrey doing such like miracles] his child Jesus [or servant, minister, see Isa. 53. 11.and here v. 6.and Acts 4.v. 27.] whom ye delivered over, and denied him, [namely, that he was your King, John 19. 15.] before the face of Pilate. When he judged that he should be realeased."}],"14":[{"catchword":null,"tekst":"But ye denied the holy, [See Acts 2. 27.] and the just (one) and desired that a man, [namely, Barabbas, See Mark 15. 7.] who was a murderer, should be given unto you."}],"15":[{"catchword":null,"tekst":"And ye killed the Prince of Life, [That is, who is the only guide, by his merits and powerfull operations to bring men to eternal life. See Acts 4. 12.] whom God hath raised from the dead: whereof we are witnesses. [that is, of which thing, or of which Christ.]"}],"16":[{"catchword":null,"tekst":"And by faith in his name, [Gr.of his name, i.e. seeing he believed in the name of Christ as is expounded in the following (words) See Mark 11. 22. Rom. 3. 22.] hi name [that is, this Jesus Christ himself, in whose name and by whose power this miracle is done] hath strengthened this (man,) [that is, made his feet firm, that he can now stand and goe on the same] whom ye see and know: and the saith that is by him, [or in him] hath given him this perfect soundness, [namely of all his members, which he can now fully make use of] in presence of you all."}],"17":[{"catchword":null,"tekst":"And now, Brethren, I know, that through ignorance ye did it, [This he saith to comfort them with hope of forgiveness, seeing they had not sinned against the Holy Ghost. See Luke 23. 34. John 16. 3. 1 Cor. 2. 8. 1 Tim.1. 13.] like as also your Rulers [this must be understood of some of them, whom the Apostle speaketh, 1 Cor. 2. 8.for of some Christ testifieth that they sinned against the Holy Ghost, Mat. 12. 30, 31, 32.]"}],"18":[{"catchword":null,"tekst":"But God hath thus fulfilled that which he had before declared by the mouth of all his Prophets, that the Christ should suffer."}],"19":[{"catchword":null,"tekst":"Amend therefore and he converted, that your sins may be wiped out, when the times of refreshing shall be come, [that is, of the reviving of the faithfull, who are subject to the heat of persecutions in this world, Psa. 66. 12. Isa. 28. 12. Jer. 6. 16.] from the face of the Lord."}],"20":[{"catchword":null,"tekst":"And he shall have s // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
