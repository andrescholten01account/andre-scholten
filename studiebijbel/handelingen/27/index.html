<style>

</style>

t de winden ons tegen waren.","5":"En nadat wij de zee langs Cilicië en Pamfylië waren doorgevaren, kwamen wij aan te Myra in Lycië.","6":"En de hoofdman, die daar een schip van Alexandrië vond dat naar Italië voer, liet ons daarin overgaan.","7":"En toen wij vele dagen langzaam voortvoeren, en nauwelijks tegenover Knidus gekomen waren, omdat de wind ons niet toeliet, voeren wij onder Kreta heen, tegenover Salmone.","8":"En terwijl wij daar nauwelijks voorbij zeilden, kwamen wij op een plaats die Schonehavens heet, waar de stad Lasea dichtbij was.","9":"En toen er veel tijd verlopen was, en de vaart nu gevaarlijk was, omdat ook de vasten al voorbij was, vermaande Paulus hen,","10":"en zei tegen hen: Mannen, ik zie dat deze vaart met hinder en grote schade gepaard zal gaan, niet alleen van de lading en van het schip, maar ook van ons leven.","11":"Maar de hoofdman geloofde de stuurman en de schipper meer dan wat door Paulus gezegd werd.","12":"En omdat de haven ongeschikt was om te overwinteren, vond het merendeel het beter om ook vandaar te varen, om te proberen Fenix te bereiken en daar te overwinteren, een haven van Kreta, die uitziet naar het zuidwesten en het noordwesten.","13":"En toen de zuidenwind zacht waaide, meenden zij hun doel bereikt te hebben, en voeren af en zeilden dicht langs Kreta heen.","14":"Maar niet lang daarna sloeg er tegen het schip een stormwind op, genaamd Euroklydon.","15":"En toen het schip daardoor werd meegesleurd en niet tegen de wind in kon opzeilen, gaven wij het op en dreven met de wind mee.","16":"En toen wij onder een klein eiland liepen, genaamd Klauda, konden wij nauwelijks de boot meester worden.","17":"Nadat zij die opgehaald hadden, gebruikten zij hulpmiddelen om het schip te ondergorden; en omdat zij bang waren dat zij op de ondiepten van Syrtis zouden lopen, streken zij het zeil, en dreven zo verder.","18":"En omdat wij door het noodweer geweldig heen en weer geslingerd werden, gooiden zij de volgende dag lading overboord;","19":"en op de derde dag wierpen wij met onze eigen handen het scheepsgereedschap overboord.","20":"En toen noch zon noch sterren gedurende vele dagen verschenen, en er geen klein noodweer op ons drukte, werd ons uiteindelijk alle hoop om gered te worden ontnomen.","21":"En toen men lange tijd zonder eten geweest was, stond Paulus op in hun midden en zei: Mannen, u had wel naar mij moeten luisteren en niet van Kreta moeten afvaren, dan had u deze hinder en deze schade voorkomen.","22":"Maar nu vermaan ik u om moed te houden; want er zal geen enkel leven onder u verloren gaan, alleen het schip.","23":"Want deze zelfde nacht heeft bij mij gestaan een engel van God, van Wie ik ben en Die ik ook dien,","24":"en zei: Wees niet bang, Paulus, u moet voor de keizer gesteld worden; en zie, God heeft u allen geschonken die met u varen.","25":"Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.","26":"Maar wij moeten op een zeker eiland stranden.","27":"Toen nu de veertiende nacht gekomen was, terwijl wij op de Adriatische zee heen en weer gedreven werden, vermoedden de scheepslieden omstreeks middernacht dat er land in de buurt kwam.","28":"En zij wierpen het dieplood uit en vonden twintig vademen; en nadat zij een weinig verder gevaren waren, wierpen zij het dieplood opnieuw uit en vonden vijftien vademen.","29":"En omdat zij bang waren dat zij ergens op harde plaatsen zouden lopen, wierpen zij vier ankers van het achterschip uit, en wensten dat het dag werd.","30":"Maar toen de scheepslieden probeerden uit het schip te vluchten en de boot neerlieten in de zee, onder het voorwendsel alsof zij uit het voorschip de ankers zouden uitbrengen,","31":"zei Paulus tegen de hoofdman en tegen de soldaten: Als dezen niet in het schip blijven, kunt u niet gered worden.","32":"Toen hakten de soldaten de touwen van de boot af, en lieten haar vallen.","33":"En terwijl het dag zou worden, vermaande Paulus hen allen om voedsel te nemen, en zei: Het is vandaag de veertiende dag dat u wachtend blijft zonder eten, en niets hebt genomen.","34":"Daarom vermaan ik u voedsel te nemen, want dat dient tot uw behoud; want niemand van u zal een haar van zijn hoofd verliezen.","35":"En toen hij dit gezegd had en brood genomen had, dankte hij God in aanwezigheid van allen; en nadat hij het gebroken had, begon hij te eten.","36":"En zij werden allen goedsmoeds en namen ook zelf voedsel.","37":"Wij waren nu in het schip in totaal tweehonderdzesenzeventig zielen.","38":"En toen zij verzadigd waren van het voedsel, maakten zij het schip lichter door het koren in zee te werpen.","39":"En toen het dag werd, herkenden zij het land niet; maar zij zagen een zekere inham met een oever, waarop zij, als het kon, het schip wilden laten aanlopen.","40":"En nadat zij de ankers opgehaald hadden, gaven zij het schip aan de zee over, en maakten meteen de roerbanden los; en na het razeil naar de wind te hebben opgehaald, hielden zij koers naar de oever.","41":"Maar zij liepen vast op een plaats waar de zee aan beide zijden kwam, en zetten het schip daarop vast; en het voorschip bleef onbeweeglijk vastzitten, maar het achterschip brak stuk door het geweld van de golven.","42":"De soldaten hadden nu het plan om de gevangenen te doden, opdat niemand zou wegzwemmen en ontsnappen.","43":"Maar de hoofdman, die Paulus wilde redden, verhinderde hun dat plan, en beval dat wie kon zwemmen, zich eerst zou afwerpen om aan land te komen;","44":"en de anderen, sommigen op planken, en sommigen op stukken van het schip. En zo gebeurde het dat zij allen behouden aan land kwamen."},"SV":{"1":"En als het besloten was, dat wij naar Italië zouden afvaren, leverden zij Paulus en enige andere gevangenen, over aan een hoofdman over honderd, met name Julius van de keizerlijke bende.","2":"En in een Adramyttenisch schip gegaan zijnde, alzo wij de plaatsen langs Azië bevaren zouden, voeren wij af; en Aristarchus, de Macedoniër van Thessalonica, was met ons.","3":"En des anderen *daags* kwamen wij aan te Sidon. En Julius, vriendelijk met Paulus handelende, liet *hem* toe tot de vrienden te gaan, om *van* *hen* bezorgd te worden.","4":"En van daar afgevaren zijnde, voeren wij onder Cyprus heen, omdat de winden *ons* tegen waren.","5":"En de zee, die langs Cilicië en Pamfylië is, doorgevaren zijnde, kwamen wij aan te Myra in Lycie.","6":"En de hoofdman, aldaar een schip gevonden hebbende van Alexandrië, dat naar Italië voer, deed ons in hetzelve overgaan.","7":"En als wij vele dagen langzaam voortvoeren, en nauwelijks tegenover Knidus gekomen waren, overmits het ons de wind niet toeliet, zo voeren wij onder Kreta heen, tegenover Salmone.","8":"En hetzelve nauwelijks voorbij zeilende, kwamen wij in een zekere plaats genaamd Schonehavens, waar de stad Lasea nabij was.","9":"En als veel tijd verlopen, en de vaart nu zorgelijk was, omdat ook de vasten nu voorbij was, vermaande hen Paulus,","10":"En zeide tot hen: Mannen, ik zie, dat de vaart zal geschieden met hinder en grote schade, niet alleen van de lading en van het schip, maar ook van ons leven.","11":"Doch de hoofdman geloofde meer den stuurman en den schipper, dan hetgeen van Paulus gezegd werd.","12":"En alzo de haven ongelegen was om te overwinteren, vond het meerder *deel* geraden ook van daar te varen, of zij enigszins te Fenix konden aankomen om te overwinteren, zijnde een haven in Kreta, strekkende tegen het zuidwesten en tegen het noordwesten.","13":"En alzo de zuidenwind zachtelijk waaide, meenden zij hun voornemen verkregen te hebben, en afgevaren zijnde, zeilden zij dicht voorbij Kreta henen.","14":"Maar niet lang daarna, sloeg tegen hetzelve een stormwind, genaamd Euroklydon.","15":"En als het schip daarmede weggerukt werd, en niet kon tegen den wind opzeilen, gaven wij het op, en dreven heen.","16":"En lopende onder een zeker eilandje, genaamd Klauda, konden wij nauwelijks de boot machtig worden.","17":"Dewelke opgehaald hebbende, gebruikten zij *alle* behulpselen, het schip ondergordende; en alzo zij vreesden, dat zij op de *droogte* Syrtis vervallen zouden, streken zij het zeil, en dreven alzo henen.","18":"En alzo wij van het onweder geweldiglijk geslingerd werden, deden zij den volgende *dag* een uitworp;","19":"En den derden *dag* wierpen wij met onze eigen handen het scheepsgereedschap uit.","20":"En als noch zon noch gesternten verschenen in vele dagen, en geen klein onweder *ons* drukte, zo werd *ons* voorts alle hoop van behouden te worden benomen.","21":"En als men langen tijd zonder eten geweest was, toen stond Paulus *op* in het midden van hen, en zeide: O mannen, men behoorde mij wel gehoor gegeven te hebben, en van Kreta niet afgevaren te zijn, en dezen hinder en deze schade verhoed te hebben;","22":"Doch alsnu vermaan ik ulieden goedsmoeds te zijn; want er zal geen verlies geschieden van *iemands* leven onder u, maar alleen van het schip.","23":"Want dezen zelfden nacht heeft bij mij gestaan een engel Gods, Wiens ik ben, Welken ook ik dien,","24":"Zeggende: Vrees niet, Paulus, gij moet voor den keizer gesteld worden; en zie, God heeft u geschonken allen, die met u varen.","25":"Daarom zijt goedsmoeds, mannen, want ik geloof Gode, dat het alzo zijn zal, gelijkerwijs het mij gezegd is.","26":"Doch wij moeten op een zeker eiland vervallen.","27":"Als nu de veertiende nacht gekomen was, alzo wij in de Adriatische zee zee herwaarts en derwaarts gedreven werden, omtrent het midden des nachts, vermoedden de scheepslieden, dat hun enig land naderde.","28":"En het dieplood uitgeworpen hebbende, vonden zij twintig vademen; en een weinig voortgevaren zijnde, wierpen zij wederom het dieplood uit, en vonden vijftien vademen;","29":"En vrezende, dat zij ergens op harde plaatsen vervallen mochten, wierpen zij vier ankers van het achterschip uit, en wensten, dat het dag werd.","30":"Maar als de scheepslieden zochten uit het schip te vlieden, en de boot nederlieten in de zee, onder den schijn, alsof zij uit het voorschip de ankers zouden uitbrengen,","31":"Zeide Paulus tot den hoofdman en tot de krijgsknechten: Indien dezen in het schip niet blijven, gij kunt niet behouden worden.","32":"Toen hieuwen de krijgsknechten de touwen af van de boot, en lieten haar vallen.","33":"En ondertussen dat het dag zou worden, vermaande Paulus *hen* allen, dat zij zouden spijze nemen, en zeide: Het is heden de veertiende dag, dat gij verwachtende blijft zonder eten, en niets hebt genomen.","34":"Daarom vermaan ik u spijze te nemen, want dat dient tot uw behouding; want niemand van u zal een haar van het hoofd vallen.","35":"En als hij dit gezegd had en brood genomen had, dankte hij God in aller tegenwoordigheid; en *hetzelve* gebroken hebbende, begon hij te eten .","36":"En zij allen, goedsmoeds geworden zijnde, namen ook zelven spijze.","37":"Wij waren nu in het schip in alles tweehonderd zes en zeventig zielen.","38":"En als zij met spijze verzadigd waren, lichtten zij het schip, en wierpen het koren uit in de zee.","39":"En toen het dag werd, kenden zij het land niet; maar zij merkten een zekeren inham, die een oever had, tegen denwelken zij geraden vonden, zo zij konden, het schip aan te zetten.","40":"En als zij de ankers opgehaald hadden, gaven zij *het* *schip* aan de zee over, meteen de roerbanden losmakende; en het razeil naar den wind opgehaald hebbende, hielden zij het naar den oever toe.","41":"Maar vervallende op een plaats, die de zee aan beide zijden had, zetten zij het schip daarop; en het voorschip, vastzittende, bleef onbewegelijk, maar het achterschip brak van het geweld der baren.","42":"De raadslag nu der krijgslieden was, dat zij de gevangenen zouden doden, opdat niemand, ontzwommen zijnde, zoude ontvlieden.","43":"Maar de hoofdman, willende Paulus behouden, belette hun dat voornemen, en beval, dat degenen, die zwemmen konden, zich eerst zouden afwerpen, en te land komen;","44":"En de anderen, sommigen op planken, en sommigen op enige *stukken* van het schip. En alzo is het geschied, dat zij allen behouden aan het land gekomen zijn."},"KJV":{"1":"And when it was determined that we should sail into Italy, they delivered Paul and certain other prisoners unto *one* named Julius, a centurion of Augustus' band.","2":"And entering into a ship of Adramyttium, we launched, meaning to sail by the coasts of Asia; *one* Aristarchus, a Macedonian of Thessalonica, being with us.","3":"And the next *day* we touched at Sidon. And Julius courteously entreated Paul, and gave *him* liberty to go unto his friends to refresh himself.","4":"And when we had launched from thence, we sailed under Cyprus, because the winds were contrary.","5":"And when we had sailed over the sea of Cilicia and Pamphylia, we came to Myra, *a city* of Lycia.","6":"And there the centurion found a ship of Alexandria sailing into Italy; and he put us therein.","7":"And when we had sailed slowly many days, and scarce were come over against Cnidus, the wind not suffering us, we sailed under Crete, over against Salmone;","8":"And, hardly passing it, came unto a place which is called The fair havens; nigh whereunto was the city *of* Lasea.","9":"Now when much time was spent, and when sailing was now dangerous, because the fast was now already past, Paul admonished","10":"And said unto them, Sirs, I perceive that this voyage will be with hurt and much damage, not only of the lading and ship, but also of our lives.","11":"Nevertheless the centurion believed the master and the owner of the ship, more than those things which were spoken by Paul.","12":"And because the haven was not commodious to winter in, the more part advised to depart thence also, if by any means they might attain to Phenice, *and there* to winter; *which is* an haven of Crete, and lieth toward the south west and north west.","13":"And when the south wind blew softly, supposing that they had obtained *their* purpose, loosing *thence*, they sailed close by Crete.","14":"But not long after there arose against it a tempestuous wind, called Euroclydon.","15":"And when the ship was caught, and could not bear up into the wind, we let *her* drive.","16":"And running under a certain island which is called Clauda, we had much work to come by the boat:","17":"Which when they had taken up, they used helps, undergirding the ship; and, fearing lest they should fall into the quicksands, strake sail, and so were driven.","18":"And we being exceedingly tossed with a tempest, the next *day* they lightened the ship;","19":"And the third *day* we cast out with our own hands the tackling of the ship.","20":"And when neither sun nor stars in many days appeared, and no small tempest lay on *us*, all hope that we should be saved was then taken away.","21":"But after long abstinence Paul stood forth in the midst of them, and said, Sirs, ye should have hearkened unto me, and not have loosed from Crete, and to have gained this harm and loss.","22":"And now I exhort you to be of good cheer: for there shall be no loss of *any man's* life among you, but of the ship.","23":"For there stood by me this night the angel of God, whose I am, and whom I serve,","24":"Saying, Fear not, Paul; thou must be brought before Caesar: and, lo, God hath given thee all them that sail with thee.","25":"Wherefore, sirs, be of good cheer: for I believe God, that it shall be even as it was told me.","26":"Howbeit we must be cast upon a certain island.","27":"But when the fourteenth night was come, as we were driven up and down in Adria, about midnight the shipmen deemed that they drew near to some country;","28":"And sounded, and found *it* twenty fathoms: and when they had gone a little further, they sounded again, and found *it* fifteen fathoms.","29":"Then fearing lest we should have fallen upon rocks, they cast four anchors out of the stern, and wished for the day.","30":"And as the shipmen were about to flee out of the ship, when they had let down the boat into the sea, under colour as though they would have cast anchors out of the foreship,","31":"Paul said to the centurion and to the soldiers, Except these abide in the ship, ye cannot be saved.","32":"Then the soldiers cut off the ropes of the boat, and let her fall off.","33":"And while the day was coming on, Paul besought *them* all to take meat, saying, This day is the fourteenth day that ye have tarried and continued fasting, having taken nothing.","34":"Wherefore I pray you to take *some* meat: for this is for your health: for there shall not an hair fall from the head of any of you.","35":"And when he had thus spoken, he took bread, and gave thanks to God in presence of them all: and when he had broken *it*, he began to eat.","36":"Then were they all of good cheer, and they also took *some* meat.","37":"And we were in all in the ship two hundred threescore and sixteen souls.","38":"And when they had eaten enough, they lightened the ship, and cast out the wheat into the sea.","39":"And when it was day, they knew not the land: but they discovered a certain creek with a shore, into the which they were minded, if it were possible, to thrust in the ship.","40":"And when they had taken up the anchors, they committed *themselves* unto the sea, and loosed the rudder bands, and hoised up the mainsail to the wind, and made toward shore.","41":"And falling into a place where two seas met, they ran the ship aground; and the forepart stuck fast, and remained unmoveable, but the hinder part was broken with the violence of the waves.","42":"And the soldiers' counsel was to kill the prisoners, lest any of them should swim out, and escape.","43":"But the centurion, willing to save Paul, kept them from *their* purpose; and commanded that they which could swim should cast *themselves* first *into the sea*, and get to land:","44":"And the rest, some on boards, and some on *broken pieces* of the ship. And so it came to pass, that they escaped all safe to land."}},"tsk":{"1":[{"kopje":"toen","refs":["Hand 19:21","Hand 23:11","Hand 25:12","Hand 25:25","Gen 50:20" oken</span> <span class=\"wl wl-kjv\" data-code=\"G5259\">with</span> the <span class=\"wl wl-kjv\" data-code=\"G970\">violence</span> of the waves.","42":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G4757\">soldiers'</span> <span class=\"wl wl-kjv\" data-code=\"G1012\">counsel</span> <span class=\"wl wl-kjv\" data-code=\"G1096\">was</span> <span class=\"wl wl-kjv\" data-code=\"G2443\">to</span> <span class=\"wl wl-kjv\" data-code=\"G615\">kill</span> the <span class=\"wl wl-kjv\" data-code=\"G1202\">prisoners,</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">lest</span> any of <span class=\"wl wl-kjv\" data-code=\"G5100\">them</span> should swim <span class=\"wl wl-kjv\" data-code=\"G1579\">out,</span> and escape.","43":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> the <span class=\"wl wl-kjv\" data-code=\"G1543\">centurion,</span> <span class=\"wl wl-kjv\" data-code=\"G1014\">willing</span> to <span class=\"wl wl-kjv\" data-code=\"G1295\">save</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul,</span> <span class=\"wl wl-kjv\" data-code=\"G2967\">kept</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them</span> from their <span class=\"wl wl-kjv\" data-code=\"G1013\">purpose;</span> <span class=\"wl wl-kjv\" data-code=\"G5037\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2753\">commanded</span> that they which <span class=\"wl wl-kjv\" data-code=\"G1410\">could</span> <span class=\"wl wl-kjv\" data-code=\"G2860\">swim</span> should <span class=\"wl wl-kjv\" data-code=\"G641\">cast</span> themselves <span class=\"wl wl-kjv\" data-code=\"G4413\">first</span> into the sea, and <span class=\"wl wl-kjv\" data-code=\"G1826\">get</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">to</span> land:","44":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G3062\">rest,</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">some</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">on</span> <span class=\"wl wl-kjv\" data-code=\"G4548\">boards,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">some</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">on</span> broken pieces <span class=\"wl wl-kjv\" data-code=\"G575\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G4143\">ship.</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3779\">so</span> it came to <span class=\"wl wl-kjv\" data-code=\"G1096\">pass,</span> that they <span class=\"wl wl-kjv\" data-code=\"G1295\">escaped</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1295\">safe</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">to</span> land."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"besloten was,","tekst":"Namelijk van Festus en zijnen Raad; Act 25:12 ."},{"catchword":"wij naar Itálië","tekst":"Hieruit, en uit het volgende verhaal blijkt dat ook Lukas, die deze Handelingen heeft beschreven, in Paulus' gezelschap op deze gehele reis geweest is."},{"catchword":"keizerlijke","tekst":"Grieks Sebastes; dat is Augustische."},{"catchword":"bende","tekst":"Van dit woord zie Act 10:1 . Deze Julius wordt gezegd een hoofdman van deze bende te zijn, omdat hij over een compagnie bevel had, die onder des keizers garde behoorde, die daarom hiertoe schijnt verkoren te zijn, opdat de gevangenen onder zijn opzicht te beter bewaard en in des keizers handen geleverd zouden worden."}],"2":[{"catchword":"Adramyttenisch schip","tekst":"Namelijk dat te Adramytte tehuis behoorde; welke in ene stad in Mysië tegenover Mytilene."},{"catchword":"Azië","tekst":"Namelijk Klein-Azië, in hetwelk Mysië ook gelegen was."},{"catchword":"bevaren zouden,","tekst":"Namelijk volgens het voornemen; hoewel zij om de tegenwinden een anderen koers hebben moeten nemen, gelijk uit het volgende verhaal blijkt."},{"catchword":"Aristarchus,","tekst":"Deze was een aanzienlijk man, die Paulus vandaar is gevolgd, welke ook in vele reizen met Paulus grote zwarigheden heeft uitgestaan, gelijk te zien is Act 19:29 , en Act 20:4 , die ook Paulus in deze gevangenis tot Rome toe gezelschap gehouden heeft, alsmede gevangen zo het schijnt, of die te Rome gekomen zijnde nevens Paulus is gevangen gezet, gelijk blijkt Col 4:10 ."},{"catchword":"Thessalonica,","tekst":"Van deze stad, zie Act 17:1 ."}],"3":[{"catchword":"Sidon","tekst":"Eene stad in Fenicië, waarvan zie Mat 11:21 ; Act 12:20 ."},{"catchword":"de vrienden te","tekst":"Dat is, de discipelen of enigen onder hen."},{"catchword":"bezorgd te worden","tekst":"Dat is alle gemak en verkwikking aangedaan te worden, of ook van enige dingen voorzien tot meerder gemak op de reis nodig."}],"4":[{"catchword":"onder Cyprus","tekst":"Of, beneden Cyprus. Van dit eiland zie Act 11:19 , en Act 13:4 ."}],"5":[{"catchword":"Cilicië","tekst":"Dit was een landschap in Klein-Azië, gelegen aan de Middellandse zee, tussen Syrië en Pamfylië; Act 6:9 , en Act 15:23 , Act 15:41 ."},{"catchword":"Pamfylië","tekst":"Van dit landschap zie ook Act 2:10 , en Act 13:13 , en Act 14:24 ."},{"catchword":"Myra in Lycië","tekst":"Eene stad in het land van Lycië, hetwelk aan Pamfylië grensde, waar dit eerste schip schijnt zijne reis voldaan te hebben."}],"6":[{"catchword":"Alexandrië,","tekst":"De hoofdstad van Egypte en Libyë, welk schip uit Egypte te Myra was gekomen, om vandaar voorts naar Italië te varen."}],"7":[{"catchword":"Knidus","tekst":"Een eiland in de Middellandse zee, tegenover Karië; anderen nemen het voor een uitstekenden hoek van Karië, tegenover Kreta."},{"catchword":"Kreta heen,","tekst":"Een eiland in dezelfde zee, hedendaags Kandië genaamd. Zie van hetzelve Tit 1:5 ."},{"catchword":"Salmóne","tekst":"Een uitstekende hoek van Kreta, tegen het oosten."}],"8":[{"catchword":"Schonehavens,","tekst":"Of Goedehavens, heden nog Boniporto genaamd, ene stad in Kreta, van de bekwaamheid harer haven alzo geheten."},{"catchword":"nabij was","tekst":"Maar wat meerder landwaarts in, gelijk Plinius getuigt, lib.4, cap.12. Doch hij noemt die Lasos."}],"9":[{"catchword":"de vasten","tekst":"Namelijk de jaarlijkse vasten der Joden, op welke de verzoening des gehelen volks door den hogepriester in het heilige der heiligen geschiedde, gelijk te zien is Lev 16:29 , en Lev 23:27 , welke dag was de tiende der zevende maand, die ten dele met onzen September, ten dele met onzen October overeenkwamen; zodat de tiende dag kwam omtrent het begin van October, na welke maand de zee bij de ouden niet werd bevaren tot het begin van Maart toe, om de kortheid der dagen en de stormen, die tussen dien tijd veel zijn. Zie Veget de re milit. lib.4, cap.39. Hetwelk dan gene gemeenschap heeft met de vastentijden, die sommigen hedendaags houden, die lang na der apostelen tijden in de oude kerk niet bekend zijn geweest."}],"10":[{"catchword":"zie, dat","tekst":"Namelijk niet alleen uit de gelegenheid des tijds, maar inzonderheid door ingeving van Gods Geest."},{"catchword":"van ons leven","tekst":"Grieks van onze zielen."}],"11":[{"catchword":"geloofde meer","tekst":"Namelijk die schijnen gemeend te hebben dat er nog enige dagen over waren, om binnen dezelve in een andere haven te kunnen komen; inzonderheid alzo de wind hun diende."}],"12":[{"catchword":"zijnde een haven","tekst":"Dit wordt hier bijgevoegd opdat men niet zou menen dat hij van Fenicië in Syrië sprak."},{"catchword":"strekkende","tekst":"Grieks ziende."},{"catchword":"tegen het zuidwesten","tekst":"Dat is, krom gelegen gelijk een halve maan, en daarom bevrijd van alle winden."}],"14":[{"catchword":"tegen hetzelve","tekst":"Namelijk eiland Kreta; het schip van hetzelve door dezen wind afgedreven zijnde."},{"catchword":"stormwind, genaamd","tekst":"Of, draaiwind, wervelwind."},{"catchword":"Euroclydon","tekst":"Dat is, een oostelijke wind, die geweldige baren verwekt."}],"15":[{"catchword":"opzeilen,","tekst":"Grieks tegen ogen."},{"catchword":"gaven wij het op,","tekst":"Dat is, lieten wij het drijven op Gods genade, waar de wind het heendreEf."}],"16":[{"catchword":"Klauda,","tekst":"Een eilandje aan het einde van Kreta tegen het westen, nu Gozo genaamd."}],"17":[{"catchword":"ondergordende;","tekst":"Namelijk met kabels en touwen, die zij onder de kiel doorbrachten, om de zijden van het schip te vaster aan elkander te binden, tegen het geweld der baren."},{"catchword":"de droogte","tekst":"Een gevaarlijke droogte, of plaat van welzand, vol draaiingen, onder Afrika in de Middellandse zee gelegen."},{"catchword":"het zeil,","tekst":"Grieks het vat: gelijk Act 10:11 ; waardoor het zeil met den spriet en de aanhangende touwen verstaan wordt."}],"18":[{"catchword":"een uitworp;","tekst":"Namelijk van den last of de koopmanschap, die in het schip was, om het schip te lichten."}],"19":[{"catchword":"scheepsgereedschap","tekst":"Namelijk van ballast, touwen, kabels, riemen, kisten, enz., hetgeen overtollig in het schip was. Want dat zij het noodzakelijke nog behouden hebben blijkt uit vs.28-30, enz."}],"20":[{"catchword":"ons drukte,","tekst":"Grieks op ons lag."}],"21":[{"catchword":"langen tijd","tekst":"Namelijk omtrent veertien dagen, vs.33."},{"catchword":"zonder eten","tekst":"Dat is, zonder gewoon maal te houden, vanwege de vrees des doods en het slingeren van het schip."},{"catchword":"verhoed te hebben","tekst":"Grieks gewonnen te hebben; dat is voorgekomen te hebben."}],"22":[{"catchword":"leven onder u,","tekst":"Grieks ziel."}],"23":[{"catchword":"Wiens ik ben,","tekst":"Namelijk Gods apostel of dienstknecht ik ben."}],"24":[{"catchword":"gesteld worden;","tekst":"Of, staan, u stellen."},{"catchword":"God heeft u","tekst":"Dat is, heeft hun het leven gegeven om uwentwil. Zie dergelijke Gen 18:32 , en Gen 19:21 ."}],"27":[{"catchword":"alzo wij in","tekst":"Of, dat wij."},{"catchword":"Adriátische zee","tekst":"Grieks Adria; welke is eigenlijk die zee, die hedendaags Golf van Venetië genaamd wordt; maar wordt ook dikwijls bij de ouden, gelijk ook hier, breder genomen, voor dat deel der Middellandse zee, hetwelk ook bovendien de zee van Cicilië en Jonië bevat. Zie Strabo lib.7."}],"28":[{"catchword":"twintig vademen;","tekst":"Namelijk diepte tot den grond."}],"29":[{"catchword":"harde plaatsen","tekst":"Of, scherpe, klipachtige."}],"30":[{"catchword":"nederlieten","tekst":"Namelijk die zij tevoren in het schip opgehaald hadden, vs.17."},{"catchword":"het voorschip","tekst":"Dat is, het voorste deel van het schip."},{"catchword":"uitbrengen","tekst":"Grieks uitstrekken."}],"31":[{"catchword":"gij kunt niet","tekst":"Want hoewel God Paulus door zijn engel beloofd had dat niemand uit het schip zou vergaan, vs.24, nochtans worden daarmede de middelen niet weggenomen, waardoor God deze zijne belofte wilde uitvoeren. En die daarin nalatig is, die gelooft God niet, maar verzoekt God."}],"33":[{"catchword":"spijze nemen,","tekst":"Grieks voedsel."},{"catchword":"niets hebt genomen","tekst":"Dat is, als niet zeer weinig; of geen maal hebt gehouden, gelijk vs.21; want anders kan een gezond mens [gelijk de geneesheren getuigen] over de zeven dagen niets wel vasten zonder sterven."}],"34":[{"catchword":"tot uw behouding;","tekst":"Namelijk om sterkte te hebben in het regeren van het schip, en om uzelf te kunnen helpen, als wij ons zullen moeten redden."},{"catchword":"een haar van","tekst":"Dat is, zal enige schade lijden aan zijn leven of gezondheid. Hebreën. Zie 1Ki 1:52 ."}],"35":[{"catchword":"dankte hij God","tekst":"Namelijk voor de weldaad, die hun God nog deed van spijs te hebben, en die te kunnen genieten tot versterking van hunne krachten, gelijk ook Christus gewoon was te doen; Mat 14:19 ; Joh 6:11 , en Paulus alle Christenen vermaant; 1Ti 4:4-5 ."}],"36":[{"catchword":"spijze","tekst":"Grieks voedsel."}],"37":[{"catchword":"zielen","tekst":"Dat is, mensen, personen; Act 2:41 , en Act 7:14 ; Ro // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
