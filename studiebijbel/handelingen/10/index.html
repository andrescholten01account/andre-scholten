<style>

    --bg-soft: #f2ead8; --border: var(--lightgray); --tekst: var(--darkgray);

  .hfdnav { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-family:sans-serif; font-size:.85rem; padding:.5rem 0; margin-bottom:1.1rem; }

  .hfdnav select { font-family:sans-serif; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:sans-serif; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
  #bibliotheekknop { padding:.3rem .7rem; font-size:1rem; line-height:1; }

     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #f0e2bd; } 100% { background: var(--bg-soft); } }
  .vnr { color: #b3a184; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: sans-serif; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:sans-serif; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  /* naslagpaneel */
  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: sans-serif; font-size: 1rem; }
  .paneel.open { display: block; }
  .ntabs { display: flex; gap: .4rem; margin-bottom: .8rem; }

  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }

  .opener { display: block; cursor: pointer; font-weight: 600; color: var(--accent-donker); padding: .2rem 0; }

  .opener::before { content: '▸ '; font-size: .75em; }

  .ond-refs { margin: .3rem 0 0; }

  .schakelnav { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }

  .alle > summary { font-size:.75rem; color:var(--accent); cursor:pointer; margin-top:.35rem; list-style:none; }

  .alle > summary:hover { text-decoration:underline; }
  .bronregel { font-size:.72rem; color:#999; margin-top:.6rem; }

  #popup { position: absolute; display: none; max-width: 380px; background: #fffdf7; border: 1px solid #c9b98a; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: .7rem .9rem; font-size: .85rem; line-height: 1.55; z-index: 20; font-family: Georgia, serif; }

  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }
  .site-footer-col { display:flex; flex-direction:column; gap:.5rem; }
  .site-footer-mid { text-align:center; }
  .site-footer-right { text-align:right; }
  .site-footer a { color:var(--secondary); text-decoration:underline; }

  footer.site { margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-family: sans-serif; font-size: .72rem; color: #999; line-height: 1.7; }
  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 3rem; } header.site h1 { font-size: 1.5rem; } }
</style>

 Joppe, en ontbied Simon, die ook Petrus genoemd wordt.","6":"Deze is te gast bij een Simon, leerlooier, die zijn huis heeft bij de zee; deze zal u zeggen wat u moet doen.","7":"En toen de engel die tot Cornelius sprak, weggegaan was, riep hij twee van zijn huisknechten, en een godvruchtige soldaat van hen die voortdurend bij hem waren;","8":"En toen hij hun alles verteld had, stuurde hij hen naar Joppe.","9":"En de volgende dag, terwijl zij onderweg waren en de stad naderden, klom Petrus op het dak om te bidden, omtrent het zesde uur.","10":"En hij werd hongerig, en wilde eten. En terwijl zij het bereidden, viel er een geestverrukking over hem.","11":"En hij zag de hemel geopend, en een zeker voorwerp op hem neerdalen, als een groot linnen laken, aan de vier hoeken gebonden, en neergelaten op de aarde;","12":"Waarin alle viervoetige *dieren* van de aarde waren, en de wilde *dieren*, en de kruipende *dieren*, en de vogels van de hemel.","13":"En er kwam een stem tot hem: Sta op, Petrus! Slacht en eet.","14":"Maar Petrus zei: Geenszins, Heere! Want ik heb nog nooit iets gegeten dat gewoon of onrein was.","15":"En er kwam opnieuw een stem, voor de tweede keer, tot hem: Wat God gereinigd heeft, moet u niet gewoon noemen.","16":"En dit gebeurde tot drie maal toe; en het voorwerp werd weer opgenomen in de hemel.","17":"En terwijl Petrus bij zichzelf twijfelde wat het gezicht dat hij gezien had toch mocht betekenen, zie, de mannen die door Cornelius gestuurd waren, hadden naar het huis van Simon gevraagd en stonden voor de poort.","18":"En zij riepen iemand en vroegen of Simon, die ook Petrus genoemd werd, daar te gast was.","19":"En terwijl Petrus over dat gezicht nadacht, zei de Geest tegen hem: Zie, drie mannen zoeken u;","20":"Sta daarom op, en ga naar beneden, en reis met hen mee, zonder te twijfelen; want Ik heb hen gezonden.","21":"En Petrus ging naar beneden naar de mannen die door Cornelius naar hem toe gestuurd waren, en zei: Zie, ik ben het die u zoekt; wat is de reden waarom u hier bent?","22":"En zij zeiden: Cornelius, een hoofdman over honderd, een rechtvaardig man, en godvrezend, en die goede getuigenis heeft van heel het volk van de Joden, is door een Goddelijke openbaring gewaarschuwd door een heilige engel om u te ontbieden in zijn huis, en om woorden van u te horen.","23":"Toen hij hen dan naar binnen geroepen had, ontving hij hen in huis. Maar de volgende dag ging Petrus met hen mee, en enkele van de broeders uit Joppe gingen met hem mee.","24":"En de volgende dag kwamen zij in Cesarea aan. En Cornelius verwachtte hen, en had zijn familie en beste vrienden bijeengeroepen.","25":"En toen het gebeurde dat Petrus binnenkwam, ging Cornelius hem tegemoet, en viel voor zijn voeten neer, en aanbad hem.","26":"Maar Petrus richtte hem op, en zei: Sta op, ik ben zelf ook maar een mens.","27":"En terwijl hij met hem sprak, ging hij naar binnen, en vond daar velen die samengekomen waren.","28":"En hij zei tegen hen: U weet hoe het een Joodse man niet toegestaan is zich aan te sluiten bij of naar een vreemde toe te gaan; maar God heeft mij getoond dat ik geen mens gewoon of onrein zou noemen.","29":"Daarom ben ik ook zonder tegenspreken gekomen, toen ik ontboden werd. Ik vraag u dan om welke reden u mij hebt ontboden.","30":"En Cornelius zei: Vier dagen geleden was ik aan het vasten tot dit uur toe, en op het negende uur bad ik in mijn huis,","31":"en zie, een man stond voor mij, in een blinkend kleed, en zei: Cornelius! Uw gebed is verhoord, en uw aalmoezen zijn voor God in gedachtenis gekomen.","32":"Zend dan naar Joppe, en ontbied Simon, die ook Petrus genoemd wordt; deze is te gast in het huis van Simon, de leerlooier, aan de zee, die, als hij hier gekomen is, tot u zal spreken.","33":"Zo heb ik dan meteen naar u gezonden, en u hebt er goed aan gedaan hier te komen. Wij zijn dan nu allen hier aanwezig voor God, om te horen alles wat u door God bevolen is.","34":"En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon;","35":"maar in ieder volk is hij die Hem vreest en gerechtigheid doet, Hem aangenaam.","36":"Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen.","37":"U weet de zaak die gebeurd is door geheel Judea, beginnend vanuit Galilea, na de doop die Johannes gepredikt heeft;","38":"namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem.","39":"En wij zijn getuigen van alles wat Hij gedaan heeft, zowel in het Joodse land als in Jeruzalem; Die zij gedood hebben door Hem aan het hout te hangen.","40":"Deze heeft God opgewekt op de derde dag, en gegeven dat Hij openbaar zou worden;","41":"niet aan al het volk, maar aan de getuigen die door God van tevoren uitgekozen waren, namelijk aan ons, die met Hem gegeten en gedronken hebben, nadat Hij uit de doden opgestaan was.","42":"En Hij heeft ons geboden aan het volk te prediken, en te betuigen dat Hij Degene is Die door God aangesteld is tot een Rechter van levenden en doden.","43":"Van Deze geven alle profeten getuigenis, dat ieder die in Hem gelooft, vergeving van zonden zal ontvangen door Zijn Naam.","44":"Terwijl Petrus deze woorden nog sprak, viel de Heilige Geest op allen die het Woord hoorden.","45":"En de gelovigen die uit de besnijdenis waren, zovelen als er met Petrus meegekomen waren, waren buiten zichzelf, omdat de gave van de Heilige Geest ook op de heidenen uitgestort werd.","46":"Want zij hoorden hen spreken in *vreemde* talen, en God groot maken. Toen antwoordde Petrus:","47":"Kan iemand soms het water weren, zodat dezen niet gedoopt zouden worden, die de Heilige Geest ontvangen hebben, evenals ook wij?","48":"En hij beval dat zij gedoopt zouden worden in de Naam van de Heere. Toen vroegen zij hem of hij enige dagen bij hen wilde blijven."},"SV":{"1":"En er was een zeker man te Cesarea, met name Cornelius, een hoofdman over honderd, uit de bende, genaamd de Italiaanse;","2":"Godzalig en vrezende God, met geheel zijn huis, en doende vele aalmoezen aan het volk, en God geduriglijk biddende.","3":"*Deze* zag in een gezicht klaarlijk, omtrent de negende ure des daags, een engel Gods tot hem inkomen, en tot hem zeggende: Cornelius!","4":"En hij, de ogen op hem houdende, en zeer bevreesd geworden zijnde, zeide: Wat is het Heere? En hij zeide tot hem: Uw gebeden en uw aalmoezen zijn tot gedachtenis opgekomen voor God.","5":"En nu, zend mannen naar Joppe, en ontbied Simon, die toegenaamd wordt Petrus.","6":"Deze ligt te huis bij een Simon, lederbereider, die *zijn* huis heeft bij de zee; deze zal u zeggen, wat gij doen moet.","7":"En als de engel, die tot Cornelius sprak, weggegaan was, riep hij twee van zijn huisknechten, en een godzaligen krijgsknecht van degenen, die gedurig bij hem waren;","8":"En als hij hun alles verhaald had, zond hij hen naar Joppe.","9":"En des anderen daags, terwijl deze reisden, en nabij de stad kwamen, klom Petrus op het dak, om te bidden, omtrent de zesde ure.","10":"En hij werd hongerig, en begeerde te eten. En terwijl zij het bereidden, viel over hem een vertrekking van zinnen.","11":"En hij zag den hemel geopend, en een zeker vat tot hem nederdalen, gelijk een groot linnen laken, aan de vier hoeken gebonden, en nedergelaten op de aarde;","12":"In hetwelk waren al de viervoetige *dieren* der aarde, en de wilde, en de kruipende *dieren*, en de vogelen des hemels.","13":"En er geschiedde een stem tot hem: Sta op, Petrus! slacht en eet.","14":"Maar Petrus zeide: Geenszins, Heere! want ik heb nooit gegeten iets, dat gemeen of onrein was.","15":"En een stem *geschiedde* wederom ten tweeden male tot hem: Hetgeen God gereinigd heeft, zult gij niet gemeen maken.","16":"En dit geschiedde tot drie maal; en het vat werd wederom opgenomen in den hemel.","17":"En alzo Petrus in zichzelven twijfelde, wat toch het gezicht mocht zijn, dat hij gezien had, ziet, de mannen, die van Cornelius afgezonden waren, gevraagd hebbende naar het huis van Simon, stonden aan de poort.","18":"En *iemand* geroepen hebbende, vraagden zij, of Simon, toegenaamd Petrus, daar te huis lag.","19":"En als Petrus over dat gezicht dacht, zeide de Geest tot hem: Zie, drie mannen zoeken u;","20":"Daarom sta op, en ga af, en reis met hen, niet twijfelende; want ik heb hen gezonden.","21":"En Petrus ging af tot de mannen die van Cornelius tot hem gezonden waren, en zeide: Ziet, ik ben het, dien gij zoekt; wat is de oorzaak, waarom gij hier zijt?","22":"En zij zeiden: Cornelius, een hoofdman over honderd, een rechtvaardig man, en vrezende God, en die *goede* getuigenis heeft van het ganse volk der Joden, is door Goddelijke openbaring vermaand van een heiligen engel, dat hij u zou ontbieden te zijnen huize, en dat hij van u woorden der zaligheid zou horen.","23":"Als hij hen dan ingeroepen had, ontving hij ze in huis. Doch des anderen daags ging Petrus met hen heen, en sommigen der broederen, die van Joppe waren, gingen met hem.","24":"En des anderen daags kwamen zij te Cesarea. En Cornelius verwachtte hen, samengeroepen hebbende die van zijn maagschap en bijzonderste vrienden.","25":"En als het geschiedde, dat Petrus inkwam, ging hem Cornelius tegemoet, en vallende aan *zijn* voeten, aanbad hij.","26":"Maar Petrus richtte hem op, zeggende: Sta op, ik ben ook zelf een mens.","27":"En met hem sprekende, ging hij in, en vond er velen, die samengekomen waren.","28":"En hij zeide tot hen: Gij weet, hoe het een Joodsen man ongeoorloofd is, zich te voegen of te gaan tot een vreemde; doch God heeft mij getoond, dat ik geen mens zou gemeen of onrein heten.","29":"Daarom ben ik ook zonder tegenspreken gekomen, ontboden zijnde. Zo vraag ik dan, om wat reden gijlieden mij hebt ontboden.","30":"En Cornelius zeide: Over vier dagen was ik vastende tot deze ure toe, en ter negende ure bad ik in mijn huis.","31":"En ziet, een man stond voor mij, in een blinkend kleed, en zeide: Cornelius! uw gebed is verhoord, en uw aalmoezen zijn voor God gedacht geworden.","32":"Zend dan naar Joppe, en ontbied Simon, die toegenaamd wordt Petrus; deze ligt te huis in het huis van Simon, den lederbereider, aan de zee, welke, hier gekomen zijnde, tot u spreken zal.","33":"Zo heb ik dan van stonde aan tot u gezonden, en gij hebt welgedaan, dat gij hier gekomen zijt. Wij zijn dan allen nu *hier* tegenwoordig voor God, om te horen al hetgeen u van God bevolen is.","34":"En Petrus, den mond opendoende, zeide: Ik verneem in der waarheid, dat God geen aannemer des persoons is;","35":"Maar in allen volke, die Hem vreest en gerechtigheid werkt, is Hem aangenaam.","36":"*Dit* *is* het woord, dat Hij gezonden heeft den kinderen Israëls, verkondigende vrede door Jezus Christus; deze is een Heere van allen.","37":"Gijlieden weet de zaak, die geschied is door geheel Judea, beginnende van Galilea, na den doop, welken Johannes gepredikt heeft;","38":"*Belangende* Jezus van Nazareth, hoe Hem God gezalfd heeft met den Heiligen Geest en met kracht; Welke *het* *land* doorgegaan is, goeddoende, en genezende allen, die van den duivel overweldigd waren; want God was met Hem.","39":"En wij zijn getuigen van al hetgeen Hij gedaan heeft, beide in het Joodse land en te Jeruzalem; Welken zij gedood hebben, *Hem* hangende aan het hout.","40":"Dezen heeft God opgewekt ten derden dage, en gegeven, dat Hij openbaar zou worden;","41":"Niet al den volke, maar den getuigen, die van God te voren verkoren waren, ons *namelijk*, die met Hem gegeten en gedronken hebben, nadat Hij uit de doden opgestaan was.","42":"En heeft ons geboden den volke te prediken, en te betuigen, dat Hij is Degene, Die van God verordend is tot een Rechter van levenden en doden.","43":"Dezen geven getuigenis al de profeten, dat een iegelijk, die in Hem gelooft, vergeving der zonden ontvangen zal door Zijn Naam.","44":"Als Petrus nog deze woorden sprak, viel de Heilige Geest op allen, die het Woord hoorden.","45":"En de gelovigen, die uit de besnijdenis waren, zovelen als met Petrus gekomen waren, ontzetten zich, dat de gave des Heiligen Geestes ook op de heidenen uitgestort werd.","46":"Want zij hoorden hen spreken met *vreemde* talen, en God groot maken. Toen antwoordde Petrus:","47":"Kan ook iemand het water weren, dat dezen niet gedoopt zouden worden, welke den Heiligen Geest ontvangen hebben, gelijk als ook wij?","48":"En hij beval, dat zij zouden gedoopt worden in den Naam des Heeren. Toen baden zij hem, dat hij enige dagen bij *hen* wilde blijven."},"KJV":{"1":"There was a certain man in Caesarea called Cornelius, a centurion of the band called the Italian","2":"*A* devout *man*, and one that feared God with all his house, which gave much alms to the people, and prayed to God alway.","3":"He saw in a vision evidently about the ninth hour of the day an angel of God coming in to him, and saying unto him, Cornelius.","4":"And when he looked on him, he was afraid, and said, What is it, Lord? And he said unto him, Thy prayers and thine alms are come up for a memorial before God.","5":"And now send men to Joppa, and call for *one* Simon, whose surname is Peter:","6":"He lodgeth with one Simon a tanner, whose house is by the sea side: he shall tell thee what thou oughtest to do.","7":"And when the angel which spake unto Cornelius was departed, he called two of his household servants, and a devout soldier of them that waited on him continually;","8":"And when he had declared all *these* things unto them, he sent them to Joppa.","9":"On the morrow, as they went on their journey, and drew nigh unto the city, Peter went up upon the housetop to pray about the sixth hour:","10":"And he became very hungry, and would have eaten: but while they made ready, he fell into a trance,","11":"And saw heaven opened, and a certain vessel descending unto him, as it had been a great sheet knit at the four corners, and let down to the earth:","12":"Wherein were all manner of fourfooted beasts of the earth, and wild beasts, and creeping things, and fowls of the air.","13":"And there came a voice to him, Rise, Peter; kill, and eat.","14":"But Peter said, Not so, Lord; for I have never eaten any thing that is common or unclean.","15":"And the voice *spake* unto him again the second time, What God hath cleansed, *that* call not thou common.","16":"This was done thrice: and the vessel was received up again into heaven.","17":"Now while Peter doubted in himself what this vision which he had seen should mean, behold, the men which were sent from Cornelius had made enquiry for Simon's house, and stood before the gate,","18":"And called, and asked whether Simon, which was surnamed Peter, were lodged there.","19":"While Peter thought on the vision, the Spirit said unto him, Behold, three men seek thee.","20":"Arise therefore, and get thee down, and go with them, doubting nothing: for I have sent them.","21":"Then Peter went down to the men which were sent unto him from Cornelius; and said, Behold, I am he whom ye seek: what *is* the cause wherefore ye are come?","22":"And they said, Cornelius the centurion, a just man, and one that feareth God, and of good report among all the nation of the Jews, was warned from God by an holy angel to send for thee into his house, and to hear words of thee.","23":"Then called he them in, and lodged *them*. And on the morrow Peter went away with them, and certain brethren from Joppa accompanied him.","24":"And the morrow after they entered into Caesarea. And Cornelius waited for them, and had called together his kinsmen and near friends.","25":"And as Peter was coming in, Cornelius met him, and fell down at his feet, and worshipped","26":"But Peter took him up, saying, Stand up; I myself also am a man.","27":"And as he talked with him, he went in, and found many that were come together.","28":"And he said unto them, Ye know how that it is an unlawful thing for a man that is a Jew to keep company, or come unto one of another nation; but God hath shewed me that I should not call any man common or unclean.","29":"Therefore came I *unto you* without gainsaying, as soon as I was sent for: I ask therefore for what intent ye have sent for me?","30":"And Cornelius said, Four days ago I was fasting until this hour; and at the ninth hour I prayed in my house, and, behold, a man stood before me in bright clothing,","31":"And said, Cornelius, thy prayer is heard, and thine alms are had in remembrance in the sight of God.","32":"Send therefore to Joppa, and call hither Simon, whose surname is Peter; he is lodged in the house of *one* Simon a tanner by the sea side: who, when he cometh, shall speak unto thee.","33":"Immediately therefore I sent to thee; and thou hast well done that thou art come. Now therefore are we all here present before God, to hear all things that are commanded thee of God.","34":"Then Peter opened *his* mouth, and said, Of a truth I perceive that God is no respecter of persons:","35":"But in every nation he that feareth him, and worketh righteousness, is accepted with him.","36":"The word which *God* sent unto the children of Israel, preaching peace by Jesus Christ: (he is Lord of all:)","37":"That word, *I say*, ye know, which was published throughout all Judaea, and began from Galilee, after the baptism which John preached;","38":"How God anointed Jesus of Nazareth with the Holy Ghost and with power: who went about doing good, and healing all that were oppressed of the devil; for God was with him.","39":"And we are witnesses of all things which he did both in the land of the Jews, and in Jerusalem; whom they slew and hanged on a tree:","40":"Him God raised up the third day, and shewed him openly;","41":"Not to all the people, but unto witnesses chosen before of God, *even* to us, who did eat and drink with him after he rose from the dead.","42":"And he commanded us to preach unto the people, and to testify that it is he which was ordained of God *to be* the Judge of quick and dead.","43":"To him give all the prophets witness, that through his name whosoever believeth in him shall receive remission of sins.","44":"While Peter yet spake these words, the Holy Ghost fell on all them which heard the word.","45":"And they of the circumcision which believed were astonished, as many as came with Peter, because that on the Gentiles also was poured out the gift of the Holy Ghost.","46":"For they heard them speak with tongues, and magnify God. Then answered Peter,","47":"Can any man forbid water, that these should not be baptized, which have received the Holy Ghost as well as we?","48":"And he commanded them to be baptized in the name of the Lord. Then prayed they him to tarry certain days."}},"tsk":{"1":[{"kopje":"in","refs":["Hand 8:40","Hand 21:8","Hand 23:23","Hand 23:33","Hand 25:1","Hand 25:13"]},{"kopje":"een hoofdman over honderd","refs":["Hand 22:25","Hand 27:1","Hand 27:31","Hand 27:43","Matt 8:5-13","Matt 27:54","Luk 7:2"]},{"kopje":"Italiaanse","refs":["Hand 27:1"]}],"2":[{"kopje":"godvruchtig","refs":["Hand 10:7","Hand 10:22","Hand 2:5","Hand 8:2","Hand 13:50","Hand 16:14","Hand 22:12","Luk 2:25"]},{"kopje":"een","refs":["Hand 10:35","Hand 9:31","Hand 13:16","Hand 13:26","1 Kon 8:43","2 Kron 6:33","Job 1:1","Ps 102:16","Pred 7:18","Jes 59:19","Dan 6:27","Openb 15:4"]},{"kopje":"met","refs":["Hand 10:7","Hand 16:15","Hand 18:8","Gen 18:19","Joz 24:15","Job 1:5","Ps 101:6-8"]},{"kopje":"die","refs":["Hand 10:4","Hand 10:22","Hand 10:31","Hand 9:36","Ps 41:2","Jes 58:7","Jes 58:8","Luk 7:4","Luk 7:5","Rom 15:26","Rom 15:27","2 Kor 9:8-15"]},{"kopje":"en bad","refs":["Hand 9:11","Ps 25:5","Ps 25:8","Ps 25:9","Ps 55:18","Ps 86:3","Ps 88:2","Ps 119:2","Spr 2:3-5","Dan 6:11","Dan 6:17","Dan 6:21","Matt 7:7","Matt 7:8","Luk 18:1","Kol 4:2","1 Tess 5:17","Jak 1:5"]}],"3":[{"kopje":"zag","refs":["Job 4:15","Job 4:16","Dan 9:20","Dan 9:21"]},{"kopje":"om en_nl":{"1":[{"catchword":"Cesarea,","tekst":"Daar waren in dien tijd meer steden van dezen naam; maar hier wordt gesproken van Caesarea Palestinoe, tevoren de Toren Stratonis genaamd, en van Herodes, ter ere van den keizer Augustus, Caesarea genaamd, gelegen aan de Middellandse zee, omtrent een halven dag reizens van Joppe; zijnde een van de voornaamste en sterkste steden van Palestina, waar de Romeinen gewoonlijk garnizoen hielden. Zie JosEf. de bell. lib.1, cap.16, en lib.3, cap.14."},{"catchword":"bende","tekst":"Grieks Speira; dat is, kolonelschap, of regiment, waaruit dit vaandel tot bewaring dier stad door den Romeinsen keizer gelegd was."},{"catchword":"de Italiaanse;","tekst":"Elk regiment had zijn naam, en dit werd het Italiaanse genaamd, omdat het bestond uit Italiaanse soldaten."}],"2":[{"catchword":"Godzalig en","tekst":"Zo was hij dan alrede gelovig en wedergeboren, hebbende rechte kennis van den waren God Israëls en van den Messias, dien de Joden verwachtten, zonder welke deze deugden in niemand kunnen zijn. Zie vs.15, 22, 43."}],"3":[{"catchword":"in een gezicht","tekst":"Dat is, in ene verschijning voor de ogen Zijns lichaams, gelijk blijkt uit het volgende en vs.31. Want de engelen zijn meermalen in aangenomen lichamen den mensen verschenen."},{"catchword":"de negende ure","tekst":"Dat is, de derde na den middag, welken den Joden een gewone ure des gebeds was, Act 3:1 , wanneer het avondoffer in den tempel te Jeruzalem dagelijks begon geofferd te worden; Exo 29:39 ."}],"4":[{"catchword":"Wat is het","tekst":"Namelijk dat gij van mij begeert."},{"catchword":"tot gedachtenis","tekst":"Of, in gedachtenis, òf tot ene gedachtenis. Eene gelijkenis, genomen van de offeranden des Ouden Testaments, en inzonderheid van het reukoffer; waardoor de aangenaamheid zijner gebeden en aalmoezen te kennen gegeven wordt, alzo die vruchten zijn van het ware geloof, zonder hetwelk noch wij, noch onze werken Gode kunnen behagen; Rom 10:14 ; Heb 11:6 ; 1Pe 2:5 ."}],"9":[{"catchword":"op het dak,","tekst":"Namelijk van het huis, alzo de Joodse huizen boven plat waren; namelijk om alleen te zijn en des te vrijer te bidden."},{"catchword":"de zesde ure","tekst":"Dat is, omtrent den middag, welke ook een gewone ure was van bidden bij de Joden. Zie Psa 55:18 ; Dan 6:11 ."}],"10":[{"catchword":"een vertrekking","tekst":"Grieks ecstasis; dat is, uitstand, wanneer de mens buiten zichzelven is; en was een gezicht des geestes, zonder middel van de uitwendige zinnen, die alsdan stilhouden en geen gebruik hadden. Zulke gezichten hebben de profeten dikwijls gehad. Zie Isa 6:1 ; Eze 1:1 , en doorgaans in de Openbaring van Johannes."}],"11":[{"catchword":"hoeken gebonden,","tekst":"Grieks beginselen."}],"12":[{"catchword":"al de viervoetige","tekst":"Dat is allerlei, of van alle soorten."}],"14":[{"catchword":"dat gemeen","tekst":"Dat is, iets hetwelk God in het Oude Testament verboden had tot spijs te gebruiken. Zie Lev 11:4 ; Deu 14:7 ."}],"15":[{"catchword":"gemeen maken","tekst":"Dat is, achten, of noemen."}],"19":[{"catchword":"zeide de Geest","tekst":"Namelijk door een inwendige inspraak, gelijk het gezicht inwendig was geweest. Zie Act 11:12 ."}],"20":[{"catchword":"Daarom sta op,","tekst":"Grieks maar."},{"catchword":"niet twijfelende;","tekst":"Namelijk of gij zulks moogt doen of niet, dewijl zij heidenen zijn."}],"22":[{"catchword":"volk der Joden,","tekst":"Namelijk waarmede hij gemeenschap had en in welker wet hij onderwezen was, gelijk uit vs.43 blijkt dat hij de profeten geloofde."},{"catchword":"woorden der","tekst":"Of, dingen, zaken; namelijk die de zaligheid aangaan, gelijk door Petrus verklaard wordt; Act 11:14 ."}],"23":[{"catchword":"ontving hij ze","tekst":"Of, herbergde hen, logeerde hen."},{"catchword":"sommigen der","tekst":"Namelijk zes in het getal, gelijk uitgedrukt staat Act 11:12 ."}],"24":[{"catchword":"bijzonderste vrienden","tekst":"Grieks noodwendig."}],"25":[{"catchword":"aanbad hij","tekst":"Namelijk hem burgerlijke eerbieding bewijzende. Want alzo Cornelius den waren God Israëls kende en vreesde, zo is het niet gelooflijk dat hij Petrus als god zou geëerd hebben; maar omdat de eer, die hij hem bewees de maat tebuitenging en enigen schijn had van goddelijke eer, zo heeft hem Petrus daarover met recht berispt, gelijk ook de engel Johannes in gelijk geval bestraft; Rev 22:9 ."}],"28":[{"catchword":"ongeoorloofd is,","tekst":"Hoewel wij hiervan geen klaar verbod vinden in het Oude Testament, nochtans was dit een ordinantie en gebruik onder de Joden, op goede redenen gegrond dat zij, met de heidenen en andere onheilige mensen niet te nauwe gemeenschap mochten houden, om van hen niet verleid te worden tot afgoderij of andere van hunne zonden. Zie Exo 23:32 ; Jos 23:7 ; 2Co 6:14 ; 2Jo 1:10 ; Rev 18:4 , enz."},{"catchword":"vreemde; doch","tekst":"Grieks Allophylos; dat is, die van een ander volk of geslacht is, namelijk vreemd van het geslacht der Joden, en dienvolgens van de beloften Gods; Eph 2:12 ."},{"catchword":"heten","tekst":"Grieks zeggen. Zie van deze zaak vs.34,35."}],"29":[{"catchword":"ontboden zijnde","tekst":"Grieks bezonden zijnde."}],"30":[{"catchword":"tot deze ure","tekst":"Namelijk van dien dag. Zie vs.3."}],"31":[{"catchword":"een man stond","tekst":"Dat is, een engel in mansgedaante, vs.3."},{"catchword":"gedacht geworden","tekst":"Zie de aantekeningen vs.4."}],"34":[{"catchword":"den mond","tekst":"Van deze manier van spreken zie de aantekeningen Mat 5:2 ."},{"catchword":"Ik verneem in","tekst":"Dat is, bevind, begrijp."},{"catchword":"geen aannemer","tekst":"Dat God niet ziet op de uiterlijke gelegenheid der mensen, dat iemand hem zou aangenaam zijn omdat hij een Jood of Grieks is, arm of rijk, edel of onedel: Gal 5:6 , en Gal 6:15 ; Col 3:11 . En hier wordt inzonderheid gezien op de tijden des Nieuwen Testaments, in hetwelk het onderscheid van de Joden en heidenen, en dienvolgens ook van de werking des Heiligen Geestes in het ene volk meer dan in het andere, door de komst van Christus is weggenomen, gelijk blijkt uit vs.35."}],"36":[{"catchword":"Dit is","tekst":"Of, naar het woord dat; of aangaande het woord."},{"catchword":"verkondigende","tekst":"Grieks Evangeliserende."},{"catchword":"vrede door","tekst":"Namelijk met God, en alle andere volken met elkander. Zie Eph 2:13 ."}],"37":[{"catchword":"weet de zaak,","tekst":"Namelijk door geruchten en getuigenissen dergenen, die het gehoord en gezien hebben; Mat 4:24 ."}],"38":[{"catchword":"gezalfd heeft","tekst":"Dit is, overvloedig begaafd; Joh 3:34 ."},{"catchword":"God was met Hem","tekst":"Namelijk de Vader was met Christus; niet alleen met Zijne gaven naar de menselijke natuur, maar ook met hetzelfde wezen en dezelfde goddelijke kracht, naar Zijn goddelijke natuur waardoor Hij al deze wonderen deed. Zie Joh 10:30 , Joh 10:38 , en Joh 14:9-10 ."}],"41":[{"catchword":"te voren verkoren","tekst":"Het Griekse woord Cheirotonein hetwelk hier gebruikt wordt, betekent eigenlijk door opsteking der handen verkiezen, of ordineren; en wordt hierna, Act 14:23 , van het verkiezen der gewone dienaren met medestemming der gemeente gebruikt, tegen welke deze buitengewone verkiezing der apostelen hier wordt gesteld, als door opheffing of opsteking van Gods hand alleen gedaan."}],"42":[{"catchword":"levenden en doden","tekst":"Dat is, dergenen, die ten uitersten dage nog leven zullen; 1Co 15:51 ; 1Th 4:15 , 1Th 4:17 ."}],"43":[{"catchword":"door Zijn Naam","tekst":"Dat is, door Hem, of om zijnentwil, als die ene offerande voor onze zonden is geworden, en daardoor een eeuwige verzoening voor allen die in Hem geloven heeft teweeggebracht; Heb 5:9 , en Heb 9:12 ."}],"44":[{"catchword":"viel de Heilige","tekst":"Dit is, kwam over hen, door zijn buitengewone gaven en werkingen; zie vs.46."}],"45":[{"catchword":"die uit de","tekst":"Dat is, die uit de Joden waren; Rom 4:12 ."},{"catchword":"ontzetten zich,","tekst":"Namelijk menende dat deze belofte alleen den huize Israëls toekwam, uit enige spreuken der profeten, die zij kwalijk verstonden, welke Paulus verklaart Rom. 9, 10, 11."}],"46":[{"catchword":"met vreemde","tekst":"Grieks met tongen."}],"48":[{"catchword":"hij beval,","tekst":"Namelijk òf dat alles zou gereed gemaakt worden, opdat Hij hen zelf zou dopen; òf Hij beval zulks anderen, die met Hem gekomen waren, en ook leraars waren, gelijk de apostelen meest altijd bij zich hadden, die dezen dienst deden. Zie 1Co 1:17 ."},{"catchword":"dat zij zouden","tekst":"Namelijk tot verzegeling en versterking huns geloofs en der gaven, die zij alrede ontvangen hadden, gelijk Paulus spreekt van de besnijdenis aan Abraham geschied; Rom 4:11 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And there was a certain man at Cesarea [There were at that time more Cities of this name: but here is spoken of Cesarea Palestine, before called the Tower of Strato, and by Herod in honour of Augustus Cesar re-named Cesarea, lying on the Midland Se, about a day and halfs journey from Joppa: being one of the principall and strongest Cities of Palestine, where the Romans kept an ordinary Garrison. See Joseph.de bell. Jud.lib. 1.cap. 16.and lib.3.cap.14.] by name Cornelius, a Captain over an hundred of the band [Gr. Speira i.e. Collonelship or Regiment; of which this company was laid by the Romane Emperour for the keeping of this City] called the Italian because it consisted of Italian souldiers.]"}],"2":[{"catchword":null,"tekst":"Religious and fearing God [Therefore he was already a believer and regenerate, having a right knowledge of the true God of Israel, and of the Messias whom the Jews expected, without which these vertues can be in no man. See the following 15. 22. 43.verses] with all his house, and giving much alms to the people, and praying to God continually."}],"3":[{"catchword":null,"tekst":"(This man) saw in a vision cleerly, [That is, in an apparition before the eyes of his body, as appears from the following and 31 verses: for the Angels at other times have appeared unto men in assumed bodies] about the ninth houre of the day, [that is, the third after no one, which was an ordinary houre of prayer with the Jews, Acts 3. 1.when the evening sacrifice began dayly to be offered in the temple at Jerusalem, Exod. 29. 39.] an Angel of God come in into him, and saying unto him, Cornelius."}],"4":[{"catchword":null,"tekst":"And he holding his eyes upon him, and being greatly afraid said, what is it Lord? [Namely, that thou desirest of me] And he said unto him, thy prayers and thine almes are come up in remembrance before God. [Or in remembrance or for a memorial. A similitude taken from the sacrificies of the old Testament, and especially from the offering of incense: whereby the acceptableness of his prayers and almesdeeds is given to understand, seeing they are fruits of a true faith, without which neither we nor our works can please God, Rom. 10. 14. Heb. 11. 6. 1 Pet. 2. 6.]"}],"5":[{"catchword":null,"tekst":"And now send men to Joppa, and send for Simon who is sirnamed Peter."}],"6":[{"catchword":null,"tekst":"He lodgeth with one Simon a leather-dresser, whose house is by the Sea: he shall tell thee what thou must doe."}],"7":[{"catchword":null,"tekst":"And when the Angel which spake unto Cornelius was gone away, he called two of his household servants, and a godly souldier of those that were continually with him."}],"8":[{"catchword":null,"tekst":"And when he had related all things unto them, he sent them to Joppa."}],"9":[{"catchword":null,"tekst":"And the next day, while these journeyed and came nigh to the City, Peter went up on the roofe [Namely, of the house, forasmuch as the Jews houses were flat on the top; namely, and so to pray the more freely] to pray, about the sixt hour. [that is, about noon, which was also an ordinary hour prayer with the Jews. See Psalm 55. 18. Dan.6.10.]"}],"10":[{"catchword":null,"tekst":"And he became hungry and desired to eat. And while they made it ready, there fell on him a withdrawing of sences. [Gr. Ecstasis, i.e. standing out, when a man is out of himself: and it was a vision of the Spirit, without means of the outward sences, which then stood still, and had no use; such visions the Prophets had often. See Esa. 6. 1. Ezek. 1. 1.and throughout in the Revelation of John.]"}],"11":[{"catchword":null,"tekst":"And he saw the heaven opened, and a certain vessell descend unto him, like a great linen sheet, bound at the four corners, [Gr.beginnings] and let down on the earth."}],"12":[{"catchword":null,"tekst":"In the which were all the four footed creatures of the earth, [That is, all manner of, or of all sorts] and the wild and creeping creatures and the fowles of the heaven."}],"13":[{"catchword":null,"tekst":"And there hapned a voice to him, Arise Peter, slay and eat."}],"14":[{"catchword":null,"tekst":"But Peter said, by no means Lord, for I have never eaten any thing that was common or unclean. [That is, anything which God in the old Testament had forbidden to use for meat. See Levit. 11. 4. Deut. 14. 7.]"}],"15":[{"catchword":null,"tekst":"And a voice (hapned) again the second time unto him, That which God hath cleansed, thou shalt not make common. [That is, esteeme or call.]"}],"16":[{"catchword":null,"tekst":"And this was done for three times, and the Vessell was again taken up into heaven."}],"17":[{"catchword":null,"tekst":"And as Peter doubted in himself, what the vision might be that he had seen, behold the men which were sent from Cornelius, having enquired for Simons house, stood at the gate."}],"18":[{"catchword":null,"tekst":"And having called, (some one) they asked whether Simon sirnamed Peter lodged there."}],"19":[{"catchword":null,"tekst":"And as Peter thought on that vision, the Spirit said unto him, [Namely by an internall speaking, as the vision had been inward. See Acts 11.ver. 12.] behold threemen seeke thee:"}],"20":[{"catchword":null,"tekst":"Therefore [Or but} arise, go down, and go with them, not doubting; [Namely, whether thou maist doe so or no, seeing they are Gentiles] for I have sent them."}],"21":[{"catchword":null,"tekst":"And Peter went down to the men which were sent unto him from Cornelius, and said, behold I am he whom ye seeke: what is the cause wherefore ye are here?"}],"22":[{"catchword":null,"tekst":"And they said Cornelius a Centurion, a righteous man and fearing God, and who hath (good) testimony of all the people of the Jews, [Namely, with whom he had communion, and in whose Law he was instructed, as appears from the 43 verse, that he believed the Prophet s] was astonished by divine revelation of an holy Angel, that he should send for thee unto his house, and that he should hear of thee words of salvation. [or things, matters, namely, which concern salvation, as is expounded by Peter Acts 11.ver. 14.]"}],"23":[{"catchword":null,"tekst":"Therefore when he had called them in, he received them into the house: [Or entertained them, lodged them] But the next day Peter went a way with them, and some of the brethren, [namely, six in number, as is expressed, Acts 11. 12.] which were of Joppa, went with him."}],"24":[{"catchword":null,"tekst":"And the day following they came unto Cesarea. And Cornelius expected them, having called together those of his kindred, and most speciall friends. [Gr.necessary.]"}],"25":[{"catchword":null,"tekst":"And as it came to pass that Peter came in, Cornelius went to meete him, and falling at (his) feet, he worshipped. [Namely, giving him cicill reverence. For seeing Cornelius, knew and feared the true God of Israel, therefore it is not credible, that he should have honoured Peter as God: but because the honour that he gave him exceeded the (due) measure, and had some shew of divine honour, therefore Peter justly blamed him for it, like as the Angel also reproves John in the like case, Revel. 22. 9."}],"26":[{"catchword":null,"tekst":"But Peter lift him up, saying, stand up, I my self also am a man."}],"27":[{"catchword":null,"tekst":"And speaking with him he went in and found many which were together."}],"28":[{"catchword":null,"tekst":"And he said unto them, ye know how it is unlawfull for a Jewish man [Although we finde no cleere prohibitation hereof in the old Testament, nevertheless this was an Ordinance and costume among the Jews, grounded upon good reason, that they might not hold too near communion with the Gentiles and other profane men, that they might not be seduced by them to Idolatry, or other sins. See Exod. 23. 32. Josh. 23. 7. 12. 2 Cor. 6. 14. 2 John ver. 10. Revel. 18. 4.&c.] to joyn himself or to go unto a stranger? [Gr. Allophylos, i.e. he that is of another people, or generation.namely, enstranged from the generation of the Jews, and consequently from the promises of God. Eph. 2. 12.] But God hath shewed me, that I should call no man [Gr.say. See of this matter verse 34. 35.] common or unclean."}],"29":[{"catchword":null,"tekst":"Therefore am I also come without gainsaying, being called, [Gr.being sent for] I ask therefore for what reason ye have sent to me?"}],"30":[{"catchword":null,"tekst":"And Cornelius said, four daies a go I was fasting, until this hour, [Namely, of that day. See ver. 3.] and at the ninth hour I prayed in my house."}],"31":[{"catchword":null,"tekst":"And behold a man [That is, an Angel in the shape of a man ver 3.] stood before me in a shining garment, and said, Cornelius thy prayer is heard, and thy almesdeeds are come in remembrance before God. [See the annot.on ver 4.]"}],"32":[{"catchword":null,"tekst":"Send therefore to Joppa, and call Simon, who is sirnamed Peter: he lodgeth in the house of Simon the leather-dresser on the Sea, which being come hither shall speak unto thee."}],"33":[{"catchword":null,"tekst":"Therefore I sent unto thee immediately, and thou hast done well that thou art come hither. We are therefore all now (here) present before God, to hear all that is commanded thee of God."}],"34":[{"catchword":null,"tekst":"And Peter opening (his) mouth [Of this phrase see the annot.on Matth. 5. 2.] said, I perceive in truth [That is, I finde, comprehend] that God is no accepter of the person: [that God looketh not upon the outward condition of men, that any one should acceptable to him, because he is a Jew or Greeke, poor or rich, noble or ignoble Gal. 5. 6.and 6. 15. Col. 3. 11. And here are especially respected the times of the New Testament, in which the difference between the Jews and Gentiles, and consequently also of the working of the holy Ghost in the people more then in the other, is taken away by the comming of Christ, as appears from the following verse.]"}],"35":[{"catchword":null,"tekst":"But in every nation, he that feareth him and worketh righteousness, is acceptable to him."}],"36":[{"catchword":null,"tekst":"(This is) the word [Or according to the word that: or concerning the word] that he sent to the children of Israel, publishing [Gr.Evangelizing] peace [namely with God, and all other Nations with one another. See Ephes. 2. 13. 14.] by Jesus Christ: He is a Lord of all."}],"37":[{"catchword":null,"tekst":"Ye know [Namely, by the rumors and testimonies of those that have heard and seen it Mat. 4. 24.] the thing that was done throughout all Judea, beginning from Galilee, after the baptism which John preached:"}],"38":[{"catchword":null,"tekst":"(Concerning) Jesus of Nazareth, how God anointed him [That is, abundantly endowed him, John 3. 34.] with the holy Ghost and which power: who went through (the land) doing good, and curing all that were overpowered by the Devil, for God was with him, [namely, the Father was with Christ, not only by his gifts according to the humane nature, but also by the same essence and the same power, according to his divine nature, all this wonders. See John 10.ver.30.38.and chap 14. Ver.9. 10]"}],"39":[{"catchword":null,"tekst":"And we are the witness of all that which he hath done, both in the land of Judea and at Jerusalem: whom they killed, hanging(him)on the wood."}],"40":[{"catchword":null,"tekst":"Him God raised up the third day, and gave that he should be manifest :"}],"41":[{"catchword":null,"tekst":"Not to all the people, but to the witnesses , which were chosen before God,[The Greeke word Cheirotonein, which is here used, signifieth properly by lifting up of the hands to chuse or ordaine; and is hereafter Act 14:23 used concerning the chusing of ordinary Ministers by the suffiages of the church, to this extraordinary chusing of the apostles here is opposed, as being done by lifting up or stretching forth of Gods hand alone]to us (namely)who have eaten and drunk with him, after that he was risen from the dead."}],"42":[{"catchword":null,"tekst":"And commanded us to preach to this people, and to testifie that he is the person that is ordained of God, for a judge of quick [That is, of those which shall yet be alive at the last day, 1 cor. 15. 52. 1 Thes 4. 15, 17.] and dead."}],"43":[{"catchword":null,"tekst":"To him all the Prophets give witness, that every one which believe in him, shall receive remission of sins through his name. [That is, through him, or for his sake as who became a sacrifice for our sins, and thereby hath brought to pass an external reconciliation for all that believe in him, Heb. 5. 9.and chap. 9. 12.]"}],"44":[{"catchword":null,"tekst":"While Peter spake these words, the Holy Ghost fell [That is, came upon them, by his extraordinary gifts and operations. See v. 46.] on all that heard the word."}],"45":[{"catchword":null,"tekst":"And the faithfull which were of the circumcision, [That is, which were of the Jews, Rom. 9. 12.] as many as came with Peter, were astonished, that the gift of the Holy Ghost was also poured out upon the Gentiles. [namely,thinking that this promise belonged only to the house of Israel, from certain prophecies of the Prophets, which they understood amiss, which Paul expounds, Rom. Chap. 9. 10, 11.]"}],"46":[{"catchword":null,"tekst":"For they heard them speak with strange (languages,) [Gr.with tongues] and magnifie God. Then answered Peter,"}],"47":[{"catchword":null,"tekst":"Whether can any man forbid water, that these should not be baptized, who have received the Holy Ghost, even like as we also."}],"48":[{"catchword":null,"tekst":"And he commanded, [Namely, either that all things should be made ready, that he himself might baptize them; or he thus commanded others that were come with him, and were teachers also, as the Apostles had almost always some with them, who did this service. See 1 Cor. 1.v. 17.] that they should be baptized in the name of the Lord. [namely, for obsognation and confirmation of their faith, and of the gifts which they had already received; as Paul speaks of circumcision administred to Abraham, Rom. 4. 11.] Then prayed they him that he would remain with (them) some days."}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
