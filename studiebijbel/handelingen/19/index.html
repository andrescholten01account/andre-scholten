<style>

  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

    #vertaalkies { order: -1; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }

</style>

it hoorden, werden gedoopt in de Naam van de Heere Jezus.","6":"En toen Paulus hun de handen opgelegd had, kwam de Heilige Geest op hen; en zij spraken met *vreemde* talen, en profeteerden.","7":"En al deze mannen waren ongeveer twaalf.","8":"En hij ging de synagoge in, en sprak vrijmoedig, drie maanden lang met hen sprekend, en hen aanradend om de zaken van het Koninkrijk van God aan te nemen.","9":"Maar toen sommigen verhard werden en ongehoorzaam waren, en kwaadspraken van de weg *des* *Heeren* voor de menigte, ging hij bij hen weg, en zonderde de discipelen af, dagelijks sprekend in de school van een zekere Tyrannus.","10":"En dit gebeurde twee jaar lang, zodat allen die in Azië woonden het Woord van de Heere Jezus hoorden, zowel Joden als Grieken.","11":"En God deed ongewone krachten door de handen van Paulus,","12":"zodat ook van zijn lijf op de zieken gedragen werden de zweetdoeken of gordeldoeken, en dat de ziekten van hen weken, en de boze geesten van hen uitvoeren.","13":"En sommigen van de Joden die rondtrokken, en die duivelbezweerders waren, hebben zich eraan gewaagd de Naam van de Heere Jezus te noemen over hen die boze geesten hadden, en zeiden: Wij bezweren u bij Jezus, Die Paulus predikt!","14":"Dit waren zeven zonen van een zekere Sceva, een Joodse overpriester, die dit deden.","15":"Maar de boze geest antwoordde en zei: Jezus ken ik, en Paulus weet ik; maar u, wie bent u?","16":"En de mens, in wie de boze geest was, sprong op hen, en werd hen meester en overwon hen, zodat zij naakt en gewond uit dat huis vluchtten.","17":"En dit werd aan allen bekend, zowel Joden als Grieken, die te Efeze woonden; en er viel een vrees over hen allen, en de Naam van de Heere Jezus werd groot gemaakt.","18":"En velen van hen die geloofden, kwamen, beleden en vertelden openlijk hun daden.","19":"Velen ook van hen die toverkunsten hadden beoefend, brachten de boeken bijeen en verbrandden ze voor het oog van allen; en zij berekenden de waarde daarvan, en kwamen tot vijftigduizend zilveren *penningen*.","20":"Zo groeide het Woord van de Heere met kracht, en kreeg de overhand.","21":"En toen deze dingen volbracht waren, nam Paulus zich in de Geest voor om, na Macedonië en Achaje doorgereisd te hebben, naar Jeruzalem te reizen, en zei: Nadat ik daar geweest zal zijn, moet ik ook Rome zien.","22":"En toen hij naar Macedonië twee van hen die hem dienden gezonden had, namelijk Timotheüs en Erastus, bleef hij zelf nog een tijd lang in Azië.","23":"Maar in diezelfde tijd ontstond er geen kleine opschudding over de weg *des* *Heeren*.","24":"Want iemand, met name Demetrius, een zilversmid, die *kleine* zilveren tempels van Diana maakte, bracht de handwerkers geen klein gewin;","25":"hij bracht hen bijeen, met de handwerkers van dergelijke dingen, en zei: Mannen, u weet dat wij uit dit gewin onze welvaart hebben;","26":"en u ziet en hoort, dat deze Paulus veel volk, niet alleen van Efeze, maar ook bijna van heel Azië, overreed en afgekeerd heeft, en zegt dat het geen goden zijn die met handen gemaakt worden.","27":"En wij lopen niet alleen gevaar dat dit onze zaak in verachting komt, maar ook dat de tempel van de grote godin Diana als niets geacht zal worden, en dat ook haar majesteit ten onder zal gaan, zij die geheel Azië en de *gehele* wereld verering bewijst.","28":"Toen zij dit nu hoorden, werden zij vol toorn, en riepen: Groot is de Diana van de Efezeërs!","29":"En de gehele stad werd vol verwarring; en zij liepen eendrachtig met een geroep naar de schouwplaats, en sleepten Gajus en Aristarchus mee, Macedoniërs, reisgenoten van Paulus.","30":"En toen Paulus naar het volk toe wilde gaan, lieten de discipelen hem dat niet toe.","31":"En sommigen ook van de leiders van Azië, die hem vrienden waren, zonden een bode naar hem toe, en smeekten hem zich niet op de schouwplaats te begeven.","32":"De een riep dan dit, de ander wat anders; want de vergadering was verward, en het merendeel wist niet om welke reden zij bijeengekomen waren.","33":"En zij haalden Alexander uit de menigte naar voren, doordat de Joden hem naar voren duwden. En Alexander wenkte met de hand, en wilde zich bij het volk verantwoorden.","34":"Maar toen zij begrepen dat hij een Jood was, kwam er van allen één stem, die ongeveer twee uur lang riep: Groot is de Diana van de Efezeërs!","35":"En toen de stadsschrijver de menigte tot bedaren had gebracht, zei hij: Mannen van Efeze, welk mens is er toch die niet weet dat de stad van de Efezeërs de tempelbewaarster is van de grote godin Diana, en van *het* *beeld* dat uit de hemel gevallen is?","36":"Omdat dan deze dingen onweersprekelijk zijn, is het behoorlijk dat u stil bent, en niets van het onbedacht doet.","37":"Want u hebt deze mannen *hier* gebracht, die geen tempelrovers zijn, en ook uw godin niet lasteren.","38":"Als Demetrius dan, en de handwerkers die bij hem zijn, tegen iemand een zaak hebben, de rechtsdagen worden gehouden, en er zijn stadhouders; laat hen elkaar aanklagen.","39":"En als u iets van andere dingen verlangt, dat zal in een wettige vergadering beslist worden.","40":"Want wij lopen gevaar van oproer aangeklaagd te worden om deze dag van vandaag, aangezien er geen oorzaak is waardoor wij reden zullen kunnen geven van deze oploop.","41":"En toen hij dit gezegd had, liet hij de vergadering uiteengaan."},"SV":{"1":"En het geschiedde, terwijl Apollos te Korinthe was, dat Paulus, de bovenste delen *des* *lands* doorreisd hebbende, te Efeze kwam; en enige discipelen *aldaar* vindende,","2":"Zeide hij tot hen: Hebt gij den Heiligen Geest ontvangen, als gij geloofd hebt? En zij zeiden tot hem: Wij hebben zelfs niet gehoord, of er een Heiligen Geest is.","3":"En hij zeide tot hen: Waarin zijt gij dan gedoopt? En zij zeiden: In den doop van Johannes.","4":"Maar Paulus zeide: Johannes heeft wel gedoopt den doop der bekering, zeggende tot het volk, dat zij geloven zouden in Dengene, Die na hem kwam, dat is, in Christus Jezus.","5":"En die *hem* hoorden werden gedoopt in den Naam van den Heere Jezus.","6":"En als Paulus hun de handen opgelegd had, kwam de Heilige Geest op hen; en zij spraken met *vreemde* talen, en profeteerden.","7":"En alle dezen waren omtrent twaalf mannen.","8":"En hij ging in de synagoge, en sprak vrijmoediglijk, drie maanden lang *met* *hen* handelende, en *hun* aanradende de zaken van het Koninkrijk Gods.","9":"Maar als sommigen verhard werden, en ongehoorzaam waren, kwaadsprekende van den weg *des* *Heeren* voor de menigte, week hij van hen, en scheidde de discipelen af, dagelijks handelende in de school van zekeren Tyrannus.","10":"En dit geschiedde twee jaren lang, alzo dat allen, die in Azië woonden, het Woord van den Heere Jezus hoorden, beiden Joden en Grieken.","11":"En God deed ongewone krachten door de handen van Paulus;","12":"Alzo dat ook van zijn lijf op de kranken gedragen werden de zweetdoeken of gordeldoeken, en dat de ziekten van hen weken, en de boze geesten van hen uitvoeren.","13":"En sommigen van de omzwervende Joden, zijnde *duivel* bezweerders, hebben zich onderwonden den Naam van den Heere Jezus te noemen over degenen, die boze geesten hadden, zeggende: Wij bezweren u bij Jezus, Dien Paulus predikt!","14":"*Dezen* nu waren zekere zeven zonen van Sceva, een Joodsen overpriester, die dit deden.","15":"Maar de boze geest, antwoordende, zeide: Jezus ken ik, en Paulus weet ik; maar gijlieden, wie zijt gij?","16":"En de mens, in welken de boze geest was, sprong op hen, en hen meester geworden zijnde, kreeg de overhand tegen hen, alzo dat zij naakt en gewond uit dat huis ontvloden.","17":"En dit werd allen bekend, beiden Joden en Grieken, die te Efeze woonden; en er viel een vreze over hen allen, en de Naam van den Heere Jezus werd groot gemaakt.","18":"En velen dergenen, die geloofden, kwamen, belijdende en verkondigende hun daden.","19":"Velen ook dergenen, die ijdele *kunsten* gepleegd hadden, brachten de boeken bijeen, en verbrandden ze in aller tegenwoordigheid; en berekenden de waarde derzelve, en bevonden vijftig duizend zilveren *penningen*.","20":"Alzo wies het Woord des Heeren met macht, en nam de overhand.","21":"En als deze dingen volbracht waren, nam Paulus voor in den Geest, Macedonië en Achaje doorgegaan hebbende, naar Jeruzalem te reizen, zeggende: Nadat ik aldaar zal geweest zijn, moet ik ook Rome zien.","22":"En als hij naar Macedonië gezonden had twee van degenen, die hem dienden, *namelijk* Timotheüs en Erastus, bleef hij zelf een tijd *lang* in Azië.","23":"Maar op dienzelfden tijd ontstond er geen kleine beroerte, vanwege den weg *des* *Heeren*.","24":"Want een, met name Demetrius, een zilversmid, die *kleine* zilveren tempelen van Diana maakte, bracht dien van die kunst geen klein gewin toe;","25":"Welke hij samenvergaderd hebbende, met de handwerkers van dergelijke dingen, zeide: Mannen, gij weet, dat wij uit dit gewin onze welvaart hebben;","26":"En gij ziet en hoort, dat deze Paulus veel volk, niet alleen van Efeze, maar ook bijna van geheel Azië, overreed en afgekeerd heeft, zeggende, dat het geen goden zijn, die met handen gemaakt worden.","27":"En wij zijn niet alleen in gevaar, dat dit deel in verachting kome, maar dat ook de tempel van de grote godin Diana als niets geacht zal worden, en dat ook haar majesteit zal ten ondergaan, aan welke gans Azië en de *gehele* wereld godsdienst bewijst.","28":"Als zij nu *dit* hoorden, werden zij vol van toornigheid, en riepen, zeggende: Groot is de Diana de Efezeren!","29":"En de gehele stad werd vol verwarring; en zij liepen met een gedruis eendrachtelijk naar de schouwplaats, met zich trekkende Gajus en Aristarchus, Macedoniërs, metgezellen van Paulus op de reis.","30":"En als Paulus tot het volk wilde ingaan, lieten het hem de discipelen niet toe.","31":"En sommigen ook der oversten van Azië, die hem vrienden waren, zonden tot hem, en baden, dat hij zichzelven op de schouwplaats niet zou begeven.","32":"Zij riepen dan *de* *ene* *dit*, de andere wat anders; want de vergadering was verward en het meerder *deel* wist niet, om wat oorzaak zij samengekomen waren.","33":"En zij deden Alexander uit de schare voortkomen, alzo hem de Joden voortstieten . En Alexander gewenkt hebbende met de hand, wilde bij het volk verantwoording doen.","34":"Maar als zij verstonden, dat hij een Jood was, werd er een stem van allen, roepende omtrent twee uren lang: Groot is de Diana der Efezeren!","35":"En als de *stads* schrijver de schare gestild had, zeide hij: Gij mannen van Efeze! wat mens is er toch, die niet weet, dat de stad der Efezeren de kerkbewaarster zij van de grote godin Diana, en van *het* *beeld*, dat uit den hemel gevallen is?","36":"Dewijl dan deze dingen onwedersprekelijk zijn, zo is het behoorlijk dat gij stil zijt, en niets onbedachts doet.","37":"Want gij hebt deze mannen *hier* gebracht, die noch kerkrovers zijn, noch uw godin lasteren.","38":"Indien dan nu Demetrius, en die met hem van de kunst zijn, tegen iemand enige zaak hebben, de rechtsdagen worden gehouden, en er zijn stadhouders; laat hen elkander verklagen.","39":"En indien gij iets van andere dingen verzoekt, dat zal in een wettelijke vergadering beslecht worden.","40":"Want wij staan in gevaar, dat wij van oproer zullen verklaagd worden om *den* *dag* van heden, alzo er geen oorzaak is, waardoor wij reden zullen kunnen geven van dezen oploop.","41":"En dit gezegd hebbende, liet hij de vergadering gaan."},"KJV":{"1":"And it came to pass, that, while Apollos was at Corinth, Paul having passed through the upper coasts came to Ephesus: and finding certain disciples,","2":"He said unto them, Have ye received the Holy Ghost since ye believed? And they said unto him, We have not so much as heard whether there be any Holy Ghost.","3":"And he said unto them, Unto what then were ye baptized? And they said, Unto John's baptism.","4":"Then said Paul, John verily baptized with the baptism of repentance, saying unto the people, that they should believe on him which should come after him, that is, on Christ Jesus.","5":"When they heard *this*, they were baptized in the name of the Lord Jesus.","6":"And when Paul had laid *his* hands upon them, the Holy Ghost came on them; and they spake with tongues, and prophesied.","7":"And all the men were about twelve.","8":"And he went into the synagogue, and spake boldly for the space of three months, disputing and persuading the things concerning the kingdom of God.","9":"But when divers were hardened, and believed not, but spake evil of that way before the multitude, he departed from them, and separated the disciples, disputing daily in the school of one Tyrannus.","10":"And this continued by the space of two years; so that all they which dwelt in Asia heard the word of the Lord Jesus, both Jews and Greeks.","11":"And God wrought special miracles by the hands of Paul:","12":"So that from his body were brought unto the sick handkerchiefs or aprons, and the diseases departed from them, and the evil spirits went out of them.","13":"Then certain of the vagabond Jews, exorcists, took upon them to call over them which had evil spirits the name of the Lord Jesus, saying, We adjure you by Jesus whom Paul preacheth.","14":"And there were seven sons of *one* Sceva, a Jew, *and* chief of the priests, which did so.","15":"And the evil spirit answered and said, Jesus I know, and Paul I know; but who are ye?","16":"And the man in whom the evil spirit was leaped on them, and overcame them, and prevailed against them, so that they fled out of that house naked and wounded.","17":"And this was known to all the Jews and Greeks also dwelling at Ephesus; and fear fell on them all, and the name of the Lord Jesus was magnified.","18":"And many that believed came, and confessed, and shewed their deeds.","19":"Many of them also which used curious arts brought their books together, and burned them before all *men*: and they counted the price of them, and found *it* fifty thousand *pieces* of silver.","20":"So mightily grew the word of God and prevailed.","21":"After these things were ended, Paul purposed in the spirit, when he had passed through Macedonia and Achaia, to go to Jerusalem, saying, After I have been there, I must also see Rome.","22":"So he sent into Macedonia two of them that ministered unto him, Timotheus and Erastus; but he himself stayed in Asia for a season.","23":"And the same time there arose no small stir about that way.","24":"For a certain *man* named Demetrius, a silversmith, which made silver shrines for Diana, brought no small gain unto the craftsmen;","25":"Whom he called together with the workmen of like occupation, and said, Sirs, ye know that by this craft we have our wealth.","26":"Moreover ye see and hear, that not alone at Ephesus, but almost throughout all Asia, this Paul hath persuaded and turned away much people, saying that they be no gods, which are made with hands:","27":"So that not only this our craft is in danger to be set at nought; but also that the temple of the great goddess Diana should be despised, and her magnificence should be destroyed, whom all Asia and the world worshippeth.","28":"And when they heard *these sayings*, they were full of wrath, and cried out, saying, Great *is* Diana of the Ephesians.","29":"And the whole city was filled with confusion: and having caught Gaius and Aristarchus, men of Macedonia, Paul's companions in travel, they rushed with one accord into the theatre.","30":"And when Paul would have entered in unto the people, the disciples suffered him not.","31":"And certain of the chief of Asia, which were his friends, sent unto him, desiring *him* that he would not adventure himself into the theatre.","32":"Some therefore cried one thing, and some another: for the assembly was confused; and the more part knew not wherefore they were come together.","33":"And they drew Alexander out of the multitude, the Jews putting him forward. And Alexander beckoned with the hand, and would have made his defence unto the people.","34":"But when they knew that he was a Jew, all with one voice about the space of two hours cried out, Great *is* Diana of the Ephesians.","35":"And when the townclerk had appeased the people, he said, *Ye* men of Ephesus, what man is there that knoweth not how that the city of the Ephesians is a worshipper of the great goddess Diana, and of the *image* which fell down from Jupiter?","36":"Seeing then that these things cannot be spoken against, ye ought to be quiet, and to do nothing rashly.","37":"For ye have brought hither these men, which are neither robbers of churches, nor yet blasphemers of your goddess.","38":"Wherefore if Demetrius, and the craftsmen which are with him, have a matter against any man, the law is open, and there are deputies: let them implead one another.","39":"But if ye enquire any thing concerning other matters, it shall be determined in a lawful assembly.","40":"For we are in danger to be called in question for this day's uproar, there being no cause whereby we may give an account of this concourse.","41":"And when he had thus spoken, he dismissed the assembly."}},"tsk":{"1":[{"kopje":"dat","refs":["Hand 18:24-28","1 Kor 1:12","1 Kor 3:4-7","1 Kor 16:12"]},{"kopje":"Paulus","refs":["Hand 18:23"]},{"kopje":"kwam","refs":["Hand 18:19-21"]}],"2":[{"kopje":"Hebt u","refs":["Hand 19:5","Hand 2:17","Hand 2:38","Hand 2:39","Hand 8:15-17","Hand 10:44","Hand 11:15-17","Rom 1:11"]},{"kopje":"Wij hebben","refs":["1 Sam 3:7","Joh 7:39","1 Kor 6:19","1 Kor 12:1-11","Gal 3:5"]}],"3":[{"kopje":"Waarin","refs":["Matt 28:19","1 Kor 12:13"]},{"kopje":"In de doop van Johannes","refs":["Hand 18:25","Matt 3:1-17","Luk 3:1-38"]}],"4":[{"kopje":"Johannes","refs":["Hand 1:5","Hand 11:16","Hand 13:23-25","Matt 3:11","Matt 3:12","Matt 11:3-5","Matt 21:25-32","Mark 1:1-12","Luk 1:76-79","Luk 3:16-18","Joh 1:15","Joh 1:27","Joh 1:29-34","Joh 3:28-36","Joh 5:33-35"]}],"5":[{"kopje":"die dit hoorden","refs":["Hand 2:38","Hand 8:12","Hand 8:16","Rom 6:3","Rom 6:4","1 Kor 1:13-15","1 Kor 10:2"]}] eluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de bovenste","tekst":"Namelijk van Galatië en Frygië. Zie Act 18:23 ."}],"2":[{"catchword":"den Heiligen","tekst":"Dat is, de buitengewone zichtbare gaven des Heiligen Geestes, van met allerlei talen te spreken, te profeteren, allerlei krankheid te genezen, enz. Zie vs.6; Joh 7:39 ; Act 10:44 , Act 10:47 ."},{"catchword":"als gij geloofd","tekst":"Namelijk en gedoopt zijt geweest."},{"catchword":"een Heiligen Geest is","tekst":"Dat is, of er zodanige buitengewone gaven van den Heiligen Geest gewrocht en gegeven worden."}],"3":[{"catchword":"Waarin zijt gij","tekst":"Dat is, welke leer is u verkondigd, hebt gij beleden, als gij gedoopt zijt geworden?"},{"catchword":"In den doop van","tekst":"Dat is, wij zijn van Johannes gedoopt op de belijdenis van de leer, die Johannes van Christus geleerd en daarop Zijne discipelen gedoopt heeft. Zie Act 18:25 , bij welken doop de buitengewone gaven des Heiligen Geestes niet gegeven werden, overmits Christus toen nog niet was verheerlijkt; Joh 7:39 ."}],"4":[{"catchword":"der bekering,","tekst":"Dat is, bij welke Hij bekering predikte, en die de gedoopten tot bekering verplichtte. Waarmede, alsook met het volgende, Hij aanwijst dat de doop van Johannes in zichzelven, aangaande het wezen, dezelfde is met den doop der apostelen; als hebbende enerlei, teken en enerlei betekende zaak, en tot enerlei einde bediend. Doch het onderscheid is dat Johannes met zijne leer en doop aanwees Christus, die na hem kwam en alles nog zou volbrengen; en de apostelen, dat Christus gekomen zijnde, volkomen alles heeft uitgericht, nodig tot onze verlossing."}],"5":[{"catchword":"En die","tekst":"Of, en als zij het hoorden; namelijk de discipelen van Johannes."},{"catchword":"hem hoorden","tekst":"Namelijk Johannes de Doper. Want dit zijn de woorden van Paulus, verhalende hoe Johannes zijne discipelen doopte. Hetwelk blijkt uit den Grieksen tekst, in welken de twee woorden men, dat is wel; en de, dat is maar, of en, [ waarvan het ene voor gaat het vs.4 en het andere volgt in vs.5] aanwijzen dat de dingen, die in deze twee verzen gezegd worden, tezamen moeten gevoegd worden, en dat er van een persoon en zaak gesproken wordt. Zodat hieruit niet kan bewezen worden, dat deze discipelen door Paulus zouden herdoopt zijn."},{"catchword":"in den Naam","tekst":"Zie Act 8:16 , en Act 10:48 ."}],"6":[{"catchword":"de handen opgelegd","tekst":"Zie Act 8:17 ."},{"catchword":"de Heilige Geest","tekst":"Dat is, de buitengewone gaven des Heiligen Geestes, die terstond daarna worden uitgedrukt."},{"catchword":"vreemde talen,","tekst":"Grieks tongen."},{"catchword":"profeteerden","tekst":"Dat is, verkondigden toekomende dingen, of spraken van goddelijke zaken en legden de Schriften der profeten uit; zie 1Co 14:3 ."}],"8":[{"catchword":"van het Koninkrijk","tekst":"Dat is, die de eeuwige zaligheid aangaan."}],"9":[{"catchword":"ongehoorzaam","tekst":"Of, ongezeggelijk."},{"catchword":"weg des Heeren","tekst":"Dat is, leer. Zie Act 18:25 ."},{"catchword":"Tyrannus","tekst":"Dit woord betekende eertijds bij de Grieken iemand, die enige heerschappij had; en overmits dezelve misbruikt werd, is daardoor namaals genaamd een, die òf de heerschappij onwettelijk aanneemt, òf dezelve met ongerechtigheid en wreedheid misbruikt. Doch hier schijnt het een eigennaam te zijn van een man, die deze school had laten bouwen."}],"10":[{"catchword":"allen, die","tekst":"Dat is zeer velen, meest allen."},{"catchword":"Azië woonden,","tekst":"Namelijk Klein-Azië."},{"catchword":"den Heere Jezus","tekst":"Dat is, van den Heere Jezus."}],"11":[{"catchword":"krachten door","tekst":"Dat is, wonderwerken."},{"catchword":"de handen van","tekst":"Dat is, door den dienst; Act 5:12 ."}],"13":[{"catchword":"omzwervende","tekst":"Grieks omgaande; dat is omlopende door het land, om daarmede gewin te doen."},{"catchword":"duivel- bezweerders,","tekst":"Dat is, die met bezwering bij den naam Gods de onreine geesten uitdreven; hetwelk de onreine geesten zich lieten doen om de mensen in wangeloof te houden."},{"catchword":"Dien Paulus predikt","tekst":"Dewijl zij zagen dat Paulus in den naam van Jezus zo krachtig de duivelen uitwierp, hebben zij dat willen navolgen, om te meer eer of gewin te hebben."}],"14":[{"catchword":"overpriester,","tekst":"Zie van deze overpriesters Mat 2:4 ."}],"15":[{"catchword":"Jezus ken ik,","tekst":"Namelijk dat Hij macht heeft om mij uit te werpen."},{"catchword":"wie zijt gij?","tekst":"Dat is, wat macht hebt gij om mij te gebieden?"}],"16":[{"catchword":"meester geworden","tekst":"Grieks hen overheerst hebbende."}],"18":[{"catchword":"verkondigende","tekst":"Of, boodschappende; dat is, opbarende, verhalende."},{"catchword":"daden","tekst":"Dat is, misdaden en grote zonden, namelijk dezelve openlijk verfoeiende, en daartegen van Paulus raad en troost verzoekende."}],"19":[{"catchword":"ijdele kunsten","tekst":"Of, zonderlinge kunsten; zo worden met een zachteren naam genoemd de duivelse en zwarte kunsten van toverij en waarzeggen; waartoe de Efeziërs van ouds zeer genegen waren."},{"catchword":"vijftig duizend","tekst":"Grieks vijmaal tienduizend zilvers."},{"catchword":"zilveren penningen","tekst":"Of, drachmen zilvers, elk drachme zilvers gerekend zijnde voor zes stuivers, Mat 18:28 , zo maakt deze som vijftien duizend gulden."}],"20":[{"catchword":"wies het Woord","tekst":"Zie Act 12:24 ."},{"catchword":"met macht, en","tekst":"Dat is, geweldig zeer."}],"21":[{"catchword":"volbracht waren,","tekst":"Grieks vervuld."},{"catchword":"nam Paulus voor","tekst":"Grieks stelde Paulus in den geest."},{"catchword":"in den Geest,","tekst":"Dat is, in zijn gemoed. Of, door den Geest, namelijk den Heiligen Geest, die hem ingaf hoe hij zijne reizen zou aanstellen."},{"catchword":"doorgegaan","tekst":"Namelijk om de gemeenten in die landen meteen te bezoeken."},{"catchword":"moet ik ook Rome","tekst":"Dit schijnt hem ook bijzonder van God geopenbaard te zijn. Bij welke gelegenheid en hoe hij daarna te Rome is gekomen, wordt beschreven Act 25:12 , en Act 26:32 , en in de twee volgende hfdst.20 en 21."}],"22":[{"catchword":"gezonden had","tekst":"Namelijk om den weg voor Hem te bereiden, en de aalmoezen voor de armen te Jeruzalem te vergaderen; 1Co 4:17 ."},{"catchword":"die hem dienden,","tekst":"Namelijk in den dienst des Woords; alzo hij alleen alles niet kon uitrichten."}],"23":[{"catchword":"den weg des Heeren","tekst":"Dat is, de Christelijke godsdienst. Zie Act 18:25 ."}],"24":[{"catchword":"een zilversmid,","tekst":"Grieks zilverslager, zilvermunter."},{"catchword":"kleine zilveren","tekst":"Dat is, kleine afbeeldingen des groten tempels van Diana van zilver maakten, of in zilveren penningen uitdrukten, waar een klein beeldje van Diana in stond, welke de heidenen, te Efeze komende om Diana te dienen, kochten en met zich namen, om te huis aan dezelve godsdienstige eer te betonen; gelijk men ziet dat nog hedendaags te Loretto en elders geschiedt."}],"25":[{"catchword":"samenvergaderd","tekst":"Grieks overhoop bijeengebracht hebbende."},{"catchword":"de handwerkers","tekst":"Namelijk die voor hen wrochten, om zodanige tempeltjes te maken."},{"catchword":"onze welvaart hebben;","tekst":"Dat is, waarbij wij moeten leven en ons onderhouden."}],"27":[{"catchword":"dit deel","tekst":"Dat is, dit ons ambacht, waar wij bij leven moeten."},{"catchword":"in verachting","tekst":"Grieks in wederspreking, of verwerping zal komen; zodat wij niet veel te doen zullen krijgen."},{"catchword":"als niets geacht","tekst":"Grieks tot, of voor niet."},{"catchword":"majesteit zal","tekst":"Of, grootachtigheid."},{"catchword":"ten ondergaan,","tekst":"Grieks zal weggenomen worden."}],"28":[{"catchword":"Groot is de","tekst":"Dat is, moet en behoort in groter ere gehouden te worden."}],"29":[{"catchword":"de schouwplaats,","tekst":"Dit waren grote gebouwen in sommige voornaamste steden der heidenen, met trappen boven elkander gebouwd, waarin het volk samenkwam om de schouwspelen, ter ere van hunne afgoden of anderszins aangesteld, te aanschouwen."}],"30":[{"catchword":"lieten het hem","tekst":"Namelijk opdat hij zich niet zou stellen in gevaar om van dit razende volk gedood te worden."}],"31":[{"catchword":"der oversten","tekst":"Grieks Asiarchen; welke waren, niet die de regering van Azië hadden, maar zekere priesters, die de schouwspelen, ter ere hunner afgoden aangesteld, bezorgden; waaronder ook enige van den Christelijken godsdienst niet vreemd schijnen geweest te zijn."}],"32":[{"catchword":"de vergadering was","tekst":"Grieks Ecclesia; hetwelk eigenlijk betekent ene vergadering met openbare orde samengeroepen. Doch hier was deze vergadering vanzelf met verwarring bijeengelopen, vs.29."}],"33":[{"catchword":"Alexander uit","tekst":"Deze menen sommige dezelfde Alexander geweest te zijn, van wien men leest 1Ti 1:20 ; 2Ti 4:14 , een heftig en hardnekkig vijand van Paulus en der waarheid, doch dat staat niet vast. Zie de aantekeningen 1Ti 1:20 ."},{"catchword":"voortkomen,","tekst":"Namelijk om hem te horen spreken."},{"catchword":"voortstieten","tekst":"Namelijk alzo hij ook een Jood was, om iets te spreken tot beschuldiging der Christenen."},{"catchword":"gewenkt hebbende","tekst":"Zie Act 12:17 , en Act 13:16 , en Act 21:40 ."},{"catchword":"verantwoording doen","tekst":"Namelijk van dit onordelijk bijeenlopen, met beschuldiging der Christenen."}],"34":[{"catchword":"van allen, roepende","tekst":"Namelijk heidenen die daar waren."}],"35":[{"catchword":"de stads- schrijver","tekst":"Namelijk die wij gemeenlijk noemen den stadssecretaris."},{"catchword":"de kerkbewaarster","tekst":"Dat is, die den tempel van Diana onderhoudt, bewaart en versiert."},{"catchword":"dat uit den hemel","tekst":"Grieks dat van Jupiter gevallen is. Dit beeld van Diana was zeer oud, eertijds gemaakt uit hout door een kunstenaar Canetia, hetwelk, hoewel de tempel zevenmaal is vernieuwd geweest, altijd hetzelfde is gebleven; zie Plin. lib.16, cap.40, waarom men het volk wijs maakte dat het uit den hemel afgekomen was."}],"36":[{"catchword":"onbedachts doet","tekst":"Of, uit haastigheid te zeer voortvarende, zonder u wel te bedenken."}],"38":[{"catchword":"van de kunst","tekst":"Grieks kunstenaars; namelijk om zulke zilveren tempeltjes te maken."},{"catchword":"enige zaak hebben,","tekst":"Grieks enig woord hebben."},{"catchword":"de rechtsdagen","tekst":"Of, de rechthouders vergaderen, van welken, of door welken zij recht verzoeken konden."},{"catchword":"stadhouders;","tekst":"Grieks Anthypatio; dat is, die in plaats van de burgemeesters van Rome regeren. Zie Act 13:7 ."}],"39":[{"catchword":"wettelijke","tekst":"Dat is, die uit last en bij orde van den magistraat bijeengeroepen wordt."}],"40":[{"catchword":"verklaagd worden","tekst":"Namelijk bij de stadhouders."},{"catchword":"om den dag","tekst":"Dat is, om hetgeen van ulieden dezen dag gedaan is, met dit oproerige samenlopen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass while Apollo was at Corinth, that Paul having travelled through the uppermost parts (of the land) [Namely, of Galatia and Phrygia. See Acts 18. 23.] came to Ephesus and fining some Disciples (ther,)"}],"2":[{"catchword":null,"tekst":"He said unto them, have ye received the Holy Ghost, [that is, the extraordinary visible gifts of the Holy Ghost, of speaking with all kind of tongues, prophecying, curing all manner of sickness. &c. See v. 6. John 7. 39. Acts 10.v. 44. 47.] when ye believed? [namely, and were baptized] And they said unto him, we have not so much as heard whether there be an holy Ghost. [that is, whether there be such extraordinary gifts of the holy Ghost wrought and given.]"}],"3":[{"catchword":null,"tekst":"And he said unto them, whereinto therefore were ye baptized? [That is, what doctrine was published unto you, and did ye confess, when ye were baptized] And they said, into the baptism of John. [That is, we were baptized by John, upon confession of the doctrine which John taught of Christ, and thereupon baptized his disciples. See Acts 18. 25.by which baptism the extraordinary gifts of the Holy Ghost were not given, forasmuch as Christ then was not yet glorified, John 7.ver. 39."}],"4":[{"catchword":null,"tekst":"But Paul said, John indeed baptized the baptism of repentance, [That is, by which he preached repentance, and which engaged the baptized to repentance. Whereby as also by that which followeth he sheweth, that the baptism of John in it selfe, as concerning its essence, is the same with the baptism of the Apostles: as having all one sign and all one thing signified, and being administred to all one end. But the difference is, that John with his doctrine and baptism pointed at Christ who came after him; and was to accomplish all things: and the Apostles, that Christ being come, hath perfectly performed all things necessary to our Redemption] saying to the people that they should believe in him, who came after him that is in Christ Jesus."}],"5":[{"catchword":null,"tekst":"And they that [Or, and when they heard it: namely, the Disciples of John] heard (him) [namely, John the Baptist: for these are the words of Paul relating how John baptized his Disciples, which appears from the Greek text in which the two particles men, that is, indeed, and de, that is, but or and (whereof the one goeth before in the fourth verse, and the other followes in the fifth verse) shew that the things which are said in these two verses, must be joined together, and that one and the same person and thing is spoken of. So that from hence It cannot be proved that these disciples should be re-baptized by Paul] were baptized in the name of the Lord Jesus. See Acts 8. 16.and 10. 48.]"}],"6":[{"catchword":null,"tekst":"And when Paul had laid hands on them, See Acts 8. 17.] the holy Ghost [that is, the extraordinary gifts of the holy Ghost, which presently after are expressed] came upon them: and they spake with (strange) languages [Gr.tongues] and prophecyed. [that is, declared things to come, or spake of divine things, and interpreted the writings of the rophets. See 1 Cor. 14. 3."}],"7":[{"catchword":null,"tekst":"And all these were about twelve men."}],"8":[{"catchword":null,"tekst":"And he went into the Synagogue and spake boldly, treating (with them) for three moneths, and advising (them) the things of the kingdome of God. [That is, which concern everlasting salvation,]"}],"9":[{"catchword":null,"tekst":"But when some grew hardned, and were disobedient [Or imperswasible] speaking of the way (of the Lord) [that is, doctrine. See Acts 18. 25.] before the people, he removed from them and separated the disciples, treating daily in the Schoole of a certain man called Tyranus, [this word is former times signified with the Greekes any one that had dominion: and forasmuch as the same was abused, any one afterwards who either unlawfully assumws dominion, or abuseth the same by injustice and cruelty was so called. But here it seems to be a proper name of a man, who had caused this Schoole to be built.]"}],"10":[{"catchword":null,"tekst":"And this was done fro two years, so that all [That is, very many, almost all] which dwelt in Asia [namely, Asia the less] heard the word of the Lord Jesus, [that is, concerning the Lord Jesus] both Jews and Greeks."}],"11":[{"catchword":null,"tekst":"And God did unusuall mighty (works) [That is, miracles] by the hands of Paul: [that is, by the ministry, Acts 5. 12.]"}],"12":[{"catchword":null,"tekst":"So that even from his body were carried upon the sick, handkerchiefs or aprons, and that the sickness departed from them, and the evil spirits, went out of them."}],"13":[{"catchword":null,"tekst":"And some of the wandring Jews [Gr.gang-about i.e. running about the country to get gain thereby] being conjurers [who drove out unclean Spirits by ad juring them by the name of God: which the unclean Spirits suffered them to do, to keepe men in subscription] took upon them to name the name of Jesus over those which had those evil spirits: saying, we adjure you by Jesus whom Paul preacheth. [seeing they saw that Paul so powerfully cast out Devils in the name of Jesus, they would imitate the same to have the more honour or gain.]"}],"14":[{"catchword":null,"tekst":"Now (those) were certain seven sons of Sceva: a chief Priest of the jews, [See concerning these chief Priests, Mat. 2. 4.] who did this."}],"15":[{"catchword":null,"tekst":"But the evil spirit answering, said, Jesus I know, [Namely, that he hath power to cast me ou] and Paul I know: but ye who are ye? [that is, what power have ye for to command me?]"}],"16":[{"catchword":null,"tekst":"And the man in whom the evil spirit was, leapt upon them; and being become master of them, [Gr.having got dominion over them] got the upper-hand against them, so that they sted out of that house naked and wounded."}],"17":[{"catchword":null,"tekst":"And this was known to all both Jews and Greeks who dwelt at Ephesus: and there fell a fear upon them all, and the name of the Lord Jesus was magnified."}],"18":[{"catchword":null,"tekst":"And many of those which believed came, confessing and declaring [Or telling, i.e. manifesting, relating their deeds. That is, misdeeds, and heinous sins, namely, openly detesting the same, and beseeching counsell and comfort of Paul against the same."}],"19":[{"catchword":null,"tekst":"Many of those also, who had used vain (arts) [Or curious arts. So by a milder name the devilish and black arts of sorcery and soothsaying are called, whereto the Ephesians of old were very much inclined] brought the books together, and burnt them in the presence of all men: and reckoned the worth of them, and found fifty thousand [Gr.five times ten thousand of silver] (peeces) of silver. [Or drams of silver, each dram of silver being reckoned for fix (dutch) stivers, Mat. 18. 28.so as this sum maketh fifteen thousand (dutch) gilders, which is, about one thousand five hundred pounds sterling.]"}],"20":[{"catchword":null,"tekst":"So grew [See Acts 12. 24.] the word of the Lord with power, [That is, very mightily] and prevailed."}],"21":[{"catchword":null,"tekst":"And when these things were accomplished [Gr.fulfilled] Paul purposed [Gr. Paul set in the spirit] in the spirit, [that is, in his mind. Or, by the spirit, namely, the Holy spirit, who inspired him how to order his journeys] having gone through Macedonia and Achaia [namely, under one to visit the Churches in those Countreys] to travel unto Jerusalem: saying, after that I shall have been there, I must also see Rome. [this seemeth also to be particularly revealed unto him by God. Upon what occasion and how he afterwards came to Rome, is described Acts 25. 12.and 26. 32.and in the two following chapters.]"}],"22":[{"catchword":null,"tekst":"And when he had sent to Macedonia [Namely, to prepare the way for him, and to collect the alms for the poor at Jerusalem, 1 Cor. 4. 17.] two of them that served him, [namely, in the ministry of the word: seeing he alone could not perform all] namely, Timotheus and Erastus, he himself abode (for) a time in Asia."}],"23":[{"catchword":null,"tekst":"But at that same time there arose no small trouble, by reason of the way (of the Lord.) [that is, the Christian Religion. See Acts 18. 25.]"}],"24":[{"catchword":null,"tekst":"For one by name Demetrius a silver-smith [Gr.silver-striker, silver-coiner] who made (little) silver Temples of Diana [that is, made little representations of th great Temple of Diana of silver, or expressed it in pieces of silver-mony: in which stood a little Image of Diana, which the Heathen coming to Ephesus to worship Diana, bought and took with them to give Religious honour to the same at home, as we see even at this day is done at Loretto and elsewhere] brought no small gain to those of that art."}],"25":[{"catchword":null,"tekst":"Whom he having gathered together, [Gr.having brought together on an heap] with // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';

}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
