vangen door de gemeente, en de apostelen, en de oudsten; en zij verkondigden wat grote dingen God met hen gedaan had.","5":"Maar, zeiden zij, er zijn sommigen opgestaan van de sekte van de Farizeeën, die gelovig geworden zijn, en zij zeiden dat men hen moet besnijden, en gebieden de wet van Mozes te onderhouden.","6":"En de apostelen en de oudsten kwamen samen om op deze zaak te letten.","7":"En toen daarover een grote twist ontstond, stond Petrus op en zei tegen hen: Mannen broeders, u weet dat God van lang geleden onder ons mij uitgekozen heeft, dat de heidenen door mijn mond het woord van het Evangelie zouden horen, en geloven.","8":"En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons;","9":"en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.","10":"Nu dan, waarom verzoekt u God, door een juk op de hals van de discipelen te leggen, dat noch onze vaders, noch wij hebben kunnen dragen?","11":"Maar wij geloven door de genade van de Heere Jezus Christus zalig te worden, op dezelfde wijze als ook zij.","12":"En heel de menigte zweeg stil, en zij hoorden Barnabas en Paulus vertellen wat grote tekenen en wonderen God door hen onder de heidenen gedaan had.","13":"En nadat dezen zwegen, antwoordde Jakobus en zei: Mannen broeders, hoor mij.","14":"Simeon heeft verteld hoe God eerst naar de heidenen omgezien heeft, om uit hen een volk aan te nemen voor Zijn Naam.","15":"En hiermee stemmen de woorden van de profeten overeen, zoals geschreven is:","16":"Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,","17":"opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.","18":"Aan God zijn al Zijn werken van eeuwigheid af bekend.","19":"Daarom oordeel ik dat men degenen die zich uit de heidenen tot God bekeren, niet moet lastigvallen;","20":"maar hun schrijven dat zij zich onthouden van de dingen die door de afgoden besmet zijn, en van hoererij, en van het verstikte, en van bloed.","21":"Want Mozes heeft van oude tijden af in elke stad mensen die hem prediken, en hij wordt elke sabbat in de synagogen gelezen.","22":"Toen vonden de apostelen en de oudsten, met heel de gemeente, het goed enkele mannen uit hun midden te kiezen, en met Paulus en Barnabas naar Antiochië te zenden, namelijk Judas, die bijgenaamd wordt Barsabas, en Silas, mannen die voorgangers waren onder de broeders.","23":"En zij schreven door hen het volgende: De apostelen, en de oudsten, en de broeders wensen de broeders uit de heidenen, die in Antiochië, en Syrië, en Cilicië zijn, gegroet.","24":"Aangezien wij gehoord hebben dat sommigen die van ons uitgegaan zijn, u met woorden verontrust hebben en uw zielen aan het wankelen gebracht hebben, en zeiden dat u besneden moet worden, en de wet moet onderhouden; aan wie wij dat niet opgedragen hadden;","25":"hebben wij, eensgezind samen zijnde, het goed gevonden enkele mannen te kiezen, en tot u te zenden, met onze geliefden Barnabas en Paulus,","26":"mensen die hun leven overgegeven hebben voor de Naam van onze Heere Jezus Christus.","27":"Wij hebben dan Judas en Silas gezonden, die ook zelf mondeling hetzelfde zullen meedelen.","28":"Want het heeft de Heilige Geest en ons goed gedacht, u geen grotere last op te leggen dan deze noodzakelijke dingen:","29":"namelijk dat u zich onthoudt van hetgeen aan de afgoden geofferd is, en van bloed, en van het verstikte, en van hoererij; als u zich voor deze dingen wacht, zult u er goed aan doen. Vaarwel.","30":"Zij dan, hun afscheid ontvangen hebbend, kwamen in Antiochië; en nadat zij de menigte hadden samengeroepen, gaven zij de brief af.","31":"En toen zij die gelezen hadden, verblijdden zij zich over de bemoediging.","32":"Judas nu en Silas, die zelf ook profeten waren, bemoedigden de broeders met veel woorden, en versterkten hen.","33":"En toen zij daar enige tijd vertoefd hadden, lieten de broeders hen in vrede terugkeren naar de apostelen.","34":"Maar Silas vond het goed daar te blijven.","35":"En Paulus en Barnabas bleven in Antiochië, terwijl zij met nog veel anderen het Woord van de Heere onderwezen en verkondigden.","36":"En na enige dagen zei Paulus tegen Barnabas: Laten wij nu teruggaan en onze broeders bezoeken in elke stad waarin wij het Woord van de Heere verkondigd hebben, om te zien hoe het met hen gaat.","37":"En Barnabas besloot Johannes, die Markus genoemd wordt, mee te nemen.","38":"Maar Paulus vond het niet passend hem mee te nemen, omdat hij van Pamfylië af van hen was weggegaan, en niet met hen was meegegaan tot het werk.","39":"Er ontstond dan een verbittering, zodat zij van elkaar gescheiden zijn; en Barnabas nam Markus mee, en scheepte af naar Cyprus;","40":"maar Paulus verkoos Silas, en vertrok, door de broeders aan de genade van God toevertrouwd.","41":"En hij doorreisde Syrië en Cilicië, en versterkte de gemeenten."},"SV":{"1":"En sommigen, die afgekomen waren van Judea, leerden de broederen, *zeggende*: Indien gij niet besneden wordt naar de wijze van Mozes, zo kunt gij niet zalig worden.","2":"Als er dan geen kleine wederstand en twisting geschiedde bij Paulus en Barnabas tegen hen, zo hebben zij geordineerd, dat Paulus en Barnabas, en enige anderen uit hen, zouden opgaan tot de apostelen en ouderlingen naar Jeruzalem, over deze vraag.","3":"Zij dan, van de Gemeente uitgeleid zijnde, reisden door Fenicië en Samarië, verhalende de bekering der heidenen; en deden al den broederen grote blijdschap aan.","4":"En te Jeruzalem gekomen zijnde, werden zij ontvangen van de Gemeente, en de apostelen, en de ouderlingen; en zij verkondigden, wat grote dingen God met hen gedaan had.","5":"Maar, *zeiden* *zij*, er zijn sommigen opgestaan van die van de sekte der Farizeën, die gelovig zijn geworden, zeggende, dat men hen moet besnijden, en gebieden de wet van Mozes te onderhouden.","6":"En de apostelen en de ouderlingen vergaderden te zamen, om op deze zaak te letten.","7":"En als *daarover* grote twisting geschiedde, stond Petrus op en zeide tot hen: Mannen broeders, gij weet, dat God van over langen tijd onder ons *mij* verkoren heeft, dat de heidenen door mijn mond het woord des Evangelies zouden horen, en geloven.","8":"En God, de Kenner der harten, heeft hun getuigenis gegeven, hun gevende den Heiligen Geest, gelijk als ook ons;","9":"En heeft geen onderscheid gemaakt tussen ons en hen, gereinigd hebbende hun harten door het geloof.","10":"Nu dan, wat verzoekt gij God, om een juk op den hals der discipelen te leggen, hetwelk noch onze vaders, noch wij hebben kunnen dragen?","11":"Maar wij geloven, door de genade van den Heere Jezus Christus, zalig te worden, op zulke wijze als ook zij.","12":"En al de menigte zweeg stil, en zij hoorden Barnabas en Paulus verhalen, wat grote tekenen en wonderen God door hen onder de heidenen gedaan had.","13":"En nadat deze zwegen, antwoordde Jakobus, zeggende: Mannen broeders, hoort mij.","14":"Simeon heeft verhaald hoe God eerst de heidenen heeft bezocht, om uit *hen* een volk aan te nemen voor Zijn Naam.","15":"En hiermede stemmen overeen de woorden der profeten, gelijk geschreven is:","16":"Na dezen zal Ik wederkeren, en weder opbouwen de tabernakel van David, die vervallen is, en hetgeen daarvan verbroken is, weder opbouwen, en Ik zal denzelven weder oprichten.","17":"Opdat de overblijvende mensen den Heere zoeken, en al de heidenen, over welken Mijn Naam aangeroepen is, spreekt de Heere, Die dit alles doet.","18":"Gode zijn al Zijn werken van eeuwigheid bekend.","19":"Daarom oordeel ik, dat men degenen, die uit de heidenen zich tot God bekeren, niet beroere;","20":"Maar hun zal aanschrijven, dat zij zich onthouden van de dingen, die door de afgoden besmet zijn, en van hoererij, en van het verstikte, en van bloed.","21":"Want Mozes heeft er van oude tijden in elke stad, die hem prediken, en hij wordt op elken sabbat in de synagogen gelezen.","22":"Toen heeft het den apostelen en den ouderlingen, met de gehele Gemeente, goed gedacht, *enige* mannen uit zich te verkiezen, en met Paulus en Barnabas te zenden naar Antiochië: *namelijk* Judas, die toegenaamd wordt Barsabas, en Silas, mannen, die voorgangers waren onder de broeders.","23":"En zij schreven door hen dit *navolgende*: De apostelen, en de ouderlingen, en de broeders *wensen* den broederen uit de heidenen, die in Antiochië, en Syrië, en Cilicië zijn, zaligheid.","24":"Nademaal wij gehoord hebben, dat sommigen, die van ons uitgegaan zijn, u met woorden ontroerd hebben en uw zielen wankelende gemaakt, zeggende, dat gij moet besneden worden, en de wet onderhouden; welken wij *dat* niet bevolen hadden;","25":"Zo heeft het ons eendrachtelijk te zamen zijnde, goed gedacht, *enige* mannen te verkiezen, en tot u te zenden, met onze geliefden, Barnabas en Paulus.","26":"Mensen, die hun zielen overgegeven hebben voor den Naam van onzen Heere Jezus Christus.","27":"Wij hebben dan Judas en Silas gezonden, die ook met den mond hetzelfde zullen verkondigen.","28":"Want het heeft den Heiligen Geest en ons goed gedacht, ulieden geen meerderen last op te leggen dan deze noodzakelijke dingen:","29":"*Namelijk*, dat gij u onthoudt van hetgeen den afgoden geofferd is, en van bloed, en van het verstikte, en van hoererij; van welke dingen, indien gij uzelven wacht, zo zult gij weldoen. Vaart wel.","30":"Dezen dan, hun afscheid ontvangen hebbende, kwamen te Antiochië; en de menigte vergaderd hebbende, gaven zij den brief over.","31":"En zij, *dien* gelezen hebbende, verblijdden zich over de vertroosting.","32":"Judas nu en Silas, die ook zelven profeten waren, vermaanden de broeders met vele woorden, en versterkten hen.","33":"En als zij *daar* een tijd *lang* vertoefd hadden, lieten hen de broeders *wederom* gaan met vrede, tot de apostelen.","34":"Maar het dacht Silas goed aldaar te blijven.","35":"En Paulus en Barnabas onthielden zich te Antiochië, lerende en verkondigende met nog vele anderen, het Woord des Heeren.","36":"En na enige dagen zeide Paulus tot Barnabas: Laat ons nu wederkeren, en bezoeken onze broeders in elke stad, in welke wij het Woord des Heeren verkondigd hebben, hoe zij het hebben.","37":"En Barnabas ried, dat zij Johannes, die genaamd is Markus, zouden medenemen.","38":"Maar Paulus achtte billijk, dat men dien niet zoude medenemen, die van Pamfylië af van hen was afgeweken, en met hen niet was gegaan tot het werk.","39":"Er ontstond dan een verbittering, alzo dat zij van elkander gescheiden zijn, en dat Barnabas Markus medenam, en naar Cyprus afscheepte;","40":"Maar Paulus verkoos Silas, en reisde heen, der genade Gods van de broederen bevolen zijnde.","41":"En hij doorreisde Syrië en Cilicië, versterkende de Gemeenten."},"KJV":{"1":"And certain men which came down from Judaea taught the brethren, *and said*, Except ye be circumcised after the manner of Moses, ye cannot be saved.","2":"When therefore Paul and Barnabas had no small dissension and disputation with them, they determined that Paul and Barnabas, and certain other of them, should go up to Jerusalem unto the apostles and elders about this question.","3":"And being brought on their way by the church, they passed through Phenice and Samaria, declaring the conversion of the Gentiles: and they caused great joy unto all the brethren.","4":"And when they were come to Jerusalem, they were received of the church, and *of* the apostles and elders, and they declared all things that God had done with them.","5":"But there rose up certain of the sect of the Pharisees which believed, saying, That it was needful to circumcise them, and to command *them* to keep the law of Moses.","6":"And the apostles and elders came together for to consider of this matter.","7":"And when there had been much disputing, Peter rose up, and said unto them, Men *and* brethren, ye know how that a good while ago God made choice among us, that the Gentiles by my mouth should hear the word of the gospel, and believe.","8":"And God, which knoweth the hearts, bare them witness, giving them the Holy Ghost, even as *he did* unto us;","9":"And put no difference between us and them, purifying their hearts by faith.","10":"Now therefore why tempt ye God, to put a yoke upon the neck of the disciples, which neither our fathers nor we were able to bear?","11":"But we believe that through the grace of the Lord Jesus Christ we shall be saved, even as they.","12":"Then all the multitude kept silence, and gave audience to Barnabas and Paul, declaring what miracles and wonders God had wrought among the Gentiles by them.","13":"And after they had held their peace, James answered, saying, Men *and* brethren, hearken unto me:","14":"Simeon hath declared how God at the first did visit the Gentiles, to take out of them a people for his name.","15":"And to this agree the words of the prophets; as it is written,","16":"After this I will return, and will build again the tabernacle of David, which is fallen down; and I will build again the ruins thereof, and I will set it up:","17":"That the residue of men might seek after the Lord, and all the Gentiles, upon whom my name is called, saith the Lord, who doeth all these things.","18":"Known unto God are all his works from the beginning of the world.","19":"Wherefore my sentence is, that we trouble not them, which from among the Gentiles are turned to God:","20":"But that we write unto them, that they abstain from pollutions of idols, and *from* fornication, and *from* things strangled, and *from* blood.","21":"For Moses of old time hath in every city them that preach him, being read in the synagogues every sabbath day.","22":"Then pleased it the apostles and elders, with the whole church, to send chosen men of their own company to Antioch with Paul and Barnabas; *namely*, Judas surnamed Barsabas, and Silas, chief men among the brethren:","23":"And they wrote *letters* by them after this manner; The apostles and elders and brethren *send* greeting unto the brethren which are of the Gentiles in Antioch and Syria and Cilicia:","24":"Forasmuch as we have heard, that certain which went out from us have troubled you with words, subverting your souls, saying, *Ye must* be circumcised, and keep the law: to whom we gave no *such* commandment:","25":"It seemed good unto us, being assembled with one accord, to send chosen men unto you with our beloved Barnabas and Paul,","26":"Men that have hazarded their lives for the name of our Lord Jesus Christ.","27":"We have sent therefore Judas and Silas, who shall also tell *you* the same things by mouth.","28":"For it seemed good to the Holy Ghost, and to us, to lay upon you no greater burden than these necessary things;","29":"That ye abstain from meats offered to idols, and from blood, and from things strangled, and from fornication: from which if ye keep yourselves, ye shall do well. Fare ye well.","30":"So when they were dismissed, they came to Antioch: and when they had gathered the multitude together, they delivered the epistle:","31":"*Which* when they had read, they rejoiced for the consolation.","32":"And Judas and Silas, being prophets also themselves, exhorted the brethren with many words, and confirmed","33":"And after they had tarried *there* a space, they were let go in peace from the brethren unto the apostles.","34":"Notwithstanding it pleased Silas to abide there still.","35":"Paul also and Barnabas continued in Antioch, teaching and preaching the word of the Lord, with many others also.","36":"And some days after Paul said unto Barnabas, Let us go again and visit our brethren in every city where we have preached the word of the Lord, *and see* how they do.","37":"And Barnabas determined to take with them John, whose surname was Mark.","38":"But Paul thought not good to take him with them, who departed from them from Pamphylia, and went not with them to the work.","39":"And the contention was so sharp between them, that they departed asunder one from the other: and so Barnabas took Mark, and sailed unto Cyprus;","40":"And Paul chose Silas, and departed, being recommended by the brethren unto the grace of God.","41":"And he went through Syria and Cilicia, confirming the churches."}},"tsk":{"1":[{"kopje":"sommigen","refs":["Hand 21:20","Gal 2:4","Gal 2:12","Gal 2:13"]},{"kopje":"de broeders","refs":["Hand 15:23"]},{"kopje":"Als","refs":["Hand 15:5","Rom 4:8-12","Gal 5:1-4","Fil 3:2","Fil 3:3","Kol 2:8","Kol 2:11","Kol 2:12","Kol 2:16"]},{"kopje":"naar","refs":["Gen 17:10-27","Lev 12:3","Joh 7:22"]},{"kopje":"u","refs":["Hand 15:24","1 Kor 7:18","1 Kor 7:19","Gal 2:1","Gal 2:3","Gal 5:6","Gal 6:13-16"]}],"2":[{"kopje":"Paulus","refs":["Hand 15:7","Gal 1:6-10","Gal 2:5","Judas 1:3"]},{"kopje":"hebben zij afgesproken","refs":["Hand 15:25","Ex 18:23","Gal 2:1","Gal 2:2"]},{"kopje":"enigen","refs":["Hand 15:22","Hand 15:27","Hand 10:23","Hand 11:12"]},{"kopje":"zouden","refs":["Hand 15:4","Hand 15:22","Hand 15:23","1 Sam 8:7","1 Kor 9:19-23","Gal 2:2","Filem 1:8","Filem 1:9"]},{"kopje":"de apostelen","refs":["Hand 15:6","Hand 15:23","Hand 21:18","1 Kor 1:1","2 Kor 11:5"]}],"3":[{"kopje":"uitgeleid","refs":["Hand 21:5","Hand 28:15","Rom 15:24","1 Kor 16:6","1 Kor 16:11","Tit 3:13","3 Joh 1:6-8"]},{"kopje":"reisden","refs":["Hand 8:14","Hand 11:19"]},{"kopje":"vertelden","refs":["Hand 15:12","Hand 14:27","Hand 21:19","Hand 21:20"]},{"kopje":"zij deden","refs":["Hand 11:18","Hand 13:48","Hand 13:52","Jes 60:4","Jes 60:5","Jes 66:12-14","Luk 15:5-10","Luk 15:23","Luk 15:24","Luk 15:32"]}],"4":[{"kopje":"ontvangen","refs":["Hand 18:27","Hand 21:17","Matt 10:40","Rom 15:7","Kol 4:10","2 Joh 1:10","3 Joh 1:8-10"]},{"kopje":"wat grote dingen","refs":["Hand 15:3","Hand 15:12","Hand 14:27","Hand 21:19","Rom 15:18","1 Kor 15:10","2 Kor 5:19","2 Kor 6:1"]}],"5":[{"kopje":"sommigen","refs":["Hand 21:20","Hand 26:5" 2":[{"catchword":"wederstand","tekst":"Of, als er dan een oproer geschiedde, en geen kleine twisting bij, enz."},{"catchword":"twisting","tekst":"Grieks samenvraging; dat is, disputering, vs.7."},{"catchword":"Paulus en","tekst":"Die zich tegen deze valse leer stelden."},{"catchword":"zij geordineerd,","tekst":"Namelijk de voorstanders der gemeente te Antiochië."},{"catchword":"tot de apostelen","tekst":"Namelijk Petrus, Jakobus en Johannes; Gal 2:9 ."},{"catchword":"vraag","tekst":"Of, kwestie, geschil. Zie Act 18:15 ."}],"3":[{"catchword":"van de Gemeente","tekst":"Hetwelk de gemeente deed, om te tonen dat deze zaak niet alleen Paulus en Barnabas, maar de gehele gemeente aanging."},{"catchword":"de bekering","tekst":"Namelijk tot den Christelijken godsdienst."},{"catchword":"deden al","tekst":"Grieks maakten."}],"4":[{"catchword":"met hen gedaan","tekst":"Dat is, door hen. Zie Act 14:27 ."}],"5":[{"catchword":"zeiden zij,","tekst":"Deze woorden zijn daarbij gedaan opdat men mag verstaan dat deze woorden niet van Lukas, maar van Paulus verhaald worden."},{"catchword":"sekte der","tekst":"Grieks ketterij. Zie van dit woord de verklaring Act 5:17 , en van de Farizeën Mat 3:7 ."},{"catchword":"die gelovig","tekst":"Dat is, die den Christelijken godsdienst hadden aangenomen, doch, gelijk het blijkt, den ouden zuurdesem der Farizeën niet ten enenmale afgelegd hadden."},{"catchword":"hen moet besnijden,","tekst":"Namelijk die zich uit het heidendom tot de Christelijke religie begeven; Act 14:27 ."},{"catchword":"de wet van","tekst":"Namelijk der ceremoniën, vs.24. Hoewel het ook verstaan kan worden van de wet der zeden, om daardoor gerechtvaardigd te worden."}],"6":[{"catchword":"vergaderden","tekst":"Dit is de eerste vergadering, consilie, of synode, die over kwestiën van de religie in het Nieuwe Testament is gehouden."},{"catchword":"om op deze zaak","tekst":"Grieks om over dit woord te zien. Heb"}],"7":[{"catchword":"twisting geschiedde,","tekst":"Grieks samenvraging; dat is, disputering, namelijk tussen beide partijen, die beide moeten gehoord worden."},{"catchword":"over langen tijd","tekst":"Grieks van oude dagen; welken tijd sommigen verstaan van het begin der predikatie van de apostelen na de hemelvaart van Christus; anderen van den tijd der bekering van Cornelius; Hand. 10."}],"8":[{"catchword":"getuigenis","tekst":"Namelijk dat zij hem ook aangenaam waren; Act 10:28 ."},{"catchword":"den Heiligen","tekst":"Dat is, de gaven des Heiligen Geestes, zo gewone als buitengewone."}],"9":[{"catchword":"geen onderscheid","tekst":"Namelijk aangaande de weldaden en gaven, die gemeen zijn dengenen, die in Christus geloven."}],"10":[{"catchword":"een juk op","tekst":"Namelijk de wet der ceremoniën, vs.5."},{"catchword":"dragen?","tekst":"Dat is, volkomen onderhouden, noch daardoor gerechtvaardigd worden. Zie de aantekeningen Act 13:39 ."}],"11":[{"catchword":"de genade van","tekst":"Dat is, door het lijden en de gerechtigheid van Jezus Christus, waarmede hij ons de genade Gods verdiend heeft, waarvan de ceremoniën der wet een voorbeeld waren; Joh 1:17 ."},{"catchword":"zij","tekst":"Namelijk onze vaders zalig zijn geworden door dezelfde genade."}],"12":[{"catchword":"de menigte","tekst":"Namelijk niet der gemeente, maar der apostelen en ouderlingen. Zie vs.4."},{"catchword":"zweeg stil,","tekst":"Namelijk daarmede betonende hunne toestemming in hetgeen van Petrus gezegd was."}],"13":[{"catchword":"deze zwegen,","tekst":"Namelijk Paulus en Barnabas."},{"catchword":"antwoordde","tekst":"Dat is, begon te spreken, Hebreën."},{"catchword":"Jakobus,","tekst":"Namelijk Alfeus' zoon, Jakobus de kleine. Zie van hem Act 12:17 ."}],"14":[{"catchword":"Simeon heeft","tekst":"Namelijk Petrus, die zichzelven ook zo noemt, 2Pe 1:1 . Anders ook Simon; Mat 10:2 ."},{"catchword":"eerst de heidenen","tekst":"Dat is, overlang, vs.7."},{"catchword":"bezocht, om","tekst":"Of, aangezien."},{"catchword":"door Zijn Naam","tekst":"Dat is, voor zichzelven. Of, in zijnen naam. Of, dat zijn volk zou genoemd worden, vs.17."}],"16":[{"catchword":"de tabernakel","tekst":"Dat is, de gemeente in welke Christus de Zoon Davids woont."},{"catchword":"verbroken is,","tekst":"Grieks ondergraven; namelijk in de gelovige Joden, in welker plaats de heidenen als levende stenen gebouwd zijn."}],"17":[{"catchword":"overblijvende","tekst":"Dat is, niet alleen de Joden, maar ook de andere volken, welke Amos Edom noemt; zie Amo 9:11-12 ."},{"catchword":"Naam aangeroepen","tekst":"Grieks over hen aangeroepen, of genaamd is; zie Act 11:26 ."}],"18":[{"catchword":"van eeuwigheid bekend","tekst":"Dat is, al wat God in den tijd doet, dat heeft Hij van eeuwigheid besloten alzo te doen."}],"19":[{"catchword":"oordeel ik, dat","tekst":"Dat is, dit is mijn gevoelen en mening in deze zaak."},{"catchword":"beroere;","tekst":"Of, ongerust te maken, of dat men hen niet ongerust moet maken."}],"20":[{"catchword":"die door de afgoden","tekst":"Grieks besmettingen der afgoden; dat is, van spijs of drank den afgoden opgeofferd, en die daardoor besmet zijn, gelijk vs.29 verklaard wordt."},{"catchword":"hoererij","tekst":"Dit verstaan sommigen van de lichamelijke hoererij, die wel in zichzelve niet middelmatig is, Exo 20:14 ; maar van de heidenen voor gene zonde en voor middelmatig gehouden werd; 1Co 6:13-15 ; anderen, van de geestelijke hoererij, dat is, afgoderij, die doorgaans van de profeten hoererij genaamd wordt, Exo 34:16 ; Lev 20:5 ; Jdg 2:17 ; Psa 106:39 ; Isa 23:17 ; Jer 3:6 , Jer 3:8 ; Eze 16:15-16 ; en namelijk van die soort van afgoderij, die sommigen uit de heidenen, bekeerd zijnde, bedreven, etende in de tempels der afgoden hetgeen dezen was opgeofferd; waarvan de apostel spreekt 1Co 8:9-10 , en 1Co 10:14 , 1Co 10:21 ; hetwelk zij meenden, hun door de Christelijke vrijheid geoorloofd te zijn, en zij dikwijls deden met groten aanstoot der zwakken."},{"catchword":"verstikte, en","tekst":"Dat is, van beesten, die gestorven waren zonder bloed te laten, dat den Joden een gruwel was. Zie Gen 9:4 ; Lev 3:17 ; Deu 12:23 ."},{"catchword":"bloed","tekst":"Namelijk van het beest afgezonderd, hetzij geronnen gegeten, of ongeronnen gedronken, hetwelk God verboden had, om de mensen van alle wreedheid en bloedstorting af te schrikken; Gen 9:4 ."}],"21":[{"catchword":"tijden in elke","tekst":"Grieks geslachten."},{"catchword":"hij wordt op","tekst":"Dat is, zijne schriften; Neh 8:1 ; Luk 16:29 ."}],"22":[{"catchword":"met de gehele","tekst":"Namelijk die het besluit der apostelen en ouderlingen voor goed gekend had."},{"catchword":"Silas, mannen,","tekst":"Deze is dezelfde, die Silvanus genaamd wordt 1Th 1:1 , en 2Th 1:1 ."},{"catchword":"voorgangers","tekst":"Dat is, die onder de voornaamsten waren van aanzien, kennis en beleid onder de kerkedienaren aldaar."}],"23":[{"catchword":"door hen dit","tekst":"Grieks door hunne hand; dat is dienst, Hebreën, Act 7:25 ; namelijk om van hen gedragen te worden aan de gemeente te Antiochië."},{"catchword":"broeders wensen","tekst":"Namelijk de andere gemene broeders der gemeente van Jeruzalem, die hetzelve ook hadden goedgevonden."},{"catchword":"zaligheid","tekst":"Grieks blijde te zijn; hetwelk was een gemene wijze van groetenis, in het begin der brieven bij de Grieken gebruikelijk. Zie Act 23:26 ."}],"24":[{"catchword":"die van ons","tekst":"Zie vs.1, en 1Jo 2:19 ."},{"catchword":"wankelende gemaakt,","tekst":"Dat is, de vastigheid uws geloofs en de gerustheid uws gemoeds gelijk als los en onvast makende."},{"catchword":"wet onderhouden;","tekst":"Zie de aantekeningen vs.5."},{"catchword":"niet bevolen hadden;","tekst":"Dat is, geen last gegeven hebben zulks te leren, hoewel zij onzen naam misbruiken."}],"26":[{"catchword":"overgegeven hebben","tekst":"Dat is, die met groot gevaar huns levens het Evangelie vrijmoedig gepredikt hebben."}],"27":[{"catchword":"met den mond","tekst":"Grieks met, of door het woord."}],"28":[{"catchword":"ons goed gedacht,","tekst":"Dat is, ons door ingeven des Heiligen Geestes."},{"catchword":"geen meerderen","tekst":"Zie hiervan de verklaring vs.10."},{"catchword":"noodzakelijke dingen","tekst":"Namelijk voor dezen tijd; welke hoewel zij niet eigenlijk ter zaligheid noodwendig zijn [uitgenomen het vlieden van hoererij en afgoderij], zo zijn zij nochtans nodig onderhouden te worden tot noodzakelijken vrede en stichting der gemeente, om der zwakgelovige Joden wil."}],"29":[{"catchword":"hetgeen den afgoden","tekst":"Zie hiervan 1Co 8 , door het gehele hoofdstuk."},{"catchword":"weldoen","tekst":"Of, welvaren."},{"catchword":"Vaart wel","tekst":"Grieks zij, of wordt gesterkt. Een wijze van spreken bij de Grieken gebruikelijk in het sluiten van de brieven. Zie Act 23:30 ."}],"30":[{"catchword":"de menigte","tekst":"Dat is, de ganse gemeente."}],"31":[{"catchword":"vertroosting","tekst":"Of, vermaning."}],"32":[{"catchword":"profeten waren,","tekst":"Dat is, leraars des Woords, begaafd met de gave van de Heilige Schrift bekwamelijk uit te leggen, die gezonden waren om hunne vermaningen daarbij te doen, vs.27."},{"catchword":"vermaanden de","tekst":"Of, vertroostten."},{"catchword":"versterkten hen","tekst":"Namelijk in het Christengeloof."}],"33":[{"catchword":"een tijd lang","tekst":"Dat is, een zekeren en geruimen tijd; Act 18:23 ."},{"catchword":"vertoefd hadden,","tekst":"Grieks gemaakt hadden; dat is, verbleven waren. Zie Jam 4:13 ."},{"catchword":"met vrede,","tekst":"Dat is, met verlof van de broeders, en met toewensing van allen zegen en geLucas Hebreën."},{"catchword":"tot de apostelen","tekst":"Namelijk naar Jeruzalem, waar nog enige apostelen waren."}],"35":[{"catchword":"onthielden zich","tekst":"Grieks versleten daar; namelijk den tijd."},{"catchword":"verkondigende","tekst":"Grieks Evangeliserende."}],"36":[{"catchword":"hoe zij het hebben","tekst":"Dat is, om te vernemen hoe het met hen staat, aangaande het geloof."}],"37":[{"catchword":"ried, dat zij","tekst":"Of, wilde."}],"38":[{"catchword":"achtte billijk,","tekst":"Of, begeerde."},{"catchword":"afgeweken, en","tekst":"Grieks afgestaan. Zie Act 13:13 ."},{"catchword":"het werk","tekst":"Namelijk om den heidenen het Evangelie te prediken, waartoe de Heilige Geest hen geroepen had om dat te volbrengen; Act 13:2 ."}],"39":[{"catchword":"verbittering, alzo","tekst":"Of, hevigheid, welke deze heilige mannen overkomen is door menselijke zwakheid, daarmede tonende waar te zijn, hetgeen zij van zichzelven zeggen; Act 14:15 . Doch God heeft dit ten beste gekeerd, alzo zij aldus van elkander gescheiden zijnde, het Evangelie van hen in meer plaatsen tevens is verkondigd geworden."}],"40":[{"catchword":"verkoos Silas,","tekst":"Of, nam tot zich."},{"catchword":"bevolen zijnde","tekst":"Grieks overgegeven zijnde."}],"41":[{"catchword":"de Gemeenten","tekst":"Namelijk, die in die landen vergaderd waren."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And some [Namely of the Jews which had betaken them to the Christian Religion, v. 5.amongst whom the Ancient Doctors think that the Herestick Cerinthus also was. Epiphan.haeres. 28.] which were come down from Judea, [namely, unto Antioch] taught the brethren, saying (if ye) [namely, which of the Gentiles are converted to the Christian Religion] be not circumcised after the manner of Moseh, [i.e. if besides that, ye do not cause you selves to be circumcised and do not observe the ceremonial Law] ye cannot be saved."}],"2":[{"catchword":null,"tekst":"When therefore no small resistance [Or when therefore an uproar was made, and no small contention to, &c.] and contention [Gr.interquestioning, i.edisputing v.7] hapned to Paul and Barnabas against them [who opposed this false doctrine] they ordered [namely the Governors of the Church at Antioch] that Paul and Barnabas and some others of them should go up to the Apostles, [namely Peter and James and John, Gal. 2.v. 9.] and Elders to Jerusalem about this demand. [or question, difference. See also Acts 18. 15.]"}],"3":[{"catchword":null,"tekst":"They therefore being brought forth by the Church, [Which the Church did, to shew that this business concerned not only Paul and Barnabas, but the whole Church] travelled through Phoenica and Samaria, relating the conversion of the Gentiles, [Namely, to the Christian Religion] and caused [Gr.made] great joy unto all the brethren."}],"4":[{"catchword":null,"tekst":"And being come to Jerusalem they were received of the Church, and the Apostles and Elders, and they declared what great things God had done with them. [That is, by them. See Acts 14.v. 27.]"}],"5":[{"catchword":null,"tekst":"But (said they) [These words are inserted that men may understand that theses words are not related by Luke but by Paul] there are some risen up, of those of thy sect [Gr.heresie. See of this word the exposition on Acts 5. V.17.] of the Pharisees, of whom see Mat. 3. 7.] who are become believers, [that is, who had embraced the Christian Religion, yet as appears, had not wholly cast off the old leaven of the Pharisees] saying, that men must circumcise themselves, [namely, who from heathenism betake themselves to the Christian Religion, Acts 14.v.27.] and command to keep the Law of Moses. [namely, the ceremonial Law, v. 24.although it may also be understood of the moral Law, to be justified thereby.]"}],"6":[{"catchword":null,"tekst":"And the Apostles and the Elders assembled together [This is the first assembly, Council, or Synod which was held in the new Testament about questions of Religion] to take notice of this matter. [Gr.to see about this word. Hebr.]"}],"7":[{"catchword":null,"tekst":"And when great contention [Gr.interquestionning, i.e. disputing, namely, betwixt both parties, which must be heard both of them] hapned (thereabout) Peter stood up and said unto them, men, brethren, ye know that God for a long time agoe [Gr.from old daies, which time some understand of the beginning of the preaching of the Apostles after Christs ascension: others of the time of Cornelius conversion, Acts 10.] amongst us chose (me) that the Gentiles by the mouth should hear the word of the Gospel and believe."}],"8":[{"catchword":null,"tekst":"And God the knower of hearts bare witness, [Namely, that they also were acceptable to him, Acts 10.v. 28.] giving them the Holy Ghost, [that is, the gifts of the Holy Ghost both ordinary and extraordinary]like as to us also."}],"9":[{"catchword":null,"tekst":"And made no difference [Namely, concerning the benefits and gifts which are common to those which believe in Christ] between us and them having cleansed their hearts by faith."}],"10":[{"catchword":null,"tekst":"Now therefore why tempt ye God, to lay a yoak [Namely, the ceremonial Law v. 5.] on the neck of the Disciples, which neither our Fathers nor we able to hear [that is perfectly to keep nor to be justified thereby. See the annot.on chap. 13.v. 39.]"}],"11":[{"catchword":null,"tekst":"But we believe by the grace of the Lord Jesus Christ [That is, by the suffering and the righteousness of Jesus Christ, whereby he hath merited the grace of God for us, whereof the ceremonies of the Law were types, John 1. 17.] to be saved in such manner as they also. [namely, our fathers were saved by the same grace.]"}],"12":[{"catchword":null,"tekst":"And all the multitude [Namely, not of the church, but of the Apostles and Elders, see v.4.] held their peace, [namely, thereby shewing their consent to that which was spoken by Peter] and beard Barnabas and Paul relate, what great signs and wonders God had done by them among the Gentiles."}],"13":[{"catchword":null,"tekst":"And after that these held their peace, [Namely, Paul and Barnabas] James [namely, the son of Alpheus, or James the little. See of him, Acts 12. 17.] answered [that is, began to speak. Heb.] saying, men, brethren, hear me."}],"14":[{"catchword":null,"tekst":"Simeon, [Namely, Peter who also calls himself so, 2 Pet. 1. 1.otherwise also Simeon, Mat 10. 2.] hath related how God first [that is, long ago v.7.] visited the Gentiles [or respected] to receive out of (them) a people, for this name. [that is, for himself. Or in his name, i.e. that should be called his people v. 17.]"}],"15":[{"catchword":null,"tekst":"And herewith agree the words of the Prophets, as it is written."}],"16":[{"catchword":null,"tekst":"After this I will return, and build up again the Tabernacle of David, [That is, the Church, in which Christ the Son of David dwells]which is fallen down, and build up again that which is broken down thereof, [Gr.undermined, namely, in the unbelieving Jews, in whose place the Gentiles are built as living stones] and I will raise the same up again."}],"17":[{"catchword":null,"tekst":"That the remainder of men [That is, not only the Jews but also the other Nations, which Amos calleth Edom. See Amos 9.v.11, 12.] may seek the Lord, and all the Gentiles, on whom my name is called upon [Gr.invocated or named upon them. See Acts 11. 46.] saith the Lord who doth all this."}],"18":[{"catchword":null,"tekst":"To God all his works are known from everlasting. [That is, all that God doth in time, that he determined from everlasting so to do.]"}],"19":[{"catchword":null,"tekst":"Therefore I judge [That is, this is my opinion and apprehension in this matter] that we trouble not [or disquiet, or that they ought not to be disquieted] those who turn to God of the Gentiles."}],"20":[{"catchword":null,"tekst":"But shall write unto them that they abstain from the things which are polluted by Idols [Gr.pollutions of Idols, i.e. from meat or drink sacrificed to Idols to Idols, and which are polluted thereby, as is expounded v.29.] and from whoredome, [this some understand of corporal fornication, which indeed is not indifferent in it self, Ex. 20. 14.but by the Gentiles was accounted no sin, and an indifferent thing, 1 Cor. 6. 13, 14, 15. Others of spiritual fornication, i.e. Idolatry, which is every where by the Prophets called fornication, Exod. 34. 16. Lev. 20. 5. Jud. 2. 17. Psa. 106. 39. Isa. 23. 17. Jer. 3. 6, 8. Ezek. 16. 15, 16. And namely of that sort of Idolatry, which some being converted out of the Heathen committed, eating in the Temples of Idols that which was offered unto the same, whereof the Apostle speaketh, 1 Cor. 8.v.9, 10.and chap.10.v. 14.21.which they thought by Christian liberty to be lawfull for them, and they often did to the great offence of the weake] and from that which is choaked, [that is, from beasts which were dead without letting blood: which was an abomination to the Jews. See Gen 9:4. Lev. 3.17. Deut. 12. 23.] and from blood. [namely, separated from the beast, whether being congealed it be eaten, or not congealed it be drunk, which God had forbidden to affright men from all cruelty and blood-shedding, Gen 9:4.]"}],"21":[{"catchword":null,"tekst":"For Moses of old times [Gr.generations] in each City hath them that preach him, and he is [that is, his writings, Neh. 8. 1. Luke 16. 29.] on every Sabbath read in the Synagogues."}],"22":[{"catchword":null,"tekst":"Then it seemed good to the Apostles and Elders with the whole Church, [Namely, who had approved the decree of the Apostles and Elders] to chuse (certain) men out of themselves, and with Paul and Barnabas to send (them) to Antioch: (namely) Judas who was sirnamed Barsabas, and Silas, [this is the same who is called Silvanus, 1 Thes.chap. 1.v.1.and 2 Thes.1.1.] men who were leaders among the Brethren. [that is, who were of the principal for respect, knowledge and conduct amongst the Ministries there.]"}],"23":[{"catchword":null,"tekst":"And wrote by them [Gr.by their hand, i.e. ministry. Hebr. Acts 7. 25.namely, to be carried by them to the Church of Antioch] this (that followes) the Apostles, and the Elders, and the Brethren, [namely, the other common brethren of the Church of Jerusalem, who also approved the same] (wish) the Brethren of the Gentiles, which are in Antioch, and Syria, and Cilicia salvation. [Gr.to be joyfull, which was a common manner of salutation in the beginning of Epistles, usual with the Greeks. See Acts 23. 26.]"}],"24":[{"catchword":null,"tekst":"Forasmuch as we have heard, that some which are gone forth from us, [See above v.1.and 1Jn 2:19.] have troubled you with words, and made your souls wavering, [that is, making the firmness of your faith and the quieteness of your minds as it were loose and unstedfast] saying that ye must be circumcised, and keep the Law, [namely of Ceremonies. See the annotation on v.5.] to whom we had not commanded (that.) [that is, gave no order to teach thus, howsoever they abuse our Name.]"}],"25":[{"catchword":null,"tekst":"It seemed good to us being unanimously together, to chuse some men, and to send them unto you, with our beloved Barnabas and Paul."}],"26":[{"catchword":null,"tekst":"Men who have given their souls [That is, who have preached the Gospel boldly with great peril of their lives] for the name of our Lord Jesus Christ."}],"27":[{"catchword":null,"tekst":"We have therefore sent Judas and Silas, who also shall declare the same by mouth. [Gr.with, or by word.]"}],"28":[{"catchword":null,"tekst":"For it seemed good to the Holy Ghost and to us, [ That is, to us by inspiration of the Holy Ghost] to lay upon you no greater burden [see the exposition hereof v.10.] then these necessary things. [namely, for this time: which although they be not properly necessary to salvation (except the fleeing from fornication and Idolatry) yet nevertheless they are needful to be observed for necessary peace and edification of the Church, for the weak-believing Jews sake.]"}],"29":[{"catchword":null,"tekst":"(Namely) that ye withhold your selves from that which is offered to Idols, [See hereof 1 Cor. 8.through the whole chapter] and from blood, and from that which is choaked, and from whoredome: from which things if ye keep your selves, ye shall do well. [or fare well] Fare well. [or be or become strengthened. A phrase usual with the Greeks in the conclusion of Epistle // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
