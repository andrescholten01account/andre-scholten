gingen wij weg en reisden verder; en zij begeleidden ons allen, met vrouwen en kinderen, tot buiten de stad; en wij knielden neer aan de oever en baden.","6":"En toen wij elkaar gegroet hadden, gingen wij aan boord van het schip; en zij keerden terug naar huis.","7":"Wij nu, na de scheepvaart vanaf Tyrus volbracht te hebben, kwamen aan te Ptolemaïs, en groetten de broeders, en bleven één dag bij hen.","8":"En de volgende dag gingen Paulus en wij, die met hem waren, vandaar weg en kwamen te Caesarea; en wij gingen het huis van Filippus, de evangelist (die één van de zeven was), binnen, en bleven bij hem.","9":"Deze had nu vier dochters, nog maagden, die profeteerden.","10":"En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.","11":"En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.","12":"Toen wij dit hoorden, smeekten zowel wij als de mensen van die plaats hem om niet naar Jeruzalem te gaan.","13":"Maar Paulus antwoordde: Wat doet u, dat u weent en mijn hart week maakt? Want ik ben bereid niet alleen gebonden te worden, maar ook te sterven te Jeruzalem, voor de Naam van de Heere Jezus.","14":"En toen hij zich niet liet overtuigen, hielden wij ons tevreden en zeiden: Laat de wil van de Heere gebeuren.","15":"En na die dagen maakten wij ons gereed en gingen op naar Jeruzalem.","16":"En met ons gingen ook sommige discipelen van Caesarea mee, die een zekere Mnason met zich meebrachten, van Cyprus, een oude discipel, bij wie wij zouden overnachten.","17":"En toen wij in Jeruzalem gekomen waren, ontvingen de broeders ons met blijdschap.","18":"En de volgende dag ging Paulus met ons naar Jakobus; en alle oudsten waren daar gekomen.","19":"En nadat hij hen gegroet had, verhaalde hij stuk voor stuk wat God onder de heidenen door zijn dienst had gedaan.","20":"En toen zij dat gehoord hadden, loofden zij de Heere en zeiden tegen hem: U ziet, broeder, hoeveel duizenden Joden er zijn die geloven; en zij zijn allen ijveraars voor de wet.","21":"En zij hebben over u gehoord dat u alle Joden die onder de heidenen zijn, leert om van Mozes af te vallen, en zegt dat zij hun kinderen niet moeten besnijden, en ook niet volgens de gewoonten¹ moeten leven.","22":"Wat is er dan te doen? Het is beslist nodig dat de menigte samenkomt; want zij zullen horen dat u gekomen bent.","23":"Doe dan wat wij u zeggen: Wij hebben vier mannen die een gelofte hebben afgelegd.","24":"Neem hen mee, en heilig u samen met hen, en betaal de kosten voor hen, zodat zij hun hoofd kunnen laten scheren; en allen zullen weten dat er niets waar is van wat hun over u verteld is, maar dat u zelf ook ordelijk wandelt en de wet onderhoudt.","25":"Maar wat de heidenen betreft die geloven, hebben wij geschreven en besloten dat zij niets dergelijks hoeven te onderhouden, behalve dat zij zich onthouden van wat aan de afgoden geofferd is, en van bloed, en van het verstikte, en van hoererij.","26":"Toen nam Paulus de mannen mee, en nadat hij zich de volgende dag samen met hen geheiligd had, ging hij de tempel binnen en maakte bekend dat de dagen van de heiliging vervuld waren, totdat voor ieder van hen de offerande gebracht was.","27":"Toen nu de zeven dagen bijna voleindigd waren, zagen de Joden uit Azië hem in de tempel, en brachten al het volk in opschudding, en sloegen de handen aan hem,","28":"En riepen: Israëlitische mannen, kom te hulp! Dit is de man die overal iedereen leert tegen het volk, en de wet, en deze plaats; en bovendien heeft hij ook Grieken de tempel binnengebracht, en heeft deze heilige plaats ontheiligd.","29":"Want zij hadden eerder Trofimus, de Efeziër, met hem in de stad gezien, van wie zij dachten dat Paulus hem de tempel had binnengebracht.","30":"En de hele stad kwam in rep en roer, en het volk liep samen; en zij grepen Paulus en sleepten hem de tempel uit; en meteen werden de deuren gesloten.","31":"En terwijl zij hem probeerden te doden, kwam het bericht bij de leider van de bende dat heel Jeruzalem in verwarring was.","32":"Deze nam meteen soldaten en hoofdmannen over honderd mee, en snelde naar hen toe. Toen zij nu de leider en de soldaten zagen, hielden zij op Paulus te slaan.","33":"Toen kwam de leider dichterbij en greep hem, en beval dat men hem met twee ketenen zou binden; en hij vroeg wie hij was en wat hij gedaan had.","34":"En in de menigte riep de één dit, de ander wat anders. En omdat hij vanwege de opschudding niets met zekerheid kon te weten komen, beval hij dat men hem naar de legerplaats zou brengen.","35":"En toen hij bij de trappen gekomen was, gebeurde het dat hij door de soldaten gedragen werd, vanwege het geweld van de menigte.","36":"Want de menigte van het volk volgde, terwijl zij riepen: Weg met hem!","37":"En toen Paulus de legerplaats binnengeleid zou worden, zei hij tegen de leider: Is het mij toegestaan iets tegen u te zeggen? En hij zei: Kent u Grieks?","38":"Bent u dan niet de Egyptenaar, die vóór deze dagen oproer verwekte en de vierduizend rovers de woestijn in leidde?","39":"Maar Paulus zei: Ik ben een Joodse man uit Tarsus, burger van een niet onaanzienlijke stad in Cilicië; ik bid u, laat mij toe om tegen het volk te spreken.","40":"En toen hij het had toegestaan, stond Paulus op de trappen en wenkte met de hand naar het volk; en toen er een grote stilte ontstaan was, sprak hij hen aan in de Hebreeuwse taal, en zei:"},"SV":{"1":"En als het geschiedde, dat wij van hen gescheiden en afgevaren waren, zo liepen wij rechtuit en kwamen te Kos, en den *dag* daaraan te Rhodus, en van daar te Patara.","2":"En een schip gevonden hebbende, dat naar Fenicië overvoer, gingen wij er in en voeren af.","3":"En als wij Cyprus in het gezicht gekregen, en dat aan de linker *hand* gelaten hadden, voeren wij naar Syrië, en kwamen aan te Tyrus; want het schip zoude aldaar den last ontladen.","4":"En de discipelen gevonden hebbende, bleven wij daar zeven dagen; dewelke tot Paulus zeiden door den Geest, dat hij niet zou opgaan naar Jeruzalem.","5":"Toen het nu geschiedde, dat wij deze dagen doorgebracht hadden, gingen wij uit, en reisden *voort*; en zij geleidden ons allen met vrouwen en kinderen tot buiten de stad; en aan den oever nederknielende, hebben wij gebeden.","6":"En als wij elkander gegroet hadden, gingen wij in het schip; maar zijlieden keerden wederom, *elk* naar het zijne.","7":"Wij nu, de scheepvaart volbracht hebbende van Tyrus, kwamen aan te Ptolemais, en de broeders gegroet hebbende, bleven een dag bij hen.","8":"En des anderen *daags*, Paulus en wij , die met hem waren, gingen van daar en kwamen te Cesarea; en gegaan zijnde in het huis van Filippus, den evangelist (die *een* was van de zeven), bleven wij bij hem.","9":"Deze nu had vier dochters, *nog* maagden, die profeteerden.","10":"En als wij *daar* vele dagen gebleven waren, kwam er een zeker profeet af van Judea, met name Agabus;","11":"En hij kwam tot ons, en nam den gordel van Paulus, en zichzelven handen en voeten gebonden hebbende, zeide: Dit zegt de Heilige Geest: Den man, wiens deze gordel is, zullen de Joden alzo te Jeruzalem binden, en overleveren in de handen der heidenen.","12":"Als wij nu dit hoorden, baden beiden wij en die van die plaats waren, dat hij niet zou opgaan naar Jeruzalem.","13":"Maar Paulus antwoordde: Wat doet gij, dat gij weent, en mijn hart week maakt? Want ik ben bereid niet alleen gebonden te worden, maar ook te sterven te Jeruzalem voor den Naam van den Heere Jezus.","14":"En als hij zich niet liet afraden, hielden wij ons tevreden, zeggende: De wil des Heeren geschiede.","15":"En na die dagen maakten wij ons gereed, en gingen op naar Jeruzalem.","16":"En met ons gingen ook *sommigen* der discipelen van Cesarea, leidende *met* *zich* een zekeren Mnason, van Cyprus, een ouden discipel, bij dewelken wij zouden te huis liggen.","17":"En als wij te Jeruzalem gekomen waren, ontvingen ons de broeders blijdelijk.","18":"En den volgenden *dag* ging Paulus met ons in tot Jakobus; en al de ouderlingen waren daar gekomen.","19":"En als hij hen gegroet had, verhaalde hij van stuk tot stuk, wat God onder de heidenen door zijn dienst gedaan had.","20":"En zij, *dat* gehoord hebbende, loofden den Heere, en zeiden tot hem: Gij ziet, broeder, hoevele duizenden van Joden er zijn, die geloven; en zij zijn allen ijveraars van de wet.","21":"En zij zijn aangaande u bericht, dat gij al de Joden, die onder de heidenen zijn, leert van Mozes afvallen, zeggende: dat zij de kinderen niet zouden besnijden, noch naar de wijze *der* *wet* wandelen.","22":"Wat is er dan *te* *doen*? Het is gans nodig, dat de menigte samenkome; want zij zullen horen, dat gij gekomen zijt.","23":"Doe dan hetgeen wij u zeggen: Wij hebben vier mannen, die een gelofte gedaan hebben.","24":"Neem dezen tot u, en heilig u met hen, en doe de onkosten nevens hen, opdat zij het hoofd bescheren mogen; en allen mogen weten, dat er niets is aan hetgeen, waarvan zij, aangaande u, bericht zijn; maar *dat* gij *alzo* wandelt, dat gij ook zelve de wet onderhoudt.","25":"Doch van de heidenen, die geloven, hebben wij geschreven en goed gevonden, dat zij niets dergelijks zouden onderhouden, dan dat zij zich wachten van hetgeen den afgoden geofferd is, en van bloed, en van het verstikte, en van hoererij.","26":"Toen nam Paulus de mannen met zich, en den dag daaraan met hen geheiligd zijnde, ging hij in den tempel, en verkondigde, dat de dagen der heiliging vervuld waren, *blijvende* *daar*, totdat een iegelijk van hen de offerande opgeofferd was.","27":"Als nu de zeven dagen zouden voleindigd worden, zagen hem de Joden van Azië in den tempel, en beroerden al het volk, en sloegen de handen aan hem,","28":"Roepende: Gij Israëlietische mannen, komt te hulp! Deze is de mens, die tegen het volk, en de wet, en deze plaats allen *man* overal leert; en bovendien heeft hij ook Grieken in den tempel gebracht, en heeft deze heilige plaats ontheiligd.","29":"Want zij hadden te voren Trofimus, den Efezier, met hem in de stad gezien, welken zij meenden, dat Paulus in den tempel gebracht had.","30":"En de gehele stad kwam in roer en het volk liep samen; en zij grepen Paulus, en trokken hem buiten den tempel; en terstond werden de deuren gesloten.","31":"En als zij hem zochten te doden, kwam het gerucht tot den overste der bende, dat geheel Jeruzalem in verwarring was.","32":"Welke terstond krijgsknechten en hoofdmannen over honderd tot zich nam, en liep af naar hen toe. Zij nu, den oversten en de krijgsknechten ziende, hielden op van Paulus te slaan.","33":"Toen naderde de overste en greep hem, en beval, dat men *hem* met twee ketenen zou binden; en vraagde, wie hij was, en wat hij gedaan had.","34":"En onder de schare riep *de* *ene* *dit*, de andere wat anders. Doch als hij de zekerheid niet kon weten vanwege de beroerte, beval hij, dat men hem in de legerplaats zou brengen.","35":"En als hij aan de trappen gekomen was, gebeurde het, dat hij van de krijgsknechten gedragen werd vanwege het geweld der schare.","36":"Want de menigte des volks volgde, al roepende: Weg met hem!","37":"En als Paulus *nu* in de legerplaats zou geleid worden, zeide hij tot den overste: Is het mij geoorloofd tot u wat te spreken? En hij zeide: Kent gij Grieks?","38":"Zijt gij dan niet de Egyptenaar, die voor deze dagen oproer verwekte, en de vier duizend moordenaars naar de woestijn uitleidde?","39":"Maar Paulus zeide: Ik ben een Joods man van Tarsen, een burger van geen onvermaarde stad in Cilicië, ik bid u, laat mij toe tot het volk te spreken.","40":"En als hij het toegelaten had, Paulus, staande op de trappen, wenkte met de hand tot het volk; en als er grote stilte geworden was, sprak hij hen aan in de Hebreeuwse taal, zeggende:"},"KJV":{"1":"And it came to pass, that after we were gotten from them, and had launched, we came with a straight course unto Coos, and the *day* following unto Rhodes, and from thence unto Patara:","2":"And finding a ship sailing over unto Phenicia, we went aboard, and set forth.","3":"Now when we had discovered Cyprus, we left it on the left hand, and sailed into Syria, and landed at Tyre: for there the ship was to unlade her burden.","4":"And finding disciples, we tarried there seven days: who said to Paul through the Spirit, that he should not go up to Jerusalem.","5":"And when we had accomplished those days, we departed and went our way; and they all brought us on our way, with wives and children, till *we were* out of the city: and we kneeled down on the shore, and prayed.","6":"And when we had taken our leave one of another, we took ship; and they returned home again.","7":"And when we had finished *our* course from Tyre, we came to Ptolemais, and saluted the brethren, and abode with them one day.","8":"And the next *day* we that were of Paul's company departed, and came unto Caesarea: and we entered into the house of Philip the evangelist, which was *one* of the seven; and abode with him.","9":"And the same man had four daughters, virgins, which did prophesy.","10":"And as we tarried *there* many days, there came down from Judaea a certain prophet, named Agabus.","11":"And when he was come unto us, he took Paul's girdle, and bound his own hands and feet, and said, Thus saith the Holy Ghost, So shall the Jews at Jerusalem bind the man that owneth this girdle, and shall deliver *him* into the hands of the Gentiles.","12":"And when we heard these things, both we, and they of that place, besought him not to go up to Jerusalem.","13":"Then Paul answered, What mean ye to weep and to break mine heart? for I am ready not to be bound only, but also to die at Jerusalem for the name of the Lord Jesus.","14":"And when he would not be persuaded, we ceased, saying, The will of the Lord be done.","15":"And after those days we took up our carriages, and went up to Jerusalem.","16":"There went with us also *certain* of the disciples of Caesarea, and brought with them one Mnason of Cyprus, an old disciple, with whom we should lodge.","17":"And when we were come to Jerusalem, the brethren received us gladly.","18":"And the *day* following Paul went in with us unto James; and all the elders were present.","19":"And when he had saluted them, he declared particularly what things God had wrought among the Gentiles by his ministry.","20":"And when they heard *it*, they glorified the Lord, and said unto him, Thou seest, brother, how many thousands of Jews there are which believe; and they are all zealous of the law:","21":"And they are informed of thee, that thou teachest all the Jews which are among the Gentiles to forsake Moses, saying that they ought not to circumcise *their* children, neither to walk after the customs.","22":"What is it therefore? the multitude must needs come together: for they will hear that thou art come.","23":"Do therefore this that we say to thee: We have four men which have a vow on them;","24":"Them take, and purify thyself with them, and be at charges with them, that they may shave *their* heads: and all may know that those things, whereof they were informed concerning thee, are nothing; but *that* thou thyself also walkest orderly, and keepest the law.","25":"As touching the Gentiles which believe, we have written *and* concluded that they observe no such thing, save only that they keep themselves from *things* offered to idols, and from blood, and from strangled, and from fornication.","26":"Then Paul took the men, and the next day purifying himself with them entered into the temple, to signify the accomplishment of the days of purification, until that an offering should be offered for every one of them.","27":"And when the seven days were almost ended, the Jews which were of Asia, when they saw him in the temple, stirred up all the people, and laid hands on him,","28":"Crying out, Men of Israel, help: This is the man, that teacheth all *men* every where against the people, and the law, and this place: and further brought Greeks also into the temple, and hath polluted this holy place.","29":"(For they had seen before with him in the city Trophimus an Ephesian, whom they supposed that Paul had brought into the temple.)","30":"And all the city was moved, and the people ran together: and they took Paul, and drew him out of the temple: and forthwith the doors were shut.","31":"And as they went about to kill him, tidings came unto the chief captain of the band, that all Jerusalem was in an uproar.","32":"Who immediately took soldiers and centurions, and ran down unto them: and when they saw the chief captain and the soldiers, they left beating of Paul.","33":"Then the chief captain came near, and took him, and commanded *him* to be bound with two chains; and demanded who he was, and what he had done.","34":"And some cried one thing, some another, among the multitude: and when he could not know the certainty for the tumult, he commanded him to be carried into the castle.","35":"And when he came upon the stairs, so it was, that he was borne of the soldiers for the violence of the people.","36":"For the multitude of the people followed after, crying, Away with him.","37":"And as Paul was to be led into the castle, he said unto the chief captain, May I speak unto thee? Who said, Canst thou speak Greek?","38":"Art not thou that Egyptian, which before these days madest an uproar, and leddest out into the wilderness four thousand men that were murderers?","39":"But Paul said, I am a man *which am* a Jew of Tarsus, *a city* in Cilicia, a citizen of no mean city: and, I beseech thee, suffer me to speak unto the people.","40":"And when he had given him licence, Paul stood on the stairs, and beckoned with the hand unto the people. And when there was made a great silence, he spake unto *them* in the Hebrew tongue, saying,"}},"tsk":{"1":[{"kopje":"wij waren","refs":["Hand 20:37","Hand 20:38","1 Sam 20:41","1 -code=\"G1806\">out</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> the <span class=\"wl wl-kjv\" data-code=\"G2048\">wilderness</span> four <span class=\"wl wl-kjv\" data-code=\"G5070\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"G435\">men</span> that were murderers?","39":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul</span> <span class=\"wl wl-kjv\" data-code=\"G2036\">said,</span> <span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> <span class=\"wl wl-kjv\" data-code=\"G1510\">am</span> a <span class=\"wl wl-kjv\" data-code=\"G444\">man</span> which am a <span class=\"wl wl-kjv\" data-code=\"G2453\">Jew</span> of <span class=\"wl wl-kjv\" data-code=\"G5018\">Tarsus,</span> a city in <span class=\"wl wl-kjv\" data-code=\"G2791\">Cilicia,</span> a <span class=\"wl wl-kjv\" data-code=\"G4177\">citizen</span> of <span class=\"wl wl-kjv\" data-code=\"G3756\">no</span> <span class=\"wl wl-kjv\" data-code=\"G767\">mean</span> <span class=\"wl wl-kjv\" data-code=\"G4172\">city:</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">and,</span> I <span class=\"wl wl-kjv\" data-code=\"G1189\">beseech</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thee,</span> <span class=\"wl wl-kjv\" data-code=\"G2010\">suffer</span> <span class=\"wl wl-kjv\" data-code=\"G3427\">me</span> to <span class=\"wl wl-kjv\" data-code=\"G2980\">speak</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">unto</span> the people.","40":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> when he had <span class=\"wl wl-kjv\" data-code=\"G2010\">given</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G2010\">licence,</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul</span> <span class=\"wl wl-kjv\" data-code=\"G2476\">stood</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">on</span> the <span class=\"wl wl-kjv\" data-code=\"G304\">stairs,</span> and <span class=\"wl wl-kjv\" data-code=\"G2678\">beckoned</span> with the <span class=\"wl wl-kjv\" data-code=\"G5495\">hand</span> unto the <span class=\"wl wl-kjv\" data-code=\"G2992\">people.</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> when there was <span class=\"wl wl-kjv\" data-code=\"G1096\">made</span> a <span class=\"wl wl-kjv\" data-code=\"G4183\">great</span> <span class=\"wl wl-kjv\" data-code=\"G4602\">silence,</span> he <span class=\"wl wl-kjv\" data-code=\"G4377\">spake</span> unto them in the <span class=\"wl wl-kjv\" data-code=\"G1446\">Hebrew</span> <span class=\"wl wl-kjv\" data-code=\"G1258\">tongue,</span> saying,"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gescheiden","tekst":"Grieks afgetrokken; namelijk gelijk een vader van zijne kinderen."},{"catchword":"afgevaren","tekst":"Zie Act 16:11 , en Act 18:21 ."},{"catchword":"Cos","tekst":"Een eiland in de Middellandse zee, tussen Creta en Carië; vanwaar de vermaarde geneesheer Hippocrates en de schilder Apelles geboortig waren."},{"catchword":"Rhodus,","tekst":"Een zeer vermaard eiland met ene stad van denzelfden naam, tegenover Lycië; waar dat grote koperen beeld stond, hetwelk onder de zeven wonderen van de wereld gerekend werd."},{"catchword":"Pátara","tekst":"Eene stad aan het vaste land van Lycië, gelegen aan de zee, en de hoofdstad van Lycië."}],"2":[{"catchword":"Fenicië","tekst":"Zie van dit land Act 11:19 , en Act 15:3 ."},{"catchword":"overvoer,","tekst":"Dat is, zou overvaren."}],"3":[{"catchword":"in het gezicht","tekst":"Of, ontdekt hadden."},{"catchword":"Tyrus; want","tekst":"De hoofdstad van Fenicië. Zie daarvan Mat 11:21 ."},{"catchword":"schip zoude","tekst":"Dat is, de scheepslieden."}],"4":[{"catchword":"de discipelen","tekst":"Sommigen menen dat discipelen hier genaamd worden gelovigen, die nog niet in een gestelde gemeente waren, en broeders, die in zulke gemeente waren."},{"catchword":"door den Geest,","tekst":"Dat is, door een bijzondere openbaring des Heiligen Geestes."},{"catchword":"niet zou opgaan","tekst":"Dat is, dat hem te Jeruzalem grote gevaren en verdrukkingen zouden overkomen; waarom zij uit liefde tot hem en uit eigen ingeven hem rieden niet op te gaan."}],"5":[{"catchword":"doorgebracht","tekst":"Namelijk met wachten totdat er wederom een ander schip zou afvaren."},{"catchword":"met vrouwen","tekst":"Een teken van grote liefde tot hunnen leraar."},{"catchword":"nederknielende,","tekst":"Zie Act 20:36 ."}],"6":[{"catchword":"elkander gegroet","tekst":"Dat is, met onderlinge omhelzing oorlof en afscheid van elkander genomen hadden; Act 20:1 ."},{"catchword":"naar het zijne","tekst":"Dat is naar zijn huis; Joh 19:27 ."}],"7":[{"catchword":"Ptolemáïs,","tekst":"Eene stad aan de Middellandse zee, beneden Tyrus, eertijds genaamd Akko, Jdg 1:31 , Plin. lib.5, cap.19, zo vernaamd naar een koning van Egypte."}],"8":[{"catchword":"Paulus en wij,","tekst":"Grieks die omtrent Paulus waren; Act 13:13 ."},{"catchword":"Cesarea","tekst":"Namelijk van Palestina. Zie Act 10:1 ."},{"catchword":"den evangelist","tekst":"Dat is, een dergenen, die van de apostelen hier en daar uitgezonden werden, om het Evangelie te verkondigen en de gemeenten te versterken; Eph 4:11 ; 2Ti 4:5 . Anders worden gemeenlijk in het bijzonder evangelisten genaamd, die de vier Evangeliën geschreven hebben."},{"catchword":"zeven),","tekst":"Namelijk diakenen; Act 6:5 ."},{"catchword":"bleven wij","tekst":"Dat is, logeerden."}],"9":[{"catchword":"profeteerden","tekst":"Dat is, hadden de gave van toekomende dingen te voorzeggen. Want openlijk voor de gemeente de Schrift uit te leggen, wordt de vrouwen verboden; 1Co 14:34 , en 1Ti 2:12 , ten ware men dit als een buitengewoon voorbeeld wilde uitnemen."}],"11":[{"catchword":"zichzelven handen","tekst":"Alzo plachten de profeten met uiterlijke tekenen hunne voorzeggingen voor te stellen, opdat zij te beter in de harten der mensen ingeprent zouden worden. Zie Isa 20:2 ; Jer 13:1 , en Jer 27:2 ; Eze 12:5 ."},{"catchword":"der heidenen","tekst":"Namelijk eerst van den Romeinsen stadhouder, en daarna van den wreden keizer Nero."}],"12":[{"catchword":"dat hij niet","tekst":"Dit deden zij uit liefde tot Paulus, gelijk vs.4."}],"13":[{"catchword":"week maakt?","tekst":"Of, verbreekt, en gelijk als in stukken stoot; Psa 51:19 ."}],"14":[{"catchword":"tevreden, zeggende","tekst":"Of, stil, zonder hem meer te bidden."}],"15":[{"catchword":"maakten wij","tekst":"Of, pakten wij onze dingen."}],"17":[{"catchword":"blijdelijk","tekst":"Of, zeer gaarne, vriendelijk."}],"18":[{"catchword":"Jakobus;","tekst":"Namelijk den apostel, den zoon van Alfeus; Act 15:13 ; Gal 1:19 ."},{"catchword":"de ouderlingen","tekst":"Dat is, de regeerders der gemeente."}],"19":[{"catchword":"van stuk tot","tekst":"Grieks naar een iegelijk stuk."}],"20":[{"catchword":"loofden den","tekst":"Of, verheerlijkten."},{"catchword":"duizenden van","tekst":"Grieks tienduizenden."},{"catchword":"ijveraars van","tekst":"Namelijk menende dat de wet der ceremoniën nog moet onderhouden worden, en nog niet verstaande dat deze door Christus is afgedaan."}],"21":[{"catchword":"bericht, dat","tekst":"Het Griekse woord betekent eigenlijk met levende stem onderwezen worden; Luk 1:4 ."},{"catchword":"Mozes","tekst":"Dat is, van de wet door Mozes beschreven."},{"catchword":"afvallen, zeggende","tekst":"Grieks afval. Dit was ene lastering tegen Paulus; want hoewel hij leerde dat de ceremoniën des Ouden Testaments door Christus vervuld en derhalve afgedaan waren, zo leer hij nochtans niet, dat men de leer van Mozes zou verwerpen, noch dat men de zwakke Joden, die dit nog niet verstonden, voor dien tijd zou dwingen de ceremoniën na te laten, inzonderheid dewijl hij ook zelf om der zwakken wil Timotheus had besneden; Act 16:3 ."},{"catchword":"de wijzen der wet","tekst":"Dat is, de ceremoniën der wet te onderhouden."}],"22":[{"catchword":"de menigte","tekst":"Namelijk der gemeente, waarvan de ouderlingen onderscheiden worden."},{"catchword":"samenkome; want","tekst":"Dat is, tezamen geroepen worden."}],"23":[{"catchword":"Wij hebben vier","tekst":"Anders, onder ons zijn."},{"catchword":"een gelofte","tekst":"Namelijk der Nazireën. Zie van dezelve Num 6 , hier voren Act 18:18 ."},{"catchword":"gedaan hebben","tekst":"Grieks hebbende ene belofte opzich, of, over henzelven."}],"24":[{"catchword":"heilig u met","tekst":"Of, reinig; namelijk volbrengende en afleggende het nazireërschap met uw hoofd te bescheren en offeranden op te offeren, om te tonen dat gij geen verachter der wet zijt. Dezen raad geven zij, op hoop dat Paulus daarmede de kwade geruchten zou wegnemen van hem gestrooid dat hij een verachter der wet was, en om meerder gevaar van ongerustheid in de gemeente te voorkomen; en was in zichzelven niet ongeoorloofd, hoewel de uitkomst geleerd heeft dat zij niet bekwaam genoeg geweest is om de Joden te stillen. Doch Paulus' bescheidenheid is evenwel te prijzen, dat hij het ouderlingschap zoveel ontzag toegedragen heeft, dat hij hun raad niet heeft willen versmaden, maar volgen om der zwakken wil; zie 1Co 9:20 ."},{"catchword":"de onkosten nevens","tekst":"Namelijk die tot de offeranden en anderszins moesten gedaan worden, die beschreven worden Num 6:19 , Num 6:21 ."},{"catchword":"de wet","tekst":"Namelijk der ceremoniën."},{"catchword":"onderhoudt","tekst":"Grieks bewaart; hetwelk Paulus deed voor een tijd bij de zwakke Joden, om hen te beter te gewinnen."}],"25":[{"catchword":"die geloven,","tekst":"Dat is, die den Christelijken godsdienst hebben aangenomen."},{"catchword":"geschreven en","tekst":"Grieks gezonden; dat is, een brief geschreven en gezonden; zie Act 15:20 , enz."},{"catchword":"goed gevonden,","tekst":"Grieks geoordeeld."},{"catchword":"niets dergelijks","tekst":"Namelijk wat de wet der ceremoniën aangaat."}],"26":[{"catchword":"verkondigde,","tekst":"Namelijk den priesters."},{"catchword":"dat de dagen","tekst":"Grieks de vervulling der dagen der heiliging; dat is, dat de tijd van hunne belofte om was, en dat zij dezelve volgens de wet wilden afleggen; Num 6:13 ; Act 24:18 ."},{"catchword":"de offerande","tekst":"Namelijk die beschreven worden Num 6:13-14 , enz."}],"27":[{"catchword":"Als nu","tekst":"Of, alzo."},{"catchword":"de zeven dagen","tekst":"Namelijk van het pinksterfeest. Zie Act 20:16 ."},{"catchword":"van Azië in","tekst":"Dat is, die in Azië, en, zo het schijnt, te Efeze wonende, te Jeruzalem waren opgekomen tot het feest, die ook dikwijls in Azië tegen Paulus veel kwaads aangericht hebben, Act 14:17-18 , lieden zeer wederspannig en nijdig tegen Paulus; Act 17:5 ."},{"catchword":"beroerden","tekst":"Grieks vermengden."},{"catchword":"al het volk,","tekst":"Of, de schare; die aldaar tegenwoordig was."}],"28":[{"catchword":"tegen het volk,","tekst":"Deze beschuldigingen werden ook Christus en Stefanus ten laste gelegd; Mat 26:61 ; Act 6:13 ."},{"catchword":"deze plaats allen","tekst":"Namelijk den tempel, of ook de stad."},{"catchword":"Grieken in","tekst":"Dat is, onbesneden."},{"catchword":"tempel gebracht,","tekst":"Namelijk verder in, dan het den onheiligen geoorloofd was te komen; Luk 18:13 ."},{"catchword":"ontheiligd","tekst":"Grieks gemeen; dat is onrein gemaakt. Zie Act 10:14-15 ."}],"29":[{"catchword":"Trófimus,","tekst":"Deze, hoewel hij den Christelijken godsdienst aangenomen had, was nochtans onbesneden en geen Jodengenoot."},{"catchword":"meenden, dat","tekst":"Hetwelk nochtans zo niet was; maar zij meenden het omdat hij Paulus overal volgde."}],"30":[{"catchword":"de gehele stad","tekst":"Dat is, alle inwoners der stad."},{"catchword":"en het volk","tekst":"Grieks en daar kwam een samenloop des volks."},{"catchword":"buiten den tempel;","tekst":"Namelijk opdat dezelve niet meer door hem [gelijk zij menen] zou ontheiligd worden; of om den tempel met zijn bloed niet te besmetten, alzo zij voorgenomen hadden hem om te brengen, vs.31."}],"31":[{"catchword":"het gerucht","tekst":"Grieks het zeggen, de tijding."},{"catchword":"den overste","tekst":"Grieks overste over duizend, kolonel; die over het garnizoen bevel had, gelijk ook hierna in de volgende hoofdstukken."},{"catchword":"in verwarring was","tekst":"Grieks vermengd was, in verwarring was."}],"32":[{"catchword":"naar hen toe","tekst":"Of, tegen hen."}],"33":[{"catchword":"twee ketenen","tekst":"Namelijk aan de handen een en aan de voeten een; gelijk Agabus voorzegd had, vs.11."}],"34":[{"catchword":"zekerheid niet","tekst":"Namelijk wat van de zaak was; Act 22:30 ."},{"catchword":"legerplaats","tekst":"Grieks Parembole; welke was ene plaats binnen Jeruzalem aan het noorden van den tempel, met muren omringd en sterk gemaakt als een burg of kasteel, waar het Romeins garnizoen zijne legerplaats had; en was genaamd naar een Romeins veldoverste Antonia. Josef. de bello Judaic. lib.6, cap.6."}],"35":[{"catchword":"de trappen gekomen","tekst":"Namelijk langs welke men opging naar den burg, die op ene hoogte lag."}],"36":[{"catchword":"Weg met hem","tekst":"Dat is, doodt hem."}],"37":[{"catchword":"Is het mij","tekst":"Of, zo het mij geoorloofd is; namelijk te spreken, zo zal Ik wat spreken."},{"catchword":"Grieks?","tekst":"Hoewel Paulus een Jood of Hebreër was, zo sprak hij den overste in het Grieks aan, welke taal zeer algemeen was en van vele Romeinen geleerd."}],"38":[{"catchword":"de Egyptenaar,","tekst":"Namelijk die omtrent drie jaren tevoren onder den stadhouder Felix het volk in oproer gebracht had, en zelf ontvloden was. Zie van dezen Josef. Antiq. lib. 20, cap. 6,7, en de bello lib. 2, cap. 12."},{"catchword":"de vier duizend","tekst":"Die daarna toenamen tot dertig duizend toe, gelijk Josefus schrijft."},{"catchword":"moordenaars naar","tekst":"Grieks mannen der moordenaars; of dergenen, die kort geweer en moordpriemen droegen, van welke Josefus wonderlijke dingen verhaalt."}],"39":[{"catchword":"man van Tarsen,","tekst":"Grieks mens."},{"catchword":"in Cilicië,","tekst":"Dat wordt er bij gedaan tot onderscheiding van een ander Tarsen in Bithynië."}],"40":[{"catchword":"wenkte met de","tekst":"Zie Act 12:17 , en Act 13:16 , en Act 19:33 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And as it came to pass that we were parted, [Gr.drawn off, namely, as a Father from his children] and sayled away from them [see Acts 16. 11.and 18. 12.] we ran forth right, and came unto Coos, [an Island in the Mediterranean Sea betwixt Crete and Caria, where the famous Physician Hippocrates and the Painter Apelles were born] and the next (day) to Rhodes, [a very famous Island with a City of the same name, over against Lycia, where that great Image stood, which was reckoned amongst the seven wonders of the world] and from thence to Patara. [a city on the firm Land of Lycia, lying by the Sea, and the chief City of Lycia.]"}],"2":[{"catchword":null,"tekst":"And having found a ship that sailed over [That is, that should sail over] to Phoenicia, [see of this land Acts 11. 19.and 15. 3.] we went thereinto and sailed off."}],"3":[{"catchword":null,"tekst":"And when we had gotten Cyprus in sight [Or had discovered] and left it on the left- (hand) we sayled towards Syria and arrived at Tyre, [the chief City of Phoenicia. See thereof Mat. 11. 21.] for the Ship [that is, shipmen] was there, to unload her burden."}],"4":[{"catchword":null,"tekst":"And having found the Disciples, [Some think that believers are here called Disciples, which were not yet in a setsed Church, and brethren, they that were in such a Church] we abode there seven daies: who said unto Paul through the Spirit, [that is, by a special revelation of the Holy Ghost] that he should not go up to Jerusalem. [that is, that great perils and afflictions should befall him at Jerusalem, wherefore out of love to him and of their own head they counselled him not to go up.]"}],"5":[{"catchword":null,"tekst":"Now when it came to pass that we had passed over these daies, [Namely, with waiting until another ship should again sail off] we went out, and travelled (forward) and they all conducted us with wives and children [a token of great love to their Teacher] forth out of the City: and kneeling down on the shore [see Acts 20.v.36. we prayed."}],"6":[{"catchword":null,"tekst":"An when we had saluted one another, [That is, with mutual embracing, had taken leave and farewell one of another, Acts 20. 1.] we went into the ship: but they returned (each) unto his own. [that is, unto his house, John 19. 27.]"}],"7":[{"catchword":null,"tekst":"Now we having finished the voyage from Tyre, arrived at Ptolomais, [A City by the midland Sea, below Tyrus, heretofore called Acco, Jud. 1. 31. Plin. Lib. 5.cap. 19.so re-named from a King of Egypt] and having saluted the brethren, abode one day with them."}],"8":[{"catchword":null,"tekst":"And the next (day) Paul and we that were with him [Gr.they that were about Paul, Acts 13. 13.] went thence and came unto Cesarea, [namely, of Palestine, see Acts 10. 1.] and being gone into the house of Philip the Evangelist [that is one of them who were sent forth here and there by the Apostle, to preach the Gospel, and to confirm the Churches, Ephes. 4. 11. 2. Tim. 4. 5. Otherwise they are called Evangelists in special, who wrote the four Gospels] (who was (one) of the seven) [namely, Deacons, Acts 6. 5.] we abode with him. [that is, lodged.]"}],"9":[{"catchword":null,"tekst":"Now he had four daughters (yet) virgins, which prophecyed: [That is, had the gift to foretell things to come. For o interpret the Scripture openly before the Church is forbidden women, 1 Cor. 14. 34.and 1 Tim. 2. 12.except we would exempt this as an extraordinary example."}],"10":[{"catchword":null,"tekst":"And when we had tarried (there) many daies, there came down a certain Prophet from Judea by name Agabus."}],"11":[{"catchword":null,"tekst":"And he came unto us, and took Pauls girdle, and having bound his own hands and feet [So the Prophet used with outward signs, to set for function refUrl(ref) {

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

function kopieerVers(n) {

  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {

  });
}
document.addEventListener('click', e => {

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

    }).join('');
}

    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
