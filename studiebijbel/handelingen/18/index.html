 betuigde hij de Joden dat Jezus de Christus is.","6":"Maar toen zij hem weerstonden en lasterden, schudde hij *zijn* kleren af en zei tegen hen: Uw bloed *zij* op uw hoofd; ik ben rein; en van nu af aan zal ik naar de heidenen gaan.","7":"En hij ging vandaar weg en kwam in het huis van een man, met de naam Justus, die God diende, wiens huis grensde aan de synagoge.","8":"En Crispus, de leider van de synagoge, geloofde in de Heere met heel zijn huis; en velen van de Korinthiërs die *hem* hoorden, geloofden en werden gedoopt.","9":"En de Heere zei tegen Paulus door een gezicht in de nacht: Wees niet bevreesd, maar spreek en zwijg niet.","10":"Want Ik ben met u, en niemand zal de hand aan u leggen om u kwaad te doen; want Ik heb veel volk in deze stad.","11":"En hij bleef daar een jaar en zes maanden, en leerde onder hen het Woord van God.","12":"Maar toen Gallio stadhouder van Achaje was, stonden de Joden eensgezind tegen Paulus op, en brachten hem voor de rechterstoel,","13":"en zeiden: Deze man raadt de mensen aan om God te dienen op een manier die tegen de wet ingaat.","14":"En toen Paulus zijn mond wilde opendoen, zei Gallio tegen de Joden: Als het ging om enig onrecht of een kwaad misdrijf, o Joden, dan zou het redelijk zijn dat ik u zou verdragen;","15":"maar als er een geschil is over een woord, en namen, en over de wet die onder u geldt, zoekt u het dan zelf maar uit; want ik wil over deze dingen geen rechter zijn.","16":"En hij joeg hen weg van de rechterstoel.","17":"Maar alle Grieken grepen Sosthenes, de leider van de synagoge, en sloegen hem voor de rechterstoel; en Gallio trok zich niets van deze dingen aan.","18":"En Paulus bleef daar nog veel dagen, en nam toen afscheid van de broeders, en voer vandaar naar Syrië; en Priscilla en Aquila gingen met hem mee, nadat hij in Kenchreeën zijn hoofd had laten scheren; want hij had een gelofte gedaan.","19":"En hij kwam aan in Efeze, en liet hen daar achter; maar hijzelf ging de synagoge in en sprak met de Joden.","20":"En toen zij hem vroegen langer bij hen te blijven, stemde hij daar niet mee in,","21":"maar nam afscheid van hen en zei: Ik moet in elk geval het komende feest in Jeruzalem vieren; maar ik zal bij u terugkomen, als God het wil. En hij voer weg van Efeze.","22":"En toen hij in Cesarea was aangekomen, ging hij naar Jeruzalem, en nadat hij de gemeente gegroet had, ging hij naar Antiochië.","23":"En toen hij daar enige tijd geweest was, ging hij weg en reisde achtereenvolgens door het land Galatië en Frygië, en versterkte al de discipelen.","24":"En een zekere Jood, met de naam Apollos, van geboorte een Alexandriër, een welsprekend man, kwam naar Efeze, machtig zoals hij was in de Schriften.","25":"Deze was onderwezen in de weg van de Heere; en omdat hij vurig was van geest, sprak en leerde hij nauwkeurig de zaken van de Heere, al kende hij alleen de doop van Johannes.","26":"En hij begon vrijmoedig te spreken in de synagoge. En toen Aquila en Priscilla hem gehoord hadden, namen zij hem tot zich, en legden hem de weg van God nauwkeuriger uit.","27":"En toen hij naar Achaje wilde reizen, spoorden de broeders hem aan en schreven aan de discipelen dat zij hem moesten ontvangen; en toen hij daar aangekomen was, heeft hij veel bijgedragen aan hen die door de genade geloofden.","28":"Want hij weerlegde de Joden met grote kracht in het openbaar, en bewees door de Schriften dat Jezus de Christus was."},"SV":{"1":"En na dezen scheidde Paulus van Athene en kwam te Korinthe;","2":"En vond een zekeren Jood, met name Aquila, van geboorte uit Pontus, die onlangs van Italië gekomen was, en Priscilla, zijn vrouw, ( omdat Claudius bevolen had, dat al de Joden uit Rome vertrekken zouden), en hij ging tot hen;","3":"En omdat hij van hetzelfde handwerk was, bleef hij bij hen, en wrocht; want zij waren tentenmakers van handwerk.","4":"En hij handelde op elken sabbat in de synagoge, en bewoog *tot* *het* *geloof* Joden en Grieken.","5":"En als Silas en Timotheüs van Macedonië afgekomen waren, werd Paulus door den Geest gedrongen, betuigende den Joden, dat Jezus is de Christus.","6":"Maar als zij wederstonden en lasterden, schudde hij *zijn* klederen af, en zeide tot hen: Uw bloed *zij* op uw hoofd; ik ben rein; *en* van nu voortaan zal ik tot de heidenen heengaan.","7":"En vandaar gegaan zijnde, kwam hij in het huis van een *man*, met name Justus, die God diende, wiens huis paalde aan de synagoge.","8":"En Crispus, de overste der synagoge, geloofde aan den Heere met geheel zijn huis; en velen van de Korinthiërs, *hem* horende, geloofden, en werden gedoopt.","9":"En de Heere zeide tot Paulus door een gezicht in den nacht: Zijt niet bevreesd , maar spreek en zwijg niet.","10":"Want Ik ben met u, en niemand zal *de* *hand* aan u leggen om u kwaad te doen; want Ik heb veel volks in deze stad.","11":"En hij onthield zich *aldaar* een jaar en zes maanden, lerende onder hen het Woord Gods.","12":"Maar als Gallio stadhouder van Achaje was, stonden de Joden eendrachtelijk tegen Paulus op, en brachten hem voor den rechterstoel.","13":"Zeggende: Deze raadt den mensen aan, dat zij God zouden dienen tegen de wet.","14":"En als Paulus *zijn* mond zou opendoen, zeide Gallio tot de Joden: Zo er enig ongelijk, of kwaad stuk *begaan* ware, o Joden, zo zou ik met reden ulieden verdragen;","15":"Maar indien er geschil is over een woord, en namen, en *over* de wet, die onder u is, zo zult gij zelven toezien; want ik wil over deze dingen geen rechter zijn.","16":"En hij dreef hen weg van den rechterstoel.","17":"Maar al de Grieken namen Sosthenes, den overste der synagoge, en sloegen *hem* voor den rechterstoel; en Gallio trok zich geen van deze dingen aan.","18":"En als Paulus er nog vele dagen gebleven was, nam hij afscheid van de broederen, en scheepte van daar naar Syrië; en Priscilla en Aquila met hem, *zijn* hoofd te Kenchreen geschoren hebbende; want hij had een gelofte *gedaan*.","19":"En hij kwam te Efeze aan, en liet hen aldaar; maar hij ging in de synagoge, en handelde met de Joden.","20":"En als zij baden, dat hij langer bij hen blijven zoude, bewilligde hij het niet.","21":"Maar hij nam afscheid van hen, zeggende: Ik moet ganselijk het toekomende feest te Jeruzalem houden; doch ik zal tot u wederkeren, zo God wil. En hij voer weg van Efeze.","22":"En als hij te Cesarea was gekomen, ging hij op *naar* *Jeruzalem*, en de Gemeente gegroet hebbende, ging hij af naar Antiochië.","23":"En als hij *aldaar* enigen tijd geweest was, ging hij weg, en doorreisde vervolgens het land van Galatië en Frygië, versterkende al de discipelen.","24":"En een zeker Jood, met name Apollos, van geboorte een Alexandriër, een welsprekend man, kwam te Efeze, machtig zijnde in de Schriften.","25":"Deze was in den weg des Heeren onderwezen; en vurig zijnde van geest, sprak hij en leerde naarstiglijk de zaken des Heeren, wetende alleenlijk den doop van Johannes.","26":"En deze begon vrijmoediglijk te spreken in de synagoge. En als hem Aquila en Priscilla gehoord hadden, namen zij hem tot zich, en legden hem den weg Gods bescheidenlijker uit.","27":"En als hij wilde naar Achaje reizen, de broeders, *hem* vermaand hebbende, schreven aan de discipelen, dat zij hem ontvangen zouden; welke, daar gekomen zijnde, heeft veel toegebracht aan degenen, die geloofden door de genade.","28":"Want hij overtuigde de Joden met groten ernst in het openbaar, bewijzende door de Schriften, dat Jezus de Christus was."},"KJV":{"1":"After these things Paul departed from Athens, and came to Corinth;","2":"And found a certain Jew named Aquila, born in Pontus, lately come from Italy, with his wife Priscilla; (because that Claudius had commanded all Jews to depart from Rome:) and came unto them.","3":"And because he was of the same craft, he abode with them, and wrought: for by their occupation they were tentmakers.","4":"And he reasoned in the synagogue every sabbath, and persuaded the Jews and the Greeks.","5":"And when Silas and Timotheus were come from Macedonia, Paul was pressed in the spirit, and testified to the Jews *that* Jesus *was* Christ.","6":"And when they opposed themselves, and blasphemed, he shook *his* raiment, and said unto them, Your blood *be* upon your own heads; I *am* clean: from henceforth I will go unto the Gentiles.","7":"And he departed thence, and entered into a certain *man's* house, named Justus, *one* that worshipped God, whose house joined hard to the synagogue.","8":"And Crispus, the chief ruler of the synagogue, believed on the Lord with all his house; and many of the Corinthians hearing believed, and were baptized.","9":"Then spake the Lord to Paul in the night by a vision, Be not afraid, but speak, and hold not thy peace:","10":"For I am with thee, and no man shall set on thee to hurt thee: for I have much people in this city.","11":"And he continued *there* a year and six months, teaching the word of God among them.","12":"And when Gallio was the deputy of Achaia, the Jews made insurrection with one accord against Paul, and brought him to the judgment seat,","13":"Saying, This *fellow* persuadeth men to worship God contrary to the law.","14":"And when Paul was now about to open *his* mouth, Gallio said unto the Jews, If it were a matter of wrong or wicked lewdness, O *ye* Jews, reason would that I should bear with you:","15":"But if it be a question of words and names, and *of* your law, look ye *to it*; for I will be no judge of such","16":"And he drave them from the judgment seat.","17":"Then all the Greeks took Sosthenes, the chief ruler of the synagogue, and beat *him* before the judgment seat. And Gallio cared for none of those things.","18":"And Paul *after this* tarried *there* yet a good while, and then took his leave of the brethren, and sailed thence into Syria, and with him Priscilla and Aquila; having shorn *his* head in Cenchrea: for he had a vow.","19":"And he came to Ephesus, and left them there: but he himself entered into the synagogue, and reasoned with the Jews.","20":"When they desired *him* to tarry longer time with them, he consented not;","21":"But bade them farewell, saying, I must by all means keep this feast that cometh in Jerusalem: but I will return again unto you, if God will. And he sailed from Ephesus.","22":"And when he had landed at Caesarea, and gone up, and saluted the church, he went down to Antioch.","23":"And after he had spent some time *there*, he departed, and went over *all* the country of Galatia and Phrygia in order, strengthening all the disciples.","24":"And a certain Jew named Apollos, born at Alexandria, an eloquent man, *and* mighty in the scriptures, came to Ephesus.","25":"This man was instructed in the way of the Lord; and being fervent in the spirit, he spake and taught diligently the things of the Lord, knowing only the baptism of John.","26":"And he began to speak boldly in the synagogue: whom when Aquila and Priscilla had heard, they took him unto *them*, and expounded unto him the way of God more perfectly.","27":"And when he was disposed to pass into Achaia, the brethren wrote, exhorting the disciples to receive him: who, when he was come, helped them much which had believed through grace:","28":"For he mightily convinced the Jews, *and that* publickly, shewing by the scriptures that Jesus was Christ."}},"tsk":{"1":[{"kopje":"vertrok","refs":["Hand 17:32","Hand 17:33"]},{"kopje":"Korinthe","refs":["Hand 19:1","1 Kor 1:2","2 Kor 1:1","2 Kor 1:23","2 Tim 4:20"]}],"2":[{"kopje":"Aquila","refs":["Hand 18:26","Rom 16:3","Rom 16:4","1 Kor 16:19","2 Tim 4:19"]},{"kopje":"Pontus","refs":["Hand 2:9","1 Petr 1:1"]},{"kopje":"Claudius","refs":["Hand 11:28"]}],"3":[{"kopje":"werkte er","refs":["Hand 20:34","Hand 20:35","1 Kor 4:12","1 Kor 9:6-12","2 Kor 11:9","1 Tess 2:9","2 Tess 3:8","2 Tess 3:9"]}],"4":[{"kopje":"hij","refs":["Hand 13:14-52","Hand 14:1","Hand 17:1-3","Hand 17:11","Hand 17:17","Hand 19:8","Luk 4:16"]},{"kopje":"bracht tot geloof","refs":["Hand 18:13","Hand 13:43","Hand 19:26","Hand 26:28","H ough</span> grace:","28":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> he <span class=\"wl wl-kjv\" data-code=\"G2159\">mightily</span> <span class=\"wl wl-kjv\" data-code=\"G1246\">convinced</span> the <span class=\"wl wl-kjv\" data-code=\"G2453\">Jews,</span> and that <span class=\"wl wl-kjv\" data-code=\"G1219\">publickly,</span> <span class=\"wl wl-kjv\" data-code=\"G1925\">shewing</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> the <span class=\"wl wl-kjv\" data-code=\"G1124\">scriptures</span> that <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G1511\">was</span> Christ."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Korinthe;","tekst":"De hoofdstad van Achaje in Griekenland, gelegen tussen twee zeeën, in de engte waarmede Poloponesus aan Achaje vast was. Zie breder van deze stad 1Co 1:2 ."}],"2":[{"catchword":"van geboorte","tekst":"Of, van afkomst, geslacht."},{"catchword":"Pontus, die","tekst":"Dit was een landschap in Klein-Azië, gelegen tussen Cappadocië en de Zwarte zee; Act 2:9 ."},{"catchword":"Claudius","tekst":"De keizer van Rome."},{"catchword":"bevolen had,","tekst":"Grieks verordineerd had. Van dit bevel getuigen ook de historieschrijvers Sueton. in Claud. cap.25; Orosius lib.7, cap.6. De reden wordt verscheidenlijk aangewezen; het schijnt, dat het daarom is geweest, overmits de Joden zich geduriglijk met oproer stelden tegen degenen, die uit hen den Christelijken godsdienst aannamen; of omdat enige aanzienlijke personen van Rome zich tot de Christelijke religie begaven. Want de heidense Romeinen hielden de Joden en de Christenen voor volk van eene religie."}],"3":[{"catchword":"tentenmakers","tekst":"Die toentertijd meest van vellen gemaakt of genaaid werden."}],"4":[{"catchword":"handelde op","tekst":"Of, disputeerde. Zie Act 17:2 ."},{"catchword":"bewoog tot het geloof","tekst":"Namelijk door goede redenen en gronden uit de heilige Schrift genomen, om Zijne leer aan te nemen."}],"5":[{"catchword":"door den Geest","tekst":"Namelijk òf door den Heiligen Geest, die Paulus aandreef; òf van zijn gemoed, hetwelk met ijver was ontstoken."},{"catchword":"gedrongen,","tekst":"Dat is, door een sterken ijver aangedreven."},{"catchword":"betuigende","tekst":"Grieks krachtig, of alleszins betuigende."},{"catchword":"de Christus","tekst":"Dat is, de Gezalfde, de ware Messias door de profeten beloofd."}],"6":[{"catchword":"schudde hij","tekst":"Dit was een teken dat zij met hen gene gemeenschap meer wilden hebben."},{"catchword":"Uw bloed zij","tekst":"Dat is, de straf, niet alleen des tijdelijken maar ook des eeuwigen doods, haalt gij uzelven door uw eigen schuld op den hals. Zie van deze manier van spreken Lev 20:9 , Lev 20:12 ; 2Sa 1:16 ; Mat 27:25 ."},{"catchword":"ik ben rein;","tekst":"Namelijk van uw bloed en verderf, overmits Ik u getrouwelijk voor het verderf heb gewaarschuwd en den weg der zaligheid aangewezen, dien gij niet hebt willen volgen; Eze 33:8-9 ; Act 20:26 ."}],"7":[{"catchword":"die God diende,","tekst":"Dat is, die een Jodengenoot was. Zie Act 13:43 ."},{"catchword":"paalde aan","tekst":"Waarom Hij daar schijnt te hebben willen logeren, om over straat gaande, het gevaar van oploop der ongelovige Joden te vermijden."}],"8":[{"catchword":"Crispus,","tekst":"Zie van dezen 1Co 1:14 ."},{"catchword":"de overste der","tekst":"Zie van de oversten der synagogen Mar 5:22 ; Act 13:15 ."}],"9":[{"catchword":"en zwijg niet","tekst":"Dit wordt aldus tweemaal verhaald, om te kennen te geven dat hij door generlei zwarigheid zich zou laten afschrikken van het Evangelie vrijmoedig te spreken en te prediken. Zie Joh 1:20 ."}],"10":[{"catchword":"met u, en","tekst":"Zie Luk 1:66 ."},{"catchword":"veel volks in","tekst":"Dat is, vele uitverkorenen, die door uwe predikatie zullen bekeerd worden. Zie Joh 10:16 ."}],"11":[{"catchword":"onthield zich","tekst":"Grieks zat aldaar; namelijk in Corinthe. Hebreën. Zie Mat 4:16 ."}],"12":[{"catchword":"Gallio","tekst":"Deze was een broeder van den vermaarden L. Anneus Seneca, den onderwijsmeester van den keizer Nero, gelijk Seneca zelf getuigt Praefat. quaest. natur. lib.4; was eerst genaamd M. Anneus Novatus, maar van C. Junius Gallio tot zoon aangenomen zijnde, heeft hij ook deszelfs naam aangenomen."},{"catchword":"stadhouder","tekst":"Grieks Anthypateuon; dat is, in plaats van den burgemeester van Rome regerende. Zie van dit woord Act 13:7 , en Act 19:38 ."},{"catchword":"Acháje was,","tekst":"En ook van geheel Griekenland; Pausan."}],"13":[{"catchword":"de wet","tekst":"Namelijk der Joden, wien de Romeinen toegelaten hadden bij hunne wet te mogen blijven."}],"14":[{"catchword":"zijn mond","tekst":"Namelijk om zich te verantwoorden."},{"catchword":"kwaad stuk","tekst":"Namelijk van doodslag, dieverij, oproer, of dergelijke."},{"catchword":"met reden ulieden","tekst":"Of, naar reden; dat is, zoveel de reden zal toelaten; zoveel redelijk zal wezen."},{"catchword":"verdragen;","tekst":"Dat is, met lijdzaamheid horen en recht doen."}],"15":[{"catchword":"een woord, en","tekst":"Namelijk dat iemand zou gezegd of kwalijk gesproken hebben van uw wet of godsdienst."},{"catchword":"namen, en over","tekst":"Dat is, zo dit geschil is over enige titels, die iemand zouden mogen toegeschreven worden."}],"16":[{"catchword":"dreef hen weg","tekst":"Dat is, gebood hen dadelijk te vertrekken."}],"17":[{"catchword":"de Grieken namen","tekst":"Namelijk, die nog heidens en ongelovig waren, gelijk Gallio."},{"catchword":"Sósthenes,","tekst":"Of, deze Sosthenes dezelfde is geweest, waarvan gesproken wordt 1Co 1:1 , is onzeker."},{"catchword":"trok zich geen","tekst":"Namelijk uit verachting der Joden, en der Joodse en der Christelijke religie."}],"18":[{"catchword":"nam hij afscheid","tekst":"Namelijk op Zijne en der gemeente zaken orde gesteld hebbende, gelijk het Griekse woord medebrengt. Zie Mar 6:46 ."},{"catchword":"naar Syrië;","tekst":"Dat is, de streek heen, die naar Syrië gaat."},{"catchword":"zijn hoofd","tekst":"Of, het hoofd; want het Griekse woord kan op beiden gepast worden, zo op Paulus als op Aquila."},{"catchword":"te Kenchreën","tekst":"Dit was de haven van Corinthe, aan het oosten van de stad; gelijk de haven aan de andere zijde Lecheën genaamd was, Strabo lib.8."},{"catchword":"geschoren hebbende;","tekst":"Namelijk gelijk degenen deden, die de belofde der Nazireërs voor een tijd gedaan hadden; Num 6:18-20 ."},{"catchword":"een gelofte gedaan","tekst":"Namelijk der Nazireërs, die beschreven wordt Num. 6, welke belofte sommigen deden voor hun leven, anderen voor een tijd, gelijk hier geschied is. De reden waarom deze belofte was gedaan, zie Act 21:23-24 ; 1Co 9:20 ; waaruit blijkt dat deze ene belofte is geweest, niet om God daarmede dienst te doen, maar om uit liefde de zwakke Joden te dienen tot stichting, en om te tonen dat Hij geen verachter van de wet was."}],"19":[{"catchword":"liet hen","tekst":"Namelijk Aquila en Priscilla."},{"catchword":"aldaar; maar","tekst":"Namelijk te Efeze, om de Efeziërs in het geloof te sterken."}],"20":[{"catchword":"langer bij hen","tekst":"Grieks tot meerderen tijd."}],"21":[{"catchword":"ganselijk het","tekst":"Dat is, noodzakelijk in alle manieren."},{"catchword":"feest te Jeruzalem","tekst":"Op dit feest heeft Hij willen zijn, niet omdat Hij achtte dat de Joodse feestdagen nog moesten onderhouden zijn; want daartegen leert Hij, Gal 4:10 ; Col 2:16 , maar omdat Hij op dat feest gelegenheid zou vinden om het Evangelie aan velen te prediken, die ter wille van het feest daar bijeen zouden zijn."},{"catchword":"voer weg van Éfeze","tekst":"Grieks hij werd naar de hoogte; dat is naar de diepte, gedreven over zee."}],"22":[{"catchword":"Cesarea","tekst":"Namelijk in Palestina gelegen Act 10:1 ."},{"catchword":"Antiochië","tekst":"Namelijk in Syrië gelegen."}],"23":[{"catchword":"geweest was,","tekst":"Grieks gemaakt had. Zie Act 15:33 , en Act 20:3 ; 2Co 11:25 ; Jam 4:13 ."},{"catchword":"vervolgens het","tekst":"Namelijk van de ene gemeente tot de andere, om hen te bezoeken."}],"24":[{"catchword":"welsprekend man,","tekst":"Of, welbereid, die Zijn woord wel kon doen."},{"catchword":"machtig zijnde","tekst":"Dat is, zeer ervaren in de Schriften en bekwaam om dezelve uit te leggen."}],"25":[{"catchword":"in den weg","tekst":"Dat is, in de leer des Heeren Christus, die ons den weg der zaligheid aanwijst; Mat 22:16 ; Act 9:2 , en Act 22:4 , en Act 24:14 ."},{"catchword":"onderwezen; en","tekst":"Grieks Catechemenos; dat is, door levende stem onderwezen in de beginselen der Christelijke religie."},{"catchword":"den doop van","tekst":"Dat is, zoveel van Christus als Johannes de Doper Zijne discipelen geleerd en deze leer aan hen met den doop bevestigd had, bij welken niet werden uitgedeeld de buitengewone gaven des Heiligen Geestes, gelijk bij den doop der apostelen aan velen geschiedde; Act 8:15 , en Act 19:3 ."}],"26":[{"catchword":"den weg Gods","tekst":"Zie vs.25."},{"catchword":"bescheidenlijker uit","tekst":"Dat is, overvloediger in alle delen der leer, van stuk tot stuk."}],"27":[{"catchword":"naar Acháje","tekst":"Dat is, naar Corinthe, de hoofdstad van Achaje, gelijk afgenomen kan worden 1Co 3:6 ."},{"catchword":"vermaand hebbende,","tekst":"Namelijk om kloekelijk in het leren te willen voortvaren, en zijne reis te volbrengen."},{"catchword":"veel toegebracht","tekst":"Dat is, veel geholpen tot versterking der gelovigen."},{"catchword":"door de genade","tekst":"Dit kan gevoegd worden, òf met het woord toegebracht, òf met het woord geloofd. Want beide moet komen van de genade Gods."}],"28":[{"catchword":"met groten ernst","tekst":"Of, sterkelijk aanhoudende."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And after this Paul parted from Athens and came to Corinth. [The chief City of Achaia in Greece, situate betwixt two Seas, on the neck of land Peloponesus joined to ACahia. See more largely of this City, 1 Cor. 1. 2.]"}],"2":[{"catchword":null,"tekst":"And found a certain Jew by name Aquila, by birth [Or by descent, generation] of Pontus [this was a Region in Asia the less, lying betwixt Cappadocia and the black Sea, Acts 2. 9.] who was lately come from Italy, and Priscilla his wife, because Claudius [the Emperour of Rome] had commanded [Gr.had ordained. Of this command testifie also the Historians, Sueton.in Claud.cap. 25. Orosius.lib.7.cap.6. The reason is diversly set forth: it seems that it was therefore, because the Jews continually with uproar opposed those from among themselves with embraced the Christian Religion: or because some notable persons of Rome betook themselves to the Christian Religion. For the Heathen Romanes held the Jews and Christians for a people of one Religion] that all the Jews should depart out of Rome) and he went unto them."}],"3":[{"catchword":null,"tekst":"And because he was of the same handicraft, he a abode with them and wrought: for they were Tent-makers [Which at that time were most made or sowed of skins] by handicraft."}],"4":[{"catchword":null,"tekst":"And he treated [Or disputed. See chap. 17.v.2.] on every Sabbath in the Synagogue, and moved (to the faith) [namely, by good reasons and grounds taken out of the Holy Scripture, for to embrace his doctrine] Jews and Greeks."}],"5":[{"catchword":null,"tekst":"And when Silas and Timotheus were come down from Macedonia , Paul was pressed [That is, driven forward with a strong zeal] by the spirit, [namely, either by the Holy Ghost which drove Paul forward, or by his own mind which was inflamed with zeal] testifying [Gr.powerfully, or every way testifying] to the Jews that Jesus is the Christ. [that is, the anointed, the true Messias promised by the Prophets.]"}],"6":[{"catchword":null,"tekst":"But when they resisted and blasphemed, he shook (his) garments, [This was a token that they would have no more communion with them] and said unto them, your blood (be) on your (own) head, [that is, ye pull down on your necks by your own fault, the punishment not only of temporal but also of eternal death. See of this phrase, Lev. 20. 9, 12. 2 Sam.1. 16. Mat. 27. 25.] I am pure [namely from your blood and destruction, forasmuch as I have faithfully warned you of destruction, and shewed you the way of salvation, which ye would not follow, Ezek. 33. 8, 9. Acts 20. 26.] and from this time forward I will go my way to the Gentiles."}],"7":[{"catchword":null,"tekst":"And being gone from thence, he came into the house of a (man) by name Justus, who worshipped God, [That is, who was a Proselyte.see Acts 13. 43.] whose house bordered on the Synagogue. [wherefore he seemeth to have bin willing to lodge there by going over the street to avoid the danger of an uproar of the unbelieving Jews.]"}],"8":[{"catchword":null,"tekst":"And Crispus [See of him 1 Cor. 1. 14.] the Ruler of the Synagogue [See concerning the Rulers of the Synagogues, Mark 5. 22. Acts 13. 15.] believed on the Lord with his whole house, and many of the Corinthians hearing (him) believed and were baptized."}],"9":[{"catchword":null,"tekst":"And the Lord said unto Paul by a vision in the night, be not afraid but speak and hold not thy peace. [This is thus, twice repeated, to give to understand that he should by no kind of trouble be affrighted from speaking and preaching the Gospel boldly. See John 1. 20.]"}],"10":[{"catchword":null,"tekst":"For I am with thee, [See Luke 11. 66.] and no man shall lay (hands) on thee to do thee hurt: for I have much people in this City. [that is, many elect ones which by thy preaching shall be converted. See John 10. 16.]"}],"11":[{"catchword":null,"tekst":"And he tarried (there) [Gr.sate there, namely, at Corinth. Hebr. See Mat. 6. 14.] a year and six moneths teaching the word of God among them."}],"12":[{"catchword":null,"tekst":"But when Gallio [This was a Brother of the famous L.Anneus Seneca, the School-master of the Emperour Nero, as Seneca himself testifies, Praefat.quaest.nat.lib.4.he was first called M. Anneus Novatus, but being adopted for a son by C.Junius Gallio he also took his name] was Governour [Gr. Anthypateuon, i.e. governing in stead of the Consul of Rome.See of this word Acts 13. 7. And 19. 38.] of Achia; [and also of all Greece Pausan.] the Jews rose up with one accord against Paul, and brought him before the judgement-seat,"}],"13":[{"catchword":null,"tekst":"Saying, this (man) adviseth men that they should worship God against the Law. [Namely, of the Jews, to whom the Romanes had permitted that they might continue in their Law.]"}],"14":[{"catchword":null,"tekst":"And when Paul was about to open (his) mouth [Namely, to defend himself] Gallio said unto the Jews, if there were any wrong or ill deed (committed) [namely, of murder, theft, uproar or the like] O ye Jews, then should I with reason [or according to reason, i.e. as much as reason will permit: as much as shall be reasonable] bear with you. [that is, with patience hear you, and do you justice.]"}],"15":[{"catchword":null,"tekst":"But if there be difference about a word [Namely, which any one hath said or spoken amiss of your Law or Religion] and names, [that is, if this difference be about certain Titles which might be ascribed to any man and (about) the Law which is among you, yourselves shall look to it, for I will be no judge about these things."}],"16":[{"catchword":null,"tekst":"And he drove them away [That is, commanded them presently to depart] from the judgement-seat."}],"17":[{"catchword":null,"tekst":"But all the Greeks [Namely, which were yet heathens and unbelievers as Gallio was] took Softhenes [whether this Softhenes be the same of whom is spoken 1 Cor. 1.v. 1.is uncertain] the Ruler of the Synagogue and beat (him) before the judgement-seat, and Gallio regarded none of these things. [namely out of contempt of the Jews, and of the Jewish and Christian Religion.]"}],"18":[{"catchword":null,"tekst":"And when Paul had tarried there yet many daies, he took leave of the brethren, [Namely, having taking order about his own and the churches business, as the Greek word imports. See Mark 6. 46.] and took ship from thence towards Syria [namely, along the coast which goeth towards Syria] and Priscilla and Aquila with him, having shorn [namely, as they did, who had made the promise of the Nazarites for a time, Num. 6.v. 18. 19, 20.] (his) head [or the head: for the Greek word may be applied to both, as well to Paul as to Aquila at Cenchrea [this was the haven on the other side called Lechea. Strabo lib.8.] for he had (made) a vow. [namely, of the Nazarites, which is described,Numb. 6.which vow some made for their life, others for a time, as was done here. The reason why this vow was made, see Acts 21. 23, 24.and 1 Cor.9.20.from whence it appears that this was a vow, not to God service thereby, but out of love to serve for the edification of the weak Jews, and to shew that he was no contemner of the Law."}],"19":[{"catchword":null,"tekst":"An he came unto Ephesus, and left them [Namely, Aquila and Priscilla] there, [namely, at Ephesus, to strengthen the Ephesians in the faith] but he went into the Synagogue, and treated with the Jews."}],"20":[{"catchword":null,"tekst":"And when they intreated that he would abide longer [Gr.for more time] with them, he consented not."}],"21":[{"catchword":null,"tekst":"But he took leave of them, saying, I must altogether [That is, necessarily, by all means] keep the feast that is coming at Jerusalem: [at this feast he would be, not because he thought that the Jewish feast daies must yet be observed: for he teacheth to the contrary, Gal. 4. 10. Col. 2. 16.but because at that feast he should finde occasion to preach the Gospel to many, who by reason of the feast would be there together] But I will return unto you if God will. And he sayled away from Ephesus. [Gr.he was driven towards the height, i.e. towards the deep, over Sea.]"}],"22":[{"catchword":null,"tekst":"And when he was come to Cesarea [Namely situate in Palestina, Act 10:1.] he went up (towards Jerusalem) and having saluted the Church, he went down to Antioch. [namely, situate in Syria.]"}],"23":[{"catchword":null,"tekst":"And when he had been [Gr.had made. See Acts 15. 33.and 20. 3. 2 Cor. 11. 25. Jam. 4. 13.] (there) sometime, he went away and travelled in order [namely, from one Church to another to visit them] through the land of Galatia and Phrygia, confirming all the disciples."}],"24":[{"catchword":null,"tekst":"And a certain Jew by name Apollos, by birth of Alexandria, an eloquent man [Or, well-spoken, who could speak well] came to Ephesus, being mighty in the Scriptures. [that is, very expert in the Scriptures, and fit to interpret the same.]"}],"25":[{"catchword":null,"tekst":"He was instructed [Gr. Catechumenos, i.e. by a lively voice instructed in the principalls of Christian Religion] in the way of the Lord, [that is, in the doctrine of the Lord Christ, who sheweth us the way of salvation, Mat. 22. 16. Act 9:2.and 22 4.and 24. 14.] and being servent of spirit, he spake and taught diligently the things of the Lord, knowing only the baptism of John. [that is, so much of Christ as John the Baptist had taught his disciples, and confirmed this doctrine unto them unto baptism, by which the extraordinary gifts of the Holy Ghost were not imparted, as was done to many by the baptism of the Apostles, Acts 8. 15.and 19.3.]"}],"26":[{"catchword":null,"tekst":"And he began to speak boldly in the Synagogue: and when Aquila and Priscilla had heard him, they took him unto them, and expounded unto him the way of God [See v. 25.] more distinctly. [that is, more abundantly in all parts of doctrine from point to point.]"}],"27":[{"catchword":null,"tekst":"And when he would travel towards Achaia, as may be gathered from 1 Cor. 3. 6.] the brethren having exhorted (him) [namely, that he would go courageously forward in teaching, and to accomplish his journey] wrote to the Disciples that they should receive him: who being come thither, he advantaged them much, [that is, helped much for confirmation of the faithfull] who believed by grace. [this may be joyned either with the word advantaged, or with the word believed, for both must come from the grace of God.]"}],"28":[{"catchword":null,"tekst":"For he convinced the Jews with great earnestness [Or strongly urging] publickly, proving by the Scriptures that Jesus was the Christ."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

    rij.className = 'vers'; rij.id = 'v' + n;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
