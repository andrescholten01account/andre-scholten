<style>
  :root {
    /* huisstijl overgenomen van andre-scholten.nl (Quartz) */
    --light:#ffffff; --lightgray:#e5e5e5; --gray:#b3b3b3; --darkgray:#333333; --dark:#111111;

    --accent: var(--secondary); --accent-donker: var(--dark); --bg: var(--light);
    --bg-soft: #f5f5f5; --border: var(--lightgray); --tekst: var(--darkgray);
  }
  * { box-sizing: border-box; }
  body { font-family: var(--bodyFont); background: var(--bg); color: var(--tekst); margin: 0; line-height: 1.7; }
  .omslag { max-width: 900px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }

  .site-nav { font-family:"Lora"; letter-spacing:.18em; text-transform:uppercase; border-top:1px solid var(--lightgray); border-bottom:1px solid var(--lightgray); margin:.8rem 0 2rem; padding:1rem 0; font-size:.82em; text-align:center; }

  .site-nav a:hover { color:var(--tertiary); text-decoration:underline; }
  .nav-sep { color:var(--gray); }
  .kruimel { font-family: "Lora"; font-size: .78rem; color: #999; margin: 1rem 0 .2rem; }
  .kruimel a { color: var(--accent); text-decoration: none; }
  h2.hfd { color: var(--dark); text-align: center; font-size: 1.75rem; font-weight: 700; margin: 2rem 0 0; }
  .ondertitel { text-align: center; color: #666666; font-style: italic; font-size: .95rem; margin-bottom: 1rem; }
  .hfdnav { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-family:"Lora"; font-size:.85rem; padding:.5rem 0; margin-bottom:1.1rem; }
  .navknop { color:var(--accent); text-decoration:none; padding:.25rem .3rem; white-space:nowrap; }
  .navknop:hover { color:var(--accent-donker); text-decoration:underline; }
  .navknop.uit { color:#ccc; pointer-events:none; }
  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
  #bibliotheekknop { padding:.3rem .7rem; font-size:1rem; line-height:1; }

     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }
  #notenlijst { margin: 1.5rem 0 0 2.4rem; font-family: "Lora"; font-size: .82rem; color: #666; border-top: 1px solid var(--border); padding-top: .8rem; }
  #notenlijst h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-donker); margin: 0 0 .5rem; }
  #notenlijst .nootregel { margin: .25rem 0; }
  #notenlijst .nootregel .nn { color: var(--accent); font-weight: 700; margin-right: .35rem; }
  .kopieer { position: absolute; right: .4rem; top: .55rem; opacity: 0; border: none; background: none; cursor: pointer; color: var(--accent); font-size: .95rem; padding: .1rem .3rem; transition: opacity .15s; }
  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  /* naslagpaneel */
  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }
  .paneel.open { display: block; }
  .ntabs { display: flex; gap: .4rem; margin-bottom: .8rem; }
  .ntab { border: 1px solid var(--border); background: var(--bg-soft); border-radius: 6px 6px 0 0; padding: .28rem .95rem; cursor: pointer; font-size: .8rem; color: #666; }
  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }
  .tsk-kop { font-weight: 700; color: var(--accent-donker); margin: .55rem 0 .3rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
  .verg-kop { font-family:"Lora"; font-weight: 700; color: var(--accent-donker); font-size: 1.05rem; margin: 0 0 .6rem; padding-bottom: .35rem; border-bottom: 2px solid var(--accent); }

  .opener { display: block; cursor: pointer; font-weight: 600; color: var(--accent-donker); padding: .2rem 0; }
  .opener:hover { color: var(--accent); }
  .opener::before { content: '▸ '; font-size: .75em; }

  .tsk-sub { font-weight: 600; color: #444; margin: .5rem 0 .2rem; }

  .refchip:hover { color: var(--dark); border-bottom-color: var(--dark); }

  .ond-label { color: #333333; }
  .ond-refs { margin: .3rem 0 0; }

  .ond-refs .alle summary { display: inline-block; cursor: pointer; color: var(--accent); font-size: .8rem; margin: .1rem 0; }
  .onderwerp .label { font-style: italic; color: #666; }
  .ondrefs { line-height:1.9; margin-top:.4rem; }
  .meer { font-size:.72rem; color:#999; margin-left:.3rem; }
  .schakelnav { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .schakelnav .pos { font-size:.75rem; color:#999; }
  .alle > summary { font-size:.75rem; color:var(--accent); cursor:pointer; margin-top:.35rem; list-style:none; }

  .alle > summary:hover { text-decoration:underline; }
  .bronregel { font-size:.72rem; color:#999; margin-top:.6rem; }

  #popup { position: absolute; display: none; max-width: 380px; background: #ffffff; border: 1px solid #cccccc; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: .7rem .9rem; font-size: .85rem; line-height: 1.55; z-index: 20; font-family: "Lora", serif; }

  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }
  .site-footer-col { display:flex; flex-direction:column; gap:.5rem; }
  .site-footer-mid { text-align:center; }
  .site-footer-right { text-align:right; }
  .site-footer a { color:var(--secondary); text-decoration:underline; }
  .site-footer .footer-plain { color:var(--gray); }

  footer.site { margin-top: 2.5rem; margin-bottom: -3rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-family: "Lora"; font-size: .72rem; color: #999; line-height: 1.7; }
  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 3rem; } header.site h1 { font-size: 1.5rem; } }
</style>

 in deze man is, laten zij hem beschuldigen.","6":"En toen hij onder hen niet meer dan tien dagen had doorgebracht, ging hij naar Cesarea; en de volgende dag ging hij op de rechterstoel zitten en beval dat Paulus voorgebracht zou worden.","7":"En toen hij daar gekomen was, gingen de Joden die van Jeruzalem gekomen waren om hem heen staan en brachten veel zware beschuldigingen tegen Paulus in, die zij niet konden bewijzen;","8":"Omdat Paulus zich verantwoordde en zei: Ik heb noch tegen de wet van de Joden, noch tegen de tempel, noch tegen de keizer iets misdaan.","9":"Maar Festus, die de Joden een gunst wilde bewijzen, antwoordde Paulus en zei: Wilt u naar Jeruzalem opgaan en daar voor mij over deze dingen geoordeeld worden?","10":"En Paulus zei: Ik sta voor de rechterstoel van de keizer, waar ik geoordeeld moet worden; de Joden heb ik geen onrecht gedaan, zoals u ook zeer goed weet.","11":"Want als ik onrecht doe en iets gedaan heb dat de dood verdient, weiger ik niet te sterven; maar als er niets waar is van wat dezen mij beschuldigen, kan niemand mij uit gunst aan hen overgeven. Ik beroep mij op de keizer.","12":"Toen antwoordde Festus, nadat hij met de raad gesproken had: Hebt u zich op de keizer beroepen? U zult naar de keizer gaan.","13":"En na enige dagen kwamen koning Agrippa en Bernice naar Cesarea om Festus te begroeten.","14":"En toen zij daar veel dagen hadden doorgebracht, vertelde Festus de zaak van Paulus aan de koning, en zei: Er is hier een zekere man die door Felix gevangen is achtergelaten;","15":"Om wie, toen ik in Jeruzalem was, de overpriesters en de oudsten van de Joden verschenen, met het verzoek om een vonnis tegen hem;","16":"Aan hen antwoordde ik dat het bij de Romeinen geen gewoonte is iemand uit gunst ter dood over te geven, voordat de beschuldigde de beschuldigers persoonlijk tegenover zich heeft gehad en de kans heeft gekregen zich te verantwoorden over de beschuldiging.","17":"Toen zij dan gezamenlijk hier gekomen waren, heb ik, zonder enig uitstel te nemen, de volgende dag op de rechterstoel plaatsgenomen en bevolen dat de man voorgebracht zou worden;","18":"Over hem hebben de beschuldigers, die hier stonden, geen zaak voortgebracht van de dingen die ik vermoedde;","19":"Maar zij hadden tegen hem enkele vragen over hun eigen godsdienst, en over een zekere Jezus, die gestorven was, van wie Paulus beweerde dat Hij leeft.","20":"En omdat ik in twijfel was over het onderzoek van deze zaak, vroeg ik of hij naar Jeruzalem wilde gaan en daar over deze dingen geoordeeld wilde worden.","21":"Maar omdat Paulus zich erop beriep dat men hem zou bewaren tot de beslissing van de keizer, heb ik bevolen dat hij bewaakt zou worden, totdat ik hem naar de keizer zou zenden.","22":"En Agrippa zei tegen Festus: Ik zou die man ook wel zelf willen horen. En hij zei: Morgen zult u hem horen.","23":"De volgende dag dan, toen Agrippa gekomen was en Bernice, met grote pracht, en zij het gerechtsgebouw waren binnengegaan met de aanvoerders en de mannen die de voornaamsten van de stad waren, werd Paulus op bevel van Festus voorgebracht.","24":"En Festus zei: Koning Agrippa, en u, mannen, allen die hier bij ons aanwezig bent, u ziet deze man over wie de hele menigte van de Joden zich tot mij gewend heeft, zowel in Jeruzalem als hier, en geroepen heeft dat hij niet langer mag leven.","25":"Maar ik heb vastgesteld dat hij niets gedaan heeft dat de dood verdient, en omdat hij zichzelf op de keizer beroepen heeft, heb ik besloten hem te zenden.","26":"Over hem heb ik niets zekers aan de heer te schrijven; daarom heb ik hem voor u gebracht, en vooral voor u, koning Agrippa, opdat ik, na het onderzoek te hebben gedaan, iets heb om te schrijven.","27":"Want het lijkt mij onredelijk een gevangene te zenden zonder ook de beschuldigingen tegen hem bekend te maken."},"SV":{"1":"Festus dan, in de provincie gekomen zijnde, ging na drie dagen van Cesarea op naar Jeruzalem.","2":"En de hogepriester, en de voornaamsten der Joden, verschenen voor hem tegen Paulus en baden hem,","3":"Begerende gunst tegen hem, opdat hij hem zou doen komen te Jeruzalem; *en* leggende een lage, om hem op den weg om te brengen.","4":"Doch Festus antwoordde, dat Paulus te Cesarea bewaard werd, en dat hij zelf haast *derwaarts* zou verreizen.","5":"Die dan, zeide hij, onder u kunnen, dat zij mede afreizen, en zo er iets onbehoorlijks in dezen man is, dat zij hem beschuldigen.","6":"En als hij onder hen niet meer dan tien dagen doorgebracht had, kwam hij af naar Cesarea; en des anderen daags, op den rechterstoel gezeten zijnde, beval hij, dat Paulus zou *voor* gebracht worden.","7":"En als hij daar gekomen was, stonden de Joden, die van Jeruzalem afgekomen waren, rondom *hem*, vele en zware beschuldigingen tegen Paulus voortbrengende, die zij niet konden bewijzen;","8":"Dewijl hij, verantwoordende, zeide: Ik heb noch tegen de wet der Joden, noch tegen den tempel, noch tegen den keizer iets gezondigd.","9":"Maar Festus, willende den Joden gunst bewijzen, antwoordde Paulus, en zeide: Wilt gij naar Jeruzalem opgaan, en aldaar voor mij over deze dingen geoordeeld worden?","10":"En Paulus zeide: Ik sta voor den rechterstoel des keizers, waar ik geoordeeld moet worden; den Joden heb ik geen onrecht gedaan; gelijk gij ook zeer wel weet.","11":"Want indien ik onrecht doe, en iets des doods waardig gedaan heb, ik weiger niet te sterven; maar indien er niets is van hetgeen, waarvan dezen mij beschuldigen, zo kan niemand mij hun uit gunst overgeven. Ik beroep mij op den keizer.","12":"Toen antwoordde Festus, als hij met den raad gesproken had: Hebt gij u op den keizer beroepen? Gij zult tot den keizer gaan.","13":"En als enige dagen voorbijgegaan waren, kwamen de koning Agrippa en Bernice te Cesarea, om Festus te begroeten.","14":"En toen zij aldaar vele dagen doorgebracht hadden, heeft Festus de zaken van Paulus aan den koning verhaald, zeggende: *Hier* is een zeker man van Felix gevangen gelaten;","15":"Om wiens wil, als ik te Jeruzalem was, de overpriesters en de ouderlingen der Joden verschenen, begerende vonnis tegen hem;","16":"Aan dewelke ik antwoordde, dat de Romeinen de gewoonte niet hebben, enigen mens uit gunst ter dood over te geven, eer de beschuldigde de beschuldigers tegenwoordig heeft, en plaats van verantwoording gekregen heeft over de beschuldiging.","17":"Als zij dan gezamenlijk alhier gekomen waren, zo heb ik, geen uitstel nemende, des *daags* daaraan op den rechterstoel gezeten, en beval, dat de man zoude *voor* gebracht worden;","18":"Over welken de beschuldigers, *hier* staande, geen zaak hebben voorgebracht, waarvan ik vermoedde;","19":"Maar hadden tegen hem enige vragen van hun godsdienst, en van zekeren Jezus, Die gestorven was, Welken Paulus zeide te leven.","20":"En als ik over de onderzoeking van deze zaak in twijfeling was, zeide ik, of hij wilde gaan naar Jeruzalem, en aldaar over deze dingen geoordeeld worden.","21":"En als Paulus zich beriep, dat men hem tot de kennis des keizers bewaren zou, zo heb ik bevolen, dat hij bewaard zoude worden, ter tijd toe, dat ik hem tot den keizer zenden zou.","22":"En Agrippa zeide tot Festus: Ik wilde ook zelf dien mens *wel* horen. En hij zeide: Morgen zult gij hem horen.","23":"Des anderen daags dan, als Agrippa gekomen was en Bernice, met grote pracht, en als zij ingegaan waren in het rechthuis, met de oversten over duizend, en de mannen, die de voornaamsten der stad waren, werd Paulus op bevel van Festus *voor* gebracht.","24":"En Festus zeide: Koning Agrippa, en gij mannen allen, die met ons tegenwoordig zijt, gij ziet dezen, van welken mij de ganse menigte der Joden heeft aangesproken, beide te Jeruzalem en hier, roepende, dat hij niet meer behoort te leven.","25":"Maar ik bevonden hebbende, dat hij niets des doods waardig gedaan had, en dewijl hij ook zelf zich op den keizer beroepen heeft, heb besloten hem te zenden.","26":"Van welken ik niets zekers heb aan den heer te schrijven; daarom heb ik hem voor ulieden voorgebracht, en meest voor u, koning Agrippa, opdat ik, na gedane onderzoeking, wat heb te schrijven.","27":"Want het dunkt mij tegen rede, een gevangene te zenden, *en* niet ook de beschuldigingen, die tegen hem zijn, te kennen te geven."},"KJV":{"1":"Now when Festus was come into the province, after three days he ascended from Caesarea to Jerusalem.","2":"Then the high priest and the chief of the Jews informed him against Paul, and besought him,","3":"And desired favour against him, that he would send for him to Jerusalem, laying wait in the way to kill him.","4":"But Festus answered, that Paul should be kept at Caesarea, and that he himself would depart shortly","5":"Let them therefore, said he, which among you are able, go down with *me*, and accuse this man, if there be any wickedness in him.","6":"And when he had tarried among them more than ten days, he went down unto Caesarea; and the next day sitting on the judgment seat commanded Paul to be brought.","7":"And when he was come, the Jews which came down from Jerusalem stood round about, and laid many and grievous complaints against Paul, which they could not prove.","8":"While he answered for himself, Neither against the law of the Jews, neither against the temple, nor yet against Caesar, have I offended any thing at all.","9":"But Festus, willing to do the Jews a pleasure, answered Paul, and said, Wilt thou go up to Jerusalem, and there be judged of these things before me?","10":"Then said Paul, I stand at Caesar's judgment seat, where I ought to be judged: to the Jews have I done no wrong, as thou very well knowest.","11":"For if I be an offender, or have committed any thing worthy of death, I refuse not to die: but if there be none of these things whereof these accuse me, no man may deliver me unto them. I appeal unto Caesar.","12":"Then Festus, when he had conferred with the council, answered, Hast thou appealed unto Caesar? unto Caesar shalt thou go.","13":"And after certain days king Agrippa and Bernice came unto Caesarea to salute Festus.","14":"And when they had been there many days, Festus declared Paul's cause unto the king, saying, There is a certain man left in bonds by Felix:","15":"About whom, when I was at Jerusalem, the chief priests and the elders of the Jews informed *me*, desiring *to have* judgment against him.","16":"To whom I answered, It is not the manner of the Romans to deliver any man to die, before that he which is accused have the accusers face to face, and have licence to answer for himself concerning the crime laid against him.","17":"Therefore, when they were come hither, without any delay on the morrow I sat on the judgment seat, and commanded the man to be brought forth.","18":"Against whom when the accusers stood up, they brought none accusation of such things as I supposed:","19":"But had certain questions against him of their own superstition, and of one Jesus, which was dead, whom Paul affirmed to be alive.","20":"And because I doubted of such manner of questions, I asked *him* whether he would go to Jerusalem, and there be judged of these matters.","21":"But when Paul had appealed to be reserved unto the hearing of Augustus, I commanded him to be kept till I might send him to Caesar.","22":"Then Agrippa said unto Festus, I would also hear the man myself. To morrow, said he, thou shalt hear him.","23":"And on the morrow, when Agrippa was come, and Bernice, with great pomp, and was entered into the place of hearing, with the chief captains, and principal men of the city, at Festus' commandment Paul was brought forth.","24":"And Festus said, King Agrippa, and all men which are here present with us, ye see this man, about whom all the multitude of the Jews have dealt with me, both at Jerusalem, and *also* here, crying that he ought not to live any longer.","25":"But when I found that he had committed nothing worthy of death, and that he himself hath appealed to Augustus, I have determined to send him.","26":"Of whom I have no certain thing to write unto my lord. Wherefore I have brought him forth before you, and specially before thee, O king Agrippa, that, after examination had, I might have somewhat to write.","27":"For it seemeth to me unreasonable to send a prisoner, and not withal to signify the crimes *laid* against him."}},"tsk":{"1":[{"kopje":"in","refs":["Hand 23:34"]},{"kopje":"hij","refs":["Hand 25:5","Hand 18:22","Hand 21:15"]}],"3":[{"kopje":"vroegen","refs":["Hand 9:2","1 Sam 23:19-21","Jer 38:4","Mark 6:23-25","Luk 23:8-24"]},{"kopje":"gelegd","refs":["Hand 23:12-15","Hand 26:9-11","Ps 37:32","Ps 37:33","Ps 64:3-7","Ps 140:2-6","Jer 18:18","Joh 16:3","Rom 3:8"]}],"5":[{"kopje":"degenen onder u die daartoe in staat zijn","refs":["Hand 25:16","Hand 23:30","Hand 24:8"]},{"kopje":"als","refs":["Hand 25:18","Hand 25:19","Hand 25:25","Hand 18:14","1 Sam 24:12","1 Sam 24:13","Ps 7:4-6","Joh 18:29","Joh 18:30"]}],"6":[{"kopje":"zitten","refs":["Hand 25:10","Hand 25:17","Hand 18:12-17","Matt 27:19","Joh 19:13","2 Kor 5:10","Jak 2:6"]}],"7":[{"kopje":"brachten ... in","refs":["Hand 25:24","Hand 21:28","Hand 24:5","Hand 24:6","Hand 24:13","Ezra 4:15","Est 3:8","Ps 27:12","Ps 35:11","Matt 5:11","Matt 5:12","Matt 26:60-62","Mark 15:3","Mark 15:4","Luk 23:2","Luk 23:10","1 Petr 4:14-16"]}],"8":[{"kopje":"Noch","refs":["Hand 25:10","Hand 6:13","Hand 6:14","Hand 23:1","Hand 24:6","Hand 24:12","Hand 24:17-21","Hand 28:17","Hand 28:21","Gen 40:15","Jer 37:18","Dan 6:23","2 Kor 1:12"]}],"9":[{"kopje":"gunst wilde bewijzen","refs":["Hand 25:3","Hand 25:20","Hand 12:3","Hand 24:27","Mark 15:15"]}],"10":[{"kopje":"Ik sta","refs":["Hand 16:37","Hand 16:38","Hand 22:25-28"]},{"kopje":"zoals u","refs":["Hand 25:25","Hand 23:29","Hand 26:31","Hand 28:18","Matt 27:18","Matt 27:23","Matt 27:24","2 Kor 4:2"]}],"11":[{"kopje":"als ik","refs":["Hand 18:14","Joz 22:22","1 Sam 12:3-5","Job 31:21","Job 31:38-40","Ps 7:4-6"]},{"kopje":"niemand","refs":["Hand 16:37","Hand 22:25","1 Tess 2:15"]},{"kopje":"Ik beroep mij","refs":[ kjv\" data-code=\"G1014\">would</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> <span class=\"wl wl-kjv\" data-code=\"G191\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"G444\">man</span> <span class=\"wl wl-kjv\" data-code=\"G846\">myself.</span> To <span class=\"wl wl-kjv\" data-code=\"G839\">morrow,</span> <span class=\"wl wl-kjv\" data-code=\"G5346\">said</span> he, thou shalt <span class=\"wl wl-kjv\" data-code=\"G191\">hear</span> him.","23":"And on the <span class=\"wl wl-kjv\" data-code=\"G1887\">morrow,</span> <span class=\"wl wl-kjv\" data-code=\"G3767\">when</span> <span class=\"wl wl-kjv\" data-code=\"G67\">Agrippa</span> was <span class=\"wl wl-kjv\" data-code=\"G2064\">come,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G959\">Bernice,</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G4183\">great</span> <span class=\"wl wl-kjv\" data-code=\"G5325\">pomp,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> was <span class=\"wl wl-kjv\" data-code=\"G1525\">entered</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> the place of <span class=\"wl wl-kjv\" data-code=\"G201\">hearing,</span> <span class=\"wl wl-kjv\" data-code=\"G4862\">with</span> the chief <span class=\"wl wl-kjv\" data-code=\"G5506\">captains,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">principal</span> <span class=\"wl wl-kjv\" data-code=\"G435\">men</span> <span class=\"wl wl-kjv\" data-code=\"G5607\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G4172\">city,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">at</span> <span class=\"wl wl-kjv\" data-code=\"G5347\">Festus'</span> <span class=\"wl wl-kjv\" data-code=\"G2753\">commandment</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul</span> was brought forth.","24":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G5347\">Festus</span> <span class=\"wl wl-kjv\" data-code=\"G5346\">said,</span> <span class=\"wl wl-kjv\" data-code=\"G935\">King</span> <span class=\"wl wl-kjv\" data-code=\"G67\">Agrippa,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G435\">men</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> are here <span class=\"wl wl-kjv\" data-code=\"G4840\">present</span> with <span class=\"wl wl-kjv\" data-code=\"G2254\">us,</span> ye <span class=\"wl wl-kjv\" data-code=\"G2334\">see</span> this <span class=\"wl wl-kjv\" data-code=\"G5126\">man,</span> <span class=\"wl wl-kjv\" data-code=\"G4012\">about</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">whom</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> the <span class=\"wl wl-kjv\" data-code=\"G4128\">multitude</span> of the <span class=\"wl wl-kjv\" data-code=\"G2453\">Jews</span> have <span class=\"wl wl-kjv\" data-code=\"G1793\">dealt</span> with <span class=\"wl wl-kjv\" data-code=\"G3427\">me,</span> <span class=\"wl wl-kjv\" data-code=\"G5037\">both</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">at</span> <span class=\"wl wl-kjv\" data-code=\"G2414\">Jerusalem,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> also <span class=\"wl wl-kjv\" data-code=\"G1759\">here,</span> <span class=\"wl wl-kjv\" data-code=\"G1916\">crying</span> that he <span class=\"wl wl-kjv\" data-code=\"G1163\">ought</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> to <span class=\"wl wl-kjv\" data-code=\"G2198\">live</span> any longer.","25":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> when <span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> <span class=\"wl wl-kjv\" data-code=\"G2638\">found</span> that <span class=\"wl wl-kjv\" data-code=\"G846\">he</span> had <span class=\"wl wl-kjv\" data-code=\"G4238\">committed</span> <span class=\"wl wl-kjv\" data-code=\"G3367\">nothing</span> <span class=\"wl wl-kjv\" data-code=\"G514\">worthy</span> of <span class=\"wl wl-kjv\" data-code=\"G2288\">death,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> that he <span class=\"wl wl-kjv\" data-code=\"G846\">himself</span> hath <span class=\"wl wl-kjv\" data-code=\"G5127\">appealed</span> <span class=\"wl wl-kjv\" data-code=\"G1941\">to</span> <span class=\"wl wl-kjv\" data-code=\"G4575\">Augustus,</span> I have <span class=\"wl wl-kjv\" data-code=\"G2919\">determined</span> to <span class=\"wl wl-kjv\" data-code=\"G3992\">send</span> him.","26":"<span class=\"wl wl-kjv\" data-code=\"G4012\">Of</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">whom</span> I <span class=\"wl wl-kjv\" data-code=\"G2192\">have</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">no</span> <span class=\"wl wl-kjv\" data-code=\"G804\">certain</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">thing</span> to <span class=\"wl wl-kjv\" data-code=\"G1125\">write</span> unto my <span class=\"wl wl-kjv\" data-code=\"G2962\">lord.</span> <span class=\"wl wl-kjv\" data-code=\"G1352\">Wherefore</span> I have <span class=\"wl wl-kjv\" data-code=\"G4254\">brought</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G4254\">forth</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">before</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">you,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3122\">specially</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">before</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thee,</span> O <span class=\"wl wl-kjv\" data-code=\"G935\">king</span> <span class=\"wl wl-kjv\" data-code=\"G67\">Agrippa,</span> <span class=\"wl wl-kjv\" data-code=\"G3704\">that,</span> after <span class=\"wl wl-kjv\" data-code=\"G351\">examination</span> <span class=\"wl wl-kjv\" data-code=\"G1096\">had,</span> I might <span class=\"wl wl-kjv\" data-code=\"G2192\">have</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">somewhat</span> to write.","27":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> it <span class=\"wl wl-kjv\" data-code=\"G1380\">seemeth</span> to <span class=\"wl wl-kjv\" data-code=\"G3427\">me</span> <span class=\"wl wl-kjv\" data-code=\"G249\">unreasonable</span> to <span class=\"wl wl-kjv\" data-code=\"G3992\">send</span> a <span class=\"wl wl-kjv\" data-code=\"G1198\">prisoner,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> not <span class=\"wl wl-kjv\" data-code=\"G3361\">withal</span> to <span class=\"wl wl-kjv\" data-code=\"G4591\">signify</span> the <span class=\"wl wl-kjv\" data-code=\"G156\">crimes</span> laid <span class=\"wl wl-kjv\" data-code=\"G2596\">against</span> him."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"provincie","tekst":"Alzo noemden de Romeinen een landschap, hetwelk zij met de wapenen gewonnen en onder hun gebied gebracht hadden, en door enige afgezonden stadhouders vanwege het Romeinse rijk lieten regeren; hoedanig ook Judea was. Zie Act 23:34 ."},{"catchword":"Cesarea","tekst":"Welke stad te dien tijd de zetel was van de Romeinse stadhouders, vanwege hare sterkte en ligging. Zie Act 23:23 ."},{"catchword":"Jeruzalem","tekst":"Dat de hoofdstad was van de gehele provincie, en waar de geestelijke en wereldlijke regering der Joden was, doch onder het opzicht des stadhouders."}],"2":[{"catchword":"de voornaamsten","tekst":"Grieks de eerste."},{"catchword":"der Joden,","tekst":"Dat is, uit den raad der Joden; Act 24:1 ."}],"3":[{"catchword":"hem, opdat","tekst":"Namelijk Paulus."}],"4":[{"catchword":"derwaarts","tekst":"Namelijk naar Cesarea, gelijk hij ook gedaan heeft, vs.6."}],"5":[{"catchword":"afreizen, en","tekst":"Namelijk naar Cesarea; zo spreekt hij omdat Jeruzalem hoger in het land en op bergen lag. Zie vs.7."}],"6":[{"catchword":"niet meer dan","tekst":"Anders, meer dan tien dagen."}],"7":[{"catchword":"vele en zware","tekst":"Welke deze beschuldigingen geweest zijn, blijkt uit de verantwoording van Paulus in vs.8."}],"9":[{"catchword":"gunst bewijzen,","tekst":"Gelijk ook tevoren Felix deed; Act 24:27 ."},{"catchword":"voor mij over","tekst":"Namelijk van den Raad der Joden, in mijne tegenwoordigheid of onder mijn beleid."}],"10":[{"catchword":"des keizers,","tekst":"Namelijk wiens stadhouder gij zijt."},{"catchword":"moet worden;","tekst":"Namelijk als een burger van Rome."},{"catchword":"gelijk gij ook","tekst":"Namelijk zo uit het bericht dat Felix u van mij gedaan heeft, als uit deze mijne verantwoording, die gij nu gehoord hebt."}],"11":[{"catchword":"Ik beroep mij","tekst":"Dat is, ik beroep mij tot den keizer, namelijk als een burger van Rome, wien dit recht van appel, of beroeping van den keizer in zulke gelegenheid toekomt, gelijk blijkt, vs.12, en Act 26:32 ."}],"12":[{"catchword":"met den raad","tekst":"Niet der Joden, maar dergenen, die hij als stadhouder bij zich had geroepen."}],"13":[{"catchword":"Agrippa","tekst":"Deze was de zoon van dien Herodes, die Jakobus had doen doden; Act 12:1-2 ."},{"catchword":"Bernice","tekst":"Eene zuster van Agrippa [gelijk ook Drusilla, Act 24:24 ] , ook een ontuchtige en prachtige vrouw, die weduwe zijnde, bij dezen Agrippa haren broeder gewoond heeft, niet zonder achterdenken van bloedschande; JosEf. Antiq. lib.20, cap.5."},{"catchword":"te begroeten","tekst":"Of, te welkomen en geluk te wensen over zijne komst in deze nieuwe provincie en bediening."}],"15":[{"catchword":"vonnis tegen hem;","tekst":"Namelijk des doods, zonder anderen vorm van recht, gelijk blijkt uit vs.16."}],"16":[{"catchword":"uit gunst","tekst":"Namelijk van de beschuldigers, gelijk zij verzocht hadden, vs.3."},{"catchword":"ter dood over","tekst":"Grieks ten verderve."},{"catchword":"tegenwoordig","tekst":"Grieks voor het aangezicht."}],"17":[{"catchword":"nemende, des","tekst":"Grieks makende."}],"18":[{"catchword":"zaak hebben","tekst":"Of, beschuldiging."}],"19":[{"catchword":"vragen van hun","tekst":"Of, verschillen, kwestiën."},{"catchword":"godsdienst, en","tekst":"Of, bijgeloof alzo noemt deze heiden den Joodsen godsdienst uit verachting, en dat in tegenwoordigheid van Agrippa en zijne zuster, die Joden waren, maar alles gewoon te verdragen, om deze Romeinse stadhouders niet te mishagen."}],"20":[{"catchword":"in twijfeling","tekst":"Dit zegt hij tegen waarheid om zijne zaak te verschonen; want hij had dit van Paulus alzo gevergd om den Joden gunst te bewijzen, vs.9."}],"21":[{"catchword":"des keizers","tekst":"Grieks Sebaston; voor hetwelk de Latijnen gebruiken het woord Augustus, betekent eigenlijk een, wien de voornaamste eer toekomt; en het woord Sebas, waar dit van komt, wordt veel genomen voor goddelijke eer, welke de heidenen hunnen keizers ook aandeden, of ook voor hetgeen goddelijke eer aangedaan wordt. Zie Act 17:23 , en Act 27:1 ."}],"23":[{"catchword":"pracht, en","tekst":"Grieks met veel fantasie; dat is, luister of schijn, niet alleen van kostelijke klederen, maar ook van groot gevolg of gesleep, hetwelk wij pracht of pomp plegen te noemen."},{"catchword":"rechthuis, met","tekst":"Grieks Acroaterion; hetwelk eigenlijk betekent ene zaal of plaats, waar men audientie geeft, of de rechtzaken hoort en bepleit."}],"26":[{"catchword":"den heer te","tekst":"Dat is, de keizer; welken titel van heer de eerste keizers niet hebben willen aannemen, omdat zij ene heerschappij over de onderzaten, als over slaven, medebrengt. Doch de keizer Nero, onder wien dit is geschied, heeft zich dien titel laten geven, gelijk ook vele andere keizers na hem."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Festus therefore being come into the Province [So the Romans called that Country, which they had won by arms and brought under their command, and caused to be governed by certain Governours sent forth in the name of the Roman Empire; of which kind Judea also was. See also chap. 23.ver. 24.] after three daies went from Cesarea [which City at that time was the seat of the Roman Governours, by reason of its strength and conveniency. See Acts 23. 23.] up to Jerusalem: [which was the chief City of the whole Province, and where the spirituall and temporall government of the Jews was, yet under the oversight of the Governour.]"}],"2":[{"catchword":null,"tekst":"And the High Priest and the principall [Gr.the first] of the Jews, [that is, of the Councill of the Jews Acts 24. 1.] appeared before him against Paul and besought him:"}],"3":[{"catchword":null,"tekst":"Desiring favour against him, [Namely, Paul] that he would cause him to come to Jerusalem, (and) laying an ambush to destroy him by the way."}],"4":[{"catchword":null,"tekst":"But Festus answered, that Paul was kept at Cesarea, and that he himself would shortly travell thither. [Namely to Cesarea, as he also did ver.6.]"}],"5":[{"catchword":null,"tekst":"They therefore said he, amongst you that are able, let them go down also, [Namely, to Cesarea: so he speaks because Jerusalem lay higher in the land and on hills/ See also ver. 7.] and if there be anything unsitting in this man, let them accuse him."}],"6":[{"catchword":null,"tekst":"And when he had passed over no more then ten daies among them, [Oth.more then ten days] he came down to Cesarea, and on the morrow being set on the judgement seat, he commanded that Paul should be brought (forth.)"}],"7":[{"catchword":null,"tekst":"And when he was come thither, the Jews which were come down from Jerusalem stood round (him) bringing forth many and grievous accusations against Paul, [What these accusations were, appears by the defence of Paul in the following verse] which they could not prove."}],"8":[{"catchword":null,"tekst":"While he defending, said, I have neither offended anything against the Law of the Jews, nor against the Temple, nor against Cesar."}],"9":[{"catchword":null,"tekst":"But Festus willing to shew favour to the Jews [As also Felix did before, Acts 24. 27.] answered Paul and said, wilt thou go up to Jerusalem, and there be judged nefore me, [namely, by the Councill of the Jews in my presence, or under my conduct] about these things?"}],"10":[{"catchword":null,"tekst":"And Paul said I stand before Cesars judgement-seat, [Namely, whose Governour thou art] where I must be judged: [namely, as a Citizen of Rome] to the Jews I have done no wrong: as thou also knowest very well. [namely, aswell by the report which Felix hath made to thee concerning me, as by this my defence which thou hast now heard.]"}],"11":[{"catchword":null,"tekst":"For if I doe wrong, and have done any thing worthy of death, I refuse not to die: but if there be nothing of that whereof these accuse me, no man can out of favour deliver me over to them. I call upon Cesar. [That is, I appeal unto Cesar, namely, as a Citizen of Rome, to whom this right of appeal, or calling upon Cesar in such a condition belongs, as appears ver.12.and Acts 26. 32.]"}],"12":[{"catchword":null,"tekst":"Then answered Festus, when he had spoken with the Councill [Namely, not of the Jews, but of whom he as a Governour had called unto him] Hast thou appealed unto Cesar? Thou shalt go unto Cesar."}],"13":[{"catchword":null,"tekst":"And when some days were passed over, came King Agrippa [This was the son of that Herod, who had caused James to be put to death. Acts. 12. 1. 2.] and Bernice [a sister of Agrippa (as also, who being a widow dwelt with this Agrippa her brother, not without suspicion of incest, Joseph.antiq.lib.20.cap. 5.] to Cesarea, to salute Festus. [or, to welcome him, and wish him happiness upon his coming into this new Province and administration.]"}],"14":[{"catchword":null,"tekst":"And when they had spent many days there, Festus related Pauls matters to the King, saying, (here) is a certain man left in prison by Felix:"}],"15":[{"catchword":null,"tekst":"For whose sake when I was at Jerusalem the Chief Priests and the Elders of the Jews appeared, desiring sentence against him. [Namely, of death, without other form of Law, as appears from the verse following.]"}],"16":[{"catchword":null,"tekst":"To whom I answered, that the Romans have not the custome, out of favour [Namely, to the accusers, as they had requested ver.3.] to deliver over any man to death, [Gr.to destruction] before the accused have the accusers present, [Gr.before his face] and hath obtained palce of making his defence touching the accusation."}],"17":[{"catchword":null,"tekst":"When they therefore were come hither together, I taking [Gr.making] no delay, the (day) following sate on the judgement-seat, and commanded that the man should be brought (forth.)"}],"18":[{"catchword":null,"tekst":"About whom the accusers standing (here) brought forth no matter, [Or accusation] whereof I had suspicion."}],"19":[{"catchword":null,"tekst":"But had against him certain enquiries [Or, differences, questions] of their Religion, [or, superstition, So this Heathen calls the Jewish Religion out of contempt, and that in presence of Agrippa and his Sister, who were Jews, but used to bear all things, that they might not displease the Roman Governours] and of one Jesus who was dead, whom Paul said to be alive."}],"20":[{"catchword":null,"tekst":"And while I was in doubt about the examining of this business, [This he saith contrary to the truth, to make his matter faire: for he had so propounded this to Paul to shew favour the Jews, ver.9.] I said, if he would go to Jerusalem, and there be judged concerning these things."}],"21":[{"catchword":null,"tekst":"And when Paul appealed that he might be kept for the cognisance of Cesar, [Gr. Sebastou, for which the Latines use of word Augugstus, signifieth properly one to whom the chiefest honour belongs: and the word Sebas from whence this cometh, is often taken for divine honour, which teh Gentiles also gave to their Emperors, or else f // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
