eden met hem; en sommigen zeiden: Wat wil deze praatjesmaker toch zeggen? Maar anderen zeiden: Hij lijkt een verkondiger te zijn van vreemde goden; omdat hij hun Jezus en de opstanding verkondigde.", "Hand 27:25": "Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Deut 5:33": "In heel de weg die de HEERE, uw God, u gebiedt, zult u gaan; opdat u leeft, en opdat het u goed gaat, en u de dagen verlengt in het land dat u erven zult.", "Rom 10:1": "Broeders, de toegenegenheid van mijn hart en het gebed dat ik tot God doe voor Israël, is tot hun zaligheid.", "2 Kon 19:18": "En hebben hun goden in het vuur gegooid; want zij waren geen goden, maar het werk van mensenhanden, hout en steen; daarom hebben zij die vernietigd.", "Fil 1:18": "Wat dan? Toch wordt Christus op allerlei wijze, hetzij uit schijnmotief, hetzij in waarheid, verkondigd; en daarin verblijd ik mij, ja, ik zal mij ook verblijden.", "Hand 28:31": "Hij predikte het Koninkrijk van God, en onderwees over de Heere Jezus Christus, met alle vrijmoedigheid, zonder dat iemand hem daarin hinderde.", "Rom 16:26": "maar nu geopenbaard is, en door de profetische Schriften, naar het bevel van de eeuwige God, tot gehoorzaamheid aan het geloof, onder alle heidenen bekendgemaakt is;", "Gal 1:16": "om Zijn Zoon in mij te openbaren, opdat ik Hem door het Evangelie onder de heidenen zou verkondigen, ben ik meteen niet te rade gegaan met vlees en bloed;", "Jes 40:26": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.", "Jes 36:22": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, naar Hizkia met gescheurde kleren; en zij vertelden hem de woorden van Rabsake.", "Gen 15:16": "En het vierde geslacht zal hierheen terugkeren; want de ongerechtigheid van de Amorieten is tot nog toe niet volkomen.", "Hebr 11:3": "Door het geloof begrijpen wij dat de wereld door het woord van God gemaakt is, zodat de dingen die men ziet niet ontstaan zijn uit dingen die zichtbaar zijn.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Rom 8:17": "En als wij kinderen zijn, dan zijn wij ook erfgenamen: erfgenamen van God, en mede-erfgenamen van Christus; als wij tenminste met Hem lijden, opdat wij ook met Hem verheerlijkt worden.", "Luk 1:67-79": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei: Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Jes 50:7": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden.", "Job 38:26-28": "Om te regenen op het land, waar niemand is, op de woestijn, waarin geen mens is; Om het woeste en het verwoeste te verzadigen, en om het uitspruitsel van de grasscheutjes te doen meer worden. Heeft de regen een vader, of wie baart de druppels van de dauw?", "2 Kron 31:10": "En Azarja, de hoofdpriester, van het huis van Zadok, sprak tot hem en zei: Sinds men deze heffing is begonnen tot het huis van de HEERE te brengen, is er te eten geweest en genoeg om verzadigd te worden, ja, tot overvloed toe; want de HEERE heeft Zijn volk gezegend, zodat deze grote hoeveelheid overgebleven is.", "2 Kon 6:30": "En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.", "Jes 5:1-4": "Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel. En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht. Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.", "1 Kor 10:33": "Zoals ik ook in alles allen probeer te behagen, niet mijn eigen voordeel zoekend, maar dat van velen, opdat zij behouden worden.", "Jak 5:11": "Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht, dat de Heere zeer barmhartig is en vol ontferming.", "1 Kor 14:40": "Laat alle dingen eerlijk en met orde gebeuren.", "Matt 11:6": "En gelukkig is hij, die aan Mij niet geërgerd zal worden.", "Ef 4:17": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed.", "Deut 32:38": "Van wiens slachtoffers zij het vet aten, van wiens drankoffers zij de wijn dronken; laten zij opstaan en u helpen, zodat er bescherming voor u is.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "Job 29:20": "Mijn heerlijkheid was nieuw bij mij, en mijn boog vernieuwde zich in mijn hand.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Ps 24:2": "Want Hij heeft haar gegrond op de zeeën, en heeft haar gevestigd op de rivieren.", "Dan 2:28-30": "Maar er is een God in de hemel, Die geheimen openbaart, Die de koning Nebukadnezar bekendgemaakt heeft wat er gebeuren zal in het laatste der dagen; uw droom en de visioenen van uw hoofd op uw bed zijn deze: U, o koning, terwijl u op uw bed lag, kwamen er gedachten bij u op over wat hierna gebeuren zou; en Hij, Die geheimen openbaart, heeft u bekendgemaakt wat er gebeuren zal. Aan mij nu is dit geheim geopenbaard, niet door wijsheid die in mij meer zou zijn dan in alle levenden, maar opdat men de koning de uitleg bekend zou maken, en opdat u de gedachten van uw hart zou kennen.", "Hand 15:23": "En zij schreven door hen het volgende: De apostelen, en de oudsten, en de broeders wensen de broeders uit de heidenen, die in Antiochië, en Syrië, en Cilicië zijn, gegroet.", "Kol 1:21": "En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend,", "Joh 10:28": "En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken.", "Ruth 1:6": "Toen maakte zij zich klaar met haar schoondochters, en keerde terug uit de velden van Moab; want zij had in het land van Moab gehoord dat de HEERE naar Zijn volk had omgezien en hun brood gaf.", "Ps 146:7-9": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los. De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief. De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Hos 2:20": "En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Jer 10:15": "Ijdelheid zijn zij, een werk van verleidingen; ten tijde van hun bezoeking zullen zij vergaan.", "Jes 51:16": "En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "2 Kor 5:17": "Dus als iemand in Christus is, is hij een nieuw schepsel; het oude is voorbijgegaan, zie, het is alles nieuw geworden.", "Rom 1:9-15": "Want God is mijn Getuige, Die ik dien in mijn geest, in het Evangelie van Zijn Zoon, hoe ik zonder ophouden aan u denk; altijd in mijn gebeden biddend, of het mij misschien nog op een gegeven moment door de wil van God gegeven zou worden om naar u te komen. Want ik verlang ernaar u te zien, opdat ik u enige geestelijke gave zou mogen meedelen, opdat u versterkt zou worden;", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Rom 1:16": "Want ik schaam mij niet voor het Evangelie van Christus; want het is een kracht van God tot zaligheid voor ieder die gelooft, eerst de Jood, en ook de Griek.", "Gal 2:11": "En toen Petrus in Antiochië gekomen was, weerstond ik hem recht in het gezicht, omdat hij te bestraffen was.", "Ps 2:1-3": "Waarom woeden de heidenen, en bedenken de volken iets zinloos? De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen: Laat ons hun banden verscheuren, en hun touwen van ons afwerpen.", "Spr 22:2": "Rijken en armen ontmoeten elkaar; de HEERE heeft hen allen gemaakt.", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "Hand 15:1-35": "En sommigen, die uit Judea afgekomen waren, leerden de broeders en zeiden: Als u niet besneden wordt naar de wijze van Mozes, kunt u niet zalig worden. Toen er dan geen kleine weerstand en twist ontstond bij Paulus en Barnabas tegen hen, hebben zij afgesproken dat Paulus en Barnabas, en enigen van de anderen, naar de apostelen en oudsten in Jeruzalem zouden opgaan over deze vraag. Zij dan, door de gemeente uitgeleid, reisden door Fenicië en Samaria en vertelden over de bekering van de heidenen; en zij deden alle broeders grote blijdschap aan.", "Gal 1:21-24": "Daarna ben ik gekomen in de gewesten van Syrië en van Cilicië. En ik was van gezicht onbekend aan de Gemeenten in Judea, die in Christus zijn. Maar zij hadden alleen gehoord dat men zei: Hij die ons vroeger vervolgde, verkondigt nu het geloof, dat hij vroeger verwoestte.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Hand 27:10": "en zei tegen hen: Mannen, ik zie dat deze vaart met hinder en grote schade gepaard zal gaan, niet alleen van de lading en van het schip, maar ook van ons leven.", "Deut 26:18": "En de HEERE heeft u heden laten zeggen dat u Hem tot een volk van het eigendom zult zijn, zoals Hij u gesproken heeft, en dat u al Zijn geboden zult houden;", "Jes 46:7": "Zij nemen hem op de schouder, zij dragen hem, en zetten hem op zijn plaats; daar staat hij, hij wijkt niet van zijn plaats; ja, roept iemand tot hem, dan antwoordt hij niet, hij verlost hem niet uit zijn benauwdheid.", "Ps 19:5": "Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "Deut 4:4": "U daarentegen, die de HEERE, uw God, aanhing, u bent vandaag allemaal nog in leven.", "Openb 3:21": "Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.", "Hand 17:22-27": "En Paulus stond op in het midden van de plaats die Areopagus heet, en zei: Mannen van Athene, ik bemerk dat u in alles buitengewoon godsdienstig bent. Want toen ik door de stad liep en uw heiligdommen bekeek, vond ik ook een altaar waarop een opschrift stond: AAN DE ONBEKENDE GOD. Hem dan, Die u niet kent en toch dient, verkondig ik u. De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn;", "Ef 6:13": "Daarom, neem de hele wapenrusting van God aan, opdat u kunt weerstaan in de boze dag, en na alles verricht te hebben, staande blijven.", "Luk 4:8": "En Jezus antwoordde en zei tegen hem: Ga weg van Mij, satan, want er is geschreven: U zult de Heere, uw God, aanbidden, en Hem alleen dienen.", "1 Kor 8:4": "Wat betreft dan het eten van de dingen die aan de afgoden geofferd zijn: wij weten dat een afgod niets is in de wereld, en dat er geen andere God is dan Eén.", "Job 22:28": "Als u een zaak besluit, zal zij voor u bestendig zijn; en op uw wegen zal het licht schijnen.", "Ps 19:2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen.", "Job 38:25-27": "Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen? Om te regenen op het land, waar niemand is, op de woestijn, waarin geen mens is; Om het woeste en het verwoeste te verzadigen, en om het uitspruitsel van de grasscheutjes te doen meer worden.", "Hand 11:20": "En er waren enige mannen uit Cyprus en Cyrene onder hen, die naar Antiochië gekomen waren en tot de Grieken spraken, terwijl zij de Heere Jezus verkondigden.", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Jer 30:19": "En van hen zal dankzegging uitgaan, en een stem van spelende mensen; en Ik zal hen vermeerderen, en zij zullen niet minder worden, en Ik zal hen verheerlijken, en zij zullen niet gering worden.", "Jer 33:2": "Zo zegt de HEERE, Die het doet, de HEERE, Die dat vormt, opdat Hij het bevestigt, HEERE is Zijn Naam;", "Luk 13:34": "Jeruzalem, Jeruzalem! U die de profeten doodt en stenigt hen die naar u toe gezonden zijn, hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens onder haar vleugels verzamelt; en u hebt niet gewild?", "Rom 11:14": "Of ik enigszins mijn vlees tot jaloersheid mag verwekken, en enigen uit hen behouden mocht.", "Joh 5:8": "Jezus zei tegen hem: Sta op, neem uw draagbed op, en loop.", "Rom 1:21-25": "Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden; terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden; en hebben de heerlijkheid van de onvergankelijke God veranderd in de gelijkenis van het beeld van een vergankelijk mens, en van vogels, en van viervoetige en kruipende dieren.", "Rom 1:18-20": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden. Omdat wat van God gekend kan worden, in hen openbaar is; want God heeft het hun geopenbaard. Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Jes 45:12": "Ik heb de aarde gemaakt, en Ik heb de mens daarop geschapen; Ik ben het! Mijn handen hebben de hemelen uitgebreid, en Ik heb heel hun leger bevel gegeven.", "Rom 8:37-39": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad. Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal, Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Hand 18:23": "En toen hij daar enige tijd geweest was, ging hij weg en reisde achtereenvolgens door het land Galatië en Frygië, en versterkte al de discipelen.", "Deut 29:9": "Houdt dan de woorden van dit verbond, en doet ze; opdat u verstandig handelt in alles, wat u doen zult.", "Rom 10:19": "Maar ik zeg: Heeft Israël het niet begrepen? Mozes zegt eerst: Ik zal u tot jaloersheid verwekken door hen die geen volk zijn; door een onverstandig volk zal Ik u tot toorn verwekken.", "Hebr 3:4": "Want ieder huis wordt door iemand gebouwd; maar Die dit alles gebouwd heeft, is God.", "Hand 28:6": "En zij verwachtten dat hij zou opzwellen, of meteen dood neervallen. Maar toen zij lang gewacht hadden en zagen dat hem geen ongemak overkwam, veranderden zij van gedachten en zeiden dat hij een god was.", "Hand 14:8-10": "En een zeker man te Lystre zat zonder kracht in zijn voeten, kreupel van de moederschoot af, die nooit had gelopen. Deze hoorde Paulus spreken; die zijn ogen op hem hield, en zag dat hij geloof had om gezond te worden, en zei met luide stem: Sta recht op uw voeten! En hij sprong op en liep.", "2 Kor 10:4": "Want de wapens van onze strijd zijn niet vleselijk, maar krachtig door God, tot het neerwerpen van bolwerken;", "Luk 2:34": "En Simeon zegende hen, en zei tegen Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding van velen in Israël, en tot een teken dat weersproken zal worden.", "Rom 16:25": "Hem nu, Die machtig is u te bevestigen, naar mijn Evangelie en de prediking van Jezus Christus, naar de openbaring van het geheimenis dat sinds mensenheugenis verzwegen is geweest;", "Ps 107:1-43": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft. En hen die Hij uit de landen verzameld heeft, van het oosten en van het westen, van het noorden en van de zee.", "Job 26:7-13": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets. Hij bindt het water in Zijn wolken; toch scheurt de wolk daaronder niet. Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Gen 49:20": "Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.", "Ps 145:15": "Ain. Aller ogen wachten op U; en U geeft hun hun voedsel op de juiste tijd.", "1 Tim 5:1": "Bestraf een oudere man niet hard, maar vermaan hem als een vader; de jongeren als broeders;", "Openb 3:8": "Ik ken uw werken; zie, Ik heb een geopende deur voor u gegeven, en niemand kan die sluiten; want u hebt weinig kracht, en u hebt Mijn woord bewaard, en u hebt Mijn Naam niet verloochend.", "Hand 4:29": "En nu dan, Heere, zie op hun dreigingen, en geef Uw dienstknechten met alle vrijmoedigheid Uw woord te spreken;", "Judas 1:21": "Bewaar uzelf in de liefde van God, terwijl u de barmhartigheid van onze Heere Jezus Christus verwacht, tot het eeuwige leven.", "Hos 2:7": "Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, dat zij voor de Baäl gebruikt hebben.", "Spr 3:19": "De HEERE heeft de aarde door wijsheid gegrond, de hemelen door verstandigheid bereid.", "Matt 24:13": "Maar wie zal volharden tot het einde, die zal behouden worden.", "2 Sam 1:2": "dat het op de derde dag gebeurde dat er, kijk, uit het leger van Saul een man kwam, wiens kleren gescheurd waren, en aarde was op zijn hoofd; en het gebeurde, toen hij bij David kwam, dat hij ter aarde viel en zich neerboog.", "Fil 3:16": "Maar, tot waar wij gekomen zijn, laten wij daarin naar dezelfde regel wandelen, laten wij hetzelfde gevoelen.", "Lev 25:20-22": "En als u zou zeggen: Wat zullen wij eten in het zevende jaar! Zie, wij zullen niet zaaien, en onze opbrengst niet inzamelen; Dan zal Ik Mijn zegen gebieden over u in het zesde jaar, dat het de opbrengst voor drie jaar zal voortbrengen. Het achtste jaar nu zult u zaaien, en zult van de oude opbrengst eten, tot het negende jaar toe; totdat zijn opbrengst binnengekomen is, zult u het oude eten.", "Gen 28:21": "en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn!", "Luk 17:21": "En men zal niet zeggen: Zie hier, of zie daar, want zie, het Koninkrijk van God is binnen in u.", "Jes 35:6": "Dan zal de kreupele springen als een hert, en de tong van de stomme zal juichen; want in de woestijn zullen wateren uitbarsten, en beken in de wildernis.", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "1 Kron 16:11": "Vraagt naar de HEERE en Zijn sterkte, zoekt Zijn aangezicht voortdurend.", "Dan 2:46": "Toen viel de koning Nebukadnezar op zijn aangezicht, en aanbad Daniël; en hij zei dat men hem een spijsoffer en welriekend reukwerk moest brengen als drankoffer.", "Jes 45:20": "Verzamel u, en kom, treed hier samen toe, u die van de heidenvolken ontkomen bent! Zij weten niets, zij die hun houten gesneden beelden dragen, en een god aanbidden die niet verlossen kan.", "1 Petr 1:23": "u die opnieuw geboren bent, niet uit vergankelijk, maar uit onvergankelijk zaad, door het levende en eeuwig blijvende Woord van God.", "Ps 33:7": "Hij verzamelt de wateren van de zee als op een hoop; Hij legt de diepten in schatkamers.", "Kol 4:17": "En zeg tegen Archippus: Let op de bediening die u hebt aangenomen in de Heere, dat u die vervult.", "Openb 2:25-28": "Maar wat u hebt, houd dat vast, totdat Ik zal komen. En wie overwint, en Mijn werken tot het einde toe bewaart, hem zal Ik macht geven over de heidenen; En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Ps 135:7": "Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort.", "Hand 5:32": "En wij zijn Zijn getuigen van deze dingen; en ook de Heilige Geest, Die God gegeven heeft hun die Hem gehoorzaam zijn.", "Jak 1:4": "Doch de volharding moet een volmaakt werk hebben, opdat u volmaakt bent en geheel oprecht, in geen ding gebrekkig.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Ps 89:16": "Gelukkig is het volk dat het geschal kent; o HEERE! zij zullen in het licht van Uw aangezicht wandelen.", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "Hand 16:13": "En op de dag van de sabbat gingen wij de stad uit, naar de rivier, waar men gewoonlijk bad; en wij gingen zitten en spraken tot de vrouwen die daar samengekomen waren.", "Jes 44:20": "Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?", "2 Petr 2:7-9": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft; (want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden); dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Ps 37:19": "Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Jer 32:17": "Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.", "Gal 5:10": "Ik vertrouw van u in de Heere, dat u niet anders zult denken; maar wie u in verwarring brengt, zal het oordeel dragen, wie hij ook is.", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "Jer 10:2": "Zo zegt de HEERE: Leert de weg van de heidenen niet, en schrikt niet van de tekenen van de hemel, omdat de heidenen daarvan schrikken.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Hos 11:3": "Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.", "Matt 25:23": "Zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht, over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer.", "2 Tim 2:11": "Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven;", "Rom 11:13": "Want ik spreek tot u, heidenen, voor zoveel ik apostel van de heidenen ben; ik maak mijn bediening heerlijk;", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Hand 19:26": "en u ziet en hoort, dat deze Paulus veel volk, niet alleen van Efeze, maar ook bijna van heel Azië, overreed en afgekeerd heeft, en zegt dat het geen goden zijn die met handen gemaakt worden.", "2 Sam 15:32": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd.", "Kol 3:11": "waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "Gal 3:1": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd.", "Hand 20:18-27": "En toen zij bij hem gekomen waren, zei hij tegen hen: U weet, van de eerste dag af dat ik in Azië ben aangekomen, hoe ik de hele tijd bij u geweest ben; Terwijl ik de Heere diende met alle nederigheid, en veel tranen, en beproevingen, die mij overkwamen door de aanslagen van de Joden; Hoe ik niets heb achtergehouden van wat nuttig was, zodat ik het u niet zou verkondigd en u geleerd hebben, in het openbaar en in de huizen;", "2 Tim 1:16": "De Heere geve het huis van Onesiforus barmhartigheid; want hij heeft mij dikwijls verkwikt, en heeft zich niet geschaamd voor mijn keten.", "Kol 1:23": "als u maar blijft in het geloof, gefundeerd en vast, en niet wordt weggebracht van de hoop van het Evangelie dat u gehoord hebt, dat gepredikt is onder alle schepselen die onder de hemel zijn; waarvan ik, Paulus, een dienaar geworden ben;", "Hand 13:46": "Maar Paulus en Barnabas zeiden vrijmoedig: Het was nodig dat eerst tot u het Woord van God gesproken zou worden; doch aangezien u het verstoot, en uzelf het eeuwige leven niet waard oordeelt, zie, wij keren ons tot de heidenen.", "Ex 8:19": "Toen zeiden de tovenaars tegen Farao: Dit is Gods vinger! Doch Farao's hart verstijfde, zodat hij niet naar hen luisterde, zoals de HEERE gesproken had.", "Hand 21:18": "En de volgende dag ging Paulus met ons naar Jakobus; en alle oudsten waren daar gekomen.", "Gen 5:1": "Dit is het boek van Adams geslacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God.", "2 Kor 2:2-11": "Want als ik u bedroef, wie is het dan die mij vrolijk maakt, dan degene die door mij bedroefd is geworden? En dat heb ik u geschreven, opdat ik, als ik daar kom, niet de droefheid zou hebben van hen door wie ik juist verblijd zou moeten worden; en ik vertrouw van u allen dat mijn blijdschap ook de blijdschap van u allen is. Want ik heb u vanuit veel verdrukking en benauwdheid van hart, met veel tranen geschreven, niet opdat u bedroefd zou worden, maar opdat u de liefde zou leren kennen die ik overvloedig voor u heb.", "2 Kor 1:24": "Niet dat wij heerschappij voeren over uw geloof, maar wij zijn medewerkers van uw blijdschap; want u staat door het geloof.", "Judas 1:3": "Geliefden, omdat ik alle inzet gebruik om u te schrijven over de gemeenschappelijke zaligheid, moest ik u schrijven en u vermanen dat u strijdt voor het geloof, dat eenmaal aan de heiligen overgeleverd is.", "2 Kor 1:21": "Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God;", "Jona 2:8": "Wie de valse ijdelheden onderhouden, verlaten hun weldadigheid.", "Hand 21:28": "En riepen: Israëlitische mannen, kom te hulp! Dit is de man die overal iedereen leert tegen het volk, en de wet, en deze plaats; en bovendien heeft hij ook Grieken de tempel binnengebracht, en heeft deze heilige plaats ontheiligd.", "1 Kron 16:26": "Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemelen gemaakt.", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "2 Kor 6:9": "als onbekenden, en toch bekend; als stervenden, en zie, wij leven; als getuchtigd, en niet gedood;", "Rom 10:15-18": "En hoe zullen zij prediken, als zij niet gezonden worden? Zoals geschreven is: Hoe lieflijk zijn de voeten van hen die vrede verkondigen, van hen die het goede verkondigen! Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd? Zo is dan het geloof uit het gehoor, en het gehoor door het Woord van God,", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Job 5:10": "Die de regen geeft op de aarde, en water zendt op de straten;", "Deut 1:10": "De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel.", "Hand 13:3": "Toen vastten en baden zij, en nadat zij hun de handen opgelegd hadden, lieten zij hen gaan.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Matt 9:22": "En Jezus keerde Zich om, en toen Hij haar zag, zei Hij: Houd moed, dochter! Uw geloof heeft u behouden. En de vrouw werd op dat moment gezond.)", "Ps 145:16": "Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.", "Job 22:25": "Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "2 Tim 4:17": "Maar de Heere heeft mij bijgestaan en heeft mij kracht gegeven; opdat door mij de prediking ten volle bekend zou worden, en alle heidenen die zouden horen. En ik ben uit de muil van de leeuw verlost.", "Fil 4:1": "Dus, mijn geliefde en zeer gewenste broeders, mijn blijdschap en kroon, sta zo vast in de Heere, geliefden!", "Hand 23:12-22": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben. En het waren er meer dan veertig die deze eed samen hadden afgelegd. Zij gingen naar de overpriesters en de oudsten en zeiden: Wij hebben onszelf met een vervloeking vervloekt om niets te nuttigen totdat wij Paulus gedood zullen hebben.", "Hebr 12:2": "Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God.", "Dan 6:27": "Van mij is een bevel uitgegaan, dat men in de hele heerschappij van mijn koninkrijk moet beven en sidderen voor het aangezicht van de God van Daniël; want Hij is de levende God, en blijvend in eeuwigheid, en Zijn koninkrijk gaat niet te gronde, en Zijn heerschappij duurt tot het einde toe.", "Hand 9:20": "En hij predikte meteen Christus in de synagogen, dat Hij de Zoon van God is.", "Matt 15:28": "Toen antwoordde Jezus en zei tegen haar: O vrouw! groot is uw geloof; u geschiede zoals u wilt. En haar dochter werd gezond vanaf dat moment.", "Job 36:11": "Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Hand 1:22": "beginnend vanaf de doop van Johannes, tot de dag toe waarop Hij van ons opgenomen is, één van hen met ons getuige wordt van Zijn opstanding.", "Hand 12:24": "En het Woord van God groeide en breidde zich uit.", "1 Kor 9:15-23": "Maar ik heb geen van deze dingen gebruikt. En ik heb dit niet geschreven, opdat het zo bij mij zou gebeuren; want het zou beter voor mij zijn te sterven, dan dat iemand deze mijn roem zou ijdel maken. Want als ik het Evangelie verkondig, is het voor mij geen roem; want de noodzaak is mij opgelegd. En wee mij, als ik het Evangelie niet verkondig! Want als ik dat gewillig doe, heb ik loon, maar als onwillig, is de uitdeling mij toch toevertrouwd.", "Openb 15:2": "En ik zag als een glazen zee, met vuur gemengd; en zij die de overwinning hadden behaald op het beest, en op zijn beeld, en op zijn merkteken, en op het getal van zijn naam, stonden aan de glazen zee, met de citers van God.", "Spr 8:23-31": "Ik ben van eeuwigheid af gezalfd geweest; van het begin, van de oudheden van de aarde aan. Ik was geboren, toen de afgronden nog niet waren, toen nog geen fonteinen waren, zwaar van water; Voordat de bergen ingevest waren, voor de heuvels was Ik geboren.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "Hand 26:17-20": "En zal u verlossen van dit volk en van de heidenen, tot wie Ik u nu zend; Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij. Daarom, o koning Agrippa, ben ik dat hemelse gezicht niet ongehoorzaam geweest;", "Joh 15:5": "Ik ben de Wijnstok, en u de ranken; die in Mij blijft, en Ik in hem, die draagt veel vrucht; want zonder Mij kunt u niets doen.", "Hebr 5:13": "Want ieder die nog melk krijgt, is onervaren in het woord van de gerechtigheid; want hij is een kind.", "1 Sam 5:4": "Toen zij nu de volgende dag 's morgens vroeg opstonden, zie, Dagon lag voorover op de aarde gevallen voor de ark van de HEERE; maar het hoofd van Dagon, en de beide palmen van zijn handen, afgehouwen, lagen bij de drempel; alleen de romp van Dagon was ervan overgebleven.", "Hand 17:23-28": "Want toen ik door de stad liep en uw heiligdommen bekeek, vond ik ook een altaar waarop een opschrift stond: AAN DE ONBEKENDE GOD. Hem dan, Die u niet kent en toch dient, verkondig ik u. De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft;", "Hand 18:8": "En Crispus, de leider van de synagoge, geloofde in de Heere met heel zijn huis; en velen van de Korinthiërs die hem hoorden, geloofden en werden gedoopt.", "Jer 10:8": "In één ding zijn zij toch redeloos en dwaas: een stuk hout is een onderwijs van de ijdelheden.", "1 Sam 12:21": "En wijk niet af; want dan zou u de nietige afgoden achterna gaan, die niet baten, noch verlossen, want zij zijn nietig.", "Tit 1:9": "die vasthoudt aan het betrouwbare woord, zoals hem geleerd is, opdat hij in staat is om zowel te vermanen door de gezonde leer, als om de tegensprekers te weerleggen.", "1 Kor 16:9": "Want mij is een grote en krachtige deur geopend, en er zijn veel tegenstanders.", "Rom 15:5": "Doch de God van de lijdzaamheid en van de vertroosting geeft u dat u eensgezind bent onder elkaar naar Christus Jezus,", "Jer 10:3-5": "Want de inzettingen van de volken zijn ijdelheid; want het is hout, dat men uit het woud gehouwen heeft, een werk van de handen van de werkmeester met de bijl. Men pronkt het op met zilver en met goud; zij hechten het met spijkers en met hamers, opdat het niet waggelt. Zij zijn gelijk een palmboom van dicht werk, maar kunnen niet spreken; zij moeten gedragen worden, want zij kunnen niet gaan; vreest niet voor hen, want zij kunnen geen kwaad doen, ook is er geen goeddoen bij hen.", "Hand 20:3": "En toen hij daar drie maanden was gebleven, en de Joden hem wilden aanvallen toen hij naar Syrië zou varen, besloot hij door Macedonië terug te keren.", "Joh 15:9": "Zoals de Vader Mij liefgehad heeft, heb Ik ook u liefgehad; blijft in deze Mijn liefde.", "Deut 15:4": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten;", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "1 Kon 18:1": "En het gebeurde na veel dagen, dat het woord van de HEERE tot Elia gebeurde, in het derde jaar: Ga heen, vertoon u aan Achab; want Ik zal regen geven op de aardbodem.", "Ps 33:15": "Hij vormt hun aller hart; Hij let op al hun werken.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "1 Petr 5:1-5": "De oudsten die onder u zijn, vermaan ik, die een medeoudste en getuige van het lijden van Christus ben, en deelachtig aan de heerlijkheid die geopenbaard zal worden: Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed; ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.", "Hand 19:17": "En dit werd aan allen bekend, zowel Joden als Grieken, die te Efeze woonden; en er viel een vrees over hen allen, en de Naam van de Heere Jezus werd groot gemaakt.", "Jer 27:6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Richt 6:31": "Maar Joas zei tegen allen die bij hem stonden: Wilt u voor Baäl strijden? Wilt u hem redden? Wie voor hem strijdt, zal nog deze morgen gedood worden! Als hij een god is, laat hij dan voor zichzelf strijden, omdat men zijn altaar heeft omgeworpen.", "2 Kon 22:19": "Omdat uw hart week geworden is, en u zich voor het aangezicht van de HEERE vernederd hebt, toen u hoorde wat Ik gesproken heb tegen deze plaats en haar inwoners, dat zij tot een verwoesting en vloek zullen worden, en dat u uw kleren gescheurd en voor Mijn aangezicht geweend hebt; zo heb Ik u ook verhoord, spreekt de HEERE.", "Hand 12:22": "En het volk riep hem toe: Dit is de stem van een god, en niet van een mens!", "2 Tim 4:7": "Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden;", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Hebr 6:17": "waarbij God, omdat Hij aan de erfgenamen van de belofte overvloediger de onveranderlijkheid van Zijn raad wilde tonen, er een eed tussen heeft gebracht;", "2 Kor 12:15": "En ik zal zeer graag de kosten dragen, en voor uw zielen ten koste gegeven worden; hoewel ik, terwijl ik u overvloediger liefheb, minder bemind word.", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Ps 89:13": "Het noorden en het zuiden, die hebt Gij geschapen; Thabor en Hermon juichen in Uw Naam.", "Ps 34:10": "Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.", "Hand 10:36": "Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen.", "Matt 6:26": "Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven?", "Jes 46:1": "Bel is gekromd, Nebo wordt neergebogen, hun afgoden zijn geworden voor de dieren en voor de beesten; uw opgeladen pakken zijn een last voor de vermoeide beesten.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Matt 27:20-25": "Maar de overpriesters en de oudsten haalden de menigte over dat zij Barabbas zouden vragen, en Jezus zouden laten doden. En de stadhouder antwoordde en zei tegen hen: Wie van deze twee wilt u dat ik u zal loslaten? En zij zeiden: Barabbas. Pilatus zei tegen hen: Wat zal ik dan doen met Jezus, Die Christus genoemd wordt? Zij zeiden allen tegen hem: Laat Hem gekruisigd worden.", "Hand 15:38": "Maar Paulus vond het niet passend hem mee te nemen, omdat hij van Pamfylië af van hen was weggegaan, en niet met hen was meegegaan tot het werk.", "Hand 18:4-6": "En hij sprak op elke sabbat in de synagoge, en bracht Joden en Grieken tot geloof. En toen Silas en Timotheüs uit Macedonië gekomen waren, werd Paulus door de Geest gedrongen en betuigde hij de Joden dat Jezus de Christus is. Maar toen zij hem weerstonden en lasterden, schudde hij zijn kleren af en zei tegen hen: Uw bloed zij op uw hoofd; ik ben rein; en van nu af aan zal ik naar de heidenen gaan.", "2 Kor 4:2": "Maar wij hebben de bedekselen der schande verworpen, en wandelen niet in arglistigheid, en vervalsen ook het Woord van God niet, maar door openbaring van de waarheid maken wij onszelf aangenaam bij ieder geweten van de mensen, in de tegenwoordigheid van God.", "Luk 12:22-31": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "Deut 15:4-6": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten; Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied. Want de HEERE, uw God, zal u zegenen, zoals Hij tot u heeft gesproken; zo zult u aan veel volken lenen, maar u zult niet lenen; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Lev 26:4-10": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Job 37:18": "Hebt u met Hem de hemelen uitgespannen, die vast zijn, als een gegoten spiegel?", "Fil 1:17": "Maar genen uit liefde, omdat zij weten dat ik gesteld ben tot verantwoording van het Evangelie.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Matt 10:38": "En wie zijn kruis niet op zich neemt, en Mij navolgt, is Mij niet waard.", "Jes 44:19": "En niemand van hen brengt het in zijn hart, en er is geen kennis en geen verstand, zodat hij zou zeggen: De helft daarvan heb ik verbrand in het vuur, ja, ook op de kolen daarvan heb ik brood gebakken, ik heb vlees daarbij gebraden, en heb het gegeten; en zou ik het overblijfsel daarvan tot een gruwel maken, zou ik neerknielen voor iets dat van een boom gekomen is?", "2 Tim 1:11-13": "Waartoe ik gesteld ben als prediker, en apostel, en leraar van de heidenen; Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag. Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "Jes 46:2": "Samen zijn zij neergebogen, zij zijn gekromd, zij hebben de last niet kunnen redden, maar zijzelf zijn in de gevangenis gegaan.", "1 Joh 2:19": "Zij zijn uit ons weggegaan, maar zij waren niet uit ons; want als zij uit ons geweest waren, dan zouden zij bij ons gebleven zijn; maar dit is gebeurd, opdat zij openbaar zouden worden, dat zij niet allen uit ons zijn.", "Rom 15:15-32": "Maar ik heb u ten dele des te vrijmoediger geschreven, broeders, u als het ware opnieuw dit in herinnering brengend, om de genade die mij van God gegeven is; opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest. Zo heb ik dan roem in Christus Jezus in die dingen die God aangaan.", "Joz 23:8": "Maar de HEERE, uw God, zult u aanhangen, zoals u tot op deze dag gedaan hebt.", "2 Tim 1:14": "Bewaar het goede pand, dat u toevertrouwd is, door de Heilige Geest, Die in ons woont.", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "2 Tim 2:10": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid.", "Ps 135:6-12": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden. Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort. Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe.", "Ef 2:13": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus.", "2 Tess 3:13": "En u, broeders, wordt niet moe in het goede te doen.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "Hab 2:18": "Wat zal het gesneden beeld baten, dat zijn maker het gesneden heeft? Of het gegoten beeld, dat een leraar van leugens is, dat de maker op zijn maaksel vertrouwt, wanneer hij stomme afgoden gemaakt heeft?", "2 Kor 11:12": "Maar wat ik doe, dat zal ik nog doen, om de aanleiding af te snijden voor hun die aanleiding willen hebben, opdat zij in wat zij roemen bevonden mogen worden gelijk als wij.", "Hebr 10:36": "Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Hebr 3:12": "Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "1 Kor 12:5": "en er is verscheidenheid van bedieningen, en het is dezelfde Heere;", "Hand 17:14": "Doch de broeders stuurden Paulus toen meteen weg, om als het ware naar de zee te gaan; maar Silas en Timotheüs bleven daar.", "2 Kor 6:3-10": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt. Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Ex 32:21-23": "En Mozes zei tegen Aäron: Wat heeft dit volk u gedaan, dat u zo'n grote zonde over hen gebracht hebt? Toen zei Aäron: De toorn van mijn heer ontsteekt niet! U kent dit volk, dat het geneigd is tot het kwade. Zij zeiden namelijk tegen mij: Maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft opgevoerd, weten wij niet wat er van hem geworden is.", "Ps 33:12": "Gelukkig is het volk wiens God de HEERE is; het volk, dat Hij Zich als erfdeel heeft uitgekozen.", "Hand 15:32": "Judas nu en Silas, die zelf ook profeten waren, bemoedigden de broeders met veel woorden, en versterkten hen.", "1 Tim 6:13": "Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd,", "2 Kor 9:8-10": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk. Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid. Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "Job 8:7": "Uw begin zal wel gering zijn geweest, maar uw einde zal zeer toenemen.", "1 Kor 16:16": "dat u zich ook aan zulke mensen onderwerpt, en aan ieder die meewerkt en arbeidt.", "Pred 5:18": "Ook: ieder mens aan wie God rijkdom en bezittingen gegeven heeft, en aan wie Hij de macht geeft om daarvan te eten, en om zijn deel te nemen, en om zich te verheugen in zijn arbeid, dat is een gave van God.", "Luk 12:24-28": "Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard? Wie van u kan door bezorgd te zijn één el aan zijn lengte toevoegen? Als u dan zelfs het kleinste niet kunt, waarom bent u dan bezorgd over de andere dingen?", "Openb 9:20": "En de overige mensen, die niet gedood zijn door deze plagen, hebben zich niet bekeerd van de werken van hun handen, om de duivelen niet meer te aanbidden; en de gouden, en zilveren, en koperen, en stenen, en houten afgoden, die noch kunnen zien, noch horen, noch lopen;", "2 Tim 4:5-8": "Maar u, wees waakzaam in alles, verdraag verdrukkingen, doe het werk van een evangelist, vervul uw dienst ten volle. Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij. Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden;", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "Jak 5:17": "Elia was een mens net zo onderhevig aan gevoelens als wij; en hij bad een gebed, dat het niet zou regenen; en het regende niet op de aarde, drie jaar en zes maanden lang.", "Hand 7:58": "en wierpen hem de stad uit, en stenigden hem; en de getuigen legden hun kleren af aan de voeten van een jongeman, die Saulus heette.", "Jer 44:17": "Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.", "2 Kon 19:2": "Daarna stuurde hij Eljakim, de hofmeester, en Sebna, de schrijver, en de oudsten van de priesters, met zakken bedekt, naar Jesaja, de profeet, de zoon van Amoz;", "Deut 8:18": "Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "Hebr 13:18": "Bid voor ons; want wij vertrouwen dat wij een goed geweten hebben, omdat wij in alles eerlijk willen wandelen.", "Hand 17:27": "Opdat zij de Heere zouden zoeken, of zij Hem misschien konden tasten en vinden; hoewel Hij niet ver is van ieder van ons.", "1 Kron 17:8": "En Ik ben met u geweest overal waar u heen bent gegaan, en Ik heb al uw vijanden voor u uitgeroeid; en Ik heb u een naam gemaakt, gelijk de naam van de groten die op de aarde zijn.", "Hebr 13:12": "Daarom heeft ook Jezus, opdat Hij door Zijn eigen bloed het volk zou heiligen, buiten de poort geleden.", "Hand 2:22": "Israëlitische mannen, hoor deze woorden: Jezus de Nazarener, een Man die door God aan u bewezen is door krachten, wonderen en tekenen, die God door Hem gedaan heeft in uw midden, zoals u ook zelf weet;", "2 Kor 9:15": "Doch God zij dank voor Zijn onuitsprekelijke gave.", "Ef 3:9": "en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus;", "Dan 5:23": "Maar u hebt uzelf verheven tegen de Heere van de hemel, en men heeft de vaten van Zijn huis voor u gebracht, en u, en uw leiders, uw vrouwen, en uw bijvrouwen hebben daaruit wijn gedronken, en de goden van zilver en goud, koper, ijzer, hout en steen, die niet zien, niet horen, en niet weten, hebt u geprezen; maar die God, in Wiens hand uw adem is, en aan Wie al uw wegen toebehoren, hebt u niet verheerlijkt.", "Ezech 20:7": "En Ik zei tegen hen: Ieder werpt de verfoeisels van zijn ogen weg; en verontreinigt u niet met de drekgoden van Egypte; Ik, de HEERE, ben uw God.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "Matt 6:31": "Wees daarom niet bezorgd en zeg niet: Wat zullen wij eten, of wat zullen wij drinken, of waarmee zullen wij ons kleden?", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "Hand 14:6-20": "zijn zij, toen zij dit door hadden, gevlucht naar de steden van Lykaonië, namelijk Lystre en Derbe, en het omliggende land; en zij verkondigden daar het Evangelie. En een zeker man te Lystre zat zonder kracht in zijn voeten, kreupel van de moederschoot af, die nooit had gelopen.", "Rom 11:29": "Want de genadegiften en de roeping van God zijn onberouwelijk.", "Ps 44:2-4": "O God! Wij hebben het met onze oren gehoord, onze vaders hebben het ons verteld: Wat een werk hebt U gedaan in hun dagen, in de dagen van vroeger. U hebt de heidenvolken met Uw hand uit de bezitting verdreven, maar hen geplant; U hebt de volken geplaagd, hen daarentegen doen voortschieten. Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Hand 1:24": "En zij baden en zeiden: U, Heere! U, Kenner van de harten van allen, wijs van deze twee er één aan, die U uitverkoren hebt,", "Luk 11:21-23": "Wanneer een sterke, gewapende man zijn eigen woning bewaakt, dan is alles wat hij heeft in vrede. Maar als iemand die sterker is dan hij, hem overvalt en hem overwint, dan neemt die zijn hele wapenrusting weg, waarop hij vertrouwde, en deelt zijn buit uit. Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit.", "1 Kor 2:1-4": "En ik, broeders, toen ik bij u kwam, kwam niet met voortreffelijkheid van woorden of van wijsheid, terwijl ik u de getuigenis van God verkondigde. Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd. En ik was bij u in zwakheid, en in vrees, en in veel beven.", "1 Kor 2:6": "En wij spreken wijsheid onder de volwassenen in het geloof; maar een wijsheid die niet van deze wereld is, en ook niet van de leiders van deze wereld, die tot niets worden;", "Luk 20:9-16": "En Hij begon tegen het volk deze gelijkenis te vertellen: Een zeker mens plantte een wijngaard, en verhuurde die aan landbouwers, en ging voor lange tijd naar het buitenland. En toen het de tijd was, stuurde hij een dienstknecht naar de landbouwers, opdat zij hem van de vrucht van de wijngaard zouden geven; maar de landbouwers sloegen hem, en stuurden hem met lege handen weg. En opnieuw stuurde hij nog een andere dienstknecht; maar ook die sloegen zij en behandelden hem schandelijk, en stuurden hem met lege handen weg.", "Amos 4:7": "Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde.", "Hand 9:24": "Maar hun plan werd Saulus bekend; en zij bewaakten de poorten, zowel overdag als 's nachts, om hem te kunnen doden.", "Hebr 13:13": "Laten wij dan naar Hem uitgaan, buiten de legerplaats, terwijl wij Zijn smaad dragen.", "Fil 3:4-17": "Hoewel ik ook redenen had om op het vlees te vertrouwen; als iemand anders meent te kunnen vertrouwen op het vlees, ik nog meer. Besneden op de achtste dag, uit het geslacht van Israël, van de stam van Benjamin, een Hebreeër uit de Hebreeën, wat de wet betreft een Farizeeër; Wat de ijver betreft een vervolger van de Gemeente; wat de rechtvaardigheid betreft die in de wet is, onberispelijk.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "Job 2:12": "En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel.", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "1 Kor 16:3": "En wanneer ik daar gekomen zal zijn, zal ik hen die u bekwaam zult achten door brieven zenden, om uw gave naar Jeruzalem over te dragen.", "2 Tim 1:6": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Fil 4:17": "Niet dat ik de gave zoek, maar ik zoek de vrucht, die overvloedig wordt tot uw rekening.", "Ps 105:24": "En Hij deed Zijn volk zeer meer worden, en maakte het machtiger dan zijn tegenstanders.", "1 Sam 17:26": "Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?", "Ps 146:5": "Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is;", "Deut 28:12": "De HEERE zal voor u Zijn goede schat openen, de hemel, om aan uw land regen te geven op zijn tijd, en om al het werk van uw hand te zegenen; en u zult aan veel volken lenen, maar u zult niet lenen van anderen.", "Ex 34:24": "Wanneer Ik de volken voor uw aangezicht uit hun bezit zal verdrijven, en uw grenzen verruimen, dan zal niemand uw land begeren, terwijl u erheen optrekt, om te verschijnen voor het aangezicht van de HEERE, uw God, driemaal in het jaar.", "Richt 10:14": "Ga heen, roep tot de goden die u hebt uitgekozen; laten die u verlossen in de tijd van uw benauwdheid.", "1 Tess 2:2-6": "maar hoewel wij eerst geleden hadden, en ons ook smaad was aangedaan, zoals u weet, in Filippi, hebben wij toch vrijmoedigheid gebruikt in onze God, om het Evangelie van God tot u te spreken onder veel strijd. Want onze vermaning is niet voortgekomen uit dwaling, niet uit onreinheid, en niet met bedrog; maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft.", "1 Kor 12:2": "U weet dat u heidenen was, meegetrokken naar de stomme afgoden, naardat u geleid werd.", "Lev 25:18-22": "En doe Mijn inzettingen, en houd Mijn rechten, en doe die; dan zult u zeker wonen in het land. En het land zal zijn vrucht geven, en u zult eten tot verzadiging toe; en u zult zeker daarin wonen. En als u zou zeggen: Wat zullen wij eten in het zevende jaar! Zie, wij zullen niet zaaien, en onze opbrengst niet inzamelen;", "Joh 15:4-6": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft. Ik ben de Wijnstok, en u de ranken; die in Mij blijft, en Ik in hem, die draagt veel vrucht; want zonder Mij kunt u niets doen. Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "2 Kor 5:13": "Want hetzij dat wij uitzinnig zijn, wij zijn het voor God; hetzij dat wij bezonnen zijn, wij zijn het voor u.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "Hand 1:23-26": "En zij stelden er twee voor: Jozef, genaamd Barsabas, die bijgenaamd was Justus, en Matthias. En zij baden en zeiden: U, Heere! U, Kenner van de harten van allen, wijs van deze twee er één aan, die U uitverkoren hebt, om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "Hand 18:19": "En hij kwam aan in Efeze, en liet hen daar achter; maar hijzelf ging de synagoge in en sprak met de Joden.", "Mark 2:11": "Ik zeg u: Sta op, neem uw draagbed op, en ga naar uw huis.", "2 Kor 4:1": "Omdat wij deze bediening hebben, naar de barmhartigheid die ons is bewezen, zo worden wij niet moedeloos;", "Joh 10:9": "Ik ben de Deur; als iemand door Mij ingaat, zal hij behouden worden; en hij zal ingaan en uitgaan, en weide vinden.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Hand 27:21": "En toen men lange tijd zonder eten geweest was, stond Paulus op in hun midden en zei: Mannen, u had wel naar mij moeten luisteren en niet van Kreta moeten afvaren, dan had u deze hinder en deze schade voorkomen.", "Joh 14:12": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, de werken die Ik doe, zal hij ook doen, en zal grotere doen dan deze, want Ik ga heen tot Mijn Vader.", "Joh 8:31": "Jezus zei dan tegen de Joden die in Hem geloofden: Als u in Mijn woord blijft, bent u werkelijk Mijn discipelen;", "Matt 28:18-20": "En Jezus kwam bij hen en sprak tot hen: Mij is gegeven alle macht in hemel en op aarde. Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest; en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "2 Tim 3:11": "mijn vervolgingen, mijn lijden, zoals mij overkomen is in Antiochië, in Ikonium en in Lystre; wat voor vervolgingen ik geleden heb, en de Heere heeft mij uit alle verlost.", "Joh 8:32": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken.", "Ezech 14:6": "Daarom, zeg tegen het huis van Israël: Zo zegt de Heere HEERE: Bekeer u, en keer u af van uw drekgoden, en keer uw aangezichten af van al uw gruwelen.", "Hand 16:11-40": "Van Troas dan vertrokken, voeren wij recht naar Samothrace, en de volgende dag naar Neapolis. En van daar naar Filippi, wat de eerste stad is van dit deel van Macedonië, een kolonie. En wij bleven in die stad enkele dagen. En op de dag van de sabbat gingen wij de stad uit, naar de rivier, waar men gewoonlijk bad; en wij gingen zitten en spraken tot de vrouwen die daar samengekomen waren.", "Hand 13:14-52": "En zij trokken van Perge het land door, en kwamen te Antiochië, een stad in Pisidië; en gingen op de dag van de sabbat de synagoge in, en gingen zitten. En na het lezen van de wet en de profeten, zonden de leiders van de synagoge iemand naar hen toe, en zeiden: Mannen broeders, als er enig woord van bemoediging voor het volk in u is, spreek dan. En Paulus stond op, en wenkte met de hand, en zei: Israëlitische mannen, en u die God vreest, hoor toe.", "Ps 147:7": "Zingt beurtelings voor de HEERE met dankzegging; zingt psalmen voor onze God op de harp.", "Hand 28:23-28": "En toen zij hem een dag hadden vastgesteld, kwamen er velen naar hem toe in zijn woonplaats; hij legde hun het Koninkrijk van God uit en getuigde ervan, en probeerde hen te overtuigen aangaande Jezus, zowel uit de wet van Mozes als uit de profeten, van 's morgens vroeg tot 's avonds toe. En sommigen geloofden wel wat er gezegd werd, maar sommigen geloofden niet. En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Jes 44:24": "Zo zegt de HEERE, uw Verlosser, en Die u geformeerd heeft van de buik af aan: Ik ben de HEERE, Die alles doet, Die de hemel uitbreidt, Ik alleen, en Die de aarde uitspant door Mijzelf;", "Hand 16:40": "En zij gingen weg uit de gevangenis, en gingen naar Lydia; en toen zij de broeders gezien hadden, bemoedigden zij hen, en vertrokken uit de stad.", "1 Kor 4:1-21": "Zo houdt men ons voor, ieder mens: als dienaars van Christus, en uitdelers van de verborgenheden van God. En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt. Maar voor mij is het van het minste belang, dat ik door u geoordeeld word, of door een menselijk oordeel; ja, ik oordeel ook mijzelf niet.", "Hand 18:9-11": "En de Heere zei tegen Paulus door een gezicht in de nacht: Wees niet bevreesd, maar spreek en zwijg niet. Want Ik ben met u, en niemand zal de hand aan u leggen om u kwaad te doen; want Ik heb veel volk in deze stad. En hij bleef daar een jaar en zes maanden, en leerde onder hen het Woord van God.", "Ps 85:13": "Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.", "1 Tess 3:2-4": "en wij hebben Timotheüs gezonden, onze broeder en Gods dienaar en onze medearbeider in het Evangelie van Christus, om u te versterken en u te vermanen aangaande uw geloof; opdat niemand bewogen wordt door deze verdrukkingen; want u weet zelf dat wij hiertoe gesteld zijn. Want ook toen wij bij u waren, zeiden wij u van tevoren dat wij verdrukt zouden worden, zoals ook gebeurd is, en u weet het.", "Deut 32:47": "Want dat is geen leeg woord voor u; maar het is uw leven; en door ditzelfde woord zult u de dagen verlengen op het land, waar u over de Jordaan naartoe gaat, om dat te erven.", "Hand 26:16-18": "Maar richt u op en sta op uw voeten; want hiertoe ben Ik u verschenen, om u aan te stellen tot een dienaar en getuige, zowel van de dingen die u gezien hebt als van de dingen waarin Ik u nog zal verschijnen; En zal u verlossen van dit volk en van de heidenen, tot wie Ik u nu zend; Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Ef 3:1-8": "Om deze reden ben ik, Paulus, de gevangene van Christus Jezus, voor u, die heidenen bent. Als u tenminste gehoord hebt van de bediening van de genade van God, die mij gegeven is voor u; Dat Hij mij door openbaring deze verborgenheid heeft bekendgemaakt (zoals ik met weinig woorden eerder geschreven heb;", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "Joh 7:43": "Er ontstond dan verdeeldheid onder de menigte om Zijnentwil.", "Joh 18:20": "Jezus antwoordde hem: Ik heb vrijuit gesproken tot de wereld; Ik heb altijd onderwezen in de synagoge en in de tempel, waar de Joden van alle plaatsen samenkomen; en in het verborgen heb Ik niets gesproken.", "Rom 1:20": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "Joh 5:7": "De zieke antwoordde Hem: Heere, ik heb geen mens om mij in het badwater te brengen, wanneer het water bewogen wordt; en terwijl ik kom, gaat een ander vóór mij naar beneden.", "1 Kor 11:18": "Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;", "Hand 17:29": "Wij dan, die Gods geslacht zijn, moeten niet menen dat de Godheid gelijk is aan goud, of zilver, of steen, gesneden door mensenkunst en bedenking.", "Ex 32:20": "En hij nam het kalf dat zij gemaakt hadden, en verbrandde het in het vuur, en vermaalde het tot het klein werd, en strooide het op het water, en liet de kinderen van Israël dat drinken.", "2 Tim 2:2": "en wat u van mij gehoord hebt onder veel getuigen, vertrouw dat toe aan trouwe mensen, die bekwaam zullen zijn om ook anderen te leren.", "2 Tim 1:7": "Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid.", "Job 17:9": "En de rechtvaardige zal zijn weg vasthouden, en wie rein van handen is, zal in sterkte toenemen.", "2 Kor 1:22": "Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Hebr 13:17": "Wees uw voorgangers gehoorzaam en wees hun onderdanig; want zij waken over uw zielen, als degenen die rekenschap moeten geven, opdat zij dit met vreugde mogen doen en niet al zuchtend; want dat is voor u niet nuttig.", "Ps 148:5": "Laat hen de Naam van de HEERE loven; want toen Hij het beval, werden zij geschapen.", "2 Kor 4:8-15": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven; Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Hand 6:5": "En dit voorstel beviel de hele menigte; en zij kozen Stefanus, een man vol van het geloof en van de Heilige Geest, en Filippus, en Prochorus, en Nicanor, en Timon, en Parmenas, en Nicolaus, een proseliet uit Antiochië;", "Hand 18:26": "En hij begon vrijmoedig te spreken in de synagoge. En toen Aquila en Priscilla hem gehoord hadden, namen zij hem tot zich, en legden hem de weg van God nauwkeuriger uit.", "Spr 3:1": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden.", "Gen 44:13": "Toen scheurden zij hun kleren, en ieder man laadde zijn ezel weer op, en zij keerden terug naar de stad.", "Ps 135:15-18": "De afgoden van de heidenen zijn zilver en goud, een werk van mensenhanden. Zij hebben een mond, maar spreken niet; zij hebben ogen, maar zien niet; Oren hebben zij, maar horen niet; ook is er geen adem in hun mond.", "Gen 26:4": "En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "Hebr 6:18": "opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Hand 13:46-48": "Maar Paulus en Barnabas zeiden vrijmoedig: Het was nodig dat eerst tot u het Woord van God gesproken zou worden; doch aangezien u het verstoot, en uzelf het eeuwige leven niet waard oordeelt, zie, wij keren ons tot de heidenen. Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde. Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Hand 12:5": "Petrus dan werd in de gevangenis bewaakt; maar door de gemeente werd voortdurend tot God voor hem gebeden.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Hand 20:31": "Daarom, waak, en bedenk dat ik drie jaar lang, nacht en dag, niet heb opgehouden ieder met tranen te vermanen.", "Gal 2:3": "Maar ook Titus, die bij mij was, hoewel hij een Griek was, werd niet gedwongen zich te laten besnijden.", "Joh 1:16": "En uit Zijn volheid hebben wij allen ontvangen, ook genade voor genade.", "Luk 7:22": "En Jezus antwoordde en zei tegen hen: Ga heen, en vertel Johannes weer wat u gezien en gehoord hebt: dat de blinden ziende worden, de kreupelen lopen, de melaatsen gereinigd worden, de doven horen, de doden opgewekt worden, aan de armen het Evangelie verkondigd wordt.", "2 Petr 2:21": "Want het zou beter voor hen geweest zijn de weg van de gerechtigheid niet gekend te hebben, dan die gekend te hebben en zich weer af te keren van het heilige gebod dat hun overgeleverd was.", "Ef 4:12": "Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus;", "Deut 8:4": "Uw kleding is aan u niet versleten, en uw voet is niet gezwollen, deze veertig jaar.", "Luk 13:11-13": "En zie, er was een vrouw die al achttien jaar lang een geest van ziekte had, en zij was samengebogen en kon zich totaal niet oprichten. En Jezus zag haar, riep haar bij Zich en zei tegen haar: Vrouw, u bent verlost van uw ziekte. En Hij legde haar de handen op; en zij werd meteen weer recht, en verheerlijkte God.", "Jes 57:13": "Wanneer u zult roepen, laat dan degenen die door u verzameld zijn, u redden; maar de wind zal hen allemaal wegvoeren, de leegte zal hen wegnemen. Maar wie op Mij vertrouwt, die zal het land erven, en Mijn heilige berg in bezit krijgen.", "2 Kor 12:14": "Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen.", "Jer 48:13": "En Moab zal beschaamd worden vanwege Kamos, zoals het huis van Israël beschaamd is geworden vanwege Bethel, hun vertrouwen.", "Hand 11:30": "En dat deden zij ook, en zonden het naar de oudsten, door de hand van Barnabas en Saulus.", "Hand 6:2": "En de twaalf riepen de menigte van de discipelen bij zich en zeiden: Het is niet passend dat wij het Woord van God verwaarlozen om de tafels te bedienen.", "Ps 104:5": "Hij heeft de aarde gegrond op haar fundamenten; zij zal nooit meer, ook niet eeuwig, wankelen.", "Ps 69:14": "Maar mij aangaande, mijn gebed is tot U, o HEERE; er is een tijd van het welbehagen, o God! Door de grootheid van Uw goedertierenheid; verhoor mij door de trouw van Uw heil.", "1 Petr 1:4-7": "Tot een onvergankelijke, onbevlekte en onverwelkbare erfenis, die in de hemelen bewaard is voor u. Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd. Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,", "Fil 2:17": "Ja, ook al word ik tot een drankoffer geofferd over de offerande en bediening van uw geloof, dan verblijd ik mij, en verblijd ik mij met u allen.", "1 Kon 18:27": "En het gebeurde op de middag, dat Elia met hen spotte, en zei: Roep met luide stem, want hij is een god; misschien is hij in gedachten verzonken, of heeft hij iets te doen, of is hij op reis; misschien slaapt hij en moet hij wakker worden.", "Jes 17:7": "Op die dag zal de mens zien naar Hem, Die hem gemaakt heeft, en zijn ogen zullen op de Heilige van Israël zien.", "Hand 13:45": "Doch de Joden, die de menigten zagen, werden vervuld met afgunst, en weerspraken wat door Paulus gezegd werd, en tegenspraken en lasterden.", "Hand 20:24": "Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "Deut 28:2-13": "En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld. Gezegend zal zijn de vrucht van uw schoot, en de vrucht van uw land, en de vrucht van uw vee, de aanwas van uw koeien, en de kudden van uw kleinvee.", "Jer 22:15": "Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Ps 74:17": "U hebt al de grenzen van de aarde gesteld; zomer en winter, die hebt U gevormd.", "Openb 11:15": "En de zevende engel heeft op de ba
