owel van heidenen als van Joden, met hun leiders, om hun smaad aan te doen en hen te stenigen,","6":"zijn zij, toen zij dit door hadden, gevlucht naar de steden van Lykaonië, namelijk Lystre en Derbe, en het omliggende land;","7":"en zij verkondigden daar het Evangelie.","8":"En een zeker man te Lystre zat zonder kracht in zijn voeten, kreupel van de moederschoot af, die nooit had gelopen.","9":"Deze hoorde Paulus spreken; die zijn ogen op hem hield, en zag dat hij geloof had om gezond te worden,","10":"en zei met luide stem: Sta recht op uw voeten! En hij sprong op en liep.","11":"En de menigten, toen zij zagen wat Paulus gedaan had, verhieven hun stemmen en zeiden in het Lycaonisch: De goden zijn aan de mensen gelijk geworden, en tot ons neergekomen.","12":"En zij noemden Barnabas Jupiter, en Paulus Mercurius, omdat hij het woord voerde.","13":"En de priester van Jupiter, die vóór hun stad was, bracht ossen en kransen naar de poorten, en wilde offeren samen met de menigten.","14":"Maar toen de apostelen Barnabas en Paulus dit hoorden, scheurden zij hun kleren, en sprongen onder de menigte, en riepen:","15":"Mannen, waarom doet u deze dingen? Ook wij zijn mensen net als u, en wij verkondigen u dat u zich van deze nutteloze dingen zou bekeren tot de levende God, Die de hemel, en de aarde, en de zee, en alles wat daarin is, gemaakt heeft;","16":"Die in de voorbije generaties alle heidenen heeft laten gaan in hun eigen wegen;","17":"hoewel Hij Zichzelf toch niet zonder getuigenis gelaten heeft, doordat Hij goeddeed, ons vanuit de hemel regen en vruchtbare tijden gaf, en onze harten vervulde met voedsel en vreugde.","18":"En toen zij dit zeiden, weerhielden zij de menigten nauwelijks ervan dat zij hun offerden.","19":"Maar daarna kwamen er Joden van Antiochië en Ikonium, en zij overreedden de menigten, en stenigden Paulus, en sleepten hem de stad uit, in de mening dat hij dood was.","20":"Maar toen de discipelen om hem heen kwamen staan, stond hij op en ging de stad in; en de volgende dag vertrok hij met Barnabas naar Derbe.","21":"En toen zij in die stad het Evangelie verkondigd hadden en veel discipelen gemaakt hadden, keerden zij terug naar Lystre, en Ikonium, en Antiochië,","22":"en versterkten de harten van de discipelen, en vermaanden hen om te blijven in het geloof, en dat wij door veel verdrukkingen het Koninkrijk van God moeten binnengaan.","23":"En toen zij in elke gemeente, met opsteken van de handen, oudsten hadden aangesteld, en gebeden hadden met vasten, bevalen zij hen bij de Heere aan, in Wie zij geloofd hadden.","24":"En zij trokken door Pisidië, en kwamen in Pamfylië.","25":"En toen zij te Perge het Woord gesproken hadden, gingen zij af naar Attalië.","26":"En vandaar voeren zij af naar Antiochië, van waar zij aan de genade van God waren toevertrouwd geweest voor het werk dat zij volbracht hadden.","27":"En toen zij daar aangekomen waren, en de gemeente bijeengeroepen hadden, vertelden zij wat grote dingen God met hen gedaan had, en dat Hij voor de heidenen de deur van het geloof geopend had.","28":"En zij bleven daar geen korte tijd bij de discipelen."},"SV":{"1":"En het geschiedde te Ikonium, dat zij te zamen gingen in de synagoge der Joden, en alzo spraken, dat een grote menigte, beiden van Joden en Grieken, geloofde.","2":"Maar de Joden, die ongehoorzaam waren, verwekten en verbitterden de zielen der heidenen tegen de broeders.","3":"Zij verkeerden dan *aldaar* een langen tijd, vrijmoediglijk sprekende in den Heere, Die getuigenis gaf aan het Woord Zijner genade, en gaf, dat tekenen en wonderen geschiedden door hun handen.","4":"En de menigte der stad werd verdeeld, en sommigen waren met de Joden, en sommigen met de apostelen.","5":"En als er een oploop geschiedde, beiden van heidenen en van Joden, met hun oversten, om hun smaadheid aan te doen, en *hen* te stenigen,","6":"Zijn zij, *alles* overlegd hebbende, gevlucht naar de steden van Lykaonië, *namelijk* Lystre en Derbe, en het omliggende land;","7":"En verkondigden aldaar het Evangelie.","8":"En een zeker man, te Lystre, zat onmachtig aan de voeten, kreupel zijnde van zijner moeders lijf, die nooit had gewandeld.","9":"Deze hoorde Paulus spreken; welke de ogen op hem houdende, en ziende, dat hij geloof had om gezond te worden,","10":"Zeide met grote stem: Sta recht op uw voeten! En hij sprong op en wandelde.","11":"En de scharen, ziende, hetgeen Paulus gedaan had, verhieven hun stemmen, en zeiden in het Lycaonisch: De goden zijn den mensen gelijk geworden, en tot ons nedergekomen.","12":"En zij noemden Barnabas Jupiter, en Paulus Mercurius, omdat hij het woord voerde.","13":"En de priester van Jupiter, die voor hun stad was, als hij ossen en kransen aan de voorpoorten gebracht had wilde hij offeren met de scharen.","14":"Maar de apostelen, Barnabas en Paulus, *dat* horende, scheurden hun klederen, en sprongen onder de schare, roepende,","15":"En zeggende: Mannen, waarom doet gij deze dingen? Wij zijn ook mensen van gelijke bewegingen als gij, en verkondigen ulieden, dat gij u zoudt van deze ijdele *dingen* bekeren tot den levenden God, Die gemaakt heeft den hemel, en de aarde, en de zee, en al hetgeen in dezelve is;","16":"Welke in de verledene tijden al de heidenen heeft laten wandelen in hun wegen;","17":"Hoewel Hij nochtans Zichzelven niet onbetuigd gelaten heeft, goed doende van den hemel, ons regen en vruchtbare tijden gevende, vervullende onze harten met spijs en vrolijkheid.","18":"En dit zeggende, wederhielden zij nauwelijks de scharen, dat zij hun niet offerden.","19":"Maar daarover kwamen Joden van Antiochië en Ikonium, en overreedden de scharen, en stenigden Paulus, en sleepten *hem* buiten de stad, menende, dat hij dood was.","20":"Doch als hem de discipelen omringd hadden, stond hij op, en kwam in de stad; en des anderen daags ging hij met Barnabas uit naar Derbe.","21":"En als zij derzelve stad het Evangelie verkondigd en vele discipelen gemaakt hadden, keerden zij weder naar Lystre, en Ikonium, en Antiochië;","22":"Versterkende de zielen der discipelen, en vermanende, dat zij zouden blijven in het geloof, en dat wij door vele verdrukkingen moeten ingaan in het Koninkrijk Gods.","23":"En als zij in elke Gemeente, met opsteken der handen , ouderlingen verkoren hadden, gebeden hebbende met vasten, bevalen zij hen den Heere, in Welken zij geloofd hadden.","24":"En Pisidië doorgereisd hebbende, kwamen zij in Pamfylië.","25":"En als zij te Perge het Woord gesproken hadden, kwamen zij af naar Attalië.","26":"En van daar scheepten zij af naar Antiochië, van waar zij der genade Gods bevolen waren geweest tot het werk, dat zij volbracht hadden.","27":"En daar gekomen zijnde, en de Gemeente vergaderd hebbende, verhaalden zij, wat grote dingen God met hen gedaan had, en dat Hij den heidenen de deur des geloofs geopend had.","28":"En zij verkeerden aldaar geen kleinen tijd met de discipelen."},"KJV":{"1":"And it came to pass in Iconium, that they went both together into the synagogue of the Jews, and so spake, that a great multitude both of the Jews and also of the Greeks believed.","2":"But the unbelieving Jews stirred up the Gentiles, and made their minds evil affected against the brethren.","3":"Long time therefore abode they speaking boldly in the Lord, which gave testimony unto the word of his grace, and granted signs and wonders to be done by their hands.","4":"But the multitude of the city was divided: and part held with the Jews, and part with the apostles.","5":"And when there was an assault made both of the Gentiles, and also of the Jews with their rulers, to use *them* despitefully, and to stone them,","6":"They were ware of *it*, and fled unto Lystra and Derbe, cities of Lycaonia, and unto the region that lieth round about:","7":"And there they preached the gospel.","8":"And there sat a certain man at Lystra, impotent in his feet, being a cripple from his mother's womb, who never had walked:","9":"The same heard Paul speak: who stedfastly beholding him, and perceiving that he had faith to be healed,","10":"Said with a loud voice, Stand upright on thy feet. And he leaped and walked.","11":"And when the people saw what Paul had done, they lifted up their voices, saying in the speech of Lycaonia, The gods are come down to us in the likeness of men.","12":"And they called Barnabas, Jupiter; and Paul, Mercurius, because he was the chief speaker.","13":"Then the priest of Jupiter, which was before their city, brought oxen and garlands unto the gates, and would have done sacrifice with the people.","14":"*Which* when the apostles, Barnabas and Paul, heard *of*, they rent their clothes, and ran in among the people, crying out,","15":"And saying, Sirs, why do ye these things? We also are men of like passions with you, and preach unto you that ye should turn from these vanities unto the living God, which made heaven, and earth, and the sea, and all things that are therein:","16":"Who in times past suffered all nations to walk in their own ways.","17":"Nevertheless he left not himself without witness, in that he did good, and gave us rain from heaven, and fruitful seasons, filling our hearts with food and gladness.","18":"And with these sayings scarce restrained they the people, that they had not done sacrifice unto them.","19":"And there came thither *certain* Jews from Antioch and Iconium, who persuaded the people, and, having stoned Paul, drew *him* out of the city, supposing he had been dead.","20":"Howbeit, as the disciples stood round about him, he rose up, and came into the city: and the next day he departed with Barnabas to Derbe.","21":"And when they had preached the gospel to that city, and had taught many, they returned again to Lystra, and *to* Iconium, and Antioch,","22":"Confirming the souls of the disciples, *and* exhorting them to continue in the faith, and that we must through much tribulation enter into the kingdom of God.","23":"And when they had ordained them elders in every church, and had prayed with fasting, they commended them to the Lord, on whom they believed.","24":"And after they had passed throughout Pisidia, they came to Pamphylia.","25":"And when they had preached the word in Perga, they went down into Attalia:","26":"And thence sailed to Antioch, from whence they had been recommended to the grace of God for the work which they fulfilled.","27":"And when they were come, and had gathered the church together, they rehearsed all that God had done with them, and how he had opened the door of faith unto the Gentiles.","28":"And there they abode long time with the disciples."}},"tsk":{"1":[{"kopje":"in","refs":["Hand 13:51"]},{"kopje":"gingen","refs":["Hand 9:20","Hand 13:46","Hand 17:1","Hand 17:2","Hand 17:17","Hand 18:4","Hand 19:8"]},{"kopje":"dat een","refs":["Hand 14:21","Hand 11:21","Hand 13:43","Hand 13:46","Hand 17:4","Hand 18:8"]},{"kopje":"Grieken","refs":["Hand 14:2","Hand 16:1","Hand 17:12","Hand 18:4","Hand 19:10","Hand 19:17","Hand 20:21","Hand 21:28","Mark 7:26","Joh 7:35","Joh 12:20","Rom 1:16","Rom 10:12","1 Kor 1:22-24","Gal 2:3","Gal 3:28","Kol 3:11"]}],"3":[{"kopje":"dan","refs":["Hand 18:9-11","Hand 19:10","1 Kor 16:8","1 Kor 16:9"]},{"kopje":"spraken","refs":["Hand 13:46","Ef 6:18-20","1 Tess 2:2"]},{"kopje":"Die","refs":["Hand 2:22","Hand 5:32","Mark 16:20","Hebr 2:4"]},{"kopje":"het Woord","refs":["Hand 20:24","Hand 20:32","Rom 1:16"]},{"kopje":"gaf","refs":["Hand 4:29","Hand 4:30","Hand 5:12-14","Hand 19:11","Hand 19:12"]}],"4":[{"kopje":"de menigte","refs":["Micha 7:6","Matt 10:34-36","Luk 2:34","Luk 11:21-23","Luk 12:51-53","Joh 7:43"]},{"kopje":"sommigen","refs":["Hand 28:24"]},{"kopje":"apostelen","refs":["Hand 14:14","Hand 13:2","1 Kor 9:5"]}],"5":[{"kopje":"toen","refs":["Hand 4:25-29","Hand 17:5","Ps 2:1-3","Ps 83:6","2 Tim 3:11"]},{"kopje":"smaad aan te doen","refs":["Matt 5:44","Luk 6:28"]}],"6":[{"kopje":"zijn","refs":["Hand 9:24","Hand 17:13","Hand 17:14","Hand 23:12-22","2 Kon 6:8-12"]},{"kopje":"gevlucht","refs":["Matt 10:23"]},{"k ieper in het land. Want ook Iconium was ene stad in Lycaonië."},{"catchword":"Lykaónië,","tekst":"Dit landschap was een deel van Klein-Azië, bij den berg Taurus gelegen, omtrent Frygië."}],"9":[{"catchword":"ziende, dat hij","tekst":"Namelijk Paulus, dat hij, namelijk de kreupele."},{"catchword":"geloof had om","tekst":"Hetwelk hij schijnt ontvangen te hebben uit de predikatie van Paulus, en de wonderbaarlijke genezingen van anderen. Paulus heeft in hem gezien, òf door goddelijke ingeving, òf door enige tekenen, die hij daarvan in hem bespeurde."},{"catchword":"gezond te worden,","tekst":"Of, behouden, verlost."}],"11":[{"catchword":"den mensen gelijk","tekst":"Of, in gelijkenis van mensen; gelijk daarvan in de heidense geschiedenissen of fabelen, voorbeelden verhaald worden; welke mening gesproten schijnt te zijn uit sommige verschijningen der engelen aan de voorvaders geschied, die de heidenen in fabelen hebben veranderd."}],"12":[{"catchword":"Júpiter,","tekst":"Dezen hielden de heidenen voor hun oppersten god, en voor het hoofd van al hunne goden; gelijk Mercurius voor den bode en taalman hunner goden."}],"13":[{"catchword":"die voor hun","tekst":"Dat is, wiens tempel, beeld, of altaar, buiten hunne stad of in de voorstad stond."},{"catchword":"kransen","tekst":"Namelijk met welke de heidenen de beesten versierden, die zij hunnen afgoden offerden."},{"catchword":"voorpoorten","tekst":"Of, portaal; namelijk van het huis waar Paulus en Barnabas in waren gelogeerd, om die aldaar te offeren."}],"14":[{"catchword":"scheurden hun","tekst":"Namelijk tot een teken van groot mishagen en afkeer, die zij hadden van zulke afgoderij. Zie Mat 26:65 ."},{"catchword":"de schare, roepende,","tekst":"Namelijk die met den priester van Jupiter aldaar voor de deuren gekomen was."}],"15":[{"catchword":"ijdele dingen","tekst":"Dat is, afgoden, die niets zijn in zichzelven, 1Co 8:4 , en geen goden, hoewel zij hen daarvoor hielden."}],"16":[{"catchword":"in hun wegen;","tekst":"Dat is, . 14.who were also called by Christ to be Apostles, like as the other twelve, See 1 Cor. 9. 5, 6.]"}],"5":[{"catchword":null,"tekst":"And when there was made an uproar both of Gentiles and of Jews, which their Rulers, to do them despite and to stone them."}],"6":[{"catchword":null,"tekst":"Having considered (all things) [Or seeing this, being aware of it], they fled unto the cities [that is, to the other cities of Lycaonia, deeper into the land, for Iconium also was a city of Lycaonia] of Lycaonia, [this country was part of Asia the Less, situated near mount Taurus about Phrygia] (namely) Lystra and Derbe, and the land lying about."}],"7":[{"catchword":null,"tekst":"And published the gospel there."}],"8":[{"catchword":null,"tekst":"And a certain man at Lystra sat impotent in the feet, being a cripple from his mother&rsquo;s womb, who had never walked."}],"9":[{"catchword":null,"tekst":"This (man) heard Paul speak, who holding his eyes upon him, and seeing, [Namely, Paul, that he, namely, the cripple] that he had faith [which seemeth to have received by Pauls preaching, and the miraculous curing of others. And Paul saw the same in him, either by divine inspiration, or by signs which he perceived thereof in him] to be healed, [or saved, delivered.]"}],"10":[{"catchword":null,"tekst":"Said with a great voice stand upright on thy feet. And he leaped up and walked."}],"11":[{"catchword":null,"tekst":"And the multitudes seeing that which Paul had done, lift up their voices, and said in the Lycaonian (tongue) the Gods are become like unto men, [That is, in the likeness of men, as there are examples thereof related in the Heathenish Histories and Fables; which opinion seemeth to have sprung from some apparitions of the Angels made to the fore-fathers, which the Heathen changed into Fables] and come down unto us."}],"12":[{"catchword":null,"tekst":"And they caked Barnabas Jupiter, [Him the Heathen held for their highest God, and for the head of all Gods, as Mercury for the Messenger and interpreter of their Gods] and Paul Mercurius, because he was the speaker."}],"13":[{"catchword":null,"tekst":"And the Priest of Jupiter, which was before their City, [That is, whose Temple, Image or Altar, stood without their City or in the Suburbs, when he had brought Oxen and Garlands, [namely, wherewith the Gentiles adorned the beasts, which they sacrificed unto their Idols] to the porches, [or portall, namely, of the house wherein Paul and Barnabas were lodged, to sacrifice unto them there] he would have sacrificed with the multitudes."}],"14":[{"catchword":null,"tekst":"But the Apostles Barnabas and Paul hearing (that) rent their cloaths, [Namely, in token of great displeasure and abhorrence which they had of such Idolatry. See Mat. 26.v. 63.] and leapt amongst the multitude, [namely, which was come there before the door with the Priest of Jupiter] crying,"}],"15":[{"catchword":null,"tekst":"And saying, Men, why do ye these things? We are also men of like affections as you, and declare unto you that you should turn from these vain (things) [That is, Idols, which are nothing in themselves, 1 Cor. 8. 4.and no gods, although they accounted them so] unto the living God, who hath made the heaven, and the earth, and the Sea and all that which is in the same."}],"16":[{"catchword":null,"tekst":"Awho in the times past suffered all the Gentiles to walk in their (own) waies. [That is, in the manners of doing, which they devised to themselves without and contrary to the word of God.]"}],"17":[{"catchword":null,"tekst":"Although notwithstand he left not himself unwitnessed, [Namely, even amongst the heathen themselves, to whom he gave not hi word, Psa. 147. 19, 20.] doing good, from heaven giving us rain and fruitfull seasons, filling our hearts with food and gladness."}],"18":[{"catchword":null,"tekst":"And saying this they scarce with-held the multitudes [Or quieted] that they sacrificed not."}],"19":[{"catchword":null,"tekst":"But there came Jews from Antioch [Namely, lying in Pisidia, whereof is spoken, Acts 13. 14.] and Iconium, and perswaded the multitudes, and stoned Paul, and drew (him) forth out of the City, thinking that he was dead."}],"20":[{"catchword":null,"tekst":"But when the Disciples had compassed him about, [Namely, either to bury him, or to deliver him from the further violence of the persecutors] he rose up, and came into the City: and the next day, he went forth with Barnabas to Derbe."}],"21":[{"catchword":null,"tekst":"And as they preached the Gospel to the City, and had made many Disciples [Or that taught or instructed. See also Mat. 28. 19] they returned unto Lystra, and Iconium, and Antioch."}],"22":[{"catchword":null,"tekst":"Strengthening the souls of the Disciples [Namely, which in their former journey, in going through the Cities they had wonne to Christ] (and) exhorting that they should continue in the faith; and that through many afflictions we must enter the Kingdome of God."}],"23":[{"catchword":null,"tekst":"And when they in every Church with lifting up of hands had chosen them Elders, [Gr. Cheirotonesantes: of which word see Acts 10. 41. As this was a custome among the Greeks in their chusing of Magistrates, that the people by lifting up of their hands gave to understand their voting; so it seemeth that from thence this custome was also used in the primitive Church, that the setting forth of Ministers of the Church being done by the Apostles, or those that were sent by them for this purpose, was approved by the Church by lifting up of their hands: which use long continued in the Church; as the Eclesisticall Histories testifie. Others think that thereby is understood the imposition of hands, which also was done with consent of the Church, as appears by the fasting and praying, which was done by the whole Congregation, and was also done in the ching of Elders; see further, 1 Tim. 5. 17] having prayed with fasting they commended them to the Lord, in whom they had believed."}],"24":[{"catchword":null,"tekst":"And having travelled through Pisidia, [This was a Region bordering on Cilicia] they came into Pamphylia. [This was a Region bordering upon Isauria, which also bordered on Lycaonia, v.6.]"}],"25":[{"catchword":null,"tekst":"And when they had spoken the word at Perga, [This was the chief City in Pamphylia, Acts 13 v. 13.] they came down to Attalia. [this was a City lying not far from Perga on the Midland sea.]"}],"26":[{"catchword":null,"tekst":"And from thence they sailed away to Antioch; [Namely, which was situate in Syria. Whence they were sent forth, and had begun this journey, Acts 13. 4.] from whence they had been commended to the grace of God [namely, by fasting, prayer and imposition of hands, Acts 13. 2, 3.] for the work which they had accomplished."}],"27":[{"catchword":null,"tekst":"And being come thither, and having gathered the Church together, they related what great things God had done with them, [That is, by them or by their ministry. See Acts 15. 12.] and that he had opened the door of faith [that is, that not only the outward word and miracles, but that also the operation of the Holy Ghost was imparted unto them, for to be brought to the faith in Christ, 1 Cor. 16. 9.and 2. Cor. 2. 12. Rev. 3. 8] to the Gentiles."}],"28":[{"catchword":null,"tekst":"And they conversed there no small time with the Disciples."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

    data.weergaven.map(w => {

function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

}
function renderPaneel(n) {

function toggle(n) {

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen

        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });

    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();

    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();

    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {

      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;

    }

});

    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
