naf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Ps 103:8-10": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Jes 43:9": "Laat alle heidenvolken samen vergaderd worden, en laat de volken verzameld worden; wie onder hen zal dit verkondigen? Of laat hen ons de vorige dingen doen horen, laat hen hun getuigen voortbrengen, opdat zij gerechtvaardigd worden, en men het hoort en zegt: Het is de waarheid.", "2 Kor 5:5": "Die ons nu hiertoe klaargemaakt heeft, is God, Die ons ook het onderpand van de Geest gegeven heeft.", "Spr 28:10": "Wie de oprechten doet dwalen op een kwade weg, zal zelf in zijn eigen kuil vallen; maar de vromen zullen het goede beërven.", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Hand 9:35": "En allen die in Lydda en Sarona woonden, zagen hem, en zij bekeerden zich tot de Heere.", "Ps 104:10-19": "Die de bronnen laat stromen door de dalen, zodat zij tussen de bergen door lopen. Zij drenken al het gedierte van het veld; de wilde ezels lessen er hun dorst mee. Daarbij woont het gevogelte van de hemel, een geluid latend horen van tussen de takken.", "Luk 24:26": "Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?", "Job 37:13": "Hetzij dat Hij die tot een roede, of tot Zijn land, of tot weldadigheid beschikt.", "1 Tim 4:6": "Als u deze dingen aan de broeders voorhoudt, zult u een goede dienaar van Jezus Christus zijn, gevoed door de woorden van het geloof en van de goede leer, die u gevolgd hebt.", "Matt 13:58": "En Hij heeft daar niet veel krachten gedaan, vanwege hun ongeloof.", "Gen 2:1": "Zo zijn de hemel en de aarde voltooid, en heel hun leger.", "Hebr 6:1": "Laten wij daarom het beginsel van de leer van Christus achterlaten en doorgaan tot de volmaaktheid; niet opnieuw het fundament leggend van de bekering van dode werken en van het geloof in God,", "Gal 4:8": "Maar toen u God niet kende, diende u hen die van nature geen goden zijn;", "Jes 42:5": "Zo zegt God, de HEERE, Die de hemelen geschapen en ze uitgebreid heeft, Die de aarde uitgespannen heeft, en wat daaruit voortkomt; Die aan het volk dat daarop is, de adem geeft, en de geest aan hen die daarop wandelen:", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "Joh 7:18": "Wie uit zichzelf spreekt, zoekt zijn eigen eer; maar wie de eer zoekt van Hem die hem gezonden heeft, die is waarachtig, en er is geen ongerechtigheid in Hem.", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "Ps 136:5-25": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.", "Ps 36:6-8": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe. Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten. Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Ps 83:6": "Want zij hebben in hun hart samen een plan beraamd; tegen U hebben zij een verbond gesloten;", "Hand 5:14": "En er werden steeds meer mensen toegevoegd, die de Heere geloofden, menigten zowel van mannen als van vrouwen;", "Rom 15:9-12": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen. En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk! En opnieuw: Looft de Heere, alle heidenen, en prijst Hem, alle volken!", "Matt 6:8": "Word hun dan niet gelijk; want uw Vader weet wat u nodig hebt, voordat u het Hem vraagt.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Num 14:6": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren.", "Jes 44:9-20": "De formeerders van gesneden beelden zijn allemaal samen ijdelheid, en hun gewenste dingen doen geen nut; ja, zijzelf zijn hun getuigen; zij zien niet, en zij weten niet, daarom zullen zij beschaamd worden. Wie formeert een god, of giet een beeld, dat geen nut doet? Zie, al zijn medegenoten zullen beschaamd worden, want de werkmeesters zijn uit de mensen; laat ze zich allemaal verzamelen, laat ze opstaan, zij zullen schrikken, zij zullen samen beschaamd worden.", "Deut 7:13-24": "en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten; en de HEERE zal alle ziekte van u afweren, en Hij zal u geen van de kwade ziekten van de Egyptenaren, die u kent, opleggen, maar zal ze leggen op allen die u haten.", "Pred 3:13": "Ja ook, dat ieder mens eet en drinkt, en het goede geniet van al zijn arbeid, dit is een gave van God.", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Jes 25:4": "Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.", "Mark 3:14": "En Hij stelde er twaalf aan, opdat zij bij Hem zouden zijn, en opdat Hij hen zou uitzenden om te prediken;", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Joh 5:3": "Daarin lag een grote menigte zieken, blinden, kreupelen en verlamden, die wachtten op de beweging van het water.", "Jes 40:12-26": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal? Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen? Met wie heeft Hij raad gehouden, die Hem verstand zou geven, en Hem zou leren van het pad van het recht, en Hem wetenschap zou leren, en Hem bekend zou maken de weg van het veelvoudige verstand?", "2 Kron 28:23": "Want hij offerde aan de goden van Damascus, die hem geslagen hadden, en zei: Omdat de goden van de koningen van Syrië hen helpen, zal ik hun offeren, opdat zij mij ook helpen; maar zij waren hem tot zijn val, alsook aan heel Israël.", "Hand 14:24-28": "En zij trokken door Pisidië, en kwamen in Pamfylië. En toen zij te Perge het Woord gesproken hadden, gingen zij af naar Attalië. En vandaar voeren zij af naar Antiochië, van waar zij aan de genade van God waren toevertrouwd geweest voor het werk dat zij volbracht hadden.", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "Job 37:10": "Door Zijn geblaas geeft God de vorst, zodat het brede water verstijft.", "Ps 115:5": "zij hebben een mond, maar spreken niet; zij hebben ogen, maar zien niet;", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "2 Tim 1:11": "Waartoe ik gesteld ben als prediker, en apostel, en leraar van de heidenen;", "1 Tess 2:2": "maar hoewel wij eerst geleden hadden, en ons ook smaad was aangedaan, zoals u weet, in Filippi, hebben wij toch vrijmoedigheid gebruikt in onze God, om het Evangelie van God tot u te spreken onder veel strijd.", "Ps 95:5": "Van Hem is ook de zee, want Hij heeft ze gemaakt; en Zijn handen hebben het droge gevormd.", "Amos 4:7-12": "Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Ik heb u geslagen met brandkoren en met honingdauw; de veelheid van uw hoven, en uw wijngaarden, en uw vijgenbomen, en uw olijfbomen at de rups op; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "1 Kor 11:2": "En ik prijs u, broeders, dat u in alles aan mij denkt, en de inzettingen behoudt, zoals ik die u overgegeven heb.", "Deut 13:18": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, om al Zijn geboden te houden, die ik u heden gebied, om te doen wat recht is in de ogen van de HEERE, uw God.", "2 Kron 2:12": "Verder zei Huram: Geloofd zij de HEERE, de God van Israël, Die de hemel en de aarde gemaakt heeft, dat Hij aan de koning David een wijze zoon gegeven heeft, kloek in voorzichtigheid en verstand, die een huis voor de HEERE, en een huis voor zijn koninkrijk zal bouwen!", "Rom 1:22": "terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "1 Petr 4:12-16": "Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam; maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen. Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.", "Job 5:6-11": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde; Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen. Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Hand 17:24-28": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft; En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Job 12:23": "Hij vermenigvuldigt de volken, en verdelgt ze; Hij breidt de volken uit, en leidt ze.", "Hand 6:3": "Zie daarom om, broeders, naar zeven mannen uit uw midden, die een goede naam hebben, vol van de Heilige Geest en van wijsheid, die wij mogen aanstellen over deze taak.", "2 Kor 4:10-12": "Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden. Want wij, die leven, worden altijd om Jezus' wil in de dood overgegeven, opdat ook het leven van Jezus in ons sterfelijk vlees openbaar zou worden. Zo dan, de dood werkt wel in ons, maar het leven in u.", "Jak 5:15": "En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Hand 14:1-6": "En het gebeurde in Ikonium, dat zij samen naar de synagoge van de Joden gingen, en zo spraken, dat een grote menigte, zowel van Joden als Grieken, geloofde. Maar de Joden die ongehoorzaam waren, zetten de heidenen aan en verbitterden hun harten tegen de broeders. Zij bleven dan daar een lange tijd, en spraken vrijmoedig in de Heere, Die getuigenis gaf aan het Woord van Zijn genade, en gaf dat er tekenen en wonderen gebeurden door hun handen.", "Jak 5:14": "Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere.", "1 Kor 14:26": "Wat is het dan, broeders? Wanneer u samenkomt, heeft ieder van u een psalm, heeft een leer, heeft een vreemde taal, heeft een openbaring, heeft een uitleg; laat alle dingen gebeuren tot stichting;", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "Hand 22:24-30": "beval de leider hen hem naar de legerplaats te brengen, en zei dat men hem met geselen zou ondervragen, opdat hij te weten kon komen om welke reden zij zo tegen hem riepen. En toen zij hem met de riemen vastbonden om hem te geselen, zei Paulus tegen de hoofdman over honderd die daar stond: Is het u geoorloofd een Romeins burger, en dat nog wel iemand die niet veroordeeld is, te geselen? Toen de hoofdman over honderd dat hoorde, ging hij naar de leider en meldde het hem, en zei: Kijk uit wat u doet, want deze man is een Romein.", "Luk 22:28": "En u bent degenen die met Mij steeds gebleven zijn in Mijn beproevingen.", "Hand 13:1-3": "In Antiochië waren, in de gemeente die daar was, enkele profeten en leraars, namelijk Barnabas, en Simeon, genaamd Niger, en Lucius van Cyrene, en Manahen, die met Herodes de viervorst opgevoed was, en Saulus. En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb. Toen vastten en baden zij, en nadat zij hun de handen opgelegd hadden, lieten zij hen gaan.", "Matt 9:29": "Toen raakte Hij hun ogen aan en zei: U geschiedt naar uw geloof.", "Ps 128:2-6": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel. Zie, zo zal die man zeker gezegend worden, die de HEERE vreest.", "Hos 2:21": "En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.", "Kol 1:25": "waarvan ik een dienaar geworden ben, naar de bedeling van God die mij gegeven is voor u, om het Woord van God te vervullen;", "Gen 9:1-3": "En God zegende Noach en zijn zonen, en Hij zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde! En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven. Alles wat zich beweegt, dat leeft, zal u tot voedsel zijn; Ik heb het u allemaal gegeven, zoals het groene kruid.", "1 Petr 5:9": "Weersta hem, vast staand in het geloof, in de wetenschap dat hetzelfde lijden wordt volbracht aan uw broederschap die in de wereld is.", "Matt 8:10": "Toen Jezus dit hoorde, verwonderde Hij Zich, en zei tegen hen die Hem volgden: Voorwaar, Ik zeg u, Ik heb zelfs in Israël zo'n groot geloof niet gevonden.", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Hand 16:10": "Toen hij nu dit visioen gezien had, zochten wij meteen naar Macedonië te reizen, omdat wij daaruit opmaakten dat de Heere ons geroepen had om hun het Evangelie te verkondigen.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Matt 13:54": "En toen Hij in Zijn vaderstad gekomen was, leerde Hij hen in hun synagoge, zodat zij versteld stonden en zeiden: Waar komt bij Deze die wijsheid en die krachten vandaan?", "Ps 78:52-55": "En Hij voerde Zijn volk als schapen, en leidde hen, als een kudde, door de woestijn. Ja, Hij leidde hen zeker, zodat zij niet vreesden; want de zee had hun vijanden overdekt. En Hij bracht hen tot het gebied van Zijn heiligheid, tot deze berg, die Zijn rechterhand verkregen heeft.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Luk 16:16": "De wet en de profeten zijn tot op Johannes; van die tijd af wordt het Koninkrijk van God verkondigd, en ieder doet geweld op datzelfde.", "Joh 5:5": "En daar was een zeker mens, die achtendertig jaar ziek geweest was.", "Ef 4:14": "Opdat wij niet meer kinderen zouden zijn, die heen en weer bewogen en meegevoerd worden met elke wind van leer, door het bedrog van de mensen, door arglistigheid, om listig tot dwaling te brengen;", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Mark 7:26": "Deze vrouw nu was een Griekse, afkomstig uit Syro-Fenicië; en zij smeekte Hem dat Hij de duivel uit haar dochter zou uitdrijven.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Ps 31:7": "Ik haat hen die op valse ijdelheden acht slaan, en ik vertrouw op de HEERE.", "Mark 1:41": "En Jezus, met innerlijke ontferming bewogen, strekte Zijn hand uit, raakte hem aan, en zei tegen hem: Ik wil het, word gereinigd!", "Ps 104:31": "De heerlijkheid van de HEERE zij tot in eeuwigheid; de HEERE verblijde Zich in Zijn werken.", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "2 Kron 25:15": "Toen ontstak de toorn van de HEERE tegen Amazia; en Hij zond tot hem een profeet, die tegen hem zei: Waarom hebt u de goden van dat volk gezocht, die hun eigen volk niet gered hebben uit uw hand?", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Matt 10:34-36": "Meent niet dat Ik gekomen ben om vrede te brengen op de aarde; Ik ben niet gekomen om vrede te brengen, maar het zwaard. Want Ik ben gekomen om de mens tweedrachtig te maken tegen zijn vader, en de dochter tegen haar moeder, en de schoondochter tegen haar schoonmoeder. En zij zullen de vijanden van de mens worden, die zijn huisgenoten zijn.", "1 Tim 3:1-13": "Dit is een betrouwbaar woord: als iemand ernaar verlangt opziener te worden, begeert hij een voortreffelijk werk. Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren; niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Hand 2:1-42": "En toen de dag van het Pinksterfeest vervuld werd, waren zij allen eendrachtig bijeen. En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen.", "Hebr 6:12": "opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.", "Ps 127:1-5": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs. Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap. Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Job 10:8": "Uw handen doen mij pijn aan, hoewel zij mij gemaakt hebben, samen rondom mij zijn zij, en U verslindt mij.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!", "Rom 8:33-35": "Wie zal een beschuldiging inbrengen tegen de uitverkorenen van God? God is het Die rechtvaardigt. Wie is het die veroordeelt? Christus is het Die gestorven is; ja, meer nog, Die ook opgewekt is, Die ook aan de rechterhand van God is, Die ook voor ons bidt. Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard?", "Spr 11:10": "Een stad springt op van vreugde over het welvaren van de rechtvaardigen; en als de goddelozen vergaan, is er gejuich.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Deut 8:1-10": "Alle geboden die ik u vandaag gebied, moet u nauwkeurig opvolgen, opdat u leeft en meer wordt, en het land binnengaat en erft, dat de HEERE aan uw vaderen gezworen heeft. En u zult denken aan heel de weg, die de HEERE, uw God, u deze veertig jaar in de woestijn geleid heeft; opdat Hij u verootmoedigt, om u te beproeven, om te weten wat in uw hart was, of u Zijn geboden zou houden, of niet. En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "1 Kon 16:13": "Om al de zonden van Baësa, en de zonden van Ela, zijn zoon, waarmee zij gezondigd hadden, en waarmee zij Israël hadden doen zondigen, en de HEERE, de God van Israël, tot toorn verwekten door hun nietige afgoden.", "Mark 13:19": "Want die dagen zullen zo'n verdrukking zijn, zoals er niet geweest is vanaf het begin van de schepping die God geschapen heeft, tot nu toe, en er ook niet meer zal zijn.", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "Ps 103:22": "Loof de HEERE, al Zijn werken! Aan alle plaatsen van Zijn heerschappij. Loof de HEERE, mijn ziel!", "Hand 12:23": "En meteen sloeg hem een engel van de Heere, omdat hij God de eer niet gaf; en hij werd door de wormen opgegeten, en gaf de geest.", "1 Tess 2:16": "en ons verhinderen tot de heidenen te spreken, opdat zij behouden worden; zodat zij altijd de maat van hun zonden vol maken. En de toorn is over hen gekomen tot het einde.", "Spr 15:6": "In het huis van de rechtvaardige is een grote schat; maar in de inkomst van de goddeloze is opschudding.", "Hand 18:4": "En hij sprak op elke sabbat in de synagoge, en bracht Joden en Grieken tot geloof.", "Ps 115:8": "Laat wie hen maken, hun gelijk worden, en ieder die op hen vertrouwt.", "Matt 10:29": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader.", "1 Tess 2:8-11": "zo hebben wij, omdat wij zeer aan u gehecht waren, u graag niet alleen het Evangelie van God willen geven, maar ook onze eigen zielen, omdat u ons lief geworden was. Want u herinnert zich, broeders, onze inspanning en moeite; want terwijl wij nacht en dag werkten, om niemand van u tot last te zijn, hebben wij het Evangelie van God onder u gepredikt. U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben.", "Jes 44:9": "De formeerders van gesneden beelden zijn allemaal samen ijdelheid, en hun gewenste dingen doen geen nut; ja, zijzelf zijn hun getuigen; zij zien niet, en zij weten niet, daarom zullen zij beschaamd worden.", "Hand 17:1-13": "En nadat zij door Amfipolis en Apollonia hun weg genomen hadden, kwamen zij te Thessalonica, waar een synagoge van de Joden was. En Paulus ging, zoals hij gewoon was, bij hen naar binnen, en drie sabbatten lang sprak hij met hen uit de Schriften, En legde ze uit, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus is, Die ik, zei hij, u verkondig.", "Hand 19:10": "En dit gebeurde twee jaar lang, zodat allen die in Azië woonden het Woord van de Heere Jezus hoorden, zowel Joden als Grieken.", "1 Tess 3:4": "Want ook toen wij bij u waren, zeiden wij u van tevoren dat wij verdrukt zouden worden, zoals ook gebeurd is, en u weet het.", "Joz 3:10": "Verder zei Jozua: Hieraan zult u weten dat de levende God in uw midden is, en dat Hij helemaal voor uw aangezicht zal verdrijven de Kanaänieten, en de Hethieten, en de Hevieten, en de Ferezieten, en de Girgazieten, en de Amorieten en de Jebusieten.", "Ps 113:6-9": "Die zeer laag ziet, in de hemel en op de aarde. Die de arme uit het stof opricht, en de behoeftige uit de vuilnis verhoogt; Om hem te doen zitten bij de vorsten, bij de vorsten van Zijn volk.", "Hand 6:6": "hen stelden zij voor de apostelen; en die legden, na gebeden te hebben, hun de handen op.", "Hand 21:13": "Maar Paulus antwoordde: Wat doet u, dat u weent en mijn hart week maakt? Want ik ben bereid niet alleen gebonden te worden, maar ook te sterven te Jeruzalem, voor de Naam van de Heere Jezus.", "Hand 17:24-26": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft; En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Hand 13:50": "Maar de Joden zetten de godsdienstige en aanzienlijke vrouwen op, en de voornaamsten van de stad, en verwekten vervolging tegen Paulus en Barnabas, en verdreven hen uit hun gebied.", "Deut 8:15-18": "Die u geleid heeft in die grote en angstaanjagende woestijn, waar vurige slangen, en schorpioenen, en droogte waren, waar geen water was; Die u water uit de keiharde rots liet komen; Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed; En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven.", "Hand 1:15": "En in diezelfde dagen stond Petrus op te midden van de discipelen, en zei (er was nu een menigte bijeen van ongeveer honderdtwintig personen):", "Rom 11:17-21": "En als enige van de takken afgebroken zijn, en u, een wilde olijfboom zijnde, in hun plaats bent ingeënt, en van de wortel en van de vettigheid van de olijfboom mede deelachtig bent geworden, Roem dan niet tegen de takken; en als u daartegen roemt, u draagt de wortel niet, maar de wortel u. U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden.", "Ps 90:2": "Eer de bergen geboren waren, en U de aarde en de wereld voortgebracht had, ja, van eeuwigheid tot eeuwigheid bent U God.", "Ps 74:16": "De dag is van U, ook is de nacht van U; U hebt het licht en de zon bereid.", "Hand 17:16": "En terwijl Paulus hen te Athene verwachtte, werd zijn geest in hem geprikkeld, toen hij zag dat de stad zo vol afgoden was.", "Joël 2:23": "En u, kinderen van Sion! verheugt u en weest blijde in de HEERE, uw God; want Hij zal u die Leraar ter gerechtigheid geven; en Hij zal u de regen doen neerdalen, de vroege regen en de late regen in de eerste maand.", "Matt 6:7": "En als u bidt, gebruik dan geen zinloze herhaling van woorden, zoals de heidenen; want zij menen dat zij vanwege hun veelheid van woorden verhoord zullen worden.", "Ps 102:26": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen;", "2 Kor 12:17-19": "Heb ik door iemand van hen die ik naar u toe gezonden heb, van u mijn voordeel gezocht? Ik heb Titus gevraagd, en de broeder meegezonden; heeft ook Titus van u zijn voordeel gezocht? Hebben wij niet in dezelfde geest gewandeld? Hebben wij niet in dezelfde voetstappen gewandeld? Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw.", "Jer 2:28": "Waar zijn dan uw goden, die u zich gemaakt hebt? Laat ze opstaan, of zij u ten tijde van uw kwaad zullen verlossen; want naar het getal van uw steden zijn uw goden, Juda!", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Ps 147:9": "Die het vee zijn voer geeft; aan de jonge raven, als zij roepen.", "Ps 37:28": "Want de HEERE heeft het recht lief, en zal Zijn gunstgenoten niet verlaten; in eeuwigheid worden zij bewaard; maar het nageslacht van de goddelozen wordt uitgeroeid.", "Joh 12:50": "En Ik weet dat Zijn gebod het eeuwige leven is. Wat Ik dan spreek, dat spreek Ik zoals de Vader Mij gezegd heeft.", "Mark 16:20": "En zij gingen heen, en predikten overal, en de Heere werkte mee, en bevestigde het Woord door tekenen die daarop volgden. Amen.", "2 Tim 1:8": "Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Ps 145:18": "Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid.", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Luk 13:10": "En Hij gaf onderwijs op de sabbat in een van de synagogen.", "1 Tess 1:5": "Want ons Evangelie is bij u niet alleen met woorden gekomen, maar ook met kracht, en met de Heilige Geest, en met veel zekerheid; zoals u weet wat voor mensen wij bij u geweest zijn, ter wille van u.", "Ef 6:15": "en de voeten geschoeid met bereidheid van het Evangelie van de vrede;", "Jes 41:23": "Verkondig de dingen die hierna komen zullen, opdat wij weten dat u goden bent; ja, doe goed, of doe kwaad, zodat wij verbaasd staan, en samen toezien.", "Jer 51:17": "Ieder mens is redeloos geworden, zodat hij geen kennis heeft; iedere goudsmid is beschaamd over het gesneden beeld; want zijn gegoten beeld is leugen, en er is geen geest in hen.", "Job 39:8": "Wie heeft de woudezel vrij heengezonden, en wie heeft de banden van de wilde ezel gelost?", "1 Kron 29:14": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.", "Jer 10:11": "(Zo zult u tegen hen zeggen: De goden, die de hemel en de aarde niet gemaakt hebben, zullen vergaan van de aarde, en van onder deze hemel.)", "1 Kron 28:8": "Welnu, voor de ogen van heel Israël, de gemeente van de HEERE, en voor de oren van onze God: houd en zoek al de geboden van de HEERE, uw God; opdat u dit goede land erfelijk bezit, en het na u nalaat als erfenis aan uw kinderen tot in eeuwigheid.", "Openb 11:7-12": "En wanneer zij hun getuigenis geëindigd hebben, zal het beest, dat uit de afgrond opkomt, oorlog tegen hen voeren, en het zal hen overwinnen, en zal hen doden. En hun dode lichamen zullen liggen op de straat van de grote stad, die geestelijk genoemd wordt Sodom en Egypte, waar ook onze Heere gekruisigd is. En de mensen uit de volken, en geslachten, en talen, en naties, zullen hun dode lichamen zien, drie dagen en een halve, en zullen niet toelaten dat hun dode lichamen in graven gelegd worden.", "Luk 22:35": "En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.", "2 Kon 3:13": "Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.", "Joh 5:26": "Want zoals de Vader het leven heeft in Zichzelf, zo heeft Hij ook de Zoon gegeven het leven te hebben in Zichzelf;", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "Mark 16:15": "En Hij zei tegen hen: Ga heen in de hele wereld, predik het Evangelie aan alle schepselen.", "Luk 22:24-30": "En er ontstond ook twist onder hen, wie van hen scheen de meeste te zijn. En Hij zei tegen hen: De koningen van de volken heersen over hen; en zij die macht over hen hebben, worden weldoeners genoemd. Maar u niet zo; maar de meeste onder u moet worden als de minste, en wie voorganger is, als iemand die dient.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Hand 17:13": "Maar toen de Joden van Thessalonica te weten kwamen dat het Woord van God ook te Berea door Paulus verkondigd werd, kwamen zij ook daar en zetten de menigten aan tot onrust.", "2 Tess 3:7-9": "Want u zelf weet hoe men ons behoort na te volgen; want wij hebben ons niet ongeregeld gedragen onder u; En wij hebben geen brood bij iemand gegeten voor niets, maar in arbeid en moeite, nacht en dag werkend, opdat wij niemand van u lastig zouden zijn; Niet dat wij de macht niet hebben, maar opdat wij onszelf u zouden geven tot een voorbeeld, om ons na te volgen.", "2 Kor 7:6": "Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus.", "Hand 20:28-32": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed. Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen. En uit uzelf zullen mannen opstaan, die verkeerde dingen spreken, om de discipelen achter zich aan te trekken.", "1 Kor 10:20": "Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen.", "Luk 13:6-9": "En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit? En hij antwoordde en zei tegen hem: Heer, laat hem ook dit jaar nog staan, totdat ik om hem heen gegraven en mest gelegd zal hebben;", "Kol 2:7": "Geworteld en opgebouwd in Hem, en bevestigd in het geloof, zoals u geleerd bent, overvloedig zijnde daarin, met dankzegging.", "Jes 37:1": "Het gebeurde nu, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde, en zich met een zak bedekte, en het huis van de HEERE inging.", "Openb 3:5": "Wie overwint, die zal bekleed worden met witte kleren; en Ik zal zijn naam beslist niet uitwissen uit het boek van het leven, en Ik zal zijn naam belijden voor Mijn Vader en voor Zijn engelen.", "Fil 1:20": "Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood.", "Ezra 9:5": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God;", "Job 10:3": "Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft?", "1 Petr 5:12": "Door Silvanus, die u een trouwe broeder is, zoals ik meen, heb ik u in het kort geschreven, u vermanend en u ervan verzekerend dat dit de ware genade van God is, waarin u staat.", "Ps 37:25": "Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "1 Kor 8:6": "toch hebben wij maar één God, de Vader, uit Wie alle dingen zijn, en wij tot Hem; en maar één Heere, Jezus Christus, door Wie alle dingen zijn, en wij door Hem.", "1 Kor 14:33": "Want God is geen God van verwarring, maar van vrede, zoals in al de Gemeenten der heiligen.", "1 Tess 4:4": "Dat ieder van u weet zijn eigen lichaam te bezitten in heiliging en eer;", "Ps 37:22": "Want zijn gezegenden zullen de aarde erfelijk bezitten; maar zijn vervloekten zullen uitgeroeid worden.", "1 Kron 22:13": "Dan zult u voorspoedig zijn, als u erop toeziet om te doen de inzettingen en de rechten die de HEERE aan Mozes geboden heeft over Israël. Wees sterk en heb goede moed, wees niet bevreesd, en wees niet verslagen!", "2 Kor 1:17-19": "Toen ik dit dan van plan was, heb ik dan lichtvaardig gehandeld? Of neem ik mijn voornemens naar het vlees, zodat bij mij zou zijn: ja, ja, en nee, nee? Maar God is getrouw: ons woord aan u is niet ja en nee geweest. Want de Zoon van God, Jezus Christus, Die onder u door ons gepredikt is, namelijk door mij, en Silvanus, en Timotheüs, was niet ja en nee, maar is geweest ja in Hem.", "Jer 51:16": "Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "1 Kor 11:1": "Wees mijn navolgers, zoals ik ook navolger ben van Christus.", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Hand 22:21": "En Hij zei tegen mij: Ga heen; want Ik zal u ver weg zenden, naar de heidenen.", "Rom 15:19": "door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "2 Tim 1:3": "Ik dank God, aan Wie ik dien vanaf mijn voorouders met een rein geweten, zoals ik zonder ophouden aan u denk in mijn gebeden, nacht en dag;", "Hand 10:26": "Maar Petrus richtte hem op, en zei: Sta op, ik ben zelf ook maar een mens.", "Jes 65:23": "Zij zullen niet tevergeefs arbeiden, noch baren voor verstoring; want zij zijn het nageslacht van de gezegenden van de HEERE, en hun nakomelingen met hen.", "Rom 2:1-15": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen. En wij weten dat het oordeel van God naar waarheid is, over hen die zulke dingen doen. En denkt u dit, o mens, die hen oordeelt die zulke dingen doen, en dat zelf ook doet, dat u het oordeel van God zult ontvluchten?", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "Jer 10:14": "Ieder mens is redeloos geworden, zodat hij geen kennis heeft, iedere goudsmid is beschaamd van het gesneden beeld; want zijn gegoten beeld is leugen; en er is geen geest in hen.", "Hand 14:1-7": "En het gebeurde in Ikonium, dat zij samen naar de synagoge van de Joden gingen, en zo spraken, dat een grote menigte, zowel van Joden als Grieken, geloofde. Maar de Joden die ongehoorzaam waren, zetten de heidenen aan en verbitterden hun harten tegen de broeders. Zij bleven dan daar een lange tijd, en spraken vrijmoedig in de Heere, Die getuigenis gaf aan het Woord van Zijn genade, en gaf dat er tekenen en wonderen gebeurden door hun handen.", "1 Kon 16:26": "En hij wandelde in alle wegen van Jerobeam, de zoon van Nebat, en in zijn zonden, waarmee hij Israël had doen zondigen, en verwekte de HEERE, de God van Israël, tot toorn, door hun nietige afgoden.", "Mark 14:70": "Maar hij ontkende het weer. En kort daarna zeiden zij die daarbij stonden weer tegen Petrus: Werkelijk, u bent een van hen; want u bent ook een Galileeër, en uw spraak lijkt erop.", "1 Tess 2:13": "Daarom danken wij ook God zonder ophouden, dat u, toen u het Woord van de prediking van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.", "2 Kor 11:7": "Heb ik zonde gedaan, toen ik mijzelf vernederd heb opdat u verhoogd zou worden, omdat ik u het Evangelie van God om niet verkondigd heb?", "Gal 4:11": "Ik ben bang voor u, dat ik niet misschien tevergeefs onder u gearbeid heb.", "Mark 9:23": "En Jezus zei tegen hem: Als u kunt geloven, zijn alle dingen mogelijk voor hem die gelooft.", "Deut 5:7": "U zult geen andere goden voor Mijn aangezicht hebben.", "Ps 104:1-35": "Loof de HEERE, mijn ziel! O HEERE, mijn God! U bent zeer groot, U bent bekleed met majesteit en heerlijkheid. Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn. Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Hand 16:2": "Deze had een goed getuigenis van de broeders in Lystre en Ikonium.", "Hand 24:14-25": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is; Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen. En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Gen 37:29": "Toen Ruben nu naar de kuil terugkeerde, zie, Jozef was niet meer in de kuil; toen scheurde hij zijn kleren.", "Job 29:5": "Toen de Almachtige nog met mij was, en mijn jongens rondom mij;", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "2 Kor 4:3": "Maar als ons Evangelie ook bedekt is, dan is het bedekt bij hen die verloren gaan;", "Joh 16:1": "Deze dingen heb Ik tot u gesproken, opdat u niet geërgerd wordt.", "Rom 5:2": "Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God.", "Joh 15:10": "Als u Mijn geboden bewaart, dan zult u in Mijn liefde blijven; zoals Ik de geboden van Mijn Vader bewaard heb, en blijf in Zijn liefde.", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Joh 12:20": "En er waren enkele Grieken onder hen die opgegaan waren om op het feest te aanbidden;", "2 Kor 10:14-16": "Want wij strekken onszelf niet te wijd uit, alsof wij u niet zouden bereiken; want wij zijn ook tot u toe gekomen, in het Evangelie van Christus; Niet roemend buiten de maat over de arbeid van andere mensen, maar hebbende de hoop dat, als uw geloof meer wordt, wij onder u overvloedig vergroot zullen worden naar onze regel; Om het Evangelie te verkondigen in de gebieden die verder weg liggen dan u; niet om te roemen op de regel van iemand anders over wat al gereed is.", "Neh 8:2-9": "verzamelde het hele volk zich als één man op het plein voor de Waterpoort; en zij zeiden tegen Ezra, de schriftgeleerde, dat hij het boek van de wet van Mozes zou halen, die de HEERE aan Israël geboden had. En Ezra, de priester, bracht de wet voor de gemeente, zowel mannen als vrouwen, en allen die het konden begrijpen als zij het hoorden, op de eerste dag van de zevende maand. En hij las eruit voor op het plein dat voor de Waterpoort is, vanaf het morgenlicht tot de middag, ten overstaan van de mannen en vrouwen en hen die het konden begrijpen; en de oren van heel het volk waren gericht op het wetboek.", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Hand 23:11-35": "En de volgende nacht stond de Heere bij hem en zei: Heb goede moed, Paulus, want zoals u in Jeruzalem van Mij getuigd hebt, zo moet u ook in Rome getuigen. En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben. En het waren er meer dan veertig die deze eed samen hadden afgelegd.", "Matt 4:23": "En Jezus trok rond door heel Galilea, en Hij onderwees in hun synagogen en predikte het Evangelie van het Koninkrijk, en genas alle ziekte en alle kwaal onder het volk.", "Pred 3:11": "Hij heeft ieder ding mooi gemaakt op zijn tijd; ook heeft Hij de eeuw in hun hart gelegd, zonder dat een mens het werk, dat God gemaakt heeft, kan doorgronden, van het begin tot het einde toe.", "Matt 10:1": "Toen Hij Zijn twaalf discipelen bij Zich geroepen had, gaf Hij hun macht over de onreine geesten, om ze uit te werpen, en om alle ziekte en alle kwaal te genezen.", "Dan 6:21-23": "Toen hij nu bij de kuil gekomen was, riep hij naar Daniël met droevige stem; de koning antwoordde en zei tegen Daniël: O Daniël, dienaar van de levende God! heeft ook uw God, Die u voortdurend eert, u uit de macht van de leeuwen kunnen verlossen? Toen sprak Daniël tegen de koning: O koning, leef voor eeuwig! Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Ps 118:14": "De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.", "Matt 19:8": "Hij zei tegen hen: Mozes heeft vanwege de hardheid van uw harten u toegestaan uw vrouwen te verlaten; maar van het begin af is het zo niet geweest.", "Joh 17:7": "Nu weten zij, dat alles wat U Mij gegeven hebt, van U is.", "Gen 49:11": "Hij bindt zijn jonge ezel aan de wijnstok, en het veulen van zijn ezelin aan de edelste wijnstok; hij wast zijn kleed in de wijn, en zijn mantel in wijndruivenbloed.", "2 Kor 2:12": "Verder, toen ik in Troas kwam om het Evangelie van Christus te prediken, en mij daar een deur geopend was in de Heere, had ik geen rust voor mijn geest, omdat ik mijn broeder Titus niet vond;", "Hebr 2:4": "terwijl God erbij getuigde door tekenen en wonderen, en allerlei krachten en gaven van de Heilige Geest, naar Zijn wil.", "1 Kon 18:21": "Toen naderde Elia tot heel het volk, en zei: Hoe lang hinkt u op twee gedachten? Als de HEERE God is, volg Hem na, en als het Baäl is, volg hem na! Maar het volk antwoordde hem geen woord.", "Spr 10:27": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "2 Tim 2:1": "U dan, mijn zoon, word gesterkt in de genade die in Christus Jezus is;", "Hebr 10:19": "Omdat wij dan, broeders, vrijmoedigheid hebben om in te gaan in het heiligdom door het bloed van Jezus,", "2 Kor 11:31-33": "De God en Vader van onze Heere Jezus Christus, Die geprezen is tot in eeuwigheid, weet dat ik niet lieg. De stadhouder van koning Aretas bezette in Damaskus de stad van de Damaskenen, met de bedoeling mij te vangen; En ik werd door een venster in een mand over de muur neergelaten, en ontkwam aan zijn handen.", "1 Petr 1:25": "maar het Woord van de Heere blijft in eeuwigheid. En dit is het Woord dat onder u verkondigd is.", "2 Kon 19:1": "En het gebeurde, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde en zich met een zak bedekte, en naar het huis van de HEERE ging.", "Hand 20:34": "En u weet zelf, dat deze handen gediend hebben voor mijn behoeften, en voor die van hen die met mij waren.", "1 Kor 1:8": "Die God u ook zal bevestigen tot het einde toe, om onberispelijk te zijn in de dag van onze Heere Jezus Christus.", "Hand 15:21": "Want Mozes heeft van oude tijden af in elke stad mensen die hem prediken, en hij wordt elke sabbat in de synagogen gelezen.", "Hand 13:51": "Doch zij schudden het stof van hun voeten tegen hen af, en kwamen te Ikonium.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Openb 10:6": "En hij zwoer bij Hem Die leeft in alle eeuwigheid, Die de hemel geschapen heeft en wat daarin is, en de aarde en wat daarin is, en de zee en wat daarin is, dat er geen tijd meer zal zijn;", "Deut 28:7": "De HEERE zal geven dat uw vijanden, die tegen u opstaan, verslagen worden voor uw ogen; door één weg zullen zij tegen u uittrekken, maar door zeven wegen zullen zij voor u vluchten.", "Hand 15:30": "Zij dan, hun afscheid ontvangen hebbend, kwamen in Antiochië; en nadat zij de menigte hadden samengeroepen, gaven zij de brief af.", "Neh 8:11": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte.", "Ezra 9:3-5": "Toen ik deze zaak hoorde, scheurde ik mijn kleed en mijn mantel; en ik trok het haar van mijn hoofd en van mijn baard uit, en zat verbaasd neer. Toen verzamelden zich bij mij allen die voor de woorden van de God van Israël beefden, om de overtreding van de weggevoerden; maar ik bleef verbaasd zitten tot aan het avondoffer. En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God;", "Joh 14:6": "Jezus zei tegen hem: Ik ben de Weg, en de Waarheid, en het Leven. Niemand komt tot de Vader dan door Mij.", "Hand 17:28": "Want in Hem leven wij, en bewegen wij ons, en zijn wij; zoals ook enkelen van uw eigen dichters gezegd hebben: Want wij zijn ook Zijn geslacht.", "Ps 68:20": "Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela.", "Matt 6:19-21": "Verzamel voor uzelf geen schatten op de aarde, waar de mot en de roest ze verderven, en waar de dieven inbreken en stelen; maar verzamel voor uzelf schatten in de hemel, waar mot noch roest ze verderft, en waar dieven niet inbreken of stelen; want waar uw schat is, daar zal ook uw hart zijn.", "Joh 6:31": "Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten.", "Ps 52:3": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag.", "1 Kor 15:31": "Ik sterf elke dag, dat verzeker ik u bij de roem over u die ik heb in Christus Jezus, onze Heere.", "Openb 3:7": "En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:", "Hand 28:30": "En Paulus bleef twee volle jaren in zijn eigen gehuurde woning; en ontving allen die naar hem toe kwamen;", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "Rom 1:5-7": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam; onder wie u ook bent, geroepenen van Jezus Christus!) Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Ps 8:2-10": "O HEERE, onze Heere! Hoe heerlijk is Uw Naam op de hele aarde! U, die Uw majesteit boven de hemelen gesteld hebt. Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden. Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "Matt 20:17": "En Jezus, op weg naar Jeruzalem, nam de twaalf discipelen apart onderweg, en zei tegen hen:", "Hand 15:30-36": "Zij dan, hun afscheid ontvangen hebbend, kwamen in Antiochië; en nadat zij de menigte hadden samengeroepen, gaven zij de brief af. En toen zij die gelezen hadden, verblijdden zij zich over de bemoediging. Judas nu en Silas, die zelf ook profeten waren, bemoedigden de broeders met veel woorden, en versterkten hen.", "1 Kron 29:16": "HEERE, onze God, al deze overvloed die wij klaargemaakt hebben om U een huis te bouwen, voor de Naam van Uw heiligheid, dat komt van Uw hand, en het is alles van U.", "Deut 2:7": "Want de HEERE, uw God, heeft u gezegend in al het werk van uw hand; Hij kent uw wandelen door deze zo grote woestijn; deze veertig jaren is de HEERE, uw God, met u geweest; niets heeft u ontbroken.", "Hos 12:7": "U dan, bekeer u tot uw God, bewaar goedertierenheid en recht, en wacht voortdurend op uw God.", "Luk 10:24": "Want Ik zeg u dat veel profeten en koningen verlangd hebben te zien wat u ziet, en het niet gezien hebben; en te horen wat u hoort, en het niet gehoord hebben.", "Rom 9:1-3": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "Lev 26:4-6": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Joh 18:36": "Jezus antwoordde: Mijn Koninkrijk is niet van deze wereld. Als Mijn Koninkrijk van deze wereld was, zouden Mijn dienaren gestreden hebben, zodat Ik niet aan de Joden overgeleverd zou zijn; maar nu is Mijn Koninkrijk niet van hier.", "2 Kon 11:14": "En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad!", "Jes 55:10": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;", "1 Kor 9:6": "Of hebben alleen ik en Barnabas geen macht om niet te werken?", "Ps 116:1-15": "Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen; want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen. De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "1 Kor 5:4": "In de Naam van onze Heere Jezus Christus, wanneer u en mijn geest samen vergaderd zijn, met de kracht van onze Heere Jezus Christus,", "Ps 104:2": "Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn.", "Hand 11:18": "En toen zij dit hoorden, waren zij tevreden, en verheerlijkten God, en zeiden: Zo heeft God dan ook aan de heidenen de bekering gegeven tot leven!", "Rom 3:25": "Hem heeft God voorgesteld tot een verzoening, door het geloof in Zijn bloed, tot een betoning van Zijn gerechtigheid, door de vergeving van de zonden die eerder gebeurd zijn, tijdens de verdraagzaamheid van God;", "1 Kron 22:9": "Zie, de zoon die u geboren zal worden, die zal een man van rust zijn, want Ik zal hem rust geven van al zijn vijanden rondom; want zijn naam zal Salomo zijn, en Ik zal vrede en rust over Israël geven in zijn dagen.", "Matt 6:30-33": "Als God nu het gras van het veld, dat er vandaag is en morgen in de oven geworpen wordt, zo kleedt, zal Hij u niet veel meer kleden, kleingelovigen? Wees daarom niet bezorgd en zeg niet: Wat zullen wij eten, of wat zullen wij drinken, of waarmee zullen wij ons kleden? Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt.", "Openb 15:4": "Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Gen 2:16": "En de HEERE God gebood de mens en zei: Van elke boom van deze hof mag u vrijelijk eten;", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "Ps 106:20": "En zij veranderden hun Eer in de gedaante van een os, die gras eet.", "Job 29:19": "Mijn wortel was uitgebreid tot aan het water, en dauw vernachtte op mijn tak.", "Joz 24:15": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!", "Luk 2:10-14": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal; namelijk dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David. En dit zal voor u het teken zijn: u zult het Kindje vinden in doeken gewonden, en liggend in de kribbe.", "Hand 14:19-22": "Maar daarna kwamen er Joden van Antiochië en Ikonium, en zij overreedden de menigten, en stenigden Paulus, en sleepten hem de stad uit, in de mening dat hij dood was. Maar toen de discipelen om hem heen kwamen staan, stond hij op en ging de stad in; en de volgende dag vertrok hij met Barnabas naar Derbe. En toen zij in die stad het Evangelie verkondigd hadden en veel discipelen gemaakt hadden, keerden zij terug naar Lystre, en Ikonium, en Antiochië,", "Hand 13:43": "En toen de synagoge uiteengegaan was, volgden velen van de Joden en van de godsdienstige Jodengenoten Paulus en Barnabas; die tot hen spraken en hen aanspoorden te blijven bij de genade van God.", "Rom 10:12": "Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen.", "Hand 21:20-22": "En toen zij dat gehoord hadden, loofden zij de Heere en zeiden tegen hem: U ziet, broeder, hoeveel duizenden Joden er zijn die geloven; en zij zijn allen ijveraars voor de wet. En zij hebben over u gehoord dat u alle Joden die onder de heidenen zijn, leert om van Mozes af te vallen, en zegt dat zij hun kinderen niet moeten besnijden, en ook niet volgens de gewoonten¹ moeten leven. Wat is er dan te doen? Het is beslist nodig dat de menigte samenkomt; want zij zullen horen dat u gekomen bent.", "Hand 14:12-18": "En zij noemden Barnabas Jupiter, en Paulus Mercurius, omdat hij het woord voerde. En de priester van Jupiter, die vóór hun stad was, bracht ossen en kransen naar de poorten, en wilde offeren samen met de menigten. Maar toen de apostelen Barnabas en Paulus dit hoorden, scheurden zij hun kleren, en sprongen onder de menigte, en riepen:", "Matt 6:6": "Maar u, wanneer u bidt, ga in uw binnenkamer, en sluit uw deur, en bid tot uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "Hand 17:1": "En nadat zij door Amfipolis en Apollonia hun weg genomen hadden, kwamen zij te Thessalonica, waar een synagoge van de Joden was.", "Job 8:6": "als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Ps 23:5": "U richt de tafel voor mij aan, tegenover mijn tegenstanders; U maakt mijn hoofd vet met olie, mijn beker vloeit over.", "Rom 8:38": "Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal,", "Hand 13:13": "En Paulus, en zij die met hem waren, van Pafos afgevaren, kwamen te Perge, een stad in Pamfylië. Maar Johannes scheidde zich van hen af en keerde terug naar Jeruzalem.", "Matt 10:22": "En u zult door allen gehaat worden om Mijn Naam; maar wie volhardt tot het einde, die zal behouden worden.", "Hand 13:2": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.", "Hand 16:1": "En hij kwam in Derbe en Lystre. En zie, daar was een zekere discipel, met de naam Timotheüs, zoon van een gelovige Joodse vrouw, maar van een Griekse vader;", "1 Kor 15:58": "Daarom, mijn geliefde broeders! Wees standvastig, onwankelbaar, altijd overvloedig in het werk van de Heere, in de wetenschap dat uw arbeid niet tevergeefs is in de Heere.", "Deut 28:8": "De HEERE zal de zegen gebieden, zodat Hij met u is in uw schuren, en in alles waar u uw hand aan slaat; en Hij zal u zegenen in het land dat de HEERE, uw God, u geven zal.", "Jes 40:22": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen;", "1 Kron 29:12": "En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "Ex 32:6": "En zij stonden de volgende dag vroeg op, en offerden brandoffers en brachten dankoffers; en het volk zat neer om te eten en te drinken, daarna stonden zij op om te spelen.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Hand 3:13": "De God van Abraham, en van Izak, en van Jakob, de God van onze vaderen, heeft Zijn Kind Jezus verheerlijkt, Die u hebt overgeleverd en verloochend voor het aangezicht van Pilatus, toen die oordeelde dat men Hem zou loslaten.", "Ef 3:8-11": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen, en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus; opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "1 Tim 2:4": "Die wil dat alle mensen zalig worden en tot kennis van de waarheid komen.", "Rom 9:23": "en opdat Hij de rijkdom van Zijn heerlijkheid bekend zou maken over de vaten van de barmhartigheid, die Hij van tevoren klaargemaakt heeft tot heerlijkheid?", "Jes 46:6": "Zij verkwisten het goud uit de beurs, en wegen het zilver met de weegschaal; zij huren een goudsmid, en die maakt het tot een god, zij knielen neer, ook buigen zij zich daarvoor.", "Ps 86:15": "Maar Gij, Heere! zijt een barmhartig en genadig God, geduldig, en groot van goedertierenheid en waarheid.", "Mal 3:10-12": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn. En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen. En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Luk 7:23": "En zalig is hij die aan Mij niet geërgerd zal worden.", "Deut 11:7": "Want het zijn uw ogen, die al dit grote werk van de HEERE gezien hebben, dat Hij gedaan heeft.", "Joh 15:7": "Als u in Mij blijft, en Mijn woorden in u blijven, dan zult u vragen wat u wilt, en het zal u gebeuren.", "2 Kron 28:22": "Ja, in de tijd toen men hem benauwde, ging hij nog meer overtreden tegen de HEERE; dit was koning Achaz.", "Ps 104:24-30": "Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom. Deze zee, die groot en wijd van omvang is, daarin is het wemelende gedierte, ontelbaar, kleine dieren met grote. Daar varen de schepen, en de Leviathan, die U gevormd hebt om daarin te spelen.", "Jer 32:40": "En Ik zal een eeuwig verbond met hen sluiten, dat Ik Mij van achter hen niet zal afkeren, opdat Ik hun goeddoe; en Ik zal Mijn vrees in hun hart geven, zodat zij niet van Mij afwijken.", "Hebr 13:24": "Groet al uw voorgangers, en alle heiligen. Zij die uit Italië zijn, groeten u.", "Ps 147:14": "Die uw grondgebied in vrede stelt; Hij verzadigt u met het beste van de tarwe.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Job 37:6-24": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui. Dan zegelt Hij de hand van ieder mens toe, opdat elk mens het werk van Hem kent. En het gedierte gaat in de holen, en blijft in zijn schuilplaatsen.", "Ps 100:3": "Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "2 Tim 3:14": "Maar blijft u bij wat u geleerd hebt, en waarvan u verzekerd bent, wetend van wie u het geleerd hebt;", "Hand 15:12": "En heel de menigte zweeg stil, en zij hoorden Barnabas en Paulus vertellen wat grote tekenen en wonderen God door hen onder de heidenen gedaan had.", "Ps 118:5": "Uit de benauwdheid heb ik de HEERE aangeroepen; de HEERE heeft mij verhoord en mij in de ruimte gezet.", "Gen 2:1-25": "Zo zijn de hemel en de aarde voltooid, en heel hun leger. Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had. En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "1 Kor 16:13": "Waakt, staat vast in het geloof, houdt u mannelijk, weest sterk.", "Hand 15:12-31": "En heel de menigte zweeg stil, en zij hoorden Barnabas en Paulus vertellen wat grote tekenen en wonderen God door hen onder de heidenen gedaan had. En nadat dezen zwegen, antwoordde Jakobus en zei: Mannen broeders, hoor mij. Simeon heeft verteld hoe God eerst naar de heidenen omgezien heeft, om uit hen een volk aan te nemen voor Zijn Naam.", "Jes 37:19": "En hebben hun goden in het vuur geworpen, want het waren geen goden, maar het werk van mensenhanden, hout en steen; daarom hebben zij die vernietigd.", "Jer 11:12": "Dan zullen de steden van Juda en de inwoners van Jeruzalem heengaan, en roepen tot de goden aan wie zij wierook gebracht hebben; maar die zullen hen zeker niet kunnen verlossen ten tijde van hun kwaad.", "2 Tess 1:10": "Wanneer Hij gekomen zal zijn om verheerlijkt te worden in Zijn heiligen, en bewonderd te worden in allen die geloven (omdat onze getuigenis onder u geloofd is) op die dag.", "1 Tim 4:14": "Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap.", "Openb 2:11": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, zal van de tweede dood geen schade lijden.", "Mark 4:3-8": "Luister: Zie, een zaaier ging uit om te zaaien. En het gebeurde bij het zaaien, dat het ene deel zaad langs de weg viel; en de vogels van de hemel kwamen en aten het op. En het andere viel op de rotsachtige grond, waar het niet veel aarde had; en het kwam meteen op, omdat het geen diepte van aarde had.", "2 Kron 7:18": "Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst.", "Hand 19:8-10": "En hij ging de synagoge in, en sprak vrijmoedig, drie maanden lang met hen sprekend, en hen aanradend om de zaken van het Koninkrijk van God aan te nemen. Maar toen sommigen verhard werden en ongehoorzaam waren, en kwaadspraken van de weg des Heeren voor de menigte, ging hij bij hen weg, en zonderde de discipelen af, dagelijks sprekend in de school van een zekere Tyrannus. En dit gebeurde twee jaar lang, zodat allen die in Azië woonden het Woord van de Heere Jezus hoorden, zowel Joden als Grieken.", "1 Kor 11:12": "Want zoals de vrouw uit de man is, zo is ook de man door de vrouw; maar alle dingen zijn uit God.", "Mark 10:6": "Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Hand 9:29": "en hij sprak vrijmoedig in de Naam van de Heere Jezus, en hij sprak ook en redetwistte met de Griekssprekende Joden; maar dezen probeerden hem te doden.", "Hand 17:3": "En legde ze uit, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus is, Die ik, zei hij, u verkondig.", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "1 Petr 5:8": "Wees nuchter en waakzaam; want uw tegenstander, de duivel, gaat rond als een brullende leeuw, op zoek naar wie hij zou kunnen verslinden.", "Openb 14:12": "Hier is de volharding van de heiligen; hier zijn zij, die de geboden van God bewaren en het geloof van Jezus.", "Hand 13:5": "En toen zij in Salamis gekomen waren, verkondigden zij het woord van God in de synagogen van de Joden; en zij hadden ook Johannes als dienaar.", "Hand 11:19": "Degenen nu die verstrooid waren door de verdrukking die over Stefanus gebeurd was, trokken het land door tot Fenicië toe, en Cyprus, en Antiochië, en spraken tot niemand het Woord dan alleen tot de Joden.", "1 Kor 15:8": "En ten laatste van allen is Hij ook door mij gezien, als door iemand die ontijdig geboren is.", "Joh 7:35": "De Joden zeiden dan tegen elkaar: Waar zal Deze heengaan, dat wij Hem niet zullen vinden? Zal Hij naar de verstrooide Grieken gaan, en de Grieken leren?", "Gen 49:12": "Hij is roodachtig van ogen door de wijn, en wit van tanden door de melk.", "Deut 13:17": "Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "Gen 11:6": "En de HEERE zei: Zie, zij zijn één volk, en hebben allen dezelfde taal; en dit is het waarmee zij beginnen te doen; maar nu zou niets van wat zij bedacht hebben te doen, hun onmogelijk zijn?", "Kol 2:1": "Want ik wil dat u weet hoe zware strijd ik voor u heb, en voor hen die in Laodicea zijn, en voor allen die mijn gezicht in het vlees niet gezien hebben;", "Micha 7:6": "Want de zoon veracht de vader, de dochter staat op tegen haar moeder, de schoondochter tegen haar schoonmoeder; iemands vijanden zijn zijn huisgenoten.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "2 Kor 13:6-9": "Maar ik hoop dat u zult begrijpen, dat wij niet verwerpelijk zijn. En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn. Want wij vermogen niets tegen de waarheid, maar wel voor de waarheid.", "Deut 5:26": "Want wie is er van alle vlees, die de stem van de levende God, sprekend uit het midden van het vuur, gehoord heeft zoals wij, en is levend gebleven?", "2 Petr 1:19": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.", "Deut 11:12-15": "Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar. En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt.", "Mark 1:40": "En er kwam een melaatse tot Hem, die Hem smeekte, op de knieën viel voor Hem, en tegen Hem zei: Als U wilt, kunt U mij reinigen.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "1 Kor 8:5": "Want al zijn er ook die goden genoemd worden, hetzij in de hemel, hetzij op de aarde (zoals er veel goden en veel heren zijn),", "Hand 4:4": "En velen van hen die het woord gehoord hadden, geloofden; en het getal van de mannen werd ongeveer vijfduizend.", "1 Kor 9:16": "Want als ik het Evangelie verkondig, is het voor mij geen roem; want de noodzaak is mij opgelegd. En wee mij, als ik het Evangelie niet verkondig!", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "1 Kon 9:5": "Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "Job 39:9": "Die Ik de wildernis tot zijn huis besteld heb, en het ziltige tot zijn woningen.", "Openb 2:25": "Maar wat u hebt, houd dat vast, totdat Ik zal komen.", "Hand 22:20": "en toen het bloed van Stefanus, Uw getuige, vergoten werd, stond ik daar ook bij, en had er mede welbehagen in bij zijn dood, en bewaarde de kleren van hen die hem doodden.", "Kol 1:26-29": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen; aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid; Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "Rom 1:28": "En zoals het hun niet goeddacht God te erkennen, zo heeft God hen overgegeven aan een verkeerd denken, om dingen te doen die niet betamen;", "Rom 1:23": "en hebben de heerlijkheid van de onvergankelijke God veranderd in de gelijkenis van het beeld van een vergankelijk mens, en van vogels, en van viervoetige en kruipende dieren.", "Hand 17:16-18": "En terwijl Paulus hen te Athene verwachtte, werd zijn geest in hem geprikkeld, toen hij zag dat de stad zo vol afgoden was. Hij sprak dan in de synagoge met de Joden, en met hen die godsdienstig waren, en op de markt elke dag met hen die hij daar aantrof. En sommigen van de Epicureïsche en Stoïcijnse wijsgeren str
