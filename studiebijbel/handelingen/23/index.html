u niet vervloeken.","6":"En omdat Paulus wist dat het ene deel bestond uit Sadduceeën en het andere uit Farizeeën, riep hij in de raad: Mannen broeders, ik ben een Farizeeër, de zoon van een Farizeeër; ik word beoordeeld om de hoop en opstanding van de doden.","7":"En toen hij dit gezegd had, ontstond er tweedracht tussen de Farizeeën en de Sadduceeën, en de menigte raakte verdeeld.","8":"Want de Sadduceeën zeggen dat er geen opstanding is, en ook geen engel of geest; maar de Farizeeën belijden het beide.","9":"En er ontstond een groot geroep; en de schriftgeleerden van de kant van de Farizeeën stonden op en streden, en zeiden: Wij vinden niets kwaads in deze man; en als een geest of een engel tot hem gesproken heeft, laten wij dan niet tegen God strijden.","10":"En toen er grote tweedracht ontstond, gaf de aanvoerder, uit vrees dat Paulus door hen verscheurd zou worden, bevel dat het krijgsvolk zou afdalen en hem uit hun midden zou wegrukken en naar de legerplaats brengen.","11":"En de volgende nacht stond de Heere bij hem en zei: Heb goede moed, Paulus, want zoals u in Jeruzalem van Mij getuigd hebt, zo moet u ook in Rome getuigen.","12":"En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben.","13":"En het waren er meer dan veertig die deze eed samen hadden afgelegd.","14":"Zij gingen naar de overpriesters en de oudsten en zeiden: Wij hebben onszelf met een vervloeking vervloekt om niets te nuttigen totdat wij Paulus gedood zullen hebben.","15":"Laat u dan nu, samen met de raad, de aanvoerder weten dat hij hem morgen naar u toe brengt, alsof u nadere kennis van zijn zaak zou willen nemen; en wij zijn bereid om hem te doden voordat hij bij u komt.","16":"En toen de zoon van Paulus' zuster van deze hinderlaag hoorde, kwam hij daarheen en ging de legerplaats in en vertelde het aan Paulus.","17":"En Paulus riep een van de hoofdmannen over honderd bij zich en zei: Breng deze jongeman naar de aanvoerder, want hij heeft hem iets mee te delen.","18":"Deze nam hem dus mee en bracht hem naar de aanvoerder, en zei: Paulus, de gevangene, heeft mij bij zich geroepen en gevraagd om deze jongeman naar u te brengen, die u iets te zeggen heeft.","19":"De aanvoerder nam hem bij de hand, ging apart met hem staan, en vroeg: Wat is het dat u mij te melden hebt?","20":"En hij zei: De Joden zijn overeengekomen om u te vragen dat u Paulus morgen naar de raad zou brengen, alsof zij iets nader over hem zouden willen onderzoeken.","21":"Geloof hen dan niet; want meer dan veertig mannen van hen leggen hem een hinderlaag, die zichzelf met een vervloeking verbonden hebben om niet te eten of te drinken totdat zij hem gedood zullen hebben; en zij zijn nu gereed en wachten op uw toezegging.","22":"De aanvoerder liet toen de jongeman gaan, en gebood hem: Vertel niemand dat u mij dit hebt meegedeeld.","23":"En hij riep twee van de hoofdmannen over honderd bij zich en zei: Maak tweehonderd soldaten gereed om naar Caesarea te trekken, en zeventig ruiters en tweehonderd schutters, tegen het derde uur van de nacht.","24":"En laat er rijdieren klaarstaan, zodat zij Paulus daarop kunnen zetten en hem veilig kunnen overbrengen naar de stadhouder Felix.","25":"En hij schreef een brief met de volgende inhoud:","26":"Claudius Lysias aan de machtigste stadhouder Felix: gegroet.","27":"Deze man was door de Joden gegrepen en zou door hen gedood zijn, toen ik erbij kwam met het krijgsvolk en hem uit hun handen redde, nadat ik vernomen had dat hij een Romein is.","28":"En omdat ik de zaak wilde weten waarover zij hem beschuldigden, bracht ik hem voor hun raad.","29":"Ik ontdekte dat hij beschuldigd werd over kwesties van hun wet, maar dat er geen beschuldiging tegen hem was die de dood of gevangenschap verdient.","30":"En toen mij bekend werd gemaakt dat er een hinderlaag tegen deze man gelegd zou worden door de Joden, heb ik hem meteen naar u gezonden, en ik heb ook de aanklagers bevolen om voor u te zeggen wat zij tegen hem hebben. Vaarwel.","31":"De soldaten dan namen Paulus mee, zoals hun bevolen was, en brachten hem 's nachts naar Antipatris.","32":"En de volgende dag lieten zij de ruiters met hem verder trekken, en keerden zelf terug naar de legerplaats.","33":"Toen dezen in Caesarea gekomen waren en de brief aan de stadhouder overhandigd hadden, hebben zij ook Paulus voor hem gebracht.","34":"En de stadhouder, die de brief gelezen had, vroeg uit welke provincie hij was; en toen hij begreep dat hij uit Cilicië kwam,","35":"zei hij: Ik zal u horen wanneer ook uw aanklagers hier gekomen zijn. En hij beval dat hij bewaard zou worden in het rechthuis van Herodes."},"SV":{"1":"En Paulus, de ogen op den raad houdende, zeide: Mannen broeders! ik heb met alle goed geweten voor God gewandeld tot op dezen dag.","2":"Maar de hogepriester Ananias beval dengenen, die bij hem stonden, dat zij hem op den mond zouden slaan.","3":"Toen zeide Paulus tot hem: God zal u slaan, gij gewitte wand! Zit gij ook om mij te oordelen naar de wet, en beveelt gij, tegen de wet, dat men mij zal slaan?","4":"En die daarbij stonden, zeiden: Scheldt gij den hogepriester Gods?","5":"En Paulus zeide: Ik wist niet, broeders! dat het de hogepriester was; want er is geschreven: Den overste uws volks zult gij niet vloeken.","6":"En Paulus wetende dat het ene deel was van de Sadduceën, en het andere van de Farizeën, riep in den raad: Mannen broeders, ik ben een Farizeër, eens Farizeërs zoon; ik word over de hoop en opstanding der doden geoordeeld.","7":"En als hij dit gesproken had, ontstond er tweedracht tussen de Farizeën en de Sadduceën, en de menigte werd verdeeld.","8":"Want de Sadduceën zeggen, dat er geen opstanding is, noch engel, noch geest, maar de Farizeën belijden het beide.","9":"En er geschiedde een groot geroep; en de Schriftgeleerden van de zijde der Farizeën stonden op, en streden, zeggende: Wij vinden geen kwaad in dezen mens; en indien een geest tot hem gesproken heeft, of een engel, laat ons tegen God niet strijden.","10":"En als er grote tweedracht ontstaan was, de overste, vrezende, dat Paulus van hen verscheurd mocht worden, gebood, dat het krijgsvolk zou afkomen, en hem uit het midden van hen wegrukken, en in de legerplaats brengen.","11":"En den volgenden nacht stond de Heere bij hem, en zeide: Heb goeden moed, Paulus, want gelijk gij te Jeruzalem van Mij betuigd hebt alzo moet gij ook te Rome getuigen.","12":"En als het dag geworden was, maakten sommigen van de Joden een samenrotting, en vervloekten zichzelven, zeggende, dat zij noch eten noch drinken zouden, totdat zij Paulus zouden gedood hebben.","13":"En zij waren meer dan veertig, die dezen eed te zamen gedaan hadden;","14":"Dewelke gingen tot de overpriesters en de ouderlingen, en zeiden: Wij hebben ons zelven met vervloeking vervloekt, niets te zullen nuttigen, totdat wij Paulus zullen gedood hebben.","15":"Gij dan nu, laat den overste weten met den raad, dat hij hem morgen tot u afbrenge, alsof gij nadere kennis zoudt nemen van zijn zaken; en wij zijn bereid hem om te brengen, eer hij bij *u* komt.","16":"En als de zoon van Paulus’ zuster deze lage gehoord had, kwam hij daar, en ging in de legerplaats, en boodschapte het Paulus.","17":"En Paulus riep tot zich een van de hoofdmannen over honderd, en zeide: Leid dezen jongeling heen tot den overste; want hij heeft hem wat te boodschappen.","18":"Deze dan nam hem en bracht *hem* tot den overste, en zeide: Paulus, de gevangene, heeft mij tot zich geroepen, en begeerd, dat ik dezen jongeling tot u zou brengen, die u wat heeft te zeggen.","19":"De overste nu nam hem bij de hand, en bezijden gegaan zijnde, vraagde hij: Wat is het dat gij mij hebt te boodschappen?","20":"En hij zeide: De Joden zijn overeengekomen, om van u te begeren, dat gij Paulus morgen in den raad zoudt afbrengen, alsof zij iets van hem nader zouden onderzoeken.","21":"Doch geloof hen niet; want meer dan veertig mannen uit hen leggen hem lagen, welke zichzelven met een vervloeking verbonden hebben noch te eten noch te drinken, totdat zij hem zullen omgebracht hebben; en zij zijn nu gereed, verwachtende de toezegging van u.","22":"De overste dan liet den jongeling gaan, *hem* gebiedende: Zeg niemand voort, dat gij mij zulks geopenbaard hebt.","23":"En zekere twee van de hoofdmannen over honderd tot zich geroepen hebbende, zeide hij: Maakt tweehonderd krijgsknechten gereed, opdat zij naar Cesarea trekken, en zeventig ruiters, en tweehonderd schutters, tegen de derde ure des nachts;","24":"En laat ze *zadel* beesten bestellen, opdat zij Paulus daarop zetten, en behouden overbrengen tot den stadhouder Felix.","25":"En hij schreef een brief, hebbende dezen inhoud:","26":"Claudius Lysias aan den machtigsten stadhouder Felix groetenis.","27":"Alzo deze man van de Joden gegrepen was, en van hen omgebracht zou geworden zijn, ben ik daarover gekomen met het krijgsvolk, en heb hem *hun* ontnomen, bericht zijnde, dat hij een Romein is.","28":"En willende de zaak weten, waarover zij hem beschuldigden, bracht ik hem af in hun raad;","29":"Welken ik bevond beschuldigd te worden over vragen hunner wet; maar geen beschuldiging tegen hem te zijn, die den dood of banden waardig is.","30":"En als mij te kennen gegeven was, dat van de Joden een lage tegen deze man *gelegd* zou worden, zo heb ik *hem* terstond aan u gezonden; gebiedende ook den beschuldigers voor u te zeggen, hetgeen zij tegen hem hadden. Vaarwel.","31":"De krijgsknechten dan, gelijk hun bevolen was, namen Paulus, en brachten hem des nachts tot Antipatris.","32":"En des anderen daags, latende de ruiters met hem trekken, keerden zij wederom naar de legerplaats.","33":"Dewelken als zij te Cesarea gekomen waren, en den brief den stadhouder overgeleverd hadden, hebben zij ook Paulus voor hem gesteld.","34":"En de stadhouder, *den* *brief* gelezen hebbende, vraagde, uit wat provincie hij was; en verstaande, dat hij van Cilicië was,","35":"Zeide hij: Ik zal u horen, als ook uw beschuldigers hier zullen gekomen zijn. En hij beval, dat hij in het rechthuis van Herodes zou bewaard worden."},"KJV":{"1":"And Paul, earnestly beholding the council, said, Men *and* brethren, I have lived in all good conscience before God until this day.","2":"And the high priest Ananias commanded them that stood by him to smite him on the mouth.","3":"Then said Paul unto him, God shall smite thee, *thou* whited wall: for sittest thou to judge me after the law, and commandest me to be smitten contrary to the law?","4":"And they that stood by said, Revilest thou God's high priest?","5":"Then said Paul, I wist not, brethren, that he was the high priest: for it is written, Thou shalt not speak evil of the ruler of thy people.","6":"But when Paul perceived that the one part were Sadducees, and the other Pharisees, he cried out in the council, Men *and* brethren, I am a Pharisee, the son of a Pharisee: of the hope and resurrection of the dead I am called in question.","7":"And when he had so said, there arose a dissension between the Pharisees and the Sadducees: and the multitude was divided.","8":"For the Sadducees say that there is no resurrection, neither angel, nor spirit: but the Pharisees confess both.","9":"And there arose a great cry: and the scribes *that were* of the Pharisees' part arose, and strove, saying, We find no evil in this man: but if a spirit or an angel hath spoken to him, let us not fight","10":"And when there arose a great dissension, the chief captain, fearing lest Paul should have been pulled in pieces of them, commanded the soldiers to go down, and to take him by force from among them, and to bring *him* into the castle.","11":"And the night following the Lord stood by him, and said, Be of good cheer, Paul: for as thou hast testified of me in Jerusalem, so must thou bear witness also at Rome.","12":"And when it was day, certain of the Jews banded together, and bound themselves under a curse, saying that they would neither eat nor drink till they had killed Paul.","13":"And they were more than forty which had made this conspiracy.","14":"And they came to the chief priests and elders, and said, We have bound ourselves under a great curse, that we will eat nothing until we have slain Paul.","15":"Now therefore ye with the council signify to the chief captain that he bring him down unto you to morrow, as though ye would enquire something more perfectly concerning him: and we, or ever he come near, are ready to kill him.","16":"And when Paul's sister's son heard of their lying in wait, he went and entered into the castle, and told Paul.","17":"Then Paul called one of the centurions unto *him*, and said, Bring this young man unto the chief captain: for he hath a certain thing to tell him.","18":"So he took him, and brought *him* to the chief captain, and said, Paul the prisoner called me unto *him*, and prayed me to bring this young man unto thee, who hath something to say unto thee.","19":"Then the chief captain took him by the hand, and went *with him* aside privately, and asked *him*, What is that thou hast to tell me?","20":"And he said, The Jews have agreed to desire thee that thou wouldest bring down Paul to morrow into the council, as though they would enquire somewhat of him more perfectly.","21":"But do not thou yield unto them: for there lie in wait for him of them more than forty men, which have bound themselves with an oath, that they will neither eat nor drink till they have killed him: and now are they ready, looking for a promise from thee.","22":"So the chief captain *then* let the young man depart, and charged *him, See thou* tell no man that thou hast shewed these things to me.","23":"And he called unto *him* two centurions, saying, Make ready two hundred soldiers to go to Caesarea, and horsemen threescore and ten, and spearmen two hundred, at the third hour of the night;","24":"And provide *them* beasts, that they may set Paul on, and bring *him* safe unto Felix the governor.","25":"And he wrote a letter after this manner:","26":"Claudius Lysias unto the most excellent governor Felix *sendeth* greeting.","27":"This man was taken of the Jews, and should have been killed of them: then came I with an army, and rescued him, having understood that he was a Roman.","28":"And when I would have known the cause wherefore they accused him, I brought him forth into their council:","29":"Whom I perceived to be accused of questions of their law, but to have nothing laid to his charge worthy of death or of bonds.","30":"And when it was told me how that the Jews laid wait for the man, I sent straightway to thee, and gave commandment to his accusers also to say before thee what *they had* against him. Farewell.","31":"Then the soldiers, as it was commanded them, took Paul, and brought *him* by night to Antipatris.","32":"On the morrow they left the horsemen to go with him, and returned to the castle:","33":"Who, when they came to Caesarea, and delivered the epistle to the governor, presented Paul also before him.","34":"And when the governor had read *the letter*, he asked of what province he was. And when he understood that *he was* of Cilicia;","35":"I will hear thee, said he, when thine accusers are also come. And he commanded him to be kept in Herod's judgment hall."}},"tsk":{"1":[{"kopje":"recht","refs":["Hand 23:6","Hand 6:15","Hand 22:5","Spr 28:1"]},{"kopje":"Mannen","refs":["Hand 22:1"]},{"kopje":"Ik heb","refs":["Hand 24:16","1 Kor 4:4","2 Kor 1:12","2 Kor 4:2","2 Tim 1:3","Hebr 13:18","1 Petr 3:16"]}],"2":[{"kopje":"Ananias","refs":["Hand 24:1"]},{"kopje":"slaan","refs":["1 Kon 22:24","Jer 20:2","Micha 4:14","Matt 26:67","Joh 18:22"]}],"3":[{"kopje":"witgepleisterde","refs":["Matt 23:27","Matt 23:28"]},{"kopje":"daar","refs":["Lev 19:35","Ps 58:2","Ps 58:3","Ps 82:1","Ps 82:2","Ps 94:20","Pred 3:16","Amos 5:7","Micha 3:8-11"]},{"kopje":"slaan","refs":["Deut 25:1","Deut 25:2","Joh 7:51","Joh 18:24"]}],"5":[{"kopje":"Ik wist" s <span class=\"wl wl-kjv\" data-code=\"G2725\">accusers</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> to <span class=\"wl wl-kjv\" data-code=\"G3004\">say</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">before</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thee</span> what they had <span class=\"wl wl-kjv\" data-code=\"G4314\">against</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him.</span> Farewell.","31":"<span class=\"wl wl-kjv\" data-code=\"G3767\">Then</span> the <span class=\"wl wl-kjv\" data-code=\"G4757\">soldiers,</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">as</span> it was <span class=\"wl wl-kjv\" data-code=\"G1299\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them,</span> <span class=\"wl wl-kjv\" data-code=\"G353\">took</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul,</span> and <span class=\"wl wl-kjv\" data-code=\"G71\">brought</span> him <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> <span class=\"wl wl-kjv\" data-code=\"G3571\">night</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">to</span> Antipatris.","32":"On the <span class=\"wl wl-kjv\" data-code=\"G1887\">morrow</span> they <span class=\"wl wl-kjv\" data-code=\"G1439\">left</span> the <span class=\"wl wl-kjv\" data-code=\"G2460\">horsemen</span> to <span class=\"wl wl-kjv\" data-code=\"G4198\">go</span> <span class=\"wl wl-kjv\" data-code=\"G4862\">with</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> and <span class=\"wl wl-kjv\" data-code=\"G5290\">returned</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">to</span> the castle:","33":"<span class=\"wl wl-kjv\" data-code=\"G3748\">Who,</span> when they <span class=\"wl wl-kjv\" data-code=\"G1525\">came</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">to</span> <span class=\"wl wl-kjv\" data-code=\"G2542\">Caesarea,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G325\">delivered</span> the <span class=\"wl wl-kjv\" data-code=\"G1992\">epistle</span> to the <span class=\"wl wl-kjv\" data-code=\"G2232\">governor,</span> <span class=\"wl wl-kjv\" data-code=\"G3936\">presented</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> before him.","34":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> when the <span class=\"wl wl-kjv\" data-code=\"G2232\">governor</span> had <span class=\"wl wl-kjv\" data-code=\"G314\">read</span> the <span class=\"wl wl-kjv\" data-code=\"G2532\">letter,</span> he <span class=\"wl wl-kjv\" data-code=\"G1905\">asked</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> <span class=\"wl wl-kjv\" data-code=\"G4169\">what</span> <span class=\"wl wl-kjv\" data-code=\"G1885\">province</span> he <span class=\"wl wl-kjv\" data-code=\"G2076\">was.</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> when he <span class=\"wl wl-kjv\" data-code=\"G4441\">understood</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> he was <span class=\"wl wl-kjv\" data-code=\"G575\">of</span> Cilicia;","35":"I will <span class=\"wl wl-kjv\" data-code=\"G1251\">hear</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thee,</span> said <span class=\"wl wl-kjv\" data-code=\"G5346\">he,</span> <span class=\"wl wl-kjv\" data-code=\"G3752\">when</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thine</span> <span class=\"wl wl-kjv\" data-code=\"G2725\">accusers</span> <span class=\"wl wl-kjv\" data-code=\"G3854\">are</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> <span class=\"wl wl-kjv\" data-code=\"G3854\">come.</span> <span class=\"wl wl-kjv\" data-code=\"G5037\">And</span> he <span class=\"wl wl-kjv\" data-code=\"G2753\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> to be <span class=\"wl wl-kjv\" data-code=\"G5442\">kept</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G2264\">Herod's</span> judgment hall."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"met alle goed","tekst":"Namelijk niet alleen in het Christendom, maar ook in het Jodendom, want hij had toen ook God oprecht zonder geveinsdheid gediend, naar de kennis die hij had, hoewel hij de Christenen daarna uit onverstand had vervolgd. Zie verder 2Ti 1:3 ."},{"catchword":"voor God gewandeld","tekst":"Of, God gediend. Het Griekse woord betekent eigenlijk in enige stad als een goede overheid, of als een goed burger zich gedragen. Zie ook Phi 1:27 , en Phi 3:20 ."}],"3":[{"catchword":"gij gewitte wand","tekst":"Dat is, gij geveinsde, gij die wel een priesterlijk kleed hebt, maar een wreed en onrechtvaardig hart. Zie Mat 23:27-28 ; deze woorden van Paulus moeten niet genomen worden voor scheldwoorden, Mat 5:22 , of woorden van wraakgierigheid, of van vergelding van kwaad met kwaad, maar voor een ernstige bestraffing van dezen mens, en voor een vrijmoedige aanzegging van Gods oordeel over hem. Zie dergelijke 2Ti 4:14 ."},{"catchword":"tegen de wet,","tekst":"Grieks de wet overtredende."}],"5":[{"catchword":"Ik wist niet,","tekst":"Dewijl de hogepriesters in dien tijd dikwijls veranderden, ook zelfs alle jaren, Joh 11:49 , en Paulus nu over langen tijd te Jeruzalem niet verkeerd had, zo is het niet wonder dat hij den hogepriester van aangezicht niet gekend heeft, temeer omdat ook de hogepriester zelf in alle vergaderingen niet tegenwoordig was, en omdat hier alles in verwarring toeging, gelijk uit de gehele handeling blijkt. Zie JosEf. Antiq. lib.20, cap.6,7-8."},{"catchword":"vloeken","tekst":"Grieks kwalijk toespreken, of, kwalijk van hem spreken, schelden. Want hoewel Paulus niet had dan recht gesproken, nochtans, omdat het bij de omstanders een schijn had van schelden, zo wil hij zeggen, dat hij zulks ook zou vermeden hebben, had hij den hogepriester gekend."}],"6":[{"catchword":"van de Sadduceën,","tekst":"Van deze twee sekten, zie Mat 3:7 , en Mat 22:23 ; JosEf. Antiq. lib.18, cap.2, en de bello Judas lib.2, cap.7."},{"catchword":"een Farizeër, eens","tekst":"Namelijk van leven geweest, en nog met hen staande in het gevoelen aangaande de opstanding der doden en enige andere stukken. Hij spreekt hier de waarheid, hoewel hij een deel van dezelve verzwijgt, om de vijanden van Gods kerk alzo te verwarren."},{"catchword":"de hoop en","tekst":"Dit kan verstaan worden, òf van de hoop der opstanding, òf ook van de hoop der zaligheid en der opstanding, alzo de Sadduceën beide loochenden, overmits zij de onsterflijkheid der zielen ontkenden."},{"catchword":"geoordeeld","tekst":"Dat is, voor recht gesteld."}],"7":[{"catchword":"tweedracht","tekst":"Of, oproer."},{"catchword":"de menigte werd","tekst":"Namelijk dergenen, die daar vergaderd waren."},{"catchword":"verdeeld","tekst":"Grieks gescheurd."}],"8":[{"catchword":"geest,","tekst":"Dat is, onsterflijkheid der zielen, of geestelijk wezen, dat onsterflijk is."},{"catchword":"beide","tekst":"Namelijk de opstanding der lichamen, en de onsterflijkheid der geesten, dat is, der engelen en zielen."}],"9":[{"catchword":"van de zijde","tekst":"Grieks van het deel."}],"10":[{"catchword":"tweedracht","tekst":"Of, oproer."}],"11":[{"catchword":"stond de Heere","tekst":"Namelijk in een gezicht, òf in een droom, òf in ene vertrekking van zinnen; 2Co 12:1 ."},{"catchword":"van Mij betuigd","tekst":"Of, van die dingen die mij aangaan."}],"12":[{"catchword":"vervloekten","tekst":"Grieks anethematisan; dat is, zwoeren, dat zij een anathema, of vervloeking voor God wilden zijn, zo zij aten of dronken eer zij Paulus gedood hadden. Zie vs.21; Mat 26:74 ; Rom 9:3 ; Gal 1:8 ."}],"15":[{"catchword":"den overste","tekst":"Namelijk Lysias, waarvan zie de aantekeningen Act 22:24 ."},{"catchword":"met den raad,","tekst":"Of, met goedvinden van den Raad. Want Paulus was alleen in de macht des oversten, en niet des Raads."},{"catchword":"nadere kennis","tekst":"Of, volkomener, bescheidenlijker, nauwer, scherper."}],"20":[{"catchword":"De Joden zijn","tekst":"Dat is, de Raad der Joden, met enige anderen."}],"21":[{"catchword":"geloof hen niet;","tekst":"Of, laat u van hen niet overreden; dat is, willig dat hun niet in."},{"catchword":"met een vervloeking","tekst":"Grieks vervloekt hebben."},{"catchword":"de toezegging","tekst":"Namelijk dat hij hem zult afbrengen in hunnen Raad."}],"23":[{"catchword":"Cesarea","tekst":"Namelijk in Palestina, aan de Middellandse zee gelegen, waar de stadhouder zijn gewoon verblijf en gericht hield, als de sterkste en gelegenste stad in dat land; Tacit. Histor. lib.2."},{"catchword":"schutters,","tekst":"Grieks dexiolabous; hetwelk eigenlijk betekent, die met de rechterhand vatten; namelijk de spiesen om die te werpen, of te schieten op de vijanden."},{"catchword":"tegen de derde","tekst":"Grieks van; namelijk na den ondergang der zon, tegen de tweede wake, om hem alzo dien nacht buiten zorg te mogen brengen."}],"24":[{"catchword":"Felix","tekst":"Deze Felix was de broeder van enen Pallas, die eerst een slaaf, daarna een vrijgelatene van den keizer Claudius was, welke met een anderen vrijgelatene, Narcissus genaamd, nagenoeg het Romeinse rijk onder dezen keizer regeerden. Zodat deze Pallas zijnen broeder Felix tot een stadhouder over Judea van des keizers wege gesteld had. Zie Suetonius in Claudio cap.28, en Josefus Antiq. lib.29, cap.5,6, Tacitus Ann. lib.12."}],"26":[{"catchword":"machtigsten","tekst":"Zie Luk 1:3 ; Act 24:3 , en Act 26:25 ."}],"29":[{"catchword":"vragen hunner","tekst":"Zo spreekt hij als een heiden, alsof het de moeite niet waard ware hem over de geschillen in den Joodsen godsdienst enige moeite te maken. Doch God heeft dit zijn gevoelen gebruikt om Paulus uit de onrechtvaardige handen der Joden te verlossen."}],"31":[{"catchword":"Antipatris","tekst":"Eene stad, gelegen aan de Middellandse zee tussen Joppe en Cesarea, omtrent zestien mijlen van Jeruzalem en acht van Cesarea, die van Herodes den Grote opgebouwd en gesterkt was, en naar zijn vader Antipatris genaamd; JosEf. Antiq. lib.16, cap.9."}],"35":[{"catchword":"horen, als","tekst":"Of, ten volle horen, gelijk het Griekse woord medebrengt."},{"catchword":"rechthuis","tekst":"Grieks Praitorio; van het Latijnse woord Proetorium, hetwelk betekent een paleis des oppersten gebieders, hetzij prins, gouverneur, of veldoverste; gelijk te zien is Mat 27:27 ; Mar 15:16 ; Phi 1:13 , waarin ook een bijzondere plaats was om recht te doen."},{"catchword":"Heródes zou","tekst":"Het werd zo genaamd, omdat Herodes de Grote hetzelve aldaar gesticht had, toen hij deze stad, tevoren genaamd Stratonis toren, sterk maakte en naar den naam van den keizer Augustus Cesarea noemde."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Paul holding his eyes on the Councill said, men, brethren, I have walked with all good conscience [Namely, not only in the Christian Religion but also in the Jewish, for he then had served God uprightly, i.e. without hypocrisie, according to the knowledge which he had, although he had afterward out of ignorance persecuted persecuted the Christians. See further, 2 Tim. 1. 3.] before God [or served God. The Greek word properly signifies to carry ones self in a City as a good Magistrate or as a good Citizen. See also Phil. 1. 27.and chap 3. 20.] untill this day."}],"2":[{"catchword":null,"tekst":"But the High Priest Ananias commanded those that stood by him, that they should smite him on the mouth."}],"3":[{"catchword":null,"tekst":"Then said Paul unto him, God shall smite thee thou whired wall; [That is, thou hypocrite, who indeed hast a Priestly garment, but a cruel and unrighteous heart. See Mat. 23. 27, 28. And these words of Paul must not be taken for reviling words, Mat. 5. 22. 39.or words of revenge or of recompencing evil with evil, but for a serious reproving of this man, and for a bold denunciation of Gods judgement upon him. See the like, 2 Tim. 4.ver. 14.] Sittest thou also to judge me according to the Law, and commandest thou contrary to the Law [Gr.transgressing the Law] that I shall be smitten?"}],"4":[{"catchword":null,"tekst":"And they that stood there by, said, Revilest thou Gods High Priest?"}],"5":[{"catchword":null,"tekst":"And Paul said I knew not [Seeing at that time the High Priests often changed, yea even every year, John 11.ver. 49.and Paul now for a long time had not conversed much at Jerusalem, it is no wonder that he knew not the High Priest by face; the rather also because the High Priest himself was not present in all Assemblies, and here all things went confusedly, as appears from the whole transaction. See Joseph. Antiq.lib. 20.cap. 6. 7. 8.] brethren that it was the High Priest: For it is written, the Ruler of thy people thou shalt not curse. [Gr.speak evil to, or speak evil of him, revile him. For howsoever Paul had spoken nothing but what was just, nevertheless because to the standers by, it had a shew of reviling, therefore he meaneth that he should have avoided this also, had he known the High Priest.]"}],"6":[{"catchword":null,"tekst":"And Paul knowing that the one part was of the Sadduces, and the other of the Pharisees, [Of these two sects, see Mat. 3. 7.and 22.ver. 23. Joseph. Antiq.lib. 18.cap.2.and de bello Jud.lib.2.cap.7.] cryed out in the Councill, Men, brethren, I am a Pharisee. [namely, having been in my life, and yet standing standing with them in the opinion concerning the resurrection of the dead, and some others points. He speaketh the truth here howsoever he conceals a part of the same, thereby to confound the enemies of Gods Church] the son of a Pharisee: I am judged [that is, brought before justice] about the hope and resurrection of the dead. [this may be understood, either of the hope of the resurrection, or else of the hope of salvation, and of the resurrection, seeing the Sadduces, denied both, forasmuch as they denied the immortality of the soul.]"}],"7":[{"catchword":null,"tekst":"And when he had spoken this, there arose discord [Or uproar] betwixt the Pharisees and the Sadduces, and the multitude [namely, of those that were there assembled] was divided. [Gr.rent.]"}],"8":[{"catchword":null,"tekst":"For the Sadduces say that there is no resurrection, nor Angel, nor Spirit: That is, immortality of soules: or spirituall being that is immortall] but thePharisees confess both. [namely, the resurrection of the bodies, and the immortality of Spirits, i.e. of the Angels and soules.]"}],"9":[{"catchword":null,"tekst":"And there happened a great cry: and the Scribes of the Pharisees side [Gr.part] rose up, an strove, saying, we finde no evill in this man: and if a Spirit have spoken to him, or an Angel, let us not strive against God."}],"10":[{"catchword":null,"tekst":"And when there was risen great dissention [Or uproar] the Commander fearing that Paul might be torn in pieces by them, commanded that the souldiers should come down, and pluck him away out of the midst of them, and bring him into the Camp."}],"11":[{"catchword":null,"tekst":"And the night following, the Lord stood by him [Namely, in a vision, or in a dream, or in an extasie, 2 Cor. 12. 1.] and said, be of good cheer Paul. For like as thou hast testified of me at Jerusalem, [Or of those things which concern me] so must thou also testifie at Rome."}],"12":[{"catchword":null,"tekst":"And it was become day, some of the Jews made a conspiracy, and cursed themselves, [Gr.anethematisan, i.e. swore that they would be an anathema or curse before God, if they ate or drank before they had killed Paul. See ver. 21. Mat. 26. 74. Rom. 9. 3. Gal 1:8.] saying tha they would neither eat nor drink, until they should have killed Paul."}],"13":[{"catchword":null,"tekst":"And they were more then forty who had made this oath together."}],"14":[{"catchword":null,"tekst":"Who went unto the Chief Priests and Elders and said, we have with cursing cursed our selves that we will eat nothing, until we shall have killed Paul."}],"15":[{"catchword":null,"tekst":"Now ye therefore let the Governour know [Namely Lysias, whereof see the annotation Acts 22. 24.] with the Councill, [or with the approbation of the Councill: for Paul was then only in the power of the Governour, and not of the Councill] that he bring him down unto you to morrow, as if ye would take further knowledge [or more perfect, more distinct, narrower, sharper] of his matters: and we are ready to make him away, before he comes to (you.)"}],"16":[{"catchword":null,"tekst":"And when Pauls sisters son had heard of this lying in wait, he came thither and went into the camp, and told it to Paul."}],"17":[{"catchword":null,"tekst":"and Paul called unto him one of the Centurions, and said, Bring this young man to the Governour. For he hath something to tell him."}],"18":[{"catchword":null,"tekst":"He therefore took him, and brought (him) to the Governour, and said Paul the prisoner called unto him, and desired that I should bring this young man unto thee, who hath somewhat to say unto thee."}],"19":[{"catchword":null,"tekst":"Now the Governour took him by the hand, and being gone aside he asked, what is it that thou hast to tell me?"}],"20":[{"catchword":null,"tekst":"And he said, the Jews [That is, the Councill of the Jews, with some other] hast agreed to desire of thee that thou shouldest to morrow bring down Paul into the Councill, as if they would enquire somewhat of him more narrowly."}],"21":[{"catchword":null,"tekst":"But belive them not; [Or, be not perswaded by them. That is, grant not that unto them] For more them] For more then forty men of them ly in waite for him, who have bound themselves with a curse [Gr.have cursed] neither to eat nor drink, until they shall have made him away: and they are now ready expecting the promise [namely that thou wilt bring him down into their Councill] from thee."}],"22":[{"catchword":null,"tekst":"Then the Commander let the young man go, commanding (him) tell it to n man that thou hast revealed this to me."}],"23":[{"catchword":null,"tekst":"And having called unto him two of the Centurions, he said , Make ready two hundred souldiers, that they may goe to Cesarea, [Namely, in Palestine, situate on the Midland sea, where the Governour held his ordinary residence and Tribunal, as the strongest and convenientest City in that land, Tacit. Histor.lib.2.] and seventy horsemen, and two hundred Archers [Gr.dexiolavous: which properly signifies them that take with the right hand. Namely, the javelings to cast or shoote them upon the enemies] against [Gr.from. Namely, Sunset, against the second watch, that so that night they might bring him out of danger] the third hour of the night."}],"24":[{"catchword":null,"tekst":"And provide the (saddle) beasts, that they may set Paul thereon, and bring him safe unto the Governour Felix. [This Felix was the brother of one Pallas, who was first a slave afterward set free by the Emperor Claudius, who with another that was set free named Narcissus, sufficiently ruled the Roman Empire under this Emperor. So that this Pallas had made his brother Felix Governour over Judea in the Emperors name. See Sueton.in Claudio cap.28.and Joseph. Antiq.lib. 20.cap.5.6.Tacitus Annal.lib.12.]"}],"25":[{"catchword":null,"tekst":"And he wrote a letter having these contents."}],"26":[{"catchword":null,"tekst":"Claudius Lysias to the most mighty [See Luk 1:3. Act 24:3.and 26. 25.] Governour Felix, greeting."}],"27":[{"catchword":null,"tekst":"Whereas this man was taken of the Jews, and should have been made away by them, I came upon them with the Souldiers, and took him from (them) being inform that he is a Romane."}],"28":[{"catchword":null,"tekst":"And being willing to know the cause wherefore they accused him, I brought him down into their Council."}],"29":[{"catchword":null,"tekst":"Whom I found to be accused about questions of their Law, [So he speaketh as a Heathen, as if it were not worth the pain, to make any adoe, about the diffe // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
