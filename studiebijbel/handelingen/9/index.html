ie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft.", "2 Sam 18:33": "Toen raakte de koning zeer ontroerd, en ging naar boven, naar de bovenzaal boven de poort, en huilde; en al gaande zei hij dit: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Was ik maar, was ik maar in uw plaats gestorven, Absalom, mijn zoon, mijn zoon!", "Luk 1:35": "En de engel antwoordde en zei tegen haar: De Heilige Geest zal over u komen, en de kracht van de Allerhoogste zal u overschaduwen; daarom zal ook dat Heilige Dat uit u geboren zal worden, Gods Zoon genoemd worden.", "2 Kor 5:13": "Want hetzij dat wij uitzinnig zijn, wij zijn het voor God; hetzij dat wij bezonnen zijn, wij zijn het voor u.", "Hand 18:19": "En hij kwam aan in Efeze, en liet hen daar achter; maar hijzelf ging de synagoge in en sprak met de Joden.", "Rom 1:7": "Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "Rom 8:35-37": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Luk 8:54": "Maar toen Hij hen allen naar buiten had gestuurd, greep Hij haar hand en riep: Kind, sta op!", "2 Kor 4:1": "Omdat wij deze bediening hebben, naar de barmhartigheid die ons is bewezen, zo worden wij niet moedeloos;", "Joh 10:9": "Ik ben de Deur; als iemand door Mij ingaat, zal hij behouden worden; en hij zal ingaan en uitgaan, en weide vinden.", "Hand 9:32-34": "En het gebeurde, toen Petrus overal rondtrok, dat hij ook afkwam bij de heiligen die in Lydda woonden. En daar vond hij een zekere man, met de naam Eneas, die al acht jaar bedlegerig was, omdat hij verlamd was. En Petrus zei tegen hem: Eneas! Jezus Christus maakt u gezond; sta op en maak uzelf uw bed op. En hij stond meteen op.", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Joh 20:28": "En Thomas antwoordde en zei tegen Hem: Mijn Heere en mijn God!", "Jes 24:16": "Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Jes 33:15-17": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet; Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis. Uw ogen zullen de Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.", "Gen 12:5": "En Abram nam Sarai, zijn vrouw, en Lot, de zoon van zijn broer, en al hun bezit dat zij verworven hadden, en de mensen die zij verkregen hadden in Haran; en zij vertrokken om naar het land Kanaän te gaan, en zij kwamen in het land Kanaän aan.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "1 Kor 3:16": "Weet u niet, dat u de tempel van God bent, en dat de Geest van God in u woont?", "2 Tim 3:11": "mijn vervolgingen, mijn lijden, zoals mij overkomen is in Antiochië, in Ikonium en in Lystre; wat voor vervolgingen ik geleden heb, en de Heere heeft mij uit alle verlost.", "Ezech 7:17": "Alle handen zullen slap worden, en alle knieën zullen wegvloeien als water.", "Hand 16:11-40": "Van Troas dan vertrokken, voeren wij recht naar Samothrace, en de volgende dag naar Neapolis. En van daar naar Filippi, wat de eerste stad is van dit deel van Macedonië, een kolonie. En wij bleven in die stad enkele dagen. En op de dag van de sabbat gingen wij de stad uit, naar de rivier, waar men gewoonlijk bad; en wij gingen zitten en spraken tot de vrouwen die daar samengekomen waren.", "Richt 3:30": "Zo werd Moab op die dag onder de hand van Israël onderworpen; en het land was stil tachtig jaren.", "Hand 13:4": "Zij dan, uitgezonden door de Heilige Geest, kwamen af naar Seleucië, en scheepten van daar af naar Cyprus.", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Hand 5:4": "Zolang het bleef, bleef het niet uw eigendom? En verkocht zijnde, was het niet in uw macht? Wat is het, dat u deze daad in uw hart hebt voorgenomen? U hebt niet mensen gelogen, maar God.", "Fil 1:29": "Want u is uit genade gegeven in de zaak van Christus, niet alleen om in Hem te geloven, maar ook om voor Hem te lijden;", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Hand 28:23-28": "En toen zij hem een dag hadden vastgesteld, kwamen er velen naar hem toe in zijn woonplaats; hij legde hun het Koninkrijk van God uit en getuigde ervan, en probeerde hen te overtuigen aangaande Jezus, zowel uit de wet van Mozes als uit de profeten, van 's morgens vroeg tot 's avonds toe. En sommigen geloofden wel wat er gezegd werd, maar sommigen geloofden niet. En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Ps 51:13": "Verwerp mij niet van Uw aangezicht, en neem Uw Heilige Geest niet van mij.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Jes 60:8-14": "Wie zijn deze, die daar komen aangevlogen als een wolk, en als duiven naar hun vensters? Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft. En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Openb 2:29": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt.", "2 Kor 4:11-18": "Want wij, die leven, worden altijd om Jezus' wil in de dood overgegeven, opdat ook het leven van Jezus in ons sterfelijk vlees openbaar zou worden. Zo dan, de dood werkt wel in ons, maar het leven in u. Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Hand 22:3": "Ik ben een Joodse man, geboren te Tarsen in Cilicië, maar opgevoed in deze stad, aan de voeten van Gamaliël onderwezen naar de nauwkeurigste wijze van de wet van de vaderen, en ik was een ijveraar voor God, zoals u allen heden bent.", "Job 31:19": "Als ik iemand heb zien omkomen, omdat hij zonder kleding was, en dat de nooddruftige geen deksel had;", "Hand 17:10-15": "En de broeders stuurden Paulus en Silas meteen 's nachts weg naar Berea; die, daar aangekomen, gingen naar de synagoge van de Joden; En dezen waren edeler dan die te Thessalonica, want zij ontvingen het woord met alle bereidwilligheid, en onderzochten dagelijks de Schriften of deze dingen zo waren. Velen dan uit hen geloofden, en van de aanzienlijke Griekse vrouwen en van de mannen niet weinige.", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd.", "Matt 10:16-23": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven. Maar wees op uw hoede voor de mensen; want zij zullen u overleveren aan de raadsvergaderingen, en zij zullen u geselen in hun synagogen; En u zult ook voor stadhouders en koningen geleid worden, om Mij, tot een getuigenis voor hen en de heidenen.", "1 Kor 9:1": "Ben ik niet een apostel? Ben ik niet vrij? Heb ik niet Jezus Christus, onze Heere, gezien? Bent u niet mijn werk in de Heere?", "1 Kor 4:1-21": "Zo houdt men ons voor, ieder mens: als dienaars van Christus, en uitdelers van de verborgenheden van God. En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt. Maar voor mij is het van het minste belang, dat ik door u geoordeeld word, of door een menselijk oordeel; ja, ik oordeel ook mijzelf niet.", "Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "Ef 3:7": "waarvan ik een dienaar geworden ben, naar de gave van de genade van God, die mij gegeven is, naar de werking van Zijn kracht.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Jes 49:1": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld.", "Hand 26:9-11": "Ik meende inderdaad bij mijzelf dat ik tegen de Naam van Jezus van Nazareth veel dingen moest doen die ertegen ingingen. Dat heb ik ook gedaan in Jeruzalem, en ik heb velen van de heiligen in de gevangenissen gesloten, nadat ik de macht van de overpriesters ontvangen had; en toen zij omgebracht werden, stemde ik ermee in. En door alle synagogen heen heb ik hen dikwijls gestraft en gedwongen te lasteren; en boven mate tegen hen woedend heb ik hen vervolgd, ook tot in de buitenlandse steden.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Joh 1:9": "Dit was het waarachtige Licht, Dat ieder mens verlicht die in de wereld komt.", "Hand 2:4": "En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Joh 13:19": "Van nu af zeg Ik het u, voordat het gebeurd is, opdat u, wanneer het gebeurd zal zijn, kunt geloven dat Ik het ben.", "Joh 18:20": "Jezus antwoordde hem: Ik heb vrijuit gesproken tot de wereld; Ik heb altijd onderwezen in de synagoge en in de tempel, waar de Joden van alle plaatsen samenkomen; en in het verborgen heb Ik niets gesproken.", "Hand 9:1-18": "En Saulus, die nog steeds dreiging en moord blies tegen de discipelen van de Heere, ging naar de hogepriester, en vroeg hem om brieven aan de synagogen in Damaskus, opdat hij, als hij daar iemand zou vinden die van die weg was, zowel mannen als vrouwen, hen gebonden naar Jeruzalem zou brengen. En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel;", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "Ex 4:1": "Toen antwoordde Mozes, en zei: Maar zie, zij zullen mij niet geloven, en niet naar mijn stem luisteren; want zij zullen zeggen: De HEERE is u niet verschenen!", "Luk 12:12": "Want de Heilige Geest zal u op datzelfde moment leren wat u moet spreken.", "Joh 3:22": "Hierna kwam Jezus met Zijn discipelen in het land van Judea, en Hij verbleef daar met hen en doopte.", "Ex 4:11": "En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE?", "Joh 17:15": "Ik bid niet dat U hen uit de wereld wegneemt, maar dat U hen bewaart voor de boze.", "Hand 20:36": "En toen hij dit gezegd had, knielde hij neer en bad met hen allen.", "2 Kor 11:26": "Op reis vaak in gevaren van rivieren, in gevaren van rovers, in gevaren van mijn volk, in gevaren van de heidenen, in gevaren in de stad, in gevaren in de woestijn, in gevaren op de zee, in gevaren onder de valse broeders;", "Luk 3:10-14": "En de menigten vroegen hem: Wat zullen wij dan doen? En hij antwoordde en zei tegen hen: Wie twee stukken kleding heeft, moet delen met wie er geen heeft; en wie voedsel heeft, moet hetzelfde doen. En er kwamen ook tollenaars om gedoopt te worden, en zeiden tegen hem: Meester, wat zullen wij doen?", "2 Tim 1:7": "Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid.", "Job 17:9": "En de rechtvaardige zal zijn weg vasthouden, en wie rein van handen is, zal in sterkte toenemen.", "2 Kor 1:22": "Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Zach 9:9-17": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen. En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde. U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "Matt 26:63": "Maar Jezus zweeg stil. En de hogepriester antwoordde en zei tegen Hem: Ik bezweer U bij de levende God dat U ons zegt of U de Christus bent, de Zoon van God.", "Dan 9:25": "Weet dan, en versta: van het uitgaan van het woord om te doen terugkeren en om Jeruzalem te bouwen, tot op de Messias, de Vorst, zijn zeven weken, en tweeënzestig weken; de straten en de grachten zullen weer gebouwd worden, maar in benauwdheid van de tijden.", "Hand 14:2": "Maar de Joden die ongehoorzaam waren, zetten de heidenen aan en verbitterden hun harten tegen de broeders.", "2 Kor 4:8-15": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven; Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Joh 20:17": "Jezus zei tegen haar: Raak Mij niet aan, want Ik ben nog niet opgevaren naar Mijn Vader; maar ga naar Mijn broeders, en zeg hun: Ik vaar op naar Mijn Vader en uw Vader, en naar Mijn God en uw God.", "Openb 2:3": "En u hebt verdragen, en hebt geduld; en u hebt om Mijn Naam gearbeid, en bent niet moe geworden.", "Hand 15:8": "En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons;", "Matt 5:40": "en als iemand met u wil rechtstoetsen en uw onderkleed nemen, laat hem ook de mantel;", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "1 Kor 14:24": "Maar als zij allen profeteerden, en er een ongelovige of ongeleerde binnenkwam, dan wordt hij door allen overtuigd, en hij wordt door allen beoordeeld.", "Hand 6:5": "En dit voorstel beviel de hele menigte; en zij kozen Stefanus, een man vol van het geloof en van de Heilige Geest, en Filippus, en Prochorus, en Nicanor, en Timon, en Parmenas, en Nicolaus, een proseliet uit Antiochië;", "Hand 18:26": "En hij begon vrijmoedig te spreken in de synagoge. En toen Aquila en Priscilla hem gehoord hadden, namen zij hem tot zich, en legden hem de weg van God nauwkeuriger uit.", "Luk 7:13": "En de Heere, haar ziende, werd innerlijk met ontferming over haar bewogen, en zei tegen haar: Huil niet.", "Joh 17:19": "En Ik heilig Mijzelf voor hen, opdat ook zij geheiligd mogen zijn in waarheid.", "2 Kron 2:16": "En wij zullen hout houwen uit de Libanon, naar al uw behoefte, en zullen het met vlotten over de zee naar Jafo brengen; en u zult het laten ophalen naar Jeruzalem.", "1 Tess 5:19": "Blus de Geest niet uit.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "1 Tim 2:7": "waartoe ik gesteld ben als prediker en apostel (ik zeg de waarheid in Christus, ik lieg niet), een leraar van de heidenen, in geloof en waarheid.", "Joh 5:39": "Onderzoek de Schriften; want u meent daarin het eeuwige leven te hebben; en die zijn het, die van Mij getuigen.", "Hand 22:8": "En ik antwoordde: Wie bent U, Heere? En Hij zei tegen mij: Ik ben Jezus, de Nazarener, Die u vervolgt.", "Matt 19:13": "Toen werden kinderen tot Hem gebracht, opdat Hij de handen op hen zou leggen en bidden; en de discipelen bestraften hen.", "Hand 20:31": "Daarom, waak, en bedenk dat ik drie jaar lang, nacht en dag, niet heb opgehouden ieder met tranen te vermanen.", "1 Kor 4:12": "en wij zwoegen, werkend met onze eigen handen; wij worden uitgescholden, en wij zegenen; wij worden vervolgd, en wij verdragen het;", "Hand 19:19": "Velen ook van hen die toverkunsten hadden beoefend, brachten de boeken bijeen en verbrandden ze voor het oog van allen; en zij berekenden de waarde daarvan, en kwamen tot vijftigduizend zilveren penningen.", "Hand 10:22": "En zij zeiden: Cornelius, een hoofdman over honderd, een rechtvaardig man, en godvrezend, en die goede getuigenis heeft van heel het volk van de Joden, is door een Goddelijke openbaring gewaarschuwd door een heilige engel om u te ontbieden in zijn huis, en om woorden van u te horen.", "1 Kor 2:4": "En mijn spreken en mijn prediking bestond niet uit overtuigende woorden van menselijke wijsheid, maar uit het bewijs van de Geest en van kracht,", "Rom 2:15": "Als mensen die het werk van de wet laten zien, geschreven in hun harten, terwijl hun geweten mede getuigt, en de gedachten elkaar onderling beschuldigen, of ook wel ontschuldigen).", "Ps 21:12": "Want zij hebben kwaad tegen U aangelegd; zij hebben een schandelijke daad bedacht, doch zullen niets vermogen.", "Hand 10:6": "Deze is te gast bij een Simon, leerlooier, die zijn huis heeft bij de zee; deze zal u zeggen wat u moet doen.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Ef 4:12": "Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus;", "Joh 20:16": "Jezus zei tegen haar: Maria! Zij keerde zich om en zei tegen Hem: Rabbouni! Dat betekent: Meester.", "Joh 13:23": "En een van Zijn discipelen, die Jezus liefhad, lag aan tafel dicht bij Jezus.", "1 Joh 4:14": "En wij hebben het gezien, en getuigen dat de Vader Zijn Zoon gezonden heeft tot een Zaligmaker van de wereld.", "2 Kor 12:14": "Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen.", "1 Kor 12:3-11": "Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest. En er is verscheidenheid van gaven, maar het is dezelfde Geest; en er is verscheidenheid van bedieningen, en het is dezelfde Heere;", "Joh 9:8": "De buren dan, en zij die hem eerder gezien hadden dat hij blind was, zeiden: Is dit niet degene die zat te bedelen?", "Hand 11:30": "En dat deden zij ook, en zonden het naar de oudsten, door de hand van Barnabas en Saulus.", "Fil 2:17": "Ja, ook al word ik tot een drankoffer geofferd over de offerande en bediening van uw geloof, dan verblijd ik mij, en verblijd ik mij met u allen.", "2 Tess 1:5": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt;", "Zach 6:15": "En zij die ver weg zijn, zullen komen, en zullen bouwen in de tempel van de HEERE, en u zult weten, dat de HEERE van de heerscharen mij tot u gezonden heeft. Dit zal gebeuren, als u vlijtig zult horen naar de stem van de HEERE, van uw God.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "1 Tim 1:15": "Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "Rom 11:33": "O diepte van de rijkdom, én van de wijsheid én van de kennis van God, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!", "Ex 12:31-33": "Toen riep hij Mozes en Aäron in de nacht, en zei: Maakt u op, trekt uit het midden van mijn volk, u en de kinderen van Israël; en gaat heen, dient de HEERE, zoals u gesproken hebt. Neemt ook met u uw schapen en uw runderen, zoals u gesproken hebt, en gaat heen, en zegent mij ook. En de Egyptenaren drongen sterk aan bij het volk, om ze snel uit het land te drijven; want zij zeiden: Wij zijn allen dood!", "Joz 21:44": "En de HEERE gaf hun rust rondom, naar alles wat Hij hun vaderen gezworen had; en er stond niet één man van al hun vijanden voor hen staande; al hun vijanden gaf de HEERE in hun hand.", "Tit 3:14": "En laat ook de onzen leren goede werken voor te staan, voor de dingen die nodig zijn, opdat zij niet onvruchtbaar zijn.", "1 Kor 1:1": "Paulus, een geroepen apostel van Jezus Christus door de wil van God, en Sosthenes, de broeder,", "Hand 7:19": "Deze gebruikte listen tegen ons volk, en behandelde onze vaders slecht, zodat zij hun jonge kinderen moesten wegwerpen, opdat die niet in leven zouden blijven.", "Matt 3:11": "Ik doop u wel met water tot bekering; maar Hij Die na mij komt, is sterker dan ik, van Wie ik niet waardig ben Zijn schoenen te dragen; Hij zal u met de Heilige Geest en met vuur dopen.", "Micha 2:7": "O u, die het huis van Jakob genoemd wordt! Is de Geest van de HEERE dan verkort? Zijn dat Zijn werken? Doen Mijn woorden geen goed bij wie oprecht wandelt?", "1 Kor 1:27": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen;", "Luk 22:32": "maar Ik heb voor u gebeden, dat uw geloof niet ophoudt; en u, als u eens bekeerd bent, versterk dan uw broeders.", "Job 39:38": "Eenmaal heb ik gesproken, maar zal niet antwoorden; of tweemaal, maar zal niet voortvaren.", "Fil 4:12": "En ik weet vernederd te worden, ik weet ook overvloed te hebben; in alle opzichten en in alles ben ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden.", "Ps 71:7": "Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Hand 5:3": "En Petrus zei: Ananias, waarom heeft de satan uw hart vervuld, dat u de Heilige Geest zou liegen, en onttrekken van de prijs van het land?", "Num 11:21": "En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten!", "1 Kor 1:13-17": "Is Christus gedeeld? Is Paulus voor u gekruisigd? Of bent u in de naam van Paulus gedoopt? Ik dank God, dat ik niemand van u gedoopt heb, dan Krispus en Gajus; Opdat niemand zou zeggen, dat ik in mijn naam gedoopt heb.", "Ex 14:31": "Ook zag Israël de grote hand die de HEERE aan de Egyptenaren bewezen had; en het volk vreesde de HEERE, en geloofde in de HEERE, en in Mozes, Zijn dienaar.", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Jes 55:12": "Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "Hand 2:37": "En toen zij dit hoorden, werden zij diep in het hart getroffen, en zeiden tegen Petrus en de andere apostelen: Wat moeten wij doen, mannen broeders?", "Luk 2:11": "namelijk dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David.", "Hand 14:8": "En een zeker man te Lystre zat zonder kracht in zijn voeten, kreupel van de moederschoot af, die nooit had gelopen.", "Jer 16:19-21": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed. Zal een mens zich goden maken? Zij zijn toch geen goden. Daarom, zie, Ik zal hun bekendmaken op dit moment; Ik zal hun Mijn hand en Mijn macht bekendmaken; en zij zullen weten, dat Mijn Naam is HEERE.", "Hand 27:33-36": "En terwijl het dag zou worden, vermaande Paulus hen allen om voedsel te nemen, en zei: Het is vandaag de veertiende dag dat u wachtend blijft zonder eten, en niets hebt genomen. Daarom vermaan ik u voedsel te nemen, want dat dient tot uw behoud; want niemand van u zal een haar van zijn hoofd verliezen. En toen hij dit gezegd had en brood genomen had, dankte hij God in aanwezigheid van allen; en nadat hij het gebroken had, begon hij te eten.", "Luk 4:15-33": "En Hij leerde in hun synagogen, en werd door allen geprezen. En Hij kwam in Nazareth, waar Hij was opgevoed, en ging, naar Zijn gewoonte, op de dag van de sabbat naar de synagoge; en stond op om te lezen. En Hem werd het boek van de profeet Jesaja gegeven; en toen Hij het boek opengedaan had, vond Hij de plaats waar geschreven was:", "Ps 84:8": "Zij gaan van kracht tot kracht; ieder van hen zal verschijnen voor God in Sion.", "Mark 16:10": "Zij ging heen, en vertelde het aan hen die met Hem geweest waren, die treurden en weenden.", "Joh 7:31": "En velen uit de menigte geloofden in Hem en zeiden: Zal de Christus, wanneer Hij gekomen zal zijn, meer tekenen doen dan deze, die Deze gedaan heeft?", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "2 Kor 3:6": "die ons ook bekwaam gemaakt heeft om dienaars te zijn van het Nieuwe Testament, niet van de letter, maar van de Geest; want de letter doodt, maar de Geest maakt levend.", "Hand 2:42": "En zij bleven volharden in de leer van de apostelen, en in de gemeenschap, en in het breken van het brood, en in de gebeden.", "Openb 19:10": "En ik viel neer voor zijn voeten, om hem te aanbidden, en hij zei tegen mij: Zie toe dat u dat niet doet; ik ben uw mededienstknecht, en uw broeder, die de getuigenis van Jezus hebben; aanbid God. Want de getuigenis van Jezus is de geest van de profetie.", "Hand 9:10-12": "En er was een zekere discipel in Damaskus, met de naam Ananias; en de Heere zei tegen hem in een visioen: Ananias! En hij zei: Zie, hier ben ik, Heere! En de Heere zei tegen hem: Sta op en ga naar de straat die de Rechte genoemd wordt, en vraag in het huis van Judas naar iemand met de naam Saulus, uit Tarsen; want zie, hij bidt. En hij heeft in een visioen gezien dat een man, met de naam Ananias, binnenkwam en hem de hand oplegde, opdat hij weer zou kunnen zien.", "1 Tim 1:12": "En ik dank Hem, Die mij kracht gegeven heeft, namelijk Christus Jezus, onze Heere, dat Hij mij trouw geacht heeft, doordat Hij mij in de bediening gesteld heeft;", "Openb 22:5": "En daar zal geen nacht zijn, en zij zullen geen kaars noch licht van de zon nodig hebben; want de Heere God verlicht hen; en zij zullen als koningen heersen tot in alle eeuwigheid.", "Fil 3:10": "Opdat ik Hem ken, en de kracht van Zijn opstanding, en de gemeenschap met Zijn lijden, gelijkvormig wordend aan Zijn dood;", "Hand 6:9": "En er stonden sommigen op uit de synagoge die de synagoge van de Vrijgelatenen genoemd wordt, en van de Cyreneeërs, en van de Alexandrijnen, en van hen die uit Cilicië en Azië waren, en zij redetwistten met Stefanus.", "2 Kor 12:10": "Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.", "Gen 18:12-14": "Zo lachte Sara bij zichzelf en zei: Zal ik nog wellust hebben, nu ik oud geworden ben, en mijn heer ook oud is? En de HEERE zei tegen Abraham: Waarom heeft Sara gelachen en gezegd: Zou ik werkelijk nog een kind baren, nu ik oud geworden ben? Zou iets voor de HEERE te wonderlijk zijn? Op de vastgestelde tijd zal Ik bij u terugkomen, omstreeks deze tijd volgend jaar, en Sara zal een zoon hebben!", "Joh 7:39": "(En dit zei Hij van de Geest, die zij die in Hem geloven zouden ontvangen; want de Heilige Geest was er nog niet, omdat Jezus nog niet verheerlijkt was.)", "Rom 6:19-22": "Ik spreek op menselijke wijze, vanwege de zwakheid van uw vlees; want zoals u uw leden gesteld hebt om dienstbaar te zijn aan de onreinheid en de ongerechtigheid, tot ongerechtigheid, zo stel nu uw leden om dienstbaar te zijn aan de gerechtigheid, tot heiliging. Want toen u dienstknechten was van de zonde, was u vrij van de gerechtigheid. Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Neh 9:3": "Want toen zij opgestaan waren op hun standplaats, lazen zij in het wetboek van de HEERE, hun God, een vierde deel van de dag; en op een ander vierde deel beleden zij, en aanbaden de HEERE, hun God.", "Matt 1:20": "En terwijl hij deze dingen overwoog, zie, de engel van de Heere verscheen hem in een droom en zei: Jozef, zoon van David! Wees niet bevreesd Maria, uw vrouw, tot u te nemen, want wat in haar ontvangen is, dat is uit de Heilige Geest;", "Joh 21:15": "Toen zij dan de maaltijd gehouden hadden, zei Jezus tegen Simon Petrus: Simon, zoon van Jonas, hebt u Mij meer lief dan dezen? Hij zei tegen Hem: Ja, Heere! U weet dat ik U liefheb. Hij zei tegen hem: Weid Mijn lammeren.", "2 Kor 11:22-33": "Zijn zij Hebreeën? Ik ook. Zijn zij Israëlieten? Ik ook. Zijn zij het zaad van Abraham? Ik ook. Zijn zij dienaars van Christus? (ik spreek als een onwijze) ik ben boven hen; in arbeid overvloediger, in slagen voortreffelijker, in gevangenissen overvloediger, in doodsgevaar menigmaal. Van de Joden heb ik veertig slagen min één, vijfmaal ontvangen.", "Hand 10:38": "namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem.", "Hand 20:7": "En op de eerste dag van de week, toen de discipelen bijeengekomen waren om brood te breken, sprak Paulus met hen, van plan de volgende dag te vertrekken; en hij zette zijn toespraak voort tot middernacht.", "Neh 5:15": "En de vorige landvoogden, die vóór mij geweest zijn, hebben het volk bezwaard en van hen genomen aan brood en wijn, daarna veertig zilveren sikkels; ook heersten hun knechten over het volk; maar ik heb dat niet gedaan, om de vreze van God.", "Ezech 44:7": "Omdat u vreemden hebt binnengebracht, onbesnedenen van hart en onbesnedenen van vlees, om in Mijn heiligdom te zijn, om dat te ontheiligen, namelijk Mijn huis; toen u Mijn brood, het vette en het bloed offerde, en zij Mijn verbond verbraken, naast al uw gruwelen.", "Gal 1:15": "Maar toen het God behaagd heeft, Die mij van mijn moeders schoot af afgezonderd heeft, en geroepen door Zijn genade,", "Gen 22:11": "Maar de Engel van de HEERE riep tot hem vanuit de hemel, en zei: Abraham, Abraham! En hij zei: Zie, hier ben ik!", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "1 Kor 9:12": "Als anderen deze macht over u deelachtig zijn, waarom wij dan niet veel meer? Toch hebben wij deze macht niet gebruikt, maar wij verdragen alles, opdat wij geen enkele verhindering geven aan het Evangelie van Christus.", "1 Kor 14:4": "Wie een vreemde taal spreekt, sticht zichzelf; maar wie profeteert sticht de Gemeente.", "Joh 9:1": "Toen Hij voorbijging, zag Hij een man die blind was van zijn geboorte af.", "Ex 3:11": "Toen zei Mozes tegen God: Wie ben ik, dat ik naar Farao zou gaan; en dat ik de kinderen van Israël uit Egypte zou voeren?", "Joh 11:3": "Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.", "Ps 103:9": "Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden.", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "1 Kon 17:23": "En Elia nam het kind, en bracht hem van de opperzaal naar beneden, het huis in, en gaf hem aan zijn moeder; en Elia zei: Zie, uw zoon leeft.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Joh 15:8": "Hierin is Mijn Vader verheerlijkt, dat u veel vrucht draagt; en u zult Mijn discipelen zijn.", "2 Kor 6:5": "in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Fil 2:16": "Doordat u vasthoudt aan het woord van het leven, mij tot een roem tegen de dag van Christus, dat ik niet tevergeefs gelopen heb, en ook niet tevergeefs gearbeid heb.", "1 Kor 4:11-13": "Tot op dit huidige uur lijden wij honger, en lijden wij dorst, en zijn naakt, en worden met vuisten geslagen, en hebben geen vaste woonplaats; en wij zwoegen, werkend met onze eigen handen; wij worden uitgescholden, en wij zegenen; wij worden vervolgd, en wij verdragen het; wij worden belasterd, en wij smeken; wij zijn geworden als het uitvaagsel van de wereld, en het afschraapsel van alles, tot nu toe.", "2 Kor 3:17": "De Heere nu is de Geest; en waar de Geest van de Heere is, daar is vrijheid.", "Hand 7:51": "U hardnekkigen en onbesnedenen van hart en oren, u weerstaat altijd de Heilige Geest; zoals uw vaders deden, zo doet u ook.", "Ps 68:32": "Prinselijke gezanten zullen komen uit Egypte; Morenland zal zich haasten zijn handen tot God uit te strekken.", "1 Kor 2:2": "Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd.", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "1 Tim 1:13-15": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof. Maar de genade van onze Heere is zeer overvloedig geweest, met geloof en liefde, die er is in Christus Jezus. Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "Hand 13:5-44": "En toen zij in Salamis gekomen waren, verkondigden zij het woord van God in de synagogen van de Joden; en zij hadden ook Johannes als dienaar. En toen zij het eiland doorgegaan waren tot Pafos toe, vonden zij een zekere tovenaar, een valse profeet, een Jood, wiens naam was Bar-jezus; Deze was bij de stadhouder Sergius Paulus, een verstandig man. Deze riep Barnabas en Saulus bij zich, en verlangde ernaar het Woord van God te horen.", "1 Tess 4:8": "Wie dan dit verwerpt, verwerpt geen mens, maar God, Die ook Zijn Heilige Geest in ons heeft gegeven.", "Gal 2:13": "En ook de andere Joden veinsden met hem mee; zodat ook Barnabas werd meegesleept door hun veinzerij.", "Ps 102:19-23": "Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven; Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben; Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Hand 22:19": "En ik zei: Heere, zij weten dat ik hen die in U geloofden, in de gevangenis wierp en in de synagogen geselde;", "Jes 54:1-3": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "2 Kor 4:5": "Want wij prediken niet onszelf, maar Christus Jezus, de Heere; en onszelf als uw dienaars, om Jezus' wil.", "1 Kor 10:22": "Of willen wij de Heere tot jaloersheid tergen? Zijn wij soms sterker dan Hij?", "Rom 14:19": "Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient.", "Kol 2:12": "Met Hem begraven in de doop, waarin u ook met Hem opgewekt bent door het geloof in de werking van God, Die Hem uit de doden opgewekt heeft.", "Ps 25:9": "Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren.", "Tit 3:8": "Dit is een betrouwbaar woord, en ik wil dat u deze dingen met ernst bevestigt, opdat zij die aan God geloven, er zorg voor dragen goede werken voor te staan; deze dingen zijn goed en nuttig voor de mensen.", "Matt 19:30": "Maar veel eersten zullen de laatsten zijn, en veel laatsten de eersten.", "Joh 19:7": "De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelf Gods Zoon gemaakt.", "1 Petr 3:18": "Want Christus heeft ook eenmaal voor de zonden geleden, Hij, de Rechtvaardige, voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Hij is wel gedood in het vlees, maar levend gemaakt door de Geest;", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Ps 121:8": "De HEERE zal uw uitgaan en uw ingaan bewaren, van nu aan tot in eeuwigheid.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "2 Kor 7:11": "Want zie, ditzelfde, dat u naar God bedroefd bent geworden, hoe grote naarstigheid heeft dat in u gewerkt? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt u uzelf bewezen rein te zijn in deze zaak.", "Joh 18:9": "Zodat het woord vervuld zou worden dat Hij gezegd had: Van hen die U Mij gegeven hebt, heb Ik niemand verloren.", "Hand 2:12": "En zij ontzetten zich allen, en wisten niet wat zij ervan moesten denken, en zeiden de een tegen de ander: Wat zou dit toch betekenen?", "Joh 14:8-11": "Filippus zei tegen Hem: Heere, toon ons de Vader, en het is ons genoeg. Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader? Gelooft u niet dat Ik in de Vader ben, en de Vader in Mij is? De woorden die Ik tegen u spreek, spreek Ik niet uit Mijzelf, maar de Vader, Die in Mij blijft, Die doet de werken.", "Hebr 10:15": "En de Heilige Geest getuigt ons dit ook;", "Jes 2:2-5": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Tit 2:11": "Want de genade van God die zaligmakend is, is verschenen aan alle mensen.", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Hand 19:8": "En hij ging de synagoge in, en sprak vrijmoedig, drie maanden lang met hen sprekend, en hen aanradend om de zaken van het Koninkrijk van God aan te nemen.", "2 Kor 3:3": "omdat u openbaar geworden bent als een brief van Christus, door onze bediening opgesteld, geschreven niet met inkt, maar door de Geest van de levende God, niet op stenen tafels, maar op tafels van vlees, van het hart.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Mark 16:11": "En toen dezen hoorden dat Hij leefde, en door haar gezien was, geloofden zij het niet.", "Hand 4:27": "Want in waarheid zijn tegen Uw heilig Kind Jezus, Die U gezalfd hebt, bijeengekomen, zowel Herodes en Pontius Pilatus, met de heidenen en de volken van Israël;", "Hand 4:30": "Doordat U Uw hand uitstrekt tot genezing, en doordat er tekenen en wonderen gebeuren door de Naam van Uw heilig Kind Jezus.", "Luk 10:41": "En Jezus antwoordde en zei tegen haar: Martha, Martha, u maakt zich zorgen en bent onrustig over veel dingen;", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Hand 16:31": "En zij zeiden: Geloof in de Heere Jezus Christus, en u zult zalig worden, u en uw huis.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Luk 6:13": "En toen het dag geworden was, riep Hij Zijn discipelen bij Zich, en koos er twaalf van hen uit, die Hij ook apostelen noemde:", "Gen 20:2": "Toen Abraham nu van Sara, zijn vrouw, gezegd had: Zij is mijn zuster, stuurde Abimelech, de koning van Gerar, iemand en nam Sara weg.", "Jes 11:1-10": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "1 Sam 3:4": "dat de HEERE Samuël riep; en hij zei: Hier ben ik.", "1 Joh 2:24": "Wat u dan vanaf het begin gehoord hebt, laat dat in u blijven. Als in u blijft, wat u vanaf het begin gehoord hebt, dan zult u ook in de Zoon en in de Vader blijven.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Hand 22:12-16": "En een zekere Ananias, een godvruchtig man naar de wet, die goede getuigenis had van al de Joden die daar woonden, kwam naar mij toe, en bij mij staande zei hij tegen mij: Saul, broeder, word weer ziende! En op datzelfde moment kon ik hem weer zien. En hij zei: De God van onze vaderen heeft u van tevoren bestemd om Zijn wil te kennen, en de Rechtvaardige te zien, en de stem uit Zijn mond te horen.", "Jes 45:6": "Opdat men weet, vanaf de opgang van de zon tot aan de ondergang, dat er buiten Mij niets is, Ik ben de HEERE, en niemand meer.", "Hand 19:20": "Zo groeide het Woord van de Heere met kracht, en kreeg de overhand.", "Mark 13:11": "Maar wanneer zij u zullen wegleiden om u over te leveren, maak u dan niet vooraf bezorgd over wat u zult spreken, en bedenk het niet van tevoren; maar wat u in dat uur gegeven zal worden, spreek dat; want u bent het niet die spreekt, maar de Heilige Geest.", "Joh 16:7": "Doch Ik zeg u de waarheid: het is nuttig voor u dat Ik wegga; want als Ik niet wegga, zal de Trooster niet tot u komen; maar als Ik heenga, zal Ik Hem tot u zenden.", "Hand 10:45": "En de gelovigen die uit de besnijdenis waren, zovelen als er met Petrus meegekomen waren, waren buiten zichzelf, omdat de gave van de Heilige Geest ook op de heidenen uitgestort werd.", "Jer 29:13": "En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Mark 1:39": "En Hij predikte in hun synagogen, door heel Galilea, en dreef de duivels uit.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Est 3:8-13": "Want Haman had tegen de koning Ahasveros gezegd: Er is een volk, verstrooid en verspreid onder de volken in alle landschappen van uw koninkrijk; en hun wetten zijn anders dan die van alle volken; ook houden zij zich niet aan de wetten van de koning; daarom is het voor de koning niet goed hen te laten blijven. Als het de koning goeddunkt, laat er geschreven worden dat men hen ombrengt; dan zal ik tienduizend talenten zilver opwegen in de handen van hen die het werk doen, om het in de schatten van de koning te brengen. Toen trok de koning zijn ring van zijn hand, en hij gaf hem aan Haman, de zoon van Hammedatha, de Agagiet, de tegenstander van de Joden.", "Joh 11:37": "En sommigen van hen zeiden: Kon Hij, Die de ogen van de blinde geopend heeft, niet maken dat ook deze niet gestorven was?", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Luk 20:41-44": "En Hij zei tegen hen: Hoe kunnen ze zeggen dat de Christus de Zoon van David is? En David zelf zegt in het boek van de Psalmen: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank voor Uw voeten zal gezet hebben.", "Ps 38:3-7": "Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald. Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde. Want mijn ongerechtigheden gaan over mijn hoofd; als een zware last zijn zij mij te zwaar geworden.", "1 Kor 3:2": "Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet.", "Judas 1:9": "Maar Michaël, de aartsengel, toen hij met de duivel twistte en handelde over het lichaam van Mozes, durfde geen oordeel van lastering tegen hem uitspreken, maar zei: De Heere bestraft u!", "Luk 23:43": "En Jezus zei tegen hem: Voorwaar, Ik zeg u: Vandaag zult u met Mij in het Paradijs zijn.", "Richt 6:13": "Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven.", "Spr 11:6": "De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid.", "Hand 15:41": "En hij doorreisde Syrië en Cilicië, en versterkte de gemeenten.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "2 Kor 12:19": "Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw.", "Matt 12:28": "Maar als Ik door de Geest van God de duivels uitwerp, dan is het Koninkrijk van God tot u gekomen.", "Hand 26:27": "Gelooft u, o koning Agrippa, de profeten? Ik weet dat u ze gelooft.", "Hand 20:12": "En zij brachten de jongen levend weg, en waren buitengewoon vertroost.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Neh 9:20": "En U hebt Uw goede Geest gegeven om hen te onderwijzen; en Uw Manna hebt U niet geweerd van hun mond, en water hebt U hun gegeven voor hun dorst.", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "Ezech 7:26": "Ellende zal op ellende komen, en er zal gerucht op gerucht wezen; dan zullen zij het visioen van een profeet zoeken; maar de wet zal vergaan van de priester, en de raad van de oudsten.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Ef 5:29": "Want niemand heeft ooit zijn eigen vlees gehaat, maar hij voedt het, en verzorgt het, zoals ook de Heere de Gemeente.", "Jes 56:6-8": "En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden; Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken. De Heere HEERE, Die de verdrevenen van Israël bijeenbrengt, spreekt: Ik zal er bij hem nog meer bijeenbrengen, naast hen die al bij hem bijeengebracht zijn.", "Ex 14:20": "En zij kwam tussen het leger van de Egyptenaren en tussen het leger van Israël; en de wolk was tegelijk duisternis en verlichtte de nacht; zodat de een tot de ander niet naderde de hele nacht.", "Hand 24:26": "En tegelijk ook hopend, dat hem door Paulus geld gegeven zou worden, opdat hij hem zou vrijlaten; daarom ontbood hij hem ook vaak, en sprak met hem.", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "Joh 10:14-16": "Ik ben de goede Herder; en Ik ken de Mijnen, en word door de Mijnen gekend. Zoals de Vader Mij kent, zo ken Ik ook de Vader; en Ik geef Mijn leven voor de schapen. Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "1 Kor 4:20": "Want het Koninkrijk van God bestaat niet in woorden, maar in kracht.", "Hand 2:21": "En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "Hand 16:32": "En zij spraken tot hem het woord van de Heere, en tot allen die in zijn huis waren.", "Ex 10:16": "Toen haastte Farao zich om Mozes en Aäron te roepen, en zei: Ik heb gezondigd tegen de HEERE, uw God, en tegen u.", "Gal 1:18": "Daarna, na drie jaar, ging ik naar Jeruzalem om Petrus te bezoeken, en ik bleef bij hem vijftien dagen.", "Jer 3:17": "In die tijd zullen zij Jeruzalem noemen: de troon van de HEERE; en alle heidenvolken zullen daar samenkomen, vanwege de Naam van de HEERE, in Jeruzalem; en zij zullen niet meer wandelen naar het goeddunken van hun slechte hart.", "Joh 1:33": "En ik kende Hem niet; maar Die mij gezonden heeft om te dopen met water, Die had mij gezegd: Op Wie u de Geest zult zien neerdalen en op Hem blijven, Deze is het, Die met de Heilige Geest doopt.", "Joh 9:25": "Hij dan antwoordde en zei: Of Hij een zondaar is, weet ik niet; één ding weet ik, dat ik blind was en nu zie.", "Hand 22:18": "en dat ik Hem zag, en Hij tegen mij zei: Haast u, en ga snel uit Jeruzalem weg; want zij zullen uw getuigenis over Mij niet aannemen.", "Est 8:17": "Ook in elk landschap, en in elke stad, op elke plaats waar het woord van de koning en zijn wet aankwam, daar was bij de Joden blijdschap en vreugde, maaltijden en vrolijke dagen; en velen uit de volken van het land werden Joden, want de vreze voor de Joden was op hen gevallen.", "Ps 112:4-8": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig. Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht. Caph. Zeker, hij zal in eeuwigheid niet wankelen; Lamed. de rechtvaardige zal in eeuwige gedachtenis zijn.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Joh 11:43-45": "En toen Hij dit gezegd had, riep Hij met luide stem: Lazarus, kom naar buiten! En de gestorvene kwam naar buiten, gebonden aan handen en voeten met grafdoeken, en zijn gezicht was omwonden met een zweetdoek. Jezus zei tegen hen: Maak hem los, en laat hem gaan. Velen dan van de Joden, die naar Maria gekomen waren, en gezien hadden wat Jezus gedaan had, geloofden in Hem.", "Job 28:28": "Maar tegen de mens heeft Hij gezegd: Zie, de vreze des Heeren, dat is de wijsheid, en van het kwade te wijken is het verstand.", "Hand 20:22": "En nu, zie, ik, gebonden door de Geest, reis naar Jeruzalem, zonder te weten wat mij daar zal overkomen;", "Rom 6:3": "Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn?", "Joh 8:25": "Zij zeiden dan tegen Hem: Wie bent U? En Jezus zei tegen hen: Wat Ik van het begin af aan u al zeg.", "Jes 63:7-9": "Ik zal de blijken van goedertierenheid van de HEERE vermelden, de veelvoudige lof van de HEERE, naar alles wat de HEERE ons heeft bewezen, en de grote goedheid aan het huis van Israël, die Hij hun bewezen heeft, naar Zijn barmhartigheden, en naar de veelheid van Zijn blijken van goedertierenheid. Want Hij zei: Zij zijn zeker Mijn volk, kinderen die niet liegen zullen? Zo is Hij hun geworden tot een Heiland. In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Fil 1:22-25": "Maar of ik in het vlees zal leven, dat is voor mij een vruchtbare arbeid, en wat ik zal kiezen, weet ik niet. Want ik word door deze twee gedrongen: ik heb het verlangen om heen te gaan en met Christus te zijn, want dat is verreweg het beste; Maar in het vlees te blijven is nodiger vanwege u.", "Hand 11:21": "En de hand van de Heere was met hen; en een groot aantal geloofde en bekeerde zich tot de Heere.", "Hand 1:21": "Het is dan nodig dat van de mannen die met ons omgegaan hebben al de tijd waarin de Heere Jezus onder ons in- en uitgegaan is,", "Joh 11:36": "De Joden dan zeiden: Zie, hoe lief Hij hem had!", "Hand 1:2": "tot op de dag waarop Hij opgenomen is, nadat Hij door de Heilige Geest de apostelen die Hij uitverkoren had, bevelen had gegeven.", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Ef 4:5": "Eén Heere, één geloof, één doop,", "Kol 1:24": "die mij nu verblijd in mijn lijden voor u, en aanvult in mijn vlees wat nog ontbreekt aan de verdrukkingen van Christus, voor Zijn lichaam, dat is de Gemeente;", "Ex 4:10": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "Gal 4:19": "mijn kinderen, voor wie ik opnieuw weeën lijd totdat Christus gestalte in u krijgt.", "Jes 44:5": "Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Ef 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, aan de heiligen die te Efeze zijn, en gelovigen in Christus Jezus:", "1 Kor 2:10-14": "Maar God heeft het ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten van God. Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God. Maar wij hebben niet de geest van de wereld ontvangen, maar de Geest Die uit God is, opdat wij zouden weten de dingen die ons door God geschonken zijn;", "Luk 18:7-14": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen? Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde? En Hij vertelde ook aan sommigen, die op zichzelf vertrouwden dat zij rechtvaardig waren en de anderen niets waard achtten, deze gelijkenis:", "Luk 24:44": "En Hij zei tegen hen: Dit zijn de woorden die Ik tot u sprak, toen Ik nog bij u was, namelijk dat alles moest vervuld worden wat over Mij geschreven is in de Wet van Mozes, en de Profeten, en de Psalmen.", "Hand 8:25": "Zij dan nu, toen zij het Woord van de Heere betuigd en gesproken hadden, keerden terug naar Jeruzalem, en verkondigden het Evangelie in veel dorpen van de Samaritanen.", "Hand 10:4": "En hij hield de ogen op hem gericht, en werd zeer bevreesd, en zei: Wat is er, Heere? En Hij zei tegen hem: Uw gebeden en uw aalmoezen zijn als gedachtenis opgekomen voor God.", "2 Kor 4:8-12": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven; Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Ef 1:17": "Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Joh 1:17": "Want de wet is door Mozes gegeven, de genade en de waarheid is door Jezus Christus geworden.", "Jer 1:6": "Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Luk 13:29": "En er zullen mensen komen van oost en west, en van noord en zuid, en zullen aanzitten in het Koninkrijk van God.", "Joh 4:29": "Kom, kijk naar een Mens Die mij alles gezegd heeft wat ik gedaan heb; is Deze niet de Christus?", "Hand 21:5": "Toen het nu gebeurde dat wij deze dagen hadden doorgebracht, gingen wij weg en reisden verder; en zij begeleidden ons allen, met vrouwen en kinderen, tot buiten de stad; en wij knielden neer aan de oever en baden.", "Hand 11:29": "En naarmate ieder van de discipelen in staat was, besloot elk van hen iets te sturen ten dienste van de broeders die in Judea woonden.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Jes 65:1": "Ik ben gevonden door hen die naar Mij niet vroegen; Ik ben gevonden door hen die Mij niet zochten; tegen het volk, dat naar Mijn Naam niet genoemd was, heb Ik gezegd: Zie, hier ben Ik, zie, hier ben Ik.", "Joh 6:69": "En wij hebben geloofd en erkend dat U de Christus bent, de Zoon van de levende God.", "Rom 9:15-24": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben. Zo hangt het dan niet af van hem die wil, ook niet van hem die loopt, maar van God Die Zich ontfermt. Want de Schrift zegt tegen Farao: Hiertoe heb Ik u doen opstaan, opdat Ik in u Mijn kracht zou bewijzen, en opdat Mijn Naam verkondigd wordt op de hele aarde.", "Hand 16:33": "En hij nam hen op datzelfde uur van de nacht mee, en waste hun striemen; en hij werd meteen gedoopt, en al de zijnen.", "Joh 12:10": "En de overpriesters beraadslaagden om ook Lazarus te doden,", "Pred 9:7": "Ga dan heen, eet uw brood met vreugde, en drink uw wijn met een vrolijk hart; want God heeft al een behagen in uw werken.", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Luk 22:31": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe;", "1 Kor 13:1": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn.", "Ef 6:19": "en voor mij, opdat mij het Woord gegeven wordt bij het openen van mijn mond, met vrijmoedigheid, om de verborgenheid van het Evangelie bekend te maken;", "Matt 9:36": "En Hij zag de menigten, en werd innerlijk met ontferming bewogen over hen, omdat zij vermoeid en verstrooid waren, zoals schapen die geen herder hebben.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Hand 9:36-43": "En in Joppe was een zekere discipelin, met de naam Tabitha, wat vertaald Dorkas betekent. Deze vrouw was vol van goede werken en liefdegaven die zij gaf. En het gebeurde in die dagen dat zij ziek werd en stierf; en toen zij haar gewassen hadden, legden zij haar in de bovenzaal. En omdat Lydda dicht bij Joppe was, stuurden de discipelen, toen zij hoorden dat Petrus daar was, twee mannen naar hem toe, die hem smeekten niet te aarzelen naar hen over te komen.", "Hand 2:1-4": "En toen de dag van het Pinksterfeest vervuld werd, waren zij allen eendrachtig bijeen. En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen.", "1 Joh 3:7": "Kinderen, laat niemand u verleiden. Die de rechtvaardigheid doet, is rechtvaardig, zoals Hij rechtvaardig is.", "Rom 1:13-15": "Maar ik wil niet dat het u onbekend is, broeders, dat ik dikwijls van plan geweest ben naar u toe te komen (en tot nu toe verhinderd ben geweest), opdat ik ook onder u enige vrucht zou hebben, zoals ook onder de andere heidenen. Aan Grieken en barbaren, aan wijzen en onwijzen ben ik een schuldenaar. Zo ben ik, voor zover het aan mij ligt, gereed om ook aan u die in Rome bent het Evangelie te verkondigen.", "Jes 11:10": "Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.", "Micha 4:3": "En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "Joh 20:30": "Jezus heeft nog wel veel andere tekenen gedaan, in aanwezigheid van Zijn discipelen, die niet in dit boek geschreven zijn;", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "Matt 13:55": "Is Dit niet de zoon van de timmerman? Heet Zijn moeder niet Maria, en Zijn broers Jakobus en Joses, en Simon en Judas?", "Matt 28:17": "En toen zij Hem zagen, aanbaden zij Hem; maar sommigen twijfelden.", "Gen 19:30": "En Lot trok weg uit Zoar, en woonde op de berg, en zijn twee dochters met hem; want hij was bang om in Zoar te wonen. En hij woonde in een grot, hij en zijn twee dochters.", "2 Kor 8:12": "Want als de bereidheid van het gemoed er eerst is, dan is iemand aangenaam naar wat hij heeft, niet naar wat hij niet heeft.", "Hoogl 8:14": "Kom haastig, mijn Liefste! En wees als een ree, of als een welp van de herten, op de bergen van de specerijen.", "Ps 94:12": "Gelukkig is de man, o HEERE! die Gij tuchtigt, en die Gij leert uit Uw wet,", "1 Sam 10:10-12": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden. En het gebeurde, toen ieder die hem vroeger gekend had, zag dat hij, zie, profeteerde met de profeten, dat het volk zei, de een tegen de ander: Wat is dit, dat de zoon van Kis is overkomen? Is Saul ook onder de profeten? Toen antwoordde een man vandaar, en zei: Wie is toch hun vader? Daarom is het een spreekwoord geworden: Is Saul ook onder de profeten?", "Joh 11:5": "Jezus nu had Martha, en haar zuster, en Lazarus lief.", "1 Kor 15:1-32": "Verder, broeders, ik maak u het Evangelie bekend, dat ik u verkondigd heb, dat u ook aangenomen hebt, en waarin u ook staat; door wie u ook zalig wordt, als u het vasthoudt op de manier zoals ik het u verkondigd heb; tenzij u tevergeefs geloofd hebt. Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften;", "1 Joh 3:3": "En ieder die deze hoop op Hem heeft, reinigt zichzelf, zoals Hij rein is.", "Rom 5:5": "En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Hand 9:23-25": "En toen er veel dagen verlopen waren, spanden de Joden samen om hem te doden. Maar hun plan werd Saulus bekend; en zij bewaakten de poorten, zowel overdag als 's nachts, om hem te kunnen doden. Maar de discipelen namen hem 's nachts en lieten hem neer door de muur, door hem in een mand te laten zakken.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "1 Petr 4:2": "om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees.", "Hand 16:7": "En toen zij bij Mysië gekomen waren, probeerden zij naar Bithynië te reizen; maar de Geest liet het hun niet toe.", "1 Joh 5:10": "Wie in de Zoon van God gelooft, heeft het getuigenis in zichzelf; wie God niet gelooft, heeft Hem tot een leugenaar gemaakt, omdat hij niet geloofd heeft het getuigenis dat God getuigd heeft van Zijn Zoon.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "Hand 19:13-18": "En sommigen van de Joden die rondtrokken, en die duivelbezweerders waren, hebben zich eraan gewaagd de Naam van de Heere Jezus te noemen over hen die boze geesten hadden, en zeiden: Wij bezweren u bij Jezus, Die Paulus predikt! Dit waren zeven zonen van een zekere Sceva, een Joodse overpriester, die dit deden. Maar de boze geest antwoordde en zei: Jezus ken ik, en Paulus weet ik; maar u, wie bent u?", "Luk 12:11": "En wanneer zij u zullen brengen voor de synagogen, en voor de overheden en de machten, wees dan niet bezorgd hoe of wat u ter verantwoording zult zeggen, of wat u zult spreken;", "Hand 13:15": "En na het lezen van de wet en de profeten, zonden de leiders van de synagoge iemand naar hen toe, en zeiden: Mannen broeders, als er enig woord van bemoediging voor het volk in u is, spreek dan.", "Rom 1:4": "Die met kracht bewezen is de Zoon van God te zijn, naar de Geest van de heiligmaking, uit de opstanding van de doden), namelijk Jezus Christus, onze Heere:", "Kol 1:10": "opdat u mag wandelen op een manier die de Heere waardig is, tot alle behagelijkheid, terwijl u in alle goede werken vrucht draagt en meer wordt in de kennis van God;", "Hand 22:16": "En nu, waarom wacht u nog? Sta op, laat u dopen en uw zonden afwassen, terwijl u de Naam van de Heere aanroept.", "Joh 19:26": "Toen Jezus dan Zijn moeder zag, en de discipel die Hij liefhad, daarbij staande, zei Hij tegen Zijn moeder: Vrouw, zie, uw zoon.", "Hand 13:16-43": "En Paulus stond op, en wenkte met de hand, en zei: Israëlitische mannen, en u die God vreest, hoor toe. De God van dit volk Israël heeft onze vaderen uitverkoren, en het volk verhoogd, toen zij als vreemdelingen in het land Egypte woonden, en heeft hen met een sterke arm daaruit geleid. En Hij heeft ongeveer veertig jaar lang hun gedrag verdragen in de woestijn.", "1 Kor 15:29": "Anders, wat zullen zij doen die voor de doden gedoopt worden, als de doden helemaal niet opgewekt worden? Waarom worden zij dan voor de doden gedoopt?", "Gal 2:9": "en toen Jakobus, en Cefas, en Johannes, die geacht werden pilaren te zijn, de genade die mij gegeven was, erkenden, gaven zij mij en Barnabas de rechterhand van gemeenschap, opdat wij naar de heidenen, en zij naar de besnedenen zouden gaan;", "Hand 3:12": "En Petrus, die dit zag, antwoordde het volk: Israëlieten, wat verbaast u zich hierover, of wat kijkt u zo strak naar ons, alsof wij door onze eigen kracht of vroomheid deze man hebben laten lopen?", "Hand 9:1-14": "En Saulus, die nog steeds dreiging en moord blies tegen de discipelen van de Heere, ging naar de hogepriester, en vroeg hem om brieven aan de synagogen in Damaskus, opdat hij, als hij daar iemand zou vinden die van die weg was, zowel mannen als vrouwen, hen gebonden naar Jeruzalem zou brengen. En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel;", "Job 40:4": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen?", "Hand 16:30": "En hij bracht hen naar buiten en zei: Beste heren, wat moet ik doen om zalig te worden?", "Hand 21:27-33": "Toen nu de zeven dagen bijna voleindigd waren, zagen de Joden uit Azië hem in de tempel, en brachten al het volk in opschudding, en sloegen de handen aan hem, En riepen: Israëlitische mannen, kom te hulp! Dit is de man die overal iedereen leert tegen het volk, en de wet, en deze plaats; en bovendien heeft hij ook Grieken de tempel binnengebracht, en heeft deze heilige plaats ontheiligd. Want zij hadden eerder Trofimus, de Efeziër, met hem in de stad gezien, van wie zij dachten dat Paulus hem de tempel had binnengebracht.", "Hand 25:11": "Want als ik onrecht doe en iets gedaan heb dat de dood verdient, weiger ik niet te sterven; maar als er niets waar is van wat dezen mij beschuldigen, kan niemand mij uit gunst aan hen overgeven. Ik beroep mij op de keizer.", "Hand 13:16-52": "En Paulus stond op, en wenkte met de hand, en zei: Israëlitische mannen, en u die God vreest, hoor toe. De God van dit volk Israël heeft onze vaderen uitverkoren, en het volk verhoogd, toen zij als vreemdelingen in het land Egypte woonden, en heeft hen met een sterke arm daaruit geleid. En Hij heeft ongeveer veertig jaar lang hun gedrag verdragen in de woestijn.", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "2 Kor 13:5": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent.", "1 Tess 1:6": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest;", "Matt 19:14": "Maar Jezus zei: Laat de kinderen begaan, en verhinder hen niet om tot Mij te komen; want voor zulken is het Koninkrijk der hemelen.", "Matt 25:45": "Dan zal Hij hun antwoorden: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze minsten niet gedaan hebt, hebt u het Mij ook niet gedaan.", "Gal 3:14": "Opdat de zegening van Abraham tot de heidenen komen zou in Christus Jezus, en opdat wij de belofte van de Geest zouden verkrijgen door het geloof.", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "1 Petr 4:14": "Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.", "Matt 14:14": "En toen Jezus naar buiten ging, zag Hij een grote menigte, en werd innerlijk met ontferming over hen bewogen, en genas hun zieken.", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "Hand 3:16": "En door het geloof in Zijn Naam heeft Zijn Naam deze man sterk gemaakt, die u ziet en kent; en het geloof, dat door Hem is, heeft hem deze volmaakte gezondheid gegeven, in aanwezigheid van u allen.", "Joh 10:3": "Voor hem doet de deurwachter open, en de schapen horen zijn stem; en hij roept zijn eigen schapen bij naam, en leidt ze naar buiten.", "Hand 2:46": "En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "Matt 8:17": "opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.", "Zach 3:8": "Hoor nu toe, Jozua, u hogepriester! U en uw vrienden, die voor uw aangezicht zitten, want zij zijn een wonderteken; want zie, Ik zal Mijn Knecht, de SPRUITE, doen komen.", "Jer 29:12": "Dan zult u Mij aanroepen, en heengaan, en tot Mij bidden; en Ik zal naar u horen.", "Num 27:18": "Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem;", "Hand 18:28": "Want hij weerlegde de Joden met grote kracht in het openbaar, en bewees door de Schriften dat Jezus de Christus was.", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "1 Joh 3:1": "Zie, hoe grote liefde de Vader ons gegeven heeft, namelijk dat wij kinderen van God genoemd zouden worden. Daarom kent de wereld ons niet, omdat zij Hem niet kent.", "Hebr 2:11": "Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen,", "Hand 9:37-40": "En het gebeurde in die dagen dat zij ziek werd en stierf; en toen zij haar gewassen hadden, legden zij haar in de bovenzaal. En omdat Lydda dicht bij Joppe was, stuurden de discipelen, toen zij hoorden dat Petrus daar was, twee mannen naar hem toe, die hem smeekten niet te aarzelen naar hen over te komen. En Petrus stond op en ging met hen mee; en toen hij daar aangekomen was, brachten zij hem naar de bovenzaal. En alle weduwen stonden bij hem, huilend, en zij toonden de hemden en kleren die Dorkas gemaakt had, toen zij nog bij hen was.", "Hand 13:14": "En zij trokken van Perge het land door, en kwamen te Antiochië, een stad in Pisidië; en gingen op de dag van de sabbat de synagoge in, en gingen zitten.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Fil 3:12-14": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben. Broeders, ik acht niet dat ik het zelf al gegrepen heb. Maar één ding doe ik: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.", "Hand 24:25": "En toen hij sprak over rechtvaardigheid, en zelfbeheersing, en over het komende oordeel, werd Felix zeer bevreesd, en antwoordde: Voor nu kunt u gaan; en wanneer ik een geschikte tijd zal hebben, zal ik u weer bij mij roepen.", "Joh 8:18": "Ik ben het, Die van Mijzelf getuig, en de Vader, Die Mij gezonden heeft, getuigt van Mij.", "Joh 12:28-30": "Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken. De menigte dan, die daar stond en dit hoorde, zei dat het gedonderd had. Anderen zeiden: Een engel heeft tegen Hem gesproken. Jezus antwoordde en zei: Niet om Mij is deze stem gebeurd, maar om u.", "Jes 45:22-24": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer. Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren. Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "Joh 13:1": "En voor het feest van het Pascha wist Jezus dat Zijn tijd gekomen was om uit deze wereld over te gaan tot de Vader; en omdat Hij de Zijnen, die in de wereld waren, liefgehad had, zo heeft Hij hen liefgehad tot het einde.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Num 12:6": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken.", "Hand 9:3-22": "En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel; en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij? En hij zei: Wie bent U, Heere? En de Heer
