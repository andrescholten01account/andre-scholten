 hen. Maar Jezus zei: Laat de kinderen begaan, en verhinder hen niet om tot Mij te komen; want voor zulken is het Koninkrijk der hemelen. En toen Hij hun de handen opgelegd had, vertrok Hij vandaar.", "Rom 7:4-6": "Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, namelijk aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen. Want toen wij in het vlees waren, werkten de hartstochten van de zonden, die door de wet geprikkeld worden, in onze leden, om vruchten te dragen voor de dood. Maar nu zijn wij vrijgemaakt van de wet, omdat wij gestorven zijn aan datgene waaronder wij vastgehouden werden; zodat wij dienen in nieuwheid van de Geest, en niet in de oudheid van de letter.", "Matt 10:21-25": "En de ene broer zal de andere broer overleveren tot de dood, en de vader het kind, en de kinderen zullen opstaan tegen de ouders, en hen doden. En u zult door allen gehaat worden om Mijn Naam; maar wie volhardt tot het einde, die zal behouden worden. Wanneer zij u dan in deze stad vervolgen, vlucht dan naar de andere; want voorwaar, Ik zeg u: u zult uw reis door de steden van Israël niet beëindigd hebben, voordat de Zoon des mensen gekomen zal zijn.", "2 Tess 1:10": "Wanneer Hij gekomen zal zijn om verheerlijkt te worden in Zijn heiligen, en bewonderd te worden in allen die geloven (omdat onze getuigenis onder u geloofd is) op die dag.", "Hand 18:27": "En toen hij naar Achaje wilde reizen, spoorden de broeders hem aan en schreven aan de discipelen dat zij hem moesten ontvangen; en toen hij daar aangekomen was, heeft hij veel bijgedragen aan hen die door de genade geloofden.", "1 Tim 4:14": "Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap.", "Openb 2:11": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, zal van de tweede dood geen schade lijden.", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "Hand 19:8-10": "En hij ging de synagoge in, en sprak vrijmoedig, drie maanden lang met hen sprekend, en hen aanradend om de zaken van het Koninkrijk van God aan te nemen. Maar toen sommigen verhard werden en ongehoorzaam waren, en kwaadspraken van de weg des Heeren voor de menigte, ging hij bij hen weg, en zonderde de discipelen af, dagelijks sprekend in de school van een zekere Tyrannus. En dit gebeurde twee jaar lang, zodat allen die in Azië woonden het Woord van de Heere Jezus hoorden, zowel Joden als Grieken.", "Hand 22:4-19": "Ik heb deze weg vervolgd tot de dood toe, mannen en vrouwen bindend en overleverend in de gevangenissen. Zoals ook de hogepriester mij getuige is, en de gehele raad van oudsten; van hen heb ik ook brieven meegekregen naar de broeders, en ben naar Damaskus gereisd om ook hen die daar waren, gebonden naar Jeruzalem te brengen, opdat zij gestraft zouden worden. Maar het gebeurde mij, toen ik reisde en Damaskus naderde, omtrent de middag, dat er snel uit de hemel een groot licht mij rondom omscheen.", "1 Kor 13:1-13": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn. En al zou het zo zijn dat ik de gave van de profetie had, en al de verborgenheden en al de wetenschap wist; en al zou het zo zijn dat ik al het geloof had, zodat ik bergen verzette, en de liefde niet had, dan zou ik niets zijn. En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "1 Kor 10:2": "en zij zijn allen in Mozes gedoopt in de wolk en in de zee;", "1 Kor 4:9": "Want ik denk dat God ons, de laatste apostelen, ten toon heeft gesteld als tot de dood veroordeeld; want wij zijn een schouwspel geworden voor de wereld, en voor de engelen, en voor de mensen.", "Hand 17:3": "En legde ze uit, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus is, Die ik, zei hij, u verkondig.", "Rom 8:17-23": "En als wij kinderen zijn, dan zijn wij ook erfgenamen: erfgenamen van God, en mede-erfgenamen van Christus; als wij tenminste met Hem lijden, opdat wij ook met Hem verheerlijkt worden. Want ik houd het ervoor, dat het lijden van deze tegenwoordige tijd niet opweegt tegen de heerlijkheid die aan ons geopenbaard zal worden. Want de schepping verwacht, als met opgeheven hoofd, de openbaring van de kinderen van God.", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Hand 26:18-20": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij. Daarom, o koning Agrippa, ben ik dat hemelse gezicht niet ongehoorzaam geweest; Maar heb eerst aan hen die te Damaskus waren, en te Jeruzalem, en in het gehele land Judea, en aan de heidenen verkondigd dat zij zich zouden bekeren en zich tot God bekeren, en werken zouden doen die de bekering waardig zijn.", "Hand 13:5": "En toen zij in Salamis gekomen waren, verkondigden zij het woord van God in de synagogen van de Joden; en zij hadden ook Johannes als dienaar.", "Ef 3:16": "opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "Matt 11:3": "En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander?", "Gen 45:4": "En Jozef zei tegen zijn broers: Kom toch dichter bij mij! En zij kwamen dichterbij. Toen zei hij: Ik ben Jozef, uw broer, die u naar Egypte verkocht hebt.", "1 Kor 15:8": "En ten laatste van allen is Hij ook door mij gezien, als door iemand die ontijdig geboren is.", "Luk 5:8": "Toen Simon Petrus dat zag, viel hij neer aan de knieën van Jezus en zei: Heere, ga weg van mij, want ik ben een zondig mens.", "Matt 27:43": "Hij heeft op God vertrouwd; laat God Hem nu verlossen, als Hij Hem tenminste wil hebben; want Hij heeft gezegd: Ik ben Gods Zoon.", "1 Joh 2:11": "Maar wie zijn broeder haat, is in de duisternis, en wandelt in de duisternis, en weet niet, waar hij heengaat; want de duisternis heeft zijn ogen verblind.", "Jak 2:15-17": "Als er nu een broeder of zuster naakt zouden zijn, en gebrek zouden hebben aan dagelijks voedsel; en iemand van u zou tegen hen zeggen: Ga heen in vrede, word warm en word verzadigd; maar u zou hun niet geven wat nodig is voor het lichaam, wat voor nut is dat? Zo is ook het geloof, als het de werken niet heeft, op zichzelf dood.", "Kol 2:1": "Want ik wil dat u weet hoe zware strijd ik voor u heb, en voor hen die in Laodicea zijn, en voor allen die mijn gezicht in het vlees niet gezien hebben;", "Rom 12:4": "Want zoals wij in één lichaam veel leden hebben, en de leden niet allemaal dezelfde functie hebben,", "Ps 72:14": "Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Hebr 9:14": "hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "2 Kor 13:6-9": "Maar ik hoop dat u zult begrijpen, dat wij niet verwerpelijk zijn. En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn. Want wij vermogen niets tegen de waarheid, maar wel voor de waarheid.", "2 Kor 1:19": "Want de Zoon van God, Jezus Christus, Die onder u door ons gepredikt is, namelijk door mij, en Silvanus, en Timotheüs, was niet ja en nee, maar is geweest ja in Hem.", "Fil 4:13": "Ik kan alle dingen door Christus, Die mij kracht geeft.", "Gen 3:9": "En de HEERE God riep Adam, en zei tegen hem: Waar bent u?", "Hand 4:4": "En velen van hen die het woord gehoord hadden, geloofden; en het getal van de mannen werd ongeveer vijfduizend.", "Hos 2:22": "En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!", "Luk 11:10": "Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden.", "Matt 8:23-27": "En toen Hij in het schip gegaan was, volgden Zijn discipelen Hem. En zie, er ontstond een grote storm op de zee, zodat het schip door de golven bedekt werd; maar Hij sliep. En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!", "1 Kor 10:1": "Ik wil niet, broeders, dat u onwetend bent van het volgende: onze vaders waren allen onder de wolk, en gingen allen door de zee heen;", "Luk 21:24": "En zij zullen vallen door de scherpte van het zwaard, en gevankelijk weggevoerd worden onder alle volken; en Jeruzalem zal door de heidenen vertrapt worden, totdat de tijden van de heidenen vervuld zullen zijn.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Rom 15:3": "Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "Hand 8:1": "En Saulus stemde in met zijn dood. En op die dag ontstond er een grote vervolging tegen de Gemeente die in Jeruzalem was; en zij werden allen verstrooid over de landen van Judea en Samaria, behalve de apostelen.", "Ps 145:11": "Caph. Zij zullen de heerlijkheid van Uw Koninkrijk vermelden, en Uw macht zullen zij uitspreken.", "Hand 22:20": "en toen het bloed van Stefanus, Uw getuige, vergoten werd, stond ik daar ook bij, en had er mede welbehagen in bij zijn dood, en bewaarde de kleren van hen die hem doodden.", "Hand 23:12-21": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben. En het waren er meer dan veertig die deze eed samen hadden afgelegd. Zij gingen naar de overpriesters en de oudsten en zeiden: Wij hebben onszelf met een vervloeking vervloekt om niets te nuttigen totdat wij Paulus gedood zullen hebben.", "1 Kor 15:3": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften;", "Hand 5:9": "En Petrus zei tot haar: Wat is het, dat u onderling hebt afgesproken om de Geest van de Heere te verzoeken? Zie, de voeten van hen die uw man begraven hebben, zijn voor de deur, en zullen u uitdragen.", "Rom 10:1": "Broeders, de toegenegenheid van mijn hart en het gebed dat ik tot God doe voor Israël, is tot hun zaligheid.", "Jona 1:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar; want hun boosheid is opgeklommen voor Mijn aangezicht.", "Hand 4:13": "Toen zij nu de vrijmoedigheid van Petrus en Johannes zagen, en merkten dat zij ongeleerde en eenvoudige mensen waren, verwonderden zij zich, en herkenden hen, dat zij met Jezus geweest waren.", "Fil 1:18": "Wat dan? Toch wordt Christus op allerlei wijze, hetzij uit schijnmotief, hetzij in waarheid, verkondigd; en daarin verblijd ik mij, ja, ik zal mij ook verblijden.", "Hand 28:31": "Hij predikte het Koninkrijk van God, en onderwees over de Heere Jezus Christus, met alle vrijmoedigheid, zonder dat iemand hem daarin hinderde.", "Hagg 2:6": "Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!", "Gal 1:16": "om Zijn Zoon in mij te openbaren, opdat ik Hem door het Evangelie onder de heidenen zou verkondigen, ben ik meteen niet te rade gegaan met vlees en bloed;", "Gen 22:1": "Het gebeurde na deze dingen dat God Abraham beproefde; en Hij zei tegen hem: Abraham! En hij zei: Zie, hier ben ik!", "Hand 18:9": "En de Heere zei tegen Paulus door een gezicht in de nacht: Wees niet bevreesd, maar spreek en zwijg niet.", "Gen 43:30": "En Jozef haastte zich; want zijn hart werd bewogen om zijn broer, en hij zocht een plek om te wenen; en hij ging een kamer in, en weende daar.", "Hand 15:19": "Daarom oordeel ik dat men degenen die zich uit de heidenen tot God bekeren, niet moet lastigvallen;", "Fil 3:6": "Wat de ijver betreft een vervolger van de Gemeente; wat de rechtvaardigheid betreft die in de wet is, onberispelijk.", "Jer 1:7": "Maar de HEERE zei tegen mij: Zeg niet: Ik ben jong; want overal waarheen Ik u zenden zal, zult u gaan, en alles wat Ik u gebieden zal, zult u spreken.", "Joh 2:11": "Dit begin van de tekenen heeft Jezus gedaan te Kana in Galilea, en heeft Zijn heerlijkheid geopenbaard; en Zijn discipelen geloofden in Hem.", "Ps 69:10": "Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.", "Job 40:5": "Versier u nu met voortreffelijkheid en hoogheid, en bekleed u met majesteit en heerlijkheid!", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Kol 3:3": "Want u bent gestorven, en uw leven is met Christus verborgen in God.", "Hand 13:52": "En de discipelen werden vervuld met blijdschap en met de Heilige Geest.", "Ps 24:3-5": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "1 Kor 10:33": "Zoals ik ook in alles allen probeer te behagen, niet mijn eigen voordeel zoekend, maar dat van velen, opdat zij behouden worden.", "Matt 10:18": "En u zult ook voor stadhouders en koningen geleid worden, om Mij, tot een getuigenis voor hen en de heidenen.", "Ps 22:28": "Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden.", "Kol 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, en Timotheüs, de broeder,", "Hand 18:25": "Deze was onderwezen in de weg van de Heere; en omdat hij vurig was van geest, sprak en leerde hij nauwkeurig de zaken van de Heere, al kende hij alleen de doop van Johannes.", "Luk 7:12": "En toen Hij de poort van de stad naderde, zie, er werd een dode uitgedragen, de enige zoon van zijn moeder, en zij was weduwe; en een grote menigte uit de stad was bij haar.", "Matt 24:9": "Dan zullen zij u overleveren aan verdrukking, en zullen u doden, en u zult gehaat worden door alle volken, omwille van Mijn Naam.", "2 Kor 11:23-27": "Zijn zij dienaars van Christus? (ik spreek als een onwijze) ik ben boven hen; in arbeid overvloediger, in slagen voortreffelijker, in gevangenissen overvloediger, in doodsgevaar menigmaal. Van de Joden heb ik veertig slagen min één, vijfmaal ontvangen. Driemaal ben ik met roeden gegeseld geweest, eens ben ik gestenigd, driemaal heb ik schipbreuk geleden, een hele nacht en dag heb ik in de diepte doorgebracht.", "Joh 14:27": "Vrede laat Ik u na, Mijn vrede geef Ik u; niet zoals de wereld die geeft, geef Ik hem u. Laat uw hart niet ontroerd worden en niet bevreesd zijn.", "Jes 66:7-23": "Voordat zij barensnood had, heeft zij gebaard, voordat haar smart kwam, is zij al van een jongetje bevrijd. Wie heeft ooit zoiets gehoord? Wie heeft dergelijke dingen gezien? Zou een land geboren kunnen worden op één dag? Zou een volk geboren kunnen worden in één keer? Maar Sion heeft weeën gekregen, en zij heeft haar zonen gebaard. Zou Ik de baarmoeder openbreken, en niet laten baren? zegt de HEERE; zou Ik, Die laat baren, voortaan toesluiten? zegt uw God.", "Ps 139:7": "Waar zou ik heengaan voor Uw Geest, en waar zou ik heenvlieden voor Uw aangezicht?", "Hand 7:59": "En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.", "Mark 9:36": "En Hij nam een kind, en zette het in hun midden, en omarmde het met Zijn armen, en zei tegen hen:", "Luk 11:9": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "2 Kor 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting;", "Ef 5:30": "Want wij zijn leden van Zijn lichaam, van Zijn vlees en van Zijn benen.", "Joh 20:27": "Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig.", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "1 Kor 15:47": "De eerste mens is uit de aarde, aards; de tweede Mens is de Heere uit de hemel.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Hand 22:6": "Maar het gebeurde mij, toen ik reisde en Damaskus naderde, omtrent de middag, dat er snel uit de hemel een groot licht mij rondom omscheen.", "Rom 1:3": "over Zijn Zoon, Die geworden is uit het geslacht van David, naar het vlees;", "Rom 16:23": "U groet Gajus, de huiswaard van mij en van de hele Gemeente. U groet Erastus, de rentmeester van de stad, en de broeder Quartus.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Rom 1:9-15": "Want God is mijn Getuige, Die ik dien in mijn geest, in het Evangelie van Zijn Zoon, hoe ik zonder ophouden aan u denk; altijd in mijn gebeden biddend, of het mij misschien nog op een gegeven moment door de wil van God gegeven zou worden om naar u te komen. Want ik verlang ernaar u te zien, opdat ik u enige geestelijke gave zou mogen meedelen, opdat u versterkt zou worden;", "Rom 1:16": "Want ik schaam mij niet voor het Evangelie van Christus; want het is een kracht van God tot zaligheid voor ieder die gelooft, eerst de Jood, en ook de Griek.", "Mark 3:31-35": "Toen kwamen Zijn broers en Zijn moeder; en terwijl zij buiten stonden, stuurden zij iemand naar Hem, en riepen Hem. En de menigte zat om Hem heen; en zij zeiden tegen Hem: Zie, Uw moeder en Uw broers zijn buiten en zoeken U. En Hij antwoordde hun: Wie is Mijn moeder, of Mijn broers?", "Ef 4:16": "Uit Wie het hele lichaam bekwaam samengevoegd en samen vastgemaakt wordt, door alle gewrichten die het voeden, naar de werking van ieder deel in zijn maat, groei van het lichaam bereikt, tot opbouw van zichzelf in de liefde.", "Hand 22:21-23": "En Hij zei tegen mij: Ga heen; want Ik zal u ver weg zenden, naar de heidenen. Zij luisterden naar hem tot dit woord toe; en toen verhieven zij hun stem en zeiden: Weg van de aarde met zo iemand, want het is niet behoorlijk dat hij leeft. En terwijl zij riepen, hun kleren van zich afwierpen en stof de lucht in gooiden,", "Hand 8:40": "Maar Filippus werd gevonden te Azote; en terwijl hij het land doortrok, verkondigde hij het Evangelie in alle steden, totdat hij in Cesarea kwam.", "Ps 37:33": "Maar de HEERE laat hem niet in zijn hand; en Hij veroordeelt hem niet, als hij geoordeeld wordt.", "Joh 1:50": "Nathanaël antwoordde en zei tegen Hem: Rabbi! U bent de Zoon van God, U bent de Koning van Israël.", "Gal 1:21-24": "Daarna ben ik gekomen in de gewesten van Syrië en van Cilicië. En ik was van gezicht onbekend aan de Gemeenten in Judea, die in Christus zijn. Maar zij hadden alleen gehoord dat men zei: Hij die ons vroeger vervolgde, verkondigt nu het geloof, dat hij vroeger verwoestte.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Hand 13:37": "Maar Hij, Die God opgewekt heeft, heeft geen verderving gezien.", "Fil 1:11": "Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.", "Hand 16:18": "En dit deed zij vele dagen lang. Maar Paulus, die daarover geërgerd was, keerde zich om en zei tegen de geest: Ik gebied u in de Naam van Jezus Christus dat u van haar uitgaat. En hij ging uit op datzelfde moment.", "Rom 5:17": "Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus.", "Tit 2:12": "En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld;", "Hand 26:1-11": "En Agrippa zei tegen Paulus: Het is u toegestaan voor uzelf te spreken. Toen strekte Paulus de hand uit en verantwoordde zich aldus: Ik acht mijzelf gelukkig, o koning Agrippa, dat ik mij vandaag voor u zal verantwoorden over alles waarvan ik door de Joden beschuldigd word; Vooral omdat ik weet dat u kennis hebt van alle gewoonten en vragen die er onder de Joden zijn. Daarom bid ik u dat u mij lankmoedig hoort.", "Ezech 47:3-5": "Toen die man naar het oosten uitging, had hij een meetsnoer in zijn hand; en hij mat duizend el, en liet mij door het water gaan, en het water kwam tot aan de enkels. Toen mat hij nog duizend el, en liet mij door het water gaan, en het water kwam tot aan de knieën; en hij mat nog duizend, en liet mij gaan, en het water kwam tot aan de lenden. Vervolgens mat hij nog duizend, en het was een beek waar ik niet doorheen kon gaan; want het water was hoog geworden, water om in te zwemmen, een beek waar men niet doorheen kon gaan.", "Gen 26:7": "En toen de mannen van die plaats hem naar zijn vrouw vroegen, zei hij: Zij is mijn zuster; want hij was bang om te zeggen: mijn vrouw; want, dacht hij, misschien doden de mannen van deze plaats mij om Rebekka, want zij was mooi om te zien.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "Jes 4:4": "wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Matt 8:11": "Maar Ik zeg u dat velen zullen komen van oost en west, en met Abraham, en Izak, en Jakob, zullen aanzitten in het Koninkrijk der hemelen;", "Hand 11:20": "En er waren enige mannen uit Cyprus en Cyrene onder hen, die naar Antiochië gekomen waren en tot de Grieken spraken, terwijl zij de Heere Jezus verkondigden.", "Dan 4:3": "Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "1 Joh 4:13": "Hieraan herkennen wij dat wij in Hem blijven, en Hij in ons, omdat Hij ons van Zijn Geest gegeven heeft.", "Jes 28:6": "en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.", "Ef 3:8": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "Mark 12:35-37": "En Jezus antwoordde en zei, terwijl Hij in de tempel onderwees: Hoe kunnen de Schriftgeleerden zeggen dat de Christus een Zoon van David is? Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb. David zelf noemt Hem dan zijn Heere, en hoe is Hij dan zijn Zoon? En de menigte hoorde Hem graag.", "Mark 5:15-20": "En zij kwamen bij Jezus, en zagen de bezetene zitten, gekleed, en goed bij zijn verstand, namelijk hij die het legioen gehad had, en zij werden bevreesd. En zij die het gezien hadden, vertelden hun wat er met de bezetene gebeurd was, en ook over de zwijnen. En zij begonnen Hem te smeken dat Hij uit hun gebied zou weggaan.", "1 Joh 5:1-5": "Ieder die gelooft dat Jezus de Christus is, is uit God geboren; en ieder die Hem liefheeft Die geboren heeft, heeft ook lief hem die uit Hem geboren is. Hieraan weten wij, dat wij de kinderen van God liefhebben, wanneer wij God liefhebben, en Zijn geboden bewaren. Want dit is de liefde van God, dat wij Zijn geboden bewaren; en Zijn geboden zijn niet zwaar.", "Rom 11:14": "Of ik enigszins mijn vlees tot jaloersheid mag verwekken, en enigen uit hen behouden mocht.", "Rom 8:37-39": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad. Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal, Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Hand 18:23": "En toen hij daar enige tijd geweest was, ging hij weg en reisde achtereenvolgens door het land Galatië en Frygië, en versterkte al de discipelen.", "Joh 15:20": "Denk aan het woord dat Ik u gezegd heb: Een dienstknecht is niet meer dan zijn heer. Als zij Mij vervolgd hebben, zullen zij ook u vervolgen; als zij Mijn woord bewaard hebben, zullen zij ook het uwe bewaren.", "Mark 10:21": "En Jezus keek hem aan en had hem lief, en zei tegen hem: Eén ding ontbreekt u; ga heen, verkoop alles wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom, neem het kruis op, en volg Mij.", "Joh 8:17": "En er staat ook in uw wet geschreven, dat het getuigenis van twee mensen waar is.", "Jes 58:6-14": "Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt? Is het niet dit, dat u de hongerige uw brood meedeelt, en de armen, verdrevenen, in huis brengt? Als u een naakte ziet, dat u hem dekt, en dat u zich voor uw eigen vlees niet verbergt? Dan zal uw licht voortbreken als de dageraad, en uw genezing zal snel uitspruiten; en uw gerechtigheid zal voor uw aangezicht heengaan, en de heerlijkheid van de HEERE zal uw achterhoede zijn.", "Kol 3:5": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is.", "Ps 106:3": "Gelukkig zijn zij die het recht onderhouden, die te allen tijde gerechtigheid doen.", "Hand 4:29": "En nu dan, Heere, zie op hun dreigingen, en geef Uw dienstknechten met alle vrijmoedigheid Uw woord te spreken;", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Hand 2:6": "En toen deze stem gebeurd was, kwam de menigte samen en raakte in verwarring, want ieder hoorde hen in zijn eigen taal spreken.", "Matt 3:16": "En Jezus, toen Hij gedoopt was, kwam meteen op uit het water; en zie, de hemelen werden voor Hem geopend, en Hij zag de Geest van God neerdalen als een duif, en op Hem komen.", "2 Kon 6:17-20": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa. Toen zij nu naar hem afkwamen, bad Elisa tot de HEERE, en zei: Sla toch dit volk met verblindheid. En Hij sloeg hen met verblindheid, naar het woord van Elisa. Toen zei Elisa tegen hen: Dit is de weg niet, en dit is de stad niet; volg mij, en ik zal u leiden tot de man die u zoekt; en hij leidde hen naar Samaria.", "Rom 15:7": "Daarom neemt elkaar aan, zoals ook Christus ons aangenomen heeft, tot de heerlijkheid van God.", "Hand 8:17": "Toen legden zij hun de handen op, en zij ontvingen de Heilige Geest.", "1 Tim 2:10": "maar (wat past bij vrouwen die de godsvrucht belijden) door goede werken.", "Hand 16:14": "En een zekere vrouw, met de naam Lydia, een purperverkoopster uit de stad Thyatira, die God diende, hoorde ons; haar hart heeft de Heere geopend, zodat zij acht gaf op wat door Paulus gesproken werd.", "1 Petr 1:23": "u die opnieuw geboren bent, niet uit vergankelijk, maar uit onvergankelijk zaad, door het levende en eeuwig blijvende Woord van God.", "Joh 12:8": "Want de armen hebt u altijd bij u, maar Mij hebt u niet altijd.", "Gen 45:26": "Toen berichtten zij hem, en zeiden: Jozef leeft nog, ja, hij is ook regeerder in heel Egypteland! Toen bezweek zijn hart, want hij geloofde hen niet.", "Dan 4:2": "Het behaagt mij te verkondigen de tekenen en wonderen, die de allerhoogste God aan mij gedaan heeft.", "Hand 8:13": "En Simon geloofde ook zelf, en toen hij gedoopt was, bleef hij voortdurend bij Filippus; en toen hij de tekenen en grote krachten zag die er gebeurden, stond hij versteld.", "Hand 5:32": "En wij zijn Zijn getuigen van deze dingen; en ook de Heilige Geest, Die God gegeven heeft hun die Hem gehoorzaam zijn.", "1 Joh 3:24": "En die Zijn geboden bewaart, blijft in Hem, en Hij in hem. En hieraan weten wij dat Hij in ons blijft, namelijk uit de Geest, Die Hij ons gegeven heeft.", "Hand 19:23": "Maar in diezelfde tijd ontstond er geen kleine opschudding over de weg des Heeren.", "Matt 17:2": "En Hij veranderde van gedaante voor hun ogen; Zijn gezicht blonk als de zon, en Zijn kleren werden wit als het licht.", "Hand 16:15": "En toen zij gedoopt was, en haar huis, smeekte zij ons: Als u geoordeeld hebt dat ik de Heere trouw ben, kom dan in mijn huis en blijf daar. En zij drong er sterk op aan.", "Matt 12:49": "En Hij strekte Zijn hand uit over Zijn discipelen, en zei: Kijk, Mijn moeder en Mijn broeders.", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "Hand 16:13": "En op de dag van de sabbat gingen wij de stad uit, naar de rivier, waar men gewoonlijk bad; en wij gingen zitten en spraken tot de vrouwen die daar samengekomen waren.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Fil 1:30": "Terwijl u dezelfde strijd hebt als die u bij mij gezien hebt, en nu bij mij hoort.", "Zach 14:8-21": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn. En de HEERE zal Koning zijn over de hele aarde; op die dag zal de HEERE één zijn, en Zijn Naam één. Dit hele land zal rondom als een vlak veld gemaakt worden, van Geba tot Rimmon toe, zuidwaarts van Jeruzalem; en zij zal verhoogd en bewoond worden op haar plaats; van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en van de toren van Hananeel, tot aan de wijnbakken van de koning toe.", "Gal 6:7": "Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Joh 15:26": "Maar wanneer de Trooster gekomen zal zijn, Die Ik u zenden zal van de Vader, namelijk de Geest van de waarheid, Die van de Vader uitgaat, Die zal van Mij getuigen.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Hand 20:22-24": "En nu, zie, ik, gebonden door de Geest, reis naar Jeruzalem, zonder te weten wat mij daar zal overkomen; Behalve dat de Heilige Geest van stad tot stad betuigt en zegt dat mij boeien en verdrukkingen te wachten staan. Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "Rom 11:13": "Want ik spreek tot u, heidenen, voor zoveel ik apostel van de heidenen ben; ik maak mijn bediening heerlijk;", "Ef 5:9": "(Want de vrucht van de Geest bestaat in alle goedheid, en rechtvaardigheid, en waarheid),", "Hand 28:22": "Maar wij willen wel van u horen wat u denkt; want wat deze sekte betreft, ons is bekend dat er overal tegen gesproken wordt.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Ezech 36:27": "En Ik zal Mijn Geest geven in het binnenste van u; en Ik zal maken dat u in Mijn inzettingen zult wandelen, en Mijn rechten zult bewaren en doen.", "Matt 12:17-21": "Opdat vervuld zou worden wat gesproken is door de profeet Jesaja, die zei: Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen.", "Kol 1:25-29": "waarvan ik een dienaar geworden ben, naar de bedeling van God die mij gegeven is voor u, om het Woord van God te vervullen; namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen; aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "Gal 3:1": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd.", "Hand 20:18-27": "En toen zij bij hem gekomen waren, zei hij tegen hen: U weet, van de eerste dag af dat ik in Azië ben aangekomen, hoe ik de hele tijd bij u geweest ben; Terwijl ik de Heere diende met alle nederigheid, en veel tranen, en beproevingen, die mij overkwamen door de aanslagen van de Joden; Hoe ik niets heb achtergehouden van wat nuttig was, zodat ik het u niet zou verkondigd en u geleerd hebben, in het openbaar en in de huizen;", "Openb 5:6": "En ik zag, en zie, in het midden van de troon, en van de vier dieren, en in het midden van de oudsten, een Lam, dat stond als geslacht, met zeven horens en zeven ogen; dat zijn de zeven Geesten van God, die uitgezonden zijn over de hele aarde.", "Zach 8:20-23": "Zo zegt de HEERE van de heerscharen: Nog zal het gebeuren, dat de volken, en de inwoners van veel steden, komen zullen; En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan. Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "2 Tim 1:16": "De Heere geve het huis van Onesiforus barmhartigheid; want hij heeft mij dikwijls verkwikt, en heeft zich niet geschaamd voor mijn keten.", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Luk 18:15": "En zij brachten ook de kinderen bij Hem, zodat Hij ze zou aanraken; en de discipelen, toen ze dat zagen, bestraften hen.", "Hand 24:22": "Toen Felix dit gehoord had, stelde hij hen uit, en zei: Als ik nadere kennis van deze weg zal hebben, wanneer Lysias, de aanvoerder, is afgekomen, dan zal ik uw zaak volledig behandelen.", "Ps 51:14": "Geef mij de vreugde van het heil weer; en de vrijmoedige geest ondersteunt mij.", "2 Tim 2:20": "Maar in een groot huis zijn niet alleen gouden en zilveren voorwerpen, maar ook houten en aarden voorwerpen; en sommige tot eer, maar sommige tot oneer.", "Jes 18:7": "In die tijd zal de HEERE van de heerscharen een geschenk gebracht worden van het volk dat lang en glad is, en van het volk dat gevreesd is van oudsher tot nu; een volk van regel en regel, en van vertreding, welks land de rivieren beroven; naar de plaats van de Naam van de HEERE van de heerscharen, naar de berg Sion.", "Matt 5:11": "Zalig bent u, als de mensen u smaden en vervolgen, en liegend allerlei kwaad tegen u spreken, omwille van Mij.", "Jes 48:16": "Kom nader tot Mij, hoor dit: Ik heb van het begin af niet in het verborgene gesproken, maar van de tijd af, dat het gebeurd is, ben Ik daar; en nu, de Heere HEERE, en Zijn Geest heeft Mij gezonden.", "2 Kor 1:24": "Niet dat wij heerschappij voeren over uw geloof, maar wij zijn medewerkers van uw blijdschap; want u staat door het geloof.", "Judas 1:3": "Geliefden, omdat ik alle inzet gebruik om u te schrijven over de gemeenschappelijke zaligheid, moest ik u schrijven en u vermanen dat u strijdt voor het geloof, dat eenmaal aan de heiligen overgeleverd is.", "Joh 11:45": "Velen dan van de Joden, die naar Maria gekomen waren, en gezien hadden wat Jezus gedaan had, geloofden in Hem.", "Jer 26:21-23": "En toen de koning Jojakim, alsook al zijn geweldigen, en al de vorsten zijn woorden hoorden, zocht de koning hem te doden; toen Uria dat hoorde, vreesde hij, en vluchtte, en kwam in Egypte; Maar de koning Jojakim zond mannen naar Egypte, Elnathan, de zoon van Achbor, en andere mannen met hem, naar Egypte; Die voerden Uria uit Egypte, en brachten hem tot de koning Jojakim, en hij sloeg hem met het zwaard, en hij wierp zijn dode lichaam in de graven van de kinderen van het volk.", "Matt 10:17-19": "Maar wees op uw hoede voor de mensen; want zij zullen u overleveren aan de raadsvergaderingen, en zij zullen u geselen in hun synagogen; En u zult ook voor stadhouders en koningen geleid worden, om Mij, tot een getuigenis voor hen en de heidenen. Maar wanneer zij u overleveren, wees dan niet bezorgd hoe of wat u spreken zult; want het zal u op datzelfde moment gegeven worden wat u spreken zult.", "Matt 17:17": "Jezus antwoordde en zei: O ongelovig en verkeerd geslacht, hoe lang zal Ik nog bij u zijn, hoe lang zal Ik u nog verdragen? Breng hem hier bij Mij.", "Hand 22:7": "En ik viel op de grond, en ik hoorde een stem tegen mij zeggen: Saul, Saul, waarom vervolgt u Mij?", "Jes 33:1": "Wee u, verwoester, die zelf niet verwoest bent, en u, die trouweloos handelt, terwijl men niet trouweloos tegen u gehandeld heeft! Als u het verwoesten volbracht zult hebben, zult u verwoest worden; als u het trouweloos handelen voltooid zult hebben, zal men trouweloos tegen u handelen.", "Ef 5:2": "en wandel in de liefde, zoals ook Christus ons liefgehad heeft, en Zichzelf voor ons heeft overgegeven als een offerande en een slachtoffer, God tot een welriekende reuk.", "Ex 4:13": "Doch hij zei: Och, Heere! zend toch door de hand van hem die U zult zenden.", "1 Sam 28:5": "Toen Saul het leger van de Filistijnen zag, werd hij bang, en zijn hart beefde erg.", "1 Kon 17:19-23": "En hij zei tegen haar: Geef mij uw zoon. En hij nam hem van haar schoot, en droeg hem naar boven, naar de opperzaal, waar hij zelf woonde, en hij legde hem neer op zijn bed. En hij riep de HEERE aan, en zei: HEERE, mijn God, hebt Gij dan ook deze weduwe, bij wie ik herberg, zo kwalijk behandeld, dat Gij haar zoon gedood hebt? En hij strekte zich driemaal uit over dat kind, en riep de HEERE aan, en zei: HEERE, mijn God, laat toch de ziel van dit kind in hem wederkeren.", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "Hand 23:11": "En de volgende nacht stond de Heere bij hem en zei: Heb goede moed, Paulus, want zoals u in Jeruzalem van Mij getuigd hebt, zo moet u ook in Rome getuigen.", "Matt 9:6": "Maar om te laten weten dat de Zoon des mensen macht heeft op de aarde om de zonden te vergeven — toen zei Hij tegen de verlamde man: Sta op, neem uw bed op, en ga naar uw huis.", "Ps 51:9-19": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw. Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt. Verberg Uw aangezicht van mijn zonden, en delg al mijn ongerechtigheden uit.", "Hand 13:3": "Toen vastten en baden zij, en nadat zij hun de handen opgelegd hadden, lieten zij hen gaan.", "Joh 9:21": "maar hoe hij nu ziet, weten wij niet; of wie zijn ogen geopend heeft, weten wij niet; hij is volwassen, vraag het hemzelf; hij zal voor zichzelf spreken.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Jer 20:10": "Want ik heb de kwaadsprekerij van velen gehoord, schrik van alle kanten. \"Geef ons te kennen,\" zeggen ze, \"en wij zullen het bekendmaken\"; al mijn vertrouwde vrienden letten op mijn struikelen; ze zeggen: \"Misschien laat hij zich overhalen, dan zullen wij de overhand over hem krijgen, en onze wraak op hem nemen.\"", "1 Kor 3:9-15": "Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u. Naar de genade van God, die mij gegeven is, heb ik als een wijs bouwmeester het fundament gelegd; en een ander bouwt daarop. Maar ieder ziet toe hoe hij daarop bouwt. Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus.", "2 Tim 4:17": "Maar de Heere heeft mij bijgestaan en heeft mij kracht gegeven; opdat door mij de prediking ten volle bekend zou worden, en alle heidenen die zouden horen. En ik ben uit de muil van de leeuw verlost.", "Jes 53:4": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "2 Sam 1:24": "U, dochters van Israël, weent over Saul; die u kleedde met scharlaken, met weelde; die u sieraad van goud liet dragen over uw kleding.", "Hand 19:4": "Maar Paulus zei: Johannes heeft wel gedoopt met de doop van bekering, en zei tegen het volk dat zij geloven zouden in Hem Die na hem kwam, dat is, in Christus Jezus.", "Ef 4:28": "Wie gestolen heeft, moet niet meer stelen, maar moet liever arbeiden, terwijl hij met de handen doet wat goed is, opdat hij kan delen met hem die het nodig heeft.", "Hand 12:24": "En het Woord van God groeide en breidde zich uit.", "Hand 1:22": "beginnend vanaf de doop van Johannes, tot de dag toe waarop Hij van ons opgenomen is, één van hen met ons getuige wordt van Zijn opstanding.", "1 Kor 9:15-23": "Maar ik heb geen van deze dingen gebruikt. En ik heb dit niet geschreven, opdat het zo bij mij zou gebeuren; want het zou beter voor mij zijn te sterven, dan dat iemand deze mijn roem zou ijdel maken. Want als ik het Evangelie verkondig, is het voor mij geen roem; want de noodzaak is mij opgelegd. En wee mij, als ik het Evangelie niet verkondig! Want als ik dat gewillig doe, heb ik loon, maar als onwillig, is de uitdeling mij toch toevertrouwd.", "Hand 6:9-14": "En er stonden sommigen op uit de synagoge die de synagoge van de Vrijgelatenen genoemd wordt, en van de Cyreneeërs, en van de Alexandrijnen, en van hen die uit Cilicië en Azië waren, en zij redetwistten met Stefanus. En zij konden niet opgewassen zijn tegen de wijsheid en de Geest, door Wie hij sprak. Toen zetten zij mannen op die zeiden: Wij hebben hem lasterlijke woorden horen spreken tegen Mozes en God.", "Gal 1:13-24": "Want u hebt gehoord van mijn vroegere levenswandel in het Jodendom, dat ik de Gemeente van God uitermate zwaar vervolgde, en die verwoestte; en dat ik in het Jodendom meer vorderde dan velen van mijn leeftijd in mijn volk, omdat ik overvloedig ijverig was voor mijn voorvaderlijke overleveringen. Maar toen het God behaagd heeft, Die mij van mijn moeders schoot af afgezonderd heeft, en geroepen door Zijn genade,", "Rom 15:16": "opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest.", "Hand 26:17-20": "En zal u verlossen van dit volk en van de heidenen, tot wie Ik u nu zend; Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij. Daarom, o koning Agrippa, ben ik dat hemelse gezicht niet ongehoorzaam geweest;", "Luk 8:19-21": "En Zijn moeder en Zijn broers kwamen naar Hem toe, en konden niet bij Hem komen vanwege de menigte. En het werd Hem gemeld door enigen die zeiden: Uw moeder en Uw broers staan buiten en willen U zien. Maar Hij antwoordde en zei tegen hen: Mijn moeder en Mijn broers zijn zij die Gods Woord horen en het doen.", "Joh 15:5": "Ik ben de Wijnstok, en u de ranken; die in Mij blijft, en Ik in hem, die draagt veel vrucht; want zonder Mij kunt u niets doen.", "1 Tim 1:14-16": "Maar de genade van onze Heere is zeer overvloedig geweest, met geloof en liefde, die er is in Christus Jezus. Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben. Maar juist daarom is mij barmhartigheid overkomen, opdat Jezus Christus in mij, die de voornaamste ben, al Zijn geduld zou tonen, tot een voorbeeld voor hen die later in Hem geloven zullen tot het eeuwige leven.", "Spr 1:7": "De vrees van de HEERE is het beginsel van de wetenschap; de dwazen verachten wijsheid en tucht.", "1 Kor 15:9": "Want ik ben de minste van de apostelen, die niet waardig ben een apostel genoemd te worden, omdat ik de Gemeente van God vervolgd heb.", "Rom 8:26": "En evenzo komt ook de Geest onze zwakheden te hulp; want wij weten niet wat wij bidden moeten zoals het behoort, maar de Geest Zelf bidt voor ons met onuitsprekelijke zuchten.", "Hand 8:26": "En een engel van de Heere sprak tot Filippus en zei: Sta op, en ga naar het zuiden, op de weg die van Jeruzalem afdaalt naar Gaza, die woest is.", "Hand 18:8": "En Crispus, de leider van de synagoge, geloofde in de Heere met heel zijn huis; en velen van de Korinthiërs die hem hoorden, geloofden en werden gedoopt.", "Est 8:16": "Bij de Joden was licht, en blijdschap, en vreugde, en eer;", "1 Kor 14:25": "En zo worden de verborgen dingen van zijn hart openbaar; en zo, vallend op zijn gezicht, zal hij God aanbidden, en verkondigen dat God werkelijk onder u is.", "Ps 82:2-4": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela. Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme. Verlos de arme en de behoeftige, ruk hem uit de hand van de goddelozen.", "1 Kor 4:13": "wij worden belasterd, en wij smeken; wij zijn geworden als het uitvaagsel van de wereld, en het afschraapsel van alles, tot nu toe.", "Luk 18:16": "Maar Jezus riep hen bij Zich en zei: Laat de kinderen tot Mij komen, en verhinder hen niet; want voor zulken is het Koninkrijk van God.", "Hand 21:20": "En toen zij dat gehoord hadden, loofden zij de Heere en zeiden tegen hem: U ziet, broeder, hoeveel duizenden Joden er zijn die geloven; en zij zijn allen ijveraars voor de wet.", "Hand 8:38": "En hij gebood de wagen stil te houden; en zij daalden beiden af in het water, zowel Filippus als de kamerling, en hij doopte hem.", "2 Kor 11:33": "En ik werd door een venster in een mand over de muur neergelaten, en ontkwam aan zijn handen.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "1 Joh 2:10": "Wie zijn broeder liefheeft, blijft in het licht, en er is geen struikelblok in hem.", "Hand 9:32-42": "En het gebeurde, toen Petrus overal rondtrok, dat hij ook afkwam bij de heiligen die in Lydda woonden. En daar vond hij een zekere man, met de naam Eneas, die al acht jaar bedlegerig was, omdat hij verlamd was. En Petrus zei tegen hem: Eneas! Jezus Christus maakt u gezond; sta op en maak uzelf uw bed op. En hij stond meteen op.", "Ex 10:17": "En nu, vergeef mij toch mijn zonde alleen deze keer, en bid vurig tot de HEERE, uw God, dat Hij alleen deze dood van mij wegneemt.", "Jes 35:1-10": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos. Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God. Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Ezech 7:16": "En hun ontkomenen zullen wel ontkomen, maar zij zullen op de bergen zijn, zij allen zullen zijn als duiven van de dalen, kermend, ieder om zijn ongerechtigheid.", "Jes 56:3": "En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom.", "1 Kor 14:12": "Zo ook u: omdat u ijverig bent naar geestelijke gaven, zoek dan dat u overvloedig mag zijn tot stichting van de Gemeente.", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Hand 20:3": "En toen hij daar drie maanden was gebleven, en de Joden hem wilden aanvallen toen hij naar Syrië zou varen, besloot hij door Macedonië terug te keren.", "Dan 2:35": "Toen werden het ijzer, het leem, het koper, het zilver en het goud tegelijk verbrijzeld, en zij werden als kaf van de dorsvloeren in de zomer, en de wind voerde ze weg, zodat er geen plaats meer voor gevonden werd; maar de steen die het beeld verbrijzeld had, werd tot een grote berg, zodat hij de hele aarde vulde.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Hand 9:1-31": "En Saulus, die nog steeds dreiging en moord blies tegen de discipelen van de Heere, ging naar de hogepriester, en vroeg hem om brieven aan de synagogen in Damaskus, opdat hij, als hij daar iemand zou vinden die van die weg was, zowel mannen als vrouwen, hen gebonden naar Jeruzalem zou brengen. En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel;", "Rom 1:6": "onder wie u ook bent, geroepenen van Jezus Christus!)", "Hand 4:22": "Want de man was meer dan veertig jaar oud, aan wie dit teken van genezing gebeurd was.", "Luk 1:16": "En hij zal velen van de kinderen van Israël bekeren tot de Heere, hun God.", "Hand 19:17": "En dit werd aan allen bekend, zowel Joden als Grieken, die te Efeze woonden; en er viel een vrees over hen allen, en de Naam van de Heere Jezus werd groot gemaakt.", "2 Tim 4:7": "Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden;", "Matt 26:11": "Want de armen hebt u altijd bij u, maar Mij hebt u niet altijd.", "2 Kor 12:15": "En ik zal zeer graag de kosten dragen, en voor uw zielen ten koste gegeven worden; hoewel ik, terwijl ik u overvloediger liefheb, minder bemind word.", "Jak 2:14-26": "Wat voor nut heeft het, mijn broeders, als iemand zegt dat hij het geloof heeft, maar hij heeft de werken niet? Kan dat geloof hem zaligmaken? Als er nu een broeder of zuster naakt zouden zijn, en gebrek zouden hebben aan dagelijks voedsel; en iemand van u zou tegen hen zeggen: Ga heen in vrede, word warm en word verzadigd; maar u zou hun niet geven wat nodig is voor het lichaam, wat voor nut is dat?", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Hand 19:18": "En velen van hen die geloofden, kwamen, beleden en vertelden openlijk hun daden.", "Hand 10:36": "Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen.", "Joh 1:46": "Filippus vond Nathanaël en zei tegen hem: Wij hebben Hem gevonden, van Wie Mozes in de wet geschreven heeft, en de profeten, namelijk Jezus, de zoon van Jozef, van Nazareth.", "Hand 5:39": "maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden.", "Job 16:19": "Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.", "Hand 18:4-6": "En hij sprak op elke sabbat in de synagoge, en bracht Joden en Grieken tot geloof. En toen Silas en Timotheüs uit Macedonië gekomen waren, werd Paulus door de Geest gedrongen en betuigde hij de Joden dat Jezus de Christus is. Maar toen zij hem weerstonden en lasterden, schudde hij zijn kleren af en zei tegen hen: Uw bloed zij op uw hoofd; ik ben rein; en van nu af aan zal ik naar de heidenen gaan.", "1 Joh 5:6-8": "Deze is het Die gekomen is door water en bloed, namelijk Jezus, de Christus; niet door het water alleen, maar door het water en het bloed. En de Geest is het Die getuigt, dat de Geest de waarheid is. Want Drie zijn er, Die getuigen in de hemel: de Vader, het Woord en de Heilige Geest; en deze Drie zijn Eén. En drie zijn er die getuigen op de aarde: de Geest, en het water, en het bloed; en die drie zijn tot een.", "Micha 7:17": "Zij zullen het stof lekken, als de slang; als kruipende dieren van de aarde, zullen zij sidderend tevoorschijn komen uit hun schuilhoeken; zij zullen met vervaardheid komen tot de HEERE, onze God, en zullen voor U vrezen.", "1 Joh 5:13": "Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Job 29:13": "De zegen van hem die verloren dreigde te gaan, kwam op mij; en het hart van de weduwe deed ik vrolijk zingen.", "2 Kor 4:2": "Maar wij hebben de bedekselen der schande verworpen, en wandelen niet in arglistigheid, en vervalsen ook het Woord van God niet, maar door openbaring van de waarheid maken wij onszelf aangenaam bij ieder geweten van de mensen, in de tegenwoordigheid van God.", "2 Kon 4:10": "Laten we toch een kleine bovenkamer aan een muur maken, en daar voor hem neerzetten een bed, en tafel, en stoel, en kandelaar; dan zal het gebeuren, wanneer hij bij ons komt, dat hij daar inwijkt.", "1 Kor 12:12-28": "Want zoals het lichaam één is en veel leden heeft, en al de leden van dit ene lichaam, hoewel het er veel zijn, toch één lichaam zijn, zo is het ook met Christus. Want ook wij allen zijn door één Geest tot één lichaam gedoopt; hetzij Joden, hetzij Grieken, hetzij dienstknechten, hetzij vrijen; en wij zijn allen tot één Geest gedrenkt. Want ook het lichaam is niet één lid, maar veel leden.", "Neh 5:9": "Verder zei ik: De zaak die u doet, is niet goed; zou u niet wandelen in de vreze van onze God, om de smaad van de heidenen, onze vijanden?", "Hand 26:15": "En ik zei: Wie bent U, Heere? En Hij zei: Ik ben Jezus, Die u vervolgt.", "Hand 14:19": "Maar daarna kwamen er Joden van Antiochië en Ikonium, en zij overreedden de menigten, en stenigden Paulus, en sleepten hem de stad uit, in de mening dat hij dood was.", "Matt 1:18": "De geboorte van Jezus Christus was nu als volgt. Toen Maria, Zijn moeder, met Jozef in ondertrouw was, bleek zij, voordat zij samengekomen waren, zwanger te zijn uit de Heilige Geest.", "Rom 1:1-3": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God, (Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften), over Zijn Zoon, Die geworden is uit het geslacht van David, naar het vlees;", "Fil 1:17": "Maar genen uit liefde, omdat zij weten dat ik gesteld ben tot verantwoording van het Evangelie.", "Ps 22:28-32": "Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden. Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen. Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.", "1 Kor 4:7": "Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had?", "Gen 31:11": "En de Engel van God zei tegen mij in de droom: Jakob! En ik zei: Zie, hier ben ik!", "Joh 1:42": "Deze vond eerst zijn broer Simon, en zei tegen hem: Wij hebben de Messias gevonden, wat vertaald betekent: de Christus.", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Joh 21:15-17": "Toen zij dan de maaltijd gehouden hadden, zei Jezus tegen Simon Petrus: Simon, zoon van Jonas, hebt u Mij meer lief dan dezen? Hij zei tegen Hem: Ja, Heere! U weet dat ik U liefheb. Hij zei tegen hem: Weid Mijn lammeren. Hij zei opnieuw tegen hem, voor de tweede keer: Simon, zoon van Jonas, hebt u Mij lief? Hij zei tegen Hem: Ja, Heere, U weet dat ik U liefheb. Hij zei tegen hem: Hoed Mijn schapen. Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Matt 3:17": "En zie, een stem uit de hemelen zei: Deze is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "2 Tim 1:11-13": "Waartoe ik gesteld ben als prediker, en apostel, en leraar van de heidenen; Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag. Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "2 Kor 13:14": "De genade van de Heere Jezus Christus, en de liefde van God, en de gemeenschap van de Heilige Geest, zij met u allen. Amen. De tweede brief aan de Korinthiërs werd door Titus en Lukas geschreven vanuit Filippi, een stad in Macedonië.", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Rom 15:15-32": "Maar ik heb u ten dele des te vrijmoediger geschreven, broeders, u als het ware opnieuw dit in herinnering brengend, om de genade die mij van God gegeven is; opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest. Zo heb ik dan roem in Christus Jezus in die dingen die God aangaan.", "Kol 1:13": "Die ons getrokken heeft uit de macht van de duisternis, en overgezet heeft in het Koninkrijk van de Zoon van Zijn liefde;", "Joh 11:4": "En Jezus, dat horende, zei: Deze ziekte is niet tot de dood, maar tot heerlijkheid van God, opdat de Zoon van God erdoor verheerlijkt wordt.", "Dan 2:45": "Daarom hebt u gezien dat uit de berg een steen zonder handen werd afgehouwen, die het ijzer, koper, leem, zilver en goud verbrijzelde; de grote God heeft de koning bekendgemaakt wat hierna gebeuren zal; de droom is dus waar, en de uitleg ervan betrouwbaar.", "Richt 16:2": "Toen werd aan de inwoners van Gaza gezegd: Simson is hier binnengekomen; zo gingen zij rondom, en legden hem de hele nacht een hinderlaag bij de stadspoort; maar zij hielden zich de hele nacht stil, en zeiden: Tot aan het morgenlicht, dan zullen wij hem doden.", "Matt 14:29-31": "En Hij zei: Kom. En Petrus klom uit het schip, en liep op het water, om naar Jezus toe te komen. Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij! En Jezus stak meteen Zijn hand uit, greep hem vast, en zei tegen hem: Kleingelovige! Waarom heb je getwijfeld?", "2 Tim 1:14": "Bewaar het goede pand, dat u toevertrouwd is, door de Heilige Geest, Die in ons woont.", "Matt 16:15": "Hij zei tegen hen: Maar u, wie zegt u dat Ik ben?", "Ezech 7:25": "De ondergang komt; en zij zullen de vrede zoeken, maar hij zal er niet zijn.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "1 Sam 22:4": "En hij bracht hen voor het aangezicht van de koning van de Moabieten; en zij bleven bij hem al de dagen dat David in de vesting was.", "Joh 8:49": "Jezus antwoordde: Ik heb de duivel niet; maar Ik eer Mijn Vader, en u onteert Mij.", "2 Tim 2:10": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid.", "Joh 4:10": "Jezus antwoordde en zei tegen haar: Als u de gave van God kende, en Wie Hij is, Die tegen u zegt: Geef Mij te drinken, dan zou u van Hem hebben gevraagd, en Hij zou u levend water gegeven hebben.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Openb 1:9": "Ik, Johannes, die ook uw broeder ben, en deelgenoot in de verdrukking, en in het Koninkrijk, en in de volharding van Jezus Christus, was op het eiland genaamd Patmos, om het Woord van God, en om de getuigenis van Jezus Christus.", "Joh 16:7-14": "Doch Ik zeg u de waarheid: het is nuttig voor u dat Ik wegga; want als Ik niet wegga, zal de Trooster niet tot u komen; maar als Ik heenga, zal Ik Hem tot u zenden. En als Hij gekomen is, zal Hij de wereld overtuigen van zonde, en van gerechtigheid, en van oordeel: Van zonde, omdat zij in Mij niet geloven;", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Hand 9:3-17": "En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel; en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij? En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Gal 1:13": "Want u hebt gehoord van mijn vroegere levenswandel in het Jodendom, dat ik de Gemeente van God uitermate zwaar vervolgde, en die verwoestte;", "2 Kor 11:12": "Maar wat ik doe, dat zal ik nog doen, om de aanleiding af te snijden voor hun die aanleiding willen hebben, opdat zij in wat zij roemen bevonden mogen worden gelijk als wij.", "Matt 4:1": "Toen werd Jezus door de Geest weggeleid naar de woestijn, om beproefd te worden door de duivel.", "Joh 9:7": "en zei tegen hem: Ga heen, was u in het badwater Siloam (wat vertaald wordt: Uitgezonden). Hij ging toen heen en waste zich, en kwam ziende terug.", "Zach 2:11": "En veel heidenen zullen op die dag aan de HEERE toegevoegd worden, en zij zullen Mij tot een volk wezen; en Ik zal in het midden van u wonen; en u zult weten, dat de HEERE van de heerscharen mij tot u gezonden heeft.", "Matt 26:64": "Jezus zei tegen hem: U hebt het gezegd. Maar Ik zeg u: van nu af aan zult u de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen op de wolken van de hemel.", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "2 Kor 6:3-10": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt. Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Rom 5:20": "Maar de wet is bovendien ingekomen, opdat de misdaad meer zou worden; en waar de zonde meer geworden is, daar is de genade veel meer overvloedig geweest;", "Joh 5:46": "Want als u Mozes geloofde, zou u Mij geloven; want hij heeft van Mij geschreven.", "Joh 4:26": "Jezus zei tegen haar: Ik ben het, Die met u spreek.", "Joh 4:2": "(hoewel Jezus zelf niet doopte, maar Zijn discipelen),", "Gen 16:8": "En hij zei: Hagar, dienstmaagd van Sarai, waar komt u vandaan, en waar zult u heengaan? En zij zei: Ik vlucht van het aangezicht van mijn meesteres Sarai!", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "2 Kor 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, en Timotheüs, de broeder, aan de gemeente van God, die te Korinthe is, met al de heiligen, die in heel Achaje zijn:", "Gen 15:8": "En hij zei: Heere HEERE, waarbij zal ik weten dat ik het erfelijk bezitten zal?", "Jes 42:1": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen.", "Hand 26:6": "En nu sta ik en word geoordeeld over de hoop van de belofte die door God aan de vaderen gedaan is;", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Rom 6:4": "Wij zijn dan met Hem begraven door de doop in de dood, opdat, zoals Christus uit de doden opgewekt is tot de heerlijkheid van de Vader, zo ook wij in nieuwheid van leven zouden wandelen.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Gal 1:19": "En ik zag geen andere van de apostelen, dan Jakobus, de broer van de Heere.", "Joh 5:33": "U hebt naar Johannes gezonden, en hij heeft van de waarheid getuigenis gegeven.", "Rom 8:1-27": "Er is dan nu geen veroordeling voor hen die in Christus Jezus zijn, die niet naar het vlees wandelen, maar naar de Geest. Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood. Want wat voor de wet onmogelijk was, omdat zij door het vlees krachteloos was, dat heeft God gedaan: Hij heeft Zijn eigen Zoon gezonden in de gelijkenis van het zondige vlees, en dat voor de zonde, en Hij heeft de zonde veroordeeld in het vlees.", "Mark 3:33-35": "En Hij antwoordde hun: Wie is Mijn moeder, of Mijn broers? En terwijl Hij rondkeek naar hen die om Hem heen zaten, zei Hij: Zie, Mijn moeder en Mijn broers. Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Luk 5:4-11": "En toen Hij ophield met spreken, zei Hij tegen Simon: Steek af naar de diepte, en werp uw netten uit om te vangen. En Simon antwoordde en zei tegen Hem: Meester, we hebben de hele nacht gewerkt en niets gevangen; maar op Uw woord zal ik het net uitwerpen. En toen zij dat gedaan hadden, vingen ze een grote hoeveelheid vissen, en hun net scheurde.", "Tit 2:2": "Dat de oude mannen nuchter zijn, stemmig, bezonnen, gezond in het geloof, in de liefde, in de volharding.", "Hand 19:5": "En die dit hoorden, werden gedoopt in de Naam van de Heere Jezus.", "Mark 1:31": "En Hij ging naar haar toe, pakte haar hand, en richtte haar op; en meteen verliet de koorts haar, en zij diende hen.", "Hand 16:29": "En hij vroeg om licht, sprong naar binnen, en begon hevig te beven, en viel voor Paulus en Silas neer aan hun voeten;", "Matt 27:54": "En de hoofdman over honderd, en zij die met hem Jezus bewaakten, zagen de aardbeving en de dingen die gebeurd waren, en werden zeer bevreesd, en zeiden: Waarlijk, Deze was Gods Zoon!", "Jes 49:5": "En nu zegt de HEERE, Die Mij van moeders buik af tot een Knecht gevormd heeft, dat Ik Jakob tot Hem terugbrengen zou; maar Israël zal zich niet laten verzamelen; toch zal Ik verheerlijkt worden in de ogen van de HEERE, en Mijn God zal Mijn Sterkte zijn.", "Spr 5:19": "Een zeer lieflijke hinde, en een aangenaam steengeitje; laat haar borsten u altijd dronken maken; dool voortdurend in haar liefde.", "Matt 17:14-21": "En toen zij bij de menigte gekomen waren, kwam er iemand naar Hem toe, die voor Hem op de knieën viel en zei: Heere, ontferm U over mijn zoon, want hij is maanziek en lijdt zwaar; want vaak valt hij in het vuur, en vaak in het water. En ik heb hem naar Uw discipelen gebracht, maar zij hebben hem niet kunnen genezen.", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "Hand 7:58": "en wierpen hem de stad uit, en stenigden hem; en de getuigen legden hun kleren af aan de voeten van een jongeman, die Saulus heette.", "Jes 32:16-18": "En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid. En mijn volk zal in een woonplaats van vrede wonen, en in welverzekerde woningen, en in stille geruste plaatsen.", "Spr 28:1": "De goddelozen vluchten, terwijl geen vervolger er is; maar elke rechtvaardige is moedig, als een jonge leeuw.", "Hebr 13:18": "Bid voor ons; want wij vertrouwen dat wij een goed geweten hebben, omdat wij in alles eerlijk willen wandelen.", "Jes 40:4-11": "Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft. Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "Hand 9:3-18": "En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel; en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij? En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "Hand 26:9-15": "Ik meende inderdaad bij mijzelf dat ik tegen de Naam van Jezus van Nazareth veel dingen moest doen die ertegen ingingen. Dat heb ik ook gedaan in Jeruzalem, en ik heb velen van de heiligen in de gevangenissen gesloten, nadat ik de macht van de overpriesters ontvangen had; en toen zij omgebracht werden, stemde ik ermee in. En door alle synagogen heen heb ik hen dikwijls gestraft en gedwongen te lasteren; en boven mate tegen hen woedend heb ik hen vervolgd, ook tot in de buitenlandse steden.", "Gen 49:10": "De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Matt 16:13": "Toen Jezus nu gekomen was in de omgeving van Caesarea Filippi, vroeg Hij Zijn discipelen: Wie zeggen de mensen dat Ik, de Zoon des mensen, ben?", "Hand 14:6-20": "zijn zij, toen zij dit door hadden, gevlucht naar de steden van Lykaonië, namelijk Lystre en Derbe, en het omliggende land; en zij verkondigden daar het Evangelie. En een zeker man te Lystre zat zonder kracht in zijn voeten, kreupel van de moederschoot af, die nooit had gelopen.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Hand 3:7": "En hij pakte hem bij de rechterhand en richtte hem op; en meteen werden zijn voeten en enkels stevig.", "Dan 3:29": "Daarom wordt door mij een bevel gegeven, dat elk volk, natie en tong, die iets verkeerds spreekt tegen de God van Sadrach, Mesach en Abed-nego, in stukken gehouwen wordt, en zijn huis tot een puinhoop gemaakt wordt; want er is geen andere God die op zo'n manier kan verlossen.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "1 Kor 2:1-4": "En ik, broeders, toen ik bij u kwam, kwam niet met voortreffelijkheid van woorden of van wijsheid, terwijl ik u de getuigenis van God verkondigde. Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd. En ik was bij u in zwakheid, en in vrees, en in veel beven.", "Hand 21:39": "Maar Paulus zei: Ik ben een Joodse man uit Tarsus, burger van een niet onaanzienlijke stad in Cilicië; ik bid u, laat mij toe om tegen het volk te spreken.", "Ezech 33:15": "Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven.", "Joh 11:43": "En toen Hij dit gezegd had, riep Hij met luide stem: Lazarus, kom naar buiten!", "1 Kor 2:6": "En wij spreken wijsheid onder de volwassenen in het geloof; maar een wijsheid die niet van deze wereld is, en ook niet van de leiders van deze wereld, die tot niets worden;", "Ex 5:22": "Toen keerde Mozes weer terug tot de HEERE, en zei: Heere! Waarom hebt U dit volk kwaad gedaan, waarom hebt U mij nu gezonden?", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "Jes 55:13": "Voor een doorn zal een dennenboom opgaan, voor een distel zal een mirteboom opgaan; en het zal de HEERE wezen tot een naam, tot een eeuwig teken, dat niet uitgeroeid zal worden.", "Jak 3:11-18": "Welt er ook uit een fontein, uit een en dezelfde ader, het zoete en het bittere? Kan ook, mijn broeders, een vijgenboom olijven voortbrengen, of een wijnstok vijgen? Zo kan ook geen fontein zout en zoet water voortbrengen. Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "Fil 3:4-17": "Hoewel ik ook redenen had om op het vlees te vertrouwen; als iemand anders meent te kunnen vertrouwen op het vlees, ik nog meer. Besneden op de achtste dag, uit het geslacht van Israël, van de stam van Benjamin, een Hebreeër uit de Hebreeën, wat de wet betreft een Farizeeër; Wat de ijver betreft een vervolger van de Gemeente; wat de rechtvaardigheid betreft die in de wet is, onberispelijk.", "Matt 16:16": "En Simon Petrus antwoordde en zei: U bent de Christus, de Zoon van de levende God.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "2 Kor 1:8-10": "Want wij willen niet, broeders, dat u onwetend bent van onze verdrukking, die ons in Azië overkomen is: dat wij uitzonderlijk zwaar belast zijn geweest, boven ons vermogen, zodat wij zeer in twijfel waren, ook aan het leven. Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt; Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "2 Tim 1:6": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Fil 4:17": "Niet dat ik de gave zoek, maar ik zoek de vrucht, die overvloedig wordt tot uw rekening.", "Mark 1:10": "En meteen, toen Hij uit het water opklom, zag Hij de hemelen opengaan, en de Geest, als een duif, op Hem neerdalen.", "Ezech 39:29": "En Ik zal Mijn aangezicht niet meer voor hen verbergen, wanneer Ik Mijn Geest over het huis van Israël zal hebben uitgegoten, spreekt de Heere HEERE.", "Hand 10:44-47": "Terwijl Petrus deze woorden nog sprak, viel de Heilige Geest op allen die het Woord hoorden. En de gelovigen die uit de besnijdenis waren, zovelen als er met Petrus meegekomen waren, waren buiten zichzelf, omdat de gave van de Heilige Geest ook op de heidenen uitgestort werd. Want zij hoorden hen spreken in vreemde talen, en God groot maken. Toen antwoordde Petrus:", "Hand 11:24": "Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.", "Hand 4:23": "En toen zij losgelaten waren, gingen zij naar de hunnen, en verkondigden alles wat de overpriesters en de oudsten tegen hen gezegd hadden.", "Joz 22:31": "En Pinehas, de zoon van de priester Eleazar, zei tegen de kinderen van Ruben, en tegen de kinderen van Gad, en tegen de kinderen van Manasse: Vandaag weten wij, dat de HEERE in het midden van ons is, omdat u deze overtreding tegen de HEERE niet begaan hebt; nu hebt u de kinderen van Israël verlost uit de hand van de HEERE.", "1 Kon 18:10": "Zo waarachtig als de HEERE, uw God, leeft: er is geen volk of koninkrijk waar mijn heer niet naartoe gezonden heeft om u te zoeken; en als zij zeiden: Hij is hier niet, liet hij dat koninkrijk en dat volk zweren dat zij u niet hadden gevonden.", "Matt 27:52": "En de graven werden geopend, en veel lichamen van de heiligen die ontslapen waren, werden opgewekt;", "Mark 9:14-29": "En toen Hij bij de discipelen kwam, zag Hij een grote menigte om hen heen, en enige Schriftgeleerden die met hen aan het twisten waren. En meteen, toen de hele menigte Hem zag, was zij zeer verbaasd, en zij liepen naar Hem toe en groetten Hem. En Hij vroeg de Schriftgeleerden: Waarover twist u met hen?", "Joh 13:35": "Hieraan zullen allen weten dat u Mijn discipelen bent, als u liefde hebt onder elkaar.", "1 Tess 2:2-6": "maar hoewel wij eerst geleden hadden, en ons ook smaad was aangedaan, zoals u weet, in Filippi, hebben wij toch vrijmoedigheid gebruikt in onze God, om het Evangelie van God tot u te spreken onder veel strijd. Want onze vermaning is niet voortgekomen uit dwaling, niet uit onreinheid, en niet met bedrog; maar zoals wij door God beproefd zijn, zodat ons het Evangel
