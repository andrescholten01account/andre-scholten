/2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En Saulus, die nog steeds dreiging en moord blies tegen de discipelen van de Heere, ging naar de hogepriester,","2":"en vroeg hem om brieven aan de synagogen in Damaskus, opdat hij, als hij daar iemand zou vinden die van die weg was, zowel mannen als vrouwen, hen gebonden naar Jeruzalem zou brengen.","3":"En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel;","4":"en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij?","5":"En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.","6":"En hij, bevend en verbaasd, zei: Heere, wat wilt U dat ik doen zal? En de Heere zei tegen hem: Sta op, en ga de stad in, en daar zal u gezegd worden wat u doen moet.","7":"En de mannen die met hem meereisden, stonden sprakeloos; zij hoorden wel de stem, maar zagen niemand.","8":"En Saulus stond op van de grond; en toen hij zijn ogen opendeed, zag hij niemand. En zij leidden hem bij de hand en brachten hem naar Damaskus.","9":"En hij was drie dagen zonder te zien, en at niet en dronk niet.","10":"En er was een zekere discipel in Damaskus, met de naam Ananias; en de Heere zei tegen hem in een visioen: Ananias! En hij zei: Zie, hier ben ik, Heere!","11":"En de Heere zei tegen hem: Sta op en ga naar de straat die de Rechte genoemd wordt, en vraag in het huis van Judas naar iemand met de naam Saulus, uit Tarsen; want zie, hij bidt.","12":"En hij heeft in een visioen gezien dat een man, met de naam Ananias, binnenkwam en hem de hand oplegde, opdat hij weer zou kunnen zien.","13":"En Ananias antwoordde: Heere, ik heb van velen gehoord over deze man, hoeveel kwaad hij Uw heiligen in Jeruzalem heeft aangedaan;","14":"en hij heeft hier macht van de overpriesters om allen te binden die Uw Naam aanroepen.","15":"Maar de Heere zei tegen hem: Ga heen; want deze man is Mij een uitverkoren instrument om Mijn Naam te dragen voor de heidenen, en de koningen, en de kinderen van Israël.","16":"Want Ik zal hem tonen hoeveel hij lijden moet om Mijn Naam.","17":"En Ananias ging heen en kwam in het huis; en hij legde de handen op hem en zei: Saul, broeder! De Heere heeft mij gezonden, namelijk Jezus, Die u verschenen is op de weg waar u kwam, opdat u weer zou kunnen zien en met de Heilige Geest vervuld zou worden.","18":"En meteen vielen er van zijn ogen dingen af als schellen, en hij kon meteen weer zien; en hij stond op en werd gedoopt.","19":"En toen hij voedsel had genomen, werd hij sterker. En Saulus was enkele dagen bij de discipelen die in Damaskus waren.","20":"En hij predikte meteen Christus in de synagogen, dat Hij de Zoon van God is.","21":"En allen die het hoorden, waren verbaasd en zeiden: Is dit niet degene die in Jeruzalem verwoestte wie deze Naam aanriepen, en die daarom hierheen gekomen is, opdat hij hen gebonden zou brengen naar de overpriesters?","22":"Maar Saulus werd steeds sterker, en bracht de Joden die in Damaskus woonden in verwarring, doordat hij bewees dat Deze de Christus is.","23":"En toen er veel dagen verlopen waren, spanden de Joden samen om hem te doden.","24":"Maar hun plan werd Saulus bekend; en zij bewaakten de poorten, zowel overdag als 's nachts, om hem te kunnen doden.","25":"Maar de discipelen namen hem 's nachts en lieten hem neer door de muur, door hem in een mand te laten zakken.","26":"Toen Saulus in Jeruzalem gekomen was, probeerde hij zich bij de discipelen te voegen; maar zij waren allemaal bang voor hem, omdat zij niet geloofden dat hij een discipel was.","27":"Maar Barnabas nam hem mee, bracht hem bij de apostelen, en vertelde hun hoe hij op de weg de Heere gezien had, en dat Hij tegen hem gesproken had, en hoe hij in Damaskus vrijmoedig gesproken had in de Naam van Jezus.","28":"En hij was met hen, terwijl hij in Jeruzalem in- en uitging;","29":"en hij sprak vrijmoedig in de Naam van de Heere Jezus, en hij sprak ook en redetwistte met de Griekssprekende Joden; maar dezen probeerden hem te doden.","30":"Maar toen de broeders dit te weten kwamen, brachten zij hem naar Cesarea, en zonden hem weg naar Tarsen.","31":"De gemeenten dan, door heel Judea, en Galilea, en Samaria, hadden vrede en werden opgebouwd; en terwijl zij wandelden in de vreze van de Heere en de vertroosting van de Heilige Geest, werden zij talrijker.","32":"En het gebeurde, toen Petrus overal rondtrok, dat hij ook afkwam bij de heiligen die in Lydda woonden.","33":"En daar vond hij een zekere man, met de naam Eneas, die al acht jaar bedlegerig was, omdat hij verlamd was.","34":"En Petrus zei tegen hem: Eneas! Jezus Christus maakt u gezond; sta op en maak uzelf uw bed op. En hij stond meteen op.","35":"En allen die in Lydda en Sarona woonden, zagen hem, en zij bekeerden zich tot de Heere.","36":"En in Joppe was een zekere discipelin, met de naam Tabitha, wat vertaald Dorkas betekent. Deze vrouw was vol van goede werken en liefdegaven die zij gaf.","37":"En het gebeurde in die dagen dat zij ziek werd en stierf; en toen zij haar gewassen hadden, legden zij haar in de bovenzaal.","38":"En omdat Lydda dicht bij Joppe was, stuurden de discipelen, toen zij hoorden dat Petrus daar was, twee mannen naar hem toe, die hem smeekten niet te aarzelen naar hen over te komen.","39":"En Petrus stond op en ging met hen mee; en toen hij daar aangekomen was, brachten zij hem naar de bovenzaal. En alle weduwen stonden bij hem, huilend, en zij toonden de hemden en kleren die Dorkas gemaakt had, toen zij nog bij hen was.","40":"Maar Petrus stuurde hen allen naar buiten, knielde neer en bad; en hij keerde zich naar het lichaam en zei: Tabitha, sta op! En zij deed haar ogen open, en toen zij Petrus zag, ging zij overeind zitten.","41":"En hij gaf haar de hand en richtte haar op; en hij riep de heiligen en de weduwen en stelde haar levend aan hen voor.","42":"En dit werd bekend door heel Joppe, en velen geloofden in de Heere.","43":"En het gebeurde dat hij veel dagen in Joppe bleef, bij een zekere Simon, een leerlooier."},"SV":{"1":"En Saulus, blazende nog dreiging en moord tegen de discipelen des Heeren, ging tot de hogepriester,","2":"En begeerde brieven van hem naar Damaskus, aan de synagogen, opdat, zo hij enigen, die van dien weg waren, vond, hij *dezelve*, beiden mannen en vrouwen, zou gebonden brengen naar Jeruzalem.","3":"En als hij reisde, is het geschied, dat hij nabij Damaskus kwam, en hem omscheen snellijk een licht van den hemel;","4":"En ter aarde gevallen zijnde, hoorde hij een stem, die tot hem zeide: Saul, Saul! wat vervolgt gij Mij?","5":"En hij zeide: Wie zijt Gij, Heere? En de Heere zeide: Ik ben Jezus, Dien gij vervolgt. Het is u hard, de verzenen tegen de prikkels te slaan.","6":"En hij, bevende en verbaasd zijnde, zeide: Heere, wat wilt Gij, dat ik doen zal? En de Heere *zeide* tot hem: Sta op, en ga in de stad, en u zal *aldaar* gezegd worden, wat gij doen moet.","7":"En de mannen, die met hem over weg reisden, stonden verbaasd, horende wel de stem, maar niemand ziende.","8":"En Saulus stond op van de aarde; en als hij zijn ogen opendeed, zag hij niemand. En zij, hem bij de hand leidende, brachten hem te Damaskus.","9":"En hij was drie dagen, dat hij niet zag, en at niet, en dronk niet.","10":"En er was een zeker discipel te Damaskus, met name Ananias; en de Heere zeide tot hem in een gezicht: Ananias! En hij zeide: Zie, *hier* *ben* ik, Heere!","11":"En de Heere *zeide* tot hem: Sta op, en ga in de straat, genaamd de Rechte, en vraag in het huis van Judas naar *een*, met name Saulus, van Tarsen; want zie, hij bidt.","12":"En hij heeft in een gezicht gezien, dat een man, met name Ananias, inkwam, en hem de hand oplegde, opdat hij wederom ziende werd.","13":"En Ananias antwoordde: Heere! ik heb uit velen gehoord van dezen man, hoeveel kwaad hij Uw heiligen in Jeruzalem gedaan heeft;","14":"En heeft hier macht van de overpriesters, om te binden allen, die Uw Naam aanroepen.","15":"Maar de Heere zeide tot hem: Ga heen; want deze is Mij uitverkoren vat, om Mijn Naam te dragen voor de heidenen, en de koningen, en de kinderen Israëls.","16":"Want Ik zal hem tonen, hoeveel hij lijden moet om Mijn Naam.","17":"En Ananias ging heen en kwam in het huis; en de handen op hem leggende, zeide hij: Saul, broeder! de Heere heeft mij gezonden, *namelijk* Jezus, Die u verschenen is op den weg, dien gij kwaamt, opdat gij weder ziende en met den Heiligen Geest vervuld zoudt worden.","18":"En terstond vielen af van zijn ogen gelijk als schellen, en hij werd terstond wederom ziende; en stond op, en werd gedoopt.","19":"En als hij spijze genomen had, werd hij versterkt. En Saulus was sommige dagen bij de discipelen, die te Damaskus waren.","20":"En hij predikte terstond Christus in de synagogen, dat Hij de Zoon van God is.","21":"En zij ontzetten zich allen, die het hoorden, en zeiden: Is deze niet degene, die te Jeruzalem verstoorde, wie dezen Naam aanriepen, die daarom hier gekomen is, opdat hij dezelve gebonden zou brengen tot de overpriesters?","22":"Doch Saulus werd meer en meer bekrachtigd, en overtuigde de Joden, die te Damaskus woonden, bewijzende, dat deze de Christus is.","23":"En als vele dagen verlopen waren, zo hielden de Joden te zamen raad, om hem te doden.","24":"Maar hun lage werd Saulus bekend; en zij bewaarden de poorten, beide des daags en des nachts, opdat zij hem doden mochten.","25":"Doch de discipelen namen hem des nachts, en lieten *hem* neder door den muur, *hem* aflatende in een mand.","26":"Saulus nu, te Jeruzalem gekomen zijnde, poogde zich bij de discipelen te voegen; maar zij vreesden hem allen, niet gelovende, dat hij een discipel was.","27":"Maar Barnabas, hem tot zich nemende, leidde *hem* tot de apostelen, en verhaalde hun, hoe hij op den weg den Heere gezien had, en dat Hij tot hem gesproken had; en hoe hij te Damaskus vrijmoediglijk gesproken had in den Naam van Jezus.","28":"En hij was met hen ingaande en uitgaande te Jeruzalem;","29":"En vrijmoediglijk sprekende in den Naam van den Heere Jezus, sprak hij ook, en handelde tegen de Griekse *Joden*; maar deze trachtten hem te doden.","30":"Doch de broeders, *dit* verstaande geleidden hem tot Cesarea, en zonden hem af naar Tarsen.","31":"De Gemeenten dan, door geheel Judea, en Galilea, en Samaria, hadden vrede, en werden gesticht; en wandelende in de vreze des Heeren, en de vertroosting des Heiligen Geestes, werden vermenigvuldigd.","32":"En het geschiedde, als Petrus alom doortrok, dat hij ook afkwam tot de heiligen, die te Lydda woonden.","33":"En aldaar vond hij een zeker mens, met name Eneas, die acht jaren te bed gelegen had, welke geraakt was.","34":"En Petrus zeide tot hem: Eneas! Jezus Christus maakt u gezond; sta op en spreid uzelven *het* *bed*. En hij stond terstond op.","35":"En zij zagen hem allen, die te Lydda en Sarona woonden, dewelke zich bekeerden tot den Heere.","36":"En te Joppe was een zekere discipelin, met name Tabitha, hetwelk overgezet zijnde, is gezegd Dorkas. Deze was vol van goede werken en aalmoezen, die zij deed.","37":"En het geschiedde in die dagen, dat zij krank werd en stierf; en als zij haar gewassen hadden, legden zij haar in de opperzaal.","38":"En alzo Lydda nabij Joppe was, de discipelen, horende, dat Petrus aldaar was, zonden twee mannen tot hem, biddende, dat hij niet zou vertoeven tot hen over te komen.","39":"En Petrus stond op, en ging met hen; welken zij, als hij daar gekomen was, in de opperzaal leidden. En al de weduwen stonden bij hem, wenende, en tonende de rokken en klederen, die Dorkas gemaakt had, als zij bij haar was.","40":"Maar Petrus, hebbende hen *allen* uitgedreven, knielde neder en bad; en zich kerende tot het lichaam, zeide hij: Tabitha, sta op! En zij deed haar ogen open, en Petrus gezien hebbende, zat zij over einde.","41":"En hij gaf haar de hand, en richtte haar op, en de heiligen en de weduwen geroepen hebbende, stelde hij haar levend voor *hen*.","42":"En *dit* werd bekend door geheel Joppe, en velen geloofden in den Heere.","43":"En het geschiedde, dat hij vele dagen te Joppe bleef, bij een zekeren Simon, een lederbereider."},"KJV":{"1":"And Saul, yet breathing out threatenings and slaughter against the disciples of the Lord, went unto the high priest,","2":"And desired of him letters to Damascus to the synagogues, that if he found any of this way, whether they were men or women, he might bring them bound unto Jerusalem.","3":"And as he journeyed, he came near Damascus: and suddenly there shined round about him a light from heaven:","4":"And he fell to the earth, and heard a voice saying unto him, Saul, Saul, why persecutest thou me?","5":"And he said, Who art thou, Lord? And the Lord said, I am Jesus whom thou persecutest: *it is* hard for thee to kick against the pricks.","6":"And he trembling and astonished said, Lord, what wilt thou have me to do? And the Lord *said* unto him, Arise, and go into the city, and it shall be told thee what thou must do.","7":"And the men which journeyed with him stood speechless, hearing a voice, but seeing no man.","8":"And Saul arose from the earth; and when his eyes were opened, he saw no man: but they led him by the hand, and brought *him* into Damascus.","9":"And he was three days without sight, and neither did eat nor drink.","10":"And there was a certain disciple at Damascus, named Ananias; and to him said the Lord in a vision, Ananias. And he said, Behold, I *am here*, Lord.","11":"And the Lord *said* unto him, Arise, and go into the street which is called Straight, and enquire in the house of Judas for *one* called Saul, of Tarsus: for, behold, he prayeth,","12":"And hath seen in a vision a man named Ananias coming in, and putting *his* hand on him, that he might receive his sight.","13":"Then Ananias answered, Lord, I have heard by many of this man, how much evil he hath done to thy saints at Jerusalem:","14":"And here he hath authority from the chief priests to bind all that call on thy name.","15":"But the Lord said unto him, Go thy way: for he is a chosen vessel unto me, to bear my name before the Gentiles, and kings, and the children of Israel:","16":"For I will shew him how great things he must suffer for my name's sake.","17":"And Ananias went his way, and entered into the house; and putting his hands on him said, Brother Saul, the Lord, *even* Jesus, that appeared unto thee in the way as thou camest, hath sent me, that thou mightest receive thy sight, and be filled with the Holy Ghost.","18":"And immediately there fell from his eyes as it had been scales: and he received sight forthwith, and arose, and was baptized.","19":"And when he had received meat, he was strengthened. Then was Saul certain days with the disciples which were at Damascus.","20":"And straightway he preached Christ in the synagogues, that he is the Son of God.","21":"But all that heard *him* were amazed, and said; Is not this he that destroyed them which called on this name in Jerusalem, and came hither for that intent, that he might bring them bound unto the chief priests?","22":"But Saul increased the more in strength, and confounded the Jews which dwelt at Damascus, proving that this is very Christ.","23":"And after that many days were fulfilled, the Jews took counsel to kill him:","24":"But their laying await was known of Saul. And they watched the gates day and night to kill him.","25":"Then the disciples took him by night, and let *him* down by the wall in a basket.","26":"And when Saul was come to Jerusalem, he assayed to join himself to the disciples: but they were all afraid of him, and believed not that he was a disciple.","27":"But Barnabas took him, and brought *him* to the apostles, and declared unto them how he had seen the Lord in the way, and that he had spoken to him, and how he had preached boldly at Damascus in the name of Jesus.","28":"And he was with them coming in and going out at Jerusalem.","29":"And he spake boldly in the name of the Lord Jesus, and disputed against the Grecians: but they went about to slay him.","30":"*Which* when the brethren knew, they brought him down to Caesarea, and sent him forth to Tarsus.","31":"Then had the churches rest throughout all Judaea and Galilee and Samaria, and were edified; and walking in the fear of the Lord, and in the comfort of the Holy Ghost, were multiplied.","32":"And it came to pass, as Peter passed throughout all *quarters*, he came down also to the saints which dwelt at Lydda.","33":"And there he found a certain man named Aeneas, which had kept his bed eight years, and was sick of the palsy.","34":"And Peter said unto him, Aeneas, Jesus Christ maketh thee whole: arise, and make thy bed. And he arose immediately.","35":"And all that dwelt at Lydda and Saron saw him, and turned to the Lord.","36":"Now there was at Joppa a certain disciple named Tabitha, which by interpretation is called Dorcas: this woman was full of good works and almsdeeds which she did.","37":"And it came to pass in those days, that she was sick, and died: whom when they had washed, they laid *her* in an upper chamber.","38":"And forasmuch as Lydda was nigh to Joppa, and the disciples had heard that Peter was there, they sent unto him two men, desiring *him* that he would not delay to come to them.","39":"Then Peter arose and went with them. When he was come, they brought him into the upper chamber: and all the widows stood by him weeping, and shewing the coats and garments which Dorcas made, while she was with them.","40":"But Peter put them all forth, and kneeled down, and prayed; and turning *him* to the body said, Tabitha, arise. And she opened her eyes: and when she saw Peter, she sat up.","41":"And he gave her *his* hand, and lifted her up, and when he had called the saints and widows, presented her alive.","42":"And it was known throughout all Joppa; and many believed in the Lord.","43":"And it came to pass, that he tarried many days in Joppa with one Simon a tanner."}},"tsk":{"1":[{"kopje":"Saulus","refs":["Hand 9:11-13","Hand 9:19-21","Hand 7:58","Hand 8:3","Hand 22:3","Hand 22:4","Hand 26:9-11","1 Kor 15:9","Gal 1:13","Fil 3:6","1 Tim 1:13"]},{"kopje":"blies","refs":["Ps 27:12"]}],"2":[{"kopje":"vroeg","refs":["Hand 9:14","Hand 7:19","Hand 22:5","Hand 26:12","Est 3:8-13","Ps 82:2-4"]},{"kopje":"de synagogen","refs":["Hand 6:9","Hand 13:14","Hand 13:15","Hand 28:17-21"]},{"kopje":"van die weg","refs":["Hand 19:9","Hand 19:23","Hand 22:5","Hand 28:22"]}],"3":[{"kopje":"terwijl","refs":["Hand 9:17","Hand 22:6","Hand 26:12","Hand 26:13","1 Kor 15:8"]},{"kopje":"een licht","refs":["Ps 104:2","1 Tim 6:16","Openb 21:23 was <span class=\"wl wl-kjv\" data-code=\"G1451\">nigh</span> to <span class=\"wl wl-kjv\" data-code=\"G2445\">Joppa,</span> and the <span class=\"wl wl-kjv\" data-code=\"G3101\">disciples</span> had <span class=\"wl wl-kjv\" data-code=\"G191\">heard</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> <span class=\"wl wl-kjv\" data-code=\"G4074\">Peter</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">was</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">there,</span> they <span class=\"wl wl-kjv\" data-code=\"G649\">sent</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G1417\">two</span> <span class=\"wl wl-kjv\" data-code=\"G435\">men,</span> <span class=\"wl wl-kjv\" data-code=\"G3870\">desiring</span> him that he <span class=\"wl wl-kjv\" data-code=\"G3635\">would</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G3635\">delay</span> to <span class=\"wl wl-kjv\" data-code=\"G1330\">come</span> <span class=\"wl wl-kjv\" data-code=\"G2193\">to</span> them.","39":"<span class=\"wl wl-kjv\" data-code=\"G1161\">Then</span> <span class=\"wl wl-kjv\" data-code=\"G4074\">Peter</span> <span class=\"wl wl-kjv\" data-code=\"G450\">arose</span> and went <span class=\"wl wl-kjv\" data-code=\"G4905\">with</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them.</span> When <span class=\"wl wl-kjv\" data-code=\"G3739\">he</span> was <span class=\"wl wl-kjv\" data-code=\"G3854\">come,</span> they brought <span class=\"wl wl-kjv\" data-code=\"G321\">him</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> the upper <span class=\"wl wl-kjv\" data-code=\"G5253\">chamber:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> the <span class=\"wl wl-kjv\" data-code=\"G5503\">widows</span> stood <span class=\"wl wl-kjv\" data-code=\"G3936\">by</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G2799\">weeping,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1925\">shewing</span> the <span class=\"wl wl-kjv\" data-code=\"G5509\">coats</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2440\">garments</span> <span class=\"wl wl-kjv\" data-code=\"G3745\">which</span> <span class=\"wl wl-kjv\" data-code=\"G1393\">Dorcas</span> <span class=\"wl wl-kjv\" data-code=\"G4160\">made,</span> while she <span class=\"wl wl-kjv\" data-code=\"G5607\">was</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> them.","40":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> <span class=\"wl wl-kjv\" data-code=\"G4074\">Peter</span> <span class=\"wl wl-kjv\" data-code=\"G1544\">put</span> them <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1854\">forth,</span> and kneeled <span class=\"wl wl-kjv\" data-code=\"G5087\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"G4336\">prayed;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1994\">turning</span> him <span class=\"wl wl-kjv\" data-code=\"G4314\">to</span> the <span class=\"wl wl-kjv\" data-code=\"G4983\">body</span> <span class=\"wl wl-kjv\" data-code=\"G2036\">said,</span> <span class=\"wl wl-kjv\" data-code=\"G5000\">Tabitha,</span> <span class=\"wl wl-kjv\" data-code=\"G450\">arise.</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> she <span class=\"wl wl-kjv\" data-code=\"G455\">opened</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> <span class=\"wl wl-kjv\" data-code=\"G3788\">eyes:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> when she <span class=\"wl wl-kjv\" data-code=\"G1492\">saw</span> <span class=\"wl wl-kjv\" data-code=\"G4074\">Peter,</span> she sat up.","41":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> he <span class=\"wl wl-kjv\" data-code=\"G1325\">gave</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> his <span class=\"wl wl-kjv\" data-code=\"G5495\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"G450\">lifted</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> <span class=\"wl wl-kjv\" data-code=\"G450\">up,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">and</span> when he had <span class=\"wl wl-kjv\" data-code=\"G5455\">called</span> the <span class=\"wl wl-kjv\" data-code=\"G40\">saints</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5503\">widows,</span> <span class=\"wl wl-kjv\" data-code=\"G3936\">presented</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> alive.","42":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> it <span class=\"wl wl-kjv\" data-code=\"G1096\">was</span> <span class=\"wl wl-kjv\" data-code=\"G1110\">known</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">throughout</span> <span class=\"wl wl-kjv\" data-code=\"G3650\">all</span> <span class=\"wl wl-kjv\" data-code=\"G2445\">Joppa;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4183\">many</span> <span class=\"wl wl-kjv\" data-code=\"G4100\">believed</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">in</span> the Lord.","43":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> it came to <span class=\"wl wl-kjv\" data-code=\"G1096\">pass,</span> that <span class=\"wl wl-kjv\" data-code=\"G846\">he</span> <span class=\"wl wl-kjv\" data-code=\"G3306\">tarried</span> <span class=\"wl wl-kjv\" data-code=\"G2425\">many</span> <span class=\"wl wl-kjv\" data-code=\"G2250\">days</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G2445\">Joppa</span> <span class=\"wl wl-kjv\" data-code=\"G3844\">with</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">one</span> <span class=\"wl wl-kjv\" data-code=\"G4613\">Simon</span> a tanner."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
