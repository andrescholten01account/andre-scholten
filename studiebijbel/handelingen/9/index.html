fde niemand zich bij hen aansluiten; maar het volk hield hen in grote achting. En er werden steeds meer mensen toegevoegd, die de Heere geloofden, menigten zowel van mannen als van vrouwen;", "1 Kor 1:4": "Ik dank mijn God altijd over u, vanwege de genade van God, die u gegeven is in Christus Jezus;", "Deut 6:25": "En het zal ons gerechtigheid zijn, als wij ernaar streven al deze geboden te doen, voor het aangezicht van de HEERE, onze God, zoals Hij ons geboden heeft.", "Ex 31:3": "En Ik heb hem vervuld met de Geest van God, met wijsheid, en met verstand, en met kennis, namelijk in alle handwerk;", "Gal 1:1": "Paulus, een apostel, geroepen niet vanuit mensen, ook niet door een mens, maar door Jezus Christus, en God de Vader, Die Hem uit de doden heeft opgewekt,", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "2 Kor 3:16": "Maar zodra men zich tot de Heere bekeert, wordt het deksel weggenomen.", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Hand 14:1-28": "En het gebeurde in Ikonium, dat zij samen naar de synagoge van de Joden gingen, en zo spraken, dat een grote menigte, zowel van Joden als Grieken, geloofde. Maar de Joden die ongehoorzaam waren, zetten de heidenen aan en verbitterden hun harten tegen de broeders. Zij bleven dan daar een lange tijd, en spraken vrijmoedig in de Heere, Die getuigenis gaf aan het Woord van Zijn genade, en gaf dat er tekenen en wonderen gebeurden door hun handen.", "Joh 1:32": "En Johannes getuigde: Ik heb de Geest zien neerdalen uit de hemel, als een duif, en Hij bleef op Hem.", "Ps 101:3": "Ik zal geen slechte zaak voor mijn ogen stellen; ik haat het doen van de afvalligen, het zal mij niet aankleven.", "Hand 8:37": "En Filippus zei: Als u van ganser harte gelooft, is het geoorloofd. En hij antwoordde en zei: Ik geloof dat Jezus Christus de Zoon van God is.", "Hand 3:20": "En Hij Jezus Christus zal gezonden hebben, Die u van tevoren gepredikt is;", "2 Sam 5:2": "Ook al eerder, toen Saul koning over ons was, was u het die Israël uitleidde en terugbracht; ook heeft de HEERE tegen u gezegd: U zult Mijn volk Israël weiden, en u zult een leider zijn over Israël.", "Joh 8:56": "Abraham, uw vader, heeft er met vreugde naar verlangd Mijn dag te zien; en hij heeft hem gezien, en is verblijd geweest.", "Hand 26:7": "Waarnaar onze twaalf stammen, voortdurend nacht en dag God dienend, hopen te komen; over die hoop, o koning Agrippa, word ik door de Joden beschuldigd.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Ef 1:12-14": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben. In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte; Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Ps 102:16": "Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.", "Rom 10:3": "Want omdat zij de rechtvaardigheid van God niet kennen en hun eigen gerechtigheid proberen op te richten, hebben zij zich aan de rechtvaardigheid van God niet onderworpen.", "2 Kor 5:5": "Die ons nu hiertoe klaargemaakt heeft, is God, Die ons ook het onderpand van de Geest gegeven heeft.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Hand 22:5": "Zoals ook de hogepriester mij getuige is, en de gehele raad van oudsten; van hen heb ik ook brieven meegekregen naar de broeders, en ben naar Damaskus gereisd om ook hen die daar waren, gebonden naar Jeruzalem te brengen, opdat zij gestraft zouden worden.", "Hand 10:5": "En nu, zend mannen naar Joppe, en ontbied Simon, die ook Petrus genoemd wordt.", "Hand 26:14": "En toen wij allen op de grond neergevallen waren, hoorde ik een stem tot mij spreken, die zei in de Hebreeuwse taal: Saul, Saul, waarom vervolgt u Mij? Het is u hard, tegen de prikkels de hielen te slaan.", "Fil 2:11": "En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "1 Kor 3:11-15": "Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus. En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels; Ieders werk zal openbaar worden; want de dag zal het aan het licht brengen, omdat het door vuur ontdekt wordt; en hoedanig ieders werk is, zal het vuur beproeven.", "Spr 15:8": "Het offer van de goddelozen is de HEERE een gruwel; maar het gebed van de oprechten is Zijn welgevallen.", "Fil 1:21": "Want het leven is voor mij Christus, en het sterven is winst.", "Spr 1:25-27": "En u al Mijn raad verworpen hebt, en Mijn bestraffing niet gewild hebt; Zo zal Ik ook in uw verderf lachen; Ik zal spotten, wanneer uw vrees komt. Wanneer uw vrees komt als een verwoesting, en uw verderf aankomt als een wervelwind; wanneer benauwdheid en angst u overkomt;", "Mark 9:25": "En toen Jezus zag dat de menigte gezamenlijk toeliep, bestrafte Hij de onreine geest, en zei tegen hem: Stomme en dove geest, Ik gebied u, ga uit hem weg, en kom niet meer in hem.", "Luk 3:10": "En de menigten vroegen hem: Wat zullen wij dan doen?", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Hand 17:15": "En zij die Paulus begeleidden, brachten hem tot Athene toe; en toen zij een opdracht meegekregen hadden voor Silas en Timotheüs, dat zij zo snel mogelijk naar hem toe zouden komen, vertrokken zij.", "Hand 5:14": "En er werden steeds meer mensen toegevoegd, die de Heere geloofden, menigten zowel van mannen als van vrouwen;", "2 Kor 6:4": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden,", "Joh 9:9": "Anderen zeiden: Hij is het; en weer anderen: Hij lijkt op hem. Hijzelf zei: Ik ben het.", "Kol 3:9-17": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan, en de nieuwe mens hebt aangedaan, die vernieuwd wordt tot kennis, naar het evenbeeld van Hem die hem geschapen heeft; waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "Hand 12:25": "Barnabas nu en Saulus keerden terug van Jeruzalem, toen zij hun dienst volbracht hadden, en zij namen ook Johannes mee, die bijgenaamd werd Markus.", "1 Kon 18:9-14": "Maar hij zei: Wat heb ik gezondigd, dat u uw knecht geeft in de hand van Achab, om mij te doden? Zo waarachtig als de HEERE, uw God, leeft: er is geen volk of koninkrijk waar mijn heer niet naartoe gezonden heeft om u te zoeken; en als zij zeiden: Hij is hier niet, liet hij dat koninkrijk en dat volk zweren dat zij u niet hadden gevonden. En nu zegt u: Ga heen, zeg tegen uw heer: Zie, Elia is hier.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Matt 8:3": "En Jezus, de hand uitstrekkend, raakte hem aan, en zei: Ik wil, word gereinigd! En meteen werd hij van zijn melaatsheid gereinigd.", "2 Tim 4:6-8": "Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij. Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden; Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Ezech 16:6-8": "Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef! Ik heb u tot tienduizenden gemaakt, als het gewas van het veld; en u bent gegroeid, en groot geworden, en gekomen tot grote sierlijkheid; uw borsten zijn vast geworden, en uw haar is gegroeid, maar u was naakt en bloot. Toen Ik nu bij u voorbijkwam, zag Ik u, en zie, uw tijd was de tijd van de liefde; zo breidde Ik Mijn vleugel over u uit, en bedekte uw naaktheid; ja, Ik zwoer u, en kwam met u in een verbond, spreekt de Heere HEERE, en u werd van Mij.", "Ps 145:10": "Jod. Al Uw werken, HEERE, zullen U loven, en Uw gunstgenoten zullen U zegenen.", "Hand 9:20-22": "En hij predikte meteen Christus in de synagogen, dat Hij de Zoon van God is. En allen die het hoorden, waren verbaasd en zeiden: Is dit niet degene die in Jeruzalem verwoestte wie deze Naam aanriepen, en die daarom hierheen gekomen is, opdat hij hen gebonden zou brengen naar de overpriesters? Maar Saulus werd steeds sterker, en bracht de Joden die in Damaskus woonden in verwarring, doordat hij bewees dat Deze de Christus is.", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "1 Tim 5:9": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Matt 7:8": "Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden.", "Spr 5:7-13": "Nu dan, kinderen! Hoor naar mij, en wijk niet van de woorden van mijn mond. Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis; Opdat u anderen uw eer niet geeft, en uw jaren aan de wrede;", "1 Joh 3:18": "Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid.", "2 Tim 1:11": "Waartoe ik gesteld ben als prediker, en apostel, en leraar van de heidenen;", "Hand 8:16": "(Want Hij was nog op niemand van hen gevallen, maar zij waren alleen gedoopt in de Naam van de Heere Jezus.)", "1 Tess 2:2": "maar hoewel wij eerst geleden hadden, en ons ook smaad was aangedaan, zoals u weet, in Filippi, hebben wij toch vrijmoedigheid gebruikt in onze God, om het Evangelie van God tot u te spreken onder veel strijd.", "Ezech 3:14": "Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.", "Ezech 1:28": "Zoals de gedaante van de boog die in de wolk is op de dag van de regen, zo was de gedaante van de glans rondom; dit was de gedaante van de gelijkenis van de heerlijkheid van de HEERE; en toen ik het zag, viel ik op mijn gezicht, en ik hoorde een stem van Iemand Die sprak.", "1 Tess 2:14": "Want u, broeders, bent navolgers geworden van de Gemeenten van God die in Judea zijn, in Christus Jezus; omdat ook u hetzelfde geleden hebt van uw eigen medeburgers, zoals zij van de Joden;", "Hand 6:3": "Zie daarom om, broeders, naar zeven mannen uit uw midden, die een goede naam hebben, vol van de Heilige Geest en van wijsheid, die wij mogen aanstellen over deze taak.", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Ps 31:11": "Want mijn leven is verteerd van droefenis, en mijn jaren van zuchten; mijn kracht is vervallen door mijn ongerechtigheid, en mijn beenderen zijn doorknaagd.", "Joh 11:33-36": "Toen Jezus haar dan zag wenen, en de Joden die met haar meekwamen, ook zag wenen, werd Hij zeer bewogen in de geest, en raakte Hij ontroerd; en Hij zei: Waar hebt u hem gelegd? Zij zeiden tegen Hem: Heere, kom en zie het. Jezus weende.", "Hand 10:17": "En terwijl Petrus bij zichzelf twijfelde wat het gezicht dat hij gezien had toch mocht betekenen, zie, de mannen die door Cornelius gestuurd waren, hadden naar het huis van Simon gevraagd en stonden voor de poort.", "Jes 63:14": "Zoals een dier dat afgaat in de valleien, heeft de Geest van de HEERE hun rust gegeven. Zo hebt U Uw volk geleid, opdat U Uzelf een heerlijke Naam zou maken.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Hand 9:32-35": "En het gebeurde, toen Petrus overal rondtrok, dat hij ook afkwam bij de heiligen die in Lydda woonden. En daar vond hij een zekere man, met de naam Eneas, die al acht jaar bedlegerig was, omdat hij verlamd was. En Petrus zei tegen hem: Eneas! Jezus Christus maakt u gezond; sta op en maak uzelf uw bed op. En hij stond meteen op.", "1 Kor 14:26": "Wat is het dan, broeders? Wanneer u samenkomt, heeft ieder van u een psalm, heeft een leer, heeft een vreemde taal, heeft een openbaring, heeft een uitleg; laat alle dingen gebeuren tot stichting;", "Ezech 1:24": "En toen zij gingen, hoorde ik het geruis van hun vleugels, als het geruis van veel water, als de stem van de Almachtige, als het geluid van spreken, als het gedreun van een leger; als zij stonden, lieten zij hun vleugels neer.", "Ef 5:18": "En word niet dronken van wijn, waarin overdaad is, maar word vervuld met de Geest,", "Jes 42:1-12": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Hand 6:1": "In diezelfde dagen, toen het aantal discipelen groeide, ontstond er gemor van de Griekssprekenden tegen de Hebreeën, omdat hun weduwen bij de dagelijkse verzorging over het hoofd werden gezien.", "Hand 22:24-30": "beval de leider hen hem naar de legerplaats te brengen, en zei dat men hem met geselen zou ondervragen, opdat hij te weten kon komen om welke reden zij zo tegen hem riepen. En toen zij hem met de riemen vastbonden om hem te geselen, zei Paulus tegen de hoofdman over honderd die daar stond: Is het u geoorloofd een Romeins burger, en dat nog wel iemand die niet veroordeeld is, te geselen? Toen de hoofdman over honderd dat hoorde, ging hij naar de leider en meldde het hem, en zei: Kijk uit wat u doet, want deze man is een Romein.", "2 Petr 1:5-9": "En span daarom ook alle inspanning in om, naast uw geloof, ook deugd te voegen, en naast de deugd kennis, En naast de kennis matigheid, en naast de matigheid volharding, en naast de volharding godsvrucht, En naast de godsvrucht broederlijke liefde, en naast de broederlijke liefde, liefde jegens allen.", "Jer 31:18-20": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God! Zeker, nadat ik bekeerd ben, heb ik berouw gehad, en nadat ik mijzelf ben bekendgemaakt, heb ik op de heup geklopt, ik ben beschaamd, ja, ook schaamrood geworden, omdat ik de smaad van mijn jeugd gedragen heb. Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "1 Kor 14:5": "En ik wil wel dat u allen in vreemde talen spreekt, maar meer, dat u profeteert; want wie profeteert, is meer dan wie vreemde talen spreekt, tenzij hij het uitlegt, opdat de Gemeente stichting mag ontvangen.", "Jes 45:8": "Drupt, hemelen! van boven af, en laat de wolken vloeien van gerechtigheid; en laat de aarde zich openen, en laat allerlei heil uitwassen, en gerechtigheid samen uitspruiten; Ik, de HEERE, heb ze geschapen.", "Hand 9:19-21": "En toen hij voedsel had genomen, werd hij sterker. En Saulus was enkele dagen bij de discipelen die in Damaskus waren. En hij predikte meteen Christus in de synagogen, dat Hij de Zoon van God is. En allen die het hoorden, waren verbaasd en zeiden: Is dit niet degene die in Jeruzalem verwoestte wie deze Naam aanriepen, en die daarom hierheen gekomen is, opdat hij hen gebonden zou brengen naar de overpriesters?", "2 Kor 1:7": "En onze hoop voor u is vast, omdat wij weten dat u, zoals u deel hebt aan het lijden, ook zo deel hebt aan de vertroosting.", "Richt 6:36-40": "En Gideon zei tegen God: Als U Israël door mijn hand zult verlossen, zoals U gesproken hebt, zie, ik zal een wollen vlies op de dorsvloer leggen; als er dauw op het vlies alleen zal zijn, en droogte op de hele aarde, dan zal ik weten dat U Israël door mijn hand zult verlossen, zoals U gesproken hebt. En het gebeurde zo; want hij stond de volgende morgen vroeg op, en kneep het vlies uit, en hij wrong de dauw uit het vlies, een schaal vol water.", "1 Kon 18:7": "Toen Obadja nu op de weg was, zie, daar kwam Elia hem tegemoet; en hem herkennend, viel hij op zijn gezicht en zei: Bent u mijn heer Elia?", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Hand 16:10": "Toen hij nu dit visioen gezien had, zochten wij meteen naar Macedonië te reizen, omdat wij daaruit opmaakten dat de Heere ons geroepen had om hun het Evangelie te verkondigen.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Tit 2:7": "Laat uzelf in alles zien als een voorbeeld van goede werken, in de leer onvervalstheid, deftigheid, oprechtheid;", "Hand 10:20": "Sta daarom op, en ga naar beneden, en reis met hen mee, zonder te twijfelen; want Ik heb hen gezonden.", "Matt 13:54": "En toen Hij in Zijn vaderstad gekomen was, leerde Hij hen in hun synagoge, zodat zij versteld stonden en zeiden: Waar komt bij Deze die wijsheid en die krachten vandaan?", "Joh 15:6": "Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Joh 5:5": "En daar was een zeker mens, die achtendertig jaar ziek geweest was.", "Hand 4:36": "En Joses, door de apostelen bijgenaamd Barnabas (dat is vertaald: een zoon van vertroosting), een Leviet, van geboorte uit Cyprus,", "Rom 5:15": "Toch is het niet zo dat de genadegift is zoals de misdaad; want als door de misdaad van één velen gestorven zijn, is de genade van God, en de gave door de genade die er is van één Mens Jezus Christus, des te meer overvloedig geweest over velen.", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Joh 15:12": "Dit is Mijn gebod, dat u elkaar liefhebt, zoals Ik u liefgehad heb.", "Jes 2:21": "Gaande in de reten van de rotsen, en in de kloven van de steenrotsen, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde geweldig te verschrikken.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Fil 2:27-30": "En hij is ook ziek geweest, dicht bij de dood; maar God heeft Zich over hem ontfermd; en niet alleen over hem, maar ook over mij, opdat ik niet droefheid op droefheid zou hebben. Daarom heb ik hem des te vlugger gezonden, opdat u, wanneer u hem ziet, weer verblijd zou zijn, en ik minder droevig zou zijn. Ontvang hem dan in de Heere, met alle blijdschap, en houd zulke mensen in waarde.", "Hand 14:5": "En toen er een oploop kwam, zowel van heidenen als van Joden, met hun leiders, om hun smaad aan te doen en hen te stenigen,", "Gal 5:25": "Als wij door de Geest leven, laten wij dan ook door de Geest wandelen.", "Jes 40:13": "Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen?", "Hand 13:11": "En nu, zie, de hand van de Heere is tegen u, en u zult blind zijn, en de zon een tijdlang niet zien. En meteen viel er op hem donkerheid en duisternis; en rondlopend zocht hij mensen die hem bij de hand mochten leiden.", "Hebr 6:4": "Want het is onmogelijk om hen die eens verlicht zijn geweest, en de hemelse gave geproefd hebben, en deelgenoot geworden zijn van de Heilige Geest,", "Matt 11:3-6": "En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander? En Jezus antwoordde en zei tegen hen: Ga heen en vertel Johannes weer wat u hoort en ziet: De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en de armen wordt het Evangelie verkondigd.", "Ps 65:3": "U hoort het gebed; tot U zal alle vlees komen.", "1 Sam 17:11": "Toen Saul en heel Israël deze woorden van de Filistijn hoorden, schrokken zij enorm, en vreesden zeer.", "Dan 7:13": "Verder zag ik in de nachtgezichten, en zie, er kwam Een met de wolken van de hemel, als eens mensen zoon, en Hij kwam tot de Oude van dagen, en men liet Hem voor Hem naderen.", "Hand 2:1-42": "En toen de dag van het Pinksterfeest vervuld werd, waren zij allen eendrachtig bijeen. En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen.", "Openb 2:19": "Ik weet uw werken, en liefde, en dienst, en geloof, en uw lijdzaamheid, en uw werken, en dat de laatste meer zijn dan de eerste.", "Ef 4:30": "En bedroef de Heilige Geest van God niet, door Wie u verzegeld bent tot de dag van de verlossing.", "Joh 14:26": "Maar de Trooster, de Heilige Geest, Die de Vader zal zenden in Mijn Naam, Die zal u alles leren, en zal u alles laten herinneren wat Ik u gezegd heb.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Micha 4:4": "Maar zij zullen zitten, ieder onder zijn wijnstok en onder zijn vijgenboom, en er zal niemand zijn die hen verschrikt; want de mond van de HEERE van de heerscharen heeft het gesproken.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Gal 3:2": "Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof?", "Ps 2:2": "De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen:", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "Hand 15:35-39": "En Paulus en Barnabas bleven in Antiochië, terwijl zij met nog veel anderen het Woord van de Heere onderwezen en verkondigden. En na enige dagen zei Paulus tegen Barnabas: Laten wij nu teruggaan en onze broeders bezoeken in elke stad waarin wij het Woord van de Heere verkondigd hebben, om te zien hoe het met hen gaat. En Barnabas besloot Johannes, die Markus genoemd wordt, mee te nemen.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Dan 2:44": "Maar in de dagen van die koningen zal de God van de hemel een Koninkrijk oprichten, dat in eeuwigheid niet zal worden verwoest; en dat Koninkrijk zal aan geen ander volk worden overgelaten; het zal al die koninkrijken verbrijzelen en tenietdoen, maar zelf zal het in alle eeuwigheid bestaan.", "Spr 8:31": "Spelend in de wereld van Zijn aardrijk, en Mijn vreugden zijn met de mensenkinderen.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "1 Petr 3:14": "Maar als u ook lijdt om de gerechtigheid, dan bent u gelukkig te prijzen; en wees niet bang voor hun dreiging, en raak niet in verwarring;", "Klaagl 1:20": "Resch. Zie, HEERE, want mij is bang; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer opstandig geweest; van buiten heeft mij het zwaard van kinderen beroofd, van binnen is het als de dood.", "1 Joh 3:16": "Hieraan hebben wij de liefde gekend, dat Hij Zijn leven voor ons gesteld heeft; en wij zijn schuldig het leven te stellen voor de broeders.", "Num 11:22": "Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is?", "Hand 28:17-31": "En het gebeurde na drie dagen dat Paulus de voornaamsten van de Joden bij elkaar riep. En toen zij bijeengekomen waren, zei hij tegen hen: Mannen broeders, ik, die niets gedaan heb tegen het volk of de gewoonten van de voorvaders, ben als gevangene uit Jeruzalem overgeleverd in de handen van de Romeinen; Die mij, na mij onderzocht te hebben, wilden loslaten, omdat er geen doodschuld in mij was. Maar toen de Joden zich hiertegen verzetten, werd ik genoodzaakt mij op de keizer te beroepen; niet omdat ik iets had om mijn volk van te beschuldigen.", "Mal 1:11": "Maar van de opgang van de zon tot haar ondergang, zal Mijn Naam groot zijn onder de heidenen; en op elke plaats zal aan Mijn Naam reukwerk gebracht worden, en een rein spijsoffer; want Mijn Naam zal groot zijn onder de heidenen, zegt de HEERE van de heerscharen.", "1 Tess 2:16": "en ons verhinderen tot de heidenen te spreken, opdat zij behouden worden; zodat zij altijd de maat van hun zonden vol maken. En de toorn is over hen gekomen tot het einde.", "Ps 40:3": "En Hij heeft mij uit een ruisende kuil, uit modderig slijk opgehaald, en heeft mijn voeten op een rotssteen gesteld, Hij heeft mijn gangen vastgemaakt.", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "2 Kor 6:8-10": "door eer en oneer, door kwaad gerucht en goed gerucht; als verleiders, en toch waarachtig; als onbekenden, en toch bekend; als stervenden, en zie, wij leven; als getuchtigd, en niet gedood; als treurend, maar altijd blij; als arm, maar velen rijk makend; als niets hebbend, en toch alles bezittend.", "Hand 18:4": "En hij sprak op elke sabbat in de synagoge, en bracht Joden en Grieken tot geloof.", "Joh 8:47": "Wie uit God is, hoort de woorden van God; daarom hoort u niet, omdat u niet uit God bent.", "1 Tess 2:8-11": "zo hebben wij, omdat wij zeer aan u gehecht waren, u graag niet alleen het Evangelie van God willen geven, maar ook onze eigen zielen, omdat u ons lief geworden was. Want u herinnert zich, broeders, onze inspanning en moeite; want terwijl wij nacht en dag werkten, om niemand van u tot last te zijn, hebben wij het Evangelie van God onder u gepredikt. U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben.", "Jes 49:18-23": "Hef uw ogen op rondom, en zie, al dezen verzamelen zich, zij komen tot u; Zo waarachtig als Ik leef, spreekt de HEERE, zeker zult u zich met al dezen als met een sieraad bekleden, en u zult ze u aanbinden, zoals een bruid. Want in uw woeste en uw eenzame plaatsen, en uw verwoeste land, zeker, nu zult u benauwd worden van inwoners; en zij die u verslonden, zullen zich ver van u maken. Nog zullen de kinderen, waarvan u beroofd was, zeggen voor uw oren: De plaats is mij te nauw, wijk van mij, dat ik wonen mag.", "Spr 10:7": "De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten.", "Ex 14:10-12": "Toen Farao dichtbij gekomen was, hieven de kinderen van Israël hun ogen op, en zie, de Egyptenaren trokken achter hen aan; en zij vreesden zeer; toen riepen de kinderen van Israël tot de HEERE. En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd? Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Joh 18:6": "Toen Hij dan tegen hen zei: Ik ben het, gingen zij achteruit en vielen op de grond.", "Hand 17:1-13": "En nadat zij door Amfipolis en Apollonia hun weg genomen hadden, kwamen zij te Thessalonica, waar een synagoge van de Joden was. En Paulus ging, zoals hij gewoon was, bij hen naar binnen, en drie sabbatten lang sprak hij met hen uit de Schriften, En legde ze uit, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus is, Die ik, zei hij, u verkondig.", "Hand 19:10": "En dit gebeurde twee jaar lang, zodat allen die in Azië woonden het Woord van de Heere Jezus hoorden, zowel Joden als Grieken.", "1 Petr 1:12": "Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "Jes 32:15": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden.", "1 Tess 3:4": "Want ook toen wij bij u waren, zeiden wij u van tevoren dat wij verdrukt zouden worden, zoals ook gebeurd is, en u weet het.", "Gal 1:24": "En zij verheerlijkten God om mij.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Hand 6:6": "hen stelden zij voor de apostelen; en die legden, na gebeden te hebben, hun de handen op.", "Hand 21:13": "Maar Paulus antwoordde: Wat doet u, dat u weent en mijn hart week maakt? Want ik ben bereid niet alleen gebonden te worden, maar ook te sterven te Jeruzalem, voor de Naam van de Heere Jezus.", "Hand 13:50": "Maar de Joden zetten de godsdienstige en aanzienlijke vrouwen op, en de voornaamsten van de stad, en verwekten vervolging tegen Paulus en Barnabas, en verdreven hen uit hun gebied.", "Fil 1:8": "Want God is mijn Getuige, hoezeer ik verlang naar u allen, met de innerlijke bewogenheid van Jezus Christus.", "Spr 8:13": "De vreze van de HEERE is: het kwade haten, de hovaardigheid, en de hoogmoed, en de kwade weg; Ik haat ook de mond van de verkeerdheden.", "Jes 11:2": "En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE.", "Hand 17:16": "En terwijl Paulus hen te Athene verwachtte, werd zijn geest in hem geprikkeld, toen hij zag dat de stad zo vol afgoden was.", "Dan 7:14": "En Hem werd gegeven heerschappij, en eer, en het Koninkrijk, dat alle volken, natiën en talen Hem zouden eren; Zijn heerschappij is een eeuwige heerschappij, die niet zal vergaan, en Zijn Koninkrijk zal niet te gronde gericht worden.", "Hand 20:8": "En er waren veel lampen in de bovenzaal waar zij bijeen waren.", "Zach 9:1": "De last van het woord van de HEERE over het land Chadrach en Damaskus, zijn rustplaats; want de HEERE heeft een oog op de mens, zoals op alle stammen van Israël.", "2 Kor 12:17-19": "Heb ik door iemand van hen die ik naar u toe gezonden heb, van u mijn voordeel gezocht? Ik heb Titus gevraagd, en de broeder meegezonden; heeft ook Titus van u zijn voordeel gezocht? Hebben wij niet in dezelfde geest gewandeld? Hebben wij niet in dezelfde voetstappen gewandeld? Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw.", "1 Kron 22:18": "Is de HEERE, uw God, niet met u, en heeft Hij u geen rust gegeven rondom? Want Hij heeft de inwoners van het land in mijn hand gegeven, en dit land is onderworpen geworden voor het aangezicht van de HEERE, en voor het aangezicht van Zijn volk.", "Rom 5:1-5": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus; Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God. En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt;", "Hoogl 2:9": "Mijn Liefste is gelijk een ree, of een jong van de herten; zie, Hij staat achter onze muur, kijkend uit de vensters, blinkend door de traliën.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "2 Tim 1:8": "Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Matt 10:20": "Want u bent het niet die spreekt, maar het is de Geest van uw Vader, Die in u spreekt.", "Hand 9:3-6": "En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel; en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij? En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "2 Tess 1:3-5": "Wij moeten God altijd danken over u, broeders, zoals het behoort, omdat uw geloof zeer meer wordt, en de liefde van elk van u allen jegens elkaar overvloedig wordt; Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt; Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt;", "Joh 19:23": "De soldaten dan namen, toen zij Jezus gekruisigd hadden, Zijn kleren (en maakten er vier delen van, voor elke soldaat een deel) en de onderkleding. De onderkleding nu was zonder naad, van boven af helemaal geweven.", "1 Kon 3:7": "Nu dan, HEERE, mijn God! U hebt Uw knecht koning gemaakt in de plaats van mijn vader David; en ik ben een jonge man, ik weet niet uit te gaan of in te gaan.", "Hand 9:26-29": "Toen Saulus in Jeruzalem gekomen was, probeerde hij zich bij de discipelen te voegen; maar zij waren allemaal bang voor hem, omdat zij niet geloofden dat hij een discipel was. Maar Barnabas nam hem mee, bracht hem bij de apostelen, en vertelde hun hoe hij op de weg de Heere gezien had, en dat Hij tegen hem gesproken had, en hoe hij in Damaskus vrijmoedig gesproken had in de Naam van Jezus. En hij was met hen, terwijl hij in Jeruzalem in- en uitging;", "Hand 23:12-15": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben. En het waren er meer dan veertig die deze eed samen hadden afgelegd. Zij gingen naar de overpriesters en de oudsten en zeiden: Wij hebben onszelf met een vervloeking vervloekt om niets te nuttigen totdat wij Paulus gedood zullen hebben.", "Luk 13:10": "En Hij gaf onderwijs op de sabbat in een van de synagogen.", "1 Tess 1:5": "Want ons Evangelie is bij u niet alleen met woorden gekomen, maar ook met kracht, en met de Heilige Geest, en met veel zekerheid; zoals u weet wat voor mensen wij bij u geweest zijn, ter wille van u.", "Ps 16:3": "maar tot de heiligen die op de aarde zijn, en de heerlijke mensen, in wie al mijn vreugde is.", "Hand 14:6": "zijn zij, toen zij dit door hadden, gevlucht naar de steden van Lykaonië, namelijk Lystre en Derbe, en het omliggende land;", "Hand 10:17-20": "En terwijl Petrus bij zichzelf twijfelde wat het gezicht dat hij gezien had toch mocht betekenen, zie, de mannen die door Cornelius gestuurd waren, hadden naar het huis van Simon gevraagd en stonden voor de poort. En zij riepen iemand en vroegen of Simon, die ook Petrus genoemd werd, daar te gast was. En terwijl Petrus over dat gezicht nadacht, zei de Geest tegen hem: Zie, drie mannen zoeken u;", "Jer 1:5": "Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld.", "Luk 21:15": "Want Ik zal u mond en wijsheid geven, die al uw tegenstanders niet zullen kunnen tegenspreken, noch weerstaan.", "Rom 12:5": "zo zijn wij, hoewel velen, één lichaam in Christus, maar ieder afzonderlijk zijn wij elkaars leden.", "Luk 1:76": "En u, kind, zult een profeet van de Allerhoogste genoemd worden; want u zult voor het aangezicht van de Heere uit gaan, om Zijn wegen te bereiden;", "Rom 14:17-19": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest. Want hij die Christus in deze dingen dient, is God welgevallig, en aangenaam bij de mensen. Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient.", "Hand 10:24": "En de volgende dag kwamen zij in Cesarea aan. En Cornelius verwachtte hen, en had zijn familie en beste vrienden bijeengeroepen.", "1 Kon 19:13-18": "En het gebeurde, toen Elia dat hoorde, dat hij zijn gezicht bedekte met zijn mantel, en naar buiten ging, en ging staan in de ingang van de grot. En zie, een stem kwam tot hem, die zei: Wat doet u hier, Elia? En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden. En de HEERE zei tegen hem: Ga, keer terug op uw weg, naar de woestijn van Damaskus; en als u daar aankomt, zalf dan Hazaël tot koning over Syrië.", "Joh 16:1-4": "Deze dingen heb Ik tot u gesproken, opdat u niet geërgerd wordt. Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen. En deze dingen zullen zij u doen, omdat zij de Vader niet gekend hebben, en Mij ook niet.", "Hand 27:23": "Want deze zelfde nacht heeft bij mij gestaan een engel van God, van Wie ik ben en Die ik ook dien,", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Gal 5:18": "Maar als u door de Geest geleid wordt, dan bent u niet onder de wet.", "Filem 1:16": "Nu voortaan niet als een dienstknecht, maar meer dan een dienstknecht, namelijk een geliefde broeder, vooral voor mij, hoeveel te meer dan voor u, zowel in het vlees als in de Heere.", "Ps 130:1-3": "Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE! Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen. Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Joh 17:3": "En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "2 Tess 3:7-9": "Want u zelf weet hoe men ons behoort na te volgen; want wij hebben ons niet ongeregeld gedragen onder u; En wij hebben geen brood bij iemand gegeten voor niets, maar in arbeid en moeite, nacht en dag werkend, opdat wij niemand van u lastig zouden zijn; Niet dat wij de macht niet hebben, maar opdat wij onszelf u zouden geven tot een voorbeeld, om ons na te volgen.", "Joh 2:23": "En toen Hij te Jeruzalem was, op het Pascha, tijdens het feest, geloofden velen in Zijn Naam, omdat zij Zijn tekenen zagen die Hij deed.", "Hand 16:19-25": "Toen de heren van haar nu zagen dat de hoop op hun gewin weg was, grepen zij Paulus en Silas, en sleepten hen naar de markt, voor de leiders. En toen zij hen tot de aanvoerders gebracht hadden, zeiden zij: Deze mensen brengen onze stad in opschudding, omdat zij Joden zijn. En zij verkondigen gewoonten die wij niet mogen aannemen, noch mogen navolgen, omdat wij Romeinen zijn.", "Hand 26:23": "Namelijk dat de Christus moest lijden, en dat Hij, als Eerste uit de opstanding van de doden, een licht zou verkondigen aan dit volk en aan de heidenen.", "Ps 2:12": "Kust de Zoon, opdat Hij niet toornt, en u op de weg vergaat, wanneer Zijn toorn maar een weinig zou ontbranden. Gelukkig zijn allen die op Hem vertrouwen.", "Ps 68:33": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela.", "Hand 1:8": "maar u zult de kracht van de Heilige Geest ontvangen, Die over u komen zal; en u zult Mijn getuigen zijn, zowel in Jeruzalem als in heel Judea en Samaria, en tot aan het uiterste van de aarde.", "Hand 25:22-27": "En Agrippa zei tegen Festus: Ik zou die man ook wel zelf willen horen. En hij zei: Morgen zult u hem horen. De volgende dag dan, toen Agrippa gekomen was en Bernice, met grote pracht, en zij het gerechtsgebouw waren binnengegaan met de aanvoerders en de mannen die de voornaamsten van de stad waren, werd Paulus op bevel van Festus voorgebracht. En Festus zei: Koning Agrippa, en u, mannen, allen die hier bij ons aanwezig bent, u ziet deze man over wie de hele menigte van de Joden zich tot mij gewend heeft, zowel in Jeruzalem als hier, en geroepen heeft dat hij niet langer mag leven.", "Fil 1:20": "Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood.", "Hand 15:2": "Toen er dan geen kleine weerstand en twist ontstond bij Paulus en Barnabas tegen hen, hebben zij afgesproken dat Paulus en Barnabas, en enigen van de anderen, naar de apostelen en oudsten in Jeruzalem zouden opgaan over deze vraag.", "Rom 10:12-14": "Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen. Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden. Hoe zullen zij Hem dan aanroepen, in Wie zij niet geloofd hebben? En hoe zullen zij in Hem geloven, van Wie zij niet gehoord hebben? En hoe zullen zij horen, zonder iemand die hun predikt?", "Joh 12:44": "En Jezus riep en zei: Wie in Mij gelooft, gelooft niet in Mij, maar in Hem Die Mij gezonden heeft.", "Hos 10:12": "Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.", "1 Joh 4:15": "Wie beleden zal hebben dat Jezus de Zoon van God is, God blijft in hem, en hij in God.", "Hand 10:46-48": "Want zij hoorden hen spreken in vreemde talen, en God groot maken. Toen antwoordde Petrus: Kan iemand soms het water weren, zodat dezen niet gedoopt zouden worden, die de Heilige Geest ontvangen hebben, evenals ook wij? En hij beval dat zij gedoopt zouden worden in de Naam van de Heere. Toen vroegen zij hem of hij enige dagen bij hen wilde blijven.", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Spr 16:6": "Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze van de HEERE wijkt men af van het kwade.", "2 Kor 1:17-19": "Toen ik dit dan van plan was, heb ik dan lichtvaardig gehandeld? Of neem ik mijn voornemens naar het vlees, zodat bij mij zou zijn: ja, ja, en nee, nee? Maar God is getrouw: ons woord aan u is niet ja en nee geweest. Want de Zoon van God, Jezus Christus, Die onder u door ons gepredikt is, namelijk door mij, en Silvanus, en Timotheüs, was niet ja en nee, maar is geweest ja in Hem.", "Ex 4:12-14": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult. Doch hij zei: Och, Heere! zend toch door de hand van hem die U zult zenden. Toen ontstak de toorn van de HEERE over Mozes, en Hij zei: Is Aäron, de Leviet, uw broer, niet? Ik weet, dat hij zeer goed spreken zal, en ook, zie, hij zal u tegemoet gaan; wanneer hij u ziet, zal hij in zijn hart blij zijn.", "1 Kor 11:1": "Wees mijn navolgers, zoals ik ook navolger ben van Christus.", "Gal 2:8": "(Want Hij Die door Petrus krachtig werkte tot het apostelschap voor de besnedenen, Die werkte ook krachtig in mij onder de heidenen);", "2 Kon 4:32-36": "En toen Elisa het huis binnenkwam, zie, daar was de jongen dood, neergelegd op zijn bed. Zo ging hij naar binnen, en sloot de deur achter hen beiden toe, en bad tot de HEERE. En hij klom op het bed, en ging op het kind liggen, en legde zijn mond op diens mond, en zijn ogen op zijn ogen, en zijn handen op zijn handen, en boog zich over hem heen. En het vlees van het kind werd warm.", "Jes 57:18": "Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "1 Tim 1:1": "Paulus, een apostel van Jezus Christus, naar het bevel van God, onze Zaligmaker, en de Heere Jezus Christus, Die onze Hoop is,", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Hand 22:21": "En Hij zei tegen mij: Ga heen; want Ik zal u ver weg zenden, naar de heidenen.", "Jes 66:8": "Wie heeft ooit zoiets gehoord? Wie heeft dergelijke dingen gezien? Zou een land geboren kunnen worden op één dag? Zou een volk geboren kunnen worden in één keer? Maar Sion heeft weeën gekregen, en zij heeft haar zonen gebaard.", "Rom 15:19": "door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb.", "Hand 15:25": "hebben wij, eensgezind samen zijnde, het goed gevonden enkele mannen te kiezen, en tot u te zenden, met onze geliefden Barnabas en Paulus,", "Hand 8:36-38": "En terwijl zij over de weg reisden, kwamen zij bij een zeker water; en de kamerling zei: Zie, hier is water; wat verhindert mij om gedoopt te worden? En Filippus zei: Als u van ganser harte gelooft, is het geoorloofd. En hij antwoordde en zei: Ik geloof dat Jezus Christus de Zoon van God is. En hij gebood de wagen stil te houden; en zij daalden beiden af in het water, zowel Filippus als de kamerling, en hij doopte hem.", "Gal 4:6": "En omdat u kinderen bent, heeft God de Geest van Zijn Zoon uitgezonden in uw harten, Die roept: Abba, Vader!", "2 Tim 1:3": "Ik dank God, aan Wie ik dien vanaf mijn voorouders met een rein geweten, zoals ik zonder ophouden aan u denk in mijn gebeden, nacht en dag;", "Joh 10:16": "Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "Ezech 10:5": "En het geruis van de vleugels van de cherubs werd gehoord tot het uiterste voorhof, als de stem van de Almachtige God, wanneer Hij spreekt.", "Ex 10:7": "En de knechten van Farao zeiden tegen hem: Hoe lang zal deze man ons tot een valstrik zijn? Laat de mannen gaan, dat zij de HEERE, hun God, dienen! Weet u nog niet dat Egypte verloren is?", "Spr 2:5-20": "Dan zult u de vreze des HEEREN verstaan, en zult de kennis van God vinden. Want de HEERE geeft wijsheid; uit Zijn mond komt kennis en verstand. Hij legt weg voor de oprechten een bestendig bezit; Hij is een schild voor hen die oprecht wandelen;", "Gal 5:5": "Want wij verwachten door de Geest, uit het geloof, de hoop van de rechtvaardigheid.", "2 Kor 8:9": "Want u kent de genade van onze Heere Jezus Christus, dat Hij om uwentwil arm geworden is, terwijl Hij rijk was, opdat u door Zijn armoede rijk zou worden.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Hand 19:9": "Maar toen sommigen verhard werden en ongehoorzaam waren, en kwaadspraken van de weg des Heeren voor de menigte, ging hij bij hen weg, en zonderde de discipelen af, dagelijks sprekend in de school van een zekere Tyrannus.", "2 Kor 11:7": "Heb ik zonde gedaan, toen ik mijzelf vernederd heb opdat u verhoogd zou worden, omdat ik u het Evangelie van God om niet verkondigd heb?", "Gal 4:11": "Ik ben bang voor u, dat ik niet misschien tevergeefs onder u gearbeid heb.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Gen 12:13": "Zeg toch: U bent mijn zuster; opdat het mij goed gaat om u, en ik in leven blijf om uwentwil.", "Matt 9:28-30": "En toen Hij het huis binnengegaan was, kwamen de blinden bij Hem. En Jezus zei tegen hen: Gelooft u dat Ik dit kan doen? Zij zeiden tegen Hem: Ja, Heere! Toen raakte Hij hun ogen aan en zei: U geschiedt naar uw geloof. En hun ogen werden geopend. En Jezus verbood hun streng, en zei: Zorg dat niemand het weet.", "Openb 11:11": "En na die drie dagen en een halve is een geest van leven uit God in hen gegaan; en zij stonden op op hun voeten; en er is grote vrees gevallen op hen die hen aanschouwden.", "Hand 9:25-27": "Maar de discipelen namen hem 's nachts en lieten hem neer door de muur, door hem in een mand te laten zakken. Toen Saulus in Jeruzalem gekomen was, probeerde hij zich bij de discipelen te voegen; maar zij waren allemaal bang voor hem, omdat zij niet geloofden dat hij een discipel was. Maar Barnabas nam hem mee, bracht hem bij de apostelen, en vertelde hun hoe hij op de weg de Heere gezien had, en dat Hij tegen hem gesproken had, en hoe hij in Damaskus vrijmoedig gesproken had in de Naam van Jezus.", "2 Tim 2:21": "Als iemand zichzelf dan van deze dingen reinigt, zal hij een voorwerp zijn tot eer, geheiligd en bruikbaar voor de Heere, toebereid tot alle goed werk.", "Ezech 7:16-18": "En hun ontkomenen zullen wel ontkomen, maar zij zullen op de bergen zijn, zij allen zullen zijn als duiven van de dalen, kermend, ieder om zijn ongerechtigheid. Alle handen zullen slap worden, en alle knieën zullen wegvloeien als water. Ook zullen zij zakken aangorden, gruwen zal hen bedekken, en over alle gezichten zal schaamte zijn, en op al hun hoofden kaalheid.", "Ezech 37:9": "En Hij zei tot mij: Profeteer tot de geest; profeteer, mensenkind! En zeg tot de geest: Zo zegt de Heere HEERE: Geest! Kom van de vier winden, en blaas in deze gedoden, zodat zij levend worden.", "Hand 24:14-25": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is; Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen. En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "2 Tim 2:4": "Niemand die als soldaat dient, wikkelt zich in de zaken van het dagelijks leven, opdat hij hem kan behagen die hem tot soldaat heeft aangenomen.", "Joh 14:18": "Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Hand 10:19": "En terwijl Petrus over dat gezicht nadacht, zei de Geest tegen hem: Zie, drie mannen zoeken u;", "1 Petr 3:1-11": "Evenzo, u vrouwen, wees uw eigen mannen onderdanig; opdat ook, als er sommigen zijn die het Woord ongehoorzaam zijn, zij door de wandel van de vrouwen zonder Woord gewonnen mogen worden; Als zij uw kuise wandel in vreze zullen hebben gezien. Laat uw versiering niet zijn de uiterlijke, bestaande in het vlechten van het haar, en het omhangen van goud, of het aantrekken van klederen;", "Ex 6:11": "Doch Mozes sprak voor de HEERE en zei: Zie, de kinderen van Israël hebben naar mij niet geluisterd; hoe zou Farao dan naar mij luisteren? Bovendien ben ik onbesneden van lippen.", "2 Kor 10:14-16": "Want wij strekken onszelf niet te wijd uit, alsof wij u niet zouden bereiken; want wij zijn ook tot u toe gekomen, in het Evangelie van Christus; Niet roemend buiten de maat over de arbeid van andere mensen, maar hebbende de hoop dat, als uw geloof meer wordt, wij onder u overvloedig vergroot zullen worden naar onze regel; Om het Evangelie te verkondigen in de gebieden die verder weg liggen dan u; niet om te roemen op de regel van iemand anders over wat al gereed is.", "Neh 8:2-9": "verzamelde het hele volk zich als één man op het plein voor de Waterpoort; en zij zeiden tegen Ezra, de schriftgeleerde, dat hij het boek van de wet van Mozes zou halen, die de HEERE aan Israël geboden had. En Ezra, de priester, bracht de wet voor de gemeente, zowel mannen als vrouwen, en allen die het konden begrijpen als zij het hoorden, op de eerste dag van de zevende maand. En hij las eruit voor op het plein dat voor de Waterpoort is, vanaf het morgenlicht tot de middag, ten overstaan van de mannen en vrouwen en hen die het konden begrijpen; en de oren van heel het volk waren gericht op het wetboek.", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Hand 23:11-35": "En de volgende nacht stond de Heere bij hem en zei: Heb goede moed, Paulus, want zoals u in Jeruzalem van Mij getuigd hebt, zo moet u ook in Rome getuigen. En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben. En het waren er meer dan veertig die deze eed samen hadden afgelegd.", "Jona 1:3": "Maar Jona maakte zich op om te vluchten naar Tarsis, van het aangezicht van de HEERE; en hij kwam af te Jafo, en vond een schip dat naar Tarsis ging, en hij betaalde de vracht ervoor, en ging erin om met hen mee te gaan naar Tarsis, van het aangezicht van de HEERE.", "Matt 4:23": "En Jezus trok rond door heel Galilea, en Hij onderwees in hun synagogen en predikte het Evangelie van het Koninkrijk, en genas alle ziekte en alle kwaal onder het volk.", "Fil 2:18": "En om datzelfde verblijdt u zich ook, en verblijdt u zich ook met mij.", "Spr 12:28": "In het pad van de gerechtigheid is het leven; en op de weg van haar voetpad is de dood niet.", "Matt 10:1": "Toen Hij Zijn twaalf discipelen bij Zich geroepen had, gaf Hij hun macht over de onreine geesten, om ze uit te werpen, en om alle ziekte en alle kwaal te genezen.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "1 Tess 5:11": "Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.", "Joh 14:16-18": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid; Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn. Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Spr 11:30": "De vrucht van de rechtvaardige is een boom des levens; en wie zielen vangt, is wijs.", "Hand 3:24": "En ook al de profeten, van Samuel af, en die daarna gevolgd zijn, zovelen als er gesproken hebben, hebben ook deze dagen van tevoren verkondigd.", "Hebr 2:4": "terwijl God erbij getuigde door tekenen en wonderen, en allerlei krachten en gaven van de Heilige Geest, naar Zijn wil.", "1 Sam 19:12": "En Michal liet David door een venster naar beneden, en hij ging heen, en vluchtte, en ontkwam.", "1 Joh 3:20": "Want als ons hart ons veroordeelt, God is meer dan ons hart, en Hij kent alle dingen.", "Hand 13:12": "Toen de stadhouder zag wat er gebeurd was, geloofde hij, verbijsterd over de leer van de Heere.", "Ps 86:9": "Al de heidenen, Heere! die Gij gemaakt hebt, zullen komen, en zullen zich voor Uw aangezicht neerbuigen, en Uw Naam eren.", "Spr 11:18": "De goddeloze doet een vals werk; maar hem die gerechtigheid zaait, is een trouw loon toegezegd.", "2 Kor 11:31-33": "De God en Vader van onze Heere Jezus Christus, Die geprezen is tot in eeuwigheid, weet dat ik niet lieg. De stadhouder van koning Aretas bezette in Damaskus de stad van de Damaskenen, met de bedoeling mij te vangen; En ik werd door een venster in een mand over de muur neergelaten, en ontkwam aan zijn handen.", "Hand 22:11": "En toen ik vanwege de heerlijkheid van dat licht niet kon zien, werd ik bij de hand geleid door hen die met mij waren, en kwam ik in Damaskus.", "Dan 2:19": "Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.", "Richt 16:3": "Maar Simson lag tot middernacht toe; toen stond hij op te middernacht, en hij greep de deuren van de stadspoort met de beide posten, en nam ze weg met de grendelboom, en legde ze op zijn schouders, en droeg ze omhoog naar de top van de berg, die tegenover Hebron ligt.", "Hand 20:34": "En u weet zelf, dat deze handen gediend hebben voor mijn behoeften, en voor die van hen die met mij waren.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Openb 1:4": "Johannes aan de zeven gemeenten die in Azië zijn: genade zij u en vrede van Hem, Die is, en Die was, en Die komen zal; en van de zeven geesten die voor Zijn troon zijn;", "Hand 10:8": "En toen hij hun alles verteld had, stuurde hij hen naar Joppe.", "Hand 15:21": "Want Mozes heeft van oude tijden af in elke stad mensen die hem prediken, en hij wordt elke sabbat in de synagogen gelezen.", "Joh 3:33": "Wie Zijn getuigenis aangenomen heeft, die heeft verzegeld dat God waarachtig is.", "Rom 8:4-6": "Opdat het recht van de wet vervuld zou worden in ons, die niet naar het vlees wandelen, maar naar de Geest. Want wie naar het vlees zijn, bedenken de dingen van het vlees; maar wie naar de Geest zijn, bedenken de dingen van de Geest. Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Luk 15:30": "Maar toen deze zoon van u kwam, die uw bezit met hoeren heeft opgemaakt, hebt u voor hem het gemeste kalf geslacht.", "Ps 40:2": "Ik heb de HEERE lang verwacht; en Hij heeft Zich tot mij geneigd, en mijn geroep gehoord.", "Matt 12:35": "De goede mens brengt goede dingen voort uit de goede schat van het hart, en de slechte mens brengt slechte dingen voort uit de slechte schat.", "Ps 46:11": "Laat af, en weet, dat Ik God ben; Ik zal verhoogd worden onder de heidenen, Ik zal verhoogd worden op de aarde.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Zach 2:10": "Juich en verblijd u, dochter van Sion; want zie, Ik kom, en Ik zal in het midden van u wonen, spreekt de HEERE.", "Fil 1:27-29": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie; En dat u zich door niets laat verschrikken door hen die tegenstaan; wat voor hen een bewijs is van verderf, maar voor u van zaligheid, en dat van God. Want u is uit genade gegeven in de zaak van Christus, niet alleen om in Hem te geloven, maar ook om voor Hem te lijden;", "1 Joh 3:6": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend.", "Matt 9:25": "Toen nu de menigte naar buiten gestuurd was, ging Hij naar binnen, en greep haar hand; en het meisje stond op.", "1 Kor 4:9-13": "Want ik denk dat God ons, de laatste apostelen, ten toon heeft gesteld als tot de dood veroordeeld; want wij zijn een schouwspel geworden voor de wereld, en voor de engelen, en voor de mensen. Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht. Tot op dit huidige uur lijden wij honger, en lijden wij dorst, en zijn naakt, en worden met vuisten geslagen, en hebben geen vaste woonplaats;", "Joh 15:9-13": "Zoals de Vader Mij liefgehad heeft, heb Ik ook u liefgehad; blijft in deze Mijn liefde. Als u Mijn geboden bewaart, dan zult u in Mijn liefde blijven; zoals Ik de geboden van Mijn Vader bewaard heb, en blijf in Zijn liefde. Deze dingen heb Ik tot u gesproken, zodat Mijn blijdschap in u blijft, en uw blijdschap vervuld wordt.", "Deut 4:29": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel.", "Zach 8:1-23": "Daarna kwam het woord van de HEERE van de heerscharen tot mij, en Hij zei: Zo zegt de HEERE van de heerscharen: Ik heb geijverd over Sion met een grote ijver; ja, met grote grimmigheid heb Ik over haar geijverd. Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "2 Kor 3:14": "Maar hun gedachten zijn verhard geworden; want tot op deze huidige dag blijft datzelfde deksel bij het lezen van het Oude Testament, zonder weggenomen te worden, dat door Christus teniet gedaan wordt.", "Luk 6:29": "Wie u op de ene wang slaat, biedt hem ook de andere aan; en wie u de mantel afneemt, weerhoud hem niet ook uw hemd te nemen.", "Mark 5:42": "En meteen stond het meisje op, en liep; want zij was twaalf jaar oud; en zij ontzetten zich met grote ontzetting.", "Rom 2:16": "Op de dag waarop God de verborgen dingen van de mensen zal oordelen door Jezus Christus, naar mijn Evangelie.", "Hand 28:30": "En Paulus bleef twee volle jaren in zijn eigen gehuurde woning; en ontving allen die naar hem toe kwamen;", "Joz 2:15": "Zij liet hen dan neer met een touw door het venster; want haar huis was op de stadsmuur, en zij woonde op de muur.", "Mark 14:8": "Zij heeft gedaan wat zij kon; zij is van tevoren gekomen om Mijn lichaam te zalven, als voorbereiding op de begrafenis.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Hand 12:7": "En zie, een engel van de Heere stond daar, en een licht scheen in de cel, en hij sloeg Petrus op de zij, wekte hem en zei: Sta snel op. En zijn kettingen vielen van zijn handen af.", "Matt 20:17": "En Jezus, op weg naar Jeruzalem, nam de twaalf discipelen apart onderweg, en zei tegen hen:", "Spr 2:8": "Opdat zij de paden van het recht bewaren; en Hij zal de weg van Zijn gunstgenoten bewaren.", "Hand 15:30-36": "Zij dan, hun afscheid ontvangen hebbend, kwamen in Antiochië; en nadat zij de menigte hadden samengeroepen, gaven zij de brief af. En toen zij die gelezen hadden, verblijdden zij zich over de bemoediging. Judas nu en Silas, die zelf ook profeten waren, bemoedigden de broeders met veel woorden, en versterkten hen.", "Ezech 37:14": "En Ik zal Mijn Geest in u geven, en u zult leven, en Ik zal u in uw land zetten; en u zult weten dat Ik, de HEERE, dit gesproken en gedaan heb, spreekt de HEERE.", "Hand 13:27": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen;", "Ps 86:11": "Leer mij, HEERE! Uw weg; ik zal in Uw waarheid wandelen; verenig mijn hart tot de vreze van uw Naam.", "Gal 3:27": "Want zovelen als u in Christus gedoopt zijt, hebt u Christus aangedaan.", "Hand 8:12": "Maar toen zij Filippus geloofden, die het Evangelie van het Koninkrijk van God en van de Naam van Jezus Christus verkondigde, werden zij gedoopt, zowel mannen als vrouwen.", "Hos 12:7": "U dan, bekeer u tot uw God, bewaar goedertierenheid en recht, en wacht voortdurend op uw God.", "Gen 1:2": "De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren.", "1 Sam 30:12": "Zij gaven hem ook een stuk van een klomp vijgen, en twee stukken rozijnen; en hij at, en zijn geest kwam weer in hem terug; want hij had drie dagen en drie nachten geen brood gegeten, en geen water gedronken.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Rom 9:1-3": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "1 Petr 3:21": "Waarvan het tegenbeeld, de doop, ons nu ook behoudt — niet als het afleggen van de vuiligheid van het lichaam, maar als de vraag van een goed geweten aan God — door de opstanding van Jezus Christus;", "Ps 1:3": "Want hij zal zijn als een boom, geplant aan waterbeken, die zijn vrucht geeft op zijn tijd, en waarvan het blad niet afvalt; en alles wat hij doet, zal goed gelukken.", "Gen 4:13": "En Kaïn zei tegen de HEERE: Mijn misdaad is groter dan dat die vergeven kan worden.", "1 Kor 9:6": "Of hebben alleen ik en Barnabas geen macht om niet te werken?", "Matt 26:63-66": "Maar Jezus zweeg stil. En de hogepriester antwoordde en zei tegen Hem: Ik bezweer U bij de levende God dat U ons zegt of U de Christus bent, de Zoon van God. Jezus zei tegen hem: U hebt het gezegd. Maar Ik zeg u: van nu af aan zult u de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen op de wolken van de hemel. Toen scheurde de hogepriester zijn kleren en zei: Hij heeft God gelasterd, waarom hebben wij nog getuigen nodig? Zie, nu hebt u Zijn godslastering gehoord.", "Ps 104:2": "Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn.", "Joh 4:48-53": "Jezus zei toen tegen hem: Als u geen tekenen en wonderen ziet, zult u niet geloven. De koninklijke hoveling zei tegen Hem: Heere, kom af voordat mijn kind sterft. Jezus zei tegen hem: Ga heen, uw zoon leeft. En de man geloofde het woord dat Jezus tegen hem gezegd had, en ging heen.", "1 Kron 22:9": "Zie, de zoon die u geboren zal worden, die zal een man van rust zijn, want Ik zal hem rust geven van al zijn vijanden rondom; want zijn naam zal Salomo zijn, en Ik zal vrede en rust over Israël geven in zijn dagen.", "Hand 8:14": "Toen nu de apostelen die in Jeruzalem waren, hoorden dat Samaria het Woord van God had aangenomen, zonden zij Petrus en Johannes naar hen toe,", "Joh 8:28": "Jezus zei dan tegen hen: Wanneer u de Zoon des mensen verhoogd zult hebben, dan zult u weten dat Ik Die ben, en dat Ik niets uit Mijzelf doe; maar Ik spreek deze dingen zoals Mijn Vader Mij geleerd heeft.", "2 Kon 4:28-30": "En zij zei: Heb ik een zoon van mijn heer gevraagd? Zei ik niet: Bedrieg mij niet? En hij zei tegen Gehazi: Gord uw lendenen, en neem mijn staf in uw hand, en ga heen; als u iemand tegenkomt, groet hem niet; en als iemand u groet, antwoord hem niet; en leg mijn staf op het gezicht van de jongen. Doch de moeder van de jongen zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Hij stond dan op, en volgde haar.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Rom 15:1-7": "Maar wij, die sterk zijn, zijn schuldig de zwakheden van de onsterken te dragen, en niet onszelf te behagen. Laat dan ieder van ons zijn naaste behagen ten goede, tot opbouw. Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "1 Tim 1:4": "Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is.", "Luk 24:49": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.", "Ef 5:21": "en wees elkaar onderdanig in de vreze van God.", "Matt 22:42-45": "En zei: Wat denkt u van de Christus? Wiens Zoon is Hij? Zij zeiden tegen Hem: De Zoon van David. Hij zei tegen hen: Hoe noemt David Hem dan, in de Geest, zijn Heere? Hij zei immers: De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb.", "Mark 6:5": "En Hij kon daar geen kracht doen; behalve dat Hij een paar zieken de handen oplegde en hen genas.", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Ef 2:22": "op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.", "Luk 24:25-27": "En Hij zei tegen hen: O onverstandigen en tragen van hart om te geloven al wat de profeten gesproken hebben! Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan? En Hij begon bij Mozes en bij al de profeten, en legde hun uit, in al de Schriften, wat over Hemzelf geschreven was.", "Ex 5:23": "Want vanaf het moment dat ik bij Farao ben gekomen, om in Uw Naam te spreken, heeft hij dit volk kwaad gedaan; en U hebt Uw volk geenszins verlost.", "1 Joh 2:3-6": "En hieraan weten wij, dat wij Hem gekend hebben, als wij Zijn geboden bewaren. Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet; Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Matt 1:1": "Het geslachtsregister van JEZUS CHRISTUS, de Zoon van David, de zoon van Abraham.", "Matt 28:10": "Toen zei Jezus tegen hen: Wees niet bang; ga heen, vertel Mijn broeders dat zij naar Galilea moeten gaan, en daar zullen zij Mij zien.", "Hand 3:6": "En Petrus zei: Zilver en goud heb ik niet, maar wat ik heb, dat geef ik u: in de Naam van Jezus Christus de Nazarener, sta op en loop!", "Hand 17:1": "En nadat zij door Amfipolis en Apollonia hun weg genomen hadden, kwamen zij te Thessalonica, waar een synagoge van de Joden was.", "2 Kron 33:12": "En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,", "2 Kon 13:18": "Daarna zei hij: Neem de pijlen. En hij nam ze. Toen zei hij tegen de koning van Israël: Sla tegen de aarde. En hij sloeg driemaal; daarna stond hij stil.", "Joh 9:11": "Hij antwoordde en zei: De Mens die Jezus genoemd wordt, maakte slijk en streek het op mijn ogen, en zei tegen mij: Ga naar het badwater Siloam en was u. En ik ging heen, en waste mij, en ik werd ziende.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Gal 3:3": "Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Ps 38:2-23": "O HEERE! Straf mij niet in Uw grote toorn, en straf mij niet in Uw grimmigheid. Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald. Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Gal 5:23": "Tegen zulke mensen is de wet niet.", "Hand 19:6": "En toen Paulus hun de handen opgelegd had, kwam de Heilige Geest op hen; en zij spraken met vreemde talen, en profeteerden.", "Hand 13:13": "En Paulus, en zij die met hem waren, van Pafos afgevaren, kwamen te Perge, een stad in Pamfylië. Maar Johannes scheidde zich van hen af en keerde terug naar Jeruzalem.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Hand 13:2": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Hand 3:13": "De God van Abraham, en van Izak, en van Jakob, de God van onze vaderen, heeft Zijn Kind Jezus verheerlijkt, Die u hebt overgeleverd en verloochend voor het aangezicht van Pilatus, toen die oordeelde dat men Hem zou loslaten.", "Luk 9:48": "en zei tegen hen: Wie dit kind ontvangt in Mijn Naam, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem Die Mij gezonden heeft. Want wie de minste is onder u allen, die zal groot zijn.", "Hand 4:26": "De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.", "Hand 2:33": "Hij dan, door de rechterhand van God verhoogd, en de belofte van de Heilige Geest ontvangen hebbend van de Vader, heeft dit uitgestort, wat u nu ziet en hoort.", "Gal 2:16": "maar omdat wij weten dat de mens niet gerechtvaardigd wordt uit de werken van de wet, maar door het geloof van Jezus Christus, hebben ook wij in Christus Jezus geloofd, opdat wij gerechtvaardigd zouden worden uit het geloof van Christus, en niet uit de werken van de wet; omdat uit de werken van de wet geen vlees zal worden gerechtvaardigd.", "1 Kor 12:3": "Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest.", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "Joh 6:68": "Simon Petrus antwoordde Hem: Heere, naar wie zouden wij heengaan? U hebt de woorden van het eeuwige leven.", "Joh 4:42": "en zij zeiden tegen de vrouw: Wij geloven niet meer om wat u zei; want wij hebben Hem zelf gehoord, en weten dat Deze werkelijk de Christus is, de Zaligmaker van de wereld.", "Fil 4:11-13": "Niet dat ik dit zeg vanwege gebrek; want ik heb geleerd tevreden te zijn in de omstandigheden waarin ik ben. En ik weet vernederd te worden, ik weet ook overvloed te hebben; in alle opzichten en in alles ben ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden. Ik kan alle dingen door Christus, Die mij kracht geeft.", "Jes 60:3-5": "En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan. Hef uw ogen rondom op, en zie: die allen zijn samengebracht, zij komen tot u; uw zonen zullen van verre komen, en uw dochters zullen aan uw zijde grootgebracht worden. Dan zult u het zien en stralen, en uw hart zal vervaard zijn en verwijd worden; want de menigte van de zee zal tot u gekeerd worden, het leger van de heidenen zal tot u komen.", "Mark 5:25": "En een zekere vrouw, die twaalf jaar lang aan bloedvloeiingen geleden had,", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Mark 14:15": "En hij zal u een grote bovenzaal wijzen, ingericht en gereed; bereid het daar voor ons.", "Matt 18:10-13": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is. Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken?", "2 Kor 9:10": "Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "Joh 11:44": "En de gestorvene kwam naar buiten, gebonden aan handen en voeten met grafdoeken, en zijn gezicht was omwonden met een zweetdoek. Jezus zei tegen hen: Maak hem los, en laat hem gaan.", "2 Kor 11:32": "De stadhouder van koning Aretas bezette in Damaskus de stad van de Damaskenen, met de bedoeling mij te vangen;", "Hand 26:20": "Maar heb eerst aan hen die te Damaskus waren, en te Jeruzalem, en in het gehele land Judea, en aan de heidenen verkondigd dat zij zich zouden bekeren en zich tot God bekeren, en werken zouden doen die de bekering waardig zijn.", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "Ex 14:25": "En Hij stootte de raderen van hun wagens weg, en deed ze zwaar voortgaan. Toen zeiden de Egyptenaren: Laten wij vluchten van voor Israël, want de HEERE strijdt voor hen tegen de Egyptenaren.", "Hand 13:8-12": "Maar Elymas, de tovenaar (want zo wordt zijn naam vertaald), weerstond hen, en probeerde de stadhouder van het geloof af te keren. Doch Saulus (die ook Paulus genoemd wordt), vervuld met de Heilige Geest, en de ogen op hem gericht houdend, zei: O kind van de duivel, vol van alle bedrog en van alle arglistigheid, vijand van alle gerechtigheid, zult u niet ophouden de rechte wegen van de Heere te verdraaien?", "Joh 10:11": "Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "Hand 26:28": "En Agrippa zei tegen Paulus: U overtuigt mij bijna een christen te worden.", "2 Kor 10:8": "Want al zou ik nog wat overvloediger roemen over onze macht, die de Heere ons gegeven heeft tot opbouw, en niet tot uw neerwerping, dan zal ik daarover niet beschaamd worden;", "Job 33:18-28": "Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga. Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen; Zodat zijn leven het brood zelf verfoeit, en zijn ziel het begeerlijke voedsel;", "Ef 5:25": "Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "Richt 7:1": "Toen stond Jerubbaäl (dat is Gideon) vroeg op, en al het volk dat met hem was; en zij legerden zich bij de bron van Harod; het leger van de Midianieten lag ten noorden van hen, achter de heuvel More, in het dal.", "Hand 20:35": "Ik heb u in alles getoond, dat men, zo arbeidend, de zwakken moet opnemen, en zich de woorden van de Heere Jezus herinneren, dat Hij gezegd heeft: Het is zaliger te geven dan te ontvangen.", "Matt 19:13-15": "Toen werden kinderen tot Hem gebracht, opdat Hij de handen op hen zou leggen en bidden; en de discipelen bestraften
