ord dat ook de heidenen het Woord van God aangenomen hadden.", "2": "En toen Petrus naar Jeruzalem opgegaan was, twistten degenen die uit de besnijdenis waren tegen hem,", "3": "en zeiden: U bent bij mannen die de voorhuid hebben binnengegaan, en hebt met hen gegeten.", "4": "Maar Petrus begon en verhaalde het hun stap voor stap, en zei:", "5": "Ik was in de stad Joppe, aan het bidden, en zag in een geestverrukking een visioen: namelijk een zeker voorwerp, als een groot linnen laken, dat neerdaalde en aan de vier hoeken werd neergelaten uit de hemel, en het kwam tot bij mij.", "6": "Toen ik de ogen daarop gericht hield, merkte ik op en zag de viervoetige dieren van de aarde, en de wilde dieren, en de kruipende dieren, en de vogels van de hemel.", "7": "En ik hoorde een stem die tegen mij zei: Sta op, Petrus, slacht en eet.", "8": "Maar ik zei: Geenszins, Heere, want nooit is iets dat gewoon of onrein was in mijn mond binnengegaan.", "9": "Maar de stem antwoordde mij voor de tweede keer uit de hemel: Wat God gereinigd heeft, mag u niet gewoon noemen.", "10": "En dit gebeurde tot driemaal toe; en alles werd weer opgetrokken naar de hemel.", "11": "En zie, op datzelfde moment stonden er drie mannen voor het huis waar ik in was, die van Cesarea naar mij toe gestuurd waren.", "12": "En de Geest zei tegen mij dat ik met hen mee moest gaan, zonder te twijfelen. En met mij gingen ook deze zes broeders mee, en wij zijn het huis van de man binnengegaan.", "13": "En hij heeft ons verteld hoe hij een engel gezien had, die in zijn huis stond en tegen hem zei: Stuur mannen naar Joppe, en laat Simon halen, die bijgenaamd is Petrus,", "14": "die woorden tot u zal spreken, waardoor u zalig zult worden, en heel uw huis.", "15": "En toen ik begon te spreken, viel de Heilige Geest op hen, net zoals ook op ons in het begin.", "16": "En ik herinnerde mij het woord van de Heere, hoe Hij zei: Johannes doopte wel met water, maar u zult gedoopt worden met de Heilige Geest.", "17": "Als God hun dan dezelfde gave gegeven heeft als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik dan, dat ik God zou kunnen tegenhouden?", "18": "En toen zij dit hoorden, waren zij tevreden, en verheerlijkten God, en zeiden: Zo heeft God dan ook aan de heidenen de bekering gegeven tot leven!", "19": "Degenen nu die verstrooid waren door de verdrukking die over Stefanus gebeurd was, trokken het land door tot Fenicië toe, en Cyprus, en Antiochië, en spraken tot niemand het Woord dan alleen tot de Joden.", "20": "En er waren enige mannen uit Cyprus en Cyrene onder hen, die naar Antiochië gekomen waren en tot de Grieken spraken, terwijl zij de Heere Jezus verkondigden.", "21": "En de hand van de Heere was met hen; en een groot aantal geloofde en bekeerde zich tot de Heere.", "22": "En het gerucht over hen kwam de gemeente in Jeruzalem ter ore; en zij zonden Barnabas uit om het land door te gaan tot Antiochië toe.", "23": "Toen hij daar aangekomen was en de genade van God zag, werd hij blij, en vermaande hen allen dat zij met een vast voornemen van het hart bij de Heere zouden blijven.", "24": "Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.", "25": "En Barnabas ging naar Tarsen om Saulus te zoeken;", "26": "en toen hij hem gevonden had, bracht hij hem naar Antiochië. En het gebeurde dat zij een heel jaar samenkwamen in de gemeente en een grote menigte onderwezen; en dat de discipelen voor het eerst in Antiochië Christenen genoemd werden.", "27": "En in diezelfde dagen kwamen er enige profeten van Jeruzalem naar Antiochië.", "28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "29": "En naarmate ieder van de discipelen in staat was, besloot elk van hen iets te sturen ten dienste van de broeders die in Judea woonden.", "30": "En dat deden zij ook, en zonden het naar de oudsten, door de hand van Barnabas en Saulus."}, "SV": {"1": "De apostelen nu, en de broeders, die in Judea waren, hebben gehoord, dat ook de heidenen het Woord Gods aangenomen hadden.", "2": "En toen Petrus opgegaan was naar Jeruzalem, twistten tegen hem degenen, die uit de besnijdenis waren,", "3": "Zeggende: Gij zijt ingegaan tot mannen, die de voorhuid hebben, en hebt met hen gegeten.", "4": "Maar Petrus, beginnende, verhaalde het hun vervolgens, zeggende:", "5": "Ik was in de stad Joppe, biddende en zag in een vertrekking van zinnen een gezicht, *namelijk* een zeker vat, gelijk een groot linnen laken, nederdalende, bij de vier hoeken nedergelaten uit den hemel, en het kwam tot bij mij;", "6": "Op welk *laken* als ik de ogen hield, zo merkte ik, en zag de viervoetige *dieren* der aarde, en de wilde, en de kruipende *dieren*, en de vogelen des hemels.", "7": "En ik hoorde een stem, die tot mij zeide: Sta op, Petrus, slacht en eet.", "8": "Maar ik zeide: Geenszins, Heere, want nooit is iets, dat gemeen of onrein was, in mijn mond ingegaan.", "9": "Doch de stem antwoordde mij ten tweeden male uit den hemel: Hetgeen God gereinigd heeft, zult gij niet gemeen maken.", "10": "En dit geschiedde tot driemaal; en alles werd wederom opgetrokken in den hemel.", "11": "En ziet, ter zelfder *ure* stonden er drie mannen voor het huis, daar ik in was, die van Cesarea tot mij afgezonden waren.", "12": "En de Geest zeide tot mij, dat ik met hen gaan zou, niet twijfelende. En met mij gingen ook deze zes broeders, en wij zijn in des man huis ingegaan.", "13": "En hij heeft ons verhaald, hoe hij een engel gezien had, die in zijn huis stond, en tot hem zeide: Zend mannen naar Joppe, en ontbied Simon, die toegenaamd is Petrus;", "14": "Die woorden tot u zal spreken, door welke gij zult zalig worden, en al uw huis.", "15": "En als ik begon te spreken, viel de Heilige Geest op hen, gelijk ook op ons in het begin.", "16": "En ik werd gedachtig aan het woord des Heeren, hoe Hij zeide: Johannes doopte wel met water, maar gijlieden zult gedoopt worden met den Heiligen Geest.", "17": "Indien dan God hun evengelijke gave gegeven heeft, als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik toch, die God konde weren?", "18": "En als zij dit hoorden, waren zij tevreden, en verheerlijkten God, zeggende: Zo heeft dan God ook den heidenen de bekering gegeven ten leven!", "19": "Degenen nu, die verstrooid waren door de verdrukking, die over Stefanus geschied was, gingen *het* *land* door tot Fenicië toe, en Cyprus, en Antiochië, tot niemand het Woord sprekende, dan alleen tot de Joden.", "20": "En er waren enige Cyprische en Cyreneïsche mannen uit hen, welken te Antiochië gekomen zijnde, spraken tot de Grieksen, verkondigende den Heere Jezus.", "21": "En de hand des Heeren was met hen; en een groot getal geloofde, en bekeerde zich tot den Heere.", "22": "En het gerucht van hen kwam tot de oren der Gemeente, die te Jeruzalem was; en zij zonden Barnabas uit, dat hij *het* *land* doorging tot Antiochië toe.", "23": "Dewelke, daar gekomen zijnde, en de genade Gods ziende, werd verblijd, en vermaande hen allen, dat zij met een voornemen des harten bij den Heere zouden blijven.", "24": "Want hij was een goed man, en vol des Heiligen Geestes en des geloofs; en er werd een grote schare den Heere toegevoegd.", "25": "En Barnabas ging uit naar Tarsen, om Saulus te zoeken; en als hij hem gevonden had, bracht hij hem te Antiochië.", "26": "En het is geschied, dat zij een geheel jaar *samen* vergaderden in de Gemeente, en een grote schare leerden; en dat de discipelen eerst te Antiochië Christenen genaamd werden.", "27": "En in dezelfde dagen kwamen *enige* profeten af van Jeruzalem te Antiochië.", "28": "En een uit hen, met name Agabus, stond op, en gaf te kennen door den Geest, dat er een grote hongersnood zou wezen over de gehele wereld; dewelke ook gekomen is onder den keizer Claudius.", "29": "En naardat een iegelijk der discipelen vermocht, besloot elk van hen *iets* te zenden ten dienste der broederen, die in Judea woonden.", "30": "Hetwelk zij ook deden, en zonden het tot de ouderlingen, door de hand van Barnabas en Saulus."}, "KJV": {"1": "And the apostles and brethren that were in Judaea heard that the Gentiles had also received the word of God.", "2": "And when Peter was come up to Jerusalem, they that were of the circumcision contended with him,", "3": "Saying, Thou wentest in to men uncircumcised, and didst eat with them.", "4": "But Peter rehearsed *the matter* from the beginning, and expounded *it* by order unto them, saying,", "5": "I was in the city of Joppa praying: and in a trance I saw a vision, A certain vessel descend, as it had been a great sheet, let down from heaven by four corners; and it came even to me:", "6": "Upon the which when I had fastened mine eyes, I considered, and saw fourfooted beasts of the earth, and wild beasts, and creeping things, and fowls of the air.", "7": "And I heard a voice saying unto me, Arise, Peter; slay and eat.", "8": "But I said, Not so, Lord: for nothing common or unclean hath at any time entered into my mouth.", "9": "But the voice answered me again from heaven, What God hath cleansed, *that* call not thou common.", "10": "And this was done three times: and all were drawn up again into heaven.", "11": "And, behold, immediately there were three men already come unto the house where I was, sent from Caesarea unto me.", "12": "And the Spirit bade me go with them, nothing doubting. Moreover these six brethren accompanied me, and we entered into the man's house:", "13": "And he shewed us how he had seen an angel in his house, which stood and said unto him, Send men to Joppa, and call for Simon, whose surname is Peter;", "14": "Who shall tell thee words, whereby thou and all thy house shall be saved.", "15": "And as I began to speak, the Holy Ghost fell on them, as on us at the beginning.", "16": "Then remembered I the word of the Lord, how that he said, John indeed baptized with water; but ye shall be baptized with the Holy Ghost.", "17": "Forasmuch then as God gave them the like gift as *he did* unto us, who believed on the Lord Jesus Christ; what was I, that I could withstand God?", "18": "When they heard these things, they held their peace, and glorified God, saying, Then hath God also to the Gentiles granted repentance unto life.", "19": "Now they which were scattered abroad upon the persecution that arose about Stephen travelled as far as Phenice, and Cyprus, and Antioch, preaching the word to none but unto the Jews only.", "20": "And some of them were men of Cyprus and Cyrene, which, when they were come to Antioch, spake unto the Grecians, preaching the Lord Jesus.", "21": "And the hand of the Lord was with them: and a great number believed, and turned unto the Lord.", "22": "Then tidings of these things came unto the ears of the church which was in Jerusalem: and they sent forth Barnabas, that he should go as far as Antioch.", "23": "Who, when he came, and had seen the grace of God, was glad, and exhorted them all, that with purpose of heart they would cleave unto the Lord.", "24": "For he was a good man, and full of the Holy Ghost and of faith: and much people was added unto the Lord.", "25": "Then departed Barnabas to Tarsus, for to seek Saul:", "26": "And when he had found him, he brought him unto Antioch. And it came to pass, that a whole year they assembled themselves with the church, and taught much people. And the disciples were called Christians first in Antioch.", "27": "And in these days came prophets from Jerusalem unto Antioch.", "28": "And there stood up one of them named Agabus, and signified by the Spirit that there should be great dearth throughout all the world: which came to pass in the days of Claudius Caesar.", "29": "Then the disciples, every man according to his ability, determined to send relief unto the brethren which dwelt in Judaea:", "30": "Which also they did, and sent it to the elders by the hands of Barnabas and Saul."}}, "tsk": {"1": [{"kopje": "De apostelen", "refs": ["Hand 8:14", "Hand 8:15", "Gal 1:17-22"]}, {"kopje": "de heidenen", "refs": ["Hand 10:34-38", "Hand 14:27", "Hand 15:3", "Gen 49:10", "Ps 22:28", "Ps 96:1-10", "Jes 11:10", "Jes 32:15", "Jes 35:1", "Jes 35:2", "Jes 42:1", "Jes 42:6", "Jes 49:6", "Jes 52:10", "Jes 60:3", "Jes 62:2", "Jer 16:19", "Hos 2:22", "Amos 9:11", "Amos 9:12", "Micha 5:6", "Zef 2:11", "Zef 3:9", "Zach 2:11", "Zach 8:20-23", "Mal 1:11", "Matt 8:11", "Mark 16:5", "Luk 2:32", "Rom 15:7-12"]}], "2": [{"kopje": "twistten degenen", "refs": ["Hand 10:9", "Hand 10:45", "Hand 15:1", "Hand 15:5", "Hand 21:20-23", "Gal 2:12-14"]}], "5": [{"kopje": "was", "refs": ["Hand 10:9-18"]}, {"kopje": "een zeker", "refs": ["Hand 22:17", "2 Kor 12:1-3"]}, {"kopje": "en het", "refs": ["Jer 1:11-14", "Ezech 2:9", "Amos 7:4-7", "Amos 8:2"]}], "6": [{"kopje": "gericht", "refs": ["Hand 3:4", "Luk 4:20"]}], "8": [{"kopje": "gewoon", "refs": ["Mark 7:2", "Rom 14:14"]}, {"kopje": "onrein", "refs": ["Lev 10:10", "Lev 11:47", "Ezra 9:11", "Ezra 9:12", "Hos 9:3", "Rom 14:14", "1 Kor 7:14"]}], "9": [{"kopje": "Wat", "refs": ["Hand 10:28", "Hand 10:34", "Hand 10:35", "Hand 15:9", "1 Tim 4:5", "Hebr 9:13", "Hebr 9:14"]}], "10": [{"kopje": "driemaal", "refs": ["Num 24:10", "Joh 13:38", "Joh 21:17", "2 Kor 12:8"]}], "12": [{"kopje": "de Geest", "refs": ["Hand 8:29", "Hand 10:19", "Hand 10:20", "Hand 13:2", "Hand 13:4", "Hand 15:7", "Hand 16:6", "Hand 16:7", "Joh 16:13", "2 Tess 2:2", "Openb 22:17"]}, {"kopje": "zonder te twijfelen", "refs": ["Matt 1:20"]}, {"kopje": "deze", "refs": ["Hand 10:23", "Hand 10:45"]}], "13": [{"kopje": "verteld", "refs": ["Hand 10:3-6", "Hand 10:22", "Hand 10:30-32", "Hand 12:11", "Hebr 1:14"]}, {"kopje": "naar Joppe", "refs": ["Hand 9:43"]}], "14": [{"kopje": "woorden", "refs": ["Hand 10:6", "Hand 10:22", "Hand 10:32", "Hand 10:33", "Hand 10:43", "Hand 16:31", "Ps 19:8-12", "Mark 16:16", "Joh 6:63", "Joh s 119:126": "Het is tijd voor de HEERE, dat Hij werkt, want zij hebben Uw wet verbroken.", "Spr 4:25-27": "Laat uw ogen recht vooruit zien, en uw oogleden zich recht voor u heen richten. Weeg de gang van uw voet, en laat al uw wegen vast staan. Wijk niet naar rechts of naar links, wend uw voet af van het kwade.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Joh 10:5": "Maar een vreemde zullen zij nooit volgen, maar zij zullen van hem wegvluchten; omdat zij de stem van de vreemden niet kennen.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "2 Kor 8:17-21": "Dat hij de vermaning heeft aangenomen, en zeer naarstig zijnde, gewillig naar u toe gereisd is. En wij hebben ook met hem gezonden de broeder, die lof heeft in het Evangelie door alle gemeenten; En dat niet alleen, maar hij is ook door de gemeenten gekozen, om met ons te reizen met deze gave, die door ons bediend wordt tot de heerlijkheid van de Heere Zelf, en de bereidheid van uw gemoed;", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "2 Kor 6:6": "in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "Luk 7:47": "Daarom zeg Ik u: haar zonden, die vele waren, zijn haar vergeven; want zij heeft veel liefgehad; maar aan wie weinig vergeven wordt, die heeft weinig lief.", "Fil 3:3": "Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.", "Joh 20:31": "maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam.", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Matt 9:28": "En toen Hij het huis binnengegaan was, kwamen de blinden bij Hem. En Jezus zei tegen hen: Gelooft u dat Ik dit kan doen? Zij zeiden tegen Hem: Ja, Heere!", "Openb 17:14": "Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Jer 21:8": "En tegen dit volk zult u zeggen: Zo zegt de HEERE: Zie, Ik stel voor uw gezicht de weg van het leven en de weg van de dood.", "Hand 2:41": "Zij dan die zijn woord graag aannamen, werden gedoopt; en er werden op die dag ongeveer drieduizend zielen aan hen toegevoegd.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Hand 16:17": "Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen.", "Spr 25:21": "Als hij die u haat, honger heeft, geef hem brood te eten; en als hij dorstig is, geef hem water te drinken;", "Rom 15:15": "Maar ik heb u ten dele des te vrijmoediger geschreven, broeders, u als het ware opnieuw dit in herinnering brengend, om de genade die mij van God gegeven is;", "Joh 10:27": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij.", "Hand 15:7-9": "En toen daarover een grote twist ontstond, stond Petrus op en zei tegen hen: Mannen broeders, u weet dat God van lang geleden onder ons mij uitgekozen heeft, dat de heidenen door mijn mond het woord van het Evangelie zouden horen, en geloven. En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons; en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "Matt 18:3": "en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan.", "Hand 14:14": "Maar toen de apostelen Barnabas en Paulus dit hoorden, scheurden zij hun kleren, en sprongen onder de menigte, en riepen:", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Rom 6:3-23": "Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn? Wij zijn dan met Hem begraven door de doop in de dood, opdat, zoals Christus uit de doden opgewekt is tot de heerlijkheid van de Vader, zo ook wij in nieuwheid van leven zouden wandelen. Want als wij met Hem één geworden zijn in de gelijkmaking van Zijn dood, dan zullen wij het ook zijn in de gelijkmaking van Zijn opstanding;", "Fil 3:7-11": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Joz 22:5": "Neem alleen nauwgezet in acht om te doen het gebod en de wet, die Mozes, de dienaar van de HEERE, u geboden heeft: dat u de HEERE, uw God, liefhebt, en dat u wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat u Hem dient met uw hele hart en met uw hele ziel.", "1 Tim 5:22": "Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.", "1 Joh 1:3": "Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Rom 15:13": "De God nu van de hoop vervult u met alle blijdschap en vrede in het geloven, opdat u overvloedig mag zijn in de hoop, door de kracht van de Heilige Geest.", "Hand 10:35": "maar in ieder volk is hij die Hem vreest en gerechtigheid doet, Hem aangenaam.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Hos 9:3": "Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Jak 2:16": "en iemand van u zou tegen hen zeggen: Ga heen in vrede, word warm en word verzadigd; maar u zou hun niet geven wat nodig is voor het lichaam, wat voor nut is dat?", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "1 Joh 4:2": "Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God;", "Matt 5:42": "Geef aan hem die iets van u vraagt, en keer u niet af van hem die van u wil lenen.", "Hand 15:39": "Er ontstond dan een verbittering, zodat zij van elkaar gescheiden zijn; en Barnabas nam Markus mee, en scheepte af naar Cyprus;", "Ps 119:158": "Ik heb gezien degenen, die trouweloos handelen, en het verdroot mij, dat zij Uw woord niet onderhielden.", "Ezech 18:5-9": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert; En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "Jes 62:12": "En zij zullen hen noemen het heilige volk, de verlosten van de HEERE; en u zult genoemd worden de gezochte, de stad, die niet verlaten is.", "Ef 3:15": "uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt,", "Hand 10:34": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon;", "1 Kon 8:41-43": "Zelfs ook aangaande de vreemdeling, die niet van Uw volk Israël zal zijn, maar uit ver land komt om Uw Naam wil; (want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis; hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Luk 4:20": "En toen Hij het boek dichtgedaan en aan de dienaar teruggegeven had, ging Hij zitten; en de ogen van allen in de synagoge waren op Hem gericht.", "1 Joh 1:4": "En deze dingen schrijven wij u, opdat uw blijdschap vervuld is.", "Matt 3:13-16": "Toen kwam Jezus van Galilea naar de Jordaan, naar Johannes, om door hem gedoopt te worden. Maar Johannes weigerde Hem sterk, en zei: Ik heb het nodig door U gedoopt te worden, en komt U tot mij? Maar Jezus antwoordde en zei tegen hem: Laat het nu toe; want zo past het ons alle gerechtigheid te vervullen. Toen liet hij het toe.", "Jes 60:3": "En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Hand 6:7": "En het Woord van God nam toe, en het aantal discipelen in Jeruzalem vermeerderde sterk; en een grote menigte van de priesters werd gehoorzaam aan het geloof.", "Spr 28:4": "Wie de wet verlaten, prijzen de goddelozen; maar wie de wet bewaren, gaan de strijd met hen aan.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Jak 5:19": "Broeders, als iemand onder u van de waarheid is afgedwaald, en iemand hem bekeert,", "Amos 5:4": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef.", "Hand 1:5": "Want Johannes doopte wel met water, maar u zult met de Heilige Geest gedoopt worden, niet lang na deze dagen.", "2 Kor 8:12-14": "Want als de bereidheid van het gemoed er eerst is, dan is iemand aangenaam naar wat hij heeft, niet naar wat hij niet heeft. Want dit zeg ik niet, opdat anderen verlichting zouden hebben, en u verdrukking; Maar opdat uit gelijkheid, in deze tegenwoordige tijd, uw overvloed er zij om hun gebrek te vervullen; opdat ook hun overvloed er is om uw gebrek te vervullen, opdat er gelijkheid wordt.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Rom 5:3-5": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt; En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop; En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.", "Gen 41:31": "Ook zal de overvloed in het land niet gemerkt worden, vanwege die honger die daarna zal komen; want hij zal zeer zwaar zijn.", "Spr 9:1-6": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "Hand 10:32": "Zend dan naar Joppe, en ontbied Simon, die ook Petrus genoemd wordt; deze is te gast in het huis van Simon, de leerlooier, aan de zee, die, als hij hier gekomen is, tot u zal spreken.", "Fil 1:1": "Paulus en Timotheüs, dienstknechten van Jezus Christus, aan alle heiligen in Christus Jezus die te Filippi zijn, met de opzieners en diakenen:", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Hand 10:9": "En de volgende dag, terwijl zij onderweg waren en de stad naderden, klom Petrus op het dak om te bidden, omtrent het zesde uur.", "Hand 6:10": "En zij konden niet opgewassen zijn tegen de wijsheid en de Geest, door Wie hij sprak.", "Hand 1:16": "Mannen broeders, deze Schrift moest vervuld worden, die de Heilige Geest bij monde van David voorzegd heeft over Judas, die de leidsman is geweest van hen die Jezus gevangennamen;", "Joh 20:22": "En toen Hij dit gezegd had, blies Hij over hen, en zei tegen hen: Ontvang de Heilige Geest.", "1 Joh 3:17-24": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem? Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid. En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.", "Joh 16:4": "Maar deze dingen heb Ik tot u gesproken, opdat u, wanneer de tijd gekomen zal zijn, zich zult herinneren dat Ik ze u gezegd heb; doch deze dingen heb Ik u vanaf het begin niet gezegd, omdat Ik bij u was.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "Ps 98:1-3": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven. De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen. Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Jer 31:12-14": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn. Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis. En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "Luk 5:31": "En Jezus antwoordde en zei tegen hen: Wie gezond zijn, hebben geen dokter nodig, maar wie ziek zijn.", "1 Tess 5:21": "Beproef alle dingen; behoud het goede.", "Rom 9:30": "Wat zullen wij dan zeggen? Dat de heidenen, die de rechtvaardigheid niet zochten, de rechtvaardigheid verkregen hebben, en wel de rechtvaardigheid die uit het geloof is.", "2 Tim 2:3": "Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "Matt 21:25": "De doop van Johannes, waar kwam die vandaan, uit de hemel of van de mensen? En zij overlegden bij zichzelf en zeiden: Als wij zeggen: Uit de hemel, dan zal Hij ons zeggen: Waarom hebt u hem dan niet geloofd?", "Hand 15:6": "En de apostelen en de oudsten kwamen samen om op deze zaak te letten.", "1 Petr 1:22": "Nu u uw zielen gereinigd hebt door de gehoorzaamheid aan de waarheid, door de Geest, tot ongeveinsde broederlijke liefde, heb dan elkaar vurig lief uit een rein hart;", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "1 Petr 4:9-11": "Wees gastvrij voor elkaar, zonder gemopper. Ieder bedient, naar de gave die hij ontvangen heeft, daarmee de anderen, als goede uitdelers van de veelsoortige genade van God. Als iemand spreekt, laat hij spreken als de woorden van God; als iemand dient, laat hij dienen als uit kracht die God verleent; opdat God in alles geprezen wordt door Jezus Christus, aan Wie de heerlijkheid en de kracht toekomt, tot in alle eeuwigheid. Amen.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Ef 2:18": "Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.", "Rom 3:29": "Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen;", "Jes 61:9": "En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft.", "2 Petr 3:17": "U dan, geliefden, omdat u dit van tevoren weet, wees op uw hoede, dat u niet mede weggesleept wordt door de dwaling van de verdorven mensen, en afvalt van uw eigen standvastigheid;", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Rom 2:26": "Als dan de voorhuid de rechten van de wet bewaart, zal zijn voorhuid dan niet tot een besnijdenis gerekend worden?", "1 Joh 3:9": "Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren.", "Lev 10:20": "Toen Mozes dit hoorde, was dat goed in zijn ogen.", "Gen 41:30": "Maar daarna zullen er zeven jaren van honger opstaan; dan zal in het land van Egypte al die overvloed vergeten worden; en de honger zal het land verteren.", "Luk 11:13": "Als u dan, die slecht bent, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader de Heilige Geest geven aan hen die Hem daarom bidden?", "Hand 10:43": "Van Deze geven alle profeten getuigenis, dat ieder die in Hem gelooft, vergeving van zonden zal ontvangen door Zijn Naam.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "2 Kor 8:1-4": "Verder maken wij u bekend, broeders, de genade van God, die in de gemeenten van Macedonië gegeven is. Dat in veel beproeving van de verdrukking de overvloed van hun blijdschap, en hun zeer diepe armoede overvloedig geweest is tot de rijkdom van hun goeddadigheid. Want zij zijn naar vermogen (ik betuig het), ja, boven vermogen gewillig geweest;", "Hand 8:15-19": "die, toen zij aangekomen waren, voor hen baden, opdat zij de Heilige Geest zouden ontvangen. (Want Hij was nog op niemand van hen gevallen, maar zij waren alleen gedoopt in de Naam van de Heere Jezus.) Toen legden zij hun de handen op, en zij ontvingen de Heilige Geest.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Hebr 6:11": "Maar wij verlangen ernaar dat ieder van u dezelfde ijver bewijst, tot de volle zekerheid van de hoop, tot het einde toe;", "Hand 8:4": "Zij dan nu, die verstrooid waren, trokken het land door en verkondigden het Woord.", "Openb 21:7": "Wie overwint, zal alles beërven; en Ik zal hem een God zijn, en hij zal Mij een zoon zijn.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Hand 3:4": "En Petrus, die met Johannes zijn ogen strak op hem richtte, zei: Kijk naar ons.", "Hand 11:1-18": "De apostelen nu, en de broeders die in Judea waren, hebben gehoord dat ook de heidenen het Woord van God aangenomen hadden. En toen Petrus naar Jeruzalem opgegaan was, twistten degenen die uit de besnijdenis waren tegen hem, en zeiden: U bent bij mannen die de voorhuid hebben binnengegaan, en hebt met hen gegeten.", "Gal 3:1-28": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd. Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof? Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Joh 3:5": "Jezus antwoordde: Voorwaar, voorwaar, Ik zeg u: Als iemand niet geboren wordt uit water en Geest, kan hij het Koninkrijk van God niet binnengaan.", "Hebr 11:2": "Want door dit geloof hebben de mensen van vroeger een goed getuigenis gekregen.", "2 Kon 8:2": "En de vrouw had zich klaargemaakt en had gedaan naar het woord van de man Gods; zij was met haar huisgezin weggegaan, en had als vreemdeling gewoond in het land van de Filistijnen, zeven jaar lang.", "Fil 2:26": "Omdat hij zeer begerig was naar u allen, en zeer beangst was, omdat u had gehoord dat hij ziek was geweest.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Hand 14:21": "En toen zij in die stad het Evangelie verkondigd hadden en veel discipelen gemaakt hadden, keerden zij terug naar Lystre, en Ikonium, en Antiochië,", "Jes 65:15": "En u zult uw naam voor Mijn uitverkorenen tot een vervloeking laten; en de Heere HEERE zal u doden, maar Zijn knechten zal Hij met een andere naam noemen;", "Rom 8:9": "Maar u bent niet in het vlees, maar in de Geest, als tenminste de Geest van God in u woont. Maar als iemand de Geest van Christus niet heeft, die komt Hem niet toe.", "Ps 119:53": "Grote beroering heeft mij bevangen vanwege de goddelozen, die Uw wet verlaten.", "Num 11:29": "Maar Mozes zei tegen hem: Bent u ijverzuchtig voor mij? Och, was al het volk van de HEERE maar profeten, zodat de HEERE Zijn Geest over hen zou geven!", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Hand 2:17": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen.", "Luk 6:45": "De goede mens brengt het goede voort uit de goede schat van zijn hart; en de slechte mens brengt het kwade voort uit de kwade schat van zijn hart; want uit de overvloed van het hart spreekt zijn mond.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Hand 16:5": "De gemeenten dan werden bevestigd in het geloof, en werden dagelijks talrijker in aantal.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Zach 4:1-7": "En de Engel Die met mij sprak, kwam opnieuw, en Hij wekte mij op, zoals een man die uit zijn slaap opgewekt wordt. En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie, en zie, een geheel gouden kandelaar, en een oliekruikje boven op zijn hoofd, en zijn zeven lampen daarop; die lampen hadden zeven en zeven pijpen, die boven op zijn hoofd waren; En twee olijfbomen ernaast, een aan de rechterzijde van het oliekruikje, en een aan zijn linkerzijde.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "2 Tim 1:13": "Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "Gal 6:15": "Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar een nieuw schepsel.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Joh 10:41": "En velen kwamen naar Hem toe, en zeiden: Johannes deed wel geen teken; maar alles wat Johannes over Deze gezegd heeft, was waar.", "2 Tim 3:10": "Maar u bent mijn leer nauwgezet gevolgd, mijn wijze van doen, voornemen, geloof, geduld, liefde, volharding,", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Zach 3:2": "Doch de HEERE zei tegen de satan: De HEERE bestraft u, satan! Ja, de HEERE bestraft u, Die Jeruzalem verkiest; is deze niet een vuurbrand uit het vuur gered?", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Matt 19:21": "Jezus zei tegen hem: Als u volmaakt wilt zijn, ga heen, verkoop wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom hier, volg Mij.", "Jes 12:3": "En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "1 Joh 4:4-21": "Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is. Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen. Wij zijn uit God. Die God kent, hoort ons; die niet uit God is, hoort ons niet. Hieraan herkennen wij de geest van de waarheid en de geest van de dwaling.", "1 Joh 2:29": "Als u weet, dat Hij rechtvaardig is, dan weet u, dat ieder, die de rechtvaardigheid doet, uit Hem geboren is.", "Rom 15:26": "Want het heeft hen van Macedonië en Achaje goedgedacht een gezamenlijke bijdrage te doen aan de armen onder de heiligen die in Jeruzalem zijn.", "1 Tess 3:1": "Daarom hebben wij, omdat we het verlangen niet langer konden verdragen, het goed gevonden om alleen in Athene achtergelaten te worden;", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Mark 6:6": "En Hij verwonderde Zich over hun ongeloof, en trok rond door de dorpen daar in de omgeving, terwijl Hij onderwees.", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "1 Tess 4:9": "Wat de broederlijke liefde nu betreft, hebt u niet nodig dat ik u schrijf; want u zelf bent door God geleerd om elkaar lief te hebben.", "2 Sam 18:27": "Verder zei de wachter: Ik zie de manier van lopen van de eerste, als de manier van lopen van Ahimaäz, de zoon van Zadok. Toen zei de koning: Dat is een goed man, en hij zal met een goed bericht komen.", "Fil 4:3": "En ik bid ook u, mijn oprechte metgezel, wees deze vrouwen behulpzaam, die met mij gestreden hebben in het Evangelie, ook met Clemens, en de andere medearbeiders van mij, van wie de namen in het boek van het leven staan.", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Ps 101:4": "Het verkeerde hart zal van mij wijken; de boze zal ik niet kennen.", "Joh 10:4": "En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen.", "Hebr 12:1": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is;", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Joh 3:6": "Wat uit het vlees geboren is, dat is vlees; en wat uit de Geest geboren is, dat is geest.", "Rom 3:30": "omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.", "Hand 4:12": "En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Deut 15:7-18": "Wanneer er onder u een arme zal zijn, iemand van uw broeders, in een van uw poorten, in uw land dat de HEERE, uw God, u geven zal, dan zult u uw hart niet verharden, en uw hand niet toesluiten voor uw broeder die arm is; Maar u zult uw hand mild voor hem opendoen, en u zult hem rijkelijk lenen, genoeg voor zijn gebrek, wat hem ontbreekt. Wacht ervoor dat er in uw hart geen verdorven gedachte is, om te zeggen: Het zevende jaar, het jaar van de vrijlating, komt dichtbij; zodat uw oog kwaadaardig is tegen uw broeder die arm is, en dat u hem niets geeft; en hij over u roept tot de HEERE, en er zonde in u is.", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Openb 4:5": "En van de troon gingen bliksemflitsen uit, en donderslagen, en stemmen; en zeven vurige lampen waren brandend voor de troon, welke de zeven Geesten van God zijn.", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "Hand 10:23": "Toen hij hen dan naar binnen geroepen had, ontving hij hen in huis. Maar de volgende dag ging Petrus met hen mee, en enkele van de broeders uit Joppe gingen met hem mee.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "Jes 44:3-5": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Hebr 3:14": "Want wij zijn deelgenoten van Christus geworden, als wij tenminste het begin van dit vaste vertrouwen tot het einde toe onwrikbaar vasthouden;", "1 Joh 3:9-11": "Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren. Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft, want dit is de verkondiging die u vanaf het begin gehoord hebt, dat wij elkaar zouden liefhebben.", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "1 Kor 2:13": "Die dingen spreken wij ook, niet met woorden die de menselijke wijsheid leert, maar met woorden die de Heilige Geest leert, terwijl wij geestelijke dingen met geestelijke vergelijken.", "Spr 28:27": "Wie de arme geeft, zal geen gebrek hebben; maar wie zijn ogen verbergt, zal veel vervloekt worden.", "1 Joh 5:18": "Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.", "Luk 1:66": "En allen die het hoorden namen het ter harte, en zeiden: Wat zal er toch van dit kind worden? En de hand van de Heere was met hem.", "Ef 4:3": "En u inspant om de eenheid van de Geest te bewaren door de band van de vrede.", "Ezech 44:6": "En zeg tegen die opstandigen, tegen het huis van Israël: Zo zegt de Heere HEERE: Het is genoeg geweest voor u, vanwege al uw gruwelen, o huis van Israël.", "Hebr 6:15": "En zo heeft hij, nadat hij geduldig volhard had, de belofte verkregen.", "Hebr 3:7": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort,", "2 Petr 3:1": "Deze tweede brief, geliefden, schrijf ik nu aan u; in beide brieven wek ik door herinnering uw oprechte gemoed op;", "Mark 11:30": "De doop van Johannes, was die uit de hemel, of uit de mensen? Antwoord Mij.", "Ps 37:26": "De hele dag ontfermt hij zich, en leent; en zijn nageslacht is tot zegen.", "Gal 1:17-22": "en ik ben ook niet naar Jeruzalem gegaan, naar hen die vóór mij apostelen waren; maar ik ging naar Arabië, en keerde weer terug naar Damaskus. Daarna, na drie jaar, ging ik naar Jeruzalem om Petrus te bezoeken, en ik bleef bij hem vijftien dagen. En ik zag geen andere van de apostelen, dan Jakobus, de broer van de Heere.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "1 Kor 1:2": "Aan de Gemeente van God, die te Korinthe is, de geheiligden in Christus Jezus, de geroepen heiligen, met allen die de Naam van onze Heere Jezus Christus aanroepen in elke plaats, zowel hun als onze Heere;", "Ef 4:4": "Eén lichaam is het, en één Geest, zoals u ook geroepen bent tot één hoop van uw roeping;", "Hand 15:1-31": "En sommigen, die uit Judea afgekomen waren, leerden de broeders en zeiden: Als u niet besneden wordt naar de wijze van Mozes, kunt u niet zalig worden. Toen er dan geen kleine weerstand en twist ontstond bij Paulus en Barnabas tegen hen, hebben zij afgesproken dat Paulus en Barnabas, en enigen van de anderen, naar de apostelen en oudsten in Jeruzalem zouden opgaan over deze vraag. Zij dan, door de gemeente uitgeleid, reisden door Fenicië en Samaria en vertelden over de bekering van de heidenen; en zij deden alle broeders grote blijdschap aan.", "Ps 15:1-5": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "1 Kor 6:9-11": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven? Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven. En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "1 Kor 12:13": "Want ook wij allen zijn door één Geest tot één lichaam gedoopt; hetzij Joden, hetzij Grieken, hetzij dienstknechten, hetzij vrijen; en wij zijn allen tot één Geest gedrenkt.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Ps 115:13": "Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten.", "Hand 2:45": "En zij verkochten hun bezittingen en have, en verdeelden die onder allen, naar dat ieder nodig had.", "Hand 4:2": "Zeer ontevreden, omdat zij het volk leerden en in Jezus de opstanding uit de doden verkondigden.", "1 Tess 5:27": "Ik bezweer u bij de Heere, dat deze brief aan alle heilige broeders voorgelezen wordt.", "Matt 19:17": "En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "1 Petr 3:20": "die vroeger ongehoorzaam waren, toen de lankmoedigheid van God eenmaal wachtte, in de dagen van Noach, terwijl de ark klaargemaakt werd; waarin weinige (dat is acht) zielen behouden werden door het water.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "1 Tim 4:5": "want het wordt geheiligd door het Woord van God en door het gebed.", "Ezech 11:20": "Opdat zij wandelen in Mijn inzettingen, en Mijn rechten bewaren en die doen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Spr 11:5": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid.", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "1 Kor 16:10": "Als Timotheüs nu komt, ziet erop dat hij zonder vrees bij u is; want hij doet het werk van de Heere, zoals ik ook.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "2 Kor 3:8": "hoe zal dan niet veel meer de bediening van de Geest in heerlijkheid zijn?", "Ef 2:9": "niet uit de werken, opdat niemand roemt.", "2 Tim 2:9": "waarvoor ik verdrukkingen lijd tot aan boeien toe, als een misdadiger; maar het Woord van God is niet gebonden.", "Amos 7:4-7": "Verder liet de Heere HEERE mij dit zien: zie, de Heere HEERE riep, dat Hij wilde twisten met vuur; en het verteerde een grote afgrond, ook verteerde het een stuk land. Toen zei ik: Heere HEERE, houd toch op; wie zou er van Jakob blijven staan, want hij is klein! Toen kreeg de HEERE berouw hierover. Ook dit zal niet gebeuren, zei de Heere HEERE.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Jes 29:23": "want wanneer hij zijn kinderen, het werk van Mijn handen, zal zien in zijn midden, zullen zij Mijn Naam heiligen; en zij zullen de Heilige van Jakob heiligen, en de God van Israël vrezen.", "Matt 24:14": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Joh 3:34": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Ef 4:22-32": "Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding; En dat u vernieuwd zou worden in de geest van uw gemoed, En de nieuwe mens zou aandoen, die naar God geschapen is in ware rechtvaardigheid en heiligheid.", "Hand 10:34-38": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon; maar in ieder volk is hij die Hem vreest en gerechtigheid doet, Hem aangenaam. Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen.", "Hand 15:1": "En sommigen, die uit Judea afgekomen waren, leerden de broeders en zeiden: Als u niet besneden wordt naar de wijze van Mozes, kunt u niet zalig worden.", "1 Petr 5:1-3": "De oudsten die onder u zijn, vermaan ik, die een medeoudste en getuige van het lijden van Christus ben, en deelachtig aan de heerlijkheid die geopenbaard zal worden: Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed; ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "Hand 4:8": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël!", "Hand 4:34": "Want er was ook niemand onder hen die gebrek had; want allen die bezitters waren van landen of huizen, verkochten die, en brachten de prijs van het verkochte,", "Mark 4:20": "En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.", "1 Tim 4:1": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Spr 4:18": "Maar het pad van de rechtvaardigen is als een schijnend licht, dat voortgaat en meer licht geeft tot de volle dag toe.", "Hand 15:28": "Want het heeft de Heilige Geest en ons goed gedacht, u geen grotere last op te leggen dan deze noodzakelijke dingen:", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Matt 5:20": "Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan.", "Jer 17:13": "O HEERE, Israëls Verwachting! Allen die U verlaten, zullen beschaamd worden; en die van Mij afwijken, zullen in de aarde geschreven worden; want zij verlaten de HEERE, de Springader van het levende water.", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "2 Tess 2:15-17": "Welnu dan, broeders, staat vast en houdt vast aan de overleveringen, die u geleerd zijn, hetzij door ons woord, hetzij door onze brief. En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade, moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Jes 2:5": "Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Ef 3:17-19": "opdat Christus door het geloof in uw harten woont, en u in de liefde geworteld en gegrond bent; opdat u ten volle in staat bent te begrijpen, met al de heiligen, wat de breedte, en lengte, en diepte, en hoogte is, en de liefde van Christus kent, die de kennis te boven gaat, opdat u vervuld wordt tot al de volheid van God.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Hand 16:6": "En toen zij Frygië en het land Galatië doorgereisd hadden, werden zij door de Heilige Geest verhinderd het Woord in Azië te spreken.", "Fil 1:12-14": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is; Zodat mijn banden in Christus openbaar geworden zijn in het hele rechthuis, en aan alle anderen; En dat het merendeel van de broeders in de Heere, doordat zij vertrouwen gekregen hebben door mijn banden, veel overvloediger het Woord onbevreesd durven spreken.", "Pred 12:9": "En verder, omdat de prediker wijs geweest is, leerde hij het volk nog kennis, en lette hij op, en onderzocht hij; hij bracht veel spreuken in orde.", "Luk 9:49": "En Johannes antwoordde en zei: Meester, wij hebben iemand gezien die in Uw Naam de duivelen uitwierp, en wij hebben het hem verboden, omdat hij U niet met ons volgt.", "Spr 14:27": "De vreze van de HEERE is een bron van leven, om af te wijken van de strikken van de dood.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "Hand 18:24-28": "En een zekere Jood, met de naam Apollos, van geboorte een Alexandriër, een welsprekend man, kwam naar Efeze, machtig zoals hij was in de Schriften. Deze was onderwezen in de weg van de Heere; en omdat hij vurig was van geest, sprak en leerde hij nauwkeurig de zaken van de Heere, al kende hij alleen de doop van Johannes. En hij begon vrijmoedig te spreken in de synagoge. En toen Aquila en Priscilla hem gehoord hadden, namen zij hem tot zich, en legden hem de weg van God nauwkeuriger uit.", "Rom 11:34-36": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest? Of wie heeft Hem eerst gegeven, en het zal hem terugbetaald worden? Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.", "Ef 3:5-8": "die in andere eeuwen aan de kinderen van de mensen niet bekendgemaakt is, zoals zij nu geopenbaard is aan Zijn heilige apostelen en profeten, door de Geest; namelijk dat de heidenen medeerfgenamen zijn, en van hetzelfde lichaam, en mededeelgenoten van Zijn belofte in Christus, door het Evangelie; waarvan ik een dienaar geworden ben, naar de gave van de genade van God, die mij gegeven is, naar de werking van Zijn kracht.", "1 Kor 2:5": "Opdat uw geloof niet zou berusten op wijsheid van mensen, maar op de kracht van God.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "1 Kor 15:2": "door wie u ook zalig wordt, als u het vasthoudt op de manier zoals ik het u verkondigd heb; tenzij u tevergeefs geloofd hebt.", "Mark 5:20": "En hij ging weg, en begon in het gebied van Dekapolis te verkondigen wat grote dingen Jezus aan hem gedaan had; en zij verwonderden zich allen.", "Hand 10:30-32": "En Cornelius zei: Vier dagen geleden was ik aan het vasten tot dit uur toe, en op het negende uur bad ik in mijn huis, en zie, een man stond voor mij, in een blinkend kleed, en zei: Cornelius! Uw gebed is verhoord, en uw aalmoezen zijn voor God in gedachtenis gekomen. Zend dan naar Joppe, en ontbied Simon, die ook Petrus genoemd wordt; deze is te gast in het huis van Simon, de leerlooier, aan de zee, die, als hij hier gekomen is, tot u zal spreken.", "Luk 3:16": "antwoordde Johannes aan allen: Ik doop u wel met water; maar Hij komt Die sterker is dan ik, aan Wie ik niet waardig ben de riem van Zijn schoenen los te maken; Deze zal u dopen met de Heilige Geest en met vuur;", "Luk 3:22": "en dat de Heilige Geest op Hem neerdaalde in lichamelijke gedaante, zoals een duif; en dat er een stem uit de hemel kwam, die zei: U bent Mijn geliefde Zoon, in U heb Ik Mijn welbehagen!", "Hand 10:34-44": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon; maar in ieder volk is hij die Hem vreest en gerechtigheid doet, Hem aangenaam. Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen.", "Jes 1:17": "Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.", "Spr 22:9": "Wie goed van oog is, zal gezegend worden; want hij heeft van zijn brood aan de arme gegeven.", "Hand 15:3": "Zij dan, door de gemeente uitgeleid, reisden door Fenicië en Samaria en vertelden over de bekering van de heidenen; en zij deden alle broeders grote blijdschap aan.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Hebr 2:1": "Daarom moeten wij ons des te meer houden aan wat wij gehoord hebben, opdat wij het niet op enig moment laten wegglijden.", "Ps 71:17": "O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.", "1 Kor 1:24": "Maar voor hen die geroepen zijn, zowel Joden als Grieken, prediken wij Christus, de kracht van God, en de wijsheid van God.", "Gal 3:28": "Daarin is geen Jood en geen Griek; daarin is geen slaaf en geen vrije; daarin is geen man en vrouw; want u bent allen één in Christus Jezus.", "Jes 63:10": "Maar zij zijn opstandig geworden, en zij hebben Zijn Heilige Geest smarten aangedaan; daarom is Hij hun in een vijand veranderd, Hij Zelf heeft tegen hen gestreden.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Joh 6:44": "Niemand kan tot Mij komen, als de Vader, Die Mij gezonden heeft, hem niet trekt; en Ik zal hem opwekken op de laatste dag.", "2 Kor 9:1": "Want over de bediening die voor de heiligen geschiedt, is het voor mij onnodig aan u te schrijven.", "Jes 55:1-3": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "Hebr 4:1-10": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Joz 24:14-16": "En nu, vrees de HEERE, en dien Hem in oprechtheid en in waarheid; en doe de goden weg die uw vaders gediend hebben, aan de overkant van de rivier, en in Egypte; en dien de HEERE. Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen! Toen antwoordde het volk en zei: Het zij verre van ons, dat wij de HEERE zouden verlaten om andere goden te dienen.", "Mark 10:14": "Maar Jezus zag dit, en nam het Hem zeer kwalijk, en zei tegen hen: Laat de kinderen bij Mij komen, en verhinder ze niet; want voor zulke is het Koninkrijk van God.", "Spr 10:2": "Schatten van goddeloosheid geven geen voordeel; maar gerechtigheid redt van de dood.", "Hand 13:9": "Doch Saulus (die ook Paulus genoemd wordt), vervuld met de Heilige Geest, en de ogen op hem gericht houdend, zei:", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Rom 9:22-30": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf; en opdat Hij de rijkdom van Zijn heerlijkheid bekend zou maken over de vaten van de barmhartigheid, die Hij van tevoren klaargemaakt heeft tot heerlijkheid? Ons namelijk, die Hij ook geroepen heeft, niet alleen uit de Joden, maar ook uit de heidenen.", "Luk 15:4-32": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Ps 9:20": "Sta op, HEERE, laat de mens zich niet versterken; laat de heidenen voor Uw aangezicht geoordeeld worden.", "1 Kor 14:23": "Als dan de hele Gemeente bijeengebracht is, en zij allen in vreemde talen spraken, en er enige ongeleerden of ongelovigen binnenkwamen, zouden zij dan niet zeggen dat u buiten zinnen bent?", "Hebr 9:13": "Want als het bloed van stieren en bokken, en de as van de jonge koe, besprenkeld over de onreinen, hen heiligt tot de reinheid van het vlees,", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Joh 3:21": "Maar wie de waarheid doet, komt tot het licht, opdat van zijn werken openbaar wordt dat zij in God gedaan zijn.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Luk 8:38": "En de man uit wie de duivels weggegaan waren, smeekte Hem bij Hem te mogen blijven. Maar Jezus liet hem van Zich gaan en zei:", "Mark 7:27-30": "Maar Jezus zei tegen haar: Laat eerst de kinderen verzadigd worden; want het is niet gepast om het brood van de kinderen te nemen, en het naar de hondjes te werpen. Maar zij antwoordde en zei tegen Hem: Ja, Heere, maar ook de hondjes eten onder de tafel van de kruimels van de kinderen. En Hij zei tegen haar: Vanwege dit woord, ga heen; de duivel is uit uw dochter weggegaan.", "Jes 60:21": "En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.", "Ezech 11:19": "En Ik zal hun één hart geven, en Ik zal een nieuwe geest in uw binnenste geven; en Ik zal het stenen hart uit hun vlees wegnemen, en zal hun een hart van vlees geven;", "Hand 11:15-17": "En toen ik begon te spreken, viel de Heilige Geest op hen, net zoals ook op ons in het begin. En ik herinnerde mij het woord van de Heere, hoe Hij zei: Johannes doopte wel met water, maar u zult gedoopt worden met de Heilige Geest. Als God hun dan dezelfde gave gegeven heeft als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik dan, dat ik God zou kunnen tegenhouden?", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "1 Petr 5:1": "De oudsten die onder u zijn, vermaan ik, die een medeoudste en getuige van het lijden van Christus ben, en deelachtig aan de heerlijkheid die geopenbaard zal worden:", "Hand 19:2-6": "zei hij tegen hen: Hebt u de Heilige Geest ontvangen, toen u tot geloof kwam? En zij zeiden tegen hem: Wij hebben zelfs niet gehoord of er een Heilige Geest is. En hij zei tegen hen: Waarin bent u dan gedoopt? En zij zeiden: In de doop van Johannes. Maar Paulus zei: Johannes heeft wel gedoopt met de doop van bekering, en zei tegen het volk dat zij geloven zouden in Hem Die na hem kwam, dat is, in Christus Jezus.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "Jer 9:1-3": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk. Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop. En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "1 Petr 4:1": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde;", "Jes 6:8": "Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen.", "Rom 9:24": "Ons namelijk, die Hij ook geroepen heeft, niet alleen uit de Joden, maar ook uit de heidenen.", "2 Kor 3:18": "En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere.", "Matt 13:33": "Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "Ps 68:19-21": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God! Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela. Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Rom 8:37": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Rom 8:35": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard?", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Ef 6:17": "En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.", "Gal 2:2": "En ik ging op door een openbaring, en stelde hun het Evangelie voor dat ik predik onder de heidenen; en in het bijzonder aan hen die in aanzien waren, opdat ik niet op enige manier tevergeefs zou lopen of gelopen hebben.", "Hand 15:22": "Toen vonden de apostelen en de oudsten, met heel de gemeente, het goed enkele mannen uit hun midden te kiezen, en met Paulus en Barnabas naar Antiochië te zenden, namelijk Judas, die bijgenaamd wordt Barsabas, en Silas, mannen die voorgangers waren onder de broeders.", "1 Kron 16:35": "En zegt: Verlos ons, o God van ons heil, en verzamel ons, en red ons van de heidenen, opdat wij Uw heilige Naam loven, en opdat wij ons in Uw lof roemen.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft."
