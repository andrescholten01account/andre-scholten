emel, en het kwam tot bij mij.","6":"Toen ik de ogen daarop gericht hield, merkte ik op en zag de viervoetige dieren van de aarde, en de wilde dieren, en de kruipende dieren, en de vogels van de hemel.","7":"En ik hoorde een stem die tegen mij zei: Sta op, Petrus, slacht en eet.","8":"Maar ik zei: Geenszins, Heere, want nooit is iets dat gewoon of onrein was in mijn mond binnengegaan.","9":"Maar de stem antwoordde mij voor de tweede keer uit de hemel: Wat God gereinigd heeft, mag u niet gewoon noemen.","10":"En dit gebeurde tot driemaal toe; en alles werd weer opgetrokken naar de hemel.","11":"En zie, op datzelfde moment stonden er drie mannen voor het huis waar ik in was, die van Cesarea naar mij toe gestuurd waren.","12":"En de Geest zei tegen mij dat ik met hen mee moest gaan, zonder te twijfelen. En met mij gingen ook deze zes broeders mee, en wij zijn het huis van de man binnengegaan.","13":"En hij heeft ons verteld hoe hij een engel gezien had, die in zijn huis stond en tegen hem zei: Stuur mannen naar Joppe, en laat Simon halen, die bijgenaamd is Petrus,","14":"die woorden tot u zal spreken, waardoor u zalig zult worden, en heel uw huis.","15":"En toen ik begon te spreken, viel de Heilige Geest op hen, net zoals ook op ons in het begin.","16":"En ik herinnerde mij het woord van de Heere, hoe Hij zei: Johannes doopte wel met water, maar u zult gedoopt worden met de Heilige Geest.","17":"Als God hun dan dezelfde gave gegeven heeft als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik dan, dat ik God zou kunnen tegenhouden?","18":"En toen zij dit hoorden, waren zij tevreden, en verheerlijkten God, en zeiden: Zo heeft God dan ook aan de heidenen de bekering gegeven tot leven!","19":"Degenen nu die verstrooid waren door de verdrukking die over Stefanus gebeurd was, trokken het land door tot Fenicië toe, en Cyprus, en Antiochië, en spraken tot niemand het Woord dan alleen tot de Joden.","20":"En er waren enige mannen uit Cyprus en Cyrene onder hen, die naar Antiochië gekomen waren en tot de Grieken spraken, terwijl zij de Heere Jezus verkondigden.","21":"En de hand van de Heere was met hen; en een groot aantal geloofde en bekeerde zich tot de Heere.","22":"En het gerucht over hen kwam de gemeente in Jeruzalem ter ore; en zij zonden Barnabas uit om het land door te gaan tot Antiochië toe.","23":"Toen hij daar aangekomen was en de genade van God zag, werd hij blij, en vermaande hen allen dat zij met een vast voornemen van het hart bij de Heere zouden blijven.","24":"Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.","25":"En Barnabas ging naar Tarsen om Saulus te zoeken;","26":"en toen hij hem gevonden had, bracht hij hem naar Antiochië. En het gebeurde dat zij een heel jaar samenkwamen in de gemeente en een grote menigte onderwezen; en dat de discipelen voor het eerst in Antiochië Christenen genoemd werden.","27":"En in diezelfde dagen kwamen er enige profeten van Jeruzalem naar Antiochië.","28":"En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.","29":"En naarmate ieder van de discipelen in staat was, besloot elk van hen iets te sturen ten dienste van de broeders die in Judea woonden.","30":"En dat deden zij ook, en zonden het naar de oudsten, door de hand van Barnabas en Saulus."},"SV":{"1":"De apostelen nu, en de broeders, die in Judea waren, hebben gehoord, dat ook de heidenen het Woord Gods aangenomen hadden.","2":"En toen Petrus opgegaan was naar Jeruzalem, twistten tegen hem degenen, die uit de besnijdenis waren,","3":"Zeggende: Gij zijt ingegaan tot mannen, die de voorhuid hebben, en hebt met hen gegeten.","4":"Maar Petrus, beginnende, verhaalde het hun vervolgens, zeggende:","5":"Ik was in de stad Joppe, biddende en zag in een vertrekking van zinnen een gezicht, *namelijk* een zeker vat, gelijk een groot linnen laken, nederdalende, bij de vier hoeken nedergelaten uit den hemel, en het kwam tot bij mij;","6":"Op welk *laken* als ik de ogen hield, zo merkte ik, en zag de viervoetige *dieren* der aarde, en de wilde, en de kruipende *dieren*, en de vogelen des hemels.","7":"En ik hoorde een stem, die tot mij zeide: Sta op, Petrus, slacht en eet.","8":"Maar ik zeide: Geenszins, Heere, want nooit is iets, dat gemeen of onrein was, in mijn mond ingegaan.","9":"Doch de stem antwoordde mij ten tweeden male uit den hemel: Hetgeen God gereinigd heeft, zult gij niet gemeen maken.","10":"En dit geschiedde tot driemaal; en alles werd wederom opgetrokken in den hemel.","11":"En ziet, ter zelfder *ure* stonden er drie mannen voor het huis, daar ik in was, die van Cesarea tot mij afgezonden waren.","12":"En de Geest zeide tot mij, dat ik met hen gaan zou, niet twijfelende. En met mij gingen ook deze zes broeders, en wij zijn in des man huis ingegaan.","13":"En hij heeft ons verhaald, hoe hij een engel gezien had, die in zijn huis stond, en tot hem zeide: Zend mannen naar Joppe, en ontbied Simon, die toegenaamd is Petrus;","14":"Die woorden tot u zal spreken, door welke gij zult zalig worden, en al uw huis.","15":"En als ik begon te spreken, viel de Heilige Geest op hen, gelijk ook op ons in het begin.","16":"En ik werd gedachtig aan het woord des Heeren, hoe Hij zeide: Johannes doopte wel met water, maar gijlieden zult gedoopt worden met den Heiligen Geest.","17":"Indien dan God hun evengelijke gave gegeven heeft, als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik toch, die God konde weren?","18":"En als zij dit hoorden, waren zij tevreden, en verheerlijkten God, zeggende: Zo heeft dan God ook den heidenen de bekering gegeven ten leven!","19":"Degenen nu, die verstrooid waren door de verdrukking, die over Stefanus geschied was, gingen *het* *land* door tot Fenicië toe, en Cyprus, en Antiochië, tot niemand het Woord sprekende, dan alleen tot de Joden.","20":"En er waren enige Cyprische en Cyreneïsche mannen uit hen, welken te Antiochië gekomen zijnde, spraken tot de Grieksen, verkondigende den Heere Jezus.","21":"En de hand des Heeren was met hen; en een groot getal geloofde, en bekeerde zich tot den Heere.","22":"En het gerucht van hen kwam tot de oren der Gemeente, die te Jeruzalem was; en zij zonden Barnabas uit, dat hij *het* *land* doorging tot Antiochië toe.","23":"Dewelke, daar gekomen zijnde, en de genade Gods ziende, werd verblijd, en vermaande hen allen, dat zij met een voornemen des harten bij den Heere zouden blijven.","24":"Want hij was een goed man, en vol des Heiligen Geestes en des geloofs; en er werd een grote schare den Heere toegevoegd.","25":"En Barnabas ging uit naar Tarsen, om Saulus te zoeken; en als hij hem gevonden had, bracht hij hem te Antiochië.","26":"En het is geschied, dat zij een geheel jaar *samen* vergaderden in de Gemeente, en een grote schare leerden; en dat de discipelen eerst te Antiochië Christenen genaamd werden.","27":"En in dezelfde dagen kwamen *enige* profeten af van Jeruzalem te Antiochië.","28":"En een uit hen, met name Agabus, stond op, en gaf te kennen door den Geest, dat er een grote hongersnood zou wezen over de gehele wereld; dewelke ook gekomen is onder den keizer Claudius.","29":"En naardat een iegelijk der discipelen vermocht, besloot elk van hen *iets* te zenden ten dienste der broederen, die in Judea woonden.","30":"Hetwelk zij ook deden, en zonden het tot de ouderlingen, door de hand van Barnabas en Saulus."},"KJV":{"1":"And the apostles and brethren that were in Judaea heard that the Gentiles had also received the word of God.","2":"And when Peter was come up to Jerusalem, they that were of the circumcision contended with him,","3":"Saying, Thou wentest in to men uncircumcised, and didst eat with them.","4":"But Peter rehearsed *the matter* from the beginning, and expounded *it* by order unto them, saying,","5":"I was in the city of Joppa praying: and in a trance I saw a vision, A certain vessel descend, as it had been a great sheet, let down from heaven by four corners; and it came even to me:","6":"Upon the which when I had fastened mine eyes, I considered, and saw fourfooted beasts of the earth, and wild beasts, and creeping things, and fowls of the air.","7":"And I heard a voice saying unto me, Arise, Peter; slay and eat.","8":"But I said, Not so, Lord: for nothing common or unclean hath at any time entered into my mouth.","9":"But the voice answered me again from heaven, What God hath cleansed, *that* call not thou common.","10":"And this was done three times: and all were drawn up again into heaven.","11":"And, behold, immediately there were three men already come unto the house where I was, sent from Caesarea unto me.","12":"And the Spirit bade me go with them, nothing doubting. Moreover these six brethren accompanied me, and we entered into the man's house:","13":"And he shewed us how he had seen an angel in his house, which stood and said unto him, Send men to Joppa, and call for Simon, whose surname is Peter;","14":"Who shall tell thee words, whereby thou and all thy house shall be saved.","15":"And as I began to speak, the Holy Ghost fell on them, as on us at the beginning.","16":"Then remembered I the word of the Lord, how that he said, John indeed baptized with water; but ye shall be baptized with the Holy Ghost.","17":"Forasmuch then as God gave them the like gift as *he did* unto us, who believed on the Lord Jesus Christ; what was I, that I could withstand God?","18":"When they heard these things, they held their peace, and glorified God, saying, Then hath God also to the Gentiles granted repentance unto life.","19":"Now they which were scattered abroad upon the persecution that arose about Stephen travelled as far as Phenice, and Cyprus, and Antioch, preaching the word to none but unto the Jews only.","20":"And some of them were men of Cyprus and Cyrene, which, when they were come to Antioch, spake unto the Grecians, preaching the Lord Jesus.","21":"And the hand of the Lord was with them: and a great number believed, and turned unto the Lord.","22":"Then tidings of these things came unto the ears of the church which was in Jerusalem: and they sent forth Barnabas, that he should go as far as Antioch.","23":"Who, when he came, and had seen the grace of God, was glad, and exhorted them all, that with purpose of heart they would cleave unto the Lord.","24":"For he was a good man, and full of the Holy Ghost and of faith: and much people was added unto the Lord.","25":"Then departed Barnabas to Tarsus, for to seek Saul:","26":"And when he had found him, he brought him unto Antioch. And it came to pass, that a whole year they assembled themselves with the church, and taught much people. And the disciples were called Christians first in Antioch.","27":"And in these days came prophets from Jerusalem unto Antioch.","28":"And there stood up one of them named Agabus, and signified by the Spirit that there should be great dearth throughout all the world: which came to pass in the days of Claudius Caesar.","29":"Then the disciples, every man according to his ability, determined to send relief unto the brethren which dwelt in Judaea:","30":"Which also they did, and sent it to the elders by the hands of Barnabas and Saul."}},"tsk":{"1":[{"kopje":"De apostelen","refs":["Hand 8:14","Hand 8:15","Gal 1:17-22"]},{"kopje":"de heidenen","refs":["Hand 10:34-38","Hand 14:27","Hand 15:3","Gen 49:10","Ps 22:28","Ps 96:1-10","Jes 11:10","Jes 32:15","Jes 35:1","Jes 35:2","Jes 42:1","Jes 42:6","Jes 49:6","Jes 52:10","Jes 60:3","Jes 62:2","Jer 16:19","Hos 2:22","Amos 9:11","Amos 9:12","Micha 5:6","Zef 2:11","Zef 3:9","Zach 2:11","Zach 8:20-23","Mal 1:11","Matt 8:11","Mark 16:5","Luk 2:32","Rom 15:7-12"]}],"2":[{"kopje":"twistten degenen","refs":["Hand 10:9","Hand 10:45","Hand 15:1","Hand 15:5","Hand 21:20-23","Gal 2:12-14"]}],"5":[{"kopje":"was","refs":["Hand 10:9-18"]},{"kopje":"een zeker","refs":[ /span> <span class=\"wl wl-kjv\" data-code=\"G1519\">unto</span> Antioch.","28":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> there stood <span class=\"wl wl-kjv\" data-code=\"G450\">up</span> <span class=\"wl wl-kjv\" data-code=\"G1520\">one</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them</span> <span class=\"wl wl-kjv\" data-code=\"G3686\">named</span> <span class=\"wl wl-kjv\" data-code=\"G13\">Agabus,</span> and <span class=\"wl wl-kjv\" data-code=\"G4591\">signified</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> the <span class=\"wl wl-kjv\" data-code=\"G4151\">Spirit</span> that there should <span class=\"wl wl-kjv\" data-code=\"G3195\">be</span> <span class=\"wl wl-kjv\" data-code=\"G3173\">great</span> <span class=\"wl wl-kjv\" data-code=\"G3042\">dearth</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">throughout</span> <span class=\"wl wl-kjv\" data-code=\"G3650\">all</span> the <span class=\"wl wl-kjv\" data-code=\"G3625\">world:</span> <span class=\"wl wl-kjv\" data-code=\"G3748\">which</span> came to <span class=\"wl wl-kjv\" data-code=\"G1096\">pass</span> in the days <span class=\"wl wl-kjv\" data-code=\"G1909\">of</span> <span class=\"wl wl-kjv\" data-code=\"G2804\">Claudius</span> Caesar.","29":"<span class=\"wl wl-kjv\" data-code=\"G1161\">Then</span> the <span class=\"wl wl-kjv\" data-code=\"G3101\">disciples,</span> <span class=\"wl wl-kjv\" data-code=\"G1538\">every</span> <span class=\"wl wl-kjv\" data-code=\"G846\">man</span> according <span class=\"wl wl-kjv\" data-code=\"G2531\">to</span> his <span class=\"wl wl-kjv\" data-code=\"G2141\">ability,</span> <span class=\"wl wl-kjv\" data-code=\"G3724\">determined</span> to <span class=\"wl wl-kjv\" data-code=\"G3992\">send</span> <span class=\"wl wl-kjv\" data-code=\"G1248\">relief</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">unto</span> the <span class=\"wl wl-kjv\" data-code=\"G80\">brethren</span> which <span class=\"wl wl-kjv\" data-code=\"G2730\">dwelt</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> Judaea:","30":"<span class=\"wl wl-kjv\" data-code=\"G3739\">Which</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> they <span class=\"wl wl-kjv\" data-code=\"G4160\">did,</span> and sent <span class=\"wl wl-kjv\" data-code=\"G649\">it</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">to</span> the <span class=\"wl wl-kjv\" data-code=\"G4245\">elders</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> the <span class=\"wl wl-kjv\" data-code=\"G5495\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"G921\">Barnabas</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> Saul."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"broeders, die","tekst":"Onder deze broeders worden hier ook de ouderlingen begrepen, die van andere gewone broeders of gelovigen onderscheiden worden; Act 15:23 ."}],"2":[{"catchword":"degenen, die","tekst":"Namelijk enige gelovige Joden, anderen namelijk dan de apostelen."}],"3":[{"catchword":"die de voorhuid","tekst":"Dat is, die onbesneden zijn en blijven; waaruit blijkt dat degenen, die vóórdezen uit de heidenen bekeerd zijn, Jodengenoten geweest zijn, of tenminste besneden waren, dewijl zich niemand daaraan gestoten heeft dat Petrus en Johannes tot hen zijn ingegaan. Zie Act 2:10 , en Act 8:14 , en Act 15:7 , Act 15:14 ."}],"4":[{"catchword":"Maar Petrus,","tekst":"Hetgeen in deze verantwoording van Petrus verklaring zou moge van node hebben tot vs.14 toe, is aangetekend op Hand. 10."},{"catchword":"verhaalde het","tekst":"Of, legde het hun na elkander uit."}],"14":[{"catchword":"woorden tot","tekst":"Of, zaken, dingen."},{"catchword":"door welke gij","tekst":"Grieks in welke; namelijk zo gij die met waar geloof aanneemt, gelijk uitgedrukt staat Act 10:43 . Zie breder verklaring van vs.14"}],"15":[{"catchword":"in het begin","tekst":"Namelijk na de hemelvaart van Christus, op den pinksterdag; Act 2:4 , en Act 19:6 ."}],"16":[{"catchword":"met den Heiligen Geest","tekst":"Zie hiervan de verklaring Mat 3:11 , en Act 1:5 ."}],"17":[{"catchword":"die God konde weren?","tekst":"Grieks machtig om God te weren; dat is, dewijl God hen deelachtig had gemaakt der zaak, die door den doop betekend wordt, hoe zou ik hun kunnen onthouden of weigeren het uiterlijke teken? Dergelijke rede van Petrus, zie Act 2:38-39 ."}],"18":[{"catchword":"gegeven ten leven","tekst":"Dat is, door Zijn Heiligen Geest in hen gewrocht. Zie Phi 2:13 ; Heb 8:10 ."}],"19":[{"catchword":"over Stefanus","tekst":"Of, in Stefanus, om Stefanus' wil, ter oorzaak van Stefanus; dat is, uit haat van zijn ijver en vrijmoedigheid, die hij tegen de Joden en hunne oversten gebruikt had, Hand. 6, 7."},{"catchword":"Fenicië toe,","tekst":"Dit was een landschap in Syrië, grenzende aan het Joodse land, gelegen tegen de Middellandse zee, waarvan Tyrus de hoofdstad was. Zie Act 12:20 ."},{"catchword":"Cyprus, en","tekst":"Dit is een eiland in de Middellandse zee, waar men van Tyrus en Sidon lichtelijk kon heenvaren. Zie Act 27:3-4 ."},{"catchword":"Antiochië,","tekst":"Dit was toen de hoofdstad van Syrië, mede omtrent de Middellandse zee op de rivier Orontes gelegen, de machtigste stad van geheel Azië, gelijk Alexandrië van Afrika, en Rome van Europa."},{"catchword":"alleen tot de","tekst":"Namelijk omdat zij de leer van de roeping der heidenen nog niet genoeg verstonden."}],"20":[{"catchword":"uit hen, welken","tekst":"Namelijk Joden of Jodengenoten, in Cyprus en Cyrene geboren, die ook te Jeruzalem woonachtig zijnde, om de voorgaande vervolging hadden moeten vluchten, alzo zij den Christelijken godsdienst hadden aangenomen."},{"catchword":"Grieksen,","tekst":"Dat is, tot de Joden, die de Griekse taal en overzetting in hunne synagogen gebruikten. Zie Act 6:1 , en Act 9:29 ."},{"catchword":"verkondigende","tekst":"Evangeliserende."},{"catchword":"den Heere Jezus","tekst":"Dat is, Zijn lijden, sterven, opstaan, hemelvaart, en voorts al hetgeen van Hem ter zaligheid geloofd moest worden. Zie 1Co 2:2 ."}],"21":[{"catchword":"de hand des","tekst":"Dat is, de bijstand en krachtige werking Gods, waardoor hunne harten bewogen werden. Zie Act 16:14 ; 1Co 3:6 ."}],"22":[{"catchword":"het gerucht","tekst":"Grieks het woord."},{"catchword":"kwam tot de","tekst":"Grieks werd gehoord in de oren."},{"catchword":"Bárnabas uit,","tekst":"Die een Leviet en ook zelf uit Cyprus was, om bij zijne landslieden en geburen te beter toegang en vrijheid te hebben. Daaruit schijnt dat deze mannen, waarvan vs.20 is gesproken, door een bijzonderen ijver gedreven, buitengewoon daar gepredikt hebben de leer van Christus, welke daarna door Barnabas en Paulus bevestigd en meer verbreid is, en die alles onder de gelovigen aldaar tot behoorlijke orde gebracht hebben. Zie ook de aantekeningen Act 8:1 ."}],"23":[{"catchword":"de genade Gods","tekst":"Namelijk over hen in het aannemen van de leer des Evangelies."},{"catchword":"een voornemen","tekst":"Dat is, met een oprecht en standvastig voornemen."}],"25":[{"catchword":"Tarsen, om","tekst":"Dit was een voorname stad in Cilicië, het vaderland van Paulus, Act 9:11 , waar hij heengezonden was; Act 9:27 ."}],"26":[{"catchword":"Christenen genaamd","tekst":"Grieks Christianoi; dat is, discipelen van Christus, omdat zij Zijne leer aannamen en beleden, welke met dezen naam ook met recht genoemd worden, omdat, als zij in Hem geloven, zij leden van Zijn lichaam en Zijner zalving deelachtig worden. Zie ook Act 26:28 , en 1Pe 4:16 ."}],"27":[{"catchword":"profeten af","tekst":"Dat is, personen; begaafd met den geest van toekomende dingen tevoren te zeggen."}],"28":[{"catchword":"gaf te kennen door","tekst":"Grieks betekende, of beduidde."},{"catchword":"onder den keizer","tekst":"Van dezen hongersnood maken ook gewag de historieschrijvers Suetonius, in het leven van Claudius, en Josefus Antiq. lib.20, cap.2."}],"29":[{"catchword":"der discipelen","tekst":"Dat is, gelovigen."},{"catchword":"dienste der","tekst":"Grieks Diakonian, dat is, bediening, der arme broeders in hunnen nood."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now the Apostles and the Brethren [Amongst these Brethren here, also the Elders are comprehended, who are distinguished from other common Brethren or believers, Acts 15.v. 23.] which were in Judea, heard that the Gentiles also had received the word of God."}],"2":[{"catchword":null,"tekst":"And when Peter was gone up to Jerusalem, they that were of the circumcision, [Namely, certain believing Jews, namely, others then the Apostles] contended against him."}],"3":[{"catchword":null,"tekst":"Saying thou wentest in to men who have the foreskin, [That is, who were and continue uncircumcised: from whence it appears that those which before this were converted of the Gentiles, were Proselytes, or at least were circumcised, seeing no man was offended thereat, that Peter and John went in unto them. See Acts 2. 10.and 8. 14.and chap. 15.v. 7. 14.] and eat with them."}],"4":[{"catchword":null,"tekst":"But Peter beginning [That which might have needed exposition in this defence of Peter unto the fourteenth verse, is noted on the former chapter] related it to them consequently, [or expounded it to them one thing after another] saying."}],"5":[{"catchword":null,"tekst":"I was in the City Joppa praying; and saw in a withdrawing of sences a vision, (namely) a certain vessel like a great linen-sheet, descending, let down from heaven by the four corners, and came down unto me."}],"6":[{"catchword":null,"tekst":"On which (sheet) as kept (mine) eyes, I observed and saw the fourfooted (beasts) of the Earth, and the wild and the creeping (creatures,) and the fowles of the heaven."}],"7":[{"catchword":null,"tekst":"And I heard a voice which said unto me, arise Peter, stay and eat."}],"8":[{"catchword":null,"tekst":"But I said, by no means Lord, for never any thing that was common or unclean entered into my mouth."}],"9":[{"catchword":null,"tekst":"But the voice answered me the second time from heaven, that which God hath cleansed, thou shalt not make common."}],"10":[{"catchword":null,"tekst":"And this was done for three times : and all was drawn up again into heaven."}],"11":[{"catchword":null,"tekst":"And behold the same (hour) there stood three men before the house in which I was, which were sent from Cesarea unto me."}],"12":[{"catchword":null,"tekst":"And the spirit said unto me that I should go with them, not doubting. And with me went also these six brethren, and we entred into the mans house."}],"13":[{"catchword":null,"tekst":"And he related to us, how he had seen an Angel, which stood in his house and said unto him, send men unto Joppa and call Simon, who is sirnamed Peter."}],"14":[{"catchword":null,"tekst":"Who shall speak words [Or matters, things] unto thee. by which [Gr.in which, namely, if thou embrace them with a true faith, as is expressed Acts 10. 43. See a larger exposition of this verse, Luke 19. 9.] thou shalt be saved and all thine house."}],"15":[{"catchword":null,"tekst":"And as I began to speak, the Holy Ghost fell on them, as also on us in the beginning. [Namely after Christs ascension on the day of Pentecost, Acts 2. 4.and 19.v. 6.]"}],"16":[{"catchword":null,"tekst":"And I remembred the word of the Lord how he said, John indeed baptized with water, but ye shall be baptized with the Holy Ghost. [See the exposition hereof on Mat. 3. 11. Acts 1. 5.]"}],"17":[{"catchword":null,"tekst":"If therefore God gave them equall gifts, as also unto us who have believed in the Lord Jesus Christ, who was I, I pray, that I could hinder God? [Gr.able to hinder God, i.e. seeing God had made them partakers of the thing which is signified by baptism, how should I be able to withhold from or deny them the outward sign, the like reason of Peter, see Acts 2.v. 38, 39.]"}],"18":[{"catchword":null,"tekst":"And when they heard this, they were content and glorified God, saying, then hath God also to the Gentiles given repentance [That is, wrought in them by his holy spirit. See Phil. 2. 13. Heb. 8. 10.] unto life."}],"19":[{"catchword":null,"tekst":"Now they that were scatsered by the affliction, which came to pass about Stephen [Or in Stephen or for Stephens sake by occasion of Stephen, i.e. out of hatred to his zeal and boldness, which he had used against the Jews and their Rulers, chap. 6.and 7.] went through (the land) unto Phoenicia [this was a country in Syria, bordering on the Land of Judea, situate towards the Midland Sea, whereof Tyre was the chief City. See Acts 12. 20.] and Cyprus, [this is an Island in the Midland Sea, whither men could easily sail from Tyre and Sydon. See Acts 27 3, 4.] and Antioch, [this was then the chief City of Syria, situate also about the Midland Sea, on the River Orontes, the powerfullest City of all Asia, as Alexandria of Africa, and Rome of Europe] speaking the word to no man but only to the Jews. [Namely, because they did not yet sufficiently understand the doctrine of the calling of the Gentiles.]"}],"20":[{"catchword":null,"tekst":"And there were certain men of Cyprus and Cyrene, of them [Namely, Jews or Jewish proselytes born in Cyprus and Cyrene, who also inhabiting at Jerusalem, because of the foregoing persecution, were forced to flee seeing they had imbraced the Christian Religion] who being come to Antioch spake to the Greeks, [that is, to the Jews who used the Greek tongue aud translation in their Synagogues. See Acts 6. 1.and 9. 29.] publishing [Gr. Evangelizing] the Lord Jesus. [that is, his suffering, death, resurrection, ascension, and further all that which must be believed of him to salvation. See 1 Cor 2. 2.]"}],"21":[{"catchword":null,"tekst":"And the hand of the Lord [That is, the assistance and powerfull working of God, whereby their hearts were moved, See Acts 16.ver. 14. I Cor. 3. 6] was with them, and a great number believed and turned unto the Lord // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

    }).join('');
}
function bijbeluitlegHtml(n) {

  const MAX_CW = 60;

function paneelInhoud(n, tab) {

    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  }

  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';

    } else {
      h += '<em>Geen verwijzingen</em>';

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];

    if (!refs || !refs.length) return '';

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

function toggle(n) {
  const paneel = document.getElementById('p' + n);

    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
