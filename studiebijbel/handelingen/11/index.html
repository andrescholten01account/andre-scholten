 "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "1 Tim 5:17-19": "De oudsten die goed leiding geven, moeten dubbele eer waardig geacht worden, vooral wie arbeiden in het Woord en de leer. Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard. Neem tegen een ouderling geen beschuldiging aan, dan alleen op grond van twee of drie getuigen.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Jes 56:6-8": "En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden; Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken. De Heere HEERE, Die de verdrevenen van Israël bijeenbrengt, spreekt: Ik zal er bij hem nog meer bijeenbrengen, naast hen die al bij hem bijeengebracht zijn.", "1 Kor 13:3": "En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "1 Kor 4:20": "Want het Koninkrijk van God bestaat niet in woorden, maar in kracht.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "1 Kor 13:5": "Zij handelt niet ongeschikt, zij zoekt zichzelf niet, zij wordt niet verbitterd, zij denkt geen kwaad;", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Joh 1:33": "En ik kende Hem niet; maar Die mij gezonden heeft om te dopen met water, Die had mij gezegd: Op Wie u de Geest zult zien neerdalen en op Hem blijven, Deze is het, Die met de Heilige Geest doopt.", "Ps 112:4-8": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig. Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht. Caph. Zeker, hij zal in eeuwigheid niet wankelen; Lamed. de rechtvaardige zal in eeuwige gedachtenis zijn.", "Rom 7:24": "Ik, ellendig mens, wie zal mij verlossen uit het lichaam van deze dood?", "Hand 20:17": "Maar hij stuurde vanuit Milete iemand naar Efeze en ontbood de oudsten van de gemeente.", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "2 Tim 4:18": "En de Heere zal mij verlossen van alle slecht werk, en bewaren tot Zijn hemels Koninkrijk; aan Hem zij de heerlijkheid, tot in alle eeuwigheid. Amen.", "Hebr 13:16": "En vergeet de weldadigheid en de mededeelzaamheid niet; want aan zulke offers heeft God een welgevallen.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "1 Kor 15:1": "Verder, broeders, ik maak u het Evangelie bekend, dat ik u verkondigd heb, dat u ook aangenomen hebt, en waarin u ook staat;", "Jes 58:10": "En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.", "Hand 21:20-23": "En toen zij dat gehoord hadden, loofden zij de Heere en zeiden tegen hem: U ziet, broeder, hoeveel duizenden Joden er zijn die geloven; en zij zijn allen ijveraars voor de wet. En zij hebben over u gehoord dat u alle Joden die onder de heidenen zijn, leert om van Mozes af te vallen, en zegt dat zij hun kinderen niet moeten besnijden, en ook niet volgens de gewoonten¹ moeten leven. Wat is er dan te doen? Het is beslist nodig dat de menigte samenkomt; want zij zullen horen dat u gekomen bent.", "Hand 1:2": "tot op de dag waarop Hij opgenomen is, nadat Hij door de Heilige Geest de apostelen die Hij uitverkoren had, bevelen had gegeven.", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "1 Kor 1:26": "Want u ziet uw roeping, broeders, dat u niet veel wijzen bent naar het vlees, niet veel machtigen, niet veel edelen.", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Tit 3:3-7": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar. Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is, Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Kol 1:7": "Zoals u ook geleerd hebt van Epafras, onze geliefde mededienstknecht, die een trouw dienaar van Christus is voor u;", "Matt 13:23": "Maar die in de goede aarde bezaaid is, dit is degene die het woord hoort en begrijpt, die ook vrucht draagt en voortbrengt, de een honderdvoud, de ander zestigvoud, en de ander dertigvoud.", "Luk 3:8": "Breng dan vruchten voort die de bekering waardig zijn; en begin niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen Abraham kinderen kan verwekken.", "Joh 6:40": "En dit is de wil van Hem die Mij gezonden heeft: dat ieder die de Zoon aanschouwt en in Hem gelooft, het eeuwige leven heeft; en Ik zal hem opwekken op de laatste dag.", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Rom 5:15-21": "Toch is het niet zo dat de genadegift is zoals de misdaad; want als door de misdaad van één velen gestorven zijn, is de genade van God, en de gave door de genade die er is van één Mens Jezus Christus, des te meer overvloedig geweest over velen. En het is niet zo dat de gift is zoals de schuld die er was door die ene die gezondigd heeft; want de schuld is wel uit één misdaad tot verdoemenis, maar de genadegift is uit veel misdaden tot rechtvaardigmaking. Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus.", "Hand 21:9": "Deze had nu vier dochters, nog maagden, die profeteerden.", "1 Tim 1:16": "Maar juist daarom is mij barmhartigheid overkomen, opdat Jezus Christus in mij, die de voornaamste ben, al Zijn geduld zou tonen, tot een voorbeeld voor hen die later in Hem geloven zullen tot het eeuwige leven.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "Jes 44:5": "Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Joh 3:14-17": "En zoals Mozes de slang in de woestijn verhoogd heeft, zo moet de Zoon des mensen verhoogd worden; Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ef 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, aan de heiligen die te Efeze zijn, en gelovigen in Christus Jezus:", "1 Kor 2:10-14": "Maar God heeft het ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten van God. Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God. Maar wij hebben niet de geest van de wereld ontvangen, maar de Geest Die uit God is, opdat wij zouden weten de dingen die ons door God geschonken zijn;", "Ef 1:17": "Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Hand 8:25": "Zij dan nu, toen zij het Woord van de Heere betuigd en gesproken hadden, keerden terug naar Jeruzalem, en verkondigden het Evangelie in veel dorpen van de Samaritanen.", "Fil 1:6": "Ervan overtuigd dat Hij, Die in u een goed werk begonnen is, dat zal voleindigen tot op de dag van Jezus Christus;", "Hand 15:7-11": "En toen daarover een grote twist ontstond, stond Petrus op en zei tegen hen: Mannen broeders, u weet dat God van lang geleden onder ons mij uitgekozen heeft, dat de heidenen door mijn mond het woord van het Evangelie zouden horen, en geloven. En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons; en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Joh 4:29": "Kom, kijk naar een Mens Die mij alles gezegd heeft wat ik gedaan heb; is Deze niet de Christus?", "Luk 13:29": "En er zullen mensen komen van oost en west, en van noord en zuid, en zullen aanzitten in het Koninkrijk van God.", "Hand 6:1-3": "In diezelfde dagen, toen het aantal discipelen groeide, ontstond er gemor van de Griekssprekenden tegen de Hebreeën, omdat hun weduwen bij de dagelijkse verzorging over het hoofd werden gezien. En de twaalf riepen de menigte van de discipelen bij zich en zeiden: Het is niet passend dat wij het Woord van God verwaarlozen om de tafels te bedienen. Zie daarom om, broeders, naar zeven mannen uit uw midden, die een goede naam hebben, vol van de Heilige Geest en van wijsheid, die wij mogen aanstellen over deze taak.", "2 Tim 1:10": "Doch nu geopenbaard is door de verschijning van onze Zaligmaker Jezus Christus, Die de dood tenietgedaan heeft, en het leven en de onvergankelijkheid aan het licht gebracht heeft door het Evangelie;", "Mark 15:21": "En zij dwongen iemand die daar voorbijkwam, Simon van Cyrene, die van de akker kwam, de vader van Alexander en Rufus, om Zijn kruis te dragen.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Joh 6:69": "En wij hebben geloofd en erkend dat U de Christus bent, de Zoon van de levende God.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Luk 22:31": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe;", "Ef 2:14-17": "Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken; en opdat Hij die beiden met God in één lichaam zou verzoenen door het kruis, nadat Hij de vijandschap daaraan gedood had.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Hand 2:1-4": "En toen de dag van het Pinksterfeest vervuld werd, waren zij allen eendrachtig bijeen. En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen.", "1 Joh 3:7": "Kinderen, laat niemand u verleiden. Die de rechtvaardigheid doet, is rechtvaardig, zoals Hij rechtvaardig is.", "Gal 5:1": "Sta dan vast in de vrijheid waarmee Christus ons vrijgemaakt heeft, en laat u niet weer met het juk van de slavernij vangen.", "Hebr 3:1": "Daarom, heilige broeders, die deel hebben aan de hemelse roeping, richt uw aandacht op de Apostel en Hogepriester van onze belijdenis, Christus Jezus;", "Jes 11:10": "Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.", "Hand 9:30": "Maar toen de broeders dit te weten kwamen, brachten zij hem naar Cesarea, en zonden hem weg naar Tarsen.", "1 Tess 3:2-5": "en wij hebben Timotheüs gezonden, onze broeder en Gods dienaar en onze medearbeider in het Evangelie van Christus, om u te versterken en u te vermanen aangaande uw geloof; opdat niemand bewogen wordt door deze verdrukkingen; want u weet zelf dat wij hiertoe gesteld zijn. Want ook toen wij bij u waren, zeiden wij u van tevoren dat wij verdrukt zouden worden, zoals ook gebeurd is, en u weet het.", "2 Petr 1:1": "Simeon Petrus, een dienstknecht en apostel van Jezus Christus, aan hen die even kostbaar geloof met ons verkregen hebben, door de rechtvaardigheid van onze God en Zaligmaker, Jezus Christus;", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Joh 20:23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "Ps 51:9": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.", "Lev 25:35-43": "En als uw broeder verarmd zal zijn, en zijn hand bij u wankelt, dan zult u hem vasthouden, ook al is hij een vreemdeling en bijwoner, opdat hij bij u leeft. U zult geen rente noch overwinst van hem nemen; maar u zult vrezen voor uw God, opdat uw broeder bij u leeft. Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "1 Joh 3:3": "En ieder die deze hoop op Hem heeft, reinigt zichzelf, zoals Hij rein is.", "Ef 4:8": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven.", "Luk 3:12": "En er kwamen ook tollenaars om gedoopt te worden, en zeiden tegen hem: Meester, wat zullen wij doen?", "Hand 15:9": "en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "1 Petr 4:2": "om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees.", "Hand 16:7": "En toen zij bij Mysië gekomen waren, probeerden zij naar Bithynië te reizen; maar de Geest liet het hun niet toe.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "1 Joh 5:10": "Wie in de Zoon van God gelooft, heeft het getuigenis in zichzelf; wie God niet gelooft, heeft Hem tot een leugenaar gemaakt, omdat hij niet geloofd heeft het getuigenis dat God getuigd heeft van Zijn Zoon.", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "Mark 2:17": "En Jezus hoorde dat, en zei tegen hen: Wie gezond zijn, hebben de dokter niet nodig, maar wie ziek zijn. Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars tot bekering.", "Hand 18:2": "En hij vond een zekere Jood, met de naam Aquila, van geboorte uit Pontus, die kort daarvoor uit Italië gekomen was, met Priscilla, zijn vrouw (omdat Claudius bevolen had dat alle Joden uit Rome moesten vertrekken), en hij ging naar hen toe;", "Hand 19:3": "En hij zei tegen hen: Waarin bent u dan gedoopt? En zij zeiden: In de doop van Johannes.", "Mark 5:28": "Want zij zei: Als ik maar Zijn kleren mag aanraken, zal ik gezond worden.", "Rom 1:4": "Die met kracht bewezen is de Zoon van God te zijn, naar de Geest van de heiligmaking, uit de opstanding van de doden), namelijk Jezus Christus, onze Heere:", "Matt 22:14": "Want velen zijn geroepen, maar weinigen uitverkoren.", "Kol 1:10": "opdat u mag wandelen op een manier die de Heere waardig is, tot alle behagelijkheid, terwijl u in alle goede werken vrucht draagt en meer wordt in de kennis van God;", "Joh 11:27": "Zij zei tegen Hem: Ja, Heere; ik heb geloofd dat U de Christus bent, de Zoon van God, Die in de wereld komen zou.", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Rom 8:35-39": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Jes 46:12": "Hoor naar Mij, u die hardnekkig van hart bent, u, die ver van de gerechtigheid zijt!", "Matt 23:34": "Daarom, zie, Ik zend tot u profeten, en wijzen, en schriftgeleerden, en van hen zult u sommigen doden en kruisigen, en sommigen van hen zult u geselen in uw synagogen, en vervolgen van stad tot stad;", "Openb 3:11": "Zie, Ik kom haastig; houd vast wat u hebt, opdat niemand uw kroon neemt.", "Gal 2:9": "en toen Jakobus, en Cefas, en Johannes, die geacht werden pilaren te zijn, de genade die mij gegeven was, erkenden, gaven zij mij en Barnabas de rechterhand van gemeenschap, opdat wij naar de heidenen, en zij naar de besnedenen zouden gaan;", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Job 40:4": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen?", "Hand 16:30": "En hij bracht hen naar buiten en zei: Beste heren, wat moet ik doen om zalig te worden?", "Joh 4:34": "Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Rom 2:6": "Die ieder zal vergelden naar zijn werken:", "1 Joh 2:28": "En nu, kinderen, blijft in Hem; opdat, wanneer Hij geopenbaard zal zijn, wij vrijmoedigheid hebben, en wij bij Zijn komst niet beschaamd worden voor Hem.", "2 Kor 13:5": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent.", "1 Tess 1:6": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest;", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Jes 29:24": "En zij die dwalend van geest zijn, zullen tot verstand komen, en de mopperaars zullen de lering aannemen.", "Jak 1:25": "Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Matt 19:14": "Maar Jezus zei: Laat de kinderen begaan, en verhinder hen niet om tot Mij te komen; want voor zulken is het Koninkrijk der hemelen.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Jes 46:13": "Ik breng Mijn gerechtigheid nabij, zij zal niet ver weg zijn, en Mijn heil zal niet uitblijven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid.", "Gal 3:14": "Opdat de zegening van Abraham tot de heidenen komen zou in Christus Jezus, en opdat wij de belofte van de Geest zouden verkrijgen door het geloof.", "1 Petr 4:14": "Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.", "1 Kor 12:28": "En God heeft sommigen in de Gemeente gesteld: ten eerste apostelen, ten tweede profeten, ten derde leraars, daarna krachten, daarna gaven van gezondmaking, hulpverleningen, bestuur, allerlei talen.", "Jer 17:16": "Ik heb toch niet aangedrongen, meer dan een herder achter U betaamde; ook heb ik de dodelijke dag niet begeerd, Gij weet het; wat uit mijn lippen is gegaan, is voor Uw aangezicht geweest.", "Luk 3:6": "En alle vlees zal de zaligheid van God zien.", "Rom 3:21-26": "Maar nu is de gerechtigheid van God geopenbaard, zonder de wet, met getuigenis van de wet en de profeten: namelijk de gerechtigheid van God door het geloof van Jezus Christus, tot allen, en over allen die geloven; want er is geen onderscheid. Want zij hebben allen gezondigd, en missen de heerlijkheid van God;", "Spr 1:20": "De opperste Wijsheid roept overluid daarbuiten; Zij verheft Haar stem op de straten.", "Hand 21:2": "En wij vonden een schip dat naar Fenicië overvoer, gingen erin en voeren af.", "Hand 2:46": "En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "1 Tim 5:17": "De oudsten die goed leiding geven, moeten dubbele eer waardig geacht worden, vooral wie arbeiden in het Woord en de leer.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Zach 3:8": "Hoor nu toe, Jozua, u hogepriester! U en uw vrienden, die voor uw aangezicht zitten, want zij zijn een wonderteken; want zie, Ik zal Mijn Knecht, de SPRUITE, doen komen.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Num 27:18": "Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem;", "Hand 11:22-26": "En het gerucht over hen kwam de gemeente in Jeruzalem ter ore; en zij zonden Barnabas uit om het land door te gaan tot Antiochië toe. Toen hij daar aangekomen was en de genade van God zag, werd hij blij, en vermaande hen allen dat zij met een vast voornemen van het hart bij de Heere zouden blijven. Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.", "Rom 2:28": "Want die is niet een Jood, die het in het openbaar is; en dat is ook niet de besnijdenis, die het in het openbaar in het vlees is;", "Hand 14:15": "Mannen, waarom doet u deze dingen? Ook wij zijn mensen net als u, en wij verkondigen u dat u zich van deze nutteloze dingen zou bekeren tot de levende God, Die de hemel, en de aarde, en de zee, en alles wat daarin is, gemaakt heeft;", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Fil 3:12-14": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben. Broeders, ik acht niet dat ik het zelf al gegrepen heb. Maar één ding doe ik: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.", "1 Kor 15:48": "Zoals de aardse is, zo zijn ook de aardsen; en zoals de Hemelse is, zo zijn ook de hemelsen.", "Ps 3:9": "Het heil is van de HEERE; Uw zegen is over Uw volk. Sela.", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Tit 1:5": "Om die reden heb ik u op Kreta gelaten, opdat u, wat nog ontbrak, verder zou regelen, en dat u van stad tot stad oudsten zou aanstellen, zoals ik u bevolen heb:", "2 Kor 12:1-3": "Het is voor mij zeker niet nuttig om te roemen; want ik zal komen tot gezichten en openbaringen van de Heere. Ik ken een mens in Christus, van veertien jaar geleden (of het gebeurd is in het lichaam, weet ik niet, of buiten het lichaam, weet ik niet, God weet het) die opgetrokken is geweest tot in de derde hemel. En ik ken zo'n mens (of het in het lichaam, of buiten het lichaam gebeurd is, weet ik niet, God weet het),", "Matt 7:16-20": "Aan hun vruchten zult u hen herkennen. Plukt men ook een druif van doornen, of vijgen van distels? Zo brengt iedere goede boom goede vruchten voort, maar een slechte boom brengt slechte vruchten voort. Een goede boom kan geen slechte vruchten voortbrengen, en een slechte boom kan geen goede vruchten voortbrengen.", "Ezra 9:11": "die Gij geboden had door de dienst van Uw knechten, de profeten, en zei: Het land, waar u naartoe gaat om het te erven, is een vuil land, door de vuiligheid van de volken van de landen, om hun gruwelen, waarmee zij het vervuld hebben, van het ene einde tot het andere einde, met hun onreinheid.", "1 Joh 2:20": "Maar u hebt de zalving van de Heilige, en u weet alle dingen.", "Ps 63:6": "Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Hand 10:46": "Want zij hoorden hen spreken in vreemde talen, en God groot maken. Toen antwoordde Petrus:", "Hand 14:1": "En het gebeurde in Ikonium, dat zij samen naar de synagoge van de Joden gingen, en zo spraken, dat een grote menigte, zowel van Joden als Grieken, geloofde.", "Hebr 10:32-39": "Denk echter aan de vorige dagen, waarin u, nadat u verlicht was, veel strijd van het lijden hebt verdragen. Deels doordat u door smaad en verdrukkingen tot een schouwspel gemaakt bent; en deels doordat u deelgenoot bent geworden van hen die zo behandeld werden. Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Hand 24:17": "Maar na vele jaren ben ik gekomen om aalmoezen te brengen aan mijn volk, en offeranden.", "Joh 14:21-24": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren. Judas, niet de Iskariot, zei tegen Hem: Heere, hoe komt het dat U Uzelf aan ons zult openbaren, en niet aan de wereld? Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Ezech 44:9": "Zo zegt de Heere HEERE: Geen vreemde, onbesneden van hart en onbesneden van vlees, zal in Mijn heiligdom naar binnen gaan, van enige vreemde die te midden van de kinderen van Israël is.", "Rom 15:18": "Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken;", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Luk 5:5": "En Simon antwoordde en zei tegen Hem: Meester, we hebben de hele nacht gewerkt en niets gevangen; maar op Uw woord zal ik het net uitwerpen.", "Ef 1:4-7": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde; Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil. Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Spr 29:7": "De rechtvaardige neemt kennis van de rechtszaak van de armen; maar de goddeloze begrijpt die kennis niet.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Joh 6:14": "Toen de mensen dan het teken zagen dat Jezus gedaan had, zeiden zij: Deze is werkelijk de Profeet, Die in de wereld komen zou.", "Hebr 3:6-8": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden. Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "1 Kor 12:12": "Want zoals het lichaam één is en veel leden heeft, en al de leden van dit ene lichaam, hoewel het er veel zijn, toch één lichaam zijn, zo is het ook met Christus.", "Rom 10:20": "En Jesaja durft het aan, en zegt: Ik ben gevonden door hen die Mij niet zochten; Ik ben openbaar geworden aan hen die naar Mij niet vroegen.", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "1 Petr 1:13": "Omgord daarom de lenden van uw verstand, wees nuchter, en hoop volkomen op de genade die u gebracht wordt bij de openbaring van Jezus Christus.", "Spr 10:16": "Het werk van de rechtvaardige leidt tot leven; de opbrengst van de goddeloze leidt tot zonde.", "Luk 8:15": "En wat in de goede aarde valt, dat zijn zij die het Woord gehoord hebben en het in een eerlijk en goed hart bewaren, en met volharding vruchten voortbrengen.", "Job 33:4": "De Geest van God heeft mij gemaakt, en de adem van de Almachtige heeft mij levend gemaakt.", "Spr 8:1-5": "Roept de Wijsheid niet, en verheft de Verstandigheid niet Haar stem? Op de top van de hoge plaatsen, aan de weg /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
