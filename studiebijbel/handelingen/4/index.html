n Alexander, en allen die van het hogepriesterlijk geslacht waren.","7":"En toen zij hen in het midden hadden laten staan, vroegen zij: Door welke kracht, of door welke naam hebt u dit gedaan?","8":"Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël!","9":"Als wij vandaag ondervraagd worden over de weldaad aan een zieke mens *gedaan*, waardoor hij gezond geworden is;","10":"Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, *zeg ik*, staat deze man hier gezond voor u.","11":"Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.","12":"En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.","13":"Toen zij nu de vrijmoedigheid van Petrus en Johannes zagen, en merkten dat zij ongeleerde en eenvoudige mensen waren, verwonderden zij zich, en herkenden hen, dat zij met Jezus geweest waren.","14":"En omdat zij de man die genezen was bij hen zagen staan, hadden zij niets daartegen in te brengen.","15":"En nadat zij hun bevolen hadden de raadzaal te verlaten, overlegden zij met elkaar,","16":"En zeiden: Wat zullen wij met deze mensen doen? Want dat er een bekend teken door hen gebeurd is, is duidelijk voor allen die in Jeruzalem wonen, en wij kunnen het niet ontkennen.","17":"Maar opdat het niet nog meer onder het volk verspreid wordt, laten wij hen scherp dreigen, dat zij niet meer tot enig mens in deze Naam spreken.","18":"En zij riepen hen en zeiden hun aan, dat zij helemaal niet meer zouden spreken, noch leren, in de Naam van Jezus.","19":"Maar Petrus en Johannes antwoordden hun: Oordeelt u zelf, of het recht is voor God, meer naar u te luisteren dan naar God.","20":"Want wij kunnen niet nalaten te spreken over wat wij gezien en gehoord hebben.","21":"Maar zij dreigden hen nog meer, en lieten hen gaan, omdat zij niets vonden waarmee zij hen konden straffen, om het volk; want allen verheerlijkten God over wat er gebeurd was.","22":"Want de man was meer dan veertig jaar oud, aan wie dit teken van genezing gebeurd was.","23":"En toen zij losgelaten waren, gingen zij naar de hunnen, en verkondigden alles wat de overpriesters en de oudsten tegen hen gezegd hadden.","24":"En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.","25":"Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?","26":"De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.","27":"Want in waarheid zijn tegen Uw heilig Kind Jezus, Die U gezalfd hebt, bijeengekomen, zowel Herodes en Pontius Pilatus, met de heidenen en de volken van Israël;","28":"Om te doen alles wat Uw hand en Uw raad van tevoren bepaald hadden dat zou gebeuren.","29":"En nu dan, Heere, zie op hun dreigingen, en geef Uw dienstknechten met alle vrijmoedigheid Uw woord te spreken;","30":"Doordat U Uw hand uitstrekt tot genezing, en doordat er tekenen en wonderen gebeuren door de Naam van Uw heilig Kind Jezus.","31":"En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.","32":"En de menigte van hen die geloofden, was een van hart en een van ziel; en niemand zei dat iets van wat hij had zijn eigendom was, maar alle dingen waren hun gemeenschappelijk.","33":"En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.","34":"Want er was ook niemand onder hen die gebrek had; want allen die bezitters waren van landen of huizen, verkochten die, en brachten de prijs van het verkochte,","35":"En legden die aan de voeten van de apostelen; en aan ieder werd uitgedeeld naar dat hij nodig had.","36":"En Joses, door de apostelen bijgenaamd Barnabas (dat is vertaald: een zoon van vertroosting), een Leviet, van geboorte uit Cyprus,","37":"Had een akker, verkocht die, en bracht het geld, en legde het aan de voeten van de apostelen."},"SV":{"1":"En terwijl zij tot het volk spraken, kwamen daarover tot hen de priesters, en de hoofdman des tempels, en de Sadduceën;","2":"Zeer ontevreden zijnde, omdat zij het volk leerden, en verkondigden in Jezus de opstanding uit de doden.","3":"En zij sloegen de handen aan hen, en zetten ze in bewaring tot den anderen dag; want het was nu avond.","4":"En velen van degenen, die het woord gehoord hadden, geloofden; en het getal der mannen werd omtrent vijf duizend.","5":"En het geschiedde des anderen daags, dat hun oversten en ouderlingen en Schriftgeleerden te Jeruzalem vergaderden;","6":"En Annas, de hogepriester, en Kajafas, en Johannes, en Alexander, en zovele er van het hogepriesterlijk geslacht waren.","7":"En als zij hen in het midden gesteld hadden, vraagden zij: Door wat kracht, of door wat naam hebt gijlieden dit gedaan?","8":"Toen zeide Petrus, vervuld zijnde met den Heiligen Geest, tot hen: Gij oversten des volks, en gij ouderlingen van Israël!","9":"Alzo wij heden rechterlijk onderzocht worden over de weldaad aan een krank mens *geschied*, waardoor hij gezond geworden is;","10":"Zo zij u allen kennelijk, en het ganse volk Israël, dat door den Naam van Jezus Christus, den Nazarener, Dien gij gekruist hebt, Welken God van de doden heeft opgewekt, door Hem, *zeg* *ik*, staat deze hier voor u gezond.","11":"Deze is de Steen, Die van u, de bouwlieden, veracht is, Welke tot een hoofd des hoeks geworden is.","12":"En de zaligheid is in geen Anderen; want er is ook onder den hemel geen andere Naam, Die onder de mensen gegeven is, door Welken wij moeten zalig worden.","13":"Zij nu, ziende de vrijmoedigheid van Petrus en Johannes, en vernemende, dat zij ongeleerde en slechte mensen waren, verwonderden zich, en kenden hen, dat zij met Jezus geweest waren.","14":"En ziende den mens bij hen staan, die genezen was, hadden zij niets daartegen te zeggen.","15":"En hun geboden hebbende uit te gaan buiten den raad, overlegden zij met elkander,","16":"Zeggende: Wat zullen wij dezen mensen doen? Want dat er een bekend teken door hen geschied is, is openbaar aan allen, die te Jeruzalem wonen, en wij kunnen het niet loochenen.","17":"Maar opdat het niet meer en meer onder het volk verspreid worde, laat ons hen scherpelijk dreigen, dat zij niet meer tot enig mens in dezen Naam spreken.","18":"En als zij hen geroepen hadden, zeiden zij hun aan, dat zij ganselijk niet zouden spreken, noch leren, in den Naam van Jezus.","19":"Maar Petrus en Johannes, antwoordende, zeiden tot hen: Oordeelt gij, of het recht is voor God, ulieden meer te horen dan God.","20":"Want wij kunnen niet laten te spreken, hetgeen wij gezien en gehoord hebben.","21":"Maar zij dreigden hen nog meer, en lieten ze gaan, niets vindende, hoe zij hen straffen zouden, om des volks wil; want zij verheerlijkten allen God over hetgeen er geschied was.","22":"Want de mens was meer dan veertig jaren oud, aan welken dit teken der genezing geschied was.","23":"En zij, losgelaten zijnde, kwamen tot de hunnen, en verkondigden al wat de overpriesters en de ouderlingen tot hen gezegd hadden.","24":"En als dezen *dat* hoorden, hieven zij eendrachtelijk *hun* stem op tot God, en zeiden: Heere! Gij zijt de God, Die gemaakt hebt den hemel, en de aarde, en de zee, en alle dingen, die in dezelve zijn.","25":"Die door den mond van David Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken ijdele dingen bedacht?","26":"De koningen der aarde zijn *te* *zamen* opgestaan, en de oversten zijn bijeenvergaderd tegen den Heere, en tegen Zijn Gezalfde.","27":"Want in der waarheid zijn vergaderd tegen Uw heilig Kind Jezus, Welken Gij gezalfd hebt, beiden Herodes en Pontius Pilatus, met de heidenen en de volken Israëls;","28":"Om te doen al wat Uw hand en Uw raad te voren bepaald had, dat geschieden zou.","29":"En nu *dan*, Heere, zie op hun dreigingen, en geef Uw dienstknechten met alle vrijmoedigheid Uw woord te spreken;","30":"Daarin, dat Gij Uw hand uitstrekt tot genezing, en dat tekenen en wonderen geschieden door den Naam van Uw heilig Kind Jezus.","31":"En als zij gebeden hadden, werd de plaats, in welke zij vergaderd waren, bewogen. En zij werden allen vervuld met den Heiligen Geest, en spraken het Woord Gods met vrijmoedigheid.","32":"En de menigte van degenen, die geloofden, was een hart en *een* ziel; en niemand zeide, dat iets van hetgeen hij had, zijn eigen ware, maar alle dingen waren hun gemeen.","33":"En de apostelen gaven met grote kracht getuigenis van de opstanding van den Heere Jezus; en er was grote genade over hen allen.","34":"Want er was ook niemand onder hen, die gebrek had; want zovelen als er bezitters waren van landen of huizen, die verkochten zij, en brachten den prijs der verkochte *goederen*, en legden *dien* aan de voeten der apostelen.","35":"En aan een iegelijk werd uitgedeeld, naar dat elk van node had.","36":"En Joses, van de apostelen toegenaamd Barnabas ( hetwelk is, overgezet zijnde, een zoon der vertroosting), een Leviet, van geboorte uit Cyprus,","37":"Alzo hij een akker had, verkocht *dien*, en bracht het geld, en legde het aan de voeten der apostelen."},"KJV":{"1":"And as they spake unto the people, the priests, and the captain of the temple, and the Sadducees, came upon them,","2":"Being grieved that they taught the people, and preached through Jesus the resurrection from the dead.","3":"And they laid hands on them, and put *them* in hold unto the next day: for it was now eventide.","4":"Howbeit many of them which heard the word believed; and the number of the men was about five thousand.","5":"And it came to pass on the morrow, that their rulers, and elders, and scribes,","6":"And Annas the high priest, and Caiaphas, and John, and Alexander, and as many as were of the kindred of the high priest, were gathered together at Jerusalem.","7":"And when they had set them in the midst, they asked, By what power, or by what name, have ye done this?","8":"Then Peter, filled with the Holy Ghost, said unto them, Ye rulers of the people, and elders of Israel,","9":"If we this day be examined of the good deed done to the impotent man, by what means he is made whole;","10":"Be it known unto you all, and to all the people of Israel, that by the name of Jesus Christ of Nazareth, whom ye crucified, whom God raised from the dead, *even* by him doth this man stand here before you whole.","11":"This is the stone which was set at nought of you builders, which is become the head of the corner.","12":"Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved.","13":"Now when they saw the boldness of Peter and John, and perceived that they were unlearned and ignorant men, they marvelled; and they took knowledge of them, that they had been with Jesus.","14":"And beholding the man which was healed standing with them, they could say nothing against it.","15":"But when they had commanded them to go aside out of the council, they conferred among themselves,","16":"Saying, What shall we do to these men? for that indeed a notable miracle hath been done by them *is* manifest to all them that dwell in Jerusalem; and we cannot deny","17":"But that it spread no further among the people, let us straitly threaten them, that they speak henceforth to no man in this name.","18":"And they called them, and commanded them not to speak at all nor teach in the name of Jesus.","19":"But Peter and John answered and said unto them, Whether it be right in the sight of God to hearken unto you more than unto God, judge ye.","20":"For we cannot but speak the things which we have seen and heard.","21":"So when they had further threatened them, they let them go, finding nothing how they might punish them, because of the people: for all *men* glorified God for that which was done.","22":"For the man was above forty years old, on whom this miracle of healing was shewed.","23":"And being let go, they went to their own company, and reported all that the chief priests and elders had said unto them.","24":"And when they heard that, they lifted up their voice to God with one accord, and said, Lord, thou *art* God, which hast made heaven, and earth, and the sea, and all that in them is:","25":"Who by the mouth of thy servant David hast said, Why did the heathen rage, and the people imagine vain things?","26":"The kings of the earth stood up, and the rulers were gathered together against the Lord, and against his Christ.","27":"For of a truth against thy holy child Jesus, whom thou hast anointed, both Herod, and Pontius Pilate, with the Gentiles, and the people of Israel, were gathered together,","28":"For to do whatsoever thy hand and thy counsel determined before to be done.","29":"And now, Lord, behold their threatenings: and grant unto thy servants, that with all boldness they may speak thy word,","30":"By stretching forth thine hand to heal; and that signs and wonders may be done by the name of thy holy child Jesus.","31":"And when they had prayed, the place was shaken where they were assembled together; and they were all filled with the Holy Ghost, and they spake the word of God with boldness.","32":"And the multitude of them that believed were of one heart and of one soul: neither said any *of them* that ought of the things which he possessed was his own; but they had all things common.","33":"And with great power gave the apostles witness of the resurrection of the Lord Jesus: and great grace was upon them all.","34":"Neither was there any among them that lacked: for as many as were possessors of lands or houses sold them, and brought the price atchword":"hand en Uw","tekst":"Dat is, Gij zelf, naar uwe macht en wijze besturing."},{"catchword":"te voren bepaald","tekst":"Of, tevoren geschikt, geordineerd, besloten. Zie Act 2:23 ."}],"29":[{"catchword":"zie op hun","tekst":"Namelijk van den hemel, vanwaar Gij alle dingen regeert."},{"catchword":"dienstknechten","tekst":"Namelijk de apostelen; Eph 6:19 ."}],"30":[{"catchword":"Uw hand uitstrekt","tekst":"Dat is, uwe kracht."},{"catchword":"genezing, en","tekst":"Namelijk wonderbare."},{"catchword":"Kind Jezus","tekst":"Zie vs.27."}],"31":[{"catchword":"zij gebeden hadden,","tekst":"Namelijk de apostelen, door welken dit gebed gedaan was."},{"catchword":"bewogen","tekst":"Het Griekse woord betekent eigenlijk op en neder bewogen worden, gelijk de baren van de zee. Met dit wonderteken toonde God dat hun gebed verhoord was."},{"catchword":"vervuld met den","tekst":"Zie vs.8, om het Evangelie vrijmoedig midden in de vervolging te prediken."}],"32":[{"catchword":"een hart en","tekst":"Dat is, zeer grote enigheid, zo in de leer en in het gevoelen, als in de gemoederen en toegenegenheid tot elkander in liefde en vrede."},{"catchword":"zijn eigen ware,","tekst":"Zie hiervan Act 2:44 , en Act 5:4 ."}],"33":[{"catchword":"kracht getuigenis","tekst":"Namelijk om de harten der mensen te bewegen; Rom 1:16 ."},{"catchword":"genade over","tekst":"Dat is, gunst en aangenaamheid bij het volk, hetwelk van hen als van heilige en godzalige lieden veel hield."}],"34":[{"catchword":"aan de voeten","tekst":"Namelijk om van hen uitgedeeld te worden aan de armen, naar eens ieders nood, vs.35."}],"36":[{"catchword":"Joses, van","tekst":"Anders, Jozef."},{"catchword":"der vertroosting),","tekst":"Of, der vermaning; vanwege de bijzondere gaven, die hij had, om de mensen uit Gods Woord te troosten en te vermanen. Zie Act 11:22-24 ."},{"catchword":"een Leviet,","tekst":"Of, een Leviet van geboorte, geslacht, of uitkomst uit Cyprus."},{"catchword":"Cyprus,","tekst":"De Joden waren in alle gewesten der wereld verstrooid, 1Pe 1:1 , en ook in dit eiland, waarvan zie Act 11:19 , en Act 13:4 , en Act 15:39 , en Act 21:3 , en Act 27:4 ."}],"37":[{"catchword":"het geld, en","tekst":"Namelijk dat hij gemaakt had en den verkochten akker."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And while they spake unto the people, there came unto them the Priests, & the Captain of the Temple, [That is, the Governour of the Romane Souldiers, who kept watch before the Temple, to take heed that no inconvenience should arise amongst the great multitude of the people coming daily unto the Temple, See Mat. 27. 65. Luke 22. 4, 52. Acts 5. 24, 26.] and the Sadduces: [of these se Mat. 3. 7.and 22. 23. Acts 23. 8.]"}],"2":[{"catchword":null,"tekst":"Being greatly discontented, because they taught the people, and published Jesus, [Or by or through Jesus, namely, that the same should be done by Jesus: or that Jesus was risen from the dead, as v. 33.and Acts 2. 24.and 3. 15. Or in the name of Jesus] the resurrection from the dead."}],"3":[{"catchword":null,"tekst":"And laid hands on them, and put them in custody, [Namely of certain Souldiers or other officers, without putting them in prison yet, as it seemeth] until the next day. Fir it was now Evening."}],"4":[{"catchword":null,"tekst":"And many of those that had heard the word, [That is, Peters preaching of Christ, Acts 3. 12.] believed, [namely, that Jesus of Nazareth was the true Messias and their Saviour] and the number of the men was about five thousand. [namely, either the three thousand, Acts 2. 41.being reckoned therein, or beside them five thousand more.]"}],"5":[{"catchword":null,"tekst":"And it came to pass the next day, that their Rulers, [These seem to have been the principall heads of the great Council called Sanhedrim, consisting not only of Priests, but also of other principall of the people, especially of Scribes or Laywers. See ver. 15.] and Elders and Scribes gathered together at Jerusalem, [namely, being or being called from other places to Jerusalem.]"}],"6":[{"catchword":null,"tekst":", And Annas the high Priest, [Or this Annas as also of Caiaphas. See Luke 3. 2. Joh 11:49 and 18. 13.] and Caiaphas and John, [This was one of the five sons of Annas, otherwise called also Jonathas. See Joseph.de bell .Jud.lib. 2. Cap.25.] and Alexander of whom Josephus makes mention, Antiq.lib.20.cap.3.because he also was of Jewish parentage: but seeing he was Governour of Judea, therefore it is not likely that he was high Priest] and as many as were of the Family of the high Priset: [which may be understood either of such as were descended from high Priests, or of the chief Priests, that is, of the heads, who were divided into daily orders, 1 Chron. 24. 1. Luk 1:5.]"}],"7":[{"catchword":null,"tekst":"And when they had set them in the midst , [Namely, Peter and John] they asked, by what power, or by what name [that is, by whose authority or command] have ye done this?"}],"8":[{"catchword":null,"tekst":"Then said Peter, being filled with the Holy Ghost, [Namely, with a singular impulse and moving of the holy Ghost] unto them, ye Rulers of the people, and ye elders of Israel [of these Elders see the annotation onv. 5.]"}],"9":[{"catchword":null,"tekst":"Seeing. [Gr.it so be, or if] we are legally examined [or are brought into judgement, sued or judged] concerning the good deed (done) to an in firm man, whereby he i, become whole : [Gr.was saved.]"}],"10":[{"catchword":null,"tekst":"Be it knowable to you all, and to all the people of Israel, that by the name of Jesus Christ of Nazareth, [That is, by the power and authority of Jesus, and by faith in his name, Acts 3. 16.] whom ye have crucified, from whom God hath raised from the dead, by him (I say) [namely, Jesus Christ, or by this, to wit, name of Jesus Christ, Acts 3. 6.] this (man) standeth here before you whole."}],"11":[{"catchword":null,"tekst":"This is the stone [Namely, Jesus of Nazareth] which was despised [Gr.set at nought, i.e.esteemed as nought, or rejected] by you the builders, [that is, by you are appointed to edifie the Church with the saving doctrine of the true Messias] which is become an head of the corner. [that is, the principal corner-stone, whereupon the whole edifice is built, See Isa, 28. 16. Rom. 9.v. 33. 1 Pet. 2. 6.]"}],"12":[{"catchword":null,"tekst":"And salvation is in none other, [That is, by none other] for there is also under heaven [that is, no where in all the world] no other name [that is, no man else, no other person] which ais given, [namely, by , God, John 3. 16.] amongst men, [Gr.in men] by which we must be saved. [Gr.in which.]"}],"13":[{"catchword":null,"tekst":"Now they seeing the boldness of Peter and John, and perceiving that they were unlearned , [Gr.illiterate who had not stayed in the schools] and simple men? [Gr.idiotai. So common men are called who speak only their own mother tongue, who have no learning or authority in the Commonwealth Church, 1 Cor. 14.v. 16. 23, 24.and 2 Cor. 11. 6.] marvelled, and knew them that they had been with Jesus."}],"14":[{"catchword":null,"tekst":"And seeing the man stand by them, [Namely, on on his feet upright, which before he had not been able to do.] who was cured, they had nothing to say against it."}],"15":[{"catchword":null,"tekst":"And having commanded them to go forth, [Gr.to go away: which must not be understood that they were wholly discharged that they might go their way might go their way, but that they were led out of the Council] out of the Council, they reasoned one with another,"}],"16":[{"catchword":null,"tekst":"Saying, what shall we do to these men? For that a notable sign is done by them, [Namely, the miraculous curing of this cripple] is manifest to all that dwell at Jerusalem, and we cannot deny it."}],"17":[{"catchword":null,"tekst":"But that it be not spread more and more among the people, let us sharply threaten them, [Gr.with threatening threaten Hebr.] that they speak no more to any man in this name. [or of this name, i.e. of this Jesus.]"}],"18":[{"catchword":null,"tekst":"And when they had called them, they said unto them, [That is, commanded them] that they should not at all speak nor teach in the name of Jesus. [namely, neither preach of him, nor call him him, nor work miracles in his name.]"}],"19":[{"catchword":null,"tekst":"But Peter and John answering, said unto them judge ye, if it be right before God, [That is, before the face of God, in Gods presence, who knows and judgeth all things] to hear you more then God."}],"20":[{"catchword":null,"tekst":"For we cannot forbear to speak that which we have seen and heard, Namely, seeing we are called of God thereunto, to testifie that which we have heard and seen of Jesus Christ.]"}],"21":[{"catchword":null,"tekst":"But they threatened them yet more, and let them go, finding nothing how they might punish them, [Namely, under any pretext or shew of justice] because of the people , [that us, for fear that the people should make an uproar against them] for they all glorified God for that which was done."}],"22":[{"catchword":null,"tekst":"For the man was more then fourty years old, [And consequently a credible and known man: and who was also harder to be cured, having been a cripple so many years] on whom this sign of healing was done."}],"23":[{"catchword":null,"tekst":"And they being set free, came unto their own, [Namely, unto the other Apostles, v. 29,,30, 31.] and declared all that the chief Preists, and the Elders had said unto them."}],"24":[{"catchword":null,"tekst":"And when these heard (that) they lift up unanimously (their) voice unto God, and said, Lord, [Gr.Despota, which name is principally described to God the Father, as the word Krrios to the Son Jesus Christ. See Luke 2. 29. 2 Pet. 2.1. Jud.v. 4.] thou art the God, who was hast made the heaven and the Earth, and the Sea, and all things which are in the same."}],"25":[{"catchword":null,"tekst":"Who by the mouth of thy servant David, [Or of thy child, see v. 27.] hath said, why do the Heathen rage? [Gr.neigh, as metteld horses when they go to battle] and )why) have the people thought vain things?"}],"26":[{"catchword":null,"tekst":"The Kings of the Earth are risen up (together,) and the Rulers are gathered together against the Lord and against his anointed."}],"27":[{"catchword":null,"tekst":"For in truth, [That is, publickly and visibly] there were gathered together against thy holy child Jesus [or servant, minister, See Acts 3. 13, 26. See also Mat. 8. 6.compared with Luke 7. 2.and here v. 25.] whom thou hast anointed, [namely with the Holy Ghost, for the supream Priest, Prophet and King of the Church] both Herod and Pontius Pilate; with the Gentiles and the people of Israel: [although the Israelites were but one people; yet nevertheless they are called peoples in the plural number, because they were divided into twelve tribes, Gen 28. 3.and 48. 4.]"}],"28":[{"catchword":null,"tekst":"To do all, [This must be understood not in respect of their intention, as if they had intended to execute the counsel of God: but in respect of the issue of the business, which so fel out like as God had concluded in his counsel] that thy hand, [that is, thy self according to thy power and wise ordering] and thy counsel had before determined, [or before disposed, ordained, concluded, See Acts 2. 23.] that should come to pass."}],"29":[{"catchword":null,"tekst":"And now (therefore) Lord, look on their threatening, [Namely, from heaven, from whence thou governest all things] and give thy servants, [namely, the Apostles, Ephes. 6. 19.] to speak thy word with all boldness."}],"30":[{"catchword":null,"tekst":"Therein that thou stretch forth thy hand, [That is, thy power] for healing, [namely, miraculous] and that signs and wonders may be done, through the name of thy holy child Jesus. [see v. 27.]"}],"31":[{"catchword":null,"tekst":"And when they had prayed, [Namely, the Apostles by whom this prayer was made] the place in which they were gathered together was moved. [the Greek word properly signifies to be moved up and down like the waves of the Sea. By this miracle God shewed that their prayer was heard] and they were all filled with the Holy Ghost: [See v.8.to preach the Gospel boldly in the midst of persecution] and spake the word of God with boldness."}],"32":[{"catchword":null,"tekst":"And of the multitude of those that believed there was one heart and (one) soul; [That is, very great unity, aswell in doctrine and opinion, as in minds and inclinations one towards one towards another in love and peace] and no man said that ought of that which he had was his own; [See hereof, Acts 2. 44.and 5.4.] but all things were common to them."}],"33":[{"catchword":null,"tekst":"And the Apostles with great power, [Namely, to move the hearts of men, Rom. 1. 16.] gave testimony of the resurrection of the Lord Jesus: and there was great grace, [that is, favour and acceptation with the people, who esteemed much of them as of holy and ungodly persons] upon them all."}],"34":[{"catchword":null,"tekst":"For neither was there any man amongst them that had lack. For as many as were possessours of Lands or Houses, they sold them, and brought the price of the sold (good) and laid (it) at the feet of the Apostles. [Namely, to be distributed by them to the poor according to every ones need, v. 35.]"}],"35":[{"catchword":null,"tekst":"And it was distributed to every one, according as each had need."}],"36":[{"catchword":null,"tekst":"And Joses [Otherwise, Joseph] by the Apostles sirnamed Barnabas (which is being interpreted a son of consolation) [or of exhortation, by reason of the singular gifts which he had, to comfort and exhort men out of Gods word. See Acts 11.v. 22, 23, 24.] a Levite, [or a Levite by birth, generation or descent of Cyprus] by birth of Cyprus. [Jews were scattered into all quarters of the world, 1 Pet. 1. 1.and also into this Island, whereof see Acts 11. 19.and chap.13. 4.and 15. 39.and 21. 3.and 27. 4.]"}],"37":[{"catchword":null,"tekst":"He having a field sold (it) and brought the money, [Namely that he had made of the field he had sold] and laid it at the Apostles feet."}]}}};

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));

    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
