n bevestigd in het geloof, en werden dagelijks talrijker in aantal.","6":"En toen zij Frygië en het land Galatië doorgereisd hadden, werden zij door de Heilige Geest verhinderd het Woord in Azië te spreken.","7":"En toen zij bij Mysië gekomen waren, probeerden zij naar Bithynië te reizen; maar de Geest liet het hun niet toe.","8":"En zij reisden Mysië voorbij en kwamen af naar Troas.","9":"En in de nacht kreeg Paulus een visioen te zien: er stond een Macedonische man, die hem smeekte en zei: Kom over naar Macedonië, en help ons.","10":"Toen hij nu dit visioen gezien had, zochten wij meteen naar Macedonië te reizen, omdat wij daaruit opmaakten dat de Heere ons geroepen had om hun het Evangelie te verkondigen.","11":"Van Troas dan vertrokken, voeren wij recht naar Samothrace, en de volgende *dag* naar Neapolis.","12":"En van daar naar Filippi, wat de eerste stad is van dit deel van Macedonië, een kolonie. En wij bleven in die stad enkele dagen.","13":"En op de dag van de sabbat gingen wij de stad uit, naar de rivier, waar men gewoonlijk bad; en wij gingen zitten en spraken tot de vrouwen die daar samengekomen waren.","14":"En een zekere vrouw, met de naam Lydia, een purperverkoopster uit de stad Thyatira, die God diende, hoorde *ons*; haar hart heeft de Heere geopend, zodat zij acht gaf op wat door Paulus gesproken werd.","15":"En toen zij gedoopt was, en haar huis, smeekte zij ons: Als u geoordeeld hebt dat ik de Heere trouw ben, kom dan in mijn huis en blijf daar. En zij drong er sterk op aan.","16":"En het gebeurde, toen wij naar het gebed gingen, dat een zekere dienstmeisje, dat een waarzeggende geest had, ons tegemoet kwam; zij bracht haar heren veel *van het* gewin met waarzeggen.","17":"Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen.","18":"En dit deed zij vele dagen lang. Maar Paulus, die daarover geërgerd was, keerde zich om en zei tegen de geest: Ik gebied u in de Naam van Jezus Christus dat u van haar uitgaat. En hij ging uit op datzelfde moment.","19":"Toen de heren van haar nu zagen dat de hoop op hun gewin weg was, grepen zij Paulus en Silas, en sleepten hen naar de markt, voor de leiders.","20":"En toen zij hen tot de aanvoerders gebracht hadden, zeiden zij: Deze mensen brengen onze stad in opschudding, omdat zij Joden zijn.","21":"En zij verkondigen gewoonten die wij niet mogen aannemen, noch mogen navolgen, omdat wij Romeinen zijn.","22":"En de menigte kwam gezamenlijk tegen hen in opstand; en de aanvoerders scheurden hun de kleren af en gaven bevel hen te geselen.","23":"En toen zij hun veel slagen gegeven hadden, wierpen zij hen in de gevangenis, en gaven de stokbewaarder het bevel hen zorgvuldig te bewaken.","24":"Deze, zo'n bevel ontvangen hebbend, wierp hen in de binnenste kerker, en zette hun voeten vast in het blok.","25":"En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.","26":"En er gebeurde plotseling een grote aardbeving, zodat de fundamenten van de kerker schudden; en meteen gingen alle deuren open, en de boeien van allen raakten los.","27":"En de stokbewaarder, wakker geworden en ziende dat de deuren van de gevangenis geopend waren, trok een zwaard en wilde zichzelf ombrengen, omdat hij dacht dat de gevangenen ontvlucht waren.","28":"Maar Paulus riep met luide stem: Doe uzelf geen kwaad; want wij zijn allemaal hier.","29":"En hij vroeg om licht, sprong naar binnen, en begon hevig te beven, en viel voor Paulus en Silas neer *aan hun voeten*;","30":"En hij bracht hen naar buiten en zei: *Beste* heren, wat moet ik doen om zalig te worden?","31":"En zij zeiden: Geloof in de Heere Jezus Christus, en u zult zalig worden, u en uw huis.","32":"En zij spraken tot hem het woord van de Heere, en tot allen die in zijn huis waren.","33":"En hij nam hen op datzelfde uur van de nacht mee, en waste hun striemen; en hij werd meteen gedoopt, en al de zijnen.","34":"En hij bracht hen in zijn huis, en zette hun de tafel voor, en verheugde zich dat hij met heel zijn huis gelovig geworden was in God.","35":"En toen het dag geworden was, stuurden de aanvoerders de gerechtsdienaars, die zeiden: Laat die mensen vrij.","36":"En de stokbewaarder bracht deze woorden aan Paulus over: De aanvoerders hebben gestuurd dat u vrijgelaten moet worden; ga er dan nu uit, en trek weg in vrede.","37":"Maar Paulus zei tegen hen: Zij hebben ons, die Romeinen zijn, zonder vonnis in het openbaar gegeseld en in de gevangenis geworpen, en werpen zij ons er nu heimelijk uit? Nee, zeker niet; maar laat zij zelf komen en ons naar buiten leiden.","38":"En de gerechtsdienaars brachten deze woorden over aan de aanvoerders; en zij werden bang, toen zij hoorden dat zij Romeinen waren.","39":"En zij kwamen en verzochten hen, en leidden hen naar buiten, en vroegen hen dringend of zij uit de stad wilden vertrekken.","40":"En zij gingen weg uit de gevangenis, en gingen naar Lydia; en toen zij de broeders gezien hadden, bemoedigden zij hen, en vertrokken *uit de stad*."},"SV":{"1":"En hij kwam te Derbe en Lystre. En ziet, aldaar was een zeker discipel, met name Timotheüs, zoon van een gelovige Joodse vrouw, maar van een Grieksen vader;","2":"Welken *goeden* getuigenis gegeven werd van de broederen te Lystre en Ikonium.","3":"Deze wilde Paulus, dat met hem zou reizen; en hij nam en besneed hem, om der Joden wil, die in die plaatsen waren; want zij kenden allen zijn vader, dat hij een Griek was.","4":"En alzo zij de steden doorreisden, gaven zij hun de verordeningen over, die van de apostelen en de ouderlingen te Jeruzalem goed gevonden waren, om *die* te onderhouden.","5":"De Gemeenten dan werden bevestigd in het geloof, en werden dagelijks overvloediger in getal.","6":"En als zij Frygië, en het land van Galatië doorgereisd hadden, werden zij van den Heiligen Geest verhinderd het Woord in Azië te spreken.","7":"*En* aan Mysië gekomen zijnde, poogden zij naar Bithynië te reizen; en de Geest liet het hun niet toe.","8":"En zij, Mysië voorbij gereisd zijnde, kwamen af tot Troas.","9":"En van Paulus werd in den nacht een gezicht gezien: er was een Macedonisch man staande, die hem bad en zeide: Kom over in Macedonië, en help ons.","10":"Als hij nu dit gezicht gezien had, zo zochten wij terstond naar Macedonië te reizen, besluitende *daaruit*, dat ons de Heere geroepen had, om denzelven het Evangelie te verkondigen.","11":"Van Troas dan afgevaren zijnde, liepen wij recht naar Samothrace, en den volgende *dag* naar Neapolis.","12":"En van daar naar Filippi, welke is de eerste stad van dit deel van Macedonië, een kolonie. En wij onthielden ons in die stad ettelijke dagen.","13":"En op den dag des sabbats gingen wij buiten de stad aan de rivier, waar het gebed placht te geschieden; en nedergezeten zijnde, spraken wij tot de vrouwen, die samengekomen waren.","14":"En een zekere vrouw, met name Lydia, een purperverkoopster, van de stad Thyatira, die God diende, hoorde *ons*; welker hart de Heere heeft geopend, dat zij acht nam op hetgeen van Paulus gesproken werd.","15":"En als zij gedoopt was, en haar huis, bad zij *ons*, zeggende: Indien gij hebt geoordeeld, dat ik den Heere getrouw ben, zo komt in mijn huis, en blijft er. En zij dwong ons.","16":"En het geschiedde, als wij tot het gebed heengingen, dat een zekere dienstmaagd, hebbende een waarzeggenden geest, ons ontmoette, welke haar heren groot gewin toebracht met waarzeggen.","17":"Dezelve volgde Paulus en ons achterna, en riep, zeggende: Deze mensen zijn dienstknechten Gods des Allerhoogsten, die ons den weg der zaligheid verkondigen.","18":"En dit deed zij vele dagen lang. Maar Paulus, *daarover* ontevreden zijnde, keerde zich om, en zeide tot den geest: Ik gebied u in den Naam van Jezus Christus, dat gij van haar uitgaat. En hij ging uit ter zelfder ure.","19":"Als nu de heren van dezelve zagen, dat de hoop huns gewins weg was, grepen zij Paulus en Silas, en trokken hen naar de markt voor de oversten.","20":"En als zij hen tot de hoofdmannen gebracht hadden, zeiden zij: Deze mensen beroeren onze stad, daar zij Joden zijn.","21":"En zij verkondigen zeden, die ons niet geoorloofd zijn aan te nemen noch te doen, alzo wij Romeinen zijn.","22":"En de schare stond gezamenlijk tegen hen op; en de hoofdmannen, hun de klederen afgescheurd hebbende, bevalen hen te geselen.","23":"En als zij hun vele slagen gegeven hadden, wierpen zij hen in de gevangenis, en geboden den stokbewaarder, dat hij hen zekerlijk bewaren zou.","24":"Dewelke, zulk een gebod ontvangen hebbende, wierp hen in den binnensten kerker, en verzekerde hun voeten in de stok.","25":"En omtrent den middernacht baden Paulus en Silas, en zongen Gode lofzangen en de gevangenen hoorden naar hen.","26":"En er geschiedde snellijk een grote aardbeving, alzo dat de fundamenten des kerkers bewogen werden; en terstond werden al de deuren geopend, en de banden van allen werden los.","27":"En de stokbewaarder, wakker geworden zijnde, en ziende de deuren der gevangenis geopend, trok een zwaard, en zou zichzelven omgebracht hebben, menende, dat de gevangenen ontvloden waren.","28":"Maar Paulus riep met grote stem, zeggende: Doe uzelven geen kwaad; want wij zijn allen hier.","29":"En als hij licht geëist had, sprong hij in, en werd zeer bevende, en viel voor Paulus en Silas neder *aan* *de* *voeten*;","30":"En hen buiten gebracht hebbende, zeide hij: *Lieve* heren, wat moet ik doen, opdat ik zalig worde?","31":"En zij zeiden: Geloof in den Heere Jezus Christus, en gij zult zalig worden, gij en uw huis.","32":"En zij spraken tot hem het woord des Heeren, en tot allen, die in zijn huis waren.","33":"En hij nam hen tot zich in dezelve ure des nachts, en wies *hen* van de striemen; en hij werd terstond gedoopt, en al de zijnen.","34":"En hij bracht hen in zijn huis, en zette *hun* de tafel voor, en verheugde zich, dat hij met al zijn huis aan God gelovig geworden was.","35":"En als het dag geworden was, zonden de hoofdmannen de stadsdienaars, zeggende: Laat die mensen los.","36":"En de stokbewaarder boodschapte deze woorden aan Paulus, *zeggende*: De hoofdmannen hebben gezonden, dat gij zoudt losgelaten worden; gaat dan nu uit, en reist heen in vrede.","37":"Maar Paulus zeide tot hen: Zij hebben ons, die Romeinen zijn, onveroordeeld in het openbaar gegeseld, en in de gevangenis geworpen, en werpen zij zij ons nu heimelijk daaruit? Niet alzo; maar dat zij zelven komen, en ons uitleiden.","38":"En de stadsdienaars boodschapten deze woorden wederom den hoofdmannen; en zij werden bevreesd, horende, dat zij Romeinen waren.","39":"En zij, komende, baden hen, en als zij hen uitgeleid hadden, begeerden zij, dat zij uit de stad gaan zouden.","40":"En uitgegaan zijnde uit de gevangenis, gingen zij in tot Lydia; en de broeders gezien hebbende, vertroostten zij dezelve, en gingen uit *de* *stad*."},"KJV":{"1":"Then came he to Derbe and Lystra: and, behold, a certain disciple was there, named Timotheus, the son of a certain woman, which was a Jewess, and believed; but his father *was* a Greek:","2":"Which was well reported of by the brethren that were at Lystra and Iconium.","3":"Him would Paul have to go forth with him; and took and circumcised him because of the Jews which were in those quarters: for they knew all that his father was a Greek.","4":"And as they went through the cities, they delivered them the decrees for to keep, that were ordained of the apostles and elders which were at Jerusalem.","5":"And so were the churches established in the faith, and increased in number daily.","6":"Now when they had gone throughout Phrygia and the region of Galatia, and were forbidden of the Holy Ghost to preach the word in Asia,","7":"After they were come to Mysia, they assayed to go into Bithynia: but the Spirit suffered them not.","8":"And they passing by Mysia came down to Troas.","9":"And a vision appeared to Paul in the night; There stood a man of Macedonia, and prayed him, saying, Come over into Macedonia, and help us.","10":"And after he had seen the vision, immediately we endeavoured to go into Macedonia, assuredly gathering that the Lord had called us for to preach the gospel unto them.","11":"Therefore loosing from Troas, we came with a straight course to Samothracia, and the next *day* to Neapolis;","12":"And from thence to Philippi, which is the chief city of that part of Macedonia, *and* a colony: and we were in that city abiding certain days.","13":"And on the sabbath we went out of the city by a river side, where prayer was wont to be made; and we sat down, and spake unto the women which resorted","14":"And a certain woman named Lydia, a seller of purple, of the city of Thyatira, which worshipped God, heard *us*: whose heart the Lord opened, that she attended unto the things which were spoken of Paul.","15":"And when she was baptized, and her household, she besought *us*, saying, If ye have judged me to be faithful to the Lord, come into my house, and abide *there*. And she constrained us.","16":"And it came to pass, as we went to prayer, a certain damsel possessed with a spirit of divination met us, which brought her masters much gain by soothsaying:","17":"The same followed Paul and us, and cried, saying, These men are the servants of the most high God, which shew unto us the way of salvation.","18":"And this did she many days. But Paul, being grieved, turned and said to the spirit, I command thee in the name of Jesus Christ to come out of her. And he came out the same hour.","19":"And when her masters saw that the hope of their gains was gone, they caught Paul and Silas, and drew *them* into the marketplace unto the rulers,","20":"And brought them to the magistrates, saying, These men, being Jews, do exceedingly trouble our city,","21":"And teach customs, which are not lawful for us to receive, neither to observe, being Romans.","22":"And the multitude rose up together against them: and the magistrates rent off their clothes, and commanded to beat","23":"And when they had laid many stripes upon them, they cast *them* into prison, charging the jailor to keep them safely:","24":"Who, having received such a charge, thrust them into the inner prison, and made their feet fast in the stocks.","25":"And at midnight Paul and Silas prayed, and sang praises unto God: and the prisoners heard them.","26":"And suddenly there was a great earthquake, so that the foundations of the prison were shaken: and immediately all the doors were opened, and every one's bands were loosed.","27":"And the keeper of the prison awaking out of his sleep, and seeing the prison doors open, he drew out his sword, and would have killed himself, supposing that the prisoners had been fled.","28":"But Paul cried with a loud voice, saying, Do thyself no harm: for we are all here.","29":"Then he called for a light, and sprang in, and came trembling, and fell down before Paul and Silas,","30":"And brought them out, and said, Sirs, what must I do to be saved?","31":"And they said, Believe on the Lord Jesus Christ, and thou shalt be saved, and thy house.","32":"And they spake unto him the word of the Lord, and to all that were in his house.","33":"And he took them the same hour of the night, and washed *their* stripes; and was baptized, he and all his, straightway.","34":"And when he had brought them into his house, he set meat before them, and rejoiced, believing in God with all his house.","35":"And when it was day, the magistrates sent the serjeants, saying, Let those men go.","36":"And the keeper of the prison told this saying to Paul, The magistrates have sent to let you go: now therefore depart, and go in peace.","37":"But Paul said unto them, They have beaten us openly uncondemned, being Romans, and have cast *us* into prison; and now do they thrust us out privily? nay verily; but let them come themselves and fetch us out.","38":"And the serjeants told these words unto the magistrates: and they feared, when they heard that they were Romans.","39":"And they came and besought them, and brought *them* out, and desired *them* to depart out of the city.","40":"And they went out of the prison, and entered into *the house of* Lydia: and when they had seen the brethren, they comforted them, and departed."}},"tsk":{"1":[{"kopje":"Derbe","refs":["Hand 14:6","Hand 14:21","2 Tim 3:11"]},{"kopje":"met de naam","refs":["Hand 17:14","Hand 18:5","Hand 19:22","Hand 20:4","Hand 20:5","Rom 16:21","1 Kor 4:17","Fil 1:1","Fil 2:19","Kol 1:1","1 Tess 1:1","1 Tess 3:2","2 Tess 1:1","1 Tim 1:2","2 Tim 1:2","Hebr 13:23"]},{"kopje":"de","refs":["2 Tim 1:5","2 Tim 3:15","2 Tim 3:16"]},{"kopje":"maar","refs":["Hand 14:1","Ezra 9:2","1 Kor 7:14"]}],"2":[{"kopje":"had","refs":["Hand 6:3","1 Tim 3:7","1 Tim 5:10","1 Tim 5:25","2 Tim 3:15","Hebr 11:2"]},{"kopje":"Ikonium","refs":["Hand 14:21","2 Tim 3:11"]}],"3":[{"kopje":"wilde","refs":["Hand 15:37","Hand 15:40"]},{"kopje":"en besneed","refs":["Hand 15:20","1 Kor 7:19","1 Kor 9:20","Gal 2:3","Gal 2:8","Gal 5:1-3","Gal 5:6"]}],"4":[{"kopje":"gaven zij","refs":["Hand 15:6","Hand 15:28","Hand 15:29"]}],"5":[{"kopje":"dan","refs":["Hand 15:41","2 Kron 20:20","Jes 7:9","Rom 16:25","1 Kor 15:58","Gal 5:1","Ef 4:13-16","Kol 2:6","1 Tess 3:2","1 Tess 3:13","2 Tess 2:16","Hebr 13:9","Hebr 13:20","Hebr 13:21","1 Petr 5:10"]},{"kopje":"talrijker","refs":["Hand 2:47","Hand 4:4","Hand 5:14","Hand 6:7","Hand 9:31","Hand 11:21","Hand 12:24","Hand 13:48","Hand 13:49","Hand 19:18-21"]}],"6":[{"kopje":"Frygië","refs":["Hand 2:10","Hand 18:23"]},{"kopje":"land","refs":["Hand 18:23","1 Kor 16:1","Gal 1:2","Gal 3:1","2 Tim 4:10","1 Petr 1:1"]},{"kopje":"verhinderd","refs":["Hand 16:7","Hand 10:19","Hand 11:12","Hand 13:2-4","Hand 20:28","2 Kron 6:7-9","Jes 30:21","Amos 8:11","Amos 8:12","1 Kor 12:11","Hebr 11:8"]},{"kopje":"Azië","refs":["Hand 19:10","Hand 19:26","Hand 19:27","Hand 20:4","Hand 20:16","2 Kor 1:8","2 Tim 1:15","1 Petr 1:1","Openb 1:4","Openb 1:11"]}],"7":[{"kopje": =\"G3972\">Paul</span> <span class=\"wl wl-kjv\" data-code=\"G5346\">said</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them,</span> They have <span class=\"wl wl-kjv\" data-code=\"G1194\">beaten</span> <span class=\"wl wl-kjv\" data-code=\"G2248\">us</span> <span class=\"wl wl-kjv\" data-code=\"G1219\">openly</span> <span class=\"wl wl-kjv\" data-code=\"G178\">uncondemned,</span> <span class=\"wl wl-kjv\" data-code=\"G5225\">being</span> <span class=\"wl wl-kjv\" data-code=\"G4514\">Romans,</span> and have <span class=\"wl wl-kjv\" data-code=\"G906\">cast</span> us <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> <span class=\"wl wl-kjv\" data-code=\"G5438\">prison;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3568\">now</span> do they <span class=\"wl wl-kjv\" data-code=\"G1544\">thrust</span> <span class=\"wl wl-kjv\" data-code=\"G2248\">us</span> <span class=\"wl wl-kjv\" data-code=\"G1544\">out</span> <span class=\"wl wl-kjv\" data-code=\"G2977\">privily?</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">nay</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">verily;</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> let them <span class=\"wl wl-kjv\" data-code=\"G2064\">come</span> <span class=\"wl wl-kjv\" data-code=\"G846\">themselves</span> and <span class=\"wl wl-kjv\" data-code=\"G1806\">fetch</span> <span class=\"wl wl-kjv\" data-code=\"G2248\">us</span> out.","38":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G4465\">serjeants</span> <span class=\"wl wl-kjv\" data-code=\"G312\">told</span> <span class=\"wl wl-kjv\" data-code=\"G5023\">these</span> <span class=\"wl wl-kjv\" data-code=\"G4487\">words</span> unto the <span class=\"wl wl-kjv\" data-code=\"G4755\">magistrates:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> they <span class=\"wl wl-kjv\" data-code=\"G5399\">feared,</span> when they <span class=\"wl wl-kjv\" data-code=\"G191\">heard</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> they <span class=\"wl wl-kjv\" data-code=\"G1526\">were</span> Romans.","39":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> they <span class=\"wl wl-kjv\" data-code=\"G2064\">came</span> and <span class=\"wl wl-kjv\" data-code=\"G3870\">besought</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> brought them <span class=\"wl wl-kjv\" data-code=\"G1806\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"G2065\">desired</span> them to depart <span class=\"wl wl-kjv\" data-code=\"G1831\">out</span> of the city.","40":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> they <span class=\"wl wl-kjv\" data-code=\"G1831\">went</span> out <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G5438\">prison,</span> and <span class=\"wl wl-kjv\" data-code=\"G1525\">entered</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> the house of <span class=\"wl wl-kjv\" data-code=\"G3070\">Lydia:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> when they had <span class=\"wl wl-kjv\" data-code=\"G1492\">seen</span> the <span class=\"wl wl-kjv\" data-code=\"G80\">brethren,</span> they <span class=\"wl wl-kjv\" data-code=\"G3870\">comforted</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> departed."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Derbe en","tekst":"Van dezen steden zie Act 14:6 ."},{"catchword":"Timótheüs","tekst":"Van dezen Timotheus, zie breder Act 17:14 , en Act 19:22 , en Act 20:4 ; Rom 16:21 ; 1Co 4:17 ; Phi 2:19 ; 1Th 3:2 , en voornamelijk 1Ti 1:2 ."},{"catchword":"gelovige Joodse","tekst":"Dat is, die bekeerd was tot het Christengeloof."},{"catchword":"vrouw, maar","tekst":"Namelijk genaamd Eunice. Zie van haar, alsook van zijne grootmoeder Loide, 2Ti 1:5 ."},{"catchword":"Grieksen vader;","tekst":"Grieks van een vader een Griek; dat is van Griekse en heidense afkomst en religie; hetwelk de oorzaak was dat Timotheus niet was besneden."}],"2":[{"catchword":"getuigenis gegeven","tekst":"Namelijk van godzaligheid en ervarenheid in de Heilige Schrift; 2Ti 3:15 ."}],"3":[{"catchword":"reizen; en hij","tekst":"Grieks uitgaan."},{"catchword":"om der Joden wil,","tekst":"Namelijk opdat de zwakgelovige Joden zijn dienst niet zouden verwerpen omdat hij onbesneden was. Want zij verstonden nog niet dat de besnijdenis nu afgedaan was en haar einde genomen had. En alzo gebruikt Paulus de besnijdenis hier als een middelmatige zaak, hoedanige altijd tot stichting der zwakken en zonder aanstoot moeten gebruikt worden; 1Co 9:19 . Doch als hij te doen gehad heeft niet met zwakken, maar met hardnekkige Joden, die de besnijdenis drongen als nog nodig ter zaligheid, zo heeft hij om hunnentwil Titus niet willen laten besnijden. Zie Gal 2:3 ."},{"catchword":"dat hij een Griek was","tekst":"En dat overzulks Timotheus zijn zoon niet besneden was."}],"4":[{"catchword":"de verordeningen","tekst":"Grieks dogmata; dat is, meningen, goedachtingen; van welke zie Act 15:20 ."},{"catchword":"goed gevonden","tekst":"Grieks geoordeeld, of besloten."}],"5":[{"catchword":"geloof, en","tekst":"Namelijk zo in het bijzonder van de Christelijke vrijheid en het gebruik derzelve, als in het algemeen van alle andere stukken des geloofs."}],"6":[{"catchword":"Frygië","tekst":"Een landschap in Klein-Azië, tussen Mysië, Galatië en Lycaonië."},{"catchword":"Galatië","tekst":"Een landschap in Klein-Azië, waarvan zie Gal 1:2 ."},{"catchword":"van den Heiligen","tekst":"Dat is, door een innerlijke aanspraak Gods door zijnen Geest."},{"catchword":"verhinderd het","tekst":"Namelijk voor dien tijd; want namaals heeft Paulus aldaar het woord des Evangelies omtrent twee jaren lang gepredikt; zie Act 19:10 , alzo heeft de Heilige Geest den apostelen voorgeschreven, wat orde zij zouden houden in het reizen en het Woord te prediken, het ene volk voor en het andere na."},{"catchword":"Azië","tekst":"Dit was het derde deel van de bewoonde en toen bekende wereld, waarvan Europa en Afrika de twee andere delen waren. Hoewel het hier schijnt genomen te worden voor Klein-Azië."}],"7":[{"catchword":"Mysië","tekst":"Een landschap in Klein-Azië, tussen Troas en Frygië."},{"catchword":"Bithynië","tekst":"Een landschap, gelegen dicht bij Troas tegenover Thracië, strekkende aan Pontus Euxinus, of de Zwarte zee."},{"catchword":"de Geest","tekst":"Namelijk Jezus, hetwelk in vele oude boeken daarbij staat."},{"catchword":"liet het hun","tekst":"Zie de aantekeningen op vs.6."}],"8":[{"catchword":"Tróas","tekst":"Met dezen naam wordt genaamd een gehele landstreek, waar eertijds oud Troje gestaan heeft, anders genaamd Klein-Frygië, en ook ene stad in dezelfde landstreek, die ook Antigonië en Alexandrië genaamd is geweest, van welke hier gesproken wordt. Zie Act 20:6 ; 2Co 2:12 ; 2Ti 4:13 ."}],"9":[{"catchword":"Macedónië,","tekst":"Dit was een groot landschap in Europa, tussen Epirus en Thracië, strekkende zich aan de ene zijde aan de Egeïse zee, nu genaamd Archipelago."},{"catchword":"help ons","tekst":"Namelijk naar de ziel met de predikatie des Evangelies."}],"10":[{"catchword":"wij terstond naar","tekst":"Daaruit blijkt, dat Lukas toen in het gezelschap des apostels was. Zie ook Col 4:14 ; Phm 1:24 ."},{"catchword":"besluitende daaruit,","tekst":"Van de betekenissen van dit woord zie Act 9:22 ."}],"11":[{"catchword":"Samothráce,","tekst":"Een eiland in de Egeïse zee, dicht bij het vaste land van Tracië, alzo genaamd omdat het bewoond werd, eensdeels door inwoners uit Thracië en eensdeels uit Samos gesproten."},{"catchword":"Neápolis","tekst":"Eene stad, gelegen op de grenzen van Thracië en Macedonië, niet ver van Filippi, tegenover het eiland Thasus."}],"12":[{"catchword":"Filippi","tekst":"Deze stad was eertijds Dathos genaamd, en daarna Filippi vernaamd, van Filippus, koning van Macedonië, die dezelve, vervallen zijnde, wederom heeft opgebouwd. Zie Phi 1:1 ."},{"catchword":"de eerste stad","tekst":"Namelijk als men van Samothrace naar Macedonië overscheept."},{"catchword":"een kolonie","tekst":"Zo werden in het Latijn genaamd de steden, die van de Romeinen òf gebouwd, òf met Romeinse inwoners beplant en bezet werden, om het land daaromtrent te bouwen, en de grenzen van het Romeinse rijk te verzekeren; waarvan de stad Keulen ook nog haren naam heeft. Zie vs.21."}],"13":[{"catchword":"het gebed placht","tekst":"Namelijk het algemeen gebed der Joden. Of waar een bedehuis, of synagoge der Joden was; en daaruit schijnt dat de heidenen aldaar den Joden in hunne stad zulks niet hebben willen toelaten."},{"catchword":"vrouwen, die","tekst":"Namelijk Joodse vrouwen, welker getal aldaar het meeste schijnt geweest te zijn."}],"14":[{"catchword":"van de stad Thyatira,","tekst":"Namelijk geboortig. Deze stad lag aan de grenzen van de landschappen van Lydië en Mysië. Zie van dezelve Rev 2:18 ."},{"catchword":"welker hart de","tekst":"Namelijk door de kracht zijns Heiligen Geestes hun verstand verlichtende en hunnen wil neigende tot gehoorzaamheid des geloofs."},{"catchword":"acht nam op","tekst":"Of, haar hield aan hetgeen, enz."}],"15":[{"catchword":"huis, bad","tekst":"Dat is, ganse huisgezin."},{"catchword":"den Heere getrouw","tekst":"Of, aan den Heere; namelijk Christus gelovig ben."},{"catchword":"blijft er","tekst":"Dat is, logeer er, zolang gij hier zult zijn."},{"catchword":"dwong ons","tekst":"Namelijk met vriendelijk bidden en aanhouden."}],"16":[{"catchword":"tot het gebed","tekst":"Dat is, tot de plaats, waar men het gebed deed; of tot het bedehuis."},{"catchword":"dienstmaagd,","tekst":"Grieks Paidiske; hetwelk in het algemeen een meisje betekent, Act 12:13 , maar hier ene dienstmaagd of slavin, want er wordt van hare heren gesproken, vs.19."},{"catchword":"een waarzeggenden","tekst":"Grieks een geest van Python; met welken naam de waarzeggende geest Apollo, bij de heidenen genaamd werd, van de stad Pytho, die daarna Delfi genaamd is, alwaar hij een tempel had en zijne waarzeggingen meest deed. En alzo werden ook genaamd allerlei waarzeggende boze geesten, die gemeenlijk den mensen, die hun raad vraagden, antwoord gaven; 1Sa 28:7 ."}],"17":[{"catchword":"Deze mensen zijn","tekst":"Hoewel deze onreine geest daaraan de waarheid zeide, zo heeft hij nochtans daarmede voorgehad de leer der apostelen verdacht te maken. Zie dergelijke Mar 1:24 ; Luk 4:41 ."},{"catchword":"ons den weg","tekst":"Anders, ulieden."}],"18":[{"catchword":"ontevreden zijnde,","tekst":"Of, moeilijk zijnde; zo over de ellende van dit meisje als over de bedriegerij des Satans, waardoor de arme mensen verleid werden. Zie Mar 1:25 ."},{"catchword":"van haar uitgaat","tekst":"Namelijk van deze dienstmaagd."}],"19":[{"catchword":"de heren van","tekst":"Wier slavin zij was."},{"catchword":"weg was, grepen","tekst":"Grieks uitgegaan was; gelijk als met dezen onreinen geest."},{"catchword":"de markt voor","tekst":"Of, gerichtplaats."},{"catchword":"de oversten","tekst":"Deze werden in de koloniën van de Romeinen genaamd Decuriones."}],"20":[{"catchword":"de hoofdmannen","tekst":"Grieks Strategoi; die van de Romeinen Duumviri genoemd werden en in de koloniën het opperste gezag hadden."},{"catchword":"Joden zijn","tekst":"De naam van Joden was zeer gehaat onder de heidenen."}],"21":[{"catchword":"zeden, die ons","tekst":"Dat is, wijzen om God te dienen, andere dan de Romeinen en heidenen hadden."}],"22":[{"catchword":"hun de klederen","tekst":"Namelijk den apostel en Silas."},{"catchword":"geselen","tekst":"Of, met roeden slaan."}],"23":[{"catchword":"gegeven hadden,","tekst":"Grieks opgelegd."},{"catchword":"stokbewaarder,","tekst":"Grieks bewaarder der gevangenen; cipier."},{"catchword":"zekerlijk bewaren","tekst":"Dat is, in goede verzekering, striktelijk."}],"24":[{"catchword":"stok","tekst":"Grieks in het hout; namelijk een houten blok of instrument, waarin de voeten gesloten werden."}],"25":[{"catchword":"zongen Gode","tekst":"Namelijk verblijd zijnde dat zij om Christus' naam leden; Act 5:41 ."},{"catchword":"de gevangenen","tekst":"Namelijk de andere gevangenen."}],"26":[{"catchword":"bewogen werden;","tekst":"Grieks op en neder geschud werden; tot een teken dat God het gebed zijner dienaren verhoord had; Act 4:31 ."},{"catchword":"geopend, en de","tekst":"Namelijk vanzelf, door de kracht Gods."}],"27":[{"catchword":"omgebracht hebben,","tekst":"Namelijk om te ontgaan een wreder dood, dien hij vreesde hem te zullen aangedaan worden, zo de gevangenen ontkomen waren."}],"28":[{"catchword":"grote stem,","tekst":"Dat is, luider."}],"30":[{"catchword":"buiten gebracht","tekst":"Namelijk uit den binnensten kerker in zijn huis."}],"31":[{"catchword":"uw huis","tekst":"Dat is, huisgezin, uwe vrouw en kinderen, als kinderen des verbonds. Zie Act 2:39 ."}],"33":[{"catchword":"wies hen","tekst":"Namelijk van het geronnen bloed door de geseling veroorzaakt, om de wonden te verzachten."}],"34":[{"catchword":"de tafel voor,","tekst":"Namelijk met spijs en drank."},{"catchword":"verheugde zich,","tekst":"Zie dergelijke Act 8:39 ."},{"catchword":"gelovig geworden was","tekst":"Grieks geloofd had."}],"35":[{"catchword":"de stadsdienaars,","tekst":"Grieks Roedendragers; zo werden de dienaars of boden van de steden genaamd, omdat zij gingen met stokken, roeden, of gaarden."}],"37":[{"catchword":"tot hen","tekst":"Zij Namelijk tot de stadsdienaars."},{"catchword":"die Romeinen zijn,","tekst":"Grieks Romeinse mensen; dat is, hebbende het recht van de burgers van Rome, die men niet mocht geselen; zie Act 22:25 , en Val.Max. lib.4, cap.1."},{"catchword":"onveroordeeld","tekst":"Dat is, niet alleen zonder schuld, maar ook zonder enigen vorm van rechtvordering."},{"catchword":"Niet alzo;","tekst":"Namelijk zal het toegaan."}],"38":[{"catchword":"horende, dat","tekst":"Of, omdat zij hoorden."},{"catchword":"Romeinen waren","tekst":"Namelijk die zij tegen het recht van de burgers van Rome hadden doen geselen, vs.37."}],"39":[{"catchword":"uit de stad","tekst":"Namelijk opdat tegen hen geen nieuw oproer zou verwekt worden."}],"40":[{"catchword":"tot Lydia; en","tekst":"Of, ten huize van Lydia, vs.14,15."},{"catchword":"vertroostten","tekst":"Namelijk tegen de ergernis van deze smaadheid hun aangedaan."},{"catchword":"zij dezelve,","tekst":"Namelijk Paulus en Silas."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And he came to Derbe and Lystra, [Of these Cities see Acts 14.v. 6.] and behold a certain Disciple was there, be name Timothy [of this Timothy see more at large, Acts 17.v.14.and chap.19.22.and chap.20. 4. Rom. 16. 21. 1 Cor. 4. 17. Phil. 2. 19. 1 Thes. 3. 3.and chiefly 1 Tim. 1. 2.] the son of a believing [that is, which was converted to the Christian faith] Jewish woman, [namely called Eunice. See of her, as also of his Grand-mother Lois, 2 Tim. 1 5.] but of a Greekish Father. [Gr.of a Father a Greek, i.e. of Greekish and Gentile descent and Religion, which was the cause that Timothy was not circumcised.]"}],"2":[{"catchword":null,"tekst":"To whom (good) testimony was given [Namely, of godliness and expertness in the holy Scripture, 2 Tim. 3. 15.] of the brethren at Lystra and Iconium."}],"3":[{"catchword":null,"tekst":"Him Paul would have travel with him [Gr. Go forth] and he took and circumcised him, for the Jews sake which were in those places, [Namely because the Jews which were weak in the faith should not reject his service, because he was uncircumcised. For they understood not yet, that circumcision was now abolished, and was at an end. And so Paul useth circumcision here as an indifferent thing, such as must always be used for edification of the weak and without scandall, 1 Cor. 9 19. But when he had to do, not with weak, but with stiff-necked Jews, who pressed circumcision as yet needful to salvation, he would not for their sakes let Titus be circumcised. See Gal. 2. 3.] for they all knew his Father, that he was a Greek. [and that therefore Timothy his son was not circumcised.]"}],"4":[{"catchword":null,"tekst":"And as they travelled through the Cities, they delivered over the Ordinates unto them [Gr.dogmata, i.e. opinions, meanings; of which see Acts 15. 20.] which were found good [Gr.judged or determined] by the Apostles and Elders at Jerusalem, for to observe (them)."}],"5":[{"catchword":null,"tekst":"Therefore the Churches were confirmed in the Faith, [Namely, as well in special concerning Christian liberty and the use, as in general of all other points of faith] and were daily more abundant in number."}],"6":[{"catchword":null,"tekst":"And when they had travelled through Phrygia [A Country in Asia the less between Mysia, Galatia and Lycaonia] and the land of Galatia, [a Countrey in Asia the less, whereof see Gal. 1. 2.] they were hindred [namely, for that time: for afterwards Paul preached the word of the Gospel there for about two years. See Acts 19. 10.so the Holy Ghost prescribed the Apostles what order they should hold in travelling and preaching the word to one people first, and to another after] by the Holy Ghost [that is, by an inward speaking of God by his spirit] to speak the word in Asia. [this was the third part of the inhabited and then known world, whereof Europe and Africa were the two other parts; although it seem here to be taken for Asia the less.]"}],"7":[{"catchword":null,"tekst":"(And) being come to Mysia, [A Countrey in Asia the less betwixt Troas and Phrygia] they endeavoured to travel to Bithynia [a Countrey lying close by Troas over against Thracia, reaching to Pontus Euxinus or the black Sea] and the spirit [namely, of Jesus which is added in many ancient Copies] permitted it them not, [see the annotation on the former verse.]"}],"8":[{"catchword":null,"tekst":"And they being pissed by Mysia, came down to Troas. [By this name a whole Country was called, where in former times old Troy stood, otherwise called Phrygia the less, and also a City in the same Countrey, which was also called Antigonia and Alexandria, of which is here spoken. See Acts 20.v. 6. 2 Cor. 2. 12. 2 Tim. 4. 13.]"}],"9":[{"catchword":null,"tekst":"And a vision was seen by Paul in the night: there was Macedonian man standing, who prayed him and said, come over into Macedonia [This was a great country in Europe, betwixt Epirus and Thracia, stretching it self on the one side to the Egean Sea, now called Archipelago] and help us. [namely, in respect of our souls by the preaching of the Gospel]"}],"10":[{"catchword":null,"tekst":"Now when he had seen this vision, we sought [Whence it appears that Luke was then in the Apostles company. See also Col. 4. 14.and Phil.v. 24.] immediately to travel towards Macedonia, concluding [of the signification of this word, see Acts 9. 22.] (from) thence) that the Lord had called us to publish the Gospel to them."}],"11":[{"catchword":null,"tekst":"Therefore being sayled off from Troas, we ran right towards Samothracia, [An Island in the Aegean Sea, hard by the firm land of Thracia, so called because it was inhabited, with inhabitants sprung partly out of Thracia, and partly out of Samos] and they following (day) to Neapolis. [a City lying on the borders of Thracia and Macedonia, not far from Phillipi, over against the Island Thasus.]"}],"12":[{"catchword":null,"tekst":"And from thence to Philippi, [This City was formerly called Dathos, and afterwards new-named Philippi, by Philip King of Macedonia, who built the same up again being decayed. See Phil.1. 1.] which is the first City, [namely, as ye sayl over from Samothracia to Macedonia] and of this part of Macedonia, a colonie. [so in the Latine the Cities are called, which were either built by the Romanes, or planted and stocked with Romane inhabitants, to till the Land s called Delphi, where he had a Temple and most practised his sooth-sayings. And so all manner of sooth-saying evil spirits are also called, who commonly gave answers to men that consulted with them, 1 Sam. 28. 7.] met us, who brought her masters great gain by sooth-saying."}],"17":[{"catchword":null,"tekst":"The same followed after Paul and us, and cryed saying, these men are servants of the most high God, [ Howsoever this unclean spirit said the truth therein, yet notwithstanding he inthended to make the Apostles doctrine suspected thereby. See the like Mark 1. 25. Luke 4. 41.] who declare unto us [otherwise to you] the way of salvation."}],"18":[{"catchword":null,"tekst":"An this she did for many daies. But Paul being discontent [Or being troubled, as well for the misery of this maiden, as for the deceitfulness of Satan whereby poor men were seduced. See also Mark 1. 25.] (thereat) turned him about, and said to the spirit, I command thee in the name of Jesus Christ that thou go forth of her: [namely, of this maid-servant] And he went out the same hour."}],"19":[{"catchword":null,"tekst":"Now when her Masters [Whose bond-maid she was] saw that the hope of their gain was gone, [Gr.was gone out, as it were with this unclean spirit] they laid hold on Paul and Silas, and drew them unto the Market, [or a place of judgement] before the Rulers. [these in the Colonies of the Romanes were called Decuriones.]"}],"20":[{"catchword":null,"tekst":"And when they had brought them to the Captaines [Gr.strategoi, which by the Romanes were called duumviri, and in the Colonies had the highest authority] they said, these men trouble our City, whereas they are Jews. [the name of Jews was very much hated among the Gentiles.]"}],"21":[{"catchword":null,"tekst":"AAnd they publish manners [That is, manners to worship God, others then the Romanes and Gentiles had] which are not lawfull for us to receive, nor to do, seeing we are Romanes."}],"22":[{"catchword":null,"tekst":"And the multitude stood up together against them: and the Captains having rent off their clothes, [Namely, the Apostles and Silas&acirc;&euro;&trade;s] commanded to scourge the. [or to strike them with Rods.]"}],"23":[{"catchword":null,"tekst":"And when they had given them many stripes, [Gr.laid on them] they cast them into prison, and commanded on them] they cast them into prison, and commanded the Jaylor [Gr.keeper of the prisoners: keeper of the stocks] that he should keep them safely. [that is, in good safeguard, strictly.]"}],"24":[{"catchword":null,"tekst":"Who having received such a command, cast them into the inmost prison, and secured their feet in the stocks [Gr.in the wood, namely, a wooden block or instrument, wherein the feet were shut.]"}],"25":[{"catchword":null,"tekst":"And about Midnight Paul and Silas prayed, and sung hymes to God. [Namely, being glad that they suffered for Christs name, Acts 5. 41. And the Prisoners hearkened to them. [namely, the other prisoners.]"}],"26":[{"catchword":null,"tekst":"And there hapned suddenly a great Earth quake, so that the foundations of the prison were moved [Gr.shaken up and down, for a sign that God had heard the prayer of his servants, Acts 4. 31.] and straightway all the doors were opened, [namely, of themselves by the power of God] and the bands of all became loose."}],"27":[{"catchword":null,"tekst":"And the Jaylor being asked, and seeing the doors of the prison opened, drew a sword, and would have made away himself, [namely, to escape a more cruel death, which he feared he should be put to, if the prisoners were gotten away] thinking that the prisoners were sted."}],"28":[{"catchword":null,"tekst":"But Paul cryed with a great voice, [That is, aloud] saying, do thy self no harm: for we are all here."}],"29":[{"catchword":null,"tekst":"And when he had asked for light, he sprang in, and was greatly trembling, and fell down before Paul and Silas (at their feet.)"}],"30":[{"catchword":null,"tekst":"And having brought them without [Namely, out of the inmost prison into his house] he said, Sirs, what must I do that I may be saved?"}],"31":[{"catchword":null,"tekst":"And they said, believe in the Lord Jesus Christ, and thou shalt be saved; thou and thy house. [That is, household, thy wife and children, as children of the covenant. See Acts 2. 29.]"}],"32":[{"catchword":null,"tekst":"And they spake unto him the word of the Lord, and unto all which were in this house."}],"33":[{"catchword":null,"tekst":"And he took them to him in the same hour of the night, and washed (them) from the stripes, [Namely, from the congealed blood caused by the scourging, to soften the wounds] and he was straightway baptized, and all his."}],"34":[{"catchword":null,"tekst":"And he brought them into his house, and set the Table before (them) [Namely, with meat and drink] and rejoiced [see the like Acts 8. 39.] that he with all his house was become believing in God. [Gr.had believed.]"}],"35":[{"catchword":null,"tekst":"And when it was become day, the Captains sent the City-officers [Gr. Rod-bearers: so the Officers or Messengers of the Cities were called, because they went with staves, rods or twigs] saying let those men loose."}],"36":[{"catchword":null,"tekst":"And the Jaylor told these words to Paul (saying) the Captains have sent that ye should be let loose: Now therefore go forth, and go your ways in peace."}],"37":[{"catchword":null,"tekst":"But Paul said unto them, [Namely, to the Town-officers] they have scourged us who are Romanes [Gr. Romane men, that is, having the right of Citizens of Rome, who might not be scourged. See Acts 22.v. 25.and Val. Max.lib. 4.cap. 1.] openly uncondemned, [that is not only without fault, but also without any form of legal proceeding and cast] (us) into prison, and do they now cast us out of it privily? Not so [namely shall it go] but let themselves come and bring us out."}],"38":[{"catchword":null,"tekst":"And the City-officers told these words again to the Captains: and th // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
