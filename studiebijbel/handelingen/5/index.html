<style>

  h2.hfd { color: var(--dark); text-align: center; font-size: 1.75rem; font-weight: 700; margin: 2rem 0 0; }

  .hfdnav { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-family:"Lora"; font-size:.85rem; padding:.5rem 0; margin-bottom:1.1rem; }
  .navknop { color:var(--accent); text-decoration:none; padding:.25rem .3rem; white-space:nowrap; }
  .navknop:hover { color:var(--accent-donker); text-decoration:underline; }
  .navknop.uit { color:#ccc; pointer-events:none; }
  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
  #bibliotheekknop { padding:.3rem .7rem; font-size:1rem; line-height:1; }

     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }
  #notenlijst { margin: 1.5rem 0 0 2.4rem; font-family: "Lora"; font-size: .82rem; color: #666; border-top: 1px solid var(--border); padding-top: .8rem; }

  #notenlijst .nootregel .nn { color: var(--accent); font-weight: 700; margin-right: .35rem; }
  .kopieer { position: absolute; right: .4rem; top: .55rem; opacity: 0; border: none; background: none; cursor: pointer; color: var(--accent); font-size: .95rem; padding: .1rem .3rem; transition: opacity .15s; }
  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  /* naslagpaneel */
  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }
  .paneel.open { display: block; }
  .ntabs { display: flex; gap: .4rem; margin-bottom: .8rem; }
  .ntab { border: 1px solid var(--border); background: var(--bg-soft); border-radius: 6px 6px 0 0; padding: .28rem .95rem; cursor: pointer; font-size: .8rem; color: #666; }
  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }
  .tsk-kop { font-weight: 700; color: var(--accent-donker); margin: .55rem 0 .3rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
  .verg-kop { font-family:"Lora"; font-weight: 700; color: var(--accent-donker); font-size: 1.05rem; margin: 0 0 .6rem; padding-bottom: .35rem; border-bottom: 2px solid var(--accent); }

  .opener { display: block; cursor: pointer; font-weight: 600; color: var(--accent-donker); padding: .2rem 0; }
  .opener:hover { color: var(--accent); }
  .opener::before { content: '▸ '; font-size: .75em; }
  .opener.open::before { content: '▾ '; }

  .uitleg-item { margin: .5rem 0; font-family: Lora, serif; }

  .tsk-sub { font-weight: 600; color: #444; margin: .5rem 0 .2rem; }

  .ond-refs { margin: .3rem 0 0; }

  .onderwerp .label { font-style: italic; color: #666; }
  .ondrefs { line-height:1.9; margin-top:.4rem; }
  .meer { font-size:.72rem; color:#999; margin-left:.3rem; }
  .schakelnav { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .schakelnav .pos { font-size:.75rem; color:#999; }
  .alle > summary { font-size:.75rem; color:var(--accent); cursor:pointer; margin-top:.35rem; list-style:none; }

  .alle > summary:hover { text-decoration:underline; }
  .bronregel { font-size:.72rem; color:#999; margin-top:.6rem; }

  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }
  .site-footer-col { display:flex; flex-direction:column; gap:.5rem; }
  .site-footer-mid { text-align:center; }
  .site-footer-right { text-align:right; }
  .site-footer a { color:var(--secondary); text-decoration:underline; }

  footer.site { margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-family: "Lora"; font-size: .72rem; color: #999; line-height: 1.7; }
  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 3rem; } header.site h1 { font-size: 1.5rem; } }
</style>

en gaf de geest. En er kwam grote vrees over allen die dit hoorden.","6":"En de jongelingen stonden op, wikkelden hem in, en droegen *hem* uit, en begroeven *hem*.","7":"En het gebeurde omtrent drie uur daarna, dat ook zijn vrouw daar binnenkwam, niet wetend wat er gebeurd was;","8":"en Petrus antwoordde haar: Zeg mij, hebt u het land voor zoveel verkocht? En zij zei: Ja, voor zoveel.","9":"En Petrus zei tot haar: Wat is het, dat u onderling hebt afgesproken om de Geest van de Heere te verzoeken? Zie, de voeten van hen die uw man begraven hebben, zijn voor de deur, en zullen u uitdragen.","10":"En zij viel meteen neer voor zijn voeten, en gaf de geest. En de jongelingen kwamen binnen, vonden haar dood, en droegen *haar* uit, en begroeven *haar* bij haar man.","11":"En er kwam grote vrees over de hele gemeente, en over allen die dit hoorden.","12":"En door de handen van de apostelen gebeurden veel tekenen en wonderen onder het volk; en zij waren allen eendrachtig in de zuilengang van Salomo.","13":"En van de anderen durfde niemand zich bij hen aansluiten; maar het volk hield hen in grote achting.","14":"En er werden steeds meer mensen toegevoegd, die de Heere geloofden, menigten zowel van mannen als van vrouwen;","15":"zodat zij de zieken uitdroegen op de straten, en legden hen op bedden en matten, opdat, als Petrus kwam, ook maar de schaduw iemand van hen zou mogen beschaduwen.","16":"En ook de menigte uit de omliggende steden kwam samen naar Jeruzalem, en brachten zieken, en hen die door onreine geesten gekweld werden; en die werden allen genezen.","17":"En de hogepriester stond op, en allen die met hem waren (dat was de sekte van de Sadduceeën), en werden vervuld met nijd;","18":"en zij sloegen hun handen aan de apostelen, en zetten hen in de gemeenschappelijke gevangenis.","19":"Maar de engel van de Heere opende 's nachts de deuren van de gevangenis en leidde hen naar buiten, en zei:","20":"Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.","21":"Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen.","22":"Maar toen de dienaars daar kwamen, vonden zij hen niet in de gevangenis, maar keerden terug, en berichtten *dit*,","23":"en zeiden: Wij vonden de kerker met alle zorgvuldigheid gesloten, en de wachters buiten staand voor de deuren; maar toen wij die geopend hadden, vonden wij niemand daarbinnen.","24":"Toen nu de hogepriester en de hoofdman van de tempel, en de overpriesters deze woorden hoorden, werden zij vol twijfel over hen, wat hier toch uit zou worden.","25":"En er kwam iemand, en berichtte hun, en zei: Zie, de mannen die u in de gevangenis gezet hebt, staan in de tempel, en leren het volk.","26":"Toen ging de hoofdman heen, met de dienaren, en bracht hen, *doch* niet met geweld (want zij vreesden het volk, dat zij niet gestenigd zouden worden).","27":"En toen zij hen gebracht hadden, stelden zij hen voor de raad; en de hogepriester vroeg hun, en zei:","28":"Hebben wij u niet ernstig aangezegd, dat u niet zou leren in deze Naam? En zie, u hebt met deze leer van u Jeruzalem vervuld, en u wilt het bloed van deze Mens over ons brengen.","29":"Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen.","30":"De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door *Hem* aan het hout te hangen.","31":"Deze heeft God door Zijn rechterhand verhoogd *tot* een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.","32":"En wij zijn Zijn getuigen van deze dingen; en ook de Heilige Geest, Die God gegeven heeft hun die Hem gehoorzaam zijn.","33":"Toen zij dit hoorden, werd hun hart doorstoken, en zij hielden raad om hen te doden.","34":"Maar een zeker Farizeeër stond op in de raad, met name Gamaliël, een leraar van de wet, in aanzien gehouden bij al het volk, en gebood dat men de apostelen een weinig naar buiten zou laten *staan*.","35":"En hij zei tot hen: Israëlitische mannen, kijk voor uzelf uit, wat u doen zult aangaande deze mensen.","36":"Want vóór deze dagen stond Theudas op, en zei dat hij iets was, aan wie een aantal van omtrent vierhonderd mannen zich verbond; en die is omgebracht, en allen die hem gehoor gaven, zijn verstrooid en tot niets geworden.","37":"Na hem stond Judas de Galileeër op, in de dagen van de volkstelling, en maakte veel volk afvallig achter zich; en ook deze is vergaan, en allen die hem gehoor gaven, zijn uiteengedreven.","38":"En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen *gaan*; want als deze raad of dit werk uit mensen is, zal het gebroken worden;","39":"maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden.","40":"En zij gaven hem gehoor; en toen zij de apostelen bij zich geroepen hadden, geselden zij *hen*, en geboden *hun* dat zij niet zouden spreken in de Naam van Jezus; en lieten hen gaan.","41":"Zij dan gingen heen van voor de raad, verblijd dat zij waardig geacht waren om vanwege Zijn Naam smaad te lijden.","42":"En zij hielden niet op, elke dag, in de tempel en bij de huizen, te leren, en Jezus Christus te verkondigen."},"SV":{"1":"En een zeker man, met name Ananias, met Saffira, zijn vrouw, verkocht een have;","2":"En onttrok van den prijs, ook met medeweten zijner vrouw; en bracht een zeker deel, en legde *dat* aan de voeten der apostelen.","3":"En Petrus zeide: Ananias, waarom heeft de satan uw hart vervuld, dat gij den Heiligen Geest liegen zoudt, en onttrekken van den prijs des lands?","4":"Zo het gebleven ware, bleef het niet uw, en verkocht zijnde, was het niet in uw macht? Wat is het, dat gij deze daad in uw hart hebt voorgenomen? Gij hebt den mensen niet gelogen, maar Gode.","5":"En Ananias, deze woorden horende, viel neder en gaf den geest. En er kwam grote vrees over allen, die dit hoorden.","6":"En de jongelingen, opstaande, schikten hem toe, en droegen *hem* uit, en begroeven *hem*.","7":"En het was omtrent drie uren daarna, dat ook zijn vrouw daar inkwam, niet wetende, wat er geschied was;","8":"En Petrus antwoordde haar: Zeg mij, hebt gijlieden het land voor zoveel verkocht? En zij zeide: Ja, voor zoveel.","9":"En Petrus zeide tot haar: Wat is het, dat gij onder u hebt overeengestemd te verzoeken den Geest des Heeren? Zie, de voeten dergenen, die uw man begraven hebben, zijn voor de deur, en zullen u uitdragen.","10":"En zij viel terstond neder voor zijn voeten, en gaf den geest. En de jongelingen ingekomen zijnde, vonden haar dood en droegen *ze* uit, en begroeven *haar* bij haar man.","11":"En er kwam grote vreze over de gehele Gemeente, en over allen, die dit hoorden.","12":"En door de handen der apostelen geschiedden vele tekenen en wonderen onder het volk; en zij waren allen eendrachtelijk in het voorhof van Salomo.","13":"En van de anderen durfde niemand zich bij hen voegen; maar het volk hield hen in grote achting.","14":"En er werden meer en meer toegedaan, die den Heere geloofden, menigten beide van mannen en van vrouwen;","15":"Alzo dat zij de kranken uitdroegen op de straten, en legden op bedden en beddekens, opdat, als Petrus kwam, ook maar de schaduw iemand van hen beschaduwen mocht.","16":"En ook de menigte uit de omliggende steden kwam gezamenlijk te Jeruzalem, brengende kranken, en die van onreine geesten gekweld waren; welke allen genezen werden.","17":"En de hogepriester stond op, en allen, die met hem waren ( welke was de sekte der Sadduceën), en werden vervuld met nijdigheid;","18":"En sloegen hun handen aan de apostelen, en zetten hen in de gemene gevangenis.","19":"Maar de engel des Heeren opende des nachts de deuren der gevangenis en leidde hen uit, en zeide:","20":"Gaat heen, en staat, en spreekt in den tempel tot het volk al de woorden dezes levens.","21":"Als zij nu *dit* gehoord hadden, gingen zij tegen den morgenstond in den tempel, en leerden. Maar de hogepriester, en die met hem waren, gekomen zijnde, riepen den raad te zamen, en al de oudsten der kinderen Israëls, en zonden naar den kerker, om hen te halen.","22":"Doch als de dienaars daar kwamen, vonden zij hen in de gevangenis niet, maar keerden wederom, en boodschapten *dit*.","23":"Zeggende: Wij vonden wel den kerker met alle verzekerdheid toegesloten, en de wachters buiten staande voor de deuren; maar als wij *die* geopend hadden, vonden wij niemand daarbinnen.","24":"Toen nu de *hoge* priester en de hoofdman des tempels, en de overpriesters deze woorden hoorden, werden zij twijfelmoedig over hen, wat toch dit worden zou.","25":"En er kwam een, en boodschapte hun, zeggende: Ziet, de mannen, die gij in de gevangenis gezet hebt, staan in den tempel, en leren het volk.","26":"Toen ging de hoofdman heen, met de dienaren, en bracht hen, *doch* niet met geweld ( want zij vreesden het volk, opdat zij niet gestenigd wierden).","27":"En als zij hen gebracht hadden, stelden zij hen voor den raad; en de hogepriester vraagde hun, en zeide:","28":"Hebben wij u niet ernstiglijk aangezegd, dat gij in dezen Naam niet zoudt leren? En ziet, gij hebt met deze uw leer Jeruzalem vervuld, en gij wilt het bloed van dezen Mens over ons brengen.","29":"Maar Petrus en de apostelen antwoordden, en zeiden: Men moet Gode meer gehoorzaam zijn, dan den mensen.","30":"De God onzer vaderen heeft Jezus opgewekt, Welken gij omgebracht hebt, hangende *Hem* aan het hout.","31":"Deze heeft God door Zijn rechter *hand* verhoogd *tot* een Vorst en Zaligmaker, om Israël te geven bekering en vergeving der zonden.","32":"En wij zijn Zijn getuigen van deze woorden; en ook de Heilige Geest, Welken God gegeven heeft dengenen, die Hem gehoorzaam zijn.","33":"Als zij nu *dit* hoorden, barstte hun *het* *hart*, en zij hielden raad, om hen te doden.","34":"Maar een zeker Farizeër stond op in den raad, met name Gamaliël, een leraar der wet, in waarde gehouden bij al het volk, en gebood, dat men de apostelen een weinig zou doen buiten *staan*.","35":"En hij zeide tot hen: Gij Israëlietische mannen, ziet voor u, wat gij doen zult aangaande deze mensen.","36":"Want voor deze dagen stond Theudas op, zeggende, dat hij wat was, dien een getal van omtrent vierhonderd mannen aanhing; welke is omgebracht, en allen, die hem gehoor gaven, zijn verstrooid en tot niet geworden.","37":"Na hem stond op Judas, de Galileër in de dagen der beschrijving, en maakte veel volks afvallig achter zich; en deze is ook vergaan, en allen, die hem gehoor gaven, zijn verstrooid geworden.","38":"En nu zeg ik ulieden: Houdt af van deze mensen, en laat hen *gaan*; want indien deze raad, of dit werk uit mensen is, zo zal het gebroken worden.","39":"Maar indien het uit God is, zo kunt gij dat niet breken; opdat gij niet misschien bevonden wordt ook tegen God te strijden.","40":"En zij gaven hem gehoor; en als zij de apostelen tot zich geroepen hadden, geselden zij *dezelve*, en geboden *hun*, dat zij niet zouden spreken in den Naam van Jezus; en lieten hen gaan.","41":"Zij dan gingen heen van het aangezicht des raads, verblijd zijnde, dat zij waren waardig geacht geweest, om Zijns Naams wil smaadheid te lijden.","42":"En zij hielden niet op, allen dag, in den tempel en bij de huizen, te leren, en Jezus Christus te verkondigen."},"KJV":{"1":"But a certain man named Ananias, with Sapphira his wife, sold a possession,","2":"And kept back *part* of the price, his wife also being privy *to it*, and brought a certain part, and laid *it* at the apostles' feet.","3":"But Peter said, Ananias, why hath Satan filled thine heart to lie to the Holy Ghost, and to keep back *part* of the price of the land?","4":"Whiles it remained, was it not thine own? and after it was sold, was it not in thine own power? why hast thou conceived this thing in thine heart? thou hast not lied unto men, but unto God.","5":"And Ananias hearing these words fell down, and gave up the ghost: and great fear came on all them that heard these things.","6":"And the young men arose, wound him up, and carried *him* out, and buried","7":"And it was about the space of three hours after, when his wife, not knowing what was done, came in.","8":"And Peter answered unto her, Tell me whether ye sold the land for so much? And she said, Yea, for so much.","9":"Then Peter said unto her, How is it that ye have agreed together to tempt the Spirit of the Lord? behold, the feet of them which have buried thy husband *are* at the door, and shall carry thee out.","10":"Then fell she down straightway at his feet, and yielded up the ghost: and the young men came in, and found her dead, and, carrying *her* forth, buried *her* by her husband.","11":"And great fear came upon all the church, and upon as many as heard these things.","12":"And by the hands of the apostles were many signs and wonders wrought among the people; (and they were all with one accord in Solomon's porch.","13":"And of the rest durst no man join himself to them: but the people magnified them.","14":"And believers were the more added to the Lord, multitudes both of men and women.)","15":"Insomuch that they brought forth the sick into the streets, and laid *them* on beds and couches, that at the least the shadow of Peter passing by might overshadow some of them.","16":"There came also a multitude *out* of the cities round about unto Jerusalem, bringing sick folks, and them which were vexed with unclean spirits: and they were healed every one.","17":"Then the high priest rose up, and all they that were with him, (which is the sect of the Sadducees,) and were filled with indignation,","18":"And laid their hands on the apostles, and put them in the common prison.","19":"But the angel of the Lord by night opened the prison doors, and brought them forth, and said,","20":"Go, stand and speak in the temple to the people all the words of this life.","21":"And when they heard *that*, they entered into the temple early in the morning, and taught. But the high priest came, and they that were with him, and called the council together, and all the senate of the children of Israel, and sent to the prison to have them brought.","22":"But when the officers came, and found them not in the prison, they returned, and told,","23":"Saying, The prison truly found we shut with all safety, and the keepers standing without before the doors: but when we had opened, we found no man within.","24":"Now when the high priest and the captain of the temple and the chief priests heard these things, they doubted of them whereunto this would grow.","25":"Then came one and told them, saying, Behold, the men whom ye put in prison are standing in the temple, and teaching the people.","26":"Then went the captain with the officers, and brought them without violence: for they feared the people, lest they should have been stoned.","27":"And when they had brought them, they set *them* before the council: and the high priest asked them,","28":"Saying, Did not we straitly command you that ye should not teach in this name? and, behold, ye have filled Jerusalem with your doctrine, and intend to bring this man's blood upon us.","29":"Then Peter and the *other* apostles answered and said, We ought to obey God rather than men.","30":"The God of our fathers raised up Jesus, whom ye slew and hanged on a tree.","31":"Him hath God exalted with his right hand *to be* a Prince and a Saviour, for to give repentance to Israel, and forgiveness of sins.","32":"And we are his witnesses of these things; and *so is* also the Holy Ghost, whom God hath given to them that obey him.","33":"When they heard *that*, they were cut *to the heart*, and took counsel to slay them.","34":"Then stood there up one in the council, a Pharisee, named Gamaliel, a doctor of the law, had in reputation among all the people, and commanded to put the apostles forth a little space;","35":"And said unto them, Ye men of Israel, take heed to yourselves what ye intend to do as touching these men.","36":"For before these days rose up Theudas, boasting himself to be somebody; to whom a number of men, about four hundred, joined themselves: who was slain; and all, as many as obeyed him, were scattered, and brought to nought.","37":"After this man rose up Judas of Galilee in the days of the taxing, and drew away much people after him: he also perished; and all, *even* as many as obeyed him, were dispersed.","38":"And now I say unto you, Refrain from these men, and let them alone: for if this counsel or this work be of men, it will come to nought:","39":"But if it be of God, ye cannot overthrow it; lest haply ye be found even to fight against God.","40":"And to him they agreed: and when they had called the apostles, and beaten *them*, they commanded that they should not speak in the name of Jesus, and let them go.","41":"And they departed from the presence of the council, rejoicing that they were counted worthy to suffer shame for his name.","42":"And daily in the temple, and in every house, they ceased not to teach and preach Jesus Christ."}},"tsk":{"2":[{"kopje":"onttrok","refs":["Joz 7:11","Joz 7:12","2 Kon 5:21-25","Mal 1:14","Mal 3:8","Mal 3:9","Joh 12:6","1 Tim 6:10","2 Petr 2:14","2 Petr 2:15"]},{"kopje":"zijn","refs":["Hand 5:9"]},{"kopje":"legde","refs":["Hand 4:34","Hand 4:35","Hand 4:37","Matt 6:2","Matt 6:3","Matt 23:5","Fil 2:3"]}],"3":[{"kopje":"waarom","refs":["Gen 3:13-17","1 Kon 22:21","1 Kon 22:22","1 Kron 21:1-3","Matt 4:3-11","Matt 13:19","Luk 22:3","Joh 13:2","Joh 13:27","Ef 6:11-16","Jak 4:7","1 Petr 5:8","Openb 12:9-11"]},{"kopje":"liegen","refs":["Hand 5:9","Job 22:13","Ps 94:7-9","Jes 29:15","Jer 23:24","Hos 12:1"]},{"kopje":"onttrekken","refs":["Num 30:2","Deut 23:21","Spr 20:25","Pred 5:3","Rom 2:21","Rom 2:22"]}],"4":[{"kopje":"was het niet in uw macht","refs":["Ex 35:21","Ex 35:22","Ex 35:29","1 Kron 29:3","1 Kron 29:5","1 Kron 29:9","1 Kron 29:17","1 Kor 8:8","1 Kor 9:5-17","Filem 1: </span> the <span class=\"wl wl-kjv\" data-code=\"G652\">apostles,</span> and <span class=\"wl wl-kjv\" data-code=\"G1194\">beaten</span> them, they <span class=\"wl wl-kjv\" data-code=\"G3853\">commanded</span> that they <span class=\"wl wl-kjv\" data-code=\"G2980\">should</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G2980\">speak</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G3686\">name</span> of <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G630\">let</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them</span> go.","41":"<span class=\"wl wl-kjv\" data-code=\"G3767\">And</span> they <span class=\"wl wl-kjv\" data-code=\"G4198\">departed</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> the <span class=\"wl wl-kjv\" data-code=\"G4383\">presence</span> of the <span class=\"wl wl-kjv\" data-code=\"G4892\">council,</span> <span class=\"wl wl-kjv\" data-code=\"G5463\">rejoicing</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> they were counted <span class=\"wl wl-kjv\" data-code=\"G2661\">worthy</span> to suffer <span class=\"wl wl-kjv\" data-code=\"G818\">shame</span> <span class=\"wl wl-kjv\" data-code=\"G5228\">for</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> name.","42":"<span class=\"wl wl-kjv\" data-code=\"G5037\">And</span> <span class=\"wl wl-kjv\" data-code=\"G2250\">daily</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G2411\">temple,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> in <span class=\"wl wl-kjv\" data-code=\"G2596\">every</span> <span class=\"wl wl-kjv\" data-code=\"G3624\">house,</span> they <span class=\"wl wl-kjv\" data-code=\"G3973\">ceased</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> to <span class=\"wl wl-kjv\" data-code=\"G1321\">teach</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2097\">preach</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> Christ."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"een have;","tekst":"Grieks ene bezitting; wordt vs.3 genaamd een land, of hofstede."}],"2":[{"catchword":"onttrok van","tekst":"Dat is, achterhield met listigheid, verstak het, en bracht het niet tevoorschijn."},{"catchword":"aan de voeten","tekst":"Zie Act 4:34 ."}],"3":[{"catchword":"vervuld, dat","tekst":"Dat is, ganselijk ingenomen met gierigheid en geveinsdheid. Of, waarom hebt gij den Satan plaats gegeven in uw hart?"},{"catchword":"liegen zoudt,","tekst":"Dat is tegen uw gemoed en overtuiging des Heiligen Geestes met onwaarheid te zeggen dat het verkochte land niet meer zou gegolden hebben. Of, bedriegen; dat is, onderstaan zoudt te bedriegen, als denkende dat de Heilige Geest zulks niet wist en ons zulks niet zou openbaren."}],"4":[{"catchword":"Zo het gebleven","tekst":"Grieks blijvende; namelijk onverkocht."},{"catchword":"bleef het niet","tekst":"Dat is, stond het niet in uw believen het voor u te behouden, zonder genoodzaakt te zijn om te verkopen?"},{"catchword":"was het niet in","tekst":"Namelijk om met het geld te doen wat u goeddocht; het voor u te behouden, of hier te brengen. Waaruit blijkt dat deze gemeenschap der goederen niet was ten aanzien van den eigendom, maar ten aanzien van het gebruik, in tijd van nood. Zie Act 2:42 ."},{"catchword":"voorgenomen?","tekst":"Grieks gesteld, of gezet."},{"catchword":"niet gelogen,","tekst":"Dat is, niet zozeer, of niet alleen gelijk gij meendet."},{"catchword":"Gode","tekst":"Namelijk dewijl gij den Heiligen Geest gelogen hebt, vs.3, die met den Vader en Zoon de waarachtige God is. Zie 1Co 3:16 , vergelijk met 1Co 6:19 ."}],"5":[{"catchword":"gaf den geest","tekst":"Grieks gaf den adem uit. Petrus heeft de geveinsdheid van dezen mens, tot waarschuwing van alle andere geveinsden, aldus met een haastigen dood gestraft, door een bijzonder ingeven Gods en door een buitengewone kracht, met welke de apostelen voorzien waren. Zie dergelijke Act 13:11 , hetwelk dan niet moeten en mogen navolgen, die zulk ingeven en macht niet hebben."}],"6":[{"catchword":"de jongelingen,","tekst":"Namelijk die daar in de vergadering waren."},{"catchword":"schikten hem","tekst":"Namelijk met uittrekking der klederen, inwinding in grafdoeken en anderszins, om Hem te begraven. Of, namen Hem weg."}],"7":[{"catchword":"drie uren daarna,","tekst":"Grieks een tussenstand van omtrent drie uren."},{"catchword":"inkwam, niet","tekst":"Namelijk in de plaats waar de apostelen met de gemeente vergaderd waren; Act 2:46 ."},{"catchword":"geschied was;","tekst":"Namelijk aan haar man."}],"8":[{"catchword":"antwoordde haar","tekst":"Dat is, sprak haar aan en zeide, Hebreën."},{"catchword":"zoveel","tekst":"Petrus heeft zonder twijfel den prijs uitgedrukt, dien hij van den man verstaan had."}],"9":[{"catchword":"te verzoeken","tekst":"Dat is, tegen uw gemoed te doen dingen, die God verboden heeft, gelijk of gij zoudt willen beproeven of Gods Geest ook rechtvaardig en alwetend is."},{"catchword":"uitdragen","tekst":"Namelijk nadat gij terstond ook zult dood nedergevallen zijn."}],"12":[{"catchword":"door de handen","tekst":"Dat is, door den dienst der apostelen. Want dezen waren maar dienaars en werktuigen; de kracht kwam van den Heere; Act 3:12 , en Act 4:30 en Act 7:35 ."},{"catchword":"voorhof van Sálomo","tekst":"Zie van dit voorhof 1Ki 6:3 ; Joh 10:23 ; Act 3:11 ."}],"13":[{"catchword":"de anderen durfde","tekst":"Namelijk die van enig aanzien waren, en zich nog tot de gemeente niet hadden begeven."},{"catchword":"hield hen","tekst":"Grieks maakten hen groot; Luk 1:46 ; 2Co 10:15 ."}],"14":[{"catchword":"meer en meer","tekst":"Of, des te meer; namelijk niettegenstaande deze straf aan Ananias en zijne huisvrouw geschied was. Of, boven de voorgaande menigte; Act 2:47 , en Act 4:4 ."}],"15":[{"catchword":"op de straten,","tekst":"Of, van straten tot straten; dat is doorgaans op de straten."},{"catchword":"kwam, ook maar","tekst":"Dat is, daar voorbijging."},{"catchword":"beschaduwen","tekst":"Namelijk om daardoor genezen te worden; Joh 14:12 ."}],"16":[{"catchword":"gekweld waren;","tekst":"Zie dergelijke Luk 6:18 ."}],"17":[{"catchword":"de sekte","tekst":"Grieks Hairesis; door welk woord betekend wordt een wijze van godsdienst, die iemand voor zichzelven verkoren heeft en volgt, Act 26:5 , en Act 28:22 ; en schijnt dit woord in den beginne zowel ten goede als ten kwade genomen geweest te zijn; maar daarna is het altijd ten kwade genomen, voor een valsen godsdienst, waarvan komt het woord heresie en heretijk; dat is, ketterij en ketter."},{"catchword":"der Sadduceën),","tekst":"Zie van dezelve Mat 3:7 , en Mat 22:23 ; Act 23:8 ."},{"catchword":"nijdigheid","tekst":"Of, ijver; namelijk een verkeerden ijver voor de wet; Rom 10:2 ."}],"19":[{"catchword":"opende des nachts","tekst":"Versta, en sloot ze daarna wederom toe, vs.23."}],"20":[{"catchword":"staat, en spreekt","tekst":"Dat is, vertoont u daar openbaar en vrijmoedig."},{"catchword":"al de woorden","tekst":"Of, al deze woorden des levens; dat is, deze Evangelische leer, waardoor den mensen aangewezen wordt de rechte weg om tot het eeuwige leven te komen; Joh 6:68 ."}],"21":[{"catchword":"den raad te zamen,","tekst":"Grieks Synedrion; zie daarvan Mat 5:22 ."},{"catchword":"de oudsten der","tekst":"Of, vergadering der ouden van de kinderen Israëls."}],"23":[{"catchword":"met alle","tekst":"Grieks in alle zekerheid."}],"24":[{"catchword":"de hoge- priester","tekst":"Grieks de priester; waardoor de hogepriester verstaan wordt, alzo die het hoofd was van dezen Raad, vs.27. Zie dergelijke 2Ch 24:2 ."}],"27":[{"catchword":"voor den raad;","tekst":"Grieks in."}],"28":[{"catchword":"ernstiglijk","tekst":"Grieks met aanzegging aangezegd. Hebreën."},{"catchword":"in dezen Naam","tekst":"Dat is, van dezen Jezus. Zie Act 4:18 ."},{"catchword":"het bloed van","tekst":"Dat is, de straf van het bloed, dat wij vergoten hebben, dezen Jezus dodende, alsof wij Zijn bloed onschuldig vergoten zouden hebben. Zie Mat 27:24-25 ."}],"30":[{"catchword":"opgewekt, Welken","tekst":"Namelijk uit de doden. Of, gesteld en gezonden tot een Zaligmaker; Act 13:23 ."}],"31":[{"catchword":"tot een Vorst","tekst":"Of, zijnde een Vorst en Zaligmaker."},{"catchword":"Israël te","tekst":"Dat is, de ware Israëlieten; Rom 9:6 ; Gal 6:16 ."}],"32":[{"catchword":"van deze woorden;","tekst":"Dat is, van deze zaken. Hebreën, Luk 1:37 ; Act 10:37 ."},{"catchword":"de Heilige Geest,","tekst":"Dat is, de krachtige werking des Heiligen Geestes in de harten der mensen, tot hunne bekering, mitsgaders deze zichtbare gaven deszelven."}],"33":[{"catchword":"barstte hun het hart","tekst":"Grieks zij werden als in tweeën gesneden of gezaagd; namelijk in het hart, van boosheid en toorn. Zie Act 7:54 ."}],"34":[{"catchword":"Gamáliël,","tekst":"Deze meent men dezelfde te zijn, aan wiens voeten de apostel Paulus in de wet onderwezen is geweest, Act 22:3 ."},{"catchword":"een weinig zou","tekst":"Grieks een korten, namelijk tijd."}],"36":[{"catchword":"voor deze dagen","tekst":"Dat is, vóór dezen tijd; want het was al enige jaren geleden."},{"catchword":"Theudas op,","tekst":"De historieschrijver Josefus, Antiq. lib.20, cap.2, maakt melding van een oproerigen Theudas, die zich opgeworpen heeft, toen Cuspius Fadus stadhouder over Judea was, onder den keizer Claudius, maar zulks is na dezen tijd geschied en na den dood van Herodes Agrippa. Zodat Gamaliël hier dan spreekt van een anderen Theudas, die ten tijde van den keizer Augustus of Tiberius geweest is."},{"catchword":"wat was, dien","tekst":"Dat is, wat groots, gelijk Act 8:9 ."},{"catchword":"aanhing;","tekst":"Grieks aankleefde."}],"37":[{"catchword":"Na hem stond op","tekst":"Dat is, na dezen Theudas."},{"catchword":"Judas, de","tekst":"Deze wordt anders genaamd Judas Gaulonites, die het volk oproerig maakte, als Archelaus afgezet en gebannen zijnde, de Romeinen het land van Judea tot ene provincie maakten, en door hunne stadhouders voortaan lieten regeren, en tot dien einde het land lieten beschrijven. Zie JosEf. lib.18, cap.1, en lib.20, cap.3. Josefus maakt nog melding van een anderen oproerigen Judas, den zoon van den moordenaar Ezechias, die vóór dezen oproer verwekte als Archelaus naar Rome was gereisd, om in zijns vaders Herodes plaats gesteld te worden; Antiq.lib.17, cpa. 12, en de bell. Judas lib.2, cap.2."},{"catchword":"in de dagen","tekst":"Dat is, ten tijde."},{"catchword":"der beschrijving,","tekst":"Deze beschrijving is niet dezelfde, waarvan gesproken wordt Luk 2:1-2 , want die geschiedde zonder oproer; en wordt de eerste genaamd ten aanzien van deze tweede, die daarna gedaan is over Judea, en met oproer gemengd, hetwelk deze Judas verwekt; Josefus Antiq. lib. 18, cap.1."}],"38":[{"catchword":"Houdt af van","tekst":"Namelijk dat gij hun geen kwaad meer doet."},{"catchword":"deze raad, of","tekst":"Dat is, dit onderstaan of bedrijf der apostelen."},{"catchword":"uit mensen is,","tekst":"Dat is, van mensen en uit menselijk gezag aangenomen; Mat 21:25 ."},{"catchword":"gebroken worden","tekst":"Grieks ontbonden."}],"39":[{"catchword":"uit God is,","tekst":"Dat is, uit goddelijk gezag en bevel aangesteld."},{"catchword":"breken; opdat","tekst":"Grieks ontbinden."},{"catchword":"misschien bevonden","tekst":"Of, te eniger tijd."}],"40":[{"catchword":"gaven hem gehoor;","tekst":"Dat is, zij lieten zich bewegen en overreden dat zij zijnen raad volgden."},{"catchword":"geselden","tekst":"Grieks sloegen; namelijk met roeden of geselen. Dit was hun van Christus voorzegd, Mat 10:17 , en Mat 23:34 ; hetzelfde is ook aan Paulus gedaan, 2Co 11:24 ."},{"catchword":"in den Naam","tekst":"Zie Act 4:18 ."}],"41":[{"catchword":"waardig geacht","tekst":"Namelijk van God, die hun uit genade deze eer en waardigheid gegeven had; Phi 1:29 ."},{"catchword":"om Zijns Naams","tekst":"Dat is, om de zaak en leer van Christus."}],"42":[{"catchword":"bij de huizen,","tekst":"Of, van huis tot huis. Zie Act 2:46 , en Act 20:20 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And a certain man by name Ananias, with Sapphira his wife sold an estate? [Gr.a possession.ver. 3.it is called a Land or Farm.]"}],"2":[{"catchword":null,"tekst":"And subtracted from the price, [That is, withheld by subtilty, concealed it and brought it not forth] with the privity of his wife also, and brought a certain part and laid (that) at the Apostles feet. [see Acts 4. 34.]"}],"3":[{"catchword":null,"tekst":"And Peter said, Ananias, wherefore hath Satan filled thine heart, [That is, wholly possessed with covetuousness and hypocrisie. Or wherefore hast thou given Satan place in thy heart] that thou shouldst ly to the Holy Ghost, [that is, contrary to thy conscience and conviction of the Holy Ghost, say with untruth that the Land which was sold yielded no more. Or deceive, i.e.shouldst endeavour to deceive, as thinking that the Holy Ghost knew not this, and should not reveal the same unto us] and subtract from the price of the Land?"}],"4":[{"catchword":null,"tekst":"If it had remained, [Gr.remaining, namely, unsold] did it not remain thine [That is, was is not at thy pleasure to have kept the same for thyself, without being necessitated to sell it] and being sold, was it not in thy power, [namely, to do with the money what thou thoughtest good; to keep the same for thy self or bring it hither, whereby it appears that this communion of goods was not in respect of the property, but in respect of the use, in time of need, see Acts 2. 44.] what is it that thou hast purposed [Gr.put or set] this deed in thy heart? Thou hast not lyed unto men; [that is, not so much, or not only as thou hast lyed unto the Holy Ghost, v.3.who is the true God with the Father and the Son. See 1 Cor. 3. 16.compared with 1 Cor.6.19.]"}],"5":[{"catchword":null,"tekst":"And Ananias hearing these words fell down and gave up the Ghost.[Gr.gave forth the breath. Peter thus punished the hypocrisie of this man with a sudden death for a warning to all other hypocrites, by a special inspiration of God, and by an extraordinary power with which the Apostles were furnished. See the like Acts 13. 11.which therefore they must not, nor may not imitate, who have such inspiration and power] And there came great fear upon all that heard this."}],"6":[{"catchword":null,"tekst":"And the young men, [Namely, which were there in the Congregation] arising, sitted him, [namely, by pulling off his cloathes; wrapping him in gravecloaths, and otherwise to bury him. Or took him away] and carried (him) forth and buried (him)"}],"7":[{"catchword":null,"tekst":"And it was about three hours after, [Gr.an interspace of about three hours] that his wife also came in: [Namely, into the place where the Apostles with the Church were assembled, Acts 2. 46.] not knowing what there was done. [namely, to her husband.]"}],"8":[{"catchword":null,"tekst":"And Peter answered her, [That is, spake to her and said.Hebr.] Tell me, did you sell the Land for so much? [Peter without doubt expressed the price which he had understood by the husband] And she said, yea for so much."}],"9":[{"catchword":null,"tekst":"And Peter said unto her, what is it that ye have consented among you to tempt the Spirit of the Lord? [That is, contrary to your knowledge to do things which God hath forbidden, as if ye would try whether the spirit of God be righteous and omniscient] behold the feet of those that have buried thy husband are before the door, and shall carry thee out. [namely, after that thou also shalt presently be fallen down and dead.]"}],"10":[{"catchword":null,"tekst":"And she fell down straightway before his feet, and gave up the Ghost. And the young men being come in found her dead, and carried (her) forth, and buried (her) by her husband."}],"11":[{"catchword":null,"tekst":"And there came great fear upon the whole Church, and upon all that heard this."}],"12":[{"catchword":null,"tekst":"And by thy hands of the Apostles, [That is, by the ministry of the Apostles, for they were but ministers and Instruments; the power came from the Lord, Acts 3. 12.and chap. 4. 30.and 7. 35.] many signes and wonders were done among the people: And they were all with one accord in Solomons Court. [see of this Court, 1 Kings 6. 3. Joh 10:23. Acts 3. 11.]"}],"13":[{"catchword":null,"tekst":"And of the other, [Namely, which were of any account, and had not yet betaken themselves to the Church] no man durst join himself unto them, but the people held them in great esteem. [Gr.magnified them, Luke 1. 46. 2 Cor 10. 15.]"}],"14":[{"catchword":null,"tekst":"And more and more were added; [Or so much the more namely, notwithstanding this judgement was happened to Ananias and his wife: or besides the fromer multitude, Acts 2 v. 47.and chap. 4. 4.] which believed the Lord, multitudes both of men and of women ."}],"15":[{"catchword":null,"tekst":"So that they carried forth the sick on the streets: [Or from streets to streets , i.e. every where on the streets ] and laid (them) on beds and couches, that as Peter came, [that is, passed thereby] even but the shadow might overshadow any one of them. [namely, to be healed thereby, John 14. 12.]"}],"16":[{"catchword":null,"tekst":"And also the multitude out of the Cities lying about came together to Jerusalem, bringing sick, and those that were troubled with unclean spirits, [See the like, Luke 6. 18.] which were all healed."}],"17":[{"catchword":null,"tekst":"And the high Priest stood up, and all that were with him (which was the sect [Gr.Hairesis, by which word is signified a manner of Religion, which any one hath chosen for himself and followeth, Acts 26. 5.and 28. 22.and this word in the beginning seemeth to have been tak // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
