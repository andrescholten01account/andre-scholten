  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }

  .vers:hover .kopieer { opacity: .75; }

ij het wilden getuigen), dat ik naar de strengste richting van onze godsdienst als een Farizeeër geleefd heb.","6":"En nu sta ik en word geoordeeld over de hoop van de belofte die door God aan de vaderen gedaan is;","7":"Waarnaar onze twaalf stammen, voortdurend nacht en dag *God* dienend, hopen te komen; over die hoop, o koning Agrippa, word ik door de Joden beschuldigd.","8":"Wat? Wordt het bij u ongelooflijk geoordeeld dat God de doden opwekt?","9":"Ik meende inderdaad bij mijzelf dat ik tegen de Naam van Jezus van Nazareth veel dingen moest doen die ertegen ingingen.","10":"Dat heb ik ook gedaan in Jeruzalem, en ik heb velen van de heiligen in de gevangenissen gesloten, nadat ik de macht van de overpriesters ontvangen had; en toen zij omgebracht werden, stemde ik ermee in.","11":"En door alle synagogen heen heb ik hen dikwijls gestraft en gedwongen te lasteren; en boven mate tegen hen woedend heb ik hen vervolgd, ook tot in de buitenlandse steden.","12":"Waarover ik ook, toen ik naar Damaskus reisde, met macht en opdracht die ik van de overpriesters *had*,","13":"Zag ik, o koning, midden op de dag, op de weg een licht, sterker dan de glans van de zon, vanuit de hemel mij en hen die met mij reisden omschijnen.","14":"En toen wij allen op de grond neergevallen waren, hoorde ik een stem tot mij spreken, die zei in de Hebreeuwse taal: Saul, Saul, waarom vervolgt u Mij? Het is u hard, tegen de prikkels de hielen te slaan.","15":"En ik zei: Wie bent U, Heere? En Hij zei: Ik ben Jezus, Die u vervolgt.","16":"Maar richt u op en sta op uw voeten; want hiertoe ben Ik u verschenen, om u aan te stellen tot een dienaar en getuige, zowel van de dingen die u gezien hebt als van de dingen waarin Ik u nog zal verschijnen;","17":"En zal u verlossen van dit volk en van de heidenen, tot wie Ik u nu zend;","18":"Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.","19":"Daarom, o koning Agrippa, ben ik dat hemelse gezicht niet ongehoorzaam geweest;","20":"Maar heb eerst aan hen die te Damaskus waren, en te Jeruzalem, en in het gehele land Judea, en aan de heidenen verkondigd dat zij zich zouden bekeren en zich tot God bekeren, en werken zouden doen die de bekering waardig zijn.","21":"Om deze dingen hebben de Joden mij in de tempel gegrepen en geprobeerd mij om te brengen.","22":"Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;","23":"*Namelijk* dat de Christus moest lijden, en dat Hij, als Eerste uit de opstanding van de doden, een licht zou verkondigen aan dit volk en aan de heidenen.","24":"En toen hij deze dingen tot verantwoording sprak, zei Festus met luide stem: U bent gek, Paulus, de grote geleerdheid brengt u tot razernij!","25":"Maar hij zei: Ik ben niet gek, machtigste Festus, maar ik spreek woorden van waarheid en van een gezond verstand;","26":"Want de koning weet van deze dingen, tot wie ik ook vrijmoedig spreek; want ik geloof niet dat hem iets van deze dingen verborgen is; want dit is niet in een hoek gebeurd.","27":"Gelooft u, o koning Agrippa, de profeten? Ik weet dat u ze gelooft.","28":"En Agrippa zei tegen Paulus: U overtuigt mij bijna een christen te worden.","29":"En Paulus zei: Ik zou van God wensen dat, zowel bijna als geheel, niet alleen u, maar ook allen die mij vandaag horen, zulke mensen werden zoals ik ben, uitgezonderd deze boeien.","30":"En toen hij dit gezegd had, stond de koning op, en de stadhouder, en Bernice, en zij die met hen gezeten waren;","31":"En toen zij zich hadden teruggetrokken, spraken zij met elkaar en zeiden: Deze mens doet niets wat de dood of boeien waard is.","32":"En Agrippa zei tegen Festus: Deze mens had losgelaten kunnen worden, als hij zich niet op de keizer had beroepen."},"SV":{"1":"En Agrippa zeide tot Paulus: Het is u geoorloofd voor uzelven te spreken. Toen strekte Paulus de hand uit, en verantwoordde zich *aldus*:","2":"Ik acht mijzelven gelukkig, o koning Agrippa, dat ik mij heden voor u zal verantwoorden van alles, waarover ik van de Joden beschuldigd word;","3":"Allermeest, dewijl ik weet, dat gij kennis hebt van alle gewoonten en vragen, die onder de Joden zijn. Daarom bid ik u, dat gij mij lankmoediglijk hoort.","4":"Mijn leven dan van der jonkheid aan, hetwelk van den beginne onder mijn volk te Jeruzalem geweest is, weten al de Joden;","5":"Als die van over lang mij te voren gekend hebben ( indien zij het wilden getuigen), dat ik, naar de bescheidenste sekte van onzen godsdienst, *als* een Farizeër geleefd heb.","6":"En nu sta ik, en word geoordeeld over de hoop der belofte, die van God tot de vaderen geschied is;","7":"Tot dewelke onze twaalf geslachten, geduriglijk nacht en dag *God* dienende, verhopen te komen; over welke hoop ik, o koning Agrippa, van de Joden word beschuldigd.","8":"Wat? wordt het bij ulieden ongelofelijk geoordeeld, dat God de doden opwekt?","9":"Ik meende waarlijk bij mijzelven, dat ik tegen den Naam van Jezus van Nazareth vele wederpartijdige dingen moest doen.","10":"Hetwelk ik ook gedaan heb te Jeruzalem, en ik heb velen van de heiligen in de gevangenissen gesloten, de macht van de overpriesters ontvangen hebbende; en als zij omgebracht werden, stemde ik het toe.","11":"En door al de synagogen heb ik hen dikwijls gestraft, en gedwongen te lasteren; en boven mate tegen hen woedende, heb ik *hen* vervolgd, ook tot in de buiten *landse* steden.","12":"Waarover ook als ik naar Damaskus reisde, met macht en last, welk *ik* van de overpriesters *had*,","13":"Zag ik, o koning, in het midden van den dag, op den weg een licht, boven den glans der zon, van den hemel mij en degenen, die met mij reisden, omschijnende.","14":"En als wij allen ter aarde nedergevallen waren, hoorde ik een stem, tot mij sprekende, en zeggende in de Hebreeuwse taal: Saul, Saul, wat vervolgt gij Mij? Het is u hard, tegen de prikkels de verzenen te slaan.","15":"En ik zeide: Wie zijt Gij, Heere? En Hij zeide: Ik ben Jezus, Dien gij vervolgt.","16":"Maar richt u op, en sta op uw voeten; want hiertoe ben Ik u verschenen, om u te stellen tot een dienaar en getuige der dingen, beide die gij gezien hebt en in welke Ik u *nog* zal verschijnen;","17":"Verlossende u van dit volk, en *van* de heidenen, tot dewelke Ik u nu zende;","18":"Om hun ogen te openen, en *hen* te bekeren van de duisternis tot het licht, en *van* de macht des satans tot God; opdat zij vergeving der zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.","19":"Daarom, o koning Agrippa, ben ik dat Hemels gezicht niet ongehoorzaam geweest;","20":"Maar heb eerst dengenen, die te Damaskus waren, en te Jeruzalem, en in het gehele land van Judea, en den heidenen verkondigd , dat zij zich zouden beteren, en tot God bekeren, werken doende der bekering waardig.","21":"Om dezer zaken wil hebben mij de Joden in den tempel gegrepen en gepoogd om te brengen.","22":"Dan, hulp van God verkregen hebbende, sta ik tot op dezen dag, betuigende beiden klein en groot; niets zeggende buiten hetgeen de profeten en Mozes gesproken hebben, dat geschieden zoude;","23":"*Namelijk* dat de Christus lijden moest, en dat Hij, de Eerste uit de opstanding der doden zijnde, een licht zou verkondigen dezen volke, en den heidenen.","24":"En als hij deze dingen tot verantwoording sprak, zeide Festus met grote stem: Gij raast, Paulus, de grote geleerdheid brengt u tot razernij!","25":"Maar hij zeide: Ik raas niet, machtigste Festus, maar ik spreek woorden van waarheid en van een gezond verstand;","26":"Want de koning weet van deze dingen, tot welken ik ook vrijmoedigheid gebruikende spreek; want ik geloof niet, dat hem iets van deze dingen verborgen is; want dit is in geen hoek geschied.","27":"Gelooft gij, o koning Agrippa, de profeten? Ik weet dat gij ze gelooft.","28":"En Agrippa zeide tot Paulus: Gij beweegt mij bijna een Christen te worden.","29":"En Paulus zeide: Ik wenste wel van God, dat, en bijna en geheellijk, niet alleen gij, maar ook allen, die mij heden horen, zodanigen wierden, gelijk als ik ben, uitgenomen deze banden.","30":"En als hij dit gezegd had, stond de koning op, en de stadhouder, en Bernice, en die met hen gezeten waren;","31":"En aan een zijde gegaan zijnde, spraken zij tot elkander, zeggende: Deze mens doet niets des doods of der banden waardig.","32":"En Agrippa zeide tot Festus: Deze mens kon losgelaten worden, indien hij zich op den keizer niet had beroepen."},"KJV":{"1":"Then Agrippa said unto Paul, Thou art permitted to speak for thyself. Then Paul stretched forth the hand, and answered for himself:","2":"I think myself happy, king Agrippa, because I shall answer for myself this day before thee touching all the things whereof I am accused of the Jews:","3":"Especially *because I know* thee to be expert in all customs and questions which are among the Jews: wherefore I beseech thee to hear me patiently.","4":"My manner of life from my youth, which was at the first among mine own nation at Jerusalem, know all the Jews;","5":"Which knew me from the beginning, if they would testify, that after the most straitest sect of our religion I lived a Pharisee.","6":"And now I stand and am judged for the hope of the promise made of God unto our fathers:","7":"Unto which *promise* our twelve tribes, instantly serving *God* day and night, hope to come. For which hope's sake, king Agrippa, I am accused of the Jews.","8":"Why should it be thought a thing incredible with you, that God should raise the dead?","9":"I verily thought with myself, that I ought to do many things contrary to the name of Jesus of Nazareth.","10":"Which thing I also did in Jerusalem: and many of the saints did I shut up in prison, having received authority from the chief priests; and when they were put to death, I gave my voice","11":"And I punished them oft in every synagogue, and compelled *them* to blaspheme; and being exceedingly mad against them, I persecuted *them* even unto strange cities.","12":"Whereupon as I went to Damascus with authority and commission from the chief priests,","13":"At midday, O king, I saw in the way a light from heaven, above the brightness of the sun, shining round about me and them which journeyed with me.","14":"And when we were all fallen to the earth, I heard a voice speaking unto me, and saying in the Hebrew tongue, Saul, Saul, why persecutest thou me? *it is* hard for thee to kick against the pricks.","15":"And I said, Who art thou, Lord? And he said, I am Jesus whom thou persecutest.","16":"But rise, and stand upon thy feet: for I have appeared unto thee for this purpose, to make thee a minister and a witness both of these things which thou hast seen, and of those things in the which I will appear unto thee;","17":"Delivering thee from the people, and *from* the Gentiles, unto whom now I send thee,","18":"To open their eyes, *and* to turn *them* from darkness to light, and *from* the power of Satan unto God, that they may receive forgiveness of sins, and inheritance among them which are sanctified by faith that is in me.","19":"Whereupon, O king Agrippa, I was not disobedient unto the heavenly vision:","20":"But shewed first unto them of Damascus, and at Jerusalem, and throughout all the coasts of Judaea, and *then* to the Gentiles, that they should repent and turn to God, and do works meet for repentance.","21":"For these causes the Jews caught me in the temple, and went about to kill","22":"Having therefore obtained help of God, I continue unto this day, witnessing both to small and great, saying none other things than those which the prophets and Moses did say should come:","23":"That Christ should suffer, *and* that he should be the first that should rise from the dead, and should shew light unto the people, and to the Gentiles.","24":"And as he thus spake for himself, Festus said with a loud voice, Paul, thou art beside thyself; much learning doth make thee mad.","25":"But he said, I am not mad, most noble Festus; but speak forth the words of truth and soberness.","26":"For the king knoweth of these things, before whom also I speak freely: for I am persuaded that none of these things are hidden from him; for this thing was not done in a corner.","27":"King Agrippa, believest thou the prophets? I know that thou believest.","28":"Then Agrippa said unto Paul, Almost thou persuadest me to be a Christian.","29":"And Paul said, I would to God, that not only thou, but also all that hear me this day, were both almost, and altogether such as I am, except these bonds.","30":"And when he had thus spoken, the king rose up, and the governor, and Bernice, and they that sat with them:","31":"And when they were gone aside, they talked between themselves, saying, This man doeth nothing worthy of death or of bonds.","32":"Then said Agrippa unto Festus, This man might have been set at liberty, if he had not appealed unto Caesar."}},"tsk":{"1":[{"kopje":"U","refs":["Hand 25:16","Spr 18:13","Spr 18:17","Joh 7:51"]},{"kopje":"strekte","refs":["Spr 1:24","Ezech 16:27","Rom 10:21"]},{"kopje":"verantwoordde","refs":["Hand 26:2","Hand 22:1"]}],"3":[{"kopje":"omdat","refs":["Hand 26:26","Hand 6:14","Hand 21:21","Hand 24:10","Hand 25:19","Hand 25:20","Hand 25:26","Hand 28:17","Deut 17:18","1 Kor 13:2"]},{"kopje":"hoort","refs":["Hand 24:4"]}],"4":[{"kopje":"leven","refs":["2 Tim 3:10"]},{"kopje":"dat","refs":["Hand 22:3"]}],"5":[{"kopje":"als","refs":["Hand 22:5"]},{"kopje":"dat","refs":["Hand 23:6","Fil 3:5","Fil 3:6"]},{"kopje":"richting","refs":["Hand 24:5","Hand 24:14"]}],"6":[{"kopje":"sta","refs":["Hand 26:8","Hand 23:6","Hand 24:15","Hand 24:21","Hand 28:20"]},{"kopje":"de belofte","refs":["Hand 3:24","Hand 13:32","Hand 13:33","Gen 3:15","Gen 12:3","Gen 22:18","Gen 26:4","Gen 49:10","Deut 18:15","2 Sam 7:12","2 Sam 7:13","Job 19:25-27 ">This</span> <span class=\"wl wl-kjv\" data-code=\"G444\">man</span> <span class=\"wl wl-kjv\" data-code=\"G1410\">might</span> have been set at <span class=\"wl wl-kjv\" data-code=\"G630\">liberty,</span> <span class=\"wl wl-kjv\" data-code=\"G1508\">if</span> he <span class=\"wl wl-kjv\" data-code=\"G1941\">had</span> <span class=\"wl wl-kjv\" data-code=\"G1508\">not</span> appealed <span class=\"wl wl-kjv\" data-code=\"G1941\">unto</span> Caesar."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de hand uit,","tekst":"Namelijk om stilte en gehoor te verwekken."}],"3":[{"catchword":"kennis hebt","tekst":"Grieks een kenner zijt; namelijk als een Jood, en in den Joodsen godsdienst onderwezen. Dit zegt hij niet om Agrippa te pluimstrijken, maar om hem tot meerder aandacht en leerzaamheid te bewegen."},{"catchword":"vragen, die","tekst":"Of, kwestiën, geschillen."}],"4":[{"catchword":"Mijn leven dan","tekst":"Dat is, hoe ik geleefd, of mij gedragen heb."}],"5":[{"catchword":"van over lang","tekst":"Grieks van boven aan; dat is, van verleden tijden."},{"catchword":"bescheidenste","tekst":"Of, scherpste, volkomenste. Zie Act 22:3 , en Act 23:8 ."}],"6":[{"catchword":"der belofte,","tekst":"Dat is, van de vervulling der belofte, van de gerechtigheid en zaligheid door den Messias te verkrijgen, vs.22,23."}],"7":[{"catchword":"Tot dewelke","tekst":"Namelijk hoop, dat is gehoopte zaak, of belofte, dat is beloofde zaak."},{"catchword":"onze twaalf","tekst":"Namelijk de godvruchtige Joden uit de twaalf geslachten Israëls, niet alleen in Judea woonachtig, maar ook door de gehele wereld verstrooid; Jam 1:1 ."},{"catchword":"geduriglijk","tekst":"Grieks in gedurigheid, of in vurigheid."},{"catchword":"verhopen te","tekst":"Welke hoop namelijk in zichzelve wel goed is, maar hierin gebrekkelijk, dat zij nog hopen of verwachten hetgeen in Christus Jezus alrede is vervuld."},{"catchword":"over welke hoop","tekst":"Dat is, over de vervulling van welke hoop, enz. Waarin ook de hoop der opstanding der doden en vooral van den Messias is begrepen; hetwelk hij zonder twijfel uit de Schriften der profeten had bewezen, gelijk hij doet Act 13:33 , en vervolgens; gelijk de navolgende reden van Paulus verklaart."}],"8":[{"catchword":"Wat? wordt","tekst":"Dit schijnt hij gesproken te hebben, zich kerende tot Festus en andere heidenen; want Agrippa geloofde de profeten, vs.27, en derhalve ook de opstanding der doden, vs.7."}],"9":[{"catchword":"Ik meende waarlijk","tekst":"Namelijk gelijk de anderen nu doen, met een blinden ijver, zonder rechte wetenschap."}],"10":[{"catchword":"de heiligen","tekst":"Dat is, degenen, die in Christus geloofden."},{"catchword":"stemde ik het toe","tekst":"Grieks bracht ik mijn stem daartoe. Van het Griekse woord psephos, zie Act 2:17 ."}],"11":[{"catchword":"dikmaals gestraft,","tekst":"Namelijk die volstandig bleven in hun geloof."},{"catchword":"gedwongen te","tekst":"Dat is, met pijnigen en dreigementen gedwongen Christus te verloochenen, ja zelfs te vloeken, gelijk dit ook was de wijze der heidenen in het vervolgen der Christenen. Zie Plin. Jun. in Epist. ad TrajaNum."}],"12":[{"catchword":"Waarover ook","tekst":"Hetgeen in dit verhaal verklaring van node heeft, daarvan zie de aantekeningen op Hand. 9."}],"14":[{"catchword":"wij allen ter","tekst":"Dat is, zowel die met mij reisden, als ik, hoewel ik bleef liggen,, en zij terstond al verbaasd opstonden; Act 9:7 ."},{"catchword":"Hebreeuwse taal","tekst":"Hieruit schijnt dat Paulus Agrippa en Festus in het Hebreeuws niet heeft aangesproken, maar in het Grieks of in het Latijn, als hun beter bekend."}],"16":[{"catchword":"verschenen,","tekst":"Of, van u gezien. Van de manier van deze verschijning, zie de aantekeningen Act 9:17 ."}],"17":[{"catchword":"van dit volk,","tekst":"Namelijk der Joden, die u zullen vervolgen."}],"18":[{"catchword":"ogen te openen,","tekst":"Dat is, hun verstand, namelijk door de predikatie mijns Evangelies."},{"catchword":"van de duisternis","tekst":"Dat is, van de natuurlijke blindheid en wereldse onwetendheid, tot de rechte en ware kennis Gods ter eeuwige zaligheid."},{"catchword":"een erfdeel","tekst":"Grieks een lot; omdat de erfdelen veeltijds door het lot uitgedeeld worden."}],"20":[{"catchword":"waardig","tekst":"Zie hiervan de verklaring Mat 3:8 ."}],"22":[{"catchword":"sta ik tot op","tekst":"Dat is, ben ik nog in het leven behouden, en daarom niet trager geworden om het Evangelie te verkondigen."},{"catchword":"klein en groot;","tekst":"Dat is, een iegelijk, van wat staat of bediening hij zij."}],"23":[{"catchword":"de Eerste uit","tekst":"Namelijk om eeuwiglijk te leven; want enige, die tevoren opgestaan waren, zijn wederom gestorven. Doch Paulus ziet hier niet alleen op de orde, maar inzonderheid op de kracht van Christus als van het hoofd, waardoor de gelovigen al zijne leden te zijner tijd ook tot het eeuwige leven zullen opstaan. Zie 1Co 15:22-23 ; Col 1:18 ."},{"catchword":"een licht zou","tekst":"Zie vs.18."}],"24":[{"catchword":"Gij raast,","tekst":"Namelijk gelijk lieden, die ijdel van zinnen zijn van te veel studeren. Alzo oordeelt de natuurlijke mens van de wijsheid Gods; 1Co 1:23 , en 1Co 2:14 ."},{"catchword":"de grote geleerdheid","tekst":"Grieks de vele letteren."},{"catchword":"brengt u tot razernij","tekst":"Grieks keert u om."}],"25":[{"catchword":"van een gezond verstand;","tekst":"Of, van een gematigd en nuchter verstand."}],"26":[{"catchword":"deze dingen,","tekst":"Namelijk die ik van Christus Jezus en hetgeen Hem geschied is verhaald heb, dewijl het te Jeruzalem openlijk geschied en geheel Syrië door bekend is."}],"27":[{"catchword":"gelooft","tekst":"Dat is, voor waarachtig en voor Gods Woord houdt."}],"28":[{"catchword":"beweegt mij","tekst":"Grieks overreedt."}],"29":[{"catchword":"dat, en bijna","tekst":"Grieks dat, en in weinig en in veel."},{"catchword":"deze banden","tekst":"Dat is, deze keten, waar zijne hand in gesloten was. Zie Act 12:6 , en Act 28:16 ."}], // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {

    }

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
