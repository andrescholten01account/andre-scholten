6":"En de menigten hielden zich eensgezind aan wat door Filippus gezegd werd, omdat zij hoorden en zagen de tekenen die hij deed.","7":"Want van velen die onreine geesten hadden, gingen die geesten uit, terwijl zij met luide stem riepen; en velen die verlamd en kreupel waren, werden genezen.","8":"En er ontstond grote blijdschap in die stad.","9":"En er was een zekere man, met de naam Simon, die van tevoren in de stad toverij bedreef en het volk van Samaria versteld deed staan, terwijl hij van zichzelf zei dat hij iets groots was.","10":"Hem hingen zij allen aan, van klein tot groot, en zeiden: Deze man is de grote kracht van God.","11":"En zij hingen hem aan, omdat hij hen een lange tijd met toverijen versteld had doen staan.","12":"Maar toen zij Filippus geloofden, die het Evangelie van het Koninkrijk van God en van de Naam van Jezus Christus verkondigde, werden zij gedoopt, zowel mannen als vrouwen.","13":"En Simon geloofde ook zelf, en toen hij gedoopt was, bleef hij voortdurend bij Filippus; en toen hij de tekenen en grote krachten zag die er gebeurden, stond hij versteld.","14":"Toen nu de apostelen die in Jeruzalem waren, hoorden dat Samaria het Woord van God had aangenomen, zonden zij Petrus en Johannes naar hen toe,","15":"die, toen zij aangekomen waren, voor hen baden, opdat zij de Heilige Geest zouden ontvangen.","16":"(Want Hij was nog op niemand van hen gevallen, maar zij waren alleen gedoopt in de Naam van de Heere Jezus.)","17":"Toen legden zij hun de handen op, en zij ontvingen de Heilige Geest.","18":"En toen Simon zag dat door het opleggen van de handen van de apostelen de Heilige Geest gegeven werd, bood hij hun geld aan,","19":"en zei: Geef ook mij deze macht, opdat ieder aan wie ik de handen opleg, de Heilige Geest ontvangt.","20":"Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!","21":"U hebt geen deel en geen aandeel in dit woord, want uw hart is niet recht voor God.","22":"Bekeer u dan van deze slechtheid van u, en bid tot God, of misschien deze overweging van uw hart u vergeven wordt.","23":"Want ik zie dat u bent in een geheel bittere gal en in de samenknoping van ongerechtigheid[1].","24":"Maar Simon antwoordde en zei: Bid u voor mij tot de Heere, opdat niets van wat u gezegd hebt over mij komt.","25":"Zij dan nu, toen zij het Woord van de Heere betuigd en gesproken hadden, keerden terug naar Jeruzalem, en verkondigden het Evangelie in veel dorpen van de Samaritanen.","26":"En een engel van de Heere sprak tot Filippus en zei: Sta op, en ga naar het zuiden, op de weg die van Jeruzalem afdaalt naar Gaza, die woest is.","27":"En hij stond op en ging heen; en zie, een Moorman, een kamerling, een machtige heer van Candacé, de koningin van de Moren, die over al haar schat ging, was gekomen om te aanbidden in Jeruzalem;","28":"en hij keerde terug en zat op zijn wagen en las de profeet Jesaja.","29":"En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.","30":"En Filippus liep erheen en hoorde hem de profeet Jesaja lezen, en zei: Begrijpt u ook wat u leest?","31":"En hij zei: Hoe zou ik dat toch kunnen, als niemand mij onderricht? En hij vroeg Filippus dringend om op te komen en bij hem te zitten.","32":"En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.","33":"In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.","34":"En de kamerling antwoordde Filippus en zei: Ik vraag u, over wie zegt de profeet dit, over zichzelf, of over iemand anders?","35":"En Filippus deed zijn mond open en begon vanaf datzelfde Schriftgedeelte, en verkondigde hem Jezus.","36":"En terwijl zij over de weg reisden, kwamen zij bij een zeker water; en de kamerling zei: Zie, hier is water; wat verhindert mij om gedoopt te worden?","37":"En Filippus zei: Als u van ganser harte gelooft, is het geoorloofd. En hij antwoordde en zei: Ik geloof dat Jezus Christus de Zoon van God is.","38":"En hij gebood de wagen stil te houden; en zij daalden beiden af in het water, zowel Filippus als de kamerling, en hij doopte hem.","39":"En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.","40":"Maar Filippus werd gevonden te Azote; en terwijl hij het land doortrok, verkondigde hij het Evangelie in alle steden, totdat hij in Cesarea kwam."},"SV":{"1":"En Saulus had mede een welbehagen aan zijn dood. En er werd te dien dage een grote vervolging tegen de Gemeente, die te Jeruzalem was; en zij werden allen verstrooid door de landen van Judea en Samaria, behalve de apostelen.","2":"En *enige* godvruchtige mannen droegen Stefanus te zamen *ten* *grave* en maakten groten rouw over hem.","3":"En Saulus verwoestte de Gemeente, gaande in de huizen; en trekkende mannen en vrouwen, leverde hen over in de gevangenis.","4":"Zij dan nu, die verstrooid waren, gingen *het* *land* door, en verkondigden het Woord.","5":"En Filippus kwam af in de stad van Samaria, en predikte hun Christus.","6":"En de scharen hielden zich eendrachtelijk aan hetgeen van Filippus gezegd werd, dewijl zij hoorden en zagen de tekenen, die hij deed.","7":"Want van velen, die onreine geesten hadden, gingen *dezelve* uit, roepende met grote stem; en vele geraakten en kreupelen werden genezen.","8":"En er werd grote blijdschap in die stad.","9":"En een zeker man, met name Simon, was te voren in de stad plegende toverij, en verrukkende de zinnen des volks van Samaria, zeggende van zichzelven, dat hij wat groots was.","10":"Welken zij allen aanhingen, van den kleine tot den grote, zeggende: Deze is de grote kracht Gods.","11":"En zij hingen hem aan, omdat hij een langen tijd met toverijen hun zinnen verrukt had.","12":"Maar toen zij Filippus geloofden, die het Evangelie van het Koninkrijk Gods, en *van* den Naam van Jezus Christus verkondigde, werden zij gedoopt, beiden, mannen en vrouwen.","13":"En Simon geloofde ook zelf, en gedoopt zijnde, bleef gedurig bij Filippus; en ziende de tekenen en grote krachten, die er geschiedden, ontzette hij zich.","14":"Als nu de apostelen, die te Jeruzalem waren, hoorden, dat Samaria het Woord Gods aangenomen had, zonden zij, hen Petrus en Johannes;","15":"Dewelken, afgekomen zijnde, baden voor hen, dat zij den Heiligen Geest ontvangen mochten.","16":"( Want Hij was nog op niemand van hen gevallen, maar zij waren alleenlijk gedoopt in den Naam van den Heere Jezus.)","17":"Toen legden zij de handen op hen, en zij ontvingen den Heiligen Geest.","18":"En als Simon zag, dat, door oplegging van de handen der apostelen de Heilige Geest gegeven werd, zo bood hij hun geld aan,","19":"Zeggende: Geeft ook mij deze macht, opdat, zo wien ik de handen opleg, hij den Heiligen Geest ontvange.","20":"Maar Petrus zeide tot hem: Uw geld zij met u ten verderve, omdat gij gemeend hebt, dat de gave Gods door geld verkregen wordt!","21":"Gij hebt geen deel noch lot in dit woord: want uw hart is niet recht voor God.","22":"Bekeer u dan van deze uw boosheid, en bid God, of misschien u deze overlegging uws harten vergeven wierd.","23":"Want ik zie, dat gij zijt in een gans bittere gal en samenknoping der ongerechtigheid.","24":"Doch Simon, antwoordende, zeide: Bidt gijlieden voor mij tot den Heere, opdat niets over mij kome van hetgeen gij gezegd hebt.","25":"Zij dan nu, als zij het Woord des Heeren betuigd en gesproken hadden, keerden wederom naar Jeruzalem, en verkondigden het Evangelie *in* vele vlekken der Samaritanen.","26":"En een engel des Heeren sprak tot Filippus, zeggende: Sta op, en ga heen tegen het zuiden, op den weg, die van Jeruzalem afdaalt naar Gaza, welke woest is.","27":"En hij stond op en ging heen; en ziet, een Moorman, een kamerling, *en* een machtig heer van Candace, de koningin der Moren, die over al haar schat was, welke was gekomen om aan te bidden te Jeruzalem;","28":"En hij keerde wederom, en zat op zijn wagen, en las den profeet Jesaja.","29":"En de Geest zeide tot Filippus: Ga toe, en voeg u bij dezen wagen.","30":"En Filippus liep toe, en hoorde hem den profeet Jesaja lezen, en zeide: Verstaat gij ook, hetgeen gij leest?","31":"En hij zeide: Hoe zou ik toch kunnen, zo mij niet iemand onderricht? En hij bad Filippus, dat hij zou opkomen, en bij hem zitten.","32":"En de plaats der Schriftuur, die hij las, was deze: Hij is gelijk een schaap ter slachting geleid; en gelijk een lam stemmeloos is voor dien, die het scheert, alzo doet Hij Zijn mond niet open.","33":"In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.","34":"En de kamerling antwoordde Filippus en zeide: Ik bid u, van Wien zegt de profeet dit, van zichzelven, of van iemand anders?","35":"En Filippus deed zijn mond open en beginnende van diezelfde Schrift, verkondigde hem Jezus.","36":"En alzo zij over weg reisden, kwamen zij aan een zeker water; en de kamerling zeide: Ziedaar water; wat verhindert mij gedoopt te worden?","37":"En Filippus zeide: Indien gij van ganser harte gelooft, zo is het geoorloofd. En hij, antwoordende, zeide: Ik geloof, dat Jezus Christus de Zoon van God is.","38":"En hij gebood den wagen stil te houden; en zij daalden beiden af in het water, zo Filippus als de kamerling, en hij doopte hem.","39":"En toen zij uit het water waren opgekomen, nam de Geest des Heeren Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.","40":"Maar Filippus werd gevonden, te Azote; en *het* *land* doorgaande, verkondigde hij het Evangelie *in* alle steden, totdat hij te Cesarea kwam."},"KJV":{"1":"And Saul was consenting unto his death. And at that time there was a great persecution against the church which was at Jerusalem; and they were all scattered abroad throughout the regions of Judaea and Samaria, except the apostles.","2":"And devout men carried Stephen *to his burial*, and made great lamentation over him.","3":"As for Saul, he made havock of the church, entering into every house, and haling men and women committed *them* to prison.","4":"Therefore they that were scattered abroad went every where preaching the word.","5":"Then Philip went down to the city of Samaria, and preached Christ unto them.","6":"And the people with one accord gave heed unto those things which Philip spake, hearing and seeing the miracles which he did.","7":"For unclean spirits, crying with loud voice, came out of many that were possessed *with them*: and many taken with palsies, and that were lame, were healed.","8":"And there was great joy in that city.","9":"But there was a certain man, called Simon, which beforetime in the same city used sorcery, and bewitched the people of Samaria, giving out that himself was some great one:","10":"To whom they all gave heed, from the least to the greatest, saying, This man is the great power of God.","11":"And to him they had regard, because that of long time he had bewitched them with sorceries.","12":"But when they believed Philip preaching the things concerning the kingdom of God, and the name of Jesus Christ, they were baptized, both men and women.","13":"Then Simon himself believed also: and when he was baptized, he continued with Philip, and wondered, beholding the miracles and signs which were done.","14":"Now when the apostles which were at Jerusalem heard that Samaria had received the word of God, they sent unto them Peter and John:","15":"Who, when they were come down, prayed for them, that they might receive the Holy Ghost:","16":"(For as yet he was fallen upon none of them: only they were baptized in the name of the Lord Jesus.)","17":"Then laid they *their* hands on them, and they received the Holy Ghost.","18":"And when Simon saw that through laying on of the apostles' hands the Holy Ghost was given, he offered them money,","19":"Saying, Give me also this power, that on whomsoever I lay hands, he may receive the Holy Ghost.","20":"But Peter said unto him, Thy money perish with thee, because thou hast thought that the gift of God may be purchased with money.","21":"Thou hast neither part nor lot in this matter: for thy heart is not right in the sight of God.","22":"Repent therefore of this thy wickedness, and pray God, if perhaps the thought of thine heart may be forgiven thee.","23":"For I perceive that thou art in the gall of bitterness, and *in* the bond of iniquity.","24":"Then answered Simon, and said, Pray ye to the Lord for me, that none of these things which ye have spoken come upon me.","25":"And they, when they had testified and preached the word of the Lord, returned to Jerusalem, and preached the gospel in many villages of the Samaritans.","26":"And the angel of the Lord spake unto Philip, saying, Arise, and go toward the south unto the way that goeth down from Jerusalem unto Gaza, which is desert.","27":"And he arose and went: and, behold, a man of Ethiopia, an eunuch of great authority under Candace queen of the Ethiopians, who had the charge of all her treasure, and had come to Jerusalem for to worship,","28":"Was returning, and sitting in his chariot read Esaias the prophet.","29":"Then the Spirit said unto Philip, Go near, and join thyself to this chariot.","30":"And Philip ran thither to *him*, and heard him read the prophet Esaias, and said, Understandest thou what thou readest?","31":"And he said, How can I, except some man should guide me? And he desired Philip that he would come up and sit with him.","32":"The place of the scripture which he read was this, He was led as a sheep to the slaughter; and like a lamb dumb before his shearer, so opened he not his mouth:","33":"In his humiliation his judgment was taken away: and who shall declare his generation? for his life is taken from the earth.","34":"And the eunuch answered Philip, and :{"kanttekeningen_nl":{"1":[{"catchword":"welbehagen aan","tekst":"Namelijk uit onwetenheid en een verkeerden ijver, menende daarmede Gode dienst te doen; Joh 16:2 ; 1Ti 1:13 ."},{"catchword":"dood","tekst":"Of, ombrengen."},{"catchword":"verstrooid door","tekst":"Dit wordt voornamelijk verstaan van de leraars, die te Jeruzalem benevens de apostelen waren, gelijk zulks afgenomen kan worden uit het einde van vs.1, en vs.4,5."},{"catchword":"behalve de apostelen","tekst":"Namelijk als die bijzonderen last ontvangen hadden om te Jeruzalem te blijven; Act 1:4 , Act 1:8 , totdat de leer des Evangelies daar genoegzaam bevestigd en verbreid zou zijn; Isa 2:3 ."}],"2":[{"catchword":"droegen Stefanus","tekst":"Namelijk uit de plaats waar Stefanus was gestenigd, geen gevaar ontziende, dat hun daarover zou mogen overkomen."},{"catchword":"groten rouw","tekst":"Namelijk naar de wijze der Joden, omtrent de begrafenissen van aanzienlijke personen, Gen 50:10 ; Joh 11:31 , temeer omdat zij van harte bedroefd waren over het verlies van zulk een treffelijken man."}],"3":[{"catchword":"leverde hen over","tekst":"Namelijk aan de oversten om door hen in de gevangenis geworpen te worden."}],"4":[{"catchword":"verkondigden het","tekst":"Grieks Evangeliseerden."}],"5":[{"catchword":"Filippus kwam","tekst":"Welke een was van de zeven diakenen, die te Jeruzalem tot verzorging der armen verkoren waren; Act 6:5 ; dan is na deze verstrooiing van God geroepen tot evangelist, om het Evangelie te Samaria en elders te prediken en de sacramenten te bedienen, en met wonderen het te bevestigen; Act 21:8 ; Eph 4:11 ."},{"catchword":"in de stad","tekst":"Deze was de hoofdstad geweest van de tien stammen Israëls, gesticht door Amri of Omri, den zesden koning van Israël, 1Ki 16 ; daarna ingenomen van Salmanasser den koning van Assyrië, en met heidense inwoners bezet, 2Ki 17 ; en ten laatste van Hiran verwoest, en van Herodes wederom gebouwd, en Sebaste genaamd, ter ere van den keizer Augustus; Jozef. Antiq. lib.13, cap.18, en de bello, lib.1, cap.16. Of, in ene stad van Samaria."}],"9":[{"catchword":"Simon, was","tekst":"Van dezen Simon leest men veel in de oude kerkelijke geschiedenissen, en inzonderheid dat hij de eerste sekte, namelijk de gruwelijke sekte der Simonianen, opgericht heeft onder de Christenen. Zie Euseb. Hist. Eccl. lib.2, cap.12, en lib.4, cap.21."},{"catchword":"verrukkende de","tekst":"Namelijk door de valse tekenen, die hij onder hen deed, gelijk de tovenaars in Egypte; Exo 7:11 . Zie Mat 24:24 , en 2Th 2:9 ."}],"13":[{"catchword":"geloofde ook","tekst":"Dat is, overtuigd zijnde door hetgeen hij hoorde en zag, bekende hij de waarheid des Evangelies, en voegde zich bij de gemeente; hoewel zijn geloof nochtans niet oprecht was, gelijk blijkt vs.21."},{"catchword":"grote krachten,","tekst":"Namelijk de tekenen door hem gedaan en alle geschapen macht ver teboven gaande; gelijk de tovenaars in Egypte ook eindelijk van Mozes bekenden; Exo 8:19 ."}],"14":[{"catchword":"zonden zij tot","tekst":"Namelijk om deze tedere gemeente door deze apostelen in het geloof te versterken, en alle behoorlijke orde onder hen te stellen."}],"15":[{"catchword":"den Heiligen","tekst":"Namelijk zichtbaarder en op wonderbare wijze, gelijk in de eerste kerk dikmaals geschiedde; Act 10:45 , en Act 19:6 ; 1Co 14:27 ; want anderszins hadden zij alrede den Heiligen Geest ontvangen, alzo niemand in Christus geloven kan zonder den Heiligen Geest; Rom 8:9 ; 1Co 12:3 ."}],"16":[{"catchword":"in den Naam van","tekst":"Door deze woorden wordt niet uitgedrukt de vorm van den doop, waarvan Christus spreekt Mat 28:19 , maar het einde waartoe de doop diende, namelijk om hun te betekenen dat zij door den doop Christus en Zijne gemeente werden ingelijfd; Rom 6:3 ; Gal 3:27 ."}],"18":[{"catchword":"de oplegging van","tekst":"Deze oplegging der handen was een buitengewoon teken, waardoor de gave des Heiligen Geestes om wonderwerken te doen, te profeteren en met velerlei talen te spreken door de apostelen gegeven werd. Zie Act 6:6 , en Act 19:6 ."}],"19":[{"catchword":"den Heiligen","tekst":"Dat is, zodanige wonderbaarlijke gaven des Heiligen Geestes; 1Co 12:4 , enz."}],"20":[{"catchword":"zij met u","tekst":"Dat is, verderve met u. Hetwelk een heilig dreigement is, waarmede hij te kennen geeft hoe zware zonde dit was, en welke straf te verwachten stond voor hem en dergelijken, die de geestelijke gaven of ambten met geld of giften zoeken te kopen, welke zonde, om de daad van dezen Simon, placht Simonie genaamd te worden."},{"catchword":"dat de gave","tekst":"Of, de gave Gods met geld te verkrijgen."}],"21":[{"catchword":"in dit woord","tekst":"Of, in, of aan deze zaak. Hebreën, namelijk der belofte van uitstorting des Heiligen Geestes, die den gelovigen van God gedaan was, Joël 2 en elders."},{"catchword":"recht voor God","tekst":"Dat is, oprecht, maar verkeerd en geveinsd."}],"22":[{"catchword":"misschien u","tekst":"Dit zegt Petrus niet, omdat hij twijfelde of God hem zijne zonde zou vergeven, indien hij zich recht bekeerde, maar omdat hij twijfelde of hij zich oprecht bekeren zou, gelijk uit de volgende woorden blijkt."}],"23":[{"catchword":"bittere gal","tekst":"Grieks gal der bitterheid; dat is, dat een zeer bitter en boos hart in u is, vol van ongerechtigheid; Deu 29:18 ."}],"24":[{"catchword":"Bidt gijlieden","tekst":"Hij veinst zich alsof hij zich wilde bekeren, uit vrees van het verderf, dat hem Petrus bedreigd had, vs.20."}],"26":[{"catchword":"welke woest is","tekst":"Grieks deze is woest. Alzo er twee wegen waren om van Jeruzalem naar Gaza te reizen, zo vermaant hem de engel, dat hij niet den meest gebaanden, maar den anderen, die woest was, door de gebergten zou heen reizen."}],"27":[{"catchword":"een kamerling,","tekst":"Grieks Eunuchus; dat is, gesnedene, gelijk zodanige meest voor kamerlingen bij grote vorstinnen gebruikt werden. Hoewel dit woord ook mede genomen wordt voor allerlei grote heren, die in der koningen hoven dienen; Gen 37:36 ; Est 1:10 ."},{"catchword":"Candace,","tekst":"Gelijk alle koningen in Egypte Farao genaamd werden, zo werden ook alle koningen van Ethiopië of Morenland, hetwelk meest door vrouwen geregeerd werd, Candace genaamd. Zie Plinius lib.6, cap.29."},{"catchword":"aan te bidden","tekst":"Dat is, den godsdienst te plegen, die door God te Jeruzalem was opgericht, waarvan het aanbidden een der voornaamste delen was. Zie 1Ki 8:41 ."}],"31":[{"catchword":"Hoe zou ik","tekst":"Namelijk alles verstaan wat ik lees. Want hoewel het Woord Gods in zichzelven klaar genoeg is, zoveel ter zaligheid nodig is, om van een ieder door de genade des Heiligen Geestes verstaan te worden, zo zijn er nochtans enige plaatsen zwaar om te verstaan, waartoe verklaring en uitlegging van node is. Waarom God benevens het lezen des Woords ook de predikatie en uitlegging daarvan heeft ingesteld; Act 17:11 ; Rom 10:14 ; Eph 4:11 ."},{"catchword":"onderricht? En","tekst":"Grieks op den weg leidt."}],"33":[{"catchword":"In Zijn vernedering","tekst":"Hoe deze plaats op Christus past en met den Hebreeuwsen tekst overeenkomt, zie de verklaring Isa 53:7 ."},{"catchword":"Zijn geslacht verhalen?","tekst":"Of, afkomst, of Zijns levens tijd. Sommigen verstaan dit van Zijn eeuwige geboorte uit den Vader; anderen van de menigte der gelovigen, die Hij door Zijn dood tot zich zou trekken; Joh 12:32 . Sommigen van de eeuwige kracht en gedurigheid Zijns levens, na Zijne opstanding en hemelvaart, Rom 6:9 ; Heb 7:24 , hetwelk met de volgende woorden, Isa 53:10 , best schijnt overeen te komen."}],"35":[{"catchword":"deed zijn mond","tekst":"Van deze wijze van spreken zie Mat 5:2 ."}],"37":[{"catchword":"de Zoon van","tekst":"En derhalve de ware Zaligmaker, die ons door Zijn lijden en sterven van zonde en dood verlost heeft, volgens de vorige profetie. Zie dergelijke korte belijdenis Mat 16:16 ."}],"39":[{"catchword":"met blijdschap","tekst":"Grieks zich verblijdende; namelijk uit een gevoel van de vergeving zijner zonden en van de werking des Heiligen Geestes in zijn gemoed; Rom 5:1 , enz."}],"40":[{"catchword":"werd gevonden,","tekst":"Dat is, bevond zichzelven nedergezet."},{"catchword":"te Azóte;","tekst":"Dit was ene stad in Palestina, van de Hebreën Asdod genaamd; waarvan zie Jos 11:22 ."},{"catchword":"Cesarea kwam","tekst":"Dit was ook ene stad in Palestina, tegen de zee gelegen, eertijds genaamd Turris Stratonis, van Herodes opgebouwd, en Cesarea genaamd, ter ere van den keizer Augustus. Zie breder de aantekeningen Act 10:1 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Saul was also well-pleased, [Namely, out of ignorance, and a perverse zeal, thinking thereby to do God service, John 16. 2. 1 Tim. 1.v. 13.] at his death, [or making away] and there was at that day a great persecution against the Church which was at Jerusalem: and they were all scattered, [this is principally understood of the teachers which were at Jerusalem besides the Apostles, as may be gathered from the end of this verse and out of the fourth and fift verses following] throughout the lands of Judea and Samaria, except the Apostles. [namely, as they that had received a special command to abide at Jerusalem, Act 1:4, 8.untill the doctrine of the Gospel should be sufficiently confirmed and spread abroad there Isa. 2. 3.]"}],"2":[{"catchword":null,"tekst":"And (certain) pious men carried Stephen together (to the grave) [Namely, from the place where Stephen was stoned, respecting no danger that might come upon them for it] and made great mourning for him. [after the manner of the Jews about the burials of worthy persons, Gen. 50.v. 10. John 11. 31.the more because they were heartily sorry for the loss of such an excellent man.]"}],"3":[{"catchword":null,"tekst":"And Saul wasted the Church, going into the houses: and drawing men and women delivered them over into prison. [Namely, to the Rulers to be by them cast into prison]"}],"4":[{"catchword":null,"tekst":"Now therefore they that were dispersed went through (the land) and published, [Gr.Evangelized the word.]"}],"5":[{"catchword":null,"tekst":"And Philip, [Who was one of the seven Deacons which were chosen at Jerusalem to take care for the poor, Act 8:5. But after this dispersion was by God chosen to be an Evangelist, to preach the Gospel at Samaria and elsewhere, and to administer the Sacraments, and to confirm the same with miracles, Acts 21. 8. Ephes. 4. 11.] came down into the City of Samaria, [this was the chief City of the ten tribes of Israel; built by Amri or Homri the sixt King of Israel, 1 Kings 16. Afterwards taken by Salmanasser King of Assyria, and planted with Gentile inhabitants, 2 Kings 17. And at last laid waste by Hyrcanus, and built again by Herod, and called Sebaste in honour of Augustus Cesar. Joseph. Antiq.lib.13.cap.18.and lib. 15.cap. 11.and de bello Jud.lib.1.cap.16. Or into a City of Samaria] and preached Christ unto them."}],"6":[{"catchword":null,"tekst":"And the multitudes attended with one accord to that which was said by Philip, seeing they heard and saw the signs which he did."}],"7":[{"catchword":null,"tekst":"For of many that had unclean spirits (the same) went out, crying with a great voice; and many that had the palsie, and cripples, were cured."}],"8":[{"catchword":null,"tekst":"And there was great joy in that City."}],"9":[{"catchword":null,"tekst":"And a certain man by name Simon, [Of this Simon we read much in the old Ectlesiastical Histories; and especially that he set up the first sect, namely the abominable sect of the Simonians amongst the Christians. See Euseh. Hist. Eccles.lib. 2.cap. 12.and lib. 4.cap. 21.] was before in the City, using sorcery, and distracting the sences [namely, by the false signs which he did among them, like as the sorcerers in Egypt, Exod. 7. 11. See Mat. 24. 24.and 2 Thes. 2.v. 9.] of the people of Samaria, saying of himself that he was some great one."}],"10":[{"catchword":null,"tekst":"Whom they all hanged on, from the small to the great, saying, this (man) is the great power of God."}],"11":[{"catchword":null,"tekst":"And they depended on him because for a long time he had distracted their sences with sorceries."}],"12":[{"catchword":null,"tekst":"But when they believed Philip, who published the Gospel of the Kingdome of God, and (of) the name of Jesus Christ they were baptized both men and women."}],"13":[{"catchword":null,"tekst":"And Simon also himself believed: [That is, being convinced by that which he heard and saw he acknowledged the truth of the Gospel, and joined himself to the Church; although his faith not withstanding was not sincere as appears v. 21] and being baptized abode continually with Philip: seeing the signs and great mighty (deeds) which were done, [namely, the signs done by him, and far exceeding all created power, like as the sorcerers in Egypt also, at last acknowledged of Moses Exod. 8. 19.] he was astonished."}],"14":[{"catchword":null,"tekst":"Now when the Apostles which were at Jerusalem, heard that Samaria had received the word of God, they sent unto them Peter and John, [Namely, to strengthen this instant Church in the faith by these Apostles, and settle all convenient order among them.]"}],"15":[{"catchword":null,"tekst":"Who being come down prayed for them, that they might receive the Holy Ghost, [Namely in a visible and miraculous manner, as often happened in the first church, Acts 10. 45.and 19. 6. 1 Cor. 14. 27. For otherwise they had already received the Holy Ghost, seeing no man can believe in Christ without the Holy Ghost, Rom. 8. 9. 1 Cor. 12. 3.]"}],"16":[{"catchword":null,"tekst":"(For he was yet fallen on none of them, but they were only baptized in the name of the Lord Jesus.) [By these words is not expressed the form of baptism, whereof Christ speaketh, Mat. 28. 19. But the end whereunto baptism served, namely, to signifie unto them that by baptism they were ingrafted into Christ and his Church, Rom. 6. 3. Gal. 3. 27.]"}],"17":[{"catchword":null,"tekst":"Then laid they the hands on them, and they received the Holy Ghost."}],"18":[{"catchword":null,"tekst":"And when Simon saw that by the laying of the hands of the Apostles, [This laying on of the hands was an extraordinary sign, whereby the gift of the Holy Ghost to do miracles, to prophecy, to speak with all kind of tongues, was given by the Apostles. See Acts 6. 6.and chap. 19. 6.] the holy Ghost was given, he offered them money;"}],"19":[{"catchword":null,"tekst":"Saying, give me also this power, that on whom soever I lay hands, he may receive the holy Ghost. [That is, such miraculous gifts of the Holy Ghost, 1 Cor. 12. 4.&c.]"}],"20":[{"catchword":null,"tekst":"But Peter said unto him, thy money be with thee to perdition, [That is, perish with thee, which is an holy threatening, whereby he gives to understand how grievous a sin this was, and what punishment was to be expected for him, and such like, who seek to buy spiritual gifts, which sin, because of this Simons deed, used to be called Simone] because thou hast thought that the gift of God is obtained by money. [or to obtain the gift of God with mony.]"}],"21":[{"catchword":null,"tekst":"Thou hast no part nor lot in this word, [Or, in, or, on this matter Hebr.namely of the promise of the pouring out of the Holy Ghost, which was made by God to believers, Joel 2.and elsewhere] for thy heart is not right [that is, upright, but perverse and hypocritical] before God."}],"22":[{"catchword":null,"tekst":"Repent therefore of this thy wickedness, and pray God, if perhaps this reasoning of thy heart may be forgiven thee. [This Peter saith not, because he doubted whether God would forgive him his sin if he truely repented, but because he doubted whether he would sincerely repent as appeareth from the following words.]"}],"23":[{"catchword":null,"tekst":"For I see that thou art in a very bitter gall, [Gr.gall of bitterness, i.e.that there is a very bitter and wicked heart in thee, full of iniquity, Deu. 29. 18.] and knitting together of iniquity."}],"24":[{"catchword":null,"tekst":"But Simon answering said, pray ye for me to the Lord: [He seigneth as if he would repent, for fear of destruction which Peter had threatened unto him,v. 20.] that nothing come upon me of that which ye have said."}],"25":[{"catchword":null,"tekst":"Now they therefore, when they had testified and spoken the word of the Lord, returned to Jerusalem, and published the Gospel (in) many Towns of the Samaritanes."}],"26":[{"catchword":null,"tekst":"And an Angel of the Lord spake unto Philip, saying, arise, and go thy way towards the South, on the way which descendeth from Jerusalem unto Gaza, which is waste, [Gr.this is waste. Seeing now there were two ways to travel from Jerusalem to Gaza, the Angel warneth him that he should not travel by the most beaten, but the other which was waste through the mountains.]"}],"27":[{"catchword":null,"tekst":"And he arose and went his way: and behold an AEthopian, a Chamberlain, [Gr.Eunuchus, i.e.one gelded, as such were most used for Chamberlains by great Princesses. Although this word also be sometimes taken for all kind of great Lords which serve in Kings Courts, Gen. 37. 36. Esth. 1. 10.] and a mighty Lord of Candice [as all Kings in Egypt were called Pharao, so also were all Queens of Ethiopia or Mauritania, which was for the most part governed by women, called Candace. See Plin.lib. 6.cap. 29.] the Queen of the Moors, which was over all her treasure, who was come to adore at Jerusalem. [that is, to exercise the worship of God, which was by God set up at Jerusalem, whereof adoration was one of the principal parts. Se 1 Kings 8. 41.]"}],"28":[{"catchword":null,"tekst":"And he returned and sate on his Chariot, and read the Prophet Esaias."}],"29":[{"catchword":null,"tekst":"Ans the Spirit said unto Philip, go unto, and joyn thy self to this Chariot."}],"30":[{"catchword":null,"tekst":"And Philip ran to, and heard him read the Prophet Esaiah, and said, understandest thou also that which thou readest?"}],"31":[{"catchword":null,"tekst":"And he said, how should I, I pray, be able, [Namely to understand all that I read: for howsoever the word of God is plain enough in it self, forasmuch as is necessary to salvation, to be understood by every one by the grace of the Holy Ghost, yet notwithstanding there are some places hard to understand whereunto exposition and interpretation is needfull: wherefore God besides the reading of the word, hath also ordained the preaching and interpretation of the same, Acts 17. 11. Rom. 10. 14. Ephes. 4.v. 21.] except a man instruct me? [Gr.lead me the way.] And he intreated Philip, that he would come up and sit by him."}],"32":[{"catchword":null,"tekst":"And the palce of Scripture which he read was this,he was as a sheep led to the slaughter: and as a lamb is voiceless before him that shears it, so peneth he not his mouth."}],"33":[{"catchword":null,"tekst":"In his humuliation his judgement was taken away: [How this place agrees unto Christ, and accords with the Hebrew text, see the exposition on Esa. 53.v. 7.] and who shall relate his generation? [or descent, or hi life time. Some understand this of his eternal generation of the Father; others of the multitude of believers which he should draw unto him by his death, John 12. 32. Some of the eternal power and continuance of his life after his resurrection and ascension, Rom. 6. 9. Heb. 7.v. 24.which seemeth best to agree with the following words, Esa. 53.v.10.] for his life is taken away from the Earth."}],"34":[{"catchword":null,"tekst":"And the Chamberlain answered Philip, and said, I pray thee of whom saith the Prophet this; of himself, or of some other man?"}],"35":[{"catchword":null,"tekst":"And Philip opened his mouth, [Of this phrase see Mat. 5. 2.] and beginning from that same Scrioture preached unto him Jesus."}],"36":[{"catchword":null,"tekst":"And as they travelled on the way, they came to certain water, and the Chamberlain said; loc ! there water, what doth hinder me to be baptized?"}],"37":[{"catchword":null,"tekst":"And Philip said, if thou believest with all thy heart, it is lawfull. And he answering, said, I believe that Jesus Christ is the Son of God. [And for that cause the true Saviour, who by his suffering and death hath delivered us from sin and death, according to the foregoing prophesie. See the like short confession, Mat. 16. 16.]"}],"38":[{"catchword":null,"tekst":"And he commanded the Chariot to hold still, and they went down both into the water, as well Philip as the Cahmberlain, and he baptized him."}],"39":[{"catchword":null,"tekst":"And when they were come up out of the water, the spirit of the Lord took away Philip, and the Chamberlain saw him no more: for he travelled his way with joy. [Gr.rejoycing, namely, out of a fence of the forgiveness of his sins, and of the operation of the Holy Ghost in his mind, Rom 5.v.1.&c.]"}],"40":[{"catchword":null,"tekst":"But Philip was found [That is, found himself set down] at Azotus, [this was a City in Palestina, by the Hebrews called Asdod, whereof see Josh. 11. 22.] and going through (the land) he published the Gospel (in) all Cities, until he came to Casarea. [this was also a City in Palestina, situate towards the Sea, formerly called Turris Stratonis, built up by Herod and called Cesarea in honour of the Emperour Augustus, See more at large the annot.on Act 10:1]"}]}}};

const BASIS_URL = D.meta.basis_url;

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

}
document.addEventListener('click', e => {

  if (!k) return;

});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
