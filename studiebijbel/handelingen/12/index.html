end tot God voor hem gebeden.","6":"Toen Herodes hem zou voorbrengen, sliep Petrus die nacht tussen twee soldaten, gebonden met twee kettingen; en de bewakers voor de deur bewaakten de gevangenis.","7":"En zie, een engel van de Heere stond daar, en een licht scheen in de cel, en hij sloeg Petrus op de zij, wekte hem en zei: Sta snel op. En zijn kettingen vielen van zijn handen af.","8":"En de engel zei tegen hem: Doe uw gordel om, en bind uw sandalen aan. En hij deed zo. En hij zei tegen hem: Sla uw mantel om, en volg mij.","9":"En hij ging naar buiten en volgde hem, en wist niet dat het waarachtig was wat door de engel gebeurde, maar hij dacht dat hij een visioen zag.","10":"En toen zij door de eerste en tweede wacht heen gegaan waren, kwamen zij bij de ijzeren poort die naar de stad leidt; die ging vanzelf voor hen open. En toen zij naar buiten gegaan waren, liepen zij één straat verder, en meteen verliet de engel hem.","11":"En Petrus, tot zichzelf gekomen, zei: Nu weet ik waarachtig dat de Heere Zijn engel gestuurd heeft, en mij verlost heeft uit de hand van Herodes, en van *heel* de verwachting van het volk van de Joden.","12":"En toen hij dit alles overdacht had, ging hij naar het huis van Maria, de moeder van Johannes, die bijgenaamd was Markus, waar velen bijeengebracht waren en aan het bidden waren.","13":"En toen Petrus aan de deur van de voorpoort klopte, kwam een dienstmeisje kijken wie er was, met de naam Rhode.","14":"En zij herkende de stem van Petrus, en deed van blijdschap de voorpoort niet open, maar liep naar binnen en vertelde dat Petrus voor de voorpoort stond.","15":"En zij zeiden tegen haar: U raast. Maar zij hield vol dat het zo was. En zij zeiden: Het is zijn engel.","16":"Maar Petrus bleef kloppen; en toen zij opengedaan hadden, zagen zij hem, en waren buiten zichzelf van verbazing.","17":"En nadat hij hen met de hand gewenkt had dat zij zouden zwijgen, vertelde hij hun hoe de Heere hem uit de gevangenis geleid had, en hij zei: Vertel dit aan Jakobus en de broeders. En hij ging weg en reisde naar een andere plaats.","18":"En toen het dag geworden was, was er geen kleine opschudding onder de soldaten, over wat er toch met Petrus gebeurd mocht zijn.","19":"En toen Herodes hem gezocht had en niet vond, ondervroeg hij de bewakers streng en gaf bevel dat zij weggeleid zouden worden om gedood te worden. En hij vertrok van Judea naar Cesarea, en verbleef daar.","20":"En Herodes was zeer verbolgen op de Tyriërs en Sidoniërs; maar zij kwamen eensgezind naar hem toe, en nadat zij Blastus, de kamerheer van de koning, hadden overreed, vroegen zij om vrede, omdat hun land werd bevoorraad vanuit het land van de koning.","21":"En op een vastgestelde dag, nadat Herodes een koninklijk kleed had aangetrokken en op de troon was gaan zitten, hield hij een toespraak tot hen.","22":"En het volk riep hem toe: Dit is de stem van een god, en niet van een mens!","23":"En meteen sloeg hem een engel van de Heere, omdat hij God de eer niet gaf; en hij werd door de wormen opgegeten, en gaf de geest.","24":"En het Woord van God groeide en breidde zich uit.","25":"Barnabas nu en Saulus keerden terug van Jeruzalem, toen zij hun dienst volbracht hadden, en zij namen ook Johannes mee, die bijgenaamd werd Markus."},"SV":{"1":"En omtrent denzelfden tijd sloeg de koning Herodes de handen aan sommigen van de Gemeente, om die kwalijk te handelen.","2":"En hij doodde Jakobus, den broeder van Johannes, met het zwaard.","3":"En toen hij zag, dat het den Joden behagelijk was, voer hij voort, om ook Petrus te vangen ( en het waren de dagen der ongehevelde *broden*);","4":"Denwelken ook gegrepen hebbende, hij in de gevangenis zette, en gaf *hem* over aan vier *wachten*, *elk* van vier krijgsknechten, om hem te bewaren, willende na het paas *feest* hem voorbrengen voor het volk.","5":"Petrus dan werd in de gevangenis bewaard; maar van de Gemeente werd een gedurig gebed tot God voor hem gedaan.","6":"Toen hem nu Herodes zou voorbrengen, sliep Petrus dienzelfden nacht tussen twee krijgsknechten, gebonden met twee ketenen; en de wachters voor de deur bewaarden de gevangenis.","7":"En ziet, een engel des Heeren stond daar, en een licht scheen in de woning, en slaande de zijde van Petrus, wekte hij hem op, zeggende: Sta haastelijk op. En zijn ketenen vielen af van de handen.","8":"En de engel zeide tot hem: Omgord u, en bind uw schoenzolen aan. En hij deed alzo. En hij zeide tot hem: Werp uw mantel om, en volg mij.","9":"En uitgaande volgde hij hem, en wist niet, dat het waarachtig was, hetgeen door den engel geschiedde, maar hij meende, dat hij een gezicht zag.","10":"En als zij door de eerste en tweede wacht gegaan waren, kwamen zij aan de ijzeren poort, die naar de stad leidt; dewelke van zelve hun geopend werd. En uitgegaan zijnde, gingen zij een straat voort, en terstond scheidde de engel van hem.","11":"En Petrus, tot zichzelven gekomen zijnde, zeide: Nu weet ik waarachtiglijk dat de Heere Zijn engel uitgezonden heeft, en mij verlost heeft uit de hand van Herodes, en *uit* de verwachting van het volk der Joden.","12":"En als hij *alles* overlegd had, ging hij naar het huis van Maria, de moeder van Johannes, die toegenaamd was Markus, alwaar velen samenvergaderd en biddende waren.","13":"En als Petrus aan de deur van de voorpoort klopte, kwam een dienstmaagd voor om te luisteren, met name Rhode.","14":"En zij de stem van Petrus bekennende, deed van blijdschap de voorpoort niet open, maar liep naar binnen en boodschapte, dat Petrus voor *aan* de voorpoort stond.","15":"En zij zeiden tot haar: Gij raast. Doch zij bleef er sterk bij, dat het alzo was. En zij zeiden: Het is zijn engel.","16":"Maar Petrus bleef kloppende: en als zij opengedaan hadden, zagen zij hem, en ontzetten zich.","17":"En als hij hen met de hand gewenkt had, dat zij zwijgen zouden, verhaalde hij hun, hoe hem de Heere uit de gevangenis uitgeleid had, en zeide: Boodschapt dit aan Jakobus en de broederen. En hij uitgegaan zijnde, reisde naar een andere plaats.","18":"En als het dag was geworden, was er geen kleine beroerte onder de krijgsknechten, wat toch aan Petrus mocht geschied zijn.","19":"En als Herodes hem gezocht had, en niet vond, en de wachters rechtelijk ondervraagd had, gebood hij, dat zij weggeleid zouden worden. En hij vertrok van Judea naar Cesarea, en hield zich *aldaar*.","20":"En Herodes had in den zin tegen de Tyriërs en Sidoniërs te krijgen; maar zij kwamen eendrachtelijk tot hem, en Blastus, die des konings kamerling was, overreed hebbende, begeerden vrede, omdat hun land gespijzigd werd van des konings *land*.","21":"En op een gezetten dag, Herodes, een koninklijk kleed aangedaan hebbende, en op den rechterstoel gezeten zijnde, deed een rede tot hen.","22":"En het volk riep *hem* toe: Een stem Gods, en niet eens mensen!","23":"En van stonde aan sloeg hem een engel des Heeren, daarom dat hij Gode de eer niet gaf; en hij werd van de wormen gegeten, en gaf den geest.","24":"En het Woord Gods wies, en vermenigvuldigde.","25":"Barnabas nu en Saulus keerden wederom van Jeruzalem, als zij den dienst volbracht hadden, medegenomen hebbende ook Johannes, die toegenaamd werd Markus."},"KJV":{"1":"Now about that time Herod the king stretched forth *his* hands to vex certain of the church.","2":"And he killed James the brother of John with the sword.","3":"And because he saw it pleased the Jews, he proceeded further to take Peter also. (Then were the days of unleavened bread.)","4":"And when he had apprehended him, he put *him* in prison, and delivered *him* to four quaternions of soldiers to keep him; intending after Easter to bring him forth to the people.","5":"Peter therefore was kept in prison: but prayer was made without ceasing of the church unto God for him.","6":"And when Herod would have brought him forth, the same night Peter was sleeping between two soldiers, bound with two chains: and the keepers before the door kept the prison.","7":"And, behold, the angel of the Lord came upon *him*, and a light shined in the prison: and he smote Peter on the side, and raised him up, saying, Arise up quickly. And his chains fell off from *his* hands.","8":"And the angel said unto him, Gird thyself, and bind on thy sandals. And so he did. And he saith unto him, Cast thy garment about thee, and follow me.","9":"And he went out, and followed him; and wist not that it was true which was done by the angel; but thought he saw a vision.","10":"When they were past the first and the second ward, they came unto the iron gate that leadeth unto the city; which opened to them of his own accord: and they went out, and passed on through one street; and forthwith the angel departed from him.","11":"And when Peter was come to himself, he said, Now I know of a surety, that the Lord hath sent his angel, and hath delivered me out of the hand of Herod, and *from* all the expectation of the people of the Jews.","12":"And when he had considered *the thing*, he came to the house of Mary the mother of John, whose surname was Mark; where many were gathered together praying.","13":"And as Peter knocked at the door of the gate, a damsel came to hearken, named Rhoda.","14":"And when she knew Peter's voice, she opened not the gate for gladness, but ran in, and told how Peter stood before the gate.","15":"And they said unto her, Thou art mad. But she constantly affirmed that it was even so. Then said they, It is his angel.","16":"But Peter continued knocking: and when they had opened *the door*, and saw him, they were astonished.","17":"But he, beckoning unto them with the hand to hold their peace, declared unto them how the Lord had brought him out of the prison. And he said, Go shew these things unto James, and to the brethren. And he departed, and went into another place.","18":"Now as soon as it was day, there was no small stir among the soldiers, what was become of Peter.","19":"And when Herod had sought for him, and found him not, he examined the keepers, and commanded that *they* should be put to death. And he went down from Judaea to Caesarea, and *there* abode.","20":"And Herod was highly displeased with them of Tyre and Sidon: but they came with one accord to him, and, having made Blastus the king's chamberlain their friend, desired peace; because their country was nourished by the king's","21":"And upon a set day Herod, arrayed in royal apparel, sat upon his throne, and made an oration unto them.","22":"And the people gave a shout, *saying, It is* the voice of a god, and not of a man.","23":"And immediately the angel of the Lord smote him, because he gave not God the glory: and he was eaten of worms, and gave up the ghost.","24":"But the word of God grew and multiplied.","25":"And Barnabas and Saul returned from Jerusalem, when they had fulfilled *their* ministry, and took with them John, whose surname was Mark."}},"tsk":{"1":[{"kopje":"sloeg de handen","refs":["Hand 4:30","Hand 9:31","Luk 22:53"]},{"kopje":"kwalijk te behandelen","refs":["Matt 10:17","Matt 10:18","Matt 24:9","Joh 15:20","Joh 16:2"]}],"2":[{"kopje":"Jakobus","refs":["Matt 4:21","Matt 4:22","Matt 20:23","Mark 10:35","Mark 10:38"]},{"kopje":"met","refs":["1 Kon 19:1","1 Kon 19:10","Jer 26:23","Hebr 11:37"]}],"3":[{"kopje":"hij zag","refs":["Hand 24:27","Hand 25:9","Joh 12:43","Gal 1:10","1 Tess 2:4"]},{"kopje":"ging hij verder","refs":["Hand 2:14","Hand 4:13","Ps 76:11","Joh 19:11","Joh 21:18"]},{"kopje":"En toen","refs":["Ex 12:14-20","Ex 13:3-7","Ex 23:15","Lev 23:6-14","Matt 26:17","1 Kor 5:7","1 Kor 5:8"]}],"4":[{"kopje":"zette hem","refs":["Hand 4:3","Hand 5:18","Hand 8:3","Matt 24:9","Luk 21:12","Luk 22:33","Joh 13:36-38","Joh 21:18"]},{"kopje":"gaf hem over","refs":["Hand 16:23","Hand 16:24","Matt 27:64-66"]},{"kopje":"van plan","refs":["Hand 4:28","Est 3:6","Est 3:7","Est 3:13","Spr 19:21","Spr 27:1","Klaagl 3:37","Matt 26:5"]}],"5":[{"kopje":"werd voortdurend gebeden","refs":["Hand 12:12","Jes 62:6","Jes 62:7","Matt 18:19","Luk 18:1","1 Kor 12:26","2 Kor 1:11","Ef " data-code=\"G2385\">James,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> to the <span class=\"wl wl-kjv\" data-code=\"G80\">brethren.</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> he <span class=\"wl wl-kjv\" data-code=\"G1831\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"G4198\">went</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> <span class=\"wl wl-kjv\" data-code=\"G2087\">another</span> place.","18":"<span class=\"wl wl-kjv\" data-code=\"G1161\">Now</span> as soon as it <span class=\"wl wl-kjv\" data-code=\"G1096\">was</span> <span class=\"wl wl-kjv\" data-code=\"G2250\">day,</span> there <span class=\"wl wl-kjv\" data-code=\"G2258\">was</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">no</span> <span class=\"wl wl-kjv\" data-code=\"G3641\">small</span> <span class=\"wl wl-kjv\" data-code=\"G5017\">stir</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">among</span> the <span class=\"wl wl-kjv\" data-code=\"G4757\">soldiers,</span> <span class=\"wl wl-kjv\" data-code=\"G5101\">what</span> was <span class=\"wl wl-kjv\" data-code=\"G1096\">become</span> of Peter.","19":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G1934\">when</span> <span class=\"wl wl-kjv\" data-code=\"G2264\">Herod</span> had sought <span class=\"wl wl-kjv\" data-code=\"G1934\">for</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> found <span class=\"wl wl-kjv\" data-code=\"G2147\">him</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not,</span> he <span class=\"wl wl-kjv\" data-code=\"G350\">examined</span> the <span class=\"wl wl-kjv\" data-code=\"G5441\">keepers,</span> and <span class=\"wl wl-kjv\" data-code=\"G2753\">commanded</span> that they should be put to <span class=\"wl wl-kjv\" data-code=\"G520\">death.</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> he went <span class=\"wl wl-kjv\" data-code=\"G2718\">down</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> <span class=\"wl wl-kjv\" data-code=\"G2449\">Judaea</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">to</span> <span class=\"wl wl-kjv\" data-code=\"G2542\">Caesarea,</span> and there abode.","20":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G2264\">Herod</span> <span class=\"wl wl-kjv\" data-code=\"G2258\">was</span> highly <span class=\"wl wl-kjv\" data-code=\"G2371\">displeased</span> with them of <span class=\"wl wl-kjv\" data-code=\"G5183\">Tyre</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4606\">Sidon:</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> they <span class=\"wl wl-kjv\" data-code=\"G3918\">came</span> with one <span class=\"wl wl-kjv\" data-code=\"G3661\">accord</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">to</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and,</span> having <span class=\"wl wl-kjv\" data-code=\"G3982\">made</span> <span class=\"wl wl-kjv\" data-code=\"G986\">Blastus</span> the <span class=\"wl wl-kjv\" data-code=\"G935\">king's</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">chamberlain</span> their <span class=\"wl wl-kjv\" data-code=\"G3982\">friend,</span> <span class=\"wl wl-kjv\" data-code=\"G154\">desired</span> <span class=\"wl wl-kjv\" data-code=\"G1515\">peace;</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">because</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G5561\">country</span> was <span class=\"wl wl-kjv\" data-code=\"G5142\">nourished</span> <span class=\"wl wl-kjv\" data-code=\"G575\">by</span> the king's","21":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> upon a <span class=\"wl wl-kjv\" data-code=\"G5002\">set</span> <span class=\"wl wl-kjv\" data-code=\"G2250\">day</span> <span class=\"wl wl-kjv\" data-code=\"G2264\">Herod,</span> <span class=\"wl wl-kjv\" data-code=\"G1746\">arrayed</span> in <span class=\"wl wl-kjv\" data-code=\"G937\">royal</span> <span class=\"wl wl-kjv\" data-code=\"G2066\">apparel,</span> <span class=\"wl wl-kjv\" data-code=\"G2523\">sat</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> his <span class=\"wl wl-kjv\" data-code=\"G968\">throne,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> made an <span class=\"wl wl-kjv\" data-code=\"G1215\">oration</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">unto</span> them.","22":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G1218\">people</span> gave a <span class=\"wl wl-kjv\" data-code=\"G2019\">shout,</span> saying, It is the <span class=\"wl wl-kjv\" data-code=\"G5456\">voice</span> of a <span class=\"wl wl-kjv\" data-code=\"G2316\">god,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> of a man.","23":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3916\">immediately</span> the <span class=\"wl wl-kjv\" data-code=\"G32\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G3960\">smote</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> <span class=\"wl wl-kjv\" data-code=\"G473\">because</span> he <span class=\"wl wl-kjv\" data-code=\"G1325\">gave</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> the <span class=\"wl wl-kjv\" data-code=\"G1391\">glory:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> he <span class=\"wl wl-kjv\" data-code=\"G1096\">was</span> eaten of <span class=\"wl wl-kjv\" data-code=\"G4662\">worms,</span> and gave up the ghost.","24":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> the <span class=\"wl wl-kjv\" data-code=\"G3056\">word</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G837\">grew</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> multiplied.","25":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G921\">Barnabas</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4569\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"G5290\">returned</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">from</span> <span class=\"wl wl-kjv\" data-code=\"G2419\">Jerusalem,</span> when they had <span class=\"wl wl-kjv\" data-code=\"G4137\">fulfilled</span> their <span class=\"wl wl-kjv\" data-code=\"G1248\">ministry,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> took with <span class=\"wl wl-kjv\" data-code=\"G4838\">them</span> <span class=\"wl wl-kjv\" data-code=\"G2491\">John,</span> whose surname <span class=\"wl wl-kjv\" data-code=\"G1941\">was</span> Mark."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Heródes","tekst":"Namelijk Agrippa, een zoon van Aristobulus, die een zoon was van Herodes den Grote, en deze Herodes Agrippa was de vader van dien Agrippa, van wien hierna hfdst.25, 26 meer gesproken wordt."},{"catchword":"aan sommigen","tekst":"Grieks om sommigen van die van de gemeente kwalijk te handelen."}],"2":[{"catchword":"Jakobus,","tekst":"Namelijk den zoon van Zebedeüs en den broeder van Johannes, gelijk hier in den tekst staat, en Mat 10:2 , een van de voornaamste apostelen van Christus, dien Christus met Petrus en Johannes bij Zich dikwijls nam. De andere Jakobus dan, van wien men leest vs.17; Act 15:13 , en Gal 2:9 , en die den zendbrief van Jakobus nagelaten heeft, die ook een broeder van Christus genaamd wordt, Mar 6:3 , en Jakobus de kleine, Mar 15:40 , is geweest een andere apostel, de zoon van Alfeüs en van de zuster van Maria, en een broeder van Joses, gelijk blijkt uit vergelijking van Mat 13:55 , en Mat 27:56 , en Gal 1:19 . Zie ook Mat 10:3 ; Mar 3:18 ."}],"3":[{"catchword":"der ongehevelde","tekst":"Dat is, de feestdagen van pasen, gelijk uit vs.4 te zien is."}],"4":[{"catchword":"vier wachten,","tekst":"Grieks vier vieringen van krijgsknechten; dat is, zestien krijgsknechten; want elke sentinelle of wacht bij de Romeinen bestond uit vier soldaten van een vaandel, waarvan daar vier tot bewaring des apostels geordineerd zijn, om op de vier nachtwachten de wacht bij beurten te houden."}],"5":[{"catchword":"een gedurig","tekst":"Of, een ernstig, ijverig, vurig."}],"6":[{"catchword":"voorbrengen,","tekst":"Namelijk om te laten openlijk dopen of executeren."},{"catchword":"gebonden met","tekst":"Namelijk aan de handen, vs.7, waarvan de ene keten aan de rechterhand van Petrus vast was en aan de linkerhand van den enen soldaat, en de andere aan Petrus' linkerhand en aan de rechterhand van den anderen soldaat, waar hij tussen sliep; ene wijze van doen bij de Romeinen in strikte gevangenissen gebruikelijk, gelijk ook Paulus alzo gevangen is geweest te Rome, hoewel alleen gebonden aan een soldaat, en in meerdere vrijheid. Zie Act 28:16 , vergelijk met Eph 6:20 , en 2Ti 1:16 , en Senecam Epist.5."}],"7":[{"catchword":"een licht scheen","tekst":"Namelijk van de blinkende gestalte des engels, gelijk Mat 28:3 , en Luk 2:9 ."},{"catchword":"de woning,","tekst":"Of, gevangenis, kerker. Sommigen nemen dit voor het gehele huis der gevangenis, anderen alleen voor het binnenste deel, waar de gevangenen in gesloten lagen."}],"8":[{"catchword":"Omgord u,","tekst":"Namelijk om te vaardiger voort te gaan; alzo de Joden lange klederen droegen, die zij in het gaan met gordels vastbonden en opschorten. Van de schoenzolen zie Mar 6:9 ."}],"9":[{"catchword":"een gezicht zag","tekst":"Dat is, dat hem dit in een gezicht alzo docht te geschieden, niet dat het inderdaad geschiedde."}],"10":[{"catchword":"de ijzeren poort,","tekst":"Dit was de laatste poort van de gevangenis, door welke gegaan zijnde, men kwam in de straten van de stad."}],"11":[{"catchword":"tot zichzelven","tekst":"Dat is, nu verstaande dat het geen gezicht was, maar een daadwerkelijke geschiedenis en verlossing."}],"12":[{"catchword":"Markus, alwaar","tekst":"Deze is dezelfde, die met den apostel Paulus en Barnabas daarna vertrokken is, vs.25, en die het Evangelie geschreven heeft, zo sommigen menen."}],"13":[{"catchword":"van de voorpoort","tekst":"Of, van het voorhuis."},{"catchword":"een dienstmaagd","tekst":"Grieks Paidiske. Hetwelk ook een meisje of maagdje betekent, die geen dienstbode is."},{"catchword":"luisteren,","tekst":"Namelijk wie het was, die bij nacht klopte om degenen, die in het huis vergaderd waren, intijds te waarschuwen, zo er onraad geweest ware."}],"15":[{"catchword":"Gij raast","tekst":"Of, gij zijt buiten zinnen, niet wetende wat gij zegt."},{"catchword":"zij bleef er","tekst":"Of, zij bevestigde dat."},{"catchword":"Het is zijn engel","tekst":"Of, het is zijn bode; gelijk het woord engel somwijlen alzo genomen wordt. Zie Luk 7:24 . Doch alzo met dit woord merendeels de engelen des hemels betekend worden, zo wordt dit van velen verstaan van een engel, die Petrus van God tot een bewaarder was toegevoegd in deze zwarigheid, gelijk ook Mat 18:10 van de geringste gelovigen wordt gezegd dat hunne engelen altijd zien het aanschijn des Vaders in de hemelen; waaruit volgt dat God de engelen wel zendt ten dienste en bescherming der gelovigen, Psa 34:8 , en Psa 91:11 ; Heb 1:14 ; maar daaruit volgt nochtans niet dat elk mens juist een bijzonderen goeden en een kwaden engel altijd zou hebben tot gezelschap, gelijk sommigen menen."}],"16":[{"catchword":"ontzetten zich","tekst":"Namelijk over deze onverwachte tegenwoordigheid van Petrus, niet kunnende begrijpen hoe dit toeging."}],"17":[{"catchword":"Jakobus en","tekst":"Namelijk den kleine; want de andere was al omgebracht. Zie van hem in de aantekeningen vs.2."},{"catchword":"naar een andere","tekst":"Namelijk buiten Jeruzalem, om het Evangelie te verbreiden; niet willende zichzelven in hetzelfde gevaar zonder noodzaak begeven, waar hem de Heere uit verlost had; en dat naar de vermaning van Christus, Mat 10:23 ."}],"19":[{"catchword":"rechtelijk","tekst":"Grieks Anakrinas; welk woord betekent iemand rechterlijk onderzoeken met pijnigen of anders."},{"catchword":"weggeleid zouden","tekst":"Namelijk òf in de gevangenis, òf om met den dood gestraft te worden, gelijk dit woord ook somtijds betekent."},{"catchword":"hield zich aldaar","tekst":"Namelijk een zekeren tijd, om aldaar ter ere van den keizer Claudius enige schouwspelen aan te stellen, tot welke een grote menigte van de voornaamste Joden bijeenkwam; Josefus Antiq. lib.19, cap.7. Van dit Cesarea zie Act 10:1 ."}],"20":[{"catchword":"had in den zin","tekst":"Of, was zeer vergramd tegen de Tyriërs en Sidoniërs."},{"catchword":"die des konings","tekst":"Grieks die over des konings slaapkamer was."},{"catchword":"gespijzigd werd","tekst":"Want hoewel Tyrus en Sidon machtige steden waren, nochtans omdat zij aan de zee gelegen waren, hadden zij weinig land, zo konden zij zichzelven van leeftocht niet voorzien. Zie van hare ligging Isa 23 ."}],"21":[{"catchword":"op een gezetten","tekst":"Dit was de tweede dag van de schouwspelen, gelijk Josefus getuigt, Antiq. lib.19, cap.7, die aldaar ook den ellendigen dood van dezen Herodes Agrippa verhaalt."},{"catchword":"een koninklijk","tekst":"Blinkende van zilver, waar de zon op scheen, gelijk Josefus in de vorige plaats deze geschiedenis in het brede beschrijft."},{"catchword":"rechterstoel","tekst":"Of, troon."}],"23":[{"catchword":"dat hij Gode","tekst":"Dat is, dat hij zulke goddelijke eer aannam, zonder die van zich te keren tot God, die haar alleen toekwam; gelijk de apostelen in zulk geval gedaan hebben, Act 10:26 , en Act 14:14 , en de engel, Rev 19:10 , en Rev 22:9 ."}],"24":[{"catchword":"wies, en","tekst":"Namelijk deze tiran en vervolger der gemeente nu door Gods oordeel weggenomen zijnde."}],"25":[{"catchword":"keerden wederom","tekst":"Namelijk naar Antiochië."},{"catchword":"den dienst","tekst":"Namelijk van de handreiking of aalmoezen der gelovigen van Antiochië te brengen aan de armen te Jeruzalem, waartoe zij gezonden waren; Act 11:30 ."},{"catchword":"volbracht hadden,","tekst":"Grieks vervuld."},{"catchword":"Markus","tekst":"Zie van Hem tevoren vs.12."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And about the same time King Herod [Namely, Agrippa, a son of Aristobulus, who was a son of Herod the great, and this Herod Agrippa was Father of that Agrippa, of whom hereafter ch. 25. 26.more is spoken] laid hands on some of the Church, for to intreat them evil, [Gr.for to intreat evill, some of those of the Church."}],"2":[{"catchword":null,"tekst":"And he killed James [Namely the son of Zebedee and the brother of John, as stands here in the Text, and Matth. 10: 2.one of the principall Apostles of Christ,whom Christ with Peter and John oftentimes took with him. The other James therefore of whom we read ver. 17. Acts 15. 13.and Gal. 2. 9.and who left behind him the epistle of James, who is also called Christs brother, Mark 6. 3.and James the little, Mark 15. 40.was another Apostle the son of Alpheus and of the sister of Mary, and the brother of Joses, as appears by comparing, Mat. 12. 55.and 27. 56. Gal. 1. 19. See also Mat. 10. 3. Mark 3. 18.] the brother of John with the sword."}],"3":[{"catchword":null,"tekst":"And when he saw that it was pleasing to the Jews, he proceeded to take Peter also, and they were the daies of unleavened (bread) [That is, the feast daies of the passeover, as may be seen also from the following verse.]"}],"4":[{"catchword":null,"tekst":"Whom also having laid hold on, he put in prison, and delivered (him) over to four (witches, each) of four souldiers [Gr.four fourlings of soul liers, i.e. sixteen souldiers, for each sentinel or watch with the Romanes consisted of four souldiers of one company, whereof there were four ordained for the keeping of the Apostle, to keep the watch by turns in the four night watches] to keep him, intending after the (feast) of the Passeover to bring him forth before the people."}],"5":[{"catchword":null,"tekst":"Peter therefore was kept in prison: but a continual [Or an earnest, zealous, servent] prayer was made by the Church unto God for him."}],"6":[{"catchword":null,"tekst":"Now when Herod was to bring him forth, [Namely, to cause him to be openly put to death or executed] Peter slept that same night between two souldiers, bound with two chaines, [namely, by the hands v.7.whereof one chain was fast on Peters right hand, and on the left hand of one souldier; and the other chain on Peters left hand, and to the right hand of the other souldier betwixt whom he slept: manner of doing usual with the Romanes in the strict imprisonments, as Paul also was so imprisoned at Rome, although bound only to one souldier and in greater freedome. See Acts 28. 16.compared with Ephe. 6. 20. 2 Tim. 1.v. 16.and Seneca Epist. 5.] and the watch-men before the door kept the prison."}],"7":[{"catchword":null,"tekst":"And behold an Angel of the Lord stood there, & a light, [Namely, of the shining countenance of the Angel, as Luke 2. 9.and Mat. 28. 3.] shined in the dwelling, [ or, prison, goal. Some take this for the whole house of the prison, others for the inmost part only, where the prisoners lay shut in] and smitting Peters side he raised him up, saying, rise up quickly. And his chains fell off from his hands."}],"8":[{"catchword":null,"tekst":"And the Angel said unto him, gird thee about, [Namely, to go forth the more radily; seeing the Jews were long cloathes, which in going, they bound fast with Girdles, and trussed up: of the shoe-soles see the annot.on Mark. 6. 9.] and bind on thy shoe-soles, and he did so. And he said unto // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';

    if (!refs || !refs.length) return '';

  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
