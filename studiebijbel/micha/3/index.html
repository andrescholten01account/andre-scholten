remia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Verder zei ik: Hoor nu, hoofden van Jakob, en leiders van het huis van Israël! Betaamt het u niet om het recht te weten?","2":"Zij haten het goede, en hebben het kwade lief; zij roven hun huid van hen af, en hun vlees van hun beenderen.","3":"Ja, zij zijn het, die het vlees van mijn volk eten, en hun huid afstropen, en hun beenderen verbreken; en uiteen leggen, zoals in een pot, en als vlees in het midden van een ketel.","4":"Dan zullen zij roepen tot de HEERE, doch Hij zal hen niet verhoren; maar zal Zijn aangezicht op die tijd voor hen verbergen, zoals zij hun handelingen slecht gemaakt hebben.","5":"Zo zegt de HEERE, tegen de profeten, die Mijn volk verleiden; die met hun tanden bijten, en vrede uitroepen; maar tegen hem die niet in hun mond geeft, tegen die heiligen zij een oorlog.","6":"Daarom zal het nacht voor u worden vanwege het visioen[1], en u zal duisternis zijn vanwege de waarzegging; en de zon zal over deze profeten ondergaan; en de dag zal over hen zwart worden.","7":"En de zieners zullen beschaamd, en de waarzeggers schaamrood worden; en zij zullen allen samen de bovenlip bewimpelen[2]; want er zal geen antwoord van God zijn.","8":"Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en *vol* van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.","9":"Hoor nu dit, hoofden van het huis van Jakob, en leiders van het huis van Israël! die van het gericht een gruwel hebben, en alles wat recht is verdraaien;","10":"Zij bouwen Sion met bloed, en Jeruzalem met onrecht.","11":"Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.","12":"Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud."},"SV":{"1":"Voorts zeide ik: Hoort nu, gij hoofden Jakobs, en gij oversten van het huis Israëls! Betaamt het ulieden niet het recht te weten?","2":"Zij haten het goede, en hebben het kwade lief; zij roven hun huid van hen af, en hun vlees van hun beenderen.","3":"Ja, zij zijn het, die het vlees mijns volks eten, en hun huid afstropen, en hun beenderen verbreken; en vaneen leggen, gelijk als in een pot, en als vlees in het midden eens ketels.","4":"Alsdan zullen zij roepen tot den HEERE, doch Hij zal hen niet verhoren; maar zal Zijn aangezicht te dier tijd voor hen verbergen, gelijk als zij hun handelingen kwaad gemaakt hebben.","5":"Alzo zegt de HEERE, tegen de profeten, die Mijn volk verleiden; die met hun tanden bijten, en roepen vrede uit; maar die niet geeft in hun mond, tegen dien zo heiligen zij een krijg.","6":"Daarom zal het nacht voor ulieden worden vanwege het gezicht, en ulieden zal duisternis zijn vanwege de waarzegging; en de zon zal over deze profeten ondergaan; en de dag zal over hen zwart worden.","7":"En de zieners zullen beschaamd, en de waarzeggers schaamrood worden; en zij zullen al te zamen de bovenste lip bewimpelen; want er zal geen antwoord Gods zijn.","8":"Maar waarlijk, ik ben vol krachts van den Geest des HEEREN; en *vol* van gericht en dapperheid, om Jakob te verkondigen zijn overtreding, en Israël zijn zonde.","9":"Hoort nu dit, gij hoofden van het huis Jakobs, en gij oversten van het huis Israëls! die van het gericht een gruwel hebt, en al wat recht is verkeert;","10":"Bouwende Sion met bloed, en Jeruzalem met onrecht.","11":"Haar hoofden rechten om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op den HEERE, zeggende: Is de HEERE niet in het midden van ons? Ons zal geen kwaad overkomen.","12":"Daarom, om uwentwil, zal Sion *als* een akker geploegd worden, en Jeruzalem zal *tot* steenhopen worden, en de berg dezes huizes tot hoogten eens wouds."},"KJV":{"1":"And I said, Hear, I pray you, O heads of Jacob, and ye princes of the house of Israel; *Is it* not for you to know judgment?","2":"Who hate the good, and love the evil; who pluck off their skin from off them, and their flesh from off their bones;","3":"Who also eat the flesh of my people, and flay their skin from off them; and they break their bones, and chop them in pieces, as for the pot, and as flesh within the caldron.","4":"Then shall they cry unto the LORD, but he will not hear them: he will even hide his face from them at that time, as they have behaved themselves ill in their doings.","5":"Thus saith the LORD concerning the prophets that make my people err, that bite with their teeth, and cry, Peace; and he that putteth not into their mouths, they even prepare war","6":"Therefore night *shall be* unto you, that ye shall not have a vision; and it shall be dark unto you, that ye shall not divine; and the sun shall go down over the prophets, and the day shall be dark","7":"Then shall the seers be ashamed, and the diviners confounded: yea, they shall all cover their lips; for *there is* no answer of God.","8":"But truly I am full of power by the spirit of the LORD, and of judgment, and of might, to declare unto Jacob his transgression, and to Israel his sin.","9":"Hear this, I pray you, ye heads of the house of Jacob, and princes of the house of Israel, that abhor judgment, and pervert all equity.","10":"They build up Zion with blood, and Jerusalem with iniquity.","11":"The heads thereof judge for reward, and the priests thereof teach for hire, and the prophets thereof divine for money: yet will they lean upon the LORD, and say, *Is* not the LORD among us? none evil can come","12":"Therefore shall Zion for your sake be plowed *as* a field, and Jerusalem shall become heaps, and the mountain of the house as the high places of the forest."}},"tsk":{"1":[{"kopje":"Hoor","refs":["Micha 3:9","Micha 3:10","Jes 1:10","Jer 13:15-18","Jer 22:2","Jer 22:3","Hos 5:1","Amos 4:1"]},{"kopje":"Betaamt het","refs":["Deut 1:13-17","Deut 16:18","2 Kron 19:5-10","Ps 14:4","Ps 82:1-5","Jer 5:4","Jer 5:5","1 Kor 6:5"]}],"2":[{"kopje":"haten","refs":["1 Kon 21:20","1 Kon 22:6-8","Amos 5:10-14","Luk 19:14","Joh 7:7","Joh 15:18","Joh 15:19","Joh 15:23","Joh 15:24","Hand 7:51","Hand 7:52","Rom 12:9","2 Tim 3:3"]},{"kopje":"lief","refs":["2 Kron 19:2","Ps 15:4","Ps 139:21","Ps 139:22","Spr 28:4","Joh 18:40","Rom 1:32"]},{"kopje":"roven","refs":["Ps 53:5","Jes 3:15","Ezech 22:27","Ezech 34:3","Amos 8:4-6","Zef 3:3","Zach 11:4","Zach 11:5"]}],"3":[{"kopje":"eten","refs":["Ps 14:4"]},{"kopje":"en verbreken","refs":["Ezech 11:3","Ezech 11:6","Ezech 11:7"]}],"4":[{"kopje":"Dan","refs":["Micha 2:3","Micha 2:4","Jer 5:31"]},{"kopje":"roepen","refs":["Ps 18:42","Spr 1:28","Spr 28:9","Jes 1:15","Jer 2:27","Jer 2:28","Ezech 8:18","Zach 7:13","Matt 7:22","Luk 13:25","Joh 9:31","Jak 2:13"]},{"kopje":"Hij zal","refs":["Deut 31:17","Deut 31:18","Deut 32:19","Deut 32:20","Jes 59:1-15","Jer 33:5"]},{"kopje":"zoals","refs":["Jes 3:11","Rom 2:8","Rom 2:9"]}],"5":[{"kopje":"tegen","refs":["Micha 3:11","Jes 9:14","Jes 9:15","Jer 14:14","Jer 14:15","Jer 23:9-17","Jer 23:27","Jer 23:32","Jer 28:15-17","Jer 29:21-23","Ezech 13:10-16","Ezech 22:25-29","Mal 2:8","Matt 15:14" ata-l=\"L9\" data-code=\"H1116\">hoogten</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1116\">van</span> een woud."},"koppeling_kjv":{"1":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear,</span> I pray you, O <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H7101\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Is it not for you to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> judgment?","2":"Who <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> the <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> and <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil;</span> who pluck <span class=\"wl wl-kjv\" data-code=\"H1497\">off</span> their <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> from off them, and their <span class=\"wl wl-kjv\" data-code=\"H7607\">flesh</span> from off their bones;","3":"Who also <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H7607\">flesh</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H6584\">flay</span> their <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> from off them; and they <span class=\"wl wl-kjv\" data-code=\"H6476\">break</span> their <span class=\"wl wl-kjv\" data-code=\"H6106\">bones,</span> and chop them in <span class=\"wl wl-kjv\" data-code=\"H6566\">pieces,</span> as for the <span class=\"wl wl-kjv\" data-code=\"H5518\">pot,</span> and as <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">within</span> the caldron.","4":"Then shall they <span class=\"wl wl-kjv\" data-code=\"H2199\">cry</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> but he will not <span class=\"wl wl-kjv\" data-code=\"H6030\">hear</span> them: he will even <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> from them at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> as they have behaved themselves <span class=\"wl wl-kjv\" data-code=\"H7489\">ill</span> in their doings.","5":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> that make my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8582\">err,</span> that <span class=\"wl wl-kjv\" data-code=\"H5391\">bite</span> with their <span class=\"wl wl-kjv\" data-code=\"H8127\">teeth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">cry,</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">Peace;</span> and he that <span class=\"wl wl-kjv\" data-code=\"H5414\">putteth</span> not into their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouths,</span> they even <span class=\"wl wl-kjv\" data-code=\"H6942\">prepare</span> war","6":"Therefore <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> shall be unto you, that ye shall not have a <span class=\"wl wl-kjv\" data-code=\"H2377\">vision;</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H2821\">dark</span> unto you, that ye shall not <span class=\"wl wl-kjv\" data-code=\"H7080\">divine;</span> and the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> shall go <span class=\"wl wl-kjv\" data-code=\"H935\">down</span> over the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall be dark","7":"Then shall the <span class=\"wl wl-kjv\" data-code=\"H2374\"> \"wl wl-kjv\" data-code=\"H1818\">blood,</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> with iniquity.","11":"The <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> thereof <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> for <span class=\"wl wl-kjv\" data-code=\"H7810\">reward,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> thereof <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> for <span class=\"wl wl-kjv\" data-code=\"H4242\">hire,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> thereof <span class=\"wl wl-kjv\" data-code=\"H7080\">divine</span> for <span class=\"wl wl-kjv\" data-code=\"H3701\">money:</span> yet will they <span class=\"wl wl-kjv\" data-code=\"H8172\">lean</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Is not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> us? none <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> can come","12":"Therefore shall <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> for your <span class=\"wl wl-kjv\" data-code=\"H1558\">sake</span> be <span class=\"wl wl-kjv\" data-code=\"H2790\">plowed</span> as a <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> shall become <span class=\"wl wl-kjv\" data-code=\"H5856\">heaps,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> as the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> of the forest."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"hoofden Jakobs","tekst":"Dat is, regenten."},{"catchword":"oversten van het huis Israëls","tekst":"Zie Jdg 11:6 ."},{"catchword":"Betaamt het ulieden niet het recht te weten?","tekst":"Hebr. en [is het] niet ulieder, of aan ulieden? dat is, hoort het, staat het u niet toe? betaamt het u niet? is het niet uw plicht, uws Gods recht te weten? Ganselijk, wil de profeet zeggen; verg. Jer 5:4-5 ; zie van zulk vragen Jdg 4:6 , enz."}],"2":[{"catchword":"zij roven","tekst":"Door deze manier van spreken wordt de uiterste wreedheid, schenderij, schrobberij en tirannie van de regenten over hun onderdanen en medebroeders uitgedrukt, mnet welke zij handelden als leeuwen, beren en wolven."},{"catchword":"huid van hen af","tekst":"Zij villen de arme onderdanen de huid af, zij mergelen en zuigen hen uit, gelijk men van zulke mensen gemeenlijk zegt."}],"3":[{"catchword":"die het vlees mijns volks eten,","tekst":"Anders; dat zij eten, is het vlees van mijn volk, enz. Zie Psa 14:4 ."},{"catchword":"verbreken","tekst":"Of, in stukken klinken. Want het Hebr. woord heeft de betekenis van sterk geluid, gekraak, geklank, naar sommiger gevoelen. De zin is, dat zij al het vermogen van de onderdanen, [over welke zij als vaders en herders behoorden te zijn] met openbaar geweld, zonder enige schroom of deernis, verbrijzelen, vernielen en tot zich trekken, doende daarmede als volgt."},{"catchword":"vaneen leggen","tekst":"Hebr. uitbreiden, dat is, zij gaan met de mensen en de roof te werk, alsof zij vlees en benen van geslachte beesten in een pot leggen om te koken. Verg. Eze 11:6-7 , met de aantekening. En zie gelijke manier van spreken in de beschrijving van de straf van deze booswichten, Eze 24:3-4 , enz."}],"4":[{"catchword":"Alsdan zullen zij roepen tot den HEERE,","tekst":"Gelijk de plagen [in Mic 2:3-5 , Mic 2:10 , vermeld] hen zullen treffen, dan zullen zij nog wel zo onbeschaamd zijn dat zij God zullen aanroepen, alsof Hij hen behoorde te helpen; maar zij doen het zonder ware bekering van het hart, alleen uit gevoel van straf, daarom, enz."},{"catchword":"verbergen","tekst":"Zie Deu 31:17 , en Job 13:24 ."},{"catchword":"hun handelingen kwaad gemaakt hebben","tekst":"Of, zich kwalijk gedragen hebben [in] hun handelingen, gelijk van de bekeerden gezegd wordt, dat zij hun wegen goed maakten. De zin is: Gelijk zij de arme onderdanen geplaagd hebben en zich over die niet hebben ontfermd, alzo zal Ik hun wederom doen, enz. Verg. Jam 2:13 ."}],"5":[{"catchword":"bijten, en roepen vrede uit;","tekst":"Onder voorwensel van liefde en vriendelijkheid, als grijpende wolven, de zielen moorden, door hun valse verleidende profetieën. Verg. Eze 13:18-19 en Eze 22:25 ; Mat 7:15 . Of, als verhongerde beesten, verscheuren en veslinden wat men hun geeft, en roepen dan van vrede, geluk en voorspoed, als zij de buik vol hebben. Verg. Mic 2:11 ; Isa 56:10 , Isa 56:11 ; Eze 13:3 met de aantekening."},{"catchword":"heiligen zij een krijg","tekst":"Dat is, tegen die ruien en hitsen zij een ieder op, rusten toe, en nemen oorlog tegen hem aan, of verkondigen en profeteren hem alle kwaad, als zijnde een verachter van God en Zijn Woord, dat zij valselijk voorwenden. Zie van het Hebr. woord Jer 6:4 ."}],"6":[{"catchword":"nacht voor ulieden worden","tekst":"Met deze manier van spreken voorzegt God deze valse profeten niet alleen verblinding van hun verstand [gelijk sommigen dat nemen], maar ook zware plagen, van allerlei ongeluk, lijden en droefenis. Zie Gen 15:12 en Jer 15:9 ; Joe 2:2 , Joe 2:31 , enz."},{"catchword":"gezicht,","tekst":"Dat is, om uw valse prefetieën die gij u beroemt door mijne openbaringen ontvangen te hebben. Verg. Zec 13:4 . Of, Zodat gij geen gezicht zult hebben; dat is, niet meer kunnen profeteren. Alzo in het volgende: zodat gij niet zult kunnen waarzeggen; gij zult dan wat anders te doen hebben, dan met uw voorzeggingen of waarzeggerij om te gaan, dat zal u dan wel vergaan. Verg. Eze 12:23 ."},{"catchword":"waarzegging","tekst":"Verg. Eze 13:6-7 , enz. en zie van het Hebr. woord Pro 16:10 ."},{"catchword":"zwart worden","tekst":"Dat is, donker."}],"7":[{"catchword":"zieners zullen beschaamd,","tekst":"Dat is, die /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
