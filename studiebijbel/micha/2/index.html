 een mantel af van hen die zonder zorg voorbijgaan, terugkomende van de strijd.","9":"De vrouwen van Mijn volk verdrijft u, elk uit het huis van haar genoegens; van haar kinderen neemt u Mijn sieraad voor altijd weg.","10":"Maak u dan op en ga heen; want dit land zal de rust niet zijn; omdat het verontreinigd is, zal het u verderven, en dat met een hevige verderving.","11":"Als er iemand is die met wind omgaat en vals liegt, en zegt: Ik zal u profeteren van wijn en van sterke drank! dan is dat een profeet voor dit volk.","12":"Zeker zal Ik u, o Jakob, geheel verzamelen; zeker zal Ik het overblijfsel van Israël bijeenbrengen; Ik zal het samen bijeenzetten als schapen van Bozra; als een kudde in het midden van haar kooi zullen zij dreunen van de mensenmenigte.","13":"De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits."},"SV":{"1":"Wee dien, die ongerechtigheid bedenken, en kwaad werken op hun legers; in het licht van den morgenstond doen zij het, dewijl het in de macht van hunlieder hand is.","2":"En zij begeren akkers, en roven ze, en huizen, en nemen ze weg; alzo doen zij geweld aan den man en zijn huis, ja, aan een iegelijk en zijn erfenis.","3":"Daarom, alzo zegt de HEERE: Ziet, Ik denk een kwaad over dit geslacht, waaruit gijlieden uw halzen niet zult uittrekken, en zo rechtop niet gaan; want het zal een boze tijd zijn.","4":"Te dien dage zal men een spreekwoord over ulieden opnemen; en men zal een klagelijke klacht klagen, *en* zeggen: Wij zijn ten enenmale verwoest; Hij verwisselt mijns volks deel; hoe ontwendt Hij mij; Hij deelt uit, afwendende onze akkers.","5":"Daarom zult gij niemand hebben, die het snoer werpe in het lot, in de gemeente des HEEREN.","6":"Profeteert gijlieden niet, *zeggen* *zij*, laat *die* profeteren; zij profeteren niet als die; men wijkt niet af *van* smaadheden.","7":"O gij, die Jakobs huis geheten zijt! Is dan de Geest des HEEREN verkort? Zijn dat Zijn werken? Doen Mijn woorden geen goed bij dien, die recht wandelt?","8":"Maar gisteren stelde zich Mijn volk op, tot vijand, tegenover een kleed; gij stroopt een mantel van degenen, die zeker voorbijgaan, wederkomende van den strijd.","9":"De vrouwen Mijns volks verdrijft gij, elk een uit het huis van haar vermakingen; van haar kinderkens neemt gij Mijn sieraad in eeuwigheid.","10":"Maakt u *dan* op, en gaat henen; want dit *land* zal de rust niet zijn; omdat het verontreinigd is, zal het *u* verderven, en dat *met* een geweldige verderving.","11":"Zo er iemand is, die met wind omgaat, en valselijk liegt, *zeggende*: Ik zal u profeteren voor wijn en voor sterken drank! dat is een profeet dezes volks.","12":"Voorzeker zal Ik u, o Jakob! gans verzamelen; voorzeker zal Ik Israëls overblijfsel vergaderen; Ik zal het te zamen zetten als schapen van Bozra; als een kudde in het midden van haar kooi zullen zij van mensen deunen.","13":"De doorbreker zal voor hun aangezicht optrekken; zij zullen doorbreken, en door de poort gaan, en door dezelve uittrekken; en hun koning zal voor hun aangezicht henengaan; en de HEERE in hun spits."},"KJV":{"1":"Woe to them that devise iniquity, and work evil upon their beds! when the morning is light, they practise it, because it is in the power of their hand.","2":"And they covet fields, and take *them* by violence; and houses, and take *them* away: so they oppress a man and his house, even a man and his heritage.","3":"Therefore thus saith the LORD; Behold, against this family do I devise an evil, from which ye shall not remove your necks; neither shall ye go haughtily: for this time *is* evil.","4":"In that day shall *one* take up a parable against you, and lament with a doleful lamentation, *and* say, We be utterly spoiled: he hath changed the portion of my people: how hath he removed *it* from me! turning away he hath divided our fields.","5":"Therefore thou shalt have none that shall cast a cord by lot in the congregation of the LORD.","6":"Prophesy ye not, *say they to them that* prophesy: they shall not prophesy to them, *that* they shall not take shame.","7":"O *thou that art* named the house of Jacob, is the spirit of the LORD straitened? *are* these his doings? do not my words do good to him that walketh uprightly?","8":"Even of late my people is risen up as an enemy: ye pull off the robe with the garment from them that pass by securely as men averse from war.","9":"The women of my people have ye cast out from their pleasant houses; from their children have ye taken away my glory for ever.","10":"Arise ye, and depart; for this *is* not *your* rest: because it is polluted, it shall destroy *you*, even with a sore destruction.","11":"If a man walking in the spirit and falsehood do lie, *saying*, I will prophesy unto thee of wine and of strong drink; he shall even be the prophet of this people.","12":"I will surely assemble, O Jacob, all of thee; I will surely gather the remnant of Israel; I will put them together as the sheep of Bozrah, as the flock in the midst of their fold: they shall make great noise by reason of *the multitude of* men.","13":"The breaker is come up before them: they have broken up, and have passed through the gate, and are gone out by it: and their king shall pass before them, and the LORD on the head"}},"tsk":{"1":[{"kopje":"op","refs":["Est 3:8","Est 5:14","Est 9:25","Ps 7:15-17","Ps 140:2-9","Spr 6:12-19","Spr 12:2","Jes 32:7","Jes 59:3","Jer 18:18","Ezech 11:2","Nahum 1:11","Luk 20:19","Luk 22:2-6","Hand 23:12","Rom 1:30"]},{"kopje":"beramen","refs":["Ps 36:5","Spr 4:16"]},{"kopje":"in het licht van de morgen","refs":["Hos 7:6","Hos 7:7","Matt 27:1","Matt 27:2","Mark 15:1","Hand 23:15"]},{"kopje":"omdat","refs":["Gen 31:29","Deut 28:32","Spr 3:27","Joh 19:11"]}],"2":[{"kopje":"begeren","refs":["Ex 20:17","1 Kon 21:2-19","Job 31:38","Jes 5:8","Jer 22:17","Amos 8:4","Hab 2:5-9","1 Tim 6:10"]},{"kopje":"zo","refs":["Micha 3 863\">If</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walking</span> in the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> and <span class=\"wl wl-kjv\" data-code=\"H8267\">falsehood</span> do <span class=\"wl wl-kjv\" data-code=\"H3576\">lie,</span> saying, I will <span class=\"wl wl-kjv\" data-code=\"H5197\">prophesy</span> unto thee of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> and of strong <span class=\"wl wl-kjv\" data-code=\"H7941\">drink;</span> he shall even be the <span class=\"wl wl-kjv\" data-code=\"H5197\">prophet</span> of this people.","12":"I will <span class=\"wl wl-kjv\" data-code=\"H622\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H622\">assemble,</span> O <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> all of thee; I will <span class=\"wl wl-kjv\" data-code=\"H6908\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> I will <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> them <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> as the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> of <span class=\"wl wl-kjv\" data-code=\"H1223\">Bozrah,</span> as the <span class=\"wl wl-kjv\" data-code=\"H5739\">flock</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of their <span class=\"wl wl-kjv\" data-code=\"H1699\">fold:</span> they shall make great <span class=\"wl wl-kjv\" data-code=\"H1949\">noise</span> by reason of the multitude of men.","13":"The <span class=\"wl wl-kjv\" data-code=\"H6555\">breaker</span> is come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them: they have broken <span class=\"wl wl-kjv\" data-code=\"H6555\">up,</span> and have passed <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and are gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> by it: and their <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> on the head"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"werken","tekst":"Het Hebr. woord, dat anders werken en doen betekent, wordt hier gebruikt voor overleggen en voornemen om te doen."},{"catchword":"legers","tekst":"Als zij behoorden te rusten, aan God te denken en hun wandel voor Hem te overpeinzen, enz. gelijk Psa 36:5 ."},{"catchword":"morgenstond doen zij het","tekst":"Haastende en brandende om hun boze lusten te voldoen. Verg. Hos 7:6 ."},{"catchword":"in de macht van hunlieder hand is","tekst":"Dewijl het met de justitie en politie zo in het land gesteld is, dat zij het vrijelijk kunnen doen. Zij zijn meesters en doen wat zij maar willen. Verg. de manier van spreken met Neh 5:5 ; Pro 3:27 . Anders, want hunlieder hand is tegen God."}],"2":[{"catchword":"begeren akkers","tekst":"Als zij maar op enig stuk land of op enig huis belust worden, of zin daartoe krijgen, zo nemen zij dat met geweld. Verg. 1Ch 21:1 , enz."},{"catchword":"man","tekst":"Die zij arm maken en bedroeven."},{"catchword":"huis","tekst":"Dat zij de eigenaar ontnemen en tot zich trekken."},{"catchword":"een iegelijk","tekst":"Of, de mens."},{"catchword":"erfenis","tekst":"Die God ganselijk niet de erfgenaam wilde ontwend of vervreemd hebben."}],"3":[{"catchword":"kwaad over dit geslacht","tekst":"Gelijk zij het kwaad van de zonde moedwilliglijk bedenken, voornemen en doen, alzo denk Ik over hen het kwaad van de straf."},{"catchword":"gijlieden","tekst":"Verandering van persoon, door een heftige aanspraak, gelijk onder vs.8 en elders dikwijls"},{"catchword":"halzen niet zult uittrekken","tekst":"Omdat het een sterk juk van dankbaarheid zal zijn, waaronder gij zult moeten bukken. Verg. Lev 26:13 , en Jer 11:11 met de aantekening."},{"catchword":"zo rechtop niet gaan","tekst":"Heb [met , of in] hoogheid, verhevenheid; dat is, met opgerichte hals, of hoofd, rechtop, omhoog. De zin is: Gij zult zo fier en stout niet zijn als gij nu zijt."},{"catchword":"boze tijd zijn","tekst":"Zie Amo 5:13 ."}],"4":[{"catchword":"zal men","tekst":"Hebr. hij zal; dat is, men zal, enz."},{"catchword":"spreekwoord over ulieden opnemen","tekst":"Om u, in uw ellende en weeklagen alom te bespotten; of het volgende deerlijk klagen en kermen zal zo algemeen zijn, dat men een algemeen spreekwoord daarvan zal maken, dat Israël zo en zo klaagt."},{"catchword":"ten enenmale verwoest","tekst":"Hebr. verwoestende, of met verwoesten zijn wij verwoest. Dat is, het is gans met ons uit en gedaan."},{"catchword":"Hij verwisselt","tekst":"Namelijk God. [door de Assyriër] geeft het land, dat Hij zijn volk gegeven had, aan vreemden; Hij verandert het van heren en eigenaars."},{"catchword":"deel","tekst":"Zie Psa 16:5-6 . Alzo van het snoer en lot in vs.5."},{"catchword":"hoe ontwendt Hij mij","tekst":"Woorden van verwondering, die kort en afgebroken zijn, zeer levendig afbeeldende het gewoel van het uitdelen van het land, alsof zij het voor ogen zagen geschieden."},{"catchword":"afwendende onze akkers","tekst":"Te weten tot anderen, of deelt Hij onze velden uit om [die] ons weer te geven? Geenszins, willen zij zeggen. Daar is nu gans hoop toe, dewijl zij aan vreemde bezitters voor altoos zijn weggeven. Alzo gevoelden zij de straf van hun ongerechtigheid en roverij, waarvan vs.1,2, gesproken is, gelijk zij hun broeders beroofd hadden, alzo geschiedt hun wederom; zie vs.5, en voorts vs.8-10."}],"5":[{"catchword":"Daarom zult","tekst":"Om de voorgemelde zonden, of omdat uw land al aan vreemden is overgegeven, zodat gij daarvan verstoken zijt, en geen Jozua u weer opnieuw het land bij loting zal uitdelen. Sommigen duiden het geestelijk op de verwerping uit Gods kerk, welker gemeenschap, door de uitdeling van het land Kanaän, bij loting en door snoeren was afgedeeld."},{"catchword":"gij niemand hebben","tekst":"Aanspraak aan een ieder in het bijzonder van die goddeloze geweldenaars, wie het wee is aangezegd, vs.1."},{"catchword":"in het lot","tekst":"Of, door het lot; dat is, die het lot werpt over uw deel; want daar zal niets voor u onder Gods volk ten beste zijn, geen plaats noch deel."}],"6":[{"catchword":"*","tekst":"Dit vers is [vermits afgebroken woorden] duister, en wordt verscheidelijk vertaald. Het schijnt dat hier de woorden, of het algemeen zeggen van het goddeloze volk verhaald wordt, waarop een heftige bestraffing volgt in vs.7."},{"catchword":"Profeteert gijlieden niet","tekst":"Hebr. drupt niet. Alzo in het volgende. Dat is, profeteert niet. Zie Deu 32:2 , en verg. Isa 30:10-11 ; Jer 11:21 ; Amo 2:12 , en Amo 7:12-13 , Amo 7:16 . Dit zijn de woorden van het volk tot de ware profeten."},{"catchword":"die profeteren","tekst":"De valse profeten. Verg. onder vs.11."},{"catchword":"zij profeteren niet als","tekst":"De ware profeten."},{"catchword":"die","tekst":"De andere, te weten de valse; of van die dingen, van welke de vrome profeten drupten."},{"catchword":"wijkt niet af","tekst":"Dat is, deze profeten [de ware] houden niet op van lasteren, schelden, beschamen, en alles kwaads te dreigen; zij zijn ondragelijk. Verg. 1Ki 22:8 ."},{"catchword":"smaadheden","tekst":"Of, beschamingen, smaadwoorden, [dit gestadig of dagelijks beschamen, enz.] houden niet op. Anderen vertalen dit vers aldus: drupt niet: [woorden van het volk] zij zullen [toch] druppen; [maar] zij zullen niet druppen voor of tot henlieden [Gods woorden] dat hij [Israël] geen schande zal behalen, [gelijk de valse profeten profeteerden], of, opdat zij [mijne profeten] geen schande behalen, of hun geen schande overkome. Aldus zou het een dreigement zijn dat God hen, om hun gruwelijke ondankbaarheid, van de ware profeten wilde beroven en zijn dienstknechten verschonen. Verg. Isa 8:16 ; Mat 7:6 ."}],"7":[{"catchword":"geheten zijt","tekst":"Gij voert de naam [wil de Heere zeggen] en beroemt u des, maar ten onrechte; zulke woorden betamen Jakobs huis geenszins. Verg. Joh 8:33 , Joh 8:37 , Joh 8:39-40 , Joh 8:44 ."},{"catchword":"Geest des HEEREN","tekst":"De Heilige Geest, door welken de ware profeten gedreven worden; 2Pe 1:21 ."},{"catchword":"verkort","tekst":"Of, benauwd, zodat Hij zijn dienstknechten niet recht en wel zou kunnen leiden en regeren? of, hun niet zou mogen profeteren wat Hem belieft? of, dat Hij nu de macht niet meer zou hebben om u over uw boosheid te bestraffen en voorts naar uw verdiensten te straffen, dat gij Hem aldus verbittert en tergt? Verg. de manier van spreken met Num 11:23 ; Isa 50:2 , en Isa 59:1 ."},{"catchword":"Zijn werken","tekst":"Te weten Gods werken, dat is, zijn dat de werken, die God u beveelt, of die Hem aangenaam zijn? [Verg. Joh 6:29 ] . Dit past zeer wel op het volgende. Anderen duiden het op Jakobs huis, aldus: Zijn dat werken, die Jakobs huis betamen?"},{"catchword":"Mijn woorden geen goed bij dien","tekst":"Gods. De zin is: Zijn mijn woorden niet vriendelijk, lieflijk en aangenaam voor en bij de vromen, aan wie zij niet alleen alles goeds beloven, maar ook onderwijzen en bestraffen tot hun best? Waart gij vroom, zo zouden mijn woorden, en dus ook die van mijn profeten, lieflijk tot en bij u zijn, maar het is uw schuld, dat zij anders moeten profeteren."},{"catchword":"recht wandelt","tekst":"Zie Psa 7:11 ."}],"8":[{"catchword":"Maar","tekst":"Alsof God zeide: Hoe zouden mijn woorden vriendelijk kunnen zijn tegen zulk een volk als dit is?"},{"catchword":"gisteren stelde zich Mijn volk op","tekst":"Dat is, onlangs, het is nog niet lang geleden, het is heterdaad geschied. Anders, [die] gisteren [dat is tevoren] mijn volk [waren], zijn [tegen mij] opgestaan als tegen een vijand."},{"catchword":"tot vijand","tekst":"Dat is, vijandelijk, als vijanden, straatschenders en struikrovers plegen na te doen, loerende op een roof."},{"catchword":"tegenover een kleed","tekst":"Om te zien of hen iemand mocht ontmoeten, die een goed kleed aanhad, om hem dat af te stropen. Hier komt God weer tot hetgeen hij hun vs.1,2 verweten heeft."},{"catchword":"gij stroopt","tekst":"Verandering van persoon, gelijk vs.3."},{"catchword":"mantel van degenen","tekst":"Of schoon overkleed. Aangaande het Hebr. woord, verg. Jon 3:6 ."},{"catchword":"zeker voorbijgaan","tekst":"Of, met vertrouwen, [niet denkende op enige vijand, immers op u in het minst geen achterdenken hebbende] en u geen leed doen."},{"catchword":"wederkomende van den strijd","tekst":"Die op roven en vechten niet meer denken, omdat de strijd geëindigd is; anders: afkerig zijnde van de strijd; dat is, die niet gezind zijn te vechten, of iemand leed te doen, voorbijgaande alleenlijk hun weg op goed vertrouwen; of, daar gij van de oorlog afgekeerd zijt; dat is, in vrede en zonder oorlog in het land leeft."}],"9":[{"catchword":"vermakingen","tekst":"Waarin zij [als de meeste tijd zich binnenshuis houdende] hun verblijf, pliezier en vrijheid hadden, met hun mannen en kinderen; sommigen verstaan het van de weduwen; anderen van lichtvaardige en wrede echtscheidingen, dat de mannen hun eigen vrouwen door scheidbrieven tirannelijk verstieten en uitdreven."},{"catchword":"Mijn sieraad","tekst":"Als, klederen, leeftocht, erfgoed en wat dies meer zij, dat Ik hun uit zonderlinge vaderlijke voorzorg tot bewijs van mijn goedheid en macht gegeven heb. Gij maakt hen kaal en bloot, als tot mijn schande. Sommigen duiden het op de verstoring en scheiding van het huwelijk van de ouders; idem, op slavernij, waar God hen uit Egypte verlost, tot een vrij volk en zijn kinderen gemaakt had."},{"catchword":"eeuwigheid","tekst":"Dat is, gij bedrijft deze stukken zonder ophouden en berouw, of gij beneemt het hun voor eeuwig en altoos, zodat er geen verhaal op is om weer te krijgen, verg. Jon 2:6 ."}],"10":[{"catchword":"henen","tekst":"In gevangenschap, het land uit."},{"catchword":"dit land zal de rust niet zijn","tekst":"Dit land, dat ik u tot een rust gegeven had, zal u niet langer kunnen verdragen, vanwege de gruwelen, waarmee gij hetzelve hebt verontreinigd, maar zal u uitspugen en [als wraak van u nemende] u gans en schrikkelijk verderven. Zie Deu 12:9 , Psa 95:11 ; Heb 4:5-6 ; idem Lev 18:25 , Lev 18:27-28 ; Eze 36:14 , Eze 36:17 , enz."},{"catchword":"geweldige verderving","tekst":"Of scherpe. Verg. 1Ki 2:8 ."}],"11":[{"catchword":"die met","tekst":"Of, die met wind en valsheid omgaande, liegt, [zeggende]: enz."},{"catchword":"wind omgaat","tekst":"Dat is, met ijdele valse profetieën, die de ziel zo weinig kunnen stichten en troosten als het lichaam van wind gevoed kan worden., Verg. Job 6:26 ; Jer 5:13 ; Isa 41:29 ; Jer 22:22 , Anders, met de geest; dat is, zich valselijk beroemt van openbaringen van de Geest Gods. Zie Eze 13:3 , en Hos 9:7 ."},{"catchword":"profeteren","tekst":"Gelijk vs.6."},{"catchword":"wijn en voor sterken drank","tekst":"Of, bij de wijn. Verg. onder Mic 3:5 ; Isa 28:7-8 , of van wijn, enz.; dat is van een goed wijnjaar, geluk, voorspoed en vrede. Zie Jer 13:12 , Jer 23:16-17 , en Jer 29:8-9 ; Son 2:14 ."},{"catchword":"profeet dezes volks","tekst":"Dat is, een aangenaam profeet bij dit volk, of voor dit volk."}],"12":[{"catchword":"Voorzeker zal Ik u, o Jakob, gans verzamelen;","tekst":"Hebr. verzamelende zal ik verzamelen, en zo, vergaderende vergaderen. Deze twee volgende verzen nemen vele uitleggers als een schone Evangelische belofte van de vergadering van de algemene kerk door hare Koning, de Messias Jezus Christus, omdat de profetische stijl, in zulke zaken gebruikelijk, dat schijnt te vereisen, en God dikwijls onder zijn allerzwaarste bestraffingen en dreigementen, tot troost van zijn gelovigen, zeer lieflijke genadebeloften pleegt in te mengen. [Verg. inzonderheid Jer 16:14-15 ; Hos 2:13 , enz. Zie ook onder Mic 3:12 en Mic 4:1 , enz.] De christelijke lezer kan ook hiermee vergelijken Jer 31:10 ; Hos 1:11 , en Hos 3:5 , enz. inzonderheid Eze 36:37-38 ; Zec 2:4 . Doch anderen, ziende op het voorgaande en volgende, houden het voor een profetie van de belegeringen en benauwingen en verwoesting van de tien stammen en Juda, door de Assyriërs en Babyloniërs, en van de gevankelijke weggevoering van hun beide koningen, Hosea en Zedekia, 2Ki 17:4 , enz. en 2Ki 18:10 , enz., en 2Ki 25:6-7 , waarvan de verstandige lezer zal kunnen oordelen en zien een dergelijk plaats Zec 10:3-5 met de aantekening."},{"catchword":"Bozra","tekst":"Een veerijke plaats van de Moabieten. Zie 2Ki 3:4 , en Jer 48:24 , met de aantekening."},{"catchword":"kooi","tekst":"Of stalling."}],"13":[{"catchword":"zal voor hun aangezicht optrekken;","tekst":"Hebr. is opgetogen, en zo in het volgende; dat is, zal zekerlijk optrekken. God zal alle vijandelijke beletselen van zijn genadewerk uit de weg ruimen, en de baan [gelijk men zegt] klaar en de weg openmaken. Maar anderen duiden het op de vijanden, gelijk op vs.12. is aangetekend waarvan de woorden doorbreker en doorbreken veel gebruikt worden. Zie Psa 17:4 . Doch wanneer God zijn volk lichamelijk en geestelijk verlost, vernielt Hij ook wel met geweld zijne en zijner kerk lichamelijke en geestelijke vijanden. Zie 2Sa 5:20 ; Isa 28:21 , en Isa 63:3-5 , Mic 4:13 . enz."},{"catchword":"koning zal voor hun aangezicht henengaan;","tekst":"Zie vs.12."},{"catchword":"spits","tekst":"Hebr. hoofd; dat is vooraan; als de voortocht nemende onder zijn volk; verg. Isa 52:12 . Anderen verstaan dat God, als zijns volk vijanden en tegenpartij geworden zijnde, met de vijand zal zijn, en dien als een veldoverste geleiden tegen zijn verworpen volk. Verg. Isa 63:10 ; Jer 21:5 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Wo to them that devise iniquity and worke [the Hebr. Word, which otherwise doth signifie to worke and do or act, is here used for showing contriving, designing, practicing, what and how to act] evil upon their couches: [where and when they should be at rest, and think upon God and ruminate their course and conversation before him, so Psa 36:5.] in the light of the morning they do it, [making all hast they can, as inflamed to execute their wicked designs. Compare Hos. 7.6.] Whiles it is in the power of their hand: [whiles the state and condition of justice and government in such in the land now, that they may do what they lift: they are amsters and have all the world at will, as followeth. Compare the phrase with Nehe. 5.5. Prov. 3.27. Others for their hand is against God.]"}],"2":[{"catchword":null,"tekst":"And they desire fields and rob them, and houses and take them away: [if they do but fancy, or get a minde to such and such a piece of land, or house, possessions, they will have it, and force it away from the owners. Compare 1 Kings 2.11, c] thus they practice violence upon the man [making him poor and sad] and his house; [dispossessing and bereaving the proprietour thereof] yea, upon every one [or the man (hominem) and his inheritance. [which God would in no wife allow to be taken away, or alienated from the heir.]"}],"3":[{"catchword":null,"tekst":"therefore thus saith the LORD; behold I devise an evil against this generation, [even as they wickedly devise, contrive and practice the evil of sin, so do I now devise the evil of punishment, that shall be executed upon them] out of which ye [here is a change of the person, by a vehement application, as above verse 8 and frequently elsewhere] shall not be able to draw forth, our necks, [the yoak of bondage, which ye shall be made to undergo, shall be so close and upon you. Com. Lev. 26.13. and Jer 11:11 with the annotate.] nor go so bolt-upright; [Hebr. (with, or in) highness, haughtiness, elevation, i.e. with the neck or head raised, or bearing up lofty, that is, ye shall not so high, nor carry yourselves so insolent, as now ye do] for it shall be an evil time. [see Amos 5. on verse 13.]"}],"4":[{"catchword":null,"tekst":"On that day they [Hebr. He, that is they, men, people] shall take up a Proverb over; [viz to make and jear you every where in your miseries and Lamentations; or the following bitter lamentations and complaining shall be so common, that it will grow into common proverb among men, thus and thus mourns Israel,] and they shall lament a dolefull lamentation (and) say, we are utterly wasted; [Heb. Wasting (or with wasting) we are wasted; that is, we are utterly ruined and undon] he exchangeth the portion [see Psalms 16. on verse 5, 6. and so of the line and lot in the next verse.] of my people, [meaning here is; God by the Assyrian gives away the land, which he had given formerly unto his people, unto stranger; and thereby he changeth the owners and proprietors of it] how doth he take from me! [words of admiration., very short and abrupt and lively, representing the busie stir about new dividing the land, as if they saw it down before their eyes] he divideth turning away our fields, [viz. over unto others; or doth he divide our fields, to restore (them) unto me? Alasse no; (do they imply) there is now no more hope left, since they are given away thus to strangers. Thus they were to be made sensible of the punishment of their own iniquity, and their dispossessing of others, mentioned before, verse 1.2 as they bereaved their own brethren, so they are now bereaved strangers; see the next verse and further below verse 8, 9, 10.]"}],"5":[{"catchword":null,"tekst":"Therefore thou shalt have none to cast the line into the lot; in the congregation of the LORD: [Or, by the lot, i.e. to cast the lot for thy share: for there shall be no part nor portion more for thee among the people of God. The speech is addressed here to every one in particular of those wicked oppressours, that were threatened with the Wo above verse 1. upon whom this particular judgement should light, by reason of their aforesaid wickedness; or there should be no casting of lots for him, because their land now delivered up to strangers and themselves quite outed and destitute of a Josua to new devide it by lot for them. Some give it a spiritual sense, understanding it of the rejected ones of the church of God, which was typified by the dividing of the land of Canaan by lots and lines.]"}],"6":[{"catchword":null,"tekst":"Do not ye [This verse by reason of its abrupt expression, is somewhat obscure, and is variously rendred: it should seem. That here are brought in the words or common speech of the wicked people, whereupon follows a heavie reproof in the next verse] prophesie, [Hebr. Drop not, and so in the sequel, i.e do not ye prophesie. See Deut. 32 on verse 2 and compare Isa. 30.10, 11. Jer. 11.21. Amos 2.12, 13, 16. these are the words of the people to the true prophets] (say they) let (these) prophesie, [viz. the false ones. Compare his work of grace, out of the way, and make the way plain and smooth for it: others refer it to the enemies, as was noted in the former vers concerning whom the words thorow-breaker and thorow-breaking the frequently used. See Psalms 17 on verse 4 though, when God delievers his people bodily and spiritually, he likewise violently destroys his and his churches temporal and spiritual adversaries. See 2 Sam. 5.20. Isa. 28.21, & 63.3, 4, 5, 6 Mich. 4.13.] they shall break thorow, and pass&Atilde;&copy; through the gates and march forth through the same; and their king shall go (away) before their faces; [see on the former verse] and the LORD in their front. [Heb. Head, as we use to say, in the head of them, i.e. in the fore-front: leading as it were the vanguard of his people. Compare Isa. 52.12 others understand it, that God being become an enemie and adversary to his people, would be with the enemy, and lead them as their General, against his rejected people. Compare Jer. 21.5 and Isa. 63.10.]"}],"7":[{"catchword":null,"tekst":"O thou, that art called the House of Jacob, [Ye hear that name indeed , doth the Lord here intimate, and boast of it, but very wrongfully: such words, or speeches become not Jacobs house at all. Compare Jos. 8. 33, 37, 39, 40, 44. [is then the spirit of the LORD[i.e. the holy spirit by whom the true Prophets were acted, 2 Pet. 1. 21.] shortned? [or strattned? Viz. so that he should not be able to direct and govern his servants aright? Or, should not have liberty to cause them to prophesie, what he is pleased to charge them with; or, that he should not have the same power still, to reprove you for your wickedness, and consequently pronounce Gods judgements upon you for the same, that ye go on thus to provoke and incense him. Compare the phrase with Num. 11.2, 3. Isa. 50.2.and 59.1] are these his works? [viz. Gods.i.e.are these the works which God commands you, or, which are acceptable unto him. Compare Job 6:29. This agreeth well with the sequel: others apply it to Jacobs house: thus, are these works becoming Jacobs house?] and do my [i.e.Gods] works no good by him that walketh aright? [See Psal.7.on vers. 11. The sense is Are not my words indeed pleasing and acceptable for and with the godly, to whom they do not onely promise all manner of good things, but likewise instruct and correct them for their good? If you were pious, both my own and my Prophets words would likewise be pleasing and acceptable to and among you; the fault is yours, that they must prophesie harsh things to you.]"}],"8":[{"catchword":null,"tekst":"But yesterday, [i.e.but lately, of late days, not long ago] my people stood up (as) an enemy, [i.e.in an hostile manner, watching for all advantages to do mischief, rob, plunder &c. God seems to infer here; How is it possible, that my words should be pleasing and acceptable to such a people as this is?] over against a garment: [to see whether they might meet with any, that had good clothes on his back to strip him of it. Here // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];

    let h = '';

    if (engels && engels.length) {

    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
