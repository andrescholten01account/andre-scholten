erblijfsel van Jakob zal zijn onder de heidenen, in het midden van veel volken, als een leeuw onder de dieren van het woud, als een jonge leeuw onder de schaapskudden; die, wanneer hij erdoorheen gaat, vertreedt en verscheurt, zodat niemand redt.","8":"Uw hand zal verhoogd zijn boven uw tegenstanders, en al uw vijanden zullen uitgeroeid worden.","9":"En het zal op die dag gebeuren, spreekt de HEERE, dat Ik uw paarden uit uw midden zal uitroeien, en Ik zal uw wagens vernietigen.","10":"En Ik zal de steden van uw land uitroeien, en Ik zal al uw vestingen afbreken.","11":"En Ik zal de toverijen uit uw hand uitroeien, en u zult geen guichelaars meer hebben.","12":"En Ik zal uw gesneden beelden en uw opgerichte beelden uit uw midden uitroeien, zodat u zich niet meer zult neerbuigen voor het werk van uw handen.","13":"Verder zal Ik uw bossen uit uw midden uitroeien, en Ik zal uw steden verdelgen.","14":"En Ik zal in toorn en in grimmigheid wraak doen aan de heidenen, die niet horen."},"SV":{"1":"En gij, Bethlehem Efratha! zijt gij klein om te wezen onder de duizenden van Juda? Uit u zal Mij voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van ouds, van de dagen der eeuwigheid.","2":"Daarom zal Hij henlieden overgeven, tot den tijd toe, dat zij, die baren zal, gebaard hebbe; dan zullen de overigen Zijner broederen zich bekeren met de kinderen Israëls.","3":"En Hij zal staan, en zal weiden in de kracht des HEEREN, in de hoogheid van den Naam des HEEREN, Zijns Gods, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden der aarde.","4":"En Deze zal Vrede zijn; wanneer Assur in ons land zal komen, en wanneer hij in onze paleizen zal treden, zo zullen wij tegen hem stellen zeven herders, en acht vorsten uit de mensen.","5":"Die zullen het land van Assur afweiden met het zwaard, en het land van Nimrod in deszelfs ingangen. Alzo zal Hij *ons* redden van Assur, wanneer dezelve in ons land zal komen, en wanneer hij in onze landpale zal treden.","6":"En Jakobs overblijfsel zal zijn in het midden van vele volken, als een dauw van den HEERE, als droppelen op het kruid, dat naar geen man wacht, noch mensenkinderen verbeidt.","7":"Ja, het overblijfsel van Jakob zal zijn onder de heidenen, in het midden van vele volken, als een leeuw onder de beesten des wouds, als een jonge leeuw onder de schaapskudden; dewelke, wanneer hij doorgaat, zo vertreedt en verscheurt hij, dat niemand redde.","8":"Uw hand zal verhoogd zijn boven uw wederpartijders, en al uw vijanden zullen uitgeroeid worden.","9":"En het zal te dien dage geschieden, spreekt de HEERE, dat Ik uw paarden uit het midden van u zal uitroeien, en Ik zal uw wagenen verdoen.","10":"En Ik zal de steden uws lands uitroeien, en Ik zal al uw vestingen afbreken.","11":"En Ik zal de toverijen uit uw hand uitroeien, en gij zult geen guichelaars hebben.","12":"En Ik zal uw gesneden beelden en uw opgerichte beelden uit het midden van u uitroeien, dat gij u niet meer zult nederbuigen voor het werk uwer handen.","13":"Voorts zal Ik uw bossen uit het midden van u uitroeien, en Ik zal uw steden verdelgen.","14":"En Ik zal in toorn en in grimmigheid wrake doen aan de heidenen, die niet horen."},"KJV":{"1":"But thou, Bethlehem Ephratah, *though* thou be little among the thousands of Judah, *yet* out of thee shall he come forth unto me *that is* to be ruler in Israel; whose goings forth *have been* from of old, from everlasting.","2":"Therefore will he give them up, until the time *that* she which travaileth hath brought forth: then the remnant of his brethren shall return unto the children of Israel.","3":"And he shall stand and feed in the strength of the LORD, in the majesty of the name of the LORD his God; and they shall abide: for now shall he be great unto the ends of the earth.","4":"And this *man* shall be the peace, when the Assyrian shall come into our land: and when he shall tread in our palaces, then shall we raise against him seven shepherds, and eight principal men.","5":"And they shall waste the land of Assyria with the sword, and the land of Nimrod in the entrances thereof: thus shall he deliver *us* from the Assyrian, when he cometh into our land, and when he treadeth within our borders.","6":"And the remnant of Jacob shall be in the midst of many people as a dew from the LORD, as the showers upon the grass, that tarrieth not for man, nor waiteth for the sons of men.","7":"And the remnant of Jacob shall be among the Gentiles in the midst of many people as a lion among the beasts of the forest, as a young lion among the flocks of sheep: who, if he go through, both treadeth down, and teareth in pieces, and none can deliver.","8":"Thine hand shall be lifted up upon thine adversaries, and all thine enemies shall be cut off.","9":"And it shall come to pass in that day, saith the LORD, that I will cut off thy horses out of the midst of thee, and I will destroy thy chariots:","10":"And I will cut off the cities of thy land, and throw down all thy strong holds:","11":"And I will cut off witchcrafts out of thine hand; and thou shalt have no *more* soothsayers:","12":"Thy graven images also will I cut off, and thy standing images out of the midst of thee; and thou shalt no more worship the work of thine hands.","13":"And I will pluck up thy groves out of the midst of thee: so will I destroy thy cities.","14":"And I will execute vengeance in anger and fury upon the heathen, such as they have not heard."}},"tsk":{"1":[{"kopje":"bent u","refs":["Matt 2:6","Joh 7:42"]},{"kopje":"Efratha","refs":["Gen 35:19","Gen 48:7","Ruth 4:11","1 Sam 17:12","1 Kron 2:50","1 Kron 2:51","1 Kron 2:54","1 Kron 4:4","Ps 132:6"]},{"kopje":"onder","refs":["1 Sam 10:19","1 Sam 23:23"]},{"kopje":"duizenden","refs":["Ex 18:21","Ex 18:25","Deut 1:15","1 Sam 8:12","1 Sam 17:18"]},{"kopje":"Mij","refs":["Jes 11:1","Jes 53:2","Ezech 17:22-24","Amos 9:11","Luk 2:4-7","1 Kor 1:27","1 Kor 1:28"]},{"kopje":"Die","refs":["Gen 49:10","1 Kron 5:2","Jes 9:5","Jes 9:6","Je herefore will he give them <span class=\"wl wl-kjv\" data-code=\"H5414\">up,</span> until the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that she which <span class=\"wl wl-kjv\" data-code=\"H3205\">travaileth</span> hath brought <span class=\"wl wl-kjv\" data-code=\"H3205\">forth:</span> then the <span class=\"wl wl-kjv\" data-code=\"H3499\">remnant</span> of his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","3":"And he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> and <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> in the <span class=\"wl wl-kjv\" data-code=\"H5797\">strength</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> in the <span class=\"wl wl-kjv\" data-code=\"H1347\">majesty</span> of the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3427\">abide:</span> for now shall he be <span class=\"wl wl-kjv\" data-code=\"H1431\">great</span> unto the <span class=\"wl wl-kjv\" data-code=\"H657\">ends</span> of the earth.","4":"And this man shall be the <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> when the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrian</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into our <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> and when he shall <span class=\"wl wl-kjv\" data-code=\"H1869\">tread</span> in our <span class=\"wl wl-kjv\" data-code=\"H759\">palaces,</span> then shall we <span class=\"wl wl-kjv\" data-code=\"H6965\">raise</span> against him <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds,</span> and <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H5257\">principal</span> men.","5":"And they shall <span class=\"wl wl-kjv\" data-code=\"H7462\">waste</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H5248\">Nimrod</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">entrances</span> thereof: thus shall he <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> us from the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrian,</span> when he <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> into our <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and when he <span class=\"wl wl-kjv\" data-code=\"H1869\">treadeth</span> within our borders.","6":"And the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> shall be in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> as a <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as the <span class=\"wl wl-kjv\" data-code=\"H7241\">showers</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6212\">grass,</span> that <span class=\"wl wl-kjv\" data-code=\"H6960\">tarrieth</span> not for <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3176\">waiteth</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of men.","7":"And the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> shall be among the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> as a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> among the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H3293\">forest,</span> as a young <span class=\"wl wl-kjv\" data-code=\"H3715\">lion</span> among the <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> of <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep:</span> who, if he go <span class=\"wl wl-kjv\" data-code=\"H5674\">through,</span> both treadeth <span class=\"wl wl-kjv\" data-code=\"H7429\">down,</span> and teareth in <span class=\"wl wl-kjv\" data-code=\"H2963\">pieces,</span> and none can deliver.","8":"Thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> shall be lifted <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> upon thine <span class=\"wl wl-kjv\" data-code=\"H6862\">adversaries,</span> and all thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> shall be cut off.","9":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> thy <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of thee, and I will <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> thy chariots:","10":"And I will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H6145\">cities</span> of thy <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and throw <span class=\"wl wl-kjv\" data-code=\"H2040\">down</span> all thy strong holds:","11":"And I will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> <span class=\"wl wl-kjv\" data-code=\"H3785\">witchcrafts</span> out of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and thou shalt have no more soothsayers:","12":"Thy graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images</span> also will I cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off,</span> and thy standing <span class=\"wl wl-kjv\" data-code=\"H4676\">images</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of thee; and thou shalt no more <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of thine hands.","13":"And I will pluck <span class=\"wl wl-kjv\" data-code=\"H5428\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H842\">groves</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of thee: so will I <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> thy <span class=\"wl wl-kjv\" data-code=\"H6145\">cities.</span>","14":"And I will <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H5359\">vengeance</span> in <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> and <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> such as they have not heard."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gij,","tekst":"Dat is, u aangaande."},{"catchword":"Bethlehem Efratha","tekst":"Zie Gen 35:16 , Gen 35:19 ; Jdg 12:8 , met de aantekening. Hebr. Bethlechem; dat is, broodhuis; gelijk Efrath of Efratha [welke ook de naam was van Kalebs huisvrouw, 1Ch 2:19 , 1Ch 2:24 ] komt van vruchtbaarheid."},{"catchword":"zijt gij klein","tekst":"Dat is, gij zijt geenszins klein, Mat 2:6 . Of [hoewel] gij klein zijt, enz. [nochtans] zal, enz. Anders aldus; Het [is wat] kleins, of gerings, een kleine zaak, dat gij zijt onder de duizenden, of voorgangers, vorsten, van Juda. [Verg. de aantekening van deze plaats, gedaan bij de overpriesters en schriftgeleerden voor de koning Herodes, Mat 2:6 ] . De zin is: Gij zijt wel klein naar het uiterlijk aanzien, maar gij zult tot zeer grote waardigheid verheven worden door de geboorte van de Messias en Zaligmaker Jezus Christus."},{"catchword":"duizenden van Juda?","tekst":"Dit ziet op de afdeling van de stammen in hun duizenden, hebbende elke duizend zijn hoofd en overste, of leidsman en voorganger, zie Jdg 6:15 ; 1Sa 10:19 , met de aantekening. Idem 1Ch 12:20 . Daarom staat bij Mat 2:6 , onder de vorsten, of voorgangers, leidslieden, hertogen; zijnde daarenboven de twee Hebr. woorden, die duizend en een leidsman, of voorganger betekenen, elkander zeer na verwant en van een oorsprong."},{"catchword":"Uit u zal","tekst":"Naar zijn menselijke natuur en ten aanzien dat het eeuwig en zelfstandig Woord van de Vader vlees zal worden, zo zal hij in u, o Bethlehem, geboren worden, en alzo uit u voortkomen, of uitgaan."},{"catchword":"Mij voortkomen,","tekst":"Woorden van God de Vader."},{"catchword":"Die een Heerser zal zijn in Israël,","tekst":"Hebr. om een heerser te zijn."},{"catchword":"uitgangen zijn","tekst":"Of, hoewel zijn uitgangen, gelijk het woord uitgaan, of voortkomen, in het voorgaande gebruikt is van Christus voortkomst uit Bethlehem naar zijn mensheid, omdat Hij aldaar uit Maria zou geboren worden; alzo wordt hetzelfde Hebr. woord hier nu gebruikt van zijn eeuwige voortkomst of uitgang van de vader, tot betekenis van zijn eeuwige godheid en Goddelijke geboorte van de Vader, en dat in het veelvoudige getal, uitgangen, hetwelk niet vreemd in de Hebr. taal, inzonderheid tot betekenis van iets groots en iets bijzonders, [zie Oba 1:21 ,enz.], als daar is de eeuwigheid van de Zoon met de Vader en zijn onbegrijpelijke geboorte van dezelve. Zie Heb 1:3 ."},{"catchword":"van ouds, van de dagen der eeuwigheid","tekst":"Dat is, vóór het begin der schepping, ja van eeuwigheid, of eeuwige tijden af. Verg. Pro 8:22-24 , Pro 8:30-31 ; Joh 1:1 , en Joh 17:5 . Dat het Hebr. woord kredem, als het van God gebruikt wordt, somtijds eeuwigheid betekent, zie daarvan Deu 33:27 met de aantekening."}],"2":[{"catchword":"Hij","tekst":"God."},{"catchword":"henlieden","tekst":"De Joden."},{"catchword":"overgeven,","tekst":"Of, laten, onder de heerschappij en macht hunner vijanden, zo Babyloniërs als anderen, totdat hun koning de Messias komt."},{"catchword":"baren zal,","tekst":"Totdat de Israëlietische kerk door de predikatie der apostelen ene menigte van geestelijke kinderen zal voortbrengen, zo Joden als inzonderheid heidenen. Verg. Isa 54:1 , enz., en Isa 66:7-8 ; of [gelijk sommigen] totdat de arbeid en kindsnood [dat is, het lijden der Joodse kerk] over is, en blijdschap kome, als wanneer ene vrouw verlost is; verg. Mic 4:9-10 ; Joh 16:20-21 . Men kan dit ook eenvoudig duiden op de geboorte van den Messias uit de maagd Maria. Verg. Isa 7:4 ."},{"catchword":"de overigen","tekst":"Hebr. het overige zullen, enz."},{"catchword":"Zijner broederen zich bekeren","tekst":"Des Heeren Christus broeders, namelijk de uitverkorenen uit de heidenen, die zich tot de gemeenschap van Christus en zijner kerk zullen begeven, en met de Joden onder een hoofd door een geloof verening worden. Zie Joh 10:16 ; Eph 2:11-12 , enz.; Heb 2:11-12 ."},{"catchword":"met de kinderen Israëls","tekst":"Anders: tot, de zin overeenkomende."}],"3":[{"catchword":"Hij zal","tekst":"De voorzeide heerser, de Messias."},{"catchword":"staan,","tekst":"Dat is, steeds bezig zijn met verrichting van zijn ambt, als een getrouwe herder, die goede wacht houdt over zijn kudde, en altijd op de been is, gelijk men zegt. Verg. Mic 7:14 ; Zec 1:8 , en Zec 3:5, en de manier van spreken met Zec 14:4, Zec 14:12. Of, Hij zal staan, dat is bestaan, een bestendige heerschappij hebben."},{"catchword":"weiden","tekst":"Als een herder zijn kudde, met den staf van zijn Woord en Geest, of weiden, dat is regeren, in enen zin. Zie 2Sa 5:2 , enz. Waarom ook voor heersen, [ vs.1], staat Mat 2:6 , weiden."},{"catchword":"HEEREN,","tekst":"Zijns Vaders, die ook zijn eigen kracht is. Zie Joh 10:38 , en Joh 14:10 ; waarom hem de hhogheid of voortreffelijkheid van den naam van zijn Vader wordt toegeëigend. Verg. Joh 5:18 ; Phi 2:6 ; Heb 1:3 , Heb 1:5 ."},{"catchword":"zij zullen wonen,","tekst":"Zijne onderdanen of schapen zullen een gerusten, vasten en zekeren staat hebben onder dezen heerser en herder. Verg. Mic 4:4 , enz."},{"catchword":"want","tekst":"Of, wanneer Hij nu groot zal zijn, enz."},{"catchword":"nu zal Hij","tekst":"Dat is, al haast, ter gezetter tijd. Zie Mic 4:10 ."},{"catchword":"zijn tot aan de einden der aarde","tekst":"Of, worden; amders: groot gemaakt worden; dat is, zijne eer en heerlijkheid zal wassen, uitgebreid en vermaard worden, door de predikatie van het Evangelie en de werking van den Heiligen Geest onder de heidenen; of, Hij zal zijne grootheid en heerlijkheid alzo bewijzen, tot aan de uiterste einden der aarde."}],"4":[{"catchword":"Vrede zijn;","tekst":"Dit is een reden, waarom de kerk van Christus zo vast en vredig wonen zal, als in het voorgaande beloofd is; om dat Christus Verde zal zijn; dat is, zijn geestelijken en goddelijken vrede haar onfeilbaar en in alle manieren geven en beschikken, dien haar geen vijand zal kunnen ontnemen, [verg. Jdg 6:24 , en Joh 14:27 ] , hoewel zij in de wereld veel zal moeten lijden; waartegen zij in het volgende getroost wordt."},{"catchword":"wanneer Assur in ons land zal komen,","tekst":"Hier wordt de kerk ingevoerd, betuigende hare gerustheid en vertrouwen, dat zij op dezen haren Koning heeft, tegen alle vijandelijkheid, die haar zal mogen bejegenen. Verg. Isa 41:25 , en Isa 59:19 , met de aantekening. De eenvoudigste zin dezer figuurlijke woorden schijnt te zijn: Wanneer de vijanden der kerk en de kinderen dezer wereld [afgebeeld door de vijandelijke Assyriërs en Nimrods land] haar over last zullen doen, [hetwelk zij van tevoren wel weet dat haar zal wedervaren] dat zij alsdan van haren Koning [die, in vs.5, gezegd wordt] van Assur te redden daartegen genoeg, ja overvloediglijk, met tegenweer en wederwraak voorzien zal zijn, om haar geestelijken staat te handhaven en de vijanden te straffen; [alzo wel, alsof zij] zeven, of acht heirlegers onder zoveel krijgsoversten kon te velde brengen tegen de Assyriërs en Chaldeën]; en dat vooreerst door het zwaard en het goddelijke Woord, en het middel der kerkelijke tucht [welke de geestelijke wapenen der kerk zijn] gebruikt van herders en regeerders der kerk [waarvan sommigen dit alleen verstaan, alsook van de bekering der voorzeide vijanden"},{"catchword":"wanneer Assur in ons land zal komen,","tekst":"tot de gemeenschap der kerk en haar kerkelijke en geestelijke weiding en regering]. Daarna ook, nu en dan, uiterlijk en lichamelijk [gelijk anderen hier bijvoegen] wanneer het den Zoon Gods believen mag zijne kerk van der vijanden overval door zijne helden, die Hij ten beste van zijn volk verwekken kan, te verlossen en de vijanden te verdelgen, zulks Hij zelf ten laatste eens volkomenlijk zal doen. Verg. vs.8, 14."},{"catchword":"stellen","tekst":"Of, over hem verwekken, doen opstaan, verkiezen, beroepen, ordineren, te weten, door de regering en het beleid van onzen Koning en zijnen Geest. Zie Act 13:2 , enz., idem Act 20:28 ; Eph 4:11 ."},{"catchword":"zeven","tekst":"Dat is, genoeg, of veel, een zeker getal voor een onzeker. Verg. Ecc 11:2 met de aantekening."},{"catchword":"herders,","tekst":"Kerkelijke en politieke regenten, ook krijgsoversten, gelijk het krijgsvolk ook kudden genoemd worden. Zie Jer 49:19-20 met de aantekening."},{"catchword":"vorsten","tekst":"Of, voornamen, geweldigen, stadhouders. Zie Eze 32:30 ."},{"catchword":"uit de mensen","tekst":"Hebr. des, of een mensen, der mensen; dat is, naar sommigen gevoelen, uit de gemene lieden. Verg. Psa 4:3 . Zodat de slechtsten van Gods kerk, door wettelijk beroep en den Geest des Heeren Christus, bekwaam zullen worden tot tegenstand; gelijk God Mozes en Aäron, enz., en Christus zijne apostelen, uit de menigte, en voorts de anderen door de apostelen en zijn volk, beroepen en daartoe ingesteld heeft. Zie Act 4:13 . Of, men kan het aldus nemen: de vorsten der mensen; dat is, de treffelijksten en dappersten, die in het midden van ons begaafd zijn met den geest der dapperheid. Verg. Psa 149:6-9 met de aantekening, idem Joh 16:8-11 , en 2Co 10:4-5 ."}],"5":[{"catchword":"Nimrod","tekst":"Zie Gen 10:8-10 ."},{"catchword":"ingangen","tekst":"Of, openingen, deuren des lands, dat is, frontieren, grenzen, of waar het land open is. Anders: met deszelfs [lands eigen] blote zwaarden, omdat een ander verwant Hebr. woord alzo genomen wordt; zie Psa 55:22 , met de aantekening."},{"catchword":"Hij ons redden van Assur,","tekst":"De heerser, die uit Bethlehem zal voortkomen, zal dat doen, gebruikende daartoe en zegenende de voorzeide middelen."}],"6":[{"catchword":"dauw van den HEERE,","tekst":"Omdat uit Jakobs overblijfsel Christus [naar het vlees] en zijne apostelen, en voorts uit de algemene kerk leraars zouden voortkomen, die door de predikatie van het Evangelie van de zaligmakende genade, vele volken zouden bedruipen en overgieten als met een hemelsen dauw en lieflijke regendroppelen, waarbij de Geest des Heeren [wiens werk dat alleen is] alzo zou werken in de harten der uitverkorenen, dat er menigten van gelovigen ter ere Gods zouden opschieten, of geboren worden, wassen, groeien en bleoien, enz. Verg. Psa 110:3 ; Isa 26:19 , en Isa 66:8-9 ; Eze 47:7 met de aantekening, enz.; idem 1Co 3:6-7 ."},{"catchword":"geen man wacht,","tekst":"Dat is, zodat dit gewas louter en alleenlijk een werk Gods zal zijn ven boven. Verg. Job 38:26-27 , met de aantekening."}],"7":[{"catchword":"leeuw onder de beesten des wouds,","tekst":"Vrijmoedig in zijnen weg, en zijnen vijanden vreeslijk, door de onoverwinnelijke kracht van hun Hoofd Christus [den leeuw uit Juda, Rev 5:5 ] en van zijn Geest. Zie Joh 16:33 ; 1Jo 5:4-5 . Sommigen stellen tegen elkander der kerken dauw, als lieflijk voor de boetvaardigen, en den leeuw, als vreeslijk tegen de onboetvaardigen en hardnekkigen, in het gebruik der sleutels van het hemelrijk."},{"catchword":"verscheurt hij,","tekst":"Verg. Psa 7:3 ."}],"8":[{"catchword":"hand zal verhoogd zijn boven uw wederpartijders,","tekst":"Dat is, macht, o Jakob, uit het voorgaande. Verg. Gen 49:8 , en zie Gen 16:6 ."},{"catchword":"al uw vijanden zullen uitgeroeid worden","tekst":"Niet alleen de geestelijke, maar ook ten laatste alle lichamelijke, gelijk vs.14."}],"9":[{"catchword":"paarden uit het midden van u zal uitroeien,","tekst":"De Heere wil hier en in het volgende zeggen dat Hij alles, waarmede zijn volk Hem nu zolang onteerd en vertoorn had, zal wegnemen, te weten den vleselijken arm, allen ijdelen, afgodischen en duivelsen toeverlaat; en zijne kerk alzo heiligen, dat zij zich op Hem alleen verlate, Hem alleen godsdienstig ere en diene, en onder zijne bescherming zeker zijnde, door zijne macht en oordelen over al hare vijanden zegeviere. Verg. Hos 1:7 , en Hos 14:4 met de aantekening."}],"11":[{"catchword":"guichelaars hebben","tekst":"Zie Lev 19:26 ."}],"12":[{"catchword":"werk uwer handen","tekst":"De afgodische beelden."}],"13":[{"catchword":"bossen uit het midden van u uitroeien,","tekst":"Ter ere der afgoden gesticht, en tot afgoderij gebruikt; zie Deu 12:3 , en Deu 16:21 , met de aantekening en verg. hiermede Eze 43:7-9 ."}],"14":[{"catchword":"horen","tekst":"Dat is, gehoorzaam. Verg. Isa 60:12 ; Jer 12:17 . Anders: welke [te weten, wraak, dat is, desgelijks] zij niet hebben gehoord; dat is, desgelijks nooit tevoren gehoord is."}]},"kanttekeningen_en":{"1":[{"catchword":"(1) And thou","tekst":"i.e. as concerning thee"},{"catchword":"Bethlehem Ephrata","tekst":"see gen. 35.16, 19. jud. 12.8 with the annotate. Or Ephrat, or Ephrata (which also was the name of Caleb his wife, I Chro. 2.19, 24.) signifies fruitfulness"},{"catchword":"i.e. indeed not small","tekst":"i.e. indeed thou not small, Matt. 2.6 or (although) thou be small, c yet, c. oth. It is (a) small (thing, or matter) that thou art among, c. (compare the annotate. On this place made by the chief priests and scribes before king Herod, Matt. 2.6.) the sense is, thou art but small in deed, as to thy outward appearance, but thou shalt be exalted to great dignity, by the birth of the Messia and our Saviour Jesus Christ"},{"catchword":"among the thousands of Juda?","tekst":"or leader, princes of Juda. This hath respect to the dividing of the tribes into their thousands each thousand having their perculiar headd and leader or chieftain; (see Jud 6:15. 1 Sam 10.19 with the annotate. And 2 chro. 12.20.) therefore you have it, mat. 2.6. among the Princes, or Leaders, Guides, Dakes: the Hebrew words, also that signify both Thousand and leader, are neer of kin and derived from one and the same root"},{"catchword":"out of thee shall come forth","tekst":"words of God the father"},{"catchword":"he that shall be","tekst":"Hebr. For to be"},{"catchword":"a ruler (Dominator) in Israel:","tekst":"this is to be understood according to his humane nature; and in regard the eternal and self-subsisting word of the father, was to be made flesh, the same should be born in Bethlehem and so come forth, or proceed out of it"},{"catchword":"and whose goings forth are of old, from the dayes of eternity:","tekst":"i.e. before the beginning of the creation, from eternity, or everlasting times. Compare Prov. 8.22, 23, 24, 30, 31Jn 1:1 and 17.5. that the Hebrew word Kedem, being used of God, doth sometime signifie eternity, thereof see Deut. 33.27 with the annotate. Oth. Though his goings or coming forth &c as the word goings or coming forth out of Bethlehem, according to his humanity, being to be born there, of the virgin Mary. So the same word is used here for his everlasting coming forth or proceeding from the father, thereby to signifie his eternal God head and divine generation from the father: and that in the plural, gonigs forth, which is not unusual in the Hebrew tongue, especially to signifie some great and extra ordinarie matter (see Obad. 21, &c) such as indeed the co-effence of the son with the father and his incomprehensible birth and generation out of him. See Heb. 1.3."}],"2":[{"catchword":"(2) Therefore shall he","tekst":"God"},{"catchword":"deliver them","tekst":"the Jews"},{"catchword":"up","tekst":"or, leave them, to wit, understand the dominion and power of their enemies, both Babylonians and others, until their king, the Messia, come"},{"catchword":"until thine time, that she which is to bring forth, shall brought forth","tekst":"i.e. until the Israelites church, by means of the Apostle preaching shall bring forth abundance of spiritual children, both of Jews and especially) Gentiles. Compare Isa. 54.1 and chapter 66.7, 8 or (as some) until the travel and pangs of children (i.e. the sufferings of the Jewish church) be past and the joy be come of the woman delivered. Compare above chap. 4.9, 10. Job 16:20,21. this may likewise plainly be understood of the birth of th Messia, by the virgin Mary. Compare Isa. Chap. 7.14"},{"catchword":"then shall the remnant of his heathen convert themselves","tekst":"viz the heathen of the Lord Christ, that is, the elect or chosen ones among the Gentiles which shall joyn themselves to the communion of Christ and his church, and be united together with the Jews under one head by faith. See Joh 10:16. Heb 2:11.12. Eph. 2.11, 12."},{"catchword":"with the children of Israel","tekst":"Oth. Unto: the sense being one."}],"3":[{"catchword":"(3) And he","tekst":"viz. the foresaid LORD and ruler, Messia"},{"catchword":"shall stand","tekst":"i.e. be always exercising of his office, as a faithfull shepherd, that keeps good watch over his stock, and is always ready /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
