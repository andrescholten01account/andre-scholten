"deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Ai mij! Want ik ben als wanneer de zomervruchten zijn ingezameld; als wanneer de nalezingen in de wijnoogst gebeurd zijn; er is geen druif om te eten; mijn ziel begeert vroegrijpe vrucht.", "2": "De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet.", "3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "4": "De beste van hen is als een doorn; de oprechtste is scherper dan een doornheg; de dag van uw wachters, uw bezoeking, is gekomen; nu zal hun verwarring zijn.", "5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "6": "Want de zoon veracht de vader, de dochter staat op tegen haar moeder, de schoondochter tegen haar schoonmoeder; iemands vijanden zijn zijn huisgenoten.", "7": "Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen.", "8": "Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn.", "9": "Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "10": "En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.", "11": "Ten dage dat Hij uw muren zal herbouwen, te dien dage zal het besluit ver heengaan.", "12": "Te dien dage zal het ook tot u komen, van Assur af, zelfs tot de vaste steden toe; en van de vestingen tot aan de rivier, en van zee tot zee, en van gebergte tot gebergte.", "13": "Maar dit land zal worden tot een verwoesting, vanwege zijn inwoners, vanwege de vrucht van hun handelingen.", "14": "Weid Ú dan Uw volk met Uw staf, de kudde van Uw erfenis, die alleen woont, in het woud, midden in een vruchtbaar land; laat ze weiden in Basan en Gilead, als in de dagen van ouds.", "15": "Ik zal haar wonderen laten zien, als in de dagen toen u uit Egypteland trok.", "16": "De heidenen zullen het zien, en beschaamd zijn, vanwege al hun macht; zij zullen de hand op de mond leggen; hun oren zullen doof worden.", "17": "Zij zullen het stof lekken, als de slang; als kruipende dieren van de aarde, zullen zij sidderend tevoorschijn komen uit hun schuilhoeken; zij zullen met vervaardheid komen tot de HEERE, onze God, en zullen voor U vrezen.", "18": "Wie is een God gelijk U, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel van Zijn erfenis voorbijgaat? Hij houdt Zijn toorn niet voor eeuwig vast; want Hij heeft lust aan goedertierenheid.", "19": "Hij zal Zich weer over ons ontfermen; Hij zal onze ongerechtigheden dempen; ja, U zult al hun zonden in de diepten van de zee werpen.", "20": "U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt."}, "SV": {"1": "Ai mij! want ik ben, als wanneer de zomervruchten zijn ingezameld; als wanneer de nalezingen in den wijnoogst geschied zijn; er is geen druif om te eten; mijn ziel begeert vroegrijpe vrucht.", "2": "De goedertierene is vergaan uit het land, en er is niemand oprecht onder de mensen; zij loeren altemaal op bloed, zij jagen, een iegelijk zijn broeder, *met* een jachtgaren.", "3": "Om *met* beide handen wel dapper kwaad te doen, zo eist de vorst, en de rechter *oordeelt* om vergelding; en de grote spreekt de verderving zijner ziel, en zij draaien ze dicht ineen.", "4": "De beste van hen is als een doorn; de oprechtste is *scherper* dan een doornheg; de dag uwer wachters, uw bezoeking, is gekomen; nu zal hunlieder verwarring wezen.", "5": "Gelooft een vriend niet, vertrouwt niet op een voornaamsten vriend; bewaar de deuren uws monds voor haar, die in uw schoot ligt.", "6": "Want de zoon veracht den vader, de dochter staat op tegen haar moeder, de schoondochter tegen haar schoonmoeder; eens mans vijanden zijn zijn huisgenoten.", "7": "Maar ik zal uitzien naar den HEERE, ik zal wachten op den God mijns heils; mijn God zal mij horen.", "8": "Verblijd u niet over mij, o mijn vijandin! wanneer ik gevallen ben, zal ik weder opstaan; wanneer ik in duisternis zal gezeten zijn, zal de HEERE mij een licht zijn.", "9": "Ik zal des HEEREN gramschap dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twiste, en mijn recht uitvoere; Hij zal mij uitbrengen aan het licht; ik zal *mijn* *lust* zien aan Zijn gerechtigheid.", "10": "En mijn vijandin zal *het* zien, en schaamte zal haar bedekken; die tot mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen aan haar zien; nu zal zij worden tot vertreding, als slijk der straten.", "11": "Ten dage als Hij uw muren zal herbouwen, te dien dage zal het besluit verre heengaan.", "12": "Te dien dage zal het ook komen tot u toe, van Assur af, zelfs *tot* de vaste steden *toe*; en van de vestingen tot aan de rivier, en van zee *tot* zee, en *van* gebergte *tot* gebergte.", "13": "Maar dit land zal worden tot een verwoesting, zijner inwoners halve, vanwege de vrucht hunner handelingen.", "14": "Gij *dan*, weid Uw volk met Uw staf, de kudde Uwer erfenis, die alleen woont, *in* het woud, in het midden van een vruchtbaar land; laat ze weiden *in* Basan en Gilead, als in de dagen van ouds.", "15": "Ik zal haar wonderen doen zien, als in de dagen, toen gij uit Egypteland uittoogt.", "16": "De heidenen zullen het zien, en beschaamd zijn, vanwege al hun macht; zij zullen de hand op den mond leggen; hun oren zullen doof worden.", "17": "Zij zullen het stof lekken, als de slang; als kruipende dieren der aarde, zullen zij zich beroeren uit hun sloten; zij zullen met vervaardheid komen tot den HEERE, onzen God, en zullen voor U vrezen.", "18": "Wie is een God gelijk Gij, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel Zijner erfenis voorbij gaat? Hij houdt Zijn toorn niet in eeuwigheid; want Hij heeft lust aan goedertierenheid.", "19": "Hij zal Zich onzer weder ontfermen; Hij zal onze ongerechtigheden dempen; ja, Gij zult al hun zonden in de diepten der zee werpen.", "20": "Gij zult Jakob de trouw, Abraham de goedertierenheid geven, die Gij onzen vaderen van oude dagen af gezworen hebt."}, "KJV": {"1": "Woe is me! for I am as when they have gathered the summer fruits, as the grapegleanings of the vintage: *there is* no cluster to eat: my soul desired the firstripe fruit.", "2": "The good *man* is perished out of the earth: and *there is* none upright among men: they all lie in wait for blood; they hunt every man his brother with a net.", "3": "That they may do evil with both hands earnestly, the prince asketh, and the judge *asketh* for a reward; and the great *man*, he uttereth his mischievous desire: so they wrap it up.", "4": "The best of them *is* as a brier: the most upright *is sharper* than a thorn hedge: the day of thy watchmen *and* thy visitation cometh; now shall be their perplexity.", "5": "Trust ye not in a friend, put ye not confidence in a guide: keep the doors of thy mouth from her that lieth in thy bosom.", "6": "For the son dishonoureth the father, the daughter riseth up against her mother, the daughter in law against her mother in law; a man's enemies *are* the men of his own house.", "7": "Therefore I will look unto the LORD; I will wait for the God of my salvation: my God will hear", "8": "Rejoice not against me, O mine enemy: when I fall, I shall arise; when I sit in darkness, the LORD *shall be* a light", "9": "I will bear the indignation of the LORD, because I have sinned against him, until he plead my cause, and execute judgment for me: he will bring me forth to the light, *and* I shall behold his righteousness.", "10": "Then *she that is* mine enemy shall see *it*, and shame shall cover her which said unto me, Where is the LORD thy God? mine eyes shall behold her: now shall she be trodden down as the mire of the streets.", "11": "*In* the day that thy walls are to be built, *in* that day shall the decree be far removed.", "12": "*In* that day *also* he shall come even to thee from Assyria, and *from* the fortified cities, and from the fortress even to the river, and from sea to sea, and *from* mountain to mountain.", "13": "Notwithstanding the land shall be desolate because of them that dwell therein, for the fruit of their doings.", "14": "Feed thy people with thy rod, the flock of thine heritage, which dwell solitarily *in* the wood, in the midst of Carmel: let them feed *in* Bashan and Gilead, as in the days of old.", "15": "According to the days of thy coming out of the land of Egypt will I shew unto him marvellous", "16": "The nations shall see and be confounded at all their might: they shall lay *their* hand upon *their* mouth, their ears shall be deaf.", "17": "They shall lick the dust like a serpent, they shall move out of their holes like worms of the earth: they shall be afraid of the LORD our God, and shall fear", "18": "Who *is* a God like unto thee, that pardoneth iniquity, and passeth by the transgression of the remnant of his heritage? he retaineth not his anger for ever, because he delighteth *in* mercy.", "19": "He will turn again, he will have compassion upon us; he will subdue our iniquities; and thou wilt cast all their sins into the depths of the sea.", "20": "Thou wilt perform the truth to Jacob, *and* the mercy to Abraham, which thou hast sworn unto our fathers from the days of old."}}, "tsk": {"1": [{"kopje": "Ai", "refs": ["Ps 120:5", "Jes 6:5", "Jes 24:16", "Jer 4:31", "Jer 15:10", "Jer 45:3"]}, {"kopje": "als", "refs": ["Jes 17:6", "Jes 24:13"]}, {"kopje": "begeert", "refs": ["Jes 28:4", "Hos 9:10"]}], "2": [{"kopje": "is verdwenen", "refs": ["Ps 12:2", "Ps 14:1-3", "Jes 57:1", "Rom 3:10-18"]}, {"kopje": "zij allemaal", "refs": ["Spr 1:11", "Spr 12:6", "Jes 59:7", "Jer 5:16"]}, {"kopje": "jagen", "refs": ["1 Sam 24:12", "1 Sam 26:20", "Ps 57:7", "Jer 5:26", "Jer 16:16", "Klaagl 4:18", "Hab 1:15-17"]}], "3": [{"kopje": "doen", "refs": ["Spr 4:16", "Spr 4:17", "Jer 3:5", "Ezech 22:6"]}, {"kopje": "de vorst", "refs": ["Micha 3:11", "Jes 1:23", "Jer 8:10", "Ezech 22:27", "Hos 4:18", "Amos 5:12", "Matt 26:15"]}, {"kopje": "de grote", "refs": ["1 Kon 21:9-14"]}, {"kopje": "draaien", "refs": ["Jes 26:21", "Luk 12:1", "Luk 12:2", "1 Kor 4:5"]}], "4": [{"kopje": "de dag", "refs": ["Ezech 12:23", "Ezech 12 132:11", "svLabel": null}, {"disp": "Micha 7:20", "href": "../../micha/7/#v20", "ref": "Micha 7:20", "svLabel": null}, {"disp": "Hebr 10:23", "href": "../../hebreeen/10/#v23", "ref": "Hebr 10:23", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Mercy Of God, The", "href": "../../torrey/m/#t-mercy-of-god-the", "kinderen": [{"label": "Described As", "href": "../../torrey/m/?hl=Mic.7.20#i12744", "refs": [], "kinderen": [{"label": "Sure", "href": "../../torrey/m/?hl=Mic.7.20#i12750", "refs": [{"disp": "Jes 55:3", "href": "../../jesaja/55/#v3", "ref": "Jes 55:3", "svLabel": null}, {"disp": "Micha 7:20", "href": "../../micha/7/#v20", "ref": "Micha 7:20", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Truth Of God, The", "href": "../../torrey/t/#t-truth-of-god-the", "kinderen": [{"label": "Exhibited In His", "href": "../../torrey/t/?hl=Mic.7.20#i22049", "refs": [], "kinderen": [{"label": "Fulfilment of his covenant", "href": "../../torrey/t/?hl=Mic.7.20#i22057", "refs": [{"disp": "Micha 7:20", "href": "../../micha/7/#v20", "ref": "Micha 7:20", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"1 Kon 8:56": "Geloofd zij de HEERE, Die aan Zijn volk Israël rust gegeven heeft, naar alles wat Hij gesproken heeft! Niet één woord is er gevallen van al Zijn goede woorden, die Hij gesproken heeft door de dienst van Mozes, Zijn dienaar.", "Mal 3:6": "Want Ik, de HEERE, word niet veranderd; daarom zijn u, kinderen van Jakob, niet verteerd.", "Jak 4:5": "Of denkt u dat de Schrift zomaar zegt: De Geest, Die in ons woont, verlangt vurig naar ons?", "Jer 5:5": "Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, en de banden verscheurd.", "Deut 1:12-17": "Hoe zou ik alleen uw moeite, en uw last, en uw geschillen dragen? Neem voor u wijze, verstandige en ervaren mannen, uit uw stammen, zodat ik hen tot uw hoofden stel. Toen antwoordde u mij, en zei: Dit woord dat u gesproken hebt, is goed om te doen.", "Ps 119:126": "Het is tijd voor de HEERE, dat Hij werkt, want zij hebben Uw wet verbroken.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "Jes 32:7": "En het hele gereedschap van een gierigaard is kwaad; hij bedenkt schandelijke plannen, om de ellendigen te gronde te richten met valse woorden, ook als de arme spreekt wat recht is.", "Spr 21:14": "Een gift in het verborgene houdt de toorn onder, en een geschenk in de schoot de sterke woede.", "Joh 6:70": "Jezus antwoordde hun: Heb Ik u niet twaalf uitgekozen? En één van u is een duivel.", "Ps 62:6-8": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Hab 2:5-13": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken. Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk! Zullen niet onvoorziens opstaan die u zullen bijten, en ontwaken die u zullen doen beven, en zult u hun niet tot buit worden?", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Zach 12:9": "En het zal op die dag gebeuren, dat Ik zal zoeken te verdelgen alle heidenvolken die tegen Jeruzalem aankomen.", "Neh 1:5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Job 20:11": "Zijn beenderen zullen vol zijn van zijn zonden uit zijn jeugd; die zullen met hem in het stof neerliggen.", "2 Kor 7:9-11": "Nu verblijd ik mij, niet omdat u bedroefd bent geweest, maar omdat u bedroefd bent geweest tot bekering; want u bent bedroefd geweest naar God, zodat u in geen ding schade van ons geleden hebt. Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood. Want zie, ditzelfde, dat u naar God bedroefd bent geworden, hoe grote naarstigheid heeft dat in u gewerkt? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt u uzelf bewezen rein te zijn in deze zaak.", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "Matt 24:30": "En dan zal in de hemel het teken van de Zoon des mensen verschijnen; en dan zullen alle geslachten van de aarde treuren, en zij zullen de Zoon des mensen zien komen op de wolken van de hemel, met grote kracht en heerlijkheid.", "Ex 33:18": "Toen zei hij: Toon mij nu Uw heerlijkheid!", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "Jer 33:25": "Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld;", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Jer 18:12": "Doch zij zeggen: Het is buiten hoop; maar wij zullen naar onze eigen gedachten wandelen, en wij zullen doen, ieder, wat zijn boze hart goeddunkt.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Jes 5:23": "Die de goddeloze rechtvaardigen om een geschenk, en de gerechtigheid van de rechtvaardigen van hen afwenden.", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "Ps 94:21": "Zij rotten samen tegen de ziel van de rechtvaardige, en zij veroordelen onschuldig bloed.", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "Hos 7:9": "Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid over hem verspreid, en hij merkt het niet.", "Ex 14:12": "Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Amos 7:16": "Nu dan, hoor het woord van de HEERE: U zegt: U zult niet profeteren tegen Israël, en niets uitspreken tegen het huis van Izak.", "Job 21:5": "Kijk mij aan, en word verbaasd, en leg de hand op de mond.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ps 18:2-4": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "2 Kor 6:4-10": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten, in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "Jes 46:9": "Denk aan de vorige dingen van oude tijden af, dat Ik God ben, en er is geen God meer, en er is niets gelijk Ik;", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Luk 19:14": "Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Ps 55:21": "Hij slaat zijn handen aan hen die vrede met Hem hadden; hij ontheiligt Zijn verbond.", "2 Kron 30:10": "Zo trokken de boodschappers van stad tot stad, door het land van Efraïm en Manasse, tot Zebulon toe; maar zij lachten hen uit, en bespotten hen.", "Jes 59:2-8": "Maar uw ongerechtigheden brengen een scheiding tussen u en uw God, en uw zonden verbergen Zijn aangezicht voor u, zodat Hij niet hoort. Want uw handen zijn met bloed bevlekt, en uw vingers met ongerechtigheid; uw lippen spreken valsheid, uw tong spreekt onrecht uit. Er is niemand die om gerechtigheid roept, en niemand die zich voor de waarheid in het gericht begeeft; zij vertrouwen op ijdelheid en spreken leugen; met moeite zijn zij zwanger, en zij baren ongerechtigheid.", "Ef 5:11": "En heb geen gemeenschap met de onvruchtbare werken van de duisternis, maar bestraf ze veeleer.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "2 Sam 12:23": "Maar nu is het dood, waarom zou ik nu vasten? Zal ik het nog kunnen terughalen? Ik zal wel naar hem toe gaan, maar hij zal niet naar mij terugkomen.", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "Ps 119:158": "Ik heb gezien degenen, die trouweloos handelen, en het verdroot mij, dat zij Uw woord niet onderhielden.", "Amos 3:10": "Want zij weten niet te doen wat recht is, spreekt de HEERE; zij die in hun paleizen schatten vergaren door geweld en verwoesting.", "Joh 7:19": "Heeft Mozes u niet de wet gegeven? En niemand van u doet de wet. Waarom probeert u Mij te doden?", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Ex 20:22": "Toen zei de HEERE tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: U hebt gezien dat Ik met u vanuit de hemel gesproken heb.", "Ps 132:8-10": "Sta op, HEERE, tot Uw rust, U en de ark van Uw sterkte! Dat Uw priesters bekleed worden met gerechtigheid, en dat Uw gunstgenoten juichen. Wend het gezicht van Uw gezalfde niet af, om Davids wil, Uw dienaar.", "Spr 13:12": "De uitgestelde hoop maakt het hart ziek; maar de begeerte die komt, is een boom des levens.", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "Job 7:20": "Heb ik gezondigd, wat zal ik U doen, o Mensenhoeder? Waarom hebt U mij tot een mikpunt voor Uzelf gesteld, dat ik mijzelf tot een last ben?", "Ps 134:3": "De HEERE zegent u uit Sion, Hij, Die de hemel en de aarde gemaakt heeft.", "Ps 55:13-15": "Want het is geen vijand die mij hoont, anders zou ik het hebben gedragen; het is mijn hater niet die zich tegen mij groot maakt, anders zou ik mij voor hem verborgen hebben. Maar u bent het, o mens, als van mijn eigen stand, mijn leidsman en mijn bekende! Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Spr 28:4": "Wie de wet verlaten, prijzen de goddelozen; maar wie de wet bewaren, gaan de strijd met hen aan.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Richt 5:11": "Van het gedruis van de schutters, tussen de plaatsen waar men water schept, spreekt men daar samen van de gerechtigheid van de HEERE, van de gerechtigheden, bewezen aan Zijn dorpen in Israël; toen ging het volk van de HEERE af naar de poorten.", "Hos 9:10": "Ik vond Israël als druiven in de woestijn, Ik zag uw vaders als de eerste vrucht aan de vijgenboom in haar begintijd; maar zij gingen naar Baäl-peor, en zonderden zich af tot die schande, en werden helemaal verfoeilijk, net als datgene wat zij liefhadden.", "Spr 19:13": "Een dwaze zoon is voor zijn vader een grote ellende; en de kijvingen van een vrouw zijn als een aanhoudend druppelen.", "Num 14:18": "De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht.", "Ex 34:9": "En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga dan nu de Heere in ons midden, want dit is een hardnekkig volk; maar vergeef onze ongerechtigheid en onze zonde, en neem ons aan tot een erfdeel!", "Ex 22:9": "Bij elke zaak van onrecht, of het nu gaat om een os, een ezel, klein vee, kleding, of om iets verlorens waarvan iemand zegt dat het van hem is, zal de zaak van beide partijen voor de rechters komen; wie de rechters schuldig verklaren, die moet het aan zijn naaste dubbel teruggeven.", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "Ps 141:5": "Laat de rechtvaardige mij slaan, het zal weldadigheid zijn; en laat hij mij bestraffen, het zal olie van het hoofd zijn, het zal mijn hoofd niet breken; want ook dan zal mijn gebed voor hen zijn in hun tegenspoeden.", "Rom 5:3-5": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt; En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop; En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Ezech 34:2-4": "Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet. De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Hand 6:10": "En zij konden niet opgewassen zijn tegen de wijsheid en de Geest, door Wie hij sprak.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Hos 9:8": "De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.", "Job 6:15": "Mijn broeders hebben trouweloos gehandeld als een beek; als de storting der beken gaan zij door;", "Jes 32:5": "De dwaas zal niet meer milddadig genoemd worden, en de gierige zal niet meer mild geheten worden.", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "Ps 96:13": "Voor het aangezicht van de HEERE; want Hij komt, want Hij komt, om de aarde te oordelen; Hij zal de wereld oordelen met gerechtigheid, en de volken met Zijn waarheid.", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "Spr 5:22": "De goddeloze zullen zijn eigen ongerechtigheden vangen, en met de banden van zijn zonden zal hij vastgehouden worden.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "Jes 45:10": "Wee hem die tegen zijn vader zegt: Wat verwekt u? en tegen de vrouw: Wat baart u?", "Ps 10:4-11": "De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is. Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg. Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Ezech 36:2": "Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden!", "Tit 3:3": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Matt 13:22": "En die in de doornen bezaaid is, dit is degene die het woord hoort; en de zorgen van deze wereld en de verleiding van de rijkdom verstikken het woord, en het wordt onvruchtbaar.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "2 Kron 30:18": "Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,", "Spr 21:27": "Het offer van de goddelozen is een gruwel; hoeveel te meer, als zij het met een schandelijk voornemen brengen!", "Jer 8:20": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost.", "Jes 59:12-15": "Want onze overtredingen zijn talrijk voor U, en onze zonden getuigen tegen ons; want onze overtredingen zijn bij ons, en onze ongerechtigheden kennen wij; het overtreden en het liegen tegen de HEERE, en het achterwaarts wijken van onze God; het spreken van onderdrukking en afval, het ontvangen en het uitspreken van valse woorden uit het hart. Daarom is het recht achterwaarts geweken, en de gerechtigheid staat ver weg; want de waarheid struikelt op de straat, en wat recht is, kan er niet ingaan.", "Jes 38:15": "Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel.", "Ef 1:15-19": "Daarom ook ik, nadat ik gehoord heb van het geloof in de Heere Jezus, dat onder u is, en de liefde tot al de heiligen, Houd niet op voor u te danken, en u te gedenken in mijn gebeden; Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Hebr 6:13-19": "Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren, en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken. En zo heeft hij, nadat hij geduldig volhard had, de belofte verkregen.", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "Matt 26:49": "En hij kwam meteen naar Jezus toe en zei: Wees gegroet, Rabbi! En hij kuste Hem.", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Neh 2:17": "Toen zei ik tegen hen: U ziet de ellende waarin wij zijn, dat Jeruzalem woest is, en haar poorten met vuur verbrand zijn; komt, laten wij Jeruzalems muur opbouwen, zodat wij niet langer een smaad zijn.", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "Mark 3:22": "En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit.", "Ps 43:1": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Est 4:16": "Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.", "Ezech 18:23": "Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "Jer 5:28": "Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "Kol 2:13": "En Hij heeft u, toen u dood was in de misdaden en in de onbesnedenheid van uw vlees, mede levend gemaakt met Hem, terwijl Hij u al uw misdaden vergaf;", "Ezech 33:30-32": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt. En zij komen tot u, zoals het volk gewoon is te komen, en zitten voor uw aangezicht als Mijn volk, en horen uw woorden, maar zij doen ze niet; want zij spreken lieve woorden met hun mond, maar hun hart gaat hun hebzucht na. En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "Job 8:13-15": "Zo zijn de wegen van allen die God vergeten; en de verwachting van de huichelaar zal vergaan. Van wie zijn hoop walgen zal; en zijn vertrouwen zal zijn als het huis van een spin. Hij zal op zijn huis leunen, maar het zal niet bestaan; hij zal zich eraan vasthouden, maar het zal niet staande blijven.", "Jes 60:19": "De zon zal voor u niet meer zijn tot een licht overdag, en tot een glans zal de maan u niet lichten; maar de HEERE zal u tot een eeuwig licht zijn, en uw God tot uw sierlijkheid.", "Job 31:33": "Als ik, net als Adam, mijn overtredingen bedekt heb, door eigenliefde mijn misdaad verbergende!", "Pred 4:14": "Want de een komt uit de gevangenis om koning te worden; terwijl ook iemand die in zijn koninkrijk geboren is, verarmt.", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Neh 4:6": "Wij bouwden dan verder aan de muur, zodat de hele muur tot de helft toe aaneengesloten werd; want het hart van het volk was erop gericht om te werken.", "Job 30:1": "Maar nu lachen zij die jonger zijn dan ik, om mij, van wie ik hun vaderen versmaad zou hebben, om ze bij de honden van mijn kudde te zetten.", "Job 39:37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Jes 66:19": "En Ik zal een teken bij hen zetten, en uit hen die ontkomen zijn, zal Ik zenden naar de heidenen, naar Tarsis, Pul en Lud, de boogschutters, naar Tubal en Javan, naar de ver gelegen eilanden, die Mijn faam niet gehoord en Mijn heerlijkheid niet gezien hebben; en zij zullen Mijn heerlijkheid onder de heidenen verkondigen.", "Mark 7:21-23": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden, diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid. Al deze boze dingen komen van binnenuit voort, en verontreinigen de mens.", "Pred 7:7": "Voorwaar, de onderdrukking zou wel een wijze dol maken; en het geschenk verdoemt het hart.", "Rom 2:2": "En wij weten dat het oordeel van God naar waarheid is, over hen die zulke dingen doen.", "Hand 8:4": "Zij dan nu, die verstrooid waren, trokken het land door en verkondigden het Woord.", "Micha 4:7": "En Ik zal haar die kreupel was maken tot een overblijfsel, en haar die ver weg verstoten was, tot een machtig volk; en de HEERE zal Koning over hen zijn op de berg Sion, van nu af aan tot in eeuwigheid.", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Matt 6:5": "En wanneer u bidt, wees dan niet zoals de geveinsden; want die bidden graag terwijl ze in de synagogen en op de hoeken van de straten staan, opdat zij door de mensen gezien worden. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.", "Jes 5:2": "En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht.", "2 Kron 32:15-19": "Laat Jehizkia u dan nu niet bedriegen, en laat hij u op deze manier niet opruien, en geloof hem niet; want geen god van enig volk en koninkrijk heeft zijn volk kunnen redden uit mijn hand en de hand van mijn vaderen; hoeveel te minder zal uw God u kunnen redden uit mijn hand? Daarbij spraken zijn dienaren nog meer tegen God, de HEERE, en tegen Zijn dienaar Jehizkia. Ook schreef hij brieven, om de HEERE, de God van Israël, te honen en om tegen Hem te spreken, en zei: Zoals de goden van de volken van de landen hun volk niet gered hebben uit mijn hand, zo zal de God van Jehizkia Zijn volk niet redden uit mijn hand.", "Fil 2:26": "Omdat hij zeer begerig was naar u allen, en zeer beangst was, omdat u had gehoord dat hij ziek was geweest.", "Hab 3:17-19": "Alhoewel de vijgenboom niet bloeien zal, en er geen vrucht aan de wijnstok zal zijn, dat het werk van de olijfboom liegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn; Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil. De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als die van de hinden, en Hij zal mij doen treden op mijn hoogten. Voor de koorleider, op mijn Neginoth.", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Ps 119:53": "Grote beroering heeft mij bevangen vanwege de goddelozen, die Uw wet verlaten.", "Num 11:29": "Maar Mozes zei tegen hem: Bent u ijverzuchtig voor mij? Och, was al het volk van de HEERE maar profeten, zodat de HEERE Zijn Geest over hen zou geven!", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Ps 141:8": "Doch op U zijn mijn ogen, HEERE, Heere; op U vertrouw ik, ontbloot mijn ziel niet.", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "Joh 8:34": "Jezus antwoordde hun: Voorwaar, voorwaar, Ik zeg u: Ieder die de zonde doet, is een dienstknecht van de zonde.", "1 Kon 8:20": "Zo heeft de HEERE Zijn woord bevestigd, dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op de troon van Israël, zoals de HEERE gesproken heeft; en ik heb een huis gebouwd voor de Naam van de HEERE, de God van Israël.", "Joël 2:17": "Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Ps 88:13": "Zullen Uw wonderen bekend worden in de duisternis, en Uw gerechtigheid in het land van de vergetelheid?", "Jes 37:10": "Zo moet u spreken tegen Hizkia, de koning van Juda: Laat uw God u niet bedriegen, op Wie u vertrouwt, door te zeggen: Jeruzalem zal niet in de hand van de koning van Assyrië gegeven worden.", "Hos 5:10": "De vorsten van Juda zijn geworden als zij die de grenzen verleggen; Ik zal Mijn verbolgenheid als water over hen uitgieten.", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "Deut 9:5": "Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft.", "Spr 13:19": "De begeerte die vervuld wordt, is zoet voor de ziel; maar het is de dwazen een gruwel om van het kwade af te wijken.", "Mark 12:38-40": "En Hij zei tegen hen in Zijn onderwijs: Pas op voor de Schriftgeleerden, die graag in lange kleren willen rondlopen, en gegroet willen worden op de markten; en de voorste plaatsen willen hebben in de synagogen, en de ereplaatsen bij de maaltijden; die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Spr 17:21": "Wie een dwaas voortbrengt, die zal hem tot droefheid zijn; en de vader van de dwaas zal zich niet verblijden.", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "Jes 40:25": "Bij wie dan zult u Mij vergelijken, aan wie zou Ik gelijk zijn? zegt de Heilige.", "Rom 6:17-22": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent; En vrijgemaakt van de zonde, bent u dienstknechten van de gerechtigheid geworden. Ik spreek op menselijke wijze, vanwege de zwakheid van uw vlees; want zoals u uw leden gesteld hebt om dienstbaar te zijn aan de onreinheid en de ongerechtigheid, tot ongerechtigheid, zo stel nu uw leden om dienstbaar te zijn aan de gerechtigheid, tot heiliging.", "Dan 9:9": "Bij de Heere, onze God, zijn de barmhartigheden en vergevingen, hoewel wij tegen Hem gerebelleerd hebben.", "Rom 6:17": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;", "Ps 119:114": "U bent mijn Schuilplaats en mijn Schild; op Uw Woord heb ik gehoopt.", "Jes 47:5-9": "Zit zwijgend, en ga in de duisternis, dochter van de Chaldeeën! Want u zult niet meer genoemd worden koningin van de koninkrijken. Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; toch bewees u hun geen barmhartigheid, ja, zelfs over de oude maakte u uw juk zeer zwaar. En u zei: Ik zal koningin zijn in eeuwigheid; tot nog toe hebt u deze dingen niet in uw hart genomen, u hebt aan het einde daarvan niet gedacht.", "Jes 57:10": "U bent moe geworden door uw lange reis, maar u zegt niet: Het is hopeloos; u hebt nieuwe kracht gevonden, daarom wordt u niet ziek.", "Ps 18:19": "Zij hadden mij bejegend ten dage van mijn ongeval; maar de HEERE was mij tot een Steunsel.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "1 Kron 29:19": "En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "Ps 41:11-13": "Maar U, o HEERE! wees mij genadig, en richt mij op; en ik zal het hun vergelden. Hierbij weet ik, dat U lust aan mij hebt, dat mijn vijand over mij niet zal juichen. Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Matt 22:12": "En hij zei tegen hem: Vriend! Hoe bent u hier binnengekomen zonder een bruiloftskleed aan te hebben? En hij verstomde.", "Spr 11:26": "Wie koren inhoudt, hem vervloekt het volk; maar zegening zal zijn over het hoofd van de verkoper.", "1 Tess 3:1": "Daarom hebben wij, omdat we het verlangen niet langer konden verdragen, het goed gevonden om alleen in Athene achtergelaten te worden;", "Ps 73:28": "Maar wat mij aangaat, het is mij goed om dicht bij God te zijn; ik stel mijn vertrouwen op de Heere HEERE, om al Uw werken te vertellen.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Mark 6:6": "En Hij verwonderde Zich over hun ongeloof, en trok rond door de dorpen daar in de omgeving, terwijl Hij onderwees.", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Fil 4:3": "En ik bid ook u, mijn oprechte metgezel, wees deze vrouwen behulpzaam, die met mij gestreden hebben in het Evangelie, ook met Clemens, en de andere medearbeiders van mij, van wie de namen in het boek van het leven staan.", "Ex 16:7": "En morgen zult u de heerlijkheid van de HEERE zien, omdat Hij uw gemor tegen de HEERE gehoord heeft; want wat zijn wij, dat u tegen ons mort?", "Rom 11:32": "Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Ex 2:25": "En God zag de kinderen van Israël aan, en God kende hen.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Num 14:9": "Wees alleen niet opstandig tegen de HEERE! En vrees het volk van dit land niet; want zij zijn ons brood! Hun bescherming is van hen geweken, en de HEERE is met ons; vrees hen niet!", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Hand 13:32": "En wij verkondigen u de belofte, die aan de vaderen gedaan is,", "Hebr 11:16-39": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt. Door het geloof heeft Abraham, toen hij beproefd werd, Izak geofferd, en hij die de beloften ontvangen had, heeft zijn enige zoon geofferd, (tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Ps 119:137": "Tsade. HEERE! U bent rechtvaardig, en elk van Uw oordelen is recht.", "Mal 1:5": "En uw ogen zullen het zien, en u zult zeggen: De HEERE is groot, tot buiten het gebied van Israël!", "Job 34:33": "Zal het van u zijn, hoe Hij iets vergelden zal, omdat u Hem versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.", "Jer 33:8": "En Ik zal hen reinigen van al hun ongerechtigheid, waarmee zij tegen Mij gezondigd hebben; en Ik zal al hun ongerechtigheden vergeven, waarmee zij tegen Mij gezondigd en waarmee zij tegen Mij overtreden hebben.", "Ps 90:1": "Een gebed van Mozes, de man van God. Heere! U bent ons geweest een Toevlucht van geslacht tot geslacht.", "Ps 92:3": "Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten;", "Jes 48:2": "Ja, van de heilige stad worden zij genoemd, en zij steunen op de God van Israël; HEERE van de heerscharen is Zijn Naam.", "2 Tim 2:7": "Bedenk wat ik zeg; en de Heere geeft u inzicht in alle dingen.", "2 Petr 2:10": "maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren;", "Ps 38:4": "Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "Mark 14:55-65": "En de overpriesters, en de hele Raad, zochten getuigenis tegen Jezus, om Hem te doden, en vonden het niet. Want velen getuigden vals tegen Hem, maar de getuigenissen kwamen niet overeen. En sommigen stonden op en getuigden vals tegen Hem, en zeiden:", "Nahum 2:1": "De verstrooier trekt tegen uw aangezicht op; bewaar de vesting; bezie de weg; sterk de lenden, versterk de kracht zeer.", "Ex 15:14-16": "De volken hebben het gehoord, zij zullen sidderen; angst heeft de inwoners van Palestina bevangen. Dan zullen de vorsten van Edom verbaasd zijn; beving zal de machtigen van de Moabieten bevangen; alle inwoners van Kanaän zullen wegsmelten! Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Spr 31:31": "Thau. Geef haar van de vrucht van haar handen, en laat haar werken haar prijzen in de poorten.", "Ps 130:4": "Maar bij U is vergeving, opdat U gevreesd wordt.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Ps 89:35": "Ik zal Mijn verbond niet ontheiligen, en wat uit Mijn lippen gegaan is, zal Ik niet veranderen.", "Jes 17:6": "Toch zal er een nalezing in overblijven, zoals bij het afschudden van de olijfboom, twee of drie bezien in de top van de opperste twijg, en vier of vijf aan zijn vruchtbare takken, spreekt de HEERE, de God van Israël.", "Neh 5:7": "En mijn hart beraadslaagde in mij; daarna berispte ik de edelen en de overheden, en zei tegen hen: U vordert een last, ieder van zijn broeder. Vervolgens riep ik een grote vergadering tegen hen bijeen.", "Ps 143:2": "En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn.", "Obadja 1:7": "Al uw bondgenoten hebben u tot aan de grens weggeleid; uw vredegenoten hebben u bedrogen, zij hebben de overhand op u gekregen; zij die uw brood eten, zullen een valstrik onder u zetten, er is geen verstand in hem.", "Ezech 9:8": "Het gebeurde nu, toen zij hen geslagen hadden en ik overgebleven was, dat ik op mijn aangezicht viel, en riep, en zei: Ach, Heere HEERE, zult U het hele overblijfsel van Israël verderven, door Uw grimmigheid uit te gieten over Jeruzalem?", "Job 20:4-18": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft, Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Ps 92:2": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste!", "Ps 119:89": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.", "Joh 7:24": "Oordeel niet naar het aanzien, maar oordeel een rechtvaardig oordeel.", "1 Sam 2:25": "Wanneer een mens tegen een mens zondigt, zullen de goden hem oordelen; maar wanneer een mens tegen de HEERE zondigt, wie zal voor hem bidden? Maar zij luisterden niet naar de stem van hun vader, want de HEERE wilde hen doden.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Luk 1:38": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "2 Kon 20:19": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE, dat u gesproken hebt, is goed. Ook zei hij: Zou het niet goed zijn, als er vrede en waarheid in mijn dagen zal zijn?", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Jak 3:2": "Want wij struikelen allen in veel dingen. Als iemand in woorden niet struikelt, die is een volmaakt man, in staat om ook het hele lichaam in toom te houden.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "Ps 34:6": "He. Vau. Zij hebben op Hem gezien, ja, Hem toegestroomd als water; en hun gezichten zijn niet rood van schaamte geworden.", "Spr 4:16": "Want zij slapen niet, als zij geen kwaad gedaan hebben; en hun slaap wordt weggenomen, als zij niemand hebben doen struikelen.", "Dan 9:24": "Zeventig weken zijn bestemd over uw volk en over uw heilige stad, om de overtreding te sluiten, en om de zonden te verzegelen, en om de ongerechtigheid te verzoenen, en om een eeuwige gerechtigheid aan te brengen, en om het visioen en de profeet te verzegelen, en om het allerheiligst te zalven.", "Ps 118:1-4": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat Israël nu zeggen, dat Zijn goedertierenheid voor eeuwig is. Laat het huis van Aäron nu zeggen, dat Zijn goedertierenheid voor eeuwig is.", "Klaagl 3:39-42": "Mem. Wat klaagt dan een levend mens? Ieder klaagt vanwege zijn zonden. Nun. Laat ons onze wegen onderzoeken en doorzoeken, en laat ons terugkeren tot de HEERE. Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Ps 12:2": "Behoud, o HEERE; want de goedertierene ontbreekt, want de getrouwen zijn weinig geworden onder de mensenkinderen.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Spr 4:17": "Want zij eten brood van goddeloosheid, en drinken wijn van enkel geweld.", "Hand 4:2": "Zeer ontevreden, omdat zij het volk leerden en in Jezus de opstanding uit de doden verkondigden.", "Job 15:33": "Men zal zijn onrijpe druiven afrukken, als van een wijnstok, en zijn bloeisel afwerpen, als van een olijfboom.", "Ezech 20:39": "En u, o huis van Israël, zo zegt de Heere HEERE: Gaat heen, dient ieder zijn drekgoden, ook hierna, omdat u naar Mij niet wilt horen; maar ontheiligt niet meer Mijn heilige Naam, met uw giften en met uw drekgoden.", "Gen 3:1": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof?", "Richt 10:16": "En zij deden de vreemde goden uit hun midden weg, en dienden de HEERE. Toen werd Zijn ziel verdrietig over de ellende van Israël.", "Matt 12:7": "Maar als u geweten had wat dit betekent: Ik wil barmhartigheid en geen offerande, dan zou u de onschuldigen niet veroordeeld hebben.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Richt 5:31": "Zo moeten omkomen al Uw vijanden, o HEERE! Die Hem daarentegen liefhebben, moeten zijn, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren.", "Ps 86:5": "Want Gij, Heere! zijt goed, en vergeeft graag, en van grote goedertierenheid voor allen die U aanroepen.", "Ezech 11:20": "Opdat zij wandelen in Mijn inzettingen, en Mijn rechten bewaren en die doen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Ezech 33:11": "Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël?", "Spr 14:6": "De spotter zoekt wijsheid, en vindt niets; maar de kennis is voor de verstandige licht.", "1 Kor 16:10": "Als Timotheüs nu komt, ziet erop dat hij zonder vrees bij u is; want hij doet het werk van de Heere, zoals ik ook.", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Spr 24:30": "Ik ging voorbij de akker van een luiaard, en voorbij de wijngaard van een verstandeloos mens;", "1 Kon 8:44": "Wanneer Uw volk in de oorlog tegen zijn vijand uittrekken zal, langs de weg die U hen zenden zult, en tot de HEERE bidden zullen in de richting van deze stad, die U verkoren hebt, en van dit huis, dat ik voor Uw Naam gebouwd heb;", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Ex 6:3": "En ook heb Ik Mijn verbond met hen opgericht, dat Ik hun het land Kanaän geven zou, het land van hun vreemdelingschap, waarin zij vreemdelingen zijn geweest.", "Jak 1:8": "Een dubbelhartig man is onstandvastig in al zijn wegen.", "Matt 24:29": "En meteen na de verdrukking van die dagen zal de zon verduisterd worden, en de maan zal haar licht niet geven, en de sterren zullen van de hemel vallen, en de krachten van de hemelen zullen beven.", "Mal 1:6-14": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam? U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk. Want als u iets blinds aanbrengt om te offeren, is dat bij u niet kwaad; en als u iets kreupels of iets kranks aanbrengt, is dat niet kwaad! Breng dat toch aan uw vorst; zal hij welgevallen aan u hebben? of zal hij u gunstig ontvangen? zegt de HEERE van de heerscharen.", "Deut 28:65-67": "Daarbij zult u onder die volken geen rust vinden, en uw voetzool zal geen rust hebben; want de HEERE zal u daar een bevend hart geven, en bezwijking van de ogen, en kwelling van de ziel. En uw leven zal voor u onzeker hangen; en u zult nacht en dag angst hebben, en u zult niet zeker zijn van uw leven. Des morgens zult u zeggen: Was het maar avond; en des avonds zult u zeggen: Was het maar morgen; vanwege de schrik van uw hart, waarmee u geschrokken zult zijn, en vanwege wat uw ogen te zien krijgen.", "2 Sam 16:12": "Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Ps 72:2": "Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "2 Sam 16:2": "En de koning zei tegen Ziba: Wat wilt u daarmee? En Ziba zei: De ezels zijn voor het huis van de koning, om op te rijden, en het brood en de zomervruchten om te eten voor de knechten; en de wijn, opdat wie moede zijn in de woestijn, kunnen drinken.", "Hebr 11:13": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren.", "Ps 56:4": "Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "1 Tess 2:5": "Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige!", "Spr 29:4": "Een koning houdt het land staande door recht; maar wie tot geschenken geneigd is, verstoort het.", "Ps 51:3-6": "Wees mij genadig, o God! naar Uw goedertierenheid; delg mijn overtreding uit, naar de grootheid van Uw barmhartigheden. Was mij goed van mijn ongerechtigheid, en reinig mij van mijn zonde. Want ik ken mijn overtredingen, en mijn zonde staat mij steeds voor ogen.", "Ps 80:16": "en de stam die Uw rechterhand geplant heeft, en dat om de zoon die U voor Uzelf gesterkt hebt!", "Luk 12:33": "Verkoop wat u hebt, en geef aalmoezen. Maak uzelf beurzen die niet verslijten, een schat die niet afneemt, in de hemelen, waar de dief niet bijkomt en de mot niet verteert.", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "Jer 17:1": "De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren;", "Rom 2:1": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.", "Luk 4:23": "En Hij zei tegen hen: U zult zonder twijfel dit spreekwoord tegen Mij zeggen: Dokter, genees Uzelf; al wat wij gehoord hebben dat in Kapernaüm gebeurd is, doe dat ook hier in Uw vaderland.", "Jes 2:5": "Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "Matt 22:1-14": "En Jezus antwoordde en sprak opnieuw in gelijkenissen tot hen, en zei: Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had; En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen.", "Jes 66:20": "En zij zullen al uw broeders uit alle heidenen naar de HEERE brengen als spijsoffer, op paarden, en op wagens, en op draagstoelen, en op muildieren, en op snelle lopers, naar Mijn heilige berg toe, naar Jeruzalem, zegt de HEERE, zoals de kinderen van Israël het spijsoffer in een rein vat brengen naar het huis van de HEERE.", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "2 Tess 3:5": "Doch de Heere richte uw harten op de liefde van God, en op de lijdzaamheid van Christus.", "Nahum 3:19": "Er is geen genezing voor uw breuk, uw plaag is smartelijk; allen die het gerucht van u horen, zullen de handen over u klappen; want over wie is uw boosheid niet voortdurend gegaan?", "Pred 12:9": "En verder, omdat de prediker wijs geweest is, leerde hij het volk nog kennis, en lette hij op, en onderzocht hij; hij bracht veel spreuken in orde.", "Jer 7:8-10": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Matt 6:23": "maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!", "Jer 17:11": "Zoals een veldhoen eieren verzamelt, maar ze niet uitbroedt, zo is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.", "Joh 18:11": "Jezus dan zei tegen Petrus: Steek uw zwaard in de schede. Zou Ik de drinkbeker die de Vader Mij gegeven heeft, niet drinken?", "Ps 31:2": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Ps 103:8-14": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Hand 18:24-28": "En een zekere Jood, met de naam Apollos, van geboorte een Alexandriër, een welsprekend man, kwam naar Efeze, machtig zoals hij was in de Schriften. Deze was onderwezen in de weg van de Heere; en omdat hij vurig was van geest, sprak en leerde hij nauwkeurig de zaken van de Heere, al kende hij alleen de doop van Johannes. En hij begon vrijmoedig te spreken in de synagoge. En toen Aquila en Priscilla hem gehoord hadden, namen zij hem tot zich, en legden hem de weg van God nauwkeuriger uit.", "Jer 5:2": "En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Spr 15:27": "Wie hebzucht najaagt, brengt zijn huis in beroering; maar wie geschenken haat, zal leven.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Ex 22:27": "want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Rom 15:29": "En ik weet dat ik, wanneer ik tot u kom, met volle zegen van het Evangelie van Christus komen zal.", "Jer 51:5": "Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.", "Mark 5:20": "En hij ging weg, en begon in het gebied van Dekapolis te verkondigen wat grote dingen Jezus aan hem gedaan had; en zij verwonderden zich allen.", "Job 17:13-16": "Als ik wacht, het graf zal mijn huis wezen; in de duisternis zal ik mijn bed spreiden. Tot de groeve roep ik: U bent mijn vader! Tot het gewormte: Mijn moeder, en mijn zuster! Waar zou dan nu mijn verwachting wezen? Ja, mijn verwachting, wie zal ze aanschouwen?", "Jer 3:18": "In die dagen zal het huis van Juda naar het huis van Israël gaan; en zij zullen samen komen uit het land van het noorden, naar het land dat Ik uw vaderen als erfenis gegeven heb.", "Luk 12:2": "Er is niets bedekt, dat niet onthuld zal worden, en niets verborgen, dat niet bekend zal worden.", "Spr 10:1": "De spreuken van Salomo. Een wijze zoon verblijdt de vader; maar een dwaze zoon is het verdriet van zijn moeder.", "Num 16:41": "Maar de volgende dag morde de hele vergadering van de kinderen van Israël tegen Mozes en tegen Aäron, en zei: U hebt het volk van de HEERE gedood!", "Zach 14:5": "Dan zult u vluchten door de vallei van Mijn bergen (want deze vallei van de bergen zal reiken tot Azal), en u zult vluchten, zoals u vluchtte voor de aardbeving in de dagen van Uzzia, de koning van Juda; dan zal de HEERE, mijn God, komen, en al de heiligen met U, o Heere!", "Jes 1:17": "Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.", "Jer 7:17": "Ziet u niet wat zij doen in de steden van Juda en op de straten van Jeruzalem?", "Mark 13:12": "En de ene broer zal de andere overleveren tot de dood, en de vader het kind; en de kinderen zullen opstaan tegen de ouders, en hen doden.", "1 Tess 3:10": "Nacht en dag zeer overvloedig biddend, om uw gezicht te mogen zien en te volmaken wat er aan uw geloof ontbreekt.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Gal 4:22-31": "Want er is geschreven dat Abraham twee zonen had, één uit de dienstmaagd, en één uit de vrije. Maar hij die uit de dienstmaagd was, is naar het vlees geboren; maar hij die uit de vrije was, door de belofte; dit zijn dingen die een andere betekenis hebben; want dit zijn de twee verbonden: het ene, van de berg Sinaï, dat kinderen baart tot dienstbaarheid, dat is Hagar;", "Ps 89:2": "Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht.", "Job 1:22": "In dit alles zondigde Job niet, en schreef God niets van het ongerijmd toe.", "Ps 41:13": "Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "Ps 71:17": "O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.", "Joh 8:26": "Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld.", "Joh 17:16": "Zij zijn niet van de wereld, zoals Ik niet van de wereld ben.", "Luk 13:26": "Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Ps 31:23": "Ik zei wel in mijn haast: Ik ben afgesneden van voor Uw ogen; maar toch hoorde U de stem van mijn smekingen, toen ik tot U riep.", "2 Sam 24:10": "En het hart van David sloeg hem, nadat hij het volk geteld had; en David zei tegen de HEERE: Ik heb zwaar gezondigd in wat ik gedaan heb; maar neem nu toch, o HEERE, de misdaad van uw knecht weg, want ik heb heel dwaas gedaan.", "Joz 24:14-16": "En nu, vrees de HEERE, en dien Hem in oprechtheid en in waarheid; en doe de goden weg die uw vaders gediend hebben, aan de overkant van de rivier, en in Egypte; en dien de HEERE. Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen! Toen antwoordde het volk en zei: Het zij verre van ons, dat wij de HEERE zouden verlaten om andere goden te dienen.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ps 3:7": "Ik zal niet bang zijn voor tienduizenden van het volk, die zich rondom tegen mij opstellen.", "Spr 26:23-26": "Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim. Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Ps 54:6": "Zie, God is mij een Helper; de Heere is onder hen die mijn ziel ondersteunen.", "Ezech 35:15": "Zoals u zich verblijd hebt over de erfenis van het huis van Israël, omdat die verwoest is, zo zal Ik aan u doen; het gebergte van Seir, en heel Edom, zal helemaal een verwoesting worden; en zij zullen weten, dat Ik de HEERE ben.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Ps 9:20": "Sta op, HEERE, laat de mens zich niet versterken; laat de heidenen voor Uw aangezicht geoordeeld worden.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Ps 85:5": "Breng ons terug, o God van ons heil! En maak een einde aan Uw toorn over ons.", "Jer 29:10": "Want zo zegt de HEERE: Zeker, als er zeventig jaren te Babel vervuld zullen zijn, zal Ik u bezoeken, en Ik zal Mijn goede woord over u waarmaken, door u terug te brengen naar deze plaats.", "Matt 18:11": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Dan 11:36": "En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren.", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "Jes 64:8-12": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen. HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting.", "Luk 15:23": "en breng het gemeste kalf, en slacht het; en laten wij eten en vrolijk zijn.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Ps 40:18": "Ik ben wel ellendig en no
