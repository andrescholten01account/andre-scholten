"Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Ai mij! Want ik ben als wanneer de zomervruchten zijn ingezameld; als wanneer de nalezingen in de wijnoogst gebeurd zijn; er is geen druif om te eten; mijn ziel begeert vroegrijpe vrucht.","2":"De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet.","3":"Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.","4":"De beste van hen is als een doorn; de oprechtste is scherper dan een doornheg; de dag van uw wachters, uw bezoeking, is gekomen; nu zal hun verwarring zijn.","5":"Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.","6":"Want de zoon veracht de vader, de dochter staat op tegen haar moeder, de schoondochter tegen haar schoonmoeder; iemands vijanden zijn zijn huisgenoten.","7":"Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen.","8":"Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn.","9":"Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.","10":"En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.","11":"Ten dage dat Hij uw muren zal herbouwen, te dien dage zal het besluit ver heengaan.","12":"Te dien dage zal het ook tot u komen, van Assur af, zelfs tot de vaste steden toe; en van de vestingen tot aan de rivier, en van zee tot zee, en van gebergte tot gebergte.","13":"Maar dit land zal worden tot een verwoesting, vanwege zijn inwoners, vanwege de vrucht van hun handelingen.","14":"Weid Ú dan Uw volk met Uw staf, de kudde van Uw erfenis, die alleen woont, in het woud, midden in een vruchtbaar land; laat ze weiden in Basan en Gilead, als in de dagen van ouds.","15":"Ik zal haar wonderen laten zien, als in de dagen toen u uit Egypteland trok.","16":"De heidenen zullen het zien, en beschaamd zijn, vanwege al hun macht; zij zullen de hand op de mond leggen; hun oren zullen doof worden.","17":"Zij zullen het stof lekken, als de slang; als kruipende dieren van de aarde, zullen zij sidderend tevoorschijn komen uit hun schuilhoeken; zij zullen met vervaardheid komen tot de HEERE, onze God, en zullen voor U vrezen.","18":"Wie is een God gelijk U, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel van Zijn erfenis voorbijgaat? Hij houdt Zijn toorn niet voor eeuwig vast; want Hij heeft lust aan goedertierenheid.","19":"Hij zal Zich weer over ons ontfermen; Hij zal onze ongerechtigheden dempen; ja, U zult al hun zonden in de diepten van de zee werpen.","20":"U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt."},"SV":{"1":"Ai mij! want ik ben, als wanneer de zomervruchten zijn ingezameld; als wanneer de nalezingen in den wijnoogst geschied zijn; er is geen druif om te eten; mijn ziel begeert vroegrijpe vrucht.","2":"De goedertierene is vergaan uit het land, en er is niemand oprecht onder de mensen; zij loeren altemaal op bloed, zij jagen, een iegelijk zijn broeder, *met* een jachtgaren.","3":"Om *met* beide handen wel dapper kwaad te doen, zo eist de vorst, en de rechter *oordeelt* om vergelding; en de grote spreekt de verderving zijner ziel, en zij draaien ze dicht ineen.","4":"De beste van hen is als een doorn; de oprechtste is *scherper* dan een doornheg; de dag uwer wachters, uw bezoeking, is gekomen; nu zal hunlieder verwarring wezen.","5":"Gelooft een vriend niet, vertrouwt niet op een voornaamsten vriend; bewaar de deuren uws monds voor haar, die in uw schoot ligt.","6":"Want de zoon veracht den vader, de dochter staat op tegen haar moeder, de schoondochter tegen haar schoonmoeder; eens mans vijanden zijn zijn huisgenoten.","7":"Maar ik zal uitzien naar den HEERE, ik zal wachten op den God mijns heils; mijn God zal mij horen.","8":"Verblijd u niet over mij, o mijn vijandin! wanneer ik gevallen ben, zal ik weder opstaan; wanneer ik in duisternis zal gezeten zijn, zal de HEERE mij een licht zijn.","9":"Ik zal des HEEREN gramschap dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twiste, en mijn recht uitvoere; Hij zal mij uitbrengen aan het licht; ik zal *mijn* *lust* zien aan Zijn gerechtigheid.","10":"En mijn vijandin zal *het* zien, en schaamte zal haar bedekken; die tot mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen aan haar zien; nu zal zij worden tot vertreding, als slijk der straten.","11":"Ten dage als Hij uw muren zal herbouwen, te dien dage zal het besluit verre heengaan.","12":"Te dien dage zal het ook komen tot u toe, van Assur af, zelfs *tot* de vaste steden *toe*; en van de vestingen tot aan de rivier, en van zee *tot* zee, en *van* gebergte *tot* gebergte.","13":"Maar dit land zal worden tot een verwoesting, zijner inwoners halve, vanwege de vrucht hunner handelingen.","14":"Gij *dan*, weid Uw volk met Uw staf, de kudde Uwer erfenis, die alleen woont, *in* het woud, in het midden van een vruchtbaar land; laat ze weiden *in* Basan en Gilead, als in de dagen van ouds.","15":"Ik zal haar wonderen doen zien, als in de dagen, toen gij uit Egypteland uittoogt.","16":"De heidenen zullen het zien, en beschaamd zijn, vanwege al hun macht; zij zullen de hand op den mond leggen; hun oren zullen doof worden.","17":"Zij zullen het stof lekken, als de slang; als kruipende dieren der aarde, zullen zij zich beroeren uit hun sloten; zij zullen met vervaardheid komen tot den HEERE, onzen God, en zullen voor U vrezen.","18":"Wie is een God gelijk Gij, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel Zijner erfenis voorbij gaat? Hij houdt Zijn toorn niet in eeuwigheid; want Hij heeft lust aan goedertierenheid.","19":"Hij zal Zich onzer weder ontfermen; Hij zal onze ongerechtigheden dempen; ja, Gij zult al hun zonden in de diepten der zee werpen.","20":"Gij zult Jakob de trouw, Abraham de goedertierenheid geven, die Gij onzen vaderen van oude dagen af gezworen hebt."},"KJV":{"1":"Woe is me! for I am as when they have gathered the summer fruits, as the grapegleanings of the vintage: *there is* no cluster to eat: my soul desired the firstripe fruit.","2":"The good *man* is perished out of the earth: and *there is* none upright among men: they all lie in wait for blood; they hunt every man his brother with a net.","3":"That they may do evil with both hands earnestly, the prince asketh, and the judge *asketh* for a reward; and the great *man*, he uttereth his mischievous desire: so they wrap it up.","4":"The best of them *is* as a brier: the most upright *is sharper* than a thorn hedge: the day of thy watchmen *and* thy visitation cometh; now shall be their perplexity.","5":"Trust ye not in a friend, put ye not confidence in a guide: keep the doors of thy mouth from her that lieth in thy bosom.","6":"For the son dishonoureth the father, the daughter riseth up against her mother, the daughter in law against her mother in law; a man's enemies *are* the men of his own house.","7":"Therefore I will look unto the LORD; I will wait for the God of my salvation: my God will hear","8":"Rejoice not against me, O mine enemy: when I fall, I shall arise; when I sit in darkness, the LORD *shall be* a light","9":"I will bear the indignation of the LORD, because I have sinned against him, until he plead my cause, and execute judgment for me: he will bring me forth to the light, *and* I shall behold his righteousness.","10":"Then *she that is* mine enemy shall see *it*, and shame shall cover her which said unto me, Where is the LORD thy God? mine eyes shall behold her: now shall she be trodden down as the mire of the streets.","11":"*In* the day that thy walls are to be built, *in* that day shall the decree be far removed.","12":"*In* that day *also* he shall come even to thee from Assyria, and *from* the fortified cities, and from the fortress even to the river, and from sea to sea, and *from* mountain to mountain.","13":"Notwithstanding the land shall be desolate because of them that dwell therein, for the fruit of their doings.","14":"Feed thy people with thy rod, the flock of thine heritage, which dwell solitarily *in* the wood, in the midst of Carmel: let them feed *in* Bashan and Gilead, as in the days of old.","15":"According to the days of thy coming out of the land of Egypt will I shew unto him marvellous","16":"The nations shall see and be confounded at all their might: they shall lay *their* hand upon *their* mouth, their ears shall be deaf.","17":"They shall lick the dust like a serpent, they shall move out of their holes like worms of the earth: they shall be afraid of the LORD our God, and shall fear","18":"Who *is* a God like unto thee, that pardoneth iniquity, and passeth by the transgression of the remnant of his heritage? he retaineth not his anger for ever, because he delighteth *in* mercy.","19":"He will turn again, he will have compassion upon us; he will subdue our iniquities; and thou wilt cast all their sins into the depths of the sea.","20":"Thou wilt perform the truth to Jacob, *and* the mercy to Abraham, which thou hast sworn unto our fathers from the days of old."}},"tsk":{"1":[{"kopje":"Ai","refs":["Ps 120:5","Jes 6:5","Jes 24:16","Jer 4:31","Jer 15:10","Jer 45:3"]},{"kopje":"als","refs":["Jes 17:6","Jes 24:13"]},{"kopje":"begeert","refs":["Jes 28:4","Hos 9:10"]}],"2":[{"kopje":"is verdwenen","refs":["Ps 12:2","Ps 14:1-3","Jes 57:1","Rom 3:10-18"]},{"kopje":"zij allemaal","refs":["Spr 1:11","Spr 12:6","Jes 59:7","Jer 5:16"]},{"kopje":"jagen","refs":["1 Sam 24:12","1 Sam 26:20","Ps 57:7","Jer 5:26","Jer 16:16","Klaagl 4:18","Hab 1:15-17"]}],"3":[{"kopje":"doen","refs":["Spr 4:16","Spr 4:17","Jer 3:5","Ezech 22:6"]},{"kopje":"de vorst","refs":["Micha 3:11","Jes 1:23","Jer 8:10","Ezech 22:27","Hos 4:18","Amos 5:12","Matt 26:15"]},{"kopje":"de grote","refs":["1 Kon 21:9-14"]},{"kopje":"draaien","refs":["Jes 26:21","Luk 12:1","Luk 12:2","1 Kor 4:5"]}],"4":[{"kopje":"de dag","refs":["Ezech 12:23","Ezech 12:24","Hos 9:7","Hos 9:8","Amos 8:2"]},{"kopje":"uw","refs":["Jes 10:3","Jer 8:12","Jer 10:15"]},{"kopje":"nu","refs":["Jes 22:5","Luk 21:25"]}],"5":[{"kopje":"vertrouw niet op","refs":["Job 6:14","Job 6:15","Ps 118:8","Ps 118:9","Jer 9:4","Matt 10:16"]},{"kopje":"bewaar","refs":["Richt 16:5-20"]}],"6":[{"kopje":"zoon","refs":["Gen 9:22-24","Gen 49:4","2 Sam 15:10-12","2 Sam 16:11","2 Sam 16:21-23","Spr 30:11","Spr 30:17","Ezech 22:7","Matt 10:21","Matt 10:35","Matt 10:36","Luk 12:53","Luk 21:16","2 Tim 3:2","2 Tim 3:3"]},{"kopje":"iemands","refs":["Ps 41:10","Ps 55:13-15","Jer 12:6","Jer 20:10","Obadja 1:7","Matt 26:23","Matt 26:49","Matt 26:50","Joh melingen der zomervruchten, [of des zomers] en als de nalezingen van den wijnoogst; dat is, het gaat mij als een reiziger, die na den oogst geen rijpe vruchten vindt om zich te verkwikken, dat hem zeer verdrietig valt; alzo [wil de profeet zeggen] verdriet het mij ten hoogste, dat ik niets goeds onder het volk zie of verneem, gelijk in het volgende verklaard wordt. Verg. hiermede Deu 32:32 ; Psa 12:2 , Psa 12:8 , en Psa 14:2-3 ; Isa 24:13 ; Jer 5:1 ; Eze 22:30 ; Hos 11:7 , enz."},{"catchword":"druif om te eten;","tekst":"Of, tros van druiven, gelijk Num 13:23-24 ."},{"catchword":"mijn ziel begeert","tekst":"Anders: [noch] vroegrijpe vrucht, [die] mijne ziel begeert."},{"catchword":"vroegrijpe vrucht","tekst":"Die zeer aangenaam is en waarnaar men zeer verlangt, en verblijd is als men ze vindt. Zie Isa 28:4 ; Jer 24:2 ; Hos 9:10 met de aantekening."}],"2":[{"catchword":"goedertierene is vergaan","tekst":"Verg. Psa 12:2 ; Isa 57:1 met de aantekening aldaar."},{"catchword":"uit het land,","tekst":"Anders: van de aarde."},{"catchword":"oprecht onder de mensen;","tekst":"Hebr. recht, of richting. Zie Psa 7:11 . Hetzelfde woord staat ook in vs.4."},{"catchword":"bloed,","tekst":"Hber. bloeden; dat is, doodslag en moordenarij. Zie Gen 4:10 , en Gen 37:26 ."},{"catchword":"jachtgaren","tekst":"Om hem met handelingen in het net te krijgen, te vangen, en als een roof te verslinden. Verg. Psa 10:8-11 , en Eze 19:3 , Eze 19:6 , enz."}],"3":[{"catchword":"Om met beide handen wel dapper kwaad te doen,","tekst":"Of, de handen zijn tot kwaad, om goed te doen, [dat is, iemands zaak te bevorderen] eist de vorst [te weten, geschenken] en de rechter [te weten, eist] tot vergelding. Of, ten kwade zijn de handen zeer kloek, enz. Of, opdat beide handen, enz. kwaad mogen doen. Of, beide handen [zijn er op uit, of zijn bezig], om dergelijk, [of] dapperlijk, meesterlijk, kunstiglijk kwaad te doen, dat is te beschadigen. Zij zijn met al hun verstand leggen zij zich daarop. Van het Hebr. woord, dat hier is overgezet wel dapper, zie Jon 4:4 ."},{"catchword":"eist de vorst,","tekst":"Te weten, giften, geschenken. Verg. Hos 4:18 ."},{"catchword":"vergelding;","tekst":"Dat is, om geschenken."},{"catchword":"grote spreekt","tekst":"Zie 2Ki 25:9 ."},{"catchword":"verderving","tekst":"Dat is, hij durft wel onbeschaamd spreken wat verdriet, schade en jammer hij voorheeft anderen aan te doen; of hetgeen waardoor hij zijn eigen ziel in het verderf brengt."},{"catchword":"ziel,","tekst":"Dat is, waar bij lust of begeerte toe heeft, wat hem slechts lust dat durft hij zeggen, bedenken en doen. Zie Psa 27:12 , en verg. Mic 2:2 ."},{"catchword":"draaien ze dicht ineen","tekst":"Te weten, de schenderij. Gelijk men verscheidene kleine koorden of zelen tezamen draait om een dik touw daarvan te maken, alzo draaien zij hun schendige praktijken met elkander vast en dicht ineen, samenspannende met elkander, en zich verbindende, sterkende, om zonder fout hunne boosheid uit te werken. Verg. Ecc 4:12 ; Psa 129:4 ; Isa 5:18 ."}],"4":[{"catchword":"beste van hen is","tekst":"Dat is, dien men voor den minste in boosheid zou rekenen."},{"catchword":"doorn;","tekst":"Zie Eze 2:6 ."},{"catchword":"doornheg;","tekst":"Verg. Pro 15:19 ."},{"catchword":"dag uwer","tekst":"De bestemde tijd. Zie Joe 1:15 ."},{"catchword":"wachters,","tekst":"Dat is, profeten; versta, dien de profeten, u van God toegezonden, geprofeteerd hebben. Zie Eze 3:17 ."},{"catchword":"uw","tekst":"Of, uwer bezoeking; versta den dag uwer bezoeking."},{"catchword":"bezoeking,","tekst":"Dat is, straf. Zie Gen 21:1 ."},{"catchword":"is gekomen;","tekst":"Dat is, zal zekerlijk komen, het is ophanden, dat u God bezoeken zal."},{"catchword":"nu zal","tekst":"Dat is, al haast. Zie Hos 10:3 ."},{"catchword":"hunlieder","tekst":"Deze booswichten, die boven beschreven zijn."},{"catchword":"verwarring wezen","tekst":"Gelijk zij alle verwarring hebben ingevoerd en alle boosheid samengedraaid, alzo zullen zij nu in de uiterste verwarring en verbijstering wederingewikkeld worden, zulks dat zij van benauwdheid niet zullen weten wat te doen of te laten, waaruit of waarin, gelijk men zegt. Verg. 2Ch 36 ; Jer 39 ; Eze 4 , en Eze 24:3-6 , Eze 24:9-11 ."}],"5":[{"catchword":"Gelooft een vriend niet,","tekst":"Of, vertrouwt; geloof en trouw is weg, wil de profeet zeggen. Verg. Jer 9:4-5 . Sommigen nemen het als een heilzamen raad, dien den profeet den vromen geeft van hetgeen zij hadden te vermijden."},{"catchword":"voornaamsten vriend;","tekst":"Of, leidsman, voorganger, leraar, die met raad en daad voorgaat en bijstaat. Zie Psa 55:14 ; Pro 16:28 , en Pro 17:9 met de aantekening."},{"catchword":"bewaar de deuren uws monds","tekst":"Dat gij de geheimen van uw hart niet openbaart, om niet bedrogen en verraden te worden."},{"catchword":"haar,","tekst":"Dat is, uw vrouw; verg. Deu 13:6 , en zie de aantekening aldaar. Hebr. de liggende, of liggeres van uwen schoot."},{"catchword":"schoot","tekst":"Of, boezem."},{"catchword":"ligt","tekst":"Of, slaapt, ligt te slapen; gelijk nederliggen voor slapen genomen wordt, en wijders ook voor sterven, of ontslapen; zie Deu 31:16 ."}],"6":[{"catchword":"veracht den vader,","tekst":"Of, onteert, acht klein, of gering."},{"catchword":"mans vijanden","tekst":"Of, eens mensen. Deze plaats heeft de Heere Christus gebruikt, Mat 10:35-36 ; hoewel tot een ander einde."},{"catchword":"zijn huisgenoten","tekst":"Hber. mensen, of lieden van zijn huis; dat is, die van zijn eigen huisgezin zijn hem ontrouw, verraden hem."}],"7":[{"catchword":"Maar ik zal","tekst":"Of, daaRom."},{"catchword":"uitzien naar den HEERE,","tekst":"Of, wacht houden. Verg. Psa 5:4 met de aantekening. Dit spreekt de profeet in den naam der kerk, of de kerk zelve, zich oprichtende door geloof op Gods genade en belofte."},{"catchword":"wachten op de God mijns heils;","tekst":"Of, hopen."}],"8":[{"catchword":"mij,","tekst":"Omdat ik in kruis en lijden ben."},{"catchword":"vijandin","tekst":"Gij gemeente der goddelozen, mijne vervolgster. De kerk vergelijkt zichzelf bij ene vrouw, en alzo ook hare vijanden."},{"catchword":"gevallen ben,","tekst":"In kruis en tegenspoed. Zie Pro 24:16 ."},{"catchword":"zal ik weder opstaan;","tekst":"Of, sta ik, enz. Hebr. eigenlijk, ben ik weder opgestaan, dat is, zal ik zekerlijk weder opstaan, te weten, uit mijn kruis."},{"catchword":"duisternis","tekst":"Zie Gen 15:12 ."},{"catchword":"zal gezeten zijn,","tekst":"Of, zitte, is mij de HEERE een licht."},{"catchword":"licht zijn","tekst":"Zie Psa 27:1 ."}],"9":[{"catchword":"gramschap","tekst":"Dat is, plagen, kastijden, uit zijne gramschap voortkomende; verg. Eze 7:3 ."},{"catchword":"dragen,","tekst":"Met een boetvaardig en geduldig hart, gelijk het volgende uitwijst."},{"catchword":"twist twiste, en mijn recht uitvoere;","tekst":"Dat is, mijn rechtzaak, mijn proces, dat ik niet tegen God [voor wien ik mij schuldig ken] maar tegen mijne vijanden open heb staan. Zie Psa 35:1 ."},{"catchword":"brengen aan het licht;","tekst":"Of, hervoorbrengen, uitvoeren, uit de duisternis, gelijk in het voorgaande vers gezegd."},{"catchword":"mijn lust","tekst":"Dit is hier ingevoegd om den zin der Hebr. manier van spreken uit te drukken. Zie Psa 22:18 ; alzo in het volgende vers. Anders: ik zal zijne gerechtigheid aanzien."},{"catchword":"gerechtigheid","tekst":"Door welke Hij mij recht zal geven tegen mijne vijandin, mij verlossende en haar straffende; of aan zijn heil, dat Hij mij, naar zijne beloften, getrouwelijk zal bewijzen. Verg. Mic 6:5 met de aantekening."}],"10":[{"catchword":"mijn vijandin zal het zien,","tekst":"Anders: Gij [o Heere] zult mijne vijandin aanzien, [te weten, met een toornig aangezicht] en haar [met] schaamte bedekken."},{"catchword":"zien;","tekst":"Te weten, mijne begeerte, verwachting; of Gods rechtvaardige wraak. Zie Psa 54:9 met de aantekening."},{"catchword":"nu zal zij worden tot vertreding,","tekst":"Dat is, alhaast, het zal niet lang duren, gelijk in Mic 4:10 , en Mic 5:3 ."},{"catchword":"slijk der straten","tekst":"Dat is, tot de uiterste schande en versmaadheid gebracht worden. Zie Job 30:19 ; Isa 41:25 ; Psa 40:3 , met de aantekening; idem 2Sa 22:43 , en Psa 18:43 ."}],"11":[{"catchword":"uw","tekst":"Dit is een aanspraak tot de kerk van Christus."},{"catchword":"muren zal herbouwen,","tekst":"Versta heiningmuren. Van het Hebr. woord, zie Psa 62:4 . Dit is een Evangelische belofte van de herstelling en verzameling der kerk ten tijde van het Nieuwe Testament door den Messias. Verg. Amo 9:11 ; idem Mic 4:1-3 , en Mic 5:3-5 ."},{"catchword":"besluit verre heengaan","tekst":"Of, inzetting, ordinantie, te weten, Gods, van zijn eniggeboren Zoon, den Messias; dat is, het Evangelie zal wijd en verre uitgebreid worden. Verg. Psa 2:7 , met de aantekening, en Psa 110:2 ; Isa 2:3 , en Mic 4:1 , enz., en zie hier van de verklaring in vs.14, enz. Anders: de schatting, of het tribuut, of bevel [des vijands tirannie en overlast] zal verre [van u] weggedaan worden. Het Hebr. woord, dat hier en Psa 2:7 gebruikt wordt van het Evangelische genadebesluit van God, wordt Eze 20:25 , gebruikt van goddelijke besluiten, of gezette vonnissen zijner straffen en oordelen, zie aldaar."}],"12":[{"catchword":"het ook komen tot u toe,","tekst":"Te weten, het voorgemelde besluit. Of, men zal tot u komen, verstaande zulks van den toeloop der volken tot de kerk Gods. Verg. Isa 19:23-24 , enz. Anders: Hij [de] Messias zal tot u komen, enz."},{"catchword":"Assur af,","tekst":"Noordwaarts van Kanaän gelegen."},{"catchword":"vaste steden toe;","tekst":"Namelijk Egypte, gelegen in het zuiden, zijnde zeer vast door de natuurlijke gelegenheid van wateren en groten arbeid en kunst der mensen. Hebr. steden der vesting. Hebr. Mazor, dat enige gelijkheid heeft met Mizraïm, dat is Egypte. Verg. Isa 19:6 met de aantekening."},{"catchword":"vestingen","tekst":"Hebr. vesting, of vastigheid."},{"catchword":"rivier,","tekst":"Eufraat."},{"catchword":"zee tot zee,","tekst":"Hebr. [tot] zee van zee; dat is, van de ene zee tot de andere, van het ene gebergte tot het andere; van het noorden tot het zuiden, van het oosten tot het westen. Kanaän had gebergten in het noorden, oosten en zuiden, en de Dode zee was in het oosten, de Middellandse in het westen; door welke ligging en grenzen van Kanaän de uitbreiding van het Evangelie door de ganse wereld en de vereniging der Joden en heidenen in Christus wordt afgebeeld."}],"13":[{"catchword":"Maar dit land zal worden tot een verwoesting,","tekst":"Of, nadat, of als dit land zal geworden zijn, enz., of evenwel, nochtans zal dit land, versta Kanaän. Dit is eerst geschied ten tijde der Babylonische verwoesting, en naderhand bij de tijden van het Nieuwe Testament, en gaat voort nog vast ten huidigen dage. Verg. Dan 9:26-27 , enz."},{"catchword":"zijner inwoners halve,","tekst":"Of, met zijne inwoners."},{"catchword":"vrucht hunner handelingen","tekst":"Dat is, verdienste, loon. Zie Pro 1:31 ."}],"14":[{"catchword":"Gij dan,","tekst":"Hier spreekt de kerk [verheugd zijnde in den geest] den Messias, den oppersten Herder der kerk, Jezus Christus, aan alsof zij Hem zag staan weiden en zijn herdersambt verrichten; verg. Mic 5:3 ; dit dient tot verklaring en vervolg van vs.11,12."},{"catchword":"volk","tekst":"Dat is, kerk, verstrooid op aarde en gehaat van de kinderen dezer wereld."},{"catchword":"staf,","tekst":"Dat is, Woord en Geest. Verg. Psa 23:4 ."},{"catchword":"kudde","tekst":"De schaapskudde, waarbij de gelovigen hier en elders dikwijls worden vergeleken."},{"catchword":"erfenis,","tekst":"Zie Deu 32:9 , met de aantekening."},{"catchword":"alleen woont,","tekst":"Als een afgezonderd volk Gods, niet vermengd met de wereld, ketterijen en secten, [waarom zij ook dikwijls vervolgd en in eenzaamheid verdreven wordt] levende nochtans in zekerheid en vertrouwen tegen alle vijanden en de poorten der hel, onder bescherming van haren Herder; zie Num 23:9 ; Deu 33:28 ; Joh 15:19 ; 1Pe 2:9 ; 1Jo 5:19 , en verg. de manier van spreken met Jer 49:31 ."},{"catchword":"vruchtbaar land;","tekst":"Hebr. Karmel. Zie Jer 2:7 , met de aantekening."},{"catchword":"Basan en Gilead,","tekst":"Overvloeiende van schone weiden. Zie Deu 32:14 ; Psa 22:13 ; Jer 50:19 , en van Gilead, Gen 31:21 ; Jer 22:6 , met de aantekening."}],"15":[{"catchword":"haar wonderen doen zien,","tekst":"Mijne kudde, dat is kerk, waarvan in het voorgaande vers. Dit is Jezus Christus' antwoord op de voorgaande aanspraak der kerk."},{"catchword":"gij uit Egypteland uittoogt","tekst":"O Israël."}],"16":[{"catchword":"heidenen zullen het zien,","tekst":"Of, natiën, [te weten, de vijanden der kerk] zullen de heerlijkheid van het koninkrijk van Christus, of van zijne kerk moeten aanschouwen. Sommigen verstaan dit van de uitverkorenen onder de heidenen, die met schaamte en bekentenis hunner zonden tot gemeenschap der kerk zullen aankomen, uit vergelijking met Hos 3:5 , en Hos 11:10-11 ; idem Isa 45:14 ."},{"catchword":"vanwege al hun macht;","tekst":"Omdat al hun woelen en woeden tegen Gods werk en kerk vergeefs is; of [gelijk sommigen] om de geestelijke macht, die God zijne kerk bij de predikatie van het Evangelie zal verlenen. Zie 2Co 10:4-6 , en verg. Mic 5:5 , Mic 5:8 , enz.; Psa 149:6-9 , met de aantekening."},{"catchword":"hand op den mond leggen;","tekst":"Niet kunnende of durvende tegenspreken. Zie Jdg 18:19 ; Job 21:5 ."},{"catchword":"doof worden","tekst":"Van hetgeen zij zullen moeten horen en niet kunnen verdragen; of [gelijk sommigen] de zaken, die zij zullen horen, zullen zo vreemd, wonderlijk en groot zijn, dat hun de oren van het horen, vermits verwondering [om zo te spreken] verdoven zullen."}],"17":[{"catchword":"stof lekken, als de slang;","tekst":"Tot een teken van de uiterste vrees en onderwerping, zijnde hun pracht en hoogmoed als ter aarde nedergeworpen, gelijk men in de Oosterse landen zich placht ter aarde neder te buigen, tot een teken van onderwerping en nederigheid. Zie Psa 72:9 , met de aantekening, en verg. Isa 49:23 , alwaar desgelijks gezegd wordt van de bekeerde heidenen."},{"catchword":"kruipende dieren der aarde,","tekst":"Of, slangen, wormen der aarde, enz. Zie Deu 32:24 met de aantekening."},{"catchword":"zich beroeren uit hun sloten;","tekst":"Dat is, met beroerte, al vrezende, bevende en kruipende uit hunne sloten, of vaste, besloten plaatsen voortkomende [verg. 2Sa 22:46 ; Psa 18:46 , met de aantekening] gelijk slangen, of andere kruipende dieren, uit hare holen voortkruipen."},{"catchword":"met vervaardheid komen tot den HEERE, onzen God,","tekst":"Hebr. zij zullen vervaard zijn, of vrezen tot den Heere, enz. gelijk Hos 3:5 ; zie aldaar, en verg. Hos 11:10-11 . Anders: zij zullen vrezen, of vervaard zijn voor den Heere, enz."},{"catchword":"U vrezen","tekst":"Versta, [veranderende den persoon, gelijk elders] God zelf, den Messias, dien den profeet met opheffing des harten en verwondering aanspreekt, gelijk in het volgende; of de kerk, met de heerlijkheid en macht van haar Hoofd begenadigd zijnde; verg. Isa 19:16-18 , enz. met de aantekening."}],"18":[{"catchword":"vergeeft,","tekst":"Of, wegneemt; zie Psa 25:18 ."},{"catchword":"overblijfsel Zijner erfenis","tekst":"Dat is, zijne uitverkorenen, gelovigen, of kerk; zie vs.14."},{"catchword":"voorbijgaat?","tekst":"Dat is, overziet, niet toerekent, niet aanziet naar zijne gerechtigheid, of in toorn; verg. 2Sa 12:13 , met de aantekening."},{"catchword":"houdt Zijn toorn niet in eeuwigheid;","tekst":"Verg. Jer 3:5 , Jer 3:12 , en zie het tegendeel ten aanzien van Gods en zijns volks vijanden, Nah 1:2 ."},{"catchword":"want Hij heeft lust aan goedertierenheid","tekst":"Of, maar."}],"19":[{"catchword":"weder ontfermen;","tekst":"Hebr. Hij zal wederkeren, Hij zal zich onzer ontfermen; verg. Psa 71:20 , en Psa 85:7 met de aantekening, idem Num 11:4 ; Psa 45:5 ."},{"catchword":"dempen;","tekst":"Of, tenonderbrengen, onderwerpen, zodat zij niet kunnen opkomen of opstaan tegen ons in het gericht; en voorts door zijne Geest de heerschappij en tirannie der zonden [onder welke wij als dienstknechten en slaven verkocht waren] afschaffen, en ons heilig maken en vernieuwen, hier aanvankelijk, hierna volkomenlijk op welke laatste weldaad dit sommigen alleen duiden. Zie Isa 52:1 ; Rom 6:7 ."},{"catchword":"hun zonden","tekst":"Der uitverkorenen en gelovigen."},{"catchword":"diepten der zee werpen","tekst":"Een schone en zeer troostelijke gelijkenis, betekenende dat onze zonden van God niet aangezien, maar in eeuwige vergetenis gesteld, bedekt en als ongeacht en versmoord zullen zijn; verg. Psa 103:12 ; Isa 43:25 ; Jer 31:34 , Jer 31:37 , enz."}],"20":[{"catchword":"Jakob de trouw,","tekst":"Dat is, Jakobs en Abrahams nakomelingen; zie Rom 9:6-8 . Of, de trouw, of waarheid van Jakob, de goedertierenheid, of weldadigheid van Abraham, dat is, die Gij hun beloofd hebt. Verg. Jer 2:2 , en versta hierdoor den Messias, den Middelaar van het genadeverbond, en alles met Hem. Verg. Luk 1:68-73 ; Rom 8:32 ; een heerlijk besluit der profetie, vol van geloof en verwachting van den Messias."},{"catchword":"geven,","tekst":"Of, leveren; dat is, daarstellen, metterdaad bewijzen en volbrengen."},{"catchword":"oude dagen af gezworen hebt","tekst":"Hebr. van de dagen der oudheid; dat is, voor langen tijd."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Ay me! [this is the lamentation of the prophet, in the church her name, for the general corruption of the people] for I am, [or, that I am, &c] as when the sum or fruits are gathered in, as when the gleanings in the vintage are past: [Heb. As the in-gatherings of the summer fruits, or of the summer and as the in gleamings of the vintage. i.e it is with me as with the passenger, or way faring man, which after the fruit and vintage time, findes no where ought to refresh himself withal in his travel, which proves very irkfom to him; so implies the prophet, or the church, here doth it afflict and grieve exceedingly, that o ca s not, nor ashamed to speak of and utter forth, what mischief hurt and wrong he intends to others: or that whereby he doth bring his soul into utter destruction: or whatsoever he hath but a mind or desire, the same he dareth to prosese in words and act in deed, be it never so base or unjust. See Psa 27:12. and compare above chap.2.] and they twist it close together. [viz. their basenesse and villanies; even as divers small cords, or ropes, are with great force wound and twisted together to make great ones, as cables, or cart-ropes, so do they draw and twist all their practices close together, combining themselves and conspiring together, by mutual strength and support the better to compasee and accomplish their wicked plots and designes. Compare Eccl. 4.12. Psa 129:4. Isa. 5.18.]"}],"4":[{"catchword":null,"tekst":"The best of them [He among then, whom one might account the least guilt] is like a thorn, [see Ezek. 2.6] the most upright, is sharper then a hedge of thorns: [compare Prov. 15.19.] the day [i.e. appointed time. See Joel 1.15.] of watchmen, [i.e. prophets understand that day, which the prophets (sent to thee from God) have forefold thee. See Ezek. 3 on verse 17] thy visitation, [or, of thy visitation, understand, that day of thy visitation, i.e. punishment. See Gen. 21.1] is come; [i.e. shall surely come, the time is near hand, wherein God shall visit you] new [very soon, suddenly. See Hos. Chap. 10 on verse 3] shall their p[those foresaid wicked wretches their confusion be; [even as they brought in all manner of confusion and twisted all manner of wicked practices together, so shall they now themselves be enthralled and entangled with utter confusion and desolation, insomuch that for distress they shall not know which way to turn themselves, what to do or leave undone. Compare 2 chro. 26 Jer. Chap. 39. Ezek. Chap. 4.3, 4, 5, 6, 9, 10, 11.]"}],"5":[{"catchword":null,"tekst":"Do not believe (or trust) a friend; [all truth and faith is gone, doth the prophet /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
